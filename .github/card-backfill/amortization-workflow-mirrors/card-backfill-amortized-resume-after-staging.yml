name: card-backfill-amortized-resume-after-staging

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - 'data/review/card-backfill-staging/adjudications/**'
      - 'data/review/card-backfill-staging/events/**'
      - '.github/workflows/card-backfill-amortized-resume-after-staging.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: card-backfill-amortized-stage-resume-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resume:
    if: "${{ startsWith(github.event.head_commit.message, 'Card backfill: stage independently accepted packets') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Resume measured discovery only after retained decisions were reduced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run card-backfill-amortized-wave.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f cohort_limit=40 \
            -f wave_batches=4 \
            -f workers_per_batch=4 \
            -f model=openai/gpt-4.1-mini
          echo 'PASS — retained-artifact staging re-armed amortized discovery'
