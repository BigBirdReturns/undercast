name: card-backfill-runtime
description: Reuse the hosted runner image when possible and install deterministic image tools only when absent.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/card-backfill-bin"
        if command -v magick >/dev/null 2>&1; then
          echo 'PASS — ImageMagick 7 already present; apt work avoided'
          exit 0
        fi
        if ! command -v identify >/dev/null 2>&1 || ! command -v convert >/dev/null 2>&1 || ! command -v montage >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y imagemagick
          echo 'INSTALLED — ImageMagick was absent from the runner image'
        else
          echo 'PASS — ImageMagick 6 already present; apt work avoided'
        fi
        cat > "$RUNNER_TEMP/card-backfill-bin/magick" <<'SH'
        #!/bin/sh
        command="$1"
        case "$command" in
          identify|montage)
            shift
            exec "$command" "$@"
            ;;
          *)
            exec convert "$@"
            ;;
        esac
        SH
        chmod +x "$RUNNER_TEMP/card-backfill-bin/magick"
        echo "$RUNNER_TEMP/card-backfill-bin" >> "$GITHUB_PATH"
