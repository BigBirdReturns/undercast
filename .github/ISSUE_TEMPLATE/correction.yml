name: Report a correction
description: Report one exact record or evidence problem without posting private personal information.
title: "[Correction] "
labels:
  - correction
body:
  - type: markdown
    attributes:
      value: |
        Use this form for one bounded archive correction. Do not include private correspondence, accommodation history, government identifiers, home addresses, unpublished contact details, or other sensitive personal information. Link public evidence or describe where a reviewer can verify it.
  - type: input
    id: record_id
    attributes:
      label: Record ID or public route
      description: Use the exact UC identifier or public record URL.
      placeholder: UC-001 or records/UC-001/
    validations:
      required: true
  - type: dropdown
    id: correction_type
    attributes:
      label: Correction type
      options:
        - Performer or role identity
        - Production or date
        - Character still
        - Performer portrait
        - Maker credit
        - Source or provenance
        - Accessibility or presentation
        - Other bounded record fact
    validations:
      required: true
  - type: textarea
    id: current_problem
    attributes:
      label: What is currently wrong or unclear?
      description: Quote or describe the exact field, image, or claim.
    validations:
      required: true
  - type: textarea
    id: proposed_correction
    attributes:
      label: Proposed correction
      description: State the smallest correction supported by the evidence.
    validations:
      required: true
  - type: textarea
    id: public_evidence
    attributes:
      label: Public evidence
      description: Provide public URLs, citations, revision identifiers, or reproducible comparison details. Search ordering and repetition are not independent authority.
      placeholder: One source per line, with the exact fact each source supports.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and authority
      options:
        - label: I have not included private personal data or confidential correspondence.
          required: true
        - label: I understand that submission creates a review request, not an automatic canonical change.
          required: true
        - label: I understand that the archive will preserve the accepted, rejected, or insufficient-evidence disposition.
          required: true
