name: star-trek-risik-stage-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-risik-stage-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-risik-stage-recovery-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  EXPECTED_TREE: 6d32c386636296e76bcab61baa387cb629967ac3
  EXPECTED_MESSAGE: "Star Trek: publish Morgo cycle"
  LIVE_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  LIVE_TREE: 6d32c386636296e76bcab61baa387cb629967ac3

  CLAIM_BRANCH: agent/star-trek-risik-claim-result-v2
  CLAIM_COMMIT: eff3da84c7718d0894afda1fbc4e790bc88265da
  CLAIM_TREE: 289b2393496d1146e69e0219784564623b844863
  CLAIM_RECEIPT_SHA: c83b365b93019b0fe0dfd579cabec2cbd7c8dd4b679fcce547a6e59b5980089d

  SOURCE_REVIEW_BRANCH: agent/star-trek-risik-source-review-result-v2
  SOURCE_REVIEW_COMMIT: c4841daaed48105eaa7eec4b39443ac1f49d930b
  SOURCE_REVIEW_TREE: 814c734bf02378e2481e2d600f566342c3f997c8
  SOURCE_REVIEW_SHA: 9205d21aa691550f1da1ae3b6351e4869e574ee14b446d1026d3ca7153300ee6
  SOURCE_REVIEW_PATH: transport/star-trek-risik-source-review-v2/source-review.json

  RECONCILIATION_BRANCH: agent/star-trek-risik-media-reconciliation-result-v1
  RECONCILIATION_COMMIT: 934d15d6ebf3f0b42b05ed94bc8efe9f256fa2df
  RECONCILIATION_TREE: af0db02e139886ba235ba5c61e912b99384ee031
  RECONCILIATION_SHA: 4817c8158c87ca9a8ed95ea9ca93a5020249719e10159066b47d44ce1ad83355
  RECONCILIATION_PATH: transport/star-trek-risik-media-reconciliation-v1/media-reconciliation.json

  MEDIA_BRANCH: agent/star-trek-risik-media-result-v1
  MEDIA_COMMIT: 86b6fcd580f9439b97f96a20bcace2bfcbcc102d
  MEDIA_TREE: 933fee84fa5b034f3d753d6a225f6196398fe69f
  MEDIA_RECEIPT_SHA: 9ccbd09cd8d94751071d65cc327dd04babce8db05f59fc8e47db1832e2547b7c
  MEDIA_RECEIPT_PATH: transport/star-trek-risik-media-v1/media-receipt.json
  MEDIA_STILL_PATH: transport/star-trek-risik-media-v1/risik-still.webp
  MEDIA_PORTRAIT_PATH: transport/star-trek-risik-media-v1/fred-tatasciore-portrait.jpg

  MEDIA_REVIEW_BRANCH: agent/star-trek-risik-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 1361fe7b0250f59a88255c8f4649bed389c05890
  MEDIA_REVIEW_TREE: 076ec25f5ee0b2be7eafc6ae15efd13925fc3194
  MEDIA_REVIEW_SHA: 3fe266654351e5df2cabcbce6045ab3fc13e575b2ce049c245e5aee500d87598
  MEDIA_REVIEW_PATH: transport/star-trek-risik-media-review-v1/media-review.json

  TASK_ID: ap_096624f177ae0c9f2e91836c
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Risik
  EXPECTED_FINGERPRINT: 6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6
  EXPECTED_LEASE: lease_5d07d02fd67ea40a4950b1dd
  WALL_ID: UC-1399
  EXPECTED_STILL_SHA: 3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9
  EXPECTED_PORTRAIT_SHA: e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42
  STILL_ITEM_ID: ma_4c177d5d20dfebfb937e6de7
  PORTRAIT_ITEM_ID: ma_de751c877d2d3f6945d4e140
  AUDIT_STILL_ITEM_ID: ma_c33a2bc57b2edeb77c2170e9
  AUDIT_PORTRAIT_ITEM_ID: ma_1c7457e3778e5c94ece5dabd

  CANDIDATE_BRANCH: agent/star-trek-risik-candidate-v1
  RESULT_BRANCH: agent/star-trek-risik-stage-result-v2

  RUNTIME_ARCHIVE_SHA: c6a41963f8efc533a06e10ba68d6ab25ff37e3a507589e386532a3440662cb8e
  RUNTIME_ROOT: /tmp/star-trek-risik-stage-runtime-v1
  LIFECYCLE: /tmp/star-trek-risik-stage-runtime-v1/candidate-lifecycle.py
  CENSUS_HELPER: /tmp/star-trek-risik-stage-runtime-v1/census-refresh.sh
  STEP_ROOT: /tmp/star-trek-risik-stage-runtime-v1/steps
  BATCH: /tmp/star-trek-risik-stage-v1-batch.json
  OUT: /tmp/star-trek-risik-stage-v1/output
  SOURCE_REVIEW_ROOT: /tmp/star-trek-risik-stage-v1/source-review
  RECONCILIATION_ROOT: /tmp/star-trek-risik-stage-v1/reconciliation
  MEDIA_ROOT: /tmp/star-trek-risik-stage-v1/media
  MEDIA_REVIEW_ROOT: /tmp/star-trek-risik-stage-v1/media-review

jobs:
  stage:
    name: stage-reviewed-risik-candidate-v2
    if: ${{ github.event.head_commit.message == 'Stage reviewed Star Trek Risik candidate v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and externalize the sealed Risik stage runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum -c .github/recovery/star-trek-risik-stage-recovery-v1/sealed-manifest.sha256
          rm -rf "$RUNTIME_ROOT" /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          mkdir -p "$RUNTIME_ROOT"
          cat .github/recovery/star-trek-risik-stage-recovery-v1/runtime.tar.gz.b64.* | base64 -d > /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          test "$(sha256sum /tmp/star-trek-risik-stage-runtime-v1.tar.gz | awk '{print $1}')" = "$RUNTIME_ARCHIVE_SHA"
          tar -xzf /tmp/star-trek-risik-stage-runtime-v1.tar.gz -C "$RUNTIME_ROOT"
          (
            cd "$RUNTIME_ROOT"
            sha256sum -c manifest.sha256
          )
          chmod +x "$LIFECYCLE" "$CENSUS_HELPER" "$STEP_ROOT"/*.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["LIFECYCLE"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          bash -n "$CENSUS_HELPER"
          for path in "$STEP_ROOT"/*.sh; do bash -n "$path"; done

      - name: Verify immutable inputs and reconstruct the exact Risik lease packet
        shell: bash
        run: bash "$STEP_ROOT/01.sh"

      - name: Submit and grow the bounded Risik draft
        shell: bash
        run: bash "$STEP_ROOT/02.sh"

      - name: Rebind reviewed votes to canonical media-audit identities
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          def canonical(side: str) -> str:
              body = f"star-trek|{os.environ['WALL_ID']}|{side}"
              return "ma_" + hashlib.sha256(body.encode()).hexdigest()[:24]

          expected = {
              os.environ["STILL_ITEM_ID"]: os.environ["AUDIT_STILL_ITEM_ID"],
              os.environ["PORTRAIT_ITEM_ID"]: os.environ["AUDIT_PORTRAIT_ITEM_ID"],
          }
          if os.environ["AUDIT_STILL_ITEM_ID"] != canonical("still"):
              raise SystemExit("canonical Risik still media-audit identity drifted")
          if os.environ["AUDIT_PORTRAIT_ITEM_ID"] != canonical("portrait"):
              raise SystemExit("canonical Risik portrait media-audit identity drifted")

          path = Path(os.environ["OUT"]) / "media-audit-resolution.json"
          document = json.loads(path.read_text(encoding="utf-8"))
          counts = {key: 0 for key in expected}
          for vote in document.get("votes", []):
              item_id = vote.get("item_id")
              if item_id in expected:
                  vote["item_id"] = expected[item_id]
                  counts[item_id] += 1
          if counts != {
              os.environ["STILL_ITEM_ID"]: 2,
              os.environ["PORTRAIT_ITEM_ID"]: 2,
          }:
              raise SystemExit(f"Risik media-audit vote cardinality drifted: {counts}")
          path.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          receipt = {
              "version": 1,
              "transaction": "STAR-TREK-RISIK-MEDIA-AUDIT-IDENTITY-REBIND-V1",
              "wall_id": os.environ["WALL_ID"],
              "review_identity": {
                  "still": os.environ["STILL_ITEM_ID"],
                  "portrait": os.environ["PORTRAIT_ITEM_ID"],
              },
              "canonical_audit_identity": {
                  "still": os.environ["AUDIT_STILL_ITEM_ID"],
                  "portrait": os.environ["AUDIT_PORTRAIT_ITEM_ID"],
              },
              "votes_rebound": 4,
              "asset_hashes_changed": False,
              "claim_values_changed": False,
              "review_custody_changed": False,
          }
          (Path(os.environ["OUT"]) / "media-audit-identity-rebind.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Resolve reviewed media and complete the Risik task
        shell: bash
        run: bash "$STEP_ROOT/03.sh"

      - name: Hydrate immutable fixture Git custody
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          for commit in \
            39a58f2c5538da1adb7657623ee300dbca54a82d \
            efdce8dec82fb803fd165d7af0c1a6c77e3eecb8 \
            84688c5308db55aae6a97a753d593aa15fe91d37
          do
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$commit"
            fi
            git cat-file -e "${commit}^{commit}"
          done
          git rev-parse --is-shallow-repository | grep -Fx false

      - name: Rebuild deterministic projections and write the candidate receipt
        shell: bash
        run: bash "$STEP_ROOT/04.sh"

      - name: Publish the one-parent Risik candidate
        shell: bash
        run: bash "$STEP_ROOT/05.sh"

      - name: Upload Risik stage evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-stage-v2-${{ github.run_id }}
          path: /tmp/star-trek-risik-stage-v1/output/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish immutable Risik stage locator
        if: ${{ success() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/candidate-commit.json" > "$OUT/candidate.tmp"
          mv "$OUT/candidate.tmp" "$OUT/candidate-commit.json"

          jq -n \
            --arg branch "$CANDIDATE_BRANCH" \
            --arg result "$RESULT_BRANCH" \
            --arg commit "$(jq -r .commit "$OUT/candidate-commit.json")" \
            --arg tree "$(jq -r .tree "$OUT/candidate-commit.json")" \
            --arg parent "$CLAIM_COMMIT" \
            --arg receipt "$(jq -r .receipt_sha256 "$OUT/candidate-commit.json")" \
            --arg reconciliation "$RECONCILIATION_SHA" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            '{
              version:2,
              transaction:"STAR-TREK-RISIK-STAGE-RESULT-V2",
              status:"candidate-published-pending-independent-product-review",
              candidate_branch:$branch,
              result_branch:$result,
              commit:$commit,
              tree:$tree,
              parent:$parent,
              receipt_sha256:$receipt,
              media_reconciliation_sha256:$reconciliation,
              artifact:{id:$artifact_id,digest:$artifact_digest},
              canonical_mutation:false,
              independent_product_review_pending:true,
              waterline_cycle_recorded:false,
              additional_lease_issued:false
            }' > "$OUT/stage-result.json"

          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git config user.name undercast-risik-stage-v2
          git config user.email undercast-risik-stage-v2@users.noreply.github.com
          git checkout --orphan risik-stage-result-v2
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-risik-stage-v2
          cp -a "$OUT"/. transport/star-trek-risik-stage-v2/
          git add transport/star-trek-risik-stage-v2
          git commit -m "Record Star Trek Risik stage result v2"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
