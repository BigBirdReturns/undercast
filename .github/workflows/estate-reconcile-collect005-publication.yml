name: estate-reconcile-collect005-publication

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-reconcile-collect005-publication.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-reconcile-collect005-publication
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ADOPTION_HEAD: 98c07069d9f0885099d3ddc301042734720eb2a9
  ADOPTION_TREE: 3cdab560350d2e9a0bc30f615928b7b5d460a404
  GATED_TREE: 82aac2fbaa2ee7ffe15b80a55b31c91ade5823b7
  ADOPTION_RUN: '30703102437'
  RECEIPT: data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION.json
  PUBLICATION: data/review/estate-debt/COLLECT-005-PUBLICATION.json
  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json

jobs:
  reconcile:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head publication custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$ADOPTION_HEAD" HEAD
          test "$(git rev-parse "${ADOPTION_HEAD}^{tree}")" = "$ADOPTION_TREE"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Reconcile exact adoption commit into durable custody
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const bytes = (value) => Buffer.from(`${JSON.stringify(value, null, 2)}\n`, 'utf8');
          const gitBlob = (buffer) => crypto.createHash('sha1').update(Buffer.from(`blob ${buffer.length}\0`, 'utf8')).update(buffer).digest('hex');
          const receiptBytes = fs.readFileSync(process.env.RECEIPT);
          const receipt = JSON.parse(receiptBytes.toString('utf8'));
          const ledger = read(process.env.LEDGER);

          if (receipt.transaction !== 'COLLECT-005' || receipt.batch !== 3 || receipt.status !== 'paid') throw new Error('COLLECT-005 receipt identity drifted');
          if (String(receipt.authorization?.workflow_run) !== process.env.ADOPTION_RUN) throw new Error('COLLECT-005 workflow run drifted');
          if (receipt.authorization?.gated_tree !== process.env.GATED_TREE) throw new Error('COLLECT-005 gated tree drifted');
          if (ledger.cumulative?.canonical_adoptions !== 12 || ledger.cumulative?.remaining_for_canonical_review !== 43) throw new Error('COLLECT-005 cumulative state drifted');
          const batch = (ledger.batches || []).find((row) => row.transaction === 'COLLECT-005' && row.batch === 3);
          if (!batch || batch.status !== 'paid' || batch.receipt !== process.env.RECEIPT) throw new Error('COLLECT-005 ledger batch is missing');
          if (batch.published_head !== null && batch.published_head !== process.env.ADOPTION_HEAD) throw new Error('COLLECT-005 published head conflicts with adoption commit');

          const receiptBlob = gitBlob(receiptBytes);
          batch.receipt_git_blob = receiptBlob;
          batch.published_head = process.env.ADOPTION_HEAD;
          ledger.recorded_at = new Date().toISOString();

          const publication = {
            version: 1,
            transaction: 'COLLECT-005',
            batch: 3,
            operation: 'canonical-adoption-publication-reconciliation',
            status: 'published',
            recorded_at: ledger.recorded_at,
            authorization: {
              reconciliation_parent: process.env.AUTHORIZED_HEAD,
              exact_head_publication_lease_required: true
            },
            adoption: {
              published_head: process.env.ADOPTION_HEAD,
              published_tree: process.env.ADOPTION_TREE,
              gated_candidate_tree: process.env.GATED_TREE,
              workflow_run: Number(process.env.ADOPTION_RUN),
              receipt_path: process.env.RECEIPT,
              receipt_git_blob: receiptBlob
            },
            cumulative: {
              canonical_adoptions: 12,
              remaining_for_canonical_review: 43,
              visitor_visible_media_improvements: 12
            },
            boundary: {
              canonical_mutation: false,
              packet_evidence_rewritten: false,
              adoption_receipt_rewritten: false,
              only_publication_custody_reconciled: true
            }
          };
          fs.writeFileSync(process.env.LEDGER, bytes(ledger));
          fs.writeFileSync(process.env.PUBLICATION, bytes(publication));
          NODE
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Stage exact final metadata tree and retire one-shot authority
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-reconcile-collect005-publication.yml
          git add -- "$LEDGER" "$PUBLICATION"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' \
            '.github/workflows/estate-reconcile-collect005-publication.yml' \
            "$LEDGER" \
            "$PUBLICATION" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-005-publication-reconciliation.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-005-publication-reconciliation.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Commit and publish exact reconciled custody under lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate custody: reconcile COLLECT-005 published head' \
            -m "adoption_head=${ADOPTION_HEAD}" \
            -m "adoption_tree=${ADOPTION_TREE}" \
            -m "gated_tree=${GATED_TREE}" \
            -m "adoption_run=${ADOPTION_RUN}" \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "reconciliation_run=${GITHUB_RUN_ID}" \
            -m "gated_reconciliation_tree=$(cat /tmp/COLLECT-005-publication-reconciliation.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report reconciled custody
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 publication custody reconciled and complete on workflow run $GITHUB_RUN_ID.

          Adoption head: $ADOPTION_HEAD.
          Published tree: $ADOPTION_TREE.
          Gated candidate tree: $GATED_TREE.
          Reconciled ledger state: 12 canonical adoptions and 43 packets remaining for terminal ruling.

          The complete repository gate and rendered-browser checks passed on the final metadata tree. No canonical media, packet evidence, or adoption receipt was rewritten. The one-shot reconciliation workflow deleted itself.
          EOF_COMMENT

      - name: Report failed reconciliation
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 publication reconciliation failed closed on workflow run $GITHUB_RUN_ID. The canonical adoption remains published at $ADOPTION_HEAD, but no new custody-completion claim is authorized until the exact failed ledger, gate, or lease condition is repaired.
          EOF_COMMENT
