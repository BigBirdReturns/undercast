name: card-backfill-uc-111-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-111-RENDER.json"
      - "scripts/card-backfill-uc-111-render.mjs"
      - ".github/workflows/card-backfill-uc-111-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-111-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-024'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-024
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-111 collective render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-111-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-111');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-111');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_42a10c0cb46ab2d8dbdc0bff');
          if(row.version!==1||row.record_id!=='UC-111'||row.actor!=='Deep Roy'||row.character!=='The Oompa Loompas'||row.production!=='Charlie and the Chocolate Factory'||row.year!==2005||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-111 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8676143515||row.discovery_artifact?.head_sha!=='977425e638c6367d4fc304e0775e4183f20a3d86'||row.discovery_artifact?.zip_sha256!=='c3369560b23eee9f526d7ccc9dd50ebdaecce261d894c56da419f5bdced4d048'||row.discovery_artifact?.candidate_count!==2||row.discovery_artifact?.represented_asset_count!==1)throw new Error('UC-111 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==4||row.failed_discovery_checkpoints[0]?.artifact_id!==8675792608||row.failed_discovery_checkpoints[1]?.artifact_id!==8675871962||row.failed_discovery_checkpoints[2]?.artifact_id!==8675944046||row.failed_discovery_checkpoints[3]?.artifact_id!==8676011700)throw new Error('UC-111 failed discovery custody drift');
          if(row.selected_source?.sha256!=='6e2a8ec0f5edd7c3c28d495ab928ae2055bc97667dfff8b209eed48e7d5cef6d'||row.selected_source?.width!==400||row.selected_source?.height!==313||row.selected_source?.artifact_path!=='candidates/004-chocolate-river-collective-frame-legacy-probe-page-delivery.jpg')throw new Error('UC-111 selected source drift');
          if(row.multiplicity_boundary?.collective_display_required!==true||row.multiplicity_boundary?.visible_repeated_bodies_required!==true||row.multiplicity_boundary?.single_isolated_body_insufficient!==true)throw new Error('UC-111 multiplicity boundary drift');
          if(row.render?.pre_resize_width!==1534||row.render?.pre_resize_height!==1200||row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.candidate_gravity!=='east'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-111 render geometry drift');
          if(!specimen||specimen.actor!=='Deep Roy'||specimen.character!=='The Oompa Loompas'||specimen.production!=='Charlie and the Chocolate Factory'||specimen.years!=='2005'||specimen.still)throw new Error('UC-111 specimen boundary drift');
          if(source?.still)throw new Error('UC-111 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-111'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-111 audit boundary drift');
          console.log(`PASS — UC-111 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-render"
          mkdir -p "$root/source" "$root/output"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8676143515/zip" > "$root/discovery.zip"
          echo "c3369560b23eee9f526d7ccc9dd50ebdaecce261d894c56da419f5bdced4d048  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-111-discover"
          test -f "$base/manifest.json"
          echo "402812d16ca037207c0ce0eb071324b9ba33bcdde55aee27d13bfde967175256  $base/manifest.json" | sha256sum -c -
          echo "6eacf715dbda4eeba26ae8e9732e4153fe7d01c03b02755678f63fbfaee008a1  $base/summary.json" | sha256sum -c -
          echo "5c4e63c6868274d75b1b1fbc3ddbbff81c782ad8b07479e1be80706cb0b78269  $base/contact-sheet-collective.jpg" | sha256sum -c -
          echo "6e2a8ec0f5edd7c3c28d495ab928ae2055bc97667dfff8b209eed48e7d5cef6d  $base/candidates/004-chocolate-river-collective-frame-legacy-probe-page-delivery.jpg" | sha256sum -c -
          echo "fe2237b48d3f5b8300d2600468be438d9f89392a342a02cf315474b3d2bcd488  $base/pages/chocolate-river-collective-frame.png" | sha256sum -c -
          echo "a5a5617cee8a072c71d4d1be5f1326c855c68c2ac6db550e8e7ee369d7cacb4d  $base/pages/warner-production-notes.png" | sha256sum -c -
          echo "6308b14b17000776e6130e0280dba0cfa0ff061a690437291a7a6aedc6c5f468  $base/pages/afi-production-record.png" | sha256sum -c -
          cat > "$root/discovery-artifact-receipt.txt" <<'EOF'
          run_id=30327316009
          artifact_id=8676143515
          artifact_name=card-backfill-uc-111-discover-30327316009
          artifact_zip_sha256=c3369560b23eee9f526d7ccc9dd50ebdaecce261d894c56da419f5bdced4d048
          artifact_head_sha=977425e638c6367d4fc304e0775e4183f20a3d86
          manifest_sha256=402812d16ca037207c0ce0eb071324b9ba33bcdde55aee27d13bfde967175256
          summary_sha256=6eacf715dbda4eeba26ae8e9732e4153fe7d01c03b02755678f63fbfaee008a1
          contact_sheet_sha256=5c4e63c6868274d75b1b1fbc3ddbbff81c782ad8b07479e1be80706cb0b78269
          selected_source_sha256=6e2a8ec0f5edd7c3c28d495ab928ae2055bc97667dfff8b209eed48e7d5cef6d
          EOF
      - name: Render exact collective candidate and evidence packet
        env:
          CONTROL: .github/CARD-BACKFILL-UC-111-RENDER.json
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-111-render/source/card-backfill-uc-111-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-111-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-render"
          node --check scripts/card-backfill-uc-111-render.mjs
          node scripts/card-backfill-uc-111-render.mjs 2>&1 | tee "$root/render.log"
          (cd "$root/output/UC-111" && sha256sum -c SHA256SUMS)
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-111-render"
          if [ -d "$root" ]; then
            rm -rf "$root/source" "$root/discovery.zip"
          fi
      - name: Upload exact source, custody, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-111-render-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-uc-111-render
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
