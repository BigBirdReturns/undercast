name: card-backfill-facet-completion-inventory

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-local-desk-recovery-v5.yml'

permissions:
  contents: read
  statuses: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Enumerate every completed-packet key dependency and candidate fixture seam
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo '=== readCompletedPackets consumers ==='
          grep -R -n --exclude-dir=node_modules --exclude='card-backfill-local-desk-recovery-v5.yml' \
            -E 'readCompletedPackets|completedPackets\.has|completedPackets\.get|completedPackets\.size' scripts .github || true
          echo '=== cohort fixture candidates ==='
          find scripts -maxdepth 1 -type f -name '*card-backfill*fixture*.mjs' -print | sort
          echo '=== audit multiplicity for the two newly permanent records ==='
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items||[];
          for(const id of ['UC-625','UC-1004']){
            const rows=audit.filter((row)=>row.wall_id===id);
            console.log(id, JSON.stringify(rows.map((row)=>({side:row.side,status:row.status,risk_codes:row.risk_codes}))));
          }
          NODE
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='card-backfill/facet-completion-inventory' \
            -f description='completed-packet dependencies enumerated; no source transport' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'PASS — inventory complete; canonical_mutation=false; source_transport_calls=0'
