name: card-backfill-facet-safe-local-desk-build

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-local-desk-recovery-v5.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: card-backfill-facet-safe-local-desk-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime

      - name: Build the facet-safe provider-independent migration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export MIGRATION_ROOT="$RUNNER_TEMP/card-backfill-facet-safe-local-desk"
          mkdir -p "$MIGRATION_ROOT"

          node --input-type=module - <<'NODE'
          import { mkdtemp, readFile, rm, writeFile } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';

          const sourcePath='scripts/card-backfill-install-local-desk.mjs';
          const source=await readFile(sourcePath,'utf8');
          const prior='pharmacolog|footballer|soccer|chemist|physician|politician|scientist|composer';
          const corrected='pharmacolog(?:ist|ists|y|ical)?|football(?:er|ers|match)?|soccer|chemist(?:ry)?|physician|politician|scientist|composer';
          if(source.split(prior).length-1!==1)throw new Error('local-desk namesake seam drift');
          const root=await mkdtemp(join(tmpdir(),'card-backfill-local-desk-migration-'));
          const path=join(root,'installer.mjs');
          try{
            await writeFile(path,source.replace(prior,corrected));
            await import(`${pathToFileURL(path).href}?facet-safe=1`);
          }finally{
            await rm(root,{recursive:true,force:true});
          }
          NODE

          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          async function replaceExact(path, prior, next, label){
            let value=await readFile(path,'utf8');
            const count=value.split(prior).length-1;
            if(count!==1)throw new Error(`${label}: expected one seam, found ${count}`);
            value=value.replace(prior,next);
            await writeFile(path,value);
          }

          await replaceExact(
            'scripts/lib/card-backfill-cohort.mjs',
            '    if (completedPackets.has(audit.wall_id)) continue;',
            '    if (completedPackets.has(facetKey(audit.wall_id, audit.side))) continue;',
            'facet-keyed estate exclusion',
          );
          await replaceExact(
            'scripts/lib/card-backfill-cohort.mjs',
            '    completed.set(recordId, { record_id: recordId, side, path: dir });',
            '    completed.set(facetKey(recordId, side), { obligation_id: facetKey(recordId, side), record_id: recordId, side, path: dir });',
            'facet-keyed completed packet index',
          );

          let fixture=await readFile('scripts/card-backfill-cohort-fixtures.mjs','utf8');
          const fixtureReplacements=[
            [
              'const completed = new Map([["UC-001", { record_id: "UC-001", side: "portrait" }]]);',
              'const completed = new Map([["UC-001/still", { obligation_id: "UC-001/still", record_id: "UC-001", side: "still" }]]);',
              'fixture completed key',
            ],
            [
              'assert(!estate.obligations.some((row) => row.wall_id === "UC-001"), "the frozen campaign must preserve the live selector\'s packet-per-record completion rule");',
              'assert(!estate.obligations.some((row) => row.obligation_id === "UC-001/still"), "only the exact completed facet may leave the open estate");',
              'fixture exact facet assertion',
            ],
            [
              '  assert(found.has("UC-900"));\n  assert(found.has("UC-901"));\n  assert.equal(found.get("UC-901").side, "portrait");',
              '  assert(found.has("UC-900/still"));\n  assert(found.has("UC-901/portrait"));\n  assert(!found.has("UC-900"));\n  assert.equal(found.get("UC-901/portrait").side, "portrait");',
              'fixture completed index assertions',
            ],
          ];
          for(const [prior,next,label] of fixtureReplacements){
            const count=fixture.split(prior).length-1;
            if(count!==1)throw new Error(`${label}: expected one seam, found ${count}`);
            fixture=fixture.replace(prior,next);
          }
          const insertion=`
const dualSpecimens = [{
  id: "UC-099", actor: "Actor 99", character: "Character 99", production: "Production 99", years: "2004",
  universe: "Fixture", kind: "physical", wiki: "fixture", link: "https://example.test/UC-099",
  references: [{ url: "https://evidence.test/UC-099" }], still: null, portrait: null,
}];
const dualSources = [{ id: "UC-099", still: null, portrait: null }];
const dualAuditItems = [
  { id: "ma-99-still", wall_id: "UC-099", side: "still", scope: "sitewide", status: "absent", expected_subject: "Character 99", risk_codes: ["source-declared-absent"] },
  { id: "ma-99-portrait", wall_id: "UC-099", side: "portrait", scope: "sitewide", status: "absent", expected_subject: "Actor 99", risk_codes: ["source-declared-absent"] },
];
const dualCompleted = new Map([["UC-099/portrait", { obligation_id: "UC-099/portrait", record_id: "UC-099", side: "portrait" }]]);
const dualEstate = buildEstate({ specimens: dualSpecimens, sources: dualSources, auditItems: dualAuditItems, completedPackets: dualCompleted, control });
assert.deepEqual(dualEstate.obligations.map((row) => row.obligation_id), ["UC-099/still"]);
assert.equal(dualEstate.denominator.completed_packet_count, 1);
assert.equal(dualEstate.denominator.open_obligation_count, 1);
assert.equal(dualEstate.denominator.selector_total, 2);
`;
          const anchor='\nconst shuffled = buildEstate(';
          if(fixture.split(anchor).length-1!==1)throw new Error('dual-side fixture insertion seam drift');
          fixture=fixture.replace(anchor,`${insertion}${anchor}`);
          await writeFile('scripts/card-backfill-cohort-fixtures.mjs',fixture);

          let amortization=await readFile('scripts/card-backfill-amortization-fixtures.mjs','utf8');
          const tokenNeedle='  "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}",\n';
          if(amortization.includes(tokenNeedle))amortization=amortization.replace(tokenNeedle,'  "card-backfill-local-adjudicate.mjs",\n');
          for(const line of [
            'assert(files.runtime.includes("packages+=(imagemagick)"));',
            'assert(files.runtime.includes("packages+=(python3-opencv)"));',
            'assert(files.runtime.includes("packages+=(tesseract-ocr)"));',
            'assert(files.runtime.includes(\'sudo apt-get install -y "${packages[@]}"\'));',
          ]) if(!amortization.includes(line))throw new Error(`current runtime assertion missing: ${line}`);
          const cloudGuards=[
            'assert(!files.workflow.includes("card-backfill-machine-adjudicate.mjs"));',
            'assert(!files.workflow.includes("models: read"));',
          ];
          const runtimeAnchor='assert(files.runtime.includes(\'sudo apt-get install -y "${packages[@]}"\'));';
          if(!amortization.includes(cloudGuards[0]))amortization=amortization.replace(runtimeAnchor,`${runtimeAnchor}\n${cloudGuards.join('\n')}`);
          await writeFile('scripts/card-backfill-amortization-fixtures.mjs',amortization);
          NODE

          node scripts/card-backfill-cohort-fixtures.mjs | tee "$MIGRATION_ROOT/cohort-fixtures.log"
          node scripts/card-backfill-local-adjudicate-fixtures.mjs | tee "$MIGRATION_ROOT/local-adjudicate-fixtures.log"
          node scripts/card-backfill-source-policy-v3-fixtures.mjs | tee "$MIGRATION_ROOT/source-policy-v3-fixtures.log"
          node scripts/card-backfill-amortization-fixtures.mjs | tee "$MIGRATION_ROOT/amortization-fixtures.log"
          node scripts/card-backfill-lessons-fixtures.mjs | tee "$MIGRATION_ROOT/lessons-fixtures.log"
          node scripts/card-backfill-lessons.mjs validate --out "$MIGRATION_ROOT/lessons-validation.json"

          rm -rf "$MIGRATION_ROOT/plan"
          node scripts/card-backfill-source-v3-wave-plan.mjs \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$MIGRATION_ROOT/plan" \
            --batch-limit 40 \
            --wave-batches 4 \
            --workers-per-batch 4 | tee "$MIGRATION_ROOT/plan.log"
          grep -q '^current_completed_evidence_packets=46$' "$MIGRATION_ROOT/plan/summary.txt"
          grep -q '^current_open_source_declared_absences=426$' "$MIGRATION_ROOT/plan/summary.txt"
          grep -q '^selector_defined_estate=472$' "$MIGRATION_ROOT/plan/summary.txt"
          grep -q '^selected_count=160$' "$MIGRATION_ROOT/plan/summary.txt"
          echo 'PASS — facet-safe planner proves 46+426=472 and selects 160 with source_transport_calls=0'

          node scripts/gate.mjs | tee "$MIGRATION_ROOT/full-gate.log"

          git diff --check
          git status --short > "$MIGRATION_ROOT/status.txt"
          git diff --name-status > "$MIGRATION_ROOT/name-status.txt"
          git diff --binary > "$MIGRATION_ROOT/migration.patch"
          git diff --name-only > "$MIGRATION_ROOT/changed-files.txt"
          test -s "$MIGRATION_ROOT/changed-files.txt"
          tar -cf "$MIGRATION_ROOT/changed-files.tar" -T "$MIGRATION_ROOT/changed-files.txt"
          sha256sum "$MIGRATION_ROOT/changed-files.tar" "$MIGRATION_ROOT/migration.patch" > "$MIGRATION_ROOT/checksums.sha256"
          cat "$MIGRATION_ROOT/name-status.txt"
          echo "changed_files=$(wc -l < "$MIGRATION_ROOT/changed-files.txt")"
          echo 'PASS — migration candidate built and fully gated; branch_mutation=false'

          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='card-backfill/facet-safe-local-desk-build' \
            -f description='46+426=472; local desk; full gate pass; source transport=0' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-facet-safe-local-desk-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
          if-no-files-found: error
          retention-days: 90
