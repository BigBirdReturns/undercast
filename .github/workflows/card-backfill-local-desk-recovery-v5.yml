name: card-backfill-local-desk-recovery-v5

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-local-desk-recovery-v5.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-local-desk-recovery-v5-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  recover-install-and-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Recover retained source artifacts and publish only evidence state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-install-local-desk-v2.mjs
          python3 - scripts/card-backfill-local-desk-recover.sh "$RUNNER_TEMP/card-backfill-local-desk-recover-v6.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          installer_old = "node scripts/card-backfill-install-local-desk.mjs"
          installer_new = "node scripts/card-backfill-install-local-desk-v2.mjs"
          if source.count(installer_old) != 1:
              raise SystemExit("recovery installer seam drift")
          source = source.replace(installer_old, installer_new, 1)

          stage_old = r'''git add -A -- \
            .github/actions/card-backfill-runtime/action.yml \
            .github/workflows/card-backfill-amortized-activation.yml \
            .github/workflows/card-backfill-amortized-wave.yml \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            .github/card-backfill/performance \
            data/review/card-backfill-staging \
            package.json \
            scripts/gate.mjs \
            scripts/card-backfill-local-adjudicate-fixtures.mjs \
            scripts/card-backfill-source-policy-v3-fixtures.mjs \
            scripts/lib/card-backfill-source-policy-v3.mjs'''
          stage_new = r'''git add -A -- \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            .github/card-backfill/performance \
            data/review/card-backfill-staging'''
          if source.count(stage_old) != 1:
              raise SystemExit("recovery evidence-only staging seam drift")
          source = source.replace(stage_old, stage_new, 1)

          commit_old = "git commit -m 'Card backfill: recover retained wave and install local second desk'"
          commit_new = "git commit -m 'Card backfill: recover retained wave (140 obligations, 2 accepted)'"
          if source.count(commit_old) != 1:
              raise SystemExit("recovery commit-message seam drift")
          source = source.replace(commit_old, commit_new, 1)
          source = source.replace(
              "retained 140 reduced; accepted=2; local desk installed; supervisor dispatched",
              "retained 140 reduced; accepted=2; supervisor dispatched",
          )
          Path(sys.argv[2]).write_text(source, encoding="utf-8")
          PY
          grep -q 'node scripts/card-backfill-install-local-desk-v2.mjs' "$RUNNER_TEMP/card-backfill-local-desk-recover-v6.sh"
          grep -q "git commit -m 'Card backfill: recover retained wave (140 obligations, 2 accepted)'" "$RUNNER_TEMP/card-backfill-local-desk-recover-v6.sh"
          ! grep -A12 '^git add -A --' "$RUNNER_TEMP/card-backfill-local-desk-recover-v6.sh" | grep -q '^  \.github/workflows/'
          bash "$RUNNER_TEMP/card-backfill-local-desk-recover-v6.sh"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-local-desk-recovery-v6-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-planning
            ${{ runner.temp }}/recovered-results
            ${{ runner.temp }}/lessons-local-desk-validation.json
            ${{ runner.temp }}/local-desk-recovery-reduce.log
          if-no-files-found: warn
          retention-days: 90

# Evidence-only recovery: workflow migrations remain a separate authorized transaction.
