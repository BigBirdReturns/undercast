name: card-backfill-publication-fixture-repair

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-local-desk-recovery-v5.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-publication-fixture-repair-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  repair-and-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Align the amortization fixture with the proven conditional runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          MUTATION_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path='scripts/card-backfill-amortization-fixtures.mjs';
          let value=await readFile(path,'utf8');
          const prior='assert(files.runtime.includes("if ! command -v identify") && files.runtime.includes("sudo apt-get install -y imagemagick"));';
          const next=[
            'assert(files.runtime.includes("packages+=(imagemagick)"));',
            'assert(files.runtime.includes("packages+=(python3-opencv)"));',
            'assert(files.runtime.includes("packages+=(tesseract-ocr)"));',
            'assert(files.runtime.includes(\'sudo apt-get install -y "${packages[@]}"\'));',
          ].join('\n');
          const count=value.split(prior).length-1;
          if(count!==1)throw new Error(`expected one stale runtime assertion, found ${count}`);
          value=value.replace(prior,next);
          await writeFile(path,value);
          NODE
          node scripts/card-backfill-amortization-fixtures.mjs
          git diff --check
          git add -- scripts/card-backfill-amortization-fixtures.mjs
          test "$(git diff --cached --name-only)" = 'scripts/card-backfill-amortization-fixtures.mjs'
          git config user.name 'undercast-card-backfill-publication-repair'
          git config user.email 'undercast-card-backfill-publication-repair@users.noreply.github.com'
          git commit -m 'Card backfill: align amortization fixture with local runtime'
          remote_head=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          [ "$remote_head" = "$MUTATION_HEAD" ]
          git push origin "HEAD:${HEAD_BRANCH}"
          final_head=$(git rev-parse HEAD)
          gh workflow run card-backfill-publication.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          for sha in "$MUTATION_HEAD" "$final_head"; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
              -f state=success \
              -f context='card-backfill/publication-fixture-repair' \
              -f description='runtime fixture aligned; publication re-dispatched' \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          done
          echo "PASS — pushed ${final_head}; publication re-dispatched; manual_continue_required=false"
