name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
  cancel-in-progress: true

jobs:
  derive:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      SOURCE_HEAD: 024b41d60bb5cc81af5d299342cff2ec88078ea5
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1.yml
      SOURCE_BLOB: d6bfba35e0aa1deadc419ece230fe64c12257bc7
      SOURCE_STEM: doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
      TARGET_STEM: doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
      BRANCH: agent/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
      PACKET: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-normalizer
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-worktree
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-bootstrap
      NORMALIZER_BRANCH: agent/doctor-who-cycle-011-rastel-review-normalization-v1
      NORMALIZER_WORKFLOW: doctor-who-cycle-011-rastel-review-normalization-v1
      NORMALIZER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-review-normalization-v1-
      FINALIZER_V4_BYTES: "35745"
      FINALIZER_V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      OLD_TASK: ap_cab2d7f95d930401627c1b30
      OLD_LEASE: lease_b8955992c5af735f9e40b242
      OLD_WALL: UC-1355
      OLD_REVIEWED_AT: 2026-08-09T04:30:00Z
      OLD_REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338
      OLD_CANDIDATE_IDENTITY: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      OLD_CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      OLD_CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      OLD_REVIEW_STATUS: cycle-010-merx-candidate-independently-approved-v1
      NEW_REVIEW_STATUS: cycle-011-rastel-candidate-independently-approved-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V1 closure transaction and repair list response
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,scripts}
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_HEAD" > "$BOOTSTRAP/api/source.json"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BOOTSTRAP'])
          payload=json.loads((root/'api/source.json').read_text())
          raw=base64.b64decode(payload['content'])
          assert payload['sha']==os.environ['SOURCE_BLOB']
          probe=root/'source-v1.yml'; probe.write_bytes(raw)
          assert subprocess.check_output(['git','hash-object',str(probe)],text=True).strip()==os.environ['SOURCE_BLOB']
          text=raw.decode('utf-8')
          assert text.startswith('name: '+os.environ['SOURCE_STEM']+'\n')
          old="rows=[row for row in rows if row['head']['ref']==os.environ['NORMALIZER_BRANCH'] and row['merged'] is False]"
          new="rows=[row for row in rows if row['head']['ref']==os.environ['NORMALIZER_BRANCH'] and row.get('merged_at') is None]"
          assert text.count(old)==1
          assert text.count("row['merged'] is False")==1
          text=text.replace(old,new)
          assert text.count("row['merged'] is False")==0
          assert text.count("own['merged'] is False")==1
          text=text.replace(os.environ['SOURCE_STEM'],os.environ['TARGET_STEM'])
          dollar='$'
          text=text.replace("head='"+dollar+"{{ github.event.pull_request.head.sha }}'",'head="$CURRENT_HEAD"')
          text=text.replace("pr='"+dollar+"{{ github.event.pull_request.number }}'",'pr="$CURRENT_PR"')
          text=text.replace("base='"+dollar+"{{ github.event.pull_request.base.sha }}'",'base="$CURRENT_BASE"')
          assert dollar+'{{ github.event.pull_request.' not in '\n'.join(
              line for line in text.splitlines()
              if not line.lstrip().startswith(('if:','ref:'))
          )
          lines=text.splitlines(keepends=True)
          start=next(i for i,line in enumerate(lines) if line=='  derive:\n')
          block=lines[start:]
          scripts=[]; i=0
          while i<len(block):
              if block[i]=='        run: |\n':
                  i+=1; body=[]
                  while i<len(block):
                      line=block[i]
                      if line.strip() and len(line)-len(line.lstrip(' '))<10: break
                      if line.startswith('          '): body.append(line[10:])
                      elif not line.strip(): body.append('\n')
                      else: break
                      i+=1
                  scripts.append(''.join(body)); continue
              i+=1
          assert len(scripts)==5,len(scripts)
          rows=[]
          for index,script in enumerate(scripts,1):
              path=root/'scripts'/f'{index:02d}.sh'; path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",script,re.S)
              for n,body in enumerate(blocks,1):
                  compile(body,f'<closure-v2-script-{index}-python-{n}>','exec')
              rows.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'embedded_python':len(blocks)})
          repaired=text.encode()
          receipt={
            'version':2,
            'status':'cycle-011-rastel-cycle-closure-preflight-v2-source-recovered',
            'source':{'head':os.environ['SOURCE_HEAD'],'path':os.environ['SOURCE_PATH'],'git_blob':os.environ['SOURCE_BLOB'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},
            'repair':{'old':"list item row['merged'] is False",'new':"row.get('merged_at') is None",'occurrences':1,'full_carrier_merged_predicates_retained':1},
            'target':{'bytes':len(repaired),'sha256':hashlib.sha256(repaired).hexdigest(),'scripts':rows},
            'boundary':{'disposable_simulation':True,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'source-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute repaired native closure transaction
        shell: bash
        run: |
          set -euo pipefail
          export CURRENT_HEAD='${{ github.event.pull_request.head.sha }}'
          export CURRENT_PR='${{ github.event.pull_request.number }}'
          export CURRENT_BASE='${{ github.event.pull_request.base.sha }}'
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in
                *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;;
                *=*) export "$row" ;;
              esac
            done < "$GITHUB_ENV"
          }
          for script in "$BOOTSTRAP"/scripts/0{1,2,3,4}.sh; do
            bash "$script"
            apply_github_env
          done
          cp "$BOOTSTRAP/source-recovery.json" "$OUT/receipt/closure-v2-source-recovery.json"
          bash "$BOOTSTRAP/scripts/05.sh"
          apply_github_env
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2
            /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-worktree
            /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v2-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
