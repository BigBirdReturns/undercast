name: doctor-who-cycle-006-writer-source-publication

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-006-writer-source-publication.yml"

permissions:
  contents: write

concurrency:
  group: doctor-who-cycle-006-writer-source-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-006-writer-source-publication.yml
  EXACT_MAIN: 7c881d39f50f87e0df88cffa10a490fa1182fd14
  TARGET_BRANCH: agent/doctor-who-cycle-006-writer-source-publication
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  SOURCE_COMMIT: 87894051e3c0c3b177579f5c59c5fa122e1c4d8a
  SOURCE_TRANSPORT_SHA256: b0d0ca739415ff4224f88b98422ed7891bca3e4c1b48f41cee77dcbd3ba240a1
  SOURCE_DIR: .ci/doctor-who-cycle-006/source

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-writer-source-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0
          filter: blob:none

      - name: Bind exact main and one-file carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test -z "$(git status --porcelain)"

      - name: Recover, verify, and publish exact source scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for path in \
            .ci/doctor-who-cycle-005/scripts.tgz.b64 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-002 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-003 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-004 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-005 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-006 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-007 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-008; do
            mkdir -p "$tmp/$(dirname "$path")"
            git show "$SOURCE_COMMIT:$path" > "$tmp/$path"
          done
          cat "$tmp/.ci/doctor-who-cycle-005/scripts.tgz.b64"* \
            | tr -d '\n\r\t ' | base64 --decode > "$tmp/source.tgz"
          test "$(sha256sum "$tmp/source.tgz" | awk '{print $1}')" = "$SOURCE_TRANSPORT_SHA256"
          tar -xzf "$tmp/source.tgz" -C "$SOURCE_DIR"
          node --check "$SOURCE_DIR/apply-doctor-who-cycle-005.mjs"
          node --check "$SOURCE_DIR/apply-doctor-who-cycle-finalize-005.mjs"
          for script in "$SOURCE_DIR"/*.sh; do bash -n "$script"; done
          find "$SOURCE_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$SOURCE_DIR/source-files.sha256"
          cat > "$SOURCE_DIR/SOURCE-RECEIPT.json" <<JSON
          {
            "version": 1,
            "exact_main": "$EXACT_MAIN",
            "source_commit": "$SOURCE_COMMIT",
            "source_transport_sha256": "$SOURCE_TRANSPORT_SHA256",
            "purpose": "never-merge cycle-006 writer derivation source",
            "corpus_authority": false,
            "lease_authority": false
          }
          JSON
          rm "$SELF"
          git add -A "$SELF" "$SOURCE_DIR"
          git diff --cached --name-only | sort > /tmp/actual.txt
          {
            printf '%s\n' "$SELF"
            find "$SOURCE_DIR" -type f | sort
          } | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Transport: expose immutable cycle 005 writer sources for cycle 006'
          test -z "$(git status --porcelain)"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
