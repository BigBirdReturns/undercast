name: doctor-who-cycle-011-rastel-publisher-v2-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-publisher-v2-observer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-publisher-v2-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-publisher-v2-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      SOURCE_RUN: "31350981825"
      SOURCE_HEAD: 8754c3fb878a95af71b5b1dd744d9e0b43fcee81
      WORKFLOW_FILE: doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      WORKFLOW_NAME: doctor-who-cycle-011-rastel-trusted-publisher-v2
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      SELF: .github/workflows/doctor-who-cycle-011-rastel-publisher-v2-observer-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-publisher-v2-observer-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind observer and retain exact V2 publisher executions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,jobs,artifacts,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_run&per_page=100" > "$OUT/api/publisher-runs.json"
          live_main="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          printf '%s\n' "$live_main" > "$OUT/api/live-main.txt"
          for path in "$V1_PATH" "$V2_PATH" scripts/doctor-who-cycle-011.mjs; do
            key="$(printf '%s' "$path" | tr '/.' '__')"
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=main" > "$OUT/api/$key.json" 2> "$OUT/api/$key.err"; then
              printf 'true\n' > "$OUT/api/$key.present"
            else
              printf 'false\n' > "$OUT/api/$key.present"
            fi
          done
          OBSERVER_HEAD="$head" OBSERVER_PR="$pr" OBSERVER_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          own=json.loads((root/'observer-pr.json').read_text())
          source=json.loads((root/'source-run.json').read_text())
          assert own['number']==int(os.environ['OBSERVER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['OBSERVER_BASE'] and own['head']['sha']==os.environ['OBSERVER_HEAD']
          assert source['id']==int(os.environ['SOURCE_RUN']) and source['head_sha']==os.environ['SOURCE_HEAD']
          assert source['name']=='doctor-who-cycle-011-rastel-final-review-v4-direct' and source['event']=='pull_request' and source['status']=='completed' and source['conclusion']=='success'
          rows=json.loads((root/'publisher-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row.get('name')==os.environ['WORKFLOW_NAME'] and row.get('event')=='workflow_run']
          rows.sort(key=lambda row:(row.get('created_at',''),row['id']),reverse=True)
          selected=rows[:20]
          (root/'selected-runs.json').write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          (root/'selected-run-ids.txt').write_text('\n'.join(str(row['id']) for row in selected)+'\n')
          PY
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/jobs/$run_id.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/artifacts/$run_id.json"
            jq -r '.jobs[] | [.id,.name,.status,.conclusion,.run_attempt] | @tsv' "$OUT/jobs/$run_id.json" > "$OUT/logs/$run_id-jobs.tsv"
          done < "$OUT/api/selected-run-ids.txt"
          printf 'OBSERVER_PR=%s\nOBSERVER_HEAD=%s\nOBSERVER_BASE=%s\nLIVE_MAIN=%s\n' "$pr" "$head" "$base" "$live_main" >> "$GITHUB_ENV"

      - name: Classify canonical publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); api=root/'api'
          runs=json.loads((api/'selected-runs.json').read_text())
          enriched=[]
          for run in runs:
              jobs=json.loads((root/'jobs'/f"{run['id']}.json").read_text()).get('jobs',[])
              artifacts=json.loads((root/'artifacts'/f"{run['id']}.json").read_text()).get('artifacts',[])
              enriched.append({'id':run['id'],'run_number':run.get('run_number'),'run_attempt':run.get('run_attempt'),'status':run.get('status'),'conclusion':run.get('conclusion'),'created_at':run.get('created_at'),'updated_at':run.get('updated_at'),'head_sha':run.get('head_sha'),'head_branch':run.get('head_branch'),'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'run_attempt':j.get('run_attempt')} for j in jobs],'artifacts':[{'id':a['id'],'name':a['name'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts]})
          def present(path):
              key=path.replace('/','__').replace('.','__')
              return (api/f'{key}.present').read_text().strip()=='true'
          live=(api/'live-main.txt').read_text().strip()
          v1=present(os.environ['V1_PATH']); v2=present(os.environ['V2_PATH']); cycle=present('scripts/doctor-who-cycle-011.mjs')
          state='no-v2-run-observed'
          if live!=os.environ['INSTALLED_MAIN'] and not v1 and not v2 and cycle:
              state='canonical-product-present'
          elif any(r['status']!='completed' for r in enriched):
              state='publisher-in-progress'
          elif any(any(j['name']=='write' and j['conclusion']=='success' for j in r['jobs']) for r in enriched):
              state='publisher-write-success-observed'
          elif enriched:
              state='publisher-terminal-without-write'
          receipt={'status':'cycle-011-rastel-trusted-publisher-v2-observed-v1','version':1,'state':state,'observer':{'pr':int(os.environ['OBSERVER_PR']),'head':os.environ['OBSERVER_HEAD'],'base':os.environ['OBSERVER_BASE']},'source':{'run':int(os.environ['SOURCE_RUN']),'head':os.environ['SOURCE_HEAD']},'canonical':{'original_main':os.environ['ORIGINAL_MAIN'],'installed_main':os.environ['INSTALLED_MAIN'],'live_main':live,'v1_present':v1,'v2_present':v2,'cycle_011_present':cycle},'runs':enriched,'boundary':{'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/observer.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-v2-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-v2-observer-v1
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
