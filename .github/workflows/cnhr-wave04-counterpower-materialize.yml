name: materialize-clifford-number-hr-counterpower-wave-04

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-disciplinary-ai-cases-wave-03
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-dissonance-counterpower-wave-04'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 04 counterpower packet
        shell: bash
        env:
          PARENT_SHA: 9f29da67171d30de0e9585db72f36a932ab59719
          PAYLOAD_SHA256: 78676454636a32edc13d3d9efe521056c3173d2130384ec37aa8137842ff9ea9
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(wc -c < .cnhr-wave04-counterpower/chunk-000.txt)" -eq 8000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-001a.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-001b.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-002.txt)" -eq 8000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-003.txt)" -eq 8000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-004a.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave04-counterpower/chunk-004b.txt)" -eq 3236

          printf '%s  %s\n' \
            7dfb669fa6f76a08e22143cfbfea82a93f40577517d996aa9383aab86559eac1 .cnhr-wave04-counterpower/chunk-000.txt \
            920579dd01b56730e0df72d3cb7d53eb18b745b53a17cd227c1ff9a10e2cd418 .cnhr-wave04-counterpower/chunk-001a.txt \
            2f4da1f6abdc4ef61dc80385e92904ed4d7fdb3076cb71e7d3eff760c8b4876c .cnhr-wave04-counterpower/chunk-001b.txt \
            0d9f4cbd6a9db289f7d7dd0d1d61949a84aae0b73edee869d9f0fb2eb9f5ce78 .cnhr-wave04-counterpower/chunk-002.txt \
            945299215ae04e84e27a95a76fd8cdd4a893085fec2a1b773d9085871d154d15 .cnhr-wave04-counterpower/chunk-003.txt \
            edf1686efdbfed9a955c4518e8d1edf5368cf007b4a99bfed8e6383a883b97d1 .cnhr-wave04-counterpower/chunk-004a.txt \
            1263308e91cda979be26a3e71c50f06043e40583395aab58aff6087cd4a19867 .cnhr-wave04-counterpower/chunk-004b.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave04-counterpower/chunk-000.txt)" = 220a3327bc4b3a4376e109d5e5988a670b412e8f
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-001a.txt)" = 28bf8467e788d56db8fedda61b20cf5274828894
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-001b.txt)" = 905864c2ecb171f22f9714901f8149ceef9cd1fd
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-002.txt)" = dd4ddb38e9ee312279873e773bb4a5283e643cbe
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-003.txt)" = 59de596f0eeb49f2a1a480ed754f7f7d46b44fea
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-004a.txt)" = c996ac6fea92203d93639885c18478dc4aa74231
          test "$(git hash-object .cnhr-wave04-counterpower/chunk-004b.txt)" = c4dbabbfb8f8ace9c5c32392bdc6294c88b6020c

          cat \
            .cnhr-wave04-counterpower/chunk-000.txt \
            .cnhr-wave04-counterpower/chunk-001a.txt \
            .cnhr-wave04-counterpower/chunk-001b.txt \
            .cnhr-wave04-counterpower/chunk-002.txt \
            .cnhr-wave04-counterpower/chunk-003.txt \
            .cnhr-wave04-counterpower/chunk-004a.txt \
            .cnhr-wave04-counterpower/chunk-004b.txt \
            | tr -d '\n' \
            | base64 --decode > /tmp/cnhr-wave04-counterpower.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave04-counterpower.tar.gz \
            | sha256sum --check --strict
          tar -xzf /tmp/cnhr-wave04-counterpower.tar.gz -C .
          rm -rf .cnhr-wave04-counterpower .github/workflows/cnhr-wave04-counterpower-materialize.yml

          node --check scripts/clifford-number-hr-algorithmic-adverse-cases.mjs
          node scripts/clifford-number-hr-algorithmic-adverse-cases.mjs --check
          node test/clifford-number-hr-algorithmic-adverse-cases-fixtures.mjs

          node --check scripts/clifford-number-hr-dissonance-counterpower.mjs
          node --check test/clifford-number-hr-dissonance-counterpower-fixtures.mjs
          node scripts/clifford-number-hr-dissonance-counterpower.mjs --check
          node test/clifford-number-hr-dissonance-counterpower-fixtures.mjs
          git diff --check

          git add -A
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '9f29da67171d30de0e9585db72f36a932ab59719'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-04/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          print('exact Wave 04 counterpower delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number dissonance-counterpower Wave 04'
          git push origin HEAD:"${HEAD_REF}"
