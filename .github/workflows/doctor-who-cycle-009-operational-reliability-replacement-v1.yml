name: doctor-who-cycle-009-operational-reliability-replacement-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-operational-reliability-replacement-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-operational-reliability-replacement-v1
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  BRANCH: agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v1
  SELF: .github/workflows/doctor-who-cycle-009-operational-reliability-replacement-v1.yml
  OUT: /tmp/doctor-who-cycle-009-operational-reliability-replacement-v1
  PRODUCT_PR: "692"
  PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
  PRODUCT_COMMIT: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  PRODUCT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  PRODUCT_PATHS: "48"
  FAILED_RUN: "31280710952"
  FAILED_JOB: "93161406196"
  FAILED_ARTIFACT: "9028343034"
  FAILED_ARTIFACT_DIGEST: sha256:337be9e2ca88f4b26b3ee0135955d65eb6d838cec6ef29bbed08b2919cc1f260
  FAILURE_SIGNATURE: "fatal: path 'data/review/adapter-sdk/doctor-who-cycle-008-kreg.json' exists on disk, but not in '47ccb38eab6a4b6e2a16ed92b04f1259b95de783'"
  RUNNER_SHA256: 710f763e0c3b96603b298cae37bb9c31eef61f260265735e8ff6df051c2925ab
  RUNNER_GZIP_SHA256: 588c3e18eb07efe7f0bd944d9ec6a7f260e80443811593e125c3b2461bd44721
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute exact commit-bound replacement proof
        shell: bash
        run: |
          set -euo pipefail
          message=/tmp/doctor-who-cycle-009-operational-reliability-replacement-v1.commit-message
          runner_gz=/tmp/doctor-who-cycle-009-operational-reliability-replacement-v1.sh.gz
          runner=/tmp/doctor-who-cycle-009-operational-reliability-replacement-v1.sh
          git show -s --format=%B HEAD > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64,os
          from pathlib import Path
          text=Path(os.environ['MESSAGE']).read_text(); begin='RUNNER_GZIP_BASE64_BEGIN'; end='RUNNER_GZIP_BASE64_END'
          assert text.count(begin)==1 and text.count(end)==1
          payload=''.join(text.split(begin,1)[1].split(end,1)[0].split()); assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload,validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload exact replacement proof
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-replacement-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-replacement-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload replacement diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-replacement-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-replacement-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
