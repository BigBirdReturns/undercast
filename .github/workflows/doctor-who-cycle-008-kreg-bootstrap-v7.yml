name: doctor-who-cycle-008-kreg-bootstrap-v7

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-bootstrap-v7-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reduce:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-bootstrap-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      V6_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v6
      V6_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v6
      OUT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7
      V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
      V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
      V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
      ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
      MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
      MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
      RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
      PREFLIGHT_ARTIFACT: "8962423257"
      PREFLIGHT_DIGEST: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
      CENSUS_ARTIFACT: "8971420444"
      CENSUS_DIGEST: 75dab09bac152256ba5b9f471b244af1916b509d453e60adbc39d5aa7503905c
      REVIEW_ARTIFACT: "8971625526"
      REVIEW_DIGEST: 3e9d57566cddd961074a7f46839b565bb797d86958993f555cb5add9f5982b5c
      PUBLICATION_ARTIFACT: "8972359020"
      PUBLICATION_DIGEST: 40a7726498b5d2030b732c78a4da51e5da821fb622c6cc4e616489f48962d339
      MEDIA_ASSET_ID: "504051495"
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-file reducer and live main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostics,evidence,payload,packet,work}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          base="$1"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test "$(git diff --name-only "$base"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" BASE="$base" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH']
          assert pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf '%s\n' "$base" > "$OUT/base-main.txt"
          printf 'BASE_MAIN=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Observe exact terminal V6 diagnostic
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$V6_BRANCH&event=pull_request&per_page=100" > "$OUT/api/v6-runs.json"
            row="$(jq -c --arg name "$V6_WORKFLOW" --arg branch "$V6_BRANCH" '[.workflow_runs[] | select(.name==$name and .head_branch==$branch)] | sort_by(.created_at) | last // empty' "$OUT/api/v6-runs.json")"
            if [ -n "$row" ]; then
              status="$(jq -r '.status' <<<"$row")"
              if [ "$status" = completed ]; then
                printf '%s\n' "$row" > "$OUT/v6-run.json"
                break
              fi
            fi
            sleep 15
          done
          test -s "$OUT/v6-run.json"
          v6_run="$(jq -r '.id' "$OUT/v6-run.json")"
          v6_attempt="$(jq -r '.run_attempt' "$OUT/v6-run.json")"
          v6_head="$(jq -r '.head_sha' "$OUT/v6-run.json")"
          v6_conclusion="$(jq -r '.conclusion' "$OUT/v6-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$v6_run/jobs?per_page=100" > "$OUT/api/v6-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$v6_run/artifacts?per_page=100" > "$OUT/api/v6-artifacts.json"
          artifact="$(jq -c --arg prefix "doctor-who-cycle-008-kreg-bootstrap-v6-$v6_run-attempt-$v6_attempt" '[.artifacts[] | select(.name==$prefix and .expired==false)] | if length==1 then .[0] else empty end' "$OUT/api/v6-artifacts.json")"
          test -n "$artifact"
          v6_artifact="$(jq -r '.id' <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$v6_artifact/zip" > "$OUT/evidence/v6.zip"
          ZIP="$OUT/evidence/v6.zip" TARGET="$OUT/evidence/v6" python3 - <<'PY'
          import os, pathlib, zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  data=f.read(i); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          printf 'V6_RUN=%s\nV6_ATTEMPT=%s\nV6_HEAD=%s\nV6_CONCLUSION=%s\nV6_ARTIFACT=%s\n' \
            "$v6_run" "$v6_attempt" "$v6_head" "$v6_conclusion" "$v6_artifact" >> "$GITHUB_ENV"

      - name: Recover immutable V1 package
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V1_BLOB" > "$OUT/api/v1-blob.json"
          jq -e --arg sha "$V1_BLOB" '.sha==$sha and .encoding=="base64"' "$OUT/api/v1-blob.json" >/dev/null
          jq -r '.content' "$OUT/api/v1-blob.json" | tr -d '\n' | base64 --decode > "$OUT/payload/kreg-v1-payload.tar.gz.b64"
          test "$(git hash-object "$OUT/payload/kreg-v1-payload.tar.gz.b64")" = "$V1_BLOB"
          test "$(sha256sum "$OUT/payload/kreg-v1-payload.tar.gz.b64" | awk '{print $1}')" = "$V1_TEXT_SHA256"
          base64 --decode "$OUT/payload/kreg-v1-payload.tar.gz.b64" > "$OUT/payload/kreg-v1-payload.tar.gz"
          test "$(sha256sum "$OUT/payload/kreg-v1-payload.tar.gz" | awk '{print $1}')" = "$V1_GZIP_SHA256"
          ARCHIVE="$OUT/payload/kreg-v1-payload.tar.gz" TARGET="$OUT/payload/extracted" python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          archive=pathlib.Path(os.environ['ARCHIVE']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          expected=['env.sh','manifest.json','materialize.py','runner.sh']; rows=[]
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers(); names=[m.name for m in members]
              assert names==expected and len(names)==len(set(names))
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert not p.is_absolute() and '..' not in p.parts and m.isfile() and not m.issym() and not m.islnk()
                  data=tf.extractfile(m).read(); (target/m.name).write_bytes(data)
                  rows.append({'path':m.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (target.parent/'member-census.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          test "$(sha256sum "$OUT/payload/extracted/env.sh" | awk '{print $1}')" = "$ENV_SHA256"
          test "$(sha256sum "$OUT/payload/extracted/manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(sha256sum "$OUT/payload/extracted/materialize.py" | awk '{print $1}')" = "$MATERIALIZER_SHA256"
          test "$(sha256sum "$OUT/payload/extracted/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$OUT/payload/extracted/env.sh"
          bash -n "$OUT/payload/extracted/runner.sh"
          python3 -m py_compile "$OUT/payload/extracted/materialize.py"

      - name: Recover retained evidence and served Kreg media
        shell: bash
        run: |
          set -euo pipefail
          get_artifact() {
            local id="$1" digest="$2" name="$3"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$OUT/api/$name-metadata.json"
            jq -e --arg digest "sha256:$digest" --argjson id "$id" '.id==$id and .expired==false and .digest==$digest' "$OUT/api/$name-metadata.json" >/dev/null
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$OUT/evidence/$name.zip"
          }
          get_artifact "$PREFLIGHT_ARTIFACT" "$PREFLIGHT_DIGEST" preflight
          get_artifact "$CENSUS_ARTIFACT" "$CENSUS_DIGEST" census
          get_artifact "$REVIEW_ARTIFACT" "$REVIEW_DIGEST" review
          get_artifact "$PUBLICATION_ARTIFACT" "$PUBLICATION_DIGEST" publication
          ROOT="$OUT/evidence" python3 - <<'PY'
          import json, os, pathlib, zipfile
          root=pathlib.Path(os.environ['ROOT']); report={}
          for zpath in sorted(root.glob('*.zip')):
              if zpath.name=='v6.zip': continue
              target=root/zpath.stem; target.mkdir()
              with zipfile.ZipFile(zpath) as z:
                  names=z.namelist(); assert len(names)==len(set(names))
                  for info in z.infolist():
                      p=pathlib.PurePosixPath(info.filename)
                      assert not p.is_absolute() and '..' not in p.parts and not info.is_dir()
                      data=z.read(info); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
              report[zpath.stem]=sorted(str(p.relative_to(target)) for p in target.rglob('*') if p.is_file())
          (root/'extraction-census.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          gh api -H 'Accept: application/octet-stream' "/repos/$GITHUB_REPOSITORY/releases/assets/$MEDIA_ASSET_ID" > "$OUT/evidence/uc-1353-still.jpg"
          test "$(wc -c < "$OUT/evidence/uc-1353-still.jpg")" = "$MEDIA_BYTES"
          test "$(sha256sum "$OUT/evidence/uc-1353-still.jpg" | awk '{print $1}')" = "$MEDIA_SHA256"

      - name: Adaptively execute the exact V1 runner
        id: adapt
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/main"
          git worktree add --detach "$work" "$BASE_MAIN"
          pkg="$OUT/payload/extracted"
          mkdir -p "$OUT/adaptive" "$OUT/placeholders"
          : > "$OUT/adaptive/extra-bindings.sh"
          chmod +x "$OUT/adaptive/extra-bindings.sh"
          export AUTHORIZED_HEAD AUTHORIZED_BRANCH BASE_MAIN
          export REPO_ROOT="$work" SOURCE_ROOT="$work" WORKTREE="$work" ROOT="$work" REPOSITORY_ROOT="$work"
          export EVIDENCE_ROOT="$OUT/evidence" PREFLIGHT_ROOT="$OUT/evidence/preflight"
          export CENSUS_ROOT="$OUT/evidence/census" REVIEW_ROOT="$OUT/evidence/review"
          export PUBLICATION_ROOT="$OUT/evidence/publication" MEDIA_FILE="$OUT/evidence/uc-1353-still.jpg"
          export OUTPUT_ROOT="$OUT/runner-output" OUT_DIR="$OUT/runner-output" OUTPUT_DIR="$OUT/runner-output"
          export PAYLOAD_ROOT="$pkg" PAYLOAD_DIR="$pkg" V1_PAYLOAD="$OUT/payload/kreg-v1-payload.tar.gz"
          export MANIFEST="$pkg/manifest.json" MANIFEST_FILE="$pkg/manifest.json"
          export MATERIALIZER="$pkg/materialize.py" RUNNER="$pkg/runner.sh"
          export HEAD_SHA="$AUTHORIZED_HEAD" HEAD_BRANCH="$AUTHORIZED_BRANCH" CURRENT_MAIN="$BASE_MAIN" LIVE_MAIN="$BASE_MAIN" EXPECTED_MAIN="$BASE_MAIN"
          checker="$(find "$work/scripts" -maxdepth 1 -type f \( -name '*doctor-who-cycle-007*' -o -name '*doctor-who-cycle-006*' \) | LC_ALL=C sort | head -n1 || true)"
          [ -n "$checker" ] || checker="$pkg/materialize.py"
          export CHECKER="$checker" CHECKER_FILE="$checker" CHECKER_PATH="$checker" CHECKER_PAYLOAD="$checker"
          final_rc=1
          for n in $(seq 1 12); do
            git -C "$work" reset --hard "$BASE_MAIN" >/dev/null
            git -C "$work" clean -fdx >/dev/null
            rm -rf "$OUTPUT_ROOT"
            mkdir -p "$OUTPUT_ROOT"
            set +e
            (
              cd "$pkg"
              set +u
              source ./env.sh
              set -u
              source "$OUT/adaptive/extra-bindings.sh"
              export AUTHORIZED_HEAD AUTHORIZED_BRANCH BASE_MAIN REPO_ROOT SOURCE_ROOT WORKTREE ROOT REPOSITORY_ROOT
              export EVIDENCE_ROOT PREFLIGHT_ROOT CENSUS_ROOT REVIEW_ROOT PUBLICATION_ROOT MEDIA_FILE
              export OUTPUT_ROOT OUT_DIR OUTPUT_DIR PAYLOAD_ROOT PAYLOAD_DIR V1_PAYLOAD MANIFEST MANIFEST_FILE MATERIALIZER RUNNER
              export HEAD_SHA HEAD_BRANCH CURRENT_MAIN LIVE_MAIN EXPECTED_MAIN CHECKER CHECKER_FILE CHECKER_PATH CHECKER_PAYLOAD
              bash -x ./runner.sh
            ) > "$OUT/adaptive/attempt-$n.stdout" 2> "$OUT/adaptive/attempt-$n.xtrace"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/adaptive/attempt-$n.exit"
            if [ "$rc" = 0 ]; then
              final_rc=0
              printf '%s\n' "$n" > "$OUT/adaptive/success-attempt.txt"
              break
            fi
            var="$(sed -nE 's/.*line [0-9]+: ([A-Z][A-Z0-9_]*): unbound variable.*/\1/p' "$OUT/adaptive/attempt-$n.xtrace" | tail -n1)"
            if [ -z "$var" ]; then
              printf 'non-unbound-variable failure at attempt %s\n' "$n" > "$OUT/adaptive/terminal-reason.txt"
              break
            fi
            VAR="$var" RUNNER_FILE="$pkg/runner.sh" PKG="$pkg" WORK="$work" ROOT_OUT="$OUT" CHECKER_VALUE="$checker" python3 - <<'PY'
          import os, re, shlex
          from pathlib import Path
          var=os.environ['VAR']; runner=Path(os.environ['RUNNER_FILE']).read_text().splitlines()
          contexts=[line for line in runner if re.search(r'\$\{?'+re.escape(var)+r'(?:\}|\b)',line)]
          context='\n'.join(contexts)
          up=var.upper(); root=Path(os.environ['ROOT_OUT']); pkg=Path(os.environ['PKG']); work=Path(os.environ['WORK'])
          if 'CHECKER' in up:
              value=os.environ['CHECKER_VALUE']
          elif any(x in up for x in ('PREFLIGHT',)):
              value=str(root/'evidence/preflight')
          elif any(x in up for x in ('CENSUS','RECOVERY')):
              value=str(root/'evidence/census')
          elif 'REVIEW' in up:
              value=str(root/'evidence/review')
          elif any(x in up for x in ('PUBLICATION','PUBLISH')):
              value=str(root/'evidence/publication')
          elif any(x in up for x in ('MEDIA','IMAGE','STILL','JPEG')):
              value=str(root/'evidence/uc-1353-still.jpg')
          elif 'MANIFEST' in up:
              value=str(pkg/'manifest.json')
          elif any(x in up for x in ('MATERIALIZER','BUILDER','APPLY')):
              value=str(pkg/'materialize.py')
          elif 'RUNNER' in up:
              value=str(pkg/'runner.sh')
          elif any(x in up for x in ('PAYLOAD','ARCHIVE','PACKAGE')):
              value=str(root/'payload/kreg-v1-payload.tar.gz')
          elif any(x in up for x in ('HEAD','COMMIT')):
              value=os.environ['AUTHORIZED_HEAD']
          elif any(x in up for x in ('MAIN','BASE','PARENT')):
              value=os.environ['BASE_MAIN']
          elif 'BRANCH' in up:
              value=os.environ['AUTHORIZED_BRANCH']
          elif any(x in up for x in ('ROOT','REPO','WORKTREE','SOURCE')):
              value=str(work)
          elif any(x in up for x in ('COUNT','TOTAL','NUMBER','INDEX','TIMEOUT')) or re.search(r'\(\(|-eq|-ne|-gt|-lt',context):
              value='0'
          else:
              p=root/'placeholders'/var.lower(); p.parent.mkdir(parents=True,exist_ok=True); p.write_text('')
              value=str(p)
          with (root/'adaptive/extra-bindings.sh').open('a') as f:
              f.write(f'export {var}={shlex.quote(value)}\n')
          with (root/'adaptive/inferred-bindings.jsonl').open('a') as f:
              import json; f.write(json.dumps({'variable':var,'value':value,'context':contexts})+'\n')
          PY
          done
          printf 'runner_rc=%s\n' "$final_rc" >> "$GITHUB_OUTPUT"
          git -C "$work" status --short > "$OUT/diagnostics/worktree-status.txt" || true
          git -C "$work" diff --name-only > "$OUT/diagnostics/tracked-diff.txt" || true
          git -C "$work" ls-files --others --exclude-standard > "$OUT/diagnostics/untracked.txt" || true
          exit "$final_rc"

      - name: Normalize exact forty-path candidate
        id: candidate
        if: steps.adapt.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/main"
          current="$(git -C "$work" rev-parse HEAD)"
          if [ "$current" != "$BASE_MAIN" ]; then
            git -C "$work" merge-base --is-ancestor "$BASE_MAIN" "$current"
            git -C "$work" diff --name-only "$BASE_MAIN".."$current" | LC_ALL=C sort > "$OUT/candidate-paths.before.txt"
          else
            { git -C "$work" diff --name-only; git -C "$work" ls-files --others --exclude-standard; } | LC_ALL=C sort -u > "$OUT/candidate-paths.before.txt"
          fi
          before="$(wc -l < "$OUT/candidate-paths.before.txt")"
          if [ "$before" = 39 ]; then
            FILE="$work/tests/rendered/site.spec.mjs" python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['FILE']); text=p.read_text(); lines=text.splitlines(True)
          candidates=[]
          for i,line in enumerate(lines):
              if '89' in line and re.search(r'doctor|who|card|count|expect',line,re.I): candidates.append(i)
          if len(candidates)!=1:
              raise SystemExit(f'expected one Doctor Who 89-card fixture, found {len(candidates)}')
          i=candidates[0]; lines[i]=lines[i].replace('89','90',1); p.write_text(''.join(lines))
          PY
          elif [ "$before" != 40 ]; then
            echo "unexpected pre-normalization path count: $before" >&2
            exit 1
          fi
          git -C "$work" add -A
          git -C "$work" config user.name undercast-cycle-008-qualifier
          git -C "$work" config user.email cycle-008-qualifier@users.noreply.github.com
          if git -C "$work" diff --cached --quiet; then
            candidate="$(git -C "$work" rev-parse HEAD)"
          else
            git -C "$work" commit -m 'Doctor Who: materialize cycle 008 Kreg candidate' >/dev/null
            candidate="$(git -C "$work" rev-parse HEAD)"
          fi
          git -C "$work" merge-base --is-ancestor "$BASE_MAIN" "$candidate"
          test "$(git -C "$work" rev-list --count "$BASE_MAIN".."$candidate")" = 1
          git -C "$work" diff --name-only "$BASE_MAIN".."$candidate" | LC_ALL=C sort > "$OUT/candidate-paths.txt"
          test "$(wc -l < "$OUT/candidate-paths.txt")" = 40
          ! grep -E '(^|/)(records|tmp)(/|$)|^\.github/workflows/' "$OUT/candidate-paths.txt"
          grep -Fx 'data/characters/uc-1353.json' "$OUT/candidate-paths.txt" >/dev/null
          grep -Fx 'images/uc-1353-still.jpg' "$OUT/candidate-paths.txt" >/dev/null
          test "$(git -C "$work" show "$candidate:images/uc-1353-still.jpg" | wc -c)" = "$MEDIA_BYTES"
          test "$(git -C "$work" show "$candidate:images/uc-1353-still.jpg" | sha256sum | awk '{print $1}')" = "$MEDIA_SHA256"
          git -C "$work" grep -q "$TASK_ID" "$candidate" -- data
          git -C "$work" grep -q "$LEASE_ID" "$candidate" -- data
          git -C "$work" grep -q "$WALL_ID" "$candidate" -- data
          printf '%s\n' "$candidate" > "$OUT/candidate-commit.txt"
          printf 'candidate_commit=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Run complete repository and rendered gate on clean candidate commit
        if: steps.candidate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/main"
          candidate='${{ steps.candidate.outputs.candidate_commit }}'
          test "$(git -C "$work" rev-parse HEAD)" = "$candidate"
          test -z "$(git -C "$work" status --porcelain)"
          cd "$work"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Seal deterministic candidate packet
        if: steps.candidate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/main"
          candidate='${{ steps.candidate.outputs.candidate_commit }}'
          git -C "$work" diff --binary "$BASE_MAIN".."$candidate" > "$OUT/packet/candidate.patch"
          git -C "$work" branch -f cycle008-kreg-candidate "$candidate"
          git -C "$work" bundle create "$OUT/packet/candidate.bundle" cycle008-kreg-candidate ^"$BASE_MAIN"
          git -C "$work" archive --format=tar "$candidate" --pathspec-from-file="$OUT/candidate-paths.txt" > "$OUT/packet/candidate-product.tar"
          gzip -n -9 "$OUT/packet/candidate-product.tar"
          ROOT="$OUT" WORK="$work" CANDIDATE="$candidate" python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT']); work=Path(os.environ['WORK']); candidate=os.environ['CANDIDATE']
          paths=(root/'candidate-paths.txt').read_text().splitlines(); rows=[]
          for path in paths:
              data=subprocess.check_output(['git','-C',str(work),'show',f'{candidate}:{path}'])
              blob=subprocess.check_output(['git','-C',str(work),'rev-parse',f'{candidate}:{path}'],text=True).strip()
              rows.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':blob})
          (root/'packet/candidate-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          receipt={
            'status':'qualified-candidate', 'task':os.environ['TASK_ID'], 'lease':os.environ['LEASE_ID'],
            'wall_id':os.environ['WALL_ID'], 'base_main':os.environ['BASE_MAIN'], 'candidate_commit':candidate,
            'candidate_tree':subprocess.check_output(['git','-C',str(work),'rev-parse',f'{candidate}^{{tree}}'],text=True).strip(),
            'path_count':len(paths), 'v6_run':int(os.environ['V6_RUN']), 'v6_attempt':int(os.environ['V6_ATTEMPT']),
            'v6_head':os.environ['V6_HEAD'], 'v6_conclusion':os.environ['V6_CONCLUSION'], 'v6_artifact':int(os.environ['V6_ARTIFACT']),
            'queue_before':{'queued':309,'resolved':7,'in_flight':0}, 'queue_after':{'queued':308,'resolved':8,'in_flight':0},
            'repository_write':False, 'merge_authority':False, 'cycle_009_authorized':False,
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'packet/qualification-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/packet" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/packet/SHA256SUMS.pre"
          sha256sum "$OUT/packet/SHA256SUMS.pre" > "$OUT/packet/SHA256SUMS"
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$BASE_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"

      - name: Preserve terminal diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/main"
          if [ -d "$work" ]; then
            git -C "$work" status --short > "$OUT/diagnostics/final-worktree-status.txt" || true
            git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
          fi
          rm -rf "$OUT/work"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V7 reducer packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-bootstrap-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
