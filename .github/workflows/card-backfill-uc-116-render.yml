name: card-backfill-uc-116-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-116-RENDER.json"
      - "scripts/card-backfill-uc-116-render.mjs"
      - ".github/workflows/card-backfill-uc-116-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-116-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-026'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-026
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-116 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-116-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-116');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-116');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_c5dde833a2fc5b51f783437b');
          if(row.version!==1||row.record_id!=='UC-116'||row.actor!=='June Foray'||row.character!=='Rocky, Natasha & Granny'||row.production!=='Rocky & Bullwinkle / Looney Tunes'||row.year!==1959||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-116 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8677975755||row.discovery_artifact?.head_sha!=='d3d8da27ae7774d112602e732ce0e9c0a1dc468c'||row.discovery_artifact?.candidate_count!==21)throw new Error('UC-116 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==3||row.failed_discovery_checkpoints[0]?.artifact_id!==8677751571||row.failed_discovery_checkpoints[1]?.artifact_id!==8677841001||row.failed_discovery_checkpoints[2]?.artifact_id!==8677907897)throw new Error('UC-116 failed discovery custody drift');
          if(row.roles?.length!==3||row.roles[0]?.key!=='rocky'||row.roles[1]?.key!=='natasha'||row.roles[2]?.key!=='granny')throw new Error('UC-116 role denominator drift');
          if(row.roles[0]?.sha256!=='ac213497bdafb607acc648942c2067556303f32a49f348577d4af5e955773de7'||row.roles[1]?.sha256!=='25cd4afa815979304c72a7b3ecf733c03bdf51e910b5377fc34f0925a8a195ca'||row.roles[2]?.sha256!=='3e7869099835fe0d82c0cdb93238e36818595343ab9b0d127e495428ce583280')throw new Error('UC-116 selected source drift');
          if(row.roles.filter(role=>role.generic_width_floor_exception===true).length!==2||row.roles[1]?.width!==236||row.roles[2]?.width!==204)throw new Error('UC-116 historical floor exception drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.gap_width!==12||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-116 render geometry drift');
          if(!specimen||specimen.actor!=='June Foray'||specimen.character!=='Rocky, Natasha & Granny'||specimen.production!=='Rocky & Bullwinkle / Looney Tunes'||specimen.years!=='1959'||specimen.still)throw new Error('UC-116 specimen boundary drift');
          if(source?.still)throw new Error('UC-116 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-116'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-116 audit boundary drift');
          console.log('PASS — exact UC-116 June Foray three-role render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-116-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8677975755/zip" > "$root/discovery.zip"
          echo "e09ac8c3a3fd3cc72ef5aab5fefbd23e6afe296fefee66b912cd0cbf4f8e806a  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-116-discover"
          echo "aff79b9078c8b5b91cab376126bfb6edccd33e3b84dc48b849f52fc21ed8f256  $source/manifest.json" | sha256sum -c -
          echo "3707663535759fe2c4af0cd2a283d5d28ba6d3bea20fd6b79575ccd9260dce89  $source/summary.json" | sha256sum -c -
          echo "ff0cc376d0af5d5ae08739c84ce7a83c1e271e9ec244a6a8290ff76bdc974110  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "fc643c16b83224a1ca84b4457e7878c23f61e70d4a20149126ba76e5004751ab  $source/contact-sheet-rocky.jpg" | sha256sum -c -
          echo "44f132fce4e8e5c1f38d39b3a03075451fbb5f4bd5081bbc7c9d430373970059  $source/contact-sheet-natasha.jpg" | sha256sum -c -
          echo "f4ae931c15940018840d7c202d359bbbb9e024fb6f060413cf74dca449d5f382  $source/contact-sheet-granny.jpg" | sha256sum -c -
          echo "50bc9e44391eb7b915d60f11ecc6b6c03b49bce925cc0a61934165f9eb9a1076  $source/pages/television-academy-june-foray.png" | sha256sum -c -
          echo "9b4cccea6a66324012739c9ae68e32e769e2c799421743da312c0a2268dd5850  $source/pages/rocky.png" | sha256sum -c -
          echo "bfae90ec0330f8950b5dbaf30f05cf4394ce130c239b13b41787c965397f820b  $source/pages/natasha.png" | sha256sum -c -
          echo "7625426585bf7e291e1a08e0e3ab319f752bcaff0af063f0c2d24ea03135e132  $source/pages/granny.png" | sha256sum -c -
          echo "e07ba311ee6c8b39f0a2e834b2b6c5cf0808dc4a626334a3daada5c8288567a9  $source/api-wikitext/rocky.txt" | sha256sum -c -
          echo "97be1af631bc79e2a8c5a275e2683c30f5006f80f5617b3b8af19f79ff0c7f52  $source/api-wikitext/natasha.txt" | sha256sum -c -
          echo "0b7cb802b624da967931f0074c66b4006a77a6d8f0a25575ccaf263ab40dfaf3  $source/api-wikitext/granny.txt" | sha256sum -c -
          echo "ac213497bdafb607acc648942c2067556303f32a49f348577d4af5e955773de7  $source/candidates/rocky/001-file-rocky-1959-version-2-png.webp" | sha256sum -c -
          echo "25cd4afa815979304c72a7b3ecf733c03bdf51e910b5377fc34f0925a8a195ca  $source/candidates/natasha/001-file-natasha-fatale-1959-png.webp" | sha256sum -c -
          echo "3e7869099835fe0d82c0cdb93238e36818595343ab9b0d127e495428ce583280  $source/candidates/granny/001-file-granny-gif.webp" | sha256sum -c -
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-116-render/discovery/card-backfill-uc-116-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-116-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-116-render"
          node --check scripts/card-backfill-uc-116-render.mjs
          node scripts/card-backfill-uc-116-render.mjs 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-116-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-116-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-116-render/output
            ${{ runner.temp }}/card-backfill-uc-116-render/run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
