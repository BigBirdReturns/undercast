name: ux-04-source-export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ux-04-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Bind and package exact UX-04 checkout
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          printf '%s\n' "$HEAD_SHA" > /tmp/source-head.txt
          printf '%s\n' "$BASE_SHA" > /tmp/source-main.txt
          tar --exclude=.git --exclude=node_modules --exclude=test-results --exclude=playwright-report -czf /tmp/undercast-ux-04-source.tgz .
          sha256sum /tmp/undercast-ux-04-source.tgz > /tmp/source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ux-04-source-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/undercast-ux-04-source.tgz
            /tmp/source-head.txt
            /tmp/source-main.txt
            /tmp/source-sha256.txt
