name: star-trek-bounded-numeric-boundary-patch-v1

on:
  push:
    branches:
      - agent/star-trek-next-bounded-cycle-claim

concurrency:
  group: star-trek-bounded-numeric-boundary-patch-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Protect hashes and identifiers from count rebinding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for rel in ('.github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py','.github/recovery/post-kzinti-cycle-controller-rebind-v1.py'):
              path=Path(rel); text=path.read_text(); original=text
              text=text.replace('return re.sub(rf"(?<!\\d){re.escape(old)}(?!\\d)", token, text)','return re.sub(rf"(?<![0-9A-Za-z]){re.escape(old)}(?![0-9A-Za-z])", token, text)')
              text=text.replace('return re.sub(rf"(?<!\\d){old}(?!\\d)", token, text)','return re.sub(rf"(?<![0-9A-Za-z]){old}(?![0-9A-Za-z])", token, text)')
              if text!=original: path.write_text(text); changed.append(rel)
          if len(changed)!=2: raise SystemExit(f'numeric boundary patch cardinality drifted: {changed}')
          Path('/tmp/numeric-boundary-paths.txt').write_text('\n'.join(changed)+'\n')
          PY
          python3 -m py_compile .github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py
          python3 -m py_compile .github/recovery/post-kzinti-cycle-controller-rebind-v1.py
          git diff --check
          git config user.name undercast-star-trek-numeric-boundary-patcher
          git config user.email numeric-boundary-patcher@users.noreply.github.com
          while IFS= read -r path; do git add -- "$path"; done < /tmp/numeric-boundary-paths.txt
          git rm -- .github/workflows/star-trek-bounded-numeric-boundary-patch-v1.yml
          git commit -m 'Star Trek: protect identities during count rebinding'
          git push origin HEAD:agent/star-trek-next-bounded-cycle-claim
