# Final-state rearm for COLLECT-006: the bot-authored custody commit could not trigger ordinary pull-request workflows.
name: estate-canonical-adoption-ledger

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-canonical-adoption-ledger.yml
      - scripts/estate-canonical-adoption-ledger.mjs
      - data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
      - data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json
      - data/review/estate-debt/COLLECT-003-CANONICAL-ADOPTION.json
      - data/specimens.json
      - data/SOURCES.json

permissions:
  contents: read

concurrency:
  group: estate-canonical-adoption-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconcile imported packets, paid receipts, canonical bytes, and live bindings
        run: node scripts/estate-canonical-adoption-ledger.mjs
