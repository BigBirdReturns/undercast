name: card-backfill-uc-118-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-118-DISCOVER.json"
      - "scripts/card-backfill-uc-118-discover.mjs"
      - ".github/workflows/card-backfill-uc-118-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-118-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-028'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-028
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-118 three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-118-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-118');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-118');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0a3724582c82ea7595990893');
          if(row.version!==1||row.record_id!=='UC-118'||row.actor!=='Frank Oz'||row.character!=='Yoda, Miss Piggy & Fozzie'||row.production!=='The Muppets / Star Wars'||row.year!==1976||row.side!=='still')throw new Error('UC-118 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8698826898||row.selector_artifact?.head_sha!=='886f52a0f8e7673fd5a82640cc9669c83293ee09')throw new Error('UC-118 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8699010491||row.scope_artifact?.head_sha!=='d5a7297ecb5addd4628a4e2759383a7e0c70ead3'||row.scope_artifact?.scope_sha256!=='5f23e465cccdfbe338977b5952dc208268355c8936d2cb8614f756941be9fe2c')throw new Error('UC-118 scope custody drift');
          if(row.actor_role_pages?.length!==2||row.actor_role_pages.filter(page=>page.strict).length!==2||row.roles?.length!==3||row.roles.filter(role=>role.strict).length!==3||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==24)throw new Error('UC-118 discovery denominator drift');
          if(JSON.stringify(row.selection_contract?.required_role_keys)!==JSON.stringify(['yoda','miss-piggy','fozzie'])||row.selection_contract?.exact_three_role_composite_required!==true||row.selection_contract?.strict_actor_role_pages_required!==2||row.selection_contract?.yoda_empire_strikes_back_official_source_required!==true||row.selection_contract?.miss_piggy_and_fozzie_oz_era_henson_archive_required!==true||row.selection_contract?.canonical_1976_is_muppet_chronology_not_yoda_debut!==true||row.selection_contract?.all_three_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-118 selection contract drift');
          if(!specimen||specimen.actor!=='Frank Oz'||specimen.character!=='Yoda, Miss Piggy & Fozzie'||specimen.production!=='The Muppets / Star Wars'||specimen.years!=='1976'||specimen.still)throw new Error('UC-118 specimen boundary drift');
          if(source?.still)throw new Error('UC-118 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-118'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-118 audit boundary drift');
          console.log('PASS — exact UC-118 Frank Oz three-role official-source discovery authorized');
          NODE
      - name: Gather official role pages and exact image candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-118-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-118-discover.mjs
          node scripts/card-backfill-uc-118-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-118-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-118-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-118-discover
            ${{ runner.temp }}/card-backfill-uc-118-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
