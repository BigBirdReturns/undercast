name: card-backfill-uc-060-posters

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-060-POSTERS.json"
      - "scripts/card-backfill-uc-060-posters.mjs"
      - ".github/workflows/card-backfill-uc-060-posters.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-060-posters-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-009'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-009
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact discovery custody
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-060-POSTERS.json','utf8'));
          if(c.version!==1||c.record_id!=='UC-060'||c.actor!=='Ray Park'||c.review_authority!=='candidate-only-second-desk')throw new Error('UC-060 poster control drift');
          if(c.discovery_artifact?.artifact_id!==8635066901||c.discovery_artifact?.head_sha!=='a1819580f2245b2ef30237f50d8ccabdc80c9e83')throw new Error('UC-060 discovery custody drift');
          if(c.source_keys?.length!==9)throw new Error('UC-060 source-balance drift');
          console.log('PASS — exact official-source discovery artifact authorized');
          NODE
      - name: Retrieve and verify discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-060-posters"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8635066901/zip" > "$root/discovery.zip"
          echo "6723404fd52c443d3af062f8ec4da2b318c685f8b8b9b2d16092a30d080fc472  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          echo "a45d8373fad6fdc75983663d25d73d2f4b07a6b25dfbfa9755b2a07d3175f1d4  $root/source/card-backfill-uc-060/manifest.json" | sha256sum -c -
      - name: Download one exact hero per Lucasfilm source
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-060-posters/source/card-backfill-uc-060
          OUT: ${{ runner.temp }}/card-backfill-uc-060-posters/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-060-posters.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-060-posters/run.log"
          test -z "$(git status --porcelain)"
      - name: Upload source-balanced official hero sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-060-posters-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-060-posters/output
            ${{ runner.temp }}/card-backfill-uc-060-posters/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
