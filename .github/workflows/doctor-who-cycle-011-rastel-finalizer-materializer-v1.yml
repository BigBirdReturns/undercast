              (os.environ['OLD_CANDIDATE_COMMIT'],bindings['candidate']['commit'],'candidate-commit'),
              (os.environ['OLD_CANDIDATE_TREE'],bindings['candidate']['tree'],'candidate-tree'),
              (os.environ['OLD_REVIEW_PR'],str(bindings['observer']['pr']),'review-pr'),
              (os.environ['OLD_REVIEW_HEAD'],bindings['observer']['head'],'review-head'),
              (os.environ['OLD_REVIEW_RUN'],str(bindings['observer']['run']),'review-run'),
              (os.environ['OLD_REVIEW_JOB'],str(bindings['observer']['job']),'review-job'),
              (os.environ['OLD_REVIEW_ARTIFACT'],str(bindings['observer']['artifact']),'review-artifact'),
