              'target':{'bytes':len(draft_bytes),'sha256':sha(draft_bytes),'bash_syntax':syntax.returncode==0,'bash_stderr':syntax.stderr,'embedded_python':len(py_blocks),'compile_errors':compile_errors},
              'authority':{'bindings_identity':bindings['identity'],'candidate_receipt_identity':bindings['candidate']['receipt_identity'],'observer_identity':bindings['observer']['identity']},
