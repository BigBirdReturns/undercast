name: doctor-who-cycle-011-rastel-finalizer-materializer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-materializer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-materializer-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-materializer-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-materializer-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-materializer-v1
      PREFLIGHT_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-preflight-v1
      PREFLIGHT_WORKFLOW: doctor-who-cycle-011-rastel-finalizer-source-preflight-v1
      PREFLIGHT_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-finalizer-source-preflight-v1-
      SOURCE_V3_BYTES: "35695"
      SOURCE_V3_SHA256: 9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507
      SOURCE_V4_BYTES: "35745"
      SOURCE_V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c
      SOURCE_WORKFLOW_SHA256: 89a6e660c306fd758cf416739633ef1e893928110b2198181699b358cd599b85
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      WALL_ID: UC-1356
      PRODUCTION: Master of the Daleks
      SOURCE_URL: https://tardis.fandom.com/wiki/Rastel
      SOURCE_PAGEID: "171335"
      SOURCE_REVISION: "3722691"
      SOURCE_CONTENT_SHA256: 740bc0ffb8732261d1df15661aa4e193c7a7f8d94aa96f96ac92c02e41ce8776
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      PRODUCT_URL: https://www.bigfinish.com/releases/v/doctor-who-dark-eyes-4-980
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      PORTRAIT_BYTES: "44412"
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      OLD_TASK: ap_cab2d7f95d930401627c1b30
      OLD_LEASE: lease_b8955992c5af735f9e40b242
      OLD_WALL: UC-1355
      OLD_ROLE: Merx
      OLD_PRODUCTION: UNIT: Encounters
      OLD_SOURCE_URL: https://tardis.fandom.com/wiki/Merx
      OLD_SOURCE_PAGEID: "233175"
      OLD_SOURCE_REVISION: "3363140"
      OLD_SOURCE_CONTENT_SHA256: 5fa09f17e86ef5868e36d860119c14867a0766b0b8d6da6cf8a739fb85509e4c
      OLD_SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      OLD_PRODUCT_URL: https://www.bigfinish.com/releases/v/unit-encounters-1531
      OLD_PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      OLD_PORTRAIT_BYTES: "46449"
      OLD_PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      OLD_CANDIDATE_PR: "726"
      OLD_CANDIDATE_HEAD: 992c1ae11106456fa20958aabe01a48c54f2e08c
      OLD_CANDIDATE_RUN: "31293712144"
      OLD_CANDIDATE_JOB: "93195270833"
      OLD_CANDIDATE_ARTIFACT: "9032284342"
      OLD_CANDIDATE_ZIP_SHA256: 31618c1732e5e9535e87643758093b481bc6b0e454f9b6c93ad98576aaafeb34
      OLD_CANDIDATE_IDENTITY: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      OLD_CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      OLD_CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      OLD_CANDIDATE_PATHS: "39"
      OLD_REVIEW_PR: "728"
      OLD_REVIEW_HEAD: 0d8c5c1623c92ce3c04c38e6cb6a5c24cae898cc
      OLD_REVIEW_RUN: "31294273106"
      OLD_REVIEW_JOB: "93196675184"
      OLD_REVIEW_ARTIFACT: "9032445196"
      OLD_REVIEW_ZIP_SHA256: 44b163750646ccd1d3dbcdcfb89a7d63c9ba5b54ca466285e5e73b07decb5e27
      OLD_REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338
      OLD_REVIEW_STATUS: cycle-010-merx-candidate-independently-approved-v1
      NEW_REVIEW_STATUS: cycle-011-rastel-v7-candidate-packet-independently-reconstructed-v1
      OLD_REVIEWED_AT: 2026-08-09T04:30:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind carrier and exact successful source-preflight artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,preflight,producer,source,draft,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$PREFLIGHT_BRANCH" -f per_page=100 > "$OUT/api/preflight-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'preflight-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['PREFLIGHT_BRANCH'] and row['merged'] is False]
          assert len(rows)==1, [(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_BASE']
          (api/'preflight-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'preflight-head.txt').write_text(source['head']['sha']+'\n')
          (api/'preflight-number.txt').write_text(str(source['number'])+'\n')
          PY
          preflight_head="$(cat "$OUT/api/preflight-head.txt")"
          preflight_pr="$(cat "$OUT/api/preflight-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$PREFLIGHT_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/preflight-runs.json"
            run_id="$(PREFLIGHT_HEAD="$preflight_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/preflight-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['PREFLIGHT_HEAD'] and row['name']==os.environ['PREFLIGHT_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/preflight-run.json"
              if [ "$(jq -r '.status' "$OUT/api/preflight-run.json")" = completed ]; then
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/preflight-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/preflight-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/preflight-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/preflight-artifacts.json"
          preflight_job="$(jq -r '.jobs[] | select(.name=="recover" and .conclusion=="success") | .id' "$OUT/api/preflight-jobs.json")"
          test -n "$preflight_job"
          preflight_artifact="$(PREFLIGHT_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/preflight-artifacts.json').read_text())['artifacts']
          expected=os.environ['PREFLIGHT_ARTIFACT_PREFIX']+os.environ['PREFLIGHT_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1, [(row['id'],row['name']) for row in rows]
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$preflight_artifact" > "$OUT/api/preflight-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$preflight_artifact/zip" > "$OUT/preflight.zip"
          preflight_sha="$(sha256sum "$OUT/preflight.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/preflight-artifact.json")" = "sha256:$preflight_sha"
          PREFLIGHT_PR="$preflight_pr" PREFLIGHT_HEAD="$preflight_head" PREFLIGHT_RUN="$run_id" PREFLIGHT_JOB="$preflight_job" PREFLIGHT_ARTIFACT="$preflight_artifact" PREFLIGHT_ZIP_SHA256="$preflight_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=root/'preflight'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'preflight.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in target.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file(): continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              ledger_root=sealed.parent; rows=0
              for raw in pre.read_text().splitlines():
                  digest,name=raw.split(None,1); path=ledger_root/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest
                  rows+=1
              ledgers.append({'root':ledger_root.relative_to(target).as_posix(),'rows':rows,'sha256':sha(pre.read_bytes())})
          assert ledgers
          def find_status(status):
              rows=[]
              for path in target.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status: rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows])
              return rows[0]
          preflight_path,preflight=find_status('cycle-011-rastel-finalizer-source-preflight-complete-v1')
          authority_path,authority=find_status('cycle-011-rastel-independent-review-authenticated')
          review_path,review=find_status('cycle-011-rastel-v7-candidate-packet-independently-reconstructed-v1')
          for data in (preflight,authority,review):
              identity=data.pop('identity')
              assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
              data['identity']=identity
          assert review['candidate']['task']==os.environ['TASK_ID'] and review['candidate']['wall']==os.environ['WALL_ID']
          assert review['candidate']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert review['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          source_runners=[p for p in target.rglob('*') if p.is_file() and p.stat().st_size==int(os.environ['SOURCE_V3_BYTES']) and sha(p.read_bytes())==os.environ['SOURCE_V3_SHA256']]
          source_workflows=[p for p in target.rglob('*') if p.is_file() and sha(p.read_bytes())==os.environ['SOURCE_WORKFLOW_SHA256']]
          assert len(source_runners)==1 and len(source_workflows)==1
          (root/'source/finalizer-v3.sh').write_bytes(source_runners[0].read_bytes())
          (root/'source/finalizer-v4-workflow.yml').write_bytes(source_workflows[0].read_bytes())
          (root/'receipt/source-preflight.json').write_text(json.dumps(preflight,indent=2,sort_keys=True)+'\n')
          (root/'receipt/candidate-authority.json').write_text(json.dumps(authority,indent=2,sort_keys=True)+'\n')
          (root/'receipt/candidate-review.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
          custody={'status':'cycle-011-rastel-source-preflight-artifact-authenticated','version':1,'source':{'pr':int(os.environ['PREFLIGHT_PR']),'head':os.environ['PREFLIGHT_HEAD'],'run':int(os.environ['PREFLIGHT_RUN']),'job':int(os.environ['PREFLIGHT_JOB']),'artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'artifact_sha256':os.environ['PREFLIGHT_ZIP_SHA256']},'ledgers':ledgers,'preflight_identity':preflight['identity'],'authority_identity':authority['identity'],'review_identity':review['identity']}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/preflight-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_BASE=%s\nPREFLIGHT_PR=%s\nPREFLIGHT_HEAD=%s\nPREFLIGHT_RUN=%s\nPREFLIGHT_JOB=%s\nPREFLIGHT_ARTIFACT=%s\nPREFLIGHT_ZIP_SHA256=%s\n' "$pr" "$head" "$base" "$preflight_pr" "$preflight_head" "$run_id" "$preflight_job" "$preflight_artifact" "$preflight_sha" >> "$GITHUB_ENV"

      - name: Bind exact producer packet, candidate receipt, and observer job
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$OUT/api/binding-env"
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); review=json.loads((root/'receipt/candidate-review.json').read_text()); authority=json.loads((root/'receipt/candidate-authority.json').read_text())
          producer=review['producer']; observer=authority['observer']; candidate=review['candidate']
          rows={
              'PRODUCER_PR':producer['pr'],'PRODUCER_HEAD':producer['head'],'PRODUCER_RUN':producer['run'],'PRODUCER_ARTIFACT':producer['artifact'],'PRODUCER_ZIP_SHA256':producer['artifact_sha256'],
              'OBSERVER_PR':observer['pr'],'OBSERVER_HEAD':observer['head'],'OBSERVER_RUN':observer['run'],'OBSERVER_ARTIFACT':observer['artifact'],'OBSERVER_ZIP_SHA256':observer['artifact_sha256'],'OBSERVER_IDENTITY':observer['identity'],
              'CANDIDATE_COMMIT':candidate['commit'],'CANDIDATE_PARENT':candidate['parent'],'CANDIDATE_TREE':candidate['tree'],'CANDIDATE_PATHS':candidate['paths'],
          }
          for key,value in rows.items(): print(f'{key}={value}')
          PY
          cat "$OUT/api/binding-env" >> "$GITHUB_ENV"
          source "$OUT/api/binding-env"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCER_PR" > "$OUT/api/producer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" > "$OUT/api/producer-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/jobs?per_page=100" > "$OUT/api/producer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT" > "$OUT/api/producer-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCER_ARTIFACT/zip" > "$OUT/producer.zip"
          test "$(sha256sum "$OUT/producer.zip" | awk '{print $1}')" = "$PRODUCER_ZIP_SHA256"
          producer_job="$(jq -r '.jobs[] | select(.name=="materialize" and .conclusion=="success") | .id' "$OUT/api/producer-jobs.json")"
          test -n "$producer_job"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN" > "$OUT/api/observer-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN/jobs?per_page=100" > "$OUT/api/observer-jobs.json"
          observer_job="$(jq -r '.jobs[] | select(.name=="observe" and .conclusion=="success") | .id' "$OUT/api/observer-jobs.json")"
          test -n "$observer_job"
          PRODUCER_JOB="$producer_job" OBSERVER_JOB="$observer_job" python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=root/'producer'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          pr=json.loads((root/'api/producer-pr.json').read_text()); run=json.loads((root/'api/producer-run.json').read_text()); jobs=json.loads((root/'api/producer-jobs.json').read_text())['jobs']; artifact=json.loads((root/'api/producer-artifact.json').read_text())
          assert pr['number']==int(os.environ['PRODUCER_PR']) and pr['head']['sha']==os.environ['PRODUCER_HEAD'] and pr['merged'] is False
          assert run['id']==int(os.environ['PRODUCER_RUN']) and run['head_sha']==os.environ['PRODUCER_HEAD'] and run['status']=='completed' and run['conclusion']=='success'
          job=next(row for row in jobs if row['id']==int(os.environ['PRODUCER_JOB']))
          assert job['name']=='materialize' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['PRODUCER_ARTIFACT']) and artifact['digest']=='sha256:'+os.environ['PRODUCER_ZIP_SHA256'] and artifact['expired'] is False
          with zipfile.ZipFile(root/'producer.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in target.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; rows=0
              for raw in pre.read_text().splitlines():
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; rows+=1
              ledgers.append({'root':base.relative_to(target).as_posix(),'rows':rows,'sha256':sha(pre.read_bytes())})
          assert ledgers
          matches=[]
          for path in target.rglob('*.json'):
              if path.stat().st_size>20_000_000:continue
              try:data=json.loads(path.read_text())
              except Exception:continue
              flat=json.dumps(data,sort_keys=True,ensure_ascii=False)
              score=sum((os.environ['TASK_ID'] in flat)*12,(os.environ['WALL_ID'] in flat)*10,(os.environ['CANDIDATE_COMMIT'] in flat)*10,(os.environ['CANDIDATE_TREE'] in flat)*10,(os.environ['EXPECTED_LEASE'] in flat)*8,('305' in flat and '11' in flat)*4,('candidate' in flat.lower())*2)
              if score<42:continue
              identity=data.get('identity')
              identity_valid=False
              if isinstance(identity,str) and re.fullmatch(r'[0-9a-f]{64}',identity):
                  clone=dict(data); clone.pop('identity')
                  identity_valid=sha(json.dumps(clone,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
                  if identity_valid:score+=10
              matches.append((score,path,data,identity_valid))
          matches.sort(key=lambda row:(-row[0],row[1].as_posix()))
          assert matches and matches[0][0]>=52,[(score,path.as_posix()) for score,path,_,_ in matches[:10]]
          top=[row for row in matches if row[0]==matches[0][0]]
          assert len(top)==1,[(score,path.as_posix()) for score,path,_,_ in top]
          score,path,receipt,identity_valid=top[0]
          assert os.environ['EXPECTED_LEASE'] in json.dumps(receipt,sort_keys=True)
          assert identity_valid
          candidate_identity=receipt['identity']
          observer_run=json.loads((root/'api/observer-run.json').read_text())
          observer_jobs=json.loads((root/'api/observer-jobs.json').read_text())['jobs']
          assert observer_run['id']==int(os.environ['OBSERVER_RUN']) and observer_run['head_sha']==os.environ['OBSERVER_HEAD'] and observer_run['conclusion']=='success'
          observer=next(row for row in observer_jobs if row['id']==int(os.environ['OBSERVER_JOB']))
          assert observer['name']=='observe' and observer['conclusion']=='success'
          reviewed_at=observer_run.get('updated_at') or observer_run.get('run_started_at')
          assert reviewed_at
          bindings={
              'status':'cycle-011-rastel-finalizer-exact-bindings-v1','version':1,
              'canonical':{'source_main':os.environ['SOURCE_MAIN'],'current_main':os.environ['CURRENT_BASE'],'tree':os.environ['SOURCE_TREE']},
