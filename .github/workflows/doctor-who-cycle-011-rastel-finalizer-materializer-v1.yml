      - name: Recover exact tracked-plus-untracked V4 finalizer source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); source=root/'source'
          raw=(source/'finalizer-v3.sh').read_bytes(); workflow=(source/'finalizer-v4-workflow.yml').read_bytes()
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert len(raw)==int(os.environ['SOURCE_V3_BYTES']) and sha(raw)==os.environ['SOURCE_V3_SHA256']
          assert sha(workflow)==os.environ['SOURCE_WORKFLOW_SHA256']
          workflow_text=workflow.decode('utf-8')
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",workflow_text,re.S)
          constants=[]
          for block in blocks:
              try:tree=ast.parse(block)
              except SyntaxError:continue
              for node in ast.walk(tree):
                  if isinstance(node,ast.Constant) and isinstance(node.value,str): constants.append(node.value)
          olds=[value for value in constants if 'git diff --name-only' in value and 'git ls-files --others --exclude-standard' not in value and value in raw.decode('utf-8')]
          news=[value for value in constants if 'git diff --name-only' in value and 'git ls-files --others --exclude-standard' in value]
          candidates=[]
          text=raw.decode('utf-8')
          for old in olds:
              for new in news:
                  if text.count(old)!=1:continue
                  patched=text.replace(old,new).encode('utf-8')
                  if len(patched)==int(os.environ['SOURCE_V4_BYTES']) and sha(patched)==os.environ['SOURCE_V4_SHA256']:
                      candidates.append((old,new,patched))
          assert len(candidates)==1,[(len(old),len(new),sha(patched)) for old,new,patched in candidates]
          old,new,patched=candidates[0]
          target=source/'finalizer-v4.sh'; target.write_bytes(patched)
          subprocess.run(['bash','-n',str(target)],check=True)
          py_blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",patched.decode('utf-8'),re.S)
          assert len(py_blocks)==3
          for index,block in enumerate(py_blocks):compile(block,f'<embedded-v4-{index}>','exec')
          diff=''.join(difflib.unified_diff(text.splitlines(True),patched.decode('utf-8').splitlines(True),fromfile='finalizer-v3.sh',tofile='finalizer-v4.sh'))
          (source/'v3-to-v4.patch').write_text(diff)
          receipt={'status':'exact-merx-v4-finalizer-source-reconstructed','version':1,'source':{'bytes':len(raw),'sha256':sha(raw)},'target':{'bytes':len(patched),'sha256':sha(patched)},'old_literal':old,'new_literal':new,'embedded_python':len(py_blocks)}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/v4-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Materialize placeholder-safe cycle shift without execution
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_BASE="$CURRENT_BASE" python3 - <<'PY'
          import difflib,hashlib,json,os,re,subprocess
          from collections import defaultdict
          from pathlib import Path
          root=Path(os.environ['OUT']); source=root/'source'; draft=root/'draft'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          bindings=json.loads((root/'receipt/bindings.json').read_text())
          raw=(source/'finalizer-v4.sh').read_bytes(); text=raw.decode('utf-8')
          assert len(raw)==int(os.environ['SOURCE_V4_BYTES']) and sha(raw)==os.environ['SOURCE_V4_SHA256']

          def git_show(path):
              return subprocess.check_output(['git','show',f"{os.environ['CURRENT_BASE']}:{path}"])
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',os.environ['CURRENT_BASE'],'--','data/review/adapter-sdk'],text=True).splitlines()
          receipts=[]
          for path in paths:
              if not path.endswith('.json'):continue
              try:data=json.loads(git_show(path))
              except Exception:continue
              flat=json.dumps(data,sort_keys=True,ensure_ascii=False)
              receipts.append((path,data,flat))
          source_prior=[row for row in receipts if 'doctor-who-cycle-009' in row[0] and 'Megnus Jaka' in row[2]]
          target_prior=[row for row in receipts if 'doctor-who-cycle-010' in row[0] and 'Merx' in row[2]]
          assert len(source_prior)==1,[(path) for path,_,_ in source_prior]
          assert len(target_prior)==1,[(path) for path,_,_ in target_prior]
          source_prior_path,source_prior_json,_=source_prior[0]
          target_prior_path,target_prior_json,_=target_prior[0]

          semantic_keys={'task','task_id','lease','lease_id','wall','wall_id','role','performer','mode','source_fingerprint','portrait_sha256','candidate_commit','candidate_tree','candidate_receipt','candidate_identity','review_identity','approval_identity','cycle','cycle_id','waterline_event','event_id','receipt_identity','identity','commit','tree','head','artifact_sha256'}
          def flatten(value,path=()):
              rows=[]
              if isinstance(value,dict):
                  for key,item in value.items():rows.extend(flatten(item,path+(key,)))
              elif isinstance(value,list):
                  for item in value:rows.extend(flatten(item,path+('[]',)))
              elif isinstance(value,(str,int)) and not isinstance(value,bool):
                  rows.append((path,value))
