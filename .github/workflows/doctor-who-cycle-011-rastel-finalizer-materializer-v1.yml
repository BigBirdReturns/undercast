              'boundary':{'finalizer_executed':False,'candidate_imported':False,'cycle_receipt_written':False,'product_commit_created':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
