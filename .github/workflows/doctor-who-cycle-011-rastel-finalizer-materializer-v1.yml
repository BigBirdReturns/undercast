          source_rows=flatten(source_prior_json); target_rows=flatten(target_prior_json)
          target_by_suffix=defaultdict(list)
          for path,value in target_rows:
              target_by_suffix[path[-1:] or ('',)].append((path,value))
              target_by_suffix[path[-2:] if len(path)>=2 else path].append((path,value))
          prior_pairs=[]
          used_targets=set()
          for path,value in source_rows:
              key=path[-1] if path else ''
              if isinstance(value,str):
                  if len(value)<8 and key not in semantic_keys:continue
              elif key not in semantic_keys:continue
              if str(value) not in text:continue
              candidates=[]
              for suffix in (path[-3:],path[-2:],path[-1:]):
                  candidates=[row for row in target_rows if row[0][-len(suffix):]==suffix and type(row[1]) is type(value)] if suffix else []
                  if len(candidates)==1:break
              if len(candidates)!=1:continue
              target_path,target_value=candidates[0]
              if value==target_value:continue
              token=f'__PRIOR_SHIFT_{len(prior_pairs):04d}__'
              prior_pairs.append({'source_path':path,'target_path':target_path,'old':value,'new':target_value,'token':token,'occurrences':text.count(str(value))})
          for row in prior_pairs:
              text=text.replace(str(row['old']),row['token'])

          current_map=[
              (os.environ['OLD_TASK'],os.environ['TASK_ID'],'current-task'),
              (os.environ['OLD_LEASE'],bindings['candidate']['lease'],'current-lease'),
              (os.environ['OLD_WALL'],os.environ['WALL_ID'],'current-wall'),
              (os.environ['OLD_ROLE'],os.environ['ROLE'],'current-role'),
              ('merx','rastel','current-role-lower'),
              (os.environ['OLD_PRODUCTION'],os.environ['PRODUCTION'],'current-production'),
              (os.environ['OLD_SOURCE_URL'],os.environ['SOURCE_URL'],'current-source-url'),
              (os.environ['OLD_SOURCE_PAGEID'],os.environ['SOURCE_PAGEID'],'current-source-page'),
              (os.environ['OLD_SOURCE_REVISION'],os.environ['SOURCE_REVISION'],'current-source-revision'),
              (os.environ['OLD_SOURCE_CONTENT_SHA256'],os.environ['SOURCE_CONTENT_SHA256'],'current-source-content'),
              (os.environ['OLD_SOURCE_FINGERPRINT'],os.environ['SOURCE_FINGERPRINT'],'current-source-fingerprint'),
              (os.environ['OLD_PRODUCT_URL'],os.environ['PRODUCT_URL'],'current-product-url'),
              (os.environ['OLD_PORTRAIT_SHA256'],os.environ['PORTRAIT_SHA256'],'current-portrait'),
              (os.environ['OLD_PORTRAIT_BYTES'],os.environ['PORTRAIT_BYTES'],'current-portrait-bytes'),
              (os.environ['OLD_PORTRAIT_ORIGIN'],os.environ['PORTRAIT_ORIGIN'],'current-portrait-origin'),
              (os.environ['OLD_CANDIDATE_PR'],str(bindings['producer']['pr']),'candidate-pr'),
              (os.environ['OLD_CANDIDATE_HEAD'],bindings['producer']['head'],'candidate-head'),
              (os.environ['OLD_CANDIDATE_RUN'],str(bindings['producer']['run']),'candidate-run'),
