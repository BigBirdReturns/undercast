name: star-trek-population-002-process

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-002-PROCESS.json"
      - ".github/workflows/star-trek-population-002-process.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-population-002-process
  cancel-in-progress: false

jobs:
  process:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify the committed Arridor lease and draft the exact result
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-process
          rm -rf "$out"
          mkdir -p "$out"
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const out='/tmp/star-trek-population-002-process';
          const command=JSON.parse(fs.readFileSync('.github/STAR-TREK-POPULATION-002-PROCESS.json','utf8'));
          const leasePath='data/review/trek-population-002-arridor-lease.json';
          const leaseBytes=fs.readFileSync(leasePath);
          const lease=JSON.parse(leaseBytes);
          if(command.lease_id!==lease.lease_id||command.task_id!==lease.tasks?.[0]?.id) throw new Error('process command does not match the committed Arridor lease');
          if(lease.lease_id!=='lease_346c1c420a89d489181c7267'||lease.tasks?.[0]?.performer!=='Dan Shor'||lease.tasks?.[0]?.character!=='Arridor') throw new Error('Arridor lease identity drifted');
          const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json','utf8'));
          const job=(state.jobs||[]).find(row=>row.id===command.task_id);
          if(!job||job.status!=='leased') throw new Error(`durable task is not leased: ${job?.status||'missing'}`);
          const existing=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).filter(row=>row.actor==='Dan Shor'&&row.character==='Arridor');
          if(existing.length) throw new Error(`Arridor is already canonical at ${existing.map(row=>row.id).join(', ')}`);
          const results={
            version:1,
            lease_id:lease.lease_id,
            agent:'luna',
            results:[{
              task_id:command.task_id,
              decision:'draft',
              draft:{
                character:'Arridor',
                actor:'Dan Shor',
                production:'Star Trek: The Next Generation / Star Trek: Voyager',
                universe:'Star Trek',
                years:'1989 / 1996',
                designer:'Michael Westmore',
                transform:5,
                kind:'face',
                knownFor:'American actor, director, and writer known for Ram in Tron, Billy the Kid in Bill & Ted’s Excellent Adventure, and Enoch Emery in Wise Blood.',
                reveal:'Dan Shor first played the Ferengi physician Arridor during the Barzan wormhole negotiations in The Next Generation. Seven years later he returned in Voyager, where the stranded Arridor and Kol had reinvented themselves as holy sages and built a profitable rule over the Takarians.',
                references:[
                  {claim:'performance',label:'Arridor was played by Dan Shor in The Price and False Profits',source:'https://memory-alpha.fandom.com/wiki/Arridor',publisher:'Memory Alpha'},
                  {claim:'design-build',label:'Michael Westmore refined and produced the Ferengi facial design developed from Andrew Probert’s concept',source:'https://memory-alpha.fandom.com/wiki/Ferengi',publisher:'Memory Alpha'},
                  {claim:'production',label:'False Profits credits Dan Shor as Arridor',source:'https://tv.apple.com/us/episode/false-profits/umc.cmc.28cjfyqf9iytfsooevt2ymxc9?showId=umc.cmc.3nelr2c27ahdxh47xw68p0o04',publisher:'Apple TV'},
                  {claim:'biography',label:'Dan Shor is known for Tron, Bill & Ted’s Excellent Adventure, and Wise Blood',source:'https://en.wikipedia.org/wiki/Dan_Shor',publisher:'Wikipedia'}
                ],
                wiki:'https://en.wikipedia.org/wiki/Dan_Shor'
              }
            }]
          };
          fs.writeFileSync('data/review/trek-population-002-arridor-results.json',JSON.stringify(results,null,2)+'\n');
          fs.writeFileSync(`${out}/lease-receipt.json`,JSON.stringify({lease_id:lease.lease_id,task_id:command.task_id,lease_sha256:crypto.createHash('sha256').update(leaseBytes).digest('hex'),source_fingerprint:lease.tasks[0].source_fingerprint},null,2)+'\n');
          NODE
      - name: Submit, grow, and retrieve only the Arridor card
        env:
          CONTACT: bigbirdreturns@proton.me
          IMAGE_MODE: loose
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-process
          before_count=$(node -e "console.log(require('./data/specimens.json').length)")
          node scripts/autopilot.mjs submit \
            --batch data/review/trek-population-002-arridor-lease.json \
            --input data/review/trek-population-002-arridor-results.json \
            | tee "$out/submit.log"
          node scripts/grow.mjs --drafts | tee "$out/grow.log"
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).filter(row=>row.actor==='Dan Shor'&&row.character==='Arridor');
          if(rows.length!==1) throw new Error(`expected one canonical Arridor card, found ${rows.length}`);
          fs.writeFileSync('/tmp/star-trek-population-002-process/wall-id.txt',rows[0].id+'\n');
          fs.writeFileSync('/tmp/star-trek-population-002-process/record-after-grow.json',JSON.stringify(rows[0],null,2)+'\n');
          NODE
          wall_id=$(tr -d '\n' < "$out/wall-id.txt")
          after_count=$(node -e "console.log(require('./data/specimens.json').length)")
          test "$after_count" -eq $((before_count+1))
          RETRIEVE_ONLY="$wall_id" RETRIEVE_MAX=1 node scripts/retrieve.mjs | tee "$out/retrieve.log"
          node scripts/credits.mjs | tee "$out/credits.log"
          node scripts/sync-sources.mjs | tee "$out/sync-sources.log"
          node scripts/shard.mjs | tee "$out/shard.log"
          node scripts/build-contract.mjs | tee "$out/build-contract.log"
          node scripts/autopilot.mjs sync | tee "$out/autopilot-sync.log"
          node scripts/media-audit.mjs sync | tee "$out/media-audit-sync.log"
          node scripts/media-audit.mjs status --scope star-trek --json > "$out/media-status.json"
          node scripts/autopilot.mjs status --scope star-trek --json > "$out/autopilot-status.json"
          node scripts/validate.mjs | tee "$out/validate.log"
      - name: Retain the exact Arridor candidate and media packet
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-process
          wall_id=$(tr -d '\n' < "$out/wall-id.txt")
          node scripts/media-audit.mjs next \
            --scope star-trek \
            --reviewer luna \
            --role machine \
            --limit 2 \
            --out "$out/media-packet.json" \
            --html "$out/media-sheet.html" \
            > "$out/media-packet-stdout.json"
          WALL_ID="$wall_id" node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const out='/tmp/star-trek-population-002-process';
          const id=process.env.WALL_ID;
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const sources=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const record=specimens.find(row=>row.id===id);
          const source=sources.find(row=>row.id===id);
          const items=(audit.items||[]).filter(row=>row.wall_id===id);
          if(!record||!source||items.length!==2) throw new Error('candidate record, source row, or audit facets are incomplete');
          const context={version:1,wall_id:id,lease_id:'lease_346c1c420a89d489181c7267',task_id:'ap_06b3c87ad3a1485e80ba650c',record,source,audit_items:items};
          fs.writeFileSync('data/review/trek-population-002-arridor-context.json',JSON.stringify(context,null,2)+'\n');
          fs.writeFileSync(`${out}/context.json`,JSON.stringify(context,null,2)+'\n');
          const copied=[];
          for(const side of ['still','portrait']){
            const asset=record[side];
            if(!asset?.src) continue;
            const bytes=fs.readFileSync(asset.src);
            const target=`${out}/${side}-${asset.src.split('/').pop()}`;
            fs.copyFileSync(asset.src,target);
            copied.push({side,path:asset.src,artifact:target.split('/').pop(),bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),origin:asset.origin,kind:asset.kind});
          }
          fs.writeFileSync(`${out}/assets.json`,JSON.stringify(copied,null,2)+'\n');
          NODE
          (cd "$out" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          git status --short > "$out/status-before-commit.txt"
      - name: Commit the merged candidate and remove the processing operator
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-process
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          rm -f .github/STAR-TREK-POPULATION-002-PROCESS.json
          rm -f .github/workflows/star-trek-population-002-process.yml
          git add -A
          git diff --cached --check
          git commit -m "Population: add Dan Shor as Arridor"
          git show --stat --oneline HEAD > "$out/commit.txt"
          git push origin HEAD:agent/star-trek-population-002
      - name: Upload the Arridor candidate for exact-subject review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-arridor-candidate-${{ github.run_id }}
          path: /tmp/star-trek-population-002-process
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
