name: star-trek-anastasia-finalizer-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-anastasia-finalizer-recovery-v2

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: star-trek-anastasia-finalizer-recovery-v2
  cancel-in-progress: false

env:
  CURRENT_MAIN: 933415b505d1c6e40c7e4bd44bf132c61a5ea32d
  CURRENT_TREE: 651edbcfb9efd3b6d9189f8903afa1a8d88677d4
  QUEEN_PARENT: 97956ce415d565d968cc5f66067142183ec28a1f
  QUEEN_TREE: ff8adadb6dd36ab84a21336bdd30ce3cb17b5335
  OLD_CANDIDATE: 9330681b10c681ff08c2889be18b47671ff47401
  OLD_CANDIDATE_TREE: a7f952e76600a148e99fe44fa694bb98ef1ea67b
  CANDIDATE_PATH_COUNT: "44"
  CANDIDATE_PATH_LEDGER_SHA256: 6374da8128b6d0047fa9e197760eb2976fe915cc6968b320b83bce0dd31e1b31
  ORIGINAL_RUN: "32619140152"
  ORIGINAL_STAGE_ARTIFACT: "9487851739"
  ORIGINAL_STAGE_DIGEST: 19046c8b4f9ef68d71628816184276e7f69fc98179ab9da9f635fd84efc2798e
  ORIGINAL_REVIEW_ARTIFACT: "9487860916"
  ORIGINAL_REVIEW_DIGEST: 6712542cd1d77718c564663b0fd5d16b0f81654c3115c83dc0338c7cbc02b532
  ORIGINAL_REVIEW_SHA256: a981414aa4d8066d6bc6fdedae402a01a96bf1ee8a3476c2189e359d88d229d5
  ORIGINAL_FINALIZATION_ARTIFACT: "9487877149"
  ORIGINAL_FINALIZATION_DIGEST: fb7c90e325e2eba7b5bf96babc53ab71524be7e96a4a136cabb36ae68dbadbb6
  CONTROLLER_SOURCE_BRANCH: agent/anastasia-rebind-inspection-result-v1
  CONTROLLER_SOURCE_PATH: transport/anastasia-rebind-inspection-v1/anastasia-controller.mjs
  CONTROLLER_SHA256: 2eaaa9de01ab5b529df6cf17183c72ad099fef1837177d5d5411365c1cf5f76d
  REBASED_CANDIDATE_BRANCH: agent/star-trek-anastasia-candidate-rebased-v1
  OLD_CANDIDATE_BRANCH: agent/star-trek-anastasia-candidate-v1
  OLD_CYCLE_BRANCH: agent/star-trek-anastasia-cycle-v1
  RECOVERY_BRANCH: agent/star-trek-anastasia-finalizer-recovery-v2
  RESULT_BRANCH: agent/star-trek-anastasia-recovery-result-v2
  TASK_ID: ap_82712ddec2c606e4c7d1a152
  SOURCE_FINGERPRINT: 8c45968f68d0b1afab3be38b612d0cee8a3c0ed1ae424cbc3ff51993aac39060
  MEDIA_CANONICAL_PARENT: 97956ce415d565d968cc5f66067142183ec28a1f
  MEDIA_RUN: "32609675555"
  MEDIA_HEAD: fd0c91d94128182423857d0be506f7a49bf934cd
  MEDIA_ARTIFACT: "9485147987"
  MEDIA_DIGEST: c7e507c8e791204c96fa5c54cdf27cb15a113487785868df6d78cf09444f0bfb
  CONTROLLER: /tmp/star-trek-anastasia-controller-v1.mjs
  RECOVERY_CONTROLLER: /tmp/star-trek-anastasia-finalizer-recovery-v2.sh
  RECOVERY_CONTROLLER_SHA256: 0df2a9da6afe9c62f3f6f1a947df2dbf0f121b65033003ed9caeee92cf620b3a
  RECOVERY_CONTROLLER_B64_SHA256: 11751d8ea328fe86aa03c4120c630e74e6c98a27abe44c8d4496145db573aa21
  STAGE_ROOT: /tmp/star-trek-anastasia-rebound-stage-v2
  REVIEW_ROOT: /tmp/star-trek-anastasia-rebound-review-v2
  FINAL_ROOT: /tmp/star-trek-anastasia-recovery-final-v2
  DIAGNOSTIC_ROOT: /tmp/star-trek-anastasia-recovery-diagnostics-v2

jobs:
  rebase:
    name: rebind-reviewed-anastasia-candidate
    if: ${{ github.event.head_commit.message == 'Trigger Anastasia finalizer recovery v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      candidate_commit: ${{ steps.rebase.outputs.candidate_commit }}
      candidate_tree: ${{ steps.rebase.outputs.candidate_tree }}
      candidate_path_count: ${{ steps.rebase.outputs.candidate_path_count }}
      candidate_path_ledger_sha256: ${{ steps.rebase.outputs.candidate_path_ledger_sha256 }}
      stage_receipt_sha256: ${{ steps.rebase.outputs.stage_receipt_sha256 }}
      artifact_id: ${{ steps.stage_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.stage_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download original staged candidate receipt
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-stage-v1
          path: /tmp/original-anastasia-stage-v1
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN }}
          github-token: ${{ github.token }}

      - name: Download original independent review
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-independent-review-v1
          path: /tmp/original-anastasia-review-v1
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN }}
          github-token: ${{ github.token }}

      - name: Download original qualified finalization failure
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-finalization-failure-32619140152
          path: /tmp/original-anastasia-finalization-failure-v1
          repository: ${{ github.repository }}
          run-id: ${{ env.ORIGINAL_RUN }}
          github-token: ${{ github.token }}

      - name: Reconstruct sealed recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-finalizer-recovery-v2/controller.sh.gz.b64.part-* > /tmp/anastasia-recovery-controller.b64
          echo "${RECOVERY_CONTROLLER_B64_SHA256}  /tmp/anastasia-recovery-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-recovery-controller.b64 | gzip -d > "$RECOVERY_CONTROLLER"
          echo "${RECOVERY_CONTROLLER_SHA256}  ${RECOVERY_CONTROLLER}" | sha256sum -c -
          bash -n "$RECOVERY_CONTROLLER"
          chmod +x "$RECOVERY_CONTROLLER"

      - name: Rebind exact reviewed candidate onto current maintenance descendant
        id: rebase
        shell: bash
        run: $RECOVERY_CONTROLLER rebase

      - name: Upload rebound stage receipt
        id: stage_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-rebound-stage-v2
          path: /tmp/star-trek-anastasia-rebound-stage-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve rebind failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-rebind-failure-${{ github.run_id }}
          path: |
            /tmp/star-trek-anastasia-rebound-stage-v2/
            /tmp/star-trek-anastasia-recovery-diagnostics-v2/
          if-no-files-found: warn
          retention-days: 30

  review:
    name: independently-review-rebound-anastasia-candidate
    needs: rebase
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_COMMIT: ${{ needs.rebase.outputs.candidate_commit }}
      CANDIDATE_TREE: ${{ needs.rebase.outputs.candidate_tree }}
      REBOUND_STAGE_ARTIFACT_ID: ${{ needs.rebase.outputs.artifact_id }}
      REBOUND_STAGE_ARTIFACT_DIGEST: ${{ needs.rebase.outputs.artifact_digest }}
    outputs:
      review_sha256: ${{ steps.review.outputs.review_sha256 }}
      artifact_id: ${{ steps.review_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.review_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download rebound stage receipt
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-rebound-stage-v2
          path: /tmp/star-trek-anastasia-rebound-stage-v2

      - name: Reconstruct sealed recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-finalizer-recovery-v2/controller.sh.gz.b64.part-* > /tmp/anastasia-recovery-controller.b64
          echo "${RECOVERY_CONTROLLER_B64_SHA256}  /tmp/anastasia-recovery-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-recovery-controller.b64 | gzip -d > "$RECOVERY_CONTROLLER"
          echo "${RECOVERY_CONTROLLER_SHA256}  ${RECOVERY_CONTROLLER}" | sha256sum -c -
          bash -n "$RECOVERY_CONTROLLER"
          chmod +x "$RECOVERY_CONTROLLER"

      - name: Independently review exact rebound candidate
        id: review
        shell: bash
        run: $RECOVERY_CONTROLLER review

      - name: Upload independent rebound review
        id: review_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-rebound-independent-review-v2
          path: /tmp/star-trek-anastasia-rebound-review-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve review failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-rebound-review-failure-${{ github.run_id }}
          path: |
            /tmp/star-trek-anastasia-rebound-stage-v2/
            /tmp/star-trek-anastasia-rebound-review-v2/
            /tmp/star-trek-anastasia-controller-v1.mjs
          if-no-files-found: warn
          retention-days: 30

  finalize:
    name: finalize-publish-and-deploy-recovered-anastasia-cycle
    needs: [rebase, review]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_COMMIT: ${{ needs.rebase.outputs.candidate_commit }}
      CANDIDATE_TREE: ${{ needs.rebase.outputs.candidate_tree }}
      REBOUND_STAGE_ARTIFACT_ID: ${{ needs.rebase.outputs.artifact_id }}
      REBOUND_STAGE_ARTIFACT_DIGEST: ${{ needs.rebase.outputs.artifact_digest }}
      REBOUND_REVIEW_ARTIFACT_ID: ${{ needs.review.outputs.artifact_id }}
      REBOUND_REVIEW_ARTIFACT_DIGEST: ${{ needs.review.outputs.artifact_digest }}
      REBOUND_REVIEW_SHA256: ${{ needs.review.outputs.review_sha256 }}
    outputs:
      product_commit: ${{ steps.publish.outputs.product_commit }}
      product_tree: ${{ steps.publish.outputs.product_tree }}
      pages_run: ${{ steps.publish.outputs.pages_run }}
      receipt_sha256: ${{ steps.publish.outputs.receipt_sha256 }}
      checker_sha256: ${{ steps.publish.outputs.checker_sha256 }}
      reviewed_cycle: ${{ steps.publish.outputs.reviewed_cycle }}
      next_task: ${{ steps.publish.outputs.next_task }}
      artifact_id: ${{ steps.terminal_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.terminal_artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download rebound stage receipt
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-rebound-stage-v2
          path: /tmp/star-trek-anastasia-rebound-stage-v2

      - name: Download independent rebound review
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-rebound-independent-review-v2
          path: /tmp/star-trek-anastasia-rebound-review-v2

      - name: Reconstruct sealed recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-finalizer-recovery-v2/controller.sh.gz.b64.part-* > /tmp/anastasia-recovery-controller.b64
          echo "${RECOVERY_CONTROLLER_B64_SHA256}  /tmp/anastasia-recovery-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-recovery-controller.b64 | gzip -d > "$RECOVERY_CONTROLLER"
          echo "${RECOVERY_CONTROLLER_SHA256}  ${RECOVERY_CONTROLLER}" | sha256sum -c -
          bash -n "$RECOVERY_CONTROLLER"
          chmod +x "$RECOVERY_CONTROLLER"

      - name: Finalize, refresh adapter baseline, publish, and deploy
        id: publish
        shell: bash
        run: $RECOVERY_CONTROLLER finalize

      - name: Upload terminal recovery evidence
        id: terminal_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-recovery-terminal-v2
          path: /tmp/star-trek-anastasia-recovery-final-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve recovery failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-recovery-failure-${{ github.run_id }}
          path: |
            /tmp/star-trek-anastasia-rebound-stage-v2/
            /tmp/star-trek-anastasia-rebound-review-v2/
            /tmp/star-trek-anastasia-recovery-final-v2/
            /tmp/star-trek-anastasia-recovery-diagnostics-v2/
            /tmp/star-trek-anastasia-controller-v1.mjs
          if-no-files-found: warn
          retention-days: 30

  publish_result:
    name: publish-anastasia-recovery-terminal-locator
    needs: finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_COMMIT: ${{ needs.finalize.outputs.product_commit }}
      PRODUCT_TREE: ${{ needs.finalize.outputs.product_tree }}
      PAGES_RUN: ${{ needs.finalize.outputs.pages_run }}
      TERMINAL_ARTIFACT_ID: ${{ needs.finalize.outputs.artifact_id }}
      TERMINAL_ARTIFACT_DIGEST: ${{ needs.finalize.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download terminal recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-recovery-terminal-v2
          path: /tmp/star-trek-anastasia-recovery-final-v2

      - name: Reconstruct sealed recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-finalizer-recovery-v2/controller.sh.gz.b64.part-* > /tmp/anastasia-recovery-controller.b64
          echo "${RECOVERY_CONTROLLER_B64_SHA256}  /tmp/anastasia-recovery-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-recovery-controller.b64 | gzip -d > "$RECOVERY_CONTROLLER"
          echo "${RECOVERY_CONTROLLER_SHA256}  ${RECOVERY_CONTROLLER}" | sha256sum -c -
          bash -n "$RECOVERY_CONTROLLER"
          chmod +x "$RECOVERY_CONTROLLER"

      - name: Publish terminal locator
        shell: bash
        run: $RECOVERY_CONTROLLER publish_result
