name: doctor-who-cycle-010-merx-final-product-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-product-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-product-v4
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-product-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      EXACT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      BRANCH: agent/doctor-who-cycle-010-merx-final-product-v4
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-product-v4.yml
      OUT: /tmp/doctor-who-cycle-010-merx-final-product-v4
      WORKTREE: /tmp/doctor-who-cycle-010-merx-final-product-v4-worktree
      FINALWT: /tmp/doctor-who-cycle-010-merx-final-product-v4-final
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      CANDIDATE_PR: "726"
      CANDIDATE_HEAD: 992c1ae11106456fa20958aabe01a48c54f2e08c
      CANDIDATE_RUN: "31293712144"
      CANDIDATE_JOB: "93195270833"
      CANDIDATE_ARTIFACT: "9032284342"
      CANDIDATE_ZIP_SHA256: 31618c1732e5e9535e87643758093b481bc6b0e454f9b6c93ad98576aaafeb34
      CANDIDATE_RECEIPT_ID: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      CANDIDATE_PATHS_SHA256: 05307b2badf8a61cf4200453e3cb8895623cafa1fc448bcd8362d640d5be5548

      REVIEW_PR: "728"
      REVIEW_HEAD: 0d8c5c1623c92ce3c04c38e6cb6a5c24cae898cc
      REVIEW_RUN: "31294273106"
      REVIEW_JOB: "93196675184"
      REVIEW_ARTIFACT: "9032445196"
      REVIEW_ZIP_SHA256: 44b163750646ccd1d3dbcdcfb89a7d63c9ba5b54ca466285e5e73b07decb5e27
      REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338

      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      SOURCE_URL: https://tardis.fandom.com/wiki/Merx
      SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      PORTRAIT_PATH: images/uc-1355-portrait.jpg
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      REVIEWED_AT: "2026-08-09T04:30:00Z"
      COMMIT_AT: "2026-08-09T04:35:00Z"

      SOURCE_RUNNER_B64_SHA256: 3bd60a97b181fb8c89482a6ddb282fe9fe70163618e7086540d27e2aae174eac
      SOURCE_RUNNER_GZIP_SHA256: 5e4b5aca1cbc246f93218608a29f1e116b72b860d50ea7dc62121c8015ef1d3b
      SOURCE_RUNNER_SHA256: 9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507
      SOURCE_RUNNER_BYTES: "35695"
      RUNNER_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c
      RUNNER_BYTES: "35745"

      FAILED_V3_PR: "732"
      FAILED_V3_HEAD: 10be3deb81930f8f6150f2e5d2b2114c438aeb32
      FAILED_V3_RUN: "31295975212"
      FAILED_V3_JOB: "93201014004"
      FAILED_V3_ARTIFACT: "9032952138"
      FAILED_V3_ARTIFACT_DIGEST: sha256:7225c294decab4387cc7545f2a527cb3500175ab37d4fbf988ffc626e141c89b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact V3 failure and reconstruct finalizer source
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-010-merx-finalizer-v4
          rm -rf "$root"
          mkdir -p "$root" "$OUT/api"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$FAILED_V3_PR" > "$OUT/api/v3-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_V3_RUN" > "$OUT/api/v3-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_V3_RUN/jobs?per_page=100" > "$OUT/api/v3-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_V3_ARTIFACT" > "$OUT/api/v3-artifact.json"
          ROOT="$OUT" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'api'
          own=json.loads((root/'carrier-pr.json').read_text())
          v3=json.loads((root/'v3-pr.json').read_text())
          run=json.loads((root/'v3-run.json').read_text())
          jobs=json.loads((root/'v3-jobs.json').read_text())['jobs']
          artifact=json.loads((root/'v3-artifact.json').read_text())
          assert own['number']==int(os.environ['PR_NUMBER']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['EXACT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['PR_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v3['number']==int(os.environ['FAILED_V3_PR']) and v3['head']['sha']==os.environ['FAILED_V3_HEAD']
          assert run['id']==int(os.environ['FAILED_V3_RUN']) and run['head_sha']==os.environ['FAILED_V3_HEAD']
          assert run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['FAILED_V3_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Reconstruct and compile exact receipt-bearing finalizer V3']==('completed','success')
          assert steps['Execute exact receipt-bearing Merx finalizer V3']==('completed','failure')
          assert artifact['id']==int(os.environ['FAILED_V3_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['FAILED_V3_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['FAILED_V3_RUN']) and artifact['workflow_run']['head_sha']==os.environ['FAILED_V3_HEAD']
          PY
          : > "$root/source-runner.gz.b64"
          for blob in b3ed61546b72f43d24295e47564128353a9fe18a 62276da5eb96b0a6b41d1aa723642ad14c2dd961 ae55ce9299b827a4c2ba73160815afed74fd12ce 556aca3fb73c230a0cde77a04c1429e1fb674d60 a5f0e05ae94a59f9e8ce13fb0ed17598a91f5712 24c47d32727787c4919da04bd1c1544b6709f80b 9e5c656dbd2555e6631eef97bf8b74fa49a67cff; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/source-runner.gz.b64"
          done
          test "$(sha256sum "$root/source-runner.gz.b64" | awk '{print $1}')" = "$SOURCE_RUNNER_B64_SHA256"
          base64 -d "$root/source-runner.gz.b64" > "$root/source-runner.sh.gz"
          test "$(sha256sum "$root/source-runner.sh.gz" | awk '{print $1}')" = "$SOURCE_RUNNER_GZIP_SHA256"
          gzip -dc "$root/source-runner.sh.gz" > "$root/runner.sh"
          test "$(wc -c < "$root/runner.sh" | tr -d ' ')" = "$SOURCE_RUNNER_BYTES"
          test "$(sha256sum "$root/runner.sh" | awk '{print $1}')" = "$SOURCE_RUNNER_SHA256"

      - name: Repair tracked-plus-untracked closure census
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-010-merx-finalizer-v4
          RUNNER="$root/runner.sh" python3 - <<'PY'
          import hashlib,os,re
          from pathlib import Path
          path=Path(os.environ['RUNNER'])
          text=path.read_text()
          old='  test "$(git diff --name-only "$CANDIDATE_COMMIT" | sort)" = "$CLOSURE_PATHS"\n'
          new='  test "$({ git diff --name-only "$CANDIDATE_COMMIT"; git ls-files --others --exclude-standard; } | sort -u)" = "$CLOSURE_PATHS"\n'
          assert text.count(old)==1
          text=text.replace(old,new)
          assert old not in text and text.count(new)==1
          path.write_text(text)
          assert len(path.read_bytes())==int(os.environ['RUNNER_BYTES'])
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['RUNNER_SHA256']
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for i,block in enumerate(blocks): compile(block,f'<embedded-{i}>','exec')
          PY
          bash -n "$root/runner.sh"

      - name: Execute exact receipt-bearing Merx finalizer V4
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-010-merx-finalizer-v4/runner.sh
          exec /tmp/doctor-who-cycle-010-merx-finalizer-v4/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-product-v4/final
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-product-v4
            /tmp/doctor-who-cycle-010-merx-finalizer-v4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
