name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRIOR_INSTALLED_MAIN: f5a110909ed42a52917bd25e511610f73f5610f2
      INSTALLED_MAIN: 120a81e988c045695b55089afe5f8e3d82012f8d
      PREFIX: agent/doctor-who-cycle-011-rastel-
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v3.yml
      INSTALLER_PR: "852"
      INSTALLER_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-writer-v3-install-v1
      INSTALLER_HEAD: 120a81e988c045695b55089afe5f8e3d82012f8d
      PRIOR_AUTH_ARTIFACT: "9051464025"
      PRIOR_AUTH_SHA256: 3fd203856202cc4cab4df9781728b9c0bb86b1345b6b6e41979b89a7aebe9d58
      PRIOR_AUTH_IDENTITY: 2d75c2bd70c17bc2444cc64b092766655bd9121d8ca1f6226cb28e087e067ba8
      FAILED_WRITER_RUN: "31358495084"
      FAILED_WRITER_JOB: "93362553005"
      FAILED_WRITER_ARTIFACT: "9051469595"
      FAILED_WRITER_SHA256: cf670d236e6186453c5fc64383ded700271354960216663d8a8a5a9a1ad8d0bb
      OBSERVER_PR: "851"
      OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-resume-v2
      OBSERVER_HEAD: 497c9edaf17363eac78e2875169baa436fbdb83f
      OBSERVER_RUN: "31358795145"
      OBSERVER_JOB: "93363387594"
      OBSERVER_ARTIFACT: "9051573930"
      OBSERVER_SHA256: f53da84fa2275de5329f07a4c851aa7a203481b6d954ee132915070e6fcfa374
      OBSERVER_IDENTITY: ed5eb2d2d516f48f74f12dff2e1446006ff1ca41ddeca449b0195991c017f706
      BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact verifier carrier and installed three-writer topology
        id: carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,prior,failed,observer,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$INSTALLED_MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          git diff --name-status "$CANONICAL_MAIN" "$INSTALLED_MAIN" | LC_ALL=C sort > "$OUT/logs/installed.tsv"
          printf 'A\t%s\nA\t%s\nA\t%s\n' "$WRITER_V1" "$WRITER_V2" "$WRITER_V3" | LC_ALL=C sort > "$OUT/logs/expected.tsv"
          cmp "$OUT/logs/installed.tsv" "$OUT/logs/expected.tsv"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$OUT/api/own-jobs.json"
          CURRENT_PR="$pr" CURRENT_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          own = json.loads((root / 'own-pr.json').read_text())
          jobs = json.loads((root / 'own-jobs.json').read_text())['jobs']
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['merged_at'] is None
          assert own['base']['sha'] == os.environ['CURRENT_BASE']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1
          matches = [row for row in jobs if row['name'] == 'verify']
          assert len(matches) == 1
          (root / 'own-job.txt').write_text(str(matches[0]['id']) + '\n')
          PY
          printf 'CURRENT_PR=%s\nCURRENT_HEAD=%s\nCURRENT_JOB=%s\n' "$pr" "$head" "$(cat "$OUT/api/own-job.txt")" >> "$GITHUB_ENV"

      - name: Authenticate prior authorization, failed V2 writer, and independent observation
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_AUTH_ARTIFACT" > "$OUT/api/prior-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_AUTH_ARTIFACT/zip" > "$OUT/prior/prior.zip"
          test "$(sha256sum "$OUT/prior/prior.zip" | awk '{print $1}')" = "$PRIOR_AUTH_SHA256"
          test "$(jq -r '.digest' "$OUT/api/prior-artifact.json")" = "sha256:$PRIOR_AUTH_SHA256"

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_WRITER_RUN" > "$OUT/api/failed-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_WRITER_RUN/jobs?per_page=100" > "$OUT/api/failed-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_WRITER_ARTIFACT" > "$OUT/api/failed-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_WRITER_ARTIFACT/zip" > "$OUT/failed/failed.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_WRITER_JOB/logs" > "$OUT/failed/writer.log"
          test "$(sha256sum "$OUT/failed/failed.zip" | awk '{print $1}')" = "$FAILED_WRITER_SHA256"
          test "$(jq -r '.digest' "$OUT/api/failed-artifact.json")" = "sha256:$FAILED_WRITER_SHA256"
          grep -F "KeyError: 'merged'" "$OUT/failed/writer.log"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$OBSERVER_PR" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN" > "$OUT/api/observer-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN/jobs?per_page=100" > "$OUT/api/observer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$OBSERVER_ARTIFACT" > "$OUT/api/observer-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$OBSERVER_ARTIFACT/zip" > "$OUT/observer/observer.zip"
          test "$(sha256sum "$OUT/observer/observer.zip" | awk '{print $1}')" = "$OBSERVER_SHA256"
          test "$(jq -r '.digest' "$OUT/api/observer-artifact.json")" = "sha256:$OBSERVER_SHA256"

          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          def extract(label, zip_path):
              target = root / label / 'extracted'
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(zip_path) as archive:
                  infos = archive.infolist()
                  assert infos and len(infos) == len({row.filename for row in infos})
                  for info in infos:
                      path = PurePosixPath(info.filename)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                      mode = (info.external_attr >> 16) & 0xffff
                      assert not stat.S_ISLNK(mode)
                      if info.is_dir():
                          continue
                      out = target / path
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(archive.read(info))
              ledgers = [target / 'SHA256SUMS.pre', target / 'SHA256SUMS']
              if all(path.is_file() for path in ledgers):
                  pre, sealed = ledgers
                  assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
                  for raw in pre.read_text().splitlines():
                      if not raw.strip():
                          continue
                      digest, name = raw.split(None, 1)
                      path = target / name.lstrip('*')
                      assert path.is_file() and sha(path.read_bytes()) == digest
              return target
          prior_root = extract('prior', root / 'prior/prior.zip')
          failed_root = extract('failed', root / 'failed/failed.zip')
          observer_root = extract('observer', root / 'observer/observer.zip')

          prior = json.loads((prior_root / 'authorization.json').read_text())
          identity = prior.pop('identity')
          assert identity == os.environ['PRIOR_AUTH_IDENTITY']
          assert sha(json.dumps(prior, sort_keys=True, separators=(',', ':')).encode()) == identity
          prior['identity'] = identity
          assert prior['status'] == 'cycle-011-rastel-cleanup-resume-authorized-v1'
          assert prior['version'] == 1
          assert prior['canonical']['installed_main'] == os.environ['PRIOR_INSTALLED_MAIN']
          assert prior['canonical']['proved_commit'] == os.environ['CANONICAL_MAIN']
          assert prior['canonical']['tree'] == os.environ['CANONICAL_TREE']
          assert prior['canonical']['writer_paths'] == [os.environ['WRITER_V1'], os.environ['WRITER_V2']]
          assert prior['counts']['current_prefix_refs'] == 90 and len(prior['refs']) == 90
          assert len(prior['pull_requests']) == 2 and len(prior['auxiliary_refs']) == 1

          api = root / 'api'
          failed_run = json.loads((api / 'failed-run.json').read_text())
          failed_jobs = json.loads((api / 'failed-jobs.json').read_text())['jobs']
          failed_artifact = json.loads((api / 'failed-artifact.json').read_text())
          assert failed_run['id'] == int(os.environ['FAILED_WRITER_RUN'])
          assert failed_run['event'] == 'workflow_run'
          assert failed_run['head_sha'] == os.environ['PRIOR_INSTALLED_MAIN']
          assert failed_run['status'] == 'completed' and failed_run['conclusion'] == 'failure'
          rows = [row for row in failed_jobs if row['id'] == int(os.environ['FAILED_WRITER_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'write' and rows[0]['conclusion'] == 'failure'
          steps = {row['name']: row['conclusion'] for row in rows[0].get('steps', [])}
          assert steps['Bind exact two-writer installation and successful resume verifier'] == 'failure'
          assert steps['Authenticate exact resume authorization'] == 'skipped'
          assert steps['Apply exact closed-PR and ref cleanup with settled deletion observation'] == 'skipped'
          assert steps['Restore exact canonical product tree and seal terminal cleanup'] == 'skipped'
          assert failed_artifact['id'] == int(os.environ['FAILED_WRITER_ARTIFACT'])
          assert failed_artifact['digest'] == 'sha256:' + os.environ['FAILED_WRITER_SHA256']
          assert not (failed_root / 'logs/pr-actions.tsv').exists()
          assert not (failed_root / 'logs/ref-actions.tsv').exists()
          assert not (failed_root / 'receipt/cleanup.json').exists()
          assert (failed_root / 'logs/installed.tsv').read_bytes() == (failed_root / 'logs/expected.tsv').read_bytes()

          observer_pr = json.loads((api / 'observer-pr.json').read_text())
          observer_run = json.loads((api / 'observer-run.json').read_text())
          observer_jobs = json.loads((api / 'observer-jobs.json').read_text())['jobs']
          observer_artifact = json.loads((api / 'observer-artifact.json').read_text())
          assert observer_pr['number'] == int(os.environ['OBSERVER_PR'])
          assert observer_pr['head']['ref'] == os.environ['OBSERVER_BRANCH'] and observer_pr['head']['sha'] == os.environ['OBSERVER_HEAD']
          assert observer_pr['merged_at'] is None
          assert observer_run['id'] == int(os.environ['OBSERVER_RUN'])
          assert observer_run['head_sha'] == os.environ['OBSERVER_HEAD']
          assert observer_run['status'] == 'completed' and observer_run['conclusion'] == 'success'
          rows = [row for row in observer_jobs if row['id'] == int(os.environ['OBSERVER_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'observe' and rows[0]['conclusion'] == 'success'
          assert observer_artifact['id'] == int(os.environ['OBSERVER_ARTIFACT'])
          assert observer_artifact['digest'] == 'sha256:' + os.environ['OBSERVER_SHA256']
          observation = json.loads((observer_root / 'receipt/observation.json').read_text())
          observation_identity = observation.pop('identity')
          assert observation_identity == os.environ['OBSERVER_IDENTITY']
          assert sha(json.dumps(observation, sort_keys=True, separators=(',', ':')).encode()) == observation_identity
          observation['identity'] = observation_identity
          assert observation['status'] == 'cycle-011-rastel-cleanup-resume-writer-failure-observed-v2'
          assert observation['writer']['run'] == int(os.environ['FAILED_WRITER_RUN'])
          assert observation['writer']['jobs'][0]['id'] == int(os.environ['FAILED_WRITER_JOB'])
          assert observation['writer']['artifacts'][0]['id'] == int(os.environ['FAILED_WRITER_ARTIFACT'])
          assert observation['live']['main'] == os.environ['PRIOR_INSTALLED_MAIN']
          assert observation['live']['prefix_ref_count'] == 90
          assert observation['boundary'] == {
              'canonical_mutation': False,
              'cycle_012_lease_issued': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
              'repository_write': False,
          }
          (root / 'receipt/prior-authorization.json').write_text(json.dumps(prior, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/observation.json').write_text(json.dumps(observation, indent=2, sort_keys=True) + '\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Freeze exact live ref and pull-request denominator
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/current-prefix-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$INSTALLER_PR" > "$OUT/api/installer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$OBSERVER_PR" > "$OUT/api/current-observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$OBSERVER_BRANCH" > "$OUT/api/current-observer-ref.json"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          prior = json.loads((root / 'receipt/prior-authorization.json').read_text())
          current_raw = json.loads((api / 'current-prefix-refs.json').read_text())
          current = [{
              'branch': row['ref'].removeprefix('refs/heads/'),
              'head': row['object']['sha'],
          } for row in current_raw]
          assert len({(row['branch'], row['head']) for row in current}) == len(current)
          expected = {(row['branch'], row['head']) for row in prior['refs']}
          expected.add((os.environ['INSTALLER_BRANCH'], os.environ['INSTALLER_HEAD']))
          expected.add((os.environ['BRANCH'], os.environ['CURRENT_HEAD']))
          assert {(row['branch'], row['head']) for row in current} == expected

          def api_json(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          pull_rows = []
          for frozen in prior['pull_requests']:
              row = api_json(f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{frozen['pr']}")
              assert row['head']['ref'] == frozen['branch'] and row['head']['sha'] == frozen['head']
              assert row['merged_at'] is None
              pull_rows.append(dict(frozen))
          for number, branch, head in [
              (int(os.environ['INSTALLER_PR']), os.environ['INSTALLER_BRANCH'], os.environ['INSTALLER_HEAD']),
              (int(os.environ['CURRENT_PR']), os.environ['BRANCH'], os.environ['CURRENT_HEAD']),
              (int(os.environ['OBSERVER_PR']), os.environ['OBSERVER_BRANCH'], os.environ['OBSERVER_HEAD']),
          ]:
              row = api_json(f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}")
              assert row['head']['ref'] == branch and row['head']['sha'] == head
              action = 'close_without_merge' if row['state'] == 'open' and row['merged_at'] is None else 'none'
              pull_rows.append({'pr': number, 'branch': branch, 'head': head, 'action': action})
          assert len({row['pr'] for row in pull_rows}) == len(pull_rows)

          auxiliary = list(prior['auxiliary_refs'])
          observer_ref = json.loads((api / 'current-observer-ref.json').read_text())
          assert observer_ref['object']['sha'] == os.environ['OBSERVER_HEAD']
          auxiliary.append({'branch': os.environ['OBSERVER_BRANCH'], 'head': os.environ['OBSERVER_HEAD']})
          assert len({(row['branch'], row['head']) for row in auxiliary}) == len(auxiliary)

          authorization = {
              'status': 'cycle-011-rastel-cleanup-resume-authorized-v2',
              'version': 2,
              'source': {
                  'pr': int(os.environ['CURRENT_PR']),
                  'head': os.environ['CURRENT_HEAD'],
                  'run': int(os.environ['GITHUB_RUN_ID']),
                  'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'job': int(os.environ['CURRENT_JOB']),
              },
              'canonical': {
                  'proved_commit': os.environ['CANONICAL_MAIN'],
                  'tree': os.environ['CANONICAL_TREE'],
                  'installed_main': os.environ['INSTALLED_MAIN'],
                  'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V2'], os.environ['WRITER_V3']],
              },
              'evidence': {
                  'prior_authorization': {
                      'artifact': int(os.environ['PRIOR_AUTH_ARTIFACT']),
                      'artifact_sha256': os.environ['PRIOR_AUTH_SHA256'],
                      'identity': os.environ['PRIOR_AUTH_IDENTITY'],
                  },
                  'failed_writer': {
                      'run': int(os.environ['FAILED_WRITER_RUN']),
                      'job': int(os.environ['FAILED_WRITER_JOB']),
                      'artifact': int(os.environ['FAILED_WRITER_ARTIFACT']),
                      'artifact_sha256': os.environ['FAILED_WRITER_SHA256'],
                      'failure': "KeyError: 'merged'",
                      'mutation_started': False,
                  },
                  'observer': {
                      'pr': int(os.environ['OBSERVER_PR']),
                      'head': os.environ['OBSERVER_HEAD'],
                      'run': int(os.environ['OBSERVER_RUN']),
                      'job': int(os.environ['OBSERVER_JOB']),
                      'artifact': int(os.environ['OBSERVER_ARTIFACT']),
                      'artifact_sha256': os.environ['OBSERVER_SHA256'],
                      'identity': os.environ['OBSERVER_IDENTITY'],
                      'status': 'cycle-011-rastel-cleanup-resume-writer-failure-observed-v2',
                  },
              },
              'prefix': os.environ['PREFIX'],
              'refs': sorted(current, key=lambda row: row['branch']),
              'auxiliary_refs': sorted(auxiliary, key=lambda row: row['branch']),
              'pull_requests': sorted(pull_rows, key=lambda row: row['pr']),
              'counts': {
                  'current_prefix_refs': len(current),
                  'auxiliary_refs': len(auxiliary),
                  'pull_requests_total': len(pull_rows),
                  'pull_requests_to_close': sum(row['action'] == 'close_without_merge' for row in pull_rows),
              },
              'boundary': {
                  'cycle_012_lease_issued': False,
                  'cycle_012_product_authority': False,
                  'exact_heads_frozen': True,
                  'force_update': False,
                  'main_mutation': False,
                  'merge': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          authorization['identity'] = hashlib.sha256(json.dumps(authorization, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/authorization.json').write_text(json.dumps(authorization, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/AUTHORIZATION_COMPLETE').write_text(authorization['identity'] + '\n')
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/receipt/$rel" | sed "s#  $OUT/receipt/#  #"; done > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" | sed "s#  $OUT/receipt/#  #" > "$OUT/receipt/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
