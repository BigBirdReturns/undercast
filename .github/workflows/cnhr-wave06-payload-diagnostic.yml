name: diagnose-clifford-number-hr-counterpower-effects-wave-06

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-dissonance-counterpower-wave-04
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-counterpower-effects-wave-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Print exact payload and parent identities
        shell: bash
        run: |
          set -euo pipefail
          printf 'payload_bytes=' && wc -c < .cnhr-wave05/payload.tar.gz
          printf 'payload_sha256=' && sha256sum .cnhr-wave05/payload.tar.gz | cut -d' ' -f1
          printf 'payload_blob=' && git hash-object .cnhr-wave05/payload.tar.gz
          printf 'parent_head=' && git rev-parse origin/agent/clifford-number-hr-counterpower-intervention-wave-05
