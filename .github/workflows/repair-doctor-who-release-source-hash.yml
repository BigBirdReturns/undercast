name: repair-doctor-who-release-source-hash

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-doctor-who-release-source-hash.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-release-source-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/repair-doctor-who-release-source-hash.yml
  TARGET: .github/workflows/apply-doctor-who-source-preservation-001.yml

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Bind exact branch and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

      - name: Bind finalizer to the live smoke-passed release assets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-doctor-who-source-preservation-001.yml')
          text = path.read_text()

          replacements = {
              'SOURCE_SHA256: a1be757a49298964862d41a9ca585ae91fc7ea121935f79f217e94a6fce331a7':
                  'SOURCE_SHA256: 1526b095c31c046e92de020854058088c970c42d8c9cf400179f1368c16c0211',
              'SOURCE_UPLOAD_RUN: "30737218532"':
                  'SOURCE_UPLOAD_RUN: "30737511584"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

          git rm "$SELF"
          git add "$TARGET"
          git diff --cached --check

      - name: Publish repaired finalizer under lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Preservation: bind finalizer to live release asset' \
            -m 'use the smoke-passed source hash and actual upload run'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
