name: publish-clifford-number-hr-counterpower-effects-wave-06

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-dissonance-counterpower-wave-04
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cnhr-wave06-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-counterpower-effects-wave-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebind, validate, and publish exact Wave 06 counterpower-effects packet
        shell: bash
        env:
          PARENT_BRANCH: agent/clifford-number-hr-counterpower-intervention-wave-05
          PARENT_SHA: 05125b9684a9a0923a8996e662cc633c47c72fbd
          PARENT_MANIFEST_SHA256: 1ab48de710d482eaa8cbed78cf6ff7f0568acbcd463b79525e67f4a394a31e6b
          FINAL_REF: agent/clifford-number-hr-counterpower-effects-wave-06
          PAYLOAD_SHA256: fde123670963fc368eb03469be9457c7455de8e087d2dd6a72ec928f609c44df
          PAYLOAD_BLOB_SHA: 4bdc5421bda16cedadca44577be29cb972c22925
        run: |
          set -euo pipefail

          test "$(wc -c < .cnhr-wave05/payload.tar.gz)" -eq 15162
          printf '%s  %s\n' "$PAYLOAD_SHA256" .cnhr-wave05/payload.tar.gz \
            | sha256sum --check --strict
          test "$(git hash-object .cnhr-wave05/payload.tar.gz)" = "$PAYLOAD_BLOB_SHA"
          test "$(git rev-parse "origin/${PARENT_BRANCH}")" = "$PARENT_SHA"

          rm -rf /tmp/cnhr-effects-original /tmp/cnhr-wave05-parent /tmp/cnhr-wave06-root
          mkdir -p /tmp/cnhr-effects-original /tmp/cnhr-wave05-parent /tmp/cnhr-wave06-root
          tar -xzf .cnhr-wave05/payload.tar.gz -C /tmp/cnhr-effects-original

          git checkout -B "$FINAL_REF" "$PARENT_SHA"

          python - <<'PY'
          from pathlib import Path
          import os

          source = Path('/tmp/cnhr-effects-original')
          target = Path('/tmp/cnhr-wave06-root')
          replacements = [
              ('CN-HRDCE-W05', 'CN-HRDCE-W06'),
              ('wave-05', 'wave-06'),
              ('Wave 05', 'Wave 06'),
              ('WAVE-05', 'WAVE-06'),
              ('agent/clifford-number-hr-dissonance-counterpower-wave-04',
               'agent/clifford-number-hr-counterpower-intervention-wave-05'),
              ('ee7705464eb974e40a6d4bc52fd0b88e164640db',
               '05125b9684a9a0923a8996e662cc633c47c72fbd'),
              ('c4659d37610b61c2403d10ab1b27b6bc4327aecb9b2103f3e85446da704460df',
               '1ab48de710d482eaa8cbed78cf6ff7f0568acbcd463b79525e67f4a394a31e6b'),
              ('CN-HRDCP-W04', 'CN-HRDCI-W05'),
              ('wave-04', 'wave-05'),
              ('Wave 04', 'Wave 05'),
              ('WAVE-04', 'WAVE-05'),
          ]
          files = [path for path in source.rglob('*') if path.is_file()]
          assert len(files) == 22, len(files)
          for src in sorted(files):
              rel = str(src.relative_to(source))
              rel = rel.replace('wave-05', 'wave-06').replace('WAVE-05', 'WAVE-06')
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              text = src.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              dst.write_text(text, encoding='utf-8')
              os.chmod(dst, src.stat().st_mode)
          transformed = [path for path in target.rglob('*') if path.is_file()]
          assert len(transformed) == 22, len(transformed)
          assert not any('wave-05' in str(path.relative_to(target)) for path in transformed)
          print(f'transformed counterpower-effects packet: {len(transformed)} exact Wave 06 files')
          PY

          (cd /tmp/cnhr-wave06-root && \
            node --check scripts/clifford-number-hr-counterpower-effects.mjs && \
            node --check test/clifford-number-hr-counterpower-effects-fixtures.mjs && \
            node scripts/clifford-number-hr-counterpower-effects.mjs --write && \
            node scripts/clifford-number-hr-counterpower-effects.mjs --check && \
            node test/clifford-number-hr-counterpower-effects-fixtures.mjs)

          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packet_root = Path('/tmp/cnhr-wave05-parent')
          manifest_rel = 'data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json'
          manifest_path = Path(manifest_rel)
          manifest = json.loads(manifest_path.read_text())
          paths = {row['path'] for row in manifest['files']} | {manifest_rel}
          assert len(paths) == 22, len(paths)
          for rel in sorted(paths):
              src = source_root / rel
              dst = packet_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          print(f'isolated Wave 05 intervention parent: {len(paths)} exact files')
          PY

          (cd /tmp/cnhr-wave05-parent && \
            node --check scripts/clifford-number-hr-counterpower-interventions.mjs && \
            node --check test/clifford-number-hr-counterpower-interventions-fixtures.mjs && \
            node scripts/clifford-number-hr-counterpower-interventions.mjs --check --strict-root && \
            node test/clifford-number-hr-counterpower-interventions-fixtures.mjs)

          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path('/tmp/cnhr-wave06-root')
          target = Path('.')
          files = [path for path in source.rglob('*') if path.is_file()]
          assert len(files) == 22, len(files)
          for src in sorted(files):
              rel = src.relative_to(source)
              dst = target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          PY

          git diff --check
          git add -A

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '05125b9684a9a0923a8996e662cc633c47c72fbd'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          assert not any(path.startswith('.cnhr-wave05/') for path in observed)
          assert not any(path.startswith('.github/workflows/') for path in observed)
          print('exact Wave 06 counterpower-effects delta: 22 added, 0 modified, 0 deleted')
          PY

          printf '%s  %s\n' "$PARENT_MANIFEST_SHA256" \
            data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json \
            | sha256sum --check --strict
          sha256sum \
            data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json \
            data/review/clifford-number/hr-discipline/wave-06/WAVE-06-SUMMARY.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number counterpower-effects Wave 06'
          git push --force-with-lease origin HEAD:"${FINAL_REF}"
