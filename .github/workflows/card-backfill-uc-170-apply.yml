name: card-backfill-uc-170-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-170-APPLY.json"
      - "scripts/card-backfill-uc-170-apply.part-00.mjs"
      - "scripts/card-backfill-uc-170-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-170-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-170-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-035'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-035
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-170 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-170-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-170');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-170');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_f1583034cfdddaa201e1bcc3');
          if(row.version!==1||row.record_id!=='UC-170'||row.kind!=='voice'||row.actor!=='Maurice LaMarche'||row.character!=='The Brain, Kif Kroker, Egon Spengler'||row.production!=='Animaniacs / Futurama'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-170 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8713612162||row.render_artifact?.head_sha!=='31a80f7db85f0cc1394c984f8d05b950bb5247e8'||row.render_artifact?.zip_sha256!=='ccddec31b21a0b56fed02222c80ba1e56cf922c28fa3c8a34f93565fb23b72f1')throw new Error('UC-170 render custody drift');
          if(Object.keys(row.expected_files||{}).length!==25||row.denominators?.packet_file_count!==25||row.denominators?.checksum_row_count!==24||row.denominators?.selected_role_count!==3||row.denominators?.actor_role_page_count!==4||row.denominators?.raw_revision_count!==3||row.denominators?.api_receipt_count!==6||row.denominators?.failed_discovery_checkpoint_count!==3||row.denominators?.duplicate_item_count!==5||row.denominators?.repository_hash_count!==2070)throw new Error('UC-170 packet denominator drift');
          if(row.expected_files?.['brain-original.webp']?.sha256!=='6ab210ad8aeb53986bef746a832d779c1cc0780c9f3a4c3824cc9754fce06775'||row.expected_files?.['kif-original.webp']?.sha256!=='5261c4cddb408a3f18f2bc8c321ff8f7ad6edfcdc82c66cb614e82ec672f2f2e'||row.expected_files?.['egon-original.webp']?.sha256!=='4f3ca12b954cab1db05c1ed22ed184639f87e7ee32e13b84dde9ace456f357b2')throw new Error('UC-170 selected source authorization drift');
          if(row.expected_files?.['exact-voice-record.json']?.sha256!=='998bbc1c2f03315efda49a585dec03daa2564ae4e9fbba0b8405192e2551b80b'||row.expected_files?.['uc-170-still-candidate.jpg']?.sha256!=='ed855fcdb8962df90bb45b7a14365725d1167f8929715d7104a8bde78347b0f5'||row.expected_files?.['card-crop-preview.jpg']?.sha256!=='12a8905755cba134436d5b60921352f0a9936120fa9825cb19b8f09ccdfc904a')throw new Error('UC-170 candidate authorization drift');
          if(row.ruling?.identity!=='expected-three-role-subject'||row.ruling?.presentation!=='three-role-animated-character-composite'||row.ruling?.crop_ruling!=='pass-three-face-and-body-panels'||row.ruling?.chronology_ruling!=='pass-role-specific-1986-1993-1999-boundaries'||row.ruling?.Kif_source_floor_ruling!=='pass-exact-hash-and-geometry-bound-exception'||row.ruling?.live_action_egon_exclusion_ruling!=='pass-animated-egon-only'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-170 ruling drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Maurice LaMarche'||specimen.character!=='The Brain, Kif Kroker, Egon Spengler'||specimen.production!=='Animaniacs / Futurama'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-170'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-170 audit boundary drift');
          console.log(`PASS — UC-170 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8713612162/zip" > "$root/render.zip"
          echo "ccddec31b21a0b56fed02222c80ba1e56cf922c28fa3c8a34f93565fb23b72f1  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-170"
          test -d "$base"
          test "$(find "$base" -maxdepth 1 -type f | wc -l)" -eq 25
          echo "9a472b0ae4342b43fe34e708d8e68de68bbc3cc3d153cce8b825b53881eb3587  $base/manifest.json" | sha256sum -c -
          echo "f0053e699d2a8b4fafeafdd1794fd29480c53ec0244e09ab37c0f6c0e1bfcbcd  $base/SHA256SUMS" | sha256sum -c -
          echo "998bbc1c2f03315efda49a585dec03daa2564ae4e9fbba0b8405192e2551b80b  $base/exact-voice-record.json" | sha256sum -c -
          echo "ed855fcdb8962df90bb45b7a14365725d1167f8929715d7104a8bde78347b0f5  $base/uc-170-still-candidate.jpg" | sha256sum -c -
          echo "12a8905755cba134436d5b60921352f0a9936120fa9825cb19b8f09ccdfc904a  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30425963659
          artifact_id=8713612162
          artifact_name=card-backfill-uc-170-render-30425963659
          artifact_zip_sha256=ccddec31b21a0b56fed02222c80ba1e56cf922c28fa3c8a34f93565fb23b72f1
          artifact_head_sha=31a80f7db85f0cc1394c984f8d05b950bb5247e8
          source_manifest_sha256=9a472b0ae4342b43fe34e708d8e68de68bbc3cc3d153cce8b825b53881eb3587
          source_sums_sha256=f0053e699d2a8b4fafeafdd1794fd29480c53ec0244e09ab37c0f6c0e1bfcbcd
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-170-apply/source/output/UC-170
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-apply"
          cat scripts/card-backfill-uc-170-apply.part-00.mjs scripts/card-backfill-uc-170-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-170');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-170');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_f1583034cfdddaa201e1bcc3');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 specimen was canonically mutated');
          if(source?.still||source?.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-170'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-170 audit disposition was canonically mutated');
          console.log('PASS — UC-170 still remains canonically absent; existing Maurice LaMarche portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-170.json \
            .github/CARD-BACKFILL-UC-170-DISCOVER.json \
            .github/CARD-BACKFILL-UC-170-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-170-RENDER.json \
            .github/CARD-BACKFILL-UC-170-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-170-scope.yml \
            .github/workflows/card-backfill-uc-170-discover.yml \
            .github/workflows/card-backfill-uc-170-render.yml \
            .github/workflows/card-backfill-uc-170-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-170-scope.mjs \
            scripts/card-backfill-uc-170-discover.mjs \
            scripts/card-backfill-uc-170-discover-repair.py \
            scripts/card-backfill-uc-170-discover-v2.mjs \
            scripts/card-backfill-uc-170-discover-v3-repair.py \
            scripts/card-backfill-uc-170-render.part-00.mjs \
            scripts/card-backfill-uc-170-render.part-01.mjs \
            scripts/card-backfill-uc-170-apply.part-00.mjs \
            scripts/card-backfill-uc-170-apply.part-01.mjs
          git add -A
          git diff --cached --check -- . \
            ':(exclude)data/review/card-backfill/UC-170/source-raw-brain.wikitext' \
            ':(exclude)data/review/card-backfill/UC-170/source-raw-kif.wikitext' \
            ':(exclude)data/review/card-backfill/UC-170/source-raw-egon.wikitext'
          echo "7d5ecf50940e4e01d599745c8ad51626d09734520f94d0bc27df8bfbfb429bd6  data/review/card-backfill/UC-170/source-raw-brain.wikitext" | sha256sum -c -
          echo "9d4a1c8417b278b3b3a8e293e0214e61310ee314288f8f339e0947161f576019  data/review/card-backfill/UC-170/source-raw-kif.wikitext" | sha256sum -c -
          echo "c5883baa20fd892ac56c13c1de1425c2f1cd1632f1debcf5296272c5e06febe9  data/review/card-backfill/UC-170/source-raw-egon.wikitext" | sha256sum -c -
          git commit -m 'Card backfill: retain UC-170 Maurice LaMarche three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-034
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-034 HEAD)
          test "${#changed[@]}" -eq 25
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-170/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-035
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-170-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-170-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-170-apply
            data/review/card-backfill/UC-170
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
