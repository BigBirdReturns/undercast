name: doctor-who-cycle-012-media-census-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v5
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      EVIDENCE_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      PRESELECTION_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-media-census-v5
      SELF: .github/workflows/doctor-who-cycle-012-media-census-v5.yml
      OUT: /tmp/doctor-who-cycle-012-media-census-v5
      LOADER: /tmp/doctor-who-cycle-012-media-census-v5-loader
      FAILURE_ROOT: /tmp/doctor-who-cycle-012-media-census-v4-failure
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      EVIDENCE_PR: "871"
      EVIDENCE_HEAD: 61e1acdcb13966087374de518e85dc2db9eb1ee8
      EVIDENCE_RUN: "31370980255"
      EVIDENCE_JOB: "93399665207"
      EVIDENCE_ARTIFACT: "9056104797"
      EVIDENCE_ARTIFACT_NAME: doctor-who-cycle-012-senstarg-evidence-v2-31370980255-attempt-1
      EVIDENCE_ARTIFACT_SHA256: 0109348293dcd1dd9ca1b1e89cf16d073ce1fa026aa8d63b1f06dcdef5651b4e
      EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION: "3243079"
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_ORIGIN: https://tardis.fandom.com

      V4_PR: "879"
      V4_HEAD: 154dc2df35823d7d871fb39e44f81587b6fa5b47
      V4_BASE: 019b43139f775b0935afd2be2f6d22c6e2494b94
      V4_RUN: "31373653335"
      V4_JOB: "93407975978"
      V4_ARTIFACT: "9057263796"
      V4_ARTIFACT_NAME: doctor-who-cycle-012-media-census-v4-diagnostics-31373653335-attempt-1
      V4_ARTIFACT_BYTES: "685933"
      V4_ARTIFACT_SHA256: ae70195d7148b36160254eabdd3a58dc2753b8c1005a5126f3f3db0944279ac3
      V4_ARTIFACT_MEMBERS: "53"
      V4_WORKFLOW_PATH: .github/workflows/doctor-who-cycle-012-media-census-v4.yml
      V4_WORKFLOW_BLOB: d3e7e550d43be89a69b3177ec4cfb90cc8d3dfc3
      V4_BAD_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb817592c3f6c2
      CARRIER_BYTES: "20878"
      CARRIER_SHA256: 7a92fa4523b88153025db88403293517c54eb086e4853027b052329dbac1e107

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V4 fingerprint failure and execute exact corrected census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER" "$FAILURE_ROOT"
          mkdir -p "$LOADER" "$FAILURE_ROOT"/{api,diagnostics,extracted,payload}
          test "$CURRENT_BASE" = "$MAIN"
          test "$CURRENT_HEAD" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V4_PR" > "$FAILURE_ROOT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V4_RUN" > "$FAILURE_ROOT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V4_RUN/jobs?per_page=100" > "$FAILURE_ROOT/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_ARTIFACT" > "$FAILURE_ROOT/api/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_ARTIFACT/zip" > "$FAILURE_ROOT/diagnostics/v4.zip"
          test "$(wc -c < "$FAILURE_ROOT/diagnostics/v4.zip" | tr -d ' ')" = "$V4_ARTIFACT_BYTES"
          test "$(sha256sum "$FAILURE_ROOT/diagnostics/v4.zip" | awk '{print $1}')" = "$V4_ARTIFACT_SHA256"
          git show "$V4_HEAD:$V4_WORKFLOW_PATH" > "$FAILURE_ROOT/v4-workflow.yml"
          test "$(git hash-object "$FAILURE_ROOT/v4-workflow.yml")" = "$V4_WORKFLOW_BLOB"

          python3 - <<'PY'
          import hashlib,json,os,re,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['FAILURE_ROOT']); target=root/'extracted'; sha=lambda b:hashlib.sha256(b).hexdigest()
          pr=json.loads((root/'api/pr.json').read_text()); run=json.loads((root/'api/run.json').read_text()); jobs=json.loads((root/'api/jobs.json').read_text())['jobs']; artifact=json.loads((root/'api/artifact.json').read_text())
          assert pr['number']==int(os.environ['V4_PR']) and pr['head']['sha']==os.environ['V4_HEAD'] and pr['base']['sha']==os.environ['V4_BASE'] and pr['state']=='closed' and pr['merged'] is False
          assert run['id']==int(os.environ['V4_RUN']) and run['head_sha']==os.environ['V4_HEAD'] and run['status']=='completed' and run['conclusion']=='failure'
          matched=[job for job in jobs if job['id']==int(os.environ['V4_JOB'])]; assert len(matched)==1 and matched[0]['name']=='inspect' and matched[0]['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in matched[0]['steps']}
          assert steps['Authenticate V3 base-drift failure and derive exact V4 carrier']==('completed','failure')
          assert artifact['id']==int(os.environ['V4_ARTIFACT']) and artifact['name']==os.environ['V4_ARTIFACT_NAME'] and artifact['digest']=='sha256:'+os.environ['V4_ARTIFACT_SHA256'] and artifact['expired'] is False
          with zipfile.ZipFile(root/'diagnostics/v4.zip') as archive:
              infos=archive.infolist(); assert len(infos)==int(os.environ['V4_ARTIFACT_MEMBERS']) and len(infos)==len({info.filename for info in infos})
              for info in infos:
                  pure=PurePosixPath(info.filename); assert not pure.is_absolute() and '..' not in pure.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target.joinpath(*pure.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          carriers=[path for path in target.rglob('carrier.sh') if path.stat().st_size==int(os.environ['CARRIER_BYTES']) and sha(path.read_bytes())==os.environ['CARRIER_SHA256']]
          assert len(carriers)==1, [str(path) for path in carriers]
          evidence_rows=[path for path in target.rglob('evidence.json')]
          evidence_rows=[path for path in evidence_rows if json.loads(path.read_text()).get('identity')==os.environ['EVIDENCE_IDENTITY']]
          assert len(evidence_rows)==1
          evidence=json.loads(evidence_rows[0].read_text())
          assert evidence['task']['source_fingerprint']==os.environ['SOURCE_FINGERPRINT'] and len(evidence['task']['source_fingerprint'])==64
          assert not list(target.rglob('parse.json')) and not list(target.rglob('imageinfo.json')) and not list(target.rglob('source-image-candidate')) and not list(target.rglob('media-census.json'))
          workflow=(root/'v4-workflow.yml').read_text()
          values=re.findall(r'(?m)^\s+SOURCE_FINGERPRINT:\s*(\S+)\s*$',workflow)
          assert values==[os.environ['V4_BAD_FINGERPRINT']] and len(values[0])==57 and values[0]!=os.environ['SOURCE_FINGERPRINT']
          loader=Path(os.environ['LOADER']); (loader/'carrier.sh').write_bytes(carriers[0].read_bytes())
          receipt={'status':'cycle-012-media-census-v4-fingerprint-binding-classified-v1','version':1,'failed':{'pr':int(os.environ['V4_PR']),'head':os.environ['V4_HEAD'],'base':os.environ['V4_BASE'],'run':int(os.environ['V4_RUN']),'job':int(os.environ['V4_JOB']),'artifact':int(os.environ['V4_ARTIFACT']),'artifact_sha256':os.environ['V4_ARTIFACT_SHA256']},'carrier':{'bytes':int(os.environ['CARRIER_BYTES']),'sha256':os.environ['CARRIER_SHA256']},'fingerprint':{'failed':os.environ['V4_BAD_FINGERPRINT'],'failed_length':len(os.environ['V4_BAD_FINGERPRINT']),'correct':os.environ['SOURCE_FINGERPRINT'],'correct_length':len(os.environ['SOURCE_FINGERPRINT']),'omitted_segment':'f817'},'failure_boundary':{'v3_failure_authenticated':True,'carrier_derived':True,'evidence_artifact_authenticated':True,'evidence_ledgers_verified':True,'evidence_identity_verified':True,'source_identity_verified':True,'image_query_issued':False,'media_census_completed':False,'media_adopted':False,'lease_issued':False,'queue_mutated':False,'repository_write':False,'cycle_receipt_written':False,'cycle_012_product_authority':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()); (root/'payload/v4-failure.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); (root/'payload/V4_FAILURE_CLASSIFIED').write_text(receipt['identity']+'\n')
          PY

          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text(); blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); assert len(blocks)==6
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-012-media-census-v5-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

          find "$FAILURE_ROOT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$FAILURE_ROOT/payload/$rel" | sed "s#  $FAILURE_ROOT/payload/#  #"; done > "$FAILURE_ROOT/payload/SHA256SUMS.pre"
          sha256sum "$FAILURE_ROOT/payload/SHA256SUMS.pre" | sed "s#  $FAILURE_ROOT/payload/#  #" > "$FAILURE_ROOT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v5/payload
            /tmp/doctor-who-cycle-012-media-census-v4-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v5
            /tmp/doctor-who-cycle-012-media-census-v5-loader
            /tmp/doctor-who-cycle-012-media-census-v4-failure
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
