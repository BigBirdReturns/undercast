name: card-backfill-facet-safe-migration-export

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-facet-safe-migration-export.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: card-backfill-facet-safe-migration-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-prove-export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Publish observable start custody
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='card-backfill/facet-safe-migration-export' \
            -f description='building 46+426=472 migration; source transport=0' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime

      - name: Install rendered-gate browser
        run: npx playwright install --with-deps chromium

      - name: Bind the builder to a staged, disjoint, policy-bounded transaction
        env:
          MIGRATION_ROOT: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
        run: |
          set -euo pipefail
          mkdir -p "$MIGRATION_ROOT"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/card-backfill-build-facet-safe-local-desk-migration.mjs')
          lines = path.read_text(encoding='utf-8').splitlines()

          selected_markers = [
              index for index, line in enumerate(lines)
              if '"selected_count=160",' in line
          ]
          if len(selected_markers) != 1:
              raise SystemExit(
                  f'selected-capacity marker drift: expected one, found {len(selected_markers)}'
              )
          del lines[selected_markers[0]]

          log_markers = [
              index for index, line in enumerate(lines)
              if 'facet-safe planner proves 46+426=472 and selects 160 with source_transport_calls=0' in line
          ]
          if len(log_markers) != 1:
              raise SystemExit(
                  f'frontier-log marker drift: expected one, found {len(log_markers)}'
              )
          index = log_markers[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          replacement = [
              r'const summaryLines = summary.split(/\r?\n/).filter(Boolean);',
              r'const summaryMap = new Map(summaryLines.map((line) => {',
              r'  const separator = line.indexOf("=");',
              r'  return separator < 0 ? [line, ""] : [line.slice(0, separator), line.slice(separator + 1)];',
              r'}));',
              r'const selected = Number(summaryMap.get("selected_count"));',
              r'const ready = Number(summaryMap.get("source_policy_v3_ready"));',
              r'const disjoint = Number(summaryMap.get("disjoint_obligation_ids"));',
              r'const batches = Number(summaryMap.get("wave_batches"));',
              r'const jobs = Number(summaryMap.get("discovery_jobs"));',
              r'if (!Number.isInteger(selected) || selected < 1 || selected > 160) throw new Error("invalid selected frontier " + selected);',
              r'if (!Number.isInteger(ready) || selected > ready) throw new Error("planning selected beyond eligible frontier: selected=" + selected + "; eligible=" + ready);',
              r'if (disjoint !== selected) throw new Error("disjoint selection drift: selected=" + selected + "; disjoint=" + disjoint);',
              r'if (batches !== 4 || jobs !== 16) throw new Error("fan-out shape drift: batches=" + batches + "; jobs=" + jobs);',
              r'console.log("PASS — facet-safe planner proves 46+426=472 and schedules one valid disjoint wave: selected=" + selected + "; eligible=" + ready + "; successor_frontier=" + (ready - selected) + "; source_transport_calls=0");',
          ]
          lines[index:index + 1] = [indent + line for line in replacement]
          value = '\n'.join(lines) + '\n'

          gate_marker = '  const gate = run("complete repository gate", process.execPath, ["scripts/gate.mjs"], { capture: true });\n'
          if value.count(gate_marker) != 1:
              raise SystemExit('complete-gate marker drift')
          stage_block = '''  run("stage migration candidate", "git", ["add", "-A", "--", "."]);
          const stagedBeforeGate = run("staged migration paths", "git", ["diff", "--cached", "--name-only"], { capture: true }).stdout;
          if (!stagedBeforeGate.trim()) throw new Error("migration candidate changed zero staged paths");
          console.log(`STAGED — ${stagedBeforeGate.trim().split(/\\r?\\n/).filter(Boolean).length} migration path(s) bound before the complete gate`);

'''
          value = value.replace(gate_marker, stage_block + gate_marker)

          replacements = [
              (
                  '  run("diff check", "git", ["diff", "--check"]);',
                  '  run("unstage temporary migration builder", "git", ["reset", "HEAD", "--", "scripts/card-backfill-build-facet-safe-local-desk-migration.mjs"]);\n  run("diff check", "git", ["diff", "--cached", "--check"]);',
                  'cached diff check',
              ),
              (
                  '  const nameStatus = run("name status", "git", ["diff", "--name-status"], { capture: true }).stdout;',
                  '  const nameStatus = run("name status", "git", ["diff", "--cached", "--name-status"], { capture: true }).stdout;',
                  'cached name status',
              ),
              (
                  '  const patch = run("migration patch", "git", ["diff", "--binary"], { capture: true }).stdout;',
                  '  const patch = run("migration patch", "git", ["diff", "--cached", "--binary"], { capture: true }).stdout;',
                  'cached patch',
              ),
              (
                  '  const changed = run("changed files", "git", ["diff", "--name-only"], { capture: true }).stdout;',
                  '  const changed = run("changed files", "git", ["diff", "--cached", "--name-only"], { capture: true }).stdout;',
                  'cached changed files',
              ),
              (
                  '  run("migration checksums", "sha256sum", [log("changed-files.tar"), log("migration.patch")], { capture: true });',
                  '  const checksums = run("migration checksums", "sha256sum", [log("changed-files.tar"), log("migration.patch")], { capture: true }).stdout;\n  await writeFile(log("checksums.sha256"), checksums);',
                  'checksum receipt',
              ),
          ]
          for prior, next_value, label in replacements:
              count = value.count(prior)
              if count != 1:
                  raise SystemExit(f'{label} seam drift: expected one, found {count}')
              value = value.replace(prior, next_value)

          path.write_text(value, encoding='utf-8')
          PY
          node --check scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          grep -q 'selected > ready' scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          grep -q 'disjoint !== selected' scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          grep -q 'stage migration candidate' scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          grep -q 'diff", "--cached", "--binary"' scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          ! grep -q 'selected_count=160' scripts/card-backfill-build-facet-safe-local-desk-migration.mjs
          echo 'PASS — builder now gates the staged transaction and exports only its cached delta'

      - name: Build, prove, and export the exact migration
        id: build
        env:
          MIGRATION_ROOT: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
        run: |
          set -euo pipefail
          node scripts/card-backfill-build-facet-safe-local-desk-migration.mjs

      - name: Upload exact migration transaction
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-facet-safe-local-desk-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish terminal custody
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='facet-safe migration export failed; inspect retained artifact/logs'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='46+426=472; staged full gate pass; exact migration exported'
          fi
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='card-backfill/facet-safe-migration-export' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo 'manual_continue_required=false'
