name: card-backfill-facet-safe-migration-export

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-facet-safe-migration-export.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: card-backfill-facet-safe-migration-export-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-prove-export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Publish observable start custody
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='card-backfill/facet-safe-migration-export' \
            -f description='building 46+426=472 migration; source transport=0' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime

      - name: Install rendered-gate browser
        run: npx playwright install --with-deps chromium

      - name: Replace capacity folklore with a frontier-completeness invariant
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path='scripts/card-backfill-build-facet-safe-local-desk-migration.mjs';
          let value=await readFile(path,'utf8');
          const prior=`  for (const line of [
            "current_completed_evidence_packets=46",
            "current_open_source_declared_absences=426",
            "selector_defined_estate=472",
            "selected_count=160",
          ]) if (!summary.split(/\\r?\\n/).includes(line)) throw new Error(\`planning proof missing \${line}\`);
          console.log("PASS — facet-safe planner proves 46+426=472 and selects 160 with source_transport_calls=0");`;
          const next=`  const summaryLines = summary.split(/\\r?\\n/).filter(Boolean);
          for (const line of [
            "current_completed_evidence_packets=46",
            "current_open_source_declared_absences=426",
            "selector_defined_estate=472",
          ]) if (!summaryLines.includes(line)) throw new Error(\`planning proof missing \${line}\`);
          const summaryMap = new Map(summaryLines.map((line) => {
            const index = line.indexOf("=");
            return index < 0 ? [line, ""] : [line.slice(0, index), line.slice(index + 1)];
          }));
          const selected = Number(summaryMap.get("selected_count"));
          const ready = Number(summaryMap.get("source_policy_v3_ready"));
          const batches = Number(summaryMap.get("wave_batches"));
          const jobs = Number(summaryMap.get("discovery_jobs"));
          if (!Number.isInteger(selected) || selected < 1 || selected > 160) throw new Error(\`invalid selected frontier \${selected}\`);
          if (selected !== ready) throw new Error(\`planning frontier incomplete: selected=\${selected}; eligible=\${ready}\`);
          if (batches !== 4 || jobs !== 16) throw new Error(\`fan-out shape drift: batches=\${batches}; jobs=\${jobs}\`);
          console.log(\`PASS — facet-safe planner proves 46+426=472 and drains the current eligible frontier (\${selected}) with source_transport_calls=0\`);`;
          const count=value.split(prior).length-1;
          if(count!==1)throw new Error(\`frontier proof seam drift: expected one, found \${count}\`);
          await writeFile(path,value.replace(prior,next));
          NODE
          node --check scripts/card-backfill-build-facet-safe-local-desk-migration.mjs

      - name: Build, prove, and export the exact migration
        id: build
        env:
          MIGRATION_ROOT: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
        run: |
          set -euo pipefail
          node scripts/card-backfill-build-facet-safe-local-desk-migration.mjs

      - name: Upload exact migration transaction
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-facet-safe-local-desk-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-facet-safe-local-desk
          if-no-files-found: error
          retention-days: 90

      - name: Publish terminal custody
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='facet-safe migration export failed; inspect retained artifact/logs'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='46+426=472; eligible frontier planned; full gate pass; migration exported'
          fi
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='card-backfill/facet-safe-migration-export' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "manual_continue_required=false"
