name: prove-doctor-who-cycle-007-terminal-current-main-v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/prove-doctor-who-cycle-007-terminal-current-main-v4.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: prove-doctor-who-cycle-007-terminal-current-main-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PRODUCT_PARENT: c57a1f28b3f1998349fb2f87f847f6d240a43a3d
  PRODUCT_MAIN: e00b03436e354f3543cf4ed67a0c5b9f6ba4f97b
  V14_PUBLISHER_CLEAN_MAIN: 801d6129ab901e730ca8ec6333cebe0dd0d5574e
  V10_WORKFLOW_CLEAN_MAIN: 4570a2efacd0891e1b9ae2d0678cdf330a6c3293
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  PRODUCT_PR: "492"
  V14_CLEANUP_PR: "499"
  V10_WORKFLOW_CLEANUP_PR: "504"
  PAYLOAD_CLEANUP_PR: "505"
  PAYLOAD_CLEANUP_BRANCH: agent/retire-doctor-who-cycle-007-v10-payloads
  PAYLOAD_CLEANUP_HEAD: a9376b549302d20a150724fc9474b6673ca931e4
  PAYLOAD_GATE_RUN: "31087628429"
  PAYLOAD_GATE_JOB: "92570751930"
  V3_CARRIER_HEAD: cdd9b064e05e6938f71a9c016cd1b7f8084e771c
  V3_RUN: "31086985453"
  V3_JOB: "92568656255"
  V3_ARTIFACT_ID: "8961880088"
  V3_ARTIFACT_NAME: doctor-who-cycle-007-current-main-proof-v3-31086985453
  V3_ARTIFACT_SHA256: 3dc39fc2b6445026fa1e98062329fc8e1db9605b8c5cad0ff501fa15dbf3f6b1
  V3_RECEIPT_SHA256: e79dbe23b2cf2efe65be082ad03a0d86dd98f8c45b11d05292f09fde13ee317b
  V3_GATE_SHA256: 4d7f1761cf3f157dc5ef6fadc0eb116bc0eafe81dfd3c213b15564451718edec
  FINALIZER_HANDOFF_SHA256: 18e1c3352bad9b881d879cbb9c2d900479dceff50e58e1461ceccc3bea490c04
  MEDIA_ASSET_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  MEDIA_SEARCH_BLOB: 39c70aad4ae090b4a500c7dbfd525fe8a25930e8
  MEDIA_SEARCH_JOURNAL_BLOB: 17677703d71fe0f054887da6e2c8d9328dbab717
  CARRIER_BRANCH: agent/doctor-who-cycle-007-terminal-current-main-proof-v4
  SELF: .github/workflows/prove-doctor-who-cycle-007-terminal-current-main-v4.yml
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  ROOT: /tmp/doctor-who-cycle-007-terminal-v4
  OUT: /tmp/doctor-who-cycle-007-terminal-v4/out
  V3: /tmp/doctor-who-cycle-007-terminal-v4/v3
  GH_TOKEN: ${{ github.token }}

jobs:
  prove:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-terminal-current-main-proof-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-path carrier and final four-shard cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$OUT" "$V3"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PAYLOAD_CLEANUP_BRANCH}:refs/remotes/origin/${PAYLOAD_CLEANUP_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PAYLOAD_CLEANUP_BRANCH})" = "$PAYLOAD_CLEANUP_HEAD"
          test "$(git show -s --format=%P "$EXACT_MAIN")" = "$V10_WORKFLOW_CLEAN_MAIN"
          test "$(git rev-list --count "$V10_WORKFLOW_CLEAN_MAIN".."$EXACT_MAIN")" = "1"
          test "$(git merge-base "$V10_WORKFLOW_CLEAN_MAIN" "$EXACT_MAIN")" = "$V10_WORKFLOW_CLEAN_MAIN"
          test "$(git rev-parse "${PAYLOAD_CLEANUP_HEAD}^{tree}")" = "$(git rev-parse "${EXACT_MAIN}^{tree}")"

          cat <<'PATHS' > "$OUT/expected-payload-cleanup.txt"
          D	.github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-01
          D	.github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-02
          D	.github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-03
          D	.github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-04
          PATHS
          git diff --name-status "$V10_WORKFLOW_CLEAN_MAIN"..."$EXACT_MAIN" | LC_ALL=C sort > "$OUT/actual-payload-cleanup.txt"
          diff -u "$OUT/expected-payload-cleanup.txt" "$OUT/actual-payload-cleanup.txt"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PAYLOAD_CLEANUP_PR}" > "$OUT/payload-cleanup-pr.json"
          jq -e --arg main "$EXACT_MAIN" --arg base "$V10_WORKFLOW_CLEAN_MAIN" --arg head "$PAYLOAD_CLEANUP_HEAD" \
            '.state=="closed" and .merged==true and .merge_commit_sha==$main and .base.sha==$base and .head.sha==$head and .changed_files==4 and .additions==0' \
            "$OUT/payload-cleanup-pr.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PAYLOAD_GATE_RUN}" > "$OUT/payload-gate-run.json"
          jq -e --arg head "$PAYLOAD_CLEANUP_HEAD" \
            '.status=="completed" and .conclusion=="success" and .head_sha==$head and .event=="pull_request"' \
            "$OUT/payload-gate-run.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PAYLOAD_GATE_RUN}/jobs?per_page=100" > "$OUT/payload-gate-jobs.json"
          jq -e --argjson job "$PAYLOAD_GATE_JOB" \
            '.jobs | map(select(.id==$job)) | length==1 and .[0].name=="validate" and .[0].status=="completed" and .[0].conclusion=="success" and all(.[0].steps[]; .conclusion=="success" or .conclusion=="skipped")' \
            "$OUT/payload-gate-jobs.json" >/dev/null

      - name: Bind successful V3 current-main proof and immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V3_RUN}" > "$OUT/v3-run.json"
          jq -e --arg head "$V3_CARRIER_HEAD" \
            '.status=="completed" and .conclusion=="success" and .head_sha==$head and .event=="pull_request"' \
            "$OUT/v3-run.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V3_RUN}/jobs?per_page=100" > "$OUT/v3-jobs.json"
          jq -e --argjson job "$V3_JOB" \
            '.jobs | map(select(.id==$job)) | length==1 and .[0].name=="prove" and .[0].status=="completed" and .[0].conclusion=="success" and all(.[0].steps[]; .conclusion=="success" or .conclusion=="skipped")' \
            "$OUT/v3-jobs.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V3_RUN}/artifacts?per_page=100" > "$OUT/v3-artifacts.json"
          jq -e --argjson id "$V3_ARTIFACT_ID" --arg name "$V3_ARTIFACT_NAME" --arg digest "sha256:${V3_ARTIFACT_SHA256}" \
            '.artifacts | map(select(.id==$id)) | length==1 and .[0].name==$name and .[0].digest==$digest and .[0].expired==false' \
            "$OUT/v3-artifacts.json" >/dev/null

      - name: Download immutable V3 current-main proof
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V3_ARTIFACT_NAME }}
          path: ${{ env.V3 }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.V3_RUN }}

      - name: Reconcile proof chain, product bytes, and zero GitHub transport residue
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find "$V3" -type f -name current-main-proof.json -print -quit)"
          receipt_sha="$(find "$V3" -type f -name current-main-proof.sha256 -print -quit)"
          v3_gate="$(find "$V3" -type f -name complete-gate.log -print -quit)"
          v3_gate_sha="$(find "$V3" -type f -name complete-gate.sha256 -print -quit)"
          handoff="$(find "$V3" -type f -name publisher-handoff.json -print -quit)"
          test -n "$receipt" -a -n "$receipt_sha" -a -n "$v3_gate" -a -n "$v3_gate_sha" -a -n "$handoff"
          test "$(sha256sum "$receipt" | awk '{print $1}')" = "$V3_RECEIPT_SHA256"
          test "$(cat "$receipt_sha")" = "$V3_RECEIPT_SHA256"
          test "$(sha256sum "$v3_gate" | awk '{print $1}')" = "$V3_GATE_SHA256"
          test "$(cat "$v3_gate_sha")" = "$V3_GATE_SHA256"
          test "$(jq -r '.receipt_sha256' "$handoff")" = "$FINALIZER_HANDOFF_SHA256"
          test "$(jq '.files | length' "$handoff")" = "49"

          jq -e --arg main "$V14_PUBLISHER_CLEAN_MAIN" --arg carrier "$V3_CARRIER_HEAD" \
            '.transaction=="DOCTOR-WHO-CYCLE-007-KRAGAR-CURRENT-MAIN-PROOF-V3" and .verdict=="current-main-verified" and .current_main==$main and .carrier_head==$carrier and .product_paths==49 and .surviving_workflow_paths==0 and .surviving_transport_paths==0 and .checks.complete_repository_and_rendered_gate_passed==true and .checks.live_main_rebound_after_gate==true and .boundary.eighth_lease_issued==false' \
            "$receipt" >/dev/null

          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$V10_WORKFLOW_CLEAN_MAIN"
          test -z "$(git status --porcelain)"

          find .github -type f -print | LC_ALL=C sort > "$OUT/github-files.txt"
          if grep -F 'doctor-who-cycle-007' "$OUT/github-files.txt" > "$OUT/forbidden-cycle-007-github-paths.txt"; then
            cat "$OUT/forbidden-cycle-007-github-paths.txt" >&2
            exit 1
          fi

          HANDOFF="$handoff" PRODUCT_PARENT="$PRODUCT_PARENT" PRODUCT_MAIN="$PRODUCT_MAIN" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const handoff = JSON.parse(fs.readFileSync(process.env.HANDOFF, 'utf8'));
          const expected = Object.keys(handoff.files).sort();
          const actual = execFileSync('git', ['diff', '--name-only', `${process.env.PRODUCT_PARENT}...${process.env.PRODUCT_MAIN}`], { encoding: 'utf8' }).trim().split(/\n/).filter(Boolean).sort();
          if (expected.length !== 49 || JSON.stringify(expected) !== JSON.stringify(actual)) throw new Error('49-path product denominator drifted');
          for (const [path, expectedSha] of Object.entries(handoff.files)) {
            const actualSha = crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            if (actualSha !== expectedSha) throw new Error(`terminal main product member drifted: ${path}`);
          }
          NODE
          test "$(sha256sum images/uc-1352-still.jpg | awk '{print $1}')" = "$MEDIA_ASSET_SHA256"
          test "$(git rev-parse "${EXACT_MAIN}:data/MEDIA-SEARCH-LATEST.json")" = "$MEDIA_SEARCH_BLOB"
          test "$(git rev-parse "${EXACT_MAIN}:data/journal/media-search.jsonl")" = "$MEDIA_SEARCH_JOURNAL_BLOB"

          for spec in \
            "$PRODUCT_PR:$PRODUCT_MAIN" \
            "$V14_CLEANUP_PR:$V14_PUBLISHER_CLEAN_MAIN" \
            "$V10_WORKFLOW_CLEANUP_PR:$V10_WORKFLOW_CLEAN_MAIN" \
            "$PAYLOAD_CLEANUP_PR:$EXACT_MAIN"; do
            pr="${spec%%:*}"
            commit="${spec#*:}"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" > "$OUT/pr-${pr}.json"
            jq -e --arg commit "$commit" '.state=="closed" and .merged==true and .merge_commit_sha==$commit' "$OUT/pr-${pr}.json" >/dev/null
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact terminal proof runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Verify structured Kragar custody, chronology, and publisher policy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const records = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const row = records.find((item) => item.id === 'UC-1352');
          assert.ok(row, 'UC-1352 missing');
          assert.equal(row.actor, 'Dan Starkey');
          assert.equal(row.character, 'Kragar');
          assert.equal(row.universe, 'Doctor Who');
          assert.equal(row.kind, 'face');
          assert.equal(row.still?.src, 'images/uc-1352-still.jpg');
          assert.equal(Object.hasOwn(row, 'portrait'), false);

          const receipt = JSON.parse(fs.readFileSync('data/review/adapter-sdk/doctor-who-cycle-007-kragar.json', 'utf8'));
          assert.equal(receipt.task?.id, 'ap_ffea809b980b468b33fa462c');
          assert.equal(receipt.task?.performer, 'Dan Starkey');
          assert.equal(receipt.task?.character, 'Kragar');
          assert.equal(receipt.task?.adjudicated_kind, 'face');
          assert.equal(receipt.task?.adjudicated_performance_mode, 'physical-prosthetic');
          assert.equal(receipt.lease?.id, 'lease_acb2309e7fb477769749751c');
          assert.equal(receipt.lease?.outcome, 'completed');
          assert.equal(receipt.canonical?.wall_id, 'UC-1352');
          assert.equal(receipt.media?.statuses?.portrait, 'absent');
          assert.equal(receipt.media?.statuses?.still, 'verified');
          assert.equal(receipt.boundary?.still_sha256, 'f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409');
          assert.equal(receipt.boundary?.generic_sontaran_image_used, false);
          assert.equal(receipt.boundary?.existing_dan_starkey_portrait_duplicated, false);
          NODE
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/cycle-006-chronology.log"
          npm run doctor-who:cycle-007:check | tee "$OUT/cycle-007.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard.log"

      - name: Run complete terminal current-main repository and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"
          sha256sum "$OUT/complete-gate.log" | awk '{print $1}' > "$OUT/complete-gate.sha256"

      - name: Rebind live terminal main after the complete gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PAYLOAD_CLEANUP_PR}" > "$OUT/payload-pr-after-gate.json"
          jq -e --arg main "$EXACT_MAIN" '.state=="closed" and .merged==true and .merge_commit_sha==$main' "$OUT/payload-pr-after-gate.json" >/dev/null

      - name: Seal self-hashed terminal current-main receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="prove") | .id' | head -1)"
          test -n "$job_id"
          gate_sha="$(cat "$OUT/complete-gate.sha256")"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-007-KRAGAR-TERMINAL-CURRENT-MAIN-PROOF-V4" \
            --arg verdict "terminal-current-main-verified" \
            --arg product_main "$PRODUCT_MAIN" \
            --arg v14_clean "$V14_PUBLISHER_CLEAN_MAIN" \
            --arg v10_clean "$V10_WORKFLOW_CLEAN_MAIN" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --argjson product_pr "$PRODUCT_PR" \
            --argjson v14_cleanup_pr "$V14_CLEANUP_PR" \
            --argjson v10_cleanup_pr "$V10_WORKFLOW_CLEANUP_PR" \
            --argjson payload_cleanup_pr "$PAYLOAD_CLEANUP_PR" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            --argjson prior_run "$V3_RUN" \
            --argjson prior_job "$V3_JOB" \
            --argjson prior_artifact "$V3_ARTIFACT_ID" \
            --arg prior_artifact_sha256 "$V3_ARTIFACT_SHA256" \
            --arg prior_receipt_sha256 "$V3_RECEIPT_SHA256" \
            --arg prior_gate_sha256 "$V3_GATE_SHA256" \
            --arg gate_sha256 "$gate_sha" \
            --arg media_sha256 "$MEDIA_ASSET_SHA256" \
            '{
              schema_version: 1,
              transaction: $transaction,
              verdict: $verdict,
              product_main: $product_main,
              v14_publisher_clean_main: $v14_clean,
              v10_workflow_clean_main: $v10_clean,
              terminal_main: $main,
              carrier_head: $carrier,
              product_pr: $product_pr,
              cleanup_prs: [$v14_cleanup_pr, $v10_cleanup_pr, $payload_cleanup_pr],
              product_paths: 49,
              removed_cycle_007_workflow_paths: 2,
              removed_cycle_007_transport_paths: 4,
              surviving_cycle_007_github_paths: 0,
              run_id: $run,
              job_id: $job,
              prior_proof: {
                run_id: $prior_run,
                job_id: $prior_job,
                artifact_id: $prior_artifact,
                artifact_sha256: $prior_artifact_sha256,
                receipt_sha256: $prior_receipt_sha256,
                complete_gate_sha256: $prior_gate_sha256
              },
              complete_gate_sha256: $gate_sha256,
              media_asset_sha256: $media_sha256,
              checks: {
                cleanup_tree_equals_gated_head: true,
                payload_cleanup_exact: true,
                prior_proof_rehashed: true,
                all_terminal_product_members_rehashed: true,
                zero_cycle_007_paths_under_github: true,
                structured_task_modality_custody_passed: true,
                cycle_006_chronology_passed: true,
                cycle_007_checker_passed: true,
                publisher_custody_passed: true,
                complete_repository_and_rendered_gate_passed: true,
                live_main_rebound_after_gate: true
              },
              boundary: {
                repository_written: false,
                terminal_main_mutated: false,
                cycle_008_lease_issued: false,
                outside_human_dependency: false
              }
            }' > "$OUT/terminal-current-main-proof.json"
          sha256sum "$OUT/terminal-current-main-proof.json" | awk '{print $1}' > "$OUT/terminal-current-main-proof.sha256"
          test "$(sha256sum "$OUT/terminal-current-main-proof.json" | awk '{print $1}')" = "$(cat "$OUT/terminal-current-main-proof.sha256")"

      - name: Upload immutable terminal current-main proof
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-terminal-current-main-proof-v4-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
