name: star-trek-risik-finalizer-v1

on:
  push:
    branches:
      - agent/star-trek-risik-finalizer-v1

permissions:
  actions: write
  contents: write

concurrency:
  group: star-trek-risik-finalizer-v1
  cancel-in-progress: false

env:
  LIVE_MAIN: "4a2f98c4dc2039f596857cfdff01e701acbd2e4d"
  LIVE_TREE: "cc87894c72de3a7331b7ebe63e11badfaaecb4c5"
  LIVE_PARENT: "129e6f9c389fe61bb8027f4e046bea7de510cb84"
  LIVE_MESSAGE: "Media search: record rolling candidate attempt (2026-08-27)"
  CANDIDATE_BRANCH: "agent/star-trek-risik-candidate-v1"
  CANDIDATE_COMMIT: "03afc14da5b1cbe53cb99708edddb3c4c33a0adf"
  CANDIDATE_TREE: "945e4da7a8b325173ac2b7b8da9fd3d65c5525c3"
  CANDIDATE_RECEIPT_SHA: "831bc23f0060dfdebd3c99ffd905947bf3143344568ee174fe66dac4fcab1641"
  CLAIM_BRANCH: "agent/star-trek-risik-claim-result-v2"
  CLAIM_COMMIT: "eff3da84c7718d0894afda1fbc4e790bc88265da"
  CLAIM_RECEIPT_SHA: "c83b365b93019b0fe0dfd579cabec2cbd7c8dd4b679fcce547a6e59b5980089d"
  REVIEW_BRANCH: "agent/star-trek-risik-independent-review-result-v1"
  REVIEW_COMMIT: "9c3916a64b8026f6dbc50c5a1251ac8950caf378"
  REVIEW_TREE: "cc47fccda9d604d22f64b57c82647d497e39ed2f"
  REVIEW_SHA: "ed561287b1008f0b1a4cc571fc84c8aa0b91d28000df541e69447330c3ba8c04"
  REVIEW_PATH: "transport/star-trek-risik-independent-product-review-v1/independent-review.json"
  STAGE_RESULT_BRANCH: "agent/star-trek-risik-stage-result-v2"
  STAGE_RESULT_COMMIT: "88682ec369b551875f08dc91e197ae8dcb3c70ec"
  STAGE_RESULT_TREE: "a1d3e30452e5a905b0c984ee13e604a376037f91"
  STAGE_RESULT_PATH: "transport/star-trek-risik-stage-v2/stage-result.json"
  SOURCE_REVIEW_BRANCH: "agent/star-trek-risik-source-review-result-v2"
  SOURCE_REVIEW_COMMIT: "c4841daaed48105eaa7eec4b39443ac1f49d930b"
  SOURCE_REVIEW_TREE: "814c734bf02378e2481e2d600f566342c3f997c8"
  SOURCE_REVIEW_SHA: "9205d21aa691550f1da1ae3b6351e4869e574ee14b446d1026d3ca7153300ee6"
  SOURCE_REVIEW_PATH: "transport/star-trek-risik-source-review-v2/source-review.json"
  RECONCILIATION_BRANCH: "agent/star-trek-risik-media-reconciliation-result-v1"
  RECONCILIATION_COMMIT: "934d15d6ebf3f0b42b05ed94bc8efe9f256fa2df"
  RECONCILIATION_TREE: "af0db02e139886ba235ba5c61e912b99384ee031"
  RECONCILIATION_SHA: "4817c8158c87ca9a8ed95ea9ca93a5020249719e10159066b47d44ce1ad83355"
  RECONCILIATION_PATH: "transport/star-trek-risik-media-reconciliation-v1/media-reconciliation.json"
  MEDIA_BRANCH: "agent/star-trek-risik-media-result-v1"
  MEDIA_COMMIT: "86b6fcd580f9439b97f96a20bcace2bfcbcc102d"
  MEDIA_TREE: "933fee84fa5b034f3d753d6a225f6196398fe69f"
  MEDIA_RECEIPT_SHA: "9ccbd09cd8d94751071d65cc327dd04babce8db05f59fc8e47db1832e2547b7c"
  MEDIA_RECEIPT_PATH: "transport/star-trek-risik-media-v1/media-receipt.json"
  MEDIA_REVIEW_BRANCH: "agent/star-trek-risik-media-review-result-v1"
  MEDIA_REVIEW_COMMIT: "1361fe7b0250f59a88255c8f4649bed389c05890"
  MEDIA_REVIEW_TREE: "076ec25f5ee0b2be7eafc6ae15efd13925fc3194"
  MEDIA_REVIEW_SHA: "3fe266654351e5df2cabcbce6045ab3fc13e575b2ce049c245e5aee500d87598"
  MEDIA_REVIEW_PATH: "transport/star-trek-risik-media-review-v1/media-review.json"
  TASK_ID: "ap_096624f177ae0c9f2e91836c"
  PERFORMER: "Fred Tatasciore"
  CHARACTER: "Risik"
  FINGERPRINT: "6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6"
  LEASE_ID: "lease_5d07d02fd67ea40a4950b1dd"
  WALL_ID: "UC-1399"
  STILL_SHA: "3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9"
  PORTRAIT_SHA: "e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42"
  STILL_ITEM: "ma_c33a2bc57b2edeb77c2170e9"
  PORTRAIT_ITEM: "ma_1c7457e3778e5c94ece5dabd"
  MORGO_PRODUCT: "129e6f9c389fe61bb8027f4e046bea7de510cb84"
  MORGO_TREE: "6d32c386636296e76bcab61baa387cb629967ac3"
  MORGO_RECEIPT_SHA: "bbaf8f35578fefe02e5497ed5b11c290dc139f5347cc09cc6a376214d88aaa89"
  MORGO_CHECKER_SHA: "96a01340a938ecaae780704947dd37ff4674dc797a45d901a8dee15bd99f9d26"
  MORGO_CYCLE_ID: "cycle_cbd56708498f15573b441357"
  RESULT_BRANCH: "agent/star-trek-risik-finalizer-result-v1"
  PRODUCT_MESSAGE: "Star Trek: publish Risik cycle"
  FINALIZER: "/tmp/star-trek-risik-finalizer-v1.py"
  WORK: "/tmp/star-trek-risik-product-v1"
  OUT: "/tmp/star-trek-risik-finalizer-v1"

jobs:
  finalize:
    name: finalize-reviewed-risik-cycle-v1
    if: ${{ github.event.head_commit.message == 'Finalize reviewed Star Trek Risik cycle v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify sealed finalizer and immutable review inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum -c .github/recovery/star-trek-risik-finalizer-v1/sealed-manifest.sha256
          cp .github/recovery/star-trek-risik-finalizer-v1/finalizer.py "$FINALIZER"
          chmod +x "$FINALIZER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["FINALIZER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}" \
            "+refs/heads/${STAGE_RESULT_BRANCH}:refs/remotes/origin/${STAGE_RESULT_BRANCH}" \
            "+refs/heads/${SOURCE_REVIEW_BRANCH}:refs/remotes/origin/${SOURCE_REVIEW_BRANCH}" \
            "+refs/heads/${RECONCILIATION_BRANCH}:refs/remotes/origin/${RECONCILIATION_BRANCH}" \
            "+refs/heads/${MEDIA_BRANCH}:refs/remotes/origin/${MEDIA_BRANCH}" \
            "+refs/heads/${MEDIA_REVIEW_BRANCH}:refs/remotes/origin/${MEDIA_REVIEW_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$LIVE_MAIN"
          test "$(git show -s --format=%T "$LIVE_MAIN")" = "$LIVE_TREE"
          test "$(git show -s --format=%P "$LIVE_MAIN")" = "$LIVE_PARENT"
          test "$(git show -s --format=%s "$LIVE_MAIN")" = "$LIVE_MESSAGE"

          test "$(git rev-parse "refs/remotes/origin/${CLAIM_BRANCH}")" = "$CLAIM_COMMIT"
          test "$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")" = "$CANDIDATE_COMMIT"
          test "$(git show -s --format=%T "$CANDIDATE_COMMIT")" = "$CANDIDATE_TREE"
          test "$(git show -s --format=%P "$CANDIDATE_COMMIT")" = "$CLAIM_COMMIT"

          test "$(git rev-parse "refs/remotes/origin/${REVIEW_BRANCH}")" = "$REVIEW_COMMIT"
          test "$(git show -s --format=%T "$REVIEW_COMMIT")" = "$REVIEW_TREE"
          test -z "$(git show -s --format=%P "$REVIEW_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${STAGE_RESULT_BRANCH}")" = "$STAGE_RESULT_COMMIT"
          test "$(git show -s --format=%T "$STAGE_RESULT_COMMIT")" = "$STAGE_RESULT_TREE"
          test "$(git rev-parse "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}")" = "$SOURCE_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_REVIEW_COMMIT")" = "$SOURCE_REVIEW_TREE"
          test "$(git rev-parse "refs/remotes/origin/${RECONCILIATION_BRANCH}")" = "$RECONCILIATION_COMMIT"
          test "$(git show -s --format=%T "$RECONCILIATION_COMMIT")" = "$RECONCILIATION_TREE"
          test "$(git rev-parse "refs/remotes/origin/${MEDIA_BRANCH}")" = "$MEDIA_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_COMMIT")" = "$MEDIA_TREE"
          test "$(git rev-parse "refs/remotes/origin/${MEDIA_REVIEW_BRANCH}")" = "$MEDIA_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_REVIEW_COMMIT")" = "$MEDIA_REVIEW_TREE"

          test "$(git rev-parse "$CANDIDATE_COMMIT:.github")" = "$(git rev-parse "$LIVE_MAIN:.github")"

          git show "$REVIEW_COMMIT:$REVIEW_PATH" > "$OUT/independent-review.json"
          git show "$STAGE_RESULT_COMMIT:$STAGE_RESULT_PATH" > "$OUT/stage-result.json"
          git show "$SOURCE_REVIEW_COMMIT:$SOURCE_REVIEW_PATH" > "$OUT/source-review.json"
          git show "$RECONCILIATION_COMMIT:$RECONCILIATION_PATH" > "$OUT/media-reconciliation.json"
          git show "$MEDIA_COMMIT:$MEDIA_RECEIPT_PATH" > "$OUT/media-receipt.json"
          git show "$MEDIA_REVIEW_COMMIT:$MEDIA_REVIEW_PATH" > "$OUT/media-review.json"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          path = Path(os.environ["OUT"]) / "independent-review.json"
          review = json.loads(path.read_text())
          identity = review["review_sha256"]
          body = dict(review)
          body.pop("review_sha256", None)
          body.pop("artifact", None)
          actual = hashlib.sha256(
              (json.dumps(stable(body), indent=2, ensure_ascii=False) + "\n").encode()
          ).hexdigest()
          assert identity == os.environ["REVIEW_SHA"] == actual
          assert review["transaction"] == "STAR-TREK-RISIK-INDEPENDENT-PRODUCT-REVIEW-V1"
          assert review["verdict"] == "pass"
          assert review["candidate"]["commit"] == os.environ["CANDIDATE_COMMIT"]
          assert review["candidate"]["tree"] == os.environ["CANDIDATE_TREE"]
          assert review["candidate"]["receipt_sha256"] == os.environ["CANDIDATE_RECEIPT_SHA"]
          assert review["task"]["id"] == os.environ["TASK_ID"]
          assert review["task"]["lease_id"] == os.environ["LEASE_ID"]
          assert review["task"]["wall_id"] == os.environ["WALL_ID"]
          assert review["candidate_publication_admissible"] is True
          PY

          git diff --name-only "$LIVE_PARENT" "$LIVE_MAIN" | LC_ALL=C sort > "$OUT/live-maintenance-paths.txt"
          printf '%s\n' data/MEDIA-SEARCH-LATEST.json data/journal/media-search.jsonl \
            | LC_ALL=C sort > "$OUT/expected-live-maintenance-paths.txt"
          diff -u "$OUT/expected-live-maintenance-paths.txt" "$OUT/live-maintenance-paths.txt"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          rows = []
          for relative in (
              "data/MEDIA-SEARCH-LATEST.json",
              "data/journal/media-search.jsonl",
          ):
              data = subprocess.check_output(
                  ["git", "show", f"{os.environ['LIVE_MAIN']}:{relative}"]
              )
              rows.append((relative, hashlib.sha256(data).hexdigest()))
          result = {
              "commit": os.environ["LIVE_MAIN"],
              "tree": os.environ["LIVE_TREE"],
              "parent": os.environ["LIVE_PARENT"],
              "kind": "product-neutral-media-search-maintenance",
              "paths": [row[0] for row in rows],
              "sha256": {key: value for key, value in rows},
          }
          Path(os.environ["OUT"], "maintenance-parent.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )
          PY

      - name: Build deterministic receipt-bearing Risik product
        shell: bash
        run: |
          set -Eeuo pipefail
          git worktree add --detach "$WORK" "$CANDIDATE_COMMIT"

          for relative in data/MEDIA-SEARCH-LATEST.json data/journal/media-search.jsonl; do
            mkdir -p "$WORK/$(dirname "$relative")"
            git show "$LIVE_MAIN:$relative" > "$WORK/$relative"
          done

          cd "$WORK"
          npm ci --ignore-scripts

          jq -n \
            --arg scope "star-trek" \
            --arg lease "$LEASE_ID" \
            --arg reviewed_by "$(jq -r .reviewer "$OUT/independent-review.json")" \
            --arg reviewed_role "$(jq -r .reviewed_role "$OUT/independent-review.json")" \
            --arg reviewed_at "$(jq -r .reviewed_at "$OUT/independent-review.json")" \
            --arg artifact_id "$(jq -r .artifact.id "$OUT/independent-review.json")" \
            --arg artifact_digest "$(jq -r .artifact.digest "$OUT/independent-review.json")" \
            --arg candidate "$CANDIDATE_COMMIT" \
            --arg candidate_receipt "$CANDIDATE_RECEIPT_SHA" \
            --arg review "$REVIEW_SHA" \
            --arg task "$TASK_ID" \
            '{
              scope_id:$scope,
              lease_id:$lease,
              outcome:"completed",
              reviewed_by:$reviewed_by,
              reviewed_role:$reviewed_role,
              reviewed_at:$reviewed_at,
              note:"The reviewed Risik cycle resolves Fred Tatasciore’s animated voice performance as Orion pirate Risik across the three reviewed 2023 Star Trek: Lower Decks appearances, files Something Borrowed, Something Green as the single card production, preserves the exact source-distinct still and performer portrait, and leaves unsupported physical, prosthetic, animation-labor, design, direction, processing, sound, transformation, production-shop, and maker functions unattributed.",
              evidence:[
                {type:"workflow-run",value:("github-actions-artifact:"+$artifact_id+":"+$artifact_digest)},
                {type:"commit",value:$candidate},
                {type:"restart-proof",value:("candidate-receipt:"+$candidate_receipt+";independent-review:"+$review+";lease:"+$lease)}
              ]
            }' > "$OUT/cycle-input.json"

          node scripts/waterline.mjs record-cycle --input "$OUT/cycle-input.json" \
            | tee "$OUT/waterline-record.log"
          node scripts/thesis-rails.mjs next --json > "$OUT/next.json"

          python3 "$FINALIZER" prepare
          node scripts/star-trek-risik-cycle.mjs | tee "$OUT/risik-checker-precommit.log"

          git diff --name-only "$CANDIDATE_COMMIT" | LC_ALL=C sort > "$OUT/finalization-paths.txt"
          printf '%s\n' \
            data/ESTATE-REGISTRY.json \
            data/MEDIA-SEARCH-LATEST.json \
            data/WATERLINE-STATE.json \
            data/journal/media-search.jsonl \
            data/journal/waterline.jsonl \
            data/review/adapter-sdk/star-trek-risik-cycle.json \
            package.json \
            scripts/star-trek-morgo-cycle-composable.mjs \
            scripts/star-trek-risik-cycle.mjs \
            | LC_ALL=C sort > "$OUT/expected-finalization-paths.txt"
          diff -u "$OUT/expected-finalization-paths.txt" "$OUT/finalization-paths.txt"
          if grep -E '^(\.github/|transport/)' "$OUT/finalization-paths.txt"; then
            echo "product contains controller or transport material" >&2
            exit 1
          fi

          git add -A
          git diff --cached --check
          product_tree="$(git write-tree)"
          reviewed_at="$(jq -r .reviewed_at "$OUT/independent-review.json")"
          export GIT_AUTHOR_NAME=undercast-risik-terminalizer-v1
          export GIT_AUTHOR_EMAIL=undercast-risik-terminalizer-v1@users.noreply.github.com
          export GIT_COMMITTER_NAME=undercast-risik-terminalizer-v1
          export GIT_COMMITTER_EMAIL=undercast-risik-terminalizer-v1@users.noreply.github.com
          export GIT_AUTHOR_DATE="$reviewed_at"
          export GIT_COMMITTER_DATE="$reviewed_at"
          product_commit="$(printf '%s\n' "$PRODUCT_MESSAGE" | git commit-tree "$product_tree" -p "$LIVE_MAIN")"

          printf '%s\n' "$product_commit" > "$OUT/product-commit.txt"
          printf '%s\n' "$product_tree" > "$OUT/product-tree.txt"
          test "$(git show -s --format=%P "$product_commit")" = "$LIVE_MAIN"
          test "$(git show -s --format=%s "$product_commit")" = "$PRODUCT_MESSAGE"
          test "$(git rev-parse "$product_commit:.github")" = "$(git rev-parse "$LIVE_MAIN:.github")"

          git checkout --detach "$product_commit"
          git clean -fdx
          npm ci --ignore-scripts

          if test "$(git rev-parse --is-shallow-repository)" = true; then
            git fetch --no-tags --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          else
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          git cat-file -e "$MORGO_PRODUCT^{commit}"

          node scripts/validate.mjs | tee "$OUT/repository-validate.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/waterline-validate.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"
          node scripts/star-trek-risik-cycle.mjs | tee "$OUT/risik-checker.log"
          node scripts/thesis-rails.mjs next --json > "$OUT/next-after-product.json"
          diff -u "$OUT/next.json" "$OUT/next-after-product.json"
          test -z "$(git status --porcelain)"

          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIVE_MAIN"

          jq -n \
            --arg repository_validate "$(sha256sum "$OUT/repository-validate.log" | awk '{print $1}')" \
            --arg media_gate "$(sha256sum "$OUT/media-gate.log" | awk '{print $1}')" \
            --arg waterline_validate "$(sha256sum "$OUT/waterline-validate.log" | awk '{print $1}')" \
            --arg thesis_validate "$(sha256sum "$OUT/thesis-validate.log" | awk '{print $1}')" \
            --arg autopilot_fixtures "$(sha256sum "$OUT/autopilot-fixtures.log" | awk '{print $1}')" \
            --arg risik_checker "$(sha256sum "$OUT/risik-checker.log" | awk '{print $1}')" \
            '{
              repository_validate:{verdict:"pass",log_sha256:$repository_validate},
              media_gate:{verdict:"pass",scope:"star-trek",log_sha256:$media_gate},
              waterline_validate:{verdict:"pass",log_sha256:$waterline_validate},
              thesis_validate:{verdict:"pass",log_sha256:$thesis_validate},
              autopilot_fixtures:{verdict:"pass",log_sha256:$autopilot_fixtures},
              risik_checker:{verdict:"pass",log_sha256:$risik_checker},
              canonical_main_unchanged:true,
              working_tree_clean:true
            }' > "$OUT/control-results.json"

          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload prepared Risik finalizer evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-finalizer-v1-${{ github.run_id }}
          path: /tmp/star-trek-risik-finalizer-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish, deploy, and seal the Risik cycle
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          cd "$WORK"

          product_commit="$(cat "$OUT/product-commit.txt")"
          product_tree="$(cat "$OUT/product-tree.txt")"
          receipt_sha="$(cat "$OUT/receipt-sha256.txt")"
          checker_sha="$(cat "$OUT/checker-sha256.txt")"
          cycle_id="$(cat "$OUT/cycle-id.txt")"

          main_now="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if test "$main_now" = "$LIVE_MAIN"; then
            git push origin "$product_commit:refs/heads/main"
          elif test "$main_now" != "$product_commit"; then
            echo "main moved outside the deterministic Risik publication boundary: $main_now" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            observed="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$observed" = "$product_commit" && break
            sleep 2
          done
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$product_commit"

          pages_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=50" \
              --jq ".workflow_runs[] | select(.head_sha == \"$product_commit\") | .id" \
              | head -n 1
          )"
          if test -z "$pages_run"; then
            gh workflow run pages.yml --ref main
          fi

          pages_run=""
          for attempt in $(seq 1 120); do
            pages_run="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=50" \
                --jq ".workflow_runs[] | select(.head_sha == \"$product_commit\") | .id" \
                | head -n 1
            )"
            test -n "$pages_run" && break
            sleep 5
          done
          test -n "$pages_run"

          for attempt in $(seq 1 180); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$pages_run" > "$OUT/pages-run.json"
            status="$(jq -r .status "$OUT/pages-run.json")"
            test "$status" = completed && break
            sleep 10
          done
          test "$(jq -r .status "$OUT/pages-run.json")" = completed
          test "$(jq -r .conclusion "$OUT/pages-run.json")" = success
          test "$(jq -r .head_sha "$OUT/pages-run.json")" = "$product_commit"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$pages_run/jobs?filter=latest&per_page=100" > "$OUT/pages-jobs.json"
          jq -e '.jobs | any(.name == "deploy" and .status == "completed" and .conclusion == "success")' \
            "$OUT/pages-jobs.json" >/dev/null

          git checkout --detach "$product_commit"
          node scripts/star-trek-risik-cycle.mjs | tee "$OUT/risik-checker-after-deploy.log"
          node scripts/thesis-rails.mjs next --json > "$OUT/next-after-deploy.json"
          diff -u "$OUT/next.json" "$OUT/next-after-deploy.json"

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$product_commit"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          out = Path(os.environ["OUT"])
          pages = json.loads((out / "pages-run.json").read_text())
          jobs = json.loads((out / "pages-jobs.json").read_text())
          next_doc = json.loads((out / "next.json").read_text())
          controls = json.loads((out / "control-results.json").read_text())
          publication = {
              "version": 1,
              "transaction": "STAR-TREK-RISIK-TERMINAL-PUBLICATION-V1",
              "status": "published-and-deployed",
              "canonical": {
                  "commit": (out / "product-commit.txt").read_text().strip(),
                  "tree": (out / "product-tree.txt").read_text().strip(),
                  "parent": os.environ["LIVE_MAIN"],
                  "message": os.environ["PRODUCT_MESSAGE"],
              },
              "task": {
                  "id": os.environ["TASK_ID"],
                  "performer": os.environ["PERFORMER"],
                  "character": os.environ["CHARACTER"],
                  "lease_id": os.environ["LEASE_ID"],
                  "wall_id": os.environ["WALL_ID"],
                  "status": "resolved",
              },
              "candidate": {
                  "commit": os.environ["CANDIDATE_COMMIT"],
                  "tree": os.environ["CANDIDATE_TREE"],
                  "receipt_sha256": os.environ["CANDIDATE_RECEIPT_SHA"],
              },
              "independent_review": {
                  "branch": os.environ["REVIEW_BRANCH"],
                  "commit": os.environ["REVIEW_COMMIT"],
                  "tree": os.environ["REVIEW_TREE"],
                  "review_sha256": os.environ["REVIEW_SHA"],
              },
              "receipt": {
                  "path": "data/review/adapter-sdk/star-trek-risik-cycle.json",
                  "sha256": (out / "receipt-sha256.txt").read_text().strip(),
                  "checker_path": "scripts/star-trek-risik-cycle.mjs",
                  "checker_sha256": (out / "checker-sha256.txt").read_text().strip(),
              },
              "reviewed_cycle_id": (out / "cycle-id.txt").read_text().strip(),
              "prepared_artifact": {
                  "id": int(os.environ["ARTIFACT_ID"]),
                  "digest": os.environ["ARTIFACT_DIGEST"],
              },
              "pages": {
                  "run_id": pages["id"],
                  "status": pages["status"],
                  "conclusion": pages["conclusion"],
                  "head_sha": pages["head_sha"],
                  "deploy_job_ids": [
                      row["id"] for row in jobs["jobs"]
                      if row["name"] == "deploy" and row["conclusion"] == "success"
                  ],
              },
              "queue": {
                  "total": 2228,
                  "queued": 1795,
                  "resolved": 431,
                  "blocked": 0,
                  "rejected": 2,
                  "in_flight": 0,
              },
              "controls": controls,
              "next": next_doc,
              "boundary": {
                  "canonical_mutation_complete": True,
                  "exact_head_deployment_complete": True,
                  "originating_lease_completed": True,
                  "queue_closed": True,
                  "additional_lease_issued": False,
                  "successor_claimed": False,
              },
          }
          (out / "publication.json").write_text(
              json.dumps(publication, indent=2, ensure_ascii=False) + "\n"
          )
          PY

          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          result_now="$(git ls-remote origin "refs/heads/${RESULT_BRANCH}" | awk '{print $1}')"
          if test -z "$result_now"; then
            git config user.name undercast-risik-terminalizer-v1
            git config user.email undercast-risik-terminalizer-v1@users.noreply.github.com
            git checkout --orphan risik-finalizer-result-v1
            git rm -rf .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            mkdir -p transport/star-trek-risik-terminal-v1
            cp -a "$OUT"/. transport/star-trek-risik-terminal-v1/
            git add transport/star-trek-risik-terminal-v1
            git commit -m "Record terminal Star Trek Risik cycle v1"
            git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
          else
            git show "$result_now:transport/star-trek-risik-terminal-v1/publication.json" > /tmp/existing-risik-publication.json
            test "$(jq -r .canonical.commit /tmp/existing-risik-publication.json)" = "$product_commit"
            test "$(jq -r .receipt.sha256 /tmp/existing-risik-publication.json)" = "$receipt_sha"
          fi
