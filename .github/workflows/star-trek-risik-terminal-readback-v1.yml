name: star-trek-risik-terminal-readback-v1

on:
  push:
    branches:
      - agent/star-trek-risik-terminal-readback-recovery-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-risik-terminal-readback-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 28ea3efc9f71d6207794d45cc654af765b36c63e
  EXPECTED_TREE: 52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c
  EXPECTED_PARENT: 4a2f98c4dc2039f596857cfdff01e701acbd2e4d
  EXPECTED_MESSAGE: "Star Trek: publish Risik cycle"
  FINALIZER_RESULT_BRANCH: agent/star-trek-risik-finalizer-result-v1
  FINALIZER_RESULT_COMMIT: d4263c42c4a4a7919d8b4014e597ad10aba9cc91
  FINALIZER_RESULT_TREE: 98b48aed2510691a0ac9a1ffc2cbb3444c1a7e06
  PUBLICATION_PATH: transport/star-trek-risik-terminal-v1/publication.json
  TASK_ID: ap_096624f177ae0c9f2e91836c
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Risik
  EXPECTED_LEASE: lease_5d07d02fd67ea40a4950b1dd
  WALL_ID: UC-1399
  CYCLE_ID: cycle_208262c3f2dc4b499ef5f2f4
  RECEIPT_PATH: data/review/adapter-sdk/star-trek-risik-cycle.json
  RECEIPT_SHA: f413490e8a5daec61c7c3055950bfcee62c6899132677cac07dc197663c649e0
  CHECKER_PATH: scripts/star-trek-risik-cycle.mjs
  CHECKER_SHA: e82284082662b8d13f776c201e36ceca82618d438116f0ad1460c6697663e33f
  STILL_PATH: images/uc-1399-still.webp
  STILL_SHA: 3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9
  PORTRAIT_PATH: images/uc-1399-portrait.jpg
  PORTRAIT_SHA: e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42
  STILL_ITEM: ma_c33a2bc57b2edeb77c2170e9
  PORTRAIT_ITEM: ma_1c7457e3778e5c94ece5dabd
  PAGES_RUN_ID: "33127952335"
  PAGES_DEPLOY_JOB_ID: "98710484501"
  NEXT_TASK_ID: ap_3d10b7a97efdbdd11c50bc2a
  NEXT_PERFORMER: Leonard Nimoy
  NEXT_CHARACTER: Henoch
  NEXT_FINGERPRINT: 53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839
  NEXT_PRIORITY: "1320"
  RESULT_BRANCH: agent/star-trek-risik-terminal-readback-result-v1
  OUT: /tmp/star-trek-risik-terminal-readback-v1

jobs:
  verify:
    name: independently-read-back-terminal-risik-cycle
    if: ${{ github.event.head_commit.message == 'Read back terminal Star Trek Risik cycle v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Freeze exact canonical and publication custody
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"

          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%s HEAD)" = "Read back terminal Star Trek Risik cycle v1"
          git diff --name-only "$EXPECTED_MAIN" HEAD | LC_ALL=C sort > "$OUT/carrier-paths.txt"
          printf '%s\n' .github/workflows/star-trek-risik-terminal-readback-v1.yml > "$OUT/expected-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/carrier-paths.txt"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${FINALIZER_RESULT_BRANCH}:refs/remotes/origin/${FINALIZER_RESULT_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P "$EXPECTED_MAIN")" = "$EXPECTED_PARENT"
          test "$(git show -s --format=%s "$EXPECTED_MAIN")" = "$EXPECTED_MESSAGE"

          result_ref="refs/remotes/origin/${FINALIZER_RESULT_BRANCH}"
          test "$(git rev-parse "$result_ref")" = "$FINALIZER_RESULT_COMMIT"
          test "$(git show -s --format=%T "$result_ref")" = "$FINALIZER_RESULT_TREE"
          test -z "$(git show -s --format=%P "$result_ref")"

          git show "${result_ref}:${PUBLICATION_PATH}" > "$OUT/publication.json"

          jq -e \
            --arg commit "$EXPECTED_MAIN" \
            --arg tree "$EXPECTED_TREE" \
            --arg parent "$EXPECTED_PARENT" \
            --arg message "$EXPECTED_MESSAGE" \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            --arg receipt "$RECEIPT_SHA" \
            --arg checker "$CHECKER_SHA" \
            --arg cycle "$CYCLE_ID" \
            --argjson pages "$PAGES_RUN_ID" \
            '.transaction == "STAR-TREK-RISIK-TERMINAL-PUBLICATION-V1"
             and .status == "published-and-deployed"
             and .canonical == {commit:$commit,tree:$tree,parent:$parent,message:$message}
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id == $wall
             and .task.status == "resolved"
             and .receipt.path == env.RECEIPT_PATH
             and .receipt.sha256 == $receipt
             and .receipt.checker_path == env.CHECKER_PATH
             and .receipt.checker_sha256 == $checker
             and .reviewed_cycle_id == $cycle
             and .pages.run_id == $pages
             and .pages.status == "completed"
             and .pages.conclusion == "success"
             and .pages.head_sha == $commit
             and .queue == {total:2228,queued:1795,resolved:431,blocked:0,rejected:2,in_flight:0}
             and .boundary.canonical_mutation_complete == true
             and .boundary.exact_head_deployment_complete == true
             and .boundary.originating_lease_completed == true
             and .boundary.queue_closed == true
             and .boundary.additional_lease_issued == false
             and .boundary.successor_claimed == false' \
            "$OUT/publication.json" >/dev/null

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}" > "$OUT/pages-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}/jobs?filter=latest&per_page=100" > "$OUT/pages-jobs.json"

          test "$(jq -r .status "$OUT/pages-run.json")" = completed
          test "$(jq -r .conclusion "$OUT/pages-run.json")" = success
          test "$(jq -r .head_sha "$OUT/pages-run.json")" = "$EXPECTED_MAIN"
          jq -e \
            --argjson job "$PAGES_DEPLOY_JOB_ID" \
            '.jobs | any(.id == $job
                         and .name == "deploy"
                         and .status == "completed"
                         and .conclusion == "success")' \
            "$OUT/pages-jobs.json" >/dev/null

          git checkout --detach "$EXPECTED_MAIN"
          git clean -fdx
          npm ci --ignore-scripts

      - name: Independently verify terminal product state
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          OUT = Path(os.environ["OUT"])

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          def pretty(value):
              return json.dumps(stable(value), indent=2, ensure_ascii=False) + "\n"

          def file_sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def asset_src(value):
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return value.get("src")
              return None

          def read(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          publication = read(OUT / "publication.json")
          receipt = read(os.environ["RECEIPT_PATH"])
          receipt_body = dict(receipt)
          identity = receipt_body.pop("receipt_sha256", None)
          reproduced = hashlib.sha256(pretty(receipt_body).encode()).hexdigest()

          if identity != os.environ["RECEIPT_SHA"] or reproduced != identity:
              raise SystemExit(
                  f"Risik receipt identity drifted: {identity} / {reproduced}"
              )
          if receipt.get("transaction") != "STAR-TREK-CYCLE-RISIK":
              raise SystemExit("Risik receipt transaction drifted")
          if receipt.get("version") != 1:
              raise SystemExit("Risik receipt version drifted")
          if receipt.get("canonical_parent") != os.environ["EXPECTED_PARENT"]:
              raise SystemExit("Risik receipt publication parent drifted")
          if file_sha(os.environ["CHECKER_PATH"]) != os.environ["CHECKER_SHA"]:
              raise SystemExit("Risik checker identity drifted")
          if publication["receipt"]["sha256"] != identity:
              raise SystemExit("publication and permanent receipt disagree")

          task_summary = receipt.get("task") or {}
          required_summary = {
              "id": os.environ["TASK_ID"],
              "performer": os.environ["EXPECTED_PERFORMER"],
              "character": os.environ["EXPECTED_CHARACTER"],
          }
          for key, value in required_summary.items():
              if task_summary.get(key) != value:
                  raise SystemExit(
                      f"Risik receipt task {key} drifted: {task_summary.get(key)}"
                  )

          state = read("data/AUTOPILOT.json")
          trek = [row for row in state.get("jobs", []) if row.get("scope") == "star-trek"]
          matches = [row for row in trek if row.get("id") == os.environ["TASK_ID"]]
          if len(matches) != 1:
              raise SystemExit(f"Risik task cardinality drifted: {len(matches)}")
          task = matches[0]
          durable_lease = (
              (task.get("outcome") or {}).get("media_review", {}).get("lease_id")
              or (task.get("outcome") or {}).get("lease_id")
          )
          if (
              task.get("status") != "resolved"
              or task.get("attempts") != 1
              or task.get("performer") != os.environ["EXPECTED_PERFORMER"]
              or task.get("character") != os.environ["EXPECTED_CHARACTER"]
              or task.get("lease") is not None
              or task.get("wall_ids") != [os.environ["WALL_ID"]]
              or durable_lease != os.environ["EXPECTED_LEASE"]
          ):
              raise SystemExit(f"durable Risik task drifted: {task}")

          queue = {
              "total": len(trek),
              "queued": sum(row.get("status") == "queued" for row in trek),
              "resolved": sum(row.get("status") == "resolved" for row in trek),
              "blocked": sum(row.get("status") == "blocked" for row in trek),
              "rejected": sum(row.get("status") == "rejected" for row in trek),
              "in_flight": sum(
                  row.get("status") in {"leased", "drafted", "merged"}
                  for row in trek
              ),
          }
          expected_queue = {
              "total": 2228,
              "queued": 1795,
              "resolved": 431,
              "blocked": 0,
              "rejected": 2,
              "in_flight": 0,
          }
          if queue != expected_queue or publication.get("queue") != expected_queue:
              raise SystemExit(f"terminal Risik queue drifted: {queue}")

          records = [
              row for row in read("data/specimens.json")
              if row.get("id") == os.environ["WALL_ID"]
          ]
          if len(records) != 1:
              raise SystemExit(f"Risik record cardinality drifted: {len(records)}")
          record = records[0]
          expected_record = {
              "actor": os.environ["EXPECTED_PERFORMER"],
              "character": os.environ["EXPECTED_CHARACTER"],
              "production": "Something Borrowed, Something Green",
              "universe": "Star Trek",
              "years": "2023",
              "designer": "—",
              "transform": 2,
              "kind": "voice",
          }
          for key, value in expected_record.items():
              if record.get(key) != value:
                  raise SystemExit(
                      f"Risik record {key} drifted: {record.get(key)}"
                  )
          still = asset_src(record.get("still"))
          portrait = asset_src(record.get("portrait"))
          if still != os.environ["STILL_PATH"]:
              raise SystemExit(f"Risik still path drifted: {still}")
          if portrait != os.environ["PORTRAIT_PATH"]:
              raise SystemExit(f"Risik portrait path drifted: {portrait}")
          if file_sha(still) != os.environ["STILL_SHA"]:
              raise SystemExit("Risik still bytes drifted")
          if file_sha(portrait) != os.environ["PORTRAIT_SHA"]:
              raise SystemExit("Risik portrait bytes drifted")

          audit = read("data/MEDIA-AUDIT.json")
          facets = [
              row for row in audit.get("items", [])
              if row.get("wall_id") == os.environ["WALL_ID"]
              and row.get("side") in {"still", "portrait"}
          ]
          if len(facets) != 2:
              raise SystemExit(f"Risik facet cardinality drifted: {len(facets)}")
          expected_facets = {
              "still": {
                  "id": os.environ["STILL_ITEM"],
                  "sha": os.environ["STILL_SHA"],
                  "presentation": "character-depiction",
              },
              "portrait": {
                  "id": os.environ["PORTRAIT_ITEM"],
                  "sha": os.environ["PORTRAIT_SHA"],
                  "presentation": "neutral-human",
              },
          }
          for facet in facets:
              expected = expected_facets[facet["side"]]
              claims = facet.get("claims") or {}
              identity_claim = claims.get("identity") or {}
              presentation_claim = claims.get("presentation") or {}
              votes = facet.get("votes") or []
              if (
                  facet.get("id") != expected["id"]
                  or facet.get("status") != "verified"
                  or (facet.get("asset") or {}).get("sha256") != expected["sha"]
                  or identity_claim.get("state") != "enforced"
                  or identity_claim.get("value") != "expected"
                  or presentation_claim.get("state") != "enforced"
                  or presentation_claim.get("value") != expected["presentation"]
                  or len(votes) != 2
                  or any(vote.get("asset_sha256") != expected["sha"] for vote in votes)
              ):
                  raise SystemExit(f"Risik {facet['side']} facet drifted: {facet}")

          sources = [
              row for row in read("data/SOURCES.json")
              if row.get("id") == os.environ["WALL_ID"]
          ]
          if len(sources) != 1:
              raise SystemExit(f"Risik source-ledger cardinality drifted: {len(sources)}")
          source = sources[0]
          if (
              source.get("actor") != os.environ["EXPECTED_PERFORMER"]
              or source.get("character") != os.environ["EXPECTED_CHARACTER"]
              or asset_src(source.get("still")) != os.environ["STILL_PATH"]
              or asset_src(source.get("portrait")) != os.environ["PORTRAIT_PATH"]
          ):
              raise SystemExit(f"Risik source ledger drifted: {source}")

          water = read("data/WATERLINE-STATE.json")
          cycles = [
              row for row in water.get("cycles", [])
              if row.get("id") == os.environ["CYCLE_ID"]
              and row.get("scope_id") == "star-trek"
              and row.get("lease_id") == os.environ["EXPECTED_LEASE"]
          ]
          if (
              len(cycles) != 1
              or cycles[0].get("outcome") != "completed"
              or (cycles[0].get("task_statuses") or {}).get(os.environ["TASK_ID"])
                 != "resolved"
          ):
              raise SystemExit(f"Risik reviewed-cycle custody drifted: {cycles}")

          registry = read("data/ESTATE-REGISTRY.json")
          estate = next(
              (row for row in registry.get("estates", []) if row.get("id") == "star-trek"),
              None,
          )
          registry_summary = receipt.get("registry") or {}
          if not estate:
              raise SystemExit("Star Trek estate registry entry is absent")
          if file_sha("data/ESTATE-REGISTRY.json") != registry_summary.get("sha256"):
              raise SystemExit("Risik registry file identity drifted")
          next_gate = estate.get("next_gate") or ""
          next_gate_sha = hashlib.sha256(next_gate.encode()).hexdigest()
          if next_gate_sha != registry_summary.get("next_gate_sha256"):
              raise SystemExit("Risik registry next-gate identity drifted")
          for marker in (
              os.environ["CYCLE_ID"],
              "1,795 tasks remain queued",
              os.environ["NEXT_TASK_ID"],
              os.environ["NEXT_PERFORMER"],
              os.environ["NEXT_CHARACTER"],
          ):
              if marker not in next_gate:
                  raise SystemExit(f"Risik registry phase marker absent: {marker}")

          evidence = {
              "canonical": publication["canonical"],
              "task": task,
              "queue": queue,
              "record": record,
              "facets": sorted(facets, key=lambda row: row["side"]),
              "source": source,
              "reviewed_cycle": cycles[0],
              "registry": {
                  "sha256": registry_summary["sha256"],
                  "next_gate_sha256": next_gate_sha,
                  "next_gate": next_gate,
              },
              "receipt": {
                  "path": os.environ["RECEIPT_PATH"],
                  "receipt_sha256": identity,
                  "checker_path": os.environ["CHECKER_PATH"],
                  "checker_sha256": file_sha(os.environ["CHECKER_PATH"]),
              },
          }
          (OUT / "terminal-product-evidence.json").write_text(
              pretty(evidence),
              encoding="utf-8",
          )
          PY

      - name: Run independent canonical gates and reproduce successor rail
        shell: bash
        run: |
          set -Eeuo pipefail

          node "$CHECKER_PATH" | tee "$OUT/risik-checker.log"
          node scripts/validate.mjs | tee "$OUT/repository-validate.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/waterline-validate.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"
          node scripts/thesis-rails.mjs next --json > "$OUT/next-readback.json"

          jq -S . "$OUT/next-readback.json" > "$OUT/next-readback.sorted.json"
          jq -S .next "$OUT/publication.json" > "$OUT/next-publication.sorted.json"
          diff -u "$OUT/next-publication.sorted.json" "$OUT/next-readback.sorted.json"

          jq -e \
            --arg task "$NEXT_TASK_ID" \
            --arg performer "$NEXT_PERFORMER" \
            --arg character "$NEXT_CHARACTER" \
            --arg fingerprint "$NEXT_FINGERPRINT" \
            --argjson priority "$NEXT_PRIORITY" \
            '.phase == "ready-for-one-cycle"
             and .scope_id == "star-trek"
             and .candidate.task_id == $task
             and .candidate.performer == $performer
             and .candidate.character == $character
             and .candidate.priority == $priority
             and .candidate.performance_modes == ["physical-prosthetic"]
             and .candidate.source_fingerprint == $fingerprint' \
            "$OUT/next-readback.json" >/dev/null

          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Write terminal readback attestation
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          OUT = Path(os.environ["OUT"])

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          def pretty(value):
              return json.dumps(stable(value), indent=2, ensure_ascii=False) + "\n"

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          publication = json.loads((OUT / "publication.json").read_text())
          evidence = json.loads((OUT / "terminal-product-evidence.json").read_text())
          pages = json.loads((OUT / "pages-run.json").read_text())
          jobs = json.loads((OUT / "pages-jobs.json").read_text())
          next_doc = json.loads((OUT / "next-readback.json").read_text())
          deploy_jobs = [
              row for row in jobs.get("jobs", [])
              if row.get("id") == int(os.environ["PAGES_DEPLOY_JOB_ID"])
              and row.get("name") == "deploy"
              and row.get("status") == "completed"
              and row.get("conclusion") == "success"
          ]
          if len(deploy_jobs) != 1:
              raise SystemExit("exact Risik Pages deploy job is absent")

          attestation = {
              "version": 1,
              "transaction": "STAR-TREK-RISIK-TERMINAL-READBACK-V1",
              "verified_at": datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "verifier": "chatgpt-risik-independent-terminal-readback-v1",
              "verdict": "pass",
              "canonical": evidence["canonical"],
              "task": {
                  "id": os.environ["TASK_ID"],
                  "performer": os.environ["EXPECTED_PERFORMER"],
                  "character": os.environ["EXPECTED_CHARACTER"],
                  "lease_id": os.environ["EXPECTED_LEASE"],
                  "wall_id": os.environ["WALL_ID"],
                  "status": "resolved",
              },
              "queue": evidence["queue"],
              "reviewed_cycle_id": os.environ["CYCLE_ID"],
              "receipt": evidence["receipt"],
              "media": {
                  "still_sha256": os.environ["STILL_SHA"],
                  "portrait_sha256": os.environ["PORTRAIT_SHA"],
                  "all_four_claims_enforced": True,
              },
              "pages": {
                  "run_id": pages["id"],
                  "status": pages["status"],
                  "conclusion": pages["conclusion"],
                  "head_sha": pages["head_sha"],
                  "deploy_job_id": deploy_jobs[0]["id"],
                  "deploy_job_conclusion": deploy_jobs[0]["conclusion"],
              },
              "next": next_doc,
              "source_publication": {
                  "branch": os.environ["FINALIZER_RESULT_BRANCH"],
                  "commit": os.environ["FINALIZER_RESULT_COMMIT"],
                  "tree": os.environ["FINALIZER_RESULT_TREE"],
                  "path": os.environ["PUBLICATION_PATH"],
                  "transaction": publication["transaction"],
              },
              "evidence_sha256": hashlib.sha256(
                  (OUT / "terminal-product-evidence.json").read_bytes()
              ).hexdigest(),
              "control_logs": {
                  "risik_checker": sha(OUT / "risik-checker.log"),
                  "repository_validate": sha(OUT / "repository-validate.log"),
                  "media_gate": sha(OUT / "media-gate.log"),
                  "waterline_validate": sha(OUT / "waterline-validate.log"),
                  "thesis_validate": sha(OUT / "thesis-validate.log"),
                  "autopilot_fixtures": sha(OUT / "autopilot-fixtures.log"),
              },
              "boundary": {
                  "exact_head_deployment_complete": True,
                  "queue_closed": True,
                  "originating_lease_completed": True,
                  "additional_lease_issued": False,
                  "successor_claimed": False,
                  "canonical_mutation_by_readback": False,
              },
          }
          body = pretty(attestation)
          attestation["attestation_sha256"] = hashlib.sha256(body.encode()).hexdigest()
          (OUT / "terminal-readback.json").write_text(
              pretty(attestation),
              encoding="utf-8",
          )
          PY

          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            --arg next "$NEXT_TASK_ID" \
            '.transaction == "STAR-TREK-RISIK-TERMINAL-READBACK-V1"
             and .verdict == "pass"
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id == $wall
             and .queue == {total:2228,queued:1795,resolved:431,blocked:0,rejected:2,in_flight:0}
             and .pages.conclusion == "success"
             and .pages.head_sha == .canonical.commit
             and .next.phase == "ready-for-one-cycle"
             and .next.candidate.task_id == $next
             and .boundary.exact_head_deployment_complete == true
             and .boundary.queue_closed == true
             and .boundary.originating_lease_completed == true
             and .boundary.additional_lease_issued == false
             and .boundary.successor_claimed == false
             and .boundary.canonical_mutation_by_readback == false' \
            "$OUT/terminal-readback.json" >/dev/null

          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload terminal readback evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-terminal-readback-v1
          path: /tmp/star-trek-risik-terminal-readback-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable terminal readback result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail

          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/terminal-readback.json" > "$OUT/readback.tmp"
          mv "$OUT/readback.tmp" "$OUT/terminal-readback.json"

          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git config user.name undercast-risik-terminal-readback-v1
          git config user.email undercast-risik-terminal-readback-v1@users.noreply.github.com
          git checkout --orphan risik-terminal-readback-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-risik-terminal-readback-v1
          cp -a "$OUT"/. transport/star-trek-risik-terminal-readback-v1/
          git add transport/star-trek-risik-terminal-readback-v1
          git diff --cached --check
          git commit -m "Record Star Trek Risik terminal readback v1"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
