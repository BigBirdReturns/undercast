name: extract-doctor-who-cycle-002-current-tree

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/extract-doctor-who-cycle-002-current-tree.yml"

permissions:
  contents: read

concurrency:
  group: extract-doctor-who-cycle-002-current-tree-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prove head and record exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD > /tmp/head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/tree.txt
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sort > /tmp/paths.txt
          cat /tmp/head.txt /tmp/tree.txt /tmp/paths.txt

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-current-tree-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/head.txt
            /tmp/tree.txt
            /tmp/paths.txt
