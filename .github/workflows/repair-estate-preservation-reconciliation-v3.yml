name: repair-estate-preservation-reconciliation-v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-estate-preservation-reconciliation-v3.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: repair-estate-preservation-reconciliation-v3
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TARGET_BRANCH: main
  AUTHORIZED_HEAD: ${{ github.sha }}
  TARGET_WORKFLOW: .github/workflows/reconcile-estate-preservation.yml
  PRESERVE_WORKFLOW: .github/workflows/preserve.yml
  FIXTURES: scripts/preservation-fixtures.mjs
  REPAIR_SCRIPT: scripts/repair-preservation-receipt-staging.py
  LEGACY_LAUNCHER: .github/workflows/repair-estate-preservation-reconciliation.yml
  SELF: .github/workflows/repair-estate-preservation-reconciliation-v3.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply and verify the durable preservation repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          python3 -m py_compile "$REPAIR_SCRIPT"
          python3 "$REPAIR_SCRIPT"
          node --check "$FIXTURES"
          npm run preserve:fixtures
          grep -Fq 'workflow_dispatch:' "$TARGET_WORKFLOW"
          grep -Fq "new Set(['success', 'failure'])" "$TARGET_WORKFLOW"
          grep -Fq 'source_run_success_treated_as_registry_publication' "$TARGET_WORKFLOW"
          grep -Fq 'if [ -e preservation/BOOTSTRAP-PENDING ]; then' "$PRESERVE_WORKFLOW"
          ! grep -Fq 'preservation/BOOTSTRAP-PENDING 2>/dev/null || true' "$PRESERVE_WORKFLOW"
          git diff --check -- "$TARGET_WORKFLOW" "$PRESERVE_WORKFLOW" "$FIXTURES"

      - name: Stage exact repair, retire transient machinery, and gate
        run: |
          set -euo pipefail
          git rm "$SELF" "$LEGACY_LAUNCHER" "$REPAIR_SCRIPT"
          git add "$TARGET_WORKFLOW" "$PRESERVE_WORKFLOW" "$FIXTURES"
          git diff --cached --check
          paths="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n' "$SELF" "$LEGACY_LAUNCHER" "$REPAIR_SCRIPT" "$TARGET_WORKFLOW" "$PRESERVE_WORKFLOW" "$FIXTURES" | sort)"
          test "$paths" = "$expected"
          npm run gate -- --skip-rendered

      - name: Publish the exact repair under lease
        id: publish
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report __pycache__ scripts/__pycache__
          git checkout -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'undercast-preservation-repair'
          git config user.email 'undercast-preservation-repair@users.noreply.github.com'
          git commit \
            -m 'Preservation: make receipt staging fail closed' \
            -m 'source_export_success_is_not_registry_publication=true' \
            -m 'required_git_add_errors_are_not_suppressed=true' \
            -m 'optional_bootstrap_path_is_conditional=true' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "repair_workflow_run=${GITHUB_RUN_ID}"
          repair_head="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "repair_head=$repair_head" >> "$GITHUB_OUTPUT"

      - name: Dispatch repaired reconciliation and record custody
        env:
          REPAIR_HEAD: ${{ steps.publish.outputs.repair_head }}
        run: |
          set -euo pipefail
          dispatch_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run reconcile-estate-preservation.yml --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 180); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow reconcile-estate-preservation.yml \
              --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 100 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt > /tmp/repaired-preservation-runs.json
            run_id="$(DISPATCH_AFTER="$dispatch_after" node - <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/repaired-preservation-runs.json', 'utf8'));
          const floor = Date.parse(process.env.DISPATCH_AFTER);
          const row = runs.find((run) => run.headSha === process.env.REPAIR_HEAD && run.event === 'workflow_dispatch' && Date.parse(run.createdAt) >= floor - 5000);
          if (row) process.stdout.write(String(row.databaseId));
          NODE
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          run_url="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          gh pr comment 132 --repo "$GITHUB_REPOSITORY" --body "Preservation receipt staging is now fail-closed on main head ${REPAIR_HEAD}. Workflow run ${GITHUB_RUN_ID} passed the repository gate, removed both failed launchers plus its transient repair program, and fixed the swallowed optional-path error with fixture coverage. Repaired reconciliation run ${run_id} is bound to the exact repaired head: ${run_url}"
          echo "reconciliation run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"
          echo "${run_url}" >> "$GITHUB_STEP_SUMMARY"
