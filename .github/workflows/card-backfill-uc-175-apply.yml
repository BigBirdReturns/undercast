name: card-backfill-uc-175-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-175-APPLY.json"
      - ".github/CARD-BACKFILL-UC-175-APPLY-FAILURES.json"
      - "scripts/card-backfill-uc-175-apply.mjs"
      - ".github/workflows/card-backfill-uc-175-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-175-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-039'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-039
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install Chromium for the complete rendered gate
        run: npx playwright install --with-deps chromium
      - name: Verify exact repaired apply authorization and online custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(sha256sum .github/CARD-BACKFILL-UC-175-APPLY.json | cut -d' ' -f1)" = "5c00a0e9c9595839d2bc66693ed1019c426a8aea3ff36c97341b173bb3818e9b"
          test "$(sha256sum .github/CARD-BACKFILL-UC-175-APPLY-FAILURES.json | cut -d' ' -f1)" = "52ac62426307a15ab989974f60e23e3d8d661e2a8fad93524e7053c74ad2d0f2"
          test "$(sha256sum scripts/card-backfill-uc-175-apply.mjs | cut -d' ' -f1)" = "1c80f49e12b45627d085c9ff649573f7b348ba82b7c665827ba1089687d61c5d"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-175-APPLY.json','utf8'));
          const f=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-175-APPLY-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(x=>x.id==='UC-175');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(x=>x.id==='UC-175');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(x=>x.id==='ma_4f6f8c344e4fe375194d8f22');
          if(c.version!==1||c.lane!=='card-backfill'||c.record_id!=='UC-175'||c.kind!=='voice'||c.actor!=='Ben Burtt'||c.character!=='The voices of R2-D2 & WALL·E'||c.production!=='Star Wars / WALL·E'||c.years!=='1977–'||c.side!=='still')throw new Error('UC-175 apply identity drift');
          if(c.render_artifact?.run_id!==30498080594||c.render_artifact?.artifact_id!==8742397607||c.render_artifact?.name!=='card-backfill-uc-175-render-30498080594'||c.render_artifact?.head_sha!=='4e540424bd79762ed37085478c83e8cbdf1fe2e4'||c.render_artifact?.artifact_digest_sha256!=='5ee47860d20e9e59b73f6e081e4e27ea2ca1679482ce510d80f4944645a641e6')throw new Error('UC-175 render artifact identity drift');
          if(c.render_artifact?.render_sha256!=='b825dea86f8d30c792baa5840a0a06317e01290f70badcc272f2b5952f456e49'||c.render_artifact?.sums_sha256!=='132b4d883675b96f0e2a9ddebdf48032c53f478732a347e51d1577b68a004e08')throw new Error('UC-175 render packet drift');
          if(c.source_sha256?.r2d2!=='e87e81781b33a2009d4b776feced42d30e96bff8c58e2f5ba18d4d0cfbb5356d'||c.source_sha256?.walle!=='d93d4066c4b72e0e2323ca7e9f294bd349a9142d6e356950a115c35471109c15')throw new Error('UC-175 selected source drift');
          if(c.candidate?.sha256!=='a7d7b4705d3b33de71509f3523f4a9aa56feda22d72e0564e2d1c7afbca9929d'||c.crop_preview?.sha256!=='a8ff414781fca58288e6182e0b0ac3efb547e3aabad8536267aa95449b0a631a'||c.duplicate_scan_sha256!=='b4871e8bd11c71cdd4cbd924d6a51ea4ef7452ef06949aa0a1d217b05269af9d')throw new Error('UC-175 render output drift');
          if(c.expected_repository_hash_count!==2070||c.expected_permanent_file_count!==17||c.canonical_mutation!==false)throw new Error('UC-175 apply denominator drift');
          const failed=f.failed_apply_checkpoints?.[0];
          if(f.version!==1||f.record_id!=='UC-175'||f.failed_apply_checkpoints?.length!==1||failed?.run_id!==30498561736||failed?.artifact_id!==8742574065||failed?.head_sha!=='5ef216171bd766d21278bf68396f52fbaf98bc7a'||failed?.artifact_digest_sha256!=='8b2d17003391537767117f5c13414742fd9bb12dad3ce26fd9e7be0dbc8c426a')throw new Error('UC-175 failed apply custody drift');
          if(failed?.materialized_manifest_sha256!=='49129be8028f97c135ae724d75346953fb69e34af7f13dcdebee082a4423a2e9'||failed?.materialized_sums_sha256!=='825d8a3c6808f5070655a941184dfb88b1158bb078eb92e052c459e4e9831331'||failed?.canonical_gate_started!==false||failed?.permanent_commit_created!==false||failed?.branch_pushed!==false||failed?.canonical_mutation!==false)throw new Error('UC-175 failed apply disposition drift');
          if(f.repair_boundary?.actor_role_character_production_and_visual_source_custody_must_be_separate!==true||f.repair_boundary?.starwars_r2_biography_gallery_must_not_be_actor_role_evidence!==true||f.repair_boundary?.staged_denominator_must_be_compared_against_base!=='agent/card-backfill-next-038'||f.repair_boundary?.permanent_diff_must_be_exactly_17_uc175_evidence_files!==true||f.repair_boundary?.failed_materialized_packet_hashes_must_not_be_published!==true||f.repair_boundary?.complete_canonical_gate_required_before_push!==true||f.repair_boundary?.canonical_mutation!==false)throw new Error('UC-175 apply repair boundary drift');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-175-portrait.jpg')throw new Error('UC-175 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-175-portrait.jpg')throw new Error('UC-175 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-175'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-175 media-audit boundary drift');
          const headers={Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'};
          for(const artifact of [c.render_artifact,{artifact_id:failed.artifact_id,artifact_name:failed.artifact_name,artifact_digest_sha256:failed.artifact_digest_sha256,run_id:failed.run_id,head_sha:failed.head_sha}]){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/artifacts/${artifact.artifact_id}`,{headers});
            if(!response.ok)throw new Error(`artifact metadata HTTP ${response.status}`);
            const metadata=await response.json();
            const expectedName=artifact.name||artifact.artifact_name;
            if(metadata.name!==expectedName||metadata.expired||metadata.workflow_run?.id!==artifact.run_id||metadata.workflow_run?.head_sha!==artifact.head_sha||metadata.digest!==`sha256:${artifact.artifact_digest_sha256}`)throw new Error(`artifact live metadata drift ${artifact.artifact_id}`);
          }
          console.log('PASS — repaired UC-175 apply, failed checkpoint, typed custody, and live artifacts authorized');
          NODE
      - name: Download exact rendered evidence packet
        uses: actions/download-artifact@v4
        with:
          name: card-backfill-uc-175-render-30498080594
          path: ${{ runner.temp }}/uc175-render
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30498080594
      - name: Materialize and verify the repaired permanent 17-file packet
        env:
          RENDER_ROOT: ${{ runner.temp }}/uc175-render/card-backfill-uc-175-render
          APPLY_FAILURES: .github/CARD-BACKFILL-UC-175-APPLY-FAILURES.json
          OUT: data/review/card-backfill/UC-175
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uc175-apply-receipt"
          node --check scripts/card-backfill-uc-175-apply.mjs
          node scripts/card-backfill-uc-175-apply.mjs | tee "$RUNNER_TEMP/uc175-apply-receipt/materializer.json"
          test "$(find data/review/card-backfill/UC-175 -maxdepth 1 -type f | wc -l)" -eq 17
          (
            cd data/review/card-backfill/UC-175
            sha256sum -c SHA256SUMS
          ) | tee "$RUNNER_TEMP/uc175-apply-receipt/permanent-checksums.txt"
          test "$(sha256sum data/review/card-backfill/UC-175/manifest.json | cut -d' ' -f1)" = "05a0685ce2d50ffdfb4686570e168ee38818163ff36dcf20447e66bb7730ee53"
          test "$(sha256sum data/review/card-backfill/UC-175/SHA256SUMS | cut -d' ' -f1)" = "6e2a2c0eba9e890415f7e665d6d5335bf99c5a1a236eb513a581e5ee6c9de757"
          test "$(sha256sum data/review/card-backfill/UC-175/review.json | cut -d' ' -f1)" = "41484f3bcbb3393dcc8f30a77dd234956434ad34c252dc9856f0526bc87aed64"
          test "$(sha256sum data/review/card-backfill/UC-175/review.md | cut -d' ' -f1)" = "b5f4fc7b118061de64fb7824ad7e781bd63b1b67b418a1527e41ae01949af0b0"
          test "$(sha256sum data/review/card-backfill/UC-175/exact-voice-record.json | cut -d' ' -f1)" = "7f1243ad5f7f9e38a34e00fe69d2c2b96be287fec6423be88a26ec80aa9c05dc"
          cp data/review/card-backfill/UC-175/manifest.json "$RUNNER_TEMP/uc175-apply-receipt/manifest.json"
          cp data/review/card-backfill/UC-175/SHA256SUMS "$RUNNER_TEMP/uc175-apply-receipt/SHA256SUMS"
      - name: Retire all 18 temporary paths and prove the exact final PR tree
        env:
          PERMANENT_BASE: bb093fed2b70e7f36fc3cddcf1e218acd36fa10c
        run: |
          set -euo pipefail
          rm -f \
            .github/CARD-BACKFILL-UC-175.json \
            .github/CARD-BACKFILL-UC-175-DISCOVER.json \
            .github/CARD-BACKFILL-UC-175-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-175-RENDER.json \
            .github/CARD-BACKFILL-UC-175-APPLY.json \
            .github/CARD-BACKFILL-UC-175-APPLY-FAILURES.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-175-scope.yml \
            .github/workflows/card-backfill-uc-175-discover.yml \
            .github/workflows/card-backfill-uc-175-discover-r2-gallery.yml \
            .github/workflows/card-backfill-uc-175-render.yml \
            .github/workflows/card-backfill-uc-175-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-175-scope.mjs \
            scripts/card-backfill-uc-175-discover.mjs \
            scripts/card-backfill-uc-175-discover-r2-gallery.mjs \
            scripts/card-backfill-uc-175-render.mjs \
            scripts/card-backfill-uc-175-apply.mjs
          git add -A
          cat > "$RUNNER_TEMP/uc175-expected-paths.txt" <<'EOF'
          data/review/card-backfill/UC-175/SHA256SUMS
          data/review/card-backfill/UC-175/card-crop-preview.jpg
          data/review/card-backfill/UC-175/duplicate-scan.json
          data/review/card-backfill/UC-175/exact-voice-record.json
          data/review/card-backfill/UC-175/manifest.json
          data/review/card-backfill/UC-175/r2-d2-original.jpg
          data/review/card-backfill/UC-175/review.json
          data/review/card-backfill/UC-175/review.md
          data/review/card-backfill/UC-175/source-page-disney-walle-ben-burtt.png
          data/review/card-backfill/UC-175/source-page-pixar-walle-character.png
          data/review/card-backfill/UC-175/source-page-starwars-r2-biography-gallery.png
          data/review/card-backfill/UC-175/source-page-starwars-r2-character.png
          data/review/card-backfill/UC-175/source-page-starwars-r2-sound.png
          data/review/card-backfill/UC-175/source-r2-d2-gallery-selection.json
          data/review/card-backfill/UC-175/source-walle-selection.json
          data/review/card-backfill/UC-175/uc-175-still-candidate.jpg
          data/review/card-backfill/UC-175/walle-original.webp
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/uc175-expected-paths.txt"
          sort -o "$RUNNER_TEMP/uc175-expected-paths.txt" "$RUNNER_TEMP/uc175-expected-paths.txt"
          git diff --cached --name-status > "$RUNNER_TEMP/uc175-staged-name-status.txt"
          test "$(awk '$1=="A"{n++} END{print n+0}' "$RUNNER_TEMP/uc175-staged-name-status.txt")" -eq 17
          test "$(awk '$1=="D"{n++} END{print n+0}' "$RUNNER_TEMP/uc175-staged-name-status.txt")" -eq 18
          test "$(wc -l < "$RUNNER_TEMP/uc175-staged-name-status.txt")" -eq 35
          git diff --name-only "$PERMANENT_BASE" -- | sort > "$RUNNER_TEMP/uc175-final-paths.txt"
          diff -u "$RUNNER_TEMP/uc175-expected-paths.txt" "$RUNNER_TEMP/uc175-final-paths.txt"
          git diff --name-status "$PERMANENT_BASE" -- > "$RUNNER_TEMP/uc175-final-name-status.txt"
          test "$(awk '$1=="A"{n++} END{print n+0}' "$RUNNER_TEMP/uc175-final-name-status.txt")" -eq 17
          test "$(wc -l < "$RUNNER_TEMP/uc175-final-name-status.txt")" -eq 17
          git diff --cached --check
          cp "$RUNNER_TEMP/uc175-final-paths.txt" "$RUNNER_TEMP/uc175-apply-receipt/changed-files.txt"
          cp "$RUNNER_TEMP/uc175-staged-name-status.txt" "$RUNNER_TEMP/uc175-apply-receipt/staged-name-status.txt"
          cp "$RUNNER_TEMP/uc175-final-name-status.txt" "$RUNNER_TEMP/uc175-apply-receipt/final-name-status.txt"
          git diff --stat "$PERMANENT_BASE" -- > "$RUNNER_TEMP/uc175-apply-receipt/diff-stat.txt"
          git status --short > "$RUNNER_TEMP/uc175-apply-receipt/pre-gate-status.txt"
      - name: Run the complete canonical repository gate
        env:
          PERMANENT_BASE: bb093fed2b70e7f36fc3cddcf1e218acd36fa10c
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee "$RUNNER_TEMP/uc175-apply-receipt/gate.log"
          test -z "$(git diff --name-only)"
          git diff --name-only "$PERMANENT_BASE" -- | sort > "$RUNNER_TEMP/uc175-post-gate-paths.txt"
          diff -u "$RUNNER_TEMP/uc175-expected-paths.txt" "$RUNNER_TEMP/uc175-post-gate-paths.txt"
          test "$(git diff --name-status "$PERMANENT_BASE" -- | awk '$1=="A"{n++} END{print n+0}')" -eq 17
          test "$(git diff --name-status "$PERMANENT_BASE" -- | wc -l)" -eq 17
          git diff --cached --check
      - name: Commit and publish the permanent evidence-only head
        env:
          PERMANENT_BASE: bb093fed2b70e7f36fc3cddcf1e218acd36fa10c
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Card backfill: retain UC-175 Ben Burtt R2-D2 and WALL-E still"
          FINAL_HEAD="$(git rev-parse HEAD)"
          git diff --name-only "$PERMANENT_BASE" HEAD -- | sort > "$RUNNER_TEMP/uc175-committed-paths.txt"
          diff -u "$RUNNER_TEMP/uc175-expected-paths.txt" "$RUNNER_TEMP/uc175-committed-paths.txt"
          test "$(git diff --name-status "$PERMANENT_BASE" HEAD -- | awk '$1=="A"{n++} END{print n+0}')" -eq 17
          test "$(git diff --name-status "$PERMANENT_BASE" HEAD -- | wc -l)" -eq 17
          git push origin HEAD:agent/card-backfill-next-039
          test -z "$(git status --porcelain)"
          printf '%s\n' "$FINAL_HEAD" > "$RUNNER_TEMP/uc175-apply-receipt/final-head.txt"
          git show --format=fuller --stat --summary HEAD > "$RUNNER_TEMP/uc175-apply-receipt/final-commit.txt"
          git status --short > "$RUNNER_TEMP/uc175-apply-receipt/final-status.txt"
          node --input-type=module - <<'NODE' > "$RUNNER_TEMP/uc175-apply-receipt/final.json"
          import fs from 'node:fs';
          const head=fs.readFileSync(process.env.RUNNER_TEMP+'/uc175-apply-receipt/final-head.txt','utf8').trim();
          console.log(JSON.stringify({
            version:1,
            record_id:'UC-175',
            branch:'agent/card-backfill-next-039',
            head,
            changed_files:17,
            permanent_directory:'data/review/card-backfill/UC-175',
            manifest_sha256:'05a0685ce2d50ffdfb4686570e168ee38818163ff36dcf20447e66bb7730ee53',
            checksum_ledger_sha256:'6e2a2c0eba9e890415f7e665d6d5335bf99c5a1a236eb513a581e5ee6c9de757',
            exact_voice_record_sha256:'7f1243ad5f7f9e38a34e00fe69d2c2b96be287fec6423be88a26ec80aa9c05dc',
            candidate_sha256:'a7d7b4705d3b33de71509f3523f4a9aa56feda22d72e0564e2d1c7afbca9929d',
            wall_crop_sha256:'a8ff414781fca58288e6182e0b0ac3efb547e3aabad8536267aa95449b0a631a',
            failed_apply_run_id:30498561736,
            typed_custody:true,
            gate:'PASS',
            canonical_mutation:false,
            temporary_paths_retired:true,
            clean_worktree:true
          },null,2));
          NODE
      - name: Upload permanent apply and complete-gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-175-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/uc175-apply-receipt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
