name: doctor-who-cycle-009-eligibility-release-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-eligibility-release-v1.yml"
  schedule:
    - cron: "47 20 8 8 *"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-eligibility-release-v1
  cancel-in-progress: false

env:
  FLOOR_MAIN: 47ccb38eab6a4b6e2a16ed92b04f1259b95de783
  SELF: .github/workflows/doctor-who-cycle-009-eligibility-release-v1.yml
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-009-eligibility-release-v1
  ELIGIBLE_AT: "2026-08-08T20:42:01.000Z"
  SCOPE_ID: doctor-who
  PROFILE_ID: text-vision
  CYCLE_008_ID: cycle_89daa03cca72b8522c76725c
  CYCLE_008_LEASE: lease_e65f837070361eacbb1abd46
  EXPECTED_TOTAL: "316"
  EXPECTED_QUEUED: "308"
  EXPECTED_RESOLVED: "8"
  EXPECTED_IN_FLIGHT: "0"
  PREFLIGHT_RUN: "31234824874"
  PREFLIGHT_ARTIFACT: "9015013259"
  PREFLIGHT_HEAD: 23dbc27eed4049701d1a0cd79818650b461c3beb
  PREFLIGHT_ARTIFACT_SHA256: b3842656907e8f9e0d02b73ca663e0110e88c57f476f428521f4ca27c65e7597
  PREFLIGHT_RECEIPT_IDENTITY: 6ed753a5e5a599412686480790d47613a11d5341b8d88e33e0df0d2e1d7b0168
  PREFLIGHT_ORDERED_COMMITMENT: 85147ec9b85f31aa2daab21bb63b54e4a4c9b96e20cbf8d6c503fd6571b50c36
  PREFLIGHT_FIRST_COMMITMENT: e14d6d61d0c6164982b747f1fa45427cf25e72286de2306c661ac63b16965d4f

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-eligibility-release-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-009-eligibility-release-v1-qualify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bind exact one-path installation candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,receipt}
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$FLOOR_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$FLOOR_MAIN"
          test "$(git rev-list --count "$FLOOR_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$FLOOR_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$FLOOR_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$FLOOR_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); pr=json.loads((root/'api/pr.json').read_text()); files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['FLOOR_MAIN']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
      - name: Verify frozen pre-eligibility receipt and repository-native controls
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs validate
          node scripts/publisher-custody.mjs check-workflows
          node scripts/publisher-condition-custody.mjs check-workflows
          node scripts/gate-fixtures.mjs
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT" > "$OUT/api/artifact.json"
          jq -e --argjson id "$PREFLIGHT_ARTIFACT" --arg digest "sha256:$PREFLIGHT_ARTIFACT_SHA256" --argjson run "$PREFLIGHT_RUN" --arg head "$PREFLIGHT_HEAD" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run and .workflow_run.head_sha==$head' "$OUT/api/artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/preflight.zip"
          test "$(sha256sum "$OUT/preflight.zip" | awk '{print $1}')" = "$PREFLIGHT_ARTIFACT_SHA256"
          ZIP="$OUT/preflight.zip" TARGET="$OUT/preflight" python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
            for i in f.infolist():
              p=pathlib.PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
              out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(f.read(i))
          receipt=json.loads((target/'preeligibility-selector-census.json').read_text()); identity=receipt.pop('identity')
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          assert hashlib.sha256(json.dumps(stable(receipt),separators=(',',':')).encode()).hexdigest()==identity==os.environ['PREFLIGHT_RECEIPT_IDENTITY']
          assert receipt['canonical_main']==os.environ['FLOOR_MAIN'] and receipt['eligible_at']==os.environ['ELIGIBLE_AT']
          assert receipt['ordered_compatible_queue_commitment']==os.environ['PREFLIGHT_ORDERED_COMMITMENT']
          assert receipt['first_eligible_candidate_commitment']==os.environ['PREFLIGHT_FIRST_COMMITMENT']
          assert receipt['candidate_identity_disclosed'] is False and receipt['cycle_009_authorized'] is False
          PY
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$FLOOR_MAIN"
      - name: Seal installation qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); receipt={'status':'qualified-one-shot-cycle-009-eligibility-release','carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'floor_main':os.environ['FLOOR_MAIN'],'workflow_path':os.environ['SELF'],'scheduled_for':'2026-08-08T20:47:00.000Z','eligible_at':os.environ['ELIGIBLE_AT'],'preflight_run':int(os.environ['PREFLIGHT_RUN']),'preflight_artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'candidate_identity_disclosed':False,'repository_write':False,'queue_mutated':False,'lease_issued':False,'cycle_009_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/installation-qualification.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
      - name: Upload installation qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-eligibility-release-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-eligibility-release-v1-qualify/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: github.repository == 'BigBirdReturns/undercast' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-009-eligibility-release-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bind one-shot eligibility window and workflow-only descendant main
        id: window
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,diagnostics,receipt,source}
          if [ "$(date -u +%Y)" != 2026 ]; then printf 'active=false\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          now_ms="$(date -u +%s%3N)"; eligible_ms="$(node -e 'process.stdout.write(String(Date.parse(process.env.ELIGIBLE_AT)))')"
          test "$now_ms" -ge "$eligible_ms"
          current="$(git rev-parse HEAD)"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$current"
          git merge-base --is-ancestor "$FLOOR_MAIN" "$current"
          git diff --name-only "$FLOOR_MAIN".."$current" | LC_ALL=C sort > "$OUT/diagnostics/floor-to-release-main-paths.txt"
          CURRENT="$current" ROOT="$OUT" python3 - <<'PY'
          import os
          from pathlib import Path
          paths=(Path(os.environ['ROOT'])/'diagnostics/floor-to-release-main-paths.txt').read_text().splitlines()
          assert paths and os.environ['SELF'] in paths and all(p.startswith('.github/workflows/') for p in paths),paths
          PY
          git cat-file -e "$current:$SELF"
          printf '%s\n' "$current" > "$OUT/release-main.txt"; printf 'RELEASE_MAIN=%s\n' "$current" >> "$GITHUB_ENV"; printf 'active=true\n' >> "$GITHUB_OUTPUT"
      - name: Retain and verify frozen pre-eligibility selector commitments
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT" > "$OUT/api/artifact.json"
          jq -e --argjson id "$PREFLIGHT_ARTIFACT" --arg digest "sha256:$PREFLIGHT_ARTIFACT_SHA256" --argjson run "$PREFLIGHT_RUN" --arg head "$PREFLIGHT_HEAD" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run and .workflow_run.head_sha==$head' "$OUT/api/artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/source/preflight.zip"
          test "$(sha256sum "$OUT/source/preflight.zip" | awk '{print $1}')" = "$PREFLIGHT_ARTIFACT_SHA256"
          ZIP="$OUT/source/preflight.zip" TARGET="$OUT/source/preflight" python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
            for i in f.infolist():
              p=pathlib.PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
              out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(f.read(i))
          for line in (target/'SHA256SUMS.pre').read_text().splitlines():
            digest,original=line.split(None,1); p=target/pathlib.Path(original).name; assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          assert hashlib.sha256((target/'SHA256SUMS.pre').read_bytes()).hexdigest()==(target/'SHA256SUMS').read_text().split()[0]
          receipt=json.loads((target/'preeligibility-selector-census.json').read_text()); identity=receipt.pop('identity')
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          assert hashlib.sha256(json.dumps(stable(receipt),separators=(',',':')).encode()).hexdigest()==identity==os.environ['PREFLIGHT_RECEIPT_IDENTITY']
          assert receipt['ordered_compatible_queue_commitment']==os.environ['PREFLIGHT_ORDERED_COMMITMENT'] and receipt['first_eligible_candidate_commitment']==os.environ['PREFLIGHT_FIRST_COMMITMENT']
          PY
      - name: Validate current canonical cycle, queue, and corpus
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs validate
          node scripts/validate.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_MAIN"
      - name: Release exact committed candidate identity for read-only cycle-009 preflight
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'; import { readFileSync,writeFileSync } from 'node:fs';
          import { capabilityPolicySha256,rankCapabilityCandidates,validateCapabilityPolicy,validateState } from './scripts/lib/autopilot.mjs';
          const e=process.env,parse=p=>JSON.parse(readFileSync(p,'utf8')),sha=v=>createHash('sha256').update(v).digest('hex');
          const stable=v=>Array.isArray(v)?v.map(stable):(!v||typeof v!=='object'?v:Object.fromEntries(Object.keys(v).sort().map(k=>[k,stable(v[k])]))),stableJson=v=>JSON.stringify(stable(v)),fail=m=>{throw new Error(m)};
          const statePath='data/AUTOPILOT.json',policyPath='data/AUTOPILOT-CAPABILITIES.json',waterlinePath='data/WATERLINE-STATE.json',receiptPath='data/review/adapter-sdk/doctor-who-cycle-008-kreg.json',selectorPath='scripts/lib/autopilot-capabilities.mjs';
          const state=parse(statePath),policy=parse(policyPath),cycle=parse(receiptPath),pre=parse(`${e.OUT}/source/preflight/preeligibility-selector-census.json`),selector=readFileSync(selectorPath,'utf8'); validateState(state); validateCapabilityPolicy(policy);
          const scoped=state.jobs.filter(j=>j.scope===e.SCOPE_ID),queued=scoped.filter(j=>j.status==='queued'),resolved=scoped.filter(j=>j.status==='resolved'),inFlight=scoped.filter(j=>['leased','drafted','merged'].includes(j.status));
          if(scoped.length!==+e.EXPECTED_TOTAL||queued.length!==+e.EXPECTED_QUEUED||resolved.length!==+e.EXPECTED_RESOLVED||inFlight.length!==+e.EXPECTED_IN_FLIGHT)fail('queue denominator drifted');
          const ranked=rankCapabilityCandidates({state,scope:e.SCOPE_ID,policy,profileId:e.PROFILE_ID}); if(ranked.profile.status!=='active'||ranked.compatible.length!==queued.length||ranked.incompatible.length)fail('capability queue drifted');
          const manual=[...queued].sort((a,b)=>b.priority-a.priority||a.scope.localeCompare(b.scope)||a.performer.localeCompare(b.performer)||a.character.localeCompare(b.character)); if(stableJson(ranked.compatible.map(r=>r.task.id))!==stableJson(manual.map(r=>r.id)))fail('selector ordering drifted');
          if(cycle.reviewed_cycle?.id!==e.CYCLE_008_ID||cycle.lease?.id!==e.CYCLE_008_LEASE||cycle.boundary?.cycle_009_authorized!==false||cycle.boundary?.ninth_lease_issued!==false)fail('cycle-008 authority drifted'); if(Date.now()<Date.parse(e.ELIGIBLE_AT))fail('not eligible');
          const row=j=>({id:j.id,scope:j.scope,priority:j.priority,performer:j.performer,character:j.character,performance_modes:[...(j.performance_modes||[])].sort(),source_fingerprint:j.source_fingerprint});
          const ordered=sha(stableJson(ranked.compatible.map(r=>row(r.task)))),first=ranked.compatible[0].task,firstCommit=sha(`${e.ELIGIBLE_AT}\n${stableJson(row(first))}`);
          if(ordered!==e.PREFLIGHT_ORDERED_COMMITMENT||ordered!==pre.ordered_compatible_queue_commitment||firstCommit!==e.PREFLIGHT_FIRST_COMMITMENT||firstCommit!==pre.first_eligible_candidate_commitment)fail('selector commitment drifted');
          if(sha(readFileSync(statePath))!==pre.queue_state_sha256||capabilityPolicySha256(policy)!==pre.capability_policy_sha256||sha(selector)!==pre.selector_source_sha256||sha(readFileSync(waterlinePath))!==pre.waterline_state_sha256||sha(readFileSync(receiptPath))!==pre.cycle_008_receipt_file_sha256)fail('selector input bytes drifted');
          const modes=[...(first.performance_modes||[])].sort(),candidate={task_id:first.id,scope:first.scope,priority:first.priority,performer:first.performer,role:first.character,character:first.character,performance_modes:modes,mode:modes.length===1?modes[0]:null,source_url:first.source_url??first.source??null,source_fingerprint:first.source_fingerprint,source_page_id:first.source_page_id??null,source_revision:first.source_revision??null,source_content_sha256:first.source_content_sha256??null};
          const observed=new Date(),selectionId=`selection_${sha(stableJson({eligible_at:e.ELIGIBLE_AT,ordered_commitment:ordered,first_commitment:firstCommit,candidate})).slice(0,24)}`;
          const receipt={status:'cycle-009-selection-released-for-read-only-preflight',release_run:+e.GITHUB_RUN_ID,release_attempt:+e.GITHUB_RUN_ATTEMPT,release_main:e.RELEASE_MAIN,floor_main:e.FLOOR_MAIN,selected_at:observed.toISOString(),eligible_at:e.ELIGIBLE_AT,selection_id:selectionId,completed_cycle_id:e.CYCLE_008_ID,scope_id:e.SCOPE_ID,capability_profile_id:e.PROFILE_ID,capability_profile_status:ranked.profile.status,queue:{total:scoped.length,queued:queued.length,resolved:resolved.length,in_flight:inFlight.length,compatible:ranked.compatible.length,incompatible:ranked.incompatible.length},queue_order_rule:['priority_desc','scope_asc','performer_asc','character_asc'],queue_state_sha256:sha(readFileSync(statePath)),capability_policy_sha256:capabilityPolicySha256(policy),selector_source_sha256:sha(selector),waterline_state_sha256:sha(readFileSync(waterlinePath)),cycle_008_receipt_file_sha256:sha(readFileSync(receiptPath)),ordered_compatible_queue_commitment:ordered,first_eligible_candidate_commitment:firstCommit,preeligibility_receipt_identity:e.PREFLIGHT_RECEIPT_IDENTITY,candidate_identity_disclosed:true,next_candidate_selected:true,candidate,task_id:candidate.task_id,lease_id:null,wall_id:null,subject:candidate.character,performer:candidate.performer,role:candidate.role,mode:candidate.mode,cycle_009_preflight_authorized:true,cycle_009_lease_authorized:false,cycle_009_product_authorized:false,repository_write:false,queue_mutated:false,lease_issued:false,outside_human_dependency:false,owner_physical_action_required:false}; receipt.identity=sha(stableJson(receipt));
          writeFileSync(`${e.OUT}/receipt/cycle-009-selection-release.json`,JSON.stringify(receipt,null,2)+'\n'); writeFileSync(`${e.OUT}/receipt/selected-candidate.json`,JSON.stringify(candidate,null,2)+'\n');
          NODE
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$RELEASE_MAIN"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload cycle-009 selection release
        if: steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-selection-release-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-eligibility-release-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload eligibility-release diagnostics on failure
        if: failure() && steps.window.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-eligibility-release-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-eligibility-release-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
