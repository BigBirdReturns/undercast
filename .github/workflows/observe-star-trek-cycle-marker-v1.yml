name: observe-star-trek-cycle-marker-v1

on:
  push:
    branches:
      - agent/observe-star-trek-cycle-v1

permissions:
  actions: read
  contents: write

jobs:
  marker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 465c55f1c2163470074c35a96a5e729f07164ecb
      TARGET_PATH: .github/workflows/star-trek-maryl-cycle-v1.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact status marker
        shell: bash
        run: |
          set -Eeuo pipefail
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_HEAD}&per_page=100")"
          run="$(jq -c --arg path "$TARGET_PATH" '[.workflow_runs[] | select(.path==$path)] | sort_by(.created_at) | last // empty' <<<"$runs")"
          test -n "$run"
          id="$(jq -r .id <<<"$run")"
          status="$(jq -r .status <<<"$run")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$run")"
          marker="agent/observe-cycle-${status}-${conclusion}-${id}"
          git fetch --filter=blob:none --no-tags origin main
          git checkout --detach origin/main
          git checkout -B "$marker"
          mkdir -p transport/observe-cycle-marker
          printf '%s\n' "$run" | jq . > transport/observe-cycle-marker/run.json
          git config user.name undercast-cycle-marker
          git config user.email cycle-marker@users.noreply.github.com
          git add -- transport/observe-cycle-marker/run.json
          git commit -m "Observe cycle ${status} ${conclusion} ${id}"
          git push --force origin "HEAD:refs/heads/${marker}"
