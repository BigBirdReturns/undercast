name: doctor-who-cycle-007-writer-builder-v6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-007-writer-builder-v6.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-007-writer-builder-v6-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-007-writer-builder-v6.yml
  EXACT_MAIN: d98beaa07a9973783c1e0f892895271c98ff6205
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-007-writer-builder-v6
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-media-review
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  TRANSPORT_SHA256: 391678b7392fc2a1b498181c53b9f21c02c7fac5f671cafc1964183f9ed9f976
  TRANSPORT_MANIFEST_SHA256: dfaa47779f53bba3a19254b9d7abd273561a913200d61db9313f8fe6fbd269c7
  TRANSPORT_PARTS: "4"
  GH_TOKEN: ${{ github.token }}

jobs:
  builder:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-writer-builder-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none

      - name: Bind exact current main, chronology layers, publisher custody, and one-file carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$CYCLE_ASSET_DIR" "$SELECTION_DIR" "$PREFLIGHT_DIR" "$MEDIA_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          printf '%s\n' \
            .github/workflows/autopilot.yml \
            .github/workflows/preserve.yml \
            .github/workflows/publisher-custody.yml \
            .github/workflows/ux-02a-script-runner.yml \
            PROJECT_ESTATE.json \
            data/journal/candidates.jsonl \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology.json \
            data/review/ci-publisher-custody-baseline.json \
            docs/PUBLISHER-CUSTODY.md \
            package.json \
            scripts/doctor-who-cycle-006-chronology-composable.mjs \
            scripts/doctor-who-cycle-006-chronology.mjs \
            scripts/gate-fixtures.mjs \
            scripts/publisher-custody.mjs \
            test/publisher-custody-fixtures.mjs \
            | LC_ALL=C sort > "$OUT/expected-main-drift-paths.txt"
          git diff --name-only "$ATTESTED_MAIN"..."$EXACT_MAIN" | LC_ALL=C sort > "$OUT/actual-main-drift-paths.txt"
          diff -u "$OUT/expected-main-drift-paths.txt" "$OUT/actual-main-drift-paths.txt"

          test "$(sha256sum scripts/doctor-who-cycle-006-chronology.mjs | awk '{print $1}')" = 6f3001a95a5079cd009a731377eee72c824e1daeadcbe3f8f8d083c06833788c
          test "$(sha256sum scripts/doctor-who-cycle-006-chronology-composable.mjs | awk '{print $1}')" = d0dc13f8da17e3a531c979d7287d26d5a0d711f8ec0e95f1903ed3e815b08275
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/chronology-composable.log"

          test "$(git hash-object data/review/ci-publisher-custody-baseline.json)" = 8d233f79472fc4ec406b9d0faf1b5e13dcae2b29
          test "$(git hash-object scripts/publisher-custody.mjs)" = 619d72941fc357de74c2d6c2d9d3b6baa7b31383
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody-before.log"
          printf 'exact_main=%s\nattested_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$ATTESTED_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" > "$OUT/main-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Recover checksum-bound V6 writer transport from ordered PR comments
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/419/comments?per_page=100" > "$OUT/pr-comments.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const comments = JSON.parse(fs.readFileSync(`${process.env.OUT}/pr-comments.json`, 'utf8'));
          if (!Array.isArray(comments)) throw new Error('PR comments response is not an array');
          const expected = Number(process.env.TRANSPORT_PARTS);
          const parts = [];
          for (const comment of comments) {
            const match = String(comment?.body ?? '').match(/^CYCLE007_TRANSPORT_V6_PART (\d{2})\/(\d{2})\n([A-Za-z0-9+/=\r\n]+)$/);
            if (!match) continue;
            parts.push({
              number: Number(match[1]),
              total: Number(match[2]),
              comment_id: comment.id,
              payload: match[3].replace(/\s/g, ''),
            });
          }
          parts.sort((a, b) => a.number - b.number);
          if (parts.length !== expected) throw new Error(`expected ${expected} V6 transport comments, found ${parts.length}`);
          if (parts.some((row, index) => row.total !== expected || row.number !== index + 1 || !row.payload || !/^[A-Za-z0-9+/=]+$/.test(row.payload))) {
            throw new Error('V6 transport comment set is incomplete, duplicated, unordered, or malformed');
          }
          fs.writeFileSync(`${process.env.OUT}/transport.b64`, parts.map((row) => row.payload).join(''));
          fs.writeFileSync(`${process.env.OUT}/transport-comment-parts.json`, `${JSON.stringify(parts.map((row) => ({ number: row.number, comment_id: row.comment_id, bytes: row.payload.length })), null, 2)}\n`);
          NODE
          test -s "$OUT/transport.b64"
          test -z "$(tr -d 'A-Za-z0-9+/=' < "$OUT/transport.b64")"
          base64 --decode "$OUT/transport.b64" > "$OUT/transport.tgz"
          test "$(sha256sum "$OUT/transport.tgz" | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf "$OUT/transport.tgz" -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$TRANSPORT_MANIFEST_SHA256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.CYCLE_ASSET_DIR;
          const manifest = JSON.parse(fs.readFileSync(`${root}/transport-manifest.json`, 'utf8'));
          if (manifest.version !== 6 || manifest.transaction !== 'DOCTOR-WHO-CYCLE-007-KRAGAR-BUILDER-V6' || manifest.exact_main !== process.env.EXACT_MAIN || manifest.attested_main !== process.env.ATTESTED_MAIN) {
            throw new Error('V6 transport manifest identity drifted');
          }
          for (const row of manifest.files) {
            const bytes = fs.readFileSync(`${root}/${row.path}`);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== row.bytes || digest !== row.sha256) throw new Error(`transport member drifted: ${row.path}`);
          }
          NODE
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-007.mjs"
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-007.mjs"
          node --check "$CYCLE_ASSET_DIR/prepare-inputs.mjs"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Download exact cycle-007 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-selection-31023209453
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31023209453

      - name: Download exact complete cycle-007 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-preflight-31024339060
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31024339060

      - name: Download exact final Kragar media review
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-31027579331
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31027579331

      - name: Bind recovered evidence and prepare normalized writer inputs
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/01-prepare.sh"

      - name: Materialize exact workflow-free Kragar candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Completely gate and commit exact local candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate.sh"

      - name: Upload exact local candidate evidence
        id: candidate-upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.OUT }}/candidate-*
            ${{ env.OUT }}/materialize.log
            ${{ env.OUT }}/prepared-inputs.sha256
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg

      - name: Bind candidate artifact and workflow job custody
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="builder") | .id' | head -1)"
          test -n "$job_id"
          digest="${ARTIFACT_DIGEST#sha256:}"
          candidate="$(cat "$OUT/candidate-commit.txt")"
          candidate_gate="$(cat "$OUT/candidate-gate.sha256")"
          artifact_name="doctor-who-cycle-007-candidate-${GITHUB_RUN_ID}"
          test -n "$ARTIFACT_ID" -a -n "$digest" -a -n "$candidate" -a -n "$candidate_gate"
          printf 'CANDIDATE_COMMIT=%s\n' "$candidate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_GATE_SHA256=%s\n' "$candidate_gate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'WORKFLOW_JOB=%s\n' "$job_id" >> "$GITHUB_ENV"
          printf 'workflow_job=%s\ncandidate_artifact_id=%s\ncandidate_artifact_sha256=%s\n' "$job_id" "$ARTIFACT_ID" "$digest" > "$OUT/candidate-custody.txt"

      - name: Write reviewed cycle receipt and permanent checker
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-finalize.sh"

      - name: Completely gate and seal exact local final product
        shell: bash
        run: |
          set -euo pipefail
          bash "$CYCLE_ASSET_DIR/05-final-gate.sh"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody-after.log"
          test -z "$(git status --porcelain)"

      - name: Upload complete cycle-007 writer qualification V6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-writer-builder-v6-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            ${{ env.OUT }}
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg
            data/review/adapter-sdk/doctor-who-cycle-007-kragar.json
            scripts/doctor-who-cycle-007.mjs
