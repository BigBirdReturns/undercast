name: materialize-clifford-number-hr-counterpower-effects-wave-05

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-dissonance-counterpower-wave-04
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-counterpower-effects-wave-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 05 counterpower-effects packet
        shell: bash
        env:
          PARENT_SHA: ee7705464eb974e40a6d4bc52fd0b88e164640db
          PAYLOAD_SHA256: 0166f16cdbabeb100f9046831cb7bda19daf3ae336ece124363d5db4b2283af6
          PAYLOAD_BLOB_SHA: 4bdc5421bda16cedadca44577be29cb972c22925
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(wc -c < .cnhr-wave05/payload.tar.gz)" -eq 30469
          printf '%s  %s\n' "$PAYLOAD_SHA256" .cnhr-wave05/payload.tar.gz \
            | sha256sum --check --strict
          test "$(git hash-object .cnhr-wave05/payload.tar.gz)" = "$PAYLOAD_BLOB_SHA"

          tar -xzf .cnhr-wave05/payload.tar.gz -C .
          rm -rf .cnhr-wave05 .github/workflows/cnhr-wave05-materialize.yml

          # Validate the exact parent packet in an isolated root because its
          # validator intentionally refuses unrelated repository files.
          rm -rf /tmp/cnhr-wave04-root
          mkdir -p /tmp/cnhr-wave04-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packet_root = Path('/tmp/cnhr-wave04-root')
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-04/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          paths = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          for rel in sorted(paths):
              src = source_root / rel
              dst = packet_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          print(f'isolated Wave 04 validation root: {len(paths)} exact files')
          PY

          node --check /tmp/cnhr-wave04-root/scripts/clifford-number-hr-dissonance-counterpower.mjs
          node --check /tmp/cnhr-wave04-root/test/clifford-number-hr-dissonance-counterpower-fixtures.mjs
          node /tmp/cnhr-wave04-root/scripts/clifford-number-hr-dissonance-counterpower.mjs --check --root /tmp/cnhr-wave04-root
          node /tmp/cnhr-wave04-root/test/clifford-number-hr-dissonance-counterpower-fixtures.mjs

          # Validate Wave 05 in its own exact manifest-bound root.
          rm -rf /tmp/cnhr-wave05-root
          mkdir -p /tmp/cnhr-wave05-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packet_root = Path('/tmp/cnhr-wave05-root')
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          paths = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          for rel in sorted(paths):
              src = source_root / rel
              dst = packet_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          assert len(paths) == 22, len(paths)
          print(f'isolated Wave 05 validation root: {len(paths)} exact files')
          PY

          node --check /tmp/cnhr-wave05-root/scripts/clifford-number-hr-counterpower-effects.mjs
          node --check /tmp/cnhr-wave05-root/test/clifford-number-hr-counterpower-effects-fixtures.mjs
          node /tmp/cnhr-wave05-root/scripts/clifford-number-hr-counterpower-effects.mjs --check --root /tmp/cnhr-wave05-root
          node /tmp/cnhr-wave05-root/test/clifford-number-hr-counterpower-effects-fixtures.mjs

          git diff --check
          git add -A

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = 'ee7705464eb974e40a6d4bc52fd0b88e164640db'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          print('exact Wave 05 counterpower-effects delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number counterpower-effects Wave 05'
          git push origin HEAD:"${HEAD_REF}"
