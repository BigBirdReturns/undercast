name: verify-doctor-who-legacy-ref-neutralization-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/verify-doctor-who-legacy-ref-neutralization-v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-doctor-who-legacy-ref-neutralization-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/verify-doctor-who-legacy-ref-neutralization-v2
  SELF: .github/workflows/verify-doctor-who-legacy-ref-neutralization-v2.yml
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  EXPECTED_REF_COUNT: "70"
  EXPECTED_REF_NAME_SHA256: 7011efc7ce35ea57e091f0d4cb570a8ad1b48895201a5ea1cfa0b1f678808b8d
  OUT: /tmp/doctor-who-legacy-ref-neutralization-v2
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/verify-doctor-who-legacy-ref-neutralization-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-path read-only carrier and terminal main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Prove the exact 70-ref cycle-007 estate is neutralized
        shell: bash
        run: |
          set -euo pipefail
          {
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/doctor-who-cycle-007" --jq '.[] | [.object.sha, .ref] | @tsv'
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/retire-doctor-who-cycle-007" --jq '.[] | [.object.sha, .ref] | @tsv'
          } | LC_ALL=C sort -u > "$OUT/actual-refs.tsv"

          cut -f2 "$OUT/actual-refs.tsv" | LC_ALL=C sort -u > "$OUT/actual-ref-names.txt"
          test "$(wc -l < "$OUT/actual-refs.tsv")" = "$EXPECTED_REF_COUNT"
          test "$(wc -l < "$OUT/actual-ref-names.txt")" = "$EXPECTED_REF_COUNT"
          test "$(sha256sum "$OUT/actual-ref-names.txt" | awk '{print $1}')" = "$EXPECTED_REF_NAME_SHA256"
          awk -F '\t' -v expected="$EXACT_MAIN" '$1 != expected { print > "/dev/stderr"; bad=1 } END { exit bad }' "$OUT/actual-refs.tsv"

          git checkout --detach "$EXACT_MAIN"
          git ls-tree -r --name-only "$EXACT_MAIN" .github | LC_ALL=C sort > "$OUT/github-paths.txt"
          if grep -F 'doctor-who-cycle-007' "$OUT/github-paths.txt" > "$OUT/forbidden-github-paths.txt"; then
            cat "$OUT/forbidden-github-paths.txt" >&2
            exit 1
          fi

      - name: Rebind live terminal main after the complete census
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Seal exact ref-neutralization receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="verify") | .id' | head -1)"
          test -n "$job_id"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-007-REF-NEUTRALIZATION-V2" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --arg ref_name_sha256 "$EXPECTED_REF_NAME_SHA256" \
            --argjson ref_count "$EXPECTED_REF_COUNT" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            '{
              schema_version: 1,
              transaction: $transaction,
              terminal_main: $main,
              carrier_head: $carrier,
              ref_count: $ref_count,
              ref_name_sha256: $ref_name_sha256,
              run_id: $run,
              job_id: $job,
              checks: {
                exact_ref_name_set: true,
                every_ref_equals_terminal_main: true,
                zero_cycle_007_paths_under_github: true,
                live_main_rebound: true
              },
              boundary: {
                repository_written: false,
                refs_mutated: false,
                product_mutated: false,
                cycle_008_lease_issued: false,
                outside_human_dependency: false
              }
            }' > "$OUT/ref-neutralization.json"
          sha256sum "$OUT/ref-neutralization.json" | awk '{print $1}' > "$OUT/ref-neutralization.sha256"
          test "$(sha256sum "$OUT/ref-neutralization.json" | awk '{print $1}')" = "$(cat "$OUT/ref-neutralization.sha256")"

      - name: Upload immutable ref-neutralization receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-ref-neutralization-v2-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
