name: card-backfill-uc-054-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-054-APPLY.json"
      - "scripts/card-backfill-uc-054-apply.mjs"
      - ".github/workflows/card-backfill-uc-054-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-054-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-008'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-054-APPLY.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-054'||row.actor!=='Michael Keaton'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-054 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8634913781||row.render_artifact?.head_sha!=='7dcbb1e3964a77a9c15fcae00ccf2314251e35a6')throw new Error('UC-054 render custody drift');
          if(row.expected?.candidate_sha256!=='19b340e06492e4cc96f7dfe2534260bd0eff674ee664fd3192c5c85be07c6b52')throw new Error('UC-054 candidate drift');
          if(row.expected?.crop_preview_sha256!=='e8f01b0776c345179c97b1f2bedb190dcef5efeb12da129275e8ca8cc31f90dc')throw new Error('UC-054 crop drift');
          console.log('PASS — exact UC-054 evidence candidate authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-054-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8634913781/zip" > "$root/render.zip"
          echo "8ee6d28d1b469c5385948d0095499d8c612f2b256e7c28f5b8a174778dac6b86  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          test -f "$root/source/output/manifest.json"
          echo "19b340e06492e4cc96f7dfe2534260bd0eff674ee664fd3192c5c85be07c6b52  $root/source/output/uc-054-still-candidate.webp" | sha256sum -c -
          echo "e8f01b0776c345179c97b1f2bedb190dcef5efeb12da129275e8ca8cc31f90dc  $root/source/output/card-crop-preview.jpg" | sha256sum -c -
          echo "b3bb916d90c88fc2ef9249fcd6563dd44e975a7242900e5c885e05708c01acd6  $root/source/output/source-page.png" | sha256sum -c -
          echo "caf010470779b64e7a5c08c9701704c6740fa0770e4f28b5e0d89d57a47ef81e  $root/source/output/manifest.json" | sha256sum -c -
          echo "fe604579996d898f5a82042f48506cbc32af2bdb3e6e2e1856eaf3e2a6539a7d  $root/source/output/duplicate-scan.json" | sha256sum -c -
          echo "3dc83bb01638ad428c95def5d0fe2fbfbe3f37776b9c9618467aff8724a00b7d  $root/source/output/review.json" | sha256sum -c -
          echo "b359e4b7830339a7e8c7829514e4d4e1b854892aec2eaf53fac9670db72721d3  $root/source/output/review.md" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-054-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-054-apply"
          node scripts/card-backfill-uc-054-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-054-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-054');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-054');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_a9b26fb25b867de2837c7a06');
          if(!specimen||specimen.still)throw new Error('UC-054 specimen mutated');
          if(source?.still)throw new Error('UC-054 source ledger mutated');
          if(!audit||audit.wall_id!=='UC-054'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-054 audit mutated');
          console.log('PASS — UC-054 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire temporary operators
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-054.json \
            .github/CARD-BACKFILL-UC-054-RENDER.json \
            .github/CARD-BACKFILL-UC-054-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-054-discover.yml \
            .github/workflows/card-backfill-uc-054-render.yml \
            .github/workflows/card-backfill-uc-054-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-054-discover.mjs \
            scripts/card-backfill-uc-054-render.mjs \
            scripts/card-backfill-uc-054-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-054 Betelgeuse still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-007...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do case "$path" in data/review/card-backfill/UC-054/*) ;; *) echo "unexpected path: $path" >&2; exit 1;; esac; done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-054-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-054-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-008
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-054-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-054-apply
            data/review/card-backfill/UC-054
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
