name: doctor-who-cycle-012-candidate-parameter-census-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-candidate-parameter-census-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-candidate-parameter-census-v1
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-candidate-parameter-census-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-012-candidate-parameter-census-v1
      SELF: .github/workflows/doctor-who-cycle-012-candidate-parameter-census-v1.yml
      OUT: /tmp/doctor-who-cycle-012-candidate-parameter-census-v1
      SOURCE_PACKET: /tmp/doctor-who-cycle-012-candidate-parameter-census-v1-source
      RETIREMENT_PACKET: /tmp/doctor-who-cycle-012-candidate-parameter-census-v1-retirement
      CENSUS_PACKET: /tmp/doctor-who-cycle-012-candidate-parameter-census-v1-media-census
      SOURCE_BRANCH: agent/doctor-who-cycle-012-candidate-source-inspection-v1
      SOURCE_WORKFLOW: doctor-who-cycle-012-candidate-source-inspection-v1
      SOURCE_ARTIFACT_PREFIX: doctor-who-cycle-012-candidate-source-inspection-v1-
      RETIREMENT_ARTIFACT_PREFIX: doctor-who-cycle-012-candidate-source-inspection-v1-retirement-
      PRIOR_TASK: ap_25277c8fbe9e5369ed2e3d81
      PRIOR_WALL: UC-1356
      PRIOR_PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind parameter census and exact source-inspection transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE_PACKET" "$RETIREMENT_PACKET" "$CENSUS_PACKET"
          mkdir -p "$OUT"/{api,source,current,receipt,logs,payload} "$SOURCE_PACKET" "$RETIREMENT_PACKET" "$CENSUS_PACKET"
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"; test "$(git show -s --format=%P HEAD)" = "$CARRIER_BASE"; test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = 1; test -z "$(git rev-list --merges "$CARRIER_BASE"..HEAD)"; test "$(git diff --name-status "$CARRIER_BASE"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"; gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$SOURCE_BRANCH" -f per_page=100 > "$OUT/api/source-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'; own=json.loads((api/'carrier.json').read_text()); rows=json.loads((api/'source-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False; assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']; assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['SOURCE_BRANCH'] and row['merged'] is False]; assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]; assert source['state']=='open' and source['draft'] is True; (api/'source-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n'); (api/'source-head.txt').write_text(source['head']['sha']+'\n'); (api/'source-number.txt').write_text(str(source['number'])+'\n')
          PY
          source_head="$(cat "$OUT/api/source-head.txt")"; source_pr="$(cat "$OUT/api/source-number.txt")"; run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$SOURCE_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/source-runs.json"
            run_id="$(SOURCE_HEAD="$source_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/source-runs.json').read_text())['workflow_runs']; rows=[row for row in rows if row['head_sha']==os.environ['SOURCE_HEAD'] and row['name']==os.environ['SOURCE_WORKFLOW']]; rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True); print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/source-run.json"; [ "$(jq -r '.status' "$OUT/api/source-run.json")" = completed ] && break; fi
            sleep 10
          done
          test -n "$run_id"; test "$(jq -r '.status' "$OUT/api/source-run.json")" = completed; test "$(jq -r '.conclusion' "$OUT/api/source-run.json")" = success; source_attempt="$(jq -r '.run_attempt' "$OUT/api/source-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/source-jobs.json"; gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"
          inspect_job="$(jq -r '.jobs[] | select(.name=="inspect" and .conclusion=="success") | .id' "$OUT/api/source-jobs.json")"; retire_job="$(jq -r '.jobs[] | select(.name=="retire_review" and .conclusion=="success") | .id' "$OUT/api/source-jobs.json")"; test -n "$inspect_job"; test -n "$retire_job"
          SOURCE_RUN="$run_id" SOURCE_ATTEMPT="$source_attempt" python3 - <<'PY' > "$OUT/api/artifact-env"
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/source-artifacts.json').read_text())['artifacts']; run=os.environ['SOURCE_RUN']; attempt=os.environ['SOURCE_ATTEMPT']; expected={'SOURCE_ARTIFACT':os.environ['SOURCE_ARTIFACT_PREFIX']+run+'-attempt-'+attempt,'RETIREMENT_ARTIFACT':os.environ['RETIREMENT_ARTIFACT_PREFIX']+run+'-attempt-'+attempt}
          for key,name in expected.items():
              matches=[row for row in rows if row['name']==name and not row['expired']]; assert len(matches)==1,(key,name,[(row['id'],row['name']) for row in rows]); print(f'{key}={matches[0]["id"]}')
          PY
          source "$OUT/api/artifact-env"
          for label in source retirement; do upper="${label^^}_ARTIFACT"; artifact="${!upper}"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/$label-artifact.json"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/$label.zip"; digest="$(sha256sum "$OUT/$label.zip" | awk '{print $1}')"; test "$(jq -r '.digest' "$OUT/api/$label-artifact.json")" = "sha256:$digest"; printf '%s_ZIP_SHA256=%s\n' "${label^^}" "$digest" >> "$GITHUB_ENV"; done
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nSOURCE_PR=%s\nSOURCE_HEAD=%s\nSOURCE_RUN=%s\nSOURCE_ATTEMPT=%s\nINSPECT_JOB=%s\nRETIRE_JOB=%s\nSOURCE_ARTIFACT=%s\nRETIREMENT_ARTIFACT=%s\n' "$pr" "$head" "$source_pr" "$source_head" "$run_id" "$source_attempt" "$inspect_job" "$retire_job" "$SOURCE_ARTIFACT" "$RETIREMENT_ARTIFACT" >> "$GITHUB_ENV"

      - name: Authenticate source packet, retirement, and current media census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          def extract(name,target):
              target=Path(target)
              with zipfile.ZipFile(root/(name+'.zip')) as archive:
                  infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir():continue
                      out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
