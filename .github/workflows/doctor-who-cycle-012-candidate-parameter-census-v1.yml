          assert len(rows)==1,[p.as_posix() for p,_ in rows]; path,census=rows[0]; identity=census.pop('identity'); assert sha(json.dumps(census,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; census['identity']=identity; (root/'current/media-census.json').write_text(json.dumps(census,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
