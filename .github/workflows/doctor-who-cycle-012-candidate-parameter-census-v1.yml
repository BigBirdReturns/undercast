          for rel in ('source/prior-workflow.yml','source/prior-materializer.sh','source/mechanism.json','review/media-review.json'):
              rows=[p for p in Path(os.environ['SOURCE_PACKET']).rglob(rel) if p.is_file()]; assert len(rows)==1,(rel,[p.as_posix() for p in rows]); dst=root/'source'/Path(rel).name; dst.write_bytes(rows[0].read_bytes())
          for rel in ('review/character-image-candidate','review/performer-portrait-candidate.jpg','review/portrait-crop.json'):
              rows=[p for p in Path(os.environ['SOURCE_PACKET']).rglob(rel) if p.is_file()]; assert len(rows)<=1
              if rows:dst=root/'current'/Path(rel).name; dst.write_bytes(rows[0].read_bytes())
          (root/'source/source-inspection.json').write_text(json.dumps(source,indent=2,sort_keys=True,ensure_ascii=False)+'\n'); (root/'source/retirement.json').write_text(json.dumps(retirement,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-012-source-inspection-authenticated-for-parameter-census-v1','version':1,'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'attempt':int(os.environ['SOURCE_ATTEMPT']),'inspect_job':int(os.environ['INSPECT_JOB']),'retire_job':int(os.environ['RETIRE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ZIP_SHA256'],'identity':source['identity'],'retirement_artifact':int(os.environ['RETIREMENT_ARTIFACT']),'retirement_artifact_sha256':os.environ['RETIREMENT_ZIP_SHA256'],'retirement_identity':retirement['identity']},'canonical_main':source['canonical_main'],'task':source['task'],'source_ledgers':source_ledgers,'retirement_ledgers':retirement_ledgers}; custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()); (root/'receipt/source-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
