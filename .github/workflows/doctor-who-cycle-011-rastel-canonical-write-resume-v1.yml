name: doctor-who-cycle-011-rastel-canonical-write-resume-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-canonical-write-resume-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-canonical-write-resume-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-canonical-write-resume-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      authorization_id: ${{ steps.upload.outputs.artifact-id }}
      authorization_digest: ${{ steps.upload.outputs.artifact-digest }}
      carrier_head: ${{ steps.bind.outputs.carrier_head }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALLED_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-canonical-write-resume-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-canonical-write-resume-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1/handoff
      AUTH: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1/authorization
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-worktree
      PUBLISHER_RUN: "31351193421"
      PUBLISHER_VERIFY_JOB: "93342215823"
      PUBLISHER_WRITE_JOB: "93342584423"
      HANDOFF_ARTIFACT: "9049051649"
      HANDOFF_DIGEST: "sha256:c64927f75a88109ef3ba024ce3a1387568a11953d088f50418a1e9f5f09ac9ce"
      PUBLICATION_IDENTITY: 681bd1ed573a93f1f5ff1f32348370f15172a1d061e66f6260d849baa3224ed2
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      LOCAL_PREDICTED_COMMIT: 1c92734e501ed4667ac86c4203a6dbac282392ee
      API_COMMIT: 276e3a737318bd2487c0c641f038a71e0543cf55
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z
      COMMIT_EPOCH: "1786324200"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact carrier and successful standard checks
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$WORKTREE"
          mkdir -p "$OUT"/{api,logs,receipt} "$PACKET" "$AUTH"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          CARRIER_HEAD="$head" CARRIER_PR="$pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          pr=json.loads((Path(os.environ['OUT'])/'api/carrier-pr.json').read_text())
          assert pr['number']==int(os.environ['CARRIER_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CARRIER_HEAD']
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['INSTALLED_MAIN']
          assert pr['commits']==1 and pr['changed_files']==1
          PY

          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/standard-runs.json"
            state="$(CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/standard-runs.json').read_text())['workflow_runs']
          expected=['publisher-custody','publisher-custody-or-guard','archive-contract']
          selected={}
          for name in expected:
              matches=[row for row in rows if row.get('name')==name and row.get('head_sha')==os.environ['CARRIER_HEAD']]
              matches.sort(key=lambda row:row['id'],reverse=True)
              if matches:
                  selected[name]=matches[0]
          (Path(os.environ['OUT'])/'api/standard-checks.json').write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          if len(selected)<len(expected):
              print('pending')
          elif any(row.get('status')=='completed' and row.get('conclusion')!='success' for row in selected.values()):
              print('failure')
          elif all(row.get('status')=='completed' and row.get('conclusion')=='success' for row in selected.values()):
              print('success')
          else:
              print('pending')
          PY
          )"
            case "$state" in
              success) break ;;
              failure) echo "a required exact-head check failed" >&2; exit 1 ;;
              pending) sleep 10 ;;
              *) echo "unexpected standard-check state: $state" >&2; exit 1 ;;
            esac
            test "$attempt" != 180
          done
          CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/standard-checks.json').read_text())
          assert set(rows)=={'publisher-custody','publisher-custody-or-guard','archive-contract'}
          for name,row in rows.items():
              assert row['head_sha']==os.environ['CARRIER_HEAD']
              assert row['status']=='completed' and row['conclusion']=='success'
          PY
          printf 'CARRIER_HEAD=%s\nCARRIER_PR=%s\n' "$head" "$pr" >> "$GITHUB_ENV"
          echo "carrier_head=$head" >> "$GITHUB_OUTPUT"

      - name: Authenticate successful verifier and failed pre-ref writer
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN" > "$OUT/api/publisher-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HANDOFF_ARTIFACT" > "$OUT/api/handoff-artifact.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          run=json.loads((api/'publisher-run.json').read_text())
          jobs=json.loads((api/'publisher-jobs.json').read_text())['jobs']
          artifact=json.loads((api/'handoff-artifact.json').read_text())
          assert run['id']==int(os.environ['PUBLISHER_RUN'])
          assert run['name']=='doctor-who-cycle-011-rastel-trusted-publisher-v2'
          assert run['event']=='workflow_run' and run['head_sha']==os.environ['INSTALLED_MAIN']
          assert run['status']=='completed' and run['conclusion']=='failure'
          verify=next(row for row in jobs if row['id']==int(os.environ['PUBLISHER_VERIFY_JOB']))
          write=next(row for row in jobs if row['id']==int(os.environ['PUBLISHER_WRITE_JOB']))
          assert verify['name']=='verify' and verify['status']=='completed' and verify['conclusion']=='success'
          assert write['name']=='write' and write['status']=='completed' and write['conclusion']=='failure'
          failed=[step for step in write.get('steps',[]) if step.get('conclusion')=='failure']
          skipped=[step for step in write.get('steps',[]) if step.get('conclusion')=='skipped']
          assert [(step['name'],step['number']) for step in failed]==[('Rebind exact same-run handoff and construct remote Git objects',4)]
          assert any(step['name']=='Non-forced canonical update and terminal write receipt' for step in skipped)
          assert artifact['id']==int(os.environ['HANDOFF_ARTIFACT'])
          assert artifact['expired'] is False and artifact['digest']==os.environ['HANDOFF_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['PUBLISHER_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['INSTALLED_MAIN']
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Authenticate exact same-run handoff and reviewed product
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HANDOFF_ARTIFACT/zip" > "$OUT/handoff.zip"
          test "$(sha256sum "$OUT/handoff.zip" | awk '{print $1}')" = "${HANDOFF_DIGEST#sha256:}"
          ZIP="$OUT/handoff.zip" TARGET="$PACKET" python3 - <<'PY'
          import hashlib,json,os,stat,subprocess,tarfile,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=Path(os.environ['TARGET']); target.mkdir(parents=True,exist_ok=True)
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr >> 16) & 0xFFFF
                  assert stat.S_IFMT(mode) != stat.S_IFLNK
                  if info.is_dir():
                      continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest

          publication=json.loads((target/'publication.json').read_text())
          identity=publication.pop('identity')
          assert identity==os.environ['PUBLICATION_IDENTITY']
          assert sha(json.dumps(publication,sort_keys=True,separators=(',',':')).encode())==identity
          publication['identity']=identity
          assert publication['status']=='cycle-011-rastel-canonical-publication-authorized-v2'
          assert publication['main']=={'original':os.environ['ORIGINAL_MAIN'],'installed':os.environ['INSTALLED_MAIN'],'canonical':os.environ['LOCAL_PREDICTED_COMMIT']}
          assert publication['transport']=={'deleted':[os.environ['V1_PATH'],os.environ['V2_PATH']],'extraction_repair':'mkdir-exist-ok'}
          assert publication['product']=={
              'reviewed_commit':os.environ['PRODUCT_COMMIT'],
              'tree':os.environ['PRODUCT_TREE'],
              'paths':int(os.environ['PRODUCT_PATHS']),
              'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],
              'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],
              'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],
              'manifest_sha256':os.environ['MANIFEST_SHA256'],
          }
          assert publication['cycle']=={
              'id':os.environ['CYCLE_ID'],
              'event_id':os.environ['WATERLINE_EVENT'],
              'receipt_identity':os.environ['RECEIPT_IDENTITY'],
              'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256'],
          }
          assert all(publication['gates'].values()) and not any(publication['boundary'].values())

          approval=json.loads((target/'review-approval.json').read_text())
          aid=approval.pop('identity')
          assert aid==os.environ['APPROVAL_IDENTITY']
          assert sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==aid
          approval['identity']=aid
          handoff=json.loads((target/'publication-handoff.json').read_text())
          hid=handoff.pop('identity')
          assert hid==os.environ['HANDOFF_IDENTITY']
          assert sha(json.dumps(handoff,sort_keys=True,separators=(',',':')).encode())==hid
          handoff['identity']=hid
          assert approval['product']['tree']==os.environ['PRODUCT_TREE'] and approval['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert approval['cycle']['id']==os.environ['CYCLE_ID'] and approval['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert all(approval['gates'].values())
          assert handoff['approval_identity']==aid and handoff['product']==approval['product'] and handoff['cycle']==approval['cycle']

          for name,digest in [
              ('product.bundle',os.environ['PRODUCT_BUNDLE_SHA256']),
              ('product.patch',os.environ['PRODUCT_PATCH_SHA256']),
              ('product.tar',os.environ['PRODUCT_TAR_SHA256']),
              ('canonical-product.tar',os.environ['PRODUCT_TAR_SHA256']),
              ('file-manifest.json',os.environ['MANIFEST_SHA256']),
              ('canonical-file-manifest.json',os.environ['MANIFEST_SHA256']),
          ]:
              path=target/name
              assert path.is_file() and sha(path.read_bytes())==digest

          manifest=json.loads((target/'canonical-file-manifest.json').read_text())
          rows=manifest['files']
          assert len(rows)==int(os.environ['PRODUCT_PATHS']) and len({row['path'] for row in rows})==len(rows)
          assert not any(row['path'].startswith('.github/workflows/') for row in rows)
          with tarfile.open(target/'canonical-product.tar','r:') as archive:
              infos=[info for info in archive.getmembers() if info.isfile()]
              assert len(infos)==len(rows)
              by={PurePosixPath(info.name).as_posix():archive.extractfile(info).read() for info in infos}
          assert set(by)=={row['path'] for row in rows}
          for row in rows:
              data=by[row['path']]
              assert len(data)==int(row['bytes']) and sha(data)==row['sha256']
          PY
          git bundle verify "$PACKET/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch --no-tags "$PACKET/product.bundle" "$PRODUCT_COMMIT:refs/verify/cycle-011-reviewed-product"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$ORIGINAL_MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          test "$(git rev-list --count "$ORIGINAL_MAIN".."$PRODUCT_COMMIT")" = 1
          test -z "$(git rev-list --merges "$ORIGINAL_MAIN".."$PRODUCT_COMMIT")"
          git diff --binary "$ORIGINAL_MAIN" "$PRODUCT_COMMIT" > "$OUT/logs/reproduced-product.patch"
          test "$(sha256sum "$OUT/logs/reproduced-product.patch" | awk '{print $1}')" = "$PRODUCT_PATCH_SHA256"

      - name: Prove newline-only commit representation repair
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$API_COMMIT" > "$OUT/api/orphan-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_MAIN...$API_COMMIT" > "$OUT/api/original-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$INSTALLED_MAIN...$API_COMMIT" > "$OUT/api/installed-compare.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          commit=json.loads((api/'orphan-commit.json').read_text())
          assert commit['sha']==os.environ['API_COMMIT']
          assert commit['tree']['sha']==os.environ['PRODUCT_TREE']
          assert [row['sha'] for row in commit['parents']]==[os.environ['INSTALLED_MAIN']]
          assert commit['message']==os.environ['COMMIT_MESSAGE']
          assert commit['author']=={'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']}
          assert commit['committer']=={'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']}

          prefix=(
              f"tree {os.environ['PRODUCT_TREE']}\n"
              f"parent {os.environ['INSTALLED_MAIN']}\n"
              f"author {os.environ['COMMIT_NAME']} <{os.environ['COMMIT_EMAIL']}> {os.environ['COMMIT_EPOCH']} +0000\n"
              f"committer {os.environ['COMMIT_NAME']} <{os.environ['COMMIT_EMAIL']}> {os.environ['COMMIT_EPOCH']} +0000\n\n"
              f"{os.environ['COMMIT_MESSAGE']}"
          )
          def git_hash(body):
              data=body.encode()
              return hashlib.sha1(f"commit {len(data)}\0".encode()+data).hexdigest()
          api_hash=git_hash(prefix)
          local_hash=git_hash(prefix+'\n')
          assert api_hash==os.environ['API_COMMIT']
          assert local_hash==os.environ['LOCAL_PREDICTED_COMMIT']
          assert api_hash!=local_hash

          original=json.loads((api/'original-compare.json').read_text())
          installed=json.loads((api/'installed-compare.json').read_text())
          assert original['merge_base_commit']['sha']==os.environ['ORIGINAL_MAIN']
          assert installed['merge_base_commit']['sha']==os.environ['INSTALLED_MAIN']
          original_files=original['files']
          assert len(original_files)==int(os.environ['PRODUCT_PATHS'])
          assert not any(row['status']=='removed' for row in original_files)
          assert not any(row['filename'].startswith('.github/workflows/') for row in original_files)
          installed_files=installed['files']
          assert len(installed_files)==int(os.environ['PRODUCT_PATHS'])+2
          removed={row['filename'] for row in installed_files if row['status']=='removed'}
          assert removed=={os.environ['V1_PATH'],os.environ['V2_PATH']}
          assert len([row for row in installed_files if row['status']=='removed'])==2

          receipt={
              'status':'cycle-011-rastel-api-commit-representation-repair-proved-v1',
              'version':1,
              'publisher':{
                  'run':int(os.environ['PUBLISHER_RUN']),
                  'verify_job':int(os.environ['PUBLISHER_VERIFY_JOB']),
                  'write_job':int(os.environ['PUBLISHER_WRITE_JOB']),
                  'handoff_artifact':int(os.environ['HANDOFF_ARTIFACT']),
                  'handoff_digest':os.environ['HANDOFF_DIGEST'],
                  'publication_identity':os.environ['PUBLICATION_IDENTITY'],
              },
              'representation':{
                  'tree':os.environ['PRODUCT_TREE'],
                  'parent':os.environ['INSTALLED_MAIN'],
                  'message':os.environ['COMMIT_MESSAGE'],
                  'author':{'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']},
                  'committer':{'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']},
                  'api_message_terminal_newline':False,
                  'api_commit':api_hash,
                  'local_message_terminal_newline':True,
                  'local_predicted_commit':local_hash,
                  'only_difference':'one terminal LF byte in the commit message',
              },
              'product':{'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS'])},
              'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY']},
              'boundary':{'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (Path(os.environ['OUT'])/'receipt/representation-repair.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Independently rerun the reviewed product gates
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT_COMMIT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline.log"
          node scripts/waterline.mjs status | tee "$OUT/logs/waterline-status.log"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path('.')
          corpus='\n'.join(path.read_text(errors='replace') for path in [
              root/'data/review/adapter-sdk/doctor-who-cycle-011-rastel.json',
              root/'data/WATERLINE-STATE.json',
              root/'data/ESTATE-REGISTRY.json',
              root/'data/AUTOPILOT.json',
          ])
          for token in [
              os.environ['CYCLE_ID'],os.environ['WATERLINE_EVENT'],os.environ['RECEIPT_IDENTITY'],
              os.environ['TASK_ID'],os.environ['LEASE_ID'],os.environ['WALL_ID'],os.environ['PORTRAIT_SHA256'],
          ]:
              assert token in corpus,token
          PY
          cd "$GITHUB_WORKSPACE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Seal canonical write authorization
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/api/orphan-commit.json" "$AUTH/orphan-commit.json"
          cp "$OUT/api/original-compare.json" "$AUTH/original-compare.json"
          cp "$OUT/api/installed-compare.json" "$AUTH/installed-compare.json"
          cp "$OUT/api/standard-checks.json" "$AUTH/standard-checks.json"
          cp "$OUT/receipt/representation-repair.json" "$AUTH/representation-repair.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          auth=Path(os.environ['AUTH'])
          repair=json.loads((auth/'representation-repair.json').read_text())
          authorization={
              'status':'cycle-011-rastel-canonical-write-resume-authorized-v1',
              'version':1,
              'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'branch':os.environ['BRANCH'],'path':os.environ['SELF']},
              'checks':json.loads((auth/'standard-checks.json').read_text()),
              'publisher':{
                  'run':int(os.environ['PUBLISHER_RUN']),
                  'verify_job':int(os.environ['PUBLISHER_VERIFY_JOB']),
                  'write_job':int(os.environ['PUBLISHER_WRITE_JOB']),
                  'handoff_artifact':int(os.environ['HANDOFF_ARTIFACT']),
                  'handoff_digest':os.environ['HANDOFF_DIGEST'],
                  'publication_identity':os.environ['PUBLICATION_IDENTITY'],
              },
              'canonical':{
                  'previous_main':os.environ['INSTALLED_MAIN'],
                  'commit':os.environ['API_COMMIT'],
                  'tree':os.environ['PRODUCT_TREE'],
                  'paths':int(os.environ['PRODUCT_PATHS']),
                  'publisher_paths_deleted':[os.environ['V1_PATH'],os.environ['V2_PATH']],
                  'force_update':False,
                  'representation_repair_identity':repair['identity'],
              },
              'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY'],'task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'queue':{'total':316,'queued':305,'resolved':11,'in_flight':0},'media':'22/22 complete'},
              'gates':{'publisher_verify':True,'product_bundle':True,'commit_representation':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True,'clean_worktree':True},
              'boundary':{'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          authorization['identity']=hashlib.sha256(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (auth/'authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          rows=[]
          for path in sorted(p for p in auth.rglob('*') if p.is_file() and p.name not in {'SHA256SUMS','SHA256SUMS.pre'}):
              rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(auth).as_posix()}")
          (auth/'SHA256SUMS.pre').write_text('\n'.join(rows)+'\n')
          (auth/'SHA256SUMS').write_text(f"{hashlib.sha256((auth/'SHA256SUMS.pre').read_bytes()).hexdigest()}  SHA256SUMS.pre\n")
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Upload exact canonical write authorization
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-write-resume-v1-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1/authorization
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-write-resume-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1
            /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-worktree
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  write:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-canonical-write-resume-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALLED_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-canonical-write-resume-v1
      CARRIER_HEAD: ${{ needs.verify.outputs.carrier_head }}
      AUTHORIZATION_ID: ${{ needs.verify.outputs.authorization_id }}
      AUTHORIZATION_DIGEST: ${{ needs.verify.outputs.authorization_digest }}
      OUT: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-write
      API_COMMIT: 276e3a737318bd2487c0c641f038a71e0543cf55
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.INSTALLED_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.AUTHORIZATION_ID }}
          path: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-write/authorization
          merge-multiple: true

      - name: Rebind same-run authorization and exact orphan commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{api,receipt}
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTHORIZATION_ID" > "$OUT/api/authorization-artifact.json"
          expected_digest="$AUTHORIZATION_DIGEST"
          case "$expected_digest" in sha256:*) ;; *) expected_digest="sha256:$expected_digest" ;; esac
          jq -e --arg digest "$expected_digest" --arg head "$CARRIER_HEAD" '.id==(env.AUTHORIZATION_ID|tonumber) and .expired==false and .digest==$digest and .workflow_run.id==(env.GITHUB_RUN_ID|tonumber) and .workflow_run.head_sha==$head' "$OUT/api/authorization-artifact.json" >/dev/null
          root="$OUT/authorization"
          test "$(sha256sum "$root/SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$root/SHA256SUMS")"
          while read -r digest name; do
            test "$(sha256sum "$root/${name#\*}" | awk '{print $1}')" = "$digest"
          done < "$root/SHA256SUMS.pre"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'authorization'
          authorization=json.loads((root/'authorization.json').read_text())
          identity=authorization.pop('identity')
          assert hashlib.sha256(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          authorization['identity']=identity
          assert authorization['status']=='cycle-011-rastel-canonical-write-resume-authorized-v1'
          assert authorization['carrier']['head']==os.environ['CARRIER_HEAD'] and authorization['carrier']['branch']==os.environ['BRANCH']
          assert authorization['canonical']=={
              'previous_main':os.environ['INSTALLED_MAIN'],
              'commit':os.environ['API_COMMIT'],
              'tree':os.environ['PRODUCT_TREE'],
              'paths':int(os.environ['PRODUCT_PATHS']),
              'publisher_paths_deleted':[os.environ['V1_PATH'],os.environ['V2_PATH']],
              'force_update':False,
              'representation_repair_identity':authorization['canonical']['representation_repair_identity'],
          }
          assert authorization['cycle']['id']==os.environ['CYCLE_ID']
          assert authorization['cycle']['event_id']==os.environ['WATERLINE_EVENT']
          assert authorization['cycle']['receipt_identity']==os.environ['RECEIPT_IDENTITY']
          assert all(authorization['gates'].values()) and not any(authorization['boundary'].values())
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$API_COMMIT" > "$OUT/api/orphan-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_MAIN...$API_COMMIT" > "$OUT/api/original-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$INSTALLED_MAIN...$API_COMMIT" > "$OUT/api/installed-compare.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          commit=json.loads((api/'orphan-commit.json').read_text())
          assert commit['sha']==os.environ['API_COMMIT'] and commit['tree']['sha']==os.environ['PRODUCT_TREE']
          assert [row['sha'] for row in commit['parents']]==[os.environ['INSTALLED_MAIN']]
          original=json.loads((api/'original-compare.json').read_text())['files']
          installed=json.loads((api/'installed-compare.json').read_text())['files']
          assert len(original)==int(os.environ['PRODUCT_PATHS'])
          assert not any(row['status']=='removed' or row['filename'].startswith('.github/workflows/') for row in original)
          assert len(installed)==int(os.environ['PRODUCT_PATHS'])+2
          assert {row['filename'] for row in installed if row['status']=='removed'}=={os.environ['V1_PATH'],os.environ['V2_PATH']}
          PY

      - name: Non-forced canonical update and terminal receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          jq -n --arg sha "$API_COMMIT" '{sha:$sha,force:false}' > "$OUT/ref.json"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input "$OUT/ref.json" > "$OUT/api/ref-update.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$API_COMMIT"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$API_COMMIT" --jq '.tree.sha')" = "$PRODUCT_TREE"
          for path in "$V1_PATH" "$V2_PATH"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$API_COMMIT" >/dev/null 2>&1; then
              echo "publisher transport survived canonical publication: $path" >&2
              exit 1
            fi
          done
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt={
              'status':'cycle-011-rastel-canonical-write-resume-complete-v1',
              'version':1,
              'run':int(os.environ['GITHUB_RUN_ID']),
              'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier':{'head':os.environ['CARRIER_HEAD'],'branch':os.environ['BRANCH']},
              'authorization':{'artifact':int(os.environ['AUTHORIZATION_ID']),'digest':os.environ['AUTHORIZATION_DIGEST']},
              'previous_main':os.environ['INSTALLED_MAIN'],
              'canonical_main':os.environ['API_COMMIT'],
              'canonical_tree':os.environ['PRODUCT_TREE'],
              'product_paths':int(os.environ['PRODUCT_PATHS']),
              'publisher_paths_deleted':[os.environ['V1_PATH'],os.environ['V2_PATH']],
              'force_update':False,
              'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY']},
              'cycle_012_authorized':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/canonical-write.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          echo 'DOCTOR-WHO-CYCLE-011-RASTEL-CANONICAL-WRITE-RESUME-COMPLETE'

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-write-resume-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-write-resume-v1-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-canonical-write-resume-v1-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
