name: star-trek-risik-media-review-recovery-v1

on:
  push:
    branches:
      - agent/star-trek-risik-media-review-recovery-v1

permissions:
  contents: write

concurrency:
  group: star-trek-risik-media-review-recovery-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  EXPECTED_TREE: 6d32c386636296e76bcab61baa387cb629967ac3
  CLAIM_BRANCH: agent/star-trek-risik-claim-result-v2
  CLAIM_COMMIT: eff3da84c7718d0894afda1fbc4e790bc88265da
  MEDIA_BRANCH: agent/star-trek-risik-media-result-v1
  MEDIA_COMMIT: 86b6fcd580f9439b97f96a20bcace2bfcbcc102d
  MEDIA_TREE: 933fee84fa5b034f3d753d6a225f6196398fe69f
  MEDIA_RECEIPT_SHA: 9ccbd09cd8d94751071d65cc327dd04babce8db05f59fc8e47db1832e2547b7c
  MEDIA_PREFIX: transport/star-trek-risik-media-v1
  SOURCE_REVIEW_BRANCH: agent/star-trek-risik-source-review-result-v1
  SOURCE_REVIEW_COMMIT: d769b3eb261d86db3da41d2033ba7c9d6f402db8
  SOURCE_REVIEW_TREE: 6ab590d19b81c1dd659f5bb670087c5c38f8c004
  SOURCE_REVIEW_SHA: cb61b9be745d629a35a57d827711bd29105d3c2d53dac48ce5d26c74a6c82b6a
  SOURCE_REVIEW_PATH: transport/star-trek-risik-source-review-v1/source-review.json
  EXPECTED_LEASE: lease_5d07d02fd67ea40a4950b1dd
  TASK_ID: ap_096624f177ae0c9f2e91836c
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Risik
  EXPECTED_FINGERPRINT: 6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6
  WALL_ID: UC-1399
  EXPECTED_STILL_SHA: 3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9
  EXPECTED_PORTRAIT_SHA: e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42
  PRIOR_PORTRAIT_WALL: UC-1398
  PRIOR_PORTRAIT_ITEM: ma_8254f59b1cc6004f0fa5f1a2
  PRIOR_PORTRAIT_SHA: ae19bcd09869d848fd74202fcc3c59ac41dbef153f7a33844c278b91b8d4ea5f
  RESULT_BRANCH: agent/star-trek-risik-media-review-result-v1
  REVIEWER_SOURCE: .github/recovery/star-trek-risik-media-review-recovery-v1/reviewer.py
  REVIEWER: /tmp/star-trek-risik-media-review-v1.py
  WORK: /tmp/star-trek-risik-claim-worktree-review-v1
  OUT: /tmp/star-trek-risik-media-review-v1

jobs:
  review:
    name: independently-review-exact-risik-media
    if: ${{ github.event.head_commit.message == 'Review exact Star Trek Risik media v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Freeze media result and replay both normalizations
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$REVIEWER_SOURCE")" = "4ff2a7cda7abeedad2abae625b94afa42b1a0277"
          cp "$REVIEWER_SOURCE" "$REVIEWER"
          chmod +x "$REVIEWER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["REVIEWER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          rm -rf "$OUT" "$WORK"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}" \
            "+refs/heads/${MEDIA_BRANCH}:refs/remotes/origin/${MEDIA_BRANCH}" \
            "+refs/heads/${SOURCE_REVIEW_BRANCH}:refs/remotes/origin/${SOURCE_REVIEW_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"
          test "$(git rev-parse "refs/remotes/origin/${CLAIM_BRANCH}")" = "$CLAIM_COMMIT"
          test "$(git rev-parse "refs/remotes/origin/${MEDIA_BRANCH}")" = "$MEDIA_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_COMMIT")" = "$MEDIA_TREE"
          test "$(git rev-parse "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}")" = "$SOURCE_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_REVIEW_COMMIT")" = "$SOURCE_REVIEW_TREE"

          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PREFIX}/media-receipt.json" > "$OUT/media-receipt.json"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PREFIX}/risik-still.webp" > "$OUT/risik-still.webp"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PREFIX}/fred-tatasciore-portrait.jpg" > "$OUT/fred-tatasciore-portrait.jpg"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PREFIX}/risik-file.wikitext" > "$OUT/risik-file.wikitext"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PREFIX}/prior-performer-audit.json" > "$OUT/prior-performer-audit.json"
          git show "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}:${SOURCE_REVIEW_PATH}" > "$OUT/source-review.json"

          git worktree add --detach "$WORK" "$CLAIM_COMMIT"
          python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
          ROOT="$WORK" python3 "$REVIEWER"

          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-RISIK-MEDIA-REVIEW-V1"
             and .status == "media-review-complete"
             and .verdict == "pass"
             and .candidate_staging_admissible == true
             and .canonical_parent == env.EXPECTED_MAIN
             and .canonical_tree == env.EXPECTED_TREE
             and .media.commit == env.MEDIA_COMMIT
             and .media.tree == env.MEDIA_TREE
             and .media.receipt_sha256 == env.MEDIA_RECEIPT_SHA
             and .source_review.commit == env.SOURCE_REVIEW_COMMIT
             and .source_review.review_sha256 == env.SOURCE_REVIEW_SHA
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id_reserved == $wall
             and .task.status == "leased"
             and .production.series == "Star Trek: Lower Decks"
             and .production.selected_card_production == "Something Borrowed, Something Green"
             and .production.year == "2023"
             and .still.sha256 == env.EXPECTED_STILL_SHA
             and .portrait.sha256 == env.EXPECTED_PORTRAIT_SHA
             and .still.identity.state == "enforced"
             and .still.identity.value == "expected"
             and .still.presentation.state == "enforced"
             and .still.presentation.value == "character-depiction"
             and .portrait.identity.state == "enforced"
             and .portrait.identity.value == "expected"
             and .portrait.presentation.state == "enforced"
             and .portrait.presentation.value == "neutral-human"
             and (.still.votes | length) == 2
             and (.portrait.votes | length) == 2
             and .queue == {total:2228,queued:1795,resolved:430,blocked:0,rejected:2,in_flight:1}
             and .boundary.all_four_media_claims_enforced == true
             and .boundary.single_card_production_selected == true
             and .boundary.source_distinct == true
             and .boundary.byte_distinct == true
             and .boundary.no_facial_recognition_used == true
             and .boundary.normalization_replay_exact == true
             and .boundary.physical_performance_attributed == false
             and .boundary.prosthetic_performance_attributed == false
             and .boundary.animation_labor_attributed == false
             and .boundary.character_design_attributed == false
             and .boundary.voice_direction_attributed == false
             and .boundary.vocal_processing_attributed == false
             and .boundary.sound_attributed == false
             and .boundary.maker_attribution == "unresolved"
             and .boundary.transformation_measured == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false
             and .boundary.product_staged == false
             and .boundary.waterline_cycle_recorded == false' \
            "$OUT/media-review.json" >/dev/null

          test "$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$EXPECTED_MAIN"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload media review evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-media-review-v1
          path: /tmp/star-trek-risik-media-review-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable media review result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/media-review.json" > "$OUT/review.tmp"
          mv "$OUT/review.tmp" "$OUT/media-review.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-risik-media-review-v1
          git config user.email undercast-risik-media-review-v1@users.noreply.github.com
          git checkout --orphan risik-media-review-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-risik-media-review-v1
          cp -a "$OUT"/. transport/star-trek-risik-media-review-v1/
          git add transport/star-trek-risik-media-review-v1
          git commit -m "Record Star Trek Risik media review v1"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
