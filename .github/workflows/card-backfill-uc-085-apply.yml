name: card-backfill-uc-085-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-085-APPLY.json"
      - "scripts/card-backfill-uc-085-apply.mjs"
      - ".github/workflows/card-backfill-uc-085-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-085-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-020'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-020
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Jar Jar packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-085-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-085');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-085');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1bec5ea2c16e828370805dd8');
          if(row.version!==1||row.record_id!=='UC-085'||row.actor!=='Ahmed Best'||row.character!=='Jar Jar Binks'||row.production!=='The Phantom Menace'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-085 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8671037275||row.render_artifact?.head_sha!=='eb7726f84d59de2fb7f3a310842e1a2fd6da3a09')throw new Error('UC-085 render custody drift');
          if(row.expected?.selected_source_sha256!=='7429128d9e5c95477b39e7fe6625e4e582d7c3b828b62db7c7e1fe5dc31e49f6'||row.expected?.official_role_record_sha256!=='482987833c4c9acbd928ef45f92df363599cacd00cfa413ced42168a2618369a')throw new Error('UC-085 source authorization drift');
          if(row.expected?.candidate_sha256!=='aece830fc3d3f8b5b744fc697b480e34edc8f68eadb3743a037c555b9c1106d5'||row.expected?.crop_preview_sha256!=='e892e2840fcfc369b931933df84f48cbced80db8d863509d79b7f6b61fd90658')throw new Error('UC-085 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==13||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-085 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-single-role-center-crop'||row.ruling?.canonical_mutation!==false)throw new Error('UC-085 ruling drift');
          if(!specimen||specimen.character!=='Jar Jar Binks'||specimen.production!=='The Phantom Menace'||specimen.still)throw new Error('UC-085 specimen boundary drift');
          if(source?.still)throw new Error('UC-085 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-085'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-085 audit boundary drift');
          console.log(`PASS — UC-085 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-085-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8671037275/zip" > "$root/render.zip"
          echo "a9c901e58666a204a10029534c6ec22dfbb7d28a1ecbd354d224b77e79a827da  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-085-render/output/UC-085"
          test -f "$base/manifest.json"
          echo "ce918c5b5e1dbb5fc4c522c8890aeafaf9f81ce316070ee994c85d1011e12d53  $base/manifest.json" | sha256sum -c -
          echo "fa3772365702a90340e84b8e2118df6f51c1c167df813f44684485fa6c713db4  $base/duplicate-scan.json" | sha256sum -c -
          echo "944c08f7272d1b85d77be09e73d5709549ccb0f5191ea0ab0314798dedfcca32  $base/review.json" | sha256sum -c -
          echo "a2b6715a49af82f17675943b33dfee6f7650afc0b61e9db2a4c8facf0377e14c  $base/review.md" | sha256sum -c -
          echo "3a349ba9faabf73818f727eb36c6bcc3fa2805a05835438c522d1a2ddf14a6ac  $base/SHA256SUMS" | sha256sum -c -
          echo "482987833c4c9acbd928ef45f92df363599cacd00cfa413ced42168a2618369a  $base/official-role-record.json" | sha256sum -c -
          echo "7429128d9e5c95477b39e7fe6625e4e582d7c3b828b62db7c7e1fe5dc31e49f6  $base/jar-jar-original.jpg" | sha256sum -c -
          echo "fd7c83127f66c4f309830cf79a14010d342951772c5025fb0a963693221bfb42  $base/source-page-jar-jar-biography-gallery.png" | sha256sum -c -
          echo "7f2633cc71864bdaa3db16077cabba8ae60420950efb43df80472e91b61bdb21  $base/source-page-ahmed-best-phantom.png" | sha256sum -c -
          echo "f92ea06dab78eba4bef09703e1186897b925d87f19fdfcabfdd7b20778be7bb1  $base/source-page-phantom-film.png" | sha256sum -c -
          echo "88a7482ac8183b7f75622a80927000e89bb5e3affaef9ec104f4519c63e6f1c9  $base/source-page-jar-jar-databank.png" | sha256sum -c -
          echo "aece830fc3d3f8b5b744fc697b480e34edc8f68eadb3743a037c555b9c1106d5  $base/uc-085-still-candidate.jpg" | sha256sum -c -
          echo "e892e2840fcfc369b931933df84f48cbced80db8d863509d79b7f6b61fd90658  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30312813621
          artifact_id=8671037275
          artifact_name=card-backfill-uc-085-render-30312813621
          artifact_zip_sha256=a9c901e58666a204a10029534c6ec22dfbb7d28a1ecbd354d224b77e79a827da
          artifact_head_sha=eb7726f84d59de2fb7f3a310842e1a2fd6da3a09
          source_manifest_sha256=ce918c5b5e1dbb5fc4c522c8890aeafaf9f81ce316070ee994c85d1011e12d53
          source_sums_sha256=3a349ba9faabf73818f727eb36c6bcc3fa2805a05835438c522d1a2ddf14a6ac
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-085-apply/source/card-backfill-uc-085-render/output/UC-085
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-085-apply"
          node --check scripts/card-backfill-uc-085-apply.mjs
          node scripts/card-backfill-uc-085-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-085-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-085');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-085');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_1bec5ea2c16e828370805dd8');
          if(!specimen||specimen.still)throw new Error('UC-085 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-085 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-085'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-085 audit disposition was canonically mutated');
          console.log('PASS — UC-085 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-085-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-085.json \
            .github/CARD-BACKFILL-UC-085-DISCOVER.json \
            .github/CARD-BACKFILL-UC-085-RENDER.json \
            .github/CARD-BACKFILL-UC-085-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-085-scope.yml \
            .github/workflows/card-backfill-uc-085-discover.yml \
            .github/workflows/card-backfill-uc-085-render.yml \
            .github/workflows/card-backfill-uc-085-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-085-scope.mjs \
            scripts/card-backfill-uc-085-discover.mjs \
            scripts/card-backfill-uc-085-render.mjs \
            scripts/card-backfill-uc-085-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-085 Ahmed Best Jar Jar Binks still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-019
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-019 HEAD)
          test "${#changed[@]}" -eq 13
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-085/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-085-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-020
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-085-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-085-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-085-apply
            data/review/card-backfill/UC-085
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
