name: doctor-who-cycle-011-rastel-final-review-v4-direct

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-review-v4-direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALLED_MAIN: 39cf752efaba48271b078152235045be948b0d64
      INSTALLED_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v4-direct
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2
      PACKET: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2-packet
      SOURCE_PR: "817"
      SOURCE_HEAD: 163743c529584cf250f7feb1c5d60ca5b29d460b
      SOURCE_RUN: "31346032070"
      SOURCE_ATTEMPT: "1"
      SOURCE_JOB: "93328041911"
      SOURCE_ARTIFACT: "9047395261"
      SOURCE_ARTIFACT_DIGEST: "sha256:7bbb4d959718935faa22a851f439cdb2ef0c545ce5469b4d5356e056d5612377"
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind installed publisher and immutable successful review attempt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET"
          mkdir -p "$OUT"/{api,receipt} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$pr" = "$SOURCE_PR"
          test "$base" = "$ORIGINAL_MAIN"
          test "$(git merge-base "$ORIGINAL_MAIN" "$INSTALLED_MAIN")" = "$ORIGINAL_MAIN"
          test "$(git rev-list --count "$ORIGINAL_MAIN".."$INSTALLED_MAIN")" = 1
          test "$(git diff --name-status "$ORIGINAL_MAIN" "$INSTALLED_MAIN")" = $'A\t'"$INSTALLED_PATH"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT" > "$OUT/api/source-attempt.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          CURRENT_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          load=lambda name:json.loads((root/name).read_text())
          pr=load('carrier-pr.json')
          attempt=load('source-attempt.json')
          jobs=load('source-jobs.json')['jobs']
          artifact=load('source-artifact.json')
          assert pr['number']==int(os.environ['SOURCE_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['ORIGINAL_MAIN'] and pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert attempt['id']==int(os.environ['SOURCE_RUN']) and attempt['run_attempt']==int(os.environ['SOURCE_ATTEMPT'])
          assert attempt['head_sha']==os.environ['SOURCE_HEAD'] and attempt['head_branch']==os.environ['BRANCH']
          assert attempt['event']=='pull_request' and attempt['status']=='completed' and attempt['conclusion']=='success'
          job=next(row for row in jobs if row['id']==int(os.environ['SOURCE_JOB']))
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          PY
          printf 'REARM_HEAD=%s\nREARM_PR=%s\n' "$head" "$pr" >> "$GITHUB_ENV"

      - name: Authenticate and re-emit exact approved product packet
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source.zip"
          test "$(sha256sum "$OUT/source.zip" | awk '{print $1}')" = "${SOURCE_ARTIFACT_DIGEST#sha256:}"
          python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT'])
          packet=Path(os.environ['PACKET'])
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'source.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  mode=(info.external_attr >> 16) & 0xFFFF
                  assert stat.S_IFMT(mode) != stat.S_IFLNK
                  if info.is_dir():
                      continue
                  out=packet/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'
          sealed=packet/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          approval=json.loads((packet/'receipt/approval.json').read_text())
          aid=approval.pop('identity')
          assert aid==os.environ['APPROVAL_IDENTITY']
          assert sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==aid
          approval['identity']=aid
          handoff=json.loads((packet/'handoff/publication-handoff.json').read_text())
          hid=handoff.pop('identity')
          assert hid==os.environ['HANDOFF_IDENTITY']
          assert sha(json.dumps(handoff,sort_keys=True,separators=(',',':')).encode())==hid
          handoff['identity']=hid
          assert approval['status']=='cycle-011-rastel-final-product-independently-approved-v1'
          assert handoff['status']=='cycle-011-rastel-publication-handoff-ready-v1'
          expected_product={
              'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],
              'commit':os.environ['PRODUCT_COMMIT'],
              'file_manifest_sha256':os.environ['MANIFEST_SHA256'],
              'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],
              'paths':int(os.environ['PRODUCT_PATHS']),
              'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],
              'tree':os.environ['PRODUCT_TREE'],
          }
          expected_cycle={
              'event_id':os.environ['WATERLINE_EVENT'],
              'id':os.environ['CYCLE_ID'],
              'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256'],
              'receipt_identity':os.environ['RECEIPT_IDENTITY'],
          }
          assert approval['product']==expected_product and handoff['product']==expected_product
          assert approval['cycle']==expected_cycle and handoff['cycle']==expected_cycle
          assert approval['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert all(approval['gates'].values())
          assert approval['boundary']=={
              'approved_for_default_branch_publication':True,
              'canonical_mutation':False,
              'cycle_012_authorized':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
              'repository_product_ref_created':False,
          }
          assert handoff['boundary']=={
              'canonical_mutation':False,
              'cycle_012_authorized':False,
              'default_branch_publisher_required':True,
              'repository_write':False,
          }
          for name,digest in [
              ('product.bundle',os.environ['PRODUCT_BUNDLE_SHA256']),
              ('product.patch',os.environ['PRODUCT_PATCH_SHA256']),
              ('product.tar',os.environ['PRODUCT_TAR_SHA256']),
              ('file-manifest.json',os.environ['MANIFEST_SHA256']),
          ]:
              path=packet/'handoff'/name
              assert path.is_file() and sha(path.read_bytes())==digest
          receipt={
              'status':'cycle-011-rastel-final-review-attempt-one-reemitted-v1',
              'version':1,
              'source':{
                  'pr':int(os.environ['SOURCE_PR']),
                  'head':os.environ['SOURCE_HEAD'],
                  'run':int(os.environ['SOURCE_RUN']),
                  'attempt':int(os.environ['SOURCE_ATTEMPT']),
                  'job':int(os.environ['SOURCE_JOB']),
                  'artifact':int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],
                  'approval_identity':aid,
                  'handoff_identity':hid,
              },
              'rearm':{
                  'pr':int(os.environ['REARM_PR']),
                  'head':os.environ['REARM_HEAD'],
                  'installed_main':os.environ['INSTALLED_MAIN'],
                  'installed_path':os.environ['INSTALLED_PATH'],
              },
              'boundary':{
                  'repository_write':False,
                  'canonical_mutation':False,
                  'cycle_012_authorized':False,
                  'outside_human_dependency':False,
                  'owner_physical_action_required':False,
              },
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/attempt-one-reemit.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v4-direct-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2-packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2
            /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-rearm-v2-packet
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
