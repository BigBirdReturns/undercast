name: doctor-who-cycle-011-rastel-candidate-v8-lease-schema

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v8-lease-schema.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v8-lease-schema
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v8-lease-schema'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v8-lease-schema
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-v8-lease-schema.yml
      PACKET: /tmp/doctor-who-cycle-011-rastel-candidate-v8-packet
      REPAIR: /tmp/doctor-who-cycle-011-rastel-candidate-v8-packet/repair
      TRANSPORT: /tmp/doctor-who-cycle-011-rastel-candidate-v8-transport
      V7_PR: "762"
      V7_HEAD: 6712dcc95dc8943c25b5750620ba6edcc787958a
      V7_WORKFLOW: .github/workflows/doctor-who-cycle-011-rastel-candidate-v7-current-main.yml
      V7_WORKFLOW_BLOB: 22f0df5b84a6dfabad9851462a20414c57d13b8e
      V7_RUN: "31332533595"
      V7_JOB: "93292949027"
      V7_ARTIFACT: "9043341021"
      V7_ARTIFACT_SHA256: 432c72dd56e06e30d63ac9f487d3227630455c8d5aa63e2d34ebf6decb077cf9
      V7_ARTIFACT_FILES: "11"
      V7_LAUNCHER_BYTES: "17964"
      V7_LAUNCHER_SHA256: 28cfdb7a5b7015e1bf86e059f3c88fd00a31a060929ce934dba4faf8d9671d1a
      V8_LAUNCHER_BYTES: "17994"
      V8_LAUNCHER_SHA256: 3c2227f32c70e4af55745b47d83a65ba0d1ecf60eef7959fe01ef83732626841
      V8_PATCH_BYTES: "2713"
      V8_PATCH_SHA256: e1666a02e94e0675fa71b5e4254c859c3eb62543ef62a737249a40b942613a77
      EXPECTED_LEASE: lease_a6fc819786f4296a40bdc540

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate failed V7 launcher and apply exact lease-schema repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$TRANSPORT"
          mkdir -p "$REPAIR"/{api,diagnostic} "$TRANSPORT"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$REPAIR/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V7_PR" > "$REPAIR/api/v7-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V7_RUN" > "$REPAIR/api/v7-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V7_RUN/jobs?per_page=100" > "$REPAIR/api/v7-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT" > "$REPAIR/api/v7-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT/zip" > "$TRANSPORT/v7-diagnostics.zip"
          test "$(sha256sum "$TRANSPORT/v7-diagnostics.zip" | awk '{print $1}')" = "$V7_ARTIFACT_SHA256"
          git show "$V7_HEAD:$V7_WORKFLOW" > "$REPAIR/source-workflow.yml"
          test "$(git hash-object "$REPAIR/source-workflow.yml")" = "$V7_WORKFLOW_BLOB"

          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import difflib,hashlib,json,os,re,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['REPAIR']); api=root/'api'; diag=root/'diagnostic'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          read=lambda name:json.loads((api/name).read_text())
          own=read('carrier.json'); v7=read('v7-pr.json'); run=read('v7-run.json'); jobs=read('v7-jobs.json')['jobs']; artifact=read('v7-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v7['number']==int(os.environ['V7_PR']) and v7['head']['sha']==os.environ['V7_HEAD'] and v7['head']['ref']=='agent/doctor-who-cycle-011-rastel-candidate-v7-current-main'
          assert v7['base']['sha']==os.environ['MAIN'] and v7['draft'] is True and v7['merged'] is False and v7['commits']==1 and v7['changed_files']==1
          assert run['id']==int(os.environ['V7_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-v7-current-main'
          assert run['head_sha']==os.environ['V7_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['V7_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Reconstruct exact V7 launcher and execute']==('completed','failure')
          assert artifact['id']==int(os.environ['V7_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['V7_ARTIFACT_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['V7_RUN']) and artifact['workflow_run']['head_sha']==os.environ['V7_HEAD']

          exact_names={
            'doctor-who-cycle-011-rastel-candidate-v7-bootstrap/api/carrier.json',
            'doctor-who-cycle-011-rastel-candidate-v7-bootstrap/api/v6-artifact.json',
            'doctor-who-cycle-011-rastel-candidate-v7-bootstrap/api/v6-jobs.json',
            'doctor-who-cycle-011-rastel-candidate-v7-bootstrap/api/v6-pr.json',
            'doctor-who-cycle-011-rastel-candidate-v7-bootstrap/api/v6-run.json',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/chunk.0',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/chunk.1',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/chunk.2',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/launcher.sh',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/launcher.sh.gz',
            'doctor-who-cycle-011-rastel-candidate-v7-transport/launcher.sh.gz.b64',
          }
          with zipfile.ZipFile(Path(os.environ['TRANSPORT'])/'v7-diagnostics.zip') as archive:
              infos=archive.infolist()
              assert len(infos)==int(os.environ['V7_ARTIFACT_FILES']) and {row.filename for row in infos}==exact_names
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not info.is_dir()
                  out=diag/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          source_launcher=diag/'doctor-who-cycle-011-rastel-candidate-v7-transport/launcher.sh'
          source=source_launcher.read_bytes()
          assert len(source)==int(os.environ['V7_LAUNCHER_BYTES']) and sha(source)==os.environ['V7_LAUNCHER_SHA256']
          workflow=(root/'source-workflow.yml').read_text()
          assert workflow.count('LAUNCHER_BYTES: "17964"')==1
          assert workflow.count('LAUNCHER_SHA256: '+os.environ['V7_LAUNCHER_SHA256'])==1
          assert 'doctor-who-cycle-011-rastel-candidate-v7-current-main-diagnostics' in workflow
          assert not any('candidate-receipt.json' in name or 'candidate.bundle' in name for name in exact_names)

          text=source.decode(); original=text; changes=[]
          def replace(old,new,label,count):
              global text
              actual=text.count(old)
              assert actual==count,(label,actual)
              text=text.replace(old,new)
              changes.append({'label':label,'occurrences':count,'old':old,'new':new})
          replace("export BRANCH='agent/doctor-who-cycle-011-rastel-candidate-v7-current-main'","export BRANCH='agent/doctor-who-cycle-011-rastel-candidate-v8-lease-schema'",'branch-rebind',2)
          replace("export SELF='.github/workflows/doctor-who-cycle-011-rastel-candidate-v7-current-main.yml'","export SELF='.github/workflows/doctor-who-cycle-011-rastel-candidate-v8-lease-schema.yml'",'workflow-path-rebind',2)
          replace("export BOOTSTRAP='/tmp/doctor-who-cycle-011-rastel-candidate-v7-bootstrap'","export BOOTSTRAP='/tmp/doctor-who-cycle-011-rastel-candidate-v8-bootstrap'",'bootstrap-path-rebind',1)
          replace("export CONTROL='/tmp/doctor-who-cycle-011-rastel-candidate-v7-control'","export CONTROL='/tmp/doctor-who-cycle-011-rastel-candidate-v8-control'",'control-path-rebind',2)
          replace("export OUT='/tmp/doctor-who-cycle-011-rastel-candidate-v7'","export OUT='/tmp/doctor-who-cycle-011-rastel-candidate-v8-packet/candidate'",'output-path-rebind',2)
          replace("assert lease.startswith('lease_') and len(lease)==31","assert re.fullmatch(r'lease_[0-9a-f]{24}',lease)",'lease-schema-repair',1)
          target=text.encode()
          patch=''.join(difflib.unified_diff(original.splitlines(True),text.splitlines(True),fromfile='launcher-v7.sh',tofile='launcher-v8.sh')).encode()
          assert len(target)==int(os.environ['V8_LAUNCHER_BYTES']) and sha(target)==os.environ['V8_LAUNCHER_SHA256']
          assert len(patch)==int(os.environ['V8_PATCH_BYTES']) and sha(patch)==os.environ['V8_PATCH_SHA256']
          (root/'launcher-v7.sh').write_bytes(source)
          (root/'launcher-v8.sh').write_bytes(target)
          (root/'launcher-v8.patch').write_bytes(patch)
          receipt={
            'version':1,
            'status':'cycle-011-rastel-candidate-v8-lease-schema-repair',
            'carrier':{'pr':int(os.environ['CURRENT_PR']),'head':os.environ['CURRENT_HEAD'],'base':os.environ['MAIN']},
            'failed_v7':{'pr':int(os.environ['V7_PR']),'head':os.environ['V7_HEAD'],'run':int(os.environ['V7_RUN']),'job':int(os.environ['V7_JOB']),'artifact':int(os.environ['V7_ARTIFACT']),'artifact_sha256':os.environ['V7_ARTIFACT_SHA256'],'terminal_stage':'launcher-source-authentication','executed_candidate_bytes':False},
            'source':{'workflow_path':os.environ['V7_WORKFLOW'],'workflow_blob':os.environ['V7_WORKFLOW_BLOB'],'launcher_bytes':len(source),'launcher_sha256':sha(source)},
            'repair':{'changes':changes,'substantive_change':'replace-incorrect-31-character-length-check-with-lease-prefix-plus-24-lowercase-hex-schema','launcher_bytes':len(target),'launcher_sha256':sha(target),'patch_bytes':len(patch),'patch_sha256':sha(patch),'expected_retained_lease':os.environ['EXPECTED_LEASE']},
            'boundary':{'candidate_only':True,'repository_write':False,'product_published':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'v8-repair.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

          bash -n "$REPAIR/launcher-v8.sh"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['REPAIR'],'launcher-v8.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1): compile(block,f'<rastel-v8-launcher-{index}>','exec')
          assert text.count("assert re.fullmatch(r'lease_[0-9a-f]{24}',lease)")==1
          assert "len(lease)==31" not in text
          PY
          test "$(wc -c < "$REPAIR/launcher-v8.sh" | tr -d ' ')" = "$V8_LAUNCHER_BYTES"
          test "$(sha256sum "$REPAIR/launcher-v8.sh" | awk '{print $1}')" = "$V8_LAUNCHER_SHA256"

      - name: Execute exact V7 candidate through repaired lease schema and seal outer packet
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$REPAIR/launcher-v8.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          bash "$REPAIR/launcher-v8.sh"

          test -f "$PACKET/candidate/receipt/candidate-receipt.json"
          test -f "$PACKET/candidate/product/candidate.bundle"
          test -f "$PACKET/candidate/product/candidate.patch"
          test -f "$PACKET/candidate/product/candidate-product.tar.gz"
          test -f "$PACKET/candidate/SHA256SUMS.pre"
          test -f "$PACKET/candidate/SHA256SUMS"
          ROOT="$PACKET" CURRENT_PR='${{ github.event.pull_request.number }}' CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['ROOT']); candidate=root/'candidate'; repair=root/'repair'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt=json.loads((candidate/'receipt/candidate-receipt.json').read_text()); identity=receipt.pop('identity')
          assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          receipt['identity']=identity
          assert receipt['transaction']=='DOCTOR-WHO-CYCLE-011-RASTEL-CANDIDATE-V7' and receipt['status']=='candidate-complete'
          assert receipt['carrier_pr']==int(os.environ['CURRENT_PR']) and receipt['carrier_head']==os.environ['CURRENT_HEAD']
          assert receipt['base_main']==os.environ['MAIN']
          assert receipt['task']['id']=='ap_25277c8fbe9e5369ed2e3d81' and receipt['task']['lease_id']==os.environ['EXPECTED_LEASE']
          assert re.fullmatch(r'lease_[0-9a-f]{24}',receipt['task']['lease_id'])
          assert receipt['task']['wall_id']=='UC-1356' and receipt['task']['performer']=='Dan Starkey' and receipt['task']['role']=='Rastel' and receipt['task']['mode']=='voice'
          assert receipt['queue']=={'before':{'total':316,'queued':306,'resolved':10,'in_flight':0},'after':{'total':316,'queued':305,'resolved':11,'in_flight':0}}
          assert receipt['media']['character_still']=='absent' and receipt['media']['performer_portrait']=='verified'
          assert receipt['media']['portrait_sha256']=='42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a'
          assert not any(value for key,value in receipt['boundary'].items() if key not in ('candidate_only',))
          assert receipt['boundary']['candidate_only'] is True
          ledger=candidate/'SHA256SUMS.pre'; sealed=candidate/'SHA256SUMS'
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=Path(name.lstrip('*'))
              assert path.is_file() and sha(path.read_bytes())==digest
          v8=json.loads((repair/'v8-repair.json').read_text()); v8id=v8.pop('identity')
          assert sha(json.dumps(v8,sort_keys=True,separators=(',',':')).encode())==v8id
          v8['identity']=v8id
          packet={
            'version':1,
            'status':'cycle-011-rastel-candidate-v8-packet-complete',
            'canonical_main':os.environ['MAIN'],
            'canonical_tree':os.environ['TREE'],
            'candidate':{'identity':identity,'commit':receipt['candidate']['commit'],'tree':receipt['candidate']['tree'],'paths':receipt['candidate']['paths'],'bundle_sha256':receipt['candidate']['bundle_sha256'],'patch_sha256':receipt['candidate']['patch_sha256'],'archive_sha256':receipt['candidate']['product_archive_sha256']},
            'repair':{'identity':v8id,'launcher_sha256':os.environ['V8_LAUNCHER_SHA256'],'patch_sha256':os.environ['V8_PATCH_SHA256']},
            'task':receipt['task'],
            'queue':receipt['queue'],
            'media':receipt['media'],
            'boundary':{'candidate_only':True,'repository_write':False,'product_published':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          packet['identity']=sha(json.dumps(packet,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'packet.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          find "$PACKET" -type f ! -name OUTER-SHA256SUMS.pre ! -name OUTER-SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$PACKET/$rel" | sed "s#  $PACKET/#  #"; done > "$PACKET/OUTER-SHA256SUMS.pre"
          sha256sum "$PACKET/OUTER-SHA256SUMS.pre" | sed "s#  $PACKET/#  #" > "$PACKET/OUTER-SHA256SUMS"
          ROOT="$PACKET" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); ledger=root/'OUTER-SHA256SUMS.pre'; sealed=root/'OUTER-SHA256SUMS'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v8-lease-schema-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v8-packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v8-lease-schema-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-packet
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-bootstrap
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-control
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-transport
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
