name: cycle012-cleanup-writer-v4-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-cleanup-writer-v4-observer-v1.yml"

permissions: {}

concurrency:
  group: cycle012-cleanup-writer-v4-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-cleanup-writer-v4-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      BRANCH: observer/cycle012-cleanup-writer-v4-observer-v1
      SELF: .github/workflows/cycle012-cleanup-writer-v4-observer-v1.yml
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      SOURCE_RUN: "31411609257"
      SOURCE_HEAD: d8334a284814b1ae36d5a1f0207ff3fd6024caa6
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v4
      SOURCE_ARTIFACT: "9071888609"
      SOURCE_ARTIFACT_SHA256: 36cb13103951de5be321b39f51a73dc0e7cbba25033b1eb649e9f315bd0e9d39
      EVIDENCE_IDENTITY: 452c643a3d9870d3a5b6509ec38cee52b3fb18cc73694307ecaa5774a1870004
      WRITER_WORKFLOW: doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      WRITER_NAME: doctor-who-cycle-012-selection-cleanup-writer-v4
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      OUT: /tmp/cycle012-cleanup-writer-v4-observer-v1

    steps:
      - name: Observe exact writer transaction to terminal state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,logs,payload}
          test "$CURRENT_BASE" = "$INSTALLED_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$INSTALLED_MAIN...$CURRENT_HEAD" > "$OUT/api/observer-compare.json"
          jq -e --arg path "$SELF" '.status=="ahead" and .ahead_by==2 and .behind_by==0 and .total_commits==2 and (.files|length)==1 and .files[0].filename==$path' "$OUT/api/observer-compare.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          jq -e --arg branch "$BRANCH" --arg head "$CURRENT_HEAD" --arg base "$INSTALLED_MAIN" \
            '.state=="open" and .draft==true and .merged==false and .head.ref==$branch and .head.sha==$head and .base.sha==$base and .commits==2 and .changed_files==1' \
            "$OUT/api/observer-pr.json" >/dev/null
          jq -e --arg head "$SOURCE_HEAD" --arg branch "$SOURCE_BRANCH" \
            '.id=='"$SOURCE_RUN"' and .head_sha==$head and .head_branch==$branch and .status=="completed" and .conclusion=="success"' \
            "$OUT/api/source-run.json" >/dev/null
          jq -e --arg digest "sha256:$SOURCE_ARTIFACT_SHA256" \
            '.id=='"$SOURCE_ARTIFACT"' and .digest==$digest and .expired==false' \
            "$OUT/api/source-artifact.json" >/dev/null

          source_completed="$(jq -r '.updated_at' "$OUT/api/source-run.json")"
          writer_id=""
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/$WRITER_WORKFLOW/runs" \
              -f per_page=100 > "$OUT/api/writer-runs-$attempt.json"
            SOURCE_COMPLETED="$source_completed" WRITER_NAME="$WRITER_NAME" ATTEMPT="$attempt" python3 - <<'PY' > "$OUT/api/writer-id.txt"
          import json,os
          from pathlib import Path
          rows=json.loads(Path(os.environ['OUT']+'/api/writer-runs-'+os.environ['ATTEMPT']+'.json').read_text())['workflow_runs']
          eligible=[row for row in rows if row['name']==os.environ['WRITER_NAME'] and row['event']=='workflow_run' and row['created_at']>=os.environ['SOURCE_COMPLETED']]
          if eligible:
              print(max(eligible,key=lambda row:row['id'])['id'])
          PY
            writer_id="$(cat "$OUT/api/writer-id.txt")"
            if [ -n "$writer_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_id" > "$OUT/api/writer-run.json"
              status="$(jq -r '.status' "$OUT/api/writer-run.json")"
              if [ "$status" = completed ]; then
                break
              fi
            fi
            sleep 5
          done
          test -n "$writer_id"
          test "$(jq -r '.status' "$OUT/api/writer-run.json")" = completed
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_id/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_id/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$AGENT_PREFIX" > "$OUT/api/agent-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$OBSERVER_PREFIX" > "$OUT/api/observer-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$TERMINAL_PREFIX" > "$OUT/api/terminal-refs.json"

          WRITER_ID="$writer_id" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); api=root/'api'
          load=lambda name:json.loads((api/name).read_text())
          run=load('writer-run.json'); jobs=load('writer-jobs.json')['jobs']; artifacts=load('writer-artifacts.json')['artifacts']
          main=load('main.json')['object']['sha']
          rows=[row for row in jobs if row['name']=='write']
          assert len(rows)==1
          job=rows[0]
          receipt={
              'status':'cycle-012-cleanup-writer-v4-terminal-observation-v1',
              'version':1,
              'source':{'run':int(os.environ['SOURCE_RUN']),'head':os.environ['SOURCE_HEAD'],'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ARTIFACT_SHA256'],'evidence_identity':os.environ['EVIDENCE_IDENTITY']},
              'writer':{'run':int(os.environ['WRITER_ID']),'status':run['status'],'conclusion':run['conclusion'],'head_sha':run['head_sha'],'head_branch':run['head_branch'],'event':run['event'],'job':job['id'],'job_status':job['status'],'job_conclusion':job['conclusion'],'artifacts':[{'id':row['id'],'name':row['name'],'size':row['size_in_bytes'],'digest':row.get('digest')} for row in artifacts]},
              'canonical':{'installed_main':os.environ['INSTALLED_MAIN'],'observed_main':main,'expected_terminal_tree':os.environ['BASE_TREE']},
              'remaining_refs':{'agent':len(load('agent-refs.json')),'observer':len(load('observer-refs.json')),'terminal_observer':len(load('terminal-refs.json'))},
              'boundary':{'repository_write':False,'canonical_mutation':False,'transport_mutation':False,'lease_issued':False,'queue_mutated':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'payload/observation.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'payload/OBSERVATION_COMPLETE').write_text(receipt['identity']+'\n')
          for name in ['writer-run.json','writer-jobs.json','writer-artifacts.json','main.json','agent-refs.json','observer-refs.json','terminal-refs.json']:
              (root/'payload'/name).write_bytes((api/name).read_bytes())
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v4-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v4-observer-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v4-observer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v4-observer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire_observer:
    needs: observe
    if: ${{ needs.observe.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: observer/cycle012-cleanup-writer-v4-observer-v1
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Close and delete exact observer transport
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR" > /tmp/observer-pr.json
          jq -e --arg branch "$BRANCH" --arg head "$HEAD" '.head.ref==$branch and .head.sha==$head and .merged==false' /tmp/observer-pr.json >/dev/null
          if [ "$(jq -r '.state' /tmp/observer-pr.json)" = open ]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$PR" -f state=closed >/tmp/observer-pr-closed.json
          fi
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$HEAD"
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
