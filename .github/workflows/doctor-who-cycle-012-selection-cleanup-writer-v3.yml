name: doctor-who-cycle-012-selection-cleanup-writer-v3

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-evidence-v3]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v3
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      INSTALL_PARENT: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-evidence-v3
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v3
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-evidence-v3-
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v3
      CLEANUP_MESSAGE: "CI: retire exact cycle 012 preselection transport"
      CLEANUP_NAME: undercast-cycle-012-selection-cleanup-v3
      CLEANUP_EMAIL: cycle-012-selection-cleanup-v3@users.noreply.github.com
      CLEANUP_DATE: 2026-08-10T09:00:00Z
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v3-loader
      CARRIER_BLOB: 31166705a5e6fb8188ddad613061d40eb2633153
      CARRIER_GZIP_BYTES: "5320"
      CARRIER_GZIP_SHA256: 542a56abcda6e63345adb18e71afbb78b2a191f8514e27a72fe4effbf8edaf29
      CARRIER_BYTES: "21398"
      CARRIER_SHA256: 78e57d6228da10469129baf034610f21a42256509e78748096c61bc3aed65183

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and execute exact dynamic cleanup writer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path(os.environ['CARRIER']).read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 6
          for index, block in enumerate(blocks, 1):
              compile(block, f'<cycle-012-cleanup-writer-v3-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v3/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v3
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v3-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
