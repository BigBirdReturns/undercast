name: card-backfill-uc-097-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-097-DISCOVER.json"
      - "scripts/card-backfill-uc-097-discover.mjs"
      - ".github/workflows/card-backfill-uc-097-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-097-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-022'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-022
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-097 official Disney discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-097-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-097');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-097');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_fcd930a024862c1c231e65a9');
          if(row.version!==1||row.record_id!=='UC-097'||row.actor!=='Dan Stevens'||row.character!=='The Beast'||row.production!=='Beauty and the Beast'||row.year!==2017||row.side!=='still')throw new Error('UC-097 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8672452482||row.scope_artifact?.artifact_id!==8672497758||row.scope_artifact?.scope_sha256!=='25b9590023a03d1bc02bd5f075723c76ecee3eb6d6cab9c8fdad793fcee8a40d')throw new Error('UC-097 discovery custody drift');
          if(row.pages?.length!==3||row.pages.filter(page=>page.strict).length!==3||row.pages[0]?.final_assets?.length!==2||row.minimum_final_candidates!==2)throw new Error('UC-097 source denominator drift');
          if(row.selection_contract?.official_disney_final_frame_required!==true||row.selection_contract?.exact_2017_live_action_beast_required!==true||row.selection_contract?.reject_1991_animation!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-097 selection contract drift');
          if(!specimen||specimen.character!=='The Beast'||specimen.production!=='Beauty and the Beast'||specimen.years!=='2017'||specimen.still)throw new Error('UC-097 specimen boundary drift');
          if(source?.still)throw new Error('UC-097 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-097'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-097 audit boundary drift');
          console.log('PASS — exact UC-097 official Disney source orbit authorized');
          NODE
      - name: Gather official Disney Beast candidates and custody receipts
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-097-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-097-discover.mjs
          node scripts/card-backfill-uc-097-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-097-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, final candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-097-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-097-discover
            ${{ runner.temp }}/card-backfill-uc-097-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
