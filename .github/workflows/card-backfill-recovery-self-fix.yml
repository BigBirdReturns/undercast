name: card-backfill-recovery-self-fix

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-recovery-self-fix.yml'

permissions:
  contents: write

concurrency:
  group: card-backfill-recovery-self-fix-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-041
          fetch-depth: 0

      - name: Replace brittle nested multiline patch logic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path=Path('.github/workflows/card-backfill-source-v3-wave-recover.yml')
          text=path.read_text()
          start=text.index("          reducer=Path('scripts/card-backfill-wave-reduce.mjs')")
          end=text.index("          PY\n", start)
          replacement='''          reducer=Path('scripts/card-backfill-wave-reduce.mjs')
          text=reducer.read_text()
          observed_line='  const observedHead = option("--observed-head", sourceHead);'
          mutation_lines='  const mutationHead = option("--mutation-head", sourceHead);\\n  const observedHead = option("--observed-head", mutationHead);'
          if observed_line not in text:
              raise SystemExit('wave reducer observed-head seam drift')
          text=text.replace(observed_line,mutation_lines,1)
          stale_line='  if (observedHead !== sourceHead) throw new Error(`refusing stale wave reduction: source_head ${sourceHead} differs from observed head ${observedHead}`);'
          recovered_line='  if (!mutationHead || !/^[0-9a-f]{40}$/i.test(mutationHead)) throw new Error("mutation_head must be a full commit SHA");\\n  if (observedHead !== mutationHead) throw new Error(`refusing stale wave reduction: mutation_head ${mutationHead} differs from observed head ${observedHead}`);'
          if stale_line not in text:
              raise SystemExit('wave reducer stale-head seam drift')
          text=text.replace(stale_line,recovered_line,1)
          receipt_line='    source_head: sourceHead,\\n    wave_sha256: wave.wave_sha256,'
          receipt_recovery='    source_head: sourceHead,\\n    mutation_head: mutationHead,\\n    wave_sha256: wave.wave_sha256,'
          if receipt_line not in text:
              raise SystemExit('wave reducer receipt seam drift')
          text=text.replace(receipt_line,receipt_recovery,1)
          reducer.write_text(text)

          workflow=Path('.github/workflows/card-backfill-source-v2-autonomous.yml')
          text=workflow.read_text()
          model_line="          MODEL: @@DOLLAR@@{{ inputs.model || 'openai/gpt-4.1-mini' }}"
          token_line='          GITHUB_TOKEN: @@DOLLAR@@{{ secrets.GITHUB_TOKEN }}'
          model_line=model_line.replace('@@DOLLAR@@','$')
          token_line=token_line.replace('@@DOLLAR@@','$')
          if token_line not in text:
              if model_line not in text:
                  raise SystemExit('wave model-token seam drift')
              text=text.replace(model_line,token_line+'\\n'+model_line,1)
          workflow.write_text(text)
          '''
          text=text[:start]+replacement+text[end:]
          path.write_text(text)
          PY
          git diff --check
          grep -q 'observed_line=' .github/workflows/card-backfill-source-v3-wave-recover.yml

      - name: Commit the corrected durable recovery lane
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill-recovery-fix'
          git config user.email 'undercast-card-backfill-recovery-fix@users.noreply.github.com'
          git add .github/workflows/card-backfill-source-v3-wave-recover.yml
          git commit -m 'Card backfill: make wave recovery patch deterministic'
          git push origin HEAD:agent/card-backfill-next-041
