name: doctor-who-cycle-012-media-census-v6

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v6.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v6
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_BLOBS: "929fb6f6c3f539661ff14c2317fd813be711b05d 9f0a1728075b99dac7a2661a622627f6a187a79e"
      CONTROLLER_B64_BYTES: "6140"
      CONTROLLER_B64_SHA256: b8077ccff479bc645fd591b8a6e9ea5fe4345647b6f4a2d3c073a0771471ad39
      CONTROLLER_GZIP_BYTES: "4604"
      CONTROLLER_GZIP_SHA256: 300dbe3a27c46ccf9003883586cde3cfee3cd3b7e41006e1f85cddf1cb32e78b
      CONTROLLER_BYTES: "12952"
      CONTROLLER_SHA256: cc5ba89c37ac4c0de531bdc5d1b010d32e9fdec3764a3aabc0910eebc064349e
      ROOT: /tmp/doctor-who-cycle-012-media-census-v6-controller
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact V6 receipt-handoff repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          : > "$ROOT/controller.sh.gz.b64"
          for blob in $CONTROLLER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$ROOT/controller.sh.gz.b64"
          done
          test "$(wc -c < "$ROOT/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d "$ROOT/controller.sh.gz.b64" > "$ROOT/controller.sh.gz"
          test "$(wc -c < "$ROOT/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$ROOT/controller.sh.gz" > "$ROOT/controller.sh"
          test "$(wc -c < "$ROOT/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$ROOT/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$ROOT/controller.sh"
          chmod 700 "$ROOT/controller.sh"
          "$ROOT/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v6-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v6/payload
            /tmp/doctor-who-cycle-012-media-census-v5-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v6-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v6
            /tmp/doctor-who-cycle-012-media-census-v6-loader
            /tmp/doctor-who-cycle-012-media-census-v5-failure
            /tmp/doctor-who-cycle-012-media-census-v6-controller
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
