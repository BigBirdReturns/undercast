name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v2
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2
      SOURCE_PREFIX: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12/
      CANDIDATE_PR: "673"
      CANDIDATE_HEAD: f6292fb2e93fe5340d039cfca0bfdf25c815c520
      CANDIDATE_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v12
      CANDIDATE_WORKFLOW: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12
      CANDIDATE_RUN: "31273651684"
      CANDIDATE_JOB: "93143639874"
      CANDIDATE_ARTIFACT: "9026406657"
      CANDIDATE_ARTIFACT_SHA256: 546c566567f88158356767a9a1d8f05728988d0387df99ca3f33a53c3e35cb72
      CANDIDATE_COMMIT: 35f5074a6f6f5cb25cb3a3b83a2cfa1709d4cd87
      CANDIDATE_TREE: e59fc815459f10b8c16cd443354a0e8481e5d0eb
      CANDIDATE_PATHS_SHA256: 488a082aa186ab16e28b5c0b9bc7b28867e72126ab0ffa8fdaadc61f82ac5f50
      CANDIDATE_COMMIT_AT: "2026-08-08T07:25:00.000Z"
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_dac48796b25d13844dfed65b
      WALL_ID: UC-1354
      PERFORMER: Dan Starkey
      ROLE: Megnus Jaka
      SOURCE_URL: https://tardis.fandom.com/wiki/Megnus_Jaka
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      PORTRAIT_PATH: images/uc-1354-portrait.jpg
      PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      PORTRAIT_BYTES: "51125"
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      REVIEW_AT: ${{ github.event.pull_request.created_at }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path independent review carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,archive,source,review,approved,diagnostics}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Authenticate and extract exact V12 candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE_PR" > "$OUT/api/candidate-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$OUT/api/candidate-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$CANDIDATE_JOB" > "$OUT/api/candidate-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$OUT/api/candidate-artifact.json"
          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/candidate-pr.json').read_text())
          run=json.loads((root/'api/candidate-run.json').read_text())
          job=json.loads((root/'api/candidate-job.json').read_text())
          artifact=json.loads((root/'api/candidate-artifact.json').read_text())
          assert pr['number']==int(os.environ['CANDIDATE_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['EXACT_MAIN'] and pr['head']['sha']==os.environ['CANDIDATE_HEAD'] and pr['head']['ref']==os.environ['CANDIDATE_BRANCH']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['CANDIDATE_RUN']) and run['name']==os.environ['CANDIDATE_WORKFLOW']
          assert run['head_sha']==os.environ['CANDIDATE_HEAD'] and run['head_branch']==os.environ['CANDIDATE_BRANCH']
          assert run['event']=='pull_request' and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          assert job['id']==int(os.environ['CANDIDATE_JOB']) and job['run_id']==run['id'] and job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['CANDIDATE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['CANDIDATE_ARTIFACT_SHA256']
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==os.environ['CANDIDATE_HEAD']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$OUT/archive/candidate.zip"
          test "$(sha256sum "$OUT/archive/candidate.zip" | cut -d' ' -f1)" = "$CANDIDATE_ARTIFACT_SHA256"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT']); archive=root/'archive/candidate.zip'; target=root/'source'
          with zipfile.ZipFile(archive) as z:
              infos=z.infolist()
              assert len(infos)==104 and len(infos)==len({i.filename for i in infos})
              for info in infos:
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not info.is_dir()
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          prefix=os.environ['SOURCE_PREFIX']
          outer=[]
          for raw in (target/'SHA256SUMS.pre').read_text().splitlines():
              digest, remote=raw.split('  ',1); assert remote.startswith(prefix)
              local=target/remote[len(prefix):]; assert local.is_file() and sha(local)==digest; outer.append(remote)
          assert len(outer)==45
          assert sha(target/'SHA256SUMS.pre')==(target/'SHA256SUMS').read_text().split()[0]
          for sub, remote_prefix in [
              ('evidence/preflight','/tmp/doctor-who-cycle-009-real-preflight-v1/'),
              ('evidence/evidence','/tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3/receipt/'),
              ('evidence/review','/tmp/doctor-who-cycle-009-megnus-jaka-cover-review-v1/receipt/'),
          ]:
              base=target/sub
              for raw in (base/'SHA256SUMS.pre').read_text().splitlines():
                  digest, remote=raw.split('  ',1); assert remote.startswith(remote_prefix)
                  local=base/remote[len(remote_prefix):]; assert local.is_file() and sha(local)==digest
              assert sha(base/'SHA256SUMS.pre')==(base/'SHA256SUMS').read_text().split()[0]
          binding={
              'candidate_pr':int(os.environ['CANDIDATE_PR']), 'candidate_head':os.environ['CANDIDATE_HEAD'],
              'candidate_run':int(os.environ['CANDIDATE_RUN']), 'candidate_job':int(os.environ['CANDIDATE_JOB']),
              'candidate_artifact':int(os.environ['CANDIDATE_ARTIFACT']), 'candidate_artifact_sha256':os.environ['CANDIDATE_ARTIFACT_SHA256'],
              'outer_ledger_files':len(outer),
          }
          (root/'review/source-binding.json').write_text(json.dumps(binding,indent=2,sort_keys=True)+'\n')
          PY

      - name: Independently reconstruct exact candidate commit and tree
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT']); source=root/'source'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          receipt=json.loads((source/'receipt/candidate-receipt.json').read_text())
          assert receipt['version']==1 and receipt['status']=='candidate-complete'
          assert receipt['workflow_run']==int(os.environ['CANDIDATE_RUN']) and receipt['workflow_attempt']==1
          assert receipt['carrier_pr']==int(os.environ['CANDIDATE_PR']) and receipt['carrier_head']==os.environ['CANDIDATE_HEAD']
          assert receipt['base_main']==os.environ['EXACT_MAIN']
          assert receipt['candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and receipt['candidate']['tree']==os.environ['CANDIDATE_TREE']
          assert receipt['candidate']['paths']==40 and receipt['candidate']['paths_sha256']==os.environ['CANDIDATE_PATHS_SHA256']
          assert receipt['task']['id']==os.environ['TASK_ID'] and receipt['task']['lease_id']==os.environ['LEASE_ID']
          assert receipt['task']['performer']==os.environ['PERFORMER'] and receipt['task']['role']==os.environ['ROLE'] and receipt['task']['wall_id']==os.environ['WALL_ID']
          assert receipt['task']['source_url']==os.environ['SOURCE_URL'] and receipt['task']['source_fingerprint']==os.environ['SOURCE_FINGERPRINT']
          assert receipt['chronology']['candidate_committed_at']==os.environ['CANDIDATE_COMMIT_AT']
          assert receipt['media']['character_still']=='absent' and receipt['media']['performer_portrait']=='verified'
          assert receipt['media']['portrait_path']==os.environ['PORTRAIT_PATH'] and receipt['media']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert receipt['media']['portrait_origin']==os.environ['PORTRAIT_ORIGIN'] and receipt['media']['portrait_license']=='CC BY-SA 2.0'
          assert receipt['queue']['after']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert receipt['gate']=={'complete_gate_passed':True,'steps':26}
          assert receipt['boundary']=={
              'additional_lease_authorized':False,'candidate_only':True,'cycle_receipt_written':False,
              'outside_human_dependency':False,'owner_physical_action_required':False,'product_merged':False,
              'product_published':False,'repository_ref_created':False,'repository_write':False,'waterline_event_written':False,
          }
          for key,path in [
              ('paths_sha256','receipt/candidate-paths.txt'),('file_manifest_sha256','receipt/candidate-file-manifest.json'),
              ('delta_manifest_sha256','receipt/delta-manifest.json'),('patch_sha256','product/candidate.patch'),
              ('bundle_sha256','product/candidate.bundle'),('product_archive_sha256','product/candidate-product.tar.gz'),
          ]:
              assert receipt['candidate'][key]==sha(source/path)
          paths=(source/'receipt/candidate-paths.txt').read_text().splitlines()
          allowed=(source/'receipt/allowed-paths.txt').read_text().splitlines()
          assert paths==allowed==sorted(paths) and len(paths)==len(set(paths))==40
          assert sha(source/'receipt/candidate-paths.txt')==os.environ['CANDIDATE_PATHS_SHA256']
          assert not (source/'receipt/unexpected-paths.txt').read_bytes() and not (source/'receipt/missing-paths.txt').read_bytes()
          manifest=json.loads((source/'receipt/candidate-file-manifest.json').read_text())
          entries=manifest['files']; assert [e['path'] for e in entries]==paths and len(entries)==40
          by={e['path']:e for e in entries}
          delta=json.loads((source/'receipt/delta-manifest.json').read_text())['paths']
          assert sorted(r['path'] for r in delta)==paths and sum(r['status']=='A' for r in delta)==1
          assert next(r for r in delta if r['status']=='A')['path']==os.environ['PORTRAIT_PATH']
          status={r['path']:r['status'] for r in delta}
          with tarfile.open(source/'product/candidate-product.tar.gz','r:gz') as tf:
              members=tf.getmembers(); assert [m.name for m in members]==paths and all(m.isfile() for m in members)
              for m in members:
                  p=PurePosixPath(m.name); assert not p.is_absolute() and '..' not in p.parts
                  out=Path(m.name)
                  assert (not out.exists()) if status[m.name]=='A' else out.is_file()
                  data=tf.extractfile(m).read(); entry=by[m.name]
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256']
                  assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==entry['blob']
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          assert Path(os.environ['PORTRAIT_PATH']).stat().st_size==int(os.environ['PORTRAIT_BYTES'])
          assert sha(Path(os.environ['PORTRAIT_PATH']))==os.environ['PORTRAIT_SHA256']
          PY
          git diff --name-status "$EXACT_MAIN" | LC_ALL=C sort > "$OUT/review/reconstructed-name-status.txt"
          cut -f2- "$OUT/review/reconstructed-name-status.txt" | LC_ALL=C sort > "$OUT/review/reconstructed-paths.txt"
          cmp "$OUT/review/reconstructed-paths.txt" "$OUT/source/receipt/candidate-paths.txt"
          cmp "$OUT/review/reconstructed-name-status.txt" "$OUT/source/receipt/candidate-name-status.txt"
          git diff --quiet "$EXACT_MAIN" -- data/WATERLINE-STATE.json data/journal/waterline.jsonl
          test -z "$(git diff --name-only "$EXACT_MAIN" -- .github workflows scripts docs records package.json package-lock.json)"
          while IFS= read -r path; do git add -- "$path"; done < "$OUT/source/receipt/candidate-paths.txt"
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          GIT_AUTHOR_NAME='Undercast Candidate Builder' \
          GIT_AUTHOR_EMAIL='candidate@undercast.invalid' \
          GIT_COMMITTER_NAME='Undercast Candidate Builder' \
          GIT_COMMITTER_EMAIL='candidate@undercast.invalid' \
          GIT_AUTHOR_DATE="$CANDIDATE_COMMIT_AT" \
          GIT_COMMITTER_DATE="$CANDIDATE_COMMIT_AT" \
            git commit -m 'Doctor Who: materialize cycle 009 Megnus Jaka candidate'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          git bundle verify "$OUT/source/product/candidate.bundle" | tee "$OUT/review/bundle-verify.log"
          test "$(git bundle list-heads "$OUT/source/product/candidate.bundle" | awk '{print $1}')" = "$CANDIDATE_COMMIT"
          git diff --binary "$EXACT_MAIN" HEAD > "$OUT/review/reconstructed.patch"
          cmp "$OUT/review/reconstructed.patch" "$OUT/source/product/candidate.patch"
          while IFS= read -r path; do printf '%s\0' "$path"; done < "$OUT/source/receipt/candidate-paths.txt" \
            | tar --null --files-from=- --sort=name --mtime="$CANDIDATE_COMMIT_AT" --owner=0 --group=0 --numeric-owner -cf - \
            | gzip -n > "$OUT/review/reconstructed-product.tar.gz"
          cmp "$OUT/review/reconstructed-product.tar.gz" "$OUT/source/product/candidate-product.tar.gz"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Independently validate semantics and complete rendered gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/review/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/review/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/review/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/review/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/review/media-gate.log"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); task=os.environ['TASK_ID']; wall=os.environ['WALL_ID']; lease=os.environ['LEASE_ID']
          card=next(r for r in json.load(open('data/specimens.json')) if r.get('id')==wall)
          assert card['actor']==os.environ['PERFORMER'] and card['character']==os.environ['ROLE'] and card['kind']=='voice' and card['transform']==2 and 'still' not in card
          assert card['portrait']['src']==os.environ['PORTRAIT_PATH'] and card['portrait']['origin']==os.environ['PORTRAIT_ORIGIN'] and card['portrait']['license']=='CC BY-SA 2.0' and card['portrait']['pin'] is True
          source=next(r for r in json.load(open('data/SOURCES.json')) if r.get('id')==wall)
          assert source['still'] is None and source['portrait']==card['portrait'] and source['fetched_at']=='2026-08-08'
          state=json.load(open('data/AUTOPILOT.json')); job=next(r for r in state['jobs'] if r['id']==task)
          assert job['status']=='resolved' and job['role_on_wall'] is True and job['wall_ids']==[wall] and job['outcome']['kind']=='audited-wall'
          assert job['outcome']['media_review']['lease_id']==lease and job['outcome']['media_review']['reviewed_by']=='chatgpt-second-desk'
          journal=[json.loads(x) for x in Path('data/journal/autopilot.jsonl').read_text().splitlines() if x.strip()]
          events=[(i,r) for i,r in enumerate(journal) if r.get('task_id')==task]
          assert len(events)==6
          for _,row in events:
              body={k:v for k,v in row.items() if k!='id'}
              assert row['id']=='apj_'+hashlib.sha256(json.dumps(body,separators=(',',':')).encode()).hexdigest()[:24] and row['version']==1
          lease_events=[(i,r) for i,r in events if r.get('lease_id')==lease]
          assert [r['op'] for _,r in lease_events]==['lease.claimed','task.drafted','task.media-verified']
          ci,claimed=lease_events[0]; di,drafted=lease_events[1]; vi,verified=lease_events[2]
          merged=[(i,r) for i,r in events if di<i<vi and r.get('op')=='task.merged']
          assert len(merged)==1; mi,merge=merged[0]
          assert ci<di<mi<vi and merge.get('lease_id') is None and merge['wall_ids']==[wall]
          assert [claimed['at'],drafted['at'],merge['at'],verified['at']]==['2026-08-08T07:20:00.000Z','2026-08-08T07:21:00.000Z','2026-08-08T07:23:00.000Z','2026-08-08T07:24:00.000Z']
          assert verified['review_sha256']==job['outcome']['review_sha256'] and verified['wall_ids']==[wall]
          audit=json.load(open('data/MEDIA-AUDIT.json')); items=[r for r in audit['items'] if r['wall_id']==wall]
          assert len(items)==2
          still=next(r for r in items if r['side']=='still'); portrait=next(r for r in items if r['side']=='portrait')
          assert still['status']=='absent' and still['asset'] is None
          assert portrait['status']=='verified' and portrait['asset']['sha256']==os.environ['PORTRAIT_SHA256']
          assert portrait['claims']['identity']['state']=='enforced' and portrait['claims']['identity']['value']=='expected'
          assert portrait['claims']['presentation']['state']=='enforced' and portrait['claims']['presentation']['value']=='neutral-human'
          coverage=[r for r in json.load(open('data/CENSUS-COVERAGE.json')) if r.get('performer')==os.environ['PERFORMER'] and r.get('character')==os.environ['ROLE']]
          assert len(coverage)==1 and coverage[0]['role_on_wall'] is True and coverage[0]['wall_ids']==[wall]
          status=json.loads((root/'review/autopilot-status.json').read_text())
          assert status['total']==316 and status['statuses']=={'queued':307,'resolved':9} and status['in_flight']==0
          semantic={'task':task,'lease':lease,'wall':wall,'task_events':len(events),'lease_ops':[r['op'] for _,r in lease_events],'merge_bound_by_sequence':True,'queue':status['statuses'],'still':'absent','portrait':'verified'}
          (root/'review/semantic-review.json').write_text(json.dumps(semantic,indent=2,sort_keys=True)+'\n')
          PY
          npm run gate 2>&1 | tee "$OUT/review/complete-gate.log"
          grep -F 'gate: PASS — 26 step(s)' "$OUT/review/complete-gate.log" >/dev/null
          grep -F '23 passed' "$OUT/review/complete-gate.log" >/dev/null
          grep -F '15 passed' "$OUT/review/complete-gate.log" >/dev/null
          grep -F '9 passed' "$OUT/review/complete-gate.log" >/dev/null
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Seal independently approved candidate packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/approved"/{candidate,review}
          cp "$OUT/source/product/candidate.bundle" "$OUT/approved/candidate/"
          cp "$OUT/source/product/candidate.patch" "$OUT/approved/candidate/"
          cp "$OUT/source/product/candidate-product.tar.gz" "$OUT/approved/candidate/"
          cp "$OUT/source/receipt/candidate-receipt.json" "$OUT/approved/candidate/"
          cp "$OUT/source/receipt/candidate-file-manifest.json" "$OUT/approved/candidate/"
          cp "$OUT/source/receipt/delta-manifest.json" "$OUT/approved/candidate/"
          cp "$OUT/source/receipt/candidate-paths.txt" "$OUT/approved/candidate/"
          cp "$OUT/review/source-binding.json" "$OUT/approved/review/"
          cp "$OUT/review/semantic-review.json" "$OUT/approved/review/"
          cp "$OUT/review/bundle-verify.log" "$OUT/approved/review/"
          cp "$OUT/review/complete-gate.log" "$OUT/approved/review/"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); approved=root/'approved'; sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          candidate=json.loads((approved/'candidate/candidate-receipt.json').read_text())
          review={
              'version':1,
              'transaction':'DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-CANDIDATE-INDEPENDENT-REVIEW-V1',
              'status':'candidate-independently-approved',
              'reviewed_by':'chatgpt-second-desk',
              'reviewed_at':os.environ['REVIEW_AT'],
              'workflow_run':int(os.environ['GITHUB_RUN_ID']),
              'workflow_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'source':{
                  'candidate_pr':int(os.environ['CANDIDATE_PR']),'candidate_head':os.environ['CANDIDATE_HEAD'],
                  'candidate_run':int(os.environ['CANDIDATE_RUN']),'candidate_job':int(os.environ['CANDIDATE_JOB']),
                  'candidate_artifact':int(os.environ['CANDIDATE_ARTIFACT']),'candidate_artifact_sha256':os.environ['CANDIDATE_ARTIFACT_SHA256'],
              },
              'candidate':{
                  'base_main':os.environ['EXACT_MAIN'],'commit':os.environ['CANDIDATE_COMMIT'],'tree':os.environ['CANDIDATE_TREE'],
                  'paths':40,'paths_sha256':os.environ['CANDIDATE_PATHS_SHA256'],
                  'bundle_sha256':sha(approved/'candidate/candidate.bundle'),
                  'patch_sha256':sha(approved/'candidate/candidate.patch'),
                  'product_archive_sha256':sha(approved/'candidate/candidate-product.tar.gz'),
                  'receipt_sha256':sha(approved/'candidate/candidate-receipt.json'),
                  'file_manifest_sha256':sha(approved/'candidate/candidate-file-manifest.json'),
                  'delta_manifest_sha256':sha(approved/'candidate/delta-manifest.json'),
              },
              'task':candidate['task'],
              'queue':candidate['queue'],
              'media':candidate['media'],
              'gate':{'complete_gate_passed':True,'steps':26,'rendered_tests':47},
              'invariants':{
                  'exact_commit_reconstructed':True,'exact_tree_reconstructed':True,'thin_bundle_verified_against_exact_main':True,
                  'binary_patch_reproduced':True,'product_archive_reproduced':True,'journal_envelope_verified':True,
                  'operation_specific_lease_custody_verified':True,'path_denominator_exact':True,'waterline_unchanged':True,
              },
              'boundary':{
                  'repository_write':False,'repository_ref_created':False,'product_published':False,'product_merged':False,
                  'cycle_receipt_written':False,'additional_lease_authorized':False,'outside_human_dependency':False,
                  'owner_physical_action_required':False,
              },
          }
          identity=hashlib.sha256(json.dumps(review,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          review['identity']=identity
          (approved/'review/independent-review.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
          files=sorted(p for p in approved.rglob('*') if p.is_file())
          ledger=''.join(f'{sha(p)}  {p.relative_to(approved).as_posix()}\n' for p in files)
          (approved/'SHA256SUMS.pre').write_text(ledger)
          (approved/'SHA256SUMS').write_text(f'{sha(approved/"SHA256SUMS.pre")}  SHA256SUMS.pre\n')
          (root/'review/review-identity.txt').write_text(identity+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Upload independently approved candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-approved-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2/approved
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload independent review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
