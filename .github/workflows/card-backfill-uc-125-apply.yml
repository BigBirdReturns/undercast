name: card-backfill-uc-125-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-125-APPLY.json"
      - "scripts/card-backfill-uc-125-apply.part-00.mjs"
      - "scripts/card-backfill-uc-125-apply.part-01.mjs"
      - "scripts/card-backfill-uc-125-apply.part-02.mjs"
      - ".github/workflows/card-backfill-uc-125-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-125-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-030'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-125 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-125-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-125');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-125');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4a735d846bcdf5aae92e0959');
          if(row.version!==1||row.record_id!=='UC-125'||row.actor!=='Billy West'||row.character!=='Ren, Stimpy & Fry'||row.production!=='Ren & Stimpy / Futurama'||row.year!==1991||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-125 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8705735419||row.render_artifact?.head_sha!=='0900387f752adedf4c5bb652b37fc7952bb75f31'||row.render_artifact?.zip_sha256!=='f0218a60384ad7d52cbb82b9cdf522fd398dd6c119264f5c6547a8ae9d48580d')throw new Error('UC-125 render custody drift');
          if(row.expected?.ren_source?.sha256!=='a40c0a7e742d3ade92c3c2fca9b14993e54dd95e8d8eee88ad536e98fdf34c8c'||row.expected?.stimpy_source?.sha256!=='731cf5e06aba633a5770429388bfbfd10aa2e9111cf7c19a623ca0a2c828419f'||row.expected?.fry_source?.sha256!=='0fb5a401b4cfaecf399f8125dc5bbf6a02b1ccda7bf1563d21f07b0141293264')throw new Error('UC-125 source authorization drift');
          if(row.expected?.exact_role_record?.sha256!=='ebd018f2ed49d72a4c1c211a199729510b23d89605bb86d4315e0cac8beb27ab'||row.expected?.candidate?.sha256!=='893236a2686b058e1c64edb434bb2c85dadab97b8d36b0b6e18d721d004f36b0'||row.expected?.crop_preview?.sha256!=='d94df6f95ccf321aa5cddcf6922e9665b64ccc0b788f9f1ca5e81f20137ee4f5')throw new Error('UC-125 candidate or role authorization drift');
          if(row.expected?.packet_file_count!==15||row.expected?.duplicate_item_count!==5||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==3||row.expected?.discovery_candidate_count!==3||row.expected?.official_source_width_exception_count!==3)throw new Error('UC-125 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='three-role-character-composite'||row.ruling?.crop_ruling!=='pass-three-panel-face-and-body-layout'||row.ruling?.chronology_ruling!=='pass-1991-ren-stimpy-era-separated-from-ren-takeover-and-fry-debut'||row.ruling?.floor_exception_ruling!=='pass-three-explicit-official-source-width-exceptions'||row.ruling?.canonical_mutation!==false)throw new Error('UC-125 ruling drift');
          if(!specimen||specimen.actor!=='Billy West'||specimen.character!=='Ren, Stimpy & Fry'||specimen.production!=='Ren & Stimpy / Futurama'||specimen.years!=='1991'||specimen.still)throw new Error('UC-125 specimen boundary drift');
          if(source?.still)throw new Error('UC-125 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-125'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-125 audit boundary drift');
          console.log(`PASS — UC-125 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8705735419/zip" > "$root/render.zip"
          echo "f0218a60384ad7d52cbb82b9cdf522fd398dd6c119264f5c6547a8ae9d48580d  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-125"
          test -f "$base/manifest.json"
          echo "fc22ff9314826b0afa6c55a8c36e5a4ebd92aeb1fb60603aece6d3b934d01f33  $base/manifest.json" | sha256sum -c -
          echo "8795bf4e67fd68c8ff8de4ecb4bf9910571c093daa606152a259baf93378bbe4  $base/duplicate-scan.json" | sha256sum -c -
          echo "7fa386e034060d0054c488909a57d3a1b5381ea441b93b7dd4ad65263704ed66  $base/review.json" | sha256sum -c -
          echo "dae2a598585ad86d7da2ab1b4553f8473f26573bbaa69ab1eaec4987bad0ca44  $base/review.md" | sha256sum -c -
          echo "078f3d5324e81e8e46a6ef6852d1b88380102ad5fe27838c01ab418fb5495d81  $base/SHA256SUMS" | sha256sum -c -
          echo "ebd018f2ed49d72a4c1c211a199729510b23d89605bb86d4315e0cac8beb27ab  $base/exact-role-record.json" | sha256sum -c -
          echo "a40c0a7e742d3ade92c3c2fca9b14993e54dd95e8d8eee88ad536e98fdf34c8c  $base/ren-original.jpg" | sha256sum -c -
          echo "731cf5e06aba633a5770429388bfbfd10aa2e9111cf7c19a623ca0a2c828419f  $base/stimpy-original.jpg" | sha256sum -c -
          echo "0fb5a401b4cfaecf399f8125dc5bbf6a02b1ccda7bf1563d21f07b0141293264  $base/fry-original.jpg" | sha256sum -c -
          echo "9a9558c93aaa7533e60b40c589b03fb4c3f27cfe78b0e83fc14bc0fe5bf9e9df  $base/source-page-billy-west-current-official.png" | sha256sum -c -
          echo "64d27ffab7efa915ca566a9d49417f4af24d59b5851f67d5996ebe593105da5b  $base/source-page-billy-west-role-history.png" | sha256sum -c -
          echo "c7e16ee97198d3747e66ceec4a230f4e5035d46d77943fa4ce23dcb01ea38221  $base/source-page-paramount-ren-stimpy.png" | sha256sum -c -
          echo "46e45c5e2f81e006f5aabd858fb66a889cacf239e275ae3de2ac1114a3e0de4e  $base/source-page-hulu-futurama.png" | sha256sum -c -
          echo "893236a2686b058e1c64edb434bb2c85dadab97b8d36b0b6e18d721d004f36b0  $base/uc-125-still-candidate.jpg" | sha256sum -c -
          echo "d94df6f95ccf321aa5cddcf6922e9665b64ccc0b788f9f1ca5e81f20137ee4f5  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30403803136
          artifact_id=8705735419
          artifact_name=card-backfill-uc-125-render-30403803136
          artifact_zip_sha256=f0218a60384ad7d52cbb82b9cdf522fd398dd6c119264f5c6547a8ae9d48580d
          artifact_head_sha=0900387f752adedf4c5bb652b37fc7952bb75f31
          source_manifest_sha256=fc22ff9314826b0afa6c55a8c36e5a4ebd92aeb1fb60603aece6d3b934d01f33
          source_sums_sha256=078f3d5324e81e8e46a6ef6852d1b88380102ad5fe27838c01ab418fb5495d81
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-125-apply/source/output/UC-125
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-apply"
          cat scripts/card-backfill-uc-125-apply.part-00.mjs scripts/card-backfill-uc-125-apply.part-01.mjs scripts/card-backfill-uc-125-apply.part-02.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-125');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-125');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_4a735d846bcdf5aae92e0959');
          if(!specimen||specimen.still)throw new Error('UC-125 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-125 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-125'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-125 audit disposition was canonically mutated');
          console.log('PASS — UC-125 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-125.json \
            .github/CARD-BACKFILL-UC-125-DISCOVER.json \
            .github/CARD-BACKFILL-UC-125-RENDER.json \
            .github/CARD-BACKFILL-UC-125-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-125-scope.yml \
            .github/workflows/card-backfill-uc-125-discover.yml \
            .github/workflows/card-backfill-uc-125-render.yml \
            .github/workflows/card-backfill-uc-125-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-125-scope.mjs \
            scripts/card-backfill-uc-125-discover.mjs \
            scripts/card-backfill-uc-125-render.part-00.mjs \
            scripts/card-backfill-uc-125-render.part-01.mjs \
            scripts/card-backfill-uc-125-render.part-02.mjs \
            scripts/card-backfill-uc-125-apply.part-00.mjs \
            scripts/card-backfill-uc-125-apply.part-01.mjs \
            scripts/card-backfill-uc-125-apply.part-02.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-125 Billy West three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-029
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-029 HEAD)
          test "${#changed[@]}" -eq 15
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-125/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-030
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-125-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-125-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-125-apply
            data/review/card-backfill/UC-125
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
