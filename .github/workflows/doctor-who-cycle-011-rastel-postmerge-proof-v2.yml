name: doctor-who-cycle-011-rastel-postmerge-proof-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-postmerge-proof-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-postmerge-proof-v2
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-postmerge-proof-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_PARENT: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      EXPECTED_LOCAL_COMMIT: 1c92734e501ed4667ac86c4203a6dbac282392ee
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z
      PRODUCT_PATHS: "49"
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      BRANCH: agent/doctor-who-cycle-011-rastel-postmerge-proof-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-postmerge-proof-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-postmerge-proof-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind proof carrier and exact canonical geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%P "$CANONICAL_MAIN")" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          test "$(git show -s --format=%T "$ORIGINAL_MAIN")" = "$ORIGINAL_TREE"
          test "$(git show -s --format=%B "$CANONICAL_MAIN" | sed -e '${/^$/d;}')" = "$COMMIT_MESSAGE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$CANONICAL_MAIN" > "$OUT/api/canonical-git-commit.json"
          CURRENT_HEAD="$head" CURRENT_BASE="$base" CURRENT_PR="$pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          pr=json.loads((root/'carrier-pr.json').read_text())
          commit=json.loads((root/'canonical-git-commit.json').read_text())
          assert pr['number']==int(os.environ['CURRENT_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['CURRENT_BASE'] and pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert commit['sha']==os.environ['CANONICAL_MAIN'] and commit['tree']['sha']==os.environ['CANONICAL_TREE']
          assert len(commit['parents'])==1 and commit['parents'][0]['sha']==os.environ['CANONICAL_PARENT']
          PY
          git diff --name-status "$ORIGINAL_MAIN" "$CANONICAL_MAIN" > "$OUT/logs/original-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/original-to-canonical.tsv" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(awk '$1=="D" {print}' "$OUT/logs/original-to-canonical.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/original-to-canonical.tsv")"
          git diff --name-status "$CANONICAL_PARENT" "$CANONICAL_MAIN" > "$OUT/logs/installed-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/installed-to-canonical.tsv" | tr -d ' ')" = 51
          test "$(awk -v a="$V1_PATH" -v b="$V2_PATH" '$1=="D" && ($2==a || $2==b) {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 2
          test "$(awk '$1=="D" {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 2
          for path in "$V1_PATH" "$V2_PATH"; do
            if git cat-file -e "$CANONICAL_MAIN:$path" 2>/dev/null; then
              echo "publisher transport survived canonical tree: $path" >&2
              exit 1
            fi
          done
          printf 'PROOF_HEAD=%s\nPROOF_PR=%s\n' "$head" "$pr" >> "$GITHUB_ENV"

      - name: Classify commit-object variance without changing history
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="$COMMIT_NAME" GIT_AUTHOR_EMAIL="$COMMIT_EMAIL" GIT_AUTHOR_DATE="$COMMIT_DATE"
          export GIT_COMMITTER_NAME="$COMMIT_NAME" GIT_COMMITTER_EMAIL="$COMMIT_EMAIL" GIT_COMMITTER_DATE="$COMMIT_DATE"
          expected="$(printf '%s\n' "$COMMIT_MESSAGE" | git commit-tree "$CANONICAL_TREE" -p "$CANONICAL_PARENT")"
          test "$expected" = "$EXPECTED_LOCAL_COMMIT"
          test "$expected" != "$CANONICAL_MAIN"
          test "$(git show -s --format=%P "$expected")" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T "$expected")" = "$CANONICAL_TREE"
          test "$(git show -s --format=%B "$expected" | sed -e '${/^$/d;}')" = "$COMMIT_MESSAGE"
          git diff --quiet "$expected" "$CANONICAL_MAIN"
          git cat-file -p "$expected" > "$OUT/logs/expected-local-commit.txt"
          git cat-file -p "$CANONICAL_MAIN" > "$OUT/logs/canonical-commit.txt"
          EXPECTED="$expected" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          def parse(path):
              raw=path.read_text(); head,body=raw.split('\n\n',1)
              headers={}; current=None
              for line in head.splitlines():
                  if line.startswith(' ') and current:
                      headers[current]+='\n'+line
                  else:
                      key,value=line.split(' ',1); current=key; headers.setdefault(key,value)
              return raw,headers,body
          expected_raw,expected_headers,expected_body=parse(root/'logs/expected-local-commit.txt')
          canonical_raw,canonical_headers,canonical_body=parse(root/'logs/canonical-commit.txt')
          assert expected_headers['tree']==canonical_headers['tree']==os.environ['CANONICAL_TREE']
          assert expected_headers['parent']==canonical_headers['parent']==os.environ['CANONICAL_PARENT']
          assert expected_body==canonical_body and canonical_body.strip()==os.environ['COMMIT_MESSAGE']
          receipt={
              'status':'cycle-011-rastel-canonical-commit-object-classified-v1','version':1,
              'canonical':{'commit':os.environ['CANONICAL_MAIN'],'raw_sha256':sha(canonical_raw.encode()),'tree':canonical_headers['tree'],'parent':canonical_headers['parent'],'author':canonical_headers.get('author'),'committer':canonical_headers.get('committer'),'has_gpgsig':'gpgsig' in canonical_headers},
              'deterministic_local':{'commit':os.environ['EXPECTED'],'raw_sha256':sha(expected_raw.encode()),'tree':expected_headers['tree'],'parent':expected_headers['parent'],'author':expected_headers.get('author'),'committer':expected_headers.get('committer'),'has_gpgsig':'gpgsig' in expected_headers},
              'equivalence':{'same_tree':True,'same_parent':True,'same_message':True,'same_file_bytes':True,'same_commit_id':False},
              'boundary':{'history_rewrite':False,'force_update':False,'canonical_mutation':False,'cycle_012_authorized':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/commit-object.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Authenticate permanent Rastel receipt and terminal semantic state
        shell: bash
        run: |
          set -euo pipefail
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -f scripts/doctor-who-cycle-010.mjs
          test -f scripts/doctor-who-cycle-010-historical.mjs
          test -f scripts/doctor-who-cycle-011.mjs
          test -z "$(git ls-files 'scripts/doctor-who-cycle-012*' 'data/review/adapter-sdk/doctor-who-cycle-012*')"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); repo=Path.cwd(); sha=lambda data:hashlib.sha256(data).hexdigest()
          tracked=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          matches=[]
          for raw in tracked:
              if not raw: continue
              path=repo/raw.decode()
              if path.is_file() and sha(path.read_bytes())==os.environ['RECEIPT_FILE_SHA256']:
                  matches.append(path)
          assert len(matches)==1,[p.as_posix() for p in matches]
          path=matches[0]; data=json.loads(path.read_text())
          identity=data.pop('identity')
          assert identity==os.environ['RECEIPT_IDENTITY']
          assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          data['identity']=identity
          flat=json.dumps(data,sort_keys=True,ensure_ascii=False)
          for token in (os.environ['TASK_ID'],os.environ['LEASE_ID'],os.environ['WALL_ID'],os.environ['CYCLE_ID'],os.environ['WATERLINE_EVENT']):
              assert token in flat,token
          receipt={'status':'cycle-011-rastel-permanent-receipt-authenticated-v1','version':1,'path':path.relative_to(repo).as_posix(),'file_sha256':os.environ['RECEIPT_FILE_SHA256'],'identity':identity,'task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'cycle':os.environ['CYCLE_ID'],'waterline_event':os.environ['WATERLINE_EVENT']}
          receipt['proof_identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/permanent-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          test -z "$(git status --porcelain)"

      - name: Rerun complete rendered canonical gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal terminal canonical proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          commit_object=json.loads((root/'receipt/commit-object.json').read_text())
          permanent=json.loads((root/'receipt/permanent-receipt.json').read_text())
          status=json.loads((root/'receipt/autopilot-status.json').read_text())
          receipt={
              'status':'cycle-011-rastel-terminal-canonical-proof-complete-v2','version':2,
              'proof':{'pr':int(os.environ['PROOF_PR']),'head':os.environ['PROOF_HEAD'],'base':os.environ['CANONICAL_MAIN']},
              'canonical':{'commit':os.environ['CANONICAL_MAIN'],'parent':os.environ['CANONICAL_PARENT'],'tree':os.environ['CANONICAL_TREE'],'permanent_paths':int(os.environ['PRODUCT_PATHS']),'publisher_transports_absent':True},
              'commit_object':{'classification_identity':commit_object['identity'],'deterministic_local_commit':os.environ['EXPECTED_LOCAL_COMMIT'],'same_tree_parent_message_and_files':True,'history_rewrite_required':False},
              'cycle':{'id':os.environ['CYCLE_ID'],'waterline_event':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY'],'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256'],'receipt_proof_identity':permanent['proof_identity']},
              'task':{'id':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'performer':'Dan Starkey','role':'Rastel','mode':'voice','portrait_sha256':os.environ['PORTRAIT_SHA256'],'character_still':'honestly absent'},
              'queue':{'total':status['total'],'queued':status['statuses']['queued'],'resolved':status['statuses']['resolved'],'in_flight':status['in_flight']},
              'gates':{'canonical_geometry':True,'permanent_path_denominator':True,'publisher_cleanup':True,'commit_object_equivalence':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True},
              'boundary':{'repository_write':False,'canonical_mutation':False,'history_rewrite':False,'force_update':False,'cleanup_authorized_after_proof':True,'cycle_012_selection_authorized':False,'cycle_012_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/terminal.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-postmerge-proof-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-postmerge-proof-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-postmerge-proof-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-postmerge-proof-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
