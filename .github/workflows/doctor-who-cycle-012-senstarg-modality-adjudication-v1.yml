name: doctor-who-cycle-012-senstarg-modality-adjudication-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-modality-adjudication-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-modality-adjudication-v1
  cancel-in-progress: true

jobs:
  adjudicate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-modality-adjudication-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_BLOBS: "5897e0e35cd05003a99b95ca404d2030e74c390d b1bbee5f5267d24a2d63d1660c479f5eabb64ac0"
      CONTROLLER_B64_BYTES: "8440"
      CONTROLLER_B64_SHA256: a2c667dc1bf7fd65bab57ee3deb77d9ab60dae282d3876448d4711ef2acd2017
      CONTROLLER_GZIP_BYTES: "6328"
      CONTROLLER_GZIP_SHA256: b52a116b90633f7aea4ab89d375735cc4e091a5bed087f40dec5b204f9680520
      CONTROLLER_BYTES: "21044"
      CONTROLLER_SHA256: 9700e31d7d6b60192f8aa0b5d123ae7dba974f0f06d77ac0fb8661e29256115e
      ROOT: /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1-controller
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact Senstarg modality adjudication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          : > "$ROOT/controller.sh.gz.b64"
          for blob in $CONTROLLER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$ROOT/controller.sh.gz.b64"
          done

          test "$(wc -c < "$ROOT/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d "$ROOT/controller.sh.gz.b64" > "$ROOT/controller.sh.gz"
          test "$(wc -c < "$ROOT/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$ROOT/controller.sh.gz" > "$ROOT/controller.sh"
          test "$(wc -c < "$ROOT/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$ROOT/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$ROOT/controller.sh"

          CONTROLLER="$ROOT/controller.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CONTROLLER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-senstarg-modality-adjudication-v1-{index}>','exec')
          PY

          chmod 700 "$ROOT/controller.sh"
          "$ROOT/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-modality-adjudication-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-modality-adjudication-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1-blueprint
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1-review
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v1-controller
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
