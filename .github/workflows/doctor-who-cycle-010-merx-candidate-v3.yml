name: doctor-who-cycle-010-merx-candidate-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-candidate-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-candidate-v3
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-candidate-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      EXACT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      BRANCH: agent/doctor-who-cycle-010-merx-candidate-v3
      SELF: .github/workflows/doctor-who-cycle-010-merx-candidate-v3.yml
      OUT: /tmp/doctor-who-cycle-010-merx-candidate-v3
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TASK_ID: ap_cab2d7f95d930401627c1b30
      EXPECTED_WALL_ID: UC-1355
      SOURCE_URL: https://tardis.fandom.com/wiki/Merx
      SOURCE_PAGEID: "233175"
      SOURCE_REVISION: "3363140"
      SOURCE_SHA256: 5fa09f17e86ef5868e36d860119c14867a0766b0b8d6da6cf8a739fb85509e4c
      SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      PRODUCT_URL: https://www.bigfinish.com/releases/v/unit-encounters-1531
      PREFLIGHT_PR: "710"
      PREFLIGHT_HEAD: 27f7ba406d24a755cc28bd5d211336bb9b984df0
      PREFLIGHT_RUN: "31287572617"
      PREFLIGHT_JOB: "93179083191"
      PREFLIGHT_ARTIFACT: "9030358001"
      PREFLIGHT_ZIP_SHA256: bb37c586c51d8410304eb4f67689b2de23881dd791dce0f61c47212875bca194
      PREFLIGHT_IDENTITY: 107d6990ab5de7abdeb85daa630af979c8b6bb296932448aec23f13f6587500a
      EVIDENCE_PR: "718"
      EVIDENCE_HEAD: d7e679b00e789a75d8ae6045379be58c7960f7bb
      EVIDENCE_RUN: "31288716782"
      EVIDENCE_JOB: "93182124247"
      EVIDENCE_ARTIFACT: "9030725963"
      EVIDENCE_ZIP_SHA256: 2c85c62992010b424ba63da4fea6c75bb5f14158b9921cf791ea9d084cef14b0
      EVIDENCE_IDENTITY: 245a36c1c5142153c575f7e2a6656e7b1f40fad1e164be5246e3473ef0d54734
      REVIEW_PR: "720"
      REVIEW_HEAD: 1d9e899e654eade8d7e7286c72eb5ca9ca02bf41
      REVIEW_RUN: "31289043004"
      REVIEW_JOB: "93182987511"
      REVIEW_ARTIFACT: "9030821919"
      REVIEW_ZIP_SHA256: 7d7c858fcfafa89c1b123118ff65273fe763bf903f615b982e4e06f8a2de53f7
      REVIEW_IDENTITY: d75f4f5a059c8a2d871b908154484379c09e3a001242a1e760c01f0835980777
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      PORTRAIT_BYTES: "46449"
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      SELECTION_BASIS: cycle-010-preflight-v2:107d6990ab5de7abdeb85daa630af979c8b6bb296932448aec23f13f6587500a
      CLAIM_AT: 2026-08-09T02:10:00.000Z
      SUBMIT_AT: 2026-08-09T02:12:00.000Z
      ACCEPT_AT: 2026-08-09T02:13:00.000Z
      MERGE_AT: 2026-08-09T02:14:00.000Z
      AUDIT_AT: 2026-08-09T02:15:00.000Z
      REVIEW_AT: 2026-08-09T02:16:00.000Z
      COMMIT_AT: 2026-08-09T02:17:00.000Z
      FETCHED_AT: 2026-08-09
      MATERIALIZER_CHUNK_SHA256: f4afe2b80b12719548a792bfae5937837daabd9d7a26a612d6b29dc29b954ed5
      MATERIALIZER_SHA256: 10a901e724166724433dc81a5e871b320d765491ad248d2ab1f5a07818500967
      MATERIALIZER_GZIP_SHA256: 758d54a3fb6db24081cfb7db67dfbce16fe6134358a0f4b2b0f64714c55caad0
      MATERIALIZER_BYTES: "37671"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and compile exact candidate materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" /tmp/merx-materializer-v3
          mkdir -p "$OUT" /tmp/merx-materializer-v3
          : > /tmp/merx-materializer-v3/materializer.gz.b64
          for blob in 1b2a975060251734fbdd7402322370beec52250a 52d92330f5ab56f1ead4bc58d0459bce4756536d d17179e7889b13e3daac0a97eede72a29eb16590 a34fdb397379d5de1469adcd2f1523b7c24cae92 5aabd54af406059af342b61dce1a6617798832b7 efb360f29bdf4a00bae4830ab7ff229720d7b3d0 d511af7e0c6bafcb0f8e949cfe764257cb6c7ae8; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/merx-materializer-v3/materializer.gz.b64
          done
          test "$(sha256sum /tmp/merx-materializer-v3/materializer.gz.b64 | cut -d' ' -f1)" = "$MATERIALIZER_CHUNK_SHA256"
          python3 - <<'PY'
          import base64,gzip,hashlib,os
          from pathlib import Path
          root=Path('/tmp/merx-materializer-v3')
          raw=base64.b64decode(root.joinpath('materializer.gz.b64').read_text())
          assert hashlib.sha256(raw).hexdigest()==os.environ['MATERIALIZER_GZIP_SHA256']
          data=gzip.decompress(raw)
          assert len(data)==int(os.environ['MATERIALIZER_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['MATERIALIZER_SHA256']
          root.joinpath('materialize.sh').write_bytes(data)
          PY
          bash -n /tmp/merx-materializer-v3/materialize.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/merx-materializer-v3/materialize.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==10
          for i,block in enumerate(blocks): compile(block,f'<embedded-{i}>', 'exec')
          PY
          cp /tmp/merx-materializer-v3/materialize.sh "$OUT/materialize.sh"
          sha256sum /tmp/merx-materializer-v3/materialize.sh > "$OUT/materialize.sha256"

      - name: Execute exact current-main Merx candidate transaction
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/merx-materializer-v3/materialize.sh
          exec /tmp/merx-materializer-v3/materialize.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-candidate-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-candidate-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-candidate-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-candidate-v3
            /tmp/merx-materializer-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
