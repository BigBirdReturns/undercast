name: card-backfill-uc-126-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-126-RENDER.json"
      - "scripts/card-backfill-uc-126-render.part-00.mjs"
      - "scripts/card-backfill-uc-126-render.part-01.mjs"
      - "scripts/card-backfill-uc-126-render.part-02.mjs"
      - ".github/workflows/card-backfill-uc-126-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-126-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-031'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-126 four-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-126-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-126');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-126');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_90375b50fca2bd3603ba9946');
          if(row.version!==1||row.record_id!=='UC-126'||row.actor!=='Tara Strong'||row.character!=='Bubbles, Timmy, Harley & Twilight'||row.production!=='Powerpuff Girls / Fairly OddParents / etc.'||row.year!==1998||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-126 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8707338950||row.discovery_artifact?.head_sha!=='02acc54f5795219f8e2f4a4b851a2766c91a4a22'||row.discovery_artifact?.zip_sha256!=='5435fd1edbd71340358e9d7681259447a3a61c1c855299e5332a1c935ee687e5'||row.discovery_artifact?.candidate_count!==30)throw new Error('UC-126 discovery custody drift');
          if(row.bubbles_probe_artifact?.artifact_id!==8707180738||row.failed_discovery_checkpoints?.length!==6)throw new Error('UC-126 probe or failure custody drift');
          const expected={bubbles:'49ccbfd588c6f7b4154bab7b10126713ed24b4910efc891f82b96722de0ddc09',timmy:'379dfe165e928bbbce5e6fccbe0f7c3555dd1a52c530c06150a4cc577f68f7b8',harley:'7e9604384f8f6ba67c4ddf9ee3e88699e5aebb2379825e470972e6df6cf2b5ca',twilight:'7c7b3818f1a04f84daacf4b31d382289b158213b15958697f65c85be1e5765db'};
          if(row.roles?.length!==4||row.roles.some(role=>expected[role.key]!==role.sha256)||row.roles[0]?.width!==185||row.roles[0]?.height!==185||row.roles[1]?.width!==1261||row.roles[2]?.width!==1600||row.roles[3]?.width!==418)throw new Error('UC-126 selected source drift');
          if(row.actor_role_custody?.length!==5||row.actor_role_custody.filter(item=>item.strict).length!==2||row.actor_role_custody.filter(item=>item.reference_only).length!==3)throw new Error('UC-126 actor-role denominator drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==624||row.render?.panel_height!==494||row.render?.vertical_divider_width!==12||row.render?.horizontal_divider_height!==12||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-126 render geometry drift');
          if(!specimen||specimen.actor!=='Tara Strong'||specimen.character!=='Bubbles, Timmy, Harley & Twilight'||specimen.production!=='Powerpuff Girls / Fairly OddParents / etc.'||specimen.years!=='1998'||specimen.still)throw new Error('UC-126 specimen boundary drift');
          if(source?.still)throw new Error('UC-126 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-126'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-126 audit boundary drift');
          console.log('PASS — exact UC-126 Tara Strong four-role render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8707338950/zip" > "$root/discovery.zip"
          echo "5435fd1edbd71340358e9d7681259447a3a61c1c855299e5332a1c935ee687e5  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-126-discover"
          echo "e109685b036361f031e309e8d7819e5bc51e68aa6a04cb815b8165077e6e801a  $source/manifest.json" | sha256sum -c -
          echo "c481021c6c204318e8cbb09b1140055af9032c10453dde116d8cfdb93765033a  $source/summary.json" | sha256sum -c -
          echo "8a3cb6d967c6f8acb2adae4667a8d64c465c367d1451d8d0fb6808063dc3f278  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "56325291646f13b92040c67bb8b7c78b7ec7812c46354e591fd72d8dc0bac687  $source/contact-sheet-bubbles.jpg" | sha256sum -c -
          echo "9d328bb4015609af378b1d59bc815bcc78fecaa347c02f89f4c8aeeaa2639967  $source/contact-sheet-timmy.jpg" | sha256sum -c -
          echo "fbe59b674f5cf9229cba8c54fcda4760995771bf60b4e06c082e7d4e4fe70575  $source/contact-sheet-harley.jpg" | sha256sum -c -
          echo "f3573940bfbdea47c9a86951204cb9a3705323cc74a6bb8e579cb7b01f3d7ff7  $source/contact-sheet-twilight.jpg" | sha256sum -c -
          echo "9ab0a1bc795ad0d463f4ea6bf922ba76e26a23fabac392ce2a63a0147dabd160  $source/pages/vanity-fair-tara-strong-roles.png" | sha256sum -c -
          echo "7f22c30856165a80cc1e355c3c06f9145a126c6c56bc6c88596673221bbc2a40  $source/pages/dc-tara-strong-harley.png" | sha256sum -c -
          echo "59c0410e71daf4501c7d6218c0fcbd3dd4dd37fb1d298b62ac0c9cf48d73662b  $source/pages/bubbles.png" | sha256sum -c -
          echo "3c1963ffe7fb2681c98c5cdb0c962a64db034e6fe4b26dad459ad6b145ecb7e3  $source/pages/timmy.png" | sha256sum -c -
          echo "ebcdb4f7c171dc8bdbccc674b1da9c1e40b1861186b295abf9d22723068ad001  $source/pages/harley.png" | sha256sum -c -
          echo "a302968d75f49d8bc1950def7904972f33570cf433781a6e995594e20fc0c683  $source/pages/twilight.png" | sha256sum -c -
          echo "afdbff0010836aaa3241c2ef97c85af7c7e1bfeb87757dacf459803e979982bb  $source/api-wikitext/bubbles.txt" | sha256sum -c -
          echo "3c16dc95fc3bc259903893aa1dfc579856665cde299e6d28bb76e9ad25df7dda  $source/api-wikitext/timmy.txt" | sha256sum -c -
          echo "113803f2e16a3cf808797ddf8f51707fd34a7042ad6ba7e01caa092da4509540  $source/api-wikitext/harley.txt" | sha256sum -c -
          echo "d891ef8a90ecf4f7ad0894c926ae5a225a0682afe241e36ef6885e3714f1d08e  $source/api-wikitext/twilight.txt" | sha256sum -c -
          echo "49ccbfd588c6f7b4154bab7b10126713ed24b4910efc891f82b96722de0ddc09  $source/candidates/bubbles/002-file-185px-bubbles-kicking-jpg.webp" | sha256sum -c -
          echo "379dfe165e928bbbce5e6fccbe0f7c3555dd1a52c530c06150a4cc577f68f7b8  $source/candidates/timmy/002-file-new-timmy-stock-png.webp" | sha256sum -c -
          echo "7e9604384f8f6ba67c4ddf9ee3e88699e5aebb2379825e470972e6df6cf2b5ca  $source/candidates/harley/006-file-harley-quinn-bridge-detonator-plunger-standing-s01e09-jpg.webp" | sha256sum -c -
          echo "7c7b3818f1a04f84daacf4b31d382289b158213b15958697f65c85be1e5765db  $source/candidates/twilight/006-file-princess-twilight-sparkle-id-s4e26-png.webp" | sha256sum -c -
      - name: Render exact four-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-126-render/discovery/card-backfill-uc-126-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-126-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-render"
          cat scripts/card-backfill-uc-126-render.part-00.mjs scripts/card-backfill-uc-126-render.part-01.mjs scripts/card-backfill-uc-126-render.part-02.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-126-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-126-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-126-render/output
            ${{ runner.temp }}/card-backfill-uc-126-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
