name: card-backfill-uc-053-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-053-RENDER.json"
      - "scripts/card-backfill-uc-053-render.mjs"
      - ".github/workflows/card-backfill-uc-053-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-053-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-007'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed old-Count authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-053-RENDER.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-053'||row.actor!=='Gary Oldman'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-053 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8634492318||row.discovery_artifact?.head_sha!=='0f534ee526cb3d59c456a782bd3afaf567446ecc')throw new Error('UC-053 discovery custody drift');
          if(row.selection?.source_key!=='slashfilm-scariest-scene'||row.selection?.sha256!=='eac0892b10bb01bbd263b66f5945e4c8ac997edeb47f19c98aa373db96cadacb')throw new Error('UC-053 selected old Count drift');
          if(row.alternate_visual_duplicate?.sha256!=='672e2c25d0612ae37c8b5a321660882a7ad3f8242a9824d05393b605bf5dd363')throw new Error('UC-053 alternate-encoding receipt drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.canonical_mutation!==false)throw new Error('UC-053 ruling drift');
          console.log('PASS — exact Gary Oldman old Count source and evidence-only ruling authorized');
          NODE
      - name: Retrieve and verify the exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-053-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8634492318/zip" > "$root/discovery.zip"
          echo "faa83b35464d5dc1bb894ef81e006625f4079722c5220e495a28da655cfc169d  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-053/manifest.json"
          echo "eac0892b10bb01bbd263b66f5945e4c8ac997edeb47f19c98aa373db96cadacb  $root/source/card-backfill-uc-053/candidates/20-slashfilm-scariest-scene-film.jpg" | sha256sum -c -
          echo "672e2c25d0612ae37c8b5a321660882a7ad3f8242a9824d05393b605bf5dd363  $root/source/card-backfill-uc-053/candidates/21-slashfilm-scariest-scene-film.webp" | sha256sum -c -
          echo "27ab0c6cc95e769b3bcdbbb0259c91e48c307b3eace73c3431f57be7117a0474  $root/source/card-backfill-uc-053/pages/slashfilm-scariest-scene.png" | sha256sum -c -
          echo "1ec655d2aa316186ab8bb3a3d4a5b81944eba23602d71e1ea8b776c892a0a27e  $root/source/card-backfill-uc-053/manifest.json" | sha256sum -c -
      - name: Render exact old Count candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-053-render/source/card-backfill-uc-053
          OUT: ${{ runner.temp }}/card-backfill-uc-053-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-053-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-053-render/render.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-053-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-053-render/output
            ${{ runner.temp }}/card-backfill-uc-053-render/render.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
