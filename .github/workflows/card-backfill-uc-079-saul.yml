name: card-backfill-uc-079-saul

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-079-SAUL.json"
      - "scripts/card-backfill-uc-079-saul.mjs"
      - ".github/workflows/card-backfill-uc-079-saul.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-079-saul-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-018'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-018
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-079 Saul supplement authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-079-SAUL.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-079');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_12bdd74c1d97797f21a54d9a');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-079');
          if(row.version!==1||row.record_id!=='UC-079'||row.actor!=='Eddie Murphy'||row.side!=='still')throw new Error('UC-079 Saul authorization drift');
          if(row.direct_role_artifact?.artifact_id!==8660410939||row.direct_role_artifact?.head_sha!=='317350429efce56a8307f165d4a9a2b6de032fa9')throw new Error('UC-079 direct-role custody drift');
          if(row.sources?.length!==3||row.sources.filter(item=>item.asset_url).length!==2)throw new Error('UC-079 Saul source denominator drift');
          if(!specimen||specimen.character!=='Barbershop crowd & Saul'||specimen.still)throw new Error('UC-079 specimen boundary drift');
          if(!audit||audit.wall_id!=='UC-079'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-079 audit boundary drift');
          if(source?.still)throw new Error('UC-079 source-ledger boundary drift');
          console.log('PASS — explicit UC-079 Saul supplement authorized');
          NODE
      - name: Gather explicit four-role composites and mapped Saul quadrants
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-079-saul
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-079-saul.mjs
          node scripts/card-backfill-uc-079-saul.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-079-saul-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact pages, source bytes, quadrants, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-079-saul-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-079-saul
            ${{ runner.temp }}/card-backfill-uc-079-saul-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
