name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v12'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v12
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12
      RECOVERY_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v12
      CONTROL: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v12
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v12
      PREDECESSOR_RUN: "31272939160"
      PREDECESSOR_JOB: "93141863673"
      PREDECESSOR_ARTIFACT: "9026204109"
      PREDECESSOR_HEAD: 52accd3a880ba4960ed0da35f3ab4bcd41b742a2
      PREDECESSOR_ZIP_SHA256: bb99b22d2577ff3c232997c7b4d8ec576c5474a48ed32212d1d665e904da1271
      SOURCE_RUNNER_SHA256: 54ee590e82011482efc5c7ee0b5f2ee100b4571915136324c94893f910571e39
      SOURCE_RUNNER_BYTES: "8972"
      V12_RUNNER_SHA256: 94cbe46159be67ee11c90a3aacd299d60d0a3d8e2ca44c557310978fb65ae7ea
      V12_RUNNER_BYTES: "13363"
      V6_ENV_SHA256: 136969de3aec603a2a890e10ace4f5a6ae40598d09c838fe56f293c1c83de137
      V6_ENV_BYTES: "3250"
      V7_MATERIALIZER_SHA256: d9b76ea08805fef3473cd72e5185d238bdfc1ca46bb44ef56fcc32636c3d71ea
      V7_MATERIALIZER_BYTES: "39288"
      V8_MATERIALIZER_SHA256: 0909632b012f06bc111e631c9e0a3e6923a591d9427da638e0bb6821e9ba7e44
      V8_MATERIALIZER_BYTES: "39387"
      V9_MATERIALIZER_SHA256: 67df1640cec61dc20c9e7d737af42a486cf97bbae6e753f392cf4b0815cdd682
      V9_MATERIALIZER_BYTES: "40147"
      V10_MATERIALIZER_SHA256: 3be914e59f06dfe83d7d0b53589b3cceac979e755262abafbd06bc6e1081b90f
      V10_MATERIALIZER_BYTES: "40571"
      V11_MATERIALIZER_SHA256: a2132e14877d845ea4d5c1d454b71f45e5b6ea58e6b036c73d0336f658c78844
      V11_MATERIALIZER_BYTES: "40605"
      V12_MATERIALIZER_SHA256: a0149cde367222687ca44ed5a25017a40db04e44f127a4317d9220e5f0a84db3
      V12_MATERIALIZER_BYTES: "40817"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V11 failure and repair exact candidate path proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$CONTROL" "$OUT" "$RECOVERY_ROOT"
          mkdir -p "$BOOTSTRAP"/{api,archive,receipt} "$CONTROL"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREDECESSOR_RUN" > "$BOOTSTRAP/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$PREDECESSOR_JOB" > "$BOOTSTRAP/api/job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREDECESSOR_ARTIFACT" > "$BOOTSTRAP/api/artifact.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          run=json.loads((root/'api/run.json').read_text())
          job=json.loads((root/'api/job.json').read_text())
          artifact=json.loads((root/'api/artifact.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          assert run['id']==int(os.environ['PREDECESSOR_RUN']) and run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_sha']==os.environ['PREDECESSOR_HEAD']
          assert job['id']==int(os.environ['PREDECESSOR_JOB']) and job['run_id']==int(os.environ['PREDECESSOR_RUN'])
          assert job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Recover exact V10S failure and patch mandatory journal envelope']==('completed','success')
          assert steps['Execute exact candidate transaction with mandatory journal envelope']==('completed','failure')
          assert artifact['id']==int(os.environ['PREDECESSOR_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['PREDECESSOR_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['PREDECESSOR_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['PREDECESSOR_HEAD']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREDECESSOR_ARTIFACT/zip" > "$BOOTSTRAP/archive/v11.zip"
          test "$(sha256sum "$BOOTSTRAP/archive/v11.zip" | cut -d' ' -f1)" = "$PREDECESSOR_ZIP_SHA256"
          ROOT="$BOOTSTRAP" RUNNER="$CONTROL/recovered-run.sh" python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path(os.environ['ROOT'])
          runner_name='doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v11/recovered-run.sh'
          env_name='doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v11/receipt/v6-source-env.json'
          with zipfile.ZipFile(root/'archive/v11.zip') as z:
              infos=z.infolist()
              names=[row.filename for row in infos]
              assert infos and len(names)==len(set(names))
              for row in infos:
                  path=pathlib.PurePosixPath(row.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              assert names.count(runner_name)==1 and names.count(env_name)==1
              runner_data=z.read(runner_name)
              env_data=z.read(env_name)
          assert len(runner_data)==int(os.environ['SOURCE_RUNNER_BYTES'])
          assert hashlib.sha256(runner_data).hexdigest()==os.environ['SOURCE_RUNNER_SHA256']
          assert len(env_data)==int(os.environ['V6_ENV_BYTES'])
          assert hashlib.sha256(env_data).hexdigest()==os.environ['V6_ENV_SHA256']
          text=runner_data.decode()
          old='bash -n "$script"\nchmod 700 "$script"\n"$script"\nmkdir -p "$OUT/source"\ncp "$script" "$OUT/source/materialize-v11.sh"\nsha256sum "$script" > "$OUT/source/materialize-v11.sha256"\n'
          new='SCRIPT="$script" python3 - <<\'PY_V12\'\nimport hashlib, os, re\nfrom pathlib import Path\npath=Path(os.environ[\'SCRIPT\'])\ntext=path.read_text()\nold=\'cut -f2- "$OUT/receipt/candidate-name-status.txt" > "$OUT/receipt/candidate-paths.txt"\\ntest -s "$OUT/receipt/candidate-paths.txt"\\ncat > "$OUT/receipt/allowed-paths.txt" <<\\\'EOF\\\'\\nCREDITS.md\\ndata/AUTOPILOT.json\\ndata/CENSUS-COVERAGE.json\\ndata/CENSUS-FERENGI-TEST.json\\ndata/CENSUS-GAPS.json\\ndata/CENSUS-SUMMARY.json\\ndata/MEDIA-AUDIT.json\\ndata/SOURCES.json\\ndata/archive.json\\ndata/entities.json\\ndata/index.json\\ndata/journal/autopilot.jsonl\\ndata/journal/candidates.jsonl\\ndata/journal/media-audit.jsonl\\ndata/media-live.json\\ndata/media-manifest.json\\ndata/quality.json\\ndata/search/2.json\\ndata/search/a.json\\ndata/search/b.json\\ndata/search/d.json\\ndata/search/f.json\\ndata/search/g.json\\ndata/search/i.json\\ndata/search/j.json\\ndata/search/k.json\\ndata/search/m.json\\ndata/search/manifest.json\\ndata/search/p.json\\ndata/search/r.json\\ndata/search/s.json\\ndata/search/t.json\\ndata/search/u.json\\ndata/search/w.json\\ndata/shard-manifest.json\\ndata/shards/0001.json\\ndata/species.json\\ndata/specimens.json\\nimages/uc-1354-portrait.jpg\\nsitemap.xml\\nEOF\\nLC_ALL=C sort -o "$OUT/receipt/allowed-paths.txt" "$OUT/receipt/allowed-paths.txt"\\ncomm -23 "$OUT/receipt/candidate-paths.txt" "$OUT/receipt/allowed-paths.txt" > "$OUT/receipt/unexpected-paths.txt"\\ntest ! -s "$OUT/receipt/unexpected-paths.txt"\\nfor path in data/AUTOPILOT.json data/CENSUS-COVERAGE.json data/MEDIA-AUDIT.json data/SOURCES.json data/archive.json data/index.json data/journal/autopilot.jsonl data/journal/candidates.jsonl data/shard-manifest.json data/shards/0001.json data/specimens.json images/uc-1354-portrait.jpg sitemap.xml; do\\n  grep -Fx "$path" "$OUT/receipt/candidate-paths.txt" >/dev/null\\ndone\\ncount="$(wc -l < "$OUT/receipt/candidate-paths.txt")"\\ntest "$count" -ge 20\\ntest "$count" -le 40\\n\'\nnew=\'cut -f2- "$OUT/receipt/candidate-name-status.txt" | LC_ALL=C sort > "$OUT/receipt/candidate-paths.txt"\\ntest -s "$OUT/receipt/candidate-paths.txt"\\ncat > "$OUT/receipt/allowed-paths.txt" <<\\\'EOF\\\'\\nCREDITS.md\\ndata/AUTOPILOT.json\\ndata/CENSUS-COVERAGE.json\\ndata/CENSUS-FERENGI-TEST.json\\ndata/CENSUS-GAPS.json\\ndata/CENSUS-SUMMARY.json\\ndata/MEDIA-AUDIT.json\\ndata/SOURCES.json\\ndata/archive.json\\ndata/entities.json\\ndata/index.json\\ndata/journal/autopilot.jsonl\\ndata/journal/candidates.jsonl\\ndata/journal/media-audit.jsonl\\ndata/quality.json\\ndata/search/2.json\\ndata/search/a.json\\ndata/search/b.json\\ndata/search/c.json\\ndata/search/d.json\\ndata/search/e.json\\ndata/search/f.json\\ndata/search/i.json\\ndata/search/j.json\\ndata/search/l.json\\ndata/search/m.json\\ndata/search/manifest.json\\ndata/search/n.json\\ndata/search/o.json\\ndata/search/p.json\\ndata/search/r.json\\ndata/search/s.json\\ndata/search/t.json\\ndata/search/w.json\\ndata/shard-manifest.json\\ndata/shards/0001.json\\ndata/species.json\\ndata/specimens.json\\nimages/uc-1354-portrait.jpg\\nsitemap.xml\\nEOF\\nLC_ALL=C sort -o "$OUT/receipt/allowed-paths.txt" "$OUT/receipt/allowed-paths.txt"\\ncomm -23 "$OUT/receipt/candidate-paths.txt" "$OUT/receipt/allowed-paths.txt" > "$OUT/receipt/unexpected-paths.txt"\\ntest ! -s "$OUT/receipt/unexpected-paths.txt"\\ncomm -13 "$OUT/receipt/candidate-paths.txt" "$OUT/receipt/allowed-paths.txt" > "$OUT/receipt/missing-paths.txt"\\ntest ! -s "$OUT/receipt/missing-paths.txt"\\ncmp "$OUT/receipt/candidate-paths.txt" "$OUT/receipt/allowed-paths.txt"\\nfor path in data/AUTOPILOT.json data/CENSUS-COVERAGE.json data/MEDIA-AUDIT.json data/SOURCES.json data/archive.json data/index.json data/journal/autopilot.jsonl data/journal/candidates.jsonl data/shard-manifest.json data/shards/0001.json data/specimens.json images/uc-1354-portrait.jpg sitemap.xml; do\\n  grep -Fx "$path" "$OUT/receipt/candidate-paths.txt" >/dev/null\\ndone\\ncount="$(wc -l < "$OUT/receipt/candidate-paths.txt")"\\ntest "$count" = 40\\n\'\nassert text.count(old)==1\ntext=text.replace(old,new)\nassert text.count(old)==0\npath.write_text(text)\nassert len(path.read_bytes())==int(os.environ[\'V12_MATERIALIZER_BYTES\'])\nassert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ[\'V12_MATERIALIZER_SHA256\']\nblocks=re.findall(r"python3 - <<\'PY\'\\n(.*?)\\nPY", text, re.S)\nassert len(blocks)==10\nfor index, block in enumerate(blocks, 1):\n    compile(block, f\'embedded-python-{index}\', \'exec\')\nPY_V12\nbash -n "$script"\nchmod 700 "$script"\n"$script"\nmkdir -p "$OUT/source"\ncp "$script" "$OUT/source/materialize-v12.sh"\nsha256sum "$script" > "$OUT/source/materialize-v12.sha256"\n'
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          patched=text.encode()
          assert len(patched)==int(os.environ['V12_RUNNER_BYTES'])
          assert hashlib.sha256(patched).hexdigest()==os.environ['V12_RUNNER_SHA256']
          pathlib.Path(os.environ['RUNNER']).write_bytes(patched)
          (root/'receipt/recovered-run-v11.sh').write_bytes(runner_data)
          (root/'receipt/recovered-run-v12.sh').write_bytes(patched)
          (root/'receipt/v6-source-env.json').write_bytes(env_data)
          env=json.loads(env_data)
          assert sorted(env)==['ACCEPT_AT', 'AUDIT_AT', 'BRANCH', 'CLAIM_AT', 'COMMIT_AT', 'EVIDENCE_ARTIFACT', 'EVIDENCE_IDENTITY', 'EVIDENCE_RUN', 'EVIDENCE_ZIP_SHA256', 'EXACT_MAIN', 'EXPECTED_WALL_ID', 'FETCHED_AT', 'MERGE_AT', 'OUT', 'PATCHED_MATERIALIZER_SHA256', 'PORTRAIT_ARTIFACT', 'PORTRAIT_BYTES', 'PORTRAIT_JOB', 'PORTRAIT_METADATA_SHA256', 'PORTRAIT_ORIGIN', 'PORTRAIT_PRODUCER_IDENTITY', 'PORTRAIT_REVIEW_IDENTITY', 'PORTRAIT_RUN', 'PORTRAIT_SHA256', 'PORTRAIT_ZIP_SHA256', 'PREFLIGHT_ARTIFACT', 'PREFLIGHT_IDENTITY', 'PREFLIGHT_RUN', 'PREFLIGHT_ZIP_SHA256', 'PRODUCT_URL', 'RECOVERY_ARTIFACT', 'RECOVERY_HEAD', 'RECOVERY_JOB', 'RECOVERY_ROOT', 'RECOVERY_RUN', 'RECOVERY_ZIP_SHA256', 'REVIEW_ARTIFACT', 'REVIEW_AT', 'REVIEW_IDENTITY', 'REVIEW_RUN', 'REVIEW_ZIP_SHA256', 'SELECTION_BASIS', 'SELF', 'SOURCE_FINGERPRINT', 'SOURCE_MATERIALIZER_SHA256', 'SOURCE_PAGEID', 'SOURCE_REVISION', 'SOURCE_SHA256', 'SOURCE_TIMESTAMP', 'SOURCE_URL', 'SUBMIT_AT', 'TASK_ID']
          assert env['EXACT_MAIN']=='a9b1a29098e36f03340ff6678b3edd06f1d1d3e2'
          assert env['BRANCH']=='agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a9b1-v6'
          assert env['SELF']=='.github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v6.yml'
          assert env['RECOVERY_RUN']=='31248178316'
          assert env['RECOVERY_JOB']=='93080131128'
          assert env['RECOVERY_ARTIFACT']=='9019166030'
          assert env['RECOVERY_HEAD']=='3094a35d2c19069164c0867b0644f425255eac59'
          assert env['RECOVERY_ZIP_SHA256']=='3729c73d01e8cdc57631005c6440819019c214fde88939513a3a146307727f13'
          assert env['TASK_ID']=='ap_45bb5fdcdf4aff65aa7a87c3'
          assert env['EXPECTED_WALL_ID']=='UC-1354'
          excluded={'EXACT_MAIN','BRANCH','SELF','OUT','RECOVERY_ROOT'}
          imported=set(env)-excluded
          required={'RECOVERY_RUN','RECOVERY_JOB','RECOVERY_ARTIFACT','RECOVERY_HEAD','RECOVERY_ZIP_SHA256','TASK_ID','EXPECTED_WALL_ID','CLAIM_AT','SUBMIT_AT','MERGE_AT','REVIEW_AT','SOURCE_MATERIALIZER_SHA256','PATCHED_MATERIALIZER_SHA256'}
          assert required <= imported
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(imported):
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          bash -n "$CONTROL/recovered-run.sh"
          sha256sum "$BOOTSTRAP/receipt/recovered-run-v11.sh" > "$BOOTSTRAP/receipt/recovered-run-v11.sha256"
          sha256sum "$CONTROL/recovered-run.sh" > "$BOOTSTRAP/receipt/recovered-run-v12.sha256"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Execute exact candidate transaction with exact 40-path proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          chmod 700 "$CONTROL/recovered-run.sh"
          exec "$CONTROL/recovered-run.sh"

      - name: Upload exact selected-portrait candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v12
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v12
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v12
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
