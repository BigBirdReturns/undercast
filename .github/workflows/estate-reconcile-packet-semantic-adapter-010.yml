name: estate-reconcile-packet-semantic-adapter-010

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-reconcile-packet-semantic-adapter-010.yml
      - scripts/estate-reconcile-packet-semantic-adapter-010.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-reconcile-packet-semantic-adapter-010
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  SCRIPT: scripts/estate-reconcile-packet-semantic-adapter-010.mjs
  OUT: data/review/estate-debt/COLLECT-010-PACKET-SEMANTIC-ADAPTER-RULING.json

jobs:
  reconcile:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconcile exact retained vocabularies without lowering evidence standards
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          node --check "$SCRIPT"
          node "$SCRIPT" \
            --head "$AUTHORIZED_HEAD" \
            --out "$OUT" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/COLLECT-010-semantic-adapter-summary.json
          test "$(node -p "require('./$OUT').denominator.incompatible_packets_reviewed")" = "16"
          test "$(node -p "require('./$OUT').denominator.authorized_semantic_adapter")" = "12"
          test "$(node -p "require('./$OUT').denominator.blocked_structural_custody")" = "4"
          test "$(node -p "require('./$OUT').denominator.distinct_media_debt")" = "1"
          test "$(node -p "require('./$OUT').denominator.expected_remaining_after_full_authorized_adoption")" = "5"
          test "$(node -p "require('./$OUT').correction.evidence_standard_changed")" = "false"
          test "$(node -p "require('./$OUT').boundary.canonical_mutation")" = "false"

      - name: Stage immutable semantic ruling and retire one-shot authority
        run: |
          set -euo pipefail
          git rm "$SCRIPT" .github/workflows/estate-reconcile-packet-semantic-adapter-010.yml
          git add -- "$OUT"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' \
            '.github/workflows/estate-reconcile-packet-semantic-adapter-010.yml' \
            "$OUT" \
            "$SCRIPT" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-010-semantic-adapter.tree

      - name: Run repository gate without redundant rendered-browser pass
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-010-semantic-adapter.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs
          test "$(node -p "require('./$OUT').authorized_obligations.length")" = "12"
          test "$(node -p "require('./$OUT').blocked_obligations.length")" = "4"

      - name: Publish exact semantic reconciliation under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: reconcile exact packet semantic vocabularies' \
            -m 'transaction=COLLECT-010' \
            -m 'reviewed=16' \
            -m 'authorized_semantic_adapter=12' \
            -m 'blocked_structural_custody=4' \
            -m 'distinct_media_debt=1' \
            -m 'expected_remaining_after_adoption=5' \
            -m 'evidence_standard_changed=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-010-semantic-adapter.tree)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report corrected semantic denominator
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-010 passed and published on workflow run $GITHUB_RUN_ID.

          The narrow COLLECT-009 adapter was corrected without changing the evidence standard. Twelve normalized packets are terminally authorized by their exact retained vocabularies, second-desk reviews, crop rulings, checksum custody, duplicate screens, and current null state. Four amortized portrait packets remain structurally blocked, and UC-338/still remains distinct-era media debt.

          ```text
          ruling head:                    ${{ steps.publish.outputs.head }}
          normalized packets authorized:  12
          structural packets blocked:      4
          distinct-era media debt:          1
          expected remaining after pay:     5
          canonical mutation:           false
          ```
          EOF_COMMENT

      - name: Report failed reconciliation
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-010 semantic-adapter reconciliation failed closed on workflow run ${GITHUB_RUN_ID}. No canonical mutation or twelve-object authorization claim is valid."

      - name: Preserve semantic reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-010-semantic-adapter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-010-semantic-adapter-summary.json
            /tmp/COLLECT-010-semantic-adapter.tree
            data/review/estate-debt/COLLECT-010-PACKET-SEMANTIC-ADAPTER-RULING.json
          if-no-files-found: warn
          retention-days: 30
