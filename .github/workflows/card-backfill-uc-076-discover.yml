name: card-backfill-uc-076-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-076.json"
      - "scripts/card-backfill-uc-076-discover.mjs"
      - ".github/workflows/card-backfill-uc-076-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-076-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-016'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-016
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-076 audit and two-role boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-076.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_e84b49a14545c7a451d2502a');
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-076');
          if(control.record_id!=='UC-076'||control.actor!=='Felix Silla'||control.side!=='still')throw new Error('UC-076 control drift');
          if(control.selector_artifact?.artifact_id!==8641510531||control.selector_artifact?.head_sha!=='60d4dde6fe89aeb75d203fa0e44997479600bdf4')throw new Error('UC-076 selector custody drift');
          if(control.failed_discovery_checkpoint?.artifact_id!==8641667434||control.failed_discovery_checkpoint?.head_sha!=='adf846235cb6f159c82b0a35b316b3534fbb767a')throw new Error('UC-076 failed-discovery checkpoint drift');
          if(control.failed_repair_checkpoint?.artifact_id!==8641790440||control.failed_repair_checkpoint?.head_sha!=='100b547b13889dbab51e3d15cc3d3796352c1caa')throw new Error('UC-076 failed-repair checkpoint drift');
          if(!audit||audit.wall_id!=='UC-076'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-076 audit boundary drift');
          if(!specimen||specimen.actor!=='Felix Silla'||specimen.character!=='Twiki & Cousin Itt'||specimen.still)throw new Error('UC-076 specimen boundary drift');
          if(control.roles?.map(row=>row.key).join('|')!=='twiki|cousin-itt')throw new Error('UC-076 composite denominator drift');
          console.log('PASS — exact UC-076 absent still, both failed checkpoints, and two-role denominator verified');
          NODE
      - name: Gather exact role candidates and build review sheets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-076
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          repaired="scripts/.card-backfill-uc-076-discover-repaired.mjs"
          sed 's/page_screenshots/pageScreenshots/g' scripts/card-backfill-uc-076-discover.mjs > "$repaired"
          trap 'rm -f "$repaired"' EXIT
          node "$repaired" 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-076-run.log"
          rm -f "$repaired"
          trap - EXIT
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages, hashes and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-076-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-076
            ${{ runner.temp }}/card-backfill-uc-076-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
