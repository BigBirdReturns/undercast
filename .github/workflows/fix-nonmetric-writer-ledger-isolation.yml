name: fix-nonmetric-writer-ledger-isolation

on:
  push:
    branches:
      - agent/operational-metric-ledger-custody
    paths:
      - .github/workflows/fix-nonmetric-writer-ledger-isolation.yml

permissions:
  contents: write

concurrency:
  group: fix-nonmetric-writer-ledger-isolation
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-metric-ledger-custody
  AUTHORIZED_CLEAN_HEAD: af3629fe0d3e4c37699603faabb668add81f9237
  SELF: .github/workflows/fix-nonmetric-writer-ledger-isolation.yml
  RECEIPT: data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact isolation-repair denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$AUTHORIZED_CLEAN_HEAD" HEAD

          printf '%s\n' "$SELF" > /tmp/expected-start-paths.txt
          git diff --name-only "$AUTHORIZED_CLEAN_HEAD...HEAD" | sort > /tmp/actual-start-paths.txt
          diff -u /tmp/expected-start-paths.txt /tmp/actual-start-paths.txt

      - name: Isolate non-metric writers and add CLI regression proof
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          const replaceOnce = (source, oldText, newText, label) => {
            const count = source.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${label} anchor count is ${count}`);
            return source.replace(oldText, newText);
          };

          const cliPath = 'scripts/waterline.mjs';
          let cli = fs.readFileSync(cliPath, 'utf8');
          const oldLoad = `async function load() {
            const config = await readJson(paths.config);
            validateWaterlineConfig(config);
            validateMetricReadinessConfig(config);
            const observationSources = resolveMetricObservationSources(config, {
              root,
              overrides: {
                cost_per_verified_record_usd: costLedgerOverride,
                rights_response_sla_days: rightsLedgerOverride,
              },
            });
            const [state, mediaAudit, autopilot, autopilotJournalText, roadmapState, preservation, costLedger, rightsLedger, waterlineJournal] = await Promise.all([
              readJson(paths.state, emptyWaterlineState()),
              readJson(paths.media),
              readJson(paths.autopilot),
              readText(paths.autopilotJournal),
              readJson(paths.roadmap),
              readJson(paths.preservation),
              readJsonBytes(observationSources.cost_per_verified_record_usd.path, "cost observation ledger"),
              readJsonBytes(observationSources.rights_response_sla_days.path, "rights observation ledger"),
              readText(paths.journal),
            ]);
            validateWaterlineState(state, config);
            parseJsonl(waterlineJournal);
            const metricObservationSnapshots = metricObservationSnapshotsFromLedgers({
              costLedger: costLedger.doc,
              costLedgerBytes: costLedger.bytes,
              costSource: observationSources.cost_per_verified_record_usd.source,
              rightsLedger: rightsLedger.doc,
              rightsLedgerBytes: rightsLedger.bytes,
              rightsSource: observationSources.rights_response_sla_days.source,
            });
            return {
              config,
              state,
              mediaAudit,
              autopilot,
              autopilotJournal: parseJsonl(autopilotJournalText),
              roadmapState,
              preservation,
              metricObservationSnapshots,
              waterlineJournal,
            };
          }`;
          const newLoad = `async function load({ metricAware = true } = {}) {
            const config = await readJson(paths.config);
            validateWaterlineConfig(config);
            validateMetricReadinessConfig(config);
            const [state, mediaAudit, autopilot, autopilotJournalText, roadmapState, preservation, waterlineJournal] = await Promise.all([
              readJson(paths.state, emptyWaterlineState()),
              readJson(paths.media),
              readJson(paths.autopilot),
              readText(paths.autopilotJournal),
              readJson(paths.roadmap),
              readJson(paths.preservation),
              readText(paths.journal),
            ]);
            validateWaterlineState(state, config);
            parseJsonl(waterlineJournal);

            let metricObservationSnapshots = null;
            if (metricAware) {
              const observationSources = resolveMetricObservationSources(config, {
                root,
                overrides: {
                  cost_per_verified_record_usd: costLedgerOverride,
                  rights_response_sla_days: rightsLedgerOverride,
                },
              });
              const [costLedger, rightsLedger] = await Promise.all([
                readJsonBytes(observationSources.cost_per_verified_record_usd.path, "cost observation ledger"),
                readJsonBytes(observationSources.rights_response_sla_days.path, "rights observation ledger"),
              ]);
              metricObservationSnapshots = metricObservationSnapshotsFromLedgers({
                costLedger: costLedger.doc,
                costLedgerBytes: costLedger.bytes,
                costSource: observationSources.cost_per_verified_record_usd.source,
                rightsLedger: rightsLedger.doc,
                rightsLedgerBytes: rightsLedger.bytes,
                rightsSource: observationSources.rights_response_sla_days.source,
              });
            }

            return {
              config,
              state,
              mediaAudit,
              autopilot,
              autopilotJournal: parseJsonl(autopilotJournalText),
              roadmapState,
              preservation,
              metricObservationSnapshots,
              waterlineJournal,
            };
          }`;
          cli = replaceOnce(cli, oldLoad, newLoad, 'metric-aware loader');
          cli = replaceOnce(
            cli,
            `  return withLock(async () => {
              const inputs = await load();`,
            `  return withLock(async () => {
              const inputs = await load({ metricAware: command === "record-metrics" });`,
            'writer loader policy',
          );
          fs.writeFileSync(cliPath, cli);

          const fixturePath = 'scripts/metric-readiness-fixtures.mjs';
          let fixture = fs.readFileSync(fixturePath, 'utf8');
          fixture = replaceOnce(
            fixture,
            `import assert from "node:assert/strict";`,
            [
              `import assert from "node:assert/strict";`,
              `import { spawnSync } from "node:child_process";`,
              `import { mkdir, mkdtemp, readFile, rm, writeFile } from "node:fs/promises";`,
              `import { tmpdir } from "node:os";`,
              `import { dirname, join } from "node:path";`,
              `import { fileURLToPath } from "node:url";`,
            ].join('\n'),
            'fixture imports',
          );
          const oldSummary = `console.log("PASS — normalized configured source identities, spelling-alias erasure refusal, populated and empty source migration rebinds, same-source erasure refusal, validated rows, exact byte/population/value bindings, mismatched-value refusal, stale-measurement reopening, SLO refusal, and no-golden-cage null semantics");`;
          const isolationFixture = `const waterlineCli = fileURLToPath(new URL("./waterline.mjs", import.meta.url));
          const isolationRoot = await mkdtemp(join(tmpdir(), "undercast-waterline-ledger-isolation-"));
          const writeFixtureText = async (path, value) => {
            await mkdir(dirname(path), { recursive: true });
            await writeFile(path, value);
          };
          const writeFixtureJson = (path, value) => writeFixtureText(path, \`${JSON.stringify(value, null, 2)}\\n\`);
          try {
            const fixtureLease = "lease_metric_ledger_failure";
            const fixtureTask = "ap_metric_ledger_failure";
            await Promise.all([
              writeFixtureJson(join(isolationRoot, "data/WATERLINE.json"), config),
              writeFixtureJson(join(isolationRoot, "data/WATERLINE-STATE.json"), emptyWaterlineState()),
              writeFixtureJson(join(isolationRoot, "data/MEDIA-AUDIT.json"), {
                source: { item_set_sha256: "a".repeat(64) },
                items: [{ id: "media-1", scope: "star-trek", status: "verified" }],
              }),
              writeFixtureJson(join(isolationRoot, "data/AUTOPILOT.json"), {
                jobs: [{
                  id: fixtureTask,
                  scope: "star-trek",
                  status: "resolved",
                  source_fingerprint: "b".repeat(64),
                  wall_ids: ["UC-FIXTURE"],
                }],
              }),
              writeFixtureText(join(isolationRoot, "data/journal/autopilot.jsonl"), \`${JSON.stringify({
                op: "lease.claimed",
                task_id: fixtureTask,
                at: "2026-08-02T07:00:00Z",
                scope: "star-trek",
                lease_id: fixtureLease,
                readiness_token: "c".repeat(64),
              })}\\n\`),
              writeFixtureJson(join(isolationRoot, "data/ROADMAP-STATE.json"), { completed: [] }),
              writeFixtureJson(join(isolationRoot, "preservation/SNAPSHOTS.json"), {
                history_guard: { precondition_met: true, status: "offsite-verified" },
              }),
              writeFixtureText(join(isolationRoot, "data/journal/waterline.jsonl"), ""),
              writeFixtureJson(join(isolationRoot, costSource), {
                version: 1,
                observations: [{}],
              }),
              writeFixtureJson(join(isolationRoot, rightsSource), {
                version: 1,
                cases: [],
              }),
              writeFixtureJson(join(isolationRoot, "cycle.json"), {
                version: 1,
                scope_id: "star-trek",
                lease_id: fixtureLease,
                outcome: "completed",
                reviewed_by: "second-desk",
                reviewed_role: "second-desk",
                reviewed_at: "2026-08-02T07:01:00Z",
                note: "Record completed work even while a metric ledger needs repair.",
                evidence: [
                  { type: "workflow-run", value: "fixture-cycle" },
                  { type: "commit", value: "fixture-commit" },
                  { type: "restart-proof", value: "fixture-restart" },
                ],
              }),
              writeFixtureJson(join(isolationRoot, "incident.json"), {
                incident_id: "metric-ledger-malformed",
                status: "open",
                severity: "high",
                at: "2026-08-02T07:02:00Z",
                recorded_by: "fixture-operator",
                recorded_role: "operator",
                note: "Open a stop even though the metric ledger is malformed.",
                evidence: [{ type: "incident", value: "fixture-incident" }],
              }),
              writeFixtureJson(join(isolationRoot, "metrics.json"), {
                metrics: { cost_per_verified_record_usd: 1 },
                reviewed_by: "second-desk",
                reviewed_role: "second-desk",
                reviewed_at: "2026-08-02T07:03:00Z",
                note: "Metric-aware writes must still refuse the malformed ledger.",
                evidence: [{ type: "report", value: "fixture-metrics" }],
              }),
            ]);

            const runCli = (...cliArgs) => spawnSync(
              process.execPath,
              [waterlineCli, ...cliArgs, "--root", isolationRoot],
              { encoding: "utf8" },
            );
            const cycleRun = runCli("record-cycle", "--input", "cycle.json");
            assert.equal(cycleRun.status, 0, \`record-cycle failed: ${cycleRun.stderr}\`);
            const incidentRun = runCli("record-incident", "--input", "incident.json");
            assert.equal(incidentRun.status, 0, \`record-incident failed: ${incidentRun.stderr}\`);

            const metricRun = runCli("record-metrics", "--input", "metrics.json");
            assert.notEqual(metricRun.status, 0);
            assert.match(metricRun.stderr, /cost observations\\.id/);
            const statusRun = runCli("status");
            assert.notEqual(statusRun.status, 0);
            assert.match(statusRun.stderr, /cost observations\\.id/);

            const persisted = JSON.parse(await readFile(join(isolationRoot, "data/WATERLINE-STATE.json"), "utf8"));
            assert.equal(persisted.cycles.length, 1);
            assert.equal(persisted.incidents.length, 1);
            assert.equal(persisted.incidents[0].severity, "high");
            assert.equal(persisted.metric_receipts.length, 0);
          } finally {
            await rm(isolationRoot, { recursive: true, force: true });
          }

          console.log("PASS — normalized source identity, migration/reset custody, non-metric writer isolation during malformed metric ledgers, exact byte/population/value bindings, mismatch refusal, stale-measurement reopening, SLO refusal, and no-golden-cage null semantics");`;
          fixture = replaceOnce(fixture, oldSummary, isolationFixture, 'CLI isolation fixture');
          fs.writeFileSync(fixturePath, fixture);

          const docsPath = 'docs/OPERATIONAL-METRICS.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          const heading = '### Non-metric writer isolation';
          if (docs.includes(heading)) throw new Error('non-metric writer isolation documentation already exists');
          docs += [
            '',
            heading,
            '',
            'Observation-ledger parsing remains mandatory for `status`, `validate`, `gate`, and `record-metrics`. It is not a prerequisite for non-metric receipt writers: `record-cycle`, `record-drill`, `record-accounting`, and `record-incident` load and validate durable waterline state without interpreting cost or rights rows.',
            '',
            'A malformed observation row therefore cannot prevent an operator from opening a high/critical incident stop or from receipting already-completed work. Metric-aware commands continue to fail closed until the ledger is repaired, and non-metric writers cannot alter metric values or metric receipts.',
            '',
          ].join('\n');
          fs.writeFileSync(docsPath, docs);
          NODE

          node --check scripts/waterline.mjs
          node --check scripts/metric-readiness-fixtures.mjs

      - name: Prove non-metric availability and metric-aware refusal
        run: |
          set -euo pipefail
          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/current-status.json

      - name: Author isolation receipt extension and run candidate gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { createHash } = require('crypto');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.reviewed_by = 'chatgpt-second-desk';
          receipt.reviewed_role = 'second-desk';
          receipt.authorization.review_threads = [...new Set([
            ...(receipt.authorization.review_threads || []),
            3698177809,
          ])].sort((a, b) => a - b);
          receipt.authorization.nonmetric_writer_isolation_workflow_head = process.env.GITHUB_SHA;
          receipt.authorization.nonmetric_writer_isolation_workflow_run = Number(process.env.GITHUB_RUN_ID);
          receipt.corrections.nonmetric_writers_do_not_parse_observation_ledgers = true;
          receipt.corrections.record_incident_available_during_metric_ledger_failure = true;
          receipt.corrections.record_cycle_available_during_metric_ledger_failure = true;
          receipt.corrections.metric_aware_commands_still_fail_closed = true;
          receipt.evidence.current_readiness = JSON.parse(fs.readFileSync('/tmp/current-status.json', 'utf8')).evidence_readiness;
          receipt.evidence.files ||= {};
          for (const path of [
            'scripts/waterline.mjs',
            'scripts/metric-readiness-fixtures.mjs',
            'docs/OPERATIONAL-METRICS.md',
          ]) {
            receipt.evidence.files[path] = createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          }
          receipt.evidence.nonmetric_writer_isolation_fixture = 'PASS';
          receipt.nonmetric_writer_isolation_extension = {
            status: 'candidate',
            record_cycle_with_malformed_metric_ledger: true,
            record_incident_with_malformed_metric_ledger: true,
            metric_write_with_malformed_ledger_refused: true,
            metric_status_with_malformed_ledger_refused: true,
            metric_values_unchanged: true,
            candidate_complete_gate_required: true,
            final_complete_gate_required: true,
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          git add \
            scripts/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            docs/OPERATIONAL-METRICS.md \
            "$RECEIPT"
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/nonmetric-isolation-candidate-gate.log

      - name: Retire temporary authority, promote receipt, and gate final tree
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          node - <<'NODE'
          const fs = require('fs');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.nonmetric_writer_isolation_extension.status = 'smoke-passed';
          receipt.nonmetric_writer_isolation_extension.candidate_complete_gate_passed = true;
          receipt.nonmetric_writer_isolation_extension.candidate_rendered_browser_included = true;
          receipt.nonmetric_writer_isolation_extension.final_complete_gate_passed = true;
          receipt.nonmetric_writer_isolation_extension.final_rendered_browser_included = true;
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          git add "$RECEIPT"
          git rm "$SELF"
          git diff --cached --check

          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          npm run gate 2>&1 | tee /tmp/nonmetric-isolation-final-gate.log

      - name: Publish exact clean isolation custody under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"

          printf '%s\n' \
            data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json \
            docs/OPERATIONAL-METRICS.md \
            scripts/metric-readiness-fixtures.mjs \
            scripts/waterline.mjs \
            | sort > /tmp/expected-extension-paths.txt
          git diff --cached --name-only "$AUTHORIZED_CLEAN_HEAD" | sort > /tmp/actual-extension-paths.txt
          diff -u /tmp/expected-extension-paths.txt /tmp/actual-extension-paths.txt

          base="$(git merge-base refs/remotes/origin/main "$AUTHORIZED_CLEAN_HEAD")"
          printf '%s\n' \
            data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json \
            docs/OPERATIONAL-METRICS.md \
            scripts/lib/metric-readiness.mjs \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            scripts/waterline.mjs \
            | sort > /tmp/expected-final-paths.txt
          git diff --cached --name-only "$base" | sort > /tmp/actual-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/actual-final-paths.txt

          git config user.name undercast-operational-reliability
          git config user.email undercast-operational-reliability@users.noreply.github.com
          git commit \
            -m 'Operations: keep incident stops independent of metric ledgers' \
            -m 'isolate non-metric writers while retaining metric-aware fail-closed validation'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"

      - name: Upload isolation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonmetric-writer-ledger-isolation-${{ github.run_id }}
          path: |
            /tmp/current-status.json
            /tmp/nonmetric-isolation-candidate-gate.log
            /tmp/nonmetric-isolation-final-gate.log
            /tmp/expected-start-paths.txt
            /tmp/actual-start-paths.txt
            /tmp/expected-extension-paths.txt
            /tmp/actual-extension-paths.txt
            /tmp/expected-final-paths.txt
            /tmp/actual-final-paths.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
