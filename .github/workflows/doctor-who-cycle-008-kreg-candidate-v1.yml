name: doctor-who-cycle-008-kreg-candidate-v1

on:
  push:
    branches:
      - agent/doctor-who-cycle-008-kreg-candidate-v1
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-candidate-v1.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-candidate-v1.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-008-kreg-candidate-v1-export-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD: .github/doctor-who-cycle-008/kreg-candidate-v1-payload.tar.gz.b64
  PAYLOAD_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
  PAYLOAD_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
  OUT: /tmp/doctor-who-cycle-008-kreg-v1-export

jobs:
  candidate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      ((github.event_name == 'push' && github.ref_name == 'agent/doctor-who-cycle-008-kreg-candidate-v1') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-candidate-v1'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false

      - name: Export exact immutable V1 carrier payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/extracted"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_TEXT_SHA256"
          cp "$PAYLOAD" "$OUT/kreg-candidate-v1-payload.tar.gz.b64"
          base64 --decode "$PAYLOAD" > "$OUT/kreg-candidate-v1-payload.tar.gz"
          test "$(sha256sum "$OUT/kreg-candidate-v1-payload.tar.gz" | awk '{print $1}')" = "$PAYLOAD_GZIP_SHA256"
          PAYLOAD_ARCHIVE="$OUT/kreg-candidate-v1-payload.tar.gz" PAYLOAD_TARGET="$OUT/extracted" python - <<'PY'
          import os,pathlib,tarfile
          archive=pathlib.Path(os.environ['PAYLOAD_ARCHIVE'])
          target=pathlib.Path(os.environ['PAYLOAD_TARGET'])
          expected=['env.sh','manifest.json','materialize.py','runner.sh']
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers(); names=[m.name for m in members]
              if names != expected or len(names) != len(set(names)):
                  raise SystemExit(f'payload member drift: {names!r}')
              for member in members:
                  p=pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts or member.issym() or member.islnk() or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              tf.extractall(target)
          PY
          sha256sum "$OUT"/extracted/* > "$OUT/extracted-sha256.txt"
          printf 'head=%s\nhead_tree=%s\npayload_blob=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$(git rev-parse "HEAD:$PAYLOAD")" \
            > "$OUT/git-identity.txt"

      - name: Upload exact V1 carrier source packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v1-export-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
