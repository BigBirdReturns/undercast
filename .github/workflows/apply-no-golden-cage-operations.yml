name: apply-no-golden-cage-operations

on:
  push:
    branches:
      - agent/operational-reliability-no-golden-cage
    paths:
      - ".github/workflows/apply-no-golden-cage-operations.yml"

permissions:
  contents: write

concurrency:
  group: apply-no-golden-cage-operations
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-reliability-no-golden-cage
  AUTHORIZED_HEAD: ${{ github.sha }}
  SELF: .github/workflows/apply-no-golden-cage-operations.yml
  RECEIPT: data/review/operational-reliability/no-golden-cage-readiness-2026-08-02.json

jobs:
  apply:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Capture the blocking pre-policy state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

          node scripts/waterline.mjs status --scope star-trek --json > /tmp/no-golden-cage-before.json
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/no-golden-cage-before.json', 'utf8'));
          if (before.evidence_readiness.operational_reliability !== false) throw new Error('pre-policy operations state is unexpectedly ready');
          const missing = before.evidence_readiness.missing_metrics;
          if (!missing.includes('cost_per_verified_record_usd') || !missing.includes('rights_response_sla_days')) {
            throw new Error(`pre-policy golden cage is absent: ${JSON.stringify(missing)}`);
          }
          NODE

      - name: Install observation-triggered readiness law
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return text.replace(before, after);
          }

          const configPath = 'data/WATERLINE.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.operations.metric_readiness = {
            build_minutes_p95: { mode: 'required' },
            cost_per_verified_record_usd: {
              mode: 'when-observed',
              observation_source: 'data/operational-reliability/COST-OBSERVATIONS.json',
            },
            source_freshness_p95_days: { mode: 'required' },
            rights_response_sla_days: {
              mode: 'when-observed',
              observation_source: 'data/operational-reliability/RIGHTS-CASES.json',
            },
          };
          config.operations.note = 'Build and source-freshness are required numeric baselines. Cost and rights are observation-triggered: an empty current ledger plus null is explicit nonblocking debt, the first admissible observation immediately reopens measurement, and a measured value without retained observation custody fails closed. Metrics and drills remain evidence inputs to reviewed roadmap receipts; null never means zero.';
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');

          const waterlinePath = 'scripts/waterline.mjs';
          let waterline = fs.readFileSync(waterlinePath, 'utf8');
          waterline = replaceOnce(
            waterline,
            '} from "./lib/waterline.mjs";\n',
            '} from "./lib/waterline.mjs";\nimport {\n  applyMetricReadinessPolicy,\n  metricObservationCountsFromLedgers,\n  validateMetricReadinessConfig,\n} from "./lib/metric-readiness.mjs";\n',
            'metric-readiness import',
          );
          waterline = replaceOnce(
            waterline,
            '  preservation: pathAt("preservation", "preservation/SNAPSHOTS.json"),\n};',
            '  preservation: pathAt("preservation", "preservation/SNAPSHOTS.json"),\n  costLedger: pathAt("cost-ledger", "data/operational-reliability/COST-OBSERVATIONS.json"),\n  rightsLedger: pathAt("rights-ledger", "data/operational-reliability/RIGHTS-CASES.json"),\n};',
            'metric ledger paths',
          );
          waterline = replaceOnce(
            waterline,
            '  const [config, state, mediaAudit, autopilot, autopilotJournalText, roadmapState, preservation, waterlineJournal] = await Promise.all([',
            '  const [config, state, mediaAudit, autopilot, autopilotJournalText, roadmapState, preservation, costLedger, rightsLedger, waterlineJournal] = await Promise.all([',
            'load tuple',
          );
          waterline = replaceOnce(
            waterline,
            '    readJson(paths.preservation),\n    readText(paths.journal),',
            '    readJson(paths.preservation),\n    readJson(paths.costLedger),\n    readJson(paths.rightsLedger),\n    readText(paths.journal),',
            'metric ledger loads',
          );
          waterline = replaceOnce(
            waterline,
            '  validateWaterlineConfig(config);\n  validateWaterlineState(state, config);',
            '  validateWaterlineConfig(config);\n  validateMetricReadinessConfig(config);\n  validateWaterlineState(state, config);',
            'metric config validation',
          );
          waterline = replaceOnce(
            waterline,
            '  return { config, state, mediaAudit, autopilot, autopilotJournal: parseJsonl(autopilotJournalText), roadmapState, preservation, waterlineJournal };',
            '  return {\n    config,\n    state,\n    mediaAudit,\n    autopilot,\n    autopilotJournal: parseJsonl(autopilotJournalText),\n    roadmapState,\n    preservation,\n    metricObservationCounts: metricObservationCountsFromLedgers({ costLedger, rightsLedger }),\n    waterlineJournal,\n  };',
            'load return',
          );
          waterline = replaceOnce(
            waterline,
            'function statusFor(inputs) {\n  return deriveWaterlineStatus({ ...inputs, scopeId: option("scope", "star-trek"), requestedTasks: Number(option("requested", "0")) });\n}',
            'function statusFor(inputs) {\n  const base = deriveWaterlineStatus({ ...inputs, scopeId: option("scope", "star-trek"), requestedTasks: Number(option("requested", "0")) });\n  return applyMetricReadinessPolicy(base, {\n    config: inputs.config,\n    state: inputs.state,\n    observationCounts: inputs.metricObservationCounts,\n  });\n}',
            'status policy',
          );
          waterline = replaceOnce(
            waterline,
            '      console.log(`  gold evidence=${status.evidence_readiness.star_trek_gold_shard}; operations evidence=${status.evidence_readiness.operational_reliability}`);\n      if (status.claim_reasons.length) console.log(`  blockers: ${status.claim_reasons.join(", ")}`);',
            '      console.log(`  gold evidence=${status.evidence_readiness.star_trek_gold_shard}; operations evidence=${status.evidence_readiness.operational_reliability}`);\n      if (status.evidence_readiness.unobserved_nonblocking_metrics.length) console.log(`  observation-triggered debt: ${status.evidence_readiness.unobserved_nonblocking_metrics.join(", ")} (nonblocking until first observation)`);\n      if (status.evidence_readiness.measurement_due_metrics.length) console.log(`  measurements due: ${status.evidence_readiness.measurement_due_metrics.join(", ")}`);\n      if (status.claim_reasons.length) console.log(`  blockers: ${status.claim_reasons.join(", ")}`);',
            'human status output',
          );
          fs.writeFileSync(waterlinePath, waterline);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          for (const key of ['waterline:fixtures', 'operational:fixtures']) {
            const command = 'node scripts/metric-readiness-fixtures.mjs';
            if (!pkg.scripts[key].includes(command)) pkg.scripts[key] += ` && ${command}`;
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const playbookPath = 'docs/ROADMAP-PLAYBOOKS.md';
          let playbook = fs.readFileSync(playbookPath, 'utf8');
          playbook = replaceOnce(
            playbook,
            '1. Define measured source-freshness, build, cost, correction, publication, and rights baselines; retain `null` until observed.',
            '1. Define source-freshness, build, cost, correction, publication, and rights baseline states. Required metrics need numeric measurements; event-dependent metrics retain `null` with a reviewed zero-observation ledger until the first real or controlled observation reopens measurement.',
            'operational build sequence',
          );
          playbook = replaceOnce(
            playbook,
            '- build, cost-per-verified-record, source-freshness, and rights-response baselines measured\n- configured SLO targets pass',
            '- build and source-freshness baselines measured\n- cost and rights baselines either measured from admissible observations or retained as reviewed zero-observation `null` states with automatic reopen on the first observation\n- every measured configured SLO target passes',
            'operational acceptance proof',
          );
          fs.writeFileSync(playbookPath, playbook);

          const metricsDocPath = 'docs/OPERATIONAL-METRICS.md';
          let metricsDoc = fs.readFileSync(metricsDocPath, 'utf8');
          metricsDoc = replaceOnce(
            metricsDoc,
            '## Exact-main discovery\n',
            '## Readiness without a golden cage\n\nBuild time and source freshness are required numeric readiness metrics because their denominators exist whenever the operating system runs. Cost and rights response are observation-triggered. When the current admissible ledger is empty, `null` remains an explicit, reviewed debt state and does not freeze an otherwise smoke-passed milestone. The first admissible ledger row immediately changes the metric to `measurement-due` until a reviewed numeric receipt is recorded. A numeric value whose observation ledger has been erased is a blocking custody regression.\n\nThis rule never converts absence into zero, never waives a measured SLO failure, and never closes the cost or rights debt. It removes only the circular requirement to manufacture an event before the system may prove that it is ready to handle the event.\n\n## Exact-main discovery\n',
            'metric readiness documentation',
          );
          fs.writeFileSync(metricsDocPath, metricsDoc);
          NODE

      - name: Validate focused policy and current estate
        run: |
          set -euo pipefail
          node --check scripts/lib/metric-readiness.mjs
          node --check scripts/metric-readiness-fixtures.mjs
          node --check scripts/waterline.mjs
          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/no-golden-cage-after.json

          node - <<'NODE'
          const fs = require('fs');
          const after = JSON.parse(fs.readFileSync('/tmp/no-golden-cage-after.json', 'utf8'));
          if (after.evidence_readiness.operational_reliability !== true) throw new Error('operational reliability remains trapped');
          if (after.evidence_readiness.missing_metrics.length !== 0) throw new Error(`blocking metric debt remains: ${JSON.stringify(after.evidence_readiness.missing_metrics)}`);
          if (JSON.stringify(after.evidence_readiness.unobserved_nonblocking_metrics) !== JSON.stringify(['cost_per_verified_record_usd','rights_response_sla_days'])) {
            throw new Error(`unobserved denominator state drifted: ${JSON.stringify(after.evidence_readiness.unobserved_nonblocking_metrics)}`);
          }
          if (after.evidence_readiness.metric_states.build_minutes_p95.value !== 1.091267) throw new Error('build receipt drifted');
          if (after.evidence_readiness.metric_states.source_freshness_p95_days.value !== 3.683774) throw new Error('freshness receipt drifted');
          if (after.evidence_readiness.slo_target_failures.length !== 0) throw new Error('measured SLO failure exists');
          NODE

      - name: Write the policy receipt
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RECEIPT")"
          AUTHORIZED_HEAD="$AUTHORIZED_HEAD" RECEIPT="$RECEIPT" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const hash = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const beforeRaw = fs.readFileSync('/tmp/no-golden-cage-before.json');
          const afterRaw = fs.readFileSync('/tmp/no-golden-cage-after.json');
          const before = JSON.parse(beforeRaw);
          const after = JSON.parse(afterRaw);
          const files = [
            'data/WATERLINE.json',
            'data/WATERLINE-STATE.json',
            'data/operational-reliability/COST-OBSERVATIONS.json',
            'data/operational-reliability/RIGHTS-CASES.json',
            'scripts/lib/metric-readiness.mjs',
            'scripts/metric-readiness-fixtures.mjs',
            'scripts/waterline.mjs',
            'docs/OPERATIONAL-METRICS.md',
            'docs/ROADMAP-PLAYBOOKS.md',
          ];
          const receipt = {
            version: 1,
            transaction: 'OPERATIONAL-RELIABILITY-NO-GOLDEN-CAGE-001',
            status: 'candidate-smoke-required',
            generated_at: new Date().toISOString(),
            authorized_parent: process.env.AUTHORIZED_HEAD,
            classification: 'readiness-policy-correction',
            before: {
              operational_reliability: before.evidence_readiness.operational_reliability,
              missing_metrics: before.evidence_readiness.missing_metrics,
              sha256: hash(beforeRaw),
            },
            after: {
              operational_reliability: after.evidence_readiness.operational_reliability,
              missing_metrics: after.evidence_readiness.missing_metrics,
              unobserved_nonblocking_metrics: after.evidence_readiness.unobserved_nonblocking_metrics,
              measurement_due_metrics: after.evidence_readiness.measurement_due_metrics,
              metric_ledger_regressions: after.evidence_readiness.metric_ledger_regressions,
              metric_states: after.evidence_readiness.metric_states,
              slo_target_failures: after.evidence_readiness.slo_target_failures,
              sha256: hash(afterRaw),
            },
            evidence: Object.fromEntries(files.map((file) => [file, hash(fs.readFileSync(file))])),
            mechanism: {
              required_metrics: ['build_minutes_p95','source_freshness_p95_days'],
              observation_triggered_metrics: ['cost_per_verified_record_usd','rights_response_sla_days'],
              empty_ledger_and_null: 'explicit-nonblocking-debt',
              first_observation_and_null: 'blocking-measurement-due',
              measured_value_and_empty_ledger: 'blocking-custody-regression',
              measured_slo_failure: 'blocking',
            },
            boundary: {
              null_converted_to_zero: false,
              cost_debt_closed: false,
              rights_debt_closed: false,
              roadmap_state_mutated: false,
              roadmap_milestone_completed: false,
              canonical_content_mutated: false,
              live_publication_mutated: false,
              complete_gate_required_before_publication: true,
            },
          };
          fs.writeFileSync(process.env.RECEIPT, JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Gate the complete candidate before payment
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add \
            data/WATERLINE.json \
            docs/OPERATIONAL-METRICS.md \
            docs/ROADMAP-PLAYBOOKS.md \
            package.json \
            scripts/waterline.mjs \
            "$RECEIPT"

          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          printf '%s\n' \
            "$SELF" \
            data/WATERLINE.json \
            docs/OPERATIONAL-METRICS.md \
            docs/ROADMAP-PLAYBOOKS.md \
            package.json \
            scripts/waterline.mjs \
            "$RECEIPT" \
            | sort > /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --cached --check

          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee /tmp/no-golden-cage-gate.log

      - name: Promote the smoke-passed receipt and publish under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          diff -u /tmp/expected-paths.txt <(git diff --cached --name-only | sort)

          RECEIPT="$RECEIPT" node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT, 'utf8'));
          if (receipt.status !== 'candidate-smoke-required') throw new Error('receipt promotion precondition drifted');
          receipt.status = 'smoke-passed';
          receipt.smoke = {
            command: 'npm run gate',
            complete_gate_passed: true,
            rendered_browser_included: true,
            log_path: '/tmp/no-golden-cage-gate.log',
          };
          fs.writeFileSync(process.env.RECEIPT, JSON.stringify(receipt, null, 2) + '\n');
          NODE
          git add "$RECEIPT"
          git diff --cached --check

          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'undercast-operational-policy'
          git config user.email 'undercast-operational-policy@users.noreply.github.com'
          git commit \
            -m 'Operations: remove observation-dependent golden cages' \
            -m 'empty cost and rights ledgers remain explicit nonblocking debt' \
            -m 'first admissible observation reopens measurement' \
            -m 'null is never zero' \
            -m "authorized_parent=${AUTHORIZED_HEAD}"
          new_head="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload policy and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-golden-cage-operations-${{ github.run_id }}
          path: |
            /tmp/no-golden-cage-before.json
            /tmp/no-golden-cage-after.json
            /tmp/no-golden-cage-gate.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
