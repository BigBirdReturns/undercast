name: doctor-who-cycle-008-kreg-media-recovery-v3-census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery-v3-census.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery-v3-census-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v3-census.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v3-census
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery-v3-census
  PREFLIGHT_RUN: "31088359558"
  PREFLIGHT_JOB: "92573114327"
  PREFLIGHT_HEAD: e44f5578c31bccd9e9271af12d16171f592870ad
  PREFLIGHT_ARTIFACT_ID: "8962423257"
  PREFLIGHT_ARTIFACT_NAME: doctor-who-cycle-008-preflight-v3-31088359558
  PREFLIGHT_ARTIFACT_SHA256: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
  V2_RUN: "31091319309"
  V2_JOB: "92582753330"
  V2_HEAD: 725a801895a4adc5968b55f63f013b10124017a0
  V2_ARTIFACT_ID: "8963574677"
  V2_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v2-31091319309
  V2_ARTIFACT_SHA256: 503c4a16fac38834c2b1a58234f2efd95e3f44db0c65a545c4d8b28a7ea071c9
  TASK_ID: ap_469d79ea29fd7f877395d20f
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_PAGE_ID: "378943"
  SOURCE_REVISION: "3860984"
  FILE_TITLE: File:Kree.jpg
  FILE_PAGE_ID: "387498"
  FILE_TIMESTAMP: 2026-07-28T09:19:09Z
  UPLOAD_BYTES: "67431"
  UPLOAD_WIDTH: "1053"
  UPLOAD_HEIGHT: "805"
  UPLOAD_SHA1: 319cfa66634da164e2efd998cb85702fb609a83e
  PUBLIC_JPEG_BYTES: "67113"
  PUBLIC_JPEG_SHA1: 650069b8a22e7794b00ae6a2d8d32952e6a72ff2
  PUBLIC_JPEG_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  DEFAULT_WEBP_BYTES: "32034"
  DEFAULT_WEBP_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  GH_TOKEN: ${{ github.token }}

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v3-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v3-census.yml
            data
            images
            scripts

      - name: Bind exact main and one-file read-only census carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/attempts"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Install deterministic route and image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick file >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"
          curl --version | head -1 | tee "$OUT/curl-version.txt"

      - name: Bind exact preflight and V2 public-original mismatch
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "preflight:$PREFLIGHT_RUN:$PREFLIGHT_JOB:$PREFLIGHT_HEAD:$PREFLIGHT_ARTIFACT_ID:$PREFLIGHT_ARTIFACT_NAME:$PREFLIGHT_ARTIFACT_SHA256:success" \
            "v2:$V2_RUN:$V2_JOB:$V2_HEAD:$V2_ARTIFACT_ID:$V2_ARTIFACT_NAME:$V2_ARTIFACT_SHA256:failure"; do
            IFS=: read -r label run job head artifact_id artifact_name artifact_sha conclusion <<< "$spec"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" > "$OUT/${label}-run.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" > "$OUT/${label}-jobs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "$OUT/${label}-artifact.json"
            jq -e --argjson run "$run" --arg head "$head" --arg conclusion "$conclusion" '
              .id==$run and .head_sha==$head and .status=="completed" and .conclusion==$conclusion
            ' "$OUT/${label}-run.json" >/dev/null
            jq -e --argjson job "$job" --arg conclusion "$conclusion" '
              any(.jobs[]; .id==$job and .status=="completed" and .conclusion==$conclusion)
            ' "$OUT/${label}-jobs.json" >/dev/null
            jq -e --argjson id "$artifact_id" --arg name "$artifact_name" --arg digest "sha256:${artifact_sha}" --argjson run "$run" '
              .id==$id and .name==$name and .digest==$digest and .workflow_run.id==$run and .expired==false
            ' "$OUT/${label}-artifact.json" >/dev/null
          done
          jq -e --argjson job "$V2_JOB" '
            any(.jobs[];
              .id==$job and .name=="recover" and
              any(.steps[]; .name=="Recover MediaWiki metadata and an exact original asset" and .conclusion=="failure")
            )
          ' "$OUT/v2-jobs.json" >/dev/null

      - name: Reacquire and bind exact Kreg source and file metadata
        shell: bash
        run: |
          set -euo pipefail
          api='https://tardis.fandom.com/api.php'
          ua='Undercast bounded Kreg media route census/3.0'

          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode titles=Kreg \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H "User-Agent: $ua" \
            > "$OUT/kreg-page-api.json"
          jq -r '.query.pages[0].revisions[0].slots.main.content' "$OUT/kreg-page-api.json" > "$OUT/kreg-page.wikitext"
          test "$(sha256sum "$OUT/kreg-page.wikitext" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"
          test "$(wc -c < "$OUT/kreg-page.wikitext")" -eq 840
          jq -e --argjson pageid "$SOURCE_PAGE_ID" --argjson revision "$SOURCE_REVISION" '
            .query.pages|length==1 and .[0].pageid==$pageid and .[0].title=="Kreg" and
            .[0].revisions|length==1 and .[0].revid==$revision
          ' "$OUT/kreg-page-api.json" >/dev/null
          grep -F '|image             =Kree.jpg' "$OUT/kreg-page.wikitext" >/dev/null
          grep -F '|voice actor       = Dan Starkey' "$OUT/kreg-page.wikitext" >/dev/null

          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=imageinfo \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'iiprop=url|size|mime|sha1|timestamp|mediatype|extmetadata' \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H "User-Agent: $ua" \
            > "$OUT/file-imageinfo-api.json"
          jq -e \
            --arg title "$FILE_TITLE" \
            --argjson pageid "$FILE_PAGE_ID" \
            --arg timestamp "$FILE_TIMESTAMP" \
            --argjson size "$UPLOAD_BYTES" \
            --argjson width "$UPLOAD_WIDTH" \
            --argjson height "$UPLOAD_HEIGHT" \
            --arg sha1 "$UPLOAD_SHA1" '
              .query.pages|length==1 and .[0].title==$title and .[0].pageid==$pageid and
              .[0].imageinfo|length==1 and .[0].timestamp==$timestamp and
              .[0].size==$size and .[0].width==$width and .[0].height==$height and
              .[0].sha1==$sha1 and .[0].mime=="image/jpeg" and .[0].mediatype=="BITMAP"
          ' "$OUT/file-imageinfo-api.json" >/dev/null

      - name: Execute bounded original-byte route and header census
        shell: bash
        run: |
          set -euo pipefail
          ua='Undercast bounded Kreg media route census/3.0'
          advertised="$(jq -r '.query.pages[0].imageinfo[0].url' "$OUT/file-imageinfo-api.json")"
          description="$(jq -r '.query.pages[0].imageinfo[0].descriptionurl' "$OUT/file-imageinfo-api.json")"
          base="${advertised%%\?*}"
          asset="${base%/revision/latest}"
          cb="${advertised#*?}"
          legacy_images="https://images.wikia.nocookie.net/tardis/images/c/c7/Kree.jpg"
          legacy_vignette="https://vignette.wikia.nocookie.net/tardis/images/c/c7/Kree.jpg/revision/latest?${cb}"
          special='https://tardis.fandom.com/wiki/Special:Redirect/file/Kree.jpg'
          special_index='https://tardis.fandom.com/index.php?title=Special:Redirect/file/Kree.jpg'

          printf '%s\t%s\n' \
            advertised "$advertised" \
            advertised_format_original "${advertised}&format=original" \
            advertised_original_download "${advertised}&format=original&download=1" \
            advertised_download_original "${advertised}&download=1&format=original" \
            advertised_original_quality100 "${advertised}&format=original&quality=100" \
            revision_format_original "${base}?format=original" \
            revision_download "${base}?download=1" \
            asset_bare "$asset" \
            asset_format_original "${asset}?format=original" \
            asset_original_download "${asset}?format=original&download=1" \
            special_redirect "$special" \
            special_redirect_download "${special}?download=1" \
            special_index "$special_index" \
            special_index_download "${special_index}&download=1" \
            legacy_images "$legacy_images" \
            legacy_images_original "${legacy_images}?format=original" \
            legacy_images_download "${legacy_images}?format=original&download=1" \
            legacy_vignette "$legacy_vignette" \
            legacy_vignette_original "${legacy_vignette}&format=original" \
            description_page "$description" \
            > "$OUT/routes.tsv"

          : > "$OUT/attempts.jsonl"
          while IFS=$'\t' read -r route_id route_url; do
            for profile in generic jpeg no_transform; do
              key="${route_id}--${profile}"
              body="$OUT/attempts/${key}.bin"
              headers="$OUT/attempts/${key}.headers"
              transfer="$OUT/attempts/${key}.transfer"
              args=(
                -sS -L --max-time 90 --retry 3 --retry-all-errors
                -H "User-Agent: $ua"
                -D "$headers"
                -o "$body"
                -w '%{http_code}\t%{url_effective}\t%{content_type}\n'
              )
              case "$profile" in
                jpeg)
                  args+=( -H 'Accept: image/jpeg,image/*;q=0.9,*/*;q=0.1' )
                  ;;
                no_transform)
                  args+=(
                    -H 'Accept: image/jpeg,image/*;q=0.9,*/*;q=0.1'
                    -H 'Accept-Encoding: identity'
                    -H 'Cache-Control: no-transform, no-cache'
                    -H 'Pragma: no-cache'
                  )
                  ;;
              esac
              if curl -f "${args[@]}" "$route_url" > "$transfer"; then
                success=true
                IFS=$'\t' read -r http_code effective_url reported_type < "$transfer"
                bytes="$(wc -c < "$body")"
                sha1="$(sha1sum "$body" | awk '{print $1}')"
                sha256="$(sha256sum "$body" | awk '{print $1}')"
                md5="$(md5sum "$body" | awk '{print $1}')"
                mime="$(file --brief --mime-type "$body")"
                read -r width height format < <(identify -format '%w %h %m\n' "$body" 2>/dev/null || printf '0 0 UNKNOWN\n')
                etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print}' "$headers" | tail -1)"
                thumbnailer="$(awk 'BEGIN{IGNORECASE=1} /^x-thumbnailer:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print}' "$headers" | tail -1)"
              else
                success=false
                http_code=0
                effective_url=''
                reported_type=''
                bytes=0
                sha1=''
                sha256=''
                md5=''
                mime=''
                width=0
                height=0
                format=UNKNOWN
                etag=''
                thumbnailer=''
                rm -f "$body"
              fi
              jq -nc \
                --arg key "$key" \
                --arg route_id "$route_id" \
                --arg profile "$profile" \
                --arg requested_url "$route_url" \
                --argjson success "$success" \
                --argjson http_code "$http_code" \
                --arg effective_url "$effective_url" \
                --arg reported_type "$reported_type" \
                --argjson bytes "$bytes" \
                --arg sha1 "$sha1" \
                --arg sha256 "$sha256" \
                --arg md5 "$md5" \
                --arg mime "$mime" \
                --argjson width "$width" \
                --argjson height "$height" \
                --arg format "$format" \
                --arg etag "$etag" \
                --arg thumbnailer "$thumbnailer" \
                --argjson upload_bytes "$UPLOAD_BYTES" \
                --arg upload_sha1 "$UPLOAD_SHA1" '
                {
                  key:$key,route_id:$route_id,header_profile:$profile,
                  requested_url:$requested_url,curl_success:$success,http_code:$http_code,
                  effective_url:$effective_url,reported_content_type:$reported_type,
                  bytes:$bytes,sha1:$sha1,sha256:$sha256,md5:$md5,mime:$mime,
                  width:$width,height:$height,format:$format,etag:$etag,thumbnailer:$thumbnailer,
                  exact_upload_identity:($success and $bytes==$upload_bytes and $sha1==$upload_sha1)
                }' >> "$OUT/attempts.jsonl"
            done
          done < "$OUT/routes.tsv"
          jq -s '.' "$OUT/attempts.jsonl" > "$OUT/route-census.json"

          OUT="$OUT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out = process.env.OUT;
          const attempts = JSON.parse(fs.readFileSync(`${out}/route-census.json`, 'utf8'));
          const exact = attempts.filter((row) => row.exact_upload_identity);
          const successfulImages = attempts.filter((row) => row.curl_success && row.width === 1053 && row.height === 805 && ['image/jpeg','image/webp'].includes(row.mime));
          const groups = new Map();
          for (const row of successfulImages) {
            if (!groups.has(row.sha256)) groups.set(row.sha256, []);
            groups.get(row.sha256).push(row);
          }
          const ranked = [...groups.entries()]
            .map(([sha256, rows]) => ({sha256, count: rows.length, bytes: rows[0].bytes, sha1: rows[0].sha1, mime: rows[0].mime, format: rows[0].format, keys: rows.map((row) => row.key).sort()}))
            .sort((a,b) => b.count-a.count || a.sha256.localeCompare(b.sha256));
          const publicJpeg = ranked.find((group) => group.sha256 === process.env.PUBLIC_JPEG_SHA256);
          const defaultWebp = ranked.find((group) => group.sha256 === process.env.DEFAULT_WEBP_SHA256);
          if (!publicJpeg || publicJpeg.bytes !== Number(process.env.PUBLIC_JPEG_BYTES) || publicJpeg.sha1 !== process.env.PUBLIC_JPEG_SHA1 || publicJpeg.mime !== 'image/jpeg') {
            throw new Error('known public original-format JPEG identity was not reproduced');
          }
          if (!defaultWebp || defaultWebp.bytes !== Number(process.env.DEFAULT_WEBP_BYTES) || defaultWebp.mime !== 'image/webp') {
            throw new Error('known default WebP derivative identity was not reproduced');
          }
          if (publicJpeg.count < 3) throw new Error('public original-format JPEG did not converge across at least three route/header combinations');
          const selected = attempts.find((row) => row.sha256 === publicJpeg.sha256);
          const summary = {
            route_count: new Set(attempts.map((row) => row.route_id)).size,
            header_profiles: [...new Set(attempts.map((row) => row.header_profile))].sort(),
            attempt_count: attempts.length,
            successful_attempts: attempts.filter((row) => row.curl_success).length,
            exact_upload_matches: exact.length,
            exact_upload_identity_recovered: exact.length > 0,
            upload_metadata: {bytes:Number(process.env.UPLOAD_BYTES),sha1:process.env.UPLOAD_SHA1,width:1053,height:805},
            public_original_representation: publicJpeg,
            default_derivative: defaultWebp,
            distinct_successful_image_identities: ranked,
            selected_public_original_key: selected.key,
            verdict: exact.length > 0 ? 'exact-upload-identity-recovered' : 'upload-byte-identity-not-publicly-recovered-public-original-representation-stable'
          };
          fs.writeFileSync(`${out}/route-census-summary.json`, `${JSON.stringify(summary, null, 2)}\n`);
          fs.copyFileSync(`${out}/attempts/${selected.key}.bin`, `${out}/kreg-public-original.jpg`);
          fs.copyFileSync(`${out}/attempts/${selected.key}.headers`, `${out}/kreg-public-original.headers`);
          NODE

          test "$(wc -c < "$OUT/kreg-public-original.jpg")" -eq "$PUBLIC_JPEG_BYTES"
          test "$(sha1sum "$OUT/kreg-public-original.jpg" | awk '{print $1}')" = "$PUBLIC_JPEG_SHA1"
          test "$(sha256sum "$OUT/kreg-public-original.jpg" | awk '{print $1}')" = "$PUBLIC_JPEG_SHA256"
          test "$(file --brief --mime-type "$OUT/kreg-public-original.jpg")" = 'image/jpeg'
          identify -verbose "$OUT/kreg-public-original.jpg" > "$OUT/kreg-public-original-identify.txt"

      - name: Recover file-page evidence without requiring unavailable content
        shell: bash
        run: |
          set -euo pipefail
          api='https://tardis.fandom.com/api.php'
          ua='Undercast bounded Kreg media route census/3.0'
          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H "User-Agent: $ua" \
            > "$OUT/file-page-api.json"
          description="$(jq -r '.query.pages[0].imageinfo[0].descriptionurl' "$OUT/file-imageinfo-api.json")"
          curl -fsSL --retry 4 --retry-all-errors "$description" -H "User-Agent: $ua" > "$OUT/file-page.html" || true

          OUT="$OUT" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const imageApi = JSON.parse(fs.readFileSync(`${out}/file-imageinfo-api.json`, 'utf8'));
          const pageApi = JSON.parse(fs.readFileSync(`${out}/file-page-api.json`, 'utf8'));
          const summary = JSON.parse(fs.readFileSync(`${out}/route-census-summary.json`, 'utf8'));
          const imagePage = imageApi.query.pages[0];
          const info = imagePage.imageinfo[0];
          const page = pageApi.query?.pages?.[0] ?? null;
          const revision = page?.revisions?.[0] ?? null;
          const content = revision?.slots?.main?.content;
          const contentAvailable = typeof content === 'string';
          if (contentAvailable) fs.writeFileSync(`${out}/file-page.wikitext`, content);
          const metadata = {
            file_title:imagePage.title,
            pageid:imagePage.pageid,
            image_timestamp:info.timestamp,
            advertised_upload:{bytes:info.size,width:info.width,height:info.height,sha1:info.sha1,mime:info.mime,mediatype:info.mediatype},
            public_original_representation:{bytes:Number(process.env.PUBLIC_JPEG_BYTES),sha1:process.env.PUBLIC_JPEG_SHA1,sha256:process.env.PUBLIC_JPEG_SHA256,mime:'image/jpeg',width:1053,height:805},
            default_derivative:{bytes:Number(process.env.DEFAULT_WEBP_BYTES),sha256:process.env.DEFAULT_WEBP_SHA256,mime:'image/webp'},
            route_census_verdict:summary.verdict,
            exact_upload_identity_recovered:summary.exact_upload_identity_recovered,
            description_url:info.descriptionurl,
            description_short_url:info.descriptionshorturl,
            extmetadata:info.extmetadata,
            file_page:{
              pageid:page?.pageid ?? null,
              revision:revision?.revid ?? null,
              parent_revision:revision?.parentid ?? null,
              timestamp:revision?.timestamp ?? null,
              content_available:contentAvailable,
              content_bytes:contentAvailable ? Buffer.byteLength(content) : null,
              content_sha256:contentAvailable ? crypto.createHash('sha256').update(content).digest('hex') : null
            }
          };
          fs.writeFileSync(`${out}/kreg-media-recovery-metadata.json`, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Refuse duplicate adoption and project exact-still quality
        shell: bash
        run: |
          set -euo pipefail
          find images -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/current-image-sha256.txt"
          if grep -F "${PUBLIC_JPEG_SHA256}  " "$OUT/current-image-sha256.txt"; then
            echo 'Kreg public-original bytes already exist in repository media' >&2
            exit 1
          fi
          grep -R -n -E "(${PUBLIC_JPEG_SHA256}|File:Kree\.jpg|Kree\.jpg)" data > "$OUT/current-adoption-matches.txt" || true
          test ! -s "$OUT/current-adoption-matches.txt"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/current-media-gate.log"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const doc = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const records = Array.isArray(doc) ? doc : (doc.records ?? doc.specimens ?? doc.items);
          if (!Array.isArray(records)) throw new Error('specimen collection shape is unsupported');
          const src = (value) => typeof value === 'string' ? value : value?.src;
          const missing = records.filter((record) => !src(record.still) && !src(record.portrait)).length;
          const current = {total:records.length,fully_unillustrated:missing,ratio:missing/records.length};
          const exactStill = {total:records.length+1,fully_unillustrated:missing,ratio:missing/(records.length+1)};
          const noMedia = {total:records.length+1,fully_unillustrated:missing+1,ratio:(missing+1)/(records.length+1)};
          if (!(exactStill.ratio < current.ratio)) throw new Error('exact-still projection does not improve the quality denominator');
          fs.writeFileSync(`${process.env.OUT}/quality-projection.json`, `${JSON.stringify({current,exact_character_still:exactStill,no_media:noMedia},null,2)}\n`);
          NODE
          test -z "$(git status --porcelain)"

      - name: Record bounded recovery boundary and rebind live main
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' "$OUT/route-census-summary.json")"
          exact="$(jq -r '.exact_upload_identity_recovered' "$OUT/route-census-summary.json")"
          jq -n \
            --arg exact_main "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" \
            --arg file "$FILE_TITLE" \
            --arg verdict "$verdict" \
            --argjson exact_upload_identity_recovered "$exact" \
            --arg public_sha256 "$PUBLIC_JPEG_SHA256" '
            {
              version:3,
              exact_main:$exact_main,
              task_id:$task,
              performer:"Dan Starkey",
              role:"Kreg",
              performance_mode:"voice",
              source_fingerprint:$fingerprint,
              source_file:$file,
              route_census_verdict:$verdict,
              exact_upload_identity_recovered:$exact_upload_identity_recovered,
              public_original_representation_recovered:true,
              public_original_sha256:$public_sha256,
              visual_review_completed:false,
              lease_issued:false,
              queue_mutated:false,
              canonical_record_created:false,
              media_adopted:false,
              waterline_event_written:false,
              cycle_receipt_written:false,
              product_published:false,
              cycle_008_started:false,
              outside_human_dependency:false
            }' > "$OUT/boundary.json"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Seal self-hashed bounded route-census receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="census") | .id' | head -1)"
          test -n "$job_id"
          verdict="$(jq -r '.verdict' "$OUT/route-census-summary.json")"
          exact="$(jq -r '.exact_upload_identity_recovered' "$OUT/route-census-summary.json")"
          attempt_count="$(jq -r '.attempt_count' "$OUT/route-census-summary.json")"
          route_count="$(jq -r '.route_count' "$OUT/route-census-summary.json")"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V3-CENSUS" \
            --arg verdict "$verdict" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --arg task "$TASK_ID" \
            --arg public_sha256 "$PUBLIC_JPEG_SHA256" \
            --argjson exact_upload_identity_recovered "$exact" \
            --argjson route_count "$route_count" \
            --argjson attempt_count "$attempt_count" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            --argjson preflight_run "$PREFLIGHT_RUN" \
            --argjson preflight_artifact "$PREFLIGHT_ARTIFACT_ID" \
            --argjson v2_run "$V2_RUN" \
            --argjson v2_artifact "$V2_ARTIFACT_ID" '
            {
              schema_version:1,
              transaction:$transaction,
              verdict:$verdict,
              exact_main:$main,
              carrier_head:$carrier,
              task_id:$task,
              route_count:$route_count,
              header_profiles:3,
              attempt_count:$attempt_count,
              exact_upload_identity_recovered:$exact_upload_identity_recovered,
              public_original_sha256:$public_sha256,
              run_id:$run,
              job_id:$job,
              preflight:{run_id:$preflight_run,artifact_id:$preflight_artifact},
              paid_v2:{run_id:$v2_run,artifact_id:$v2_artifact,reason:"format=original recovered a stable full-dimension JPEG but not the MediaWiki upload byte identity"},
              checks:{
                exact_source_reacquired:true,
                upload_metadata_pinned:true,
                bounded_route_header_matrix_completed:true,
                public_original_representation_converged:true,
                default_webp_derivative_reproduced:true,
                duplicate_adoption_refused:true,
                quality_paths_projected:true,
                live_main_rebound:true
              },
              boundary:{
                repository_written:false,
                visual_adjudication_completed:false,
                lease_issued:false,
                queue_mutated:false,
                media_adopted:false,
                cycle_receipt_written:false,
                product_published:false,
                outside_human_dependency:false
              }
            }' > "$OUT/recovery-receipt.json"
          sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}' > "$OUT/recovery-receipt.sha256"
          test "$(sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}')" = "$(cat "$OUT/recovery-receipt.sha256")"

      - name: Upload exact Kreg bounded route-census packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-v3-census-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
