name: RD-W03 final independent integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/rd-wave03-final-integration.yml
      - tmp/rd-wave03-final-integration.sh

permissions:
  contents: read

concurrency:
  group: rd-wave03-final-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha }}
      QUALIFICATION_PARENT: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Run exact 45-path integration and complete release gate
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/rd-wave03-final-integration"
          export EVIDENCE
          unset GH_TOKEN GITHUB_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true
          git remote set-url origin https://github.com/BigBirdReturns/undercast.git
          bash tmp/rd-wave03-final-integration.sh

      - name: Upload final integration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-final-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-final-integration
          if-no-files-found: error
          retention-days: 30
