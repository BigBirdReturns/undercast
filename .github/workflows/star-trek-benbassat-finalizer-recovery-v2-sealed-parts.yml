  RECEIPT_PATH: data/review/adapter-sdk/star-trek-benbassat-cycle.json
  CHECKER_PATH: scripts/star-trek-benbassat-cycle.mjs
  CARRIER_PARTS_ROOT: .github/recovery/star-trek-benbassat-finalizer-recovery-v2
  CARRIER_SHA256: b3225741d0fe90dc3209ca09fcefe0b2c1ba6f2b69b15135e3418a1be921a4cb
  PACKAGE_UNPACK: /tmp/star-trek-benbassat-finalizer-recovery-v2-package
  PACKAGE_ROOT: /tmp/star-trek-benbassat-finalizer-recovery-v2-package/star-trek-benbassat-finalizer-recovery-v2

jobs:
  finalize:
    name: finalize-reviewed-benbassat-from-sealed-parts-v2
    if: ${{ github.event.head_commit.message == 'Finalize reviewed Star Trek Benbassat cycle v2 from sealed parts' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct, verify, and execute the sealed finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PACKAGE_UNPACK"
          mkdir -p "$PACKAGE_UNPACK"
          cat \
            "$CARRIER_PARTS_ROOT/carrier.part01" \
            "$CARRIER_PARTS_ROOT/carrier.part02" \
            "$CARRIER_PARTS_ROOT/carrier.part03" \
            "$CARRIER_PARTS_ROOT/carrier.part04" \
            "$CARRIER_PARTS_ROOT/carrier.part05" \
            "$CARRIER_PARTS_ROOT/carrier.part06" \
            | tr -d '\r\n' > /tmp/star-trek-benbassat-finalizer-v2.b64
          base64 --decode /tmp/star-trek-benbassat-finalizer-v2.b64 > /tmp/star-trek-benbassat-finalizer-v2.zip
          test "$(sha256sum /tmp/star-trek-benbassat-finalizer-v2.zip | awk '{print $1}')" = "$CARRIER_SHA256"
          unzip -q /tmp/star-trek-benbassat-finalizer-v2.zip -d "$PACKAGE_UNPACK"
          test -d "$PACKAGE_ROOT"
          (
            cd "$PACKAGE_ROOT"
            sha256sum -c manifest.sha256
          )
          bash "$PACKAGE_ROOT/run-finalizer.sh"
