name: cycle012-senstarg-preexecution-cleanup-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/cycle012-senstarg-preexecution-cleanup-v1.yml"]

permissions: {}
concurrency:
  group: cycle012-senstarg-preexecution-cleanup-v1
  cancel-in-progress: false

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-senstarg-preexecution-cleanup-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      TREE: 33b1ff1ea4f191ee42ce09afc9a88a01c7006e71
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      SELF_BRANCH: observer/cycle012-senstarg-preexecution-cleanup-v1
      SELF_PATH: .github/workflows/cycle012-senstarg-preexecution-cleanup-v1.yml
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      CANDIDATE_BRANCH: agent/doctor-who-cycle-012-senstarg-candidate-v1
      CANDIDATE_HEAD: 0598d2e128b395b924a5fe8d8a5540270bcf75b9
      DERIVATION_PR: "934"
      DERIVATION_BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-derivation-v1
      DERIVATION_HEAD: 86a4184fbb95d1302e9444bf37ba99adbaa7c967
      DERIVATION_RUN: "31476730537"
      DERIVATION_ARTIFACT: "9095521701"
      DERIVATION_ZIP_SHA: 9d82ec7624d55046aa4068bf3a8b18d89984abd831bc90c9865343f1bf97fa32
      DERIVATION_ID: 776cc1081f65b1f7eb6296d51195224a8c431af8a0844dc416655d531b7fded7
      REVIEW_PR: "942"
      REVIEW_BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-review-v1
      REVIEW_HEAD: 89271f4fce487fb4b9b5a521b2ff8bc962e28df4
      REVIEW_RUN: "31483158706"
      REVIEW_ARTIFACT: "9098020937"
      REVIEW_ZIP_SHA: b1185298ae89651f2cf4a78e5a92dd3fb9a010047f9d0449d0f76c3f548338be
      REVIEW_ID: 767a7f94df8537d7407d210ba1748f18ca5516ca610e2af8a8af49f4e2aaeff6
      TARGET_SHA: 715e853a7cecc300066460504e79c428810fc4f6d359fdd8fe0e1b0f2a4ba232
      GZIP_SHA: 4e8642176fb6a07aa1195b0f9b784bcad64c3720a2a8e1dac4531f87aeed1a1b
      PATCH_SHA: 7c2726dd1daea000799977183101671b9bc7cd1c6c41979e4293b2941b68297a
      OUT: /tmp/cycle012-senstarg-preexecution-cleanup-v1
    steps:
      - name: Authenticate exact packets and retire consumed refs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{derivation,review,payload}
          python3 - <<'PY'
          import gzip,hashlib,json,os,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          E=os.environ; root=Path(E['OUT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          def api(path,method=None,fields=None,binary=False):
              cmd=['gh','api']
              if method: cmd += ['-X',method]
              cmd += [f'/repos/{E["GITHUB_REPOSITORY"]}{path}']
              for k,v in (fields or {}).items(): cmd += ['-f',f'{k}={v}']
              data=subprocess.check_output(cmd)
              return data if binary else (json.loads(data) if data else None)
          main=api('/git/ref/heads/main'); commit=api('/git/commits/'+E['MAIN'])
          pr=api('/pulls/'+E['PR']); compare=api('/compare/'+E['MAIN']+'...'+E['HEAD'])
          refs=api('/git/matching-refs/heads/'+E['AGENT_PREFIX'])
          expected={E['CANDIDATE_BRANCH']:E['CANDIDATE_HEAD'],E['DERIVATION_BRANCH']:E['DERIVATION_HEAD'],E['REVIEW_BRANCH']:E['REVIEW_HEAD']}
          observed={x['ref'].removeprefix('refs/heads/'):x['object']['sha'] for x in refs}
          assert main['object']['sha']==E['MAIN'] and commit['tree']['sha']==E['TREE']
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['ref']==E['SELF_BRANCH'] and pr['head']['sha']==E['HEAD'] and pr['base']['sha']==E['MAIN']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert [(x['filename'],x['status']) for x in compare['files']]==[(E['SELF_PATH'],'added')]
          assert observed==expected
          dpr=api('/pulls/'+E['DERIVATION_PR']); rpr=api('/pulls/'+E['REVIEW_PR'])
          assert dpr['state']=='closed' and dpr['merged'] is False and dpr['head']['sha']==E['DERIVATION_HEAD']
          assert rpr['state']=='open' and rpr['draft'] is True and rpr['merged'] is False and rpr['head']['sha']==E['REVIEW_HEAD']
          drun=api('/actions/runs/'+E['DERIVATION_RUN']); rrun=api('/actions/runs/'+E['REVIEW_RUN'])
          assert drun['status']=='completed' and drun['conclusion']=='success' and drun['head_sha']==E['DERIVATION_HEAD']
          assert rrun['status']=='completed' and rrun['conclusion']=='success' and rrun['head_sha']==E['REVIEW_HEAD']
          da=api('/actions/artifacts/'+E['DERIVATION_ARTIFACT']); ra=api('/actions/artifacts/'+E['REVIEW_ARTIFACT'])
          assert da['expired'] is False and da['digest']=='sha256:'+E['DERIVATION_ZIP_SHA']
          assert ra['expired'] is False and ra['digest']=='sha256:'+E['REVIEW_ZIP_SHA']
          for name,aid,zsha in [('derivation',E['DERIVATION_ARTIFACT'],E['DERIVATION_ZIP_SHA']),('review',E['REVIEW_ARTIFACT'],E['REVIEW_ZIP_SHA'])]:
              data=api('/actions/artifacts/'+aid+'/zip',binary=True); assert sha(data)==zsha
              zpath=root/f'{name}.zip'; zpath.write_bytes(data); dest=root/name
              with zipfile.ZipFile(zpath) as z:
                  infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
                  assert all(not PurePosixPath(x.filename).is_absolute() and '..' not in PurePosixPath(x.filename).parts for x in infos)
                  z.extractall(dest)
          def verify(dest):
              for ledger in dest.rglob('SHA256SUMS.pre'):
                  final=ledger.parent/'SHA256SUMS'; assert final.is_file() and final.read_text().split()[0]==sha(ledger.read_bytes())
                  for line in ledger.read_text().splitlines():
                      if not line.strip(): continue
                      digest,rel=line.split(None,1); p=ledger.parent/rel.strip().lstrip('*').removeprefix('./')
                      assert p.is_file() and sha(p.read_bytes())==digest
          verify(root/'derivation'); verify(root/'review')
          files=[p for p in (root/'derivation').rglob('*') if p.is_file()]
          def exact(digest):
              rows=[p for p in files if sha(p.read_bytes())==digest]; assert len(rows)==1,(digest,[str(p) for p in rows]); return rows[0]
          target=exact(E['TARGET_SHA']); packed=exact(E['GZIP_SHA']); exact(E['PATCH_SHA']); assert gzip.decompress(packed.read_bytes())==target.read_bytes()
          drows=[]
          for p in (root/'derivation').rglob('*.json'):
              try:v=json.loads(p.read_text())
              except Exception:continue
              if isinstance(v,dict) and v.get('identity')==E['DERIVATION_ID']: drows.append(v)
          assert len(drows)==1
          rjson=root/'review'/'review.json'; rmarker=root/'review'/'REVIEW_COMPLETE'; assert rjson.is_file() and rmarker.read_text().strip()==E['REVIEW_ID']
          review=json.loads(rjson.read_text()); body=dict(review); identity=body.pop('identity')
          assert identity==E['REVIEW_ID']==sha(json.dumps(body,sort_keys=True,separators=(',',':')).encode())
          assert review['boundary']['materializer_executed'] is False and review['boundary']['canonical_mutation'] is False
          api('/pulls/'+E['REVIEW_PR'],method='PATCH',fields={'state':'closed'})
          for branch,head in expected.items():
              current=api('/git/ref/heads/'+branch); assert current['object']['sha']==head
              api('/git/refs/heads/'+branch,method='DELETE')
          post=api('/git/matching-refs/heads/'+E['AGENT_PREFIX'])
          assert post==[]
          receipt={'status':'cycle-012-senstarg-preexecution-transport-cleanup-complete-v1','version':1,
            'canonical':{'main':E['MAIN'],'tree':E['TREE']},
            'derivation':{'pr':int(E['DERIVATION_PR']),'branch':E['DERIVATION_BRANCH'],'head':E['DERIVATION_HEAD'],'run':int(E['DERIVATION_RUN']),'artifact':int(E['DERIVATION_ARTIFACT']),'artifact_sha256':E['DERIVATION_ZIP_SHA'],'identity':E['DERIVATION_ID']},
            'review':{'pr':int(E['REVIEW_PR']),'branch':E['REVIEW_BRANCH'],'head':E['REVIEW_HEAD'],'run':int(E['REVIEW_RUN']),'artifact':int(E['REVIEW_ARTIFACT']),'artifact_sha256':E['REVIEW_ZIP_SHA'],'identity':E['REVIEW_ID']},
            'retired':[{'branch':k,'head':v} for k,v in sorted(expected.items())],
            'postcondition':{'agent_prefix_count':0,'main_unchanged':True},
            'boundary':{'transport_only':True,'materializer_executed':False,'lease_issued':False,'queue_mutated':False,'wall_created':False,'media_adopted':False,'candidate_constructed':False,'cycle_receipt_written':False,'product_constructed':False,'canonical_mutation':False,'cycle_012_product_authority':False,'cycle_013_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          payload=root/'payload'; (payload/'cleanup.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); (payload/'CLEANUP_COMPLETE').write_text(receipt['identity']+'\n')
          rows=[f"{sha(p.read_bytes())}  {p.name}" for p in sorted(payload.iterdir()) if p.is_file() and p.name not in {'SHA256SUMS.pre','SHA256SUMS'}]
          (payload/'SHA256SUMS.pre').write_text('\n'.join(rows)+'\n'); (payload/'SHA256SUMS').write_text(sha((payload/'SHA256SUMS.pre').read_bytes())+'  SHA256SUMS.pre\n')
          PY
          (cd "$OUT/payload" && sha256sum -c SHA256SUMS.pre && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-senstarg-preexecution-cleanup-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-senstarg-preexecution-cleanup-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-senstarg-preexecution-cleanup-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-senstarg-preexecution-cleanup-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire:
    needs: retain
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      BRANCH: observer/cycle012-senstarg-preexecution-cleanup-v1
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Retire cleanup carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$HEAD"
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/pulls/$PR" -f state=closed > /tmp/pr.json
          test "$(jq -r '.state' /tmp/pr.json)" = closed
          test "$(jq -r '.merged' /tmp/pr.json)" = false
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
