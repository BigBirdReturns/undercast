name: card-backfill-uc-007

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-007.json"
      - ".github/workflows/card-backfill-uc-007.yml"
      - "scripts/card-backfill-uc-007.mjs"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-007-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-uc-007'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-uc-007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          (magick -version 2>/dev/null || convert -version) | head -n 2
      - name: Verify bounded card-lane scope
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-007.json','utf8'));
          if(row.lane!=='card-backfill'||row.record_id!=='UC-007'||row.side!=='still')throw new Error('UC-007 card-lane scope drift');
          if(JSON.stringify(row.expected_subjects)!==JSON.stringify(['The Faun','The Pale Man']))throw new Error('UC-007 dual-subject contract drift');
          console.log('PASS — bounded UC-007 candidate-only lane');
          NODE
      - name: Acquire exact source bytes, compose, hash and duplicate-scan
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/uc-007-card-backfill
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-007.mjs 2>&1 | tee "$RUNNER_TEMP/uc-007-card-backfill.log"
      - name: Upload exact evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: uc-007-card-backfill-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/uc-007-card-backfill
            ${{ runner.temp }}/uc-007-card-backfill.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
