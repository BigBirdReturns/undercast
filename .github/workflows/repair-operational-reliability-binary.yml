name: repair-operational-reliability-binary

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-operational-reliability-binary.yml"
      - ".ci/patch-operational-reliability-binary.py"

permissions:
  contents: write

concurrency:
  group: repair-operational-reliability-binary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Apply the exact binary recovery repair
        shell: bash
        run: |
          set -euo pipefail
          authorized_head="${{ github.event.pull_request.head.sha }}"
          target_branch="${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse HEAD)" = "$authorized_head"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:scripts/operational-reliability.mjs)" = "b3e6fba443fd69b2d9138de44cb7610476c12f38"
          test "$(git rev-parse HEAD:scripts/operational-reliability-fixtures.mjs)" = "310550190a0f23b56eb49b42bfbbd72a5edca58e"
          python3 -m py_compile .ci/patch-operational-reliability-binary.py
          python3 .ci/patch-operational-reliability-binary.py
          node --check scripts/operational-reliability.mjs
          node --check scripts/operational-reliability-fixtures.mjs
          ! grep -Fq 'unsupported by the text patch transport' scripts/operational-reliability.mjs
          grep -Fq 'binary_patch_transport: true' scripts/operational-reliability.mjs
          grep -Fq 'binary patch round-trip' scripts/operational-reliability-fixtures.mjs
          git diff --check -- scripts/operational-reliability.mjs scripts/operational-reliability-fixtures.mjs

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run focused and complete qualification
        shell: bash
        run: |
          set -euo pipefail
          npm run operational:fixtures 2>&1 | tee /tmp/operational-binary-focused.log
          npm run gate 2>&1 | tee /tmp/operational-binary-gate.log
          grep -Fq 'binary patch round-trip' /tmp/operational-binary-focused.log

      - name: Publish only the two permanent repair paths
        shell: bash
        run: |
          set -euo pipefail
          authorized_head="${{ github.event.pull_request.head.sha }}"
          target_branch="${{ github.event.pull_request.head.ref }}"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git add -- scripts/operational-reliability.mjs scripts/operational-reliability-fixtures.mjs
          printf '%s\n' \
            scripts/operational-reliability-fixtures.mjs \
            scripts/operational-reliability.mjs \
            | sort > /tmp/expected-repair-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-repair-paths.txt
          diff -u /tmp/expected-repair-paths.txt /tmp/actual-repair-paths.txt
          git diff --cached --check
          git commit \
            -m 'Operations: recover hash-bound binary paths from preservation snapshots' \
            -m 'use the existing binary Git patch transport and receipt exact binary-path custody' \
            -m 'prove a binary image round-trip before complete repository qualification'
          product_head="$(git rev-parse HEAD)"
          printf '%s\n' "$product_head" > /tmp/operational-binary-product-head.txt
          git fetch --no-tags --depth=64 origin "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          test "$(git rev-parse refs/remotes/origin/${target_branch})" = "$authorized_head"
          git push origin "HEAD:refs/heads/${target_branch}" \
            --force-with-lease="refs/heads/${target_branch}:${authorized_head}"

      - name: Upload exact qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-binary-recovery-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/operational-binary-focused.log
            /tmp/operational-binary-gate.log
            /tmp/expected-repair-paths.txt
            /tmp/actual-repair-paths.txt
            /tmp/operational-binary-product-head.txt
