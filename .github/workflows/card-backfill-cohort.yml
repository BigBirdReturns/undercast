name: card-backfill-cohort-retired

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Historical inspection only; production uses card-backfill-source-v3-wave-autonomous'
        required: false
        default: 'manual historical inspection'

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the retired cohort boundary
        run: |
          echo 'The branch-writing and pull-request-triggered cohort workflow is retired.'
          echo 'Production path: .github/workflows/card-backfill-source-v2-autonomous.yml'
          echo 'Execution model: immutable parallel wave artifacts plus one exact-head reducer.'
          echo 'Earlier cohort logic remains in repository history and reusable scripts.'
          echo 'manual_continue_required=false'
          echo 'canonical_mutation=false'
