name: card-backfill-cohort

on:
  pull_request:
    paths:
      - '.github/CARD-BACKFILL-COHORT.json'
      - '.github/card-backfill/serial-retirement/**'
      - '.github/workflows/card-backfill-cohort.yml'
      - 'docs/CARD-BACKFILL-COHORTS.md'
      - 'scripts/card-backfill-cohort*.mjs'
      - 'scripts/lib/card-backfill-*.mjs'
      - 'scripts/lib/media-search.mjs'
      - 'scripts/media-search-prepare.mjs'
      - 'scripts/media-search-restore.mjs'
      - 'scripts/media-search-fixtures.mjs'
      - 'data/MEDIA-AUDIT.json'
      - 'data/specimens.json'
      - 'data/SOURCES.json'
      - 'data/review/card-backfill/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Shape-equivalent obligations to select (20-50)'
        required: false
        default: '40'
      cohort_key:
        description: 'Optional exact ready cohort key; blank selects the largest ready cohort'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: card-backfill-cohort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      selected_count: ${{ steps.matrix.outputs.selected_count }}
      batch_sha256: ${{ steps.matrix.outputs.batch_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install deterministic image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Prove the reusable cohort machinery before touching the network
        run: npm run media:search:fixtures

      - name: Freeze, classify, scope, and shard the complete selector estate
        env:
          LIMIT: ${{ inputs.limit || '40' }}
          COHORT_KEY: ${{ inputs.cohort_key || '' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/card-backfill/cohort"
          mkdir -p "$out"
          args=(plan --control .github/CARD-BACKFILL-COHORT.json --out "$out" --limit "$LIMIT")
          if [ -n "$COHORT_KEY" ]; then args+=(--cohort-key "$COHORT_KEY"); fi
          node scripts/card-backfill-cohort.mjs "${args[@]}" | tee "$out/plan.log"

      - name: Export the exact retrieval matrix
        id: matrix
        run: |
          file="$RUNNER_TEMP/card-backfill/cohort/shards.json"
          matrix=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(JSON.stringify(p.matrix))" "$file")
          selected=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(p.selected_count))" "$RUNNER_TEMP/card-backfill/cohort/batch.json")
          batch=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(p.batch_sha256)" "$RUNNER_TEMP/card-backfill/cohort/batch.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected_count=$selected" >> "$GITHUB_OUTPUT"
          echo "batch_sha256=$batch" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-cohort-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill/cohort
          if-no-files-found: error
          retention-days: 90

  discover:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-cohort-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - name: Discover only the exact shard facets in an isolated worktree
        env:
          SHARD_ID: ${{ matrix.id }}
          SHARD_COUNT: ${{ matrix.count }}
          PLAN_PATH: ${{ matrix.plan_path }}
          CRAWL_DELAY_MS: '1500'
          CONTACT: 'bigbirdreturns@proton.me'
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/shard-$SHARD_ID"
          work="$root/worktree"
          output="$root/output"
          mkdir -p "$output"
          cleanup() { git worktree remove --force "$work" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git worktree add --detach "$work" HEAD
          cp "$RUNNER_TEMP/planning/$PLAN_PATH" "$work/retrieval-plan.json"
          cd "$work"
          node scripts/media-search-prepare.mjs \
            --plan retrieval-plan.json \
            --ids-out retrieval-ids.txt \
            --mask-unselected \
            --restore-out retrieval-restore.json \
            | tee "$output/prepare.log"
          ids=$(cat retrieval-ids.txt)
          if [ -n "$ids" ]; then
            RETRIEVE_ONLY="$ids" \
            RETRIEVE_MAX="$SHARD_COUNT" \
            IMAGE_MODE=loose \
            CRAWL_DELAY_MS="$CRAWL_DELAY_MS" \
            CONTACT="$CONTACT" \
            node scripts/retrieve.mjs | tee "$output/retrieve.log"
          fi
          node scripts/media-search-restore.mjs --receipt retrieval-restore.json | tee "$output/restore.log"
          cd "$GITHUB_WORKSPACE"
          node scripts/media-search-report.mjs \
            --baseline "$GITHUB_WORKSPACE" \
            --candidate "$work" \
            --plan "$RUNNER_TEMP/planning/$PLAN_PATH" \
            --out "$output/candidates" \
            --journal "$output/media-search.jsonl" \
            --latest "$output/latest.json" \
            --run-id "${GITHUB_RUN_ID}-shard-${SHARD_ID}" \
            | tee "$output/report.log"
          cp "$RUNNER_TEMP/planning/$PLAN_PATH" "$output/retrieval-plan.json"
          cp "$work/retrieval-restore.json" "$output/retrieval-restore.json"

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-shard-${{ matrix.id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/shard-${{ matrix.id }}/output
          if-no-files-found: error
          retention-days: 90

  assemble:
    needs: [plan, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install deterministic image and browser tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-cohort-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-shard-*-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
          merge-multiple: false

      - name: Merge shard results in frozen batch order
        run: |
          mkdir -p "$RUNNER_TEMP/final"
          node scripts/card-backfill-cohort-merge.mjs \
            --batch "$RUNNER_TEMP/planning/batch.json" \
            --shards-root "$RUNNER_TEMP/shards" \
            --out "$RUNNER_TEMP/final/candidates" \
            --run-id "$GITHUB_RUN_ID" \
            | tee "$RUNNER_TEMP/final/merge.log"

      - name: Build per-card receipts and deterministic batch renders
        run: |
          node scripts/card-backfill-cohort-packetize.mjs \
            --baseline "$GITHUB_WORKSPACE" \
            --candidates "$RUNNER_TEMP/final/candidates" \
            --report "$RUNNER_TEMP/final/candidates/report.json" \
            --batch "$RUNNER_TEMP/planning/batch.json" \
            --scopes "$RUNNER_TEMP/planning/batch-scopes" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$RUNNER_TEMP/final/packets" \
            --magick magick \
            | tee "$RUNNER_TEMP/final/packetize.log"

      - name: Verify exact batch custody before the repository gate
        env:
          EXPECTED_COUNT: ${{ needs.plan.outputs.selected_count }}
          EXPECTED_BATCH: ${{ needs.plan.outputs.batch_sha256 }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root=process.env.RUNNER_TEMP+'/final/packets';
          const result=JSON.parse(fs.readFileSync(path.join(root,'batch-result.json'),'utf8'));
          if(result.selected_count!==Number(process.env.EXPECTED_COUNT))throw new Error('selected count drift');
          if(result.batch_sha256!==process.env.EXPECTED_BATCH)throw new Error('batch digest drift');
          if(result.canonical_mutation!==false)throw new Error('canonical mutation drift');
          if(result.results.length!==result.selected_count)throw new Error('result cardinality drift');
          for(const row of result.results){
            const dir=path.join(root,row.packet_path);
            for(const file of ['scope.json','source-receipt.json','review.json','review.md','manifest.json','checksums.sha256'])if(!fs.existsSync(path.join(dir,file)))throw new Error(`missing ${row.record_id}/${file}`);
            const review=JSON.parse(fs.readFileSync(path.join(dir,'review.json'),'utf8'));
            if(review.canonical_mutation!==false||review.batch_sha256!==result.batch_sha256)throw new Error(`packet custody drift ${row.record_id}`);
          }
          console.log(`PASS — ${result.results.length} per-card packets retain one batch digest and no canonical mutation`);
          NODE

      - name: Run the complete repository gate once for the cohort
        run: npm run gate | tee "$RUNNER_TEMP/final/gate.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-cohort-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/planning
            ${{ runner.temp }}/final
          if-no-files-found: warn
          retention-days: 90
