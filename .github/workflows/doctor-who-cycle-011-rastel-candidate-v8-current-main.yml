name: doctor-who-cycle-011-rastel-candidate-v8-current-main

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v8-current-main.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v8-current-main
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v8-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v8-current-main
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-v8-current-main.yml
      TRANSPORT: /tmp/doctor-who-cycle-011-rastel-candidate-v8-transport
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-v8
      V7_PR: "762"
      V7_HEAD: 6712dcc95dc8943c25b5750620ba6edcc787958a
      V7_RUN: "31332533595"
      V7_JOB: "93292949027"
      V7_ARTIFACT: "9043341021"
      V7_ARTIFACT_DIGEST: sha256:432c72dd56e06e30d63ac9f487d3227630455c8d5aa63e2d34ebf6decb077cf9
      V7_ARTIFACT_FILES: "11"
      V7_LAUNCHER_BYTES: "17964"
      V7_LAUNCHER_SHA256: 28cfdb7a5b7015e1bf86e059f3c88fd00a31a060929ce934dba4faf8d9671d1a
      LAUNCHER_BLOBS: "30fb5640ed17bb187d0461976fb768ffc9b83210 f18061c1e811d309f9ab1902367c1f542274ef56 e600a00951c7bc0dd5162b38ec717801077140e0 6bd1bf03f12e34ffa33f291ad316c33c0f82e657 45ffd933afa3f55fac48dbbcfe15765f4749ec12 a7f9011d33c3d201b4970cbc1566c5b2d05d4d8a 4287f2f25717649458db4ee5e312618634a2b95c"
      LAUNCHER_CHUNK_BYTES: "800 800 800 2400 800 800 396"
      LAUNCHER_CHUNK_SHA256: "07d8a1390359f3dda47eb8daab9f2b8d2d45c9071a35619da7c2a3ee4d751d20 a6f9e07a66e19c8b1d3d78645d0e50acd7422910c870522bb8e4fa2992cc15f3 d252df6ab43be55d19fbb665b9537ee67f9db7c5a636b0538fd0b02696dc4769 e7d4f0c57c638feb4fc92622d5b7cd53e66303523c939ddf949fa87fa0193ed4 e016e2c96ef3d3ca1fc28bc60158cb4e2ef176773055e4a18963914a03cdd421 6a078f0ab9853c833689bfe3339967c5e963c0055229f16520178b7dd5dd8e6c e6b075f9d9abad03178b68ec5e0acca77b012e79087d58c1f8ed6c2d9d554e02"
      LAUNCHER_B64_BYTES: "6796"
      LAUNCHER_B64_SHA256: ca3492f2d91641811a81c455c19199937c51b6c6742ecbb227cb8c2f0efafbfb
      LAUNCHER_GZIP_BYTES: "5095"
      LAUNCHER_GZIP_SHA256: 0294b62615a0e35631f161e9d6d1560328e1c67eb7f959177509352f9e038900
      LAUNCHER_BYTES: "17966"
      LAUNCHER_SHA256: 605722cb8a2a090750d35a0fb2092d74452157aafa60e68c7887216c1346a075

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V7 launcher failure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRANSPORT" "$OUT"
          mkdir -p "$TRANSPORT"/{api,v7}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$TRANSPORT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V7_PR" > "$TRANSPORT/api/v7-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V7_RUN" > "$TRANSPORT/api/v7-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V7_RUN/jobs?per_page=100" > "$TRANSPORT/api/v7-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT" > "$TRANSPORT/api/v7-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT/zip" > "$TRANSPORT/v7.zip"
          test "$(sha256sum "$TRANSPORT/v7.zip" | awk '{print $1}')" = "${V7_ARTIFACT_DIGEST#sha256:}"
          ROOT="$TRANSPORT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); api=root/'api'; target=root/'v7'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          load=lambda name:json.loads((api/name).read_text())
          own=load('carrier.json'); v7=load('v7-pr.json'); run=load('v7-run.json'); jobs=load('v7-jobs.json')['jobs']; artifact=load('v7-artifact.json')
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v7['number']==int(os.environ['V7_PR']) and v7['state']=='open' and v7['draft'] is True and v7['merged'] is False
          assert v7['base']['sha']==os.environ['MAIN'] and v7['head']['sha']==os.environ['V7_HEAD'] and v7['head']['ref']=='agent/doctor-who-cycle-011-rastel-candidate-v7-current-main'
          assert run['id']==int(os.environ['V7_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-v7-current-main'
          assert run['head_sha']==os.environ['V7_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['V7_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Reconstruct exact V7 launcher and execute']==('completed','failure')
          assert artifact['id']==int(os.environ['V7_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['V7_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['V7_RUN']) and artifact['workflow_run']['head_sha']==os.environ['V7_HEAD']
          with zipfile.ZipFile(root/'v7.zip') as archive:
              infos=archive.infolist()
              assert len(infos)==int(os.environ['V7_ARTIFACT_FILES']) and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not info.is_dir()
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          launcher=target/'doctor-who-cycle-011-rastel-candidate-v7-transport/launcher.sh'
          assert launcher.is_file() and launcher.stat().st_size==int(os.environ['V7_LAUNCHER_BYTES']) and sha(launcher.read_bytes())==os.environ['V7_LAUNCHER_SHA256']
          text=launcher.read_text()
          wrong="assert lease.startswith('lease_') and len(lease)==31"
          right="assert re.fullmatch(r'lease_[0-9a-f]{24}',lease),lease"
          assert text.count(wrong)==1 and right not in text
          names=[path.relative_to(target).as_posix() for path in target.rglob('*') if path.is_file()]
          assert not any(name.endswith('materialize-v7.sh') for name in names)
          assert not any(name.endswith('candidate-receipt.json') for name in names)
          receipt={
            'version':1,
            'status':'cycle-011-rastel-candidate-v8-launcher-lease-shape-repair',
            'carrier':{'pr':int(os.environ['PR']),'head':os.environ['HEAD'],'base':os.environ['MAIN']},
            'failed_v7':{'pr':int(os.environ['V7_PR']),'head':os.environ['V7_HEAD'],'run':int(os.environ['V7_RUN']),'job':int(os.environ['V7_JOB']),'artifact':int(os.environ['V7_ARTIFACT']),'artifact_digest':os.environ['V7_ARTIFACT_DIGEST'],'artifact_files':len(infos),'launcher_bytes':launcher.stat().st_size,'launcher_sha256':sha(launcher.read_bytes()),'materializer_reconstructed':False,'candidate_executed':False},
            'repair':{'old':wrong,'new':right,'occurrences':1,'contract':{'prefix':'lease_','hex_characters':24,'total_characters':30}},
            'boundary':{'candidate_only':True,'repository_write':False,'product_published':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'v8-launcher-repair.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CURRENT_HEAD=%s\nCURRENT_PR=%s\nCURRENT_BASE=%s\n' "$head" "$pr" "$base" >> "$GITHUB_ENV"

      - name: Reconstruct corrected V8 launcher and execute exact candidate
        shell: bash
        run: |
          set -euo pipefail
          : > "$TRANSPORT/launcher.sh.gz.b64"
          read -r -a blobs <<< "$LAUNCHER_BLOBS"
          read -r -a sizes <<< "$LAUNCHER_CHUNK_BYTES"
          read -r -a hashes <<< "$LAUNCHER_CHUNK_SHA256"
          test "${#blobs[@]}" = 7
          for index in 0 1 2 3 4 5 6; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$TRANSPORT/chunk.$index"
            test "$(wc -c < "$TRANSPORT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$TRANSPORT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$TRANSPORT/chunk.$index" >> "$TRANSPORT/launcher.sh.gz.b64"
          done
          test "$(wc -c < "$TRANSPORT/launcher.sh.gz.b64" | tr -d ' ')" = "$LAUNCHER_B64_BYTES"
          test "$(sha256sum "$TRANSPORT/launcher.sh.gz.b64" | awk '{print $1}')" = "$LAUNCHER_B64_SHA256"
          base64 -d "$TRANSPORT/launcher.sh.gz.b64" > "$TRANSPORT/launcher.sh.gz"
          test "$(wc -c < "$TRANSPORT/launcher.sh.gz" | tr -d ' ')" = "$LAUNCHER_GZIP_BYTES"
          test "$(sha256sum "$TRANSPORT/launcher.sh.gz" | awk '{print $1}')" = "$LAUNCHER_GZIP_SHA256"
          gzip -dc "$TRANSPORT/launcher.sh.gz" > "$TRANSPORT/launcher.sh"
          test "$(wc -c < "$TRANSPORT/launcher.sh" | tr -d ' ')" = "$LAUNCHER_BYTES"
          test "$(sha256sum "$TRANSPORT/launcher.sh" | awk '{print $1}')" = "$LAUNCHER_SHA256"
          bash -n "$TRANSPORT/launcher.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-v8-transport/launcher.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1): compile(block,f'<rastel-v8-launcher-{index}>','exec')
          assert text.count("assert re.fullmatch(r'lease_[0-9a-f]{24}',lease),lease")==1
          assert 'len(lease)==31' not in text
          assert text.count('agent/doctor-who-cycle-011-rastel-candidate-v8-current-main')==2
          assert text.count('.github/workflows/doctor-who-cycle-011-rastel-candidate-v8-current-main.yml')==2
          PY
          chmod 700 "$TRANSPORT/launcher.sh"
          CURRENT_HEAD="$CURRENT_HEAD" CURRENT_PR="$CURRENT_PR" CURRENT_BASE="$CURRENT_BASE" "$TRANSPORT/launcher.sh"
          test -f "$OUT/receipt/candidate-receipt.json"
          mkdir -p "$OUT/transport"
          cp "$TRANSPORT/v8-launcher-repair.json" "$OUT/transport/v8-launcher-repair.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v8-current-main-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v8
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v8-current-main-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v8
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-bootstrap
            !/tmp/doctor-who-cycle-011-rastel-candidate-v8-bootstrap/v6.zip
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-control
            /tmp/doctor-who-cycle-011-rastel-candidate-v8-transport
            !/tmp/doctor-who-cycle-011-rastel-candidate-v8-transport/v7.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
