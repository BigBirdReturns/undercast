name: star-trek-next-boundary-inspector-v1

on:
  push:
    branches:
      - agent/star-trek-next-boundary-inspector-v1

concurrency:
  group: star-trek-next-boundary-inspector-v1
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_BRANCH: agent/star-trek-next-boundary-result-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Inspect next exact obligation and existing probe custody
        run: |
          set -euo pipefail
          carrier_head="$(git rev-parse HEAD)"
          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          live_sha="$(jq -r .sha <<<"$live")"
          live_tree="$(jq -r .commit.tree.sha <<<"$live")"
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$live_sha"
          git checkout --detach "$live_sha"
          npm ci --ignore-scripts
          node scripts/thesis-rails.mjs validate --json > /tmp/thesis-status.json
          node scripts/thesis-rails.mjs next --json > /tmp/thesis-next.json
          phase="$(jq -r '.phase // empty' /tmp/thesis-next.json)"
          task_id="$(jq -r '.candidate.task_id // empty' /tmp/thesis-next.json)"
          character="$(jq -r '.candidate.character // empty' /tmp/thesis-next.json)"
          performer="$(jq -r '.candidate.performer // empty' /tmp/thesis-next.json)"
          fingerprint="$(jq -r '.candidate.source_fingerprint // empty' /tmp/thesis-next.json)"
          slug="$(python3 - "$character" <<'PY'
          import re,sys
          print(re.sub(r'[^a-z0-9]+','-',sys.argv[1].lower()).strip('-'))
          PY
          )"
          task='null'
          if test -n "$task_id"; then
            task="$(jq -c --arg id "$task_id" '.jobs[] | select(.id == $id)' data/AUTOPILOT.json)"
            test -n "$task" || task='null'
          fi
          branches="$(gh api "/repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/star-trek-${slug}-probe" 2>/dev/null || printf '[]')"
          artifacts="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/artifacts" -f per_page=100)"
          probe_artifacts="$(jq --arg slug "$slug" '[.artifacts[] | select(.expired == false and ((.name // "") | ascii_downcase | contains($slug)) and ((.name // "") | ascii_downcase | contains("probe")))] | sort_by(.created_at) | reverse' <<<"$artifacts")"
          probe_branches="$(jq '[.[] | {ref,sha:.object.sha}]' <<<"$branches")"
          branch_count="$(jq 'length' <<<"$probe_branches")"
          artifact_count="$(jq 'length' <<<"$probe_artifacts")"
          ready=false
          if test "$phase" = ready-for-one-cycle && test "$branch_count" -gt 0 && test "$artifact_count" -gt 0; then ready=true; fi

          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/star-trek-next-boundary-v1
          mkdir -p transport/star-trek-next-boundary-v1
          cp /tmp/thesis-status.json transport/star-trek-next-boundary-v1/
          cp /tmp/thesis-next.json transport/star-trek-next-boundary-v1/
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-NEXT-BOUNDARY-INSPECTION-V1 \
            --arg status success \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --arg workflow_head "$carrier_head" \
            --arg live_main "$live_sha" \
            --arg live_tree "$live_tree" \
            --arg phase "$phase" \
            --arg task_id "$task_id" \
            --arg character "$character" \
            --arg performer "$performer" \
            --arg source_fingerprint "$fingerprint" \
            --arg slug "$slug" \
            --argjson task "$task" \
            --argjson probe_branches "$probe_branches" \
            --argjson probe_artifacts "$probe_artifacts" \
            --argjson ready_for_existing_probe "$ready" \
            '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,live_main:$live_main,live_tree:$live_tree,phase:$phase,candidate:{task_id:$task_id,character:$character,performer:$performer,source_fingerprint:$source_fingerprint,slug:$slug,task:$task},probe:{branches:$probe_branches,artifacts:$probe_artifacts},ready_for_existing_probe:$ready_for_existing_probe}' \
            > transport/star-trek-next-boundary-v1/inspection.json
          git config user.name undercast-star-trek-boundary-inspector
          git config user.email star-trek-boundary-inspector@users.noreply.github.com
          git add transport/star-trek-next-boundary-v1
          git commit -m 'Star Trek: publish next-boundary inspection'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
