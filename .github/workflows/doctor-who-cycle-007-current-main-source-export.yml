name: doctor-who-cycle-007-current-main-source-export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-007-current-main-source-export.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-007-current-main-source-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-007-current-main-source-export.yml
  EXACT_MAIN: 013bf301cde81e04621b8190e5424a396013b760
  OUT: /tmp/doctor-who-cycle-007-current-main-source-export

jobs:
  export:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-current-main-source-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Bind exact one-file read-only carrier and canonical main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags --unshallow origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          git checkout --detach "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Export exact current-main tree and reachable history
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "$EXACT_MAIN" | gzip -n > "$OUT/undercast-current-main.tar.gz"
          git branch --force cycle007-export-main "$EXACT_MAIN"
          git bundle create "$OUT/undercast-current-main.bundle" cycle007-export-main
          git bundle verify "$OUT/undercast-current-main.bundle" > "$OUT/bundle-verify.txt" 2>&1
          git branch --delete --force cycle007-export-main
          git rev-parse "$EXACT_MAIN^{tree}" > "$OUT/main-tree.txt"
          git ls-tree -r --full-tree "$EXACT_MAIN" | sha256sum | awk '{print $1}' > "$OUT/ls-tree.sha256"
          sha256sum "$OUT/undercast-current-main.tar.gz" "$OUT/undercast-current-main.bundle" > "$OUT/export.sha256"
          printf 'exact_main=%s\nmain_tree=%s\ntracked_paths=%s\n' \
            "$EXACT_MAIN" "$(git rev-parse "$EXACT_MAIN^{tree}")" "$(git ls-tree -r --name-only "$EXACT_MAIN" | wc -l)" > "$OUT/custody.txt"

      - name: Upload exact current-main source export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-current-main-source-export-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
