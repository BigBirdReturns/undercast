name: ferengi-gold-browser-portrait-orbit-004

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-BROWSER-PORTRAIT-ORBIT-004.json"
      - ".github/workflows/ferengi-gold-browser-portrait-orbit-004.yml"
      - "scripts/ferengi-gold-browser-portrait-orbit-004.mjs"

permissions:
  contents: write

concurrency:
  group: ferengi-gold-browser-portrait-orbit-004-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Validate active Ferengi lock and exact browser target set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-browser-portrait-orbit-004"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock.log"
          node --input-type=module - <<'NODE' | tee "$root/authorization.log"
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-BROWSER-PORTRAIT-ORBIT-004.json','utf8'));
          if(row.scope!=='star-trek'||row.species!=='ferengi'||row.reviewed_role!=='second-desk')throw new Error('browser portrait orbit scope or authority drift');
          const cards=(row.actors||[]).flatMap(actor=>actor.cards||[]);
          if(row.expected_cards!==10||cards.length!==10||new Set(cards).size!==10)throw new Error('browser portrait orbit must cover exactly ten residual cards');
          if((row.actors||[]).length!==8)throw new Error('browser portrait orbit must cover eight residual performers');
          console.log(`PASS — browser orbit covers ${row.actors.length} performers / ${cards.length} cards`);
          NODE
      - name: Render exact pages, archived pages and retain candidate bytes
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/ferengi-gold-browser-portrait-orbit-004/candidates
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-browser-portrait-orbit-004"
          node scripts/ferengi-gold-browser-portrait-orbit-004.mjs --out "$OUT" 2>&1 | tee "$root/gather.log"
      - name: Remove completed browser operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-media-search'
          git config user.email 'undercast-media-search@users.noreply.github.com'
          rm -f .github/FERENGI-GOLD-BROWSER-PORTRAIT-ORBIT-004.json .github/workflows/ferengi-gold-browser-portrait-orbit-004.yml scripts/ferengi-gold-browser-portrait-orbit-004.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Ferengi gold: retain browser-level portrait search boundary'
      - name: Run complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-browser-portrait-orbit-004"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain page screenshots, archived pages, candidate bytes and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-browser-portrait-orbit-004-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-browser-portrait-orbit-004
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
