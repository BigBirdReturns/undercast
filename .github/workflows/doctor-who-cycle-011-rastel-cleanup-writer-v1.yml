name: doctor-who-cycle-011-rastel-cleanup-writer-v1

"on":
  workflow_run:
    workflows: [doctor-who-cycle-011-rastel-cleanup-verifier-v1]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-writer-v1
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'agent/doctor-who-cycle-011-rastel-cleanup-verifier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PREFIX: agent/doctor-who-cycle-011-rastel-
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      VERIFIER_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-verifier-v1
      VERIFIER_WORKFLOW: doctor-who-cycle-011-rastel-cleanup-verifier-v1
      AUTH_PREFIX: doctor-who-cycle-011-rastel-cleanup-verifier-v1-authorization-
      PROOF_IDENTITY: de673e54e1f06fef78e1af97906cf57a23492e02130f0bd70fc79ffea2bc5c59
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-writer-v1
      CLEANUP_MESSAGE: "CI: retire cycle 011 Rastel transport"
      CLEANUP_NAME: undercast-cycle-011-cleanup
      CLEANUP_EMAIL: cycle-011-cleanup@users.noreply.github.com
      CLEANUP_DATE: 2026-08-10T04:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind installed writer and exact successful verifier run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,authorization,logs,receipt}
          installed="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$installed"
          test "$(git show -s --format=%P "$installed")" = "$CANONICAL_MAIN"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          test "$(git diff --name-status "$CANONICAL_MAIN" "$installed")" = $'A\t'"$SELF"
          source_run='${{ github.event.workflow_run.id }}'
          source_head='${{ github.event.workflow_run.head_sha }}'
          source_attempt='${{ github.event.workflow_run.run_attempt }}'
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$VERIFIER_BRANCH" -f per_page=100 > "$OUT/api/verifier-prs.json"
          SOURCE_RUN="$source_run" SOURCE_HEAD="$source_head" SOURCE_ATTEMPT="$source_attempt" INSTALLED_MAIN="$installed" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'; load=lambda n:json.loads((root/n).read_text())
          run=load('source-run.json'); jobs=load('source-jobs.json')['jobs']; artifacts=load('source-artifacts.json')['artifacts']; prs=load('verifier-prs.json')
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['head_sha']==os.environ['SOURCE_HEAD']
          assert run['head_branch']==os.environ['VERIFIER_BRANCH'] and run['name']==os.environ['VERIFIER_WORKFLOW']
          assert run['event']=='pull_request' and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==int(os.environ['SOURCE_ATTEMPT'])
          verify=[row for row in jobs if row['name']=='verify' and row['conclusion']=='success' and row['run_attempt']==int(os.environ['SOURCE_ATTEMPT'])]
          assert len(verify)==1,[(row['id'],row['name'],row['run_attempt'],row['conclusion']) for row in jobs]
          expected=os.environ['AUTH_PREFIX']+os.environ['SOURCE_RUN']+'-attempt-'+os.environ['SOURCE_ATTEMPT']
          matches=[row for row in artifacts if row['name']==expected and not row['expired']]
          assert len(matches)==1,(expected,[(row['id'],row['name']) for row in artifacts])
          prs=[row for row in prs if row['head']['ref']==os.environ['VERIFIER_BRANCH'] and row['head']['sha']==os.environ['SOURCE_HEAD']]
          assert len(prs)==1,[(row['number'],row['state'],row['head']['sha']) for row in prs]
          (root/'source-job.txt').write_text(str(verify[0]['id'])+'\n')
          (root/'authorization-id.txt').write_text(str(matches[0]['id'])+'\n')
          (root/'verifier-pr.txt').write_text(str(prs[0]['number'])+'\n')
          PY
          auth_id="$(cat "$OUT/api/authorization-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$auth_id" > "$OUT/api/authorization-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$auth_id/zip" > "$OUT/authorization.zip"
          auth_sha="$(sha256sum "$OUT/authorization.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/authorization-artifact.json")" = "sha256:$auth_sha"
          printf 'INSTALLED_MAIN=%s\nSOURCE_RUN=%s\nSOURCE_HEAD=%s\nSOURCE_ATTEMPT=%s\nSOURCE_JOB=%s\nAUTH_ARTIFACT=%s\nAUTH_ZIP_SHA256=%s\nVERIFIER_PR=%s\n' "$installed" "$source_run" "$source_head" "$source_attempt" "$(cat "$OUT/api/source-job.txt")" "$auth_id" "$auth_sha" "$(cat "$OUT/api/verifier-pr.txt")" >> "$GITHUB_ENV"

      - name: Authenticate frozen cleanup authorization
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/authorization.zip" TARGET="$OUT/authorization" python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          target=Path(os.environ['TARGET']); target.mkdir(parents=True,exist_ok=True); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file() and sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          path=target/'authorization.json'; data=json.loads(path.read_text()); identity=data.pop('identity')
          assert sha(json.dumps(data,sort_keys=True,separators=(',',':')).encode())==identity
          data['identity']=identity
          assert data['status']=='cycle-011-rastel-exact-prefix-cleanup-authorized-v3'
          assert data['source']=={'pr':int(os.environ['VERIFIER_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'attempt':int(os.environ['SOURCE_ATTEMPT']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['AUTH_ARTIFACT']),'artifact_sha256':os.environ['AUTH_ZIP_SHA256']}
          assert data['terminal_proof_identity']==os.environ['PROOF_IDENTITY'] and data['canonical_main']==os.environ['CANONICAL_MAIN'] and data['prefix']==os.environ['PREFIX']
          assert data['installation']['main']==os.environ['INSTALLED_MAIN'] and data['installation']['writer_path']==os.environ['SELF']
          assert data['boundary']=={'cycle_012_lease_issued':False,'cycle_012_product_authority':False,'exact_heads_frozen':True,'force_update':False,'main_mutation':False,'merge':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          (Path(os.environ['OUT'])/'receipt/authorization.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Close frozen pull requests and delete frozen refs
        shell: bash
        run: |
          set -euo pipefail
          auth="$OUT/receipt/authorization.json"
          : > "$OUT/logs/pr-actions.tsv"
          while IFS=$'\t' read -r number branch head action; do
            [ -n "$number" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number-before.json"
            NUMBER="$number" BRANCH_NAME="$branch" HEAD_SHA="$head" ACTION="$action" python3 - <<'PY'
          import json,os
          from pathlib import Path
          row=json.loads((Path(os.environ['OUT'])/f"api/pr-{os.environ['NUMBER']}-before.json").read_text())
          assert row['number']==int(os.environ['NUMBER']) and row['head']['ref']==os.environ['BRANCH_NAME'] and row['head']['sha']==os.environ['HEAD_SHA']
          if os.environ['ACTION']=='close_without_merge': assert row['state']=='open' and row['merged'] is False
          PY
            if [ "$action" = close_without_merge ]; then
              gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$number" -f state=closed > "$OUT/api/pr-$number-after.json"
              jq -e --arg head "$head" '.state=="closed" and .merged==false and .head.sha==$head' "$OUT/api/pr-$number-after.json" >/dev/null
            fi
            printf '%s\t%s\t%s\t%s\n' "$number" "$branch" "$head" "$action" >> "$OUT/logs/pr-actions.tsv"
          done < <(jq -r '.pull_requests[] | [.pr,.branch,.head,.action] | @tsv' "$auth")
          : > "$OUT/logs/ref-actions.tsv"
          while IFS=$'\t' read -r branch head; do
            [ -n "$branch" ] || continue
            live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$live" = "$head"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then echo "ref survived: $branch" >&2; exit 1; fi
            printf '%s\t%s\n' "$branch" "$head" >> "$OUT/logs/ref-actions.tsv"
          done < <(jq -r '.refs[] | [.branch,.head] | @tsv' "$auth")
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Self-delete writer and restore canonical product tree
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$CANONICAL_MAIN" > "$OUT/api/canonical-commit.json"
          tree="$(jq -r '.tree.sha' "$OUT/api/canonical-commit.json")"
          test "$tree" = "$CANONICAL_TREE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          payload={'message':os.environ['CLEANUP_MESSAGE'],'tree':os.environ['CANONICAL_TREE'],'parents':[os.environ['INSTALLED_MAIN']],'author':{'name':os.environ['CLEANUP_NAME'],'email':os.environ['CLEANUP_EMAIL'],'date':os.environ['CLEANUP_DATE']},'committer':{'name':os.environ['CLEANUP_NAME'],'email':os.environ['CLEANUP_EMAIL'],'date':os.environ['CLEANUP_DATE']}}
          (root/'commit.json').write_text(json.dumps(payload))
          PY
          cleanup_commit="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input "$OUT/commit.json" --jq '.sha')"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.tree.sha')" = "$CANONICAL_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.parents[0].sha')" = "$INSTALLED_MAIN"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$cleanup_commit" -F force=false > "$OUT/api/main-update.json"
          test "$(jq -r '.object.sha' "$OUT/api/main-update.json")" = "$cleanup_commit"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$cleanup_commit"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.tree.sha')" = "$CANONICAL_TREE"
          if gh api "/repos/$GITHUB_REPOSITORY/contents/$SELF?ref=$cleanup_commit" >/dev/null 2>&1; then echo 'writer survived final tree' >&2; exit 1; fi
          gh api "/repos/$GITHUB_REPOSITORY/contents/scripts/doctor-who-cycle-011.mjs?ref=$cleanup_commit" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/terminal-refs.json"
          test "$(jq 'length' "$OUT/api/terminal-refs.json")" = 0
          CLEANUP_COMMIT="$cleanup_commit" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); auth=json.loads((root/'receipt/authorization.json').read_text())
          receipt={'status':'cycle-011-rastel-exact-prefix-cleanup-complete-v3','version':3,'writer_run':int(os.environ['GITHUB_RUN_ID']),'writer_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source':{'pr':int(os.environ['VERIFIER_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['AUTH_ARTIFACT']),'artifact_sha256':os.environ['AUTH_ZIP_SHA256']},'authorization_identity':auth['identity'],'terminal_proof_identity':auth['terminal_proof_identity'],'canonical':{'proved_commit':os.environ['CANONICAL_MAIN'],'installation_commit':os.environ['INSTALLED_MAIN'],'cleanup_commit':os.environ['CLEANUP_COMMIT'],'tree':os.environ['CANONICAL_TREE'],'writer_path_absent':True},'closed_pull_requests':auth['counts']['close_without_merge'],'deleted_refs':auth['counts']['refs'],'prefix_refs_remaining':0,'boundary':{'cycle_012_lease_issued':False,'cycle_012_product_authority':False,'force_update':False,'merge':False,'outside_human_dependency':False,'owner_physical_action_required':False,'product_tree_changed':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/cleanup.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-writer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-writer-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-writer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-writer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
