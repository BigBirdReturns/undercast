name: apply-public-trust-corrections-001

on:
  push:
    branches:
      - agent/public-trust-corrections-001
    paths:
      - ".github/workflows/apply-public-trust-corrections-001.yml"

permissions:
  contents: write

concurrency:
  group: apply-public-trust-corrections-001
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/public-trust-corrections-001
  AUTHORIZED_HEAD: ${{ github.sha }}
  SELF: .github/workflows/apply-public-trust-corrections-001.yml
  BASELINE: data/review/corrections/BASELINE.json

jobs:
  apply:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Bind exact branch and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$(git rev-parse refs/remotes/origin/main)"
          test -z "$(git status --porcelain)"

      - name: Validate correction contracts and controlled exercise
        run: |
          set -euo pipefail
          node --check scripts/corrections.mjs
          node --check scripts/correction-fixtures.mjs
          node scripts/correction-fixtures.mjs

          grep -Fq 'id: record_id' .github/ISSUE_TEMPLATE/correction.yml
          grep -Fq 'id: proposed_correction' .github/ISSUE_TEMPLATE/correction.yml
          grep -Fq 'id: public_evidence' .github/ISSUE_TEMPLATE/correction.yml
          grep -Fq 'private personal data' .github/ISSUE_TEMPLATE/correction.yml
          grep -Fq 'not an automatic canonical change' .github/ISSUE_TEMPLATE/correction.yml

          node scripts/corrections.mjs write
          node scripts/corrections.mjs check
          node scripts/corrections.mjs status > /tmp/corrections-status.json

          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/corrections-status.json', 'utf8'));
          if (status.production.admitted_cases !== 0) throw new Error('exercise entered the production correction ledger');
          if (status.production.median_close_days !== null || status.production.maximum_first_response_days !== null) throw new Error('empty production ledger became a zero-valued metric');
          if (status.exercise.status !== 'resolved' || status.exercise.outcome !== 'accepted') throw new Error('controlled exercise did not resolve');
          if (!status.exercise.independent_review || !status.exercise.public_history || status.exercise.canonical_mutation) throw new Error('controlled exercise boundary drifted');
          if (!status.boundary.controlled_exercise_is_not_public_demand || !status.boundary.controlled_exercise_is_not_canonical_authority) throw new Error('exercise acquired public or canonical authority');
          if (status.boundary.roadmap_milestone_completed || status.boundary.live_publication_mutated) throw new Error('baseline exceeded its milestone or publication authority');
          NODE

      - name: Wire corrections into the permanent gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts['corrections:write'] = 'node scripts/corrections.mjs write';
          pkg.scripts['corrections:check'] = 'node scripts/corrections.mjs check';
          pkg.scripts['corrections:status'] = 'node scripts/corrections.mjs status';
          pkg.scripts['corrections:fixtures'] = 'node scripts/correction-fixtures.mjs && node scripts/corrections.mjs check';
          const command = 'node scripts/correction-fixtures.mjs && node scripts/corrections.mjs check';
          if (!pkg.scripts['corpus:fixtures'].includes(command)) pkg.scripts['corpus:fixtures'] += ` && ${command}`;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm run corrections:fixtures

      - name: Smoke the complete candidate before publication
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add package.json "$BASELINE"
          git diff --cached --check

          git diff --cached --name-only | sort > /tmp/staged-paths.txt
          printf '%s\n' "$SELF" package.json "$BASELINE" | sort > /tmp/expected-staged-paths.txt
          diff -u /tmp/expected-staged-paths.txt /tmp/staged-paths.txt

          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee /tmp/corrections-gate.log

      - name: Publish the exact clean correction baseline under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          diff -u /tmp/expected-staged-paths.txt <(git diff --cached --name-only | sort)
          node scripts/corrections.mjs check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$(git rev-parse refs/remotes/origin/main)"

          git config user.name undercast-corrections
          git config user.email undercast-corrections@users.noreply.github.com
          git commit \
            -m 'Corrections: publish intake and history baseline' \
            -m 'controlled exercise proves the mechanism without public demand' \
            -m 'empty production ledger remains null rather than zero'
          new_head="$(git rev-parse HEAD)"

          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          printf '%s\n' \
            .github/ISSUE_TEMPLATE/correction.yml \
            data/CORRECTIONS.json \
            "$BASELINE" \
            data/review/corrections/controlled-exercise-001.json \
            docs/CORRECTIONS.md \
            package.json \
            schema/correction.schema.json \
            scripts/correction-fixtures.mjs \
            scripts/corrections.mjs \
            | sort > /tmp/expected-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload correction and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-trust-corrections-001-${{ github.run_id }}
          path: |
            /tmp/corrections-status.json
            /tmp/corrections-gate.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
