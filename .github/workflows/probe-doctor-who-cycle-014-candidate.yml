name: doctor-who-cycle-014-shrok-candidate-qualification

on:
  push:
    branches: [probe-doctor-who-next-candidate-20260812]

permissions:
  contents: write

concurrency:
  group: doctor-who-cycle-014-shrok-candidate
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Materialize, validate, and publish exact Shrok candidate
        id: candidate
        env:
          EXPECTED_MAIN: 32317c194e8b73c39060f9cf9195c36dc954690c
          CANDIDATE_BRANCH: agent/doctor-who-cycle-014-shrok-candidate-v1
        run: |
          set -euo pipefail
          cp scripts/doctor-who-cycle-014-materialize.mjs /tmp/doctor-who-cycle-014-materialize.mjs
          test "$(sha256sum /tmp/doctor-who-cycle-014-materialize.mjs | cut -d' ' -f1)" = "c5c3a10cd03c25654e6a06a9877ffa8aa7eede817d2650100f81025348b9f424"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          node /tmp/doctor-who-cycle-014-materialize.mjs
          git diff --check
          cat > /tmp/expected-paths.txt <<'PATHS'
          data/AUTOPILOT.json
          data/CENSUS-COVERAGE.json
          data/CENSUS-FERENGI-TEST.json
          data/CENSUS-GAPS.json
          data/CENSUS-SUMMARY.json
          data/MEDIA-AUDIT.json
          data/SOURCES.json
          data/archive.json
          data/entities.json
          data/index.json
          data/journal/autopilot.jsonl
          data/journal/candidates.jsonl
          data/journal/media-audit.jsonl
          data/quality.json
          data/search/2.json
          data/search/a.json
          data/search/b.json
          data/search/c.json
          data/search/d.json
          data/search/e.json
          data/search/f.json
          data/search/i.json
          data/search/m.json
          data/search/manifest.json
          data/search/o.json
          data/search/p.json
          data/search/q.json
          data/search/r.json
          data/search/s.json
          data/search/t.json
          data/search/v.json
          data/search/w.json
          data/shard-manifest.json
          data/shards/0001.json
          data/species.json
          data/specimens.json
          images/uc-1359-portrait.jpg
          scripts/doctor-who-cycle-014-candidate.mjs
          sitemap.xml
          PATHS
          { git diff --name-only; git ls-files --others --exclude-standard; } | LC_ALL=C sort -u > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(wc -l < /tmp/actual-paths.txt | tr -d ' ')" = 39
          test -z "$(grep '^\.github/' /tmp/actual-paths.txt || true)"
          git config user.name "undercast-cycle-014-candidate"
          git config user.email "cycle-014-candidate@users.noreply.github.com"
          git add -A
          git commit -m "Doctor Who: stage cycle 014 Shrok candidate"
          candidate_commit="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXPECTED_MAIN"..HEAD)"
          git push --force origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          mkdir -p /tmp/candidate-receipt
          printf '%s\n' "$EXPECTED_MAIN" > /tmp/candidate-receipt/parent.txt
          printf '%s\n' "$candidate_commit" > /tmp/candidate-receipt/commit.txt
          printf '%s\n' "$candidate_tree" > /tmp/candidate-receipt/tree.txt
          cp /tmp/actual-paths.txt /tmp/candidate-receipt/paths.txt
          sha256sum images/uc-1359-portrait.jpg scripts/doctor-who-cycle-014-candidate.mjs > /tmp/candidate-receipt/key-sha256.txt
          printf 'candidate_commit=%s\n' "$candidate_commit" >> "$GITHUB_OUTPUT"
          printf 'candidate_tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-014-shrok-candidate-receipt
          path: /tmp/candidate-receipt/
          if-no-files-found: error
          retention-days: 7
      - name: Qualification summary
        run: |
          echo "candidate commit: ${{ steps.candidate.outputs.candidate_commit }}"
          echo "candidate tree:   ${{ steps.candidate.outputs.candidate_tree }}"
