      - name: Finalize exact candidate and fast-forward canonical main
        id: product
        env:
          EXPECTED_MAIN: 32317c194e8b73c39060f9cf9195c36dc954690c
          CANDIDATE_COMMIT: b6eb9537969a7a9d31c6a2476f1b59ae1b1639b4
          CANDIDATE_TREE: da8ed9eff4f25754f66259bf8b4ec1deee76c0c1
          CANDIDATE_BRANCH: agent/doctor-who-cycle-014-shrok-candidate-v1
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$CANDIDATE_BRANCH)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse "$CANDIDATE_COMMIT^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "$CANDIDATE_COMMIT^")" = "$EXPECTED_MAIN"

          git diff --name-only "$EXPECTED_MAIN" "$CANDIDATE_COMMIT" | LC_ALL=C sort > /tmp/candidate-paths.txt
          test "$(wc -l < /tmp/candidate-paths.txt | tr -d ' ')" = 39
          test -z "$(grep '^\.github/' /tmp/candidate-paths.txt || true)"

          git checkout --detach "$CANDIDATE_COMMIT"
          node /tmp/doctor-who-cycle-014-finalize.mjs
          git diff --check

          cat > /tmp/finalization-paths.txt <<'PATHS'
          data/ESTATE-REGISTRY.json
          data/WATERLINE-STATE.json
          data/journal/waterline.jsonl
          data/review/adapter-sdk/BASELINE.json
          data/review/adapter-sdk/doctor-who-cycle-014-shrok.json
          package.json
          scripts/doctor-who-cycle-014.mjs
          PATHS
          { git diff --name-only; git ls-files --others --exclude-standard; } | LC_ALL=C sort -u > /tmp/actual-finalization-paths.txt
          diff -u /tmp/finalization-paths.txt /tmp/actual-finalization-paths.txt
          test "$(wc -l < /tmp/actual-finalization-paths.txt | tr -d ' ')" = 7
          test -z "$(grep '^\.github/' /tmp/actual-finalization-paths.txt || true)"

          git config user.name "undercast-cycle-014-publisher"
          git config user.email "cycle-014-publisher@users.noreply.github.com"
          git add -A
          git commit -m "Doctor Who: finalize cycle 014 Shrok receipt"
          qualified_tree="$(git rev-parse HEAD^{tree})"

          git reset --soft "$EXPECTED_MAIN"
          git commit -m "Doctor Who: publish cycle 014 Shrok"
          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse HEAD^{tree})"
          test "$product_tree" = "$qualified_tree"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXPECTED_MAIN"..HEAD)"

          cat /tmp/candidate-paths.txt /tmp/finalization-paths.txt | LC_ALL=C sort -u > /tmp/expected-product-paths.txt
          test "$(wc -l < /tmp/expected-product-paths.txt | tr -d ' ')" = 46
          git diff --name-only "$EXPECTED_MAIN"..HEAD | LC_ALL=C sort > /tmp/actual-product-paths.txt
          diff -u /tmp/expected-product-paths.txt /tmp/actual-product-paths.txt
          test -z "$(grep '^\.github/' /tmp/actual-product-paths.txt || true)"
          git diff --check "$EXPECTED_MAIN"..HEAD
          node scripts/doctor-who-cycle-014.mjs
          node scripts/waterline.mjs validate --scope doctor-who
          node scripts/waterline.mjs gate --scope doctor-who --operation claim

          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin HEAD:refs/heads/main

          mkdir -p /tmp/final-product-receipt
          printf '%s\n' "$EXPECTED_MAIN" > /tmp/final-product-receipt/parent.txt
          printf '%s\n' "$CANDIDATE_COMMIT" > /tmp/final-product-receipt/candidate-commit.txt
          printf '%s\n' "$CANDIDATE_TREE" > /tmp/final-product-receipt/candidate-tree.txt
          printf '%s\n' "$product_commit" > /tmp/final-product-receipt/product-commit.txt
          printf '%s\n' "$product_tree" > /tmp/final-product-receipt/product-tree.txt
          cp /tmp/actual-product-paths.txt /tmp/final-product-receipt/paths.txt
          sha256sum \
            data/review/adapter-sdk/doctor-who-cycle-014-shrok.json \
            scripts/doctor-who-cycle-014.mjs \
            images/uc-1359-portrait.jpg \
            > /tmp/final-product-receipt/key-sha256.txt
          printf 'cycle_33fdaa5d9da82e063365abd3\n' > /tmp/final-product-receipt/cycle.txt
          printf 'waterline_9d3dfdaf3c72f98e79c05ea4\n' > /tmp/final-product-receipt/waterline-event.txt
          printf 'product_commit=%s\n' "$product_commit" >> "$GITHUB_OUTPUT"
          printf 'product_tree=%s\n' "$product_tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-014-shrok-final-product-receipt
          path: /tmp/final-product-receipt/
          if-no-files-found: error
          retention-days: 7
      - name: Publication summary
        run: |
          echo "product commit: ${{ steps.product.outputs.product_commit }}"
          echo "product tree:   ${{ steps.product.outputs.product_tree }}"
          echo "cycle:          cycle_33fdaa5d9da82e063365abd3"
