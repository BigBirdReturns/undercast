name: card-backfill-reconcile-rearm

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-reconcile-rearm.yml'

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REARM_HEAD: ${{ github.sha }}
    steps:
      - name: Dispatch reconciled exact-head supervisor
        run: |
          set -euo pipefail
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f reason=reducer-cleanup-race-reconciled
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${REARM_HEAD}" \
            -f state=success \
            -f context='card-backfill/reconcile-rearm' \
            -f description='reconciled reduced head rearmed; stale duplicate wave will be cancelled' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'
