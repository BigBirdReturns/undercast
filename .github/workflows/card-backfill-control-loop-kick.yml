name: card-backfill-control-loop-kick

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-control-loop-kick.yml'

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  kick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch retained-wave recovery without rediscovery
        run: |
          set -euo pipefail
          gh workflow run card-backfill-amortized-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f source_run_id=30593861671 \
            -f model=openai/gpt-4.1-mini
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='card-backfill/retained-wave-recovery' \
            -f description='recovering 140 packetized obligations; rediscovery=0'
          echo 'PASS — retained-wave recovery dispatched without a chat turn'
