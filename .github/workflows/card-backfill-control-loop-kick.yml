name: card-backfill-control-loop-kick

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-control-loop-kick.yml'

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  kick:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch the finalized unattended supervisor
        run: |
          set -euo pipefail
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f reason=final-control-loop-validation
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='card-backfill/final-control-loop' \
            -f description='final supervisor validation dispatched'
          echo 'PASS — finalized supervisor dispatched without a chat turn'
