name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected-bootstrap
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CONTROLLER_B64_BYTES: "21616"
      CONTROLLER_B64_SHA256: 4147fbfc8ecbb2f2af522b779c40f253aefa104b6ba19e0a36bf50390ca174ca
      CONTROLLER_GZIP_BYTES: "16212"
      CONTROLLER_GZIP_SHA256: 632014526b2f840871262b50e71ce9e55c593eed40aa4d744a72041d801772a2
      CONTROLLER_BYTES: "28604"
      CONTROLLER_SHA256: f6c4a22e73928e95e78a54a500afcbe72e56ba3c095eb9a5481879a12081f289

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact V5 controller shards and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rastel-preflight-v5-controller
          mkdir -p /tmp/rastel-preflight-v5-controller
          : > /tmp/rastel-preflight-v5-controller/controller.sh.gz.b64
          for blob in \
            f17c9546aa53b8bba4e6c9ca5b44b3b0560af637 \
            ab69f9f3e405643d312ce213652b179b194a084b \
            311ed5ea0e278b130b2447f40a9bc8eaaf9d6e8c \
            8a8fbac1070fcd8af44570a6336c71519971880f; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/rastel-preflight-v5-controller/controller.sh.gz.b64
          done
          test "$(wc -c < /tmp/rastel-preflight-v5-controller/controller.sh.gz.b64 | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v5-controller/controller.sh.gz.b64 | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d /tmp/rastel-preflight-v5-controller/controller.sh.gz.b64 > /tmp/rastel-preflight-v5-controller/controller.sh.gz
          test "$(wc -c < /tmp/rastel-preflight-v5-controller/controller.sh.gz | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v5-controller/controller.sh.gz | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc /tmp/rastel-preflight-v5-controller/controller.sh.gz > /tmp/rastel-preflight-v5-controller/controller.sh
          test "$(wc -c < /tmp/rastel-preflight-v5-controller/controller.sh | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v5-controller/controller.sh | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n /tmp/rastel-preflight-v5-controller/controller.sh
          chmod 700 /tmp/rastel-preflight-v5-controller/controller.sh
          exec /tmp/rastel-preflight-v5-controller/controller.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected-bootstrap
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v5-selected-bootstrap
            /tmp/rastel-preflight-v5-controller
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
