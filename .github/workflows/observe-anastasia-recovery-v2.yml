name: observe-anastasia-recovery-v2

on:
  push:
    branches:
      - agent/observe-anastasia-recovery-v2

permissions:
  actions: read
  contents: write

concurrency:
  group: observe-anastasia-recovery-v2
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/star-trek-anastasia-finalizer-recovery-v2
  TARGET_HEAD: 582bd0f7b6dd264894c36208b7dd72ee04cced6b
  TARGET_WORKFLOW: .github/workflows/star-trek-anastasia-finalizer-recovery-v2.yml
  EXPECTED_PARENT: 933415b505d1c6e40c7e4bd44bf132c61a5ea32d
  TARGET_RESULT_BRANCH: agent/star-trek-anastasia-recovery-result-v2
  RESULT_BRANCH: agent/observe-anastasia-recovery-result-v2
  ROOT: /tmp/observe-anastasia-recovery-v2

jobs:
  observe:
    if: ${{ github.event.head_commit.message == 'Trigger Anastasia recovery observer v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Observe exact recovery run to terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          run_id=''
          for _ in $(seq 1 180); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" | jq . > "$ROOT/branch-runs.json"
            run_id="$(jq -r --arg sha "$TARGET_HEAD" --arg path "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.head_sha==$sha and .path==$path)] | sort_by(.created_at) | last | .id // empty' "$ROOT/branch-runs.json")"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"

          for _ in $(seq 1 1080); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" | jq . > "$ROOT/run.json"
            status="$(jq -r .status "$ROOT/run.json")"
            test "$status" = completed && break
            sleep 5
          done
          test "$(jq -r .status "$ROOT/run.json")" = completed
          conclusion="$(jq -r '.conclusion // ""' "$ROOT/run.json")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq . > "$ROOT/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq . > "$ROOT/artifacts.json"
          if test "$conclusion" != success; then
            gh run view "$run_id" --log-failed > "$ROOT/failed.log" 2>&1 || true
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/commits/main" | jq . > "$ROOT/main.json"
          main_sha="$(jq -r .sha "$ROOT/main.json")"
          main_tree="$(jq -r .commit.tree.sha "$ROOT/main.json")"
          main_parent="$(jq -r '.parents[0].sha // ""' "$ROOT/main.json")"
          main_message="$(jq -r .commit.message "$ROOT/main.json")"
          result_head="$(git ls-remote origin "refs/heads/${TARGET_RESULT_BRANCH}" | cut -f1)"
          if test -n "$result_head"; then
            git fetch --filter=blob:none --no-tags origin "$TARGET_RESULT_BRANCH"
            git archive --format=tar "refs/remotes/origin/${TARGET_RESULT_BRANCH}" transport/star-trek-anastasia-recovery-v2 | tar -xf - -C "$ROOT"
          fi

          classification=failure
          if test "$conclusion" = success; then
            test "$main_sha" != "$EXPECTED_PARENT"
            test "$main_parent" = "$EXPECTED_PARENT"
            test -n "$result_head"
            test -f "$ROOT/transport/star-trek-anastasia-recovery-v2/terminal.json"
            test "$(jq -r .status "$ROOT/transport/star-trek-anastasia-recovery-v2/terminal.json")" = published
            test "$(jq -r .product_commit "$ROOT/transport/star-trek-anastasia-recovery-v2/terminal.json")" = "$main_sha"
            classification=success
          fi

          jq -n \
            --arg status "$classification" \
            --argjson run_id "$run_id" \
            --arg conclusion "$conclusion" \
            --arg target_head "$TARGET_HEAD" \
            --arg main_commit "$main_sha" \
            --arg main_tree "$main_tree" \
            --arg main_parent "$main_parent" \
            --arg main_message "$main_message" \
            --arg result_branch "$TARGET_RESULT_BRANCH" \
            --arg result_head "$result_head" \
            '{version:1,transaction:"OBSERVE-ANASTASIA-RECOVERY-V2",status:$status,run:{id:$run_id,conclusion:$conclusion,head_sha:$target_head},canonical:{commit:$main_commit,tree:$main_tree,parent:$main_parent,message:$main_message},terminal_result:{branch:$result_branch,head:(if $result_head=="" then null else $result_head end)},canonical_mutation_by_observer:false,lease_taken_by_observer:false}' \
            > "$ROOT/status.json"
          (cd "$ROOT" && find . -type f ! -name manifest.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done > manifest.sha256 && sha256sum -c manifest.sha256)

      - name: Publish terminal observation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name undercast-anastasia-recovery-observer
          git config user.email anastasia-recovery-observer@users.noreply.github.com
          git switch --orphan observation-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p transport/observe-anastasia-recovery-v2
          cp -a "$ROOT"/. transport/observe-anastasia-recovery-v2/
          git add transport/observe-anastasia-recovery-v2
          git commit -m 'Publish Anastasia recovery observation'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
