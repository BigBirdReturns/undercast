name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALL_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      NEWLINE_SIBLING: 1c92734e501ed4667ac86c4203a6dbac282392ee
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4
      SELF: .github/workflows/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4
      PUBLISHER_RUN: "31351009242"
      VERIFY_JOB: "93341697741"
      WRITE_JOB: "93342073975"
      HANDOFF_ARTIFACT: "9048990139"
      HANDOFF_NAME: doctor-who-cycle-011-rastel-trusted-publisher-v2-handoff-31351009242-attempt-1
      HANDOFF_DIGEST: "sha256:34a27c1823dbcea8745115ed7d873f9b1bafec99c7dc74247204020468c68c9d"
      PUBLICATION_IDENTITY: fb292e861040e665d778434c27b657c65e80c7b31d886d48f4b7ce26b9ee4a10
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      PUBLICATION_HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE_ISO: 2026-08-10T01:10:00+00:00
      SOURCE_COMMIT: b96ddfe68d33a6b7a335aab14b87484f598a5694
      SOURCE_BLOB: 459858193f5c80885389e1a4cbe26b6ea7f9ab13
      SOURCE_STEM: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v2
      TARGET_STEM: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4
      SOURCE_V3_COMMIT: de6c73400a393b27d678482fe31262c673d44f5a
      SOURCE_V3_BLOB: adebdd8907dd679a2b50ab2644539ea536653ac6
      SOURCE_V3_STEM: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3
      OUTER_BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-wrapper-bootstrap
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-proof-bootstrap
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V3 wrapper and bind runtime carrier expressions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTER_BOOTSTRAP"
          mkdir -p "$OUTER_BOOTSTRAP"/{api,jobs}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_V3_BLOB" > "$OUTER_BOOTSTRAP/api/source-v3.json"
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['OUTER_BOOTSTRAP'])
          source = json.loads((root / 'api/source-v3.json').read_text())
          raw = base64.b64decode(source['content'])
          git_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert source['sha'] == os.environ['SOURCE_V3_BLOB'] == git_blob
          text = raw.decode('utf-8')
          source_stem = os.environ['SOURCE_V3_STEM']
          target_stem = os.environ['TARGET_STEM']
          source_count = text.count(source_stem)
          assert source_count >= 8
          assert text.startswith(f'name: {source_stem}\n')
          text = text.replace(source_stem, target_stem)
          anchor = "          assert all(value == 1 for value in repairs.values()), repairs\n          patched = ''.join(lines)\n"
          insertion = """          expression_repairs = {'head': 0, 'pr': 0, 'base': 0}\n          opener = '$' + '{{'\n          wanted = [\n              ('head', \"head='\" + opener + \" github.event.pull_request.head.sha }}'\", '          head=\"$CARRIER_HEAD\"\\n'),\n              ('pr', \"pr='\" + opener + \" github.event.pull_request.number }}'\", '          pr=\"$CARRIER_PR\"\\n'),\n              ('base', \"base='\" + opener + \" github.event.pull_request.base.sha }}'\", '          base=\"$CARRIER_BASE\"\\n'),\n          ]\n          for index, line in enumerate(lines):\n              stripped = line.strip()\n              for key, old, replacement in wanted:\n                  if stripped == old:\n                      lines[index] = replacement\n                      expression_repairs[key] += 1\n          assert all(value == 1 for value in repairs.values()), repairs\n          assert all(value == 1 for value in expression_repairs.values()), expression_repairs\n          patched = ''.join(lines)\n"""
          assert text.count(anchor) == 1
          text = text.replace(anchor, insertion)
          loop_anchor = "          for number, script in enumerate(scripts, 1):\n              path = root / 'jobs' / f'{number:02d}.sh'\n"
          loop_replacement = "          for number, script in enumerate(scripts, 1):\n              assert opener not in script\n              path = root / 'jobs' / f'{number:02d}.sh'\n"
          assert text.count(loop_anchor) == 1
          text = text.replace(loop_anchor, loop_replacement)
          receipt_anchor = "              'repair': {'source_stem_occurrences': source_count, 'target_stem_occurrences': patched.count(target_stem), 'awk_lines': repairs, 'other_source_bytes_changed': False},\n"
          receipt_replacement = "              'repair': {'source_stem_occurrences': source_count, 'target_stem_occurrences': patched.count(target_stem), 'awk_lines': repairs, 'github_expression_lines': expression_repairs, 'other_source_bytes_changed': False},\n              'wrapper_source': {'commit': os.environ['SOURCE_V3_COMMIT'], 'git_blob': os.environ['SOURCE_V3_BLOB']},\n"
          assert text.count(receipt_anchor) == 1
          text = text.replace(receipt_anchor, receipt_replacement)
          status_anchor = "              'status': 'cycle-011-rastel-canonical-equivalence-proof-v3-recovered',\n              'version': 3,\n"
          status_replacement = "              'status': 'cycle-011-rastel-canonical-equivalence-proof-v4-recovered',\n              'version': 4,\n"
          assert text.count(status_anchor) == 1
          text = text.replace(status_anchor, status_replacement)
          assert text.count('v3-recovery.json') == 1
          text = text.replace('v3-recovery.json', 'v4-recovery.json')
          text = text.replace('equivalence-v3-', 'equivalence-v4-')
          assert source_stem not in text
          assert text.count(target_stem) == source_count
          (root / 'source-v3.yml').write_bytes(raw)
          (root / 'wrapper-v4.yml').write_text(text)
          lines = text.splitlines(keepends=True)
          start = next(i for i, row in enumerate(lines) if row == '  prove:\n')
          block = lines[start:]
          scripts = []
          i = 0
          while i < len(block):
              if block[i] == '        run: |\n':
                  i += 1
                  body = []
                  while i < len(block):
                      row = block[i]
                      if row.strip() and len(row) - len(row.lstrip(' ')) < 10:
                          break
                      if row.startswith('          '):
                          body.append(row[10:])
                      elif not row.strip():
                          body.append('\n')
                      else:
                          break
                      i += 1
                  scripts.append(''.join(body))
                  continue
              i += 1
          assert len(scripts) == 2
          rows = []
          python_blocks = 0
          marker = '$' + '{{'
          for number, script in enumerate(scripts, 1):
              assert marker not in script
              path = root / 'jobs' / f'{number:02d}.sh'
              path.write_text(script)
              subprocess.run(['bash', '-n', str(path)], check=True)
              blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", script, re.S)
              for offset, program in enumerate(blocks, 1):
                  compile(program, f'<equivalence-wrapper-v4-{number}-{offset}>', 'exec')
              python_blocks += len(blocks)
              rows.append({'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          assert python_blocks == 1
          receipt = {
              'status': 'cycle-011-rastel-canonical-equivalence-wrapper-v4-recovered',
              'version': 4,
              'source': {'commit': os.environ['SOURCE_V3_COMMIT'], 'git_blob': git_blob, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()},
              'patches': {'target_stem_occurrences': text.count(target_stem), 'runtime_expression_repair_injected': True, 'proof_recovery_status_updated': True, 'recovery_filename_updated': True},
              'programs': rows,
              'embedded_python_programs': python_blocks,
              'boundary': {'repository_write': False, 'canonical_mutation': False, 'cycle_012_authorized': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'wrapper-recovery.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Execute repaired exact canonical-equivalence transaction
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in
                *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;;
                *=*) export "$row" ;;
              esac
            done < "$GITHUB_ENV"
          }
          bash "$OUTER_BOOTSTRAP/jobs/01.sh"
          apply_github_env
          bash "$OUTER_BOOTSTRAP/jobs/02.sh"
          apply_github_env
          cp "$OUTER_BOOTSTRAP/wrapper-recovery.json" "$OUT/receipt/v4-wrapper-recovery.json"
          (
            cd "$OUT/receipt"
            find . -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/api
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/handoff
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/logs
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/api
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/handoff
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/logs
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4/receipt
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-wrapper-bootstrap
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v4-proof-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0