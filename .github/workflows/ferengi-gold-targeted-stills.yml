name: ferengi-gold-targeted-stills

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-TARGETED-STILLS.json"
      - ".github/workflows/ferengi-gold-targeted-stills.yml"
      - "scripts/direct-media-candidates.mjs"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-targeted-stills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the active species lock
        run: node scripts/star-trek-species-gold.mjs validate
      - name: Download provenance-bound direct still candidates
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ferengi-gold-targeted-stills"
          node scripts/direct-media-candidates.mjs \
            --control .github/FERENGI-GOLD-TARGETED-STILLS.json \
            --out "$out" | tee "$RUNNER_TEMP/ferengi-gold-targeted-stills.log"
          cp .github/FERENGI-GOLD-TARGETED-STILLS.json "$out/control.json"
          cp "$RUNNER_TEMP/ferengi-gold-targeted-stills.log" "$out/run.log"
      - name: Upload exact bytes, hashes, provenance and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-targeted-stills-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-targeted-stills
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
