name: card-backfill-uc-079-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-079-APPLY.json"
      - "scripts/card-backfill-uc-079-apply.mjs"
      - ".github/workflows/card-backfill-uc-079-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-079-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-018'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-018
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed seven-role packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-079-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-079');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-079');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_12bdd74c1d97797f21a54d9a');
          if(row.version!==1||row.record_id!=='UC-079'||row.actor!=='Eddie Murphy'||row.character!=='Barbershop crowd & Saul'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-079 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8668644443||row.render_artifact?.head_sha!=='a18d9c29989941aa000cc2767f7572b503285abf')throw new Error('UC-079 render custody drift');
          if(row.expected?.candidate_sha256!=='d44512070bed14ef96452243143e356b4ed7d8ee8f05288a755cdc9d7d92c317'||row.expected?.crop_preview_sha256!=='c67e377d01ecf2f96ad91ce857db147145e06107a07470c1b4af8058dd708699')throw new Error('UC-079 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==29||row.expected?.duplicate_item_count!==17||Object.keys(row.expected?.source_sha256_by_role||{}).length!==7||Object.keys(row.expected?.panel_sha256_by_role||{}).length!==7)throw new Error('UC-079 packet denominator drift');
          if(row.ruling?.identity!=='expected-composite-subject'||row.ruling?.presentation!=='seven-role-character-depiction'||row.ruling?.crop_ruling!=='pass-seven-role-two-row-composite'||row.ruling?.canonical_mutation!==false)throw new Error('UC-079 ruling drift');
          if(!specimen||specimen.character!=='Barbershop crowd & Saul'||specimen.still)throw new Error('UC-079 specimen boundary drift');
          if(source?.still)throw new Error('UC-079 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-079'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-079 audit boundary drift');
          console.log(`PASS — UC-079 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-079-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8668644443/zip" > "$root/render.zip"
          echo "86731034e9cd58f1ebd45ce9bfa5102ddbb585eb8190b89a9d59fa7b86262a5b  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-079"
          test -f "$base/manifest.json"
          echo "72551c6008bebb963e4bf87a3f8280106b4ac9ea3b136d64614e7050d1b202c2  $base/manifest.json" | sha256sum -c -
          echo "04bb7780e3b90fd4b665b7732fa5e30d920b18efed5e1fa7d74e7ddc1943cc4e  $base/duplicate-scan.json" | sha256sum -c -
          echo "2b550496de9341e928fcb1ba1dfe4d6e85a3eb54beb4bfd86199c0ed60424a86  $base/review.json" | sha256sum -c -
          echo "0d673fd233dd24187718bdb01f08cdd2dd86dc93ed762af4efe42d1bb8bbcd2d  $base/review.md" | sha256sum -c -
          echo "52289b9a47147a4dc004d42bebeeeef9518abd069cfa426f8c36feed47a73394  $base/SHA256SUMS" | sha256sum -c -
          echo "d44512070bed14ef96452243143e356b4ed7d8ee8f05288a755cdc9d7d92c317  $base/uc-079-still-candidate.jpg" | sha256sum -c -
          echo "c67e377d01ecf2f96ad91ce857db147145e06107a07470c1b4af8058dd708699  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30306493534
          artifact_id=8668644443
          artifact_name=card-backfill-uc-079-render-30306493534
          artifact_zip_sha256=86731034e9cd58f1ebd45ce9bfa5102ddbb585eb8190b89a9d59fa7b86262a5b
          artifact_head_sha=a18d9c29989941aa000cc2767f7572b503285abf
          source_manifest_sha256=72551c6008bebb963e4bf87a3f8280106b4ac9ea3b136d64614e7050d1b202c2
          source_sums_sha256=52289b9a47147a4dc004d42bebeeeef9518abd069cfa426f8c36feed47a73394
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-079-apply/source/output/UC-079
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-079-apply"
          node --check scripts/card-backfill-uc-079-apply.mjs
          node scripts/card-backfill-uc-079-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-079-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-079');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-079');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_12bdd74c1d97797f21a54d9a');
          if(!specimen||specimen.still)throw new Error('UC-079 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-079 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-079'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-079 audit disposition was canonically mutated');
          console.log('PASS — UC-079 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-079-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-079-DIRECT-REPAIR.json \
            .github/CARD-BACKFILL-UC-079-DIRECT.json \
            .github/CARD-BACKFILL-UC-079-RENDER.json \
            .github/CARD-BACKFILL-UC-079-SAUL.json \
            .github/CARD-BACKFILL-UC-079-TARGETED.json \
            .github/CARD-BACKFILL-UC-079-APPLY.json \
            .github/CARD-BACKFILL-UC-079.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-079-direct-repair.yml \
            .github/workflows/card-backfill-uc-079-direct.yml \
            .github/workflows/card-backfill-uc-079-discover.yml \
            .github/workflows/card-backfill-uc-079-render.yml \
            .github/workflows/card-backfill-uc-079-saul.yml \
            .github/workflows/card-backfill-uc-079-scope.yml \
            .github/workflows/card-backfill-uc-079-targeted.yml \
            .github/workflows/card-backfill-uc-079-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-079-direct.mjs \
            scripts/card-backfill-uc-079-discover.mjs \
            scripts/card-backfill-uc-079-render.mjs \
            scripts/card-backfill-uc-079-saul.mjs \
            scripts/card-backfill-uc-079-scope.mjs \
            scripts/card-backfill-uc-079-targeted-repair.mjs \
            scripts/card-backfill-uc-079-targeted.mjs \
            scripts/card-backfill-uc-079-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-079 Eddie Murphy multi-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-017
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-017 HEAD)
          test "${#changed[@]}" -eq 29
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-079/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-079-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-018
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-079-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-079-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-079-apply
            data/review/card-backfill/UC-079
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
