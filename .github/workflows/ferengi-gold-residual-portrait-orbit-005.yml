name: ferengi-gold-residual-portrait-orbit-005

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ferengi-gold-residual-portrait-orbit-005.yml"

permissions:
  contents: write

concurrency:
  group: ferengi-gold-residual-portrait-orbit-005-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact ten-card residual boundary and Ferengi lock
        run: node scripts/ferengi-gold-residual-portrait-orbit-005.mjs --validate-only

  gather:
    needs: validate
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    strategy:
      fail-fast: false
      matrix:
        actor:
          - frank-corsentino
          - michael-snyder
          - mark-barrett
          - david-jeffries
          - william-bastiani
          - jr-quinonez
          - david-b-levinson
          - doug-warhit
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Gather exact named, archived and image-search candidates
        env:
          CONTACT: bigbirdreturns@proton.me
          ACTOR_KEY: ${{ matrix.actor }}
          OUT: ${{ runner.temp }}/ferengi-gold-residual-portrait-orbit-005/${{ matrix.actor }}
        run: |
          set -euo pipefail
          node scripts/ferengi-gold-residual-portrait-orbit-005.mjs --actor "$ACTOR_KEY" --out "$OUT" 2>&1 | tee "$RUNNER_TEMP/${ACTOR_KEY}.log"
          cp "$RUNNER_TEMP/${ACTOR_KEY}.log" "$OUT/run.log"
      - name: Upload exact pages, screenshots, candidate bytes and hashes
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-residual-portrait-orbit-005-${{ matrix.actor }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-residual-portrait-orbit-005/${{ matrix.actor }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  cleanup:
    needs: [validate, gather]
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Retire stale and completed portrait gather operators
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-residual-portrait-orbit-005-cleanup"
          mkdir -p "$root"
          node scripts/ferengi-gold-residual-portrait-orbit-005.mjs --validate-only | tee "$root/residual-boundary.log"
          git config user.name 'undercast-media-search'
          git config user.email 'undercast-media-search@users.noreply.github.com'
          rm -f \
            .github/FERENGI-GOLD-PORTRAIT-DEEP-001.json \
            scripts/ferengi-gold-portrait-gather.mjs \
            .github/FERENGI-GOLD-RESIDUAL-PORTRAIT-ORBIT-005.json \
            .github/workflows/ferengi-gold-residual-portrait-orbit-005.yml \
            scripts/ferengi-gold-residual-portrait-orbit-005.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Ferengi gold: retain exact residual portrait search receipts'
      - name: Install Chromium for permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-residual-portrait-orbit-005-cleanup"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain cleanup and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-residual-portrait-orbit-005-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-residual-portrait-orbit-005-cleanup
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
