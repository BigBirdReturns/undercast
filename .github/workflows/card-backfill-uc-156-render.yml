name: card-backfill-uc-156-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-156-RENDER.json"
      - "scripts/card-backfill-uc-156-render.part-00.mjs"
      - "scripts/card-backfill-uc-156-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-156-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-156-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-034'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-034
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-156 two-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-156-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-156');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-156');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ef9fd830f381c8876701a0ba');
          if(row.version!==1||row.record_id!=='UC-156'||row.kind!=='voice'||row.actor!=='Nicholas Briggs'||row.character!=='The voice of the Daleks & Cybermen'||row.production!=='Doctor Who (2005– )'||row.years!=='2005–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-156 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8711951936||row.discovery_artifact?.head_sha!=='30c9b02419d2ed0b793991b30fd2a72dbe03ff6d'||row.discovery_artifact?.zip_sha256!=='271c31ef7cc9623752c9935d5d79980be1e37c421009e3c77fe8c13ff6ddac82'||row.discovery_artifact?.candidate_count!==2||row.discovery_artifact?.role_counts?.dalek!==1||row.discovery_artifact?.role_counts?.cyberman!==1)throw new Error('UC-156 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==1||row.failed_discovery_checkpoints[0]?.artifact_id!==8711851622||row.source_pages?.length!==4||new Set(row.source_pages.map(page=>page.sha256)).size!==4)throw new Error('UC-156 failure or page denominator drift');
          if(row.roles?.length!==2||row.roles[0]?.sha256!=='518ed11a1e9a881517fa30ac07b8d18157c92bf099552b6b5308621e3919ab9f'||row.roles[1]?.sha256!=='413c79e2825bc588efb3341625976da9cb9045ff319850bdcc434b595d4c4ec4'||row.roles.some(role=>role.width!==446||role.height!==666))throw new Error('UC-156 selected role source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==624||row.render?.panel_height!==1000||row.render?.divider_width!==12||row.render?.resize!=='624x1000>'||row.render?.panel_background!=='#171512'||row.render?.divider_color!=='#d5d0c7'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-156 render geometry drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Nicholas Briggs'||specimen.character!=='The voice of the Daleks & Cybermen'||specimen.production!=='Doctor Who (2005– )'||specimen.years!=='2005–'||specimen.still||specimen.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-156'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-156 audit boundary drift');
          console.log('PASS — exact UC-156 Dalek and Cyberman voice composite render authorized');
          NODE
      - name: Retrieve and verify exact focused discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8711951936/zip" > "$root/discovery.zip"
          echo "271c31ef7cc9623752c9935d5d79980be1e37c421009e3c77fe8c13ff6ddac82  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-156-discover"
          echo "ae35fd97956e61f31ab9e013178cd3439b124309c944dcb404645df0262621c6  $source/manifest.json" | sha256sum -c -
          echo "1e95236615da129bcd493b7efe05344df3401664e14e9ad0e6dc9e13c736bcbe  $source/summary.json" | sha256sum -c -
          echo "5cace00ffaeacfd5c27dbefd5dbf418d4496ec540e9c7f493296d411d82e40ab  $source/contact-sheet.jpg" | sha256sum -c -
          echo "518ed11a1e9a881517fa30ac07b8d18157c92bf099552b6b5308621e3919ab9f  $source/candidates/dalek-518ed11a1e9a.jpg" | sha256sum -c -
          echo "413c79e2825bc588efb3341625976da9cb9045ff319850bdcc434b595d4c4ec4  $source/candidates/cyberman-413c79e2825b.jpg" | sha256sum -c -
          echo "6e585732af0f120f3e739546dca9d8efd47d7fff471c47733bd29ed4cb807fe8  $source/pages/doctorwho-dalek-2005.png" | sha256sum -c -
          echo "1564f1df9d4f02517cb72204863d7322dd01cd8059424504a07410cd82dd3ceb  $source/pages/doctorwho-army-of-ghosts-2006.png" | sha256sum -c -
          echo "56f830aa2fe0f445164e0cd3cf8e1c6ddbdf3f3e80a2b0470fadf95a1ed78252  $source/pages/doctorwho-daleks-character.png" | sha256sum -c -
          echo "aa28227db8ea81bfb1367ddde9ba09c02c32e5037a04d1cc487d368454aee742  $source/pages/doctorwho-cybermen-character.png" | sha256sum -c -
      - name: Render exact two-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-156-render/discovery/card-backfill-uc-156-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-156-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-render"
          cat scripts/card-backfill-uc-156-render.part-00.mjs scripts/card-backfill-uc-156-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-156-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact role assets, page receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-156-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-156-render/output
            ${{ runner.temp }}/card-backfill-uc-156-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
