name: card-backfill-uc-117-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-RENDER.json"
      - "scripts/card-backfill-uc-117-render.mjs"
      - ".github/workflows/card-backfill-uc-117-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-117-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-117 two-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-117-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.actor!=='Frank Welker'||row.character!=='Megatron & Scooby-Doo'||row.production!=='Transformers / Scooby-Doo'||row.year!==1969||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-117 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8693789087||row.discovery_artifact?.head_sha!=='038935653d882802f14d5d10e497f767c550f719'||row.discovery_artifact?.zip_sha256!=='1343e5ba6c1b0a8e82411293132a9fe933ea51a7c1a6bb0b157af445096f3718'||row.discovery_artifact?.candidate_count!==42||row.discovery_artifact?.role_counts?.megatron!==24||row.discovery_artifact?.role_counts?.scooby!==18)throw new Error('UC-117 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==11||row.failed_discovery_checkpoints[0]?.artifact_id!==8679182081||row.failed_discovery_checkpoints[10]?.artifact_id!==8693532142)throw new Error('UC-117 failed discovery custody drift');
          if(row.megatron_transport_probe?.probe_artifact?.artifact_id!==8692632509||row.megatron_transport_probe?.exact_parse?.sha256!=='911d42d129cba989927bef27ac2c434ebaf84113e1ee55e175ab87527eee81cb'||row.megatron_transport_probe?.exact_parse?.declared_image_count!==77)throw new Error('UC-117 Megatron probe drift');
          if(row.roles?.length!==2||row.roles[0]?.key!=='megatron'||row.roles[1]?.key!=='scooby')throw new Error('UC-117 role denominator drift');
          if(row.roles[0]?.sha256!=='dd827891b4de02426e99ec1f9dd92ba87b20deeefd65c13a94cd5be8adda6c96'||row.roles[0]?.file_title!=='File:Mtmte1 megatron throne.jpg'||row.roles[0]?.original_welker_signal!==true)throw new Error('UC-117 Megatron source drift');
          if(row.roles[1]?.sha256!=='6939abbdc3d4a2c6988acde82ea2a64754fa2ab804b365136c9c94739f9ade4d'||row.roles[1]?.file_title!=='File:Scooby-Doo.png'||row.roles[1]?.welker_tenure_signal!==true)throw new Error('UC-117 Scooby source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==624||row.render?.gap_width!==12||row.render?.face_height!==560||row.render?.body_height!==432||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-117 render geometry drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.production!=='Transformers / Scooby-Doo'||specimen.years!=='1969'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          console.log(`PASS — UC-117 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8693789087/zip" > "$root/discovery.zip"
          echo "1343e5ba6c1b0a8e82411293132a9fe933ea51a7c1a6bb0b157af445096f3718  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-117-discover"
          echo "59c8187dc7ff0839846ce3c6d96ab61d39d3145ce4dfe2f0d0d88dddd62f0484  $source/manifest.json" | sha256sum -c -
          echo "062e36bdd9888ede54d564ae133c7a31afa35bbc1f4b7eca134a533b7a1349b3  $source/summary.json" | sha256sum -c -
          echo "cf64cbf65b3e9115aeddc04f8046dedc035b520aa9470d3f88b086b7bd33ebe4  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "f0ae4aad6b49302887b1bdcfb31ca81ff4c563f743e5274cc8512930fabf674e  $source/contact-sheet-megatron.jpg" | sha256sum -c -
          echo "2aaf950d33ca856a3a11f4159a854e114ec46de427ccd7e5d478549d46375d0e  $source/contact-sheet-scooby.jpg" | sha256sum -c -
          echo "6c8eb551fb78ad592ef22e2ad7d811a74e7b806751413717c4bc068f5ed80fa1  $source/pages/frank-welker-official.png" | sha256sum -c -
          echo "2b0d46c769a3fac918c8cecad284717afc3270013abc6caeded6206d850fe3f3  $source/pages/cw-frank-welker-scooby.png" | sha256sum -c -
          echo "2a7057954a3cc04573b9ad11b3414448d57405bc2582a911752fa0375db68068  $source/pages/megatron.png" | sha256sum -c -
          echo "f502778af0d573c795d3b3252cdd849bcbd7504ccafc18061a27dae7ee0377ef  $source/pages/scooby.png" | sha256sum -c -
          echo "cac0be42f8d1560b070805d3fe56dc24229ca43e8051424a440fcc8868f7a12c  $source/api-wikitext/megatron.txt" | sha256sum -c -
          echo "d624735e10ce01face886c3eef40d2312184394f80cde2db0467b4851c18b89e  $source/api-wikitext/scooby.txt" | sha256sum -c -
          echo "dd827891b4de02426e99ec1f9dd92ba87b20deeefd65c13a94cd5be8adda6c96  $source/candidates/megatron/023-file-mtmte1-megatron-throne-jpg.jpg" | sha256sum -c -
          echo "6939abbdc3d4a2c6988acde82ea2a64754fa2ab804b365136c9c94739f9ade4d  $source/candidates/scooby/002-file-scooby-doo-png.webp" | sha256sum -c -
      - name: Render exact two-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-117-render/discovery/card-backfill-uc-117-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-117-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-render"
          node --check scripts/card-backfill-uc-117-render.mjs
          node scripts/card-backfill-uc-117-render.mjs 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-117-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-render/output
            ${{ runner.temp }}/card-backfill-uc-117-render/run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
