name: export-cycle006-chronology-composable-source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/export-cycle006-chronology-composable-source.yml"

permissions:
  contents: read

concurrency:
  group: export-cycle006-chronology-composable-source
  cancel-in-progress: true

env:
  EXACT_MAIN: 013bf301cde81e04621b8190e5424a396013b760
  PRODUCT_HEAD: 571c8e00e96c9a9f96b2fed3b4490c7d62365792
  SELF: .github/workflows/export-cycle006-chronology-composable-source.yml
  RECEIPT_BLOB: a8296f0eb7b1aca1c17ac6724c13a36f6c55d882
  PACKAGE_BLOB: 5fd3f0d9ba5eb8ea7ccbfd4e0ca1c0eb622253a6
  CHECKER_BLOB: 2bd8889c4e35cb710691e5341ed1c36be21f05f9
  OUT: /tmp/cycle006-chronology-composable-source
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-chronology-composable-source-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Bind one-file read-only carrier and exact product identities
        shell: bash
        env:
          CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/data/review/adapter-sdk" "$OUT/scripts"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CARRIER_HEAD}" > "$OUT/carrier-commit.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${PRODUCT_HEAD}" > "$OUT/product-commit.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$OUT/main-ref.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const out = process.env.OUT;
          const carrier = JSON.parse(fs.readFileSync(`${out}/carrier-commit.json`, 'utf8'));
          const product = JSON.parse(fs.readFileSync(`${out}/product-commit.json`, 'utf8'));
          const main = JSON.parse(fs.readFileSync(`${out}/main-ref.json`, 'utf8'));
          const exactMain = process.env.EXACT_MAIN;
          const self = process.env.SELF;
          if (main.object?.sha !== exactMain) throw new Error('main advanced during source repair');
          if (carrier.sha !== process.env.CARRIER_HEAD || carrier.parents?.length !== 1 || carrier.parents[0]?.sha !== exactMain) throw new Error('source carrier ancestry drifted');
          const carrierPaths = (carrier.files || []).map((row) => row.filename).sort();
          if (JSON.stringify(carrierPaths) !== JSON.stringify([self])) throw new Error(`source carrier paths drifted: ${carrierPaths.join(',')}`);
          if (product.sha !== process.env.PRODUCT_HEAD || product.parents?.length !== 1 || product.parents[0]?.sha !== exactMain) throw new Error('product ancestry drifted');
          const expectedProduct = [
            'data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json',
            'package.json',
            'scripts/doctor-who-cycle-006-chronology-composable.mjs',
          ].sort();
          const actualProduct = (product.files || []).map((row) => row.filename).sort();
          if (JSON.stringify(actualProduct) !== JSON.stringify(expectedProduct)) throw new Error(`product paths drifted: ${actualProduct.join(',')}`);
          fs.writeFileSync(`${out}/identity.txt`, `exact_main=${exactMain}\ncarrier_head=${carrier.sha}\nproduct_head=${product.sha}\n`);
          NODE

      - name: Recover exact blobs and pay the fully-resolved-queue review defect
        shell: bash
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1"
            local path="$2"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq '.content' \
              | tr -d '\r\n' \
              | base64 --decode > "$path"
            test "$(git hash-object "$path")" = "$sha"
          }
          fetch_blob "$RECEIPT_BLOB" "$OUT/data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json"
          fetch_blob "$PACKAGE_BLOB" "$OUT/package.json"
          fetch_blob "$CHECKER_BLOB" "$OUT/scripts/doctor-who-cycle-006-chronology-composable.mjs"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const out = process.env.OUT;
          const checkerPath = `${out}/scripts/doctor-who-cycle-006-chronology-composable.mjs`;
          const receiptPath = `${out}/data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json`;
          const packagePath = `${out}/package.json`;
          const before = `const futureAutopilot = structuredClone(autopilot);\nconst futureJob = futureAutopilot.jobs.find((row) => row.scope === "doctor-who" && row.status === "queued");\nassert(futureJob, "future-cycle fixture lacks a queued Doctor Who job");\nfutureJob.status = "resolved";\nfutureJob.wall_ids = ["UC-FUTURE-FIXTURE"];\nvalidateLiveState({ autopilot: futureAutopilot, autopilotJournal, waterline });`;
          const after = `const futureAutopilot = structuredClone(autopilot);\nconst futureJob = futureAutopilot.jobs.find((row) => row.scope === "doctor-who" && row.status === "queued");\nif (futureJob) {\n  futureJob.status = "resolved";\n  futureJob.wall_ids = ["UC-FUTURE-FIXTURE"];\n}\nvalidateLiveState({ autopilot: futureAutopilot, autopilotJournal, waterline });`;
          const originalChecker = fs.readFileSync(checkerPath, 'utf8');
          if (originalChecker.split(before).length !== 2) throw new Error('terminal-queue fixture source cardinality drifted');
          const checker = originalChecker.replace(before, after);
          fs.writeFileSync(checkerPath, checker);

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlob = (bytes) => crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`)).update(bytes).digest('hex');
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const stablePretty = (value) => `${JSON.stringify(stable(value), null, 2)}\n`;

          const checkerBytes = fs.readFileSync(checkerPath);
          const checkerSha256 = sha256(checkerBytes);
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.qualification.checker_sha256 = checkerSha256;
          delete receipt.receipt_sha256;
          receipt.receipt_sha256 = sha256(Buffer.from(stablePretty(receipt)));
          fs.writeFileSync(receiptPath, stablePretty(receipt));

          const packageDoc = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (packageDoc.scripts?.['doctor-who:cycle-006:chronology:check'] !== 'node scripts/doctor-who-cycle-006-chronology-composable.mjs') throw new Error('package checker mapping drifted');
          if (!packageDoc.scripts?.['autopilot:fixtures']?.includes('npm run doctor-who:cycle-006:chronology:check')) throw new Error('package fixture composition drifted');

          const files = [receiptPath, packagePath, checkerPath].map((path) => {
            const bytes = fs.readFileSync(path);
            return { path: path.slice(out.length + 1), bytes: bytes.length, sha256: sha256(bytes), git_blob: gitBlob(bytes) };
          });
          fs.writeFileSync(`${out}/repaired-product.json`, `${JSON.stringify({
            transaction: 'DOCTOR-WHO-CYCLE-006-CHRONOLOGY-COMPOSABILITY-TERMINAL-QUEUE-REPAIR',
            source_product_head: process.env.PRODUCT_HEAD,
            review_thread: 'PRRT_kwDOTQMkzs6WxVmB',
            files,
          }, null, 2)}\n`);
          NODE
          node --check "$OUT/scripts/doctor-who-cycle-006-chronology-composable.mjs"
          sha256sum \
            "$OUT/data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json" \
            "$OUT/package.json" \
            "$OUT/scripts/doctor-who-cycle-006-chronology-composable.mjs" \
            > "$OUT/repaired-product.sha256"

      - name: Upload exact repaired product bytes
        uses: actions/upload-artifact@v4
        with:
          name: cycle006-chronology-composable-repair-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
