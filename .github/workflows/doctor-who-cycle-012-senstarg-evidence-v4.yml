name: doctor-who-cycle-012-senstarg-evidence-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-evidence-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-evidence-v4
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-senstarg-evidence-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      BRANCH: observer/doctor-who-cycle-012-senstarg-evidence-v4
      SELF: .github/workflows/doctor-who-cycle-012-senstarg-evidence-v4.yml
      OUT: /tmp/doctor-who-cycle-012-senstarg-evidence-v4
      V3_PACKET: /tmp/doctor-who-cycle-012-senstarg-evidence-v4-v3
      LOADER: /tmp/doctor-who-cycle-012-senstarg-evidence-v4-loader
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      V3_PR: "868"
      V3_BRANCH: agent/doctor-who-cycle-012-evidence-preflight-v3
      V3_HEAD: 6645b7410675b53f2ac663f8cedd9a7a92c38e38
      V3_RUN: "31369813777"
      V3_JOB: "93396049687"
      V3_ARTIFACT: "9055623682"
      V3_ARTIFACT_NAME: doctor-who-cycle-012-evidence-preflight-v3-diagnostics-31369813777-attempt-1
      V3_ARTIFACT_BYTES: "610199"
      V3_ARTIFACT_FILES: "26"
      V3_ARTIFACT_SHA256: 5ea38aff2da21cf41ff77e147ec2ec073535f5052145dbc4e09471b5361261f0
      V3_SOURCE_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      SOURCE_API_SHA256: 8805e77dcb9d40c4db73fc6b1b5fd54d3d9e8c8a20f5049c62be566a2025ad18
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_CONTENT_BYTES: "1632"
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION_ID: "3243079"
      SOURCE_REVISION_TIMESTAMP: 2022-03-07T11:08:05Z
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      TRANSPORT_IDENTITY: fbe1b123c9ad17a23ff717fbaa47e2f59cc85032fc48a94648eb1d64e20f2da0
      TERMINAL_PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      PRIORITY: "800"
      SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      CARRIER_BLOB: 2614ea8a1a4d91a55232054379a8c18ff0f6f45a
      CARRIER_GZIP_BYTES: "5626"
      CARRIER_GZIP_SHA256: df2f2980388f38e98f36892e1df5ee7c91f7f9079d515c61cbe63ac574f399d8
      CARRIER_BYTES: "22465"
      CARRIER_SHA256: 9bde1f89522453c04b001fc7ae3cc42cb33751ba1849fe478c031707b6ed6bd2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact V4 evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path(os.environ['CARRIER']).read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1):
              compile(block, f'<cycle-012-senstarg-evidence-v4-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-evidence-v4/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-evidence-v4
            /tmp/doctor-who-cycle-012-senstarg-evidence-v4-v3
            /tmp/doctor-who-cycle-012-senstarg-evidence-v4-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
