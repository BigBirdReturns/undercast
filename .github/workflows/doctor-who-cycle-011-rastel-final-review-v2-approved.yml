name: doctor-who-cycle-011-rastel-final-review-v2-approved

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-review-v2-approved.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-review-v2-approved
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-review-v2-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      EXACT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v2-approved
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-review-v2-approved.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved
      PACKET: /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-source
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-worktree
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-bootstrap
      SOURCE_HEAD: 56e5c6f0a02624db9b63248eeb3032c9fb7171a4
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-review-v1.yml
      SOURCE_BLOB: 9b4147a58febf75a90d9de5604e0f028f051bb43
      SOURCE_STEM: doctor-who-cycle-011-rastel-final-review-v1
      TARGET_STEM: doctor-who-cycle-011-rastel-final-review-v2-approved
      OLD_PRODUCER_STEM: doctor-who-cycle-011-rastel-final-product-v3
      PRODUCER_STEM: doctor-who-cycle-011-rastel-final-product-v2-approved
      PRODUCER_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v2-approved
      PRODUCER_WORKFLOW: doctor-who-cycle-011-rastel-final-product-v2-approved
      PRODUCER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-final-product-v2-approved-
      PRODUCER_PR: "810"
      PRODUCER_HEAD: 9df9884e69503303eeb259188ea81f036c6b3dec
      PRODUCER_RUN: "31344933751"
      PRODUCER_ATTEMPT: "1"
      PRODUCT_ARTIFACT: "9047037477"
      PRODUCT_ZIP_SHA256: 0ea2c211fde52bff07d16897c2dc9930727b632867d0343e5f56e3ba3c32d294
      QUALIFICATION_IDENTITY: 6310be38d267151128cfe7db70af84aeb56c5feddc654729762890b1a627311c
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      PRODUCT_FILE_MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_SHA256: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_cc1c8a2f720f9e11f07f9c2d
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact reviewer and bind the approved product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,scripts}
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_HEAD" > "$BOOTSTRAP/api/source.json"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          python3 - <<'PY'
          import base64,hashlib,json,os,re,shlex,subprocess,textwrap,yaml
          from pathlib import Path
          root=Path(os.environ['BOOTSTRAP']); payload=json.loads((root/'api/source.json').read_text())
          raw=base64.b64decode(payload['content'])
          assert payload['sha']==os.environ['SOURCE_BLOB']
          source=root/'source-v1.yml'; source.write_bytes(raw)
          assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip()==os.environ['SOURCE_BLOB']
          doc=yaml.safe_load(raw.decode('utf-8')); job=doc['jobs']['review']
          env={key:str(value) for key,value in job['env'].items() if key!='GH_TOKEN'}
          env.update({
            'SOURCE_MAIN':os.environ['EXACT_MAIN'],'SOURCE_TREE':os.environ['EXACT_TREE'],
            'BRANCH':os.environ['BRANCH'],'SELF':os.environ['SELF'],'OUT':os.environ['OUT'],
            'PACKET':os.environ['PACKET'],'WORKTREE':os.environ['WORKTREE'],
            'PRODUCER_BRANCH':os.environ['PRODUCER_BRANCH'],'PRODUCER_WORKFLOW':os.environ['PRODUCER_WORKFLOW'],
            'PRODUCER_ARTIFACT_PREFIX':os.environ['PRODUCER_ARTIFACT_PREFIX'],
            'EXPECTED_LEASE':os.environ['EXPECTED_LEASE'],
          })
          (root/'env.sh').write_text(''.join(f'export {key}={shlex.quote(value)}\n' for key,value in env.items()))
          expected_names=[
            'Bind review carrier and wait for exact V3 terminal run',
            'Download and authenticate exact successful final-product packet',
            'Independently import bundle and verify every product byte and mode',
            'Rerun complete permanent and rendered product gate',
            'Seal independent approval and publication handoff',
          ]
          rows=[step for step in job['steps'] if 'run' in step]
          assert [row['name'] for row in rows]==expected_names
          scripts=[row['run'] for row in rows]
          old="rows=[row for row in rows if row['head']['ref']==os.environ['PRODUCER_BRANCH'] and row['merged'] is False]"
          new="rows=[row for row in rows if row['head']['ref']==os.environ['PRODUCER_BRANCH'] and row.get('merged_at') is None]"
          assert sum(script.count(old) for script in scripts)==1
          dollar='$'; out=[]; facts=[]
          for index,script in enumerate(scripts,1):
              script=script.replace(old,new)
              script=script.replace(os.environ['SOURCE_STEM'],os.environ['TARGET_STEM'])
              script=script.replace(os.environ['OLD_PRODUCER_STEM'],os.environ['PRODUCER_STEM'])
              script=script.replace('cycle-011-rastel-final-product-v3','cycle-011-rastel-final-product-v2-approved')
              script=script.replace("head='"+dollar+"{{ github.event.pull_request.head.sha }}'",'head="$CURRENT_HEAD"')
              script=script.replace("pr='"+dollar+"{{ github.event.pull_request.number }}'",'pr="$CURRENT_PR"')
              script=script.replace("base='"+dollar+"{{ github.event.pull_request.base.sha }}'",'base="$CURRENT_BASE"')
              assert dollar+'{{ github.event.pull_request.' not in script
              path=root/'scripts'/f'{index:02d}.sh'; path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",script,re.S)
              for n,block in enumerate(blocks,1): compile(textwrap.dedent(block),f'<review-v2-script-{index}-python-{n}>','exec')
              facts.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'embedded_python':len(blocks)})
          joined='\n'.join(scripts)
          assert "row['merged'] is False" in joined and "own['merged'] is False" in joined
          receipt={
            'version':2,
            'status':'cycle-011-rastel-final-review-v2-source-recovered',
            'source':{'head':os.environ['SOURCE_HEAD'],'path':os.environ['SOURCE_PATH'],'git_blob':os.environ['SOURCE_BLOB'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},
            'repair':{'old':"list item row['merged'] is False",'new':"row.get('merged_at') is None",'occurrences':1,'full_object_merged_predicates_retained':True},
            'producer':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'attempt':int(os.environ['PRODUCER_ATTEMPT']),'artifact':int(os.environ['PRODUCT_ARTIFACT']),'artifact_sha256':os.environ['PRODUCT_ZIP_SHA256']},
            'expected_product':{'commit':os.environ['PRODUCT_COMMIT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'qualification_identity':os.environ['QUALIFICATION_IDENTITY']},
            'scripts':facts,
            'boundary':{'repository_write':False,'product_publication':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'source-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute independent exact-product review
        shell: bash
        run: |
          set -euo pipefail
          source "$BOOTSTRAP/env.sh"
          export CURRENT_HEAD='${{ github.event.pull_request.head.sha }}'
          export CURRENT_PR='${{ github.event.pull_request.number }}'
          export CURRENT_BASE='${{ github.event.pull_request.base.sha }}'
          : > "$GITHUB_ENV"
          apply_github_env() {
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1;; *=*) export "$row";; esac
            done < "$GITHUB_ENV"
            : > "$GITHUB_ENV"
          }
          bash "$BOOTSTRAP/scripts/01.sh"
          apply_github_env
          test "$PRODUCER_PR" = "${{ env.PRODUCER_PR }}"
          test "$PRODUCER_HEAD" = "${{ env.PRODUCER_HEAD }}"
          test "$PRODUCER_RUN" = "${{ env.PRODUCER_RUN }}"
          test "$PRODUCER_ATTEMPT" = "${{ env.PRODUCER_ATTEMPT }}"
          test "$PRODUCER_CONCLUSION" = success
          bash "$BOOTSTRAP/scripts/02.sh"
          apply_github_env
          test "$PRODUCT_ARTIFACT" = "${{ env.PRODUCT_ARTIFACT }}"
          test "$PRODUCT_ZIP_SHA256" = "${{ env.PRODUCT_ZIP_SHA256 }}"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          path=Path(os.environ['OUT'])/'receipt/source-final-product.json'; data=json.loads(path.read_text())
          identity=data.pop('identity')
          assert identity==os.environ['QUALIFICATION_IDENTITY']
          assert hashlib.sha256(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==identity
          data['identity']=identity
          assert data['status']=='cycle-011-rastel-receipt-bearing-product-qualified'
          assert data['canonical_parent']==os.environ['EXACT_MAIN']
          assert data['carrier']=={'attempt':1,'head':os.environ['PRODUCER_HEAD'],'pr':int(os.environ['PRODUCER_PR']),'run':int(os.environ['PRODUCER_RUN'])}
          assert data['product']=={
            'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'commit':os.environ['PRODUCT_COMMIT'],
            'file_manifest_sha256':os.environ['PRODUCT_FILE_MANIFEST_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],
            'paths':int(os.environ['PRODUCT_PATHS']),'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'tree':os.environ['PRODUCT_TREE']}
          assert data['finalization']['cycle_id']==os.environ['CYCLE_ID']
          assert data['finalization']['cycle_event_id']==os.environ['WATERLINE_EVENT']
          assert data['finalization']['receipt_sha256']==os.environ['RECEIPT_SHA256']
          assert data['finalization']['receipt_file_sha256']==os.environ['RECEIPT_FILE_SHA256']
          assert data['queue_after']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert data['boundary']=={'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False,'product_merged':False,'product_published':False,'repository_write':False,'twelfth_lease_issued':False}
          PY
          bash "$BOOTSTRAP/scripts/03.sh"
          apply_github_env
          test "$PRODUCT" = "${{ env.PRODUCT_COMMIT }}"
          test "$PRODUCT_TREE" = "${{ env.PRODUCT_TREE }}"
          test "$PRODUCT_PATHS" = "${{ env.PRODUCT_PATHS }}"
          bash "$BOOTSTRAP/scripts/04.sh"
          apply_github_env
          cp "$BOOTSTRAP/source-recovery.json" "$OUT/receipt/final-review-v2-source-recovery.json"
          bash "$BOOTSTRAP/scripts/05.sh"
          apply_github_env
          test "$(sha256sum "$OUT/handoff/product.bundle" | awk '{print $1}')" = "$PRODUCT_BUNDLE_SHA256"
          test "$(sha256sum "$OUT/handoff/product.patch" | awk '{print $1}')" = "$PRODUCT_PATCH_SHA256"
          test "$(sha256sum "$OUT/handoff/product.tar" | awk '{print $1}')" = "$PRODUCT_TAR_SHA256"
          test "$(sha256sum "$OUT/handoff/file-manifest.json" | awk '{print $1}')" = "$PRODUCT_FILE_MANIFEST_SHA256"
          (
            cd "$OUT"
            rm -f SHA256SUMS.pre SHA256SUMS
            find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
          )
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v2-approved-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v2-approved-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved
            /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-source
            /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-worktree
            /tmp/doctor-who-cycle-011-rastel-final-review-v2-approved-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
