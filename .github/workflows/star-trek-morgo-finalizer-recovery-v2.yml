name: star-trek-morgo-finalizer-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-morgo-finalizer-recovery-v2

permissions:
  actions: write
  contents: write

concurrency:
  group: star-trek-morgo-finalizer-recovery-v2
  cancel-in-progress: false

env:
  LIVE_MAIN: 5e89a0ba59f36feae7986a9260b8fa17a824a8b7
  LIVE_TREE: 0819bd9ace59e2d8cf8721a5acd1f5de5498cd87
  LIVE_MESSAGE: "Media search: record rolling candidate attempt (2026-08-26)"
  PREDECESSOR_PRODUCT: 5afac948405d67c94090f2da55a510689e5eb583
  PREDECESSOR_TREE: 639b57c87ca23e895ec730099c0ce937eb1b88da
  CLAIM_BRANCH: agent/star-trek-morgo-claim-result-v1
  CLAIM_COMMIT: 645b066b25309e1e8bdc2f13f64b8a04f95bfa96
  CLAIM_TREE: 408a69a0af29dea5052db22b564f63939c43f7a8
  CLAIM_RECEIPT_SHA: dd0f6787c555c110185bc8b5cc2b234e299791401b9bdec6a0088ba6a5217fb4
  SOURCE_REVIEW_BRANCH: agent/star-trek-morgo-source-review-result-v1
  SOURCE_REVIEW_COMMIT: 7198f9c272dbb1806fb6d2b6b09e889d4e57e7b0
  SOURCE_REVIEW_SHA: 603a4bdab4b58086d94c1d99751a749802d054659f1c16d04b15c7b111a83c5d
  SOURCE_REVIEW_PATH: transport/star-trek-morgo-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-morgo-media-result-v4
  MEDIA_COMMIT: 650234b00447c84eb86d36dfbb52f533c0a63202
  MEDIA_RECEIPT_SHA: fb9b1fc40b507a133483ec220627de1595ee97c33483bf437d641355773eec15
  MEDIA_PATH: transport/star-trek-morgo-media-v4/media-receipt.json
  MEDIA_REVIEW_BRANCH: agent/star-trek-morgo-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 605d2cb6a6f459d1bb994d004bbec20cb78ebde7
  MEDIA_REVIEW_SHA: f6f4ef76e5fa82554109621910242bb630e7aa18aee6321cca53552782113ecb
  MEDIA_REVIEW_PATH: transport/star-trek-morgo-media-review-v1/media-review.json
  CANDIDATE_BRANCH: agent/star-trek-morgo-candidate-v1
  CANDIDATE_COMMIT: 55e96dffe77c9562fa0b63c12cc58016db63754b
  CANDIDATE_TREE: e225af43510b2ee5ede543fce5e8c0a263434be9
  CANDIDATE_RECEIPT_SHA: 3c5de16f13d0c758a1577e64b98007dc7c4968077fa45d66e8cea4d06eeb5295
  CANDIDATE_PATH: data/review/adapter-sdk/star-trek-morgo-candidate.json
  REVIEW_BRANCH: agent/star-trek-morgo-independent-review-result-v2
  REVIEW_COMMIT: bac4761cd0704dfb935feafb781b01e25bf6d2df
  REVIEW_TREE: d9e5b4a9a8c434b82079dfb76c61ac6725195b9a
  REVIEW_SHA: 1844a2f723931c348bc9659415b987b67d3b1449e62b8219484f9ad4a42173e0
  REVIEW_PATH: transport/star-trek-morgo-independent-product-review-v2/independent-review.json
  TASK_ID: ap_a7fb29c5cce85c86708ea0e6
  PERFORMER: Fred Tatasciore
  CHARACTER: Morgo
  FINGERPRINT: 279c816ebd1b83899f5b257f7880df5734bb855f4206c2fc92c5278c9370ff46
  LEASE_ID: lease_578930730585295673ca706d
  WALL_ID: UC-1398
  STILL_SHA: d9e6600f5b4c56540329bddd824b6d8392193f9c19cafebb6187d2872c21f548
  PORTRAIT_SHA: ae19bcd09869d848fd74202fcc3c59ac41dbef153f7a33844c278b91b8d4ea5f
  STILL_ITEM: ma_4cf320b41ba67ad4dbe2f5dd
  PORTRAIT_ITEM: ma_8254f59b1cc6004f0fa5f1a2
  PREDECESSOR_RECEIPT_PATH: data/review/adapter-sdk/star-trek-benbassat-cycle.json
  PREDECESSOR_RECEIPT_SHA: c7cde25b13b7f1eb48b808d38b1a4744a5f8300e9d2f2ccd14507f14de16cc32
  PREDECESSOR_CHECKER_PATH: scripts/star-trek-benbassat-cycle.mjs
  PREDECESSOR_CHECKER_SHA: 85b92e61756b49afd6e56bf3240bec4fe3224a16015c5270f7ee3f9d0562eeb3
  PREDECESSOR_CYCLE_ID: cycle_e314148f23e9a9ee10424775
  RECEIPT_PATH: data/review/adapter-sdk/star-trek-morgo-cycle.json
  CHECKER_PATH: scripts/star-trek-morgo-cycle.mjs
  PRODUCT_MESSAGE: "Star Trek: publish Morgo cycle"
  RESULT_BRANCH: agent/star-trek-morgo-finalizer-result-v2
  FINALIZER_PARTS_ROOT: .github/recovery/star-trek-morgo-finalizer-recovery-v2
  FINALIZER_SHA256: 80a4e1fd81658d845a660159c05bd2762c0fdfbb3a818473c72d531bf194109d
  FINALIZER: /tmp/star-trek-morgo-finalizer-recovery-v2.py
  OUT: /tmp/star-trek-morgo-finalizer-v2

jobs:
  finalize:
    name: finalize-reviewed-morgo-cycle-v2
    if: ${{ github.event.head_commit.message == 'Finalize reviewed Star Trek Morgo cycle v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and externalize the sealed finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          while read -r digest relative; do
            test -f "$relative"
            test "$(sha256sum "$relative" | awk '{print $1}')" = "$digest"
          done < .github/recovery/star-trek-morgo-finalizer-recovery-v2/sealed-manifest.sha256

          cat "$FINALIZER_PARTS_ROOT"/finalizer.part[0-9][0-9] > "$FINALIZER"
          chmod +x "$FINALIZER"
          test "$(sha256sum "$FINALIZER" | awk '{print $1}')" = "$FINALIZER_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["FINALIZER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Fetch and freeze immutable Morgo inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"

          git fetch --no-tags origin             main             "$CLAIM_BRANCH"             "$SOURCE_REVIEW_BRANCH"             "$MEDIA_BRANCH"             "$MEDIA_REVIEW_BRANCH"             "$CANDIDATE_BRANCH"             "$REVIEW_BRANCH"

          test "$(git rev-parse refs/remotes/origin/main)" = "$LIVE_MAIN"
          test "$(git show -s --format=%T "$LIVE_MAIN")" = "$LIVE_TREE"
          test "$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse "refs/remotes/origin/${REVIEW_BRANCH}")" = "$REVIEW_COMMIT"
          test "$(git show -s --format=%T "$REVIEW_COMMIT")" = "$REVIEW_TREE"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git show "refs/remotes/origin/${CLAIM_BRANCH}:data/review/adapter-sdk/star-trek-morgo-claim.json" > "$OUT/claim-receipt.json"
          git show "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}:${SOURCE_REVIEW_PATH}" > "$OUT/source-review.json"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:${MEDIA_PATH}" > "$OUT/media-receipt.json"
          git show "refs/remotes/origin/${MEDIA_REVIEW_BRANCH}:${MEDIA_REVIEW_PATH}" > "$OUT/media-review.json"
          git show "refs/remotes/origin/${CANDIDATE_BRANCH}:${CANDIDATE_PATH}" > "$OUT/candidate-receipt.json"
          git show "refs/remotes/origin/${REVIEW_BRANCH}:${REVIEW_PATH}" > "$OUT/independent-review.json"

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-before.json"
          test "$(jq -r .commit.sha "$OUT/main-before.json")" = "$LIVE_MAIN"

      - name: Build and qualify the deterministic Morgo product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$FINALIZER" prepare | tee "$OUT/finalizer.log"
          test -s "$OUT/product-commit.txt"
          test -s "$OUT/product-tree.txt"
          test -s "$OUT/receipt-sha256.txt"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload prepared finalizer evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-morgo-finalizer-v2
          path: /tmp/star-trek-morgo-finalizer-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Publish, deploy, and seal the Morgo cycle
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail

          product_commit="$(cat "$OUT/product-commit.txt")"
          product_tree="$(cat "$OUT/product-tree.txt")"
          receipt_sha="$(cat "$OUT/receipt-sha256.txt")"
          checker_sha="$(cat "$OUT/checker-sha256.txt")"
          cycle_id="$(cat "$OUT/cycle-id.txt")"

          main_now="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if test "$main_now" = "$LIVE_MAIN"; then
            git push origin "$product_commit:refs/heads/main"
          elif test "$main_now" != "$product_commit"; then
            echo "main moved outside the deterministic Morgo publication boundary: $main_now" >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            observed="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            test "$observed" = "$product_commit" && break
            sleep 2
          done
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$product_commit"

          pages_run="$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?event=workflow_dispatch&branch=main&per_page=50"               --jq ".workflow_runs[] | select(.head_sha == \"$product_commit\") | .id"               | head -n 1
          )"
          if test -z "$pages_run"; then
            gh workflow run pages.yml --ref main
          fi

          pages_run=""
          for attempt in $(seq 1 120); do
            pages_run="$(
              gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?event=workflow_dispatch&branch=main&per_page=50"                 --jq ".workflow_runs[] | select(.head_sha == \"$product_commit\") | .id"                 | head -n 1
            )"
            test -n "$pages_run" && break
            sleep 5
          done
          test -n "$pages_run"

          for attempt in $(seq 1 180); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/$pages_run" > "$OUT/pages-run.json"
            status="$(jq -r .status "$OUT/pages-run.json")"
            test "$status" = completed && break
            sleep 10
          done
          test "$(jq -r .status "$OUT/pages-run.json")" = completed
          test "$(jq -r .conclusion "$OUT/pages-run.json")" = success
          test "$(jq -r .head_sha "$OUT/pages-run.json")" = "$product_commit"

          git checkout --detach "$product_commit"
          npm ci --ignore-scripts
          node "$CHECKER_PATH"
          node scripts/waterline.mjs validate
          node scripts/thesis-rails.mjs next --json > "$OUT/next-after-publication.json"
          diff -u "$OUT/next.json" "$OUT/next-after-publication.json"

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$product_commit"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          out = Path(os.environ["OUT"])
          pages = json.loads((out / "pages-run.json").read_text())
          next_doc = json.loads((out / "next.json").read_text())
          publication = {
              "version": 2,
              "transaction": "STAR-TREK-MORGO-TERMINAL-PUBLICATION-V2",
              "status": "published-and-deployed",
              "canonical": {
                  "commit": (out / "product-commit.txt").read_text().strip(),
                  "tree": (out / "product-tree.txt").read_text().strip(),
                  "parent": os.environ["LIVE_MAIN"],
                  "message": os.environ["PRODUCT_MESSAGE"],
              },
              "task": {
                  "id": os.environ["TASK_ID"],
                  "lease_id": os.environ["LEASE_ID"],
                  "wall_id": os.environ["WALL_ID"],
                  "performer": os.environ["PERFORMER"],
                  "character": os.environ["CHARACTER"],
              },
              "receipt": {
                  "path": os.environ["RECEIPT_PATH"],
                  "sha256": (out / "receipt-sha256.txt").read_text().strip(),
                  "checker_path": os.environ["CHECKER_PATH"],
                  "checker_sha256": (out / "checker-sha256.txt").read_text().strip(),
              },
              "reviewed_cycle_id": (out / "cycle-id.txt").read_text().strip(),
              "independent_review": {
                  "branch": os.environ["REVIEW_BRANCH"],
                  "commit": os.environ["REVIEW_COMMIT"],
                  "review_sha256": os.environ["REVIEW_SHA"],
              },
              "prepared_artifact": {
                  "id": int(os.environ["ARTIFACT_ID"]),
                  "digest": os.environ["ARTIFACT_DIGEST"],
              },
              "pages": {
                  "run_id": pages["id"],
                  "status": pages["status"],
                  "conclusion": pages["conclusion"],
                  "head_sha": pages["head_sha"],
              },
              "queue": {
                  "total": 2228,
                  "queued": 1796,
                  "resolved": 430,
                  "blocked": 0,
                  "rejected": 2,
                  "in_flight": 0,
              },
              "next": next_doc,
              "boundary": {
                  "canonical_mutation_complete": True,
                  "exact_head_deployment_complete": True,
                  "additional_lease_issued": False,
                  "successor_claimed": False,
              },
          }
          (out / "publication.json").write_text(
              json.dumps(publication, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          result_now="$(git ls-remote origin "refs/heads/${RESULT_BRANCH}" | awk '{print $1}')"
          if test -z "$result_now"; then
            git config user.name undercast-morgo-terminalizer-v2
            git config user.email undercast-morgo-terminalizer-v2@users.noreply.github.com
            git checkout --orphan morgo-finalizer-result-v2
            git rm -rf .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            mkdir -p transport/star-trek-morgo-terminal-v2
            cp -a "$OUT"/. transport/star-trek-morgo-terminal-v2/
            git add transport/star-trek-morgo-terminal-v2
            GIT_AUTHOR_DATE="2026-08-26T19:55:42Z"             GIT_COMMITTER_DATE="2026-08-26T19:55:42Z"               git commit -m "Record terminal Star Trek Morgo cycle v2"
            git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
          else
            git show "${result_now}:transport/star-trek-morgo-terminal-v2/publication.json" > /tmp/existing-morgo-publication.json
            test "$(jq -r .canonical.commit /tmp/existing-morgo-publication.json)" = "$product_commit"
            test "$(jq -r .receipt.sha256 /tmp/existing-morgo-publication.json)" = "$receipt_sha"
          fi
