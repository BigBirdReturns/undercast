name: star-trek-rolling-bootstrap-driver-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-bootstrap-driver-v1
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  drive:
    name: unitstar-trek-rolling-bootstrap-driver-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      BOUNDED_BRANCH: agent/star-trek-next-bounded-cycle-claim
      BOOTSTRAP_RESULT: agent/star-trek-post-kzinti-cycle-result-v1
      KUKULKAN: 47296e8a7947384b04275962b8f6a125e5306680
      ROOT: /tmp/star-trek-rolling-bootstrap-driver-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconcile bootstrap carriers against live main
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          live_sha="$(jq -r .sha <<<"$live")"
          live_message="$(jq -r .commit.message <<<"$live")"
          printf '%s\n' "$live" | jq . > "$ROOT/live-main.json"

          all="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f per_page=100)"
          printf '%s\n' "$all" | jq . > "$ROOT/runs.json"
          jq -r --argjson self "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id != $self and .status != "completed" and .head_branch == "agent/star-trek-next-bounded-cycle-claim") | .id' <<<"$all" | awk 'NR>12' | while read -r id; do
            test -z "$id" || gh run cancel "$id" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          done

          if test "$live_sha" = "$KUKULKAN"; then
            jq -n --arg status waiting --arg stage lwaxana-rejection --arg live "$live_sha" '{status:$status,stage:$stage,live_main:$live}' > "$ROOT/disposition.json"
            exit 0
          fi

          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$live_sha"
          git checkout --detach "$live_sha"
          npm ci --ignore-scripts
          mapfile -t checkers < <(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^scripts/star-trek-.*-cycle\.mjs$' | LC_ALL=C sort -u)
          test "${#checkers[@]}" = 1
          checker="${checkers[0]}"
          node "$checker" | tee "$ROOT/live-checker.log"
          node scripts/thesis-rails.mjs next --json > "$ROOT/thesis-next.json"

          if grep -Fq 'Lwaxana' <<<"$live_message"; then
            expected='star-trek-kzinti-flyer-probe-v2|star-trek-kzinti-flyer-media-v1|star-trek-kzinti-flyer-cycle-v1'
            active="$(jq --arg branch "$BOUNDED_BRANCH" --arg re "$expected" '[.workflow_runs[] | select(.head_branch == $branch and .status != "completed" and ((.name // "") | test($re)))] | length' <<<"$all")"
            if test "$active" = 0; then
              git fetch --filter=blob:none --no-tags origin "$BOUNDED_BRANCH"
              git checkout -B "$BOUNDED_BRANCH" FETCH_HEAD
              mkdir -p transport/star-trek-bootstrap-heartbeats
              count="$(find transport/star-trek-bootstrap-heartbeats -type f -name 'kzinti-*' 2>/dev/null | wc -l | tr -d ' ')"
              jq -n --argjson version 1 --arg transaction STAR-TREK-KZINTI-BOOTSTRAP-HEARTBEAT-V1 --argjson driver_run "$GITHUB_RUN_ID" --arg live_main "$live_sha" --argjson sequence "$((count+1))" '{version:$version,transaction:$transaction,driver_run:$driver_run,live_main:$live_main,sequence:$sequence}' > "transport/star-trek-bootstrap-heartbeats/kzinti-$((count+1)).json"
              git config user.name undercast-star-trek-bootstrap-driver
              git config user.email bootstrap-driver@users.noreply.github.com
              git add transport/star-trek-bootstrap-heartbeats
              git commit -m 'Star Trek: wake exact Kzinti Flyer bootstrap carriers'
              git push origin "HEAD:refs/heads/${BOUNDED_BRANCH}"
            fi
            jq -n --arg status waiting --arg stage kzinti-flyer --arg live "$live_sha" --argjson active "$active" '{status:$status,stage:$stage,live_main:$live,active_runs:$active}' > "$ROOT/disposition.json"
            exit 0
          fi

          if test "$live_message" = 'Star Trek: publish Kzinti Flyer cycle'; then
            expected='star-trek-post-kzinti-probe-v1|star-trek-post-kzinti-media-v1|star-trek-post-kzinti-cycle-v1'
            active="$(jq --arg branch "$BOUNDED_BRANCH" --arg re "$expected" '[.workflow_runs[] | select(.head_branch == $branch and .status != "completed" and ((.name // "") | test($re)))] | length' <<<"$all")"
            if test "$active" = 0; then
              git fetch --filter=blob:none --no-tags origin "$BOUNDED_BRANCH"
              git checkout -B "$BOUNDED_BRANCH" FETCH_HEAD
              mkdir -p transport/star-trek-bootstrap-heartbeats
              count="$(find transport/star-trek-bootstrap-heartbeats -type f -name 'post-kzinti-*' 2>/dev/null | wc -l | tr -d ' ')"
              jq -n --argjson version 1 --arg transaction STAR-TREK-POST-KZINTI-BOOTSTRAP-HEARTBEAT-V1 --argjson driver_run "$GITHUB_RUN_ID" --arg live_main "$live_sha" --argjson sequence "$((count+1))" '{version:$version,transaction:$transaction,driver_run:$driver_run,live_main:$live_main,sequence:$sequence}' > "transport/star-trek-bootstrap-heartbeats/post-kzinti-$((count+1)).json"
              git config user.name undercast-star-trek-bootstrap-driver
              git config user.email bootstrap-driver@users.noreply.github.com
              git add transport/star-trek-bootstrap-heartbeats
              git commit -m 'Star Trek: wake exact post-Kzinti bootstrap carriers'
              git push origin "HEAD:refs/heads/${BOUNDED_BRANCH}"
            fi
            jq -n --arg status waiting --arg stage post-kzinti --arg live "$live_sha" --argjson active "$active" '{status:$status,stage:$stage,live_main:$live,active_runs:$active}' > "$ROOT/disposition.json"
            exit 0
          fi

          parent="$(jq -r .parents[0].sha <<<"$live")"
          parent_commit="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${parent}")"
          test "$(jq -r .commit.message <<<"$parent_commit")" = 'Star Trek: publish Kzinti Flyer cycle'
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/waterline.mjs validate
          node scripts/corpus-ops.mjs validate
          pages_all="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs" -f branch=main -f per_page=100)"
          pages="$(jq -c --arg sha "$live_sha" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' <<<"$pages_all")"
          test -n "$pages"
          pages_run="$(jq -r .id <<<"$pages")"
          tree="$(jq -r .commit.tree.sha <<<"$live")"

          if ! gh api "/repos/${GITHUB_REPOSITORY}/branches/${BOOTSTRAP_RESULT//\//%2F}" >/dev/null 2>&1; then
            git checkout -B "$BOOTSTRAP_RESULT"
            rm -rf transport/post-kzinti-cycle-v1
            mkdir -p transport/post-kzinti-cycle-v1
            jq -n --argjson version 1 --arg transaction STAR-TREK-POST-KZINTI-INDEPENDENT-BOOTSTRAP-V1 --arg status success --argjson workflow_run "$GITHUB_RUN_ID" --arg product_commit "$live_sha" --arg product_tree "$tree" --arg canonical_parent "$parent" --argjson pages_run "$pages_run" '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,independent_bootstrap:true,product:{commit:$product_commit,tree:$product_tree,parent:$canonical_parent,pages_run:$pages_run}}' > transport/post-kzinti-cycle-v1/execution.json
            cp "$ROOT/thesis-next.json" transport/post-kzinti-cycle-v1/thesis-next.json
            git config user.name undercast-star-trek-bootstrap-driver
            git config user.email bootstrap-driver@users.noreply.github.com
            git add transport/post-kzinti-cycle-v1
            git commit -m 'Star Trek: publish independently verified post-Kzinti bootstrap result'
            git push --force origin "HEAD:refs/heads/${BOOTSTRAP_RESULT}"
          fi
          jq -n --arg status ready --arg stage rolling --arg live "$live_sha" --arg parent "$parent" --argjson pages "$pages_run" '{status:$status,stage:$stage,live_main:$live,parent:$parent,pages_run:$pages}' > "$ROOT/disposition.json"

      - name: Upload bootstrap-driver evidence
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-rolling-bootstrap-driver-${{ github.run_id }}
          path: /tmp/star-trek-rolling-bootstrap-driver-v1/
          if-no-files-found: error
          retention-days: 14
