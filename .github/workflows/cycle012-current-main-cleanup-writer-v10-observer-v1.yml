name: cycle012-current-main-cleanup-writer-v10-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-current-main-cleanup-writer-v10-observer-v1.yml"

permissions: {}

concurrency:
  group: cycle012-current-main-cleanup-writer-v10-observer-v1
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-current-main-cleanup-writer-v10-observer-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      SOURCE_EVIDENCE_RUN: "31468664898"
      SOURCE_EVIDENCE_HEAD: 84173bd990c2197f0f66ff0c959dd43bdd0d7840
      WRITER_WORKFLOW: doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      WRITER_NAME: doctor-who-cycle-012-selection-cleanup-writer-v10
      EVIDENCE_PR: "923"
      OUT: /tmp/cycle012-current-main-cleanup-writer-v10-observer-v1

    steps:
      - name: Census exact post-evidence writer run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,logs,payload}
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$CURRENT_BASE...$CURRENT_HEAD" > "$OUT/api/own-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_EVIDENCE_RUN" > "$OUT/api/source-evidence-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$WRITER_WORKFLOW/runs?per_page=100" > "$OUT/api/writer-runs.json"
          OWN_PR="$OUT/api/own-pr.json" OWN_COMPARE="$OUT/api/own-compare.json" SOURCE="$OUT/api/source-evidence-run.json" RUNS="$OUT/api/writer-runs.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr=json.loads(Path(os.environ['OWN_PR']).read_text())
          compare=json.loads(Path(os.environ['OWN_COMPARE']).read_text())
          source=json.loads(Path(os.environ['SOURCE']).read_text())
          runs=json.loads(Path(os.environ['RUNS']).read_text())['workflow_runs']
          assert pr['number']==int(os.environ['CURRENT_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['ref']=='observer/cycle012-current-main-cleanup-writer-v10-observer-v1'
          assert pr['head']['sha']==os.environ['CURRENT_HEAD'] and pr['base']['sha']==os.environ['CURRENT_BASE']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert [(f['filename'],f['status']) for f in compare['files']]==[('.github/workflows/cycle012-current-main-cleanup-writer-v10-observer-v1.yml','added')]
          assert source['id']==int(os.environ['SOURCE_EVIDENCE_RUN']) and source['status']=='completed' and source['conclusion']=='success'
          assert source['head_sha']==os.environ['SOURCE_EVIDENCE_HEAD']
          candidates=[r for r in runs if r['name']==os.environ['WRITER_NAME'] and r['event']=='workflow_run' and r['id']>source['id']]
          candidates.sort(key=lambda r:r['id'],reverse=True)
          terminal=[r for r in candidates if r['status']=='completed']
          assert terminal
          chosen=terminal[0]
          Path(os.environ['OUT'],'api','writer-run-id.txt').write_text(str(chosen['id'])+'\n')
          Path(os.environ['OUT'],'api','writer-run-summary.json').write_text(json.dumps(chosen,indent=2,sort_keys=True)+'\n')
          PY
          writer_run="$(cat "$OUT/api/writer-run-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" > "$OUT/api/evidence-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          JOBS="$OUT/api/writer-jobs.json" ARTIFACTS="$OUT/api/writer-artifacts.json" RUN="$OUT/api/writer-run-summary.json" PR="$OUT/api/evidence-pr.json" MAIN="$OUT/api/main-ref.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs=json.loads(Path(os.environ['JOBS']).read_text())['jobs']
          artifacts=json.loads(Path(os.environ['ARTIFACTS']).read_text())['artifacts']
          run=json.loads(Path(os.environ['RUN']).read_text())
          pr=json.loads(Path(os.environ['PR']).read_text())
          main=json.loads(Path(os.environ['MAIN']).read_text())
          write=[j for j in jobs if j['name']=='write']
          assert len(write)==1 and write[0]['status']=='completed' and write[0]['conclusion'] in {'failure','success'}
          result={
            'status':'cycle-012-current-main-cleanup-writer-v10-observed',
            'version':1,
            'run':{'id':run['id'],'status':run['status'],'conclusion':run['conclusion'],'head_sha':run['head_sha'],'head_branch':run['head_branch'],'event':run['event']},
            'job':{'id':write[0]['id'],'status':write[0]['status'],'conclusion':write[0]['conclusion'],'steps':write[0].get('steps',[])},
            'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts],
            'evidence_pr':{'number':pr['number'],'state':pr['state'],'merged':pr['merged'],'head':pr['head']['sha']},
            'main':main['object']['sha'],
          }
          Path(os.environ['OUT'],'payload','observation.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          Path(os.environ['OUT'],'api','writer-job-id.txt').write_text(str(write[0]['id'])+'\n')
          PY
          job_id="$(cat "$OUT/api/writer-job-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$OUT/logs/writer.log"
          cp "$OUT/api/writer-run-summary.json" "$OUT/payload/"
          cp "$OUT/api/writer-jobs.json" "$OUT/payload/"
          cp "$OUT/api/writer-artifacts.json" "$OUT/payload/"
          cp "$OUT/api/evidence-pr.json" "$OUT/payload/"
          cp "$OUT/api/main-ref.json" "$OUT/payload/"
          cp "$OUT/logs/writer.log" "$OUT/payload/"
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            printf 'observed\n' > OBSERVATION_COMPLETE
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-current-main-cleanup-writer-v10-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-current-main-cleanup-writer-v10-observer-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  retire:
    needs: retain
    if: ${{ always() && needs.retain.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BRANCH: observer/cycle012-current-main-cleanup-writer-v10-observer-v1
    steps:
      - name: Close and delete only this observer
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CURRENT_BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" --jq '.head.sha')" = "$CURRENT_HEAD"
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$CURRENT_BRANCH"
