name: doctor-who-cycle-012-senstarg-materializer-derivation-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-materializer-derivation-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-materializer-derivation-v1
  cancel-in-progress: true

jobs:
  derive:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-materializer-derivation-v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      LAUNCHER_TEXT_BLOB: 9c97463878f51fc547d8a7169aea8bb3f2640bfe
      LAUNCHER_B64_BYTES: "3952"
      LAUNCHER_B64_SHA256: cbd80e1d1196442d8230b584b6b285757b3d9e51db51484e36195d396ad24390
      LAUNCHER_GZIP_BYTES: "2962"
      LAUNCHER_GZIP_SHA256: 1fa01790464891a33cbd041a0e73caaeeddf43385b7b9f01801627be29a1f166
      LAUNCHER_BYTES: "7349"
      LAUNCHER_SHA256: e8e1256c902f275cf108efdb0bc10b9a7de78fc2ac3c201c74a13f73338b4216
      LOADER: /tmp/doctor-who-cycle-012-senstarg-materializer-derivation-v1-launcher
    steps:
      - name: Reconstruct and execute exact textual clean-main derivation launcher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$LAUNCHER_TEXT_BLOB" > "$LOADER/blob.json"
          jq -r '.content' "$LOADER/blob.json" | tr -d '\n' | base64 -d > "$LOADER/launcher.sh.gz.b64"
          test "$(git hash-object --stdin < "$LOADER/launcher.sh.gz.b64")" = "$LAUNCHER_TEXT_BLOB"
          test "$(wc -c < "$LOADER/launcher.sh.gz.b64" | tr -d ' ')" = "$LAUNCHER_B64_BYTES"
          test "$(sha256sum "$LOADER/launcher.sh.gz.b64" | awk '{print $1}')" = "$LAUNCHER_B64_SHA256"
          base64 -d "$LOADER/launcher.sh.gz.b64" > "$LOADER/launcher.sh.gz"
          test "$(wc -c < "$LOADER/launcher.sh.gz" | tr -d ' ')" = "$LAUNCHER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/launcher.sh.gz" | awk '{print $1}')" = "$LAUNCHER_GZIP_SHA256"
          gzip -t "$LOADER/launcher.sh.gz"
          gzip -dc "$LOADER/launcher.sh.gz" > "$LOADER/launcher.sh"
          test "$(wc -c < "$LOADER/launcher.sh" | tr -d ' ')" = "$LAUNCHER_BYTES"
          test "$(sha256sum "$LOADER/launcher.sh" | awk '{print $1}')" = "$LAUNCHER_SHA256"
          bash -n "$LOADER/launcher.sh"
          chmod 700 "$LOADER/launcher.sh"
          "$LOADER/launcher.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-derivation-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-materializer-derivation-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-derivation-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-materializer-derivation-v1
            /tmp/doctor-who-cycle-012-senstarg-materializer-derivation-v1-launcher
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
