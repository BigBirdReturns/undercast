name: doctor-who-cycle-009-megnus-jaka-visual-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-visual-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-visual-review-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-visual-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-visual-review-v1.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-visual-review-v1
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-visual-review-v1
      EVIDENCE_PR: "633"
      EVIDENCE_HEAD: 7bce3d6c3f367f372be4d39108674a17fe71d846
      EVIDENCE_RUN: "31239057687"
      EVIDENCE_JOB: "93056784541"
      EVIDENCE_ARTIFACT: "9016403859"
      EVIDENCE_DIGEST: sha256:4f1665ad983e40525223539f6c1ad368f392c2d29887200cb3ee2ce4238d822f
      EVIDENCE_IDENTITY: dd59759b825c013869e5c7d75d99cdc12d2f38c4e46262e97a7aacd81bf7192c
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      PERFORMER: Dan Starkey
      ROLE: Megnus Jaka
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      COVER_SHA256: 91c6542a599c9c330cd5f561de262bcaf253c95bbd575b41f3b75cdfc2ea1c38
      COVER_BYTES: "99902"
      COVER_WIDTH: "600"
      COVER_HEIGHT: "600"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-commit visual-review carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,evidence,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Rebind canonical readiness and immutable evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/evidence/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/evidence/autopilot.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/evidence/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/evidence/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/evidence/media-gate.log"
          node scripts/publisher-custody.mjs check-workflows > "$OUT/evidence/publisher-custody.json"
          node scripts/publisher-condition-custody.mjs check-workflows > "$OUT/evidence/publisher-condition-custody.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/evidence/waterline.json" >/dev/null

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" > "$OUT/api/evidence-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > "$OUT/api/evidence-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$EVIDENCE_JOB" > "$OUT/api/evidence-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT" > "$OUT/api/evidence-artifact.json"
          jq -e --argjson number "$EVIDENCE_PR" --arg head "$EVIDENCE_HEAD" '.number==$number and .head.sha==$head and .commits==1 and .changed_files==1' "$OUT/api/evidence-pr.json" >/dev/null
          jq -e --argjson id "$EVIDENCE_RUN" --arg head "$EVIDENCE_HEAD" '.id==$id and .head_sha==$head and .status=="completed" and .conclusion=="success"' "$OUT/api/evidence-run.json" >/dev/null
          jq -e --argjson id "$EVIDENCE_JOB" --argjson run "$EVIDENCE_RUN" '.id==$id and .run_id==$run and .status=="completed" and .conclusion=="success"' "$OUT/api/evidence-job.json" >/dev/null
          jq -e --argjson id "$EVIDENCE_ARTIFACT" --arg digest "$EVIDENCE_DIGEST" --argjson run "$EVIDENCE_RUN" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' "$OUT/api/evidence-artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT/zip" > "$OUT/evidence.zip"
          test "$(sha256sum "$OUT/evidence.zip" | awk '{print $1}')" = "${EVIDENCE_DIGEST#sha256:}"

          ZIP="$OUT/evidence.zip" TARGET="$OUT/evidence/packet" python3 - <<'PY'
          import os, pathlib, zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(f.read(i))
          PY

          ROOT="$OUT/evidence/packet" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          expected={'SHA256SUMS','SHA256SUMS.pre','autopilot.log','cover.bin','cycle-008.log','evidence.json','media-gate.log','mediawiki.json','product.html','production-media.json','source.wikitext','status.json','waterline-gate.log','waterline.json'}
          assert {p.name for p in root.iterdir() if p.is_file()}==expected
          prefix='/tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3/receipt/'
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest, original=line.split(None,1)
              assert original.startswith(prefix)
              p=root/original[len(prefix):]
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          receipt=json.loads((root/'evidence.json').read_text()); identity=receipt.pop('identity')
          assert identity==os.environ['EVIDENCE_IDENTITY']
          assert hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          assert receipt['status']=='cycle-009-megnus-jaka-evidence-recovered'
          assert receipt['task_id']==os.environ['TASK_ID'] and receipt['performer']==os.environ['PERFORMER'] and receipt['role']==os.environ['ROLE']
          assert receipt['source_content_sha256']==os.environ['SOURCE_SHA256'] and receipt['source_fingerprint']==os.environ['SOURCE_FINGERPRINT']
          assert receipt['source_lead_image'] is None and receipt['source_referenced_image_count']==1
          assert receipt['official_cover']['adopted'] is False
          assert receipt['official_cover']['sha256']==os.environ['COVER_SHA256'] and receipt['official_cover']['bytes']==int(os.environ['COVER_BYTES'])
          assert receipt['existing_dan_starkey_card_count']==9 and receipt['existing_dan_starkey_portrait_facet_count']==9
          assert receipt['lease_issued'] is False and receipt['queue_mutated'] is False and receipt['media_adopted'] is False and receipt['repository_write'] is False
          media=json.loads((root/'mediawiki.json').read_text())
          assert media['lead_image'] is None and media['referenced_images']==['File:CharStub.png']
          production=json.loads((root/'production-media.json').read_text())
          assert production['cover']['sha256']==os.environ['COVER_SHA256'] and production['cover']['adopted'] is False
          cover=(root/'cover.bin').read_bytes()
          assert len(cover)==int(os.environ['COVER_BYTES']) and hashlib.sha256(cover).hexdigest()==os.environ['COVER_SHA256']
          assert cover[:4]==b'RIFF' and cover[8:12]==b'WEBP'
          pos=12; width=height=None
          while pos+8<=len(cover):
              fourcc=cover[pos:pos+4]; size=int.from_bytes(cover[pos+4:pos+8],'little'); data=cover[pos+8:pos+8+size]
              if fourcc==b'VP8X' and len(data)>=10:
                  width=1+int.from_bytes(data[4:7],'little'); height=1+int.from_bytes(data[7:10],'little'); break
              if fourcc==b'VP8 ':
                  marker=data.find(b'\x9d\x01\x2a')
                  if marker>=0 and marker+7<=len(data):
                      width=int.from_bytes(data[marker+3:marker+5],'little')&0x3fff
                      height=int.from_bytes(data[marker+5:marker+7],'little')&0x3fff
                      break
              pos += 8+size+(size&1)
          assert width==int(os.environ['COVER_WIDTH']) and height==int(os.environ['COVER_HEIGHT'])
          (Path(os.environ['OUT'])/'evidence/evidence.verified.json').write_text(json.dumps({**receipt,'identity':identity},indent=2,sort_keys=True)+'\n')
          (Path(os.environ['OUT'])/'evidence/cover.verified.webp').write_bytes(cover)
          PY

      - name: Seal independent visual disposition
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" REVIEWED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt={
              'status':'independent-visual-disposition-complete',
              'review_run':int(os.environ['GITHUB_RUN_ID']),
              'review_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'reviewed_at':os.environ['REVIEWED_AT'],
              'reviewer':'chatgpt-second-desk',
              'review_role':'second-desk',
              'review_method':'direct visual inspection of exact checksum-bound image bytes; no biometric inference',
              'canonical_main':os.environ['EXACT_MAIN'],
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'evidence_pr':int(os.environ['EVIDENCE_PR']),
              'evidence_run':int(os.environ['EVIDENCE_RUN']),
              'evidence_artifact':int(os.environ['EVIDENCE_ARTIFACT']),
              'evidence_artifact_digest':os.environ['EVIDENCE_DIGEST'],
              'evidence_identity':os.environ['EVIDENCE_IDENTITY'],
              'task_id':os.environ['TASK_ID'],
              'performer':os.environ['PERFORMER'],
              'role':os.environ['ROLE'],
              'performance_mode':'voice',
              'source_stub_image':{
                  'title':'File:CharStub.png',
                  'disposition':'refused-template-stub-icon',
                  'character_identity_support':False,
                  'adopted':False,
              },
              'official_cover':{
                  'sha256':os.environ['COVER_SHA256'],
                  'bytes':int(os.environ['COVER_BYTES']),
                  'width':int(os.environ['COVER_WIDTH']),
                  'height':int(os.environ['COVER_HEIGHT']),
                  'presentation':'promotional-cover-art',
                  'composition':'multi-subject-collage-with-prominent-typography',
                  'exact_character_identity':'not-established',
                  'performer_identity':'not-used',
                  'disposition':'refused-as-exact-character-still',
                  'reason_codes':['cover-art','multi-subject','typography','not-source-assigned-character-still','exact-subject-not-established'],
                  'adopted':False,
              },
              'media_decision':{
                  'character_still_status':'absent',
                  'performer_portrait_status':'absent',
                  'duplicate_performer_portrait_adoption_forbidden':True,
                  'candidate_mode':'text-only-with-honest-media-absence',
              },
              'lease_issued':False,
              'queue_mutated':False,
              'canonical_record_created':False,
              'media_adopted':False,
              'cycle_receipt_written':False,
              'repository_write':False,
              'cycle_009_lease_authorized':False,
              'cycle_009_product_authorized':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
              'next_gate':'exact-current lease and text-only candidate materialization',
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'receipt/visual-disposition.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'receipt/cover.webp').write_bytes((root/'evidence/cover.verified.webp').read_bytes())
          (root/'receipt/evidence.json').write_bytes((root/'evidence/evidence.verified.json').read_bytes())
          (root/'receipt/README.txt').write_text(
              'The exact official cover is promotional multi-subject cover art. It is not admitted as a Megnus Jaka still or Dan Starkey portrait.\n'
              'The source-only File:CharStub.png reference is a template marker, not character evidence.\n'
              'Cycle 009 may proceed only through a separate exact-current lease and text-only candidate transaction.\n'
          )
          PY
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Upload independent visual disposition
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-visual-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-visual-review-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload visual-review diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-visual-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-visual-review-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
