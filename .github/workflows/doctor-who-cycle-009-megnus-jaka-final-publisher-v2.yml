name: doctor-who-cycle-009-megnus-jaka-final-publisher-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-publisher-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  BRANCH: agent/doctor-who-cycle-009-megnus-jaka-final-publisher-707f-v2
  SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.yml
  OUT: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2
  PAYLOAD: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2/payload
  PAYLOAD_ARTIFACT_NAME: doctor-who-cycle-009-megnus-jaka-publication-input-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
  SOURCE_REVIEW_PR: "690"
  SOURCE_REVIEW_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v3
  SOURCE_REVIEW_HEAD: d5e0be4f4cc8249a60ac3af1cd515096ecfb6158
  SOURCE_REVIEW_RUN: "31279792874"
  SOURCE_REVIEW_JOB: "93159152310"
  SOURCE_REVIEW_ARTIFACT: "9028102730"
  SOURCE_REVIEW_ARTIFACT_NAME: doctor-who-cycle-009-megnus-jaka-final-review-v3-31279792874-attempt-1
  SOURCE_REVIEW_ARTIFACT_SHA256: 33e7e74ed3d2dedff1f9cb75ed78df84be1bc7e9fc051b080f063cf780fcfbf7
  APPROVAL_IDENTITY: 2f107d8545431dcf178765a32b865fcec7018e704bc4fc73477681f383f0e819
  FINAL_COMMIT: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  FINAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  FINAL_PATHS: "48"
  PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
  PRODUCT_BUNDLE_SHA256: 08f85f0b8ad89e9a2db98e23fc681583d682ec4f4651d7f7d615fa0c64def52a
  PRODUCT_TAR_SHA256: a7611a91e432e6867667ad886c54e24b30081a7eadee9c1062ca989017a55fa7
  PRODUCT_PATCH_SHA256: 26f4691175dfc94ecc85066afc022fa8e78e78c5c0cf626a9ecedb61a14720ba
  PRODUCT_MANIFEST_SHA256: c8395f5a800dd4d16575ce5f0951316faaa249cb7b48a42df18ccd23527b97e1
  PRODUCT_PATHS_SHA256: de04da060a093f71128a6254b318124a51c228c604d9936976ad3a67043d9b9b
  RUNNER_SHA256: 9f352ea188f64c5c1fbe4a923bb579e1ceaa9a783c242ad8b03c6859d721bd99
  RUNNER_GZIP_SHA256: 41fd695aa1ceb5a63a7022bcce79b6eb2547090391945949e980cd117aafa16b
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-publisher-707f-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute exact commit-bound publisher qualification
        shell: bash
        env:
          MODE: qualify
        run: |
          set -euo pipefail
          message=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.commit-message
          runner_gz=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.sh.gz
          runner=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.sh
          git show -s --format=%B HEAD > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64,os
          from pathlib import Path
          text=Path(os.environ['MESSAGE']).read_text(); begin='RUNNER_GZIP_BASE64_BEGIN'; end='RUNNER_GZIP_BASE64_END'
          assert text.count(begin)==1 and text.count(end)==1
          payload=''.join(text.split(begin,1)[1].split(end,1)[0].split()); assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload,validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload same-run code-free publication input
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PAYLOAD_ARTIFACT_NAME }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload qualification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-publisher-v2-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  publish:
    needs: qualify
    if: >-
      needs.qualify.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-publisher-707f-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Download same-run qualified publication input
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PAYLOAD_ARTIFACT_NAME }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2/payload

      - name: Execute exact non-forced product publication
        shell: bash
        env:
          MODE: publish
        run: |
          set -euo pipefail
          message=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.commit-message
          runner_gz=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.sh.gz
          runner=/tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2.sh
          git show -s --format=%B HEAD > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64,os
          from pathlib import Path
          text=Path(os.environ['MESSAGE']).read_text(); begin='RUNNER_GZIP_BASE64_BEGIN'; end='RUNNER_GZIP_BASE64_END'
          assert text.count(begin)==1 and text.count(end)==1
          payload=''.join(text.split(begin,1)[1].split(end,1)[0].split()); assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload,validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload exact publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-publisher-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2/publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-publisher-v2-publication-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-publisher-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
