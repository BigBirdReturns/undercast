name: ux-nav-noscript-source-export

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ux-nav-noscript-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fd459676900f7a37591cd12b0f1731f205227be
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact qualified product and package repair inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2fd459676900f7a37591cd12b0f1731f205227be
          out="$RUNNER_TEMP/ux-nav-noscript-source"
          mkdir -p "$out/data" "$out/tests/rendered" "$out/scripts"
          cp recognition.html "$out/recognition.html"
          cp data/archive.json "$out/data/archive.json"
          cp tests/rendered/ux-journeys.spec.mjs "$out/tests/rendered/ux-journeys.spec.mjs"
          cp tests/rendered/mobile-density.spec.mjs "$out/tests/rendered/mobile-density.spec.mjs"
          cp scripts/site-seams.mjs "$out/scripts/site-seams.mjs"
          printf '%s\n' 2fd459676900f7a37591cd12b0f1731f205227be > "$out/source-head.txt"
          (cd "$out" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload exact repair inputs
        uses: actions/upload-artifact@v4
        with:
          name: ux-nav-noscript-source-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-nav-noscript-source
          if-no-files-found: error
          retention-days: 7
