name: doctor-who-cycle-008-composability-v3-materializer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-composability-v3-materializer-v1.yml"
      - ".tmp/doctor-who-cycle-008-composability-v3-materializer-v1/**"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-composability-v3-materializer-v1
  cancel-in-progress: true

env:
  EXACT_MAIN: a9b1a29098e36f03340ff6678b3edd06f1d1d3e2
  BRANCH: agent/doctor-who-cycle-008-composability-v3-materializer-v1
  SELF: .github/workflows/doctor-who-cycle-008-composability-v3-materializer-v1.yml
  CARRIER_DIR: .tmp/doctor-who-cycle-008-composability-v3-materializer-v1
  PRODUCT_BRANCH: agent/doctor-who-cycle-008-composability-v3
  OUT: /tmp/doctor-who-cycle-008-composability-v3-materializer-v1
  MANIFEST_IDENTITY: 7de026c3425ddb553dbdc622bb47aa9a7ec39f9e517fe4309a7fa59d437b02a1
  RUNNER_SHA256: 4a0fada3722f96b93bb0f7ef4de0e564f5a9c509346223395eaa8fa9a8914cba
  RUNNER_XZ_SHA256: d96ae2db889d05e04299e65e89aad2828dba03b5706c85be90f9f494dceb0eac
  SCRIPT_SHA256: 44525dbf7861cc303a28abeea845cbf2351efb863a6063f1e7c467661c76bb12
  SCRIPT_XZ_SHA256: ae615bf4d364fe05e1bc4160a62377789ff52f3c79eae1338b31fc6551b01c86
  RECEIPT_SHA256: 5d9c3b20e6974c23cb4680a577833e09513a285535379d3ed19270f0904783ef
  RECEIPT_XZ_SHA256: 6a89c753f756c519513dea714c80a28f7baaf3c3ab394b46deb795758152e7a3
  V2_CHECKER_BLOB: 7264d7e9cc995db157033f2150d58b7c985933e1

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-composability-v3-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CARRIER_PR: ${{ github.event.pull_request.number }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify compact carrier and execute exact materializer
        shell: bash
        run: |
          set -euo pipefail
          cat "$CARRIER_DIR"/runner.sh.xz.b64.part-* > /tmp/runner.xz.b64
          base64 --decode /tmp/runner.xz.b64 > /tmp/runner.sh.xz
          test "$(sha256sum /tmp/runner.sh.xz | awk '{print $1}')" = "$RUNNER_XZ_SHA256"
          runner=/tmp/doctor-who-cycle-008-composability-v3-materializer-v1.sh
          xz -dc /tmp/runner.sh.xz > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$runner"
          chmod 700 "$runner"
          exec "$runner"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: doctor-who-cycle-008-composability-v3-materialization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-composability-v3-materializer-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: doctor-who-cycle-008-composability-v3-materialization-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-composability-v3-materializer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
