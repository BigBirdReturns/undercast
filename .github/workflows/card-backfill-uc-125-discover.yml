name: card-backfill-uc-125-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-125-DISCOVER.json"
      - "scripts/card-backfill-uc-125-discover.mjs"
      - ".github/workflows/card-backfill-uc-125-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-125-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-030'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-125 official three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-125-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-125');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-125');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4a735d846bcdf5aae92e0959');
          if(row.version!==1||row.record_id!=='UC-125'||row.actor!=='Billy West'||row.character!=='Ren, Stimpy & Fry'||row.production!=='Ren & Stimpy / Futurama'||row.year!==1991||row.side!=='still')throw new Error('UC-125 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8705167567||row.selector_artifact?.head_sha!=='0b4783eedc3ced767ba9d2321291b0a11ff5e233'||row.scope_artifact?.artifact_id!==8705284505||row.scope_artifact?.head_sha!=='a5c5495b2fe0fbf4d22917a254a242935ab5881f'||row.scope_artifact?.scope_sha256!=='7f44e5c6818fc19d11355dfea7645c930dc5e6312900232223931ab5f3f411c3')throw new Error('UC-125 discovery custody drift');
          if(row.actor_role_pages?.length!==4||row.actor_role_pages.some(page=>page.strict!==true)||row.roles?.length!==3||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==1)throw new Error('UC-125 discovery denominator drift');
          if(JSON.stringify(row.selection_contract?.required_role_keys)!==JSON.stringify(['ren','stimpy','fry'])||row.selection_contract?.exact_three_role_composite_required!==true||row.selection_contract?.ren_1993_takeover_boundary_required!==true||row.selection_contract?.stimpy_1991_role_boundary_required!==true||row.selection_contract?.fry_1999_role_boundary_required!==true||row.selection_contract?.canonical_1991_is_ren_and_stimpy_chronology_not_fry_debut!==true||row.selection_contract?.all_three_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-125 selection contract drift');
          if(row.roles[0]?.asset_url!=='https://billywest.com/images/toons/ren.jpg'||row.roles[1]?.asset_url!=='https://billywest.com/images/toons/stimpy.jpg'||row.roles[2]?.asset_url!=='https://billywest.com/images/toons/fry.jpg')throw new Error('UC-125 official asset denominator drift');
          if(!specimen||specimen.actor!=='Billy West'||specimen.character!=='Ren, Stimpy & Fry'||specimen.production!=='Ren & Stimpy / Futurama'||specimen.years!=='1991'||specimen.still)throw new Error('UC-125 specimen boundary drift');
          if(source?.still)throw new Error('UC-125 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-125'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-125 audit boundary drift');
          console.log('PASS — exact UC-125 Billy West official three-role discovery authorized');
          NODE
      - name: Gather official pages and exact role assets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-125-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-125-discover.mjs
          node scripts/card-backfill-uc-125-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-125-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, exact assets, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-125-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-125-discover
            ${{ runner.temp }}/card-backfill-uc-125-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
