name: doctor-who-cycle-008-kreg-bootstrap-v7d

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7d.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-bootstrap-v7d-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-bootstrap-v7d'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7d.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7d
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      SOURCE_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7b
      SOURCE_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7b.yml
      V6_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v6
      V6_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v6
      OUT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d
      HARNESS: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d-harness
      SCRIPTS: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d-substantive
      IMMUTABLE_V7D_COMMIT: 98853c9f1d277829d8b25a59681bee8a96571bc2
      IMMUTABLE_V7D_BLOB: 092e7a8899b804b6ef819c20dc0ed6d3d79b11bd
      V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
      V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
      V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
      ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
      MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
      MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
      RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
      PREFLIGHT_ARTIFACT: "8962423257"
      PREFLIGHT_DIGEST: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
      CENSUS_ARTIFACT: "8971420444"
      CENSUS_DIGEST: 75dab09bac152256ba5b9f471b244af1916b509d453e60adbc39d5aa7503905c
      REVIEW_ARTIFACT: "8971625526"
      REVIEW_DIGEST: 3e9d57566cddd961074a7f46839b565bb797d86958993f555cb5add9f5982b5c
      PUBLICATION_ARTIFACT: "8972359020"
      PUBLICATION_DIGEST: 40a7726498b5d2030b732c78a4da51e5da821fb622c6cc4e616489f48962d339
      MEDIA_ASSET_ID: "504051495"
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover immutable V7d custody shell outside the mutable output tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$HARNESS" "$SCRIPTS"
          mkdir -p "$OUT/diagnostics" "$HARNESS" "$SCRIPTS"

          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          floor="$1"
          test "$(git rev-list --count "$floor"..HEAD)" = 1
          test "$(git diff --name-only "$floor"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$floor"...HEAD)" = $'A\t'"$SELF"

          git fetch --no-tags --filter=blob:none origin "$IMMUTABLE_V7D_COMMIT"
          test "$(git rev-parse "$IMMUTABLE_V7D_COMMIT:$SELF")" = "$IMMUTABLE_V7D_BLOB"
          git show "$IMMUTABLE_V7D_COMMIT:$SELF" > "$HARNESS/immutable-v7d.yml"
          test "$(git hash-object "$HARNESS/immutable-v7d.yml")" = "$IMMUTABLE_V7D_BLOB"

          SOURCE="$HARNESS/immutable-v7d.yml" TARGET="$HARNESS" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          source = Path(os.environ['SOURCE'])
          target = Path(os.environ['TARGET'])
          doc = yaml.safe_load(source.read_text())
          assert isinstance(doc, dict) and isinstance(doc.get('jobs'), dict)
          steps = doc['jobs']['qualify']['steps']
          wanted = [
              'Recover immutable V7b scripts and apply the exact V7d transport repair',
              'Execute the eight repaired substantive scripts in one custody shell',
              'Rebind exact source and carrier refs',
          ]
          found = {step.get('name'): step.get('run') for step in steps if step.get('name') in wanted}
          assert list(found) == wanted, (list(found), wanted)
          for index, name in enumerate(wanted, 1):
              text = found[name]
              assert isinstance(text, str)
              if index <= 2:
                  count = text.count('$OUT/scripts')
                  assert count >= 1, (name, count)
                  text = text.replace('$OUT/scripts', '$SCRIPTS')
              path = target / f'{index:02d}.sh'
              path.write_text(text)
              path.chmod(0o755)
          PY

          for script in "$HARNESS"/0[1-3].sh; do
            bash -n "$script"
          done
          {
            printf 'wrapper_head=%s\n' "$AUTHORIZED_HEAD"
            printf 'wrapper_parent=%s\n' "$floor"
            printf 'immutable_v7d_commit=%s\n' "$IMMUTABLE_V7D_COMMIT"
            printf 'immutable_v7d_blob=%s\n' "$IMMUTABLE_V7D_BLOB"
          } > "$HARNESS/immutable-source-identity.txt"

      - name: Execute the repaired immutable V7d chain
        shell: bash
        run: |
          set -euo pipefail

          bash "$HARNESS/01.sh"
          if [ -s "$GITHUB_ENV" ]; then
            set -a
            source "$GITHUB_ENV"
            set +a
          fi

          test "$(find "$SCRIPTS" -maxdepth 1 -type f -name '*.sh' | wc -l | tr -d '[:space:]')" = 8
          for script in "$SCRIPTS"/*.sh; do
            bash -n "$script"
          done

          bash "$HARNESS/02.sh"
          if [ -s "$GITHUB_ENV" ]; then
            set -a
            source "$GITHUB_ENV"
            set +a
          fi
          bash "$HARNESS/03.sh"

          packet="$OUT/packet"
          for member in qualification-receipt.json candidate-product.tar.gz candidate.bundle candidate.patch candidate-files.json candidate-paths.txt; do
            test -f "$packet/$member"
          done
          jq -e '
            .status=="qualified-candidate" and
            .path_count==40 and
            .task==env.TASK_ID and
            .lease==env.LEASE_ID and
            .wall_id==env.WALL_ID and
            .repository_write==false and
            .merge_authority==false and
            .cycle_009_authorized==false and
            .outside_human_dependency==false
          ' "$packet/qualification-receipt.json" >/dev/null

      - name: Retain terminal diagnostics and remove the local worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/diagnostics/recovered-harness" "$OUT/diagnostics/recovered-substantive"
          if [ -d "$HARNESS" ]; then
            cp -a "$HARNESS"/. "$OUT/diagnostics/recovered-harness/" || true
          fi
          if [ -d "$SCRIPTS" ]; then
            cp -a "$SCRIPTS"/. "$OUT/diagnostics/recovered-substantive/" || true
          fi

          work="$OUT/work/main"
          if [ -d "$work" ]; then
            git -C "$work" status --short > "$OUT/diagnostics/final-worktree-status.txt" || true
            git -C "$work" diff > "$OUT/diagnostics/final-worktree.diff" || true
            git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
          fi
          rm -rf "$OUT/work" "$HARNESS" "$SCRIPTS"

          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V7d candidate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-bootstrap-v7d-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
