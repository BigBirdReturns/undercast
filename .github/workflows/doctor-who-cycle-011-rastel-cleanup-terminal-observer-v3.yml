name: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      INSTALLED_MAIN: 120a81e988c045695b55089afe5f8e3d82012f8d
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      PREFIX: agent/doctor-who-cycle-011-rastel-
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v3.yml
      WRITER_NAME: doctor-who-cycle-011-rastel-cleanup-writer-v3
      WRITER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-cleanup-writer-v3-
      SOURCE_PR: "854"
      SOURCE_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2
      SOURCE_HEAD: bbb43013c56789f5abf068dd5132872a10ab3472
      SOURCE_RUN: "31359480959"
      SOURCE_ATTEMPT: "1"
      SOURCE_JOB: "93365341372"
      SOURCE_ARTIFACT: "9051813723"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-authorization-31359480959-attempt-1
      SOURCE_ARTIFACT_SHA256: 8f9da035a06fe32e0b7099c445466c3c7a9a3ec3e632aa914b543386dda53339
      BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind isolated observer and exact terminal canonical geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,writer,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$CLEANUP_MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$CLEANUP_MAIN"
          test "$(git rev-list --count "$CLEANUP_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CLEANUP_MAIN"..HEAD)"
          test "$(git diff --name-status "$CLEANUP_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CLEANUP_MAIN"
          test "$(git show -s --format=%P "$CLEANUP_MAIN")" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%T "$CLEANUP_MAIN")" = "$CANONICAL_TREE"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          test -z "$(git diff --name-only "$CANONICAL_MAIN" "$CLEANUP_MAIN")"
          git diff --name-status "$INSTALLED_MAIN" "$CLEANUP_MAIN" | LC_ALL=C sort > "$OUT/logs/installed-to-cleanup.tsv"
          printf 'D\t%s\nD\t%s\nD\t%s\n' "$WRITER_V1" "$WRITER_V2" "$WRITER_V3" | LC_ALL=C sort > "$OUT/logs/expected-installed-to-cleanup.tsv"
          cmp "$OUT/logs/installed-to-cleanup.tsv" "$OUT/logs/expected-installed-to-cleanup.tsv"
          for path in "$WRITER_V1" "$WRITER_V2" "$WRITER_V3"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$CLEANUP_MAIN" >/dev/null 2>&1; then
              echo "writer survived terminal tree: $path" >&2
              exit 1
            fi
          done
          gh api "/repos/$GITHUB_REPOSITORY/contents/scripts/doctor-who-cycle-011.mjs?ref=$CLEANUP_MAIN" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          CURRENT_PR="$pr" CURRENT_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          own = json.loads((Path(os.environ['OUT']) / 'api/own-pr.json').read_text())
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged_at'] is None
          assert own['base']['sha'] == os.environ['CLEANUP_MAIN']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1
          PY

      - name: Authenticate successful V2 authorization source
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/authorization.zip"
          test "$(sha256sum "$OUT/source/authorization.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/source-artifact.json")" = "sha256:$SOURCE_ARTIFACT_SHA256"
          ZIP="$OUT/source/authorization.zip" TARGET="$OUT/source/extracted" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          api = root / 'api'
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest
          pr = json.loads((api / 'source-pr.json').read_text())
          run = json.loads((api / 'source-run.json').read_text())
          jobs = json.loads((api / 'source-jobs.json').read_text())['jobs']
          artifact = json.loads((api / 'source-artifact.json').read_text())
          assert pr['number'] == int(os.environ['SOURCE_PR'])
          assert pr['head']['ref'] == os.environ['SOURCE_BRANCH'] and pr['head']['sha'] == os.environ['SOURCE_HEAD']
          assert pr['state'] == 'closed' and pr['merged_at'] is None
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_HEAD'] and run['head_branch'] == os.environ['SOURCE_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_attempt'] == int(os.environ['SOURCE_ATTEMPT'])
          matched = [row for row in jobs if row['id'] == int(os.environ['SOURCE_JOB'])]
          assert len(matched) == 1 and matched[0]['name'] == 'verify' and matched[0]['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['SOURCE_ARTIFACT_SHA256'] and artifact['expired'] is False
          authorization = json.loads((target / 'authorization.json').read_text())
          identity = authorization.pop('identity')
          assert sha(json.dumps(authorization, sort_keys=True, separators=(',', ':')).encode()) == identity
          authorization['identity'] = identity
          assert authorization['status'] == 'cycle-011-rastel-cleanup-resume-authorized-v2'
          assert authorization['version'] == 2
          assert authorization['source'] == {
              'pr': int(os.environ['SOURCE_PR']),
              'head': os.environ['SOURCE_HEAD'],
              'run': int(os.environ['SOURCE_RUN']),
              'attempt': int(os.environ['SOURCE_ATTEMPT']),
              'job': int(os.environ['SOURCE_JOB']),
          }
          assert authorization['canonical'] == {
              'proved_commit': os.environ['CANONICAL_MAIN'],
              'tree': os.environ['CANONICAL_TREE'],
              'installed_main': os.environ['INSTALLED_MAIN'],
              'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V2'], os.environ['WRITER_V3']],
          }
          assert authorization['counts'] == {
              'current_prefix_refs': 93,
              'auxiliary_refs': 2,
              'pull_requests_total': 6,
              'pull_requests_to_close': authorization['counts']['pull_requests_to_close'],
          }
          assert authorization['counts']['pull_requests_to_close'] >= 5
          assert len(authorization['refs']) == 93
          assert len(authorization['auxiliary_refs']) == 2
          assert len(authorization['pull_requests']) == 6
          assert authorization['boundary'] == {
              'cycle_012_lease_issued': False,
              'cycle_012_product_authority': False,
              'exact_heads_frozen': True,
              'force_update': False,
              'main_mutation': False,
              'merge': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          (root / 'receipt/authorization.json').write_text(json.dumps(authorization, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/authorization-identity.txt').write_text(identity + '\n')
          PY

      - name: Locate and authenticate exact Writer V3 transaction
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f event=workflow_run -f per_page=100 > "$OUT/api/workflow-run-census.json"
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          source = json.loads((root / 'source-run.json').read_text())
          runs = json.loads((root / 'workflow-run-census.json').read_text())['workflow_runs']
          floor = datetime.fromisoformat(source['updated_at'].replace('Z', '+00:00')) - timedelta(minutes=1)
          rows = []
          for row in runs:
              created = datetime.fromisoformat(row['created_at'].replace('Z', '+00:00'))
              if row['name'] != os.environ['WRITER_NAME'] or row['event'] != 'workflow_run' or created < floor:
                  continue
              rows.append(row)
          rows.sort(key=lambda row: (row['created_at'], row['id']))
          assert len(rows) == 1, [(row['id'], row['name'], row['status'], row['conclusion'], row['created_at']) for row in rows]
          chosen = rows[0]
          assert chosen['status'] == 'completed' and chosen['conclusion'] == 'success'
          assert chosen['head_sha'] == os.environ['INSTALLED_MAIN']
          (root / 'writer-run.json').write_text(json.dumps(chosen, indent=2, sort_keys=True) + '\n')
          (root / 'writer-run-id.txt').write_text(str(chosen['id']) + '\n')
          PY
          writer_run="$(cat "$OUT/api/writer-run-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          WRITER_RUN="$writer_run" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          run = json.loads((root / 'writer-run.json').read_text())
          jobs = json.loads((root / 'writer-jobs.json').read_text())['jobs']
          artifacts = json.loads((root / 'writer-artifacts.json').read_text())['artifacts']
          assert run['id'] == int(os.environ['WRITER_RUN'])
          assert run['run_attempt'] == 1
          rows = [row for row in jobs if row['name'] == 'write']
          assert len(rows) == 1 and rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'success'
          steps = {row['name']: row['conclusion'] for row in rows[0].get('steps', [])}
          assert steps['Bind exact three-writer installation and successful verifier V2'] == 'success'
          assert steps['Authenticate exact V2 cleanup authorization'] == 'success'
          assert steps['Apply exact PR and ref cleanup with settled observation'] == 'success'
          assert steps['Restore exact canonical product tree and seal terminal cleanup V5'] == 'success'
          expected = os.environ['WRITER_ARTIFACT_PREFIX'] + os.environ['WRITER_RUN'] + '-attempt-1'
          matches = [row for row in artifacts if row['name'] == expected and not row['expired']]
          assert len(matches) == 1, (expected, [(row['id'], row['name'], row['expired']) for row in artifacts])
          (root / 'writer-job-id.txt').write_text(str(rows[0]['id']) + '\n')
          (root / 'writer-artifact-id.txt').write_text(str(matches[0]['id']) + '\n')
          PY
          writer_artifact="$(cat "$OUT/api/writer-artifact-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$writer_artifact" > "$OUT/api/writer-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$writer_artifact/zip" > "$OUT/writer/cleanup.zip"
          writer_sha="$(sha256sum "$OUT/writer/cleanup.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/writer-artifact.json")" = "sha256:$writer_sha"
          printf 'WRITER_RUN=%s\nWRITER_JOB=%s\nWRITER_ARTIFACT=%s\nWRITER_ARTIFACT_SHA256=%s\n' "$writer_run" "$(cat "$OUT/api/writer-job-id.txt")" "$writer_artifact" "$writer_sha" >> "$GITHUB_ENV"

      - name: Authenticate V5 cleanup receipt and live terminal state
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/writer/cleanup.zip" TARGET="$OUT/writer/extracted" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          cleanup_files = list(target.rglob('cleanup.json'))
          markers = list(target.rglob('CLEANUP_COMPLETE'))
          authorization_files = list(target.rglob('authorization.json'))
          assert len(cleanup_files) == 1 and len(markers) == 1 and len(authorization_files) == 1
          cleanup = json.loads(cleanup_files[0].read_text())
          identity = cleanup.pop('identity')
          assert sha(json.dumps(cleanup, sort_keys=True, separators=(',', ':')).encode()) == identity
          cleanup['identity'] = identity
          authorization = json.loads((root / 'receipt/authorization.json').read_text())
          assert cleanup['status'] == 'cycle-011-rastel-exact-prefix-cleanup-complete-v5'
          assert cleanup['version'] == 5
          assert cleanup['writer_run'] == int(os.environ['WRITER_RUN'])
          assert cleanup['writer_attempt'] == 1
          assert cleanup['source'] == {
              'pr': int(os.environ['SOURCE_PR']),
              'head': os.environ['SOURCE_HEAD'],
              'run': int(os.environ['SOURCE_RUN']),
              'attempt': int(os.environ['SOURCE_ATTEMPT']),
              'job': int(os.environ['SOURCE_JOB']),
              'artifact': int(os.environ['SOURCE_ARTIFACT']),
              'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
          }
          assert cleanup['authorization_identity'] == authorization['identity']
          assert cleanup['canonical'] == {
              'proved_commit': os.environ['CANONICAL_MAIN'],
              'installation_commit': os.environ['INSTALLED_MAIN'],
              'cleanup_commit': os.environ['CLEANUP_MAIN'],
              'tree': os.environ['CANONICAL_TREE'],
              'writers_absent': True,
          }
          assert cleanup['cleanup']['authorized_prefix_refs'] == 93
          assert cleanup['cleanup']['prefix_refs_remaining'] == 0
          assert cleanup['cleanup']['pull_requests_processed'] == 6
          assert cleanup['cleanup']['auxiliary_refs_processed'] == 2
          assert cleanup['cleanup']['deleted_in_this_run'] + cleanup['cleanup']['already_absent_at_rebind'] == 95
          assert cleanup['boundary'] == {
              'cycle_012_lease_issued': False,
              'cycle_012_product_authority': False,
              'force_update': False,
              'merge': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
              'product_tree_changed': False,
          }
          assert markers[0].read_text().strip() == identity
          writer_authorization = json.loads(authorization_files[0].read_text())
          assert writer_authorization == authorization
          (root / 'receipt/cleanup.json').write_text(json.dumps(cleanup, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/cleanup-identity.txt').write_text(identity + '\n')
          PY

          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/final-prefix-refs.json"
          test "$(jq 'length' "$OUT/api/final-prefix-refs.json")" = 0
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CLEANUP_MAIN"
          for path in "$WRITER_V1" "$WRITER_V2" "$WRITER_V3"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$CLEANUP_MAIN" >/dev/null 2>&1; then
              echo "writer survived live terminal state: $path" >&2
              exit 1
            fi
          done
          for spec in \
            '847:12039a5be5823c46731089cc89c9c45666d614b4:false' \
            '850:17ff69dbd777a59838842b952230624abe6fecb4:false' \
            '851:497c9edaf17363eac78e2875169baa436fbdb83f:false' \
            '852:120a81e988c045695b55089afe5f8e3d82012f8d:true' \
            '853:b818d712077a55e2db605f26d3ae51995d54cc53:false' \
            '854:bbb43013c56789f5abf068dd5132872a10ab3472:false'
          do
            IFS=: read -r number head merged <<< "$spec"
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/final-pr-$number.json"
            NUMBER="$number" HEAD_SHA="$head" MERGED="$merged" python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['OUT']) / f"api/final-pr-{os.environ['NUMBER']}.json").read_text())
          assert row['number'] == int(os.environ['NUMBER'])
          assert row['state'] == 'closed' and row['head']['sha'] == os.environ['HEAD_SHA']
          assert row['merged'] is (os.environ['MERGED'] == 'true')
          if os.environ['MERGED'] == 'false':
              assert row['merged_at'] is None
          PY
          done

      - name: Seal terminal cleanup proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          authorization = json.loads((root / 'receipt/authorization.json').read_text())
          cleanup = json.loads((root / 'receipt/cleanup.json').read_text())
          proof = {
              'status': 'cycle-011-rastel-cleanup-terminally-proved-v1',
              'version': 1,
              'source': {
                  'pr': int(os.environ['SOURCE_PR']),
                  'head': os.environ['SOURCE_HEAD'],
                  'run': int(os.environ['SOURCE_RUN']),
                  'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
                  'authorization_identity': authorization['identity'],
              },
              'writer': {
                  'run': int(os.environ['WRITER_RUN']),
                  'job': int(os.environ['WRITER_JOB']),
                  'artifact': int(os.environ['WRITER_ARTIFACT']),
                  'artifact_sha256': os.environ['WRITER_ARTIFACT_SHA256'],
                  'cleanup_identity': cleanup['identity'],
              },
              'canonical': {
                  'proved_product': os.environ['CANONICAL_MAIN'],
                  'installed_writer_state': os.environ['INSTALLED_MAIN'],
                  'cleanup_commit': os.environ['CLEANUP_MAIN'],
                  'tree': os.environ['CANONICAL_TREE'],
                  'product_delta_paths': 0,
                  'installation_to_cleanup_paths': 3,
                  'installation_to_cleanup_deletions': 3,
              },
              'cleanup': {
                  'authorized_prefix_refs': 93,
                  'auxiliary_refs': 2,
                  'pull_requests': 6,
                  'remaining_prefix_refs': 0,
                  'writers_remaining': 0,
              },
              'boundary': {
                  'repository_write': False,
                  'canonical_mutation': False,
                  'cycle_012_lease_issued': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          proof['identity'] = hashlib.sha256(json.dumps(proof, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/PROOF_COMPLETE').write_text(proof['identity'] + '\n')
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/receipt/$rel" | sed "s#  $OUT/receipt/#  #"; done > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" | sed "s#  $OUT/receipt/#  #" > "$OUT/receipt/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CLEANUP_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
