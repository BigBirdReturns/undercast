name: card-backfill-uc-097-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-097-APPLY.json"
      - "scripts/card-backfill-uc-097-apply.mjs"
      - ".github/workflows/card-backfill-uc-097-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-097-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-022'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-022
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Beast packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-097-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-097');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-097');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_fcd930a024862c1c231e65a9');
          if(row.version!==1||row.record_id!=='UC-097'||row.actor!=='Dan Stevens'||row.character!=='The Beast'||row.production!=='Beauty and the Beast'||row.year!==2017||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-097 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8672735726||row.render_artifact?.head_sha!=='8d283acce33530defe75c6ed173f9d9185429f80')throw new Error('UC-097 render custody drift');
          if(row.expected?.selected_source_sha256!=='35d665bf92d29fb1eb1d84556769eced61e354a8b2969f2cd1f823b82816edae'||row.expected?.exact_role_record_sha256!=='10ea604978da0563c8a8fe5671cdf95dba3152ca083525c449aeee1717af049a')throw new Error('UC-097 source authorization drift');
          if(row.expected?.candidate_sha256!=='81c03aab8f778c4a6e0ce0badaed13425c1482ebfaf748fc89e01a1b95c2a1f0'||row.expected?.crop_preview_sha256!=='d76d855c5d7868bddcc38841cc066ec7733dcda9ba1ebb11f5c729f86a10d24f')throw new Error('UC-097 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==12||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-097 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-single-role-center-crop'||row.ruling?.canonical_mutation!==false)throw new Error('UC-097 ruling drift');
          if(!specimen||specimen.character!=='The Beast'||specimen.production!=='Beauty and the Beast'||specimen.years!=='2017'||specimen.still)throw new Error('UC-097 specimen boundary drift');
          if(source?.still)throw new Error('UC-097 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-097'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-097 audit boundary drift');
          console.log(`PASS — UC-097 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-097-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8672735726/zip" > "$root/render.zip"
          echo "c250c940b2248c9c3b9e6cc6a4a0217f1e45fb6bd9a430c7949aa52028c1bd15  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-097-render/output/UC-097"
          test -f "$base/manifest.json"
          echo "d8bddbcf14039573b87e4f2c600998c537e7a466e3535a0d3475f2a3bdc0db35  $base/manifest.json" | sha256sum -c -
          echo "083d88a0c07df683314a0e8b4d6f8d04d5503991898f3ce505aa5698cadfda23  $base/duplicate-scan.json" | sha256sum -c -
          echo "a8edcb0615ca67ed1c20ee7b10cb8caffe86205d7961e4f7a3db1d0a9b24d7c0  $base/review.json" | sha256sum -c -
          echo "4c80678684db3849c8cc28b5334098f4a9b44428bb0539513333f69120857d59  $base/review.md" | sha256sum -c -
          echo "da18db4da9458ff5d120c1632a2a3c5d4af9387a690159741b8fd3825746b52e  $base/SHA256SUMS" | sha256sum -c -
          echo "10ea604978da0563c8a8fe5671cdf95dba3152ca083525c449aeee1717af049a  $base/exact-role-record.json" | sha256sum -c -
          echo "35d665bf92d29fb1eb1d84556769eced61e354a8b2969f2cd1f823b82816edae  $base/beast-original.jpg" | sha256sum -c -
          echo "2ca34fc0ecfc75817179e33506f6dd1ca879f691a0b55199d692696090e8d226  $base/source-page-disney-movies-2017.png" | sha256sum -c -
          echo "5faba6091822edbe4a706ea9b26dd6a25578f306bae00cfdc3160e8ddb1f37c7  $base/source-page-disney-company-announcement.png" | sha256sum -c -
          echo "5d75987585525a220fd0ba54dd92829c42b5a78c061e9845dcc672c4d9825cb3  $base/source-page-d23-beast-costume.png" | sha256sum -c -
          echo "81c03aab8f778c4a6e0ce0badaed13425c1482ebfaf748fc89e01a1b95c2a1f0  $base/uc-097-still-candidate.jpg" | sha256sum -c -
          echo "d76d855c5d7868bddcc38841cc066ec7733dcda9ba1ebb11f5c729f86a10d24f  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30317587797
          artifact_id=8672735726
          artifact_name=card-backfill-uc-097-render-30317587797
          artifact_zip_sha256=c250c940b2248c9c3b9e6cc6a4a0217f1e45fb6bd9a430c7949aa52028c1bd15
          artifact_head_sha=8d283acce33530defe75c6ed173f9d9185429f80
          source_manifest_sha256=d8bddbcf14039573b87e4f2c600998c537e7a466e3535a0d3475f2a3bdc0db35
          source_sums_sha256=da18db4da9458ff5d120c1632a2a3c5d4af9387a690159741b8fd3825746b52e
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-097-apply/source/card-backfill-uc-097-render/output/UC-097
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-097-apply"
          node --check scripts/card-backfill-uc-097-apply.mjs
          node scripts/card-backfill-uc-097-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-097-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-097');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-097');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_fcd930a024862c1c231e65a9');
          if(!specimen||specimen.still)throw new Error('UC-097 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-097 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-097'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-097 audit disposition was canonically mutated');
          console.log('PASS — UC-097 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-097-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-097.json \
            .github/CARD-BACKFILL-UC-097-DISCOVER.json \
            .github/CARD-BACKFILL-UC-097-RENDER.json \
            .github/CARD-BACKFILL-UC-097-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-097-scope.yml \
            .github/workflows/card-backfill-uc-097-discover.yml \
            .github/workflows/card-backfill-uc-097-render.yml \
            .github/workflows/card-backfill-uc-097-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-097-scope.mjs \
            scripts/card-backfill-uc-097-discover.mjs \
            scripts/card-backfill-uc-097-render.mjs \
            scripts/card-backfill-uc-097-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-097 Dan Stevens Beast still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-021
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-021 HEAD)
          test "${#changed[@]}" -eq 12
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-097/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-097-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-022
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-097-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-097-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-097-apply
            data/review/card-backfill/UC-097
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
