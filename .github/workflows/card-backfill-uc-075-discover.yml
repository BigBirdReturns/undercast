name: card-backfill-uc-075-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-075.json"
      - "scripts/card-backfill-uc-075-discover.mjs"
      - ".github/workflows/card-backfill-uc-075-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-075-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-015'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-075 audit and source boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-075.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-075'||row.actor!=='Lou Ferrigno'||row.character!=='The Hulk'||row.side!=='still')throw new Error('UC-075 discovery boundary drift');
          if(row.selector_artifact?.artifact_id!==8640701810||row.selector_artifact?.head_sha!=='8d2bd0c49c708fe0e4fddde69a55fdc3d74d249c')throw new Error('UC-075 selector custody drift');
          if(row.image_sources?.map(x=>x.key).join(',')!=='solo,banner-hulk'||row.identity_source?.provider!=='Universal Pictures At Home')throw new Error('UC-075 source-set drift');
          console.log('PASS — exact Universal identity plus two CBS publicity records authorized');
          NODE
      - name: Gather exact Commons originals and build review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-075
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-075-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-075.log"
          test -z "$(git status --porcelain)"
      - name: Upload exact sources and online checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-075-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-075
            ${{ runner.temp }}/card-backfill-uc-075.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
