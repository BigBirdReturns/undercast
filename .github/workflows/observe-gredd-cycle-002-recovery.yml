name: observe-gredd-cycle-002-recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/observe-gredd-cycle-002-recovery.yml"
  workflow_run:
    workflows:
      - dispatch-complete-gredd-cycle-002-recovery
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: observe-gredd-cycle-002-recovery
  cancel-in-progress: true

env:
  TARGET_WORKFLOW: dispatch-complete-gredd-cycle-002-recovery.yml
  STATUS_BRANCH: agent/doctor-who-gredd-cycle-002-recovery-status
  GH_TOKEN: ${{ github.token }}

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Capture the exact target run or its absence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi

          if [[ -z "$run_id" ]]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = {
              'schema_version': 1,
              'observed_by_run_id': int(os.environ['GITHUB_RUN_ID']),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'target': None,
              'jobs': [],
              'reason': 'no_target_workflow_run_found',
          }
          Path('/tmp/latest.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
          else
            test "$run_id" -gt 0
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > /tmp/gredd-recovery-run.json
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
              > /tmp/gredd-recovery-jobs.json
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path('/tmp/gredd-recovery-run.json').read_text())
          jobs_doc = json.loads(Path('/tmp/gredd-recovery-jobs.json').read_text())
          jobs = []
          for job in jobs_doc.get('jobs', []):
              jobs.append({
                  'id': job.get('id'),
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'started_at': job.get('started_at'),
                  'completed_at': job.get('completed_at'),
                  'steps': [
                      {
                          'number': step.get('number'),
                          'name': step.get('name'),
                          'status': step.get('status'),
                          'conclusion': step.get('conclusion'),
                      }
                      for step in job.get('steps', [])
                  ],
              })
          out = {
              'schema_version': 1,
              'observed_by_run_id': int(os.environ['GITHUB_RUN_ID']),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'target': {
                  'id': run.get('id'),
                  'name': run.get('name'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'run_number': run.get('run_number'),
                  'run_attempt': run.get('run_attempt'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'run_started_at': run.get('run_started_at'),
                  'html_url': run.get('html_url'),
              },
              'jobs': jobs,
          }
          Path('/tmp/latest.json').write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          PY
          fi
          cat /tmp/latest.json

      - name: Publish the disposable status branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name undercast-estate-observer
          git config user.email undercast-estate-observer@users.noreply.github.com
          git switch --orphan gredd-recovery-status
          git rm -rf .
          mkdir -p status
          cp /tmp/latest.json status/latest.json
          git add status/latest.json
          git diff --cached --check
          git commit -m 'Status: observe Gredd cycle-002 recovery run'
          git push --force origin "HEAD:refs/heads/${STATUS_BRANCH}"

# bootstrap generation: merged push authority
