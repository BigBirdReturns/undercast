name: observe-gredd-cycle-002-recovery

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/observe-gredd-cycle-002-recovery.yml"
  workflow_run:
    workflows:
      - dispatch-complete-gredd-cycle-002-recovery
    types:
      - requested
      - in_progress
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: observe-gredd-cycle-002-recovery-${{ github.event_name }}
  cancel-in-progress: true

env:
  TARGET_WORKFLOW: dispatch-complete-gredd-cycle-002-recovery.yml
  GH_TOKEN: ${{ github.token }}

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture the exact target run, jobs, and steps
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi
          if [[ -z "$run_id" ]]; then
            printf '%s\n' '{"target":null,"reason":"no_target_workflow_run_found"}'
            exit 0
          fi
          test "$run_id" -gt 0
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{id,name,event,status,conclusion,run_number,run_attempt,head_branch,head_sha,created_at,updated_at,run_started_at,html_url}'
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
            --jq '{jobs:[.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{number,name,status,conclusion}]}]}'

# exact-current-main recovery rearm
