name: close-star-trek-media-debt-before-doctor-who-cycle-002

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/doctor-who-cycle-002-preflight.yml"

permissions:
  contents: write

concurrency:
  group: close-star-trek-media-debt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/doctor-who-cycle-002-preflight.yml

jobs:
  close-debt:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact current main and two-facet debt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=2 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXACT_MAIN"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"

          reviewed_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          echo "REVIEWED_AT=$reviewed_at" >> "$GITHUB_ENV"
          echo "reviewed_at=$reviewed_at" >> "$GITHUB_STEP_SUMMARY"
          echo "exact_main=$EXACT_MAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact second-desk portrait rulings
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json', 'utf8'));
          const EXPECTED_ITEM_SET = '8c6a4e69622db4bf6d5a4e09f921da24b187e0fb053d685ba05499999efc6e00';
          const PACKET_ID = 'map_248f90e9651c5d7606bb99ad';
          const PACKET_RUN = '30795161692';
          const expected = [
            {
              item_id: 'ma_b4db4044d1cb29ba3d44d6ba',
              wall_id: 'UC-1092',
              actor: 'Rick Worthy',
              character: 'Jannar',
              sha256: '5c73e975be5ba36ed295422f0c789a10a1017886759769590907c2c6171b6933',
              origin: 'https://commons.wikimedia.org/wiki/File:Rick_Worthy_2013_(cropped).jpg',
            },
            {
              item_id: 'ma_2ecca7518d419b643634731a',
              wall_id: 'UC-684',
              actor: 'James Doohan',
              character: 'Lieutenant Arex',
              sha256: '1a2d9a32dbbc05fdba1e4ba6fbfea7dd1b619c1f01a8f0f9f7383f64d54f579c',
              origin: 'https://commons.wikimedia.org/wiki/File:Doohan_James_NASA_19670413.jpg',
            },
          ];
          if (state.source?.item_set_sha256 !== EXPECTED_ITEM_SET) throw new Error('media item-set receipt drifted');
          const open = state.items.filter((row) => row.scope === 'star-trek' && !['verified', 'absent'].includes(row.status));
          if (open.length !== 2) throw new Error(`expected exactly two Star Trek media debts, found ${open.length}`);
          for (const want of expected) {
            const item = state.items.find((row) => row.id === want.item_id);
            if (!item) throw new Error(`missing item ${want.item_id}`);
            if (item.wall_id !== want.wall_id || item.side !== 'portrait' || item.actor !== want.actor || item.expected_subject !== want.actor || item.character !== want.character) throw new Error(`identity envelope drifted for ${want.item_id}`);
            if (item.status !== 'review' || item.asset?.sha256 !== want.sha256 || item.asset?.origin !== want.origin || item.votes.length !== 0 || item.risk_codes.length !== 0) throw new Error(`review state drifted for ${want.item_id}`);
          }
          if (open.some((row) => !expected.some((want) => want.item_id === row.id))) throw new Error('unexpected Star Trek media debt entered the transaction');

          const votes = expected.flatMap((item) => [
            {
              item_id: item.item_id,
              namespace: 'identity',
              value: 'expected',
              note: `Exact Commons provenance names the expected performer and is bound to asset SHA-256 ${item.sha256}.`,
              evidence: [
                { type: 'source-provenance', value: item.origin },
                { type: 'hash-bound-packet', value: `${PACKET_ID} from workflow run ${PACKET_RUN}; asset ${item.sha256}` },
              ],
              enforced: true,
            },
            {
              item_id: item.item_id,
              namespace: 'presentation',
              value: 'neutral-human',
              note: 'Hash-bound image shows one uncostumed human subject without role makeup, prosthetics, or character depiction.',
              evidence: [
                { type: 'visual-review', value: `${PACKET_ID}; exact asset ${item.sha256}; single human portrait, no role presentation` },
              ],
              enforced: true,
            },
          ]);
          const resolution = {
            version: 2,
            reviewed_by: 'chatgpt-second-desk',
            reviewed_role: 'second-desk',
            reviewed_at: process.env.REVIEWED_AT,
            packet_id: PACKET_ID,
            packet_run: Number(PACKET_RUN),
            votes,
          };
          fs.writeFileSync('/tmp/star-trek-media-debt-resolution.json', JSON.stringify(resolution, null, 2) + '\n');
          console.log(JSON.stringify(resolution, null, 2));
          NODE

          node scripts/media-audit.mjs resolve \
            --input /tmp/star-trek-media-debt-resolution.json 2>&1 \
            | tee /tmp/star-trek-media-debt-resolution.log
          node scripts/media-audit.mjs validate
          node scripts/media-audit.mjs status --scope star-trek --json \
            > /tmp/star-trek-media-status-after.json
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/corpus-ops.mjs validate
          node scripts/corpus-ops.mjs status --json > /tmp/corpus-status-after.json
          node scripts/corpus-ops.mjs next --json > /tmp/corpus-next-after.json
          node scripts/waterline.mjs validate --scope star-trek
          node scripts/waterline.mjs status --scope star-trek --json \
            > /tmp/star-trek-waterline-after.json
          npm run doctor-who:pilot-cycle:check

          node - <<'NODE'
          const fs = require('fs');
          const media = JSON.parse(fs.readFileSync('/tmp/star-trek-media-status-after.json', 'utf8'));
          const corpus = JSON.parse(fs.readFileSync('/tmp/corpus-status-after.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('/tmp/corpus-next-after.json', 'utf8'));
          const waterline = JSON.parse(fs.readFileSync('/tmp/star-trek-waterline-after.json', 'utf8'));
          if (media.total !== 882 || media.complete !== 882 || media.verified !== 612 || media.absent !== 270 || media.review !== 0 || media.attention !== 0) throw new Error(`unexpected closed media summary ${JSON.stringify(media)}`);
          const trek = corpus.estates.find((row) => row.id === 'star-trek');
          if (!trek || trek.media?.debt !== 0 || trek.media?.verified !== 612 || trek.media?.absent !== 270) throw new Error('corpus Star Trek media debt did not close');
          if (next.kind === 'close-media-debt' && next.estate === 'star-trek') throw new Error('corpus scheduler still selects the retired Star Trek media debt');
          if (waterline.media?.debt !== 0 || waterline.phase === 'media-catch-up') throw new Error('Star Trek waterline did not leave media catch-up');
          const summary = {
            version: 1,
            transaction: 'STAR-TREK-MEDIA-DEBT-CLOSURE-BEFORE-DOCTOR-WHO-CYCLE-002',
            exact_main: process.env.EXACT_MAIN,
            reviewed_at: process.env.REVIEWED_AT,
            packet_id: 'map_248f90e9651c5d7606bb99ad',
            packet_run: 30795161692,
            items: [
              { item_id: 'ma_b4db4044d1cb29ba3d44d6ba', wall_id: 'UC-1092', asset_sha256: '5c73e975be5ba36ed295422f0c789a10a1017886759769590907c2c6171b6933' },
              { item_id: 'ma_2ecca7518d419b643634731a', wall_id: 'UC-684', asset_sha256: '1a2d9a32dbbc05fdba1e4ba6fbfea7dd1b619c1f01a8f0f9f7383f64d54f579c' },
            ],
            media_after: media,
            corpus_next_after: next,
            waterline_after: waterline,
            product_paths: ['data/MEDIA-AUDIT.json', 'data/journal/media-audit.jsonl'],
            boundary: {
              lease_issued: false,
              canonical_mutated: false,
              source_ledger_mutated: false,
              doctor_who_state_mutated: false,
            },
          };
          fs.writeFileSync('/tmp/star-trek-media-debt-closure-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Stage exact workflow-free two-path product and run candidate gate
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm -f "$SELF"
          git add -A

          cat > /tmp/expected-product-paths.txt <<'PATHS'
          data/MEDIA-AUDIT.json
          data/journal/media-audit.jsonl
          PATHS
          git diff --cached --name-only "$EXACT_MAIN" | sort > /tmp/candidate-product-paths.txt
          diff -u /tmp/expected-product-paths.txt /tmp/candidate-product-paths.txt
          git diff --cached --check
          test -z "$(git diff --name-only)"

          npm run gate 2>&1 | tee /tmp/star-trek-media-debt-candidate-gate.log

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit exact product and run complete final-tree gate
        run: |
          set -euo pipefail
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Media audit: close the final Star Trek portrait debt' \
            -m 'enforce exact Rick Worthy and James Doohan portrait rulings' \
            -m 'restore zero-debt collection sequencing before another estate cycle'

          new_head="$(git rev-parse HEAD)"
          echo "NEW_HEAD=$new_head" >> "$GITHUB_ENV"
          echo "product_head=$new_head" >> "$GITHUB_STEP_SUMMARY"

          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/final-product-paths.txt
          diff -u /tmp/expected-product-paths.txt /tmp/final-product-paths.txt
          git diff --check "$EXACT_MAIN"...HEAD

          npm run gate 2>&1 | tee /tmp/star-trek-media-debt-final-gate.log

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          test -z "$(git status --porcelain)"
          git ls-tree -r --name-only HEAD > /tmp/star-trek-media-debt-final-tree.txt
          ! grep -Fx "$SELF" /tmp/star-trek-media-debt-final-tree.txt

      - name: Publish exact two-path product under branch lease
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"

          echo "published_head=$NEW_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "product_paths=2" >> "$GITHUB_STEP_SUMMARY"
          echo "lease_issued=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact rulings and complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-media-debt-closure-${{ github.run_id }}
          path: |
            /tmp/star-trek-media-debt-resolution.json
            /tmp/star-trek-media-debt-resolution.log
            /tmp/star-trek-media-status-after.json
            /tmp/corpus-status-after.json
            /tmp/corpus-next-after.json
            /tmp/star-trek-waterline-after.json
            /tmp/star-trek-media-debt-closure-summary.json
            /tmp/star-trek-media-debt-candidate-gate.log
            /tmp/star-trek-media-debt-final-gate.log
            /tmp/expected-product-paths.txt
            /tmp/candidate-product-paths.txt
            /tmp/final-product-paths.txt
            /tmp/star-trek-media-debt-final-tree.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
