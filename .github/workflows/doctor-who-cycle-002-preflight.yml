name: doctor-who-cycle-002-read-only-preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/doctor-who-cycle-002-preflight.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-002-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 04551b140022c7b733b0290e10c7e40905aabc76
  WORKFLOW_PATH: .github/workflows/doctor-who-cycle-002-preflight.yml
  ACTIVE_PROFILE: text-vision

jobs:
  preflight:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact current main and read-only transport
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=8 origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          printf '%s\n' "$WORKFLOW_PATH" > /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Install exact dependencies
        run: npm ci

      - name: Reprove permanent custody and enumerate compatible work
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs validate
          npm run activation:check
          npm run doctor-who:pilot-cycle:check
          node scripts/waterline.mjs validate --scope doctor-who
          node scripts/waterline.mjs status --scope doctor-who --json > /tmp/doctor-who-waterline.json
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > /tmp/doctor-who-readiness.json
          node scripts/autopilot.mjs status --scope doctor-who --json > /tmp/doctor-who-autopilot-status.json
          cp data/AUTOPILOT-CAPABILITIES.json /tmp/doctor-who-capability-policy.json
          node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile "$ACTIVE_PROFILE" --limit 100 --json > /tmp/doctor-who-candidates.json
          node scripts/corpus-ops.mjs next --json > /tmp/corpus-next.json
          test -z "$(git status --porcelain)"

          node - <<'NODE'
          const fs = require('fs');
          const read = (name) => JSON.parse(fs.readFileSync(`/tmp/${name}`, 'utf8'));
          const waterline = read('doctor-who-waterline.json');
          const readiness = read('doctor-who-readiness.json');
          const status = read('doctor-who-autopilot-status.json');
          const policy = read('doctor-who-capability-policy.json');
          const candidates = read('doctor-who-candidates.json');
          const next = read('corpus-next.json');
          const profiles = policy.profiles.map(({ id, status, capabilities }) => ({ id, status, capabilities }));
          const summary = {
            exact_main: process.env.EXACT_MAIN,
            lease_issued: false,
            active_profile: process.env.ACTIVE_PROFILE,
            declared_profiles: profiles,
            waterline,
            readiness,
            autopilot: status,
            candidate_counts: candidates.counts,
            first_compatible: candidates.compatible.slice(0, 20),
            first_incompatible: candidates.incompatible.slice(0, 20),
            corpus_next: next,
          };
          fs.writeFileSync('/tmp/doctor-who-cycle-002-readonly-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload exact read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-readonly-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/doctor-who-waterline.json
            /tmp/doctor-who-readiness.json
            /tmp/doctor-who-autopilot-status.json
            /tmp/doctor-who-capability-policy.json
            /tmp/doctor-who-candidates.json
            /tmp/corpus-next.json
            /tmp/doctor-who-cycle-002-readonly-summary.json
