name: doctor-who-cycle-012-preflight-v6-repair2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v6-repair2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v6-repair2
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v6
      SOURCE_PATH: .github/workflows/doctor-who-cycle-012-preflight-v6.yml
      REPAIR1_PATH: .github/workflows/doctor-who-cycle-012-preflight-v6-repair.yml
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v6-repair2.yml
      SOURCE_BLOB: eecd8ef67d2fcdea6e348357b66519444814b7f4
      BOOTSTRAP: /tmp/doctor-who-cycle-012-preflight-v6-repair2-bootstrap
      OUT: /tmp/doctor-who-cycle-012-preflight-v6-repair2
      PROOF_PACKET: /tmp/doctor-who-cycle-012-preflight-v6-repair2-proof
      PROOF_PR: "856"
      PROOF_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4
      PROOF_HEAD: f47f0845de78496f20f3ce4446921ce1d9637afd
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v4-31360254095-attempt-1
      PROOF_ARTIFACT_SHA256: 3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1","agent/doctor-who-cycle-012-preflight-v4","agent/doctor-who-cycle-012-preflight-v5"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"},{"pr":857,"branch":"agent/doctor-who-cycle-012-preflight-v4"},{"pr":858,"branch":"agent/doctor-who-cycle-012-preflight-v5"}]'
      PRIOR_SELECTOR_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PRIOR_SELECTOR_PATH: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      PRIOR_SELECTOR_BLOB: 49e902869ea04409d40690dff73e7ad10f8cc5c1
      ACTIVE_PROFILE: text-vision
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover and execute exact V6 selector with lifecycle-neutral proof custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,scripts}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r '.content' "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source.yml"
          test "$(git hash-object --stdin < "$BOOTSTRAP/source.yml")" = "$SOURCE_BLOB"

          SOURCE="$BOOTSTRAP/source.yml" TARGET="$BOOTSTRAP/scripts" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ['SOURCE']).read_text()
          lines = source.splitlines(keepends=True)
          names = [
              'Bind one-commit current-main selector and disjoint cleanup ancestry',
              'Authenticate terminal proof and freeze live transport custody',
              'Rerun current-main queue, media, waterline, and rendered gates',
              'Recover and execute exact repository-native selector',
          ]

          def extract(name: str) -> str:
              marker = f'- name: {name}'
              starts = [index for index, line in enumerate(lines) if line.strip() == marker]
              assert len(starts) == 1, (name, starts)
              start = starts[0]
              run_index = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'run: |')
              run_indent = len(lines[run_index]) - len(lines[run_index].lstrip(' '))
              content_indent = run_indent + 2
              output = []
              for line in lines[run_index + 1:]:
                  if line.strip() == '':
                      output.append('\n')
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  if indent < content_indent:
                      break
                  output.append(line[content_indent:])
              script = ''.join(output)
              assert script.startswith('set -euo pipefail\n'), name
              return script

          scripts = [extract(name) for name in names]
          first, second = scripts[0], scripts[1]
          expression_open = '$' + '{{'
          carrier_block = (
              'git diff --name-status "$MAIN"...HEAD | LC_ALL=C sort > "$OUT/logs/carrier.tsv"\n'
              'printf \'A\\t%s\\nA\\t%s\\nA\\t%s\\n\' "$SOURCE_PATH" "$REPAIR1_PATH" "$SELF" | LC_ALL=C sort > "$OUT/logs/expected-carrier.tsv"\n'
              'cmp "$OUT/logs/carrier.tsv" "$OUT/logs/expected-carrier.tsv"'
          )
          first_replacements = [
              ("head='" + expression_open + " github.event.pull_request.head.sha }}'", 'head="$CURRENT_HEAD"'),
              ("base='" + expression_open + " github.event.pull_request.base.sha }}'", 'base="$CURRENT_BASE"'),
              ("pr='" + expression_open + " github.event.pull_request.number }}'", 'pr="$CURRENT_PR"'),
              ('test "$(git show -s --format=%P HEAD)" = "$MAIN"', 'test "$(git merge-base "$MAIN" HEAD)" = "$MAIN"'),
              ('test "$(git rev-list --count "$MAIN"..HEAD)" = 1', 'test "$(git rev-list --count "$MAIN"..HEAD)" = 3'),
              ('test "$(git diff --name-status "$MAIN"...HEAD)" = $\'A\\t\'"$SELF"', carrier_block),
              ("assert carrier['commits'] == 1 and carrier['changed_files'] == 1", "assert carrier['commits'] == 3 and carrier['changed_files'] == 3"),
              ("assert proof_pr['state'] == 'open' and proof_pr['draft'] is True and proof_pr['merged_at'] is None", "assert proof_pr['state'] in {'open','closed'} and proof_pr['draft'] is True and proof_pr['merged_at'] is None"),
          ]
          second_replacements = [
              ("assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] == 'open' and proof_pr['merged_at'] is None", "assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] in {'open','closed'} and proof_pr['draft'] is True and proof_pr['merged_at'] is None"),
          ]
          census = []
          for target_name, replacements in [('first', first_replacements), ('second', second_replacements)]:
              script = first if target_name == 'first' else second
              for old, new in replacements:
                  count = script.count(old)
                  assert count == 1, (target_name, old, count)
                  script = script.replace(old, new, 1)
                  census.append({'program': target_name, 'old_sha256': hashlib.sha256(old.encode()).hexdigest(), 'new_sha256': hashlib.sha256(new.encode()).hexdigest()})
              if target_name == 'first': first = script
              else: second = script
          scripts[0], scripts[1] = first, second
          assert len(census) == 9
          target = Path(os.environ['TARGET'])
          for index, script in enumerate(scripts, 1):
              (target / f'{index:02d}.sh').write_text(script)
          receipt = {
              'status': 'cycle-012-preflight-v6-programs-recovered-and-repaired-v2',
              'version': 2,
              'source': {'git_blob': os.environ['SOURCE_BLOB'], 'bytes': len(source.encode()), 'sha256': hashlib.sha256(source.encode()).hexdigest()},
              'programs': [{'index': index, 'name': name, 'bytes': len(script.encode()), 'sha256': hashlib.sha256(script.encode()).hexdigest()} for index, (name, script) in enumerate(zip(names, scripts), 1)],
              'repair_census': census,
              'proof_pr_state_is_transport_only': True,
              'boundary': {'repository_write': False, 'canonical_mutation': False, 'transport_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (target / 'recovery.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          for script in "$BOOTSTRAP"/scripts/[0-9][0-9].sh; do bash -n "$script"; done
          load_github_env() {
            if [ -s "$GITHUB_ENV" ]; then
              while IFS='=' read -r key value; do [ -n "$key" ] || continue; export "$key=$value"; done < "$GITHUB_ENV"
            fi
          }
          for script in "$BOOTSTRAP"/scripts/[0-9][0-9].sh; do
            bash "$script"
            load_github_env
            if [ "$(basename "$script")" = '01.sh' ]; then cp "$BOOTSTRAP/scripts/recovery.json" "$OUT/receipt/program-recovery.json"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v6-repair2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v6-repair2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v6-repair2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v6-repair2
            /tmp/doctor-who-cycle-012-preflight-v6-repair2-proof
            /tmp/doctor-who-cycle-012-preflight-v6-repair2-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
