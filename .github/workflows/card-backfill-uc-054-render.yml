name: card-backfill-uc-054-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-054-RENDER.json"
      - "scripts/card-backfill-uc-054-render.mjs"
      - ".github/workflows/card-backfill-uc-054-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-054-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-008'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-008
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact reviewed Betelgeuse authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-054-RENDER.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-054'||row.actor!=='Michael Keaton'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-054 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8634852725||row.discovery_artifact?.head_sha!=='2ef545b75973051478db8bc12f7f86e4cd9f2859')throw new Error('UC-054 discovery custody drift');
          if(row.selection?.sha256!=='19b340e06492e4cc96f7dfe2534260bd0eff674ee664fd3192c5c85be07c6b52')throw new Error('UC-054 selected candidate drift');
          if(row.alternate_visual_duplicate?.sha256!=='8447b68e2d5acfe07a9f0d782075f0289f19d6da14d1c8b85f828bde0bf0eab1')throw new Error('UC-054 alternate receipt drift');
          console.log('PASS — exact 1988 Betelgeuse source authorized');
          NODE
      - name: Retrieve and verify the exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-054-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8634852725/zip" > "$root/discovery.zip"
          echo "417567ac58d8c06d54396acdc272cd880be827a0357f17e01331e61e7991eee9  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-054/manifest.json"
          echo "19b340e06492e4cc96f7dfe2534260bd0eff674ee664fd3192c5c85be07c6b52  $root/source/card-backfill-uc-054/candidates/08-yahoo-transformation-yahoo-entertainment.webp" | sha256sum -c -
          echo "8447b68e2d5acfe07a9f0d782075f0289f19d6da14d1c8b85f828bde0bf0eab1  $root/source/card-backfill-uc-054/candidates/02-yahoo-transformation-yahoo-entertainment.webp" | sha256sum -c -
          echo "b3bb916d90c88fc2ef9249fcd6563dd44e975a7242900e5c885e05708c01acd6  $root/source/card-backfill-uc-054/pages/yahoo-transformation.png" | sha256sum -c -
          echo "bfd8f807976e4b06abf0052f18edaa93e6a4ec8b3f79fca7d4d5634ac62e76bb  $root/source/card-backfill-uc-054/manifest.json" | sha256sum -c -
      - name: Render exact Betelgeuse candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-054-render/source/card-backfill-uc-054
          OUT: ${{ runner.temp }}/card-backfill-uc-054-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-054-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-054-render/render.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-054-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-054-render/output
            ${{ runner.temp }}/card-backfill-uc-054-render/render.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
