name: star-trek-kzinti-flyer-probe-v1

on:
  push:
    branches:
      - agent/star-trek-next-bounded-cycle-claim

concurrency:
  group: star-trek-kzinti-flyer-probe-v1
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  probe:
    name: unitkzinti-flyer-probe-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      REQUIRED_PREDECESSOR: 0e1abdcf7c3880474b511573449f203728ab9808
      EXPECTED_TASK: ap_8f2b1b123aa02bbbb27d00b4
      RESULT_BRANCH: agent/star-trek-kzinti-flyer-probe-result-v1
      ROOT: /tmp/kzinti-flyer-probe-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Wait for and bind exact Lwaxana rejection predecessor
        run: |
          set -euo pipefail
          carrier_head="$(git rev-parse HEAD)"
          live=''
          for attempt in $(seq 1 360); do
            live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            test "$live" = "$REQUIRED_PREDECESSOR" && break
            test "$live" = 47296e8a7947384b04275962b8f6a125e5306680 || { echo "unexpected live main: $live"; exit 1; }
            sleep 5
          done
          test "$live" = "$REQUIRED_PREDECESSOR"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$REQUIRED_PREDECESSOR"
          git checkout --detach "$REQUIRED_PREDECESSOR"
          npm ci --ignore-scripts
          node scripts/star-trek-kukulkan-cycle.mjs
          rejection_checker="$(git diff-tree --no-commit-id --name-only -r HEAD | grep -E '^scripts/star-trek-lwaxana.*\.mjs$' | head -1)"
          test -n "$rejection_checker"
          node "$rejection_checker"
          node scripts/thesis-rails.mjs validate --json > "$ROOT/thesis-status.json"
          node scripts/thesis-rails.mjs next --json > "$ROOT/thesis-next.json"
          jq -e --arg task "$EXPECTED_TASK" '.phase == "ready-for-one-cycle" and .candidate.task_id == $task and .candidate.character == "Kzinti Flyer" and .candidate.performer == "James Doohan" and (.candidate.performance_modes | index("voice-animation")) != null' "$ROOT/thesis-next.json" >/dev/null
          jq --arg task "$EXPECTED_TASK" '.jobs[] | select(.id == $task)' data/AUTOPILOT.json > "$ROOT/task.json"
          jq -e '.status == "queued" and .character == "Kzinti Flyer" and .performer == "James Doohan"' "$ROOT/task.json" >/dev/null
          cp "$rejection_checker" "$ROOT/predecessor-checker-path.txt"
          printf '%s\n' "$carrier_head" > "$ROOT/carrier-head.txt"

      - name: Freeze exact Kzinti Flyer source and determine eligibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone
          import hashlib, json, re
          root=Path('/tmp/kzinti-flyer-probe-v1')
          task=json.loads((root/'task.json').read_text())
          source=task['source']
          title=source.rsplit('/',1)[-1].replace('_',' ')
          api='https://memory-alpha.fandom.com/api.php?'+urlencode({
              'action':'query','prop':'revisions','titles':title,
              'rvprop':'ids|timestamp|content','rvslots':'main','format':'json','formatversion':'2'
          })
          req=Request(api,headers={'User-Agent':'UNDERCAST-Kzinti-Flyer-Probe/1.0','Accept':'application/json'})
          with urlopen(req,timeout=90) as response: data=json.load(response)
          pages=data['query']['pages']
          if len(pages)!=1 or pages[0].get('missing'): raise SystemExit(f'source missing: {pages}')
          page=pages[0]; revs=page.get('revisions') or []
          if len(revs)!=1: raise SystemExit('source revision cardinality drifted')
          rev=revs[0]; text=rev['slots']['main']['content']
          content_sha=hashlib.sha256(text.encode()).hexdigest()
          performer='James Doohan'
          role='Kzinti Flyer'
          lower=text.lower()
          if performer.lower() not in lower: raise SystemExit('performer attribution absent from frozen source')
          voice_markers=('voice','voiced by','voice actor','voice actors')
          voice_supported=any(marker in lower for marker in voice_markers)
          if not voice_supported: raise SystemExit('voice performance wording absent from frozen source')
          physical_terms=('portrayed by','played by','physical performer','suit performer')
          physical_supported=any(term in lower for term in physical_terms)
          generated=datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          receipt={
            'version':1,
            'transaction':'STAR-TREK-KZINTI-FLYER-SOURCE-PROBE-V1',
            'status':'success',
            'generated_at':generated,
            'canonical_parent':'0e1abdcf7c3880474b511573449f203728ab9808',
            'task_id':'ap_8f2b1b123aa02bbbb27d00b4',
            'source_fingerprint':task['source_fingerprint'],
            'character':role,
            'performer':performer,
            'source':source,
            'pageid':page['pageid'],
            'revision':rev['revid'],
            'revision_timestamp':rev['timestamp'],
            'content_sha256':content_sha,
            'queued_mode_hint':task.get('performance_modes'),
            'adjudicated_kind':'voice',
            'adjudicated_performance_mode':'voice / voice-only',
            'voice_performance_supported':True,
            'physical_performance_supported':physical_supported,
            'maker_attribution':'unresolved',
            'animation_maker_attribution':'unresolved',
            'character_design_maker_attribution':'unresolved',
            'voice_direction_attribution':'unresolved',
            'editing_attribution':'unresolved',
            'sound_processing_attribution':'unresolved',
            'production_shop_attribution':'unresolved',
            'vocal_transformation_measured':False,
            'canonical_mutation':False,
            'lease_taken':False,
          }
          body=json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n'
          receipt['receipt_sha256']=hashlib.sha256(body.encode()).hexdigest()
          (root/'source-probe.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n')
          (root/'frozen-source.wikitext').write_text(text)
          (root/'frozen-source-api.json').write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          PY
          jq -e '.status == "success" and .canonical_parent == "0e1abdcf7c3880474b511573449f203728ab9808" and .task_id == "ap_8f2b1b123aa02bbbb27d00b4" and .character == "Kzinti Flyer" and .performer == "James Doohan" and .adjudicated_performance_mode == "voice / voice-only" and .maker_attribution == "unresolved" and .canonical_mutation == false and .lease_taken == false' "$ROOT/source-probe.json" >/dev/null

      - name: Upload exact non-mutating Kzinti Flyer probe
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kzinti-flyer-source-probe-v1
          path: /tmp/kzinti-flyer-probe-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish probe locator without taking a lease
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$REQUIRED_PREDECESSOR"
          git fetch --filter=blob:none --no-tags origin main
          git checkout --detach FETCH_HEAD
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/kzinti-flyer-probe-v1
          mkdir -p transport/kzinti-flyer-probe-v1
          cp "$ROOT/source-probe.json" transport/kzinti-flyer-probe-v1/
          cp "$ROOT/thesis-next.json" transport/kzinti-flyer-probe-v1/
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-KZINTI-FLYER-PROBE-LOCATOR-V1 \
            --arg status success \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --arg workflow_head "$GITHUB_SHA" \
            --arg canonical_parent "$REQUIRED_PREDECESSOR" \
            --arg task_id "$EXPECTED_TASK" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_sha256 "${ARTIFACT_DIGEST#sha256:}" \
            --arg source_receipt_sha256 "$(jq -r .receipt_sha256 "$ROOT/source-probe.json")" \
            '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,canonical_parent:$canonical_parent,task_id:$task_id,artifact:{id:$artifact_id,sha256:$artifact_sha256,name:"star-trek-kzinti-flyer-source-probe-v1"},source_receipt_sha256:$source_receipt_sha256,canonical_mutation:false,lease_taken:false}' \
            > transport/kzinti-flyer-probe-v1/locator.json
          git config user.name undercast-kzinti-flyer-probe
          git config user.email kzinti-flyer-probe@users.noreply.github.com
          git add transport/kzinti-flyer-probe-v1
          git commit -m 'Kzinti Flyer: publish exact non-mutating source probe'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
