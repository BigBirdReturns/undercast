name: apply-doctor-who-pilot-cycle-001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-doctor-who-pilot-cycle-001.yml"
      - "scripts/apply-doctor-who-pilot-cycle-001.mjs"

permissions:
  contents: write

concurrency:
  group: apply-doctor-who-pilot-cycle-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/apply-doctor-who-pilot-cycle-001.yml
  MATERIALIZER: scripts/apply-doctor-who-pilot-cycle-001.mjs

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact current main and live Doctor Who lease
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

          node - <<'NODE'
          const fs = require('fs');
          const TASK_ID = 'ap_6dfcb7b9254c26dc3f4b46b8';
          const LEASE_ID = 'lease_51e3223a4810f3681aff9df4';
          const SOURCE_FINGERPRINT = 'f272dd90028ca998792a461c1547a334d58f7976484ff7ee2d299306763e0879';
          const state = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const task = state.jobs.find((row) => row.id === TASK_ID);
          const doctor = state.jobs.filter((row) => row.scope === 'doctor-who');
          const observed = task ? {
            id: task.id,
            scope: task.scope,
            status: task.status,
            queueable: task.queueable,
            performer: task.performer,
            character: task.character,
            source_fingerprint: task.source_fingerprint,
            lease: task.lease || null,
            attempt: task.attempt,
            draft: task.draft || null,
            result: task.result || null,
          } : null;
          const report = {
            expected: {
              task_id: TASK_ID,
              lease_id: LEASE_ID,
              scope: 'doctor-who',
              status: 'leased',
              performer: 'Dan Starkey',
              character: 'Commander (The Sontarans)',
              source_fingerprint: SOURCE_FINGERPRINT,
              total_doctor_who_tasks: 316,
              leased_doctor_who_tasks: 1,
            },
            observed,
            doctor_who: {
              total: doctor.length,
              statuses: doctor.reduce((out, row) => {
                out[row.status] = (out[row.status] || 0) + 1;
                return out;
              }, {}),
              leased: doctor.filter((row) => row.status === 'leased').map((row) => ({
                id: row.id,
                performer: row.performer,
                character: row.character,
                lease: row.lease || null,
              })),
            },
          };
          fs.writeFileSync('/tmp/doctor-who-live-lease-diagnostic.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));

          const failures = [];
          if (!task) failures.push(`task ${TASK_ID} is missing`);
          if (task && task.scope !== 'doctor-who') failures.push(`scope=${task.scope}`);
          if (task && task.status !== 'leased') failures.push(`status=${task.status}`);
          const observedLease = task && (task.lease?.id || task.lease?.lease_id || null);
          if (task && observedLease !== LEASE_ID) failures.push(`lease=${observedLease}`);
          if (task && task.performer !== 'Dan Starkey') failures.push(`performer=${task.performer}`);
          if (task && task.character !== 'Commander (The Sontarans)') failures.push(`character=${task.character}`);
          if (task && task.source_fingerprint !== SOURCE_FINGERPRINT) failures.push(`source_fingerprint=${task.source_fingerprint}`);
          if (doctor.length !== 316) failures.push(`doctor_who_total=${doctor.length}`);
          const leased = doctor.filter((row) => row.status === 'leased');
          if (leased.length !== 1) failures.push(`doctor_who_leased=${leased.length}`);
          if (failures.length) throw new Error(`live Doctor Who lease binding failed: ${failures.join('; ')}`);
          NODE

      - name: Apply one exact terminal and reviewed Doctor Who cycle
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-doctor-who-pilot-cycle-001.mjs')
          s = p.read_text()
          old = "const abs = (p) => path.join(ROOT, p);"
          new = "const abs = (p) => path.isAbsolute(p) ? p : path.join(ROOT, p);"
          if old not in s:
              raise SystemExit('materializer path helper drifted')
          s = s.replace(old, new)
          old_results = "      const results = {\n        version: 1,\n        lease_id: LEASE_ID,\n        results: [{ task_id: TASK_ID, [key]: value, draft }],\n      };"
          new_results = "      const results = {\n        version: 1,\n        lease_id: LEASE_ID,\n        agent: batch.agent,\n        results: [{ task_id: TASK_ID, [key]: value, draft }],\n      };"
          if old_results not in s:
              raise SystemExit('materializer result-envelope drifted')
          p.write_text(s.replace(old_results, new_results))
          PY
          node --check "$MATERIALIZER"
          cycle_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          export CYCLE_AT="$cycle_at"
          echo "CYCLE_AT=$cycle_at" >> "$GITHUB_ENV"
          node "$MATERIALIZER" 2>&1 | tee /tmp/doctor-who-pilot-cycle-materializer.log

      - name: Publish exact workflow-free cycle product under lease
        run: |
          set -euo pipefail
          npm run doctor-who:pilot-cycle:check

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm "$SELF" "$MATERIALIZER"
          git add -A
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Pilot: complete the first Doctor Who corpus cycle' \
            -m 'resolve the exact Dan Starkey voice task with honest null media' \
            -m 'record the reviewed cycle receipt and issue no second lease'
          new_head="$(git rev-parse HEAD)"

          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/doctor-who-pilot-final-paths.txt
          if grep -Eq '^\.github/|^scripts/apply-doctor-who-pilot-cycle-001\.mjs$|^records/|^test-results/|^playwright-report/' /tmp/doctor-who-pilot-final-paths.txt; then
            echo 'transport or generated runtime survived the product diff' >&2
            cat /tmp/doctor-who-pilot-final-paths.txt >&2
            exit 1
          fi
          git diff --stat refs/remotes/origin/main...HEAD > /tmp/doctor-who-pilot-final-stat.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"
          echo "base_sha=${EXACT_MAIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "cycle_at=${CYCLE_AT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact cycle, gate, receipt, and path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-pilot-cycle-001-${{ github.run_id }}
          path: |
            /tmp/doctor-who-live-lease-diagnostic.json
            /tmp/doctor-who-pilot-cycle-materializer.log
            /tmp/doctor-who-pre-cycle-gate.log
            /tmp/doctor-who-product-gate-1.log
            /tmp/doctor-who-product-gate-final.log
            /tmp/doctor-who-pilot-batch.json
            /tmp/doctor-who-pilot-results.json
            /tmp/doctor-who-media-review.json
            /tmp/doctor-who-pilot-final-paths.txt
            /tmp/doctor-who-pilot-final-stat.txt
            data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0