name: estate-audit-packet-review-incompatible-009

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-audit-packet-review-incompatible-009.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-audit-packet-review-incompatible-009
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  SCRIPT: scripts/estate-audit-packet-review-incompatible-009.mjs
  OUT: data/review/estate-debt/COLLECT-009-PACKET-REVIEW-INCOMPATIBLE-AUDIT.json

jobs:
  audit:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Classify the complete sixteen-packet incompatible lane
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          node --check "$SCRIPT"
          node "$SCRIPT" --head "$AUTHORIZED_HEAD" --out "$OUT" --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/COLLECT-009-audit-summary.json
          test "$(node -p "require('./$OUT').denominator.incompatible_packets")" = "16"
          test "$(node -p "require('./$OUT').denominator.reviewed")" = "16"
          test "$(node -p "require('./$OUT').denominator.total_remaining_estate")" = "17"
          test "$(node -p "require('./$OUT').boundary.canonical_mutation")" = "false"

      - name: Stage immutable audit and retire temporary classifier
        run: |
          set -euo pipefail
          git rm "$SCRIPT"
          git add -- "$OUT"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' "$OUT" "$SCRIPT" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-009-audit.tree

      - name: Gate repository without redundant rendered-browser pass
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-009-audit.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish exact classified denominator under lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          SAFE="$(node -p "require('./$OUT').denominator.adapter_only_safe")"
          OTHER="$(node -p "require('./$OUT').denominator.requires_non_adapter_work")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: classify complete incompatible packet lane' \
            -m 'transaction=COLLECT-009' \
            -m 'reviewed=16' \
            -m "adapter_only_safe=${SAFE}" \
            -m "requires_non_adapter_work=${OTHER}" \
            -m 'plus_distinct_media_debt=1' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-009-audit.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report complete classification
        if: success()
        run: |
          SAFE="$(node -p "require('./$OUT').denominator.adapter_only_safe")"
          OTHER="$(node -p "require('./$OUT').denominator.requires_non_adapter_work")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-009 classified all 16 packet-review-incompatible objects on workflow run ${GITHUB_RUN_ID}. Adapter-only safe: ${SAFE}. Requires non-adapter work: ${OTHER}. UC-338/still remains separate distinct-era media debt. No canonical media or packet evidence changed."

      - name: Report failed classification
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-009 whole-lane classification failed closed on workflow run ${GITHUB_RUN_ID}. No canonical mutation or compatibility claim is authorized."

      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-009-incompatible-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-009-audit-summary.json
            /tmp/COLLECT-009-audit.tree
            data/review/estate-debt/COLLECT-009-PACKET-REVIEW-INCOMPATIBLE-AUDIT.json
          if-no-files-found: warn
          retention-days: 30
