name: apply-collection-only-operations

on:
  push:
    branches: [agent/collection-only-operations]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-collection-only-operations
  cancel-in-progress: true

# Bounded DEC-0016 transaction body; restored after the qualified product merges.
jobs:
  apply:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/collection-only-operations'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-dec0016-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collection-only-operations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Materialize, qualify, and publish DEC-0016
        shell: bash
        run: |
          cp tmp/ux02a-materialize.sh /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          bash /tmp/ux02a-materialize.sh

      - name: Upload DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
