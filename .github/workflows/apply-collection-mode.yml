name: apply-collection-only-operations

on:
  workflow_run:
    workflows: [archive-contract]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ux-nav-noscript-review-release
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-nav-noscript-review-release
      EXPECTED_TRIGGER_PR: "359"
      EXPECTED_CARRIER_SHA: d5e13a7db6b0ab394f9caabdefe0059e54415f3f
      EXPECTED_CARRIER_SHA256: f4d970126c7de42ba35e2e3a5b3e43cba7739ddbdcd082ad5b4d36a67fb9c4b5
      EXPECTED_MAIN_ROOT: be5db794b9aca7bd74e2a9e6a3d64cb6b3072a17
      SELF: .github/workflows/apply-collection-mode.yml
    steps:
      - name: Select exact archive qualification
        id: guard
        shell: bash
        env:
          RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          eligible=false
          if jq -e \
            --arg pr "$EXPECTED_TRIGGER_PR" \
            '.event == "pull_request" and .conclusion == "success" and any(.pull_requests[]?; (.number|tostring) == $pr)' \
            <<<"$RUN_JSON" >/dev/null; then
            eligible=true
          fi
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"

      - name: Record exact transaction start
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'status=started\nrun=%s\ntrigger_run=%s\ncarrier=%s\npr=%s\n' \
            "$GITHUB_RUN_ID" "${{ github.event.workflow_run.id }}" "$EXPECTED_CARRIER_SHA" "$EXPECTED_TRIGGER_PR" \
            > "$EVIDENCE/start.txt"
          gh pr comment 346 --repo BigBirdReturns/undercast --body "Exact no-JavaScript review-release run ${GITHUB_RUN_ID} selected archive-contract run ${{ github.event.workflow_run.id }} for carrier PR #${EXPECTED_TRIGGER_PR} and immutable carrier ${EXPECTED_CARRIER_SHA}."

      - uses: actions/checkout@v4
        if: steps.guard.outputs.eligible == 'true'
        with:
          ref: ${{ env.EXPECTED_CARRIER_SHA }}
          fetch-depth: 0

      - name: Verify carrier and retire this controller
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER_SHA"
          test "$(sha256sum tmp/ux02a-materialize.sh | awk '{print $1}')" = "$EXPECTED_CARRIER_SHA256"
          cp tmp/ux02a-materialize.sh /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          live="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$EXPECTED_MAIN_ROOT" "$live"
          git diff --name-only "$EXPECTED_MAIN_ROOT" "$live" | LC_ALL=C sort > /tmp/controller-paths
          printf '%s\n' "$SELF" > /tmp/expected-controller-paths
          diff -u /tmp/expected-controller-paths /tmp/controller-paths
          git push --force-with-lease="refs/heads/main:${live}" origin "${EXPECTED_MAIN_ROOT}:refs/heads/main"
          printf 'controller=%s\nretired_to=%s\n' "$live" "$EXPECTED_MAIN_ROOT" > "$EVIDENCE/controller-retirement.txt"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.eligible == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Pay review defect, qualify, and publish exact product
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: bash /tmp/ux02a-materialize.sh

      - name: Record terminal failure boundary
        if: steps.guard.outputs.eligible == 'true' && failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          stage="$(awk -F= '$1=="stage"{print $2}' "$EVIDENCE/status.txt" 2>/dev/null || true)"
          stage="${stage:-unknown}"
          printf 'status=failed\nstage=%s\n' "$stage" > "$EVIDENCE/failure.txt"
          gh pr comment 346 --repo BigBirdReturns/undercast --body "Exact no-JavaScript review-release run ${GITHUB_RUN_ID} failed at stage ${stage}; no repaired product authority is accepted." || true

      - name: Upload terminal transaction evidence
        if: always() && steps.guard.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ux-nav-noscript-review-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-nav-noscript-review-release
          if-no-files-found: warn
          retention-days: 30
