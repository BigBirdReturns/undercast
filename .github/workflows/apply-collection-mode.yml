name: apply-collection-only-operations

on:
  workflow_run:
    workflows: [archive-contract]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dec0016-navigation-workflow-run
  cancel-in-progress: true

# Bounded DEC-0016 transaction body. The workflow-run plane is shared by all
# archive-contract completions, so the first step selects exact never-merge PR
# #305. Immutable carrier bytes are still enforced after checkout.
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-dec0016-evidence
      EXPECTED_CARRIER_SHA: d5e13a7db6b0ab394f9caabdefe0059e54415f3f
      EXPECTED_MAIN_PARENT_SHA: be5db794b9aca7bd74e2a9e6a3d64cb6b3072a17
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Select exact carrier archive run
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          set -euo pipefail
          eligible=false
          if [[ "$EVENT_NAME" == "workflow_run" ]] && \
             jq -e '.event == "pull_request" and .conclusion == "success" and any(.pull_requests[]?; .number == 305)' \
               <<<"$WORKFLOW_RUN_JSON" >/dev/null; then
            eligible=true
          fi
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"

      - name: Record DEC-0016 workflow-run transaction start
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'status=started\nrun=%s\ntrigger_run=%s\nevent_head=%s\ncarrier=%s\npr=305\n' \
            "$GITHUB_RUN_ID" "$TRIGGER_RUN_ID" "$TRIGGER_HEAD_SHA" "$EXPECTED_CARRIER_SHA" \
            > "$EVIDENCE/start.txt"
          jq -n --arg body "UX-02A DEC-0016 workflow-run ${GITHUB_RUN_ID} selected carrier PR #305 after archive-contract run ${TRIGGER_RUN_ID}; event head ${TRIGGER_HEAD_SHA}, immutable carrier ${EXPECTED_CARRIER_SHA}." '{body:$body}' > /tmp/ux02a-start.json
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/ux02a-start.json \
            "https://api.github.com/repos/BigBirdReturns/undercast/issues/255/comments" \
            >/dev/null

      - uses: actions/checkout@v4
        if: steps.guard.outputs.eligible == 'true'
        with:
          ref: d5e13a7db6b0ab394f9caabdefe0059e54415f3f
          fetch-depth: 0

      - name: Verify exact carrier bytes
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER_SHA"
          test "$(sha256sum tmp/ux02a-materialize.sh | awk '{print $1}')" = "f4d970126c7de42ba35e2e3a5b3e43cba7739ddbdcd082ad5b4d36a67fb9c4b5"

      - name: Retire temporary writer controller before qualification
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          live="$(git rev-parse refs/remotes/origin/main)"
          test "$(git show -s --format='%P' "$live")" = "$EXPECTED_MAIN_PARENT_SHA"
          git diff --name-only "$EXPECTED_MAIN_PARENT_SHA" "$live" | LC_ALL=C sort > /tmp/ux02a-controller-paths
          printf '.github/workflows/apply-collection-mode.yml\n' > /tmp/ux02a-expected-controller-paths
          diff -u /tmp/ux02a-expected-controller-paths /tmp/ux02a-controller-paths
          git push --force-with-lease="refs/heads/main:${live}" \
            origin "${EXPECTED_MAIN_PARENT_SHA}:refs/heads/main"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.eligible == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Materialize, qualify, and publish DEC-0016
        if: steps.guard.outputs.eligible == 'true'
        shell: bash
        run: |
          cp tmp/ux02a-materialize.sh /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          bash /tmp/ux02a-materialize.sh

      - name: Record failed DEC-0016 workflow-run transaction
        if: steps.guard.outputs.eligible == 'true' && failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          stage="$(awk -F= '$1=="stage"{print $2}' "$EVIDENCE/status.txt" 2>/dev/null || true)"
          stage="${stage:-unknown}"
          jq -n --arg body "UX-02A DEC-0016 workflow-run ${GITHUB_RUN_ID} failed at stage ${stage}; carrier PR #305, event head ${TRIGGER_HEAD_SHA}, immutable carrier ${EXPECTED_CARRIER_SHA}. No product authority was published." '{body:$body}' > /tmp/ux02a-failure.json
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/ux02a-failure.json \
            "https://api.github.com/repos/BigBirdReturns/undercast/issues/255/comments" \
            >/dev/null || true

      - name: Upload DEC-0016 qualification evidence
        if: always() && steps.guard.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
