name: apply-collection-only-operations

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ux-nav-noscript-review-release-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: /tmp/ux-nav-noscript-review-release
      EXPECTED_CARRIER_SHA: 4ef5e968b11e411807fc73284157e685cf34c5a3
      EXPECTED_CARRIER_SHA256: 93a30c071a6ff4418219aa86cad902c415dc0a7440710ca48e5bd5a6a7038f2c
      EXPECTED_MAIN_ROOT: be5db794b9aca7bd74e2a9e6a3d64cb6b3072a17
      CARRIER_BRANCH: agent/collection-only-operations-p2
      SELF: .github/workflows/apply-collection-mode.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact controller and immutable carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$EXPECTED_MAIN_ROOT" "$GITHUB_SHA"
          git diff --name-only "$EXPECTED_MAIN_ROOT" "$GITHUB_SHA" | LC_ALL=C sort > /tmp/controller-paths
          printf '%s\n' "$SELF" > /tmp/expected-controller-paths
          diff -u /tmp/expected-controller-paths /tmp/controller-paths
          git fetch --no-tags origin "+refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${CARRIER_BRANCH}")" = "$EXPECTED_CARRIER_SHA"
          test "$(git show "$EXPECTED_CARRIER_SHA:tmp/ux02a-materialize.sh" | sha256sum | awk '{print $1}')" = "$EXPECTED_CARRIER_SHA256"
          git show "$EXPECTED_CARRIER_SHA:tmp/ux02a-materialize.sh" > /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          printf 'status=started\nrun=%s\ncontroller=%s\ncarrier=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$EXPECTED_CARRIER_SHA" > "$EVIDENCE/start.txt"
          gh pr comment 346 --repo BigBirdReturns/undercast --body "Exact no-JavaScript review-release run ${GITHUB_RUN_ID} started on parser-corrected self-retiring controller ${GITHUB_SHA} with immutable normalized carrier ${EXPECTED_CARRIER_SHA}." || true

      - name: Retire controller before product qualification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          live="$(git rev-parse refs/remotes/origin/main)"
          test "$live" = "$GITHUB_SHA"
          git diff --name-only "$EXPECTED_MAIN_ROOT" "$live" | LC_ALL=C sort > /tmp/live-controller-paths
          printf '%s\n' "$SELF" > /tmp/expected-live-controller-paths
          diff -u /tmp/expected-live-controller-paths /tmp/live-controller-paths
          git push --force-with-lease="refs/heads/main:${live}" origin "${EXPECTED_MAIN_ROOT}:refs/heads/main"
          printf 'controller=%s\nretired_to=%s\n' "$live" "$EXPECTED_MAIN_ROOT" > "$EVIDENCE/controller-retirement.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Qualify and publish exact workflow-free product
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_CARRIER_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CARRIER_SHA"
          bash /tmp/ux02a-materialize.sh

      - name: Record terminal failure boundary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          stage="$(awk -F= '$1=="stage"{print $2}' "$EVIDENCE/status.txt" 2>/dev/null || true)"
          stage="${stage:-unknown}"
          printf 'status=failed\nstage=%s\nrun=%s\ncontroller=%s\ncarrier=%s\n' \
            "$stage" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$EXPECTED_CARRIER_SHA" > "$EVIDENCE/failure.txt"
          gh pr comment 346 --repo BigBirdReturns/undercast --body "Exact no-JavaScript review-release run ${GITHUB_RUN_ID} failed at stage ${stage}; no repaired product authority is accepted." || true

      - name: Upload terminal transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-nav-noscript-review-release-${{ github.run_id }}
          path: /tmp/ux-nav-noscript-review-release
          if-no-files-found: warn
          retention-days: 30
