name: star-trek-population-process

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-PROCESS.json"
      - ".github/workflows/star-trek-population-process.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-population-001-process
  cancel-in-progress: false

jobs:
  process:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify the committed lease and draft one exact result
        run: |
          set -euo pipefail
          output=/tmp/star-trek-population-process
          rm -rf "$output"
          mkdir -p "$output"
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const command=JSON.parse(fs.readFileSync('.github/STAR-TREK-POPULATION-PROCESS.json','utf8'));
          const leasePath='data/review/trek-population-001-zek-lease.json';
          const leaseBytes=fs.readFileSync(leasePath);
          const lease=JSON.parse(leaseBytes);
          if(command.lease_id!==lease.lease_id||command.task_id!==lease.tasks?.[0]?.id) throw new Error('process command does not match the committed lease');
          if(lease.lease_id!=='lease_094fce30fd83f322e2d0ddb7'||lease.tasks?.[0]?.performer!=='Wallace Shawn'||lease.tasks?.[0]?.character!=='Zek') throw new Error('Zek lease identity drifted');
          const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json','utf8'));
          const job=(state.jobs||[]).find(row=>row.id===command.task_id);
          if(!job||job.status!=='leased'||job.lease_id!==lease.lease_id) throw new Error(`durable task is not bound to this lease: ${job?.status||'missing'}`);
          const existing=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).filter(row=>row.actor==='Wallace Shawn'&&row.character==='Zek');
          if(existing.length) throw new Error(`Zek is already canonical at ${existing.map(row=>row.id).join(', ')}`);
          const results={
            version:1,
            lease_id:lease.lease_id,
            agent:'luna',
            results:[{
              task_id:command.task_id,
              decision:'draft',
              draft:{
                character:'Zek',
                actor:'Wallace Shawn',
                production:'Star Trek: Deep Space Nine',
                universe:'Star Trek',
                years:'1993–99',
                designer:'Michael Westmore',
                transform:5,
                kind:'face',
                knownFor:'American actor and playwright known for My Dinner with Andre, The Princess Bride, and voicing Rex in the Toy Story films.',
                reveal:'A Ferengi head built specifically for Wallace Shawn concealed him as Grand Nagus Zek across seven Deep Space Nine episodes. Shawn described the three-hour makeup and prolonged enclosure as physically arduous but creatively freeing because the disguise erased his usual self-consciousness.',
                references:[
                  {claim:'performance',label:'Wallace Shawn played Grand Nagus Zek in seven Deep Space Nine episodes',source:'https://memory-alpha.fandom.com/wiki/Zek',publisher:'Memory Alpha'},
                  {claim:'design-build',label:'Michael Westmore gave Wallace Shawn a distinct Ferengi head for The Nagus',source:'https://memory-alpha.fandom.com/wiki/Michael_Westmore%27s_Aliens',publisher:'Memory Alpha'},
                  {claim:'interview',label:'Wallace Shawn described Zek makeup as arduous, concealing, and creatively liberating',source:'https://therogersrevue.com/farpoint-2019-interview-wallace-shawn/',publisher:'The Rogers Revue'},
                  {claim:'biography',label:'Wallace Shawn is an American actor and writer known for My Dinner with Andre, The Princess Bride, and Toy Story',source:'https://en.wikipedia.org/wiki/Wallace_Shawn',publisher:'Wikipedia'}
                ],
                wiki:'https://en.wikipedia.org/wiki/Wallace_Shawn'
              }
            }]
          };
          fs.writeFileSync('data/review/trek-population-001-zek-results.json',JSON.stringify(results,null,2)+'\n');
          fs.writeFileSync('/tmp/star-trek-population-process/lease-receipt.json',JSON.stringify({lease_id:lease.lease_id,task_id:command.task_id,lease_sha256:crypto.createHash('sha256').update(leaseBytes).digest('hex'),source_fingerprint:lease.tasks[0].source_fingerprint},null,2)+'\n');
          NODE
      - name: Submit, grow, and retrieve only the Zek card
        env:
          CONTACT: bigbirdreturns@proton.me
          IMAGE_MODE: loose
        run: |
          set -euo pipefail
          output=/tmp/star-trek-population-process
          before_count=$(node -e "console.log(require('./data/specimens.json').length)")
          node scripts/autopilot.mjs submit \
            --batch data/review/trek-population-001-zek-lease.json \
            --input data/review/trek-population-001-zek-results.json \
            | tee "$output/submit.log"
          node scripts/grow.mjs --drafts | tee "$output/grow.log"
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).filter(row=>row.actor==='Wallace Shawn'&&row.character==='Zek');
          if(rows.length!==1) throw new Error(`expected one canonical Zek card, found ${rows.length}`);
          fs.writeFileSync('/tmp/star-trek-population-process/wall-id.txt',rows[0].id+'\n');
          fs.writeFileSync('/tmp/star-trek-population-process/record-after-grow.json',JSON.stringify(rows[0],null,2)+'\n');
          NODE
          wall_id=$(tr -d '\n' < "$output/wall-id.txt")
          after_count=$(node -e "console.log(require('./data/specimens.json').length)")
          test "$after_count" -eq $((before_count+1))
          RETRIEVE_ONLY="$wall_id" RETRIEVE_MAX=1 node scripts/retrieve.mjs | tee "$output/retrieve.log"
          node scripts/credits.mjs | tee "$output/credits.log"
          node scripts/sync-sources.mjs | tee "$output/sync-sources.log"
          node scripts/shard.mjs | tee "$output/shard.log"
          node scripts/build-contract.mjs | tee "$output/build-contract.log"
          node scripts/autopilot.mjs sync | tee "$output/autopilot-sync.log"
          node scripts/media-audit.mjs sync | tee "$output/media-audit-sync.log"
          node scripts/media-audit.mjs status --scope star-trek --json > "$output/media-status.json"
          node scripts/autopilot.mjs status --scope star-trek --json > "$output/autopilot-status.json"
          node scripts/validate.mjs | tee "$output/validate.log"
      - name: Retain the exact candidate and its review packet
        run: |
          set -euo pipefail
          output=/tmp/star-trek-population-process
          wall_id=$(tr -d '\n' < "$output/wall-id.txt")
          node scripts/media-audit.mjs next \
            --scope star-trek \
            --reviewer luna \
            --role machine \
            --limit 2 \
            --out "$output/media-packet.json" \
            --html "$output/media-sheet.html" \
            > "$output/media-packet-stdout.json"
          WALL_ID="$wall_id" node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const id=process.env.WALL_ID;
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const sources=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const record=specimens.find(row=>row.id===id);
          const source=sources.find(row=>row.id===id);
          const items=(audit.items||[]).filter(row=>row.wall_id===id);
          if(!record||!source||items.length!==2) throw new Error('candidate record, source row, or audit facets are incomplete');
          const context={version:1,wall_id:id,lease_id:'lease_094fce30fd83f322e2d0ddb7',task_id:'ap_d3afc683a39f7fa108090790',record,source,audit_items:items};
          fs.writeFileSync('data/review/trek-population-001-zek-context.json',JSON.stringify(context,null,2)+'\n');
          fs.writeFileSync('/tmp/star-trek-population-process/context.json',JSON.stringify(context,null,2)+'\n');
          const copied=[];
          for(const side of ['still','portrait']){
            const asset=record[side];
            if(!asset?.src) continue;
            const bytes=fs.readFileSync(asset.src);
            const target=`/tmp/star-trek-population-process/${side}-${asset.src.split('/').pop()}`;
            fs.copyFileSync(asset.src,target);
            copied.push({side,path:asset.src,artifact:target.split('/').pop(),bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),origin:asset.origin,kind:asset.kind});
          }
          fs.writeFileSync('/tmp/star-trek-population-process/assets.json',JSON.stringify(copied,null,2)+'\n');
          NODE
          (cd "$output" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          git status --short > "$output/status-before-commit.txt"
      - name: Commit the merged candidate and remove the processing operator
        run: |
          set -euo pipefail
          output=/tmp/star-trek-population-process
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          rm -f .github/STAR-TREK-POPULATION-PROCESS.json
          rm -f .github/workflows/star-trek-population-process.yml
          git add -A
          git diff --cached --check
          git commit -m "Population: add Wallace Shawn as Grand Nagus Zek"
          git show --stat --oneline HEAD > "$output/commit.txt"
          git push origin HEAD:agent/star-trek-population-001
      - name: Upload the candidate for exact-subject review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-zek-candidate-${{ github.run_id }}
          path: /tmp/star-trek-population-process
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
