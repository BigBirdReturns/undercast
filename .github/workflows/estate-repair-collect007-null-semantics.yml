name: estate-repair-collect007-null-semantics

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect007-null-semantics.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect007-null-semantics
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RULING: data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
  CORRECTION: data/review/estate-debt/COLLECT-007-ABSENT-NULL-SEMANTICS-CORRECTION.json

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head correction custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Recompute the complete lane with normalized absent-null semantics
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlob = (bytes) => crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`, 'utf8')).update(bytes).digest('hex');
          const readBytes = (file) => fs.readFileSync(file);
          const readDoc = (file) => {
            const bytes = readBytes(file);
            return { file, bytes, sha256: sha256(bytes), git_blob: gitBlob(bytes), value: JSON.parse(bytes.toString('utf8')) };
          };
          const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
          const parseChecksums = (text, label) => {
            const map = new Map();
            for (const [index, raw] of String(text).split(/\r?\n/).entries()) {
              if (!raw.trim()) continue;
              const match = raw.match(/^([0-9a-f]{64})\s+\*?(.+)$/i);
              if (!match) throw new Error(`${label}:${index + 1} is not a SHA-256 row`);
              const name = match[2].trim().replace(/^\.\//, '');
              if (!name || name.includes('/') || map.has(name)) throw new Error(`${label}:${index + 1} repeats or nests ${name}`);
              map.set(name, match[1].toLowerCase());
            }
            if (!map.size) throw new Error(`${label} is empty`);
            return map;
          };

          const flawedDoc = readDoc(process.env.RULING);
          const flawed = flawedDoc.value;
          if (flawed.transaction !== 'COLLECT-007' || flawed.operation !== 'exact-current-null-whole-lane-adjudication') throw new Error('unexpected COLLECT-007 ruling identity');
          if (flawed.denominator?.reviewed !== 24 || flawed.denominator?.authorized !== 6 || flawed.denominator?.blocked !== 18) throw new Error('flawed ruling denominator drifted');
          const falseBlocks = (flawed.blocked_obligations || []).filter((row) => Array.isArray(row.reasons) && row.reasons.length === 1 && row.reasons[0] === 'current-binding-not-null');
          if (falseBlocks.length !== 18) throw new Error(`expected eighteen null-semantics false blocks, found ${falseBlocks.length}`);
          for (const row of flawed.decisions || []) {
            if (row.status !== 'blocked-current-null') continue;
            if (row.reasons?.length !== 1 || row.reasons[0] !== 'current-binding-not-null') throw new Error(`${row.decision_id} has a substantive block and cannot be normalized`);
            if (row.current?.specimen_binding !== null || row.current?.source_binding !== null || row.current?.canonical_rows_agree !== true || row.current?.other_side_present !== true || row.current?.destination_exists !== false) throw new Error(`${row.decision_id} does not expose the absent-versus-null contradiction`);
          }

          const censusDoc = readDoc('data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json');
          const ledgerDoc = readDoc('data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json');
          const specimensDoc = readDoc('data/specimens.json');
          const sourcesDoc = readDoc('data/SOURCES.json');
          const census = censusDoc.value;
          const ledger = ledgerDoc.value;
          if (ledger.cumulative?.canonical_adoptions !== 15 || ledger.cumulative?.remaining_for_canonical_review !== 40) throw new Error('ledger moved beyond the COLLECT-006 boundary');
          const adopted = new Set((ledger.adopted_obligations || []).map((row) => row.obligation_id));
          const lane = (census.packets || []).filter((row) => row.lane === 'null-binding-without-prior-state' && !adopted.has(row.obligation_id)).sort((a, b) => a.obligation_id.localeCompare(b.obligation_id));
          if (lane.length !== 24) throw new Error(`expected 24 unpaid current-null packets, found ${lane.length}`);
          const specimenById = new Map(specimensDoc.value.map((row) => [row.id, row]));
          const sourceById = new Map(sourcesDoc.value.map((row) => [row.id, row]));
          const decisions = [];

          for (const row of lane) {
            const reasons = [];
            const specimen = specimenById.get(row.record_id);
            const source = sourceById.get(row.record_id);
            if (!specimen || !source) reasons.push('canonical-record-missing');
            const specimenBinding = specimen?.[row.side] ?? null;
            const sourceBinding = source?.[row.side] ?? null;
            if (specimen && source) {
              if (specimen.actor !== row.actor || source.actor !== row.actor) reasons.push('actor-drift');
              if (specimen.character !== row.character || source.character !== row.character) reasons.push('character-drift');
              if (!same(specimenBinding, sourceBinding)) reasons.push('canonical-row-disagreement');
              if (specimenBinding !== null || sourceBinding !== null) reasons.push('current-binding-not-null');
              const other = row.side === 'still' ? 'portrait' : 'still';
              if (!(specimen[other]?.src && source[other]?.src && same(specimen[other], source[other]))) reasons.push('opposite-side-incomplete');
            }
            const custody = row.custody || {};
            for (const field of ['candidate_hash_pass', 'manifest_checksum_bound', 'candidate_checksum_bound', 'independent_review_ready', 'duplicate_screen_pass', 'packet_ready']) if (custody[field] !== true) reasons.push(`custody-${field}-failed`);
            let manifestHash = null;
            let candidateHash = null;
            let manifestBound = false;
            let candidateBound = false;
            try {
              const manifestBytes = readBytes(row.manifest_path);
              manifestHash = sha256(manifestBytes);
              if (manifestHash !== row.manifest_sha256) reasons.push('manifest-hash-drift');
              const candidateBytes = readBytes(row.candidate_path);
              candidateHash = sha256(candidateBytes);
              if (candidateHash !== row.candidate_sha256) reasons.push('candidate-hash-drift');
              const checksums = parseChecksums(readBytes(row.checksum_path).toString('utf8'), row.checksum_path);
              manifestBound = checksums.get(path.posix.basename(row.manifest_path)) === row.manifest_sha256;
              candidateBound = checksums.get(path.posix.basename(row.candidate_path)) === row.candidate_sha256;
              if (!manifestBound) reasons.push('manifest-not-checksum-bound');
              if (!candidateBound) reasons.push('candidate-not-checksum-bound');
            } catch (error) {
              reasons.push(`packet-read-failure:${error.message}`);
            }
            const destinationExists = fs.existsSync(row.suggested_destination_path);
            if (destinationExists) reasons.push('versioned-destination-exists');
            const otherSide = row.side === 'still' ? 'portrait' : 'still';
            const authorized = reasons.length === 0;
            decisions.push({
              decision_id: row.obligation_id,
              record_id: row.record_id,
              side: row.side,
              actor: row.actor,
              character: row.character,
              production: row.production ?? null,
              packet_generation: row.packet_generation,
              status: authorized ? 'authorized-current-null' : 'blocked-current-null',
              reasons,
              packet: {
                root: row.packet_root,
                manifest_path: row.manifest_path,
                manifest_sha256: row.manifest_sha256,
                manifest_hash_pass: manifestHash === row.manifest_sha256,
                manifest_checksum_bound: manifestBound,
                candidate_path: row.candidate_path,
                candidate_sha256: row.candidate_sha256,
                candidate_hash_pass: candidateHash === row.candidate_sha256,
                candidate_checksum_bound: candidateBound,
                candidate_mime: row.candidate_mime,
                independent_review_ready: custody.independent_review_ready === true,
                duplicate_screen_pass: custody.duplicate_screen_pass === true,
                packet_ready: custody.packet_ready === true
              },
              current: {
                specimen_binding: specimenBinding,
                source_binding: sourceBinding,
                canonical_rows_agree: same(specimenBinding, sourceBinding),
                other_side: otherSide,
                other_side_present: Boolean(specimen?.[otherSide]?.src && source?.[otherSide]?.src && same(specimen[otherSide], source[otherSide])),
                destination_path: row.suggested_destination_path,
                destination_exists: destinationExists
              },
              proposed_binding: authorized ? {
                src: row.suggested_destination_path,
                kind: row.side === 'still' ? 'still' : 'portrait',
                origin: row.suggested_origin,
                pin: true,
                focus: row.suggested_focus
              } : null,
              quality_effect: row.side === 'still'
                ? { complete_pairs: 1, missing_still: -1, missing_portrait: 0, missing_both: 0 }
                : { complete_pairs: 1, missing_still: 0, missing_portrait: -1, missing_both: 0 }
            });
          }

          const authorized = decisions.filter((row) => row.status === 'authorized-current-null');
          const blocked = decisions.filter((row) => row.status === 'blocked-current-null');
          if (authorized.length !== 24 || blocked.length !== 0) throw new Error(`normalized lane must authorize all 24; authorized=${authorized.length}, blocked=${blocked.length}`);
          const quality = authorized.reduce((sum, row) => ({
            complete_pairs: sum.complete_pairs + row.quality_effect.complete_pairs,
            missing_still: sum.missing_still + row.quality_effect.missing_still,
            missing_portrait: sum.missing_portrait + row.quality_effect.missing_portrait,
            missing_both: sum.missing_both + row.quality_effect.missing_both
          }), { complete_pairs: 0, missing_still: 0, missing_portrait: 0, missing_both: 0 });
          const now = new Date().toISOString();
          const correction = {
            version: 1,
            transaction: 'COLLECT-007',
            operation: 'absent-property-null-semantics-correction',
            status: 'corrected',
            recorded_at: now,
            superseded_ruling: {
              path: flawedDoc.file,
              source_commit: process.env.AUTHORIZED_HEAD,
              git_blob: flawedDoc.git_blob,
              sha256: flawedDoc.sha256,
              reported_authorized: 6,
              reported_blocked: 18
            },
            defect: {
              class: 'representation-comparison-error',
              mechanism: 'The adjudicator compared an absent side property directly to null. In JavaScript, undefined !== null, so omitted and explicit-null unbound states were split despite normalized output showing both as null.',
              false_block_count: 18,
              false_blocked_obligations: falseBlocks.map((row) => row.decision_id),
              substantive_evidence_failure_count: 0
            },
            repair: {
              normalized_expression: 'row[side] ?? null',
              absent_and_explicit_null_are_unbound: true,
              complete_lane_recomputed: true,
              packet_evidence_rewritten: false,
              canonical_mutation: false
            }
          };
          const corrected = {
            version: 2,
            transaction: 'COLLECT-007',
            operation: 'exact-current-null-whole-lane-adjudication',
            status: 'authorized',
            recorded_at: now,
            correction_receipt: process.env.CORRECTION,
            source: {
              current_head: process.env.AUTHORIZED_HEAD,
              census_path: censusDoc.file,
              census_sha256: censusDoc.sha256,
              census_git_blob: censusDoc.git_blob,
              ledger_path: ledgerDoc.file,
              ledger_sha256: ledgerDoc.sha256,
              ledger_git_blob: ledgerDoc.git_blob,
              canonical_adoptions_before: 15,
              remaining_packet_review_before: 40
            },
            denominator: {
              original_current_null_lane: 27,
              already_paid_from_lane: 3,
              remaining_lane: 24,
              reviewed: 24,
              authorized: 24,
              blocked: 0
            },
            quality_effect_if_all_authorized_are_adopted: quality,
            authorized_obligations: authorized.map((row) => row.decision_id),
            blocked_obligations: [],
            decisions,
            boundary: {
              canonical_mutation: false,
              discovery_performed: false,
              packet_evidence_rewritten: false,
              arbitrary_batch_size_used: false,
              complete_remaining_lane_reviewed: true,
              missing_prior_state_label_treated_as_metadata_not_contrary_evidence: true,
              absent_property_and_explicit_null_treated_as_same_unbound_state: true,
              next_authorized_work: 'adopt all 24 authorized objects as one evidence-sized tranche'
            }
          };
          fs.writeFileSync(process.env.CORRECTION, `${JSON.stringify(correction, null, 2)}\n`);
          fs.writeFileSync(process.env.RULING, `${JSON.stringify(corrected, null, 2)}\n`);
          console.log(JSON.stringify({ transaction: 'COLLECT-007', correction: correction.defect, denominator: corrected.denominator, quality_effect: quality }, null, 2));
          NODE

      - name: Validate corrected ruling and cumulative custody
        run: |
          set -euo pipefail
          node scripts/estate-canonical-adoption-ledger.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ruling = JSON.parse(fs.readFileSync(process.env.RULING, 'utf8'));
          const correction = JSON.parse(fs.readFileSync(process.env.CORRECTION, 'utf8'));
          if (ruling.version !== 2 || ruling.status !== 'authorized' || ruling.denominator?.authorized !== 24 || ruling.denominator?.blocked !== 0) throw new Error('corrected COLLECT-007 denominator drifted');
          if (ruling.quality_effect_if_all_authorized_are_adopted?.complete_pairs !== 24 || ruling.quality_effect_if_all_authorized_are_adopted?.missing_still !== -24) throw new Error('corrected quality effect drifted');
          if (correction.defect?.false_block_count !== 18 || correction.defect?.substantive_evidence_failure_count !== 0) throw new Error('correction receipt drifted');
          NODE

      - name: Stage correction and retire one-shot authority
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect007-null-semantics.yml
          git add -- "$RULING" "$CORRECTION"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' '.github/workflows/estate-repair-collect007-null-semantics.yml' "$RULING" "$CORRECTION" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-007-null-semantics-correction.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-007-null-semantics-correction.tree)" = "$(git write-tree)"

      - name: Publish corrected whole-lane ruling under exact-head lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: correct COLLECT-007 absent-null semantics' \
            -m 'false_blocks=18' \
            -m 'substantive_evidence_failures=0' \
            -m 'authorized_current_null=24' \
            -m 'blocked_current_null=0' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-007-null-semantics-correction.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report corrected lane ruling
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-007 whole-lane adjudication corrected and fully gated on workflow run $GITHUB_RUN_ID.

          The prior reducer falsely blocked eighteen records because absent JSON properties evaluate as `undefined`, which is not strictly equal to `null`. Its own normalized output showed both canonical bindings as null, and every false block had no other reason. The corrected reducer treats `row[side] ?? null` as the unbound state.

          ```text
          reviewed:                    24
          authorized:                  24
          blocked:                      0
          substantive evidence fails:  0
          projected complete pairs:   +24
          projected missing stills:   -24
          ```

          The flawed ruling remains in Git history and is hash-bound by the correction receipt. Packet evidence was not rewritten, no canonical media changed, the complete gate including rendered-browser checks passed, and the one-shot repair workflow deleted itself.
          EOF_COMMENT

      - name: Report failed correction
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-007 absent-null correction failed closed on workflow run $GITHUB_RUN_ID. The flawed partial ruling remains superseded only if the correction receipt and corrected ruling both publish on the exact branch.
          EOF_COMMENT
