name: star-trek-lorot-media-v1

on:
  push:
    branches:
      - agent/star-trek-lorot-source-media-v1
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-lorot-media-v1
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 640754cdeb5a7679790682ab6c28070c28ca9fae
      TASK_ID: ap_9b7123237c640f1ce0a16ffe
      FINGERPRINT: df893de8f597caf34517ccfc5b7da21953f2b05b21cf8d11dd4c387e9216bf8c
      SOURCE_RESULT_BRANCH: agent/star-trek-lorot-source-media-result-v1
      RESULT_BRANCH: agent/star-trek-lorot-media-result-v1
      ROOT: /tmp/star-trek-lorot-media-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bind exact Lorot source artifact and prepare verified media
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT/source"
          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          test "$(jq -r .sha <<<"$live")" = "$EXPECTED_MAIN"
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          npm ci --ignore-scripts
          node scripts/star-trek-kzinti-flyer-cycle.mjs | tee "$ROOT/predecessor-checker.log"
          node scripts/thesis-rails.mjs next --json > "$ROOT/thesis-next.json"
          jq -e --arg task "$TASK_ID" --arg fp "$FINGERPRINT" '.phase=="ready-for-one-cycle" and .candidate.task_id==$task and .candidate.source_fingerprint==$fp and .candidate.character=="Lorot" and .candidate.performer=="Jeri Ryan"' "$ROOT/thesis-next.json" >/dev/null

          encoded="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/transport/star-trek-lorot-source-probe-v1/locator.json?ref=${SOURCE_RESULT_BRANCH}" --jq .content)"
          printf '%s' "$encoded" | tr -d '\n' | base64 -d > "$ROOT/source-locator.json"
          jq -e --arg parent "$EXPECTED_MAIN" --arg task "$TASK_ID" --arg fp "$FINGERPRINT" '.status=="success" and .canonical_parent==$parent and .task_id==$task and .source_fingerprint==$fp and .artifact.id==9451813968 and .artifact.sha256=="9ff62d960e44beb644bfb5657bdb878939001b878294431ac4ea6bbb2a3e23f8" and .source_receipt_sha256=="8d781a52e3ca2216df22b9ccb2ab271d5bd3440b6e48c2878c94bce2580947cd" and .canonical_mutation==false and .lease_taken==false' "$ROOT/source-locator.json" >/dev/null
          source_id="$(jq -r .artifact.id "$ROOT/source-locator.json")"
          source_sha="$(jq -r .artifact.sha256 "$ROOT/source-locator.json")"
          source_name="$(jq -r .artifact.name "$ROOT/source-locator.json")"
          source_meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_id}")"
          test "$(jq -r .expired <<<"$source_meta")" = false
          test "$(jq -r .name <<<"$source_meta")" = "$source_name"
          test "$(jq -r .digest <<<"$source_meta")" = "sha256:${source_sha}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${source_id}/zip" > "$ROOT/source.zip"
          echo "$source_sha  $ROOT/source.zip" | sha256sum -c -
          unzip -q "$ROOT/source.zip" -d "$ROOT/source"
          source_probe="$(find "$ROOT/source" -type f -name source-probe.json -print -quit)"
          task_file="$(find "$ROOT/source" -type f -name task.json -print -quit)"
          test -n "$source_probe" && test -n "$task_file"
          cp "$source_probe" "$ROOT/source-probe.json"
          cp "$task_file" "$ROOT/task.json"
          cp .github/recovery/lorot-media-prepare-v1.py /tmp/lorot-media-prepare-v1.py
          python3 -m py_compile /tmp/lorot-media-prepare-v1.py
          python3 -m pip install --disable-pip-version-check --no-input Pillow==11.3.0
          python3 /tmp/lorot-media-prepare-v1.py "$ROOT" "$PWD" | tee "$ROOT/preparation.stdout.json"
          jq -e --arg parent "$EXPECTED_MAIN" --arg task "$TASK_ID" --arg fp "$FINGERPRINT" '.status=="success" and .canonical_parent==$parent and .task_id==$task and .source_fingerprint==$fp and .wall_id=="UC-1392" and .performance_mode=="physical-prosthetic" and .adjudicated_performance_mode=="physical / live-action under Seven of Nine’s Borg presentation" and .seven_of_nine_body_not_conflated_with_original_lorot_body==true and .maker_attribution=="unresolved" and .still.status=="verified" and .portrait.status=="verified" and (.facets|length)==2 and .media_review.verdict=="pass" and .byte_collision==false and .source_collision==false and .cross_facet_substitution==false and .canonical_mutation==false and .lease_taken==false' "$ROOT/media-preparation.json" >/dev/null
          test "$(sha256sum "$ROOT/output/uc-1392-still.webp" | cut -d' ' -f1)" = "$(jq -r .still.sha256 "$ROOT/media-preparation.json")"
          test "$(sha256sum "$ROOT/output/uc-1392-portrait.jpg" | cut -d' ' -f1)" = "$(jq -r .portrait.sha256 "$ROOT/media-preparation.json")"
          echo "source_id=$source_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Upload exact Lorot media package
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-lorot-media-v1
          path: /tmp/star-trek-lorot-media-v1/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish exact Lorot media locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          SOURCE_ID: ${{ steps.prepare.outputs.source_id }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"$meta")" = false
          test "$(jq -r .name <<<"$meta")" = star-trek-lorot-media-v1
          test "$(jq -r .digest <<<"$meta")" = "$ARTIFACT_DIGEST"
          git fetch --filter=blob:none --no-tags origin main
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/star-trek-lorot-media-v1
          mkdir -p transport/star-trek-lorot-media-v1
          cp "$ROOT/media-preparation.json" transport/star-trek-lorot-media-v1/
          cp "$ROOT/source-probe.json" transport/star-trek-lorot-media-v1/
          cp "$ROOT/thesis-next.json" transport/star-trek-lorot-media-v1/
          jq -n --argjson version 1 --arg transaction STAR-TREK-LOROT-MEDIA-LOCATOR-V1 --arg status success --argjson workflow_run "$GITHUB_RUN_ID" --arg workflow_head "$GITHUB_SHA" --arg canonical_parent "$EXPECTED_MAIN" --arg task_id "$TASK_ID" --arg source_fingerprint "$FINGERPRINT" --arg wall_id "UC-1392" --argjson source_id "$SOURCE_ID" --arg source_sha "$SOURCE_SHA" --argjson artifact_id "$ARTIFACT_ID" --arg artifact_sha256 "${ARTIFACT_DIGEST#sha256:}" --arg media_receipt_sha256 "$(jq -r .receipt_sha256 "$ROOT/media-preparation.json")" --arg still_sha256 "$(jq -r .still.sha256 "$ROOT/media-preparation.json")" --arg portrait_sha256 "$(jq -r .portrait.sha256 "$ROOT/media-preparation.json")" '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,canonical_parent:$canonical_parent,task_id:$task_id,source_fingerprint:$source_fingerprint,wall_id:$wall_id,source_probe_artifact:{id:$source_id,sha256:$source_sha},media_artifact:{id:$artifact_id,name:"star-trek-lorot-media-v1",sha256:$artifact_sha256},media_receipt_sha256:$media_receipt_sha256,media:{still:{status:"verified",sha256:$still_sha256},portrait:{status:"verified",sha256:$portrait_sha256}},canonical_mutation:false,lease_taken:false}' > transport/star-trek-lorot-media-v1/locator.json
          git config user.name undercast-lorot-media
          git config user.email lorot-media@users.noreply.github.com
          git add -- transport/star-trek-lorot-media-v1
          git commit -m 'Star Trek: publish exact Lorot media preparation'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
