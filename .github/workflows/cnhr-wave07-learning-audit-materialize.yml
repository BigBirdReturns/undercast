name: materialize-clifford-number-hr-learning-audit-wave-07

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cnhr-wave07-learning-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-learning-audit-wave-07'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 07 learning-audit packet
        shell: bash
        env:
          PARENT_SHA: 79362e21d9d526f1310467574e69fe909eb80adb
          PARENT_MANIFEST_SHA256: 44814d0f693cae4c2be4f47ab82de931c191c9e8b7a15c51b910bfda52d006ca
          PAYLOAD_BYTES: 23796
          PAYLOAD_SHA256: ff58647f0340e2d8e6926742f9b65cfa0122fb89e6f8112d2ee8d53f951de5db
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(git rev-parse origin/main)" = "$PARENT_SHA"

          test "$(wc -c < .cnhr-wave07/chunk-000.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-001.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-002.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-003.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-004.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-005.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave07/chunk-006.txt)" -eq 7728

          printf '%s  %s\n' \
            44219645a8f785ffd083718ddc5d793ce1e29600efa23bc62377433aed18f6c8 .cnhr-wave07/chunk-000.txt \
            145327111fa7e8b98f66bf1be067147e12cc732093b975deabd6712e78802298 .cnhr-wave07/chunk-001.txt \
            e8c4ef9a9d62450c5e685239742d9efceba6b5351ee21b6e2ee307bafe46681b .cnhr-wave07/chunk-002.txt \
            1e03efef6a44a453937b2df64a869a0cd340ec72731da7d2f0751bf77bf482a9 .cnhr-wave07/chunk-003.txt \
            42aba64aed274f494d52ca9beb30e6d3a967813197adaafd96a79fd2874ceee0 .cnhr-wave07/chunk-004.txt \
            46ab36b9c902126d063a1a7d9269fd80f8754d34790dc3b9c62e702146e69825 .cnhr-wave07/chunk-005.txt \
            a06931869c3c7ac324f1cca5415ba747d9e0a52301da0cb1def945efb272287b .cnhr-wave07/chunk-006.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave07/chunk-000.txt)" = e79e7c25382db2e3804abfdc2e2e3ced478c38dc
          test "$(git hash-object .cnhr-wave07/chunk-001.txt)" = 226c3e90e464b881faa5ffe88c34b4d059798bd3
          test "$(git hash-object .cnhr-wave07/chunk-002.txt)" = 5f99dbcf740d29f0c617d5f0cf472fabef4e1ab3
          test "$(git hash-object .cnhr-wave07/chunk-003.txt)" = 98d652147280f0de8886db4acecbc8749dd9fe82
          test "$(git hash-object .cnhr-wave07/chunk-004.txt)" = fea635b2b2b0ca1f3a144b63f5ade1974e537eb6
          test "$(git hash-object .cnhr-wave07/chunk-005.txt)" = 69f5bc8ba2e7381602c902d7044e2c962f11c4ed
          test "$(git hash-object .cnhr-wave07/chunk-006.txt)" = ba43910fe2ebbe657d812e32638ed2c32b799249

          cat .cnhr-wave07/chunk-*.txt | tr -d '\n' | base64 --decode > /tmp/cnhr-wave07.tar.gz
          test "$(wc -c < /tmp/cnhr-wave07.tar.gz)" -eq "$PAYLOAD_BYTES"
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave07.tar.gz | sha256sum --check --strict
          tar -tzf /tmp/cnhr-wave07.tar.gz \
            | python -c 'import sys; p=[x.strip() for x in sys.stdin if x.strip()]; assert p; assert all(not x.startswith("/") and ".." not in x.split("/") for x in p)'

          tar -xzf /tmp/cnhr-wave07.tar.gz -C .
          rm -rf .cnhr-wave07 .github/workflows/cnhr-wave07-learning-audit-materialize.yml

          rm -rf /tmp/cnhr-wave06-root /tmp/cnhr-wave07-root
          mkdir -p /tmp/cnhr-wave06-root /tmp/cnhr-wave07-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packets = [
              ('data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json', Path('/tmp/cnhr-wave06-root'), 22),
              ('data/review/clifford-number/hr-discipline/wave-07/MANIFEST.json', Path('/tmp/cnhr-wave07-root'), 22),
          ]
          for manifest_rel, packet_root, expected_count in packets:
              manifest_path = Path(manifest_rel)
              manifest = json.loads(manifest_path.read_text())
              paths = {row['path'] for row in manifest['files']} | {manifest_rel}
              assert len(paths) == expected_count, (manifest_rel, len(paths))
              for rel in sorted(paths):
                  src = source_root / rel
                  dst = packet_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
              print(f'isolated validation root: {manifest_rel} -> {len(paths)} exact files')
          PY

          printf '%s  %s\n' "$PARENT_MANIFEST_SHA256" \
            data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json \
            | sha256sum --check --strict

          (cd /tmp/cnhr-wave06-root && \
            node --check scripts/clifford-number-hr-counterpower-effects.mjs && \
            node --check test/clifford-number-hr-counterpower-effects-fixtures.mjs && \
            node scripts/clifford-number-hr-counterpower-effects.mjs --check --strict-root && \
            node test/clifford-number-hr-counterpower-effects-fixtures.mjs)

          (cd /tmp/cnhr-wave07-root && \
            node --check scripts/clifford-number-hr-learning-audit.mjs && \
            node --check test/clifford-number-hr-learning-audit-fixtures.mjs && \
            node scripts/clifford-number-hr-learning-audit.mjs --check --strict-root && \
            node test/clifford-number-hr-learning-audit-fixtures.mjs)

          git diff --check
          git add -A

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '79362e21d9d526f1310467574e69fe909eb80adb'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-07/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          assert not any(path.startswith('.cnhr-wave07/') for path in observed)
          assert '.github/workflows/cnhr-wave07-learning-audit-materialize.yml' not in observed
          print('exact Wave 07 learning-audit delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number learning-audit Wave 07'
          git push origin HEAD:"${HEAD_REF}"
