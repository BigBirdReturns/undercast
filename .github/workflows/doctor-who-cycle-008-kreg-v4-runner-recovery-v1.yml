name: doctor-who-cycle-008-kreg-v4-runner-recovery-v1

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-v4-runner-recovery-v1.yml"

permissions: {}

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-v4-runner-recovery-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-v4-runner-recovery-v1.yml
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      SOURCE_COMMIT: 9d0e78e81ba631baa548115000722ef28e331af9
      SOURCE_PREFIX: .github/doctor-who-cycle-008/kreg-candidate-v4
      OUT: /tmp/doctor-who-cycle-008-kreg-v4-runner-recovery-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact inert recovery carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,parts,receipt}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          floor="$(git rev-parse HEAD^)"
          test "$(git rev-list --count "$floor"..HEAD)" = 1
          test "$(git diff --name-only "$floor"...HEAD)" = "$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" FLOOR="$floor" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'api'; pr=json.loads((root/'pr.json').read_text()); files=json.loads((root/'pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['FLOOR'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          git fetch --no-tags --filter=blob:none origin "$SOURCE_COMMIT"
          printf 'FLOOR_MAIN=%s\n' "$floor" >> "$GITHUB_ENV"

      - name: Recover and verify exact runner without executing it
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=(
            ec675753305318afeda56d24db4221c22aee589c5cd7ad5df40892163f7530a1
            108089be8503950576344a8747e72b8b7af2e64e54a2e9817bd111b6e9f1b1d5
            4f29c5160e99a4d44fd51492efd089a32a7679e5f94b00ff19d2717df60dbdec
            955744bc24db2f8d094ac555578f0f1565b7c53532a6b3a61cbd1aecc5502f54
          )
          : > "$OUT/part-custody.tsv"
          for index in $(seq 0 3); do
            part="$(printf '%02d' "$index")"
            path="$SOURCE_PREFIX/runner.part-$part.b64"
            target="$OUT/parts/runner.part-$part.b64"
            git show "$SOURCE_COMMIT:$path" > "$target"
            actual="$(sha256sum "$target" | awk '{print $1}')"
            test "$actual" = "${expected_sha[$index]}"
            printf '%s\t%s\t%s\t%s\n' "$part" "$(git rev-parse "$SOURCE_COMMIT:$path")" "$(wc -c < "$target" | tr -d '[:space:]')" "$actual" >> "$OUT/part-custody.tsv"
          done
          cat "$OUT"/parts/runner.part-*.b64 | tr -d '\r\n' > "$OUT/runner.b64"
          test "$(wc -c < "$OUT/runner.b64")" = 5396
          test "$(sha256sum "$OUT/runner.b64" | awk '{print $1}')" = 94e28e49f057084319a238c76e51474fa04619ed7eddb2ff583c88b635e3360d
          base64 --decode "$OUT/runner.b64" > "$OUT/runner.sh.gz"
          test "$(sha256sum "$OUT/runner.sh.gz" | awk '{print $1}')" = 44c00775bdc49d11811b246c8544c58e2488c30533963eebade7ceb12532f474
          gzip -dc "$OUT/runner.sh.gz" > "$OUT/runner.sh"
          test "$(wc -c < "$OUT/runner.sh")" = 13187
          test "$(sha256sum "$OUT/runner.sh" | awk '{print $1}')" = 8721954c904ba069542522db28fe483d6345e2ec1ecc7bba0d52445d06f674e4
          bash -n "$OUT/runner.sh"
          grep -nE 'CHECKER_PAYLOAD|MATERIALIZER|payload|base64|gzip|tar|part-' "$OUT/runner.sh" > "$OUT/runner-custody-index.txt" || true
          jq -n --arg source "$SOURCE_COMMIT" --arg head "$AUTHORIZED_HEAD" --arg floor "$FLOOR_MAIN" '{status:"recovered-not-executed",source_commit:$source,carrier_head:$head,floor_main:$floor,runner_sha256:"8721954c904ba069542522db28fe483d6345e2ec1ecc7bba0d52445d06f674e4",executed:false,repository_write:false,merge_authority:false,outside_human_dependency:false}' > "$OUT/receipt/recovery.json"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" > "$OUT/SHA256SUMS"

      - name: Upload exact inert runner packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v4-runner-recovery-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-v4-runner-recovery-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
