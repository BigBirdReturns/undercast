name: fix-metric-source-migration-custody-v2

on:
  push:
    branches:
      - agent/operational-metric-ledger-custody
    paths:
      - .github/workflows/fix-metric-source-migration-custody-v2.yml

permissions:
  contents: write

concurrency:
  group: fix-metric-source-migration-custody-v2
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-metric-ledger-custody
  AUTHORIZED_CLEAN_HEAD: b3082124cfeffdabc034d6bc20f636fdc00f3c85
  AUTHORIZED_MAIN: acb804e2dcf758d82b57299ae366d1f57034d9cf
  SELF: .github/workflows/fix-metric-source-migration-custody-v2.yml
  OLD_SELF: .github/workflows/fix-metric-source-migration-custody.yml
  RECEIPT: data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact source-migration extension denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$AUTHORIZED_CLEAN_HEAD" HEAD
          printf '%s\n' "$OLD_SELF" "$SELF" | sort > /tmp/expected-start-paths.txt
          git diff --name-only "$AUTHORIZED_CLEAN_HEAD...HEAD" | sort > /tmp/start-paths.txt
          diff -u /tmp/expected-start-paths.txt /tmp/start-paths.txt

      - name: Apply historical-source structural validation and rebind fixture
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          const replaceOnce = (source, oldText, newText, label) => {
            const count = source.split(oldText).length - 1;
            if (count !== 1) throw new Error(`${label} anchor count is ${count}`);
            return source.replace(oldText, newText);
          };

          const waterlinePath = 'scripts/lib/waterline.mjs';
          let waterline = fs.readFileSync(waterlinePath, 'utf8');
          waterline = replaceOnce(
            waterline,
            '        if (requireString(binding.source, `metric receipt ${receipt.id}.observation_bindings.${key}.source`) !== policy.observation_source) throw new Error(`metric receipt ${receipt.id}.${key} binds the wrong observation source`);',
            '        requireString(binding.source, `metric receipt ${receipt.id}.observation_bindings.${key}.source`);',
            'historical binding source validation',
          );
          fs.writeFileSync(waterlinePath, waterline);

          const fixturePath = 'scripts/metric-readiness-fixtures.mjs';
          let fixture = fs.readFileSync(fixturePath, 'utf8');
          fixture = replaceOnce(
            fixture,
            'import { makeMetricsReceipt } from "./lib/waterline.mjs";',
            [
              'import {',
              '  emptyWaterlineState,',
              '  makeMetricsReceipt,',
              '  validateWaterlineState,',
              '} from "./lib/waterline.mjs";',
            ].join('\n'),
            'waterline fixture imports',
          );
          fixture = replaceOnce(
            fixture,
            [
              'const config = {',
              '  version: 1,',
              '  operations: {',
            ].join('\n'),
            [
              'const config = {',
              '  version: 1,',
              '  scopes: [{',
              '    id: "star-trek",',
              '    label: "Star Trek",',
              '    roadmap_milestone: "star-trek-gold-shard",',
              '    required_closed_cycles: 3,',
              '    max_tasks_per_cycle: 12,',
              '    minimum_resolved_per_cycle: 1,',
              '  }],',
              '  operations: {',
            ].join('\n'),
            'fixture waterline scope',
          );

          const migrationAnchor = [
            'status = applyMetricReadinessPolicy({',
            '  ...baseStatus(),',
            '  evidence_readiness: { ...baseStatus().evidence_readiness, missing_drills: ["publication-rollback"] },',
          ].join('\n');
          const migrationFixture = [
            'const migratedCostSource = "data/operational-reliability/COST-OBSERVATIONS-V2.json";',
            'const migratedConfig = structuredClone(config);',
            'migratedConfig.operations.metric_readiness.cost_per_verified_record_usd.observation_source = migratedCostSource;',
            'const migrationState = emptyWaterlineState();',
            'migrationState.metrics = { ...baseState().metrics };',
            'const historicalResult = makeMetricsReceipt({',
            '  metrics: { cost_per_verified_record_usd: 4.25 },',
            '  reviewed_by: "second-desk",',
            '  reviewed_role: "second-desk",',
            '  reviewed_at: "2026-08-02T03:15:00Z",',
            '  note: "Measured the original configured cost ledger before source migration.",',
            '  evidence: [{ type: "report", value: "cost-original.json" }],',
            '}, migrationState.metrics, {',
            '  metricReadiness: config.operations.metric_readiness,',
            '  observationSnapshots: oneCostSnapshots,',
            '});',
            'migrationState.metrics = historicalResult.metrics;',
            'migrationState.metric_receipts.push(historicalResult.receipt);',
            'assert.doesNotThrow(() => validateWaterlineState(migrationState, migratedConfig));',
            'const migratedSnapshots = {',
            '  ...oneCostSnapshots,',
            '  cost_per_verified_record_usd: {',
            '    ...oneCostSnapshots.cost_per_verified_record_usd,',
            '    source: migratedCostSource,',
            '  },',
            '};',
            'status = applyMetricReadinessPolicy(baseStatus(), {',
            '  config: migratedConfig,',
            '  state: migrationState,',
            '  observationSnapshots: migratedSnapshots,',
            '});',
            'assert.equal(status.evidence_readiness.operational_reliability, false);',
            'assert.deepEqual(status.evidence_readiness.metric_ledger_regressions, ["cost_per_verified_record_usd"]);',
            'assert.equal(status.evidence_readiness.metric_states.cost_per_verified_record_usd.status, "measured-against-wrong-ledger");',
            'const reboundResult = makeMetricsReceipt({',
            '  metrics: { cost_per_verified_record_usd: 4.25 },',
            '  reviewed_by: "second-desk",',
            '  reviewed_role: "second-desk",',
            '  reviewed_at: "2026-08-02T03:20:00Z",',
            '  note: "Rebound the measured value to the reviewed replacement observation source.",',
            '  evidence: [{ type: "report", value: "cost-migrated.json" }],',
            '}, migrationState.metrics, {',
            '  metricReadiness: migratedConfig.operations.metric_readiness,',
            '  observationSnapshots: migratedSnapshots,',
            '});',
            'migrationState.metrics = reboundResult.metrics;',
            'migrationState.metric_receipts.push(reboundResult.receipt);',
            'assert.doesNotThrow(() => validateWaterlineState(migrationState, migratedConfig));',
            'status = applyMetricReadinessPolicy(baseStatus(), {',
            '  config: migratedConfig,',
            '  state: migrationState,',
            '  observationSnapshots: migratedSnapshots,',
            '});',
            'assert.equal(status.evidence_readiness.operational_reliability, true);',
            'assert.equal(status.evidence_readiness.metric_states.cost_per_verified_record_usd.status, "measured");',
            '',
          ].join('\n');
          fixture = replaceOnce(fixture, migrationAnchor, `${migrationFixture}${migrationAnchor}`, 'source migration fixture insertion');
          fixture = replaceOnce(
            fixture,
            'console.log("PASS — configured ledger sources, validated rows, exact byte/population/value bindings, mismatched-value refusal, stale-measurement reopening, SLO refusal, and no-golden-cage null semantics");',
            'console.log("PASS — configured ledger sources, historical source migration and rebind, validated rows, exact byte/population/value bindings, mismatched-value refusal, stale-measurement reopening, SLO refusal, and no-golden-cage null semantics");',
            'fixture success summary',
          );
          fs.writeFileSync(fixturePath, fixture);

          const docsPath = 'docs/OPERATIONAL-METRICS.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          const heading = '### Observation-source migration';
          if (docs.includes(heading)) throw new Error('observation-source migration documentation already exists');
          docs += [
            '',
            heading,
            '',
            'Historical numeric receipts retain their recorded source as immutable evidence. A reviewed `observation_source` migration does not make those receipts structurally invalid. Readiness compares the latest receipt with the current configured source, reports `measured-against-wrong-ledger`, and blocks until `record-metrics` binds the validated replacement ledger.',
            '',
          ].join('\n');
          fs.writeFileSync(docsPath, docs);
          NODE
          node --check scripts/lib/waterline.mjs
          node --check scripts/metric-readiness-fixtures.mjs

      - name: Prove migration reporting, rebind, and current readiness
        run: |
          set -euo pipefail
          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/source-migration-status.json
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/source-migration-status.json', 'utf8'));
          const readiness = status.evidence_readiness;
          if (readiness.operational_reliability !== true) throw new Error(`current readiness regressed: ${JSON.stringify(readiness)}`);
          for (const key of ['missing_metrics', 'stale_metric_measurements', 'metric_ledger_regressions', 'slo_target_failures']) {
            if ((readiness[key] || []).length) throw new Error(`${key} is not empty: ${JSON.stringify(readiness[key])}`);
          }
          NODE

      - name: Author source-migration receipt extension and run candidate gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { createHash } = require('crypto');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.reviewed_by = 'chatgpt-second-desk';
          receipt.reviewed_role = 'second-desk';
          receipt.authorization.review_threads = [...new Set([...(receipt.authorization.review_threads || []), 3697827120])].sort((a, b) => a - b);
          receipt.authorization.source_migration_workflow_head = process.env.GITHUB_SHA;
          receipt.authorization.source_migration_workflow_run = Number(process.env.GITHUB_RUN_ID);
          receipt.corrections.historical_observation_sources_structurally_validated = true;
          receipt.corrections.source_migration_reports_wrong_ledger = true;
          receipt.corrections.source_migration_rebind_supported = true;
          receipt.evidence.files ||= {};
          for (const path of ['scripts/lib/waterline.mjs', 'scripts/metric-readiness-fixtures.mjs', 'docs/OPERATIONAL-METRICS.md']) {
            receipt.evidence.files[path] = createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          }
          receipt.evidence.source_migration_fixture = 'PASS';
          receipt.source_migration_extension = {
            status: 'candidate',
            historical_receipt_source_preserved: true,
            current_source_compared_by_readiness: true,
            rebind_path_exercised: true,
            candidate_complete_gate_required: true,
            final_complete_gate_after_self_retirement_required: true,
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git add \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            docs/OPERATIONAL-METRICS.md \
            "$RECEIPT"
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/source-migration-candidate-gate.log

      - name: Retire temporary authority, promote receipt, and gate final tree
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          node - <<'NODE'
          const fs = require('fs');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.source_migration_extension.status = 'smoke-passed';
          receipt.source_migration_extension.candidate_complete_gate_passed = true;
          receipt.source_migration_extension.candidate_rendered_browser_included = true;
          receipt.source_migration_extension.final_complete_gate_after_self_retirement = true;
          receipt.source_migration_extension.final_rendered_browser_included = true;
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git add "$RECEIPT"
          git rm "$OLD_SELF" "$SELF"
          git diff --cached --check

          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/final-source-migration-status.json
          npm run gate 2>&1 | tee /tmp/source-migration-final-gate.log

      - name: Publish exact source-migration custody under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"

          printf '%s\n' \
            data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json \
            docs/OPERATIONAL-METRICS.md \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            | sort > /tmp/expected-extension-paths.txt
          git diff --cached --name-only "$AUTHORIZED_CLEAN_HEAD" | sort > /tmp/actual-extension-paths.txt
          diff -u /tmp/expected-extension-paths.txt /tmp/actual-extension-paths.txt

          git config user.name undercast-operational-reliability
          git config user.email undercast-operational-reliability@users.noreply.github.com
          git commit \
            -m 'Operations: permit observation ledger source migrations' \
            -m 'validate historical bindings structurally' \
            -m 'report wrong-ledger readiness and preserve the rebind path'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"

      - name: Upload source-migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metric-source-migration-custody-v2-${{ github.run_id }}
          path: |
            /tmp/source-migration-status.json
            /tmp/final-source-migration-status.json
            /tmp/source-migration-candidate-gate.log
            /tmp/source-migration-final-gate.log
            /tmp/expected-extension-paths.txt
            /tmp/actual-extension-paths.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
