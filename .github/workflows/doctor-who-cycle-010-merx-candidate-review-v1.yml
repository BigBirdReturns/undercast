name: doctor-who-cycle-010-merx-candidate-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-candidate-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-candidate-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-candidate-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      EXACT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      BRANCH: agent/doctor-who-cycle-010-merx-candidate-review-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-candidate-review-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-candidate-review-v1
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_PR: "726"
      CANDIDATE_BRANCH: agent/doctor-who-cycle-010-merx-candidate-current-main-v4
      CANDIDATE_HEAD: 992c1ae11106456fa20958aabe01a48c54f2e08c
      CANDIDATE_WORKFLOW: .github/workflows/doctor-who-cycle-010-merx-candidate-current-main-v4.yml
      CANDIDATE_WORKFLOW_NAME: doctor-who-cycle-010-merx-candidate-current-main-v4
      CANDIDATE_RUN: "31293712144"
      CANDIDATE_JOB: "93195270833"
      CANDIDATE_ARTIFACT: "9032284342"
      CANDIDATE_ZIP_SHA256: 31618c1732e5e9535e87643758093b481bc6b0e454f9b6c93ad98576aaafeb34
      CANDIDATE_RECEIPT_IDENTITY: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      CANDIDATE_PATH_COUNT: "39"
      CANDIDATE_PATHS_SHA256: 05307b2badf8a61cf4200453e3cb8895623cafa1fc448bcd8362d640d5be5548
      CANDIDATE_POLICY_SHA256: 2b944e5d84ee97c81cace47480e110cf041f1b056902b2ad70ab1e1bffb8a418
      CANDIDATE_FILE_MANIFEST_SHA256: b2f0421673ca270d82490a472eb8124999374dff670961ba7573774176ac27d4
      CANDIDATE_DELTA_MANIFEST_SHA256: 435144097da6b1cdb855e8e21c876fe505fc5e551cbe31e8d80f8f32aeb73c4f
      CANDIDATE_PATCH_SHA256: ec32a28b0fc3821b96557d379d674576b391b6e7c472b16016756a3f64d1d287
      CANDIDATE_BUNDLE_SHA256: 8bdc1ad917de9e80c6120490b10f743eb9562b47bc42cddf91c505af97671881
      CANDIDATE_TAR_SHA256: 95cecf552a8605a41b86f8cbd25ba4b74809e1f9d40fb8689ad9105e82fc6acd
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      SOURCE_SHA256: 5fa09f17e86ef5868e36d860119c14867a0766b0b8d6da6cf8a739fb85509e4c
      SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      RUNNER_B64_SHA256: c26360ca51cce338c9332721205987e848f1029f4cf4a379a5c33b8e0603e73d
      RUNNER_GZIP_SHA256: cc37ce61bd7cdabd8cec165b19c4e9d3a4f27348148414ac5015bb37cbb422ef
      RUNNER_SHA256: e10e17ce0c6e6e57f75f9015621b77653453346bde4e376fe7a2815bffd7959b
      RUNNER_BYTES: "18964"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and compile exact independent reviewer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/merx-review-v1
          mkdir -p /tmp/merx-review-v1
          : > /tmp/merx-review-v1/review.gz.b64
          for blob in 4791e52ccd2070f0a40fff4e39b4ca450d8f7ad5 14fc6beb7764c784f087238e5026749115ed9219 76d7408c6fb99be1c626a218f94de99767cc6789 83e9cc8f4b8a8629a87cfc861385d41a627a47c7; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/merx-review-v1/review.gz.b64
          done
          test "$(sha256sum /tmp/merx-review-v1/review.gz.b64 | cut -d' ' -f1)" = "$RUNNER_B64_SHA256"
          python3 - <<'PY'
          import base64,gzip,hashlib,os
          from pathlib import Path
          root=Path('/tmp/merx-review-v1')
          raw=base64.b64decode(root.joinpath('review.gz.b64').read_text())
          assert hashlib.sha256(raw).hexdigest()==os.environ['RUNNER_GZIP_SHA256']
          data=gzip.decompress(raw)
          assert len(data)==int(os.environ['RUNNER_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['RUNNER_SHA256']
          root.joinpath('review.sh').write_bytes(data)
          PY
          bash -n /tmp/merx-review-v1/review.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/merx-review-v1/review.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for i,block in enumerate(blocks): compile(block,f'<embedded-{i}>', 'exec')
          PY

      - name: Execute exact independent candidate review
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/merx-review-v1/review.sh
          exec /tmp/merx-review-v1/review.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-candidate-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-candidate-review-v1/handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-candidate-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-candidate-review-v1
            /tmp/merx-review-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
