name: card-backfill-uc-117-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-APPLY.json"
      - "scripts/card-backfill-uc-117-apply.mjs"
      - ".github/workflows/card-backfill-uc-117-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-117-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-117 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-117-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.actor!=='Frank Welker'||row.character!=='Megatron & Scooby-Doo'||row.production!=='Transformers / Scooby-Doo'||row.year!==1969||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-117 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8694458431||row.render_artifact?.head_sha!=='341386b3e4c6e1ce9a47c597585a431b1e86edd3'||row.render_artifact?.zip_sha256!=='516d5bbd1114345a471fa062853d29280075d9af6e35f6d1b1c660841ca2cd68')throw new Error('UC-117 render custody drift');
          if(row.expected?.megatron_source?.sha256!=='dd827891b4de02426e99ec1f9dd92ba87b20deeefd65c13a94cd5be8adda6c96'||row.expected?.scooby_source?.sha256!=='6939abbdc3d4a2c6988acde82ea2a64754fa2ab804b365136c9c94739f9ade4d'||row.expected?.exact_role_record?.sha256!=='d4e10f4f9eebcf974d668a86d57046f7f5bc06a26286d503cda37c26584fccca')throw new Error('UC-117 source or role authorization drift');
          if(row.expected?.candidate?.sha256!=='92962ecfa1014b755db22a6da7e676371810f1bd19a4dc5660934d92f5a82565'||row.expected?.crop_preview?.sha256!=='2d812f76045247c4e0fae681fa6eebc13afa7cc3352e873f970f8963144cf181')throw new Error('UC-117 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==16||row.expected?.duplicate_item_count!==4||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==2||row.expected?.failed_discovery_count!==11)throw new Error('UC-117 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='two-role-character-composite'||row.ruling?.crop_ruling!=='pass-two-panel-face-and-context-layout'||row.ruling?.chronology_ruling!=='pass-1969-franchise-origin-separated-from-2002-plus-welker-scooby-tenure'||row.ruling?.canonical_mutation!==false)throw new Error('UC-117 ruling drift');
          if(row.immutable_source_exceptions?.['source-wikitext-megatron.txt']?.sha256!=='cac0be42f8d1560b070805d3fe56dc24229ca43e8051424a440fcc8868f7a12c'||row.immutable_source_exceptions?.['source-wikitext-megatron.txt']?.trailing_whitespace_lines?.length!==12)throw new Error('UC-117 immutable transcript exception drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.production!=='Transformers / Scooby-Doo'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          console.log(`PASS — UC-117 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8694458431/zip" > "$root/render.zip"
          echo "516d5bbd1114345a471fa062853d29280075d9af6e35f6d1b1c660841ca2cd68  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-117"
          test -f "$base/manifest.json"
          echo "984b1ee06dff5d200fe10a032fa286254de69c3448b3789db67596a334898d08  $base/manifest.json" | sha256sum -c -
          echo "53840cf6e69e092b09e6c7c30a17438a51b91aa61e9da24267c9aeec8b1df1c6  $base/duplicate-scan.json" | sha256sum -c -
          echo "3bf4e447385777d37ab7d3c35aa64d0e045e9f82d1e3e0d6ca80fe81e2787dab  $base/review.json" | sha256sum -c -
          echo "bb6efdc2284942aa1f0b5f47caa3767725a0cbe10f1d187f89372ed049b48cef  $base/review.md" | sha256sum -c -
          echo "c26c9abf78c63e4188b2e320a50081bf138e99f7709482e771cedb7ce1ec21ee  $base/SHA256SUMS" | sha256sum -c -
          echo "d4e10f4f9eebcf974d668a86d57046f7f5bc06a26286d503cda37c26584fccca  $base/exact-role-record.json" | sha256sum -c -
          echo "dd827891b4de02426e99ec1f9dd92ba87b20deeefd65c13a94cd5be8adda6c96  $base/megatron-original.jpg" | sha256sum -c -
          echo "6939abbdc3d4a2c6988acde82ea2a64754fa2ab804b365136c9c94739f9ade4d  $base/scooby-original.webp" | sha256sum -c -
          echo "6c8eb551fb78ad592ef22e2ad7d811a74e7b806751413717c4bc068f5ed80fa1  $base/source-page-frank-welker-official.png" | sha256sum -c -
          echo "2b0d46c769a3fac918c8cecad284717afc3270013abc6caeded6206d850fe3f3  $base/source-page-cw-frank-welker-scooby.png" | sha256sum -c -
          echo "2a7057954a3cc04573b9ad11b3414448d57405bc2582a911752fa0375db68068  $base/source-page-megatron.png" | sha256sum -c -
          echo "f502778af0d573c795d3b3252cdd849bcbd7504ccafc18061a27dae7ee0377ef  $base/source-page-scooby.png" | sha256sum -c -
          echo "cac0be42f8d1560b070805d3fe56dc24229ca43e8051424a440fcc8868f7a12c  $base/source-wikitext-megatron.txt" | sha256sum -c -
          echo "d624735e10ce01face886c3eef40d2312184394f80cde2db0467b4851c18b89e  $base/source-wikitext-scooby.txt" | sha256sum -c -
          echo "92962ecfa1014b755db22a6da7e676371810f1bd19a4dc5660934d92f5a82565  $base/uc-117-still-candidate.jpg" | sha256sum -c -
          echo "2d812f76045247c4e0fae681fa6eebc13afa7cc3352e873f970f8963144cf181  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'RECEIPT'
          run_id=30374799532
          artifact_id=8694458431
          artifact_name=card-backfill-uc-117-render-30374799532
          artifact_zip_sha256=516d5bbd1114345a471fa062853d29280075d9af6e35f6d1b1c660841ca2cd68
          artifact_head_sha=341386b3e4c6e1ce9a47c597585a431b1e86edd3
          source_manifest_sha256=984b1ee06dff5d200fe10a032fa286254de69c3448b3789db67596a334898d08
          source_sums_sha256=c26c9abf78c63e4188b2e320a50081bf138e99f7709482e771cedb7ce1ec21ee
          RECEIPT
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-117-apply/source/output/UC-117
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-apply"
          node --check scripts/card-backfill-uc-117-apply.mjs
          node scripts/card-backfill-uc-117-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-117-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_e34d57677891f2a69d198694');
          if(!specimen||specimen.still)throw new Error('UC-117 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-117 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit disposition was canonically mutated');
          console.log('PASS — UC-117 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-117.json \
            .github/CARD-BACKFILL-UC-117-DISCOVER.json \
            .github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-117-MEGATRON-PROBE.json \
            .github/CARD-BACKFILL-UC-117-MEGATRON-PROBE-RESULT.json \
            .github/CARD-BACKFILL-UC-117-RENDER.json \
            .github/CARD-BACKFILL-UC-117-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-117-scope.yml \
            .github/workflows/card-backfill-uc-117-discover.yml \
            .github/workflows/card-backfill-uc-117-megatron-probe.yml \
            .github/workflows/card-backfill-uc-117-render.yml \
            .github/workflows/card-backfill-uc-117-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-117-scope.mjs \
            scripts/card-backfill-uc-117-discover.mjs \
            scripts/card-backfill-uc-117-megatron-probe.mjs \
            scripts/card-backfill-uc-117-render.mjs \
            scripts/card-backfill-uc-117-apply.mjs
          git add -A
          git diff --cached --check -- . ':(exclude)data/review/card-backfill/UC-117/source-wikitext-megatron.txt'
          python3 - <<'PY' | tee "$root/immutable-wikitext-check.log"
          from pathlib import Path
          import hashlib
          p=Path('data/review/card-backfill/UC-117/source-wikitext-megatron.txt')
          b=p.read_bytes()
          assert hashlib.sha256(b).hexdigest()=='cac0be42f8d1560b070805d3fe56dc24229ca43e8051424a440fcc8868f7a12c'
          lines=p.read_text().splitlines()
          trailing=[i+1 for i,line in enumerate(lines) if line.rstrip()!=line]
          assert trailing==[22,138,148,242,267,269,310,336,380,437,471,491], trailing
          print('PASS — exact Megatron transcript and trailing-space ledger preserved')
          PY
          git commit -m 'Card backfill: retain UC-117 Frank Welker two-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-026
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-026 HEAD)
          test "${#changed[@]}" -eq 16
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-117/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-027
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-117-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-apply
            data/review/card-backfill/UC-117
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
