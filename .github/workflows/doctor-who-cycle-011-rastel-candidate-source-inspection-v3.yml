name: doctor-who-cycle-011-rastel-candidate-source-inspection-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-source-inspection-v3
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3
      RUNNER_B64_SHA256: db8c293d295011f00124f6a2c3f9a688b0b811d07909260f5fdc3422cb4f7b25
      RUNNER_GZIP_SHA256: b29b0b8de66290562eed0105000d04648ad0808ec01a2cd8761e7b5e3c9b8c05
      RUNNER_SHA256: ce41da04543e4ca4e7c792106c79a77681591197c735d95a2b1820f5dcdbc5df
      RUNNER_BYTES: "16392"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and compile exact source-inspection runner V3
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3-runner
          rm -rf "$root"
          mkdir -p "$root"
          : > "$root/runner.gz.b64"
          for blob in 25cb51848221fd1d6438edc2e3e14aeffff3976e fabd16cc8aec30bd94bf1743d53dc61278e62ee5; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/runner.gz.b64"
          done
          test "$(sha256sum "$root/runner.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$root/runner.gz.b64" > "$root/runner.sh.gz"
          test "$(sha256sum "$root/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$root/runner.sh.gz" > "$root/runner.sh"
          test "$(wc -c < "$root/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$root/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$root/runner.sh"
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3-runner/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",text,re.S)
          assert len(blocks)==4
          for i,block in enumerate(blocks): compile(textwrap.dedent(block),f'<embedded-{i}>','exec')
          PY

      - name: Execute exact read-only source inspection V3
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3-runner/runner.sh
          exec /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3-runner/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v3-runner
            /tmp/rastel-source-v3-reconstruction
            /tmp/merx-materializer-v4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
