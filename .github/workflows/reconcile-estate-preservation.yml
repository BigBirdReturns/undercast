name: estate-preservation-reconciliation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reconcile-estate-preservation.yml"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: estate-preservation-reconciliation
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TARGET_BRANCH: main
  AUTHORIZED_HEAD: ${{ github.sha }}
  MERGED_MAIN: d8d02f20fdb6ff4d561908b3f5d2e1eb83a5aba2
  RELEASE_HEAD: d723f84bc17a1f0561b9e54bb8238e1bffeb075f
  PRESERVATION_TAG: preservation-20260801-d723f84bc17a
  PRESERVE_WORKFLOW: preserve.yml
  PAGES_WORKFLOW: pages.yml
  LIVE_ORIGIN: https://bigbirdreturns.github.io/undercast
  LIVE_RECEIPT: data/review/estate-debt/ESTATE-RELEASE-LIVE-VERIFICATION.json
  CLOSURE_RECEIPT: data/review/estate-debt/ESTATE-RELEASE-PRESERVATION-CLOSURE.json
  SELF: .github/workflows/reconcile-estate-preservation.yml

jobs:
  reconcile:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove the recovery authority and download the immutable release
        id: published
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$MERGED_MAIN" "$RELEASE_HEAD"
          git merge-base --is-ancestor "$RELEASE_HEAD" "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$LIVE_RECEIPT"
          test -e "$SELF"
          test ! -e .github/workflows/finalize-estate-release.yml

          git fetch --force origin "refs/tags/${PRESERVATION_TAG}:refs/tags/${PRESERVATION_TAG}"
          test "$(git rev-list -n 1 "$PRESERVATION_TAG")" = "$RELEASE_HEAD"

          rm -rf /tmp/estate-preservation-published
          mkdir -p /tmp/estate-preservation-published
          gh release view "$PRESERVATION_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,url,isDraft,isPrerelease,publishedAt,assets \
            > /tmp/estate-preservation-release.json
          gh release download "$PRESERVATION_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/estate-preservation-published --clobber

          test -e /tmp/estate-preservation-published/preservation-registry.json
          test -e /tmp/estate-preservation-published/source-verification.json
          test -e /tmp/estate-preservation-published/SHA256SUMS

          PRESERVATION_TAG="$PRESERVATION_TAG" RELEASE_HEAD="$RELEASE_HEAD" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const root = '/tmp/estate-preservation-published';
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const registry = JSON.parse(fs.readFileSync(`${root}/preservation-registry.json`, 'utf8'));
          const snapshot = registry.snapshots.find((row) => row.id === process.env.PRESERVATION_TAG);
          if (!snapshot) throw new Error(`published registry lacks ${process.env.PRESERVATION_TAG}`);
          if (snapshot.repository_commit !== process.env.RELEASE_HEAD) throw new Error(`snapshot commit ${snapshot.repository_commit} != ${process.env.RELEASE_HEAD}`);
          if (snapshot.status !== 'pending') throw new Error(`expected pending snapshot, found ${snapshot.status}`);
          if (snapshot.public_release?.tag !== process.env.PRESERVATION_TAG) throw new Error('public release tag drifted');
          if (!/^\d+$/.test(String(snapshot.verification?.workflow_run || ''))) throw new Error('snapshot workflow run is missing');
          const assets = snapshot.public_release?.assets || [];
          if (assets.length !== 2) throw new Error(`expected two public snapshot assets, found ${assets.length}`);
          const kinds = new Set(assets.map((asset) => asset.kind));
          for (const kind of ['source-bag', 'repository-snapshot']) if (!kinds.has(kind)) throw new Error(`missing ${kind}`);
          for (const asset of assets) {
            const file = `${root}/${asset.name}`;
            if (!fs.existsSync(file)) throw new Error(`release asset missing: ${asset.name}`);
            const bytes = fs.readFileSync(file);
            if (bytes.length !== asset.bytes) throw new Error(`${asset.name} byte count drifted`);
            if (sha256(bytes) !== asset.sha256) throw new Error(`${asset.name} SHA-256 drifted`);
          }
          const sums = fs.readFileSync(`${root}/SHA256SUMS`, 'utf8').split(/\r?\n/).filter(Boolean);
          for (const line of sums) {
            const match = line.match(/^([0-9a-f]{64})\s+(.+)$/);
            if (!match) throw new Error(`invalid SHA256SUMS line: ${line}`);
            const file = `${root}/${path.basename(match[2])}`;
            if (!fs.existsSync(file)) throw new Error(`checksummed asset missing: ${path.basename(match[2])}`);
            if (sha256(fs.readFileSync(file)) !== match[1]) throw new Error(`published checksum mismatch: ${path.basename(match[2])}`);
          }
          fs.writeFileSync('/tmp/estate-preservation-snapshot.json', JSON.stringify(snapshot, null, 2));
          fs.writeFileSync('/tmp/estate-preservation-run-id.txt', String(snapshot.verification.workflow_run));
          NODE

          preserve_run="$(cat /tmp/estate-preservation-run-id.txt)"
          gh run view "$preserve_run" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,event,url,workflowName,jobs \
            > /tmp/estate-preservation-run.json
          gh run view "$preserve_run" --repo "$GITHUB_REPOSITORY" --log-failed \
            > /tmp/estate-preservation-failed.log 2>&1 || true

          PRESERVE_RUN="$preserve_run" RELEASE_HEAD="$RELEASE_HEAD" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const run = JSON.parse(fs.readFileSync('/tmp/estate-preservation-run.json', 'utf8'));
          if (String(run.databaseId) !== process.env.PRESERVE_RUN) throw new Error('preservation run ID drifted');
          if (run.headSha !== process.env.RELEASE_HEAD) throw new Error(`preservation run head ${run.headSha} != ${process.env.RELEASE_HEAD}`);
          if (run.event !== 'workflow_dispatch') throw new Error(`preservation run event is ${run.event}`);
          if (run.status !== 'completed' || run.conclusion !== 'failure') throw new Error(`expected completed failed preservation run, found ${run.status}/${run.conclusion}`);
          const failed_steps = [];
          for (const job of run.jobs || []) for (const step of job.steps || []) if (step.conclusion === 'failure') failed_steps.push({ job: job.name, step: step.name, number: step.number });
          if (!failed_steps.length) throw new Error('failed preservation run exposes no failed step');
          const log = fs.existsSync('/tmp/estate-preservation-failed.log') ? fs.readFileSync('/tmp/estate-preservation-failed.log', 'utf8') : '';
          const diagnostic_lines = log.split(/\r?\n/)
            .filter((line) => /##\[error\]|\bFAIL\b|\bError:|not ready|drift|failed|refus/i.test(line))
            .slice(-40)
            .map((line) => line.slice(0, 600));
          fs.writeFileSync('/tmp/estate-preservation-failure.json', JSON.stringify({
            workflow_run: Number(run.databaseId),
            workflow_name: run.workflowName,
            url: run.url,
            conclusion: run.conclusion,
            failed_steps,
            failed_log_sha256: crypto.createHash('sha256').update(log).digest('hex'),
            diagnostic_lines,
          }, null, 2));
          NODE

          release_url="$(node -p "require('/tmp/estate-preservation-release.json').url")"
          run_url="$(node -p "require('/tmp/estate-preservation-run.json').url")"
          echo "preserve_run=$preserve_run" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Verify the source bag and restorable repository snapshot
        run: |
          set -euo pipefail
          source_name="$(node -p "require('/tmp/estate-preservation-snapshot.json').public_release.assets.find(a=>a.kind==='source-bag').name")"
          repository_name="$(node -p "require('/tmp/estate-preservation-snapshot.json').public_release.assets.find(a=>a.kind==='repository-snapshot').name")"
          source_archive="/tmp/estate-preservation-published/$source_name"
          repository_archive="/tmp/estate-preservation-published/$repository_name"

          rm -rf /tmp/estate-preservation-source /tmp/estate-preservation-repository
          mkdir -p /tmp/estate-preservation-source /tmp/estate-preservation-repository
          tar -xzf "$source_archive" -C /tmp/estate-preservation-source
          test -d /tmp/estate-preservation-source/source-bag
          node scripts/preserve-verify.mjs /tmp/estate-preservation-source/source-bag --json \
            > /tmp/estate-preservation-source-verification-fresh.json

          node - <<'NODE'
          const fs = require('fs');
          const published = JSON.parse(fs.readFileSync('/tmp/estate-preservation-published/source-verification.json', 'utf8'));
          const fresh = JSON.parse(fs.readFileSync('/tmp/estate-preservation-source-verification-fresh.json', 'utf8'));
          for (const key of ['status', 'payload_files', 'payload_bytes', 'tag_files']) if (fresh[key] !== published[key]) throw new Error(`source verification ${key} drifted`);
          if (JSON.stringify(fresh.detail) !== JSON.stringify(published.detail)) throw new Error('source verification detail drifted');
          NODE

          tar -xzf "$repository_archive" -C /tmp/estate-preservation-repository
          test -e "/tmp/estate-preservation-repository/$LIVE_RECEIPT"
          test -e /tmp/estate-preservation-repository/data/quality.json
          test -e /tmp/estate-preservation-repository/preservation/SNAPSHOTS.json
          test ! -e /tmp/estate-preservation-repository/.github/workflows/finalize-estate-release.yml
          test ! -e "/tmp/estate-preservation-repository/$SELF"
          cmp "$LIVE_RECEIPT" "/tmp/estate-preservation-repository/$LIVE_RECEIPT"
          cmp data/quality.json /tmp/estate-preservation-repository/data/quality.json

          RELEASE_HEAD="$RELEASE_HEAD" node - <<'NODE'
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync('/tmp/estate-preservation-repository/data/review/estate-debt/ESTATE-RELEASE-LIVE-VERIFICATION.json', 'utf8'));
          if (receipt.status !== 'verified') throw new Error(`live receipt status is ${receipt.status}`);
          if (receipt.authorization?.deployed_release_head !== 'fc6da3b408d9763ed34c84640c91fd747fcd4bf9') throw new Error('live receipt deployment head drifted');
          const quality = JSON.parse(fs.readFileSync('/tmp/estate-preservation-repository/data/quality.json', 'utf8'));
          if (quality.total !== 1313 || quality.metrics?.complete_pairs !== 740 || quality.metrics?.missing_still !== 332 || quality.metrics?.missing_portrait !== 348 || quality.metrics?.missing_both !== 107) throw new Error('preserved quality metrics drifted');
          NODE

      - name: Adopt the published registry and prepare exact recovery custody
        run: |
          set -euo pipefail
          cp /tmp/estate-preservation-published/preservation-registry.json preservation/SNAPSHOTS.json
          node scripts/preserve-status.mjs --json --require-scope-archives \
            > /tmp/estate-preservation-status.json
          node scripts/autopilot.mjs sync > /tmp/estate-preservation-autopilot-sync.txt
          node scripts/autopilot.mjs validate

          TERMINAL_TAG="estate-release-${GITHUB_RUN_ID}" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const snapshot = JSON.parse(fs.readFileSync('/tmp/estate-preservation-snapshot.json', 'utf8'));
          const failure = JSON.parse(fs.readFileSync('/tmp/estate-preservation-failure.json', 'utf8'));
          const release = JSON.parse(fs.readFileSync('/tmp/estate-preservation-release.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('/tmp/estate-preservation-status.json', 'utf8'));
          const qualityBytes = fs.readFileSync('data/quality.json');
          const quality = JSON.parse(qualityBytes);
          const liveReceiptBytes = fs.readFileSync(process.env.LIVE_RECEIPT);
          const registryBytes = fs.readFileSync('preservation/SNAPSHOTS.json');
          const receipt = {
            version: 1,
            transaction: 'ESTATE-RELEASE-002',
            operation: 'existing-immutable-preservation-release-reconciliation',
            status: 'preservation-reconciled',
            recorded_at: new Date().toISOString(),
            authorization: {
              merged_main_commit: process.env.MERGED_MAIN,
              live_receipt_commit: process.env.RELEASE_HEAD,
              recovery_parent: process.env.AUTHORIZED_HEAD,
              exact_head_lease_required: true,
            },
            live_release: {
              receipt_path: process.env.LIVE_RECEIPT,
              receipt_sha256: sha256(liveReceiptBytes),
              pages_workflow_run: JSON.parse(liveReceiptBytes).deployment.workflow_run,
              live_origin: process.env.LIVE_ORIGIN,
            },
            preservation: {
              snapshot_id: snapshot.id,
              snapshot_status: snapshot.status,
              repository_commit: snapshot.repository_commit,
              public_release_tag: snapshot.public_release.tag,
              public_release_url: release.url,
              public_assets: snapshot.public_release.assets,
              original_workflow: failure,
              registry_path: 'preservation/SNAPSHOTS.json',
              registry_sha256: sha256(registryBytes),
              source_bag_verified_again: true,
              repository_snapshot_verified_again: true,
              active_scope_archives_complete: status.scopes.filter((row) => row.archived).map((row) => row.scope_id),
            },
            quality: {
              path: 'data/quality.json',
              sha256: sha256(qualityBytes),
              total: quality.total,
              metrics: quality.metrics,
              baseline: quality.baseline,
              baseline_unchanged: true,
            },
            terminal_publication: {
              expected_release_tag: process.env.TERMINAL_TAG,
              recovery_workflow_run: Number(process.env.GITHUB_RUN_ID),
              final_pages_verification_pending: true,
            },
            boundary: {
              canonical_mutation: false,
              source_release_rewritten: false,
              release_assets_reused_without_clobber: true,
              failed_run_treated_as_acceptance: false,
              published_bytes_independently_reverified: true,
              one_shot_recovery_retires_before_publication: true,
              final_live_verification_required: true,
            },
          };
          fs.mkdirSync('data/review/estate-debt', { recursive: true });
          fs.writeFileSync(process.env.CLOSURE_RECEIPT, JSON.stringify(receipt, null, 2) + '\n');
          NODE

          git rm "$SELF"
          git add preservation/SNAPSHOTS.json "$CLOSURE_RECEIPT" \
            data/AUTOPILOT-CERTIFICATIONS.json data/AUTOPILOT-SCOPES.json \
            data/AUTOPILOT.json data/journal/autopilot.jsonl
          git diff --cached --check

          node - <<'NODE'
          const { execFileSync } = require('child_process');
          const paths = execFileSync('git', ['diff', '--cached', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const allowed = new Set([
            '.github/workflows/reconcile-estate-preservation.yml',
            'preservation/SNAPSHOTS.json',
            'data/review/estate-debt/ESTATE-RELEASE-PRESERVATION-CLOSURE.json',
            'data/AUTOPILOT-CERTIFICATIONS.json',
            'data/AUTOPILOT-SCOPES.json',
            'data/AUTOPILOT.json',
            'data/journal/autopilot.jsonl',
          ]);
          for (const required of ['.github/workflows/reconcile-estate-preservation.yml', 'preservation/SNAPSHOTS.json', 'data/review/estate-debt/ESTATE-RELEASE-PRESERVATION-CLOSURE.json']) if (!paths.includes(required)) throw new Error(`required recovery path missing: ${required}`);
          for (const path of paths) if (!allowed.has(path)) throw new Error(`unexpected recovery path: ${path}`);
          NODE

      - name: Run the exact preservation-aware archive gate
        run: |
          set -euo pipefail
          npm run preserve:fixtures
          npm run preserve:status -- --require-scope-archives
          npm run autopilot:fixtures
          npm run autopilot -- readiness --scope star-trek --require-active
          npm run autopilot -- validate
          npm run roadmap -- validate
          node scripts/validate.mjs
          git diff --cached --check

      - name: Run the complete repository and rendered-browser gate
        run: npm run gate

      - name: Publish registry custody and retire the recovery launcher under lease
        id: publish
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report
          git checkout -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'undercast-preservation-recovery'
          git config user.email 'undercast-preservation-recovery@users.noreply.github.com'
          git commit \
            -m 'Estate release: reconcile immutable preservation snapshot' \
            -m "merged_main=${MERGED_MAIN}" \
            -m "live_receipt_commit=${RELEASE_HEAD}" \
            -m "preservation_tag=${PRESERVATION_TAG}" \
            -m "failed_preservation_run=${{ steps.published.outputs.preserve_run }}" \
            -m "recovery_workflow_run=${GITHUB_RUN_ID}" \
            -m 'canonical_mutation=false'
          closure_head="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "closure_head=$closure_head" >> "$GITHUB_OUTPUT"

      - name: Deploy the exact registry-bearing main head
        id: pages
        env:
          CLOSURE_HEAD: ${{ steps.publish.outputs.closure_head }}
        run: |
          set -euo pipefail
          dispatch_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$PAGES_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 180); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PAGES_WORKFLOW" \
              --branch "$TARGET_BRANCH" --event workflow_dispatch --limit 100 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt \
              > /tmp/estate-preservation-pages-runs.json
            run_id="$(DISPATCH_AFTER="$dispatch_after" node - <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/estate-preservation-pages-runs.json', 'utf8'));
          const floor = Date.parse(process.env.DISPATCH_AFTER);
          const row = runs.find((run) => run.headSha === process.env.CLOSURE_HEAD && run.event === 'workflow_dispatch' && Date.parse(run.createdAt) >= floor - 5000);
          if (row) process.stdout.write(String(row.databaseId));
          NODE
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,event,url \
            > /tmp/estate-preservation-pages-run.json
          node - <<'NODE'
          const run = require('/tmp/estate-preservation-pages-run.json');
          if (run.headSha !== process.env.CLOSURE_HEAD || run.event !== 'workflow_dispatch' || run.status !== 'completed' || run.conclusion !== 'success') throw new Error(`unexpected Pages run: ${JSON.stringify(run)}`);
          NODE
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(node -p "require('/tmp/estate-preservation-pages-run.json').url")" >> "$GITHUB_OUTPUT"

      - name: Verify the final live object byte for byte
        env:
          CLOSURE_HEAD: ${{ steps.publish.outputs.closure_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSURE_HEAD"
          npm run build:site
          mkdir -p /tmp/estate-preservation-live
          : > /tmp/estate-preservation-live/checks.tsv

          verify_file() {
            local route="$1"
            local local_path="$2"
            local key="$3"
            local output="/tmp/estate-preservation-live/${key}"
            local matched=false
            for attempt in $(seq 1 90); do
              if curl -fsSL --connect-timeout 15 --max-time 90 \
                -H 'Cache-Control: no-cache' \
                "${LIVE_ORIGIN}/${route}?release=${CLOSURE_HEAD}&attempt=${attempt}" \
                -o "$output"; then
                if cmp -s "$local_path" "$output"; then
                  matched=true
                  break
                fi
              fi
              sleep 10
            done
            test "$matched" = true
            printf '%s\t%s\t%s\t%s\n' "$route" "$local_path" \
              "$(sha256sum "$local_path" | awk '{print $1}')" \
              "$(stat -c '%s' "$local_path")" \
              >> /tmp/estate-preservation-live/checks.tsv
          }

          verify_file "index.html" "index.html" "index.html"
          verify_file "data/quality.json" "data/quality.json" "quality.json"
          verify_file "preservation/SNAPSHOTS.json" "preservation/SNAPSHOTS.json" "preservation-registry.json"
          verify_file "$LIVE_RECEIPT" "$LIVE_RECEIPT" "live-receipt.json"
          verify_file "$CLOSURE_RECEIPT" "$CLOSURE_RECEIPT" "preservation-closure.json"
          verify_file "records/UC-178/" "records/UC-178/index.html" "UC-178.html"
          verify_file "records/UC-684/" "records/UC-684/index.html" "UC-684.html"
          verify_file "records/UC-338/" "records/UC-338/index.html" "UC-338.html"
          verify_file "images/uc-178-still-2d6360659016.jpg" "images/uc-178-still-2d6360659016.jpg" "UC-178.jpg"
          verify_file "images/uc-684-portrait-1a2d9a32dbbc.jpg" "images/uc-684-portrait-1a2d9a32dbbc.jpg" "UC-684.jpg"
          verify_file "images/uc-338-still-fe30c21c2a17.jpg" "images/uc-338-still-fe30c21c2a17.jpg" "UC-338.jpg"

      - name: Publish the terminal external receipt and close custody
        env:
          CLOSURE_HEAD: ${{ steps.publish.outputs.closure_head }}
          FINAL_PAGES_RUN: ${{ steps.pages.outputs.run_id }}
          FINAL_PAGES_URL: ${{ steps.pages.outputs.run_url }}
          PRESERVE_RUN: ${{ steps.published.outputs.preserve_run }}
          PRESERVE_RUN_URL: ${{ steps.published.outputs.run_url }}
          PRESERVATION_RELEASE_URL: ${{ steps.published.outputs.release_url }}
        run: |
          set -euo pipefail
          terminal_tag="estate-release-${GITHUB_RUN_ID}"
          TERMINAL_TAG="$terminal_tag" node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const checks = fs.readFileSync('/tmp/estate-preservation-live/checks.tsv', 'utf8').trim().split('\n').map((line) => {
            const [route, local_path, digest, bytes] = line.split('\t');
            return { route: `${process.env.LIVE_ORIGIN}/${route}`, local_path, sha256: digest, bytes: Number(bytes), exact_byte_match: true };
          });
          const terminal = {
            version: 1,
            transaction: 'ESTATE-RELEASE-003',
            operation: 'terminal-live-and-preservation-custody',
            status: 'terminal',
            recorded_at: new Date().toISOString(),
            merged_main_commit: process.env.MERGED_MAIN,
            live_receipt_commit: process.env.RELEASE_HEAD,
            registry_bearing_main_commit: process.env.CLOSURE_HEAD,
            preservation_snapshot: {
              tag: process.env.PRESERVATION_TAG,
              release_url: process.env.PRESERVATION_RELEASE_URL,
              original_workflow_run: Number(process.env.PRESERVE_RUN),
              original_workflow_url: process.env.PRESERVE_RUN_URL,
              source_bag_verified_again: true,
              repository_snapshot_verified_again: true,
            },
            recovery: {
              workflow_run: Number(process.env.GITHUB_RUN_ID),
              terminal_release_tag: process.env.TERMINAL_TAG,
              one_shot_launcher_absent_from_main: true,
            },
            deployment: {
              workflow: process.env.PAGES_WORKFLOW,
              workflow_run: Number(process.env.FINAL_PAGES_RUN),
              workflow_url: process.env.FINAL_PAGES_URL,
              head: process.env.CLOSURE_HEAD,
              live_origin: process.env.LIVE_ORIGIN,
            },
            receipts: {
              live: { path: process.env.LIVE_RECEIPT, sha256: sha256(fs.readFileSync(process.env.LIVE_RECEIPT)) },
              preservation: { path: process.env.CLOSURE_RECEIPT, sha256: sha256(fs.readFileSync(process.env.CLOSURE_RECEIPT)) },
              registry: { path: 'preservation/SNAPSHOTS.json', sha256: sha256(fs.readFileSync('preservation/SNAPSHOTS.json')) },
            },
            checks,
            boundary: {
              bounded_existing_estate_complete: true,
              canonical_mutation: false,
              release_deployed: true,
              live_byte_verification_complete: true,
              preservation_reconciliation_complete: true,
              further_work_belongs_to_the_next_frontier: true,
            },
          };
          fs.writeFileSync('/tmp/ESTATE-RELEASE-TERMINAL.json', JSON.stringify(terminal, null, 2) + '\n');
          NODE

          if ! gh release view "$terminal_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$terminal_tag" --repo "$GITHUB_REPOSITORY" --target "$CLOSURE_HEAD" \
              --title "UNDERCAST estate release terminal custody" \
              --notes "The merged existing media estate is deployed, byte-verified, and preservation-reconciled. The attached receipt binds the exact main head, Pages run, preservation release, and representative live objects."
          fi
          gh release upload "$terminal_tag" /tmp/ESTATE-RELEASE-TERMINAL.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          terminal_url="$(gh release view "$terminal_tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"

          cat > /tmp/estate-preservation-closure.md <<EOF
          ## Estate deployment and preservation closure

          The existing media estate is now merged, deployed, byte-verified, and preservation-reconciled.

          \`\`\`text
          merged main commit:          ${MERGED_MAIN}
          live receipt commit:         ${RELEASE_HEAD}
          registry-bearing main head:  ${CLOSURE_HEAD}
          preservation snapshot:       ${PRESERVATION_TAG}
          original preservation run:   ${PRESERVE_RUN}
          recovery workflow run:       ${GITHUB_RUN_ID}
          final Pages run:             ${FINAL_PAGES_RUN}
          terminal receipt release:    ${terminal_tag}
          \`\`\`

          Exact live-byte checks passed for the wall, quality ledger, preservation registry, both repository receipts, UC-178, UC-684, UC-338, and all three representative adopted media assets. The recovery workflow removed itself before publication. The failed preservation run was retained as failure evidence and was not treated as acceptance; its already-published immutable bytes were independently reverified before their registry receipt was adopted.

          Preservation release: ${PRESERVATION_RELEASE_URL}
          Final Pages run: ${FINAL_PAGES_URL}
          Terminal receipt: ${terminal_url}
          Live site: ${LIVE_ORIGIN}/
          EOF
          gh pr comment 132 --repo "$GITHUB_REPOSITORY" --body-file /tmp/estate-preservation-closure.md
          cat /tmp/estate-preservation-closure.md >> "$GITHUB_STEP_SUMMARY"
