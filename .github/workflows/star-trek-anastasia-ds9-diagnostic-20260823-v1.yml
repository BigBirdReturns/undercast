  REVIEW_ROOT: /tmp/star-trek-anastasia-rebound-review-v2
  FINAL_ROOT: /tmp/star-trek-anastasia-recovery-final-v2
  DIAGNOSTIC_ROOT: /tmp/star-trek-anastasia-ds9-diagnostic-v1

jobs:
  diagnose:
    name: capture-exact-anastasia-ds9-projection-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_COMMIT: 73f572459b49b9cf30915aca5ec6511478dc2807
      CANDIDATE_TREE: fe3f75da989b9006447df5424fbf8acb29f71d1f
      REBOUND_STAGE_ARTIFACT_ID: "9489977666"
      REBOUND_STAGE_ARTIFACT_DIGEST: 8a9f87ee042760270f11217cad26d7da3471f0fe6fd2ec38b837ad890d1ed2e3
      REBOUND_REVIEW_ARTIFACT_ID: "9489987688"
      REBOUND_REVIEW_ARTIFACT_DIGEST: 27c935a8524b199d560c4d04265fb097a58de25bd5ea987f7a3976de80b4cf11
      REBOUND_REVIEW_SHA256: b8892e3f147087dd0353c246d66b8b70f7eeff38de53416af4b6f6c7aa642618
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download rebound stage receipt
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-rebound-stage-v2
          path: /tmp/star-trek-anastasia-rebound-stage-v2
          repository: ${{ github.repository }}
          run-id: "32627038856"
          github-token: ${{ github.token }}

      - name: Download independent rebound review
        uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-rebound-independent-review-v2
          path: /tmp/star-trek-anastasia-rebound-review-v2
          repository: ${{ github.repository }}
          run-id: "32627038856"
          github-token: ${{ github.token }}

      - name: Reconstruct sealed recovery controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-finalizer-recovery-v2/controller.sh.gz.b64.part-* > /tmp/anastasia-recovery-controller.b64
          echo "${RECOVERY_CONTROLLER_B64_SHA256}  /tmp/anastasia-recovery-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-recovery-controller.b64 | gzip -d > "$RECOVERY_CONTROLLER"
          echo "${RECOVERY_CONTROLLER_SHA256}  ${RECOVERY_CONTROLLER}" | sha256sum -c -
          bash -n "$RECOVERY_CONTROLLER"
          chmod +x "$RECOVERY_CONTROLLER"

      - name: Reproduce finalization with remote mutation disabled
        id: reproduce
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$DIAGNOSTIC_ROOT"
          git remote set-url --push origin https://example.invalid/anastasia-diagnostic-no-push
          set +e
          "$RECOVERY_CONTROLLER" finalize > >(tee "$DIAGNOSTIC_ROOT/finalize.stdout.log") 2> >(tee "$DIAGNOSTIC_ROOT/finalize.stderr.log" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$DIAGNOSTIC_ROOT/finalize.exit-code.txt"
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          git status --short > "$DIAGNOSTIC_ROOT/git-status-short.txt" || true
          git diff --name-status > "$DIAGNOSTIC_ROOT/git-diff-name-status.txt" || true
          git diff --stat > "$DIAGNOSTIC_ROOT/git-diff-stat.txt" || true
          git diff --binary > "$DIAGNOSTIC_ROOT/git-diff-binary.patch" || true
          git diff --name-only -- data/ds9 > "$DIAGNOSTIC_ROOT/ds9-dirty-paths.txt" || true
          git diff --stat -- data/ds9 > "$DIAGNOSTIC_ROOT/ds9-diff-stat.txt" || true
          git diff --binary -- data/ds9 > "$DIAGNOSTIC_ROOT/ds9-projection-drift.patch" || true
          find data/ds9 -type f -print0 | sort -z | xargs -0 sha256sum > "$DIAGNOSTIC_ROOT/ds9-generated.sha256" || true
          git diff --quiet -- data/ds9 && printf 'clean\n' > "$DIAGNOSTIC_ROOT/ds9-drift-state.txt" || printf 'dirty\n' > "$DIAGNOSTIC_ROOT/ds9-drift-state.txt"
          cp "$RECOVERY_CONTROLLER" "$DIAGNOSTIC_ROOT/recovery-controller.sh"
          sha256sum "$RECOVERY_CONTROLLER" > "$DIAGNOSTIC_ROOT/recovery-controller.sha256"

      - name: Upload exact DS9 drift evidence
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-ds9-diagnostic-${{ github.run_id }}
          path: /tmp/star-trek-anastasia-ds9-diagnostic-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Assert fail-closed reproduction
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.reproduce.outputs.exit_code }}" != "0"
          test -s "$DIAGNOSTIC_ROOT/ds9-dirty-paths.txt"
          grep -Fx dirty "$DIAGNOSTIC_ROOT/ds9-drift-state.txt"
