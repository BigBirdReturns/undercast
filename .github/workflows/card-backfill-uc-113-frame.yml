name: card-backfill-uc-113-frame

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-113-FRAME.json"
      - "scripts/card-backfill-uc-113-frame.mjs"
      - ".github/workflows/card-backfill-uc-113-frame.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-113-frame-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frame:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-025'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-025
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-113 raw-frame authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-113-FRAME.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-113');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-113');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1d34489d543c01ca6616d57a');
          if(row.version!==1||row.record_id!=='UC-113'||row.actor!=='Taika Waititi'||row.character!=='Korg'||row.production!=='Thor: Ragnarok'||row.year!==2017||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-113 raw-frame authorization drift');
          if(row.discovery_artifact?.artifact_id!==8676847359||row.video_orbit_artifact?.artifact_id!==8677109493||row.video_orbit_artifact?.head_sha!=='a7a40afb233d04ffbe95b673a3be7535d63c8edd')throw new Error('UC-113 raw-frame custody drift');
          if(row.failed_video_orbit_checkpoints?.length!==3||row.failed_video_orbit_checkpoints[0]?.artifact_id!==8676934325||row.failed_video_orbit_checkpoints[1]?.artifact_id!==8676993291||row.failed_video_orbit_checkpoints[2]?.artifact_id!==8677055263)throw new Error('UC-113 failed orbit custody drift');
          if(row.selected_orbit_frame?.artifact_sha256!=='74e104696d9c58274171f745340afd38c3499e9d69aeb0861baefee30ec3b42d'||row.selected_orbit_frame?.raw_extract_time_seconds!==33.62111)throw new Error('UC-113 selected timestamp drift');
          if(row.selection_contract?.raw_video_canvas_extract_required!==true||row.selection_contract?.browser_controls_forbidden_in_retained_source!==true||row.selection_contract?.performance_capture_thumbnail_rejected!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-113 raw-frame selection contract drift');
          if(!specimen||specimen.actor!=='Taika Waititi'||specimen.character!=='Korg'||specimen.production!=='Thor: Ragnarok'||specimen.years!=='2017'||specimen.still)throw new Error('UC-113 specimen boundary drift');
          if(source?.still)throw new Error('UC-113 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-113'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-113 audit boundary drift');
          console.log('PASS — exact UC-113 raw official Korg frame extraction authorized');
          NODE
      - name: Retrieve and verify exact successful video-orbit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-frame"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8677109493/zip" > "$root/video-orbit.zip"
          echo "a96166b4b30033a410e27ba8d177d2dbc3839107cb507807fc20b78220b6ce07  $root/video-orbit.zip" | sha256sum -c -
          unzip -q "$root/video-orbit.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-113-video-orbit"
          test -f "$base/manifest.json"
          echo "1bdb9dfaacacd9243e20d307a01047001785de76b84ceee55229a4d904241a94  $base/manifest.json" | sha256sum -c -
          echo "ab1274f6920104563403545e99214e6c626b8de6f3ffd58102f6abd418fad3da  $base/summary.json" | sha256sum -c -
          echo "07377fdcf7291fc878c65fd2c4732fe142b41f3cbf69a626e36b8219a07d52a4  $base/contact-sheet-video-frames.jpg" | sha256sum -c -
          echo "8facccba89fb4403e9c3fe798e1602cac9b7ea62a0932d950f0ada7a930e7eb9  $base/pages/marvel-finding-korg-video-orbit.png" | sha256sum -c -
          echo "303ad9e8b54fa8bd9cc8a5c1fe9c3b108cfda9bf831a02d45021705f8dda9f81  $base/video-probe.json" | sha256sum -c -
          echo "74e104696d9c58274171f745340afd38c3499e9d69aeb0861baefee30ec3b42d  $base/frames/frame-33000ms.png" | sha256sum -c -
      - name: Extract raw completed Korg frame without browser controls
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-113-frame/source/card-backfill-uc-113-video-orbit
          OUT: ${{ runner.temp }}/card-backfill-uc-113-frame/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-frame"
          node --check scripts/card-backfill-uc-113-frame.mjs
          node scripts/card-backfill-uc-113-frame.mjs 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-113-frame"
          rm -rf "$root/source" "$root/video-orbit.zip"
      - name: Upload raw frame, selection receipts, hashes, and source page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-113-frame-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-113-frame/output
            ${{ runner.temp }}/card-backfill-uc-113-frame/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
