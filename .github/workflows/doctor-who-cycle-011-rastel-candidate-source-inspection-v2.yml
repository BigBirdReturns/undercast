name: doctor-who-cycle-011-rastel-candidate-source-inspection-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-source-inspection-v2
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2
      RUNNER_B64_SHA256: 4763c7b43ffbd390aef77f976e388bd7e6d488917393682802e059c41b7aedb9
      RUNNER_GZIP_SHA256: 153f35e9c4fbb74c48e4300cc00295f3aa7780d4f86b632a6402764c14c4d8a3
      RUNNER_SHA256: d8686c665003896a802456e30933f48a2af6d2bfefd3992c08d5be8fed29c23e
      RUNNER_BYTES: "16397"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and compile exact source-inspection runner
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2-runner
          rm -rf "$root"
          mkdir -p "$root"
          : > "$root/runner.gz.b64"
          for blob in b9b2acb24973cce7b3b5e5e638f8f01de58b60f5 510894141ea529a0dbe506f6034bf79b5b3d6320; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/runner.gz.b64"
          done
          test "$(sha256sum "$root/runner.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$root/runner.gz.b64" > "$root/runner.sh.gz"
          test "$(sha256sum "$root/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$root/runner.sh.gz" > "$root/runner.sh"
          test "$(wc -c < "$root/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$root/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$root/runner.sh"
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2-runner/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",text,re.S)
          assert len(blocks)==4
          for i,block in enumerate(blocks): compile(textwrap.dedent(block),f'<embedded-{i}>','exec')
          PY

      - name: Execute exact read-only source inspection
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2-runner/runner.sh
          exec /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2-runner/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v2-runner
            /tmp/rastel-source-v2-reconstruction
            /tmp/merx-materializer-v4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
