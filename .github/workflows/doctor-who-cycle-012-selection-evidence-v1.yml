name: doctor-who-cycle-012-selection-evidence-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-evidence-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-evidence-v1
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      INSTALLED_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v1
      WRITER_PR: "867"
      SOURCE_PR: "866"
      SOURCE_BRANCH: agent/doctor-who-cycle-012-preflight-v13
      SOURCE_HEAD: a0265638e30fbb669a09bb5ce1704c9853dbc2ce
      SOURCE_RUN: "31368785967"
      SOURCE_ATTEMPT: "1"
      SOURCE_JOB: "93392885230"
      SOURCE_ARTIFACT: "9055273612"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v13-31368785967-attempt-1
      SOURCE_ARTIFACT_BYTES: "170382"
      SOURCE_ARTIFACT_SHA256: c1ce1b79cbcdb29cf66f8cfd142269cac243777e4a7ad710f55bb795f09c3aeb
      SOURCE_ARTIFACT_FILES: "15"
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      CUSTODY_IDENTITY: fbe1b123c9ad17a23ff717fbaa47e2f59cc85032fc48a94648eb1d64e20f2da0
      V11_FAILURE_IDENTITY: 4fa80a2b079affa2bb575b94612adab32d42decad6da02d359e6316621baa68b
      V12_FAILURE_IDENTITY: cf8290c7b2bc94a0f0995b9a4334c9e72c322ed6a3390fcd2972ac5cde462a3c
      V13_REPAIR_IDENTITY: 73a7e8519c9489432573742a4fac4b7f6bbacf723e7ed560a7615ae89316ba3b
      SOURCE_AUTH_IDENTITY: 27360e4986a5cf33d6046e66afde5d57444265ec78a8812e920d2ec364011bb4
      TERMINAL_PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      COMMAND_IDENTITY: 60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      BRANCH: observer/doctor-who-cycle-012-selection-evidence-v1
      SELF: .github/workflows/doctor-who-cycle-012-selection-evidence-v1.yml
      OUT: /tmp/doctor-who-cycle-012-selection-evidence-v1
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact writer installation and isolated evidence carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,payload/selection,logs}
          test "$CURRENT_BASE" = "$INSTALLED_MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P "$INSTALLED_MAIN")" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN".."$INSTALLED_MAIN")" = 1
          test -z "$(git rev-list --merges "$BASE_MAIN".."$INSTALLED_MAIN")"
          test "$(git diff --name-status "$BASE_MAIN" "$INSTALLED_MAIN")" = $'A\t'"$WRITER_PATH"
          base_tree="$(git show -s --format=%T "$BASE_MAIN")"
          test -n "$base_tree"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$WRITER_PR" > "$OUT/api/writer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$WRITER_BRANCH" > "$OUT/api/writer-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$OUT/api/own-jobs.json"
          BASE_TREE="$base_tree" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          writer = json.loads((root / 'writer-pr.json').read_text())
          writer_ref = json.loads((root / 'writer-ref.json').read_text())
          own = json.loads((root / 'own-pr.json').read_text())
          jobs = json.loads((root / 'own-jobs.json').read_text())['jobs']
          assert writer['number'] == int(os.environ['WRITER_PR'])
          assert writer['head']['ref'] == os.environ['WRITER_BRANCH'] and writer['head']['sha'] == os.environ['INSTALLED_MAIN']
          assert writer['base']['ref'] == 'main'
          assert writer['commits'] == 1 and writer['changed_files'] == 1
          assert writer_ref['object']['sha'] == os.environ['INSTALLED_MAIN']
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged_at'] is None
          assert own['base']['sha'] == os.environ['INSTALLED_MAIN']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1
          matched = [row for row in jobs if row['name'] == 'retain']
          assert len(matched) == 1
          (root / 'own-job.txt').write_text(str(matched[0]['id']) + '\n')
          PY
          printf 'BASE_TREE=%s\nCURRENT_JOB=%s\n' "$base_tree" "$(cat "$OUT/api/own-job.txt")" >> "$GITHUB_ENV"

      - name: Authenticate exact V13 selection artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/selection.zip"
          test "$(sha256sum "$OUT/source/selection.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"

          ZIP="$OUT/source/selection.zip" TARGET="$OUT/source/extracted" python3 - <<'PY'
          import hashlib, json, os, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          api = root / 'api'
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['SOURCE_ARTIFACT_FILES'])
              assert len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          files = [path for path in target.rglob('*') if path.is_file()]
          assert len(files) == int(os.environ['SOURCE_ARTIFACT_FILES'])
          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest

          load_api = lambda name: json.loads((api / name).read_text())
          pr = load_api('source-pr.json')
          run = load_api('source-run.json')
          jobs = load_api('source-jobs.json')['jobs']
          artifact = load_api('source-artifact.json')
          assert pr['number'] == int(os.environ['SOURCE_PR'])
          assert pr['head']['ref'] == os.environ['SOURCE_BRANCH'] and pr['head']['sha'] == os.environ['SOURCE_HEAD']
          assert pr['base']['ref'] == 'main' and pr['draft'] is True and pr['merged_at'] is None
          assert pr['state'] in {'open', 'closed'} and pr['commits'] == 1 and pr['changed_files'] == 1
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_HEAD'] and run['head_branch'] == os.environ['SOURCE_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_attempt'] == int(os.environ['SOURCE_ATTEMPT'])
          matched = [row for row in jobs if row['id'] == int(os.environ['SOURCE_JOB'])]
          assert len(matched) == 1 and matched[0]['name'] == 'select' and matched[0]['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['SOURCE_ARTIFACT_BYTES'])
          assert artifact['digest'] == 'sha256:' + os.environ['SOURCE_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SOURCE_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_HEAD']

          def load_identity(name, expected):
              data = json.loads((target / name).read_text())
              identity = data.pop('identity')
              assert identity == expected
              assert sha(json.dumps(data, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == identity
              data['identity'] = identity
              return data

          selection = load_identity('selection.json', os.environ['SELECTION_IDENTITY'])
          custody = load_identity('transport-custody.json', os.environ['CUSTODY_IDENTITY'])
          load_identity('v11-failure.json', os.environ['V11_FAILURE_IDENTITY'])
          load_identity('v12-failure.json', os.environ['V12_FAILURE_IDENTITY'])
          load_identity('v13-repair.json', os.environ['V13_REPAIR_IDENTITY'])
          load_identity('source-authentication.json', os.environ['SOURCE_AUTH_IDENTITY'])
          load_identity('terminal-proof.json', os.environ['TERMINAL_PROOF_IDENTITY'])
          load_identity('selector-command.json', os.environ['COMMAND_IDENTITY'])

          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert selection['carrier'] == {'pr': int(os.environ['SOURCE_PR']), 'head': os.environ['SOURCE_HEAD'], 'base': os.environ['BASE_MAIN'], 'branch': os.environ['SOURCE_BRANCH']}
          assert selection['selected_task_id'] == 'ap_8965086737382df0e88366db'
          assert selection['normalized'] == {'performer': 'Dan Starkey', 'role': 'Senstarg', 'mode': 'unresolved'}
          assert selection['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert selection['boundary'] == {
              'selection_only': True, 'lease_issued': False, 'queue_mutated': False,
              'canonical_mutated': False, 'transport_mutation': False, 'wall_created': False,
              'media_adopted': False, 'cycle_receipt_written': False,
              'cycle_012_product_authority': False, 'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          assert (target / 'SELECTION_COMPLETE').read_text() == selection['identity'] + '\n'
          assert custody['status'] == 'cycle-012-preselection-transport-custody-frozen-v5'
          assert custody['identity'] == os.environ['CUSTODY_IDENTITY']
          assert custody['counts'] == {'stale_cycle12_refs': 17, 'observer_refs': 2, 'refs_to_delete': 19, 'pull_requests': 17}
          assert len(custody['refs_to_delete']) == 19 and len(custody['pull_requests']) == 17
          assert custody['boundary'] == {
              'selection_required_before_write': True, 'exact_heads_frozen': True,
              'repository_write': False, 'force_update': False, 'merge': False,
              'main_mutation': False, 'lease_issued': False,
              'cycle_012_product_authority': False,
          }
          shutil.copytree(target, root / 'payload/selection', dirs_exist_ok=True)
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Freeze exact live cleanup denominator and seal evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/cycle12-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" > "$OUT/api/evidence-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$WRITER_BRANCH" > "$OUT/api/writer-ref-live.json"

          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          selection_root = root / 'source/extracted'
          sha = lambda data: hashlib.sha256(data).hexdigest()
          selection = json.loads((selection_root / 'selection.json').read_text())
          custody = json.loads((selection_root / 'transport-custody.json').read_text())
          raw_cycle12 = json.loads((api / 'cycle12-refs.json').read_text())
          cycle12 = {row['ref'].removeprefix('refs/heads/'): row['object']['sha'] for row in raw_cycle12}
          custody_cycle12 = {row['branch']: row['head'] for row in custody['refs_to_delete'] if row['kind'] == 'preselection-cycle-012'}
          for frozen in custody['refs_to_delete']:
              if frozen['kind'] == 'preselection-cycle-012':
                  continue
              live = json.loads(subprocess.check_output([
                  'gh', 'api', f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/{frozen['branch']}"
              ], text=True))
              assert live['object']['sha'] == frozen['head'], frozen
          expected_cycle12 = dict(custody_cycle12)
          expected_cycle12[os.environ['SOURCE_BRANCH']] = os.environ['SOURCE_HEAD']
          expected_cycle12[os.environ['WRITER_BRANCH']] = os.environ['INSTALLED_MAIN']
          assert cycle12 == expected_cycle12, {'live': cycle12, 'expected': expected_cycle12}

          refs = [dict(row) for row in custody['refs_to_delete']]
          refs.append({'branch': os.environ['SOURCE_BRANCH'], 'head': os.environ['SOURCE_HEAD'], 'kind': 'qualified-selector-carrier'})
          writer_ref = json.loads((api / 'writer-ref-live.json').read_text())
          evidence_ref = json.loads((api / 'evidence-ref.json').read_text())
          assert writer_ref['object']['sha'] == os.environ['INSTALLED_MAIN']
          assert evidence_ref['object']['sha'] == os.environ['CURRENT_HEAD']
          refs.append({'branch': os.environ['WRITER_BRANCH'], 'head': os.environ['INSTALLED_MAIN'], 'kind': 'cleanup-writer-installer'})
          refs.append({'branch': os.environ['BRANCH'], 'head': os.environ['CURRENT_HEAD'], 'kind': 'selection-evidence-carrier'})
          assert len(refs) == 22
          assert len({(row['branch'], row['head']) for row in refs}) == 22

          repo = os.environ['GITHUB_REPOSITORY']
          def get_pr(number):
              return json.loads(subprocess.check_output(['gh', 'api', f'/repos/{repo}/pulls/{number}'], text=True))
          prs = []
          for frozen in custody['pull_requests']:
              row = get_pr(frozen['pr'])
              assert row['head']['ref'] == frozen['branch'] and row['head']['sha'] == frozen['head']
              assert row['base']['ref'] == 'main'
              assert row['state'] in {'open', 'closed'}
              action = 'close_without_merge' if row['state'] == 'open' and row['merged'] is False else 'none'
              prs.append({'pr': row['number'], 'branch': frozen['branch'], 'head': frozen['head'], 'action': action, 'merged': row['merged']})
          for number, branch, head in [
              (int(os.environ['SOURCE_PR']), os.environ['SOURCE_BRANCH'], os.environ['SOURCE_HEAD']),
              (int(os.environ['WRITER_PR']), os.environ['WRITER_BRANCH'], os.environ['INSTALLED_MAIN']),
              (int(os.environ['CURRENT_PR']), os.environ['BRANCH'], os.environ['CURRENT_HEAD']),
          ]:
              row = get_pr(number)
              assert row['head']['ref'] == branch and row['head']['sha'] == head
              assert row['base']['ref'] == 'main'
              action = 'close_without_merge' if row['state'] == 'open' and row['merged'] is False else 'none'
              prs.append({'pr': row['number'], 'branch': branch, 'head': head, 'action': action, 'merged': row['merged']})
          assert len(prs) == 20
          assert len({row['pr'] for row in prs}) == 20

          evidence = {
              'status': 'cycle-012-selection-evidence-retained-v1',
              'version': 1,
              'source': {
                  'pr': int(os.environ['CURRENT_PR']), 'branch': os.environ['BRANCH'],
                  'head': os.environ['CURRENT_HEAD'], 'run': int(os.environ['GITHUB_RUN_ID']),
                  'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': int(os.environ['CURRENT_JOB']),
              },
              'canonical': {
                  'base_main': os.environ['BASE_MAIN'], 'installed_main': os.environ['INSTALLED_MAIN'],
                  'base_tree': os.environ['BASE_TREE'], 'writer_path': os.environ['WRITER_PATH'],
              },
              'selection_source': {
                  'pr': int(os.environ['SOURCE_PR']), 'branch': os.environ['SOURCE_BRANCH'],
                  'head': os.environ['SOURCE_HEAD'], 'run': int(os.environ['SOURCE_RUN']),
                  'attempt': int(os.environ['SOURCE_ATTEMPT']), 'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
              },
              'selection': {
                  'status': selection['status'], 'identity': selection['identity'],
                  'selected_task_id': selection['selected_task_id'], 'normalized': selection['normalized'],
                  'queue': selection['queue'], 'transport_custody_identity': custody['identity'],
              },
              'refs_to_delete': sorted(refs, key=lambda row: row['branch']),
              'pull_requests': sorted(prs, key=lambda row: row['pr']),
              'counts': {
                  'cycle12_refs': 18, 'live_cycle12_prefix_refs': 19,
                  'observer_refs': 2, 'auxiliary_refs': 2,
                  'refs_to_delete': len(refs), 'pull_requests': len(prs),
              },
              'boundary': {
                  'selection_retained': True, 'exact_heads_frozen': True,
                  'repository_write': False, 'canonical_mutation': False,
                  'transport_mutation': False, 'force_update': False, 'merge': False,
                  'lease_issued': False, 'queue_mutated': False, 'wall_created': False,
                  'media_adopted': False, 'cycle_receipt_written': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False, 'owner_physical_action_required': False,
              },
          }
          evidence['identity'] = sha(json.dumps(evidence, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          (root / 'payload/evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'payload/EVIDENCE_COMPLETE').write_text(evidence['identity'] + '\n')
          PY

          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-evidence-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-evidence-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-evidence-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-evidence-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
