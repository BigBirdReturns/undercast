name: star-trek-post-kzinti-doohan-probe-v1

on:
  push:
    branches:
      - agent/star-trek-post-kzinti-doohan-probe-v1

permissions:
  contents: read

concurrency:
  group: star-trek-post-kzinti-doohan-probe-v1
  cancel-in-progress: true

jobs:
  park:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Park until Kzinti Flyer terminal custody exists
        run: echo 'Post-Kzinti Doohan probe parked; original carrier is preserved in branch history.'
