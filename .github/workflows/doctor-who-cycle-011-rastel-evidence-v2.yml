name: doctor-who-cycle-011-rastel-evidence-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-evidence-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-evidence-v2
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-evidence-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-evidence-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-evidence-v2
      PREFLIGHT_PR: "744"
      PREFLIGHT_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PREFLIGHT_RUN: "31298921410"
      PREFLIGHT_JOB: "93208436364"
      PREFLIGHT_ARTIFACT: "9033898468"
      PREFLIGHT_ZIP_SHA256: 204eac7333f1d057ee9e6d1950f97ec049a4931020e634857ffd0c28f8d8d9f5
      PREFLIGHT_IDENTITY: ac55077e5dfd2ad81fc0fa0e1f74f3619100619e6a3488cfbb4ee84859927303
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      SOURCE_URL: https://tardis.fandom.com/wiki/Rastel
      SOURCE_API: https://tardis.fandom.com/api.php
      SOURCE_PAGEID: "171335"
      SOURCE_REVISION: "3722691"
      SOURCE_TIMESTAMP: "2024-04-05T14:53:16Z"
      SOURCE_CONTENT_SHA256: 740bc0ffb8732261d1df15661aa4e193c7a7f8d94aa96f96ac92c02e41ce8776
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      OFFICIAL_URL: https://www.bigfinish.com/releases/v/doctor-who-dark-eyes-4-980
      OFFICIAL_PRODUCT: "Doctor Who: Dark Eyes 4"
      OFFICIAL_STORY: Master of the Daleks
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact selected preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,preflight,source/images,official,portraits,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PREFLIGHT_PR" > "$OUT/api/preflight-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" > "$OUT/api/preflight-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/jobs?per_page=100" > "$OUT/api/preflight-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT" > "$OUT/api/preflight-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/preflight.zip"
          test "$(sha256sum "$OUT/preflight.zip" | awk '{print $1}')" = "$PREFLIGHT_ZIP_SHA256"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); api=root/'api'; target=root/'preflight'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          stable=lambda value:[stable(row) for row in value] if isinstance(value,list) else ({key:stable(value[key]) for key in sorted(value)} if isinstance(value,dict) else value)
          own=json.loads((api/'carrier.json').read_text())
          preflight_pr=json.loads((api/'preflight-pr.json').read_text())
          run=json.loads((api/'preflight-run.json').read_text())
          jobs=json.loads((api/'preflight-jobs.json').read_text())['jobs']
          artifact=json.loads((api/'preflight-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert preflight_pr['number']==int(os.environ['PREFLIGHT_PR']) and preflight_pr['head']['sha']==os.environ['PREFLIGHT_HEAD']
          assert preflight_pr['base']['sha']==os.environ['MAIN'] and preflight_pr['commits']==1 and preflight_pr['changed_files']==1
          assert run['id']==int(os.environ['PREFLIGHT_RUN']) and run['name']=='doctor-who-cycle-011-preflight-v1'
          assert run['head_sha']==os.environ['PREFLIGHT_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['PREFLIGHT_JOB']))
          assert job['name']=='preflight' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['PREFLIGHT_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['PREFLIGHT_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['PREFLIGHT_RUN']) and artifact['workflow_run']['head_sha']==os.environ['PREFLIGHT_HEAD']
          with zipfile.ZipFile(root/'preflight.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          packet=json.loads((target/'receipt/preflight.json').read_text()); identity=packet.pop('identity')
          assert identity==os.environ['PREFLIGHT_IDENTITY']
          assert sha(json.dumps(stable(packet),separators=(',',':'),ensure_ascii=False).encode())==identity
          packet['identity']=identity
          assert packet['status']=='cycle-011-read-only-preflight-complete'
          assert packet['canonical_main']==os.environ['MAIN'] and packet['canonical_tree']==os.environ['TREE']
          selected=packet['selected']; task=packet['task']
          assert selected['task_id']==task['id']==os.environ['TASK_ID']
          assert selected['performer']==task['performer']==os.environ['PERFORMER']
          assert selected['character']==task['character']==os.environ['ROLE']
          assert selected['performance_modes']==task['performance_modes']==[os.environ['MODE']]
          assert selected['sources']==task['sources']==[os.environ['SOURCE_URL']]
          assert selected['source_fingerprint']==task['source_fingerprint']==os.environ['SOURCE_FINGERPRINT']
          assert task['status']=='queued' and task['attempts']==0
          assert task['source_receipts']==[{'source':os.environ['SOURCE_URL'],'pageid':int(os.environ['SOURCE_PAGEID']),'revision':int(os.environ['SOURCE_REVISION']),'timestamp':os.environ['SOURCE_TIMESTAMP'],'content_sha256':os.environ['SOURCE_CONTENT_SHA256']}]
          assert packet['queue']=={'total':316,'queued':306,'resolved':10,'in_flight':0,'compatible':306,'incompatible':0}
          assert packet['lease_issued'] is False and packet['queue_mutated'] is False and packet['repository_write'] is False
          (root/'receipt/preflight.bound.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rerun exact current-main gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
          npm run gate 2>&1 | tee "$OUT/logs/gate.log"
          grep -F 'gate: PASS' "$OUT/logs/gate.log" >/dev/null
          jq -e '.total==316 and .statuses.queued==306 and .statuses.resolved==10 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Recover exact revision, official route, cover, and portrait inventory
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 180 \
            --user-agent 'UNDERCAST cycle-011 evidence/2.0 (+https://github.com/BigBirdReturns/undercast)' \
            --dump-header "$OUT/official/response.headers" \
            "$OFFICIAL_URL" > "$OUT/official/dark-eyes-4.html"
          python3 - <<'PY'
          import hashlib,html,json,os,re,time,urllib.parse,urllib.request
          from pathlib import Path
          root=Path(os.environ['OUT']); source=root/'source'; official=root/'official'; portraits=root/'portraits'
          images_dir=source/'images'; images_dir.mkdir(parents=True,exist_ok=True)
          ua='UNDERCAST cycle-011 evidence/2.0 (+https://github.com/BigBirdReturns/undercast)'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          def get_json(params):
              url=os.environ['SOURCE_API']+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
              last=None
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=60) as response: data=response.read()
                      return json.loads(data),url,data
                  except Exception as exc:
                      last=exc; time.sleep(2*(attempt+1))
              raise last
          revision_doc,revision_url,revision_bytes=get_json({'action':'query','format':'json','formatversion':'2','prop':'revisions','revids':os.environ['SOURCE_REVISION'],'rvprop':'ids|timestamp|content','rvslots':'main'})
          (source/'revision-response.json').write_bytes(revision_bytes)
          page=revision_doc['query']['pages'][0]; revision=page['revisions'][0]
          assert page['pageid']==int(os.environ['SOURCE_PAGEID'])
          assert revision['revid']==int(os.environ['SOURCE_REVISION']) and revision['timestamp']==os.environ['SOURCE_TIMESTAMP']
          slot=revision.get('slots',{}).get('main',{})
          content=slot.get('content',slot.get('*',revision.get('*','')))
          assert isinstance(content,str) and content
          content_bytes=content.encode(); assert sha(content_bytes)==os.environ['SOURCE_CONTENT_SHA256']
          (source/'revision.wikitext').write_bytes(content_bytes)
          image_match=re.search(r'(?im)^\|[ \t]*image[ \t]*=[ \t]*(.*?)[ \t]*$',content)
          image_field=image_match.group(1).strip() if image_match else ''
          parse_doc,parse_url,parse_bytes=get_json({'action':'parse','format':'json','formatversion':'2','oldid':os.environ['SOURCE_REVISION'],'prop':'images|wikitext|properties'})
          (source/'parse-response.json').write_bytes(parse_bytes)
          image_titles=parse_doc['parse'].get('images',[])
          rows=[]
          normalized_field=re.sub(r'^(?:File:)?','',image_field,flags=re.I).replace('_',' ').strip().casefold()
          for title in image_titles:
              full=title if title.casefold().startswith('file:') else 'File:'+title
              info_doc,info_url,info_bytes=get_json({'action':'query','format':'json','formatversion':'2','prop':'imageinfo','titles':full,'iiprop':'url|mime|size|extmetadata'})
              info=(info_doc['query']['pages'][0].get('imageinfo') or [{}])[0]
              metadata=info.get('extmetadata') or {}
              normalized_title=full.removeprefix('File:').replace('_',' ').strip().casefold()
              stub='charstub' in normalized_title
              exact_field=bool(normalized_field and normalized_title==normalized_field)
              row={'title':full,'api_url':info_url,'mime':info.get('mime'),'width':info.get('width'),'height':info.get('height'),'url':info.get('url'),'description_url':info.get('descriptionurl'),'license':(metadata.get('LicenseShortName') or {}).get('value'),'usage_terms':(metadata.get('UsageTerms') or {}).get('value'),'artist':(metadata.get('Artist') or {}).get('value'),'exact_image_field_match':exact_field,'classification':'refused-template-stub' if stub else 'unadopted-source-image-candidate'}
              if info.get('url') and exact_field and not stub:
                  safe=re.sub(r'[^A-Za-z0-9._-]+','_',full.removeprefix('File:'))
                  req=urllib.request.Request(info['url'],headers={'User-Agent':ua})
                  with urllib.request.urlopen(req,timeout=90) as response: data=response.read()
                  target=images_dir/safe; target.write_bytes(data)
                  row.update({'artifact_path':'source/images/'+safe,'bytes':len(data),'sha256':sha(data)})
              rows.append(row)
          source_receipt={'source':os.environ['SOURCE_URL'],'api':os.environ['SOURCE_API'],'revision_query':revision_url,'parse_query':parse_url,'pageid':int(os.environ['SOURCE_PAGEID']),'revision':int(os.environ['SOURCE_REVISION']),'timestamp':os.environ['SOURCE_TIMESTAMP'],'content_bytes':len(content_bytes),'content_sha256':sha(content_bytes),'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],'image_field':image_field,'image_titles':image_titles,'images':rows,'template_stub_refused':any(row['classification']=='refused-template-stub' for row in rows),'character_image_status':'review-required' if any(row.get('exact_image_field_match') and row['classification']!='refused-template-stub' for row in rows) else 'absent','adopted':False}
          (source/'source-census.json').write_text(json.dumps(source_receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')

          official_raw=(official/'dark-eyes-4.html').read_bytes(); official_text=official_raw.decode('utf-8','replace')
          plain=html.unescape(re.sub(r'<[^>]+>',' ',official_text)); plain=re.sub(r'\s+',' ',plain)
          assert os.environ['OFFICIAL_PRODUCT'].casefold() in plain.casefold()
          assert os.environ['OFFICIAL_STORY'].casefold() in plain.casefold()
          assert os.environ['PERFORMER'].casefold() in plain.casefold() and 'sontaran' in plain.casefold()
          patterns=[
              r"<meta[^>]+(?:property|name)=[\"'](?:og:image|twitter:image)[\"'][^>]+content=[\"']([^\"']+)",
              r"<meta[^>]+content=[\"']([^\"']+)[\"'][^>]+(?:property|name)=[\"'](?:og:image|twitter:image)[\"']",
          ]
          candidates=[]
          for pattern in patterns: candidates.extend(re.findall(pattern,official_text,re.I))
          candidates=[html.unescape(url) for url in candidates if url.startswith(('http://','https://'))]
          assert candidates
          cover_url=candidates[0]
          req=urllib.request.Request(cover_url,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=90) as response:
              cover_bytes=response.read(); cover_mime=response.headers.get_content_type()
          suffix={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}.get(cover_mime,'bin')
          cover=official/f'cover.{suffix}'; cover.write_bytes(cover_bytes)
          official_receipt={'route':os.environ['OFFICIAL_URL'],'product':os.environ['OFFICIAL_PRODUCT'],'story':os.environ['OFFICIAL_STORY'],'performer':os.environ['PERFORMER'],'credit_observed':'Sontarans and other roles','exact_role_identity_from_official_route':False,'page_bytes':len(official_raw),'page_sha256':sha(official_raw),'cover_url':cover_url,'cover_artifact':'official/'+cover.name,'cover_mime':cover_mime,'cover_bytes':len(cover_bytes),'cover_sha256':sha(cover_bytes),'classification':'official-publication-cover-unadopted-review-candidate','character_still_adopted':False,'performer_portrait_adopted':False}
          (official/'official-evidence.json').write_text(json.dumps(official_receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')

          specimens=json.loads(Path('data/specimens.json').read_text())
          portrait_rows=[]
          for card in specimens:
              portrait=card.get('portrait')
              if card.get('actor')!=os.environ['PERFORMER'] or not portrait: continue
              row={'wall_id':card['id'],'character':card.get('character'),'production':card.get('production'),'portrait':portrait}
              src=portrait.get('src')
              if src and not src.startswith(('http://','https://')):
                  path=Path(src); assert path.is_file(); data=path.read_bytes()
                  row.update({'bytes':len(data),'sha256':sha(data)})
              portrait_rows.append(row)
          assert portrait_rows
          digests=[row['sha256'] for row in portrait_rows if row.get('sha256')]
          inventory={'performer':os.environ['PERFORMER'],'records':portrait_rows,'record_count':len(portrait_rows),'local_digest_count':len(digests),'unique_local_digest_count':len(set(digests)),'byte_duplicate_groups':{digest:[row['wall_id'] for row in portrait_rows if row.get('sha256')==digest] for digest in sorted(set(digests)) if sum(row.get('sha256')==digest for row in portrait_rows)>1},'reuse_decision':'not-made','derivative_created':False,'portrait_adopted':False}
          (portraits/'inventory.json').write_text(json.dumps(inventory,indent=2,sort_keys=True,ensure_ascii=False)+'\n')

          preflight=json.loads((root/'receipt/preflight.bound.json').read_text())
          receipt={'status':'cycle-011-rastel-evidence-complete-v2','version':2,'evidence_run':int(os.environ['GITHUB_RUN_ID']),'evidence_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'canonical_main':os.environ['MAIN'],'canonical_tree':os.environ['TREE'],'preflight':{'pr':int(os.environ['PREFLIGHT_PR']),'head':os.environ['PREFLIGHT_HEAD'],'run':int(os.environ['PREFLIGHT_RUN']),'job':int(os.environ['PREFLIGHT_JOB']),'artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'artifact_sha256':os.environ['PREFLIGHT_ZIP_SHA256'],'identity':preflight['identity']},'task':{'id':os.environ['TASK_ID'],'performer':os.environ['PERFORMER'],'role':os.environ['ROLE'],'mode':os.environ['MODE'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT']},'source':source_receipt,'official':official_receipt,'portrait_inventory':{'artifact':'portraits/inventory.json','sha256':sha((portraits/'inventory.json').read_bytes()),'record_count':inventory['record_count'],'unique_local_digest_count':inventory['unique_local_digest_count']},'gates':{'cycle_009_composability':True,'cycle_010':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True},'boundary':{'lease_issued':False,'queue_mutated':False,'canonical_record_created':False,'character_still_adopted':False,'performer_portrait_adopted':False,'cycle_receipt_written':False,'repository_write':False,'cycle_011_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/evidence.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-evidence-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-evidence-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-evidence-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-evidence-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
