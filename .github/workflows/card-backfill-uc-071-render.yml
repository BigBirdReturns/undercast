name: card-backfill-uc-071-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-071-RENDER.json"
      - "scripts/card-backfill-uc-071-render.mjs"
      - ".github/workflows/card-backfill-uc-071-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-071-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-014'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact reviewed three-role authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-071-RENDER.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-071'||row.actor!=='Warwick Davis'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-071 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8640459921||row.discovery_artifact?.head_sha!=='5dae1c8829fe59e2d99c3c9f833c62b210c28db7')throw new Error('UC-071 discovery custody drift');
          if(row.failed_discovery_checkpoint?.artifact_id!==8640403158)throw new Error('UC-071 failed discovery checkpoint drift');
          if(row.composition?.order?.join(',')!=='wicket,flitwick,griphook'||row.composition?.candidate_width!==1260)throw new Error('UC-071 role denominator or composition drift');
          for(const key of['wicket','flitwick','griphook'])if(!/^[0-9a-f]{64}$/.test(row.selections?.[key]?.sha256||''))throw new Error(`UC-071 missing ${key} source hash`);
          console.log('PASS — exact Wicket / Flitwick / Griphook triptych authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-071-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8640459921/zip" > "$root/discovery.zip"
          echo "5b4b1fcb2675df689c88cf6a9cb1ac4de79a4d8bf6f9d6b91e4b654c3df1aa38  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          source="$root/source/card-backfill-uc-071"
          echo "08868a97a2459b5aed1b9df3fe2972cdff93028264994fa0b217547f54fe2c76  $source/manifest.json" | sha256sum -c -
          echo "f3e9b373a8ec205d65d9ff98ee61f9299c01f9a4894d72eb426e7d3e1dd5e65a  $source/candidates/wicket/06-wicket.jpg" | sha256sum -c -
          echo "e274037a946a37f35ed8fa26934f37cc81a30bd82b76567dc58af75f7b97f4d6  $source/candidates/flitwick/06-flitwick.jpg" | sha256sum -c -
          echo "81c5308fb9e27e158fd857ab500cb0df6c4bff64df661ff52084cfc76434d12f  $source/candidates/griphook/08-griphook.jpg" | sha256sum -c -
          echo "8ba3347bb89dfab999435e034442b06ef0f9b69cf2ba3ca15e30e373b03668f6  $source/pages/wicket-image.png" | sha256sum -c -
          echo "9b6ec2776d6501333163fb1ed22928bef7ced40a80f69e2be56a1f1b708fdc38  $source/pages/wicket-identity.png" | sha256sum -c -
          echo "8a305b547a6cb846c32f410fcd2c26d099e239753d3471969c76d13ce55185fb  $source/pages/flitwick-image.png" | sha256sum -c -
          echo "eefa0c6ae12f8486215c0d2adefe74a41b62f2a0dce07f3d83eb5d3e722281da  $source/pages/flitwick-identity.png" | sha256sum -c -
          echo "888551e2b8cd9a1f56612b887b4e4180f184b2c1ab2e9b42aef25a1d20c4c98e  $source/pages/griphook-image.png" | sha256sum -c -
      - name: Render exact role triptych and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-071-render/source/card-backfill-uc-071
          OUT: ${{ runner.temp }}/card-backfill-uc-071-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-071-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-071-render/run.log"
          test -z "$(git status --porcelain)"
      - name: Upload exact sources, panels, triptych, pages, and reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-071-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-071-render/output
            ${{ runner.temp }}/card-backfill-uc-071-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
