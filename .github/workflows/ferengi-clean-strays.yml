name: ferengi-clean-strays

on:
  push:
    branches: [agent/star-trek-ferengi-gold]
    paths: [.github/workflows/ferengi-clean-strays.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ferengi-clean-strays
  cancel-in-progress: true

jobs:
  clean:
    if: github.ref_name == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - name: Remove diagnostics without touching collection state
        run: |
          set -euo pipefail
          git config user.name 'undercast-cleanup'
          git config user.email 'undercast-cleanup@users.noreply.github.com'
          rm -f \
            tmp-test.txt \
            tmp-upload-test.txt \
            .github/FERENGI-GOLD-DISPATCH-NUDGE.txt \
            .github/workflows/ferengi-status-beacon.yml \
            .github/workflows/ferengi-clean-strays.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ferengi gold: remove diagnostic residue'
          for attempt in 1 2 3 4; do
            git push origin HEAD:agent/star-trek-ferengi-gold && exit 0
            git fetch origin agent/star-trek-ferengi-gold
            git rebase origin/agent/star-trek-ferengi-gold
            sleep $((attempt*3))
          done
          exit 1
