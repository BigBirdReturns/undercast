name: doctor-who-cycle-003-current-extract-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/doctor-who-cycle-003-current-extract-v2.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-003-current-extract-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-003-current-extract-v2.yml

jobs:
  extract:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 128

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind live main and prove a one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=128 origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse refs/remotes/origin/${{ github.event.pull_request.head.ref }})" = "${{ github.event.pull_request.head.sha }}"
          exact_main="$(git rev-parse refs/remotes/origin/main)"
          test -n "$exact_main"
          git rebase refs/remotes/origin/main
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$exact_main"
          printf '%s\n' "$SELF" > /tmp/expected-paths.txt
          git diff --name-only "$exact_main"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          printf '%s\n' "$exact_main" > /tmp/exact-main.txt
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/rebased-carrier-head.txt

      - name: Install exact dependencies
        shell: bash
        run: npm ci

      - name: Prove zero-in-flight active-estate custody
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            data/AUTOPILOT.json \
            data/AUTOPILOT-CERTIFICATIONS.json \
            data/ESTATE-REGISTRY.json \
            data/MEDIA-AUDIT.json \
            data/WATERLINE-STATE.json \
            data/journal/autopilot.jsonl \
            data/journal/waterline.jsonl \
            > /tmp/state-before.sha256

          node scripts/autopilot.mjs validate 2>&1 | tee /tmp/autopilot-validate.log
          node scripts/media-audit.mjs gate --scope doctor-who 2>&1 | tee /tmp/doctor-who-media-gate.log
          node scripts/waterline.mjs validate --scope doctor-who 2>&1 | tee /tmp/doctor-who-waterline.log
          node scripts/waterline.mjs validate --scope star-trek 2>&1 | tee /tmp/star-trek-waterline.log
          npm run doctor-who:pilot-cycle:check 2>&1 | tee /tmp/doctor-who-pilot.log
          npm run doctor-who:correction-drill:check 2>&1 | tee /tmp/doctor-who-correction.log
          npm run doctor-who:cycle-002:check 2>&1 | tee /tmp/doctor-who-cycle-002.log
          npm run star-trek:enwright-cycle:check 2>&1 | tee /tmp/star-trek-enwright.log

          grep -Fq 'phase=ready-for-cycle' /tmp/doctor-who-waterline.log
          grep -Fq 'claim=allowed' /tmp/doctor-who-waterline.log
          grep -Fq 'phase=ready-for-cycle' /tmp/star-trek-waterline.log
          grep -Fq 'claim=allowed' /tmp/star-trek-waterline.log

          sha256sum \
            data/AUTOPILOT.json \
            data/AUTOPILOT-CERTIFICATIONS.json \
            data/ESTATE-REGISTRY.json \
            data/MEDIA-AUDIT.json \
            data/WATERLINE-STATE.json \
            data/journal/autopilot.jsonl \
            data/journal/waterline.jsonl \
            > /tmp/state-after.sha256
          diff -u /tmp/state-before.sha256 /tmp/state-after.sha256
          test -z "$(git status --porcelain)"

      - name: Extract one deterministic compatible task without claiming it
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs candidates \
            --scope doctor-who \
            --agent luna \
            --capability-profile text-vision \
            --limit 1 \
            --json \
            > /tmp/doctor-who-cycle-003-candidates.json
          cat /tmp/doctor-who-cycle-003-candidates.json | tee /tmp/doctor-who-cycle-003-candidates.log

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const readJson = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const report = readJson('/tmp/doctor-who-cycle-003-candidates.json');
          if (!Array.isArray(report.compatible)) throw new Error('candidates report has no compatible array');
          if (!report.counts || report.counts.compatible < 1) throw new Error('candidates report declares no compatible tasks');
          if (report.compatible.length !== 1) throw new Error(`expected one limited compatible candidate, found ${report.compatible.length}`);

          const selected = report.compatible[0];
          const taskId = selected.task_id;
          if (!taskId) throw new Error('selected compatible candidate has no task_id');

          const state = readJson('data/AUTOPILOT.json');
          const jobs = Array.isArray(state) ? state : (state.jobs || state.tasks || []);
          const task = jobs.find((row) => row.id === taskId);
          if (!task) throw new Error(`selected task ${taskId} is absent from data/AUTOPILOT.json`);
          if (task.scope !== 'doctor-who') throw new Error(`selected task scope drifted: ${task.scope}`);
          if (task.status !== 'queued') throw new Error(`selected task is not queued: ${task.status}`);
          if (selected.source_fingerprint !== task.source_fingerprint) throw new Error('selected task source fingerprint drifted');

          const detail = {
            report: {
              version: report.version,
              scope_id: report.scope_id,
              profile: report.profile,
              policy_sha256: report.policy_sha256,
              counts: report.counts,
            },
            selected,
            task,
            exact: {
              task_id: task.id,
              performer: task.performer,
              character: task.character,
              franchise: task.franchise,
              category: task.category,
              performance_modes: task.performance_modes,
              priority: task.priority,
              sources: task.sources,
              source_receipts: task.source_receipts || null,
              source_fingerprint: task.source_fingerprint,
              required_capabilities: task.required_capabilities,
            },
            boundary: {
              lease_issued: false,
              queue_mutated: false,
              global_in_flight: 0,
              selection_count: 1,
              capability_profile: 'text-vision',
            },
          };
          fs.writeFileSync('/tmp/doctor-who-cycle-003-selected-task.json', `${JSON.stringify(detail, null, 2)}\n`);
          fs.writeFileSync('/tmp/doctor-who-cycle-003-task-id.txt', `${task.id}\n`);
          NODE

          cat /tmp/doctor-who-cycle-003-selected-task.json | tee /tmp/doctor-who-cycle-003-selection.log
          sha256sum \
            /tmp/doctor-who-cycle-003-candidates.json \
            /tmp/doctor-who-cycle-003-selected-task.json \
            > /tmp/doctor-who-cycle-003-selection.sha256
          diff -u /tmp/state-before.sha256 /tmp/state-after.sha256
          test -z "$(git status --porcelain)"
          echo 'lease_issued=false' >> "$GITHUB_STEP_SUMMARY"
          echo "next_task=$(cat /tmp/doctor-who-cycle-003-task-id.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact next-task evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-source-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/exact-main.txt
            /tmp/rebased-carrier-head.txt
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/state-before.sha256
            /tmp/state-after.sha256
            /tmp/autopilot-validate.log
            /tmp/doctor-who-media-gate.log
            /tmp/doctor-who-waterline.log
            /tmp/star-trek-waterline.log
            /tmp/doctor-who-pilot.log
            /tmp/doctor-who-correction.log
            /tmp/doctor-who-cycle-002.log
            /tmp/star-trek-enwright.log
            /tmp/doctor-who-cycle-003-candidates.json
            /tmp/doctor-who-cycle-003-candidates.log
            /tmp/doctor-who-cycle-003-selected-task.json
            /tmp/doctor-who-cycle-003-task-id.txt
            /tmp/doctor-who-cycle-003-selection.log
            /tmp/doctor-who-cycle-003-selection.sha256
