name: ferengi-gold-gather

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-GATHER.json"
      - ".github/workflows/ferengi-gold-gather.yml"
      - "data/STAR-TREK-GOLD.json"
      - "scripts/star-trek-species-gold.mjs"
      - "scripts/curate.mjs"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-gather-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the single-species gold queue and exact target partition
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-gather"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate
          node scripts/star-trek-species-gold.mjs targets --species ferengi --out "$root/targets.json" > "$root/targets.stdout.json"
          ROOT="$root" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-GATHER.json','utf8'));
          const targets=JSON.parse(fs.readFileSync(`${process.env.ROOT}/targets.json`,'utf8')).targets.map(row=>row.id).sort();
          const batches=control.batches.flat().slice().sort();
          if(new Set(batches).size!==batches.length)throw new Error('control batches contain duplicate card ids');
          if(JSON.stringify(targets)!==JSON.stringify(batches))throw new Error(`control batches do not equal exact active target set: targets=${targets.length} batches=${batches.length}`);
          console.log(`PASS — ${targets.length} exact Ferengi media targets partitioned into ${control.batches.length} batches`);
          NODE

  gather:
    needs: validate
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Gather one exact candidate batch
        env:
          CONTACT: bigbirdreturns@proton.me
          BATCH_INDEX: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-gather/batch-${BATCH_INDEX}"
          mkdir -p "$root"
          ids=$(BATCH_INDEX="$BATCH_INDEX" node -e "const c=require('./.github/FERENGI-GOLD-GATHER.json'); console.log(c.batches[Number(process.env.BATCH_INDEX)].join(' '))")
          echo "$ids" > "$root/ids.txt"
          CURATE_DIR="$root/candidates" timeout 75m node scripts/curate.mjs gather $ids | tee "$root/gather.log"
      - name: Upload exact candidate manifest, thumbnails and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-gather-${{ github.run_id }}-batch-${{ matrix.batch }}
          path: ${{ runner.temp }}/ferengi-gold-gather/batch-${{ matrix.batch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
