name: ferengi-gold-gather

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-GATHER.json"
      - ".github/workflows/ferengi-gold-gather.yml"
      - "data/STAR-TREK-GOLD.json"
      - "scripts/star-trek-species-gold.mjs"
      - "scripts/curate.mjs"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-gather-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the single-species gold queue
        run: node scripts/star-trek-species-gold.mjs validate
      - name: Build the exact active-species target set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-gather"
          mkdir -p "$root"
          species=$(node -e "console.log(require('./.github/FERENGI-GOLD-GATHER.json').species)")
          batch_size=$(node -e "console.log(require('./.github/FERENGI-GOLD-GATHER.json').batch_size)")
          node scripts/star-trek-species-gold.mjs targets --species "$species" --out "$root/targets.json" > "$root/targets.stdout.json"
          ROOT="$root" BATCH_SIZE="$batch_size" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const root=process.env.ROOT;
          const size=Number(process.env.BATCH_SIZE);
          const report=JSON.parse(fs.readFileSync(`${root}/targets.json`,'utf8'));
          const ids=report.targets.map(row=>row.id);
          if(!ids.length)throw new Error('Ferengi is already media-complete; gather pass has no targets');
          const batches=[];
          for(let i=0;i<ids.length;i+=size){
            const n=String(batches.length).padStart(2,'0');
            const batch=ids.slice(i,i+size);
            fs.writeFileSync(`${root}/batch-${n}.txt`,batch.join(' '));
            batches.push({batch:Number(n),ids:batch});
          }
          fs.writeFileSync(`${root}/batches.json`,JSON.stringify({version:1,species:report.species,targets:report.targets.length,batches},null,2)+'\n');
          console.log(JSON.stringify({species:report.species,targets:report.targets.length,batches:batches.length},null,2));
          NODE
      - name: Gather candidate stills and portraits in bounded batches
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-gather"
          for batch in "$root"/batch-*.txt; do
            name=$(basename "$batch" .txt)
            ids=$(cat "$batch")
            echo "gathering $name: $ids"
            CURATE_DIR="$root/$name" node scripts/curate.mjs gather $ids | tee "$root/$name.log"
          done
      - name: Upload exact candidate manifests, thumbnails and review sheets
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-gather-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-gather
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
