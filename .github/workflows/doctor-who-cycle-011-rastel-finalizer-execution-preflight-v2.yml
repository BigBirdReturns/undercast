name: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      BINDER_PACKET: /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-binder
      REVIEW_PACKET: /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-review
      BINDER_BRANCH: agent/doctor-who-cycle-011-rastel-exact-cycle-binder-v1
      BINDER_WORKFLOW: doctor-who-cycle-011-rastel-exact-cycle-binder-v1
      BINDER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-exact-cycle-binder-v1-
      REVIEW_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-normalized-review-payload-v1-
      REVIEW_ARTIFACT_PLACEHOLDER: __RASTEL_REVIEW_ARTIFACT_ID__
      REVIEW_SHA_PLACEHOLDER: __RASTEL_REVIEW_ARTIFACT_SHA256__
      EXECUTOR_MAIN_PLACEHOLDER: __RASTEL_EXECUTOR_MAIN__
      EXECUTOR_PR_PLACEHOLDER: __RASTEL_EXECUTOR_PR__
      EXECUTOR_HEAD_PLACEHOLDER: __RASTEL_EXECUTOR_HEAD__
      EXECUTOR_BRANCH_PLACEHOLDER: __RASTEL_EXECUTOR_BRANCH__
      EXECUTOR_SELF_PLACEHOLDER: __RASTEL_EXECUTOR_SELF__
      SOURCE_FINALIZER_PR: "733"
      SOURCE_FINALIZER_HEAD: 881d842c726806f504d127f55c076e3cac1c2a48
      SOURCE_FINALIZER_BRANCH: agent/doctor-who-cycle-010-merx-final-product-v4
      SOURCE_FINALIZER_PATH: .github/workflows/doctor-who-cycle-010-merx-final-product-v4.yml
      MATERIALIZER_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-materializer-v1
      MATERIALIZER_PATH: .github/workflows/doctor-who-cycle-011-rastel-finalizer-materializer-v1.yml
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind carrier and exact successful binder run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$BINDER_PACKET" "$REVIEW_PACKET"
          mkdir -p "$OUT"/{api,source,receipt,logs,authorization} "$BINDER_PACKET" "$REVIEW_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$BINDER_BRANCH" -f per_page=100 > "$OUT/api/binder-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'binder-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['BINDER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['ref']=='main'
          binder_base=source['base']['sha']
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_MAIN'],binder_base],check=True)
          assert subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_MAIN']+'...'+binder_base],text=True).strip()==''
          assert subprocess.check_output(['git','show','-s','--format=%T',binder_base],text=True).strip()==os.environ['SOURCE_TREE']
          (api/'binder-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'binder-head.txt').write_text(source['head']['sha']+'\n')
          (api/'binder-number.txt').write_text(str(source['number'])+'\n')
          PY
          binder_head="$(cat "$OUT/api/binder-head.txt")"
          binder_pr="$(cat "$OUT/api/binder-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$BINDER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/binder-runs.json"
            run_id="$(BINDER_HEAD="$binder_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/binder-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['BINDER_HEAD'] and row['name']==os.environ['BINDER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/binder-run.json"
              if [ "$(jq -r '.status' "$OUT/api/binder-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/binder-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/binder-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/binder-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/binder-artifacts.json"
          binder_job="$(jq -r '.jobs[] | select(.name=="bind" and .conclusion=="success") | .id' "$OUT/api/binder-jobs.json")"
          test -n "$binder_job"
          BINDER_RUN="$run_id" python3 - <<'PY' > "$OUT/api/artifact-env"
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/binder-artifacts.json').read_text())['artifacts']
          run=os.environ['BINDER_RUN']
          expected={'BINDER_ARTIFACT':os.environ['BINDER_ARTIFACT_PREFIX']+run+'-attempt-1','REVIEW_ARTIFACT':os.environ['REVIEW_ARTIFACT_PREFIX']+run+'-attempt-1'}
          for key,name in expected.items():
              matches=[row for row in rows if row['name']==name and not row['expired']]
              assert len(matches)==1,(key,name,[(row['id'],row['name']) for row in rows])
              print(f'{key}={matches[0]["id"]}')
          PY
          source "$OUT/api/artifact-env"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$BINDER_ARTIFACT" > "$OUT/api/binder-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$BINDER_ARTIFACT/zip" > "$OUT/binder.zip"
          BINDER_ZIP_SHA256="$(sha256sum "$OUT/binder.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/binder-artifact.json")" = "sha256:$BINDER_ZIP_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT" > "$OUT/api/review-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT/zip" > "$OUT/review.zip"
          REVIEW_ZIP_SHA256="$(sha256sum "$OUT/review.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/review-artifact.json")" = "sha256:$REVIEW_ZIP_SHA256"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_BASE=%s\nBINDER_PR=%s\nBINDER_HEAD=%s\nBINDER_RUN=%s\nBINDER_JOB=%s\nBINDER_ARTIFACT=%s\nBINDER_ZIP_SHA256=%s\nREVIEW_ARTIFACT=%s\nREVIEW_ZIP_SHA256=%s\n' "$pr" "$head" "$base" "$binder_pr" "$binder_head" "$run_id" "$binder_job" "$BINDER_ARTIFACT" "$BINDER_ZIP_SHA256" "$REVIEW_ARTIFACT" "$REVIEW_ZIP_SHA256" >> "$GITHUB_ENV"

      - name: Authenticate binder and review payload byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); binder=Path(os.environ['BINDER_PACKET']); review=Path(os.environ['REVIEW_PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          def extract(zip_path,target):
              with zipfile.ZipFile(zip_path) as archive:
                  infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir():continue
                      out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          extract(root/'binder.zip',binder); extract(root/'review.zip',review)
          def verify_ledgers(target):
              rows=[]
              for sealed in target.rglob('*SHA256SUMS'):
                  if sealed.name.endswith('.pre'):continue
                  pre=sealed.with_name(sealed.name+'.pre')
                  if not pre.is_file():
                      pre=sealed.with_name(sealed.name.replace('SHA256SUMS','SHA256SUMS.pre'))
                  if not pre.is_file():continue
                  assert sha(pre.read_bytes())==sealed.read_text().split()[0]
                  base=sealed.parent; count=0
                  for raw in pre.read_text().splitlines():
                      if not raw.strip():continue
                      digest,name=raw.split(None,1); path=base/name.lstrip('*')
                      assert path.is_file() and sha(path.read_bytes())==digest; count+=1
                  rows.append({'root':base.relative_to(target).as_posix(),'sealed':sealed.name,'rows':count,'sha256':sha(pre.read_bytes())})
              return rows
          binder_ledgers=verify_ledgers(binder); review_ledgers=verify_ledgers(review)
          assert binder_ledgers and review_ledgers
          def one_status(target,status):
              rows=[]
              for path in target.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows])
              return rows[0]
          _,binder_receipt=one_status(binder,'cycle-011-rastel-exact-cycle-finalizer-template-bound-v1')
          _,bindings=one_status(binder,'cycle-011-rastel-finalizer-exact-bindings-v1')
          _,payload=one_status(binder,'cycle-011-rastel-legacy-topology-review-payload-complete-v1')
          for data in (binder_receipt,bindings,payload):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          assert binder_receipt['review']['pr']==int(os.environ['BINDER_PR']) and binder_receipt['review']['head']==os.environ['BINDER_HEAD']
          assert binder_receipt['review']['run']==int(os.environ['BINDER_RUN']) and binder_receipt['review']['job']==int(os.environ['BINDER_JOB'])
          assert binder_receipt['review']['artifact_placeholder']==os.environ['REVIEW_ARTIFACT_PLACEHOLDER'] and binder_receipt['review']['artifact_sha256_placeholder']==os.environ['REVIEW_SHA_PLACEHOLDER']
          assert bindings['candidate']['task']==os.environ['TASK_ID'] and bindings['candidate']['lease']==os.environ['EXPECTED_LEASE'] and bindings['candidate']['wall']==os.environ['WALL_ID'] and bindings['candidate']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert bindings['queue']=={'before':{'queued':306,'resolved':10,'in_flight':0},'after':{'queued':305,'resolved':11,'in_flight':0}}
          templates=[p for p in binder.rglob('*') if p.is_file() and p.stat().st_size==binder_receipt['target']['bytes'] and sha(p.read_bytes())==binder_receipt['target']['sha256']]
          assert len(templates)==1,[p.as_posix() for p in templates]
          text=templates[0].read_text()
          assert text.count(os.environ['REVIEW_ARTIFACT_PLACEHOLDER'])==binder_receipt['placeholders']['artifact_id_occurrences']>0
          assert text.count(os.environ['REVIEW_SHA_PLACEHOLDER'])==binder_receipt['placeholders']['artifact_sha256_occurrences']>0
          actual_files=sum(1 for p in review.rglob('*') if p.is_file())
          assert actual_files==payload['file_count']+2,(actual_files,payload['file_count'])
          assert payload['approval_identity']==binder_receipt['review']['approval_identity']
          (root/'source/bound-template.sh').write_bytes(templates[0].read_bytes())
          (root/'receipt/binder.json').write_text(json.dumps(binder_receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (root/'receipt/bindings.json').write_text(json.dumps(bindings,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (root/'receipt/review-payload.json').write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-binder-artifacts-authenticated-v2','version':2,'binder':{'pr':int(os.environ['BINDER_PR']),'head':os.environ['BINDER_HEAD'],'run':int(os.environ['BINDER_RUN']),'job':int(os.environ['BINDER_JOB']),'artifact':int(os.environ['BINDER_ARTIFACT']),'artifact_sha256':os.environ['BINDER_ZIP_SHA256'],'identity':binder_receipt['identity']},'review_payload':{'artifact':int(os.environ['REVIEW_ARTIFACT']),'artifact_sha256':os.environ['REVIEW_ZIP_SHA256'],'identity':payload['identity'],'approval_identity':payload['approval_identity'],'file_count':actual_files},'binder_ledgers':binder_ledgers,'review_ledgers':review_ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/binder-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY

      - name: Substitute review artifact and produce portable current-main finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); source=root/'source/bound-template.sh'; text=source.read_text(); sha=lambda data:hashlib.sha256(data).hexdigest()
          binder=json.loads((root/'receipt/binder.json').read_text()); bindings=json.loads((root/'receipt/bindings.json').read_text())
          substitutions=[]
          for old,new,label in ((os.environ['REVIEW_ARTIFACT_PLACEHOLDER'],os.environ['REVIEW_ARTIFACT'],'review-artifact-id'),(os.environ['REVIEW_SHA_PLACEHOLDER'],os.environ['REVIEW_ZIP_SHA256'],'review-artifact-sha256')):
              count=text.count(old); assert count>0,(label,count); text=text.replace(old,new); substitutions.append({'label':label,'old':old,'new':new,'occurrences':count})
          assert os.environ['REVIEW_ARTIFACT_PLACEHOLDER'] not in text and os.environ['REVIEW_SHA_PLACEHOLDER'] not in text
          lines=text.splitlines(keepends=True); geometry_tokens=('PR_BASE_SHA','format=%P','rev-list --count','rev-list --merges','diff --name-status','git/ref/heads/main',"own['base']","carrier['base']",'refs/heads/main')
          geometry_rows=[]
          for index,line in enumerate(lines):
              if any(token in line for token in geometry_tokens):
                  before=line
                  line=line.replace(os.environ['SOURCE_MAIN'],os.environ['EXECUTOR_MAIN_PLACEHOLDER'])
                  line=line.replace('$EXACT_MAIN',os.environ['EXECUTOR_MAIN_PLACEHOLDER']).replace('${EXACT_MAIN}',os.environ['EXECUTOR_MAIN_PLACEHOLDER'])
                  line=line.replace("os.environ['EXACT_MAIN']",repr(os.environ['EXECUTOR_MAIN_PLACEHOLDER']))
                  line=line.replace("os.environ['MAIN']",repr(os.environ['EXECUTOR_MAIN_PLACEHOLDER']))
                  if line!=before:
                      lines[index]=line; geometry_rows.append({'line':index+1,'before':before.rstrip('\n'),'after':line.rstrip('\n')})
          text=''.join(lines)
          carrier_rows=[]
          for old,new,label in ((os.environ['SOURCE_FINALIZER_BRANCH'],os.environ['EXECUTOR_BRANCH_PLACEHOLDER'],'source-finalizer-branch'),(os.environ['SOURCE_FINALIZER_PATH'],os.environ['EXECUTOR_SELF_PLACEHOLDER'],'source-finalizer-path'),(os.environ['MATERIALIZER_BRANCH'],os.environ['EXECUTOR_BRANCH_PLACEHOLDER'],'materializer-branch'),(os.environ['MATERIALIZER_PATH'],os.environ['EXECUTOR_SELF_PLACEHOLDER'],'materializer-path')):
              count=text.count(old)
              if count:text=text.replace(old,new); carrier_rows.append({'label':label,'old':old,'new':new,'occurrences':count})
          split=text.splitlines(keepends=True); scalar_rows=[]
          for index,line in enumerate(split):
              lower=line.lower()
              if os.environ['SOURCE_FINALIZER_HEAD'] in line and any(token in lower for token in ('carrier','pr_head','head=','head_sha','github.event.pull_request.head')):
                  before=line; split[index]=line.replace(os.environ['SOURCE_FINALIZER_HEAD'],os.environ['EXECUTOR_HEAD_PLACEHOLDER']); scalar_rows.append({'label':'source-finalizer-head','line':index+1,'before':before.rstrip(),'after':split[index].rstrip()})
              if re.search(r'(?<!\d)'+re.escape(os.environ['SOURCE_FINALIZER_PR'])+r'(?!\d)',split[index]) and any(token in lower for token in ('carrier_pr','pr_number','pulls/','pr=')):
                  before=split[index]; split[index]=re.sub(r'(?<!\d)'+re.escape(os.environ['SOURCE_FINALIZER_PR'])+r'(?!\d)',os.environ['EXECUTOR_PR_PLACEHOLDER'],split[index])
                  if split[index]!=before:scalar_rows.append({'label':'source-finalizer-pr','line':index+1,'before':before.rstrip(),'after':split[index].rstrip()})
          text=''.join(split)
          proof=[f'git merge-base --is-ancestor "{os.environ["SOURCE_MAIN"]}" "{os.environ["EXECUTOR_MAIN_PLACEHOLDER"]}"',f'test -z "$(git diff --name-only "{os.environ["SOURCE_MAIN"]}...{os.environ["EXECUTOR_MAIN_PLACEHOLDER"]}")"',f'test "$(git show -s --format=%T "{os.environ["EXECUTOR_MAIN_PLACEHOLDER"]}")" = "{os.environ["SOURCE_TREE"]}"']
          lines=text.splitlines(keepends=True); anchors=[i for i,line in enumerate(lines) if os.environ['EXECUTOR_MAIN_PLACEHOLDER'] in line and ('PR_BASE_SHA' in line or 'base' in line.lower()) and 'test ' in line]
          if anchors:
              index=anchors[0]; indent=re.match(r'\s*',lines[index]).group(0); lines.insert(index+1,''.join(indent+row+'\n' for row in proof)); tree_proof={'after_line':index+1,'mode':'geometry-anchor'}
          else:
              index=0
              while index<len(lines) and (lines[index].startswith('#!') or lines[index].strip().startswith('set ')):index+=1
              lines.insert(index,''.join(row+'\n' for row in proof)); tree_proof={'after_line':index,'mode':'preamble'}
          text=''.join(lines)
          placeholders={key:text.count(value) for key,value in {'main':os.environ['EXECUTOR_MAIN_PLACEHOLDER'],'pr':os.environ['EXECUTOR_PR_PLACEHOLDER'],'head':os.environ['EXECUTOR_HEAD_PLACEHOLDER'],'branch':os.environ['EXECUTOR_BRANCH_PLACEHOLDER'],'self':os.environ['EXECUTOR_SELF_PLACEHOLDER']}.items()}
          assert placeholders['main']>0
          target=root/'source/portable-finalizer-v2.sh'; target.write_text(text)
          syntax=subprocess.run(['bash','-n',str(target)],capture_output=True,text=True)
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); compile_errors=[]
          for block_index,block in enumerate(blocks):
              try:compile(block,f'<embedded-portable-finalizer-{block_index}>','exec')
              except Exception as error:compile_errors.append({'index':block_index,'error':repr(error)})
          assert syntax.returncode==0,syntax.stderr
          assert not compile_errors,compile_errors
          assert os.environ['TASK_ID'] in text and os.environ['EXPECTED_LEASE'] in text and os.environ['WALL_ID'] in text
          assert str(os.environ['REVIEW_ARTIFACT']) in text and os.environ['REVIEW_ZIP_SHA256'] in text
          diff=''.join(difflib.unified_diff(source.read_text().splitlines(True),text.splitlines(True),fromfile='bound-template.sh',tofile='portable-finalizer-v2.sh'))
          (root/'source/bound-to-portable.patch').write_text(diff)
          env_refs=sorted(set(re.findall(r'\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?',text))|set(re.findall(r"os\.environ\[['\"]([A-Za-z_][A-Za-z0-9_]*)['\"]\]",text)))
          receipt={'status':'cycle-011-rastel-portable-finalizer-preflight-complete-v2','version':2,'source':{'bytes':source.stat().st_size,'sha256':sha(source.read_bytes()),'binder_identity':binder['identity']},'target':{'bytes':target.stat().st_size,'sha256':sha(target.read_bytes()),'bash_syntax':True,'embedded_python':len(blocks),'compile_errors':[],'environment_references':env_refs},'review_substitutions':substitutions,'current_main_geometry':geometry_rows,'carrier_replacements':carrier_rows,'carrier_scalar_rows':scalar_rows,'tree_neutral_proof':tree_proof,'placeholders':placeholders,'candidate':bindings['candidate'],'producer':bindings['producer'],'review':binder['review'],'queue':bindings['queue'],'boundary':{'portable_template_only':True,'source_parent_product_allowed':True,'current_main_tree_neutral_only':True,'finalizer_executed':False,'candidate_imported':False,'cycle_receipt_written':False,'product_commit_created':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/portable-finalizer.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

      - name: Freeze exact producer and review settlement requirements
        shell: bash
        run: |
          set -euo pipefail
          producer_pr="$(jq -r '.producer.pr' "$OUT/receipt/portable-finalizer.json")"
          producer_head="$(jq -r '.producer.head' "$OUT/receipt/portable-finalizer.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$producer_pr" > "$OUT/api/producer-pr.json"
          PRODUCER_PR="$producer_pr" PRODUCER_HEAD="$producer_head" python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          producer=json.loads((root/'api/producer-pr.json').read_text()); review=json.loads((root/'api/binder-pr.json').read_text()); portable=json.loads((root/'receipt/portable-finalizer.json').read_text())
          assert producer['number']==int(os.environ['PRODUCER_PR']) and producer['state']=='open' and producer['draft'] is True and producer['merged'] is False and producer['head']['sha']==os.environ['PRODUCER_HEAD'] and producer['base']['ref']=='main'
          assert review['number']==int(os.environ['BINDER_PR']) and review['state']=='open' and review['draft'] is True and review['merged'] is False and review['head']['sha']==os.environ['BINDER_HEAD'] and review['base']['ref']=='main'
          refs=[]
          for kind,pr in (('producer',producer),('review',review)):
              base=pr['base']['sha']
              subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_MAIN'],base],check=True)
              assert subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_MAIN']+'...'+base],text=True).strip()==''
              assert subprocess.check_output(['git','show','-s','--format=%T',base],text=True).strip()==os.environ['SOURCE_TREE']
              refs.append({'kind':kind,'pr':pr['number'],'head':pr['head']['sha'],'branch':pr['head']['ref'],'base':base,'required_state_before':'open','required_state_after':'closed','merged':False,'delete_exact_ref':True})
          authorization={'status':'cycle-011-rastel-finalizer-settlement-authorization-v2','version':2,'canonical':{'source_main':os.environ['SOURCE_MAIN'],'qualified_main':os.environ['CURRENT_BASE'],'tree':os.environ['SOURCE_TREE'],'tree_neutral_required':True},'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD']},'binder':{'pr':int(os.environ['BINDER_PR']),'head':os.environ['BINDER_HEAD'],'run':int(os.environ['BINDER_RUN']),'job':int(os.environ['BINDER_JOB']),'artifact':int(os.environ['BINDER_ARTIFACT']),'artifact_sha256':os.environ['BINDER_ZIP_SHA256'],'review_artifact':int(os.environ['REVIEW_ARTIFACT']),'review_artifact_sha256':os.environ['REVIEW_ZIP_SHA256']},'portable_finalizer':{'bytes':portable['target']['bytes'],'sha256':portable['target']['sha256'],'identity':portable['identity'],'placeholders':portable['placeholders'],'environment_references':portable['target']['environment_references']},'settle':refs,'prohibitions':{'merge':True,'force_update':True,'main_mutation':True,'product_publication':True,'cycle_012_authorization':True}}
          authorization['identity']=sha(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode())
          (root/'authorization/settlement.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          PY
          printf 'PRODUCER_PR=%s\nPRODUCER_HEAD=%s\n' "$producer_pr" "$producer_head" >> "$GITHUB_ENV"

      - name: Seal portable execution-preflight packet
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
            /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-binder
            /tmp/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
