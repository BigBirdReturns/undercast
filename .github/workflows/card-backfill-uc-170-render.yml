name: card-backfill-uc-170-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-170-RENDER.json"
      - "scripts/card-backfill-uc-170-render.part-00.mjs"
      - "scripts/card-backfill-uc-170-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-170-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-170-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-035'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-035
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-170 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-170-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-170');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-170');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_f1583034cfdddaa201e1bcc3');
          if(row.version!==1||row.record_id!=='UC-170'||row.kind!=='voice'||row.actor!=='Maurice LaMarche'||row.character!=='The Brain, Kif Kroker, Egon Spengler'||row.production!=='Animaniacs / Futurama'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-170 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8713451891||row.discovery_artifact?.head_sha!=='bf9cec9fdaf8b9c8ac89010b1b66d9ae0d61764b'||row.discovery_artifact?.zip_sha256!=='036d77eb67f1336478a3eea00e6f6afe2ced64d8cff8e844c13ea4f143de4049'||row.discovery_artifact?.candidate_count!==89||row.discovery_artifact?.role_counts?.brain!==8||row.discovery_artifact?.role_counts?.kif!==1||row.discovery_artifact?.role_counts?.egon!==80)throw new Error('UC-170 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==3||row.actor_role_pages?.length!==4||row.selected_roles?.length!==3||JSON.stringify(row.selected_roles.map(role=>role.key))!==JSON.stringify(['brain','kif','egon']))throw new Error('UC-170 render denominator drift');
          const brain=row.selected_roles.find(role=>role.key==='brain');
          const kif=row.selected_roles.find(role=>role.key==='kif');
          const egon=row.selected_roles.find(role=>role.key==='egon');
          if(brain?.sha256!=='6ab210ad8aeb53986bef746a832d779c1cc0780c9f3a4c3824cc9754fce06775'||brain?.width!==395||brain?.height!==500||brain?.pageimage_source!==true)throw new Error('UC-170 Brain source drift');
          if(kif?.sha256!=='5261c4cddb408a3f18f2bc8c321ff8f7ad6edfcdc82c66cb614e82ec672f2f2e'||kif?.width!==144||kif?.height!==444||kif?.bytes!==12104||kif?.generic_width_floor_exception!==true)throw new Error('UC-170 Kif source drift');
          if(egon?.sha256!=='4f3ca12b954cab1db05c1ed22ed184639f87e7ee32e13b84dde9ace456f357b2'||egon?.width!==1232||egon?.height!==1600||egon?.file_title!=='File:EgonColorPMS.png')throw new Error('UC-170 Egon source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.divider_width!==12||row.render?.top_height!==560||row.render?.internal_rule_height!==8||row.render?.bottom_height!==432||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-170 render geometry drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Maurice LaMarche'||specimen.character!=='The Brain, Kif Kroker, Egon Spengler'||specimen.production!=='Animaniacs / Futurama'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-170'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-170 audit boundary drift');
          console.log('PASS — exact UC-170 three-role face-and-body render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8713451891/zip" > "$root/discovery.zip"
          echo "036d77eb67f1336478a3eea00e6f6afe2ced64d8cff8e844c13ea4f143de4049  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-170-discover"
          echo "b0b6bb944e2e387ad09104fd9d472de811c1ededa6bdb962eaa535214266df7f  $source/manifest.json" | sha256sum -c -
          echo "78c377c2c145b11bb7ae7fdf542ecc79f156131520ff0e386b8f034ddca92aa0  $source/summary.json" | sha256sum -c -
          echo "bda1728bd00c24f5ec938a90e7bf43d94687f15e562fd3e83226dbc96665ea84  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "6ab210ad8aeb53986bef746a832d779c1cc0780c9f3a4c3824cc9754fce06775  $source/candidates/brain/003-file-brain-official-art-png.webp" | sha256sum -c -
          echo "5261c4cddb408a3f18f2bc8c321ff8f7ad6edfcdc82c66cb614e82ec672f2f2e  $source/candidates/kif/001-file-character-kif-png.webp" | sha256sum -c -
          echo "4f3ca12b954cab1db05c1ed22ed184639f87e7ee32e13b84dde9ace456f357b2  $source/candidates/egon/017-file-egoncolorpms-png.webp" | sha256sum -c -
          echo "7d5ecf50940e4e01d599745c8ad51626d09734520f94d0bc27df8bfbfb429bd6  $source/raw/brain.wikitext" | sha256sum -c -
          echo "9d4a1c8417b278b3b3a8e293e0214e61310ee314288f8f339e0947161f576019  $source/raw/kif.wikitext" | sha256sum -c -
          echo "c5883baa20fd892ac56c13c1de1425c2f1cd1632f1debcf5296272c5e06febe9  $source/raw/egon.wikitext" | sha256sum -c -
          echo "d2ae35d7cdf9c1829e4da35ca5073886cdc2953ed7529b841b2f5a4ba2ae470f  $source/pages/television-academy-maurice-lamarche.png" | sha256sum -c -
          echo "866f24cc366147361e0fdb8919a5cbfe659bce20ed7046b2b83af5d484a5142b  $source/pages/hulu-animaniacs.png" | sha256sum -c -
          echo "d4c6f935dd301e13d1b54e41bf2a41330aff91fa503bde09171b6b58a765683d  $source/pages/hulu-futurama.png" | sha256sum -c -
          echo "0adfa1ed4e6f9e1341a9169808feef310f9ec9b842d6f42ece237b26e90cba96  $source/pages/ghostbusters-official-real-ghostbusters.png" | sha256sum -c -
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-170-render/discovery/card-backfill-uc-170-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-170-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-170-render"
          cat scripts/card-backfill-uc-170-render.part-00.mjs scripts/card-backfill-uc-170-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-170-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-170-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-170-render/output
            ${{ runner.temp }}/card-backfill-uc-170-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
