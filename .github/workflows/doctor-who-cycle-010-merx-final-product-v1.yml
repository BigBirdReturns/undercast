name: doctor-who-cycle-010-merx-final-product-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-product-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-product-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-product-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      EXACT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      BRANCH: agent/doctor-who-cycle-010-merx-final-product-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-product-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-final-product-v1
      WORKTREE: /tmp/doctor-who-cycle-010-merx-final-product-v1-worktree
      FINALWT: /tmp/doctor-who-cycle-010-merx-final-product-v1-final
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      CANDIDATE_PR: "726"
      CANDIDATE_HEAD: 992c1ae11106456fa20958aabe01a48c54f2e08c
      CANDIDATE_RUN: "31293712144"
      CANDIDATE_JOB: "93195270833"
      CANDIDATE_ARTIFACT: "9032284342"
      CANDIDATE_ZIP_SHA256: 31618c1732e5e9535e87643758093b481bc6b0e454f9b6c93ad98576aaafeb34
      CANDIDATE_RECEIPT_ID: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      CANDIDATE_PATHS_SHA256: 05307b2badf8a61cf4200453e3cb8895623cafa1fc448bcd8362d640d5be5548

      REVIEW_PR: "728"
      REVIEW_HEAD: 0d8c5c1623c92ce3c04c38e6cb6a5c24cae898cc
      REVIEW_RUN: "31294273106"
      REVIEW_JOB: "93196675184"
      REVIEW_ARTIFACT: "9032445196"
      REVIEW_ZIP_SHA256: 44b163750646ccd1d3dbcdcfb89a7d63c9ba5b54ca466285e5e73b07decb5e27
      REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338

      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      SOURCE_URL: https://tardis.fandom.com/wiki/Merx
      SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      PORTRAIT_PATH: images/uc-1355-portrait.jpg
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg
      REVIEWED_AT: "2026-08-09T04:30:00Z"
      COMMIT_AT: "2026-08-09T04:35:00Z"

      RUNNER_B64_SHA256: 63b8e2aa5fc9d365f3e15b01c14d5136bc06f12b1dfe6d39f2636399590898b1
      RUNNER_GZIP_SHA256: e616e8ec3ffb310fcf9fc1e48e6dbb7910bc5fa7629a6805e4385b97df61b59f
      RUNNER_SHA256: f71a3e0a8501972d4d9bd54006fea64cae91402d81e8447405541614ba54d02b
      RUNNER_BYTES: "28361"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and compile exact receipt-bearing finalizer
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-010-merx-finalizer-v1
          rm -rf "$root"
          mkdir -p "$root"
          : > "$root/runner.gz.b64"
          for blob in 15e67c6b985608abe8bd611c96d2947bb0870bec 9dd1e4d6abff6afd6db4c0d15a18b0ab94f9036b; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/runner.gz.b64"
          done
          test "$(sha256sum "$root/runner.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$root/runner.gz.b64" > "$root/runner.sh.gz"
          test "$(sha256sum "$root/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$root/runner.sh.gz" > "$root/runner.sh"
          test "$(wc -c < "$root/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$root/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$root/runner.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-010-merx-finalizer-v1/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for i,block in enumerate(blocks): compile(block,f'<embedded-{i}>','exec')
          PY

      - name: Execute exact receipt-bearing Merx finalizer
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-010-merx-finalizer-v1/runner.sh
          exec /tmp/doctor-who-cycle-010-merx-finalizer-v1/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-product-v1/final
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-product-v1
            /tmp/doctor-who-cycle-010-merx-finalizer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
