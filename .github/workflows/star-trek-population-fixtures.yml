name: star-trek-population-fixtures

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-FIXTURES.json"
      - ".github/workflows/star-trek-population-fixtures.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
          fetch-depth: 0
      - name: Advance exact rendered Ferengi expectations
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/rendered/site.spec.mjs')
          text=path.read_text()
          replacements={
            '  await expect(page.locator("#result-status")).toHaveText("14 specimens match; 14 shown.");':
            '  await expect(page.locator("#result-status")).toHaveText("15 specimens match; 15 shown.");',
            '  expect(names).toEqual(["Quark","Rom","Nog","Quark (mirror)","Brunt (mirror)","Nog (mirror)","Ishka","Bok / Gral / Prak","Krax","DaiMon Lurin","Grimp","Leck","Pel","Berik"]);':
            '  expect(names).toEqual(["Quark","Rom","Nog","Quark (mirror)","Brunt (mirror)","Nog (mirror)","Ishka","Bok / Gral / Prak","Krax","DaiMon Lurin","Grimp","Leck","Pel","Berik","Zek"]);'
          }
          for old,new in replacements.items():
            count=text.count(old)
            if count!=1: raise SystemExit(f'fixture replacement count {count}: {old}')
            text=text.replace(old,new,1)
          path.write_text(text)
          PY
          rm -f .github/STAR-TREK-POPULATION-FIXTURES.json
          rm -f .github/workflows/star-trek-population-fixtures.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add tests/rendered/site.spec.mjs .github/STAR-TREK-POPULATION-FIXTURES.json .github/workflows/star-trek-population-fixtures.yml
          git diff --cached --check
          git commit -m "Population: advance rendered Ferengi fixture for Zek"
          git push origin HEAD:agent/star-trek-population-001
