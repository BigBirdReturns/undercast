name: star-trek-henoch-stage-runtime-diagnostic-v1

on:
  push:
    branches:
      - agent/star-trek-henoch-stage-runtime-diagnostic-v1

permissions:
  contents: read

concurrency:
  group: star-trek-henoch-stage-runtime-diagnostic-v1
  cancel-in-progress: false

jobs:
  inspect:
    name: inspect-sealed-henoch-stage-runtime-v2
    if: ${{ github.event.head_commit.message == 'Inspect sealed Star Trek Henoch stage runtime v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct exact v2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          source_commit=afcca3241f1ff3cf9f58d5c9b36c52f5b0c24aa0
          source_tree=b32f32f9412a1502f728e4599543fd408a55095c
          payload_path=.github/recovery/star-trek-henoch-stage-recovery-v2/runtime.tar.gz.b64
          payload_sha=05afaebd6d6bbe04e14a8b39fecb9a82ba83f313d7bc3b9bf995eb77d3483217
          out=/tmp/star-trek-henoch-stage-runtime-diagnostic-v1

          rm -rf "$out"
          mkdir -p "$out/runtime"
          git fetch --no-tags --depth=1 origin "$source_commit"
          test "$(git show -s --format=%T "$source_commit")" = "$source_tree"
          git show "$source_commit:$payload_path" > "$out/runtime.tar.gz.b64"
          tr -d '\n' < "$out/runtime.tar.gz.b64" | base64 -d > "$out/runtime.tar.gz"
          test "$(sha256sum "$out/runtime.tar.gz" | awk '{print $1}')" = "$payload_sha"
          tar -xzf "$out/runtime.tar.gz" -C "$out/runtime"
          (cd "$out/runtime" && sha256sum -c payload-manifest.sha256)
          find "$out/runtime" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$out/extracted.sha256"
          find "$out/runtime" -maxdepth 3 -type f | LC_ALL=C sort > "$out/paths.txt"

      - name: Upload exact runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-stage-runtime-diagnostic-v1
          path: /tmp/star-trek-henoch-stage-runtime-diagnostic-v1/
          if-no-files-found: error
          retention-days: 30
