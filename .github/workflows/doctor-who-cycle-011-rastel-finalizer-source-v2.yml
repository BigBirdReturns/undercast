name: doctor-who-cycle-011-rastel-finalizer-source-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-source-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-source-v2
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-source-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-source-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v2
      V1_PR: "771"
      V1_HEAD: f5781f6d2e00997aa0cdbece875d467eec0ef809
      V1_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-v1
      V1_RUN: "31334309188"
      V1_JOB: "93297522507"
      V1_ARTIFACT: "9043850114"
      V1_ARTIFACT_FILES: "5"
      V1_ARTIFACT_SIZE: "113392"
      V1_ARTIFACT_SHA256: 3e78c142f5f12046cfa8d9c3c566b49bd875740a0380e0c387dc27f4274ec8d6
      V1_ARTIFACT_NAME: doctor-who-cycle-011-rastel-finalizer-source-v1-diagnostics-31334309188-attempt-1
      V1_WORKFLOW_BLOB: e5bd14595f3393555a5c562d091073fce88a45c0
      SOURCE_B64_BYTES: "12968"
      SOURCE_B64_SHA256: 3bd60a97b181fb8c89482a6ddb282fe9fe70163618e7086540d27e2aae174eac
      SOURCE_GZIP_BYTES: "9726"
      SOURCE_GZIP_SHA256: 5e4b5aca1cbc246f93218608a29f1e116b72b860d50ea7dc62121c8015ef1d3b
      SOURCE_BYTES: "35695"
      SOURCE_SHA256: 9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507
      V4_BYTES: "35745"
      V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate V1 failure and seal exact finalizer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" /tmp/rastel-finalizer-source-v1.zip
          mkdir -p "$OUT"/{api,source,receipt} "$OUT/v1"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V1_PR" > "$OUT/api/v1-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" > "$OUT/api/v1-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN/jobs?per_page=100" > "$OUT/api/v1-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT" > "$OUT/api/v1-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT/zip" > /tmp/rastel-finalizer-source-v1.zip
          test "$(sha256sum /tmp/rastel-finalizer-source-v1.zip | awk '{print $1}')" = "$V1_ARTIFACT_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V1_WORKFLOW_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$OUT/source/v1-workflow.yml"
          HEAD="$head" PR="$pr" BASE="$base" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          out = Path(os.environ['OUT'])
          load = lambda name: json.loads((out / 'api' / name).read_text())
          own = load('own-pr.json')
          v1pr = load('v1-pr.json')
          v1run = load('v1-run.json')
          v1jobs = load('v1-jobs.json')['jobs']
          v1artifact = load('v1-artifact.json')

          assert own['number'] == int(os.environ['PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha'] == os.environ['MAIN'] and own['head']['sha'] == os.environ['HEAD']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['commits'] == 1 and own['changed_files'] == 1

          assert v1pr['number'] == int(os.environ['V1_PR'])
          assert v1pr['state'] == 'open' and v1pr['draft'] is True and v1pr['merged'] is False
          assert v1pr['base']['sha'] == os.environ['MAIN']
          assert v1pr['head']['sha'] == os.environ['V1_HEAD'] and v1pr['head']['ref'] == os.environ['V1_BRANCH']
          assert v1pr['commits'] == 1 and v1pr['changed_files'] == 1
          assert v1run['id'] == int(os.environ['V1_RUN']) and v1run['head_sha'] == os.environ['V1_HEAD']
          assert v1run['head_branch'] == os.environ['V1_BRANCH'] and v1run['status'] == 'completed' and v1run['conclusion'] == 'failure'
          matches = [job for job in v1jobs if job['id'] == int(os.environ['V1_JOB'])]
          assert len(matches) == 1
          job = matches[0]
          assert job['name'] == 'inspect' and job['status'] == 'completed' and job['conclusion'] == 'failure'
          step = [x for x in job['steps'] if x['name'] == 'Bind carrier and reconstruct exact Merx V4 finalizer source']
          assert len(step) == 1 and step[0]['status'] == 'completed' and step[0]['conclusion'] == 'failure'
          assert v1artifact['id'] == int(os.environ['V1_ARTIFACT'])
          assert v1artifact['name'] == os.environ['V1_ARTIFACT_NAME']
          assert v1artifact['size_in_bytes'] == int(os.environ['V1_ARTIFACT_SIZE']) and v1artifact['expired'] is False
          assert v1artifact['digest'] == 'sha256:' + os.environ['V1_ARTIFACT_SHA256']
          assert v1artifact['workflow_run']['id'] == int(os.environ['V1_RUN'])
          assert v1artifact['workflow_run']['head_sha'] == os.environ['V1_HEAD']

          destination = out / 'v1/extracted'
          destination.mkdir(parents=True)
          with zipfile.ZipFile('/tmp/rastel-finalizer-source-v1.zip') as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['V1_ARTIFACT_FILES'])
              assert len({info.filename for info in infos}) == len(infos)
              for info in infos:
                  name = info.filename
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in name and '\x00' not in name
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode) and not info.is_dir()
                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))

          expected = {
              'api/carrier.json': (18572, 'd9f0514af1360f9eff86e494aa4c9f7a958a0711eba0e6505df6713cc09eddf8'),
              'source/runner-v3.sh.gz.b64': (int(os.environ['SOURCE_B64_BYTES']), os.environ['SOURCE_B64_SHA256']),
              'source/runner-v3.sh.gz': (int(os.environ['SOURCE_GZIP_BYTES']), os.environ['SOURCE_GZIP_SHA256']),
              'source/runner-v3.sh': (int(os.environ['SOURCE_BYTES']), os.environ['SOURCE_SHA256']),
              'source/runner-v4.sh': (int(os.environ['V4_BYTES']), os.environ['V4_SHA256']),
          }
          files = [path for path in destination.rglob('*') if path.is_file()]
          assert len(files) == len(expected)
          for relative, (size, digest) in expected.items():
              path = destination / relative
              assert path.is_file() and path.stat().st_size == size
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest

          v3 = (destination / 'source/runner-v3.sh').read_text()
          v4 = (destination / 'source/runner-v4.sh').read_text()
          old = '  test "$(git diff --name-only "$CANDIDATE_COMMIT" | sort)" = "$CLOSURE_PATHS"\n'
          new = '  test "$({ git diff --name-only "$CANDIDATE_COMMIT"; git ls-files --others --exclude-standard; } | sort -u)" = "$CLOSURE_PATHS"\n'
          assert v3.count(old) == 1 and v3.count(new) == 0
          assert v4 == v3.replace(old, new)
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", v4, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1):
              compile(block, f'<merx-finalizer-source-v2-{index}>', 'exec')

          workflow = (out / 'source/v1-workflow.yml').read_text()
          missing = '          RUNNER="$OUT/source/runner-v4.sh" python3 - <<\'PY\''
          repaired = '          PR="$pr" HEAD="$head" RUNNER="$OUT/source/runner-v4.sh" python3 - <<\'PY\''
          assert workflow.count(missing) == 1 and workflow.count(repaired) == 0

          for relative in expected:
              source = destination / relative
              target = out / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(source.read_bytes())

          receipt = {
              'version': 1,
              'status': 'cycle-011-rastel-finalizer-source-recovered-v2',
              'source': {
                  'pr': int(os.environ['V1_PR']), 'head': os.environ['V1_HEAD'],
                  'run': int(os.environ['V1_RUN']), 'job': int(os.environ['V1_JOB']),
                  'artifact': int(os.environ['V1_ARTIFACT']), 'artifact_sha256': os.environ['V1_ARTIFACT_SHA256'],
                  'workflow_blob': os.environ['V1_WORKFLOW_BLOB'],
              },
              'runners': {
                  'v3_bytes': int(os.environ['SOURCE_BYTES']), 'v3_sha256': os.environ['SOURCE_SHA256'],
                  'v4_bytes': int(os.environ['V4_BYTES']), 'v4_sha256': os.environ['V4_SHA256'],
                  'embedded_python_programs': len(blocks),
              },
              'failure': {'type': 'missing_environment_handoff', 'missing': ['PR', 'HEAD'], 'exception': "KeyError: 'PR'"},
              'repair': {'required_handoff': 'PR="$pr" HEAD="$head"', 'runner_changed': False, 'runner_executed': False},
              'repository_write': False, 'candidate_imported': False, 'cycle_receipt_written': False,
              'product_constructed': False, 'cycle_012_authorization': False,
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (out / 'receipt/source-recovery.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          bash -n "$OUT/source/runner-v4.sh"
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
