name: doctor-who-cycle-002-exact-task-extract

on:
  push:
    branches:
      - agent/doctor-who-cycle-002-current
    paths:
      - ".github/workflows/doctor-who-cycle-002-extract.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-002-exact-task-extract
  cancel-in-progress: true

env:
  EXACT_MAIN: e8f5cb652daa5ed325bc84d85d41412e7c4d44c3
  TARGET_BRANCH: agent/doctor-who-cycle-002-current
  SELF: .github/workflows/doctor-who-cycle-002-extract.yml
  TASK_ID: ap_f6ca3d513c7ac0b6b9d67ce1
  SOURCE_URL: https://tardis.fandom.com/wiki/Gredd
  SOURCE_FINGERPRINT: 4be5cb67c57115c6f679e0c86361206eabd2768c39fb3c1f8326dcd8c120bfd0

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact current main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=8 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$(git rev-parse HEAD)"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          printf '%s\n' "$SELF" > /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Extract exact task, preserved source, and current transaction surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/doctor-who-cycle-002-extract
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const OUT = '/tmp/doctor-who-cycle-002-extract';
          const TASK_ID = process.env.TASK_ID;
          const SOURCE_URL = process.env.SOURCE_URL;
          const SOURCE_FINGERPRINT = process.env.SOURCE_FINGERPRINT;
          const read = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const write = (name, value) => fs.writeFileSync(path.join(OUT, name), JSON.stringify(value, null, 2) + '\n');
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const stateBytes = fs.readFileSync('data/AUTOPILOT.json');
          const state = JSON.parse(stateBytes);
          const task = state.jobs.find((row) => row.id === TASK_ID);
          if (!task) throw new Error(`missing exact task ${TASK_ID}`);
          if (task.scope !== 'doctor-who' || task.status !== 'queued') throw new Error(`task state drifted: ${task.scope}/${task.status}`);
          if (task.performer !== 'Dan Starkey' || task.character !== 'Gredd') throw new Error('task identity drifted');
          if (task.source_fingerprint !== SOURCE_FINGERPRINT) throw new Error('task source fingerprint drifted');
          if (JSON.stringify(task.sources) !== JSON.stringify([SOURCE_URL])) throw new Error('task source set drifted');
          write('exact-task.json', task);

          const matchObject = (value) => {
            const text = JSON.stringify(value);
            return text.includes(TASK_ID) || text.includes(SOURCE_URL) || text.includes(SOURCE_FINGERPRINT) || /Gredd/i.test(text);
          };
          for (const file of ['data/CENSUS-MANIFEST.json', 'data/CENSUS-COVERAGE.json', 'preservation/SNAPSHOTS.json']) {
            const doc = read(file);
            const matched = {};
            for (const [key, value] of Object.entries(doc)) {
              if (Array.isArray(value)) matched[key] = value.filter(matchObject);
              else if (matchObject(value)) matched[key] = value;
            }
            write(path.basename(file).replace(/\.json$/i, '') + '-matches.json', matched);
          }

          const specimens = read('data/specimens.json');
          const sources = read('data/SOURCES.json');
          write('dan-starkey-existing-specimens.json', specimens.filter((row) => row.actor === 'Dan Starkey'));
          write('dan-starkey-existing-sources.json', sources.filter((row) => row.actor === 'Dan Starkey'));

          const audit = read('data/MEDIA-AUDIT.json');
          write('doctor-who-media-items.json', (audit.items || []).filter((row) => row.scope === 'doctor-who'));
          const waterline = read('data/WATERLINE-STATE.json');
          write('doctor-who-waterline-cycles.json', (waterline.cycles || []).filter((row) => row.scope_id === 'doctor-who'));

          const doctorJobs = state.jobs.filter((row) => row.scope === 'doctor-who');
          const summary = {
            exact_main: process.env.EXACT_MAIN,
            carrier_head: process.env.GITHUB_SHA,
            task,
            task_source_receipts: task.source_receipts || [],
            queue: {
              total: doctorJobs.length,
              queued: doctorJobs.filter((row) => row.status === 'queued').length,
              in_flight: doctorJobs.filter((row) => ['leased', 'drafted', 'merged'].includes(row.status)).length,
              resolved: doctorJobs.filter((row) => row.status === 'resolved').length,
            },
            state_sha256: sha(stateBytes),
          };
          write('summary.json', summary);
          console.log(JSON.stringify(summary, null, 2));
          NODE

          git grep -n -i -E 'Gredd|ap_f6ca3d513c7ac0b6b9d67ce1|4be5cb67c57115c6f679e0c86361206eabd2768c39fb3c1f8326dcd8c120bfd0' \
            > /tmp/doctor-who-cycle-002-extract/git-grep.txt || true

          tar -czf /tmp/doctor-who-cycle-002-current-source.tgz \
            --exclude='data/_curate' \
            --exclude='records' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='images' \
            --exclude='node_modules' \
            AGENTS.md GROW.md LUNA.md package.json package-lock.json \
            scripts data docs tests playwright.config.mjs 2>/tmp/tar-warnings.txt

          sha256sum /tmp/doctor-who-cycle-002-current-source.tgz \
            > /tmp/doctor-who-cycle-002-current-source.sha256
          test -z "$(git status --porcelain)"

      - name: Upload exact extraction evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-extract-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/doctor-who-cycle-002-extract
            /tmp/doctor-who-cycle-002-current-source.tgz
            /tmp/doctor-who-cycle-002-current-source.sha256
            /tmp/tar-warnings.txt
