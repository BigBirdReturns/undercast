name: materialize-clifford-number-hr-counterpower-wave-05

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-dissonance-counterpower-wave-04
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cnhr-wave05-counterpower-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-counterpower-intervention-wave-05'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 05 counterpower-intervention packet
        shell: bash
        env:
          PARENT_SHA: ee7705464eb974e40a6d4bc52fd0b88e164640db
          PAYLOAD_SHA256: 1bc1ccfedc79153c49913a3ae7b8b82c6053ce3547fffc5633bb2c496950d02d
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(wc -c < .cnhr-wave05-counterpower/chunk-000.txt)" -eq 7001
          test "$(wc -c < .cnhr-wave05-counterpower/chunk-001.txt)" -eq 7001
          test "$(wc -c < .cnhr-wave05-counterpower/chunk-002.txt)" -eq 7001
          test "$(wc -c < .cnhr-wave05-counterpower/chunk-003.txt)" -eq 7001
          test "$(wc -c < .cnhr-wave05-counterpower/chunk-004.txt)" -eq 5633

          printf '%s  %s\n' \
            b78a8f219c84707eecdc6a6245243e0c1a18a4c1ed0278d165a7c3ff35d573db .cnhr-wave05-counterpower/chunk-000.txt \
            da784682f2f7fe66982ec045867ace0eb0ab885a31ded2d732d78cde7fc8ad15 .cnhr-wave05-counterpower/chunk-001.txt \
            bf3302be6c36a40d2038c8882e969a5913535f82472ffd623cc9f39676ebab04 .cnhr-wave05-counterpower/chunk-002.txt \
            cfb58b5ec538f1eaeae98b4c9a421f4ac8785270842f1740d7d65f6db8ac549d .cnhr-wave05-counterpower/chunk-003.txt \
            9398299ff705ea9c5abf14109852eb4dd5f314d33371f33d865a42ff09f46f99 .cnhr-wave05-counterpower/chunk-004.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave05-counterpower/chunk-000.txt)" = 6dcf6ef8abcb6589c2ec4d4afe3910da0ca87803
          test "$(git hash-object .cnhr-wave05-counterpower/chunk-001.txt)" = 7b30ac1b2a0ad1d25c6c6acff27dbe9e1bce2224
          test "$(git hash-object .cnhr-wave05-counterpower/chunk-002.txt)" = 98728b063b801a92b4108c318ad8d481ce154849
          test "$(git hash-object .cnhr-wave05-counterpower/chunk-003.txt)" = f75798def1c7a8066f8837f4b305413141ffd758
          test "$(git hash-object .cnhr-wave05-counterpower/chunk-004.txt)" = 9375e1fb90fe5c17fff4abd30f10f677003de7bd

          cat .cnhr-wave05-counterpower/chunk-*.txt \
            | tr -d '\n' \
            | base64 --decode > /tmp/cnhr-wave05-counterpower.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave05-counterpower.tar.gz \
            | sha256sum --check --strict

          tar -tzf /tmp/cnhr-wave05-counterpower.tar.gz \
            | python -c 'import sys; paths=[line.strip() for line in sys.stdin if line.strip()]; assert paths; assert all(not p.startswith("/") and ".." not in p.split("/") for p in paths)'
          tar -xzf /tmp/cnhr-wave05-counterpower.tar.gz --strip-components=1 -C .
          rm -rf .cnhr-wave05-counterpower .github/workflows/cnhr-wave05-counterpower-materialize.yml

          rm -rf /tmp/cnhr-wave04-root /tmp/cnhr-wave05-root
          mkdir -p /tmp/cnhr-wave04-root /tmp/cnhr-wave05-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packets = [
              ('data/review/clifford-number/hr-discipline/wave-04/MANIFEST.json', Path('/tmp/cnhr-wave04-root'), 22),
              ('data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json', Path('/tmp/cnhr-wave05-root'), 22),
          ]
          for manifest_rel, packet_root, expected_count in packets:
              manifest_path = Path(manifest_rel)
              manifest = json.loads(manifest_path.read_text())
              paths = {row['path'] for row in manifest['files']} | {manifest_rel}
              assert len(paths) == expected_count, (manifest_rel, len(paths))
              for rel in sorted(paths):
                  src = source_root / rel
                  dst = packet_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
              print(f'isolated validation root: {manifest_rel} -> {len(paths)} exact files')
          PY

          node --check /tmp/cnhr-wave04-root/scripts/clifford-number-hr-dissonance-counterpower.mjs
          node --check /tmp/cnhr-wave04-root/test/clifford-number-hr-dissonance-counterpower-fixtures.mjs
          node /tmp/cnhr-wave04-root/scripts/clifford-number-hr-dissonance-counterpower.mjs --check --root /tmp/cnhr-wave04-root
          (cd /tmp/cnhr-wave04-root && node test/clifford-number-hr-dissonance-counterpower-fixtures.mjs)

          node --check /tmp/cnhr-wave05-root/scripts/clifford-number-hr-counterpower-interventions.mjs
          node --check /tmp/cnhr-wave05-root/test/clifford-number-hr-counterpower-interventions-fixtures.mjs
          node /tmp/cnhr-wave05-root/scripts/clifford-number-hr-counterpower-interventions.mjs --check --root /tmp/cnhr-wave05-root --strict-root
          (cd /tmp/cnhr-wave05-root && node test/clifford-number-hr-counterpower-interventions-fixtures.mjs)
          git diff --check

          git add -A
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = 'ee7705464eb974e40a6d4bc52fd0b88e164640db'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          assert not any(path.startswith('.cnhr-wave05-counterpower/') for path in observed)
          assert '.github/workflows/cnhr-wave05-counterpower-materialize.yml' not in observed
          print('exact Wave 05 counterpower-intervention delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number counterpower intervention Wave 05'
          git push origin HEAD:"${HEAD_REF}"
