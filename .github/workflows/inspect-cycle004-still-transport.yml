name: inspect-cycle004-still-transport

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/inspect-cycle004-still-transport.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXACT_MAIN: 39a58f2c5538da1adb7657623ee300dbca54a82d
      CORRECTION_HEAD: 6ccdeafa2e2c7e272e5f1fa52c5c9d911d38c213
      ROOT: .ci/doctor-who-cycle-004-still-correction/compact-transport.tgz.b64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32

      - name: Bind one-file read-only inspector and exact current floor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=256 origin \
            "$CORRECTION_HEAD" \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${{ github.event.pull_request.head.ref }})" = "${{ github.event.pull_request.head.sha }}"
          git cat-file -e "$CORRECTION_HEAD^{commit}"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = ".github/workflows/inspect-cycle004-still-transport.yml"

      - name: Export every exact carrier blob and diagnose byte continuity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cycle004-transport-inspection/chunks
          paths=(
            "$ROOT"
            "$ROOT.part-002"
            "$ROOT.part-003"
            "$ROOT.part-004"
            "$ROOT.part-005"
            "$ROOT.part-006"
            "$ROOT.part-007"
          )
          for path in "${paths[@]}"; do
            name="$(basename "$path")"
            git show "$CORRECTION_HEAD:$path" > "/tmp/cycle004-transport-inspection/chunks/$name"
          done
          cat "/tmp/cycle004-transport-inspection/chunks/$(basename "$ROOT")" \
              /tmp/cycle004-transport-inspection/chunks/compact-transport.tgz.b64.part-* \
            > /tmp/cycle004-transport-inspection/concatenated.b64
          tr -d '\n\r\t ' < /tmp/cycle004-transport-inspection/concatenated.b64 \
            | base64 --decode > /tmp/cycle004-transport-inspection/decoded.tgz
          sha256sum /tmp/cycle004-transport-inspection/chunks/* \
            /tmp/cycle004-transport-inspection/concatenated.b64 \
            /tmp/cycle004-transport-inspection/decoded.tgz \
            > /tmp/cycle004-transport-inspection/sha256.txt
          wc -c /tmp/cycle004-transport-inspection/chunks/* \
            /tmp/cycle004-transport-inspection/concatenated.b64 \
            /tmp/cycle004-transport-inspection/decoded.tgz \
            > /tmp/cycle004-transport-inspection/bytes.txt
          xxd -l 256 /tmp/cycle004-transport-inspection/decoded.tgz \
            > /tmp/cycle004-transport-inspection/decoded-head.hex
          set +e
          gzip -t /tmp/cycle004-transport-inspection/decoded.tgz \
            > /tmp/cycle004-transport-inspection/gzip-test.stdout \
            2> /tmp/cycle004-transport-inspection/gzip-test.stderr
          echo "$?" > /tmp/cycle004-transport-inspection/gzip-test.exit
          tar -tzf /tmp/cycle004-transport-inspection/decoded.tgz \
            > /tmp/cycle004-transport-inspection/tar-list.stdout \
            2> /tmp/cycle004-transport-inspection/tar-list.stderr
          echo "$?" > /tmp/cycle004-transport-inspection/tar-list.exit
          set -e
          test -z "$(git status --porcelain)"

      - name: Upload exact read-only transport inspection
        uses: actions/upload-artifact@v4
        with:
          name: cycle004-still-transport-inspection-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: /tmp/cycle004-transport-inspection
