name: star-trek-cadmar-source-probe

on:
  push:
    branches:
      - agent/star-trek-cadmar-source-probe-v1

permissions:
  contents: read
  actions: write

jobs:
  source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Freeze Cadmar role, episode, still, and portrait candidates
        run: python3 .github/scripts/star-trek-cadmar-source-probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-source-probe
          path: /tmp/star-trek-cadmar-source-probe/
          if-no-files-found: error
          retention-days: 30
