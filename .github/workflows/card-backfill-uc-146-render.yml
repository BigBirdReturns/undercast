name: card-backfill-uc-146-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-146-RENDER.json"
      - "scripts/card-backfill-uc-146-render.part-00.mjs"
      - "scripts/card-backfill-uc-146-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-146-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-146-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-032'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-032
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-146 performer portrait render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-146-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-146');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-146');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_c4167741dd920f9d90aad34a');
          if(row.version!==1||row.record_id!=='UC-146'||row.actor!=='Tim Rose'||row.character!=='Admiral Ackbar / Salacious B. Crumb'||row.production!=='Return of the Jedi'||row.years!=='1983–2019'||row.side!=='portrait'||row.reviewed_role!=='second-desk')throw new Error('UC-146 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8709781190||row.discovery_artifact?.head_sha!=='d3775ee17905027cb8acf763920bb40a68fef679'||row.discovery_artifact?.zip_sha256!=='ce188547bf9738d0ee4ae52a636c897e2d91281873e45e35c4a59ec51eea1878'||row.discovery_artifact?.candidate_count!==2)throw new Error('UC-146 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==2||row.identity_custody?.length!==4||row.identity_custody.filter(item=>item.strict).length!==2||row.identity_custody.filter(item=>item.reference_only).length!==2)throw new Error('UC-146 identity denominator drift');
          if(row.selected?.sha256!=='76ed05827a4175c0443b6b6aa1a031832a2ceabb43b2557e8e0f04aee485eefc'||row.selected?.width!==2304||row.selected?.height!==3400||row.selected?.license_short_name!=='CC BY-SA 3.0')throw new Error('UC-146 selected portrait drift');
          if(row.alternative?.sha256!=='7d850403d4313f35ff0cf8e265ac480707a5c99b03671d667cd25f776a3d01a2'||row.alternative?.width!==1926||row.alternative?.height!==2478||row.alternative?.license_short_name!=='CC BY-SA 4.0')throw new Error('UC-146 alternative portrait drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.resize!=='1260x1000>'||row.render?.background!=='#f3f0e8'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-146 render geometry drift');
          if(!specimen||specimen.actor!=='Tim Rose'||specimen.character!=='Admiral Ackbar / Salacious B. Crumb'||specimen.production!=='Return of the Jedi'||specimen.years!=='1983–2019'||specimen.portrait||specimen.still?.src!=='images/uc-146-still.jpg')throw new Error('UC-146 specimen boundary drift');
          if(source?.portrait)throw new Error('UC-146 source-ledger portrait boundary drift');
          if(!audit||audit.wall_id!=='UC-146'||audit.side!=='portrait'||audit.status!=='absent'||audit.asset)throw new Error('UC-146 audit boundary drift');
          console.log('PASS — exact UC-146 captioned performer portrait render authorized');
          NODE
      - name: Retrieve and verify exact portrait discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8709781190/zip" > "$root/discovery.zip"
          echo "ce188547bf9738d0ee4ae52a636c897e2d91281873e45e35c4a59ec51eea1878  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-146-discover"
          echo "a4640d5f04fea8cfea73efbb691f5e13c647d3dacdea9923871dd8abd0df099c  $source/manifest.json" | sha256sum -c -
          echo "aeeed3fff30a26be0b71f047334640783cd859e1cb52f635485208bf62e57cfe  $source/summary.json" | sha256sum -c -
          echo "62ee6a078d74d4e321eeb2b907eac82d6d59d5d20cf83ec575f74c5bc2489ce6  $source/contact-sheet.jpg" | sha256sum -c -
          echo "76ed05827a4175c0443b6b6aa1a031832a2ceabb43b2557e8e0f04aee485eefc  $source/candidates/phoenix-2016.jpg" | sha256sum -c -
          echo "7d850403d4313f35ff0cf8e265ac480707a5c99b03671d667cd25f776a3d01a2  $source/candidates/celebration-europe-ii.jpg" | sha256sum -c -
          echo "fe3b83a5701471a3d23ff0481b08d6624e1b9164ee9c16a8e3738baa6fa44197  $source/api/phoenix-2016.json" | sha256sum -c -
          echo "47f204ad1d0a77386c683e3b52a56ca15405e03c28ef11403db68321ab338208  $source/api/celebration-europe-ii.json" | sha256sum -c -
          echo "f7fc882f85cdce36dc2882b212926394f615ba2499cf3dba32cc872553d6b00a  $source/pages/wikipedia-tim-rose-actor.png" | sha256sum -c -
          echo "2f4c253a1d73734f6a8575fc78e1e6527a8aae42ba048cf66f380bec246a4cb0  $source/pages/mediamikes-tim-rose-interview.png" | sha256sum -c -
          echo "268a9d85684b17cba3931697ec14946f31f1a59f34858d981b6088691d8beec7  $source/pages/commons-category-timothy-m-rose.png" | sha256sum -c -
          echo "731a481c3d2d5617366f408c97b050354f941042212f1ec439162ecd8843b5a0  $source/pages/commons-phoenix-2016.png" | sha256sum -c -
          echo "8e1abd846182645a15fd7675df80ddbd8d8b38263b70e62315952d4733a7cd94  $source/pages/commons-celebration-europe-ii.png" | sha256sum -c -
      - name: Render exact performer portrait and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-146-render/discovery/card-backfill-uc-146-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-146-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-render"
          cat scripts/card-backfill-uc-146-render.part-00.mjs scripts/card-backfill-uc-146-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-146-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact portraits, identity receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-146-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-146-render/output
            ${{ runner.temp }}/card-backfill-uc-146-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
