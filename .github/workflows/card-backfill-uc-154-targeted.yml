name: card-backfill-uc-154-targeted

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-154-TARGETED.json"
      - ".github/CARD-BACKFILL-UC-154-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-154-targeted.mjs"
      - ".github/workflows/card-backfill-uc-154-targeted.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-154-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-033'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-033
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-154 targeted authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-154-TARGETED.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-154-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-154');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-154');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_067190c9e8aa5e6b9b695e62');
          if(row.version!==1||row.record_id!=='UC-154'||row.actor!=='Tyler Mane'||row.character!=='Michael Myers'||row.production!=='Halloween (2007)'||row.years!=='2007–2009'||row.side!=='still')throw new Error('UC-154 targeted authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-154'||failures.failed_discovery_checkpoints?.length!==1||failures.failed_discovery_checkpoints[0]?.run_id!==30418187741||failures.failed_discovery_checkpoints[0]?.artifact_id!==8710917909||failures.failed_discovery_checkpoints[0]?.artifact_digest_sha256!=='8bfe5bde41fa92d89802166b9cbc388c0f0549fb39da5ac4e0fe88a27fb547fc')throw new Error('UC-154 rejected broad discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8710537497||row.scope_artifact?.artifact_id!==8710630547||row.rejected_broad_discovery?.artifact_id!==8710917909||row.rejected_broad_discovery?.pinned_candidate_sha256!=='a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28')throw new Error('UC-154 targeted custody drift');
          if(row.pages?.length!==4||row.exact_candidate?.sha256!=='a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28'||row.exact_candidate?.bytes!==56506||row.exact_candidate?.width!==1080||row.exact_candidate?.height!==720)throw new Error('UC-154 exact candidate denominator drift');
          if(row.selection_contract?.exact_single_candidate_required!==true||row.selection_contract?.halloween_2007_first_film_required!==true||row.selection_contract?.mixed_gallery_inventory_forbidden!==true||row.selection_contract?.halloween_ii_2009_substitute_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-154 targeted selection contract drift');
          if(!specimen||specimen.actor!=='Tyler Mane'||specimen.character!=='Michael Myers'||specimen.production!=='Halloween (2007)'||specimen.years!=='2007–2009'||specimen.still||specimen.portrait?.src!=='images/uc-154-portrait.jpg')throw new Error('UC-154 specimen boundary drift');
          if(source?.still)throw new Error('UC-154 source-ledger still boundary drift');
          if(!audit||audit.wall_id!=='UC-154'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-154 audit boundary drift');
          console.log('PASS — exact UC-154 caption-local first-film target authorized');
          NODE
      - name: Gather exact caption-local candidate and custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-154-targeted
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-154-targeted.mjs
          node scripts/card-backfill-uc-154-targeted.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-154-targeted-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact source, page receipts, hashes, and review sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-154-targeted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-154-targeted
            ${{ runner.temp }}/card-backfill-uc-154-targeted-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
