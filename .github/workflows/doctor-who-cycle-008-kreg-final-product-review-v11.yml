name: doctor-who-cycle-008-kreg-final-product-review-v11

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-final-product-review-v11.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-final-product-review-v11-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-final-product-review-v11'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-final-product-review-v11.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-final-product-review-v11
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      V10_BRANCH: agent/doctor-who-cycle-008-kreg-finalization-prototype-v10
      V10_WORKFLOW: doctor-who-cycle-008-kreg-finalization-prototype-v10
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-review-v11
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      MEDIA_BYTES: "67113"
      EXPECTED_PATHS: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-file final review and live main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,review,diagnostics,work}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          base="$1"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test "$(git diff --name-only "$base"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); pr=json.loads((root/'api/pr.json').read_text()); files=json.loads((root/'api/pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf '%s\n' "$base" > "$OUT/review-main.txt"
          printf 'REVIEW_MAIN=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Retain exact terminal V10 prototype
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 900); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$V10_BRANCH&event=pull_request&per_page=100" > "$OUT/api/v10-runs.json"
            row="$(jq -c --arg name "$V10_WORKFLOW" --arg branch "$V10_BRANCH" '[.workflow_runs[] | select(.name==$name and .head_branch==$branch)] | sort_by(.created_at) | last // empty' "$OUT/api/v10-runs.json")"
            if [ -n "$row" ] && [ "$(jq -r '.status' <<<"$row")" = completed ]; then
              printf '%s\n' "$row" > "$OUT/source/v10-run.json"
              break
            fi
            sleep 20
          done
          test -s "$OUT/source/v10-run.json"
          run="$(jq -r '.id' "$OUT/source/v10-run.json")"
          attempt="$(jq -r '.run_attempt' "$OUT/source/v10-run.json")"
          conclusion="$(jq -r '.conclusion' "$OUT/source/v10-run.json")"
          head="$(jq -r '.head_sha' "$OUT/source/v10-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$OUT/source/v10-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/source/v10-artifacts.json"
          artifact="$(jq -c --arg name "doctor-who-cycle-008-kreg-finalization-prototype-v10-$run-attempt-$attempt" '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0] else empty end' "$OUT/source/v10-artifacts.json")"
          test -n "$artifact"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/source/v10.zip"
          ZIP="$OUT/source/v10.zip" TARGET="$OUT/source/v10" python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  data=f.read(i); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          printf 'V10_RUN=%s\nV10_ATTEMPT=%s\nV10_CONCLUSION=%s\nV10_HEAD=%s\nV10_ARTIFACT=%s\nV10_ARTIFACT_DIGEST=%s\n' \
            "$run" "$attempt" "$conclusion" "$head" "$artifact_id" "$artifact_digest" >> "$GITHUB_ENV"
          test "$conclusion" = success

      - name: Verify prototype packet and self-hashed receipt
        shell: bash
        run: |
          set -euo pipefail
          prototype="$OUT/source/v10/prototype"
          receipt="$prototype/finalization-prototype-receipt.json"
          for p in "$receipt" "$prototype/final-product.bundle" "$prototype/final-product.patch" "$prototype/final-product.tar.gz" "$prototype/final-product-files.json" "$prototype/final-product-paths.txt" "$prototype/SHA256SUMS.pre" "$prototype/SHA256SUMS"; do test -f "$p"; done
          PROTOTYPE="$prototype" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['PROTOTYPE'])
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest,original=line.split(None,1); rel=original.split('/prototype/',1)[-1]; p=root/rel
              assert p.is_file(),rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,rel
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          receipt=json.loads((root/'finalization-prototype-receipt.json').read_text()); identity=receipt.pop('identity')
          assert hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          assert receipt['status']=='qualified-finalization-prototype'
          assert receipt['task']==os.environ['TASK_ID'] and receipt['lease']==os.environ['LEASE_ID'] and receipt['wall_id']==os.environ['WALL_ID']
          assert receipt['candidate_path_count']==40 and receipt['finalization_path_count']==8 and receipt['final_path_count']==48
          assert receipt['repository_write'] is False and receipt['merge_authority'] is False and receipt['cycle_009_authorized'] is False and receipt['outside_human_dependency'] is False
          (root/'finalization-prototype-receipt.verified.json').write_text(json.dumps({**receipt,'identity':identity},indent=2,sort_keys=True)+'\n')
          PY
          cp "$prototype/finalization-prototype-receipt.verified.json" "$OUT/review/v10-prototype-receipt.json"
          test "$(wc -l < "$prototype/final-product-paths.txt")" = "$EXPECTED_PATHS"
          jq -r '.prototype_main' "$receipt" > "$OUT/source/prototype-main.txt"
          jq -r '.final_commit' "$receipt" > "$OUT/source/original-final-commit.txt"
          jq -r '.final_tree' "$receipt" > "$OUT/source/original-final-tree.txt"
          jq -r '.cycle_id' "$receipt" > "$OUT/source/cycle-id.txt"

      - name: Reconstruct exact prototype commit and verify all forty-eight files
        shell: bash
        run: |
          set -euo pipefail
          prototype="$OUT/source/v10/prototype"
          base="$(cat "$OUT/source/prototype-main.txt")"
          final="$(cat "$OUT/source/original-final-commit.txt")"
          tree="$(cat "$OUT/source/original-final-tree.txt")"
          git fetch --no-tags --filter=blob:none origin "$base"
          git worktree add --detach "$OUT/work/original" "$base"
          git -C "$OUT/work/original" bundle verify "$prototype/final-product.bundle" > "$OUT/diagnostics/bundle-verify.txt"
          git -C "$OUT/work/original" fetch "$prototype/final-product.bundle" cycle008-kreg-final-product:refs/heads/v11-original-final
          test "$(git -C "$OUT/work/original" rev-parse refs/heads/v11-original-final)" = "$final"
          test "$(git -C "$OUT/work/original" show -s --format=%P "$final")" != ''
          test "$(git -C "$OUT/work/original" rev-parse "$final^{tree}")" = "$tree"
          git -C "$OUT/work/original" diff --name-only "$base".."$final" | LC_ALL=C sort > "$OUT/review/original-final-paths.txt"
          diff -u "$prototype/final-product-paths.txt" "$OUT/review/original-final-paths.txt"
          ROOT="$OUT" REPO="$OUT/work/original" FINAL="$final" python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['ROOT']); repo=Path(os.environ['REPO']); final=os.environ['FINAL']; prototype=root/'source/v10/prototype'
          paths=(root/'review/original-final-paths.txt').read_text().splitlines(); rows=json.loads((prototype/'final-product-files.json').read_text())
          assert [r['path'] for r in rows]==paths
          for r in rows:
              data=subprocess.check_output(['git','-C',str(repo),'show',f'{final}:{r["path"]}'])
              blob=subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{final}:{r["path"]}'],text=True).strip()
              mode=subprocess.check_output(['git','-C',str(repo),'ls-tree',final,'--',r['path']],text=True).split()[0]
              assert len(data)==r['bytes'] and hashlib.sha256(data).hexdigest()==r['sha256'] and blob==r['git_blob'] and mode==r['git_mode']
          with tarfile.open(prototype/'final-product.tar.gz','r:gz') as tf:
              members=tf.getmembers(); names=[m.name for m in members]
              assert names==paths and len(names)==len(set(names))
              for m in members:
                  p=Path(m.name); assert not p.is_absolute() and '..' not in p.parts and m.isfile() and not m.issym() and not m.islnk()
                  data=tf.extractfile(m).read(); expected=subprocess.check_output(['git','-C',str(repo),'show',f'{final}:{m.name}'])
                  assert data==expected,m.name
          PY
          git worktree add --detach "$OUT/work/patch" "$base"
          git -C "$OUT/work/patch" apply --check "$prototype/final-product.patch"
          git -C "$OUT/work/patch" apply --index "$prototype/final-product.patch"
          test "$(git -C "$OUT/work/patch" write-tree)" = "$tree"

      - name: Recompose exact final product over final-review main
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          prototype="$OUT/source/v10/prototype"
          source_main="$(cat "$OUT/source/prototype-main.txt")"
          git merge-base --is-ancestor "$source_main" "$REVIEW_MAIN"
          git diff --name-only "$source_main".."$REVIEW_MAIN" | LC_ALL=C sort > "$OUT/review/main-delta-paths.txt"
          comm -12 "$prototype/final-product-paths.txt" "$OUT/review/main-delta-paths.txt" > "$OUT/review/main-product-overlap.txt"
          test ! -s "$OUT/review/main-product-overlap.txt"
          git worktree add --detach "$OUT/work/reviewed" "$REVIEW_MAIN"
          tar -xzf "$prototype/final-product.tar.gz" -C "$OUT/work/reviewed"
          git -C "$OUT/work/reviewed" add --pathspec-from-file="$prototype/final-product-paths.txt"
          git -C "$OUT/work/reviewed" config user.name undercast-cycle-008-final-reviewer
          git -C "$OUT/work/reviewed" config user.email cycle-008-final-reviewer@users.noreply.github.com
          git -C "$OUT/work/reviewed" commit -m 'Doctor Who: independently review cycle 008 Kreg final product' >/dev/null
          reviewed="$(git -C "$OUT/work/reviewed" rev-parse HEAD)"
          test "$(git -C "$OUT/work/reviewed" show -s --format=%P HEAD)" = "$REVIEW_MAIN"
          git -C "$OUT/work/reviewed" diff --name-only "$REVIEW_MAIN"..HEAD | LC_ALL=C sort > "$OUT/review/reviewed-final-paths.txt"
          diff -u "$prototype/final-product-paths.txt" "$OUT/review/reviewed-final-paths.txt"
          printf 'reviewed_commit=%s\n' "$reviewed" >> "$GITHUB_OUTPUT"

      - name: Independently verify permanent cycle-008 semantics
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/reviewed"
          reviewed='${{ steps.compose.outputs.reviewed_commit }}'
          cycle="$(cat "$OUT/source/cycle-id.txt")"
          test "$(git -C "$repo" show "$reviewed:images/uc-1353-still.jpg" | wc -c)" = "$MEDIA_BYTES"
          test "$(git -C "$repo" show "$reviewed:images/uc-1353-still.jpg" | sha256sum | awk '{print $1}')" = "$MEDIA_SHA256"
          git -C "$repo" grep -q "$TASK_ID" "$reviewed" -- data scripts docs package.json
          git -C "$repo" grep -q "$LEASE_ID" "$reviewed" -- data scripts docs package.json
          git -C "$repo" grep -q "$WALL_ID" "$reviewed" -- data scripts docs package.json
          git -C "$repo" grep -q "$cycle" "$reviewed" -- data scripts docs package.json
          test "$(git -C "$repo" show "$reviewed:data/journal/waterline.jsonl" | grep -c "$cycle")" -ge 1
          test "$(git -C "$repo" show "$reviewed:package.json" | grep -c 'doctor-who-cycle-008')" -ge 1
          test "$(git -C "$repo" show "$reviewed:scripts/doctor-who-cycle-008.mjs" | grep -c 'Kreg')" -ge 1
          node "$repo/scripts/doctor-who-cycle-008.mjs"
          node "$repo/scripts/doctor-who-cycle-007.mjs"
          test -z "$(git -C "$repo" status --porcelain)"

      - name: Run independent complete repository and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/reviewed"
          reviewed='${{ steps.compose.outputs.reviewed_commit }}'
          test "$(git -C "$repo" rev-parse HEAD)" = "$reviewed"
          cd "$repo"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/review/independent-final-gate.log"
          test -z "$(git status --porcelain)"

      - name: Seal approved-for-publication product packet
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/reviewed"
          reviewed='${{ steps.compose.outputs.reviewed_commit }}'
          paths="$OUT/review/reviewed-final-paths.txt"
          git -C "$repo" diff --binary "$REVIEW_MAIN".."$reviewed" > "$OUT/review/reviewed-final-product.patch"
          git -C "$repo" branch -f cycle008-kreg-reviewed-final "$reviewed"
          git -C "$repo" bundle create "$OUT/review/reviewed-final-product.bundle" cycle008-kreg-reviewed-final ^"$REVIEW_MAIN"
          ROOT="$OUT" REPO="$repo" REVIEWED="$reviewed" PATHS="$paths" python3 - <<'PY'
          import hashlib,io,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['ROOT']); repo=Path(os.environ['REPO']); reviewed=os.environ['REVIEWED']; paths=Path(os.environ['PATHS']).read_text().splitlines()
          rows=[]
          with tarfile.open(root/'review/reviewed-final-product.tar.gz','w:gz',compresslevel=9) as tf:
              for path in paths:
                  data=subprocess.check_output(['git','-C',str(repo),'show',f'{reviewed}:{path}'])
                  blob=subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{reviewed}:{path}'],text=True).strip()
                  mode=subprocess.check_output(['git','-C',str(repo),'ls-tree',reviewed,'--',path],text=True).split()[0]
                  info=tarfile.TarInfo(path); info.size=len(data); info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''; info.mode=int(mode,8)&0o7777
                  tf.addfile(info,io.BytesIO(data)); rows.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':blob,'git_mode':mode})
          (root/'review/reviewed-final-product-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          receipt={
            'status':'approved-for-publication','task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall_id':os.environ['WALL_ID'],
            'cycle_id':(root/'source/cycle-id.txt').read_text().strip(),'review_main':os.environ['REVIEW_MAIN'],
            'reviewed_commit':reviewed,'reviewed_tree':subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{reviewed}^{{tree}}'],text=True).strip(),
            'path_count':len(paths),'v10_run':int(os.environ['V10_RUN']),'v10_attempt':int(os.environ['V10_ATTEMPT']),
            'v10_head':os.environ['V10_HEAD'],'v10_artifact':int(os.environ['V10_ARTIFACT']),'v10_artifact_digest':os.environ['V10_ARTIFACT_DIGEST'],
            'independent_final_gate':'pass','media_sha256':os.environ['MEDIA_SHA256'],
            'queue_before':{'queued':309,'resolved':7,'in_flight':0},'queue_after':{'queued':308,'resolved':8,'in_flight':0},
            'repository_write':False,'merge_authority':False,'cycle_009_authorized':False,'outside_human_dependency':False,
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'review/publication-review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/review" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/review/SHA256SUMS.pre"
          sha256sum "$OUT/review/SHA256SUMS.pre" > "$OUT/review/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$REVIEW_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"

      - name: Retain terminal evidence and remove worktrees
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in original patch reviewed; do
            work="$OUT/work/$name"
            if [ -d "$work" ]; then
              git -C "$work" status --short > "$OUT/diagnostics/$name-final-status.txt" || true
              git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
            fi
          done
          rm -rf "$OUT/work"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V11 final-product review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-review-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-review-v11
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
