name: card-backfill-uc-060-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-060-APPLY.json"
      - "scripts/card-backfill-uc-060-apply.mjs"
      - ".github/workflows/card-backfill-uc-060-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-060-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-009'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-009
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-060-APPLY.json','utf8'));
          if(c.version!==1||c.record_id!=='UC-060'||c.actor!=='Ray Park'||c.side!=='still'||c.reviewed_role!=='second-desk')throw new Error('UC-060 apply authorization drift');
          if(c.render_artifact?.artifact_id!==8635232890||c.render_artifact?.head_sha!=='22a8dd752013d7e70c0511cc02e4021084bd6781')throw new Error('UC-060 render custody drift');
          if(c.expected?.candidate_sha256!=='1322a48f78fc796695284a8932a006eb4abebfadf02d782378818f358836d442')throw new Error('UC-060 candidate drift');
          if(c.expected?.crop_preview_sha256!=='2c763488a1e33df86abe08e0689193dfcb54fdddaede9382152027c76050fc88')throw new Error('UC-060 crop drift');
          console.log('PASS — exact UC-060 evidence candidate authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-060-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8635232890/zip" > "$root/render.zip"
          echo "4d13eb6322e58b0a06dc2a864c113fe02a90b85cc9147cc1cf61c2510af875c9  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          test -f "$root/source/output/manifest.json"
          echo "1322a48f78fc796695284a8932a006eb4abebfadf02d782378818f358836d442  $root/source/output/uc-060-still-candidate.jpg" | sha256sum -c -
          echo "2c763488a1e33df86abe08e0689193dfcb54fdddaede9382152027c76050fc88  $root/source/output/card-crop-preview.jpg" | sha256sum -c -
          echo "7974614d8ba7e9a14607d276a8e70281654cb7fa188c6d6b77951939523d869a  $root/source/output/source-page.png" | sha256sum -c -
          echo "a549994730725fc058a510eb99bec29384198b11dbfd85e74b72e7a58d9230aa  $root/source/output/manifest.json" | sha256sum -c -
          echo "f56bb6e58f9d01ea3fbc004be1d54b91a1326634c60283cf15146abbb4825382  $root/source/output/duplicate-scan.json" | sha256sum -c -
          echo "4283c57d842a98936fb78b51ecf6bb00f4829aedabce38ea57800eda330d7109  $root/source/output/review.json" | sha256sum -c -
          echo "1c71e88c65f743a0312545dc928a28b826d9613aa5041b01efae1f74ba1cd7ab  $root/source/output/review.md" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-060-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-060-apply"
          node scripts/card-backfill-uc-060-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-060-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(r=>r.id==='UC-060');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(r=>r.id==='UC-060');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(r=>r.id==='ma_6f881c41a40205bbf89d547a');
          if(!specimen||specimen.still)throw new Error('UC-060 specimen mutated');
          if(source?.still)throw new Error('UC-060 source ledger mutated');
          if(!audit||audit.wall_id!=='UC-060'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-060 audit mutated');
          console.log('PASS — UC-060 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire temporary operators
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-060.json \
            .github/CARD-BACKFILL-UC-060-POSTERS.json \
            .github/CARD-BACKFILL-UC-060-HIRES.json \
            .github/CARD-BACKFILL-UC-060-RENDER.json \
            .github/CARD-BACKFILL-UC-060-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-060-discover.yml \
            .github/workflows/card-backfill-uc-060-posters.yml \
            .github/workflows/card-backfill-uc-060-hires.yml \
            .github/workflows/card-backfill-uc-060-render.yml \
            .github/workflows/card-backfill-uc-060-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-060-discover.mjs \
            scripts/card-backfill-uc-060-posters.mjs \
            scripts/card-backfill-uc-060-hires.mjs \
            scripts/card-backfill-uc-060-render.mjs \
            scripts/card-backfill-uc-060-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-060 Darth Maul still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-008...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do case "$path" in data/review/card-backfill/UC-060/*) ;; *) echo "unexpected path: $path" >&2; exit 1;; esac; done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-060-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-060-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-009
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-060-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-060-apply
            data/review/card-backfill/UC-060
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
