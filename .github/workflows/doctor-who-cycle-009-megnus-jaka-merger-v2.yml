name: doctor-who-cycle-009-megnus-jaka-merger-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-merger-v2
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-merger-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v2
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v2.yml
      PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
      PRODUCT_PR: "692"
      PRODUCT_COMMIT: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      PRODUCT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      PRODUCT_PATH_COUNT: "48"
      PUBLISHER_PR: "691"
      PUBLISHER_HEAD: 63d5a4dab96432cbb43e7d64b4a2638d9d0fb713
      PUBLISHER_RUN: "31280432624"
      PUBLISHER_QUALIFY_JOB: "93160723115"
      PUBLISHER_WRITE_JOB: "93161024296"
      PUBLICATION_ARTIFACT: "9028284902"
      PUBLICATION_ARTIFACT_DIGEST: sha256:d5fd3298ffa08c3bfa24b7749dcf3f860e3c69fbf4efc2d5cd083432c89c2714
      PUBLICATION_IDENTITY: f546c29c519104d908a6a3b9b2c0079d28e955f86e6801ae36ca63facf9b5be2
      REVIEW_PR: "690"
      REVIEW_RUN: "31279792874"
      REVIEW_JOB: "93159152310"
      REVIEW_ARTIFACT: "9028102730"
      REVIEW_ARTIFACT_SHA256: 33e7e74ed3d2dedff1f9cb75ed78df84be1bc7e9fc051b080f063cf780fcfbf7
      APPROVAL_IDENTITY: 2f107d8545431dcf178765a32b865fcec7018e704bc4fc73477681f383f0e819
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_4ca825307ad0d4510f44c7d9
      WALL_ID: UC-1354
      CYCLE_ID: cycle_42b1d086ae8eab34f09827dc
      WATERLINE_EVENT: waterline_4efd5e425f182ff9b1a81bce
      PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      REQUIRED_CHECKS: archive-contract,publisher-custody,publisher-custody-or-guard
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact guardian and publication receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,publication,settlement}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXPECTED_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXPECTED_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXPECTED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN" > "$OUT/api/publisher-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT" > "$OUT/api/publication-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT/zip" > "$OUT/publication.zip"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXPECTED_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          run=json.loads((root/'api/publisher-run.json').read_text())
          jobs=json.loads((root/'api/publisher-jobs.json').read_text())['jobs']
          artifact=json.loads((root/'api/publication-artifact.json').read_text())
          assert run['id']==int(os.environ['PUBLISHER_RUN']) and run['name']=='doctor-who-cycle-009-megnus-jaka-final-publisher-v1'
          assert run['head_sha']==os.environ['PUBLISHER_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          by={row['name']:row for row in jobs}
          assert set(by)=={'qualify','publish'}
          assert by['qualify']['id']==int(os.environ['PUBLISHER_QUALIFY_JOB']) and by['qualify']['conclusion']=='success'
          assert by['publish']['id']==int(os.environ['PUBLISHER_WRITE_JOB']) and by['publish']['conclusion']=='success'
          assert artifact['id']==int(os.environ['PUBLICATION_ARTIFACT']) and artifact['expired'] is False
          assert artifact['workflow_run']['id']==int(os.environ['PUBLISHER_RUN']) and artifact['workflow_run']['head_sha']==os.environ['PUBLISHER_HEAD']
          assert artifact['digest']==os.environ['PUBLICATION_ARTIFACT_DIGEST']
          assert hashlib.sha256((root/'publication.zip').read_bytes()).hexdigest()==os.environ['PUBLICATION_ARTIFACT_DIGEST'].removeprefix('sha256:')
          target=root/'publication'
          with zipfile.ZipFile(root/'publication.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              assert sorted(row.filename for row in infos if not row.is_dir())==['SHA256SUMS','SHA256SUMS.pre','bundle-verify.log','publication.json']
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          publication=json.loads((target/'publication.json').read_text())
          identity=publication.pop('identity')
          assert identity==os.environ['PUBLICATION_IDENTITY']
          assert hashlib.sha256(json.dumps(publication,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          publication['identity']=identity
          assert publication['status']=='cycle-009-megnus-jaka-exact-product-published'
          assert publication['canonical_parent']==os.environ['EXPECTED_MAIN']
          assert publication['carrier_pr']==int(os.environ['PUBLISHER_PR']) and publication['carrier_head']==os.environ['PUBLISHER_HEAD']
          assert publication['publication_run']==int(os.environ['PUBLISHER_RUN']) and publication['publication_attempt']==1
          assert publication['product_ref']=='refs/heads/'+os.environ['PRODUCT_BRANCH'] and publication['product_ref_sha']==os.environ['PRODUCT_COMMIT']
          assert publication['product']['commit']==os.environ['PRODUCT_COMMIT'] and publication['product']['tree']==os.environ['PRODUCT_TREE']
          assert publication['product']['paths']==int(os.environ['PRODUCT_PATH_COUNT']) and publication['product_published'] is True
          source=publication['source_review']
          assert source['pr']==int(os.environ['REVIEW_PR']) and source['run']==int(os.environ['REVIEW_RUN']) and source['job']==int(os.environ['REVIEW_JOB'])
          assert source['artifact']==int(os.environ['REVIEW_ARTIFACT']) and source['artifact_sha256']==os.environ['REVIEW_ARTIFACT_SHA256']
          assert source['approval_identity']==os.environ['APPROVAL_IDENTITY']
          assert publication['force_update'] is False and publication['main_mutated'] is False and publication['cycle_010_authorized'] is False
          (root/'settlement/publication.bound.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Bind exact workflow-free product and required checks
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR/files?per_page=100" > "$OUT/api/product-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" > "$OUT/api/product-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$PRODUCT_COMMIT" > "$OUT/api/product-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$EXPECTED_MAIN...$PRODUCT_COMMIT" > "$OUT/api/product-compare.json"
          ready=false
          for _ in $(seq 1 80); do
            gh api "/repos/$GITHUB_REPOSITORY/commits/$PRODUCT_COMMIT/check-runs?per_page=100" > "$OUT/api/product-checks.json"
            if ROOT="$OUT" REQUIRED="$REQUIRED_CHECKS" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/product-checks.json').read_text())['check_runs']
          by={row['name']:row for row in rows}
          for name in os.environ['REQUIRED'].split(','):
              if name not in by or by[name]['status']!='completed' or by[name]['conclusion']!='success': sys.exit(1)
          PY
            then ready=true; break; fi
            sleep 15
          done
          test "$ready" = true
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/product-pr.json').read_text())
          files=json.loads((root/'api/product-files.json').read_text())
          ref=json.loads((root/'api/product-ref.json').read_text())
          commit=json.loads((root/'api/product-commit.json').read_text())
          compare=json.loads((root/'api/product-compare.json').read_text())
          assert pr['number']==int(os.environ['PRODUCT_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXPECTED_MAIN']
          assert pr['head']['ref']==os.environ['PRODUCT_BRANCH'] and pr['head']['sha']==os.environ['PRODUCT_COMMIT']
          assert pr['commits']==1 and pr['changed_files']==int(os.environ['PRODUCT_PATH_COUNT'])
          assert ref['object']['sha']==os.environ['PRODUCT_COMMIT']
          assert [row['sha'] for row in commit['parents']]==[os.environ['EXPECTED_MAIN']] and commit['tree']['sha']==os.environ['PRODUCT_TREE']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          paths=sorted(row['filename'] for row in compare['files'])
          assert len(paths)==int(os.environ['PRODUCT_PATH_COUNT']) and sorted(row['filename'] for row in files)==paths
          assert not any(path.startswith('.github/workflows/') or path.startswith('tmp/') or path.startswith('transport/') for path in paths)
          (root/'settlement/product-paths.txt').write_text(''.join(path+'\n' for path in paths))
          checks=json.loads((root/'api/product-checks.json').read_text())['check_runs']; by={row['name']:row for row in checks}
          receipt={name:{'id':by[name]['id'],'status':by[name]['status'],'conclusion':by[name]['conclusion'],'details_url':by[name]['details_url']} for name in os.environ['REQUIRED_CHECKS'].split(',')}
          (root/'settlement/product-checks.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'settlement/product-paths.sha256').write_text(hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest()+'\n')
          PY

      - name: Rerun permanent and rendered product gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$PRODUCT_COMMIT"
          git checkout --detach "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T HEAD)" = "$PRODUCT_TREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/settlement/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/settlement/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/settlement/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/settlement/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/settlement/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/settlement/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/settlement/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/settlement/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/settlement/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/settlement/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/settlement/waterline-status.json" >/dev/null
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          state=json.load(open('data/AUTOPILOT.json'))
          job=next(row for row in state['jobs'] if row['id']==os.environ['TASK_ID'])
          assert job['status']=='resolved' and job['role_on_wall'] is True and job['wall_ids']==[os.environ['WALL_ID']]
          assert job['outcome']['kind']=='audited-wall' and job['outcome']['media_review']['lease_id']==os.environ['LEASE_ID']
          card=next(row for row in json.load(open('data/specimens.json')) if row['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Megnus Jaka' and card['kind']=='voice' and 'still' not in card
          assert card['portrait']['src']=='images/uc-1354-portrait.jpg'
          assert hashlib.sha256(Path(card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.load(open('data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json'))
          assert receipt['transaction']=='DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA' and receipt['canonical_parent']==os.environ['EXPECTED_MAIN']
          assert receipt['task']['id']==os.environ['TASK_ID'] and receipt['task']['performer']=='Dan Starkey' and receipt['task']['role']=='Megnus Jaka' and receipt['task']['performance_mode']=='voice'
          assert receipt['lease']['id']==os.environ['LEASE_ID']
          assert receipt['canonical']['wall_id']==os.environ['WALL_ID'] and receipt['canonical']['record']['id']==os.environ['WALL_ID']
          assert receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID'] and receipt['reviewed_cycle']['event_id']==os.environ['WATERLINE_EVENT'] and receipt['reviewed_cycle']['outcome']=='completed'
          assert receipt['queue']['before']=={'total':316,'queued':308,'resolved':8,'in_flight':0}
          assert receipt['queue']['after']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert receipt['boundary']['cycle_010_authorized'] is False and receipt['boundary']['tenth_lease_issued'] is False
          PY
          npm run gate 2>&1 | tee "$OUT/settlement/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/settlement/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

      - name: Seal code-free exact fast-forward settlement
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          publication=json.loads((root/'settlement/publication.bound.json').read_text())
          paths=(root/'settlement/product-paths.txt').read_text().splitlines()
          checks=json.loads((root/'settlement/product-checks.json').read_text())
          receipt={
            'status':'cycle-009-megnus-jaka-exact-fast-forward-approved-v2',
            'verify_run':int(os.environ['GITHUB_RUN_ID']),
            'verify_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'canonical_parent':os.environ['EXPECTED_MAIN'],
            'product_pr':int(os.environ['PRODUCT_PR']),
            'product_branch':os.environ['PRODUCT_BRANCH'],
            'product_commit':os.environ['PRODUCT_COMMIT'],
            'product_tree':os.environ['PRODUCT_TREE'],
            'product_path_count':len(paths),
            'product_paths_sha256':hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest(),
            'publisher_run':int(os.environ['PUBLISHER_RUN']),
            'publication_artifact':int(os.environ['PUBLICATION_ARTIFACT']),
            'publication_artifact_digest':os.environ['PUBLICATION_ARTIFACT_DIGEST'],
            'publication_identity':publication['identity'],
            'product_checks':checks,
            'task_id':os.environ['TASK_ID'],
            'lease_id':os.environ['LEASE_ID'],
            'wall_id':os.environ['WALL_ID'],
            'cycle_id':os.environ['CYCLE_ID'],
            'force_update':False,
            'main_mutated':False,
            'cycle_010_authorized':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'settlement/settlement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/settlement" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/settlement/$rel" | sed "s#  $OUT/settlement/#  #"; done > "$OUT/settlement/SHA256SUMS.pre"
          sha256sum "$OUT/settlement/SHA256SUMS.pre" | sed "s#  $OUT/settlement/#  #" > "$OUT/settlement/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v2-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  fast_forward:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
      REQUIRED_CHECKS: archive-contract,publisher-custody,publisher-custody-or-guard
      SETTLEMENT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2-settlement
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2-merge

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v2-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2-settlement

      - name: Reverify settlement and non-forcedly fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          SETTLEMENT="$SETTLEMENT" OUT="$OUT" python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ['SETTLEMENT']); out=Path(os.environ['OUT'])
          repo=os.environ['GITHUB_REPOSITORY']; base=os.environ['EXPECTED_MAIN']; branch=os.environ['PRODUCT_BRANCH']
          def gh(method,path,payload=None):
              cmd=['gh','api']
              if method!='GET': cmd+=['--method',method]
              cmd.append(path)
              if payload is None: proc=subprocess.run(cmd,check=True,capture_output=True,text=True)
              else: proc=subprocess.run(cmd+['--input','-'],input=json.dumps(payload),check=True,capture_output=True,text=True)
              return json.loads(proc.stdout) if proc.stdout.strip() else None
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement.json').read_text())
          identity=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          settlement['identity']=identity
          publication=json.loads((root/'publication.bound.json').read_text())
          pub_identity=publication.pop('identity')
          assert hashlib.sha256(json.dumps(publication,sort_keys=True,separators=(',',':')).encode()).hexdigest()==pub_identity
          publication['identity']=pub_identity
          paths=(root/'product-paths.txt').read_text().splitlines()
          assert settlement['status']=='cycle-009-megnus-jaka-exact-fast-forward-approved-v2'
          assert settlement['verify_run']==int(os.environ['GITHUB_RUN_ID']) and settlement['verify_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert settlement['canonical_parent']==base==publication['canonical_parent']
          assert settlement['product_branch']==branch and publication['product_ref']=='refs/heads/'+branch
          assert settlement['product_commit']==publication['product']['commit']==publication['product_ref_sha']
          assert settlement['product_tree']==publication['product']['tree']
          assert settlement['product_path_count']==publication['product']['paths']==len(paths)
          assert settlement['product_paths_sha256']==hashlib.sha256((root/'product-paths.txt').read_bytes()).hexdigest()
          assert settlement['publication_identity']==publication['identity']
          assert settlement['force_update'] is False and settlement['main_mutated'] is False and settlement['cycle_010_authorized'] is False
          main=gh('GET',f'/repos/{repo}/git/ref/heads/main'); assert main['object']['sha']==base
          product_ref=gh('GET',f'/repos/{repo}/git/ref/heads/{branch}'); assert product_ref['object']['sha']==settlement['product_commit']
          commit=gh('GET',f'/repos/{repo}/git/commits/{settlement["product_commit"]}')
          assert [row['sha'] for row in commit['parents']]==[base] and commit['tree']['sha']==settlement['product_tree']
          compare=gh('GET',f'/repos/{repo}/compare/{base}...{settlement["product_commit"]}')
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert sorted(row['filename'] for row in compare['files'])==sorted(paths)
          pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==base and pr['head']['sha']==settlement['product_commit'] and pr['commits']==1 and pr['changed_files']==settlement['product_path_count']
          checks=gh('GET',f'/repos/{repo}/commits/{settlement["product_commit"]}/check-runs?per_page=100')['check_runs']
          by={row['name']:row for row in checks}
          for name in os.environ['REQUIRED_CHECKS'].split(','):
              assert name in by and by[name]['status']=='completed' and by[name]['conclusion']=='success'
          gh('PATCH',f'/repos/{repo}/git/refs/heads/main',{'sha':settlement['product_commit'],'force':False})
          for _ in range(60):
              main=gh('GET',f'/repos/{repo}/git/ref/heads/main')
              if main['object']['sha']==settlement['product_commit']: break
              time.sleep(2)
          assert main['object']['sha']==settlement['product_commit']
          after=gh('GET',f'/repos/{repo}/compare/{base}...main')
          assert after['status']=='ahead' and after['ahead_by']==1 and after['behind_by']==0 and after['total_commits']==1
          assert sorted(row['filename'] for row in after['files'])==sorted(paths)
          for _ in range(30):
              pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
              if pr['state']=='closed': break
              time.sleep(2)
          if pr['state']!='closed':
              gh('PATCH',f'/repos/{repo}/pulls/{settlement["product_pr"]}',{'state':'closed'})
              pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
          assert pr['state']=='closed'
          receipt={'status':'cycle-009-megnus-jaka-canonically-fast-forwarded-v2','merge_run':int(os.environ['GITHUB_RUN_ID']),'merge_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'canonical_parent':base,'canonical_main':settlement['product_commit'],'canonical_tree':settlement['product_tree'],'canonical_path_count':settlement['product_path_count'],'product_pr':settlement['product_pr'],'product_pr_state':pr['state'],'product_pr_merged':pr['merged'],'settlement_identity':settlement['identity'],'force_update':False,'cycle_010_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'merge.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'settlement.bound.json').write_bytes((root/'settlement.json').read_bytes())
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v2-merge-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2-merge
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v2-merge-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v2-merge
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
