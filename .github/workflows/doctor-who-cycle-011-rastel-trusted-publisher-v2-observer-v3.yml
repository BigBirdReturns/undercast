name: doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALL_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      PUBLISHER_FILE: doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      PUBLISHER_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      PUBLISHER_NAME: doctor-who-cycle-011-rastel-trusted-publisher-v2
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3
      SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3
      SOURCE_RUN: "31350981825"
      SOURCE_JOB: "93341617829"
      SOURCE_HEAD: 8754c3fb878a95af71b5b1dd744d9e0b43fcee81
      SOURCE_ARTIFACT: "9048943524"
      SOURCE_DIGEST: "sha256:d255fa3b66596945e23b81f66433500789405943f9f7ec9a5849178f0174a160"
      NOT_BEFORE: 2026-08-10T02:53:00Z
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      CYCLE_ID: cycle_74cdc938b028a932a766d209

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind observer and immutable source authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,runs,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$INSTALL_MAIN"
          test "$(git rev-list --count "$INSTALL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALL_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALL_MAIN"...HEAD)" = $'A\t'"$SELF"
          git diff --name-status "$ORIGINAL_MAIN" "$INSTALL_MAIN" | LC_ALL=C sort > "$OUT/api/install-paths.tsv"
          printf 'A\t%s\nA\t%s\n' "$V1_PATH" "$V2_PATH" | LC_ALL=C sort > "$OUT/api/expected-install-paths.tsv"
          cmp "$OUT/api/install-paths.tsv" "$OUT/api/expected-install-paths.tsv"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > "$OUT/api/source-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_FILE" > "$OUT/api/publisher-workflow.json"
          CURRENT_HEAD="$head" OBSERVER_PR="$pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          pr=load('observer-pr.json'); job=load('source-job.json'); artifact=load('source-artifact.json'); workflow=load('publisher-workflow.json')
          assert pr['number']==int(os.environ['OBSERVER_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged_at'] is None
          assert pr['base']['ref']=='main' and pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert job['id']==int(os.environ['SOURCE_JOB']) and job['run_id']==int(os.environ['SOURCE_RUN']) and job['head_sha']==os.environ['SOURCE_HEAD']
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['SOURCE_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          assert workflow['path']==os.environ['PUBLISHER_PATH'] and workflow['name']==os.environ['PUBLISHER_NAME'] and workflow['state']=='active'
          (root/'workflow-id.txt').write_text(str(workflow['id'])+'\n')
          PY
          printf 'OBSERVER_HEAD=%s\nOBSERVER_PR=%s\nPUBLISHER_WORKFLOW_ID=%s\n' "$head" "$pr" "$(cat "$OUT/api/workflow-id.txt")" >> "$GITHUB_ENV"

      - name: Capture terminal publisher runs, jobs, logs, and artifacts
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while :; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$PUBLISHER_WORKFLOW_ID/runs?event=workflow_run&per_page=100" > "$OUT/api/runs.json"
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); source=json.loads((root/'api/runs.json').read_text()).get('workflow_runs',[])
          rows=[]
          for run in source:
              if run.get('created_at','') < os.environ['NOT_BEFORE']: continue
              rows.append({key:run.get(key) for key in ('id','name','event','status','conclusion','run_attempt','head_sha','head_branch','created_at','updated_at','path')})
          rows.sort(key=lambda row:(row['created_at'],row['id']))
          (root/'api/selected.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (root/'api/ids.txt').write_text(''.join(f"{row['id']}\n" for row in rows))
          (root/'api/terminal.txt').write_text(('true' if rows and all(row['status']=='completed' for row in rows) else 'false')+'\n')
          PY
            if [ "$(cat "$OUT/api/terminal.txt")" = true ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "publisher did not become terminal" >&2; exit 1; fi
            sleep 10
          done
          while read -r run; do
            test -n "$run"
            mkdir -p "$OUT/runs/$run"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$OUT/runs/$run/run.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=all&per_page=100" > "$OUT/runs/$run/jobs.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/runs/$run/artifacts.json"
            jq -r '.jobs[].id' "$OUT/runs/$run/jobs.json" | while read -r job; do
              gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$OUT/logs/run-$run-job-$job.log" || true
            done
          done < "$OUT/api/ids.txt"

      - name: Adjudicate exact publisher boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); selected=json.loads((root/'api/selected.json').read_text()); details=[]
          for row in selected:
              sub=root/'runs'/str(row['id']); run=json.loads((sub/'run.json').read_text()); jobs=json.loads((sub/'jobs.json').read_text()).get('jobs',[]); artifacts=json.loads((sub/'artifacts.json').read_text()).get('artifacts',[])
              details.append({'run':{key:run.get(key) for key in ('id','name','event','status','conclusion','run_attempt','head_sha','head_branch','created_at','updated_at','path')},'jobs':[{'id':job['id'],'name':job['name'],'status':job['status'],'conclusion':job['conclusion'],'steps':[{'name':step['name'],'status':step['status'],'conclusion':step['conclusion']} for step in (job.get('steps') or [])]} for job in jobs],'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts]})
          successes=[row for row in details if row['run']['conclusion']=='success']
          receipt={'status':'cycle-011-rastel-v2-publisher-observed-v3','version':3,'source':{'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'head':os.environ['SOURCE_HEAD'],'artifact':int(os.environ['SOURCE_ARTIFACT']),'digest':os.environ['SOURCE_DIGEST']},'publisher_runs':details,'successes':len(successes),'failures':len(details)-len(successes),'boundary':{'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/observer.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          if len(successes)!=1: raise SystemExit(f'expected one successful publisher run, got {len(successes)}')
          success=successes[0]; jobs={job['name']:job for job in success['jobs']}
          assert set(jobs)=={'verify','write'} and all(job['status']=='completed' and job['conclusion']=='success' for job in jobs.values())
          PY
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" != "$INSTALL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$live" > "$OUT/api/canonical.json"
          test "$(jq -r '.tree.sha' "$OUT/api/canonical.json")" = "$PRODUCT_TREE"
          test "$(jq -r '.parents|length' "$OUT/api/canonical.json")" = 1
          test "$(jq -r '.parents[0].sha' "$OUT/api/canonical.json")" = "$INSTALL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$ORIGINAL_MAIN...$live" > "$OUT/api/original-to-canonical.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$INSTALL_MAIN...$live" > "$OUT/api/install-to-canonical.json"
          LIVE="$live" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          original=load('original-to-canonical.json'); installed=load('install-to-canonical.json')
          assert original['status']=='ahead' and len(original['files'])==int(os.environ['PRODUCT_PATHS'])
          assert all(row['status']!='removed' and not row['filename'].startswith('.github/workflows/') for row in original['files'])
          assert installed['status']=='ahead' and installed['ahead_by']==1 and installed['behind_by']==0 and len(installed['commits'])==1 and installed['commits'][0]['sha']==os.environ['LIVE']
          assert len(installed['files'])==int(os.environ['PRODUCT_PATHS'])+2
          assert {row['filename'] for row in installed['files'] if row['status']=='removed'}=={os.environ['V1_PATH'],os.environ['V2_PATH']}
          PY
          for path in "$V1_PATH" "$V2_PATH"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$live" >/dev/null 2>&1; then echo "publisher survived: $path" >&2; exit 1; fi
          done
          grep -R -F "$SOURCE_RUN" "$OUT/logs" >/dev/null
          LIVE="$live" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); observed=json.loads((root/'receipt/observer.json').read_text())
          terminal={'status':'cycle-011-rastel-canonical-publication-proved-v3','version':3,'observer_identity':observed['identity'],'canonical_main':os.environ['LIVE'],'canonical_tree':os.environ['PRODUCT_TREE'],'product_paths':int(os.environ['PRODUCT_PATHS']),'cycle_id':os.environ['CYCLE_ID'],'queue':{'total':316,'queued':305,'resolved':11,'in_flight':0},'publisher_transports_absent':True,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          terminal['identity']=hashlib.sha256(json.dumps(terminal,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/terminal.json').write_text(json.dumps(terminal,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-observer-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0