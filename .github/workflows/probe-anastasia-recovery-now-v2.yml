name: probe-anastasia-recovery-now-v2

on:
  push:
    branches:
      - agent/observe-anastasia-recovery-v2

permissions:
  actions: read
  contents: write

env:
  TARGET_BRANCH: agent/star-trek-anastasia-finalizer-recovery-v2
  TARGET_HEAD: 582bd0f7b6dd264894c36208b7dd72ee04cced6b
  TARGET_WORKFLOW: .github/workflows/star-trek-anastasia-finalizer-recovery-v2.yml
  RESULT_BRANCH: agent/probe-anastasia-recovery-now-result-v2
  ROOT: /tmp/probe-anastasia-recovery-now-v2

jobs:
  probe:
    if: ${{ github.event.head_commit.message == 'Trigger Anastasia recovery live probe v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot exact recovery run
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100" | jq . > "$ROOT/branch-runs.json"
          run_id="$(jq -r --arg sha "$TARGET_HEAD" --arg path "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.head_sha==$sha and .path==$path)] | sort_by(.created_at) | last | .id // empty' "$ROOT/branch-runs.json")"
          if test -n "$run_id"; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" | jq . > "$ROOT/run.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq . > "$ROOT/jobs.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq . > "$ROOT/artifacts.json"
          else
            printf '{"status":"missing"}\n' > "$ROOT/run.json"
            printf '{"jobs":[]}\n' > "$ROOT/jobs.json"
            printf '{"artifacts":[]}\n' > "$ROOT/artifacts.json"
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/commits/main" | jq . > "$ROOT/main.json"
          jq -n \
            --arg status complete \
            --arg run_id "$run_id" \
            --arg run_status "$(jq -r '.status // "missing"' "$ROOT/run.json")" \
            --arg conclusion "$(jq -r '.conclusion // ""' "$ROOT/run.json")" \
            --arg main "$(jq -r .sha "$ROOT/main.json")" \
            --argjson jobs "$(jq '[.jobs[] | {id,name,status,conclusion}]' "$ROOT/jobs.json")" \
            --argjson artifacts "$(jq '[.artifacts[] | {id,name,digest,expired}]' "$ROOT/artifacts.json")" \
            '{version:1,transaction:"PROBE-ANASTASIA-RECOVERY-NOW-V2",status:$status,run:{id:(if $run_id=="" then null else ($run_id|tonumber) end),status:$run_status,conclusion:(if $conclusion=="" then null else $conclusion end)},main:$main,jobs:$jobs,artifacts:$artifacts,canonical_mutation:false,lease_taken:false}' \
            > "$ROOT/status.json"
          (cd "$ROOT" && find . -maxdepth 1 -type f ! -name manifest.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done > manifest.sha256 && sha256sum -c manifest.sha256)

      - name: Publish live probe
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name undercast-anastasia-recovery-probe
          git config user.email anastasia-recovery-probe@users.noreply.github.com
          git switch --orphan probe-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p transport/probe-anastasia-recovery-now-v2
          cp -a "$ROOT"/. transport/probe-anastasia-recovery-now-v2/
          git add transport/probe-anastasia-recovery-now-v2
          git commit -m 'Publish Anastasia recovery live probe'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
