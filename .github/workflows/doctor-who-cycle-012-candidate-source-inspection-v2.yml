      LOADER: /tmp/doctor-who-cycle-012-candidate-source-inspection-v2-loader
      CARRIER_BLOB: f79c9584fb626bd5d51ee2df3f0e533d7b35234a
      CARRIER_GZIP_BYTES: "8151"
      CARRIER_GZIP_SHA256: 9c004ba7d23ec8d22116e4985f8549a00100180789ab0f76871eec17030a4c88
      CARRIER_BYTES: "40528"
      CARRIER_SHA256: e5dbad314546b1e1da3e9756a770c7878242c34ce786a73c592564abd176476d
      CARRIER_PYTHON_BLOCKS: "10"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and execute exact read-only source inspection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/controller.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/controller.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/controller.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/controller.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/controller.sh.gz" > "$LOADER/controller.sh"
          test "$(wc -c < "$LOADER/controller.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/controller.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/controller.sh"
          CONTROLLER="$LOADER/controller.sh" python3 - <<'PY'
          import os
          import re
          import textwrap
          from pathlib import Path
          text = Path(os.environ['CONTROLLER']).read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == int(os.environ['CARRIER_PYTHON_BLOCKS'])
          for index, block in enumerate(blocks, 1):
              compile(textwrap.dedent(block), f'<cycle-012-source-inspection-v2-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/controller.sh"
          "$LOADER/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-candidate-source-inspection-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-candidate-source-inspection-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/api
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/failure-packet
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/v7-packet
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/source-recovery/api
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/source-recovery/source
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/review-packet
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2/payload
            /tmp/doctor-who-cycle-012-candidate-source-inspection-v2-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
