name: card-backfill-uc-111-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-111-APPLY.json"
      - "scripts/card-backfill-uc-111-apply.mjs"
      - ".github/workflows/card-backfill-uc-111-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-111-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-024'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-024
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Oompa Loompa collective packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-111-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-111');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-111');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_42a10c0cb46ab2d8dbdc0bff');
          if(row.version!==1||row.record_id!=='UC-111'||row.actor!=='Deep Roy'||row.character!=='The Oompa Loompas'||row.production!=='Charlie and the Chocolate Factory'||row.year!==2005||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-111 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8676276221||row.render_artifact?.head_sha!=='fab76f6cf1c9a4c0ee201390de47efdcfcda973c'||row.render_artifact?.zip_sha256!=='1d639426640107503b147be72874a0df7a145f91a8bd00ad2daacad591772430')throw new Error('UC-111 render custody drift');
          if(row.expected?.selected_source_sha256!=='6e2a8ec0f5edd7c3c28d495ab928ae2055bc97667dfff8b209eed48e7d5cef6d'||row.expected?.exact_role_record_sha256!=='73a94b3c0ab60c341da99bbf56fde8153afb516b8bdb7b34f5edb1f82417d456')throw new Error('UC-111 source authorization drift');
          if(row.expected?.candidate_sha256!=='a179667756d74d8a9adbd0e5e1484eae80a3fe272bb417ed8441583e9b542e62'||row.expected?.crop_preview_sha256!=='c999b5094d1ae2f885d7893634e1f27bc7dd22ba282edec00e6c4cb90d8f0cc6')throw new Error('UC-111 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==12||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-111 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='collective-character-depiction'||row.ruling?.crop_ruling!=='pass-collective-east-zoom-crop'||row.ruling?.multiplicity_ruling!=='pass-many-body-single-performer-mechanism'||row.ruling?.canonical_mutation!==false)throw new Error('UC-111 ruling drift');
          if(!specimen||specimen.actor!=='Deep Roy'||specimen.character!=='The Oompa Loompas'||specimen.production!=='Charlie and the Chocolate Factory'||specimen.years!=='2005'||specimen.still)throw new Error('UC-111 specimen boundary drift');
          if(source?.still)throw new Error('UC-111 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-111'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-111 audit boundary drift');
          console.log(`PASS — UC-111 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8676276221/zip" > "$root/render.zip"
          echo "1d639426640107503b147be72874a0df7a145f91a8bd00ad2daacad591772430  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-111"
          test -f "$base/manifest.json"
          echo "fb9950ea329374e71439cd5e5a97c7cb7e8c15269bdfe4b61663c92156c5a6e3  $base/manifest.json" | sha256sum -c -
          echo "ca332f127a6b28b1f2b079c05925d0b9edd1c2f37590cf8806488718422e134c  $base/duplicate-scan.json" | sha256sum -c -
          echo "135b6ee01677f62df1f204b405e9c81fd553b4d75edde3007f191638b1013b0e  $base/review.json" | sha256sum -c -
          echo "71998df1be35f801c2dfdcea788d4ba95a61d54d0966bcc9eea7bf70dc12b5be  $base/review.md" | sha256sum -c -
          echo "cdd680fbe3ea4c84101772007ee8f0b0ad995bf6d78d3aea7ac08a7c8cd0fe8c  $base/SHA256SUMS" | sha256sum -c -
          echo "73a94b3c0ab60c341da99bbf56fde8153afb516b8bdb7b34f5edb1f82417d456  $base/exact-role-record.json" | sha256sum -c -
          echo "6e2a8ec0f5edd7c3c28d495ab928ae2055bc97667dfff8b209eed48e7d5cef6d  $base/oompa-loompas-original.jpg" | sha256sum -c -
          echo "fe2237b48d3f5b8300d2600468be438d9f89392a342a02cf315474b3d2bcd488  $base/source-page-chocolate-river-collective-frame.png" | sha256sum -c -
          echo "a5a5617cee8a072c71d4d1be5f1326c855c68c2ac6db550e8e7ee369d7cacb4d  $base/source-page-warner-production-notes.png" | sha256sum -c -
          echo "6308b14b17000776e6130e0280dba0cfa0ff061a690437291a7a6aedc6c5f468  $base/source-page-afi-production-record.png" | sha256sum -c -
          echo "a179667756d74d8a9adbd0e5e1484eae80a3fe272bb417ed8441583e9b542e62  $base/uc-111-still-candidate.jpg" | sha256sum -c -
          echo "c999b5094d1ae2f885d7893634e1f27bc7dd22ba282edec00e6c4cb90d8f0cc6  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30327737460
          artifact_id=8676276221
          artifact_name=card-backfill-uc-111-render-30327737460
          artifact_zip_sha256=1d639426640107503b147be72874a0df7a145f91a8bd00ad2daacad591772430
          artifact_head_sha=fab76f6cf1c9a4c0ee201390de47efdcfcda973c
          source_manifest_sha256=fb9950ea329374e71439cd5e5a97c7cb7e8c15269bdfe4b61663c92156c5a6e3
          source_sums_sha256=cdd680fbe3ea4c84101772007ee8f0b0ad995bf6d78d3aea7ac08a7c8cd0fe8c
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-111-apply/source/output/UC-111
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-apply"
          node --check scripts/card-backfill-uc-111-apply.mjs
          node scripts/card-backfill-uc-111-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-111-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-111');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-111');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_42a10c0cb46ab2d8dbdc0bff');
          const role=JSON.parse(fs.readFileSync('data/review/card-backfill/UC-111/exact-role-record.json','utf8'));
          if(!specimen||specimen.still)throw new Error('UC-111 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-111 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-111'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-111 audit disposition was canonically mutated');
          if(role.multiplicity_boundary?.collective_display_required!==true||role.multiplicity_boundary?.visible_repeated_bodies_required!==true||role.multiplicity_boundary?.single_isolated_body_insufficient!==true)throw new Error('UC-111 multiplicity boundary was weakened');
          console.log('PASS — UC-111 remains canonically absent; only reviewed collective evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-111.json \
            .github/CARD-BACKFILL-UC-111-DISCOVER.json \
            .github/CARD-BACKFILL-UC-111-RENDER.json \
            .github/CARD-BACKFILL-UC-111-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-111-scope.yml \
            .github/workflows/card-backfill-uc-111-discover.yml \
            .github/workflows/card-backfill-uc-111-render.yml \
            .github/workflows/card-backfill-uc-111-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-111-scope.mjs \
            scripts/card-backfill-uc-111-discover.mjs \
            scripts/card-backfill-uc-111-render.mjs \
            scripts/card-backfill-uc-111-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-111 Deep Roy Oompa Loompas still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-023
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-023 HEAD)
          test "${#changed[@]}" -eq 12
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-111/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-111-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-024
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-111-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-111-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-111-apply
            data/review/card-backfill/UC-111
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
