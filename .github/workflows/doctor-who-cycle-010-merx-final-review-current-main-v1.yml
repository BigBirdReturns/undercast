name: doctor-who-cycle-010-merx-final-review-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-review-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-review-current-main-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-review-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      BRANCH: agent/doctor-who-cycle-010-merx-final-review-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-review-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1
      SOURCE: /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1-source
      WORKTREE: /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1-worktree
      SOURCE_PR: "738"
      SOURCE_HEAD: f21337e459c27221b333c94833af96ffdcd0cb90
      SOURCE_RUN: "31297524990"
      SOURCE_JOB: "93204954534"
      SOURCE_ARTIFACT: "9033465110"
      SOURCE_ZIP_SHA256: 35b726305f7039e3d1309ab690b935335a5f8dbc6f0bb78a62862d25b6e3d461
      SOURCE_QUALIFICATION_ID: 03280b40ea4c444b789b325c8ad6db4828843e418d984c6f20c74a42d07fa9d8
      PRODUCT_COMMIT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_BUNDLE_SHA256: 0ab9ead02773cd7b2413b8f8a504e28e69a4eb90d8e694885cbd4cd0e60a8864
      PRODUCT_TAR_SHA256: 08d604ba1d503ac0be0ecd079350bd6ad3becaae2b32ff9d65cfe3d0e214c9ec
      PRODUCT_PATCH_SHA256: dc89e52ad024c9efb0cdbcc8fb426b844f2169a8069001e69b9da61c2ee59a97
      FILE_MANIFEST_SHA256: b91d4ed69851b88af1209f584cd695102ff62481a3697455657ccdaf517ed834
      CHANGED_PATHS_SHA256: fab9395f4ba0fd05593546030c9376f48e37a7076ebe54b5d02524a89acd5c01
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact current-main product artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE" "$WORKTREE" /tmp/merx-current-main-review-api
          mkdir -p "$OUT"/{logs,product,review} "$SOURCE" /tmp/merx-current-main-review-api
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > /tmp/merx-current-main-review-api/carrier.json
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > /tmp/merx-current-main-review-api/source-pr.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/merx-current-main-review-api/source-run.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/merx-current-main-review-api/source-jobs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > /tmp/merx-current-main-review-api/source-artifact.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > /tmp/merx-current-main-review-source.zip
          test "$(sha256sum /tmp/merx-current-main-review-source.zip | awk '{print $1}')" = "$SOURCE_ZIP_SHA256"
          HEAD="$head" PR="$pr" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          api=Path('/tmp/merx-current-main-review-api'); source=Path(os.environ['SOURCE']); out=Path(os.environ['OUT'])
          own=json.loads((api/'carrier.json').read_text()); pr=json.loads((api/'source-pr.json').read_text())
          run=json.loads((api/'source-run.json').read_text()); jobs=json.loads((api/'source-jobs.json').read_text())['jobs']; artifact=json.loads((api/'source-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert pr['number']==int(os.environ['SOURCE_PR']) and pr['merged'] is False
          assert pr['base']['sha']==os.environ['MAIN'] and pr['head']['sha']==os.environ['SOURCE_HEAD'] and pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-010-merx-final-product-current-main-v1'
          assert run['head_sha']==os.environ['SOURCE_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['SOURCE_JOB']))
          assert job['name']=='recompose' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False and artifact['digest']=='sha256:'+os.environ['SOURCE_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          with zipfile.ZipFile('/tmp/merx-current-main-review-source.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({r.filename for r in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  target=source/p; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          ledger=source/'SHA256SUMS.pre'; sealed=source/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=source/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          q=json.loads((source/'receipt/qualification.json').read_text()); identity=q.pop('identity')
          assert identity==os.environ['SOURCE_QUALIFICATION_ID']
          assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          q['identity']=identity
          assert q['status']=='cycle-010-merx-current-main-product-qualified-v1'
          assert q['canonical_parent']==os.environ['MAIN']
          assert q['product']['commit']==os.environ['PRODUCT_COMMIT'] and q['product']['tree']==os.environ['PRODUCT_TREE'] and q['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert q['product']['bundle_sha256']==os.environ['PRODUCT_BUNDLE_SHA256'] and q['product']['tar_sha256']==os.environ['PRODUCT_TAR_SHA256']
          assert q['product']['patch_sha256']==os.environ['PRODUCT_PATCH_SHA256'] and q['product']['file_manifest_sha256']==os.environ['FILE_MANIFEST_SHA256']
          assert q['product']['changed_paths_sha256']==os.environ['CHANGED_PATHS_SHA256']
          assert q['intervening']=={'commits':1,'overlap':[],'paths':['data/MEDIA-SEARCH-LATEST.json','data/journal/media-search.jsonl']}
          assert q['queue_after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert all(q['gates'].values()) and not any(q['boundary'].values())
          (out/'review/qualification.bound.json').write_text(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Independently verify all fifty product objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE/product/product.bundle" | awk '{print $1}')" = "$PRODUCT_BUNDLE_SHA256"
          test "$(sha256sum "$SOURCE/product/product.tar" | awk '{print $1}')" = "$PRODUCT_TAR_SHA256"
          test "$(sha256sum "$SOURCE/product/product.patch" | awk '{print $1}')" = "$PRODUCT_PATCH_SHA256"
          test "$(sha256sum "$SOURCE/product/file-manifest.json" | awk '{print $1}')" = "$FILE_MANIFEST_SHA256"
          test "$(sha256sum "$SOURCE/product/changed-paths.txt" | awk '{print $1}')" = "$CHANGED_PATHS_SHA256"
          git bundle verify "$SOURCE/product/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch "$SOURCE/product/product.bundle" refs/heads/cycle-010-current-main-product:refs/review/cycle-010-current-main-product
          test "$(git rev-parse refs/review/cycle-010-current-main-product)" = "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          git diff --name-only "$MAIN" "$PRODUCT_COMMIT" | LC_ALL=C sort > /tmp/merx-current-main-review-paths.txt
          cmp /tmp/merx-current-main-review-paths.txt "$SOURCE/product/changed-paths.txt"
          test "$(wc -l < /tmp/merx-current-main-review-paths.txt | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(grep '^\.github/' /tmp/merx-current-main-review-paths.txt || true)"
          git diff --name-status "$MAIN" "$PRODUCT_COMMIT" > /tmp/merx-current-main-review-status.txt
          cmp /tmp/merx-current-main-review-status.txt "$SOURCE/product/changed-paths-status.txt"
          git diff --binary "$MAIN" "$PRODUCT_COMMIT" > /tmp/merx-current-main-review.patch
          cmp /tmp/merx-current-main-review.patch "$SOURCE/product/product.patch"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          source=Path(os.environ['SOURCE'])/'product'; commit=os.environ['PRODUCT_COMMIT']
          manifest=json.loads((source/'file-manifest.json').read_text()); rows=manifest['files']
          assert manifest['version']==1 and len(rows)==int(os.environ['PRODUCT_PATHS'])
          expected={row['path']:row for row in rows}; assert len(expected)==len(rows)
          with tarfile.open(source/'product.tar','r:*') as archive:
              members=archive.getmembers(); assert len(members)==len(rows) and {m.name for m in members}==set(expected)
              for member in members:
                  p=PurePosixPath(member.name); assert not p.is_absolute() and '..' not in p.parts and member.isfile()
                  data=archive.extractfile(member).read(); row=expected[member.name]
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
                  assert member.mode==int(row['mode'][-3:],8)
                  committed=subprocess.run(['git','show',f'{commit}:{member.name}'],check=True,capture_output=True).stdout
                  tree_row=subprocess.run(['git','ls-tree',commit,'--',member.name],check=True,capture_output=True,text=True).stdout.split()
                  assert committed==data and tree_row[0]==row['mode'] and tree_row[2]==row['blob']
          PY
          cp "$SOURCE/product/product.bundle" "$SOURCE/product/product.tar" "$SOURCE/product/product.patch" "$SOURCE/product/file-manifest.json" "$SOURCE/product/changed-paths.txt" "$SOURCE/product/changed-paths-status.txt" "$OUT/product/"

      - name: Rerun permanent, semantic, and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT_COMMIT"
          (
            cd "$WORKTREE"
            test "$(git show -s --format=%P HEAD)" = "$MAIN"
            test "$(git show -s --format=%T HEAD)" = "$PRODUCT_TREE"
            test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
            npm ci
            npx playwright install --with-deps chromium
            node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
            node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
            node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
            node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/review/autopilot-status.json"
            node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
            node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
            node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
            node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/review/waterline-status.json"
            node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
            npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
            grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
            test -z "$(git status --porcelain)"
          )
          ROOT="$WORKTREE" OUTROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUTROOT'])
          state=json.loads((root/'data/AUTOPILOT.json').read_text()); doctor=[x for x in state['jobs'] if x.get('scope')=='doctor-who']
          task=next(x for x in doctor if x['id']==os.environ['TASK_ID'])
          assert len(doctor)==316 and task['status']=='resolved' and task['performer']=='Dan Starkey' and task['character']=='Merx' and task['wall_ids']==[os.environ['WALL_ID']]
          assert sum(x['status']=='queued' for x in doctor)==306 and sum(x['status']=='resolved' for x in doctor)==10
          card=next(x for x in json.loads((root/'data/specimens.json').read_text()) if x['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Merx' and card['kind']=='voice' and 'still' not in card
          assert hashlib.sha256((root/card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.loads((root/'data/review/adapter-sdk/doctor-who-cycle-010-merx.json').read_text())
          assert receipt['task']['id']==os.environ['TASK_ID'] and receipt['lease']['id']==os.environ['LEASE_ID']
          assert receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID'] and receipt['reviewed_cycle']['event_id']==os.environ['EVENT_ID']
          assert receipt['queue']['after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert receipt['boundary']['cycle_011_authorized'] is False and receipt['boundary']['eleventh_lease_issued'] is False
          status=json.loads((out/'review/autopilot-status.json').read_text()); water=json.loads((out/'review/waterline-status.json').read_text())
          assert status['total']==316 and status['statuses']=={'queued':306,'resolved':10} and status['in_flight']==0
          assert water['claim_allowed'] is True and water['claim_reasons']==[] and water['jobs']['in_flight']==0 and water['media']['debt']==0 and water['cycles']['unreceipted']==[]
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal independent current-main approval
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); q=json.loads((out/'review/qualification.bound.json').read_text())
          receipt={
            'status':'cycle-010-merx-current-main-product-independently-approved-v1',
            'version':1,
            'review_run':int(os.environ['GITHUB_RUN_ID']),
            'review_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'canonical_parent':os.environ['MAIN'],
            'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ZIP_SHA256'],'qualification_identity':q['identity']},
            'product':{'commit':os.environ['PRODUCT_COMMIT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],'file_manifest_sha256':os.environ['FILE_MANIFEST_SHA256'],'changed_paths_sha256':os.environ['CHANGED_PATHS_SHA256']},
            'task':{'id':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'performer':'Dan Starkey','role':'Merx','mode':'voice'},
            'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['EVENT_ID']},
            'queue':{'total':316,'queued':306,'resolved':10,'in_flight':0},
            'media':{'portrait':'verified','portrait_sha256':os.environ['PORTRAIT_SHA256'],'still':'absent'},
            'gates':{'artifact_custody':True,'git_objects':True,'tar_manifest':True,'historical_checker_bytes':True,'cycle_009_composability':True,'cycle_010':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True},
            'boundary':{'repository_write':False,'product_published':False,'canonical_mutation':False,'cycle_011_authorized':False,'eleventh_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'review/approval.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-current-main-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-current-main-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1
            /tmp/doctor-who-cycle-010-merx-final-review-current-main-v1-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
