name: card-backfill-uc-176-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-176-RENDER.json"
      - ".github/CARD-BACKFILL-UC-176-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-176-render.mjs"
      - ".github/workflows/card-backfill-uc-176-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-176-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-040'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-040
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-176 render authorization and canonical absence boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176-RENDER.json','utf8'));
          const failureBytes=fs.readFileSync(c.failure_ledger.path);
          const blob=createHash('sha1').update(Buffer.from(`blob ${failureBytes.length}\0`)).update(failureBytes).digest('hex');
          const failures=JSON.parse(failureBytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(x=>x.id==='UC-176');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(x=>x.id==='UC-176');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(x=>x.id==='ma_214b44ba458987517acdd2b8');
          if(c.version!==1||c.lane!=='card-backfill'||c.record_id!=='UC-176'||c.kind!=='film'||c.actor!=='Fredric March'||c.character!=='Mr. Hyde'||c.production!=='Dr. Jekyll and Mr. Hyde (1931)'||c.years!=='1931'||c.universe!=='Film'||c.side!=='still')throw new Error('UC-176 render authorization drift');
          if(c.discovery_artifact?.run_id!==30502629259||c.discovery_artifact?.artifact_id!==8744129770||c.discovery_artifact?.name!=='card-backfill-uc-176-discover-commons-category-html-fallback-30502629259'||c.discovery_artifact?.head_sha!=='56c31a2c513f52a01460db5ef8efd518eafd65ab'||c.discovery_artifact?.artifact_digest_sha256!=='7e6d16f079d96b610c0f5a12bd24853b21b8cb57c5ba8c8675c0ccf23d7e1f97'||c.discovery_artifact?.manifest_sha256!=='db66fcc8fa67e237e1b9cb8f3fdb506b4947d033942eeffc1ce342efffa70ccc'||c.discovery_artifact?.summary_sha256!=='8e7e7ec8eb7d4dc944405c3a5927379d049bde63e6d4bc91506ac5ecdd8526b2'||c.discovery_artifact?.candidate_count!==11||c.discovery_artifact?.candidate_counts?.asc!==4||c.discovery_artifact?.candidate_counts?.commons!==7)throw new Error('UC-176 discovery custody drift');
          if(blob!==c.failure_ledger?.git_blob_sha1||blob!=='69b833c326a4be6462022ccce555b62867670e82'||failures.failed_discovery_checkpoints?.length!==9||failures.checkpoint_status!==c.failure_ledger?.checkpoint_status)throw new Error('UC-176 failure custody drift');
          if(c.selected_source?.source_family!=='asc'||c.selected_source?.artifact_path!=='candidates/asc/01.jpg'||c.selected_source?.declared_url!=='https://theasc.com/wp-content/uploads/2026/04/Jekyll-Hyde-Featured.jpg'||c.selected_source?.sha256!=='099eea14fbaf17e91b6ab30a9778c4031ddfd42fc946c1edadc0aa0dfa6879ed'||c.selected_source?.width!==1728||c.selected_source?.height!==1081||c.selected_source?.bytes!==127987||c.selected_source?.repository_matches?.length!==0)throw new Error('UC-176 selected source custody drift');
          if(c.visual_second_desk?.status!=='accepted-for-render'||c.visual_second_desk?.exact_fredric_march_transformed_hyde!==true||c.visual_second_desk?.selected_image_does_not_independently_prove_actor_role!==true)throw new Error('UC-176 visual ruling drift');
          if(c.render_contract?.candidate_width!==1260||c.render_contract?.candidate_height!==1000||c.render_contract?.identity_region?.source_crop_x!==580||c.render_contract?.identity_region?.source_crop_width!==1148||c.render_contract?.identity_region?.output_height!==560||c.render_contract?.divider_height!==8||c.render_contract?.full_source_region?.output_height!==432||c.render_contract?.full_source_region?.all_selected_source_edges_visible_in_inset!==true||c.render_contract?.wall_width!==1246||c.render_contract?.wall_height!==1000||c.render_contract?.wall_crop_left_pixels!==7||c.render_contract?.wall_crop_right_pixels!==7)throw new Error('UC-176 render geometry drift');
          if(c.permanent_packet_contract?.expected_file_count!==25||c.permanent_packet_contract?.exact_output_files?.length!==25||c.expected_repository_hash_count!==2070||c.canonical_mutation!==false)throw new Error('UC-176 packet boundary drift');
          if(!specimen||specimen.actor!=='Fredric March'||specimen.character!=='Mr. Hyde'||specimen.production!=='Dr. Jekyll and Mr. Hyde (1931)'||specimen.years!=='1931'||specimen.designer!=='Wally Westmore'||specimen.transform!==4||specimen.still||specimen.portrait?.src!=='images/uc-176-portrait.jpg')throw new Error('UC-176 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-176-portrait.jpg'||!audit||audit.wall_id!=='UC-176'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-176 canonical absence drift');
          console.log('PASS — exact UC-176 selected byte, nine failures, render geometry, and canonical absence authorized');
          NODE
      - name: Download exact successful UC-176 discovery artifact
        uses: actions/download-artifact@v4
        with:
          name: card-backfill-uc-176-discover-commons-category-html-fallback-30502629259
          path: ${{ runner.temp }}/uc-176-discovery
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30502629259
      - name: Render exact Mr. Hyde candidate and evidence packet
        env:
          CONTROL: .github/CARD-BACKFILL-UC-176-RENDER.json
          DISCOVERY: ${{ runner.temp }}/uc-176-discovery/card-backfill-uc-176-discover-commons-category-html-fallback
          OUT: ${{ runner.temp }}/card-backfill-uc-176-render
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          test -f "$DISCOVERY/manifest.json"
          node --check scripts/card-backfill-uc-176-render.mjs
          node scripts/card-backfill-uc-176-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-176-render-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact source receipts, rendered candidate, crop, review, and checksum ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-176-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-176-render
            ${{ runner.temp }}/card-backfill-uc-176-render-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
