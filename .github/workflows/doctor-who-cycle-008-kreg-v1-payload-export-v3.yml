name: doctor-who-cycle-008-kreg-v1-payload-export-v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-v1-payload-export-v3.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-008-kreg-v1-payload-export-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-v1-payload-export-v3.yml
  FLOOR_MAIN: ceca35cd4456c9e948de2e0a3c30a78d81a88c7e
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-v1-payload-export-v3
  V1_BRANCH: agent/doctor-who-cycle-008-kreg-candidate-v1
  V1_PATH: .github/doctor-who-cycle-008/kreg-candidate-v1-payload.tar.gz.b64
  V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
  V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
  V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
  ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
  MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
  MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
  RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
  OUT: /tmp/doctor-who-cycle-008-kreg-v1-payload-export-v3

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-v1-payload-export-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact carrier and descendant-safe main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/extracted"
          head_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$head_sha"
          test "$(git show -s --format=%P HEAD)" = "$FLOOR_MAIN"
          test "$(git rev-list --count "$FLOOR_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$FLOOR_MAIN" HEAD)" = "$FLOOR_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$FLOOR_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${V1_BRANCH}:refs/remotes/origin/${V1_BRANCH}"
          live_main="$(git rev-parse refs/remotes/origin/main)"
          test "$(git merge-base "$FLOOR_MAIN" "$live_main")" = "$FLOOR_MAIN"
          successor_commits="$(git rev-list --count "$FLOOR_MAIN".."$live_main")"
          test "$successor_commits" -le 16
          git diff --name-only "$FLOOR_MAIN".."$live_main" | LC_ALL=C sort -u > "$OUT/main-successor-paths.txt"
          if test -s "$OUT/main-successor-paths.txt"; then
            test -z "$(grep -Ev '^\.github/workflows/operational-evidence-.*\.yml$' "$OUT/main-successor-paths.txt" || true)"
          fi
          git diff --quiet
          git diff --cached --quiet
          printf '%s\n' "$live_main" > "$OUT/live-main.txt"
          printf 'floor=%s\nlive_main=%s\nsuccessor_commits=%s\ncarrier_head=%s\ncarrier_tree=%s\n' \
            "$FLOOR_MAIN" "$live_main" "$successor_commits" "$head_sha" "$(git rev-parse 'HEAD^{tree}')" \
            > "$OUT/carrier-identity.txt"

      - name: Export and verify immutable V1 payload
        shell: bash
        run: |
          set -euo pipefail
          v1="refs/remotes/origin/${V1_BRANCH}"
          test "$(git rev-parse "$v1:$V1_PATH")" = "$V1_BLOB"
          git show "$v1:$V1_PATH" > "$OUT/kreg-candidate-v1-payload.tar.gz.b64"
          test "$(sha256sum "$OUT/kreg-candidate-v1-payload.tar.gz.b64" | awk '{print $1}')" = "$V1_TEXT_SHA256"
          base64 --decode "$OUT/kreg-candidate-v1-payload.tar.gz.b64" > "$OUT/kreg-candidate-v1-payload.tar.gz"
          test "$(sha256sum "$OUT/kreg-candidate-v1-payload.tar.gz" | awk '{print $1}')" = "$V1_GZIP_SHA256"
          PAYLOAD_ARCHIVE="$OUT/kreg-candidate-v1-payload.tar.gz" PAYLOAD_TARGET="$OUT/extracted" python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['PAYLOAD_ARCHIVE'])
          target = pathlib.Path(os.environ['PAYLOAD_TARGET'])
          expected = ['env.sh', 'manifest.json', 'materialize.py', 'runner.sh']
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              if names != expected or len(names) != len(set(names)):
                  raise SystemExit(f'payload member set drifted: {names!r}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              tf.extractall(target)
          PY
          test "$(sha256sum "$OUT/extracted/env.sh" | awk '{print $1}')" = "$ENV_SHA256"
          test "$(sha256sum "$OUT/extracted/manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(sha256sum "$OUT/extracted/materialize.py" | awk '{print $1}')" = "$MATERIALIZER_SHA256"
          test "$(sha256sum "$OUT/extracted/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$OUT/extracted/runner.sh"
          python3 -m py_compile "$OUT/extracted/materialize.py"
          sha256sum "$OUT"/kreg-candidate-v1-payload.tar.gz* "$OUT"/extracted/* > "$OUT/SHA256SUMS"
          printf 'v1_head=%s\nv1_parent=%s\nv1_tree=%s\nv1_blob=%s\n' \
            "$(git rev-parse "$v1")" "$(git show -s --format=%P "$v1")" \
            "$(git rev-parse "$v1^{tree}")" "$V1_BLOB" \
            > "$OUT/v1-identity.txt"

      - name: Rebind unchanged live main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$(cat "$OUT/live-main.txt")"
          git diff --quiet
          git diff --cached --quiet

      - name: Upload exact V1 payload packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v1-payload-export-v3-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
