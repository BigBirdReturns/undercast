name: doctor-who-cycle-008-kreg-candidate-v5g

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/doctor-who-cycle-008/kreg-candidate-v5g/**"
      - ".github/workflows/doctor-who-cycle-008-kreg-candidate-v5g.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: doctor-who-cycle-008-kreg-candidate-v5g-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

jobs:
  candidate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-candidate-v5g'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Fetch complete mainline history without unrelated branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --unshallow origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$PR_BASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify visible programs and bind the carrier
        shell: bash
        run: |
          set -euo pipefail
          phase_root=.github/doctor-who-cycle-008/kreg-candidate-v5g
          test "$(sha256sum "$phase_root/phase-sha256.txt" | awk '{print $1}')" = "b8c2f7f9e3918b7a0356d5db43cc137b16c7704ab74a84a3472c737302a184e7"
          sha256sum -c "$phase_root/phase-sha256.txt"
          for phase in "$phase_root"/phase-*.sh; do bash -n "$phase"; done
          source "$phase_root/env.sh"
          for number in 01 02 03; do bash -x "$phase_root/phase-$number.sh"; done
      - name: Download exact independent-review packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-independent-media-review-v1-31110923065
          path: /tmp/doctor-who-cycle-008-kreg-candidate-v5g/review
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: "31110923065"
      - name: Download exact media-publication observer packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-prepublish-v1-observer-31112660901
          path: /tmp/doctor-who-cycle-008-kreg-candidate-v5g/observer
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: "31112660901"
      - name: Verify evidence, reconstruct, gate, and seal the candidate
        shell: bash
        run: |
          set -euo pipefail
          phase_root=.github/doctor-who-cycle-008/kreg-candidate-v5g
          source "$phase_root/env.sh"
          for number in 04 05 06 07 08 09 10; do bash "$phase_root/phase-$number.sh"; done
      - name: Upload immutable Kreg candidate V5g qualification packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-candidate-v5g-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-candidate-v5g
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
