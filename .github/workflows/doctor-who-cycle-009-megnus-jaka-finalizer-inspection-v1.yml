name: doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v2
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      SOURCE_COMMIT: "181f821f2348a3cb47ca75c52cd42c9b030ef3ca"
      SOURCE_RUNNER_GZIP_SHA256: "d07fd349cf8e95571d516074c9c9618050e31242a5e112ca2b6bb78649a1cd19"
      SOURCE_RUNNER_SHA256: "878acf29393fabc86f3250649a56f2fde01a9058c7674466f656e30419a92a8c"
      EXACT_MAIN: "707f2c14c4dc183afceb732c2b56124ed3a37c93"
      SELF: ".github/workflows/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v1.yml"
      OUT: "/tmp/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v2"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Extract and inspect immutable UTF-8 finalizer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git merge-base HEAD "$EXACT_MAIN")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 2
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git rev-parse origin/main)" = "$EXACT_MAIN"

          message="$OUT/source-commit-message.txt"
          runner_gz="$OUT/finalizer.sh.gz"
          runner="$OUT/finalizer.sh"
          git show -s --format=%B "$SOURCE_COMMIT" > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64, os
          from pathlib import Path
          text=Path(os.environ['MESSAGE']).read_text()
          begin='RUNNER_GZIP_BASE64_BEGIN'
          end='RUNNER_GZIP_BASE64_END'
          assert text.count(begin)==1 and text.count(end)==1
          payload=''.join(text.split(begin,1)[1].split(end,1)[0].split())
          assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload,validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$SOURCE_RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$SOURCE_RUNNER_SHA256"
          bash -n "$runner"

          RUNNER="$runner" OUT="$OUT" python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          runner=Path(os.environ['RUNNER'])
          out=Path(os.environ['OUT'])
          lines=runner.read_text().splitlines()
          numbered=''.join(f'{i+1:5d}  {line}\n' for i,line in enumerate(lines))
          (out/'finalizer.numbered.txt').write_text(numbered)

          facts_rows=[i for i,line in enumerate(lines) if "finalization-facts.json" in line]
          assert facts_rows
          first_facts=min(facts_rows)
          section_start=max(0,first_facts-25)
          section_end=min(len(lines),first_facts+90)
          (out/'post-finalization-facts-section.txt').write_text(
              ''.join(f'{i+1:5d}  {lines[i]}\n' for i in range(section_start,section_end))
          )

          risky=[]
          for i,line in enumerate(lines):
              reasons=[]
              if '|' in line: reasons.append('pipeline')
              if re.search(r'\b(head|tail|grep)\b', line): reasons.append('early-reader')
              if 'while IFS=' in line: reasons.append('while-pipeline')
              if 'set -euo pipefail' in line: reasons.append('pipefail')
              if reasons:
                  risky.append({'line':i+1,'text':line,'reasons':reasons,'after_facts':i>first_facts})
          (out/'pipeline-candidates.json').write_text(json.dumps(risky,indent=2,sort_keys=True)+'\n')
          (out/'pipeline-candidates.txt').write_text(
              ''.join(f"{row['line']:5d}  {','.join(row['reasons'])}: {row['text']}\n" for row in risky)
          )

          meta={
            'source_commit':os.environ['SOURCE_COMMIT'],
            'runner_sha256':hashlib.sha256(runner.read_bytes()).hexdigest(),
            'runner_lines':len(lines),
            'first_finalization_facts_line':first_facts+1,
            'risky_pipeline_count':len(risky),
            'risky_after_facts_count':sum(1 for row in risky if row['after_facts']),
            'canonical_main':os.environ['EXACT_MAIN'],
            'repository_write':False,
            'cycle_state_write':False,
          }
          (out/'inspection.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum \
            "$OUT/finalizer.sh" \
            "$OUT/post-finalization-facts-section.txt" \
            "$OUT/pipeline-candidates.json" \
            "$OUT/inspection.json" > "$OUT/SHA256SUMS"

      - name: Upload exact UTF-8 finalizer inspection
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v2
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
