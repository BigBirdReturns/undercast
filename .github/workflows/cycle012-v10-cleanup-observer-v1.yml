name: cycle012-v10-cleanup-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-v10-cleanup-observer-v1.yml"

permissions: {}

concurrency:
  group: cycle012-v10-cleanup-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-v10-cleanup-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/cycle012-v10-cleanup-observer-v1
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: observer/cycle012-v10-cleanup-observer-v1
      EVIDENCE_RUN: "31468250304"
      EVIDENCE_HEAD: f34ceb39a74322e2df411e3b874112f04dfd8b98
      EVIDENCE_ARTIFACT: "9092386723"
      EVIDENCE_DIGEST: 55d93d4f01f3d096044ff7e2d5b26977b008f248e84a62bd412ec012f626c681
      EVIDENCE_PR: "923"
      WRITER_NAME: doctor-who-cycle-012-selection-cleanup-writer-v10
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      INSTALLED_MAIN: 1499ce3281d282bd7e135a362ed6a32755c16ee0
      PRESERVED_PRODUCT: d33580cbc73b7bcab734ec3da84a0e977e852ad0
      AGENT_PREFIX: agent/doctor-who-cycle-012-selection-cleanup-writer-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-selection-cleanup-
      OUTSIDE_ONE: observer/cycle012-cleanup-writer-
      OUTSIDE_TWO: observer/cycle012-residual-cleanup-writer-
    steps:
      - name: Observe exact V10 writer transaction to terminal state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload}
          repo="/repos/$GITHUB_REPOSITORY"
          gh api "$repo/actions/runs/$EVIDENCE_RUN" > "$OUT/api/evidence-run.json"
          gh api "$repo/actions/artifacts/$EVIDENCE_ARTIFACT" > "$OUT/api/evidence-artifact.json"
          gh api "$repo/actions/workflows/${WRITER_PATH##*/}" > "$OUT/api/writer-workflow.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          evidence=json.loads((root/'evidence-run.json').read_text())
          artifact=json.loads((root/'evidence-artifact.json').read_text())
          workflow=json.loads((root/'writer-workflow.json').read_text())
          assert evidence['id']==int(os.environ['EVIDENCE_RUN'])
          assert evidence['event']=='pull_request' and evidence['status']=='completed' and evidence['conclusion']=='success'
          assert evidence['head_sha']==os.environ['EVIDENCE_HEAD']
          assert artifact['id']==int(os.environ['EVIDENCE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['EVIDENCE_DIGEST']
          assert workflow['name']==os.environ['WRITER_NAME'] and workflow['path']==os.environ['WRITER_PATH']
          (root/'writer-workflow-id.txt').write_text(str(workflow['id'])+'\n')
          PY
          writer_id="$(cat "$OUT/api/writer-workflow-id.txt")"
          found=""
          for _ in $(seq 1 240); do
            gh api "$repo/actions/workflows/$writer_id/runs?event=workflow_run&per_page=100" > "$OUT/api/writer-runs.json"
            found="$(EVIDENCE="$OUT/api/evidence-run.json" RUNS="$OUT/api/writer-runs.json" python3 - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          rows=json.loads(Path(os.environ['RUNS']).read_text())['workflow_runs']
          cutoff=datetime.fromisoformat(evidence['created_at'].replace('Z','+00:00'))
          matched=[]
          for row in rows:
              created=datetime.fromisoformat(row['created_at'].replace('Z','+00:00'))
              if row['event']=='workflow_run' and created>=cutoff and row['head_sha']==os.environ['INSTALLED_MAIN']:
                  matched.append(row)
          matched.sort(key=lambda row:(row['created_at'],row['id']))
          print(matched[0]['id'] if matched else '')
          PY
          )"
            if test -n "$found"; then break; fi
            sleep 5
          done
          test -n "$found"
          printf '%s\n' "$found" > "$OUT/api/writer-run-id.txt"
          for _ in $(seq 1 360); do
            gh api "$repo/actions/runs/$found" > "$OUT/api/writer-run.json"
            status="$(jq -r '.status' "$OUT/api/writer-run.json")"
            if test "$status" = completed; then break; fi
            sleep 5
          done
          test "$(jq -r '.status' "$OUT/api/writer-run.json")" = completed
          gh api "$repo/actions/runs/$found/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
          gh api "$repo/actions/runs/$found/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          gh api "$repo/git/ref/heads/main" > "$OUT/api/main-ref.json"
          main="$(jq -r '.object.sha' "$OUT/api/main-ref.json")"
          gh api "$repo/git/commits/$main" > "$OUT/api/main-commit.json"
          gh api "$repo/pulls/$EVIDENCE_PR" > "$OUT/api/evidence-pr.json"
          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "outside_one:$OUTSIDE_ONE" "outside_two:$OUTSIDE_TWO"; do
            label="${spec%%:*}"; prefix="${spec#*:}"
            gh api "$repo/git/matching-refs/heads/$prefix" > "$OUT/api/$label-refs.json" 2>/dev/null || printf '[]\n' > "$OUT/api/$label-refs.json"
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          load=lambda name:json.loads((root/name).read_text())
          writer=load('writer-run.json')
          jobs=load('writer-jobs.json')['jobs']
          artifacts=load('writer-artifacts.json')['artifacts']
          main_ref=load('main-ref.json')['object']['sha']
          commit=load('main-commit.json')
          pr=load('evidence-pr.json')
          counts={name:len(load(name+'-refs.json')) for name in ('agent','observer','outside_one','outside_two')}
          write=[job for job in jobs if job['name']=='write']
          write_conclusion=write[0]['conclusion'] if len(write)==1 else None
          terminal=(
              writer['conclusion']=='success' and write_conclusion=='success' and
              len(commit['parents'])==1 and commit['parents'][0]['sha']==os.environ['INSTALLED_MAIN'] and
              pr['state']=='closed' and pr['merged'] is False and
              all(value==0 for value in counts.values())
          )
          result={
              'status':'cycle012-v10-cleanup-writer-observed-v1','version':1,
              'evidence':{'run':int(os.environ['EVIDENCE_RUN']),'head':os.environ['EVIDENCE_HEAD'],'artifact':int(os.environ['EVIDENCE_ARTIFACT']),'artifact_sha256':os.environ['EVIDENCE_DIGEST']},
              'writer':{'run':writer['id'],'status':writer['status'],'conclusion':writer['conclusion'],'head_sha':writer['head_sha'],'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion'],'steps':[{'number':s['number'],'name':s['name'],'status':s['status'],'conclusion':s['conclusion']} for s in (j.get('steps') or [])]} for j in jobs],'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts]},
              'canonical':{'main':main_ref,'parents':[p['sha'] for p in commit['parents']],'tree':commit['tree']['sha'],'installed_main':os.environ['INSTALLED_MAIN'],'preserved_product':os.environ['PRESERVED_PRODUCT']},
              'transport':{'evidence_pr':pr['number'],'evidence_pr_state':pr['state'],'evidence_pr_merged':pr['merged'],'remaining_refs':counts},
              'terminal_cleanup_proved':terminal,
              'boundary':{'lease_issued':False,'queue_mutated':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False},
          }
          result['identity']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          payload=Path(os.environ['OUT'])/'payload'
          (payload/'observer.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (payload/'OBSERVER_COMPLETE').write_text(result['identity']+'\n')
          for name in ['writer-run.json','writer-jobs.json','writer-artifacts.json','main-ref.json','main-commit.json','evidence-pr.json','agent-refs.json','observer-refs.json','outside_one-refs.json','outside_two-refs.json']:
              (payload/name).write_bytes((root/name).read_bytes())
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
          )
      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-v10-cleanup-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-v10-cleanup-observer-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-v10-cleanup-observer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-v10-cleanup-observer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  retire:
    needs: observe
    if: >-
      always() &&
      needs.observe.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'observer/cycle012-v10-cleanup-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: observer/cycle012-v10-cleanup-observer-v1
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Close and delete exact observer transport
        shell: bash
        run: |
          set -euo pipefail
          repo="/repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          gh api -X PATCH "$repo/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "$repo/git/refs/heads/$BRANCH"
