name: card-backfill-uc-174-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-174-RENDER.json"
      - "scripts/card-backfill-uc-174-render.mjs"
      - ".github/workflows/card-backfill-uc-174-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-174-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-038'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-038
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-174 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-174-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-174');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-174');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_21dca9535e54bec8e0e15391');
          if(row.version!==1||row.record_id!=='UC-174'||row.kind!=='voice'||row.actor!=='John DiMaggio'||row.character!=='Bender, Jake the Dog, Marcus Fenix'||row.production!=='Futurama / Adventure Time / Gears of War'||row.years!=='1990s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-174 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8734052507||row.discovery_artifact?.head_sha!=='71386d89beeb5c498a3fb33c19ca80f862dab459'||row.discovery_artifact?.zip_sha256!=='51ebdaa467e1dc38ad44bae36929e30c78992e546ebc475f2d9f66b37390fb81'||row.discovery_artifact?.candidate_count!==43||JSON.stringify(row.discovery_artifact?.role_counts)!==JSON.stringify({bender:2,jake:24,marcus:17}))throw new Error('UC-174 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==1||row.failed_discovery_checkpoints[0]?.artifact_id!==8733847623||row.identity_custody?.length!==4||row.roles?.length!==3)throw new Error('UC-174 render denominator drift');
          if(row.roles[0]?.sha256!=='82afa6ffe64755389b1012fd4d5dbd78d00fd9511f94a2060f32a4a897e99abe'||row.roles[0]?.pageimage_source!==true||row.roles[1]?.sha256!=='97ee77b17442a135d1cdb59679592a8520760b3a4492bda281ffd77c449ea4b8'||row.roles[1]?.pageimage_source!==true||row.roles[2]?.sha256!=='6f050f7f4b149bc52faba29d096ad25177216694c098ea5a34035b3fa44d3627'||row.roles[2]?.pageimage_source!==false||row.roles[2]?.file_title!=='File:Marcus UE.png')throw new Error('UC-174 selected source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.panel_height!==1000||row.render?.divider_width!==12||row.render?.face_height!==560||row.render?.internal_rule_height!==8||row.render?.body_height!==432||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-174 render geometry drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='John DiMaggio'||specimen.character!=='Bender, Jake the Dog, Marcus Fenix'||specimen.production!=='Futurama / Adventure Time / Gears of War'||specimen.years!=='1990s–'||specimen.still||specimen.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-174'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-174 audit boundary drift');
          console.log('PASS — exact UC-174 John DiMaggio three-role render authorized');
          NODE
      - name: Retrieve and verify exact discovery packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8734052507/zip" > "$root/discovery.zip"
          echo "51ebdaa467e1dc38ad44bae36929e30c78992e546ebc475f2d9f66b37390fb81  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-174-discover"
          echo "4c68a83eba52ba51d93d2cd13b874222ee4d119f63c68b94efc2883206c35c03  $source/manifest.json" | sha256sum -c -
          echo "8c8345fed13d240ca8c7bd501377a1e0481d315eeff1b714e56a08b5c8a6fd75  $source/summary.json" | sha256sum -c -
          echo "b8f9eb1a2f5e70875f8d2c3e485a3fd92b01d57418b01896cccca530e6e624c7  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "82afa6ffe64755389b1012fd4d5dbd78d00fd9511f94a2060f32a4a897e99abe  $source/candidates/bender/002-file-character-bender-png.webp" | sha256sum -c -
          echo "97ee77b17442a135d1cdb59679592a8520760b3a4492bda281ffd77c449ea4b8  $source/candidates/jake/015-file-jakesalad-png.webp" | sha256sum -c -
          echo "6f050f7f4b149bc52faba29d096ad25177216694c098ea5a34035b3fa44d3627  $source/candidates/marcus/011-file-marcus-ue-png.webp" | sha256sum -c -
          echo "6b6eec068fd4449ced076e74b945cec3cdae7c941b02aae0429476fb0226f407  $source/raw/bender.wikitext" | sha256sum -c -
          echo "f144acce1e51ce05700a88d05fd45a46a90beded5456fa928d9e8ed3950fcbce  $source/raw/jake.wikitext" | sha256sum -c -
          echo "035382281a389e731904fe7bd98457523d0f3c22c3c80dfcb0845db18a887d32  $source/raw/marcus.wikitext" | sha256sum -c -
          echo "ac53236e368e6ad9e83a911a0eaedd11d386f917f1b5deb1068c2f6905755597  $source/pages/disneyplus-adult-animation-bender.png" | sha256sum -c -
          echo "d4c6f935dd301e13d1b54e41bf2a41330aff91fa503bde09171b6b58a765683d  $source/pages/hulu-futurama.png" | sha256sum -c -
          echo "8d6461af4f735d26ebea81ff4dd0e4fbf3ea5b28b229d400241e63b32336a696  $source/pages/wbd-adventure-time-distant-lands.png" | sha256sum -c -
          echo "2285196929e546e9c12e9eb26ef162e36dbecca95fa90f90941c091e9a5b7b45  $source/pages/xbox-gears4-marcus.png" | sha256sum -c -
          cat > "$root/discovery-artifact-receipt.txt" <<'EOF'
          run_id=30476991480
          artifact_id=8734052507
          artifact_name=card-backfill-uc-174-discover-30476991480
          artifact_zip_sha256=51ebdaa467e1dc38ad44bae36929e30c78992e546ebc475f2d9f66b37390fb81
          artifact_head_sha=71386d89beeb5c498a3fb33c19ca80f862dab459
          internal_manifest_sha256=4c68a83eba52ba51d93d2cd13b874222ee4d119f63c68b94efc2883206c35c03
          internal_summary_sha256=8c8345fed13d240ca8c7bd501377a1e0481d315eeff1b714e56a08b5c8a6fd75
          EOF
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-174-render/discovery/card-backfill-uc-174-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-174-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-render"
          echo "renderer $(sha256sum scripts/card-backfill-uc-174-render.mjs | cut -d' ' -f1)"
          node --check scripts/card-backfill-uc-174-render.mjs
          node scripts/card-backfill-uc-174-render.mjs 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-174-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact role assets, page receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-174-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-174-render/output
            ${{ runner.temp }}/card-backfill-uc-174-render/run.log
            ${{ runner.temp }}/card-backfill-uc-174-render/discovery-artifact-receipt.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
