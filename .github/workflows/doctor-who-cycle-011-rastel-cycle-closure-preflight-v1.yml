name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
  cancel-in-progress: true

jobs:
  derive:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1-normalizer
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1-worktree
      NORMALIZER_BRANCH: agent/doctor-who-cycle-011-rastel-review-normalization-v1
      NORMALIZER_WORKFLOW: doctor-who-cycle-011-rastel-review-normalization-v1
      NORMALIZER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-review-normalization-v1-
      FINALIZER_V4_BYTES: "35745"
      FINALIZER_V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      OLD_TASK: ap_cab2d7f95d930401627c1b30
      OLD_LEASE: lease_b8955992c5af735f9e40b242
      OLD_WALL: UC-1355
      OLD_REVIEWED_AT: 2026-08-09T04:30:00Z
      OLD_REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338
      OLD_CANDIDATE_IDENTITY: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      OLD_CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      OLD_CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      OLD_REVIEW_STATUS: cycle-010-merx-candidate-independently-approved-v1
      NEW_REVIEW_STATUS: cycle-011-rastel-candidate-independently-approved-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind closure-preflight carrier and successful normalization artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,receipt,logs,closure,source} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$NORMALIZER_BRANCH" -f per_page=100 > "$OUT/api/normalizer-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'normalizer-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['NORMALIZER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_BASE']
          (api/'normalizer-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'normalizer-head.txt').write_text(source['head']['sha']+'\n')
          (api/'normalizer-number.txt').write_text(str(source['number'])+'\n')
          PY
          normalizer_head="$(cat "$OUT/api/normalizer-head.txt")"
          normalizer_pr="$(cat "$OUT/api/normalizer-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$NORMALIZER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/normalizer-runs.json"
            run_id="$(NORMALIZER_HEAD="$normalizer_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/normalizer-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['NORMALIZER_HEAD'] and row['name']==os.environ['NORMALIZER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/normalizer-run.json"
              if [ "$(jq -r '.status' "$OUT/api/normalizer-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/normalizer-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/normalizer-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/normalizer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/normalizer-artifacts.json"
          normalizer_job="$(jq -r '.jobs[] | select(.name=="normalize" and .conclusion=="success") | .id' "$OUT/api/normalizer-jobs.json")"
          test -n "$normalizer_job"
          normalizer_artifact="$(NORMALIZER_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/normalizer-artifacts.json').read_text())['artifacts']
          expected=os.environ['NORMALIZER_ARTIFACT_PREFIX']+os.environ['NORMALIZER_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,[(row['id'],row['name']) for row in rows]
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$normalizer_artifact" > "$OUT/api/normalizer-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$normalizer_artifact/zip" > "$OUT/normalizer.zip"
          normalizer_sha="$(sha256sum "$OUT/normalizer.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/normalizer-artifact.json")" = "sha256:$normalizer_sha"
          NORMALIZER_PR="$normalizer_pr" NORMALIZER_HEAD="$normalizer_head" NORMALIZER_RUN="$run_id" NORMALIZER_JOB="$normalizer_job" NORMALIZER_ARTIFACT="$normalizer_artifact" NORMALIZER_ZIP_SHA256="$normalizer_sha" python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=Path(os.environ['PACKET'])
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'normalizer.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in target.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(target).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          def find_status(status):
              rows=[]
              for path in target.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows])
              return rows[0]
          norm_path,norm=find_status('cycle-011-rastel-review-schema-normalized-v1')
          bindings_path,bindings=find_status('cycle-011-rastel-finalizer-exact-bindings-v1')
          for data in (norm,bindings):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          approvals=[]
          for path in target.rglob('approval.json'):
              data=json.loads(path.read_text())
              if data.get('status')==os.environ['NEW_REVIEW_STATUS']:approvals.append((path,data))
          assert len(approvals)==1
          approval_path,approval=approvals[0]
          identity=approval.pop('identity'); assert sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; approval['identity']=identity
          assert norm['normalized']['identity']==identity and norm['substantive_authority']['identity']==bindings['observer']['identity']
          assert bindings['candidate']['task']==os.environ['TASK_ID'] and bindings['candidate']['lease']==os.environ['EXPECTED_LEASE'] and bindings['candidate']['wall']==os.environ['WALL_ID']
          bundles=[p for p in target.rglob('*.bundle') if p.is_file()]
          assert bundles
          finalizers=[p for p in target.rglob('*') if p.is_file() and p.stat().st_size==int(os.environ['FINALIZER_V4_BYTES']) and sha(p.read_bytes())==os.environ['FINALIZER_V4_SHA256']]
          assert len(finalizers)==1
          shutil.copy2(finalizers[0],root/'source/finalizer-v4.sh')
          shutil.copy2(approval_path,root/'receipt/normalized-approval.json')
          (root/'receipt/bindings.json').write_text(json.dumps(bindings,indent=2,sort_keys=True)+'\n')
          (root/'receipt/normalization.json').write_text(json.dumps(norm,indent=2,sort_keys=True)+'\n')
          custody={'status':'cycle-011-rastel-normalization-artifact-authenticated','version':1,'source':{'pr':int(os.environ['NORMALIZER_PR']),'head':os.environ['NORMALIZER_HEAD'],'run':int(os.environ['NORMALIZER_RUN']),'job':int(os.environ['NORMALIZER_JOB']),'artifact':int(os.environ['NORMALIZER_ARTIFACT']),'artifact_sha256':os.environ['NORMALIZER_ZIP_SHA256']},'ledgers':ledgers,'normalization_identity':norm['identity'],'approval_identity':identity,'bindings_identity':bindings['identity'],'bundle_count':len(bundles)}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/normalizer-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_BASE=%s\nNORMALIZER_PR=%s\nNORMALIZER_HEAD=%s\nNORMALIZER_RUN=%s\nNORMALIZER_JOB=%s\nNORMALIZER_ARTIFACT=%s\nNORMALIZER_ZIP_SHA256=%s\n' "$pr" "$head" "$base" "$normalizer_pr" "$normalizer_head" "$run_id" "$normalizer_job" "$normalizer_artifact" "$normalizer_sha" >> "$GITHUB_ENV"

      - name: Import exact candidate bundle into disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          bindings="$OUT/receipt/bindings.json"
          candidate="$(jq -r '.candidate.commit' "$bindings")"
          parent="$(jq -r '.candidate.parent' "$bindings")"
          tree="$(jq -r '.candidate.tree' "$bindings")"
          mapfile -d '' bundles < <(find "$PACKET" -type f -name '*.bundle' -print0)
          test "${#bundles[@]}" -ge 1
          found=0
          : > "$OUT/logs/bundle-heads.tsv"
          for bundle in "${bundles[@]}"; do
            git bundle verify "$bundle" 2>&1 | tee -a "$OUT/logs/bundle-verify.log"
            if git bundle list-heads "$bundle" | grep -q "^$candidate "; then
              git fetch --no-tags "$bundle" "$candidate:refs/closure-preflight/$candidate"
              found=$((found+1))
            fi
            git bundle list-heads "$bundle" | sed "s#^#$bundle\t#" >> "$OUT/logs/bundle-heads.tsv"
          done
          test "$found" -ge 1
          test "$(git show -s --format=%P "$candidate")" = "$parent"
          test "$(git show -s --format=%T "$candidate")" = "$tree"
          test "$(git rev-list --count "$parent".."$candidate")" = 1
          test -z "$(git rev-list --merges "$parent".."$candidate")"
          git worktree add --detach "$WORKTREE" "$candidate"
          cd "$WORKTREE"
          npm ci
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/candidate-autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/candidate-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/candidate-status.json" >/dev/null
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/candidate-media.log"
          grep -F '22/22 complete' "$OUT/logs/candidate-media.log" >/dev/null
          test -z "$(git status --porcelain)"
          printf 'CANDIDATE=%s\nCANDIDATE_PARENT=%s\nCANDIDATE_TREE=%s\n' "$candidate" "$parent" "$tree" >> "$GITHUB_ENV"

      - name: Extract and execute only the native record-cycle invocation
        shell: bash
        run: |
          set -euo pipefail
          REVIEWED_AT="$(jq -r '.observer.reviewed_at' "$OUT/receipt/bindings.json")"
          APPROVAL_IDENTITY="$(jq -r '.identity' "$OUT/receipt/normalized-approval.json")"
          CANDIDATE_RECEIPT_IDENTITY="$(jq -r '.candidate.receipt_identity' "$OUT/receipt/bindings.json")"
          export REVIEWED_AT APPROVAL_IDENTITY CANDIDATE_RECEIPT_IDENTITY
          python3 - <<'PY'
          import hashlib,json,os,re,shlex,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); source=(root/'source/finalizer-v4.sh').read_text()
          lines=source.splitlines(keepends=True)
          hits=[i for i,line in enumerate(lines) if 'waterline.mjs record-cycle' in line]
          assert len(hits)==1,hits
          i=hits[0]
          start=i
          while start>0 and lines[start-1].rstrip().endswith('\\'):
              start-=1
          end=i
          while end<len(lines)-1 and lines[end].rstrip().endswith('\\'):
              end+=1
          snippet=''.join(lines[start:end+1])
          replacements={
              os.environ['OLD_TASK']:os.environ['TASK_ID'],
              os.environ['OLD_LEASE']:os.environ['EXPECTED_LEASE'],
              os.environ['OLD_WALL']:os.environ['WALL_ID'],
              os.environ['OLD_REVIEWED_AT']:os.environ['REVIEWED_AT'],
              os.environ['OLD_REVIEW_IDENTITY']:os.environ['APPROVAL_IDENTITY'],
              os.environ['OLD_CANDIDATE_IDENTITY']:os.environ['CANDIDATE_RECEIPT_IDENTITY'],
              os.environ['OLD_CANDIDATE_COMMIT']:os.environ['CANDIDATE'],
              os.environ['OLD_CANDIDATE_TREE']:os.environ['CANDIDATE_TREE'],
              os.environ['OLD_REVIEW_STATUS']:os.environ['NEW_REVIEW_STATUS'],
          }
          changed=[]
          for old,new in replacements.items():
              count=snippet.count(old)
              if count:
                  snippet=snippet.replace(old,new); changed.append({'old':old,'new':new,'occurrences':count})
          assignment_re=re.compile(r'^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)=(.*)$')
          assignments={}
          for line in lines[:start]:
              match=assignment_re.match(line.rstrip('\n'))
              if not match:continue
              key,value=match.groups()
              if '$(' in value or '`' in value or '<<' in value:continue
              for old,new in replacements.items():value=value.replace(old,new)
              assignments[key]=value
          aliases={
              'TASK_ID':os.environ['TASK_ID'],'TASK':os.environ['TASK_ID'],'LEASE_ID':os.environ['EXPECTED_LEASE'],'LEASE':os.environ['EXPECTED_LEASE'],'WALL_ID':os.environ['WALL_ID'],'WALL':os.environ['WALL_ID'],
              'REVIEWED_AT':os.environ['REVIEWED_AT'],'REVIEW_AT':os.environ['REVIEWED_AT'],'REVIEW_IDENTITY':os.environ['APPROVAL_IDENTITY'],'APPROVAL_IDENTITY':os.environ['APPROVAL_IDENTITY'],
              'CANDIDATE_COMMIT':os.environ['CANDIDATE'],'CANDIDATE_TREE':os.environ['CANDIDATE_TREE'],'CANDIDATE_RECEIPT_IDENTITY':os.environ['CANDIDATE_RECEIPT_IDENTITY'],
              'SCOPE':'doctor-who','REVIEW_PATH':str(root/'receipt/normalized-approval.json'),'APPROVAL_PATH':str(root/'receipt/normalized-approval.json'),'OUT':str(root/'closure/runtime'),
          }
          assignments.update(aliases)
          used=sorted(set(re.findall(r'\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?',snippet)))
          script=['set -euo pipefail\n','mkdir -p "$OUT"\n']
          for key in sorted(assignments):
              value=assignments[key]
              if key in aliases:
                  script.append(f'export {key}={shlex.quote(str(value))}\n')
              elif key in used:
                  script.append(f'{key}={value}\nexport {key}\n')
          script.append(snippet if snippet.endswith('\n') else snippet+'\n')
          command=''.join(script)
          path=root/'source/record-cycle-command.sh'; path.write_text(command)
          subprocess.run(['bash','-n',str(path)],check=True)
          receipt={'status':'native-record-cycle-command-extracted','version':1,'source_lines':{'start':start+1,'end':end+1},'snippet':snippet,'used_variables':used,'assignments':{key:assignments[key] for key in used if key in assignments},'unresolved_variables':[key for key in used if key not in assignments and key not in ('PWD','HOME','PATH')],'changes':changed,'sha256':hashlib.sha256(command.encode()).hexdigest()}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/record-cycle-command.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          mkdir -p "$OUT/closure/runtime/review" "$OUT/closure/runtime/receipt"
          cp "$OUT/receipt/normalized-approval.json" "$OUT/closure/runtime/review/approval.json"
          cp "$OUT/receipt/normalized-approval.json" "$OUT/closure/runtime/receipt/review.json"
          cd "$WORKTREE"
          bash "$OUT/source/record-cycle-command.sh" 2>&1 | tee "$OUT/logs/record-cycle.log"

      - name: Retain exact native closure identities and changed paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKTREE"
          git status --porcelain=v1 > "$OUT/logs/closure-status.txt"
          test -s "$OUT/logs/closure-status.txt"
          git diff --name-status > "$OUT/logs/closure-name-status.tsv"
          git ls-files --others --exclude-standard | sed 's/^/A\t/' >> "$OUT/logs/closure-name-status.tsv"
          LC_ALL=C sort -u "$OUT/logs/closure-name-status.tsv" -o "$OUT/logs/closure-name-status.tsv"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/closure-name-status.tsv")"
          test -z "$(awk '$1 ~ /^D/ {print}' "$OUT/logs/closure-name-status.tsv")"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/closure-autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/closure-autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/closure-autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/closure-media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/closure-media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/closure-media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/closure-waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/closure-waterline-status.json"
          git diff --binary > "$OUT/closure/native-closure.patch"
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['OUT']); work=Path(os.environ['WORKTREE'])
          sha=lambda data:hashlib.sha256(data).hexdigest()
          changed=[]
          for raw in (root/'logs/closure-name-status.tsv').read_text().splitlines():
              if not raw.strip():continue
              status,path=raw.split('\t',1); changed.append({'status':status,'path':path})
          files=[]
          for row in changed:
              path=work/row['path']
              assert path.is_file(),row
              files.append(path)
          candidates=[]
          for path in files:
              if path.suffix!='.json' and not path.name.endswith('.jsonl'):continue
              if path.suffix=='.json':
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  flat=json.dumps(data,sort_keys=True,ensure_ascii=False)
                  if os.environ['TASK_ID'] in flat and os.environ['EXPECTED_LEASE'] in flat:
                      candidates.append((path,data,flat))
          assert candidates,[(row['path']) for row in changed]
          ranked=[]
          for path,data,flat in candidates:
              cycles=sorted(set(re.findall(r'\bcycle_[0-9a-f]{16,64}\b',flat)))
              events=sorted(set(re.findall(r'\bwaterline_[0-9a-f]{16,64}\b',flat)))
              score=10*bool(cycles)+8*bool(events)+4*('completed' in flat.lower())+2*('review' in flat.lower())
              identity=data.get('identity')
              valid=False
              if isinstance(identity,str) and re.fullmatch(r'[0-9a-f]{64}',identity):
                  clone=dict(data); clone.pop('identity'); valid=sha(json.dumps(clone,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
                  if valid:score+=6
              ranked.append((score,path,data,cycles,events,valid))
          ranked.sort(key=lambda row:(-row[0],row[1].as_posix()))
          top=[row for row in ranked if row[0]==ranked[0][0]]
          assert len(top)==1,[(score,path.as_posix(),cycles,events) for score,path,_,cycles,events,_ in top]
          score,path,data,cycles,events,valid=top[0]
          assert len(cycles)==1 and len(events)==1 and valid
          cycle_id=cycles[0]; event_id=events[0]
          archive=root/'closure/native-closure.tar.gz'
          with tarfile.open(archive,'w:gz',format=tarfile.PAX_FORMAT) as tar:
              for file in sorted(files,key=lambda p:p.relative_to(work).as_posix()):
                  info=tar.gettarinfo(str(file),arcname=file.relative_to(work).as_posix()); info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''
                  with file.open('rb') as handle:tar.addfile(info,handle)
          file_manifest=[]
          for file in sorted(files,key=lambda p:p.relative_to(work).as_posix()):
              rel=file.relative_to(work).as_posix(); file_manifest.append({'path':rel,'bytes':file.stat().st_size,'sha256':sha(file.read_bytes()),'mode':oct(file.stat().st_mode & 0o777)})
          receipt={
              'status':'cycle-011-rastel-native-cycle-closure-preflight-complete-v1','version':1,
              'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD']},
              'normalizer':{'pr':int(os.environ['NORMALIZER_PR']),'head':os.environ['NORMALIZER_HEAD'],'run':int(os.environ['NORMALIZER_RUN']),'job':int(os.environ['NORMALIZER_JOB']),'artifact':int(os.environ['NORMALIZER_ARTIFACT']),'artifact_sha256':os.environ['NORMALIZER_ZIP_SHA256']},
              'candidate':{'commit':os.environ['CANDIDATE'],'parent':os.environ['CANDIDATE_PARENT'],'tree':os.environ['CANDIDATE_TREE'],'task':os.environ['TASK_ID'],'lease':os.environ['EXPECTED_LEASE'],'wall':os.environ['WALL_ID']},
              'review':{'status':os.environ['NEW_REVIEW_STATUS'],'identity':json.loads((root/'receipt/normalized-approval.json').read_text())['identity'],'reviewed_at':json.loads((root/'receipt/bindings.json').read_text())['observer']['reviewed_at']},
              'native':{'cycle_id':cycle_id,'waterline_event':event_id,'receipt_path':path.relative_to(work).as_posix(),'receipt_identity':data['identity'],'changed_paths':changed,'file_manifest':file_manifest,'patch_sha256':sha((root/'closure/native-closure.patch').read_bytes()),'archive_sha256':sha(archive.read_bytes())},
              'queue':{'total':316,'queued':305,'resolved':11,'in_flight':0},
              'gates':{'record_cycle_command':True,'autopilot':True,'media_22_of_22':True,'waterline_validate':True,'deletion_free':True,'workflow_free':True},
              'boundary':{'disposable_simulation':True,'finalizer_executed':False,'product_commit_created':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/native-closure.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          jq -e '.status=="cycle-011-rastel-native-cycle-closure-preflight-complete-v1" and .boundary.disposable_simulation==true and .boundary.finalizer_executed==false' "$OUT/receipt/native-closure.json" >/dev/null

      - name: Seal native closure preflight packet
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cycle-closure-preflight-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1
            /tmp/doctor-who-cycle-011-rastel-cycle-closure-preflight-v1-worktree
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
