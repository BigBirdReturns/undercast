name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      EVIDENCE_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11.yml
      INSTALL_PARENT: 1499ce3281d282bd7e135a362ed6a32755c16ee0
      INSTALLED_MAIN: 5c72d9d1dcd8011449b487cff306a033964cdb24
      INSTALLER_PR: "929"
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v11
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml
      WRITER_BLOB: 203f6a17e4d5706af1a1193c71704f8acdf2195e
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V10_EVIDENCE_RUN: "31468250304"
      V10_EVIDENCE_ARTIFACT: "9092386723"
      V10_EVIDENCE_SHA256: 55d93d4f01f3d096044ff7e2d5b26977b008f248e84a62bd412ec012f626c681
      V10_EVIDENCE_IDENTITY: 4ad58944ee2003439c28ca7d0cbaf5f45e3de97277d50cd9bc8746216071e759
      V10_OBSERVER_RUN: "31468869745"
      V10_OBSERVER_ARTIFACT: "9092563131"
      V10_OBSERVER_SHA256: f65e2b804fa5aea1b1b1375a41551becb01bf3af1f478257ed05e72da42dcca9
      V10_OBSERVER_IDENTITY: 3e02c6ac2b8890089bd5bd3f6bdb69bc48cd61028ea4f79954db528fb2a61f67
      V10_WRITER_RUN: "31468253452"
      V10_WRITER_JOB: "93705643048"
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      OUTSIDE_PREFIX: observer/cycle012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

    steps:
      - name: Freeze exact current-main cleanup evidence V11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,packets,payload}

          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$INSTALLED_MAIN" > "$OUT/api/main-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR/files?per_page=100" > "$OUT/api/own-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$INSTALLER_PR" > "$OUT/api/installer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$INSTALL_PARENT...$INSTALLED_MAIN" > "$OUT/api/install-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$BASE_PRODUCT...$INSTALLED_MAIN" > "$OUT/api/product-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$WRITER_PATH?ref=$INSTALLED_MAIN" > "$OUT/api/writer-content.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          load=lambda name:json.loads((root/name).read_text())
          main=load('main-ref.json')
          commit=load('main-commit.json')
          own=load('own-pr.json')
          own_files=load('own-files.json')
          installer=load('installer-pr.json')
          install=load('install-compare.json')
          product=load('product-compare.json')
          writer=load('writer-content.json')
          assert main['object']['sha']==os.environ['INSTALLED_MAIN']==os.environ['CURRENT_BASE']
          assert commit['sha']==os.environ['INSTALLED_MAIN']
          assert [row['sha'] for row in commit['parents']]==[os.environ['INSTALL_PARENT']]
          assert own['number']==int(os.environ['CURRENT_PR'])
          assert own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['ref']=='main' and own['base']['sha']==os.environ['INSTALLED_MAIN']
          assert own['head']['ref']==os.environ['EVIDENCE_BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert [(row['filename'],row['status']) for row in own_files]==[(os.environ['EVIDENCE_PATH'],'added')]
          assert installer['number']==int(os.environ['INSTALLER_PR'])
          assert installer['state']=='closed' and installer['merged'] is True
          assert installer['head']['ref']==os.environ['INSTALLER_BRANCH']
          assert installer['head']['sha']==os.environ['INSTALLED_MAIN']
          assert installer['base']['sha']==os.environ['INSTALL_PARENT']
          assert installer['merge_commit_sha']==os.environ['INSTALLED_MAIN']
          assert installer['commits']==1 and installer['changed_files']==1
          assert install['status']=='ahead' and install['ahead_by']==1 and install['behind_by']==0 and install['total_commits']==1
          assert [(row['filename'],row['status']) for row in install['files']]==[(os.environ['WRITER_PATH'],'added')]
          expected_cleanup=[
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml',
          ]
          preserved=['data/MEDIA-SEARCH-LATEST.json','data/journal/media-search.jsonl']
          rows=sorted((row['filename'],row['status']) for row in product['files'])
          assert rows==sorted([(path,'added') for path in expected_cleanup]+[(path,'modified') for path in preserved])
          assert writer['path']==os.environ['WRITER_PATH'] and writer['sha']==os.environ['WRITER_BLOB']
          PY

          for spec in \
            "v10-evidence:$V10_EVIDENCE_ARTIFACT:$V10_EVIDENCE_SHA256" \
            "v10-observer:$V10_OBSERVER_ARTIFACT:$V10_OBSERVER_SHA256"
          do
            IFS=: read -r label artifact sha <<<"$spec"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/$label-artifact.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/packets/$label.zip"
            test "$(jq -r '.digest' "$OUT/api/$label-artifact.json")" = "sha256:$sha"
            test "$(sha256sum "$OUT/packets/$label.zip" | awk '{print $1}')" = "$sha"
            ZIP="$OUT/packets/$label.zip" DEST="$OUT/packets/$label" python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath
          source=Path(os.environ['ZIP'])
          dest=Path(os.environ['DEST'])
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(source) as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({i.filename for i in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  target=dest.joinpath(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(info))
          PY
          done

          (
            cd "$OUT/packets/v10-evidence"
            sha256sum -c SHA256SUMS.pre
            sha256sum -c SHA256SUMS
            test "$(cat EVIDENCE_COMPLETE)" = "$V10_EVIDENCE_IDENTITY"
            test "$(jq -r '.identity' evidence.json)" = "$V10_EVIDENCE_IDENTITY"
          )
          (
            cd "$OUT/packets/v10-observer"
            sha256sum -c SHA256SUMS.pre
            sha256sum -c SHA256SUMS
            test "$(cat OBSERVER_COMPLETE)" = "$V10_OBSERVER_IDENTITY"
            test "$(jq -r '.identity' observer.json)" = "$V10_OBSERVER_IDENTITY"
          )

          V10_EVIDENCE="$OUT/packets/v10-evidence/evidence.json" V10_OBSERVER="$OUT/packets/v10-observer/observer.json" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          for env,status,identity in (
              ('V10_EVIDENCE','cycle-012-current-main-cleanup-evidence-v10',os.environ['V10_EVIDENCE_IDENTITY']),
              ('V10_OBSERVER','cycle-012-cleanup-writer-v10-observed-v1',os.environ['V10_OBSERVER_IDENTITY']),
          ):
              obj=json.loads(Path(os.environ[env]).read_text())
              actual=obj.pop('identity')
              assert actual==identity
              assert hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest()==actual
              obj['identity']=actual
              assert obj['status']==status
              if env=='V10_OBSERVER':
                  assert obj['writer']['run']==int(os.environ['V10_WRITER_RUN'])
                  jobs=[row for row in obj['writer']['jobs'] if row['id']==int(os.environ['V10_WRITER_JOB'])]
                  assert len(jobs)==1 and jobs[0]['name']=='write' and jobs[0]['conclusion']=='skipped'
                  assert obj['terminal_cleanup_proved'] is False
                  assert obj['canonical']['main']==os.environ['INSTALL_PARENT']
          PY

          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "outside:$OUTSIDE_PREFIX" "terminal:$TERMINAL_PREFIX"; do
            label="${spec%%:*}"
            prefix="${spec#*:}"
            gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" > "$OUT/api/live-$label-refs.json" || printf '[]\n' > "$OUT/api/live-$label-refs.json"
          done

          API_ROOT="$OUT/api" python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root=Path(os.environ['API_ROOT'])
          repo=os.environ['GITHUB_REPOSITORY']
          owner=repo.split('/')[0]
          patterns={
              'agent':re.compile(r'^agent/doctor-who-cycle-012-selection-cleanup-writer-v[0-9]+$'),
              'observer':re.compile(r'^observer/doctor-who-cycle-012-selection-cleanup(?:-[a-z0-9-]+)?-v[0-9]+$'),
              'outside':re.compile(r'^observer/cycle012-[a-z0-9-]*(?:cleanup|writer)[a-z0-9-]*-v[0-9]+$'),
              'terminal':re.compile(r'^observer/doctor-who-cycle-011-rastel-cleanup-terminal-[a-z0-9-]+$'),
          }
          refs=[]
          for kind in ('agent','observer','outside','terminal'):
              rows=json.loads((root/f'live-{kind}-refs.json').read_text())
              for raw in rows:
                  branch=raw['ref'].removeprefix('refs/heads/')
                  head=raw['object']['sha']
                  assert patterns[kind].fullmatch(branch), (kind,branch)
                  prs=json.loads(subprocess.check_output(
                      ['gh','api',f'/repos/{repo}/pulls?state=all&head={owner}:{branch}&per_page=100'],
                      text=True))
                  exact=[pr for pr in prs if pr['head']['ref']==branch and pr['head']['sha']==head]
                  assert len(exact)==1, (branch,head,[pr['number'] for pr in exact])
                  pr=exact[0]
                  if pr['state']=='open':
                      assert pr['merged'] is False and pr['draft'] is True
                      action='close_without_merge_and_delete_ref'
                  else:
                      assert pr['state']=='closed'
                      action='delete_ref_only'
                  refs.append({
                      'branch':branch,'head':head,'kind':kind,
                      'pr':pr['number'],'pr_state':pr['state'],
                      'pr_merged':pr['merged'],'pr_draft':pr['draft'],
                      'action':action,
                  })
          refs.sort(key=lambda row:row['branch'])
          assert any(row['branch']==os.environ['INSTALLER_BRANCH'] and row['head']==os.environ['INSTALLED_MAIN'] for row in refs)
          assert any(row['branch']==os.environ['EVIDENCE_BRANCH'] and row['head']==os.environ['CURRENT_HEAD'] for row in refs)
          (root/'frozen-refs.json').write_text(json.dumps(refs,indent=2,sort_keys=True)+'\n')
          PY

          API_ROOT="$OUT/api" OUT_DIR="$OUT/payload" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['API_ROOT'])
          main=json.loads((root/'main-ref.json').read_text())['object']['sha']
          commit=json.loads((root/'main-commit.json').read_text())
          refs=json.loads((root/'frozen-refs.json').read_text())
          cleanup_paths=[
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml',
          ]
          receipt={
              'status':'cycle-012-current-main-cleanup-evidence-v11',
              'version':11,
              'carrier':{
                  'pr':int(os.environ['CURRENT_PR']),
                  'head':os.environ['CURRENT_HEAD'],
                  'branch':os.environ['EVIDENCE_BRANCH'],
                  'path':os.environ['EVIDENCE_PATH'],
              },
              'canonical':{
                  'base_product':os.environ['BASE_PRODUCT'],
                  'install_parent':os.environ['INSTALL_PARENT'],
                  'main':main,'tree':commit['tree']['sha'],
                  'writer_path':os.environ['WRITER_PATH'],
                  'writer_blob':os.environ['WRITER_BLOB'],
                  'cleanup_paths':cleanup_paths,
                  'preserved_paths':['data/MEDIA-SEARCH-LATEST.json','data/journal/media-search.jsonl'],
              },
              'predecessor':{
                  'v10_evidence':{
                      'run':int(os.environ['V10_EVIDENCE_RUN']),
                      'artifact':int(os.environ['V10_EVIDENCE_ARTIFACT']),
                      'artifact_sha256':os.environ['V10_EVIDENCE_SHA256'],
                      'identity':os.environ['V10_EVIDENCE_IDENTITY'],
                  },
                  'v10_writer':{
                      'run':int(os.environ['V10_WRITER_RUN']),
                      'job':int(os.environ['V10_WRITER_JOB']),
                      'conclusion':'skipped',
                      'observer_run':int(os.environ['V10_OBSERVER_RUN']),
                      'observer_artifact':int(os.environ['V10_OBSERVER_ARTIFACT']),
                      'observer_artifact_sha256':os.environ['V10_OBSERVER_SHA256'],
                      'observer_identity':os.environ['V10_OBSERVER_IDENTITY'],
                  },
              },
              'refs':refs,
              'retained':{
                  'task':'ap_8965086737382df0e88366db',
                  'performer':'Dan Starkey','role':'Senstarg',
                  'mode':'physical-prosthetic','kind':'face','wall':'UC-1357',
                  'selection_identity':'d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a',
                  'source_evidence_identity':'ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f',
                  'source_receipt_identity':'1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a',
                  'media_review_identity':'eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587',
                  'modality_identity':'ef754232b56a25f9f703cbaaaa03290f1cb9a3d97c354d00a58e21e75f732e50',
              },
              'boundary':{
                  'cleanup_authority':True,
                  'repository_write_here':False,'canonical_mutation_here':False,
                  'force_update':False,'merge':False,'lease_issued':False,
                  'queue_mutated':False,'wall_created':False,'media_adopted':False,
                  'cycle_receipt_written':False,'cycle_012_product_authority':False,
                  'outside_human_dependency':False,'owner_physical_action_required':False,
              },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out=Path(os.environ['OUT_DIR'])
          out.mkdir(parents=True,exist_ok=True)
          (out/'evidence.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'EVIDENCE_COMPLETE').write_text(receipt['identity']+'\n')
          (out/'frozen-refs.json').write_text(json.dumps(refs,indent=2,sort_keys=True)+'\n')
          PY

          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' |
              LC_ALL=C sort |
              while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
