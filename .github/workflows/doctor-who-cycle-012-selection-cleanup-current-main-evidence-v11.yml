name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      BRANCH: observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11.yml
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      INSTALLED_MAIN: 5c72d9d1dcd8011449b487cff306a033964cdb24
      V10_MAIN: 1499ce3281d282bd7e135a362ed6a32755c16ee0
      PRODUCT_MAIN: d33580cbc73b7bcab734ec3da84a0e977e852ad0
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml
      V10_BLOB: b8e3d0b65390c620ac166433ac54539ac0ed4085
      V10_DECLARED_SHA256: 0de68be224bcc06aae678c592ae1f765964eba19987764f1d47ae92b9d39f082
      V10_ACTUAL_SHA256: 87e959569a62dd1b6341849ce19a146e4e09bb4f910a22a6dd91e809b2039a80
      V10_RECOVERED_SHA256: 63046aba120852d43e24ee5f46dbfb4d6be3f92a635c52d655197d7b9cde243a
      OUTSIDE_PREFIX: observer/cycle012-
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

    steps:
      - name: Freeze exact current-main cleanup evidence V11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload,v10}
          repo="/repos/$GITHUB_REPOSITORY"

          test "$(gh api "$repo/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          test "$CURRENT_BASE" = "$INSTALLED_MAIN"
          gh api "$repo/pulls/$CURRENT_PR" > "$OUT/api/current-pr.json"
          gh api "$repo/compare/$INSTALLED_MAIN...$CURRENT_HEAD" > "$OUT/api/current-compare.json"
          gh api "$repo/git/commits/$INSTALLED_MAIN" > "$OUT/api/main-commit.json"
          gh api "$repo/contents/$WRITER_PATH?ref=$INSTALLED_MAIN" > "$OUT/api/writer-content.json"
          PR="$OUT/api/current-pr.json" COMPARE="$OUT/api/current-compare.json" MAIN="$OUT/api/main-commit.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr=json.loads(Path(os.environ['PR']).read_text())
          compare=json.loads(Path(os.environ['COMPARE']).read_text())
          main=json.loads(Path(os.environ['MAIN']).read_text())
          assert pr['number']==int(os.environ['CURRENT_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['INSTALLED_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert len(compare['files'])==1
          assert compare['files'][0]['filename']==os.environ['SELF'] and compare['files'][0]['status']=='added'
          assert main['sha']==os.environ['INSTALLED_MAIN']
          assert [p['sha'] for p in main['parents']]==[os.environ['V10_MAIN']]
          PY

          gh api "$repo/git/blobs/$V10_BLOB" > "$OUT/api/v10-blob.json"
          jq -r '.content' "$OUT/api/v10-blob.json" | tr -d '\n' | base64 -d > "$OUT/v10/carrier.sh.gz"
          test "$(git hash-object --stdin < "$OUT/v10/carrier.sh.gz")" = "$V10_BLOB"
          test "$(wc -c < "$OUT/v10/carrier.sh.gz" | tr -d ' ')" = 4074
          test "$(sha256sum "$OUT/v10/carrier.sh.gz" | awk '{print $1}')" = "$V10_ACTUAL_SHA256"
          test "$V10_ACTUAL_SHA256" != "$V10_DECLARED_SHA256"
          if gzip -t "$OUT/v10/carrier.sh.gz" 2>"$OUT/v10/gzip-error.txt"; then exit 1; fi
          RAW="$OUT/v10/carrier.sh.gz" RECOVERED="$OUT/v10/carrier.sh" python3 - <<'PY'
          import hashlib, os, re, struct, zlib
          from pathlib import Path
          raw=Path(os.environ['RAW']).read_bytes()
          recovered=zlib.decompress(raw[10:-8],-15)
          assert len(recovered)==14316
          assert hashlib.sha256(recovered).hexdigest()==os.environ['V10_RECOVERED_SHA256']
          assert struct.unpack('<I',raw[-4:])[0]==14316
          blocks=re.findall(rb"python3 - <<'PY'\n(.*?)\nPY",recovered,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1): compile(block.decode(),f'<v10-recovered-{index}>','exec')
          Path(os.environ['RECOVERED']).write_bytes(recovered)
          PY
          if bash -n "$OUT/v10/carrier.sh" 2>"$OUT/v10/bash-error.txt"; then exit 1; fi
          grep -F 'cp "$OUT/api/main-final.json" "$OUT/payload/"T/api/main-fincleanup-commit-final.json' "$OUT/v10/carrier.sh" > "$OUT/v10/failure-line.txt"

          cat > "$OUT/api/expected-refs.tsv" <<EOF_REFS
          agent/doctor-who-cycle-012-selection-cleanup-writer-v8	agent	916	delete_ref_only
          agent/doctor-who-cycle-012-selection-cleanup-writer-v9	agent	921	delete_ref_only
          agent/doctor-who-cycle-012-selection-cleanup-writer-v10	agent	922	delete_ref_only
          agent/doctor-who-cycle-012-selection-cleanup-writer-v11	agent	929	delete_ref_only
          observer/doctor-who-cycle-012-selection-cleanup-evidence-v7	observer	915	delete_ref_only
          observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8	observer	917	delete_ref_only
          observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10	observer	923	delete_ref_only
          $BRANCH	observer	$CURRENT_PR	close_without_merge_and_delete_ref
          observer/cycle012-cleanup-writer-v8-source-export-v1	outside	919	delete_ref_only
          observer/cycle012-residual-cleanup-writer-v8-observer-v1	outside	920	delete_ref_only
          observer/cycle012-v10-writer-source-export-v1	outside	924	delete_ref_only
          EOF_REFS
          sed -i 's/^          //' "$OUT/api/expected-refs.tsv"
          index=0
          while IFS=$'\t' read -r branch kind pr action; do
            index=$((index+1)); gh api "$repo/git/ref/heads/$branch" > "$OUT/api/ref-$index.json"; gh api "$repo/pulls/$pr" > "$OUT/api/pr-$index.json"
          done < "$OUT/api/expected-refs.tsv"
          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "outside:$OUTSIDE_PREFIX" "terminal:$TERMINAL_PREFIX"; do
            label="${spec%%:*}"; prefix="${spec#*:}"; gh api "$repo/git/matching-refs/heads/$prefix" > "$OUT/api/live-$label.json" || printf '[]\n' > "$OUT/api/live-$label.json"
          done

          OUT_DIR="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); api=root/'api'
          specs=[(b,k,int(p),a) for b,k,p,a in (line.split('\t') for line in (api/'expected-refs.tsv').read_text().splitlines())]
          refs=[]
          for index,(branch,kind,pr_number,action) in enumerate(specs,1):
              ref=json.loads((api/f'ref-{index}.json').read_text()); pr=json.loads((api/f'pr-{index}.json').read_text())
              assert ref['ref'].removeprefix('refs/heads/')==branch
              assert pr['number']==pr_number and pr['head']['ref']==branch and pr['head']['sha']==ref['object']['sha']
              if action=='close_without_merge_and_delete_ref': assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
              else: assert pr['state']=='closed'
              refs.append({'branch':branch,'head':ref['object']['sha'],'kind':kind,'pr':pr_number,'pr_state':pr['state'],'pr_merged':pr['merged'],'pr_draft':pr['draft'],'action':action})
          live=[]
          for kind in ('agent','observer','outside','terminal'):
              for row in json.loads((api/f'live-{kind}.json').read_text()): live.append({'branch':row['ref'].removeprefix('refs/heads/'),'head':row['object']['sha'],'kind':kind})
          assert sorted(live,key=lambda r:r['branch'])==sorted(({'branch':r['branch'],'head':r['head'],'kind':r['kind']} for r in refs),key=lambda r:r['branch'])
          main=json.loads((api/'main-commit.json').read_text()); writer=json.loads((api/'writer-content.json').read_text())
          cleanup_paths=[f'.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v{v}.yml' for v in (1,3,4,5,6,7,8,9,10,11)]
          evidence={'status':'cycle-012-current-main-cleanup-evidence-v11','version':11,'canonical':{'main':os.environ['INSTALLED_MAIN'],'tree':main['tree']['sha'],'writer_path':os.environ['WRITER_PATH'],'writer_blob':writer['sha'],'cleanup_paths':cleanup_paths,'preserved_paths':['data/MEDIA-SEARCH-LATEST.json','data/journal/media-search.jsonl'],'base_product':os.environ['BASE_PRODUCT'],'product_main':os.environ['PRODUCT_MAIN'],'v10_main':os.environ['V10_MAIN']},'retained':{'task':'ap_8965086737382df0e88366db','performer':'Dan Starkey','role':'Senstarg','mode':'physical-prosthetic','kind':'face','wall':'UC-1357','selection_identity':'d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a','source_evidence_identity':'ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f','source_receipt_identity':'1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a','media_review_identity':'eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587','modality_identity':'ef754232b56a25f9f703cbaaaa03290f1cb9a3d97c354d00a58e21e75f732e50'},'v10_failure':{'blob':os.environ['V10_BLOB'],'bytes':4074,'declared_sha256':os.environ['V10_DECLARED_SHA256'],'actual_sha256':os.environ['V10_ACTUAL_SHA256'],'gzip_crc_valid':False,'recovered_bytes':14316,'recovered_sha256':os.environ['V10_RECOVERED_SHA256'],'bash_syntax_valid':False,'python_blocks':5,'failure':'malformed terminal copy command'},'refs':refs,'counts':{'agent':sum(r['kind']=='agent' for r in refs),'observer':sum(r['kind']=='observer' for r in refs),'outside':sum(r['kind']=='outside' for r in refs),'terminal':sum(r['kind']=='terminal' for r in refs),'total':len(refs)},'boundary':{'cleanup_authority':True,'repository_write_here':False,'canonical_mutation_here':False,'force_update':False,'merge':False,'lease_issued':False,'queue_mutated':False,'wall_created':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          evidence['identity']=hashlib.sha256(json.dumps(evidence,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          payload=root/'payload'; (payload/'evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n'); (payload/'EVIDENCE_COMPLETE').write_text(evidence['identity']+'\n'); (payload/'refs.json').write_text(json.dumps(refs,indent=2,sort_keys=True)+'\n')
          for src,name in [(api/'main-commit.json','main-commit.json'),(api/'current-pr.json','current-pr.json'),(api/'current-compare.json','current-compare.json'),(root/'v10'/'failure-line.txt','v10-failure-line.txt'),(root/'v10'/'gzip-error.txt','v10-gzip-error.txt'),(root/'v10'/'bash-error.txt','v10-bash-error.txt')]: (payload/name).write_bytes(src.read_bytes())
          PY
          (
            cd "$OUT/payload"; find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre; sha256sum SHA256SUMS.pre > SHA256SUMS; sha256sum -c SHA256SUMS.pre; sha256sum -c SHA256SUMS; test "$(cat EVIDENCE_COMPLETE)" = "$(jq -r '.identity' evidence.json)"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
