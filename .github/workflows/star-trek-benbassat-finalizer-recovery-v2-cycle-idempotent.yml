name: star-trek-benbassat-finalizer-recovery-v2-cycle-idempotent

on:
  push:
    branches:
      - agent/star-trek-benbassat-finalizer-recovery-v2

permissions:
  actions: write
  contents: write

concurrency:
  group: star-trek-benbassat-finalizer-recovery-v2-cycle-idempotent
  cancel-in-progress: false

env:
  LIVE_MAIN: 29b9ab279dac90fad82aac48633ef83d5ac81b39
  LIVE_TREE: 7c2ad054ceb3b3cbd1f0c00c838cfc3d014ff169
  LIVE_MESSAGE: "Media search: record rolling candidate attempt (2026-08-25)"
  ALICE_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  ALICE_TREE: 7f9057770c8e622d71ef41b183811fe47fcdd6ed
  CLAIM_COMMIT: 0a7e2ed0c1fa7d97b1feb9c0b7e3ef78fd4e5ca2
  CLAIM_TREE: 63802f7e11f19f7f5ffc5e8093c9866e0429813c
  CANDIDATE_COMMIT: 637d0b9d0cef669f354b9c4f5961a8e8bd0b1c19
  CANDIDATE_TREE: 0c09b5da9d37157f954725578a9b17bcd7d08109
  CANDIDATE_RECEIPT_SHA: 5d4f02fab0a0e77f9b8ab19d155be3b9f09437332403bb3e9a0681c0ab2512e3
  REVIEW_COMMIT: 41638aff65880a48061b2d20baafc4adfb0602d8
  REVIEW_SHA: a3cf9d3230e235f8ecd95bda46c27b24c5649638208d2b3779511b80cfa745cf
  SOURCE_REVIEW_SHA: 4568d3e5a64d671e83b6f4f37049131b7000943ce3521986495b88916857cfc5
  MEDIA_RECEIPT_SHA: cb2db2f214ac4ecbd10cca1e26a71b80c9fe09ba08127617ceaadf586d9a4af0
  PREPRODUCT_RECEIPT_SHA: 1ce1896b186cd3c7a6ec5540cfb79367aa7b8e95525a30a4a40dca0a925122f8
  CLAIM_RECEIPT_SHA: 25def3142f4c196f45c1a1d2e99e7d4852ba05d859f11d15ba22aace3cdc883b
  TASK_ID: ap_dd7d1c73ed237230cd6e1d0b
  PERFORMER: Nolan North
  CHARACTER: Benbassat
  FINGERPRINT: 78e1384a3a11787064f98516e5759b55b33369d161067804c2d77f2ef6ef8885
  LEASE_ID: lease_151ba8f5efac7d922ea2f8c2
  WALL_ID: UC-1397
  CANDIDATE_BRANCH: agent/star-trek-benbassat-candidate-result-v4
  REVIEW_BRANCH: agent/star-trek-benbassat-independent-review-result-v8
  REVIEW_PATH: transport/star-trek-benbassat-independent-review-v8/independent-review.json
  CLAIM_BRANCH: agent/star-trek-benbassat-claim-result-v1
  CLAIM_PATH: data/review/adapter-sdk/star-trek-benbassat-claim.json
  SOURCE_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  SOURCE_PATH: transport/star-trek-benbassat-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-benbassat-media-result-v1
  MEDIA_PATH: transport/star-trek-benbassat-media-v1/media-receipt.json
  PREPRODUCT_BRANCH: agent/star-trek-benbassat-preproduct-settlement-result-v2
  PREPRODUCT_PATH: transport/star-trek-benbassat-preproduct-settlement-v2/settlement.json
  RESULT_BRANCH: agent/star-trek-benbassat-finalizer-result-v2
  OUT: /tmp/star-trek-benbassat-finalizer-v2
  REVIEW_ROOT: /tmp/star-trek-benbassat-finalizer-v2/independent-review
  SOURCE_ROOT: /tmp/star-trek-benbassat-finalizer-v2/source-review
  MEDIA_ROOT: /tmp/star-trek-benbassat-finalizer-v2/media
  PREPRODUCT_ROOT: /tmp/star-trek-benbassat-finalizer-v2/preproduct
  FINALIZER: /tmp/star-trek-benbassat-finalizer-v2.py
  ALICE_RECEIPT_PATH: data/review/adapter-sdk/star-trek-alice-cycle.json
  ALICE_RECEIPT_SHA: 07331e142b70e21ff8eed6c40a23a576c259c9cd2afae462250a8961bcc09472
  ALICE_CHECKER_PATH: scripts/star-trek-alice-cycle.mjs
  ALICE_CHECKER_SHA: 7b924da030e7ea39d868bd582ae41dc6df443cf543bf97f2f22f960db06c2371
  ALICE_CYCLE_ID: cycle_bc4e10d8ce3d09b5f12b81cc
  RECEIPT_PATH: data/review/adapter-sdk/star-trek-benbassat-cycle.json
  CHECKER_PATH: scripts/star-trek-benbassat-cycle.mjs
  CARRIER_PARTS_ROOT: .github/recovery/star-trek-benbassat-finalizer-recovery-v2
  CARRIER_SHA256: b3225741d0fe90dc3209ca09fcefe0b2c1ba6f2b69b15135e3418a1be921a4cb
  PACKAGE_UNPACK: /tmp/star-trek-benbassat-finalizer-cycle-idempotent-v2
  PACKAGE_ROOT: /tmp/star-trek-benbassat-finalizer-cycle-idempotent-v2/star-trek-benbassat-finalizer-recovery-v2
  PATCH_RECEIPT: /tmp/star-trek-benbassat-finalizer-idempotence-patch.json

jobs:
  finalize:
    name: finalize-reviewed-benbassat-with-exact-cycle-idempotence
    if: ${{ github.event.head_commit.message == 'Finalize reviewed Star Trek Benbassat cycle v2 with exact-cycle idempotence' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct, verify, patch, and execute the sealed finalizer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PACKAGE_UNPACK"
          mkdir -p "$PACKAGE_UNPACK"
          cat \
            "$CARRIER_PARTS_ROOT/carrier.part01" \
            "$CARRIER_PARTS_ROOT/carrier.part02" \
            "$CARRIER_PARTS_ROOT/carrier.part03" \
            "$CARRIER_PARTS_ROOT/carrier.part04" \
            "$CARRIER_PARTS_ROOT/carrier.part05" \
            "$CARRIER_PARTS_ROOT/carrier.part06" \
            | tr -d '\r\n' > /tmp/star-trek-benbassat-finalizer-cycle-idempotent.b64
          base64 --decode /tmp/star-trek-benbassat-finalizer-cycle-idempotent.b64 > /tmp/star-trek-benbassat-finalizer-cycle-idempotent.zip
          test "$(sha256sum /tmp/star-trek-benbassat-finalizer-cycle-idempotent.zip | awk '{print $1}')" = "$CARRIER_SHA256"
          unzip -q /tmp/star-trek-benbassat-finalizer-cycle-idempotent.zip -d "$PACKAGE_UNPACK"
          test -d "$PACKAGE_ROOT"
          (
            cd "$PACKAGE_ROOT"
            sha256sum -c manifest.sha256
          )

          export PATCHED_FINALIZER="$PACKAGE_ROOT/.github/recovery/star-trek-benbassat-finalizer-recovery-v2/finalizer.py"
          export PATCHED_RUNNER="$PACKAGE_ROOT/run-finalizer.sh"
          export FAILED_FINALIZER_RUN=32929286855
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          finalizer = Path(os.environ["PATCHED_FINALIZER"])
          runner = Path(os.environ["PATCHED_RUNNER"])
          patch_receipt = Path(os.environ["PATCH_RECEIPT"])

          before = finalizer.read_text(encoding="utf-8")
          old = '''    waterline = load(Path("data/WATERLINE-STATE.json"))
              if any(
                  row.get("scope_id") == "star-trek" and row.get("lease_id") == LEASE_ID
                  for row in waterline.get("cycles", [])
              ):
                  raise SystemExit("Benbassat waterline cycle already exists")
              if not any(
          '''
          new = '''    waterline = load(Path("data/WATERLINE-STATE.json"))
              benbassat_cycles = [
                  row for row in waterline.get("cycles", [])
                  if row.get("scope_id") == "star-trek" and row.get("lease_id") == LEASE_ID
              ]
              if len(benbassat_cycles) > 1:
                  raise SystemExit(f"Benbassat waterline cardinality drifted: {len(benbassat_cycles)}")
              if benbassat_cycles:
                  recorded = benbassat_cycles[0]
                  review = docs["review"]
                  evidence = recorded.get("evidence") or []
                  expected_evidence = {
                      (
                          "workflow-run",
                          f"github-actions-artifact:{review.get('artifact', {}).get('id')}:"
                          f"{review.get('artifact', {}).get('digest')}",
                      ),
                      ("commit", CANDIDATE_COMMIT),
                      (
                          "restart-proof",
                          f"candidate-receipt:{CANDIDATE_RECEIPT_SHA};"
                          f"independent-review:{REVIEW_SHA};lease:{LEASE_ID}",
                      ),
                  }
                  actual_evidence = {
                      (row.get("type"), row.get("value"))
                      for row in evidence
                      if isinstance(row, dict)
                  }
                  expected_note = (
                      "The reviewed Benbassat cycle resolves Nolan North’s off-screen voiceover in "
                      "Star Trek: Picard episode Võx (2023), rejects the physical-prosthetic queue hint, "
                      "preserves honest absence for both visual facets, and leaves unsupported maker "
                      "functions unresolved."
                  )
                  expected_reviewer = (
                      review.get("reviewer")
                      or "chatgpt-benbassat-independent-product-reviewer-v8"
                  )
                  if (
                      recorded.get("outcome") != "completed"
                      or recorded.get("task_statuses", {}).get(TASK_ID) != "resolved"
                      or recorded.get("note") != expected_note
                      or recorded.get("reviewed_by") != expected_reviewer
                      or recorded.get("reviewed_role") != "second-desk"
                      or recorded.get("reviewed_at") != review.get("reviewed_at")
                      or len(evidence) != 3
                      or actual_evidence != expected_evidence
                  ):
                      raise SystemExit("existing Benbassat waterline cycle does not match this reviewed execution")
              if not any(
          '''
          if before.count(old) != 1:
              raise SystemExit(f"finalizer guard anchor drifted: {before.count(old)}")
          after = before.replace(old, new, 1)
          finalizer.write_text(after, encoding="utf-8")

          runner_before = runner.read_text(encoding="utf-8")
          runner_old = '''rm -rf "$OUT"
          mkdir -p "$REVIEW_ROOT" "$SOURCE_ROOT" "$MEDIA_ROOT" "$PREPRODUCT_ROOT"
          '''
          runner_new = '''rm -rf "$OUT"
          mkdir -p "$REVIEW_ROOT" "$SOURCE_ROOT" "$MEDIA_ROOT" "$PREPRODUCT_ROOT"
          cp "$PATCH_RECEIPT" "$OUT/finalizer-idempotence-patch.json"
          '''
          if runner_before.count(runner_old) != 1:
              raise SystemExit(f"runner receipt anchor drifted: {runner_before.count(runner_old)}")
          runner_after = runner_before.replace(runner_old, runner_new, 1)
          runner.write_text(runner_after, encoding="utf-8")

          receipt = {
              "version": 1,
              "transaction": "STAR-TREK-BENBASSAT-FINALIZER-EXACT-CYCLE-IDEMPOTENCE-V1",
              "patched_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "failed_run": int(os.environ["FAILED_FINALIZER_RUN"]),
              "sealed_archive_sha256": os.environ["CARRIER_SHA256"],
              "original_finalizer_sha256": hashlib.sha256(before.encode()).hexdigest(),
              "patched_finalizer_sha256": hashlib.sha256(after.encode()).hexdigest(),
              "original_runner_sha256": hashlib.sha256(runner_before.encode()).hexdigest(),
              "patched_runner_sha256": hashlib.sha256(runner_after.encode()).hexdigest(),
              "accepted_existing_cycle": {
                  "maximum_cardinality": 1,
                  "scope_id": "star-trek",
                  "lease_id": os.environ["LEASE_ID"],
                  "outcome": "completed",
                  "task_id": os.environ["TASK_ID"],
                  "task_status": "resolved",
                  "candidate_commit": os.environ["CANDIDATE_COMMIT"],
                  "candidate_receipt_sha256": os.environ["CANDIDATE_RECEIPT_SHA"],
                  "independent_review_sha256": os.environ["REVIEW_SHA"],
                  "reviewed_role": "second-desk",
                  "review_artifact_id": 9589738675,
                  "review_artifact_digest": "f87f48fad0d50cb2e61b9138b41ec07d69f741f3aa44b062cb6bf03a0c9f62a5",
              },
              "boundary": {
                  "canonical_mutation_by_patch": False,
                  "lease_mutation_by_patch": False,
                  "candidate_mutation_by_patch": False,
                  "waterline_replay": False,
                  "unrelated_prior_cycle_accepted": False,
              },
          }
          patch_receipt.write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["PATCHED_FINALIZER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          bash -n "$PATCHED_RUNNER"
          test -s "$PATCH_RECEIPT"
          bash "$PATCHED_RUNNER"
