name: extract-doctor-who-cycle-002-v2-live

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/extract-doctor-who-cycle-002-v2-live.yml"

permissions:
  contents: read

concurrency:
  group: extract-doctor-who-cycle-002-v2-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  extract:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Prove exact live head and collect carrier bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          for path in \
            .github/workflows/complete-doctor-who-cycle-002-v2.yml \
            .github/workflows/apply-doctor-who-cycle-002.yml \
            .ci/doctor-who-cycle-002/scripts.tgz.b64 \
            .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64; do
            test -s "$path"
          done
          sha256sum \
            .github/workflows/complete-doctor-who-cycle-002-v2.yml \
            .github/workflows/apply-doctor-who-cycle-002.yml \
            .ci/doctor-who-cycle-002/scripts.tgz.b64 \
            .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64 \
            > /tmp/live-cycle-002-carrier.sha256

      - name: Upload exact live writer and transports
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-v2-live-${{ github.run_id }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            .github/workflows/complete-doctor-who-cycle-002-v2.yml
            .github/workflows/apply-doctor-who-cycle-002.yml
            .ci/doctor-who-cycle-002/scripts.tgz.b64
            .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64
            /tmp/live-cycle-002-carrier.sha256
