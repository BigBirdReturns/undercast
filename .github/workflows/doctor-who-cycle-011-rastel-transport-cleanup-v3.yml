name: doctor-who-cycle-011-rastel-transport-cleanup-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-transport-cleanup-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-transport-cleanup-v3
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-transport-cleanup-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      authorization_id: ${{ steps.upload.outputs.artifact-id }}
      authorization_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      PUBLICATION_PARENT: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      STALE_COMMIT: 1c92734e501ed4667ac86c4203a6dbac282392ee
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v3
      SELF: .github/workflows/doctor-who-cycle-011-rastel-transport-cleanup-v3.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3
      PROOF_PR: "839"
      PROOF_HEAD: 650614c7d429e7d9d5095a6a616652e54e029007
      PROOF_BRANCH: agent/doctor-who-cycle-011-rastel-terminal-proof-v4-direct
      PROOF_WORKFLOW: doctor-who-cycle-011-rastel-terminal-proof-v4-direct
      PROOF_RUN: "31352925437"
      PROOF_JOB: "93346970454"
      PROOF_ARTIFACT: "9049618729"
      PROOF_ARTIFACT_NAME: doctor-who-cycle-011-rastel-terminal-proof-v4-direct-31352925437-attempt-1
      PROOF_ARTIFACT_BYTES: "105702012"
      PROOF_ARTIFACT_SHA256: 8ca06bd34278214e0224a725c43651e6260f49e9f3cddd70546bc8de098d91bf
      PROOF_RECEIPT_IDENTITY: 90cb2a268634fec53d634ea0e1cf03501a90ab109f0d830a6dcc8f5fb6af1b88
      VERIFY_BLOBS: f353205628f22cc9c2c7d451b258d64561650fa7 149d8f0ded660a587df164a00599ad266a3a2cc7
      VERIFY_CHUNK_BYTES: "3000 1944"
      VERIFY_CHUNK_SHA256: 06b4312da3e8f988c6972927750a8d7fc56ab42e4edc5cdbc74a5db312ce8778 ac7de5aedf0e6977097e4058c1be5eb82ca97205b9421a8b16411cdfcf9fce02
      VERIFY_B64_BYTES: "4944"
      VERIFY_B64_SHA256: 817bb8b01a73b82f06a51702439eb1db962db90fa98d8c91e9b9a325bbd7c8ca
      VERIFY_GZIP_BYTES: "3707"
      VERIFY_GZIP_SHA256: c8b3c7f8c0294237375b36cd55341fb521f0ec441892b207c79a5760e0ffbd7c
      VERIFY_BYTES: "11804"
      VERIFY_SHA256: 3d6cfce642e52b5cb512601514556a9485e2b0b9b988e36107659644d20714d8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-path carrier and wait for standard gates
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$CANONICAL_TREE"
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$BRANCH" -f event=pull_request -f per_page=100 \
              > /tmp/rastel-cleanup-v3-standard-runs.json
            state="$(HEAD_SHA="$head" python3 - <<'PY'
          import json,os
          rows=json.loads(open('/tmp/rastel-cleanup-v3-standard-runs.json').read())['workflow_runs']
          expected=['publisher-custody','publisher-custody-or-guard','archive-contract']
          selected={}
          for name in expected:
              matches=[row for row in rows if row.get('name')==name and row.get('head_sha')==os.environ['HEAD_SHA']]
              matches.sort(key=lambda row:row['id'],reverse=True)
              if matches:selected[name]=matches[0]
          if len(selected)<len(expected):print('pending')
          elif any(row.get('status')=='completed' and row.get('conclusion')!='success' for row in selected.values()):print('failure')
          elif all(row.get('status')=='completed' and row.get('conclusion')=='success' for row in selected.values()):print('success')
          else:print('pending')
          PY
          )"
            case "$state" in
              success) break ;;
              failure) echo "required exact-head standard gate failed" >&2; exit 1 ;;
              pending) sleep 10 ;;
              *) exit 1 ;;
            esac
            test "$attempt" != 180
          done
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Reconstruct exact proof-bound cleanup verifier and execute
        shell: bash
        run: |
          set -euo pipefail
          BOOT="/tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-bootstrap-verify"
          rm -rf "$BOOT"
          mkdir -p "$BOOT/chunks"
          : > "$BOOT/verify.sh.gz.b64"
          read -r -a blobs <<< "$VERIFY_BLOBS"
          read -r -a sizes <<< "$VERIFY_CHUNK_BYTES"
          read -r -a hashes <<< "$VERIFY_CHUNK_SHA256"
          test "${#blobs[@]}" = 2
          for index in 0 1; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/chunks/$index"
            test "$(wc -c < "$BOOT/chunks/$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$BOOT/chunks/$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$BOOT/chunks/$index" >> "$BOOT/verify.sh.gz.b64"
          done
          test "$(wc -c < "$BOOT/verify.sh.gz.b64" | tr -d ' ')" = "$VERIFY_B64_BYTES"
          test "$(sha256sum "$BOOT/verify.sh.gz.b64" | awk '{print $1}')" = "$VERIFY_B64_SHA256"
          base64 -d "$BOOT/verify.sh.gz.b64" > "$BOOT/verify.sh.gz"
          test "$(wc -c < "$BOOT/verify.sh.gz" | tr -d ' ')" = "$VERIFY_GZIP_BYTES"
          test "$(sha256sum "$BOOT/verify.sh.gz" | awk '{print $1}')" = "$VERIFY_GZIP_SHA256"
          gzip -dc "$BOOT/verify.sh.gz" > "$BOOT/verify.sh"
          test "$(wc -c < "$BOOT/verify.sh" | tr -d ' ')" = "$VERIFY_BYTES"
          test "$(sha256sum "$BOOT/verify.sh" | awk '{print $1}')" = "$VERIFY_SHA256"
          bash -n "$BOOT/verify.sh"
          SCRIPT="$BOOT/verify.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ["SCRIPT"]).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):compile(block,f"<cleanup-v3-verify-{index}>","exec")
          PY
          chmod 700 "$BOOT/verify.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$BOOT/verify.sh"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v3-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v3-verify-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  close_pull_requests:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      close_id: ${{ steps.upload.outputs.artifact-id }}
      close_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v3
      AUTH_ID: ${{ needs.verify.outputs.authorization_id }}
      AUTH_DIGEST: ${{ needs.verify.outputs.authorization_digest }}
      RUN_ID: ${{ github.run_id }}
      AUTH_ROOT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-close/authorization
      OUT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-close
      CLOSE_BLOB: 1a14c0228d61a54d635a30466f1e5223d06e7a64
      CLOSE_B64_BYTES: "2188"
      CLOSE_B64_SHA256: 7439a0afd3e5f2fc86dc5e9264122c3417a54d24699c44ce9106eed7b7c1a07e
      CLOSE_GZIP_BYTES: "1639"
      CLOSE_GZIP_SHA256: 9cf9d18c11f0df5620b4364b159e5e83123a10231f55034cf23adffd593c5831
      CLOSE_BYTES: "4904"
      CLOSE_SHA256: 5dc9f2788f069c388d3240893c9abdad626b4967c762307546190d940ff07617

    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.AUTH_ID }}
          path: ${{ env.AUTH_ROOT }}
          merge-multiple: true

      - name: Authenticate same-run authorization and close exact pull requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/api"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ID" > "$OUT/api/auth-artifact.json"
          test "$(jq -r '.digest' "$OUT/api/auth-artifact.json")" = "$AUTH_DIGEST"
          test "$(jq -r '.workflow_run.id' "$OUT/api/auth-artifact.json")" = "$RUN_ID"
          BOOT="/tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-bootstrap-close"
          rm -rf "$BOOT"; mkdir -p "$BOOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CLOSE_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/close.sh.gz.b64"
          test "$(wc -c < "$BOOT/close.sh.gz.b64" | tr -d ' ')" = "$CLOSE_B64_BYTES"
          test "$(sha256sum "$BOOT/close.sh.gz.b64" | awk '{print $1}')" = "$CLOSE_B64_SHA256"
          base64 -d "$BOOT/close.sh.gz.b64" > "$BOOT/close.sh.gz"
          test "$(wc -c < "$BOOT/close.sh.gz" | tr -d ' ')" = "$CLOSE_GZIP_BYTES"
          test "$(sha256sum "$BOOT/close.sh.gz" | awk '{print $1}')" = "$CLOSE_GZIP_SHA256"
          gzip -dc "$BOOT/close.sh.gz" > "$BOOT/close.sh"
          test "$(wc -c < "$BOOT/close.sh" | tr -d ' ')" = "$CLOSE_BYTES"
          test "$(sha256sum "$BOOT/close.sh" | awk '{print $1}')" = "$CLOSE_SHA256"
          bash -n "$BOOT/close.sh"
          SCRIPT="$BOOT/close.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ["SCRIPT"]).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1):compile(block,f"<cleanup-v3-close-{index}>","exec")
          PY
          chmod 700 "$BOOT/close.sh"
          exec "$BOOT/close.sh"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v3-pr-close-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-close/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  delete_refs:
    needs: [verify, close_pull_requests]
    if: needs.verify.result == 'success' && needs.close_pull_requests.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v3
      AUTH_ID: ${{ needs.verify.outputs.authorization_id }}
      AUTH_DIGEST: ${{ needs.verify.outputs.authorization_digest }}
      CLOSE_ID: ${{ needs.close_pull_requests.outputs.close_id }}
      CLOSE_DIGEST: ${{ needs.close_pull_requests.outputs.close_digest }}
      RUN_ID: ${{ github.run_id }}
      AUTH_ROOT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-delete/authorization
      CLOSE_ROOT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-delete/pr-close
      OUT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-delete
      DELETE_BLOB: e024361ede7a9af314e0a7c0be81bd460e38113f
      DELETE_B64_BYTES: "2480"
      DELETE_B64_SHA256: d297a08cbdecb6c1cfa1d9eb1302d31f1e03e9ec68b52fe53a5f9a8f440f0e86
      DELETE_GZIP_BYTES: "1859"
      DELETE_GZIP_SHA256: d13d0b56e3ac368164631c2235cc4913f816a37e7e401e0f7051b4839c742055
      DELETE_BYTES: "5764"
      DELETE_SHA256: 725749b7fa587c22804d2c66b40ef710c4eba62a90cbd2ba10145f75d4e0b1e9

    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.AUTH_ID }}
          path: ${{ env.AUTH_ROOT }}
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.CLOSE_ID }}
          path: ${{ env.CLOSE_ROOT }}
          merge-multiple: true

      - name: Authenticate split handoffs and delete exact refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/api"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ID" > "$OUT/api/auth-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CLOSE_ID" > "$OUT/api/close-artifact.json"
          test "$(jq -r '.digest' "$OUT/api/auth-artifact.json")" = "$AUTH_DIGEST"
          test "$(jq -r '.digest' "$OUT/api/close-artifact.json")" = "$CLOSE_DIGEST"
          test "$(jq -r '.workflow_run.id' "$OUT/api/auth-artifact.json")" = "$RUN_ID"
          test "$(jq -r '.workflow_run.id' "$OUT/api/close-artifact.json")" = "$RUN_ID"
          BOOT="/tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-bootstrap-delete"
          rm -rf "$BOOT"; mkdir -p "$BOOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$DELETE_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/delete.sh.gz.b64"
          test "$(wc -c < "$BOOT/delete.sh.gz.b64" | tr -d ' ')" = "$DELETE_B64_BYTES"
          test "$(sha256sum "$BOOT/delete.sh.gz.b64" | awk '{print $1}')" = "$DELETE_B64_SHA256"
          base64 -d "$BOOT/delete.sh.gz.b64" > "$BOOT/delete.sh.gz"
          test "$(wc -c < "$BOOT/delete.sh.gz" | tr -d ' ')" = "$DELETE_GZIP_BYTES"
          test "$(sha256sum "$BOOT/delete.sh.gz" | awk '{print $1}')" = "$DELETE_GZIP_SHA256"
          gzip -dc "$BOOT/delete.sh.gz" > "$BOOT/delete.sh"
          test "$(wc -c < "$BOOT/delete.sh" | tr -d ' ')" = "$DELETE_BYTES"
          test "$(sha256sum "$BOOT/delete.sh" | awk '{print $1}')" = "$DELETE_SHA256"
          bash -n "$BOOT/delete.sh"
          SCRIPT="$BOOT/delete.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ["SCRIPT"]).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1):compile(block,f"<cleanup-v3-delete-{index}>","exec")
          PY
          chmod 700 "$BOOT/delete.sh"
          exec "$BOOT/delete.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v3-delete/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
