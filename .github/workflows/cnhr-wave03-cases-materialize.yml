name: materialize-clifford-number-hr-adverse-cases-wave-03

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-disciplinary-ai-wave-02
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cnhr-adverse-cases-wave-03-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-disciplinary-ai-cases-wave-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 03 named-case packet
        shell: bash
        env:
          PARENT_SHA: 418e9509228aaa6249081075ce377244eb97d39f
          PAYLOAD_SHA256: afce2f5853e456c0009916d13f4760f6f88cb9b2e4bfd5e893db4ae14e09bb1e
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(wc -c < .cnhr-wave03-cases/chunk-000.txt)" -eq 8001
          test "$(wc -c < .cnhr-wave03-cases/chunk-001.txt)" -eq 8001
          test "$(wc -c < .cnhr-wave03-cases/chunk-002.txt)" -eq 8001
          test "$(wc -c < .cnhr-wave03-cases/chunk-003.txt)" -eq 8001
          test "$(wc -c < .cnhr-wave03-cases/chunk-004.txt)" -eq 2801

          printf '%s  %s\n' \
            d95789e8ed81a572b18f48f2c68d2a8280b9ec0b92b9f617c1659f663b6aa49f .cnhr-wave03-cases/chunk-000.txt \
            54deb08336cfe939871ff124e3ef4c918fef3c303272418a190fa99c4fbb3049 .cnhr-wave03-cases/chunk-001.txt \
            a1d2df134e847629be734aefaecb43d1349ce0a713798c2744a05eb1d4de299b .cnhr-wave03-cases/chunk-002.txt \
            a465902985c239b627fc05e989c5ff5c54d20848a8ecae76848a3e6624725b51 .cnhr-wave03-cases/chunk-003.txt \
            1709e1e51e681e69e11207c364904403cf61c7a7774e366e549fe880129f6f59 .cnhr-wave03-cases/chunk-004.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave03-cases/chunk-000.txt)" = b586afb395bbdfca248a132e57d9f64b1f4e5d0b
          test "$(git hash-object .cnhr-wave03-cases/chunk-001.txt)" = c98168c00344e7d444c1b5ca721bf96d708bb476
          test "$(git hash-object .cnhr-wave03-cases/chunk-002.txt)" = 50d77fcbc4cbf93f4a5d7bbe465245647f329587
          test "$(git hash-object .cnhr-wave03-cases/chunk-003.txt)" = da7e3003bd07a1ffedcd090ad26b2d5a6cb7de25
          test "$(git hash-object .cnhr-wave03-cases/chunk-004.txt)" = 7648ef606c412c584e4b0fcb9f292413fa6db3bc

          cat .cnhr-wave03-cases/chunk-*.txt \
            | tr -d '\n' \
            | base64 --decode > /tmp/cnhr-wave03-cases.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave03-cases.tar.gz \
            | sha256sum --check --strict
          tar -xzf /tmp/cnhr-wave03-cases.tar.gz -C .
          rm -rf .cnhr-wave03-cases .github/workflows/cnhr-wave03-cases-materialize.yml

          node --check scripts/clifford-number-hr-algorithmic-discipline.mjs
          node scripts/clifford-number-hr-algorithmic-discipline.mjs --check
          node test/clifford-number-hr-algorithmic-discipline-fixtures.mjs

          node --check scripts/clifford-number-hr-algorithmic-adverse-cases.mjs
          node --check test/clifford-number-hr-algorithmic-adverse-cases-fixtures.mjs
          node scripts/clifford-number-hr-algorithmic-adverse-cases.mjs --check
          node test/clifford-number-hr-algorithmic-adverse-cases-fixtures.mjs
          git diff --check

          git add -A
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '418e9509228aaa6249081075ce377244eb97d39f'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-03/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 21, len(observed)
          print('exact Wave 03 named-case delta: 21 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number named adverse-action Wave 03'
          git push origin HEAD:"${HEAD_REF}"
