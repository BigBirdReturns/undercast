name: card-backfill-uc-076-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-076-APPLY.json"
      - "scripts/card-backfill-uc-076-apply.mjs"
      - ".github/workflows/card-backfill-uc-076-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-076-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-016'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-016
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-076-APPLY.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-076'||row.actor!=='Felix Silla'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-076 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8642086128||row.render_artifact?.head_sha!=='b60fc0323777238964d18c28cba5405e65c9e16c')throw new Error('UC-076 render custody drift');
          if(row.expected?.twiki_original_sha256!=='19888475f2a81965143bacaf2948ed67e9ecc5d5d5ecedeb87184abdc8894949')throw new Error('UC-076 Twiki source authorization drift');
          if(row.expected?.cousin_itt_original_sha256!=='b0b720c99886b6c4a2cf4d3153f619469be624836b87fafbb9b0d6095d0fd4f4')throw new Error('UC-076 Cousin Itt source authorization drift');
          if(row.expected?.candidate_sha256!=='b8f452ae7a22121b49e8d8a159ea38f750908b5421ff4820897bc32668721330'||row.expected?.crop_preview_sha256!=='1fed0617f067b6ba95c291c05d79ab8d6f55afc5067c0c5968856923d2b4daa5')throw new Error('UC-076 candidate or crop authorization drift');
          if(row.ruling?.crop_ruling!=='pass-two-role-diptych'||row.ruling?.canonical_mutation!==false)throw new Error('UC-076 ruling drift');
          console.log('PASS — exact UC-076 two-role packet authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-076-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8642086128/zip" > "$root/render.zip"
          echo "721e84142bb02bc0c9308772f11e238694d507dc85fd64160ff77b6ed397e2ce  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output"
          test -f "$base/manifest.json"
          echo "e1fa991e0e92f524007048cf934dfbdca2e3ad3845d71d9cddfe2a5f6812502f  $base/manifest.json" | sha256sum -c -
          echo "fffa4e6792e370934dd4f069451a68dbe4be627709fae8dacff145aa32310be2  $base/duplicate-scan.json" | sha256sum -c -
          echo "f1bc60ce3f65da8d8de7abfac1e5f8e971b55cc49edfcfb85adc7f0612eec1d1  $base/review.json" | sha256sum -c -
          echo "f879ba59e0695e4716f1a425977627f4c6a3ffebb120b1081c6cd8567018f8a6  $base/review.md" | sha256sum -c -
          echo "19888475f2a81965143bacaf2948ed67e9ecc5d5d5ecedeb87184abdc8894949  $base/twiki-original.jpg" | sha256sum -c -
          echo "b0b720c99886b6c4a2cf4d3153f619469be624836b87fafbb9b0d6095d0fd4f4  $base/cousin-itt-original.webp" | sha256sum -c -
          echo "d2041a936711907866c65762b3255c4e047425e1d1e0c547baf627534bc27f3d  $base/twiki-panel.jpg" | sha256sum -c -
          echo "ef48e70fea686719d80f63443aa0ef43029e3b1ef6db1eb63d0d4826a3a75d5f  $base/cousin-itt-panel.jpg" | sha256sum -c -
          echo "b8f452ae7a22121b49e8d8a159ea38f750908b5421ff4820897bc32668721330  $base/uc-076-still-candidate.jpg" | sha256sum -c -
          echo "1fed0617f067b6ba95c291c05d79ab8d6f55afc5067c0c5968856923d2b4daa5  $base/card-crop-preview.jpg" | sha256sum -c -
          echo "bda0dba7a0086f9ed20eca9c9ff593ba553e42d486cf6f532312f844df90ea5a  $base/source-page-twiki.png" | sha256sum -c -
          echo "fc36ae40cb3c9648b7b65622afb74cc8bd49153b1b7eee8f8b44edbe70f0bf24  $base/source-page-cousin-itt.png" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-076-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-076-apply"
          node scripts/card-backfill-uc-076-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-076-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-076');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-076');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_e84b49a14545c7a451d2502a');
          if(!specimen||specimen.still)throw new Error('UC-076 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-076 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-076'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-076 audit disposition was canonically mutated');
          console.log('PASS — UC-076 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-076.json \
            .github/CARD-BACKFILL-UC-076-RENDER.json \
            .github/CARD-BACKFILL-UC-076-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-076-discover.yml \
            .github/workflows/card-backfill-uc-076-render.yml \
            .github/workflows/card-backfill-uc-076-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-076-discover.mjs \
            scripts/card-backfill-uc-076-render.mjs \
            scripts/card-backfill-uc-076-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-076 Twiki and Cousin Itt still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-015...HEAD)
          test "${#changed[@]}" -eq 13
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-076/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-076-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-076-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-016
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-076-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-076-apply
            data/review/card-backfill/UC-076
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
