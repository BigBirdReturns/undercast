name: doctor-who-cycle-011-rastel-candidate-source-inspection-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-source-inspection-v5
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5
      SOURCE_B64_SHA256: 68f41b9507610202efdf24e172ede533f7f0efbdc0df3ec0f500ed732c2b997e
      SOURCE_GZIP_SHA256: b2c34d677a7a27320e9adb7287181814dc2e73e741678c87d36907de790282fe
      SOURCE_RUNNER_SHA256: 11a94699015384fcacaa0b4d2b0721dcb465c90b3f49e5c26b87958b93556fab
      SOURCE_RUNNER_BYTES: "16400"
      RUNNER_SHA256: 2da08048cdb0331fc0efeffa150a50336b017b6fe3fe94d5f8e246563b703526
      RUNNER_BYTES: "16400"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct exact V4 source and apply closed V5 carrier patch
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5-runner
          rm -rf "$root"
          mkdir -p "$root"
          : > "$root/source.gz.b64"
          for blob in 1f77b30eeb8cfc4895a1d4b7c733fa2d876b707c 7c5dc7163647775fc2f106f4f30eb5127950e740 4d3fe7037a3b145ccae05c1bf5bb03e600df851d 91ba84758107cc0182b55bb161780752f82a1103; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/source.gz.b64"
          done
          test "$(sha256sum "$root/source.gz.b64" | awk '{print $1}')" = "$SOURCE_B64_SHA256"
          base64 -d "$root/source.gz.b64" > "$root/source.sh.gz"
          test "$(sha256sum "$root/source.sh.gz" | awk '{print $1}')" = "$SOURCE_GZIP_SHA256"
          gzip -dc "$root/source.sh.gz" > "$root/source.sh"
          test "$(wc -c < "$root/source.sh" | tr -d ' ')" = "$SOURCE_RUNNER_BYTES"
          test "$(sha256sum "$root/source.sh" | awk '{print $1}')" = "$SOURCE_RUNNER_SHA256"
          ROOT="$root" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); text=(root/'source.sh').read_text()
          replacements=[
            ('candidate-source-inspection-v4','candidate-source-inspection-v5',3),
            ('rastel-source-v4-reconstruction','rastel-source-v5-reconstruction',6),
            ("'version':4,","'version':5,",1),
            ('source-recovered-v4','source-recovered-v5',2),
          ]
          for old,new,count in replacements:
              assert text.count(old)==count
              assert new not in text
              text=text.replace(old,new)
          data=text.encode()
          assert len(data)==int(os.environ['RUNNER_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['RUNNER_SHA256']
          (root/'runner.sh').write_bytes(data)
          PY
          bash -n "$root/runner.sh"
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5-runner/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",text,re.S)
          assert len(blocks)==4
          for i,block in enumerate(blocks): compile(textwrap.dedent(block),f'<embedded-{i}>','exec')
          PY

      - name: Execute exact read-only source inspection V5
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5-runner/runner.sh
          exec /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5-runner/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v5-runner
            /tmp/rastel-source-v5-reconstruction
            /tmp/merx-materializer-v4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
