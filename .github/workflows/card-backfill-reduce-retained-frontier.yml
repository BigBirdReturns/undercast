name: card-backfill-reduce-retained-frontier

on:
  workflow_dispatch:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-reduce-retained-frontier.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-retained-frontier-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      MUTATION_HEAD: ${{ github.sha }}
      SOURCE_HEAD: 903e313794043b53495e81e061c8295323e8b79a
      SOURCE_RUN_ID: '30656912108'
      WAVE_SHA: 5dd5d1d70dc18ca38d087baf2a29cdb9f4a4ce7ef0d7b3eb3707e264fe27a948
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind and prove the recovery-only branch delta
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$MUTATION_HEAD" ]
          git fetch origin "$SOURCE_HEAD" --depth=1
          git diff --name-only "$SOURCE_HEAD..$MUTATION_HEAD" | sort > "$RUNNER_TEMP/recovery-delta.txt"
          cat > "$RUNNER_TEMP/expected-recovery-delta.txt" <<'EOF'
          .github/CARD-BACKFILL-AMORTIZATION.json
          .github/workflows/card-backfill-reduce-retained-frontier.yml
          EOF
          diff -u "$RUNNER_TEMP/expected-recovery-delta.txt" "$RUNNER_TEMP/recovery-delta.txt"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const contract=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-AMORTIZATION.json','utf8'));
          const recovery=contract.recovery?.retained_frontier_recovery;
          if (recovery?.status !== 'armed') throw new Error('retained frontier recovery is not armed');
          if (String(recovery.source_run_id) !== '30656912108') throw new Error('source run drift');
          if (recovery.source_head !== '903e313794043b53495e81e061c8295323e8b79a') throw new Error('source head drift');
          if (recovery.wave_sha256 !== '5dd5d1d70dc18ca38d087baf2a29cdb9f4a4ce7ef0d7b3eb3707e264fe27a948') throw new Error('wave drift');
          if (recovery.source_rediscovery !== false || recovery.canonical_mutation !== false) throw new Error('recovery mutation boundary drift');
          console.log('PASS — retained frontier recovery is exact, artifact-only, and mutation-safe');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-amortized-plan-30656912108
          path: ${{ runner.temp }}/planning
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30656912108

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-amortized-result-*-30656912108
          path: ${{ runner.temp }}/results
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 30656912108

      - name: Re-prove inherited law and retained artifact cardinality
        run: |
          set -euo pipefail
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-amortization-fixtures.mjs
          node scripts/card-backfill-local-adjudicate-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate --out "$RUNNER_TEMP/lessons-validation.json"
          test "$(find "$RUNNER_TEMP/results" -name wave-result.json -type f | wc -l)" -eq 4
          echo 'PASS — four immutable retained wave results are present; source rediscovery=false'

      - name: Reduce the retained frontier once
        run: |
          set -euo pipefail
          observed_head=$(git rev-parse HEAD)
          node scripts/card-backfill-wave-reduce-amortized.mjs \
            --wave "$RUNNER_TEMP/planning/wave.json" \
            --amortization-plan "$RUNNER_TEMP/planning/amortization-plan.json" \
            --results-root "$RUNNER_TEMP/results" \
            --staging-root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --adjudications-root .github/card-backfill/adjudications \
            --wave-receipt-root .github/card-backfill/waves \
            --performance-root .github/card-backfill/performance \
            --source-head "$SOURCE_HEAD" \
            --mutation-head "$MUTATION_HEAD" \
            --observed-head "$observed_head" | tee "$RUNNER_TEMP/retained-frontier-reduce.log"
          node scripts/card-backfill-staging.mjs validate \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='.github/CARD-BACKFILL-AMORTIZATION.json';
          const value=JSON.parse(fs.readFileSync(path,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(`.github/card-backfill/waves/${process.env.WAVE_SHA}.json`,'utf8'));
          value.recovery.retained_frontier_recovery={
            ...value.recovery.retained_frontier_recovery,
            status:'completed',
            recovery_workflow_run_id:Number(process.env.GITHUB_RUN_ID),
            reduction_sha256:receipt.reduction_sha256,
            accepted:receipt.counts.accepted,
            staged_after_reduction:receipt.counts.staged_after_reduction,
            performance_observations:receipt.counts.performance_observations,
            source_rediscovery:false,
            canonical_mutation:false
          };
          fs.writeFileSync(path,JSON.stringify(value,null,2)+'\n');
          console.log(`PASS — retained reduction completed: accepted=${receipt.counts.accepted}; staged=${receipt.counts.staged_after_reduction}`);
          NODE

      - name: Commit the exact retained reduction and rearm the supervisor
        run: |
          set -euo pipefail
          git add -A -- \
            .github/CARD-BACKFILL-AMORTIZATION.json \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            .github/card-backfill/performance \
            data/review/card-backfill-staging
          git diff --cached --check
          git config user.name 'undercast-card-backfill-retained-reducer'
          git config user.email 'undercast-card-backfill-retained-reducer@users.noreply.github.com'
          git commit -m 'Card backfill: reduce retained 13-obligation frontier'
          remote_head=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          if [ "$remote_head" != "$MUTATION_HEAD" ]; then
            echo "branch moved from retained-recovery head $MUTATION_HEAD to $remote_head; refusing stale push" >&2
            exit 1
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          final_head=$(git rev-parse HEAD)
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f reason=retained-frontier-reduced
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${final_head}" \
            -f state=success \
            -f context='card-backfill/retained-frontier' \
            -f description='13 retained attempts reduced; rediscovery=0; supervisor rearmed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-retained-frontier-reduction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery-delta.txt
            ${{ runner.temp }}/lessons-validation.json
            ${{ runner.temp }}/retained-frontier-reduce.log
          if-no-files-found: warn
          retention-days: 90

      - name: Publish observable recovery failure
        if: failure()
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${MUTATION_HEAD}" \
            -f state=failure \
            -f context='card-backfill/retained-frontier' \
            -f description="run ${GITHUB_RUN_ID}: retained reduction failed before permanent publication" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
