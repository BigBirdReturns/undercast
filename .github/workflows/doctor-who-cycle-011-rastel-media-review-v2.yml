name: doctor-who-cycle-011-rastel-media-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-media-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-media-review-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-media-review-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-media-review-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-media-review-v2.yml
      SOURCE_COMMIT: ca4b0edf3b8df4bdb4679ff88ba01f8412aa18be
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-media-review-v1.yml
      SOURCE_BLOB: 894e23407a4c34127947377e02ee6c982e2d6d00
      FAILED_PR: "747"
      FAILED_HEAD: ca4b0edf3b8df4bdb4679ff88ba01f8412aa18be
      FAILED_RUN: "31299717192"
      FAILED_JOB: "93210427792"
      FAILED_ARTIFACT: "9034140354"
      FAILED_ARTIFACT_DIGEST: sha256:4258718a988cf7c37eede19b3692c42d06f1546aa1b3a6e64e3ff8e46f1ae576
      OLD_PORTRAIT_SHA256: fb8b506c7c51b18cc4ffb6aec70125cf378a3395894814305c1ec1fe37d8854a
      CORRECT_PORTRAIT_SHA256: fb8b502322d70d59c670095d45e05f6daa6f7b546bb806d86eb2eac673b58c3e
      SOURCE_PORTRAIT: images/uc-1351-portrait.jpg
      SOURCE_WALL: UC-1351
      CONTROL: /tmp/doctor-who-cycle-011-rastel-media-review-v2-control
      OUT: /tmp/doctor-who-cycle-011-rastel-media-review-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V1 reviewer and repair portrait hash binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL" "$OUT"
          mkdir -p "$CONTROL"/{api,scripts,diagnostic,node} "$OUT"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$CONTROL/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$FAILED_PR" > "$CONTROL/api/failed-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > "$CONTROL/api/failed-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN/jobs?per_page=100" > "$CONTROL/api/failed-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT" > "$CONTROL/api/failed-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT/zip" > "$CONTROL/failed.zip"
          test "$(sha256sum "$CONTROL/failed.zip" | awk '{print $1}')" = "${FAILED_ARTIFACT_DIGEST#sha256:}"
          git show "$SOURCE_COMMIT:$SOURCE_PATH" > "$CONTROL/source.yml"
          test "$(git hash-object "$CONTROL/source.yml")" = "$SOURCE_BLOB"
          git show "$MAIN:$SOURCE_PORTRAIT" > "$CONTROL/source-portrait.jpg"
          test "$(sha256sum "$CONTROL/source-portrait.jpg" | awk '{print $1}')" = "$CORRECT_PORTRAIT_SHA256"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import hashlib,json,os,re,shlex,subprocess,textwrap,zipfile,yaml
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['CONTROL']); api=root/'api'; diag=root/'diagnostic'
          own=json.loads((api/'carrier.json').read_text())
          failed=json.loads((api/'failed-pr.json').read_text())
          run=json.loads((api/'failed-run.json').read_text())
          jobs=json.loads((api/'failed-jobs.json').read_text())['jobs']
          artifact=json.loads((api/'failed-artifact.json').read_text())
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert failed['number']==int(os.environ['FAILED_PR']) and failed['head']['sha']==os.environ['FAILED_HEAD']
          assert failed['draft'] is True and failed['merged'] is False
          assert run['id']==int(os.environ['FAILED_RUN']) and run['name']=='doctor-who-cycle-011-rastel-media-review-v1'
          assert run['head_sha']==os.environ['FAILED_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['FAILED_JOB']))
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Authenticate exact evidence artifact and carrier geometry']==('completed','success')
          assert steps['Rehydrate current main and rerun complete gates']==('completed','success')
          assert steps['Derive and seal byte-distinct Rastel performer portrait candidate']==('completed','failure')
          assert artifact['id']==int(os.environ['FAILED_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['FAILED_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['FAILED_RUN']) and artifact['workflow_run']['head_sha']==os.environ['FAILED_HEAD']
          with zipfile.ZipFile(root/'failed.zip') as z:
              infos=z.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  out=diag/p
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(z.read(info))
          inventory=json.loads((diag/'evidence/portraits/inventory.json').read_text())
          row=next(item for item in inventory['records'] if item['wall_id']==os.environ['SOURCE_WALL'])
          assert row['sha256']==os.environ['CORRECT_PORTRAIT_SHA256']
          assert row['sha256']!=os.environ['OLD_PORTRAIT_SHA256']
          assert hashlib.sha256((root/'source-portrait.jpg').read_bytes()).hexdigest()==row['sha256']
          assert not (diag/'review/uc-1356-portrait-candidate.jpg').exists()
          source=(root/'source.yml').read_text()
          doc=yaml.safe_load(source)
          jobdef=doc['jobs']['review']
          env={k:str(v) for k,v in jobdef['env'].items() if k!='GH_TOKEN'}
          old_marker='doctor-who-cycle-011-rastel-media-review-v1'
          new_marker='doctor-who-cycle-011-rastel-media-review-v2'
          assert env['SOURCE_PORTRAIT_SHA256']==os.environ['OLD_PORTRAIT_SHA256']
          env['SOURCE_PORTRAIT_SHA256']=os.environ['CORRECT_PORTRAIT_SHA256']
          env={k:v.replace(old_marker,new_marker) for k,v in env.items()}
          assert env['SOURCE_PORTRAIT_SHA256']==os.environ['CORRECT_PORTRAIT_SHA256']
          (root/'env.sh').write_text(''.join(f'export {k}={shlex.quote(v)}\n' for k,v in env.items()))
          runs=[step['run'] for step in jobdef['steps'] if 'run' in step]
          assert len(runs)==3
          for index,script in enumerate(runs,1):
              script=script.replace(old_marker,new_marker)
              if index==1:
                  lines=script.splitlines()
                  head_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("head='")]
                  pr_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("pr='")]
                  base_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("test '") and line.endswith(' = "$MAIN"')]
                  assert len(head_rows)==len(pr_rows)==len(base_rows)==1
                  lines[head_rows[0]]='head="$CURRENT_HEAD"'
                  lines[pr_rows[0]]='pr="$CURRENT_PR"'
                  lines[base_rows[0]]='test "$CURRENT_BASE" = "$MAIN"'
                  script='\n'.join(lines)+'\n'
              path=root/'scripts'/f'{index:02d}.sh'
              path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              for match in re.finditer(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",script,re.S):
                  compile(textwrap.dedent(match.group(1)),f'<script-{index}-python>','exec')
              for n,match in enumerate(re.finditer(r"node <<'NODE'\n(.*?)\nNODE(?:\n|$)",script,re.S),1):
                  node=root/'node'/f'{index:02d}-{n:02d}.js'
                  node.write_text(textwrap.dedent(match.group(1)))
                  subprocess.run(['node','--check',str(node)],check=True)
          assert os.environ['OLD_PORTRAIT_SHA256'] not in (root/'env.sh').read_text()
          receipt={
            'status':'cycle-011-rastel-media-review-v2-source-recovered',
            'source_commit':os.environ['SOURCE_COMMIT'],
            'source_blob':os.environ['SOURCE_BLOB'],
            'failed_run':int(os.environ['FAILED_RUN']),
            'failed_job':int(os.environ['FAILED_JOB']),
            'failed_artifact':int(os.environ['FAILED_ARTIFACT']),
            'failed_artifact_digest':os.environ['FAILED_ARTIFACT_DIGEST'],
            'old_portrait_sha256':os.environ['OLD_PORTRAIT_SHA256'],
            'correct_portrait_sha256':os.environ['CORRECT_PORTRAIT_SHA256'],
            'repair':'exact-canonical-portrait-sha256-binding',
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'source-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute recovered adjudication with exact source hash repair
        shell: bash
        run: |
          set -euo pipefail
          source "$CONTROL/env.sh"
          export CURRENT_HEAD='${{ github.event.pull_request.head.sha }}'
          export CURRENT_PR='${{ github.event.pull_request.number }}'
          export CURRENT_BASE='${{ github.event.pull_request.base.sha }}'
          export GITHUB_ENV="$CONTROL/runtime.env"
          : > "$GITHUB_ENV"
          for script in "$CONTROL"/scripts/*.sh; do
            bash "$script"
            if [ -s "$GITHUB_ENV" ]; then
              set -a
              source "$GITHUB_ENV"
              set +a
              : > "$GITHUB_ENV"
            fi
          done
          cp "$CONTROL/source-recovery.json" "$OUT/review/source-recovery.json"
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt=json.loads((root/'review/media-review.json').read_text())
          assert receipt['status']=='cycle-011-rastel-media-independently-adjudicated-v1'
          assert receipt['performer_portrait']['source_sha256']==os.environ['CORRECT_PORTRAIT_SHA256']
          assert receipt['performer_portrait']['candidate_sha256']!=os.environ['CORRECT_PORTRAIT_SHA256']
          assert receipt['performer_portrait']['candidate_bytes']>10000
          assert receipt['character_still']['status']=='absent'
          assert not any(receipt['boundary'].values())
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-media-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-media-review-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-media-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-media-review-v2
            /tmp/doctor-who-cycle-011-rastel-media-review-v2-control
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
