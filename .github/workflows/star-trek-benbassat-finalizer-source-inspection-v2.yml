name: star-trek-benbassat-finalizer-source-inspection-v2

on:
  push:
    branches:
      - agent/star-trek-benbassat-finalizer-recovery-v2

permissions:
  contents: read

concurrency:
  group: star-trek-benbassat-finalizer-source-inspection-v2
  cancel-in-progress: false

env:
  CARRIER_PARTS_ROOT: .github/recovery/star-trek-benbassat-finalizer-recovery-v2
  CARRIER_SHA256: b3225741d0fe90dc3209ca09fcefe0b2c1ba6f2b69b15135e3418a1be921a4cb
  PACKAGE_UNPACK: /tmp/star-trek-benbassat-finalizer-source-inspection-v2
  PACKAGE_ROOT: /tmp/star-trek-benbassat-finalizer-source-inspection-v2/star-trek-benbassat-finalizer-recovery-v2

jobs:
  inspect:
    name: inspect-benbassat-cycle-construction
    if: ${{ github.event.head_commit.message == 'Inspect sealed Benbassat finalizer cycle construction v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and print cycle and execution phases
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PACKAGE_UNPACK"
          mkdir -p "$PACKAGE_UNPACK"
          cat \
            "$CARRIER_PARTS_ROOT/carrier.part01" \
            "$CARRIER_PARTS_ROOT/carrier.part02" \
            "$CARRIER_PARTS_ROOT/carrier.part03" \
            "$CARRIER_PARTS_ROOT/carrier.part04" \
            "$CARRIER_PARTS_ROOT/carrier.part05" \
            "$CARRIER_PARTS_ROOT/carrier.part06" \
            | tr -d '\r\n' > /tmp/star-trek-benbassat-finalizer-inspection-v2.b64
          base64 --decode /tmp/star-trek-benbassat-finalizer-inspection-v2.b64 > /tmp/star-trek-benbassat-finalizer-inspection-v2.zip
          test "$(sha256sum /tmp/star-trek-benbassat-finalizer-inspection-v2.zip | awk '{print $1}')" = "$CARRIER_SHA256"
          unzip -q /tmp/star-trek-benbassat-finalizer-inspection-v2.zip -d "$PACKAGE_UNPACK"
          test -d "$PACKAGE_ROOT"
          (
            cd "$PACKAGE_ROOT"
            sha256sum -c manifest.sha256
          )
          printf '%s\n' '=== finalizer.py lines 343-520 ==='
          sed -n '343,520p' "$PACKAGE_ROOT/.github/recovery/star-trek-benbassat-finalizer-recovery-v2/finalizer.py"
          printf '%s\n' '=== run-finalizer.sh ==='
          sed -n '1,260p' "$PACKAGE_ROOT/run-finalizer.sh"
