name: card-backfill-uc-126-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-126-APPLY.json"
      - "scripts/card-backfill-uc-126-apply.part-00.mjs"
      - "scripts/card-backfill-uc-126-apply.part-01.mjs"
      - "scripts/card-backfill-uc-126-apply.part-02.mjs"
      - ".github/workflows/card-backfill-uc-126-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-126-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-031'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-126 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-126-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-126');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-126');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_90375b50fca2bd3603ba9946');
          if(row.version!==1||row.record_id!=='UC-126'||row.actor!=='Tara Strong'||row.character!=='Bubbles, Timmy, Harley & Twilight'||row.production!=='Powerpuff Girls / Fairly OddParents / etc.'||row.year!==1998||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-126 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8708945847||row.render_artifact?.head_sha!=='bb45549262a7604769f9d3342e7e31374c6e0b24'||row.render_artifact?.zip_sha256!=='ad2bdf9539fc5624c29877363d10b3b1e9827e6b510b5983e411d3d55f723bf7')throw new Error('UC-126 render custody drift');
          if(row.expected?.bubbles_source?.sha256!=='49ccbfd588c6f7b4154bab7b10126713ed24b4910efc891f82b96722de0ddc09'||row.expected?.timmy_source?.sha256!=='379dfe165e928bbbce5e6fccbe0f7c3555dd1a52c530c06150a4cc577f68f7b8'||row.expected?.harley_source?.sha256!=='7e9604384f8f6ba67c4ddf9ee3e88699e5aebb2379825e470972e6df6cf2b5ca'||row.expected?.twilight_source?.sha256!=='7c7b3818f1a04f84daacf4b31d382289b158213b15958697f65c85be1e5765db')throw new Error('UC-126 source authorization drift');
          if(row.expected?.exact_role_record?.sha256!=='612f17fe83c6a54c16cbdb6a4efdb88d41af213556ee9b193be90dbf82818536'||row.expected?.candidate?.sha256!=='9be5a99132a38ca17394e948f84186e26a82efc85454b0f78a6c4cb091585df3'||row.expected?.crop_preview?.sha256!=='3bc037858137a15145f6cfd891e156e71e0c74ffabc9d8b537d5db6b38343e9e')throw new Error('UC-126 candidate or role authorization drift');
          if(row.expected?.packet_file_count!==22||row.expected?.duplicate_item_count!==6||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==4||row.expected?.discovery_candidate_count!==30||row.expected?.failed_discovery_count!==6||row.expected?.strict_actor_role_page_count!==2||row.expected?.reference_only_actor_role_page_count!==3||row.expected?.controlled_resolution_exception_count!==1)throw new Error('UC-126 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='four-role-character-composite'||row.ruling?.crop_ruling!=='pass-four-panel-grid-layout'||row.ruling?.chronology_ruling!=='pass-1998-bubbles-chronology-separated-from-timmy-harley-and-twilight'||row.ruling?.resolution_ruling!=='pass-bubbles-controlled-historical-source-enlargement'||row.ruling?.canonical_mutation!==false)throw new Error('UC-126 ruling drift');
          if(!specimen||specimen.actor!=='Tara Strong'||specimen.character!=='Bubbles, Timmy, Harley & Twilight'||specimen.production!=='Powerpuff Girls / Fairly OddParents / etc.'||specimen.years!=='1998'||specimen.still)throw new Error('UC-126 specimen boundary drift');
          if(source?.still)throw new Error('UC-126 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-126'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-126 audit boundary drift');
          console.log(`PASS — UC-126 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8708945847/zip" > "$root/render.zip"
          echo "ad2bdf9539fc5624c29877363d10b3b1e9827e6b510b5983e411d3d55f723bf7  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-126"
          test -f "$base/manifest.json"
          echo "4e72f6b2bbe32e7a79029b9b4d81bdd951f359aedc62f83952587b338e788340  $base/manifest.json" | sha256sum -c -
          echo "6116d9c8db15d90a0aef7f6f84766ef3de6fd1fd48331edfcf3985a23c5bd96e  $base/duplicate-scan.json" | sha256sum -c -
          echo "5cc42ee55a91b04d650cc770db725fd43573fdc77509e87f4525d7f1554d1160  $base/review.json" | sha256sum -c -
          echo "11b5e11327b7e6d3e4ab5472d2495dc3fad950367494c8488d060bedf3d5dcfa  $base/review.md" | sha256sum -c -
          echo "192f3a131d9c4d695e35158add2b17f899ac4bca9ccae1d4518b1ee0eb5d357c  $base/SHA256SUMS" | sha256sum -c -
          echo "612f17fe83c6a54c16cbdb6a4efdb88d41af213556ee9b193be90dbf82818536  $base/exact-role-record.json" | sha256sum -c -
          echo "49ccbfd588c6f7b4154bab7b10126713ed24b4910efc891f82b96722de0ddc09  $base/bubbles-original.webp" | sha256sum -c -
          echo "379dfe165e928bbbce5e6fccbe0f7c3555dd1a52c530c06150a4cc577f68f7b8  $base/timmy-original.webp" | sha256sum -c -
          echo "7e9604384f8f6ba67c4ddf9ee3e88699e5aebb2379825e470972e6df6cf2b5ca  $base/harley-original.webp" | sha256sum -c -
          echo "7c7b3818f1a04f84daacf4b31d382289b158213b15958697f65c85be1e5765db  $base/twilight-original.webp" | sha256sum -c -
          echo "9ab0a1bc795ad0d463f4ea6bf922ba76e26a23fabac392ce2a63a0147dabd160  $base/source-page-vanity-fair-tara-strong-roles.png" | sha256sum -c -
          echo "7f22c30856165a80cc1e355c3c06f9145a126c6c56bc6c88596673221bbc2a40  $base/source-page-dc-tara-strong-harley.png" | sha256sum -c -
          echo "59c0410e71daf4501c7d6218c0fcbd3dd4dd37fb1d298b62ac0c9cf48d73662b  $base/source-page-bubbles.png" | sha256sum -c -
          echo "3c1963ffe7fb2681c98c5cdb0c962a64db034e6fe4b26dad459ad6b145ecb7e3  $base/source-page-timmy.png" | sha256sum -c -
          echo "ebcdb4f7c171dc8bdbccc674b1da9c1e40b1861186b295abf9d22723068ad001  $base/source-page-harley.png" | sha256sum -c -
          echo "a302968d75f49d8bc1950def7904972f33570cf433781a6e995594e20fc0c683  $base/source-page-twilight.png" | sha256sum -c -
          echo "afdbff0010836aaa3241c2ef97c85af7c7e1bfeb87757dacf459803e979982bb  $base/source-wikitext-bubbles.txt" | sha256sum -c -
          echo "3c16dc95fc3bc259903893aa1dfc579856665cde299e6d28bb76e9ad25df7dda  $base/source-wikitext-timmy.txt" | sha256sum -c -
          echo "113803f2e16a3cf808797ddf8f51707fd34a7042ad6ba7e01caa092da4509540  $base/source-wikitext-harley.txt" | sha256sum -c -
          echo "d891ef8a90ecf4f7ad0894c926ae5a225a0682afe241e36ef6885e3714f1d08e  $base/source-wikitext-twilight.txt" | sha256sum -c -
          echo "9be5a99132a38ca17394e948f84186e26a82efc85454b0f78a6c4cb091585df3  $base/uc-126-still-candidate.jpg" | sha256sum -c -
          echo "3bc037858137a15145f6cfd891e156e71e0c74ffabc9d8b537d5db6b38343e9e  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF_RECEIPT'
          run_id=30412525332
          artifact_id=8708945847
          artifact_name=card-backfill-uc-126-render-30412525332
          artifact_zip_sha256=ad2bdf9539fc5624c29877363d10b3b1e9827e6b510b5983e411d3d55f723bf7
          artifact_head_sha=bb45549262a7604769f9d3342e7e31374c6e0b24
          source_manifest_sha256=4e72f6b2bbe32e7a79029b9b4d81bdd951f359aedc62f83952587b338e788340
          source_sums_sha256=192f3a131d9c4d695e35158add2b17f899ac4bca9ccae1d4518b1ee0eb5d357c
          EOF_RECEIPT
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-126-apply/source/output/UC-126
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-apply"
          cat scripts/card-backfill-uc-126-apply.part-00.mjs scripts/card-backfill-uc-126-apply.part-01.mjs scripts/card-backfill-uc-126-apply.part-02.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-126');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-126');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_90375b50fca2bd3603ba9946');
          if(!specimen||specimen.still)throw new Error('UC-126 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-126 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-126'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-126 audit disposition was canonically mutated');
          console.log('PASS — UC-126 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-126.json \
            .github/CARD-BACKFILL-UC-126-DISCOVER.json \
            .github/CARD-BACKFILL-UC-126-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-126-BUBBLES-PROBE.json \
            .github/CARD-BACKFILL-UC-126-RENDER.json \
            .github/CARD-BACKFILL-UC-126-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-126-scope.yml \
            .github/workflows/card-backfill-uc-126-discover.yml \
            .github/workflows/card-backfill-uc-126-bubbles-probe.yml \
            .github/workflows/card-backfill-uc-126-render.yml \
            .github/workflows/card-backfill-uc-126-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-126-scope.mjs \
            scripts/card-backfill-uc-126-discover.mjs \
            scripts/card-backfill-uc-126-discover-repair.py \
            scripts/card-backfill-uc-126-bubbles-probe.mjs \
            scripts/card-backfill-uc-126-render.part-00.mjs \
            scripts/card-backfill-uc-126-render.part-01.mjs \
            scripts/card-backfill-uc-126-render.part-02.mjs \
            scripts/card-backfill-uc-126-apply.part-00.mjs \
            scripts/card-backfill-uc-126-apply.part-01.mjs \
            scripts/card-backfill-uc-126-apply.part-02.mjs
          git add -A
          git diff --cached --check -- . \
            ':(exclude)data/review/card-backfill/UC-126/source-wikitext-bubbles.txt' \
            ':(exclude)data/review/card-backfill/UC-126/source-wikitext-timmy.txt' \
            ':(exclude)data/review/card-backfill/UC-126/source-wikitext-twilight.txt'
          node --input-type=module - <<'NODE' | tee "$root/immutable-source-whitespace.log"
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const rows={
            'source-wikitext-bubbles.txt':{sha:'afdbff0010836aaa3241c2ef97c85af7c7e1bfeb87757dacf459803e979982bb',lines:[29,105,107,109]},
            'source-wikitext-timmy.txt':{sha:'3c16dc95fc3bc259903893aa1dfc579856665cde299e6d28bb76e9ad25df7dda',lines:[20,47,82,83,144]},
            'source-wikitext-twilight.txt':{sha:'d891ef8a90ecf4f7ad0894c926ae5a225a0682afe241e36ef6885e3714f1d08e',lines:[25,301,307,324]}
          };
          for(const [name,row] of Object.entries(rows)){
            const path=`data/review/card-backfill/UC-126/${name}`;
            const bytes=fs.readFileSync(path);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            const lines=bytes.toString('utf8').split('\n').map((line,index)=>/[ \t]+$/.test(line.replace(/\r$/,''))?index+1:null).filter(Boolean);
            if(hash!==row.sha||JSON.stringify(lines)!==JSON.stringify(row.lines))throw new Error(`${name} immutable whitespace custody drift`);
            console.log(`PASS — ${name} ${hash} trailing lines ${lines.join(',')}`);
          }
          NODE
          git commit -m 'Card backfill: retain UC-126 Tara Strong four-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-030
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-030 HEAD)
          test "${#changed[@]}" -eq 22
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-126/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-126-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-031
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-126-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-126-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-126-apply
            data/review/card-backfill/UC-126
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
