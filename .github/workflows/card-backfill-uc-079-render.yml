name: card-backfill-uc-079-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-079-RENDER.json"
      - "scripts/card-backfill-uc-079-render.mjs"
      - ".github/workflows/card-backfill-uc-079-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-079-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-018'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-018
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-079 seven-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-079-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-079');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-079');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_12bdd74c1d97797f21a54d9a');
          if(row.version!==1||row.record_id!=='UC-079'||row.actor!=='Eddie Murphy'||row.character!=='Barbershop crowd & Saul'||row.side!=='still')throw new Error('UC-079 render authorization drift');
          if(row.direct_role_artifact?.artifact_id!==8660410939||row.direct_role_artifact?.head_sha!=='317350429efce56a8307f165d4a9a2b6de032fa9')throw new Error('UC-079 direct-role custody drift');
          if(row.saul_artifact?.artifact_id!==8668410397||row.saul_artifact?.head_sha!=='3cfc6c6226a35493a719fb42302b78f4d5ec8a66')throw new Error('UC-079 Saul custody drift');
          if(row.roles?.length!==7||row.layout?.top_order?.length!==3||row.layout?.bottom_order?.length!==4||row.layout?.candidate_width!==1260||row.layout?.candidate_height!==1000)throw new Error('UC-079 render denominator drift');
          if(!specimen||specimen.character!=='Barbershop crowd & Saul'||specimen.still)throw new Error('UC-079 specimen boundary drift');
          if(source?.still)throw new Error('UC-079 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-079'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-079 audit boundary drift');
          console.log(`PASS — UC-079 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact direct-role and Saul artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-079-render"
          mkdir -p "$root/direct" "$root/saul"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8660410939/zip" > "$root/direct.zip"
          echo "79e7adf5939057e4f3ed0d3a762210675c6b0ac937bd249fa0dde4773b47eb22  $root/direct.zip" | sha256sum -c -
          unzip -q "$root/direct.zip" -d "$root/direct"
          direct="$root/direct/card-backfill-uc-079-direct-repair"
          test -f "$direct/manifest.json"
          echo "8e116266060a015e799ce354249b3b18f43a3ea946cff73645d212bfae8427ef  $direct/manifest.json" | sha256sum -c -
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8668410397/zip" > "$root/saul.zip"
          echo "ba67490381808f662a6e16ed019521dc2102468545b1e4f7191e4f2d7368f24f  $root/saul.zip" | sha256sum -c -
          unzip -q "$root/saul.zip" -d "$root/saul"
          saul="$root/saul/card-backfill-uc-079-saul"
          test -f "$saul/manifest.json"
          echo "0e4c38c2c7d5ec891877c05fdf29604475bc34904fd2c24b4114186a3233cedc  $saul/manifest.json" | sha256sum -c -
      - name: Render exact seven-role candidate and evidence packet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-079-render/output
          DIRECT_ROOT: ${{ runner.temp }}/card-backfill-uc-079-render/direct/card-backfill-uc-079-direct-repair
          SAUL_ROOT: ${{ runner.temp }}/card-backfill-uc-079-render/saul/card-backfill-uc-079-saul
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-079-render.mjs
          node scripts/card-backfill-uc-079-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-079-render/render.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact sources, pages, panels, composite, crop, and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-079-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-079-render
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
