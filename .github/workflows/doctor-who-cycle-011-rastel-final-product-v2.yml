          dollar='$'; expressions={dollar+'{{ github.event.pull_request.head.sha }}':'$CARRIER_HEAD',dollar+'{{ github.event.pull_request.number }}':'$CARRIER_PR',dollar+'{{ github.event.pull_request.base.sha }}':'$CURRENT_BASE'}
