name: doctor-who-cycle-011-rastel-final-product-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-product-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-product-v2
  cancel-in-progress: true

env:
  SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
  SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
  SOURCE_V1_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v1
  SOURCE_V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml
  TARGET_STEM: doctor-who-cycle-011-rastel-final-product-v2
  BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v2
  SELF: .github/workflows/doctor-who-cycle-011-rastel-final-product-v2.yml
  TASK_ID: ap_25277c8fbe9e5369ed2e3d81
  WALL_ID: UC-1356
  EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
  PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-product-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      QUALIFY_OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v2-qualification
      PREFLIGHT_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v2-preflight
      PREFLIGHT_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_WORKFLOW: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-
      EXECUTOR_MAIN_PLACEHOLDER: __RASTEL_EXECUTOR_MAIN__
      EXECUTOR_PR_PLACEHOLDER: __RASTEL_EXECUTOR_PR__
      EXECUTOR_HEAD_PLACEHOLDER: __RASTEL_EXECUTOR_HEAD__
      EXECUTOR_BRANCH_PLACEHOLDER: __RASTEL_EXECUTOR_BRANCH__
      EXECUTOR_SELF_PLACEHOLDER: __RASTEL_EXECUTOR_SELF__
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v2-qualification/bootstrap

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact unpublished V1 workflow and apply bounded V2 repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP/jobs"
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess
          from pathlib import Path

          root=Path(os.environ['BOOTSTRAP'])
          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['SOURCE_V1_BRANCH']
          path=os.environ['SOURCE_V1_PATH']
          stem='doctor-who-cycle-011-rastel-final-product-v1'
          target=os.environ['TARGET_STEM']
          commits=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/commits?sha={branch}&per_page=20'],text=True))
          candidates=[]
          census=[]
          for row in commits:
              sha=row['sha']
              response=subprocess.run(['gh','api',f'/repos/{repo}/contents/{path}?ref={sha}'],capture_output=True,text=True)
              if response.returncode:
                  census.append({'commit':sha,'status':'path-absent'})
                  continue
              payload=json.loads(response.stdout)
              data=base64.b64decode(payload['content'])
              text=data.decode('utf-8','replace')
              eligible=(len(data)>30000 and f'name: {stem}' in text and '\n  qualify:\n' in text and '\n  settle:\n' in text and '\n  materialize:\n' in text and 'cycle-011-rastel-final-product-locally-qualified-v1' in text)
              census.append({'commit':sha,'git_blob':payload['sha'],'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'eligible':eligible})
              if eligible:
                  candidates.append((sha,payload['sha'],data))
          assert len(candidates)==1, census
          source_commit,source_blob,raw=candidates[0]
          text=raw.decode('utf-8')
          assert text.count(stem)>0
          text=text.replace(stem,target)

          old="qualification['carrier']['head']==os.environ['GITHUB_SHA']"
          new="qualification['carrier']['head']==os.environ['CARRIER_HEAD']"
          assert text.count(old)==1
          text=text.replace(old,new)

          old="'REVIEW_ARTIFACT':review.get('artifact'),'REVIEW_ZIP_SHA256':review.get('artifact_sha256')"
          new="'REVIEW_ARTIFACT':authorization['binder']['review_artifact'],'REVIEW_ZIP_SHA256':authorization['binder']['review_artifact_sha256']"
          assert text.count(old)==1
          text=text.replace(old,new)

          dollar='$'
          expressions={
              dollar+'{{ github.event.pull_request.head.sha }}':'$CARRIER_HEAD',
              dollar+'{{ github.event.pull_request.number }}':'$CARRIER_PR',
              dollar+'{{ github.event.pull_request.base.sha }}':'$CURRENT_BASE',
          }
          expression_rows=[]
          for expression,value in expressions.items():
              for quote in ("'",'"'):
                  old=quote+expression+quote
                  count=text.count(old)
                  if count:
                      text=text.replace(old,'"'+value+'"')
                      expression_rows.append({'expression':expression,'quote':quote,'occurrences':count,'replacement':value})

          lines=text.splitlines(keepends=True)
          expected={'qualify':3,'settle':3,'materialize':5}
          extracted={}
          for job,want in expected.items():
              start=next(i for i,line in enumerate(lines) if line==f'  {job}:\n')
              end=len(lines)
              for i in range(start+1,len(lines)):
                  if re.fullmatch(r'  [A-Za-z0-9_-]+:\n',lines[i]):
                      end=i
                      break
              block=lines[start:end]
              scripts=[]
              i=0
              while i<len(block):
                  if block[i]=='        run: |\n':
                      i+=1
                      body=[]
                      while i<len(block):
                          line=block[i]
                          if line.strip() and len(line)-len(line.lstrip(' '))<10:
                              break
                          if line.startswith('          '):
                              body.append(line[10:])
                          elif not line.strip():
                              body.append('\n')
                          else:
                              break
                          i+=1
                      script=''.join(body)
                      assert dollar+'{{' not in script, (job,len(scripts),script[:500])
                      scripts.append(script)
                      continue
                  i+=1
              assert len(scripts)==want,(job,len(scripts),want)
              job_dir=root/'jobs'/job
              job_dir.mkdir(parents=True,exist_ok=True)
              rows=[]
              for index,script in enumerate(scripts,1):
                  script_path=job_dir/f'{index:02d}.sh'
                  script_path.write_text(script)
                  subprocess.run(['bash','-n',str(script_path)],check=True)
                  rows.append({'path':script_path.relative_to(root).as_posix(),'bytes':script_path.stat().st_size,'sha256':hashlib.sha256(script_path.read_bytes()).hexdigest()})
              extracted[job]=rows

          patched=text.encode('utf-8')
          (root/'source-v1.yml').write_bytes(raw)
          (root/'patched-v2.yml').write_bytes(patched)
          receipt={
              'status':'cycle-011-rastel-final-product-v2-source-recovered-and-repaired',
              'version':2,
              'source':{'branch':branch,'commit':source_commit,'git_blob':source_blob,'path':path,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},
              'target':{'stem':target,'bytes':len(patched),'sha256':hashlib.sha256(patched).hexdigest()},
              'repairs':[
                  {'name':'exact-event-head-custody','old':"GITHUB_SHA",'new':'CARRIER_HEAD','occurrences':1},
                  {'name':'review-artifact-from-settlement-authorization','old':'review artifact fields','new':'authorization binder review artifact fields','occurrences':1},
              ],
              'event_rebindings':expression_rows,
              'jobs':extracted,
              'commit_census':census,
              'boundary':{'source_workflow_executed':False,'repository_write':False,'canonical_mutation':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute recovered V2 qualification programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in
                *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;;
                *=*) export "$row" ;;
              esac
            done < "$GITHUB_ENV"
          }
          for script in "$BOOTSTRAP"/jobs/qualify/*.sh; do
            bash "$script"
            apply_github_env
          done

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v2-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v2-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v2-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-qualification
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-preflight
