name: card-backfill-uc-079-targeted

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-079-TARGETED.json"
      - "scripts/card-backfill-uc-079-targeted.mjs"
      - ".github/workflows/card-backfill-uc-079-targeted.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-079-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-018'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-018
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-079 caption-bound authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-079-TARGETED.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-079');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_12bdd74c1d97797f21a54d9a');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-079');
          if(row.version!==1||row.record_id!=='UC-079'||row.actor!=='Eddie Murphy'||row.side!=='still')throw new Error('UC-079 targeted authorization drift');
          if(row.selector_artifact?.artifact_id!==8658596662||row.scope_artifact?.artifact_id!==8658730962||row.broad_discovery_artifact?.artifact_id!==8659221908)throw new Error('UC-079 targeted custody drift');
          if(row.role_targets?.length!==6||row.selection_contract?.required_target_keys?.length!==6||row.selection_contract?.reject_single_role_substitution!==true)throw new Error('UC-079 target denominator drift');
          if(!specimen||specimen.character!=='Barbershop crowd & Saul'||specimen.still)throw new Error('UC-079 specimen boundary drift');
          if(!audit||audit.wall_id!=='UC-079'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-079 audit boundary drift');
          if(source?.still)throw new Error('UC-079 source-ledger boundary drift');
          console.log('PASS — six exact UC-079 caption-bound role targets authorized');
          NODE
      - name: Gather caption-bound role candidates and per-target review sheets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-079-targeted
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-079-targeted.mjs
          node scripts/card-backfill-uc-079-targeted.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-079-targeted-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact role targets, pages, candidates, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-079-targeted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-079-targeted
            ${{ runner.temp }}/card-backfill-uc-079-targeted-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
