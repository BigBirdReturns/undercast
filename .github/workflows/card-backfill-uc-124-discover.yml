name: card-backfill-uc-124-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-124-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-124-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-124-discover.mjs"
      - ".github/workflows/card-backfill-uc-124-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-124-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-029'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-029
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-124 repaired discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-124-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-124-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-124');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-124');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4885717de938b33c412d571d');
          if(row.version!==1||row.record_id!=='UC-124'||row.actor!=='James Earl Jones'||row.character!=='Mufasa (and Darth Vader)'||row.production!=='The Lion King / Star Wars'||row.year!==1994||row.side!=='still')throw new Error('UC-124 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-124'||failures.failed_discovery_checkpoints?.length!==1||failures.failed_discovery_checkpoints[0]?.run_id!==30390172228||failures.failed_discovery_checkpoints[0]?.artifact_id!==8700693218||failures.failed_discovery_checkpoints[0]?.head_sha!=='bd3ab2b07bde42534ca50dad4a15f9368f42418f'||failures.failed_discovery_checkpoints[0]?.artifact_digest_sha256!=='44bf64a7791b5e0cf2f30bbb88dc1006b8c494bffa53a602b622fb86a4a92418')throw new Error('UC-124 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8700225871||row.selector_artifact?.head_sha!=='a7b49a6e2de16d74ce57dc98556a8a2a0c010b8f')throw new Error('UC-124 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8700373533||row.scope_artifact?.head_sha!=='4aabff6d82972bca6b37d867562dca3253c15ab4'||row.scope_artifact?.scope_sha256!=='05a54dbacffbf873513c0d41ce17a1743094e670370733edd28b0cacf51ea062')throw new Error('UC-124 scope custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.filter(page=>page.strict).length!==3||row.roles?.length!==2||row.roles.some(role=>role.direct_assets?.length!==1||role.direct_assets[0]?.externally_verified!==true)||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==20)throw new Error('UC-124 repaired discovery denominator drift');
          if(row.roles[0]?.direct_assets[0]?.url!=='https://d23.com/app/uploads/2024/09/1180w_600h_090923_James-Earl-Jones-Obituary_00.jpg'||row.roles[1]?.direct_assets[0]?.url!=='https://d23.com/app/uploads/2024/09/1180w_600h_090923_James-Earl-Jones-Obituary_01.jpg')throw new Error('UC-124 direct asset custody drift');
          if(JSON.stringify(row.selection_contract?.required_role_keys)!==JSON.stringify(['mufasa','vader'])||row.selection_contract?.exact_two_role_composite_required!==true||row.selection_contract?.d23_direct_asset_caption_required!==true||row.selection_contract?.original_1994_animated_mufasa_required!==true||row.selection_contract?.original_trilogy_vader_frame_required!==true||row.selection_contract?.voice_and_physical_embodiment_must_remain_separate!==true||row.selection_contract?.darth_vader_frame_must_not_imply_jones_suit_occupancy!==true||row.selection_contract?.canonical_1994_is_lion_king_chronology_not_vader_debut!==true||row.selection_contract?.both_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-124 selection contract drift');
          if(!specimen||specimen.actor!=='James Earl Jones'||specimen.character!=='Mufasa (and Darth Vader)'||specimen.production!=='The Lion King / Star Wars'||specimen.years!=='1994'||specimen.still)throw new Error('UC-124 specimen boundary drift');
          if(source?.still)throw new Error('UC-124 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-124'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-124 audit boundary drift');
          console.log('PASS — exact UC-124 D23 direct-asset repair authorized');
          NODE
      - name: Prepare failure custody and direct assets in isolated working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-124-discover.mjs scripts/.card-backfill-uc-124-discover-run.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-124-discover-run.mjs')
          text=path.read_text()
          old_control="""const control = await readJson(CONTROL);
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-124', 'UC-124 discovery scope drift');"""
          new_control="""const control = await readJson(CONTROL);
          const failureLedger = await readJson('.github/CARD-BACKFILL-UC-124-DISCOVER-FAILURES.json');
          assert(failureLedger.version === 1 && failureLedger.record_id === 'UC-124' && failureLedger.failed_discovery_checkpoints?.length === 1 && failureLedger.failed_discovery_checkpoints[0]?.artifact_id === 8700693218, 'UC-124 failed discovery custody drift');
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-124', 'UC-124 discovery scope drift');"""
          old_sort="""    scoredRows.sort((a, b) => b.score - a.score || a.url.localeCompare(b.url));"""
          new_sort="""    for (const asset of role.direct_assets || []) {
                const pageSpec = role.pages[0];
                const directRow = { url: asset.url, label: asset.title, context: asset.caption, origin: 'declared-direct-asset' };
                const scored = scoreRow(role, pageSpec, directRow);
                scoredRows.push({ ...directRow, pageSpec, ...scored, score: scored.score + Number(asset.score_bonus || 0), captionMatch: true, roleSignal: true, direct_asset: true, externally_verified: asset.externally_verified === true, source_link_id: asset.source_link_id || null });
              }
              scoredRows.sort((a, b) => b.score - a.score || a.url.localeCompare(b.url));"""
          old_return="""caption_match: row.captionMatch, role_signal: row.roleSignal };"""
          new_return="""caption_match: row.captionMatch, role_signal: row.roleSignal, direct_asset: row.direct_asset === true, externally_verified: row.externally_verified === true, source_link_id: row.source_link_id || null };"""
          old_manifest="""    scope_artifact: control.scope_artifact,
              repository_hash_count: repository.size,"""
          new_manifest="""    scope_artifact: control.scope_artifact,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              discovery_repair_boundary: failureLedger.repair_boundary,
              repository_hash_count: repository.size,"""
          old_summary="""    candidates: candidates.map(row => ({ role_key: row.role_key, role: row.role, source_page_key: row.source_page_key, source_page: row.source_page, label: row.label, local: row.local, mime: row.mime, bytes: row.bytes, sha256: row.sha256, width: row.width, height: row.height, score: row.score, positive_terms: row.positive_terms, negative_terms: row.negative_terms, caption_match: row.caption_match, repository_matches: row.repository_matches })),"""
          new_summary="""    failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              candidates: candidates.map(row => ({ role_key: row.role_key, role: row.role, source_page_key: row.source_page_key, source_page: row.source_page, label: row.label, local: row.local, mime: row.mime, bytes: row.bytes, sha256: row.sha256, width: row.width, height: row.height, score: row.score, positive_terms: row.positive_terms, negative_terms: row.negative_terms, caption_match: row.caption_match, direct_asset: row.direct_asset, externally_verified: row.externally_verified, source_link_id: row.source_link_id, repository_matches: row.repository_matches })),"""
          for old,new,name in [(old_control,new_control,'control'),(old_sort,new_sort,'direct assets'),(old_return,new_return,'candidate return'),(old_manifest,new_manifest,'manifest'),(old_summary,new_summary,'summary')]:
              if old not in text:
                  raise SystemExit(f'UC-124 repair anchor missing: {name}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-124-discover-run.mjs
      - name: Gather official pages and exact D23 role assets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-124-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-124-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-124-discover-run.log"
          rm scripts/.card-backfill-uc-124-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, failure custody, exact assets, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-124-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-124-discover
            ${{ runner.temp }}/card-backfill-uc-124-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
