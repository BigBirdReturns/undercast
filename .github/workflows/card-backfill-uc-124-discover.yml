name: card-backfill-uc-124-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-124-DISCOVER.json"
      - "scripts/card-backfill-uc-124-discover.mjs"
      - ".github/workflows/card-backfill-uc-124-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-124-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-029'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-029
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-124 two-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-124-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-124');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-124');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4885717de938b33c412d571d');
          if(row.version!==1||row.record_id!=='UC-124'||row.actor!=='James Earl Jones'||row.character!=='Mufasa (and Darth Vader)'||row.production!=='The Lion King / Star Wars'||row.year!==1994||row.side!=='still')throw new Error('UC-124 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8700225871||row.selector_artifact?.head_sha!=='a7b49a6e2de16d74ce57dc98556a8a2a0c010b8f')throw new Error('UC-124 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8700373533||row.scope_artifact?.head_sha!=='4aabff6d82972bca6b37d867562dca3253c15ab4'||row.scope_artifact?.scope_sha256!=='05a54dbacffbf873513c0d41ce17a1743094e670370733edd28b0cacf51ea062')throw new Error('UC-124 scope custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.filter(page=>page.strict).length!==3||row.roles?.length!==2||row.roles.filter(role=>role.strict).length!==2||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==20)throw new Error('UC-124 discovery denominator drift');
          if(JSON.stringify(row.selection_contract?.required_role_keys)!==JSON.stringify(['mufasa','vader'])||row.selection_contract?.exact_two_role_composite_required!==true||row.selection_contract?.strict_actor_role_pages_required!==3||row.selection_contract?.original_1994_animated_mufasa_required!==true||row.selection_contract?.original_trilogy_vader_frame_required!==true||row.selection_contract?.voice_and_physical_embodiment_must_remain_separate!==true||row.selection_contract?.darth_vader_frame_must_not_imply_jones_suit_occupancy!==true||row.selection_contract?.canonical_1994_is_lion_king_chronology_not_vader_debut!==true||row.selection_contract?.both_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-124 selection contract drift');
          if(!specimen||specimen.actor!=='James Earl Jones'||specimen.character!=='Mufasa (and Darth Vader)'||specimen.production!=='The Lion King / Star Wars'||specimen.years!=='1994'||specimen.still)throw new Error('UC-124 specimen boundary drift');
          if(source?.still)throw new Error('UC-124 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-124'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-124 audit boundary drift');
          console.log('PASS — exact UC-124 James Earl Jones two-role official-source discovery authorized');
          NODE
      - name: Gather official role pages and caption-local image candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-124-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-124-discover.mjs
          node scripts/card-backfill-uc-124-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-124-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-124-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-124-discover
            ${{ runner.temp }}/card-backfill-uc-124-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
