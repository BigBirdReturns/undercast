name: star-trek-cadmar-media-preparation

on:
  push:
    branches:
      - agent/star-trek-cadmar-media-prep-v1

permissions:
  contents: read
  actions: write

jobs:
  media-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
      SOURCE_DIR: /tmp/cadmar-source-probe
      SCOUT_DIR: /tmp/cadmar-media-scout
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover exact Cadmar source and scout artifacts
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9301591487/zip > /tmp/cadmar-source-probe.zip
          echo 'e569ea3a26b0e6a84af4519bdc237b73c7a1f4056001615c36a6f798dbbc8bdb  /tmp/cadmar-source-probe.zip' | sha256sum -c -
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9302090456/zip > /tmp/cadmar-media-scout.zip
          echo 'da9a3a24944493a8fe76c6985c9e8ecec4f6c4961dfa80b61f409623d6625036  /tmp/cadmar-media-scout.zip' | sha256sum -c -
          rm -rf "$SOURCE_DIR" "$SCOUT_DIR"
          mkdir -p "$SOURCE_DIR" "$SCOUT_DIR"
          unzip -q /tmp/cadmar-source-probe.zip -d "$SOURCE_DIR"
          unzip -q /tmp/cadmar-media-scout.zip -d "$SCOUT_DIR"
      - run: python3 -m pip install --quiet pillow
      - name: Decode exact Cadmar media preparer
        run: |
          set -euo pipefail
          base64 -d .github/cadmar-media-prepare.py.gz.b64 | gzip -d > /tmp/cadmar-media-prepare.py
          echo '7ce12945eaf26e2184168c067f6f9a76c8caf139a23bbe41d0f77baaeaccab9c  /tmp/cadmar-media-prepare.py' | sha256sum -c -
      - name: Prepare exact Cadmar still and performer portrait
        run: python3 /tmp/cadmar-media-prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-media
          path: /tmp/star-trek-cadmar-media/
          if-no-files-found: error
          retention-days: 30
