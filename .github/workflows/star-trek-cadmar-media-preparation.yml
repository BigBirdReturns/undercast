name: star-trek-cadmar-media-preparation

on:
  push:
    branches:
      - agent/star-trek-cadmar-media-prep-v1

concurrency:
  group: star-trek-cadmar-media-preparation
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  media-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
      SOURCE_DIR: /tmp/cadmar-source-probe
      SCOUT_DIR: /tmp/cadmar-media-scout
      PRODUCT_BRANCH: agent/star-trek-cadmar-media-product-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish workflow run locator
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          rm -rf /tmp/cadmar-media-locator
          git worktree add --detach /tmp/cadmar-media-locator "$EXPECTED_MAIN"
          cd /tmp/cadmar-media-locator
          git checkout -B "$PRODUCT_BRANCH"
          rm -rf transport/cadmar-media
          mkdir -p transport/cadmar-media
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "version": 1,
              "transaction": "STAR-TREK-CADMAR-MEDIA-RUN-LOCATOR",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job": os.environ["GITHUB_JOB"],
              "head_sha": os.environ["GITHUB_SHA"],
              "canonical_parent": os.environ["EXPECTED_MAIN"],
              "status": "started",
          }
          Path("transport/cadmar-media/run-locator.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name undercast-cadmar-media
          git config user.email cadmar-media@users.noreply.github.com
          git add transport/cadmar-media/run-locator.json
          git commit -m 'Cadmar: publish media run locator'
          git push --force origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/cadmar-media-locator
      - name: Recover exact Cadmar source and scout artifacts
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9301591487/zip > /tmp/cadmar-source-probe.zip
          echo 'e569ea3a26b0e6a84af4519bdc237b73c7a1f4056001615c36a6f798dbbc8bdb  /tmp/cadmar-source-probe.zip' | sha256sum -c -
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9302090456/zip > /tmp/cadmar-media-scout.zip
          echo 'da9a3a24944493a8fe76c6985c9e8ecec4f6c4961dfa80b61f409623d6625036  /tmp/cadmar-media-scout.zip' | sha256sum -c -
          rm -rf "$SOURCE_DIR" "$SCOUT_DIR"
          mkdir -p "$SOURCE_DIR" "$SCOUT_DIR"
          unzip -q /tmp/cadmar-source-probe.zip -d "$SOURCE_DIR"
          unzip -q /tmp/cadmar-media-scout.zip -d "$SCOUT_DIR"
      - run: python3 -m pip install --quiet pillow
      - name: Decode exact Cadmar media preparer
        run: |
          set -euo pipefail
          base64 -d .github/cadmar-media-prepare.py.gz.b64 | gzip -d > /tmp/cadmar-media-prepare.py
          echo '7ce12945eaf26e2184168c067f6f9a76c8caf139a23bbe41d0f77baaeaccab9c  /tmp/cadmar-media-prepare.py' | sha256sum -c -
      - name: Prepare exact Cadmar still and performer portrait
        run: python3 /tmp/cadmar-media-prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-media
          path: /tmp/star-trek-cadmar-media/
          if-no-files-found: error
          retention-days: 30
      - name: Publish temporary media read-back branch
        run: |
          set -euo pipefail
          artifact_id=
          artifact_digest=
          for attempt in $(seq 1 30); do
            row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="star-trek-cadmar-media") | [.id,.digest] | @tsv' | head -n1)"
            if [ -n "$row" ]; then
              artifact_id="$(printf '%s' "$row" | cut -f1)"
              artifact_digest="$(printf '%s' "$row" | cut -f2)"
              break
            fi
            sleep 2
          done
          test -n "$artifact_id"
          git fetch origin main --depth=1
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$PRODUCT_BRANCH"
          rm -rf transport/cadmar-media
          mkdir -p transport/cadmar-media
          cp -a /tmp/star-trek-cadmar-media/. transport/cadmar-media/
          export artifact_id artifact_digest
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "version": 1,
              "transaction": "STAR-TREK-CADMAR-MEDIA-READBACK",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "job": os.environ["GITHUB_JOB"],
              "head_sha": os.environ["GITHUB_SHA"],
              "canonical_parent": os.environ["EXPECTED_MAIN"],
              "artifact_id": int(os.environ["artifact_id"]),
              "artifact_digest": os.environ["artifact_digest"],
          }
          Path("transport/cadmar-media/run.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          git config user.name undercast-cadmar-media
          git config user.email cadmar-media@users.noreply.github.com
          git add transport/cadmar-media
          git commit -m 'Cadmar: publish media read-back carrier'
          git push --force origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
