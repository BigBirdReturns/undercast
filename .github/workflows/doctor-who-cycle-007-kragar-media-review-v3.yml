name: doctor-who-cycle-007-kragar-media-review-v3

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-007-kragar-media-review-v3.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-007-kragar-media-review-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-007-kragar-media-review-v3.yml
  EXACT_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-007-kragar-media-review-v3
  SOURCE_RUN: "31025024272"
  SOURCE_JOB: "92371193579"
  SOURCE_HEAD: db1190c7374cc96834eb0c762de2578c434452da
  SOURCE_ARTIFACT_ID: "8938253339"
  SOURCE_ARTIFACT: doctor-who-cycle-007-kragar-media-31025024272
  SOURCE_ARTIFACT_DIGEST: sha256:a027df39555f90b81f520aa12cca0176860b05ffdb21d379cbae2d5f5d823c1c
  TASK_ID: ap_ffea809b980b468b33fa462c
  SOURCE_FINGERPRINT: 8baf724d7501a98347e50b135dbe732586da3f3954908394122d5b31cbd734d1
  SOURCE_CONTENT_SHA256: 6f57112817f92b445ae7f32223f3d4e095c11f2c1702bab84eca4eccc17d8428
  SELECTED_TASK_SHA256: 0fb5bc70b0a3d3c1925fa7b97792fc8643312f990bef9f568f0ff95f29d2cd38
  RECOVERED_SOURCES_SHA256: 6e141cef941fddcd84091458ccf43ba083f696f38f39dcc6e837cbde13a4bed4
  SOURCE_METADATA_SHA256: f985b589ba60f5342e63e17b4f1b7b9a760714de0d86d4a2557649fb17fd5466
  SOURCE_IMAGE_SHA256: 904ad4b1493f14b7e7df8413bb95bbc312decf2d5d398b26a285dec122f62e70
  CANDIDATE_IMAGE_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  GH_TOKEN: ${{ github.token }}

jobs:
  review:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-kragar-media-review-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-007-kragar-media-review-v3.yml
            data
            images
            scripts

      - name: Bind exact canonical main and one-file carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/source"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-paths.txt"
          diff -u "$OUT/expected-paths.txt" "$OUT/actual-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" > "$OUT/main-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Bind canonical artifact and recovered-run boundary
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$OUT/source-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > "$OUT/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" > "$OUT/source-jobs.json"

          jq -e \
            --argjson id "$SOURCE_ARTIFACT_ID" \
            --arg name "$SOURCE_ARTIFACT" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson run "$SOURCE_RUN" \
            '.id == $id and .name == $name and .digest == $digest and .workflow_run.id == $run and .expired == false' \
            "$OUT/source-artifact.json" >/dev/null

          jq -e \
            --argjson run "$SOURCE_RUN" \
            --arg head "$SOURCE_HEAD" \
            '.id == $run and .head_sha == $head and .status == "completed" and .conclusion == "failure"' \
            "$OUT/source-run.json" >/dev/null

          jq -e \
            --argjson job "$SOURCE_JOB" '
              any(.jobs[];
                .id == $job and .name == "review" and .status == "completed" and .conclusion == "failure" and
                any(.steps[]; .name == "Recover exact source-image metadata and bytes" and .conclusion == "success") and
                any(.steps[]; .name == "Prepare deterministic exact-subject still candidate" and .conclusion == "failure") and
                any(.steps[]; .name == "Refuse duplicate bytes and prove current media baseline" and .conclusion == "skipped") and
                any(.steps[]; .name == "Record preliminary performance and media boundary" and .conclusion == "skipped") and
                any(.steps[]; .name == "Upload exact Kragar media review packet" and .conclusion == "success")
              )' "$OUT/source-jobs.json" >/dev/null

      - name: Download exact recovered Kragar media packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: ${{ env.OUT }}/source
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.SOURCE_RUN }}

      - name: Verify exact task, source, metadata, and image bytes
        shell: bash
        run: |
          set -euo pipefail
          source="$OUT/source"
          for file in selected-task.json recovered-sources.json source-01.wikitext kragar-source-metadata.json kragar-source-original kragar-still-candidate.jpg; do
            test -f "$source/$file"
          done
          test "$(sha256sum "$source/selected-task.json" | awk '{print $1}')" = "$SELECTED_TASK_SHA256"
          test "$(sha256sum "$source/recovered-sources.json" | awk '{print $1}')" = "$RECOVERED_SOURCES_SHA256"
          test "$(sha256sum "$source/source-01.wikitext" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"
          test "$(sha256sum "$source/kragar-source-metadata.json" | awk '{print $1}')" = "$SOURCE_METADATA_SHA256"
          test "$(sha256sum "$source/kragar-source-original" | awk '{print $1}')" = "$SOURCE_IMAGE_SHA256"
          test "$(sha256sum "$source/kragar-still-candidate.jpg" | awk '{print $1}')" = "$CANDIDATE_IMAGE_SHA256"
          test "$(wc -c < "$source/source-01.wikitext")" -eq 2556
          test "$(wc -c < "$source/kragar-source-original")" -eq 14418
          test "$(wc -c < "$source/kragar-still-candidate.jpg")" -eq 15719
          test "$(identify -format '%m %w %h' "$source/kragar-source-original")" = "WEBP 502 302"
          test "$(identify -format '%m %w %h' "$source/kragar-still-candidate.jpg")" = "JPEG 502 302"

          jq -e \
            --arg exact "$EXACT_MAIN" --arg task "$TASK_ID" --arg fingerprint "$SOURCE_FINGERPRINT" '
              .exact_main == $exact and .lease_issued == false and .queue_mutated == false and
              .global_active_count == 0 and .queue.total == 316 and .queue.queued == 310 and
              .queue.resolved == 6 and .queue.in_flight == 0 and .counts.compatible == 310 and
              .counts.incompatible == 0 and .selected.task_id == $task and
              .selected.performer == "Dan Starkey" and .selected.character == "Kragar" and
              .selected.source_fingerprint == $fingerprint and .task.status == "queued"
            ' "$source/selected-task.json" >/dev/null

          jq -e --arg source_sha "$SOURCE_IMAGE_SHA256" '
            .file_title == "File:Hologram Kragar.jpg" and .pageid == 301279 and
            .timestamp == "2021-11-04T13:40:37Z" and .source_width == 502 and
            .source_height == 302 and .source_sha256 == $source_sha
          ' "$source/kragar-source-metadata.json" >/dev/null

          grep -F '|image       = Hologram Kragar.jpg' "$source/source-01.wikitext" >/dev/null
          grep -F '|first       = The Halloween Apocalypse (TV story)' "$source/source-01.wikitext" >/dev/null
          grep -F '|actor       = Dan Starkey' "$source/source-01.wikitext" >/dev/null
          grep -F 'given notably different make-up' "$source/source-01.wikitext" >/dev/null

      - name: Refuse duplicate media and prove current baseline
        shell: bash
        run: |
          set -euo pipefail
          find images -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/current-image-sha256.txt"
          if grep -E "^(${SOURCE_IMAGE_SHA256}|${CANDIDATE_IMAGE_SHA256})  " "$OUT/current-image-sha256.txt"; then
            echo 'Kragar source or candidate bytes already exist in repository media' >&2
            exit 1
          fi
          grep -R -n -E "(${SOURCE_IMAGE_SHA256}|${CANDIDATE_IMAGE_SHA256}|Hologram Kragar\.jpg)" data > "$OUT/current-adoption-matches.txt" || true
          test ! -s "$OUT/current-adoption-matches.txt"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/current-media-gate.log"
          test -z "$(git status --porcelain)"

      - name: Bind audit vocabulary, quality projection, and visual review
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lib = fs.readFileSync('scripts/lib/media-audit.mjs', 'utf8');
          for (const token of ['"expected"', '"character-depiction"']) {
            if (!lib.includes(token)) throw new Error(`required media-audit token missing: ${token}`);
          }
          const doc = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const records = Array.isArray(doc) ? doc : (doc.records ?? doc.specimens ?? doc.items);
          if (!Array.isArray(records)) throw new Error('specimen collection shape is unsupported');
          const src = (value) => typeof value === 'string' ? value : value?.src;
          const missingBoth = records.filter((record) => !src(record.still) && !src(record.portrait)).length;
          const current = {total: records.length, fully_unillustrated: missingBoth, ratio: missingBoth / records.length};
          const projected = {total: records.length + 1, fully_unillustrated: missingBoth, ratio: missingBoth / (records.length + 1)};
          if (!(projected.ratio < current.ratio)) throw new Error('Kragar still-only projection is not strictly non-regressing');
          fs.writeFileSync(`${process.env.OUT}/quality-projection.json`, `${JSON.stringify({current, kragar_still_only: projected, numerator_change: 0, denominator_change: 1}, null, 2)}\n`);
          NODE

          jq -n \
            --arg exact "$EXACT_MAIN" --arg task "$TASK_ID" --arg fingerprint "$SOURCE_FINGERPRINT" \
            --arg source_sha "$SOURCE_IMAGE_SHA256" --arg candidate_sha "$CANDIDATE_IMAGE_SHA256" '
            {
              version:4, exact_main:$exact, task_id:$task, performer:"Dan Starkey", role:"Kragar",
              source_fingerprint:$fingerprint, queued_performance_mode:"unresolved",
              adjudicated_performance_mode:"physical-prosthetic",
              performance_basis:[
                "frozen source identifies a televised Doctor Who performance",
                "frozen source credits Dan Starkey as Kragar",
                "frozen source states Starkey received notably different make-up for Kragar"
              ],
              character_still:{
                status:"visually-reviewed-exact-subject", source_file:"File:Hologram Kragar.jpg",
                source_page_id:301279, source_sha256:$source_sha, source_format:"WEBP",
                source_width:502, source_height:302, source_bytes:14418,
                candidate_sha256:$candidate_sha, candidate_format:"JPEG",
                candidate_width:502, candidate_height:302, candidate_bytes:15719,
                proposed_kind:"copyright", identity_vote:"expected", presentation_vote:"character-depiction"
              },
              visual_review:{
                completed:true, bound_candidate_sha256:$candidate_sha,
                observations:[
                  "single close-up of Kragar head, face, and upper collar",
                  "blue holographic scan-line presentation",
                  "no collage, logo, cover art, unrelated person, or generic substitute"
                ]
              },
              performer_portrait:{status:"not-adopted"}, lease_issued:false, queue_mutated:false,
              canonical_record_created:false, media_adopted:false, waterline_event_written:false,
              cycle_receipt_written:false, product_published:false
            }' > "$OUT/review-boundary.json"
          jq -cS . "$OUT/review-boundary.json" | sha256sum | awk '{print $1}' > "$OUT/review-boundary.sha256"
          test -z "$(git status --porcelain)"

      - name: Upload exact final Kragar review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
