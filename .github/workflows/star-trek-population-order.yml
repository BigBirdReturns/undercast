name: star-trek-population-order

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-ORDER.json"
      - ".github/workflows/star-trek-population-order.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
          fetch-depth: 0
      - name: Match the wall's exact catalog ordering
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/rendered/site.spec.mjs')
          text=path.read_text()
          old='  expect(names).toEqual(["Quark","Rom","Nog","Quark (mirror)","Brunt (mirror)","Nog (mirror)","Ishka","Bok / Gral / Prak","Krax","DaiMon Lurin","Grimp","Leck","Pel","Berik","Zek"]);'
          new='  expect(names).toEqual(["Quark","Rom","Nog","Quark (mirror)","Brunt (mirror)","Nog (mirror)","Ishka","Zek","Bok / Gral / Prak","Krax","DaiMon Lurin","Grimp","Leck","Pel","Berik"]);'
          count=text.count(old)
          if count!=1: raise SystemExit(f'exact rendered-order match count: {count}')
          path.write_text(text.replace(old,new,1))
          PY
          rm -f .github/STAR-TREK-POPULATION-ORDER.json
          rm -f .github/workflows/star-trek-population-order.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add tests/rendered/site.spec.mjs .github/STAR-TREK-POPULATION-ORDER.json .github/workflows/star-trek-population-order.yml
          git diff --cached --check
          git commit -m "Population: place Zek in exact Ferengi catalog order"
          git push origin HEAD:agent/star-trek-population-001
