name: complete-doctor-who-cycle-005-kaarsh

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/complete-doctor-who-cycle-005-kaarsh.yml"
      - ".ci/doctor-who-cycle-005/scripts.tgz.b64*"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-005-kaarsh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/complete-doctor-who-cycle-005-kaarsh.yml
  TRANSPORT: .ci/doctor-who-cycle-005/scripts.tgz.b64
  TRANSPORT_PARTS: "8"
  TRANSPORT_SHA256: 141ae74e5b4e9258f976175c3abc7ff0a71da0646a382972cdc0ffdd24b696a5
  MATERIALIZER: /tmp/doctor-who-cycle-005/apply-doctor-who-cycle-005.mjs
  FINALIZER: /tmp/doctor-who-cycle-005/apply-doctor-who-cycle-finalize-005.mjs
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-005
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-005-context.json
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-005-preflight
  REATTESTATION_DIR: /tmp/doctor-who-cycle-005-kaarsh-still-reattestation
  GH_TOKEN: ${{ github.token }}

jobs:
  cycle-005:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-005-kaarsh-completion'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify -version

      - name: Download current-main cycle-005 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-005-preflight-30884868963
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30884868963

      - name: Download current-main Kaarsh still re-attestation
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-005-kaarsh-still-reattestation-30885200254
          path: ${{ env.REATTESTATION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30885200254

      - name: Decode, rebase, and bind strict cycle-005 custody
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=( "$TRANSPORT" "$TRANSPORT".part-* )
          test "${#parts[@]}" -eq "$TRANSPORT_PARTS"
          mkdir -p "$CYCLE_ASSET_DIR"
          cat "${parts[@]}" | tr -d '\n\r\t ' | base64 --decode > /tmp/doctor-who-cycle-005-bootstrap.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-005-bootstrap.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-005-bootstrap.tgz -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/01-bind-decode.sh" | awk '{print $1}')" = "54b792507bb71ae465bff1d7367ddb0c5ae425d8cce4567d580abdae760e61a3"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "ebbe5558e69895fb94f79998bd71212cb3b7b71b09eb1598c6e3ee3338d14c1e"
          sha256sum "$CYCLE_ASSET_DIR/01-bind-decode.sh" "$CYCLE_ASSET_DIR/transport-manifest.json" > /tmp/doctor-who-cycle-005-runtime-patch.sha256
          chmod +x "$CYCLE_ASSET_DIR"/*.sh
          bash "$CYCLE_ASSET_DIR/01-bind-decode.sh"

      - name: Claim, materialize, review, and resolve exactly one Kaarsh task
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Stage and completely gate workflow-free terminal candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate-gate.sh"

      - name: Commit terminal candidate and bind workflow job custody
        id: candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-candidate-commit.sh"

      - name: Upload exact terminal candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-005-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-005-context.json
            /tmp/doctor-who-cycle-005-candidate-*
            /tmp/doctor-who-cycle-005-materialize.log
            /tmp/doctor-who-cycle-005-still*
            /tmp/doctor-who-cycle-005-transport*
            /tmp/doctor-who-cycle-005-normalized-verification.sha256
            /tmp/doctor-who-cycle-005-runtime-patch.sha256
            /tmp/doctor-who-cycle-005-allowed-main-drift.txt
            /tmp/doctor-who-cycle-005-observed-main-drift.txt
            /tmp/doctor-who-cycle-005-unsafe-main-drift.txt
            /tmp/expected-transport-*
            /tmp/actual-transport-*

      - name: Write and validate reviewed cycle and permanent checker
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          WORKFLOW_JOB_ID: ${{ steps.candidate.outputs.workflow_job_id }}
          CANDIDATE_GATE_SHA256: ${{ steps.candidate.outputs.candidate_gate_sha256 }}
          CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-005-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: bash "$CYCLE_ASSET_DIR/05-finalize.sh"

      - name: Commit, completely gate, and publish exact final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/06-final-gate-publish.sh"

      - name: Upload complete cycle and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-005-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/doctor-who-cycle-005-context.json
            /tmp/doctor-who-cycle-005-candidate-*
            /tmp/doctor-who-cycle-005-final-*
            /tmp/doctor-who-cycle-005-finalize.log
            /tmp/doctor-who-cycle-005-materialize.log
            /tmp/doctor-who-cycle-005-still*
            /tmp/doctor-who-cycle-005-transport*
            /tmp/doctor-who-cycle-005-normalized-verification.sha256
            /tmp/doctor-who-cycle-005-runtime-patch.sha256
            /tmp/doctor-who-cycle-005-allowed-main-drift.txt
            /tmp/doctor-who-cycle-005-observed-main-drift.txt
            /tmp/doctor-who-cycle-005-unsafe-main-drift.txt
            /tmp/expected-transport-*
            /tmp/actual-transport-*
            data/review/adapter-sdk/doctor-who-cycle-005-kaarsh.json
            scripts/doctor-who-cycle-005.mjs
