name: doctor-who-cycle-011-rastel-trusted-publisher-v1

"on":
  workflow_run:
    workflows: ["doctor-who-cycle-011-rastel-final-review-v4-direct"]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-trusted-publisher-v1
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'doctor-who-cycle-011-rastel-final-review-v4-direct' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'agent/doctor-who-cycle-011-rastel-final-review-v4-direct' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      handoff_id: ${{ steps.upload.outputs.artifact-id }}
      handoff_digest: ${{ steps.upload.outputs.artifact-digest }}
      publication_main: ${{ steps.settle.outputs.publication_main }}
      canonical_commit: ${{ steps.settle.outputs.canonical_commit }}
      source_artifact: ${{ steps.source.outputs.source_artifact }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v4-direct
      SOURCE_WORKFLOW: doctor-who-cycle-011-rastel-final-review-v4-direct
      SOURCE_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-final-review-v4-direct-
      OUT: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-verify
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind installed publisher and exact successful review run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,review,handoff,receipt,logs,work}
          publication_main="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$ORIGINAL_MAIN"
          test "$(git rev-list --count "$ORIGINAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$ORIGINAL_MAIN"..HEAD)"
          test "$(git diff --name-status "$ORIGINAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$ORIGINAL_MAIN")" = "$ORIGINAL_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$publication_main"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          jq -e \
            --argjson run "$SOURCE_RUN" --argjson attempt "$SOURCE_ATTEMPT" --arg head "$SOURCE_HEAD" --arg branch "$SOURCE_BRANCH" --arg workflow "$SOURCE_WORKFLOW" \
            '.id==$run and .run_attempt==$attempt and .head_sha==$head and .head_branch==$branch and .name==$workflow and .event=="pull_request" and .status=="completed" and .conclusion=="success" and .repository.full_name==env.GITHUB_REPOSITORY' \
            "$OUT/api/source-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/commits/$SOURCE_HEAD/pulls" -H 'Accept: application/vnd.github+json' > "$OUT/api/source-prs.json"
          jq -e --arg branch "$SOURCE_BRANCH" --arg base "$ORIGINAL_MAIN" '[.[] | select(.head.ref==$branch and .base.ref=="main" and .base.sha==$base and .state=="open" and .draft==true and .merged_at==null)] | length==1' "$OUT/api/source-prs.json" >/dev/null
          source_pr="$(jq -r --arg branch "$SOURCE_BRANCH" '.[] | select(.head.ref==$branch and .state=="open" and .draft==true and .merged_at==null) | .number' "$OUT/api/source-prs.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          jq -e '[.jobs[] | select(.name=="review" and .status=="completed" and .conclusion=="success")] | length==1' "$OUT/api/source-jobs.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"
          artifact="$(jq -c --arg name "$SOURCE_ARTIFACT_PREFIX$SOURCE_RUN-attempt-$SOURCE_ATTEMPT" '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0] else empty end' "$OUT/api/source-artifacts.json")"
          test -n "$artifact"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/source/review.zip"
          test "$(sha256sum "$OUT/source/review.zip" | awk '{print $1}')" = "${artifact_digest#sha256:}"
          printf 'PUBLICATION_MAIN=%s\nSOURCE_PR=%s\nSOURCE_ARTIFACT=%s\nSOURCE_ARTIFACT_DIGEST=%s\n' "$publication_main" "$source_pr" "$artifact_id" "$artifact_digest" >> "$GITHUB_ENV"
          printf 'source_artifact=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Authenticate exact review approval and publication handoff
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/source/review.zip" TARGET="$OUT/review" python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          z=Path(os.environ['ZIP']); target=Path(os.environ['TARGET']); target.mkdir()
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(z) as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          approval=json.loads((target/'receipt/approval.json').read_text()); identity=approval.pop('identity')
          assert identity==os.environ['APPROVAL_IDENTITY']
          assert sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          approval['identity']=identity
          handoff=json.loads((target/'handoff/publication-handoff.json').read_text()); hid=handoff.pop('identity')
          assert hid==os.environ['HANDOFF_IDENTITY']
          assert sha(json.dumps(handoff,sort_keys=True,separators=(',',':')).encode())==hid
          handoff['identity']=hid
          assert approval['status']=='cycle-011-rastel-final-product-independently-approved-v1'
          assert approval['boundary']=={'approved_for_default_branch_publication':True,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False,'repository_product_ref_created':False}
          assert handoff['status']=='cycle-011-rastel-publication-handoff-ready-v1'
          assert handoff['approval_identity']==identity and handoff['boundary']=={'canonical_mutation':False,'cycle_012_authorized':False,'default_branch_publisher_required':True,'repository_write':False}
          expected={'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'commit':os.environ['PRODUCT_COMMIT'],'file_manifest_sha256':os.environ['MANIFEST_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],'paths':int(os.environ['PRODUCT_PATHS']),'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'tree':os.environ['PRODUCT_TREE']}
          assert approval['product']==expected and handoff['product']==expected
          expected_cycle={'event_id':os.environ['WATERLINE_EVENT'],'id':os.environ['CYCLE_ID'],'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256'],'receipt_identity':os.environ['RECEIPT_IDENTITY']}
          assert approval['cycle']==expected_cycle and handoff['cycle']==expected_cycle
          assert approval['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert all(approval['gates'].values())
          for name,digest in [('product.bundle',os.environ['PRODUCT_BUNDLE_SHA256']),('product.patch',os.environ['PRODUCT_PATCH_SHA256']),('product.tar',os.environ['PRODUCT_TAR_SHA256']),('file-manifest.json',os.environ['MANIFEST_SHA256'])]:
              source=target/'handoff'/name
              assert source.is_file() and sha(source.read_bytes())==digest
              shutil.copy2(source,Path(os.environ['OUT'])/'handoff'/name)
          shutil.copy2(target/'receipt/approval.json',Path(os.environ['OUT'])/'handoff/review-approval.json')
          shutil.copy2(target/'handoff/publication-handoff.json',Path(os.environ['OUT'])/'handoff/publication-handoff.json')
          PY
          git bundle verify "$OUT/handoff/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch --no-tags "$OUT/handoff/product.bundle" "$PRODUCT_COMMIT:refs/verify/cycle-011-reviewed-product"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$ORIGINAL_MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          test "$(git rev-list --count "$ORIGINAL_MAIN".."$PRODUCT_COMMIT")" = 1
          test -z "$(git rev-list --merges "$ORIGINAL_MAIN".."$PRODUCT_COMMIT")"

      - name: Construct exact self-deleting canonical commit and rerun complete gate
        id: settle
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="$COMMIT_NAME" GIT_AUTHOR_EMAIL="$COMMIT_EMAIL" GIT_AUTHOR_DATE="$COMMIT_DATE"
          export GIT_COMMITTER_NAME="$COMMIT_NAME" GIT_COMMITTER_EMAIL="$COMMIT_EMAIL" GIT_COMMITTER_DATE="$COMMIT_DATE"
          canonical="$(printf '%s\n' "$COMMIT_MESSAGE" | git commit-tree "$PRODUCT_TREE" -p "$PUBLICATION_MAIN")"
          test "$(git show -s --format=%P "$canonical")" = "$PUBLICATION_MAIN"
          test "$(git show -s --format=%T "$canonical")" = "$PRODUCT_TREE"
          git diff --name-status "$PUBLICATION_MAIN" "$canonical" > "$OUT/logs/installed-to-canonical.tsv"
          test "$(awk -v self="$SELF" '$1=="D" && $2==self {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 1
          test "$(wc -l < "$OUT/logs/installed-to-canonical.tsv" | tr -d ' ')" = 50
          git diff --name-only "$ORIGINAL_MAIN" "$canonical" | LC_ALL=C sort > "$OUT/logs/canonical-product-paths.txt"
          test "$(wc -l < "$OUT/logs/canonical-product-paths.txt" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(grep '^.github/workflows/' "$OUT/logs/canonical-product-paths.txt" || true)"
          work="$OUT/work/canonical"
          git worktree add --detach "$work" "$canonical"
          cd "$work"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline.log"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          cd "$GITHUB_WORKSPACE"
          export CANONICAL_COMMIT="$canonical"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); publication={'status':'cycle-011-rastel-canonical-publication-authorized-v1','version':1,'source':{'run':int(os.environ['SOURCE_RUN']),'attempt':int(os.environ['SOURCE_ATTEMPT']),'head':os.environ['SOURCE_HEAD'],'branch':os.environ['SOURCE_BRANCH'],'pr':int(os.environ['SOURCE_PR']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'approval_identity':os.environ['APPROVAL_IDENTITY'],'handoff_identity':os.environ['HANDOFF_IDENTITY']},'main':{'original':os.environ['ORIGINAL_MAIN'],'installed':os.environ['PUBLICATION_MAIN'],'canonical':os.environ['canonical'] if 'canonical' in os.environ else None},'product':{'reviewed_commit':os.environ['PRODUCT_COMMIT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'manifest_sha256':os.environ['MANIFEST_SHA256']},'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY'],'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256']},'gates':{'source_review':True,'review_ledgers':True,'product_bundle':True,'self_deleting_tree':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True,'clean_worktree':True},'boundary':{'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          publication['main']['canonical']=os.environ['CANONICAL_COMMIT']
          publication['identity']=hashlib.sha256(json.dumps(publication,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/publication.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CANONICAL_COMMIT=%s\n' "$canonical" >> "$GITHUB_ENV"
          echo "publication_main=$PUBLICATION_MAIN" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical" >> "$GITHUB_OUTPUT"

      - name: Seal exact write handoff
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/handoff/product.tar" "$OUT/handoff/canonical-product.tar"
          cp "$OUT/handoff/file-manifest.json" "$OUT/handoff/canonical-file-manifest.json"
          cp "$OUT/receipt/publication.json" "$OUT/handoff/publication.json"
          find "$OUT/handoff" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/handoff/$rel" | sed "s#  $OUT/handoff/#  #"; done > "$OUT/handoff/SHA256SUMS.pre"
          sha256sum "$OUT/handoff/SHA256SUMS.pre" | sed "s#  $OUT/handoff/#  #" > "$OUT/handoff/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'handoff'; pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PUBLICATION_MAIN"

      - name: Upload exact canonical write handoff
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v1-handoff-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-verify/handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  write:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      PUBLICATION_MAIN: ${{ needs.verify.outputs.publication_main }}
      EXPECTED_CANONICAL: ${{ needs.verify.outputs.canonical_commit }}
      HANDOFF_ID: ${{ needs.verify.outputs.handoff_id }}
      HANDOFF_DIGEST: ${{ needs.verify.outputs.handoff_digest }}
      OUT: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-write
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.HANDOFF_ID }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-write/handoff
          merge-multiple: true

      - name: Rebind exact same-run handoff and create remote Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{api,receipt}
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$HANDOFF_ID" > "$OUT/api/handoff-artifact.json"
          expected_digest="$HANDOFF_DIGEST"
          case "$expected_digest" in sha256:*) ;; *) expected_digest="sha256:$expected_digest" ;; esac
          jq -e --arg digest "$expected_digest" --arg head "$PUBLICATION_MAIN" '.id==(env.HANDOFF_ID|tonumber) and .expired==false and .digest==$digest and .workflow_run.head_sha==$head' "$OUT/api/handoff-artifact.json" >/dev/null
          root="$OUT/handoff"
          pre="$root/SHA256SUMS.pre"; sealed="$root/SHA256SUMS"
          test "$(sha256sum "$pre" | awk '{print $1}')" = "$(awk '{print $1}' "$sealed")"
          while read -r digest name; do test "$(sha256sum "$root/${name#\*}" | awk '{print $1}')" = "$digest"; done < "$pre"
          test "$(sha256sum "$root/canonical-product.tar" | awk '{print $1}')" = "$PRODUCT_TAR_SHA256"
          test "$(sha256sum "$root/canonical-file-manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); handoff=root/'handoff'; sha=lambda data:hashlib.sha256(data).hexdigest()
          publication=json.loads((handoff/'publication.json').read_text()); identity=publication.pop('identity')
          assert sha(json.dumps(publication,sort_keys=True,separators=(',',':')).encode())==identity
          publication['identity']=identity
          assert publication['status']=='cycle-011-rastel-canonical-publication-authorized-v1'
          assert publication['source']['approval_identity']==os.environ['APPROVAL_IDENTITY'] and publication['source']['handoff_identity']==os.environ['HANDOFF_IDENTITY']
          assert publication['main']['original']==os.environ['ORIGINAL_MAIN'] and publication['main']['installed']==os.environ['PUBLICATION_MAIN'] and publication['main']['canonical']==os.environ['EXPECTED_CANONICAL']
          assert publication['product']['tree']==os.environ['PRODUCT_TREE'] and publication['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert publication['cycle']['id']==os.environ['CYCLE_ID']
          assert not any(publication['boundary'].values())
          manifest=json.loads((handoff/'canonical-file-manifest.json').read_text()); rows=manifest['files']
          assert len(rows)==int(os.environ['PRODUCT_PATHS']) and len({row['path'] for row in rows})==len(rows)
          with tarfile.open(handoff/'canonical-product.tar','r:') as archive:
              infos=[info for info in archive.getmembers() if info.isfile()]
              assert len(infos)==len(rows) and {PurePosixPath(info.name).as_posix() for info in infos}=={row['path'] for row in rows}
              by={PurePosixPath(info.name).as_posix():archive.extractfile(info).read() for info in infos}
          remote=[]
          for row in rows:
              path=row['path']; data=by[path]
              assert len(data)==int(row['bytes']) and sha(data)==row['sha256']
              payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'})
              p=root/'blob.json'; p.write_text(payload)
              out=subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input',str(p)],text=True)
              blob=json.loads(out)['sha']
              assert blob==row['blob']
              remote.append({'path':path,'mode':str(row['mode']),'type':'blob','sha':blob})
          remote.append({'path':os.environ['SELF'],'mode':'100644','type':'blob','sha':None})
          base_tree=json.loads(subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits/{os.environ['PUBLICATION_MAIN']}"],text=True))['tree']['sha']
          tree_payload={'base_tree':base_tree,'tree':remote}
          (root/'tree.json').write_text(json.dumps(tree_payload))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/trees",'--input',str(root/'tree.json')],text=True))['sha']
          assert tree==os.environ['PRODUCT_TREE']
          commit_payload={'message':os.environ['COMMIT_MESSAGE'],'tree':tree,'parents':[os.environ['PUBLICATION_MAIN']],'author':{'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']},'committer':{'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']}}
          (root/'commit.json').write_text(json.dumps(commit_payload))
          commit=json.loads(subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits",'--input',str(root/'commit.json')],text=True))['sha']
          assert commit==os.environ['EXPECTED_CANONICAL']
          (root/'canonical.txt').write_text(commit+'\n')
          PY

      - name: Non-forced canonical fast-forward and terminal write receipt
        shell: bash
        run: |
          set -euo pipefail
          canonical="$(cat "$OUT/canonical.txt")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PUBLICATION_MAIN"
          jq -n --arg sha "$canonical" '{sha:$sha,force:false}' > "$OUT/ref.json"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input "$OUT/ref.json" > "$OUT/api/ref-update.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$canonical" --jq '.tree.sha')" = "$PRODUCT_TREE"
          if gh api "/repos/$GITHUB_REPOSITORY/contents/$SELF?ref=$canonical" >/dev/null 2>&1; then
            echo "publisher workflow survived canonical tree" >&2; exit 1
          fi
          ROOT="$OUT" CANONICAL="$canonical" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); receipt={'status':'cycle-011-rastel-canonical-fast-forward-complete-v1','version':1,'publisher_run':int(os.environ['GITHUB_RUN_ID']),'publisher_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'handoff_artifact':int(os.environ['HANDOFF_ID']),'handoff_digest':os.environ['HANDOFF_DIGEST'],'previous_main':os.environ['PUBLICATION_MAIN'],'canonical_main':os.environ['CANONICAL'],'canonical_tree':os.environ['PRODUCT_TREE'],'product_paths':int(os.environ['PRODUCT_PATHS']),'workflow_self_deleted':True,'force_update':False,'cycle_id':os.environ['CYCLE_ID'],'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/canonical-write.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
