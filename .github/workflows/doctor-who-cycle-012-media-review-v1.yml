name: doctor-who-cycle-012-media-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-012-media-review-v1
      SELF: .github/workflows/doctor-who-cycle-012-media-review-v1.yml
      OUT: /tmp/doctor-who-cycle-012-media-review-v1
      CENSUS_PACKET: /tmp/doctor-who-cycle-012-media-review-v1-census
      RETIREMENT_PACKET: /tmp/doctor-who-cycle-012-media-review-v1-retirement
      CENSUS_BRANCH: agent/doctor-who-cycle-012-media-census-v2
      CENSUS_WORKFLOW: doctor-who-cycle-012-media-census-v2
      CENSUS_ARTIFACT_PREFIX: doctor-who-cycle-012-media-census-v2-
      RETIREMENT_ARTIFACT_PREFIX: doctor-who-cycle-012-media-census-v2-retirement-
      PORTRAIT_FILE: /tmp/doctor-who-cycle-012-media-review-v1/review/performer-portrait-candidate.jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind media reviewer and exact census transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$CENSUS_PACKET" "$RETIREMENT_PACKET"
          mkdir -p "$OUT"/{api,census,review,receipt,logs,payload} "$CENSUS_PACKET" "$RETIREMENT_PACKET"
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"; test "$(git show -s --format=%P HEAD)" = "$CARRIER_BASE"; test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = 1; test -z "$(git rev-list --merges "$CARRIER_BASE"..HEAD)"; test "$(git diff --name-status "$CARRIER_BASE"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"; gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$CENSUS_BRANCH" -f per_page=100 > "$OUT/api/census-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'; own=json.loads((api/'carrier.json').read_text()); rows=json.loads((api/'census-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False; assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']; assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['CENSUS_BRANCH'] and row['merged'] is False]; assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]; assert source['state']=='open' and source['draft'] is True and source['merged'] is False; (api/'census-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n'); (api/'census-head.txt').write_text(source['head']['sha']+'\n'); (api/'census-number.txt').write_text(str(source['number'])+'\n')
          PY
          census_head="$(cat "$OUT/api/census-head.txt")"; census_pr="$(cat "$OUT/api/census-number.txt")"; run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$CENSUS_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/census-runs.json"
            run_id="$(CENSUS_HEAD="$census_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/census-runs.json').read_text())['workflow_runs']; rows=[row for row in rows if row['head_sha']==os.environ['CENSUS_HEAD'] and row['name']==os.environ['CENSUS_WORKFLOW']]; rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True); print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/census-run.json"; [ "$(jq -r '.status' "$OUT/api/census-run.json")" = completed ] && break; fi
            sleep 10
          done
          test -n "$run_id"; test "$(jq -r '.status' "$OUT/api/census-run.json")" = completed; test "$(jq -r '.conclusion' "$OUT/api/census-run.json")" = success
          census_attempt="$(jq -r '.run_attempt' "$OUT/api/census-run.json")"; gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/census-jobs.json"; gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/census-artifacts.json"
          inspect_job="$(jq -r '.jobs[] | select(.name=="inspect" and .conclusion=="success") | .id' "$OUT/api/census-jobs.json")"; retire_job="$(jq -r '.jobs[] | select(.name=="retire_evidence" and .conclusion=="success") | .id' "$OUT/api/census-jobs.json")"; test -n "$inspect_job"; test -n "$retire_job"
          CENSUS_RUN="$run_id" CENSUS_ATTEMPT="$census_attempt" python3 - <<'PY' > "$OUT/api/artifact-env"
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/census-artifacts.json').read_text())['artifacts']; run=os.environ['CENSUS_RUN']; attempt=os.environ['CENSUS_ATTEMPT']; expected={'CENSUS_ARTIFACT':os.environ['CENSUS_ARTIFACT_PREFIX']+run+'-attempt-'+attempt,'RETIREMENT_ARTIFACT':os.environ['RETIREMENT_ARTIFACT_PREFIX']+run+'-attempt-'+attempt}
          for key,name in expected.items():
              matches=[row for row in rows if row['name']==name and not row['expired']]; assert len(matches)==1,(key,name,[(row['id'],row['name']) for row in rows]); print(f'{key}={matches[0]["id"]}')
          PY
          source "$OUT/api/artifact-env"
          for label in census retirement; do upper="${label^^}_ARTIFACT"; artifact="${!upper}"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/$label-artifact.json"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/$label.zip"; digest="$(sha256sum "$OUT/$label.zip" | awk '{print $1}')"; test "$(jq -r '.digest' "$OUT/api/$label-artifact.json")" = "sha256:$digest"; printf '%s_ZIP_SHA256=%s\n' "${label^^}" "$digest" >> "$GITHUB_ENV"; done
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCENSUS_PR=%s\nCENSUS_HEAD=%s\nCENSUS_RUN=%s\nCENSUS_ATTEMPT=%s\nINSPECT_JOB=%s\nRETIRE_JOB=%s\nCENSUS_ARTIFACT=%s\nRETIREMENT_ARTIFACT=%s\n' "$pr" "$head" "$census_pr" "$census_head" "$run_id" "$census_attempt" "$inspect_job" "$retire_job" "$CENSUS_ARTIFACT" "$RETIREMENT_ARTIFACT" >> "$GITHUB_ENV"

      - name: Authenticate exact media census and retirement artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          def extract(name,target):
              target=Path(target)
              with zipfile.ZipFile(root/(name+'.zip')) as archive:
                  infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir():continue
                      out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          extract('census',os.environ['CENSUS_PACKET']); extract('retirement',os.environ['RETIREMENT_PACKET'])
          def verify(target):
              target=Path(target); rows=[]
              for sealed in target.rglob('SHA256SUMS'):
                  pre=sealed.with_name('SHA256SUMS.pre')
                  if not pre.is_file():continue
                  assert sha(pre.read_bytes())==sealed.read_text().split()[0]; base=sealed.parent; count=0
                  for raw in pre.read_text().splitlines():
                      if not raw.strip():continue
                      digest,name=raw.split(None,1); path=base/name.lstrip('*'); assert path.is_file() and sha(path.read_bytes())==digest; count+=1
                  rows.append({'root':base.relative_to(target).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
              assert rows; return rows
          census_ledgers=verify(os.environ['CENSUS_PACKET']); retirement_ledgers=verify(os.environ['RETIREMENT_PACKET'])
          def one_status(target,status):
              rows=[]
              for path in Path(target).rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows]); return rows[0]
          _,census=one_status(os.environ['CENSUS_PACKET'],'cycle-012-doctor-who-media-census-complete-v1'); _,retirement=one_status(os.environ['RETIREMENT_PACKET'],'cycle-012-evidence-carrier-retired-after-media-census-v1')
          for data in (census,retirement):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          assert retirement['media']['identity']==census['identity'] and retirement['media']['task_id']==census['task']['id']; assert retirement['canonical_main']==census['canonical_main']; assert all(census['gates'].values())
          assert census['boundary']=={'media_census_only':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'wall_created':False,'source_image_adopted':False,'performer_portrait_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}; assert retirement['boundary']=={'evidence_carrier_retired':True,'media_carrier_retained':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'cycle_012_product_authority':False}
          source_root=Path(os.environ['CENSUS_PACKET']); required=['portraits/inventory.json','source/census.json','receipt/evidence-custody.json']; copied={}
          for rel in required:
              rows=[p for p in source_root.rglob(rel) if p.is_file()]; assert len(rows)==1,(rel,[p.as_posix() for p in rows]); copied[rel]=rows[0]; dst=root/'census'/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(rows[0].read_bytes())
          optional=['source/source-image-candidate','source/imageinfo-normalized.json','source/imageinfo.json']
          for rel in optional:
              rows=[p for p in source_root.rglob(rel) if p.is_file()]; assert len(rows)<=1,(rel,[p.as_posix() for p in rows])
              if rows:dst=root/'census'/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(rows[0].read_bytes())
          (root/'census/media-census.json').write_text(json.dumps(census,indent=2,sort_keys=True,ensure_ascii=False)+'\n'); (root/'census/retirement.json').write_text(json.dumps(retirement,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-012-media-census-authenticated-for-independent-review-v1','version':1,'census':{'pr':int(os.environ['CENSUS_PR']),'head':os.environ['CENSUS_HEAD'],'run':int(os.environ['CENSUS_RUN']),'attempt':int(os.environ['CENSUS_ATTEMPT']),'inspect_job':int(os.environ['INSPECT_JOB']),'retire_job':int(os.environ['RETIRE_JOB']),'artifact':int(os.environ['CENSUS_ARTIFACT']),'artifact_sha256':os.environ['CENSUS_ZIP_SHA256'],'identity':census['identity'],'retirement_artifact':int(os.environ['RETIREMENT_ARTIFACT']),'retirement_artifact_sha256':os.environ['RETIREMENT_ZIP_SHA256'],'retirement_identity':retirement['identity']},'canonical_main':census['canonical_main'],'task':census['task'],'census_ledgers':census_ledgers,'retirement_ledgers':retirement_ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()); (root/'receipt/census-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          canonical="$(jq -r '.canonical_main' "$OUT/census/media-census.json")"; printf 'CANONICAL_MAIN=%s\n' "$canonical" >> "$GITHUB_ENV"

      - name: Rehydrate canonical state and rerun complete gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"; npm ci; npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"; node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"; node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"; node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"; jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"; node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"; grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"; node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"; jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"; grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null; test -z "$(git status --porcelain)"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Independently disposition character-image evidence and select lawful portrait source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['OUT']); census=json.loads((root/'census/media-census.json').read_text()); inventory=json.loads((root/'census/portraits/inventory.json').read_text()); canonical={row['sha256'] for row in inventory['canonical_images']}; sha=lambda data:hashlib.sha256(data).hexdigest()
          field=census['source_media']; source_file=root/'census/source/source-image-candidate'; character={'status':'absent','rationale':'The exact revision supplies no admissible infobox image.','adopted':False}
          if field['image_field_status']=='candidate':
              assert source_file.is_file() and field['source_image_candidate'] is not None
              digest=sha(source_file.read_bytes()); assert digest==field['source_image_candidate']['sha256']
              collision=digest in canonical
              if collision:character={'status':'refused-canonical-byte-collision','candidate_sha256':digest,'candidate_bytes':source_file.stat().st_size,'source_title':field['source_image_candidate']['title'],'rationale':'The exact revision field names an image, but its bytes already exist in the canonical image estate and cannot be reused cross-card.','adopted':False}
              else:
                  target=root/'review/character-image-candidate'; target.write_bytes(source_file.read_bytes()); character={'status':'exact-revision-field-candidate-verified','artifact':'review/character-image-candidate','candidate_sha256':digest,'candidate_bytes':target.stat().st_size,'source_title':field['source_image_candidate']['title'],'mime':field['source_image_candidate']['mime'],'width':field['source_image_candidate']['width'],'height':field['source_image_candidate']['height'],'canonical_image_collision':False,'rationale':'The immutable character-page revision directly names this image in its infobox field.','adopted':False}
          elif field['image_field_status']=='refused-template-or-placeholder':character={'status':'absent','rationale':'The revision image field is a template, placeholder, or explicit non-image value and is refused.','adopted':False}
          licensed=[]
          for row in inventory['portraits']:
              license_text=str(row.get('license') or '').casefold(); origin=row.get('origin'); author=row.get('author')
              if origin and author and any(token in license_text for token in ('cc by','creative commons','public domain','cc0')):licensed.append(row)
          licensed.sort(key=lambda row:(row['src'],row['sha256']))
          portrait_source=licensed[0] if licensed else None
          decision={'character':character,'portrait_source':portrait_source,'canonical_image_digests':sorted(canonical),'portrait_status':'source-selected' if portrait_source else 'absent','portrait_adopted':False}
          (root/'review/decision-preimage.json').write_text(json.dumps(decision,indent=2,sort_keys=True,ensure_ascii=False)+'\n'); (root/'review/portrait-source.txt').write_text((portrait_source['src'] if portrait_source else '')+'\n')
          PY
          source_portrait="$(cat "$OUT/review/portrait-source.txt")"
          if [ -n "$source_portrait" ]; then
            test -f "$source_portrait"
            expected="$(jq -r '.portrait_source.sha256' "$OUT/review/decision-preimage.json")"
            test "$(sha256sum "$source_portrait" | awk '{print $1}')" = "$expected"
            SOURCE_PORTRAIT="$source_portrait" node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const {chromium}=require('playwright');
          (async()=>{
            const source=fs.readFileSync(process.env.SOURCE_PORTRAIT);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:900,height:900}});
            const result=await page.evaluate(async ({b64})=>{
              const img=new Image(); img.src='data:image/jpeg;base64,'+b64; await img.decode();
              const iw=img.naturalWidth, ih=img.naturalHeight, ratio=420/600;
              let sw,sh;
              if(iw/ih>=ratio){sh=Math.floor(ih*0.94);sw=Math.floor(sh*ratio);if(sw>iw*0.96){sw=Math.floor(iw*0.96);sh=Math.floor(sw/ratio)}}
              else{sw=Math.floor(iw*0.94);sh=Math.floor(sw/ratio);if(sh>ih*0.96){sh=Math.floor(ih*0.96);sw=Math.floor(sh*ratio)}}
              const sx=Math.max(0,Math.min(iw-sw,Math.round((iw-sw)*0.5))); const sy=Math.max(0,Math.min(ih-sh,Math.round((ih-sh)*0.18)));
              const canvas=document.createElement('canvas');canvas.width=420;canvas.height=600;const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,sx,sy,sw,sh,0,0,420,600);
              return {url:canvas.toDataURL('image/jpeg',0.92),source:{width:iw,height:ih},crop:{x:sx,y:sy,width:sw,height:sh},target:{width:420,height:600},quality:0.92};
            },{b64:source.toString('base64')});
            await browser.close(); const bytes=Buffer.from(result.url.split(',')[1],'base64'); fs.mkdirSync(path.dirname(process.env.PORTRAIT_FILE),{recursive:true});fs.writeFileSync(process.env.PORTRAIT_FILE,bytes);delete result.url;fs.writeFileSync(path.join(process.env.OUT,'review','portrait-crop.json'),JSON.stringify(result,null,2)+'\n');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
            test -s "$PORTRAIT_FILE"; test "$(wc -c < "$PORTRAIT_FILE" | tr -d ' ')" -gt 10000
          fi

      - name: Verify candidate collisions and seal independent media review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest(); census=json.loads((root/'census/media-census.json').read_text()); pre=json.loads((root/'review/decision-preimage.json').read_text()); custody=json.loads((root/'receipt/census-custody.json').read_text()); autopilot=json.loads((root/'receipt/autopilot-status.json').read_text()); waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          portrait_file=Path(os.environ['PORTRAIT_FILE']); portrait=None
          if pre['portrait_source']:
              assert portrait_file.is_file(); digest=sha(portrait_file.read_bytes()); assert digest!=pre['portrait_source']['sha256']; assert digest not in set(pre['canonical_image_digests']); crop=json.loads((root/'review/portrait-crop.json').read_text()); portrait={'status':'byte-distinct-candidate-verified','artifact':'review/performer-portrait-candidate.jpg','candidate_sha256':digest,'candidate_bytes':portrait_file.stat().st_size,'target_dimensions':crop['target'],'source':pre['portrait_source'],'crop':crop['crop'],'jpeg_quality':crop['quality'],'canonical_image_collision':False,'adopted':False}
          else:portrait={'status':'absent','rationale':'No canonical portrait with explicit reusable licensing metadata was available.','adopted':False}
          character=pre['character']
          receipt={'status':'cycle-012-doctor-who-media-independently-adjudicated-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'carrier_base':os.environ['CARRIER_BASE']},'census':custody['census'],'census_custody_identity':custody['identity'],'canonical_main':census['canonical_main'],'task':census['task'],'character_image':character,'performer_portrait':portrait,'official_link_candidates':census['source_media']['official_link_candidates'],'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'gates':{'census_artifact':True,'evidence_retirement':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True,'character_disposition':True,'portrait_source_license_boundary':True,'portrait_byte_distinct':portrait['status']=='absent' or portrait['canonical_image_collision'] is False},'boundary':{'media_review_only':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'wall_created':False,'character_image_adopted':False,'performer_portrait_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()); (root/'payload/media-review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          for name in ('review/decision-preimage.json','receipt/census-custody.json'):
              src=root/name; dst=root/'payload'/name; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(src.read_bytes())
          for name in ('review/character-image-candidate','review/performer-portrait-candidate.jpg','review/portrait-crop.json'):
              src=root/name
              if src.is_file():dst=root/'payload'/name; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(src.read_bytes())
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"; sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-media-review-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-review-v1
            /tmp/doctor-who-cycle-012-media-review-v1-census
            /tmp/doctor-who-cycle-012-media-review-v1-retirement
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire_census:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET: /tmp/doctor-who-cycle-012-media-review-v1-retire-input
      OUT: /tmp/doctor-who-cycle-012-media-review-v1-retire-result
      REVIEW_NAME: doctor-who-cycle-012-media-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      CENSUS_BRANCH: agent/doctor-who-cycle-012-media-census-v2
      REVIEW_BRANCH: agent/doctor-who-cycle-012-media-review-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate media review and retire exact census carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"; mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}; artifact=''
          for attempt in $(seq 1 60); do gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"; artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']; rows=[row for row in rows if row['name']==os.environ['REVIEW_NAME'] and not row['expired']]; print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"; [ -n "$artifact" ] && break; sleep 2; done
          test -n "$artifact"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/review-artifact.json"; gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/review.zip"; zip_sha="$(sha256sum "$OUT/review.zip" | awk '{print $1}')"; test "$(jq -r '.digest' "$OUT/api/review-artifact.json")" = "sha256:$zip_sha"
          REVIEW_ARTIFACT="$artifact" REVIEW_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'review.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():digest,name=raw.split(None,1); path=packet/name.lstrip('*'); assert path.is_file() and sha(path.read_bytes())==digest
          receipt=json.loads((packet/'media-review.json').read_text()); identity=receipt.pop('identity'); assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; receipt['identity']=identity
          assert receipt['status']=='cycle-012-doctor-who-media-independently-adjudicated-v1' and all(receipt['gates'].values()); assert receipt['boundary']=={'media_review_only':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'wall_created':False,'character_image_adopted':False,'performer_portrait_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}; (out/'receipt/review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          census_pr="$(jq -r '.census.pr' "$OUT/receipt/review.json")"; census_head="$(jq -r '.census.head' "$OUT/receipt/review.json")"; canonical="$(jq -r '.canonical_main' "$OUT/receipt/review.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$census_pr" > "$OUT/api/census-pr-before.json"; test "$(jq -r '.state' "$OUT/api/census-pr-before.json")" = open; test "$(jq -r '.merged' "$OUT/api/census-pr-before.json")" = false; test "$(jq -r '.head.ref' "$OUT/api/census-pr-before.json")" = "$CENSUS_BRANCH"; test "$(jq -r '.head.sha' "$OUT/api/census-pr-before.json")" = "$census_head"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CENSUS_BRANCH" --jq '.object.sha')" = "$census_head"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$census_pr" -f state=closed > "$OUT/api/census-pr-close.json"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CENSUS_BRANCH" --jq '.object.sha')" = "$census_head"; gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$CENSUS_BRANCH"; if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CENSUS_BRANCH" > /dev/null 2>&1; then exit 1; fi
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$census_pr" > "$OUT/api/census-pr-after.json"; test "$(jq -r '.state' "$OUT/api/census-pr-after.json")" = closed; test "$(jq -r '.merged' "$OUT/api/census-pr-after.json")" = false; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$REVIEW_BRANCH" --jq '.object.sha')" = "${{ github.event.pull_request.head.sha }}"
          printf 'REVIEW_ARTIFACT=%s\nREVIEW_ZIP_SHA256=%s\nCENSUS_PR=%s\nCENSUS_HEAD=%s\nCANONICAL_MAIN=%s\n' "$artifact" "$zip_sha" "$census_pr" "$census_head" "$canonical" >> "$GITHUB_ENV"

      - name: Seal census-carrier retirement receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); review=json.loads((root/'receipt/review.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest(); receipt={'status':'cycle-012-media-census-carrier-retired-after-review-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'review':{'artifact':int(os.environ['REVIEW_ARTIFACT']),'artifact_sha256':os.environ['REVIEW_ZIP_SHA256'],'identity':review['identity'],'task_id':review['task']['id']},'census':{'pr':int(os.environ['CENSUS_PR']),'head':os.environ['CENSUS_HEAD'],'branch':os.environ['CENSUS_BRANCH'],'state':'closed','ref':'absent'},'canonical_main':os.environ['CANONICAL_MAIN'],'retained_review_branch':os.environ['REVIEW_BRANCH'],'boundary':{'census_carrier_retired':True,'review_carrier_retained':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'cycle_012_product_authority':False}}; receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()); (root/'receipt/retirement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"; sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v1-retirement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-media-review-v1-retire-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v1-retirement-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-review-v1-retire-input
            /tmp/doctor-who-cycle-012-media-review-v1-retire-result
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
