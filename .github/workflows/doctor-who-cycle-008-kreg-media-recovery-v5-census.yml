name: doctor-who-cycle-008-kreg-media-recovery-v5-census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery-v5-census.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery-v5-census-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v5-census.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v5-census
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery-v5-census

  V4_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v4-census
  V4_HEAD: af1211dc0cb48a6d0b98662196ceebb0807ae344
  V4_PATH: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v4-census.yml
  V4_BLOB: 49941b4360ba07cb5b9adc5a2e4e223c6f45f83e
  V4_RUN: "31092600523"
  V4_JOB: "92586886278"
  V4_ARTIFACT_ID: "8964088254"
  V4_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v4-census-31092600523
  V4_ARTIFACT_SHA256: 6d22dba6a0f6e48f9255d0c5bc09fdf53b1e9a797512c7551f7f2c1963f0475f

  TASK_ID: ap_469d79ea29fd7f877395d20f
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_PARENT_REVISION: "3189022"
  SOURCE_TIMESTAMP: 2026-07-28T09:20:48Z

  FILE_TITLE: File:Kree.jpg
  FILE_PAGE_ID: "387498"
  FILE_TIMESTAMP: 2026-07-28T09:19:09Z
  UPLOAD_BYTES: "67431"
  UPLOAD_WIDTH: "1053"
  UPLOAD_HEIGHT: "805"
  UPLOAD_SHA1: 319cfa66634da164e2efd998cb85702fb609a83e
  PUBLIC_JPEG_BYTES: "67113"
  PUBLIC_JPEG_SHA1: 650069b8a22e7794b00ae6a2d8d32952e6a72ff2
  PUBLIC_JPEG_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  DEFAULT_WEBP_BYTES: "32034"
  DEFAULT_WEBP_SHA1: 686cc98189739cf6770b4e1cca62ba73783872bc
  DEFAULT_WEBP_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  GH_TOKEN: ${{ github.token }}

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v5-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v5-census.yml
            data
            images
            scripts

      - name: Bind exact one-path carrier and exact V4 source program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/program" "$OUT/v4-artifact" "$OUT/attempts"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}" \
            "+refs/heads/${V4_BRANCH}:refs/remotes/origin/${V4_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/${V4_BRANCH})" = "$V4_HEAD"
          test "$(git show -s --format=%P "$V4_HEAD")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$V4_HEAD")" = "1"
          test "$(git merge-base "$EXACT_MAIN" "$V4_HEAD")" = "$EXACT_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          printf '%s\n' "$V4_PATH" > "$OUT/expected-v4-paths.txt"
          git diff --name-only "$EXACT_MAIN"..."$V4_HEAD" | LC_ALL=C sort > "$OUT/actual-v4-paths.txt"
          diff -u "$OUT/expected-v4-paths.txt" "$OUT/actual-v4-paths.txt"
          test "$(git rev-parse "$V4_HEAD:$V4_PATH")" = "$V4_BLOB"
          git show "$V4_HEAD:$V4_PATH" > "$OUT/v4-source.yml"
          git hash-object "$OUT/v4-source.yml" | grep -Fx "$V4_BLOB"
          git checkout --detach "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Install deterministic route and image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick file >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"
          curl --version | head -1 | tee "$OUT/curl-version.txt"

      - name: Bind exact paid V4 failure and immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V4_RUN}" > "$OUT/v4-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V4_RUN}/jobs?per_page=100" > "$OUT/v4-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V4_ARTIFACT_ID}" > "$OUT/v4-artifact.json"
          jq -e --argjson run "$V4_RUN" --arg head "$V4_HEAD" --arg branch "$V4_BRANCH" '
            .id==$run and .head_sha==$head and .head_branch==$branch and
            .status=="completed" and .conclusion=="failure" and .event=="pull_request"
          ' "$OUT/v4-run.json" >/dev/null
          jq -e --argjson job "$V4_JOB" '
            any(.jobs[];
              .id==$job and .name=="census" and .status=="completed" and .conclusion=="failure" and
              any(.steps[]; .name=="Bind exact main and one-file read-only census carrier" and .conclusion=="success") and
              any(.steps[]; .name=="Bind exact preflight and paid V2/V3 failures" and .conclusion=="success") and
              any(.steps[]; .name=="Reacquire exact Kreg source and file metadata" and .conclusion=="failure")
            )
          ' "$OUT/v4-jobs.json" >/dev/null
          jq -e --argjson id "$V4_ARTIFACT_ID" --arg name "$V4_ARTIFACT_NAME" --arg digest "sha256:${V4_ARTIFACT_SHA256}" --argjson run "$V4_RUN" --arg head "$V4_HEAD" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and
            .workflow_run.id==$run and .workflow_run.head_sha==$head
          ' "$OUT/v4-artifact.json" >/dev/null

      - name: Download exact paid V4 packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V4_ARTIFACT_NAME }}
          path: ${{ env.OUT }}/v4-artifact
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.V4_RUN }}

      - name: Derive the corrected V5 program from the exact V4 Git blob
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/v4-artifact/kreg-page-api.json"
          test -f "$OUT/v4-artifact/kreg-page.wikitext"
          test "$(wc -c < "$OUT/v4-artifact/kreg-page.wikitext")" = "840"
          test "$(sha256sum "$OUT/v4-artifact/kreg-page.wikitext" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"
          jq -e --argjson pageid "$SOURCE_PAGE_ID" --argjson revision "$SOURCE_REVISION" --argjson parent "$SOURCE_PARENT_REVISION" --arg timestamp "$SOURCE_TIMESTAMP" '
            .query.pages as $pages |
            $pages[0].revisions[0] as $rev |
            (($pages|length)==1 and $pages[0].pageid==$pageid and $pages[0].title=="Kreg" and
             ($pages[0].revisions|length)==1 and $rev.revid==$revision and
             $rev.parentid==$parent and $rev.timestamp==$timestamp)
          ' "$OUT/v4-artifact/kreg-page-api.json" >/dev/null

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const source = fs.readFileSync(`${out}/v4-source.yml`, 'utf8');
          const lines = source.split('\n');
          const wanted = [
            ['reacquire.sh', 'Reacquire exact Kreg source and file metadata'],
            ['census.sh', 'Execute bounded 18-route by 3-header census'],
            ['file-page.sh', 'Recover file-page evidence without inventing unavailable content'],
            ['quality.sh', 'Refuse duplicate adoption and project exact-still quality'],
            ['boundary.sh', 'Record strict no-write boundary and rebind live main']
          ];
          const extract = (name) => {
            const marker = `      - name: ${name}`;
            const start = lines.indexOf(marker);
            if (start < 0) throw new Error(`missing step marker: ${name}`);
            let run = -1;
            for (let i = start + 1; i < lines.length; i += 1) {
              if (lines[i] === '        run: |') { run = i; break; }
              if (lines[i].startsWith('      - ')) break;
            }
            if (run < 0) throw new Error(`missing run block: ${name}`);
            let end = lines.length;
            for (let i = run + 1; i < lines.length; i += 1) {
              if (lines[i].startsWith('      - name: ') || lines[i].startsWith('      - uses: ')) { end = i; break; }
            }
            return `${lines.slice(run + 1, end).map((line) => line.startsWith('          ') ? line.slice(10) : line).join('\n').replace(/\s+$/, '')}\n`;
          };

          const badSource = `.query.pages|length==1 and .[0].pageid==$pageid and .[0].title=="Kreg" and\n              .[0].revisions|length==1 and .[0].revid==$revision and .[0].parentid==$parent and .[0].timestamp==$timestamp`;
          const goodSource = `.query.pages as $pages |\n              $pages[0].revisions[0] as $rev |\n              (($pages|length)==1 and $pages[0].pageid==$pageid and $pages[0].title=="Kreg" and\n               ($pages[0].revisions|length)==1 and $rev.revid==$revision and\n               $rev.parentid==$parent and $rev.timestamp==$timestamp)`;
          const badImage = `.query.pages|length==1 and .[0].title==$title and .[0].pageid==$pageid and\n              .[0].imageinfo|length==1 and .[0].timestamp==$timestamp and\n              .[0].size==$size and .[0].width==$width and .[0].height==$height and\n              .[0].sha1==$sha1 and .[0].mime=="image/jpeg" and .[0].mediatype=="BITMAP"`;
          const goodImage = `.query.pages as $pages |\n              $pages[0].imageinfo[0] as $ii |\n              (($pages|length)==1 and $pages[0].title==$title and $pages[0].pageid==$pageid and\n               ($pages[0].imageinfo|length)==1 and $ii.timestamp==$timestamp and\n               $ii.size==$size and $ii.width==$width and $ii.height==$height and\n               $ii.sha1==$sha1 and $ii.mime=="image/jpeg" and $ii.mediatype=="BITMAP")`;

          const manifest = {};
          for (const [file, name] of wanted) {
            let body = extract(name);
            if (file === 'reacquire.sh') {
              if (!body.includes(badSource) || !body.includes(badImage)) throw new Error('V4 jq defect signatures drifted');
              body = body.replace(badSource, goodSource).replace(badImage, goodImage);
              if (body.includes('.query.pages|length==1')) throw new Error('unpaid jq precedence defect remains');
            }
            body = body.replaceAll('route census/4.0', 'route census/5.0');
            if (file === 'boundary.sh') body = body.replace('version:4,', 'version:5,');
            fs.writeFileSync(`${out}/program/${file}`, body, {mode: 0o755});
            manifest[file] = {
              step: name,
              sha256: crypto.createHash('sha256').update(body).digest('hex'),
              bytes: Buffer.byteLength(body)
            };
          }
          fs.writeFileSync(`${out}/program-manifest.json`, `${JSON.stringify({source_blob:process.env.V4_BLOB, files:manifest}, null, 2)}\n`);
          NODE
          test "$(jq '.files|length' "$OUT/program-manifest.json")" = "5"
          sha256sum "$OUT/v4-source.yml" "$OUT/program"/*.sh "$OUT/program-manifest.json" > "$OUT/program-sha256.txt"

      - name: Execute the corrected bounded route-census program
        shell: bash
        run: |
          set -euo pipefail
          for script in reacquire.sh census.sh file-page.sh quality.sh boundary.sh; do
            bash "$OUT/program/$script"
          done
          test "$(jq -r '.route_count' "$OUT/route-census-summary.json")" = "18"
          test "$(jq -r '.attempt_count' "$OUT/route-census-summary.json")" = "54"
          test "$(jq -r '.public_original_representation.sha256' "$OUT/route-census-summary.json")" = "$PUBLIC_JPEG_SHA256"
          test "$(jq -r '.default_derivative.sha256' "$OUT/route-census-summary.json")" = "$DEFAULT_WEBP_SHA256"
          test "$(jq -r '.visual_review_completed' "$OUT/boundary.json")" = "false"
          test "$(jq -r '.lease_issued' "$OUT/boundary.json")" = "false"
          test "$(jq -r '.queue_mutated' "$OUT/boundary.json")" = "false"

      - name: Seal self-hashed V5 route-census receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="census") | .id' | head -1)"
          test -n "$job_id"
          verdict="$(jq -r '.verdict' "$OUT/route-census-summary.json")"
          exact="$(jq -r '.exact_upload_identity_recovered' "$OUT/route-census-summary.json")"
          route_count="$(jq -r '.route_count' "$OUT/route-census-summary.json")"
          attempt_count="$(jq -r '.attempt_count' "$OUT/route-census-summary.json")"
          successful_attempts="$(jq -r '.successful_attempts' "$OUT/route-census-summary.json")"
          public_count="$(jq -r '.public_original_representation.count' "$OUT/route-census-summary.json")"
          identity_count="$(jq -r '.distinct_successful_image_identities|length' "$OUT/route-census-summary.json")"
          program_sha="$(sha256sum "$OUT/program-manifest.json" | awk '{print $1}')"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V5-CENSUS" \
            --arg verdict "$verdict" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --arg task "$TASK_ID" \
            --arg v4_head "$V4_HEAD" \
            --arg v4_blob "$V4_BLOB" \
            --arg program_sha "$program_sha" \
            --arg public_sha256 "$PUBLIC_JPEG_SHA256" \
            --argjson exact_upload_identity_recovered "$exact" \
            --argjson route_count "$route_count" \
            --argjson attempt_count "$attempt_count" \
            --argjson successful_attempts "$successful_attempts" \
            --argjson public_representation_routes "$public_count" \
            --argjson distinct_image_identities "$identity_count" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            --argjson v4_run "$V4_RUN" \
            --argjson v4_artifact "$V4_ARTIFACT_ID" '
            {
              schema_version:1,
              transaction:$transaction,
              verdict:$verdict,
              exact_main:$main,
              carrier_head:$carrier,
              task_id:$task,
              route_count:$route_count,
              header_profiles:3,
              attempt_count:$attempt_count,
              successful_attempts:$successful_attempts,
              public_representation_routes:$public_representation_routes,
              distinct_image_identities:$distinct_image_identities,
              exact_upload_identity_recovered:$exact_upload_identity_recovered,
              public_original_sha256:$public_sha256,
              run_id:$run,
              job_id:$job,
              paid_v4:{run_id:$v4_run,artifact_id:$v4_artifact,head:$v4_head,source_blob:$v4_blob,reason:"jq pipe precedence converted the page array to a boolean before the length assertion"},
              corrected_program_manifest_sha256:$program_sha,
              checks:{
                exact_v4_git_blob_bound:true,
                paid_v4_artifact_bound:true,
                jq_precedence_defect_removed:true,
                exact_source_identity_reacquired:true,
                upload_metadata_pinned:true,
                bounded_route_header_matrix_completed:true,
                public_original_representation_converged:true,
                default_webp_derivative_reproduced:true,
                file_page_unavailability_preserved:true,
                duplicate_adoption_refused:true,
                quality_paths_projected:true,
                live_main_rebound:true
              },
              boundary:{
                repository_written:false,
                visual_adjudication_completed:false,
                lease_issued:false,
                queue_mutated:false,
                media_adopted:false,
                cycle_receipt_written:false,
                product_published:false,
                outside_human_dependency:false
              }
            }' > "$OUT/recovery-receipt.json"
          sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}' > "$OUT/recovery-receipt.sha256"
          test "$(sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}')" = "$(cat "$OUT/recovery-receipt.sha256")"

      - name: Upload exact Kreg V5 bounded route-census packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-v5-census-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
