name: star-trek-henoch-stage-recovery-v3

on:
  push:
    branches:
      - agent/star-trek-henoch-stage-recovery-v3

permissions:
  contents: write

concurrency:
  group: star-trek-henoch-stage-recovery-v3
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 28ea3efc9f71d6207794d45cc654af765b36c63e
  EXPECTED_TREE: 52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c
  LIVE_MAIN: 4b8902421380d900d2423cf5bc1fd8d5bf0c690e
  LIVE_TREE: e3e1267f0a4fee129d3cc51c0ca3ffe9d3b213bb
  LIVE_PARENT: 28ea3efc9f71d6207794d45cc654af765b36c63e
  LIVE_MESSAGE: "Media search: record rolling candidate attempt (2026-08-28)"
  CLAIM_BRANCH: agent/star-trek-henoch-claim-result-v1
  CLAIM_COMMIT: d1039f1e3cb263d7be47b63cba05eca9f0cf24b8
  CLAIM_TREE: affc7614a284b8b8acfdeb8b14871fdd135a6f46
  CLAIM_RECEIPT_SHA: 3f86f82e287de56e401dd754b846fab4e0d60618931e24e129885e689fc44b05
  SOURCE_REVIEW_BRANCH: agent/star-trek-henoch-source-review-result-v1
  SOURCE_REVIEW_COMMIT: 2cd2eed247100333ade4d57970b101e21a221dd2
  SOURCE_REVIEW_TREE: 9e856251cc3e52d0c46869883f09e2313bdbac71
  SOURCE_REVIEW_SHA: 3439ccbfa7f4bab3ff6b543f935a9e0847033fbf3e789a6a521b2aa62fdf0876
  SOURCE_REVIEW_PATH: transport/star-trek-henoch-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-henoch-media-result-v1
  MEDIA_COMMIT: 9df7b9fd1f037bf371b4dec4fdd078abfbf3fc01
  MEDIA_TREE: 2cc003961a661d79424c5df6efb4878981a4fd30
  MEDIA_PREFIX: transport/star-trek-henoch-media-v1
  MEDIA_RECEIPT_SHA: 9f5700b00cd63355fff4aa0a4575f65f9309b6d7a142c3025af3766e1f3140e2
  MEDIA_REVIEW_BRANCH: agent/star-trek-henoch-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 9cc98185a6ba2696c2cbebb93398b10a67666925
  MEDIA_REVIEW_TREE: 0cf747c8500ea716647979c92c2ccaf70492239c
  MEDIA_REVIEW_SHA: 4fb578a66056a9206a3a24f30f0f45ff60926efe95ac842c6f156537f3683e2f
  MEDIA_REVIEW_PATH: transport/star-trek-henoch-media-review-v1/media-review.json
  TASK_ID: ap_3d10b7a97efdbdd11c50bc2a
  EXPECTED_PERFORMER: Leonard Nimoy
  EXPECTED_CHARACTER: Henoch
  EXPECTED_FINGERPRINT: 53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839
  EXPECTED_LEASE: lease_7495c4d823c439f1ae201c13
  WALL_ID: UC-1400
  EXPECTED_STILL_SHA: edbea99891daa786d65e3953ae591784f84b35593bab9420841addd81f57bbd6
  EXPECTED_PORTRAIT_SHA: 218703a31a24aa234d4a43da44c911b138acf4ca31897a8a6b3a029d7dc7dddf
  STILL_ITEM_ID: ma_eafe8a72e74325fb6632c097
  PORTRAIT_ITEM_ID: ma_afc31673cac70a0a8bb440ca
  AUDIT_STILL_ITEM_ID: ma_dc12cbaf54676b1f200c6d32
  AUDIT_PORTRAIT_ITEM_ID: ma_4fed6a7d79e71c3e52f1fff9
  CANDIDATE_BRANCH: agent/star-trek-henoch-candidate-v1
  RESULT_BRANCH: agent/star-trek-henoch-stage-result-v3
  SOURCE_STAGE_COMMIT: afcca3241f1ff3cf9f58d5c9b36c52f5b0c24aa0
  SOURCE_STAGE_TREE: b32f32f9412a1502f728e4599543fd408a55095c
  PAYLOAD_PATH: .github/recovery/star-trek-henoch-stage-recovery-v2/runtime.tar.gz.b64
  PAYLOAD_SHA256: 05afaebd6d6bbe04e14a8b39fecb9a82ba83f313d7bc3b9bf995eb77d3483217
  PAYLOAD_ROOT: /tmp/star-trek-henoch-stage-v3-runtime
  LIFECYCLE: /tmp/star-trek-henoch-stage-v3.py
  BATCH: /tmp/star-trek-henoch-stage-v3-batch.json
  CENSUS_HELPER: /tmp/star-trek-henoch-stage-v3-census.sh
  STEPS_ROOT: /tmp/star-trek-henoch-stage-v3-steps
  SOURCE_REVIEW_ROOT: /tmp/star-trek-henoch-stage-v3/source-review
  MEDIA_ROOT: /tmp/star-trek-henoch-stage-v3/media
  MEDIA_REVIEW_ROOT: /tmp/star-trek-henoch-stage-v3/media-review
  PATCH_ROOT: /tmp/star-trek-henoch-stage-v3-patch
  OUT: /tmp/star-trek-henoch-stage-v3/output
  CENSUS_MAX_ATTEMPTS: 3
  CENSUS_RETRY_DELAY_SECONDS: 12

jobs:
  stage:
    name: stage-reviewed-henoch-candidate-v3
    if: ${{ github.event.head_commit.message == 'Stage reviewed Star Trek Henoch candidate v3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and patch the exact v2 stage runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PAYLOAD_ROOT" "$STEPS_ROOT" "$PATCH_ROOT"
          mkdir -p "$PAYLOAD_ROOT" "$STEPS_ROOT" "$PATCH_ROOT"
          git fetch --no-tags --depth=1 origin "$SOURCE_STAGE_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_STAGE_COMMIT")" = "$SOURCE_STAGE_TREE"
          git show "$SOURCE_STAGE_COMMIT:$PAYLOAD_PATH" > /tmp/star-trek-henoch-stage-v3-runtime.tar.gz.b64
          tr -d '\n' < /tmp/star-trek-henoch-stage-v3-runtime.tar.gz.b64 | base64 -d > /tmp/star-trek-henoch-stage-v3-runtime.tar.gz
          test "$(sha256sum /tmp/star-trek-henoch-stage-v3-runtime.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/star-trek-henoch-stage-v3-runtime.tar.gz -C "$PAYLOAD_ROOT"
          (cd "$PAYLOAD_ROOT" && sha256sum -c payload-manifest.sha256)
          cp "$PAYLOAD_ROOT/candidate-lifecycle.py" "$LIFECYCLE"
          cp "$PAYLOAD_ROOT/batch.json" "$BATCH"
          cp "$PAYLOAD_ROOT/census-refresh.sh" "$CENSUS_HELPER"
          cp "$PAYLOAD_ROOT/steps"/[0-9][0-9].sh "$STEPS_ROOT"/
          chmod +x "$LIFECYCLE" "$CENSUS_HELPER" "$STEPS_ROOT"/[0-9][0-9].sh

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import difflib, hashlib, json, os

          step = Path(os.environ["STEPS_ROOT"]) / "03.sh"
          original = step.read_text(encoding="utf-8")
          anchor = 'npm run media:audit -- resolve --input "$OUT/media-audit-resolution.json" | tee "$OUT/media-resolve.log"'
          inserted = '''python3 - <<'PY2'
          from pathlib import Path
          import hashlib, json, os

          state = json.loads(Path("data/MEDIA-AUDIT.json").read_text(encoding="utf-8"))
          resolution_path = Path(os.environ["OUT"]) / "media-audit-resolution.json"
          resolution = json.loads(resolution_path.read_text(encoding="utf-8"))
          mappings = {
              os.environ["STILL_ITEM_ID"]: os.environ["AUDIT_STILL_ITEM_ID"],
              os.environ["PORTRAIT_ITEM_ID"]: os.environ["AUDIT_PORTRAIT_ITEM_ID"],
          }
          expected_sha = {
              "still": os.environ["EXPECTED_STILL_SHA"],
              "portrait": os.environ["EXPECTED_PORTRAIT_SHA"],
          }
          actual = {}
          for side in ("still", "portrait"):
              generated = "ma_" + hashlib.sha256(
                  f"star-trek|{os.environ['WALL_ID']}|{side}".encode()
              ).hexdigest()[:24]
              rows = [
                  row for row in state.get("items", [])
                  if row.get("scope") == "star-trek"
                  and row.get("wall_id") == os.environ["WALL_ID"]
                  and row.get("side") == side
              ]
              if len(rows) != 1:
                  raise SystemExit(f"Henoch {side} audit item cardinality drifted: {len(rows)}")
              row = rows[0]
              sealed = os.environ["AUDIT_STILL_ITEM_ID" if side == "still" else "AUDIT_PORTRAIT_ITEM_ID"]
              if row.get("id") != generated or generated != sealed:
                  raise SystemExit(f"Henoch {side} audit ID drifted: {row.get('id')} / {generated} / {sealed}")
              if row.get("asset", {}).get("sha256") != expected_sha[side]:
                  raise SystemExit(f"Henoch {side} audit asset drifted")
              actual[side] = row["id"]

          translated = []
          for vote in resolution.get("votes", []):
              row = dict(vote)
              if row.get("item_id") not in mappings:
                  raise SystemExit(f"unexpected Henoch review item locator: {row.get('item_id')}")
              row["item_id"] = mappings[row["item_id"]]
              translated.append(row)
          resolution["votes"] = translated
          resolution_path.write_text(
              json.dumps(resolution, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          mapping = {
              "version": 1,
              "transaction": "STAR-TREK-HENOCH-MEDIA-ITEM-ID-RECONCILIATION-V1",
              "scope": "star-trek",
              "wall_id": os.environ["WALL_ID"],
              "review_items": {
                  "still": os.environ["STILL_ITEM_ID"],
                  "portrait": os.environ["PORTRAIT_ITEM_ID"],
              },
              "candidate_items": actual,
              "asset_sha256": expected_sha,
              "mechanism": "mediaItemId(scope, wall_id, side)",
              "media_semantics_changed": False,
              "votes_changed": False,
              "canonical_mutation": False,
              "lease_mutation": False,
          }
          (Path(os.environ["OUT"]) / "media-item-id-reconciliation.json").write_text(
              json.dumps(mapping, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY2
          npm run media:audit -- resolve --input "$OUT/media-audit-resolution.json" | tee "$OUT/media-resolve.log"'''
          if original.count(anchor) != 1:
              raise SystemExit("stage v2 resolve anchor drifted")
          patched = original.replace(anchor, inserted, 1)
          step.write_text(patched, encoding="utf-8")
          diff = ''.join(difflib.unified_diff(
              original.splitlines(keepends=True),
              patched.splitlines(keepends=True),
              fromfile="v2/steps/03.sh",
              tofile="v3/steps/03.sh",
          ))
          patch_root = Path(os.environ["PATCH_ROOT"])
          (patch_root / "step03.patch").write_text(diff, encoding="utf-8")
          receipt = {
              "version": 1,
              "transaction": "STAR-TREK-HENOCH-STAGE-RUNTIME-REPAIR-V3",
              "patched_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "classification": "media-review-locator-to-repository-audit-id-translation",
              "source_stage_commit": os.environ["SOURCE_STAGE_COMMIT"],
              "payload_sha256": os.environ["PAYLOAD_SHA256"],
              "original_step03_sha256": hashlib.sha256(original.encode()).hexdigest(),
              "patched_step03_sha256": hashlib.sha256(patched.encode()).hexdigest(),
              "review_items": {"still": os.environ["STILL_ITEM_ID"], "portrait": os.environ["PORTRAIT_ITEM_ID"]},
              "candidate_items": {"still": os.environ["AUDIT_STILL_ITEM_ID"], "portrait": os.environ["AUDIT_PORTRAIT_ITEM_ID"]},
              "product_logic_changed": False,
              "media_semantics_changed": False,
              "votes_changed": False,
              "lease_logic_changed": False,
              "canonical_mutation": False,
          }
          (patch_root / "runtime-repair.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 -m py_compile "$LIFECYCLE"
          rm -rf /tmp/__pycache__
          bash -n "$CENSUS_HELPER"
          for script in "$STEPS_ROOT"/[0-9][0-9].sh; do bash -n "$script"; done
          sha256sum /tmp/star-trek-henoch-stage-v3-runtime.tar.gz "$LIFECYCLE" "$BATCH" "$CENSUS_HELPER" "$STEPS_ROOT"/[0-9][0-9].sh "$PATCH_ROOT/step03.patch" "$PATCH_ROOT/runtime-repair.json" > "$PATCH_ROOT/recovery-program.sha256"

      - name: Trace immutable inputs and check out the exact claim
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$STEPS_ROOT/01.sh"
          cp "$PATCH_ROOT/step03.patch" "$OUT/"
          cp "$PATCH_ROOT/runtime-repair.json" "$OUT/"
          cp "$PATCH_ROOT/recovery-program.sha256" "$OUT/"

      - name: Submit, grow, and bind the reviewed media
        shell: bash
        run: bash "$STEPS_ROOT/02.sh"

      - name: Resolve translated media items, refresh projections, and complete Henoch
        shell: bash
        run: bash "$STEPS_ROOT/03.sh"

      - name: Qualify the exact candidate
        shell: bash
        run: bash "$STEPS_ROOT/04.sh" && bash "$STEPS_ROOT/05.sh"

      - name: Upload Henoch stage v3 evidence
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-stage-recovery-v3-${{ github.run_id }}
          path: |
            /tmp/star-trek-henoch-stage-v3/output/
            /tmp/star-trek-henoch-stage-v3-patch/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish candidate and immutable stage locator
        if: ${{ success() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          candidate_commit="$(cat "$OUT/candidate-commit.txt")"
          candidate_tree="$(cat "$OUT/candidate-tree.txt")"
          test "$(git rev-parse HEAD)" = "$candidate_commit"
          test "$(git show -s --format=%T HEAD)" = "$candidate_tree"
          test "$(git show -s --format=%P HEAD)" = "$CLAIM_COMMIT"
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIVE_MAIN"
          jq --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" --arg source_stage "$SOURCE_STAGE_COMMIT" '.artifact={id:$id,digest:$digest} | .recovery={version:3,transaction:"STAR-TREK-HENOCH-STAGE-RECOVERY-V3",source_stage_commit:$source_stage,repair:"media-review-locator-to-repository-audit-id-translation"}' "$OUT/candidate-commit.json" > "$OUT/candidate-commit.tmp"
          mv "$OUT/candidate-commit.tmp" "$OUT/candidate-commit.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git push origin "$candidate_commit:refs/heads/${CANDIDATE_BRANCH}"
          publication=/tmp/star-trek-henoch-stage-v3-publication
          index=/tmp/star-trek-henoch-stage-v3.index
          rm -rf "$publication" "$index"
          mkdir -p "$publication/transport/star-trek-henoch-stage-v3"
          cp -a "$OUT"/. "$publication/transport/star-trek-henoch-stage-v3/"
          GIT_INDEX_FILE="$index" git read-tree --empty
          GIT_INDEX_FILE="$index" git --work-tree="$publication" add -A
          result_tree="$(GIT_INDEX_FILE="$index" git write-tree)"
          result_commit="$(printf '%s\n' 'Record staged Star Trek Henoch candidate v3' | git -c user.name=undercast-henoch-stage-v3 -c user.email=undercast-henoch-stage-v3@users.noreply.github.com commit-tree "$result_tree")"
          test -z "$(git show -s --format=%P "$result_commit")"
          git push origin "$result_commit:refs/heads/${RESULT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')" = "$candidate_commit"
          test "$(git ls-remote origin "refs/heads/${RESULT_BRANCH}" | awk '{print $1}')" = "$result_commit"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIVE_MAIN"
