name: card-backfill-uc-171-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-171-APPLY.json"
      - "scripts/card-backfill-uc-171-apply.part-00.mjs"
      - "scripts/card-backfill-uc-171-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-171-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-171-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-036'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-036
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-171 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-171-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-171');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-171');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0463aa68c783b67dbfb3a9bc');
          if(row.version!==1||row.record_id!=='UC-171'||row.kind!=='voice'||row.actor!=='Rob Paulsen'||row.character!=='Yakko Warner, Pinky, Raphael'||row.production!=='Animaniacs / TMNT'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-171 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8714744115||row.render_artifact?.head_sha!=='2bd6a22c521ba365e60367e1e39a7066d92699e1'||row.render_artifact?.zip_sha256!=='a8bd543c2ff9bc19bb99614642051b8fb276aa03f522b1cebcf4ef39355054d7')throw new Error('UC-171 render custody drift');
          if(Object.keys(row.expected_files||{}).length!==23||row.denominators?.packet_file_count!==23||row.denominators?.checksum_row_count!==22||row.denominators?.selected_role_count!==3||row.denominators?.actor_role_binding_count!==4||row.denominators?.strict_actor_role_page_count!==3||row.denominators?.reference_only_actor_role_page_count!==1||row.denominators?.raw_revision_count!==3||row.denominators?.api_receipt_count!==6||row.denominators?.failed_discovery_checkpoint_count!==3||row.denominators?.duplicate_item_count!==5||row.denominators?.repository_hash_count!==2070||row.denominators?.discovery_candidate_count!==10)throw new Error('UC-171 packet denominator drift');
          if(row.expected_files?.['yakko-original.webp']?.sha256!=='415bff7eb92b32484ee3336b8ab765f9d1ec1b90847f65886857eb93d3e2564f'||row.expected_files?.['pinky-original.webp']?.sha256!=='bbfc955b597ab1d7a2ce2e69b3bcecd15840032ca5c11d9eae38e1bccd346ecd'||row.expected_files?.['raphael-1987-original.webp']?.sha256!=='4bc08f7e677b193b9d662d54cc2366a412aec7ede827d578f8736e54c0c16324')throw new Error('UC-171 selected source authorization drift');
          if(row.expected_files?.['exact-voice-record.json']?.sha256!=='e88a6afad22e53a7cd76b2ceedb746c8f58e324e1e8aa4009cc53d613a7134bb'||row.expected_files?.['uc-171-still-candidate.jpg']?.sha256!=='bfaf610c199b621939e96b474b19898223693471b06c284a40282208112f58b1'||row.expected_files?.['card-crop-preview.jpg']?.sha256!=='f778f2950818cb3252ba3c2ee3e25e3a686b404b271b9ba8039ec8041cf80bec')throw new Error('UC-171 candidate authorization drift');
          if(row.ruling?.identity!=='exact-three-role-subject-set'||row.ruling?.presentation!=='three-role-animated-character-composite'||row.ruling?.crop_ruling!=='pass-face-and-full-character-triptych'||row.ruling?.chronology_ruling!=='pass-role-specific-1987-and-1993-boundaries'||row.ruling?.raphael_ruling!=='pass-original-1987-raphael-distinct-from-later-donatello'||row.ruling?.reference_only_ruling!=='pass-blocked-paramount-release-retained-as-reference-only'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-171 ruling drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Rob Paulsen'||specimen.character!=='Yakko Warner, Pinky, Raphael'||specimen.production!=='Animaniacs / TMNT'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-171'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-171 audit boundary drift');
          console.log(`PASS — UC-171 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8714744115/zip" > "$root/render.zip"
          echo "a8bd543c2ff9bc19bb99614642051b8fb276aa03f522b1cebcf4ef39355054d7  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-171"
          test -d "$base"
          test "$(find "$base" -maxdepth 1 -type f | wc -l)" -eq 23
          echo "9c923a3afcc184bec953d1a6d6c0d9bd41bc1b4c11a2ed41bb2892ce1d7ca4a0  $base/manifest.json" | sha256sum -c -
          echo "42a6b28e9f405dd928d6bdf43c28801850b8b86d11ce5e0d5d54ad37393076e8  $base/SHA256SUMS" | sha256sum -c -
          echo "e88a6afad22e53a7cd76b2ceedb746c8f58e324e1e8aa4009cc53d613a7134bb  $base/exact-voice-record.json" | sha256sum -c -
          echo "bfaf610c199b621939e96b474b19898223693471b06c284a40282208112f58b1  $base/uc-171-still-candidate.jpg" | sha256sum -c -
          echo "f778f2950818cb3252ba3c2ee3e25e3a686b404b271b9ba8039ec8041cf80bec  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30429070458
          artifact_id=8714744115
          artifact_name=card-backfill-uc-171-render-30429070458
          artifact_zip_sha256=a8bd543c2ff9bc19bb99614642051b8fb276aa03f522b1cebcf4ef39355054d7
          artifact_head_sha=2bd6a22c521ba365e60367e1e39a7066d92699e1
          source_manifest_sha256=9c923a3afcc184bec953d1a6d6c0d9bd41bc1b4c11a2ed41bb2892ce1d7ca4a0
          source_sums_sha256=42a6b28e9f405dd928d6bdf43c28801850b8b86d11ce5e0d5d54ad37393076e8
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-171-apply/source/output/UC-171
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-apply"
          cat scripts/card-backfill-uc-171-apply.part-00.mjs scripts/card-backfill-uc-171-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-171');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-171');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_0463aa68c783b67dbfb3a9bc');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 specimen was canonically mutated');
          if(source?.still||source?.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-171'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-171 audit disposition was canonically mutated');
          console.log('PASS — UC-171 still remains canonically absent; existing Rob Paulsen portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-171.json \
            .github/CARD-BACKFILL-UC-171-DISCOVER.json \
            .github/CARD-BACKFILL-UC-171-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-171-RENDER.json \
            .github/CARD-BACKFILL-UC-171-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-171-scope.yml \
            .github/workflows/card-backfill-uc-171-discover.yml \
            .github/workflows/card-backfill-uc-171-render.yml \
            .github/workflows/card-backfill-uc-171-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-171-scope.mjs \
            scripts/card-backfill-uc-171-discover.mjs \
            scripts/card-backfill-uc-171-discover-repair.py \
            scripts/card-backfill-uc-171-render.part-00.mjs \
            scripts/card-backfill-uc-171-render.part-01.mjs \
            scripts/card-backfill-uc-171-apply.part-00.mjs \
            scripts/card-backfill-uc-171-apply.part-01.mjs
          git add -A
          git diff --cached --check -- . \
            ':(exclude)data/review/card-backfill/UC-171/source-raw-yakko.wikitext' \
            ':(exclude)data/review/card-backfill/UC-171/source-raw-pinky.wikitext' \
            ':(exclude)data/review/card-backfill/UC-171/source-raw-raphael-1987.wikitext'
          echo "a434b8bb6bc29a6fd97203f7b1c6d39d006e205bcfdb7e6baf0d740c2abca5e4  data/review/card-backfill/UC-171/source-raw-yakko.wikitext" | sha256sum -c -
          echo "96634af0979f01b738e49ab30426d33830e01068a89a5142f80c33ee86202fe3  data/review/card-backfill/UC-171/source-raw-pinky.wikitext" | sha256sum -c -
          echo "e732c9312279d49cdf7c4eb5e77e8753fa050c4b3a9b033909730edd8013d27b  data/review/card-backfill/UC-171/source-raw-raphael-1987.wikitext" | sha256sum -c -
          git commit -m 'Card backfill: retain UC-171 Rob Paulsen three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-035
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-035 HEAD)
          test "${#changed[@]}" -eq 23
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-171/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-036
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-171-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-171-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-171-apply
            data/review/card-backfill/UC-171
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
