name: doctor-who-cycle-012-media-census-v8

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v8.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v8
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SUPERVISOR_BLOB: 4ab2c29472073e2a2ef38e558044ad192e471487
      SUPERVISOR_B64_BYTES: "7564"
      SUPERVISOR_B64_SHA256: de736914b04f6949a928780c7f63e46f1526f239f730dc69fb335a310881577d
      SUPERVISOR_GZIP_BYTES: "5673"
      SUPERVISOR_GZIP_SHA256: 01ebedef1df2a0853bbb1e509209965b4c61e1a7f6b96afd023633d210e0d9ed
      SUPERVISOR_BYTES: "20252"
      SUPERVISOR_SHA256: 11f399ef9729c8d4a615dd9ea71a0560afb377344f36f40e443cf3fcab85598e
      ROOT: /tmp/doctor-who-cycle-012-media-census-v8-supervisor
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact V8 single-blob supervisor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SUPERVISOR_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$ROOT/supervisor.sh.gz.b64"
          test "$(wc -c < "$ROOT/supervisor.sh.gz.b64" | tr -d ' ')" = "$SUPERVISOR_B64_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz.b64" | awk '{print $1}')" = "$SUPERVISOR_B64_SHA256"
          base64 -d "$ROOT/supervisor.sh.gz.b64" > "$ROOT/supervisor.sh.gz"
          test "$(wc -c < "$ROOT/supervisor.sh.gz" | tr -d ' ')" = "$SUPERVISOR_GZIP_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz" | awk '{print $1}')" = "$SUPERVISOR_GZIP_SHA256"
          gzip -dc "$ROOT/supervisor.sh.gz" > "$ROOT/supervisor.sh"
          test "$(wc -c < "$ROOT/supervisor.sh" | tr -d ' ')" = "$SUPERVISOR_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh" | awk '{print $1}')" = "$SUPERVISOR_SHA256"
          bash -n "$ROOT/supervisor.sh"
          SUPERVISOR="$ROOT/supervisor.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['SUPERVISOR']).read_text(); blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-012-media-census-v8-supervisor-{index}>','exec')
          PY
          chmod 700 "$ROOT/supervisor.sh"
          "$ROOT/supervisor.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v8/payload
            /tmp/doctor-who-cycle-012-media-census-v6-failure/payload
            /tmp/doctor-who-cycle-012-media-census-v7-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v8-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v8
            /tmp/doctor-who-cycle-012-media-census-v8-loader
            /tmp/doctor-who-cycle-012-media-census-v6-failure
            /tmp/doctor-who-cycle-012-media-census-v7-failure
            /tmp/doctor-who-cycle-012-media-census-v8-supervisor
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
