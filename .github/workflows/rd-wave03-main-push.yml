name: RD Wave-03 bounded main-push materializer

on:
  push:
    branches:
      - main
    paths:
      - tmp/rd-wave03.trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rd-wave03-bounded-main-push
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/rd-wave03-materialization
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce exact transaction start
        run: |
          gh pr comment 316 --repo BigBirdReturns/undercast --body "Wave-03 main-push materializer run ${GITHUB_RUN_ID} started at ${GITHUB_SHA}; exact product base c340dc710e423a86b2ad3afa3fcf38a2751e8eb7."

      - name: Materialize six lease-checked non-workflow product branches
        run: bash tmp/rd-wave03-materialize.sh

      - name: Record successful branch materialization
        if: success()
        run: |
          gh pr comment 316 --repo BigBirdReturns/undercast --body "Wave-03 main-push materializer run ${GITHUB_RUN_ID} succeeded. Six absence-leased non-workflow product branches were created from c340dc710e423a86b2ad3afa3fcf38a2751e8eb7; see the attached receipt."

      - name: Record failed branch materialization
        if: failure()
        run: |
          gh pr comment 316 --repo BigBirdReturns/undercast --body "Wave-03 main-push materializer run ${GITHUB_RUN_ID} failed. No unverified product authority is accepted; inspect the attached evidence and live branch refs."

      - name: Upload bounded materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-materialization
          if-no-files-found: warn
          retention-days: 30
