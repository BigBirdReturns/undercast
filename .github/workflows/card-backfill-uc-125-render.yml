name: card-backfill-uc-125-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-125-RENDER.json"
      - "scripts/card-backfill-uc-125-render.part-00.mjs"
      - "scripts/card-backfill-uc-125-render.part-01.mjs"
      - "scripts/card-backfill-uc-125-render.part-02.mjs"
      - ".github/workflows/card-backfill-uc-125-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-125-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-030'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-030
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-125 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-125-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-125');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-125');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4a735d846bcdf5aae92e0959');
          if(row.version!==1||row.record_id!=='UC-125'||row.actor!=='Billy West'||row.character!=='Ren, Stimpy & Fry'||row.production!=='Ren & Stimpy / Futurama'||row.year!==1991||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-125 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8705524655||row.discovery_artifact?.head_sha!=='ed3d68b7b51dabcfb663e30c1addb01a00d86c47'||row.discovery_artifact?.zip_sha256!=='358734f7315daff60e16c5ddd476eb51693bc02a6ff606ee360dc3eb118ac3a1'||row.discovery_artifact?.candidate_count!==3)throw new Error('UC-125 discovery custody drift');
          if(row.roles?.length!==3||row.roles[0]?.sha256!=='a40c0a7e742d3ade92c3c2fca9b14993e54dd95e8d8eee88ad536e98fdf34c8c'||row.roles[1]?.sha256!=='731cf5e06aba633a5770429388bfbfd10aa2e9111cf7c19a623ca0a2c828419f'||row.roles[2]?.sha256!=='0fb5a401b4cfaecf399f8125dc5bbf6a02b1ccda7bf1563d21f07b0141293264'||row.roles.some(role=>role.generic_width_floor_exception!==true||role.width!==240||role.height!==320))throw new Error('UC-125 selected source or floor-exception drift');
          if(row.actor_role_custody?.length!==4||row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.panel_height!==1000||row.render?.divider_width!==12||row.render?.face_height!==572||row.render?.internal_rule_height!==8||row.render?.body_height!==420||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-125 render geometry drift');
          if(!specimen||specimen.actor!=='Billy West'||specimen.character!=='Ren, Stimpy & Fry'||specimen.production!=='Ren & Stimpy / Futurama'||specimen.years!=='1991'||specimen.still)throw new Error('UC-125 specimen boundary drift');
          if(source?.still)throw new Error('UC-125 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-125'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-125 audit boundary drift');
          console.log('PASS — exact UC-125 Billy West three-role render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8705524655/zip" > "$root/discovery.zip"
          echo "358734f7315daff60e16c5ddd476eb51693bc02a6ff606ee360dc3eb118ac3a1  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-125-discover"
          echo "3b4607f974f25a72035dc26fe862c6985dcb0a8e4e6661c4da0a4865d7d41788  $source/manifest.json" | sha256sum -c -
          echo "49187a1521252756c94bded9eb40ea4b794ff7225bb94b447dc447a18cc58064  $source/summary.json" | sha256sum -c -
          echo "9a2fc89b7fdbe3fdd805b58e46dfd013ce3cf13c8a80cc802d10f5edebe6bb27  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "e7950cfb028d671ed24bd47233c1d329598ac61764def848b6148b3c28494aa9  $source/contact-sheet-ren.jpg" | sha256sum -c -
          echo "850d2552ae1f5e1d74452a79a6f8da14e5df643fda6bf937dc682152cc2dde25  $source/contact-sheet-stimpy.jpg" | sha256sum -c -
          echo "4aeb70ff99b410aba23ea3df0e49277eaf0a67e678d0aa50d6c40ae38b406601  $source/contact-sheet-fry.jpg" | sha256sum -c -
          echo "9a9558c93aaa7533e60b40c589b03fb4c3f27cfe78b0e83fc14bc0fe5bf9e9df  $source/pages/billy-west-current-official.png" | sha256sum -c -
          echo "64d27ffab7efa915ca566a9d49417f4af24d59b5851f67d5996ebe593105da5b  $source/pages/billy-west-role-history.png" | sha256sum -c -
          echo "c7e16ee97198d3747e66ceec4a230f4e5035d46d77943fa4ce23dcb01ea38221  $source/pages/paramount-ren-stimpy.png" | sha256sum -c -
          echo "46e45c5e2f81e006f5aabd858fb66a889cacf239e275ae3de2ac1114a3e0de4e  $source/pages/hulu-futurama.png" | sha256sum -c -
          echo "a40c0a7e742d3ade92c3c2fca9b14993e54dd95e8d8eee88ad536e98fdf34c8c  $source/candidates/ren/001-billy-west-official-ren-role-image.jpg" | sha256sum -c -
          echo "731cf5e06aba633a5770429388bfbfd10aa2e9111cf7c19a623ca0a2c828419f  $source/candidates/stimpy/001-billy-west-official-stimpy-role-image.jpg" | sha256sum -c -
          echo "0fb5a401b4cfaecf399f8125dc5bbf6a02b1ccda7bf1563d21f07b0141293264  $source/candidates/fry/001-billy-west-official-fry-role-image.jpg" | sha256sum -c -
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-125-render/discovery/card-backfill-uc-125-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-125-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-125-render"
          cat scripts/card-backfill-uc-125-render.part-00.mjs scripts/card-backfill-uc-125-render.part-01.mjs scripts/card-backfill-uc-125-render.part-02.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-125-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-125-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-125-render/output
            ${{ runner.temp }}/card-backfill-uc-125-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
