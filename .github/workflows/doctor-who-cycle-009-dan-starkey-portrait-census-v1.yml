name: doctor-who-cycle-009-dan-starkey-portrait-census-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-census-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-census-v1
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-census-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-census-v1
      SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-census-v1.yml
      OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v1
      COMMONS_CATEGORY: Category:Dan Starkey
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,images,receipt,work}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"

      - name: Revalidate current cycle and media boundaries
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/receipt/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/receipt/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/receipt/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/receipt/media-gate.log"
          jq -e '.total==316 and .statuses.queued==308 and .statuses.resolved==8 and .in_flight==0' "$OUT/receipt/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Inventory canonical Dan Starkey portrait custody
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root=process.env.ROOT;
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const sources=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const cards=specimens.filter(x=>x.actor==='Dan Starkey').map(x=>({id:x.id,character:x.character,production:x.production,portrait:x.portrait||null})).sort((a,b)=>a.id.localeCompare(b.id));
          const ids=new Set(cards.map(x=>x.id));
          const sourceRows=sources.filter(x=>ids.has(x.id));
          const portraits=(audit.items||[]).filter(x=>x.actor==='Dan Starkey'&&x.side==='portrait').map(x=>({id:x.id,wall_id:x.wall_id,character:x.character,status:x.status,asset:x.asset?{src:x.asset.src,origin:x.asset.origin,sha256:x.asset.sha256,bytes:x.asset.bytes||null}:null})).sort((a,b)=>a.wall_id.localeCompare(b.wall_id));
          const urls=[];
          const walk=(value)=>{if(Array.isArray(value))for(const x of value)walk(x);else if(value&&typeof value==='object')for(const x of Object.values(value))walk(x);else if(typeof value==='string'&&/^https?:\/\//i.test(value))urls.push(value)};
          walk(sourceRows); walk(portraits);
          const normalize=(raw)=>{try{const u=new URL(raw);u.hash='';u.search='';u.hostname=u.hostname.toLowerCase();u.pathname=decodeURIComponent(u.pathname).replace(/ /g,'_');return u.href.replace(/\/$/,'')}catch{return raw}};
          const normalized=[...new Set(urls.map(normalize))].sort();
          const verifiedHashes=[...new Set(portraits.filter(x=>x.status==='verified'&&x.asset?.sha256).map(x=>x.asset.sha256))].sort();
          if(cards.length!==9||portraits.length!==9||verifiedHashes.length<1)throw new Error('canonical Dan Starkey custody denominator drifted');
          const result={performer:'Dan Starkey',canonical_card_count:cards.length,portrait_facet_count:portraits.length,verified_portrait_asset_sha256:verifiedHashes,canonical_urls:normalized,cards,portrait_facets:portraits,source_rows:sourceRows};
          result.identity=crypto.createHash('sha256').update(JSON.stringify(result)).digest('hex');
          fs.writeFileSync(`${root}/receipt/canonical-inventory.json`,JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Census Wikimedia Commons category and retrieve bounded thumbnails
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, html, json, os, re, urllib.parse, urllib.request
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          api='https://commons.wikimedia.org/w/api.php'
          headers={'User-Agent':'Undercast Dan Starkey portrait census/1.0 (research; read-only)'}
          def get(params):
              url=api+'?'+urllib.parse.urlencode(params, doseq=True)
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read())
          rows=[]; cont={}
          while True:
              doc=get({'action':'query','list':'categorymembers','cmtitle':os.environ['COMMONS_CATEGORY'],'cmnamespace':'6','cmtype':'file','cmlimit':'max','format':'json','formatversion':'2','origin':'*',**cont})
              rows.extend(doc['query']['categorymembers'])
              if 'continue' not in doc: break
              cont=doc['continue']
          titles=sorted({row['title'] for row in rows})
          assert 1<=len(titles)<=50 and len(titles)==len(rows)
          pages=[]
          for offset in range(0,len(titles),25):
              doc=get({'action':'query','prop':'imageinfo','titles':'|'.join(titles[offset:offset+25]),'iiprop':'url|size|mime|sha1|timestamp|extmetadata','iiurlwidth':'1200','format':'json','formatversion':'2','origin':'*'})
              pages.extend(doc['query']['pages'])
          inventory=json.loads((root/'receipt/canonical-inventory.json').read_text())
          canonical=set(inventory['canonical_urls'])
          def norm(raw):
              try:
                  u=urllib.parse.urlsplit(raw); path=urllib.parse.unquote(u.path).replace(' ','_')
                  return urllib.parse.urlunsplit((u.scheme.lower(),u.netloc.lower(),path,'','')).rstrip('/')
              except Exception:return raw
          def value(meta,key):
              row=meta.get(key) or {}; return html.unescape(re.sub('<[^>]+>',' ',str(row.get('value','')))).strip()
          output=[]
          for index,page in enumerate(sorted(pages,key=lambda x:x['title']),1):
              ii=(page.get('imageinfo') or [None])[0]; assert ii
              meta=ii.get('extmetadata') or {}
              title=page['title']
              file_page='https://commons.wikimedia.org/wiki/'+urllib.parse.quote(title.replace(' ','_'),safe=':/_()')
              urls=[ii.get('url'),ii.get('descriptionurl'),file_page]
              matches=sorted({norm(x) for x in urls if x and norm(x) in canonical})
              thumb=ii.get('thumburl') or ii['url']
              req=urllib.request.Request(thumb,headers=headers)
              with urllib.request.urlopen(req,timeout=120) as r: data=r.read(); content_type=r.headers.get_content_type()
              suffix={'image/jpeg':'.jpg','image/png':'.png','image/webp':'.webp','image/gif':'.gif','image/tiff':'.tif'}.get(content_type,'.img')
              filename=f'{index:02d}{suffix}'
              (root/'images'/filename).write_bytes(data)
              license_name=value(meta,'LicenseShortName') or value(meta,'UsageTerms')
              license_url=value(meta,'LicenseUrl')
              admissible=bool(re.search(r'^(CC BY(?:-SA)?(?: |$)|Public domain|PD)',license_name,re.I))
              output.append({'index':index,'pageid':page['pageid'],'title':title,'file_page':file_page,'original_url':ii['url'],'description_url':ii.get('descriptionurl'),'original_width':ii.get('width'),'original_height':ii.get('height'),'original_mime':ii.get('mime'),'original_sha1_base36':ii.get('sha1'),'original_timestamp':ii.get('timestamp'),'thumbnail_url':thumb,'thumbnail_file':filename,'thumbnail_sha256':hashlib.sha256(data).hexdigest(),'thumbnail_bytes':len(data),'thumbnail_mime':content_type,'license_short_name':license_name,'license_url':license_url,'artist':value(meta,'Artist'),'credit':value(meta,'Credit'),'description':value(meta,'ImageDescription'),'date_original':value(meta,'DateTimeOriginal'),'admissible_license_candidate':admissible,'canonical_origin_match':bool(matches),'canonical_origin_matches':matches})
          receipt={'category':os.environ['COMMONS_CATEGORY'],'api':api,'file_count':len(output),'bounded_maximum':50,'files':output}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/commons-census.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'receipt/labels.tsv').write_text('\n'.join(f"{r['index']:02d}\t{r['title']}\t{r['license_short_name']}\tmatch={str(r['canonical_origin_match']).lower()}" for r in output)+'\n')
          PY

      - name: Build labeled visual contact sheet
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v montage >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          mkdir -p "$OUT/work/tiles"
          ROOT="$OUT" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          rows=json.loads((root/'receipt/commons-census.json').read_text())['files']
          for row in rows:
              src=root/'images'/row['thumbnail_file']
              dst=root/'work/tiles'/f"{row['index']:02d}.jpg"
              label=f"{row['index']:02d} {row['title'].removeprefix('File:')}\n{row['license_short_name']} | canonical-origin-match={str(row['canonical_origin_match']).lower()}"
              subprocess.run(['convert',str(src),'-auto-orient','-thumbnail','300x250>','-background','white','-gravity','center','-extent','320x270','-gravity','south','-fill','black','-pointsize','13','-annotate','+0+4',label,str(dst)],check=True)
          PY
          montage "$OUT"/work/tiles/*.jpg -tile 4x -geometry +8+8 -background '#dddddd' "$OUT/receipt/contact-sheet.jpg"
          identify "$OUT/receipt/contact-sheet.jpg" > "$OUT/receipt/contact-sheet-identify.txt"
          cp -R "$OUT/images" "$OUT/receipt/images"

      - name: Seal bounded census receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          commons=json.loads((root/'receipt/commons-census.json').read_text())
          canonical=json.loads((root/'receipt/canonical-inventory.json').read_text())
          candidates=[row for row in commons['files'] if row['admissible_license_candidate'] and not row['canonical_origin_match']]
          receipt={'version':1,'status':'dan-starkey-commons-portrait-census-complete','canonical_main':os.environ['EXACT_MAIN'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'task_id':os.environ['TASK_ID'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],'performer':'Dan Starkey','category':commons['category'],'category_file_count':commons['file_count'],'canonical_card_count':canonical['canonical_card_count'],'canonical_portrait_facet_count':canonical['portrait_facet_count'],'canonical_verified_portrait_hash_count':len(canonical['verified_portrait_asset_sha256']),'license_and_origin_compatible_count':len(candidates),'license_and_origin_compatible_indices':[x['index'] for x in candidates],'admitted_portrait':None,'visual_review_pending':True,'queue_mutated':False,'lease_issued':False,'canonical_record_created':False,'media_adopted':False,'repository_write':False,'outside_human_dependency':False,'owner_physical_action_required':False,'next_gate':'independent visual and license review of exact thumbnail/original metadata, followed by selected-original and derivative byte qualification'}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/census-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-census-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-census-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
