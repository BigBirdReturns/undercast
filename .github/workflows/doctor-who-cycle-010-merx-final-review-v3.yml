name: doctor-who-cycle-010-merx-final-review-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-review-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-review-v3
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-review-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      BRANCH: agent/doctor-who-cycle-010-merx-final-review-v3
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-review-v3.yml
      SOURCE_COMMIT: 7cb5f0ee9b7030efd233f1522a57e9c6a3a6ac65
      SOURCE_PATH: .github/workflows/doctor-who-cycle-010-merx-final-review-v1.yml
      SOURCE_BLOB: aa798f827f5095de6d8e647a9b7bcd01d58de6d5
      SOURCE_BYTES: "19897"
      SOURCE_SHA256: e90179d651d04cf8b6009b3b3bcd00c560c19b858e51f3357f36dbca83c02db5
      FAILED_PR: "735"
      FAILED_HEAD: 8582a5f2504f864fba6c7d8493be49298ecb23b6
      FAILED_RUN: "31296887811"
      FAILED_JOB: "93203351573"
      FAILED_ARTIFACT: "9033230901"
      FAILED_ARTIFACT_DIGEST: sha256:72e7cb7113f5018b31e3ca97e5cfc6b5465580f9439d33542f012dc6d23c3a38
      CONTROL: /tmp/doctor-who-cycle-010-merx-final-review-v3-control
      OUT: /tmp/doctor-who-cycle-010-merx-final-review-v3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V1 reviewer and repair TAR mode semantics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL" "$OUT"
          mkdir -p "$CONTROL"/{api,scripts}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$CONTROL/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$FAILED_PR" > "$CONTROL/api/failed-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > "$CONTROL/api/failed-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN/jobs?per_page=100" > "$CONTROL/api/failed-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT" > "$CONTROL/api/failed-artifact.json"
          git show "$SOURCE_COMMIT:$SOURCE_PATH" > "$CONTROL/source.yml"
          test "$(wc -c < "$CONTROL/source.yml" | tr -d ' ')" = "$SOURCE_BYTES"
          test "$(sha256sum "$CONTROL/source.yml" | awk '{print $1}')" = "$SOURCE_SHA256"
          test "$(git hash-object "$CONTROL/source.yml")" = "$SOURCE_BLOB"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import hashlib,json,os,re,shlex,subprocess,textwrap,yaml
          from pathlib import Path
          root=Path(os.environ['CONTROL'])
          own=json.loads((root/'api/carrier.json').read_text())
          failed=json.loads((root/'api/failed-pr.json').read_text())
          run=json.loads((root/'api/failed-run.json').read_text())
          jobs=json.loads((root/'api/failed-jobs.json').read_text())['jobs']
          artifact=json.loads((root/'api/failed-artifact.json').read_text())
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert failed['number']==int(os.environ['FAILED_PR']) and failed['head']['sha']==os.environ['FAILED_HEAD']
          assert run['id']==int(os.environ['FAILED_RUN']) and run['head_sha']==os.environ['FAILED_HEAD'] and run['status']=='completed' and run['conclusion']=='failure'
          job=next(row for row in jobs if row['id']==int(os.environ['FAILED_JOB']))
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Recover exact V1 reviewer and repair TAR mode semantics']==('completed','success')
          assert steps['Execute recovered reviewer with exact one-line repair']==('completed','failure')
          assert artifact['id']==int(os.environ['FAILED_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['FAILED_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['FAILED_RUN']) and artifact['workflow_run']['head_sha']==os.environ['FAILED_HEAD']
          source=(root/'source.yml').read_text()
          doc=yaml.safe_load(source)
          jobdef=doc['jobs']['review']
          env={k:str(v) for k,v in jobdef['env'].items() if k!='GH_TOKEN'}
          old_marker='doctor-who-cycle-010-merx-final-review-v1'
          new_marker='doctor-who-cycle-010-merx-final-review-v3'
          env={k:v.replace(old_marker,new_marker) for k,v in env.items()}
          (root/'env.sh').write_text(''.join(f'export {k}={shlex.quote(v)}\n' for k,v in env.items()))
          runs=[step['run'] for step in jobdef['steps'] if 'run' in step]
          assert len(runs)==4
          old_mode="assert f'{m.mode:06o}'==row['mode']"
          new_mode="assert m.mode==int(row['mode'][-3:],8)"
          assert sum(s.count(old_mode) for s in runs)==1
          for index,script in enumerate(runs,1):
              script=script.replace(old_marker,new_marker)
              if index==1:
                  lines=script.splitlines()
                  head_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("head='")]
                  pr_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("pr='")]
                  base_rows=[i for i,line in enumerate(lines[:20]) if line.startswith("test '") and line.endswith(' = "$MAIN"')]
                  assert len(head_rows)==len(pr_rows)==len(base_rows)==1
                  lines[head_rows[0]]='head="$CURRENT_HEAD"'
                  lines[pr_rows[0]]='pr="$CURRENT_PR"'
                  lines[base_rows[0]]='test "$CURRENT_BASE" = "$MAIN"'
                  script='\n'.join(lines)+'\n'
              script=script.replace(old_mode,new_mode)
              path=root/'scripts'/f'{index:02d}.sh'
              path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              for match in re.finditer(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",script,re.S):
                  compile(textwrap.dedent(match.group(1)),f'<script-{index}>','exec')
          patched='\n'.join((root/'scripts'/f'{i:02d}.sh').read_text() for i in range(1,5))
          assert old_mode not in patched and patched.count(new_mode)==1
          receipt={
            'status':'cycle-010-merx-final-review-v3-source-recovered',
            'source_commit':os.environ['SOURCE_COMMIT'],
            'source_blob':os.environ['SOURCE_BLOB'],
            'source_sha256':os.environ['SOURCE_SHA256'],
            'failed_run':int(os.environ['FAILED_RUN']),
            'failed_job':int(os.environ['FAILED_JOB']),
            'failed_artifact':int(os.environ['FAILED_ARTIFACT']),
            'repair':'tar-mode-permission-bits-vs-git-index-mode-and-structural-event-rebinding',
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'source-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute recovered reviewer with exact one-line repair
        shell: bash
        run: |
          set -euo pipefail
          source "$CONTROL/env.sh"
          export CURRENT_HEAD='${{ github.event.pull_request.head.sha }}'
          export CURRENT_PR='${{ github.event.pull_request.number }}'
          export CURRENT_BASE='${{ github.event.pull_request.base.sha }}'
          export GITHUB_ENV="$CONTROL/runtime.env"
          : > "$GITHUB_ENV"
          for script in "$CONTROL"/scripts/*.sh; do
            bash "$script"
            if [ -s "$GITHUB_ENV" ]; then
              set -a
              source "$GITHUB_ENV"
              set +a
              : > "$GITHUB_ENV"
            fi
          done
          cp "$CONTROL/source-recovery.json" "$OUT/review/source-recovery.json"
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-review-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-review-v3
            /tmp/doctor-who-cycle-010-merx-final-review-v3-control
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
