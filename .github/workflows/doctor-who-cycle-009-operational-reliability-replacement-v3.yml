  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute exact commit-bound replacement proof
        shell: bash
        run: |
          set -euo pipefail
          runner_gz=/tmp/doctor-who-cycle-009-operational-reliability-replacement-v3.sh.gz
          runner=/tmp/doctor-who-cycle-009-operational-reliability-replacement-v3.sh
          printf '%s' "$RUNNER_GZIP_BASE64" | base64 -d > "$runner_gz"
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload exact replacement proof
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-replacement-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-replacement-v3/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload replacement diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-replacement-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-replacement-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
