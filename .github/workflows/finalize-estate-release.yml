name: estate-release-finalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-estate-release.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: estate-release-finalization
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  TARGET_BRANCH: main
  AUTHORIZED_MERGE: d8d02f20fdb6ff4d561908b3f5d2e1eb83a5aba2
  AUTHORIZED_HEAD: ${{ github.sha }}
  LIVE_ORIGIN: https://bigbirdreturns.github.io/undercast
  PAGES_WORKFLOW: pages.yml
  PRESERVE_WORKFLOW: preserve.yml
  RECEIPT: data/review/estate-debt/ESTATE-RELEASE-LIVE-VERIFICATION.json
  SELF: .github/workflows/finalize-estate-release.yml

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove exact mainline custody and run the complete gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$AUTHORIZED_MERGE" "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          npm run gate
          test -z "$(git status --porcelain)"

      - name: Wait for the exact push-triggered Pages deployment
        id: initial_pages
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 180); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PAGES_WORKFLOW" \
              --branch "$TARGET_BRANCH" --limit 100 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt \
              > /tmp/initial-pages-runs.json
            run_id="$(node - <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/initial-pages-runs.json', 'utf8'));
          const row = runs.find((run) => run.headSha === process.env.AUTHORIZED_HEAD && run.event === 'push');
          if (row) process.stdout.write(String(row.databaseId));
          NODE
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,event,url > /tmp/initial-pages-run.json
          node - <<'NODE'
          const run = require('/tmp/initial-pages-run.json');
          if (run.headSha !== process.env.AUTHORIZED_HEAD || run.event !== 'push' || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`unexpected initial Pages run: ${JSON.stringify(run)}`);
          }
          NODE
          run_url="$(node -p "require('/tmp/initial-pages-run.json').url")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed product byte for byte
        env:
          INITIAL_PAGES_RUN: ${{ steps.initial_pages.outputs.run_id }}
          INITIAL_PAGES_URL: ${{ steps.initial_pages.outputs.run_url }}
        run: |
          set -euo pipefail
          npm run build:site
          mkdir -p /tmp/estate-release-live
          : > /tmp/estate-release-live/checks.tsv

          verify_file() {
            local route="$1"
            local local_path="$2"
            local key="$3"
            local output="/tmp/estate-release-live/${key}"
            local headers="/tmp/estate-release-live/${key}.headers"
            local matched=false
            for attempt in $(seq 1 90); do
              if curl -fsSL --connect-timeout 15 --max-time 90 \
                -H 'Cache-Control: no-cache' -D "$headers" \
                "${LIVE_ORIGIN}/${route}?release=${AUTHORIZED_HEAD}&attempt=${attempt}" \
                -o "$output"; then
                if cmp -s "$local_path" "$output"; then
                  matched=true
                  break
                fi
              fi
              sleep 10
            done
            test "$matched" = true
            local sha bytes
            sha="$(sha256sum "$local_path" | awk '{print $1}')"
            bytes="$(stat -c '%s' "$local_path")"
            printf '%s\t%s\t%s\t%s\n' "$route" "$local_path" "$sha" "$bytes" >> /tmp/estate-release-live/checks.tsv
          }

          verify_file "index.html" "index.html" "index.html"
          verify_file "data/quality.json" "data/quality.json" "quality.json"
          verify_file "records/UC-178/" "records/UC-178/index.html" "UC-178.html"
          verify_file "records/UC-684/" "records/UC-684/index.html" "UC-684.html"
          verify_file "records/UC-338/" "records/UC-338/index.html" "UC-338.html"
          verify_file "images/uc-178-still-2d6360659016.jpg" "images/uc-178-still-2d6360659016.jpg" "UC-178.jpg"
          verify_file "images/uc-684-portrait-1a2d9a32dbbc.jpg" "images/uc-684-portrait-1a2d9a32dbbc.jpg" "UC-684.jpg"
          verify_file "images/uc-338-still-fe30c21c2a17.jpg" "images/uc-338-still-fe30c21c2a17.jpg" "UC-338.jpg"

          node - <<'NODE'
          const fs = require('fs');
          const quality = JSON.parse(fs.readFileSync('data/quality.json', 'utf8'));
          const expected = {
            total: 1313,
            complete_pairs: 740,
            complete_pair_ratio: 0.563595,
            missing_still: 332,
            missing_portrait: 348,
            missing_both: 107,
            known_makers: 767,
            records_with_claim_evidence: 437,
          };
          for (const [key, value] of Object.entries(expected)) {
            const actual = key === 'total' ? quality.total : quality.metrics[key];
            if (actual !== value) throw new Error(`quality ${key}: expected ${value}, found ${actual}`);
          }
          const checks = fs.readFileSync('/tmp/estate-release-live/checks.tsv', 'utf8').trim().split('\n').map((line) => {
            const [route, local_path, sha256, bytes] = line.split('\t');
            return {
              route: `${process.env.LIVE_ORIGIN}/${route}`,
              local_path,
              sha256,
              bytes: Number(bytes),
              exact_byte_match: true,
            };
          });
          const receipt = {
            version: 1,
            transaction: 'ESTATE-RELEASE-001',
            operation: 'merged-main-pages-live-verification',
            status: 'verified',
            recorded_at: new Date().toISOString(),
            authorization: {
              merged_main_commit: process.env.AUTHORIZED_MERGE,
              deployed_release_head: process.env.AUTHORIZED_HEAD,
              merge_is_ancestor: true,
              exact_head_lease_required: true,
            },
            deployment: {
              workflow: process.env.PAGES_WORKFLOW,
              workflow_run: Number(process.env.INITIAL_PAGES_RUN),
              workflow_url: process.env.INITIAL_PAGES_URL,
              event: 'push',
              live_origin: process.env.LIVE_ORIGIN,
            },
            quality: {
              total: quality.total,
              metrics: quality.metrics,
              baseline: quality.baseline,
              baseline_unchanged: true,
            },
            checks,
            boundary: {
              representative_records_verified: ['UC-178', 'UC-684', 'UC-338'],
              representative_assets_verified: 3,
              live_bytes_compared_to_built_main: true,
              canonical_mutation: false,
              preservation_snapshot_pending: true,
              next_authorized_work: 'publish an exact preservation snapshot for this receipted release head, redeploy that registry-bearing main head, and verify it live',
            },
          };
          fs.mkdirSync('data/review/estate-debt', { recursive: true });
          fs.writeFileSync(process.env.RECEIPT, JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Publish the live receipt and retire this finalizer under lease
        id: release
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report
          git checkout -- . ':!data/review/estate-debt/ESTATE-RELEASE-LIVE-VERIFICATION.json' ':!.github/workflows/finalize-estate-release.yml'
          test -e "$RECEIPT"
          test -e "$SELF"
          git rm "$SELF"
          git add "$RECEIPT"
          expected="$(printf '%s\n%s\n' "$SELF" "$RECEIPT" | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          npm run gate -- --skip-rendered
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'undercast-release'
          git config user.email 'undercast-release@users.noreply.github.com'
          git commit \
            -m 'Estate release: receipt merged main and retire finalizer' \
            -m "merged_main=${AUTHORIZED_MERGE}" \
            -m "deployed_head=${AUTHORIZED_HEAD}" \
            -m "pages_run=${{ steps.initial_pages.outputs.run_id }}" \
            -m 'live_records=UC-178,UC-684,UC-338' \
            -m 'preservation_pending=true'
          release_head="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "release_head=$release_head" >> "$GITHUB_OUTPUT"

      - name: Dispatch and await exact preservation export
        id: preservation
        env:
          RELEASE_HEAD: ${{ steps.release.outputs.release_head }}
        run: |
          set -euo pipefail
          dispatch_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$PRESERVE_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" -f full_originals=false
          run_id=""
          for attempt in $(seq 1 240); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PRESERVE_WORKFLOW" \
              --branch "$TARGET_BRANCH" --limit 100 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt \
              > /tmp/preservation-runs.json
            run_id="$(DISPATCH_AFTER="$dispatch_after" node - <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/preservation-runs.json', 'utf8'));
          const floor = Date.parse(process.env.DISPATCH_AFTER);
          const row = runs.find((run) => run.headSha === process.env.RELEASE_HEAD && run.event === 'workflow_dispatch' && Date.parse(run.createdAt) >= floor - 5000);
          if (row) process.stdout.write(String(row.databaseId));
          NODE
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,event,url > /tmp/preservation-run.json
          node - <<'NODE'
          const run = require('/tmp/preservation-run.json');
          if (run.headSha !== process.env.RELEASE_HEAD || run.event !== 'workflow_dispatch' || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`unexpected preservation run: ${JSON.stringify(run)}`);
          }
          NODE

          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          preservation_head="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          git merge-base --is-ancestor "$RELEASE_HEAD" "$preservation_head"
          git show "$preservation_head:preservation/SNAPSHOTS.json" > /tmp/preservation-registry.json
          RELEASE_HEAD="$RELEASE_HEAD" node - <<'NODE' > /tmp/preservation-selection.json
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('/tmp/preservation-registry.json', 'utf8'));
          const row = registry.snapshots.find((snapshot) => snapshot.repository_commit === process.env.RELEASE_HEAD);
          if (!row) throw new Error(`no preservation snapshot receipts ${process.env.RELEASE_HEAD}`);
          if (!['pending', 'verified'].includes(row.status)) throw new Error(`unexpected snapshot status ${row.status}`);
          const kinds = new Set((row.public_release?.assets || []).map((asset) => asset.kind));
          for (const kind of ['source-bag', 'repository-snapshot']) if (!kinds.has(kind)) throw new Error(`missing ${kind}`);
          if (!row.public_release?.tag?.includes(process.env.RELEASE_HEAD.slice(0, 12))) throw new Error(`tag does not bind release head: ${row.public_release?.tag}`);
          process.stdout.write(JSON.stringify({ id: row.id, status: row.status, tag: row.public_release.tag }, null, 2));
          NODE
          run_url="$(node -p "require('/tmp/preservation-run.json').url")"
          snapshot_id="$(node -p "require('/tmp/preservation-selection.json').id")"
          snapshot_status="$(node -p "require('/tmp/preservation-selection.json').status")"
          release_tag="$(node -p "require('/tmp/preservation-selection.json').tag")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "preservation_head=$preservation_head" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "snapshot_status=$snapshot_status" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Deploy the preservation-registry-bearing main head
        id: final_pages
        env:
          PRESERVATION_HEAD: ${{ steps.preservation.outputs.preservation_head }}
        run: |
          set -euo pipefail
          dispatch_after="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run "$PAGES_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
          run_id=""
          for attempt in $(seq 1 180); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$PAGES_WORKFLOW" \
              --branch "$TARGET_BRANCH" --limit 100 \
              --json databaseId,headSha,status,conclusion,event,url,createdAt \
              > /tmp/final-pages-runs.json
            run_id="$(DISPATCH_AFTER="$dispatch_after" node - <<'NODE'
          const fs = require('fs');
          const runs = JSON.parse(fs.readFileSync('/tmp/final-pages-runs.json', 'utf8'));
          const floor = Date.parse(process.env.DISPATCH_AFTER);
          const row = runs.find((run) => run.headSha === process.env.PRESERVATION_HEAD && run.event === 'workflow_dispatch' && Date.parse(run.createdAt) >= floor - 5000);
          if (row) process.stdout.write(String(row.databaseId));
          NODE
            )"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status,conclusion,event,url > /tmp/final-pages-run.json
          node - <<'NODE'
          const run = require('/tmp/final-pages-run.json');
          if (run.headSha !== process.env.PRESERVATION_HEAD || run.event !== 'workflow_dispatch' || run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error(`unexpected final Pages run: ${JSON.stringify(run)}`);
          }
          NODE
          run_url="$(node -p "require('/tmp/final-pages-run.json').url")"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Verify the final live site, release receipt, and preservation registry
        env:
          RELEASE_HEAD: ${{ steps.release.outputs.release_head }}
          PRESERVATION_HEAD: ${{ steps.preservation.outputs.preservation_head }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$PRESERVATION_HEAD"
          git reset --hard "$PRESERVATION_HEAD"
          npm ci
          npm run build:site
          mkdir -p /tmp/estate-release-final-live

          verify_final() {
            local route="$1"
            local local_path="$2"
            local key="$3"
            local output="/tmp/estate-release-final-live/${key}"
            local matched=false
            for attempt in $(seq 1 90); do
              if curl -fsSL --connect-timeout 15 --max-time 90 \
                -H 'Cache-Control: no-cache' \
                "${LIVE_ORIGIN}/${route}?release=${PRESERVATION_HEAD}&attempt=${attempt}" \
                -o "$output"; then
                if cmp -s "$local_path" "$output"; then
                  matched=true
                  break
                fi
              fi
              sleep 10
            done
            test "$matched" = true
          }

          verify_final "index.html" "index.html" "index.html"
          verify_final "data/quality.json" "data/quality.json" "quality.json"
          verify_final "records/UC-178/" "records/UC-178/index.html" "UC-178.html"
          verify_final "records/UC-684/" "records/UC-684/index.html" "UC-684.html"
          verify_final "records/UC-338/" "records/UC-338/index.html" "UC-338.html"
          verify_final "images/uc-178-still-2d6360659016.jpg" "images/uc-178-still-2d6360659016.jpg" "UC-178.jpg"
          verify_final "images/uc-684-portrait-1a2d9a32dbbc.jpg" "images/uc-684-portrait-1a2d9a32dbbc.jpg" "UC-684.jpg"
          verify_final "images/uc-338-still-fe30c21c2a17.jpg" "images/uc-338-still-fe30c21c2a17.jpg" "UC-338.jpg"
          verify_final "$RECEIPT" "$RECEIPT" "release-receipt.json"
          verify_final "preservation/SNAPSHOTS.json" "preservation/SNAPSHOTS.json" "preservation-registry.json"

      - name: Publish terminal release custody on the merged PR
        env:
          RELEASE_HEAD: ${{ steps.release.outputs.release_head }}
          PRESERVATION_HEAD: ${{ steps.preservation.outputs.preservation_head }}
          SNAPSHOT_ID: ${{ steps.preservation.outputs.snapshot_id }}
          SNAPSHOT_STATUS: ${{ steps.preservation.outputs.snapshot_status }}
          RELEASE_TAG: ${{ steps.preservation.outputs.release_tag }}
          PRESERVATION_RUN: ${{ steps.preservation.outputs.run_id }}
          PRESERVATION_URL: ${{ steps.preservation.outputs.run_url }}
          FINAL_PAGES_RUN: ${{ steps.final_pages.outputs.run_id }}
          FINAL_PAGES_URL: ${{ steps.final_pages.outputs.run_url }}
        run: |
          set -euo pipefail
          cat > /tmp/estate-release-closure.md <<EOF
          ## Estate release closure

          The merged estate is deployed, byte-verified, and preservation-reconciled.

          \`\`\`text
          merged main commit:       ${AUTHORIZED_MERGE}
          receipted release head:   ${RELEASE_HEAD}
          preservation main head:  ${PRESERVATION_HEAD}
          preservation snapshot:   ${SNAPSHOT_ID}
          snapshot status:         ${SNAPSHOT_STATUS}
          public release tag:      ${RELEASE_TAG}
          preservation run:        ${PRESERVATION_RUN}
          final Pages run:         ${FINAL_PAGES_RUN}
          \`\`\`

          Exact live-byte checks passed for the wall, quality ledger, UC-178, UC-684, UC-338, all three adopted media assets, the release receipt, and the preservation registry. The one-shot finalizer retired itself before preservation; no release mutation workflow remains on \`main\`.

          Preservation workflow: ${PRESERVATION_URL}
          Pages workflow: ${FINAL_PAGES_URL}
          Live site: ${LIVE_ORIGIN}/
          EOF
          gh pr comment 132 --repo "$GITHUB_REPOSITORY" --body-file /tmp/estate-release-closure.md
          cat /tmp/estate-release-closure.md >> "$GITHUB_STEP_SUMMARY"
