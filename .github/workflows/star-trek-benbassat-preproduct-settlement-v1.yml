name: star-trek-benbassat-preproduct-settlement-v1

on:
  push:
    branches:
      - agent/star-trek-benbassat-preproduct-settlement-v1

permissions:
  contents: write

concurrency:
  group: star-trek-benbassat-preproduct-settlement-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  EXPECTED_TREE: 7f9057770c8e622d71ef41b183811fe47fcdd6ed
  TASK_ID: ap_dd7d1c73ed237230cd6e1d0b
  EXPECTED_PERFORMER: Nolan North
  EXPECTED_CHARACTER: Benbassat
  EXPECTED_FINGERPRINT: 78e1384a3a11787064f98516e5759b55b33369d161067804c2d77f2ef6ef8885
  WALL_ID: UC-1397
  SOURCE_BRANCH: agent/star-trek-benbassat-source-result-v3
  SOURCE_PREFIX: transport/star-trek-benbassat-source-v3
  REVIEW_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  REVIEW_PREFIX: transport/star-trek-benbassat-source-review-v1
  CLAIM_BRANCH: agent/star-trek-benbassat-claim-result-v1
  MEDIA_BRANCH: agent/star-trek-benbassat-media-result-v1
  MEDIA_PREFIX: transport/star-trek-benbassat-media-v1
  RESULT_BRANCH: agent/star-trek-benbassat-preproduct-settlement-result-v1
  OUT: /tmp/star-trek-benbassat-preproduct-settlement-v1

jobs:
  settle:
    name: settle-benbassat-preproduct-boundary
    if: ${{ github.event.head_commit.message == 'Settle Star Trek Benbassat preproduct v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and verify every immutable layer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/source" "$OUT/review" "$OUT/media"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git fetch --no-tags origin main "$SOURCE_BRANCH" "$REVIEW_BRANCH" "$CLAIM_BRANCH" "$MEDIA_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"

          extract_layer() {
            local branch="$1" prefix="$2" target="$3"
            git archive "refs/remotes/origin/${branch}" "$prefix" | tar -x -C "$OUT"
            cp -a "$OUT/$prefix"/. "$target"/
            while read -r digest original_path; do
              file="$target/$(basename "$original_path")"
              test -f "$file"
              test "$(sha256sum "$file" | awk '{print $1}')" = "$digest"
            done < "$target/manifest.sha256"
          }

          extract_layer "$SOURCE_BRANCH" "$SOURCE_PREFIX" "$OUT/source"
          extract_layer "$REVIEW_BRANCH" "$REVIEW_PREFIX" "$OUT/review"
          extract_layer "$MEDIA_BRANCH" "$MEDIA_PREFIX" "$OUT/media"

          source_ref="refs/remotes/origin/${SOURCE_BRANCH}"
          review_ref="refs/remotes/origin/${REVIEW_BRANCH}"
          claim_ref="refs/remotes/origin/${CLAIM_BRANCH}"
          media_ref="refs/remotes/origin/${MEDIA_BRANCH}"
          printf '%s\n' "$(git rev-parse "$source_ref")" > "$OUT/source-commit.txt"
          printf '%s\n' "$(git rev-parse "$review_ref")" > "$OUT/review-commit.txt"
          printf '%s\n' "$(git rev-parse "$claim_ref")" > "$OUT/claim-commit.txt"
          printf '%s\n' "$(git show -s --format=%T "$claim_ref")" > "$OUT/claim-tree.txt"
          printf '%s\n' "$(git rev-parse "$media_ref")" > "$OUT/media-commit.txt"
          test "$(git show -s --format=%P "$claim_ref")" = "$EXPECTED_MAIN"

          jq -e \
            --arg task "$TASK_ID" \
            --arg performer "$EXPECTED_PERFORMER" \
            --arg character "$EXPECTED_CHARACTER" \
            --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-SOURCE-PROBE-V3"
             and .status == "source-frozen-pending-performance-mode-review"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.status == "queued"
             and .task.attempts == 0
             and .canonical_mutation == false
             and .lease_taken == false' \
            "$OUT/source/source-probe.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" \
            --arg performer "$EXPECTED_PERFORMER" \
            --arg character "$EXPECTED_CHARACTER" \
            --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-SOURCE-REVIEW-V1"
             and .verdict == "pass"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .adjudication.performance_mode == "voice-animation"
             and .adjudication.physical_prosthetic_hint_accepted == false
             and .adjudication.physical_performance_attributed == false
             and .adjudication.prosthetic_performance_attributed == false
             and .adjudication.maker_attribution == "unresolved"
             and .boundary.canonical_mutation == false
             and .boundary.lease_taken == false
             and .boundary.product_staged == false' \
            "$OUT/review/source-review.json" >/dev/null

          git checkout --detach "$claim_ref"
          test -f data/review/adapter-sdk/star-trek-benbassat-claim.json
          cp data/review/adapter-sdk/star-trek-benbassat-claim.json "$OUT/claim-receipt.json"
          jq -e \
            --arg task "$TASK_ID" \
            --arg performer "$EXPECTED_PERFORMER" \
            --arg character "$EXPECTED_CHARACTER" \
            --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-CLAIM-V1"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.status == "leased"
             and (.lease.id | type == "string" and length > 0)
             and .source_review.verdict == "pass"
             and .source_review.performance_mode == "voice-animation"
             and .queue.before.in_flight == 0
             and .queue.after.in_flight == 1
             and .boundary.additional_lease_issued == false
             and .boundary.canonical_mutation == false
             and .boundary.product_staged == false' \
            "$OUT/claim-receipt.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" \
            --arg performer "$EXPECTED_PERFORMER" \
            --arg character "$EXPECTED_CHARACTER" \
            --arg fp "$EXPECTED_FINGERPRINT" \
            --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-MEDIA-V1"
             and .status == "complete"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.performance_mode == "voice-animation"
             and .task.wall_id_reserved == $wall
             and (.facets.still.status == "verified" or .facets.still.status == "absent")
             and (.facets.portrait.status == "verified" or .facets.portrait.status == "absent")
             and .boundary.source_distinct == true
             and .boundary.byte_distinct == true
             and .boundary.physical_performance_attributed == false
             and .boundary.prosthetic_performance_attributed == false
             and .boundary.maker_attribution == "unresolved"
             and .boundary.facial_recognition_used == false
             and .boundary.cross_facet_substitution == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false' \
            "$OUT/media/media-receipt.json" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          out = Path(os.environ['OUT'])

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          checks = [
              (out / 'source/source-probe.json', 'receipt_sha256', ('artifact',)),
              (out / 'review/source-review.json', 'review_sha256', ('artifact',)),
              (out / 'claim-receipt.json', 'receipt_sha256', ()),
              (out / 'media/media-receipt.json', 'receipt_sha256', ('artifact',)),
          ]
          for path, field, extras in checks:
              payload = json.loads(path.read_text())
              expected = payload[field]
              body = dict(payload)
              body.pop(field, None)
              for key in extras:
                  body.pop(key, None)
              actual = hashlib.sha256((json.dumps(stable(body), indent=2, ensure_ascii=False) + '\n').encode()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'{path.name} identity mismatch: {actual} != {expected}')
          PY

          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const trek = state.jobs.filter((row) => row.scope === 'star-trek');
          const task = trek.find((row) => row.id === process.env.TASK_ID);
          const counts = {
            total: trek.length,
            queued: trek.filter((row) => row.status === 'queued').length,
            resolved: trek.filter((row) => row.status === 'resolved').length,
            blocked: trek.filter((row) => row.status === 'blocked').length,
            rejected: trek.filter((row) => row.status === 'rejected').length,
            in_flight: trek.filter((row) => ['leased','drafted','merged'].includes(row.status)).length,
          };
          const active = trek.filter((row) => ['leased','drafted','merged'].includes(row.status));
          if (!task || task.status !== 'leased' || !task.lease?.id) throw new Error('Benbassat durable lease drifted');
          if (task.performer !== process.env.EXPECTED_PERFORMER || task.character !== process.env.EXPECTED_CHARACTER || task.source_fingerprint !== process.env.EXPECTED_FINGERPRINT) throw new Error('Benbassat durable identity drifted');
          const expected = {total:2228,queued:1797,resolved:428,blocked:0,rejected:2,in_flight:1};
          if (JSON.stringify(counts) !== JSON.stringify(expected)) throw new Error(`claim queue drifted: ${JSON.stringify(counts)}`);
          if (active.length !== 1 || active[0].id !== process.env.TASK_ID) throw new Error('more than one Star Trek task is active');
          fs.writeFileSync(process.env.OUT + '/durable-claim-state.json', JSON.stringify({task, counts, active}, null, 2) + '\n');
          NODE

          git diff --name-only "$EXPECTED_MAIN..HEAD" | LC_ALL=C sort > "$OUT/claim-commit-paths.txt"
          test -s "$OUT/claim-commit-paths.txt"
          test "$(grep -c '^data/review/adapter-sdk/star-trek-benbassat-claim.json$' "$OUT/claim-commit-paths.txt")" = 1
          if grep -R --exclude='star-trek-benbassat-claim.json' -n --fixed-strings "$WALL_ID" data records 2>/dev/null; then
            echo "Benbassat product was staged before settlement" >&2
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-readback.json"
          test "$(jq -r .commit.sha "$OUT/main-readback.json")" = "$EXPECTED_MAIN"

      - name: Build pre-product settlement receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          out = Path(os.environ['OUT'])
          source = json.loads((out / 'source/source-probe.json').read_text())
          review = json.loads((out / 'review/source-review.json').read_text())
          claim = json.loads((out / 'claim-receipt.json').read_text())
          media = json.loads((out / 'media/media-receipt.json').read_text())
          durable = json.loads((out / 'durable-claim-state.json').read_text())
          main = json.loads((out / 'main-readback.json').read_text())

          settlement = {
              'version': 1,
              'transaction': 'STAR-TREK-BENBASSAT-PREPRODUCT-SETTLEMENT-V1',
              'settled_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'status': 'preproduct-ready',
              'canonical': {
                  'commit': os.environ['EXPECTED_MAIN'],
                  'tree': os.environ['EXPECTED_TREE'],
                  'readback': main['commit']['sha'],
                  'mutated_by_settler': False,
              },
              'layers': {
                  'source': {
                      'branch': os.environ['SOURCE_BRANCH'],
                      'commit': (out / 'source-commit.txt').read_text().strip(),
                      'receipt_sha256': source['receipt_sha256'],
                      'revision': source['source_revision'],
                  },
                  'source_review': {
                      'branch': os.environ['REVIEW_BRANCH'],
                      'commit': (out / 'review-commit.txt').read_text().strip(),
                      'review_sha256': review['review_sha256'],
                      'verdict': review['verdict'],
                      'performance_mode': review['adjudication']['performance_mode'],
                  },
                  'claim': {
                      'branch': os.environ['CLAIM_BRANCH'],
                      'commit': (out / 'claim-commit.txt').read_text().strip(),
                      'tree': (out / 'claim-tree.txt').read_text().strip(),
                      'receipt_sha256': claim['receipt_sha256'],
                      'lease_id': claim['lease']['id'],
                      'changed_paths': (out / 'claim-commit-paths.txt').read_text().splitlines(),
                  },
                  'media': {
                      'branch': os.environ['MEDIA_BRANCH'],
                      'commit': (out / 'media-commit.txt').read_text().strip(),
                      'receipt_sha256': media['receipt_sha256'],
                      'still': media['facets']['still'],
                      'portrait': media['facets']['portrait'],
                  },
              },
              'task': {
                  'id': os.environ['TASK_ID'],
                  'lease_id': durable['task']['lease']['id'],
                  'performer': os.environ['EXPECTED_PERFORMER'],
                  'character': os.environ['EXPECTED_CHARACTER'],
                  'source_fingerprint': os.environ['EXPECTED_FINGERPRINT'],
                  'status': durable['task']['status'],
                  'attempts': durable['task'].get('attempts', 0),
                  'wall_id_reserved': os.environ['WALL_ID'],
              },
              'queue': durable['counts'],
              'adjudication': {
                  'performance_mode': 'voice-animation',
                  'queued_physical_prosthetic_hint_rejected': True,
                  'physical_performance_attributed': False,
                  'prosthetic_performance_attributed': False,
                  'maker_attribution': 'unresolved',
                  'transformation_measured': False,
              },
              'boundary': {
                  'source_frozen': True,
                  'independent_source_reviewed': True,
                  'single_lease_durable': True,
                  'media_facets_complete': True,
                  'product_staged': False,
                  'wall_record_created': False,
                  'waterline_cycle_recorded': False,
                  'canonical_mutation': False,
                  'additional_lease_issued': False,
              },
              'next_operation': 'stage-one-reviewed-benbassat-candidate',
          }

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          body = json.dumps(stable(settlement), indent=2, ensure_ascii=False) + '\n'
          settlement['settlement_sha256'] = hashlib.sha256(body.encode()).hexdigest()
          (out / 'settlement.json').write_text(json.dumps(stable(settlement), indent=2, ensure_ascii=False) + '\n')
          (out / 'verdict.txt').write_text(
              'PASS\n'
              'Benbassat pre-product boundary is ready\n'
              f"Task {settlement['task']['id']}\n"
              f"Lease {settlement['task']['lease_id']}\n"
              f"Mode {settlement['adjudication']['performance_mode']}\n"
              f"Wall reservation {settlement['task']['wall_id_reserved']}\n"
              'Canonical mutation false\n'
              'Additional lease false\n'
              'Next stage-one-reviewed-benbassat-candidate\n'
          )
          PY
          jq -e \
            --arg task "$TASK_ID" \
            --arg performer "$EXPECTED_PERFORMER" \
            --arg character "$EXPECTED_CHARACTER" \
            --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-PREPRODUCT-SETTLEMENT-V1"
             and .status == "preproduct-ready"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.status == "leased"
             and .task.wall_id_reserved == $wall
             and .queue.in_flight == 1
             and .adjudication.performance_mode == "voice-animation"
             and .adjudication.queued_physical_prosthetic_hint_rejected == true
             and .boundary.source_frozen == true
             and .boundary.independent_source_reviewed == true
             and .boundary.single_lease_durable == true
             and .boundary.media_facets_complete == true
             and .boundary.product_staged == false
             and .boundary.wall_record_created == false
             and .boundary.waterline_cycle_recorded == false
             and .boundary.canonical_mutation == false
             and .boundary.additional_lease_issued == false
             and .next_operation == "stage-one-reviewed-benbassat-candidate"' \
            "$OUT/settlement.json" >/dev/null
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload Benbassat pre-product settlement
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-benbassat-preproduct-settlement-v1
          path: /tmp/star-trek-benbassat-preproduct-settlement-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable settlement result branch
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '.artifact={id:$id,digest:$digest}' "$OUT/settlement.json" > "$OUT/settlement.tmp"
          mv "$OUT/settlement.tmp" "$OUT/settlement.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-benbassat-preproduct-settler
          git config user.email undercast-benbassat-preproduct-settler@users.noreply.github.com
          git checkout --orphan benbassat-preproduct-settlement-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-benbassat-preproduct-settlement-v1
          cp -a "$OUT"/. transport/star-trek-benbassat-preproduct-settlement-v1/
          git add transport/star-trek-benbassat-preproduct-settlement-v1
          git commit -m 'Record Star Trek Benbassat pre-product settlement v1'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
