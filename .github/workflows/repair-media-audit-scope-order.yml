name: repair-media-audit-scope-order

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-media-audit-scope-order.yml"
      - "scripts/repair-media-audit-scope-order.mjs"

permissions:
  contents: write

concurrency:
  group: repair-media-audit-scope-order-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  PILOT_MERGE: 546cce8f8f64ec481a41d91a643e4ded943b653f
  RECOVERY_PARENT: 75fd0a46d8201aae092df39cc6eabdbb48226cd7
  SELF: .github/workflows/repair-media-audit-scope-order.yml
  REPAIR_SCRIPT: scripts/repair-media-audit-scope-order.mjs

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact defective main and capture the pre-repair estate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --depth=8 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          actual_main="$(git rev-parse refs/remotes/origin/main)"
          actual_branch="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
          printf 'expected main: %s\nactual main:   %s\nexpected head: %s\nactual head:   %s\n' \
            "$EXACT_MAIN" "$actual_main" "$AUTHORIZED_HEAD" "$actual_branch"
          test "$actual_main" = "$EXACT_MAIN"
          test "$actual_branch" = "$AUTHORIZED_HEAD"
          git merge-base --is-ancestor "$EXACT_MAIN" HEAD
          git merge-base --is-ancestor "$PILOT_MERGE" "$EXACT_MAIN"
          git cat-file -e "${RECOVERY_PARENT}:data/MEDIA-AUDIT.json"

          cp data/MEDIA-AUDIT-SCOPES.json /tmp/media-audit-scopes-before.json
          cp data/MEDIA-AUDIT.json /tmp/media-audit-before.json
          sha256sum \
            data/specimens.json \
            data/SOURCES.json \
            data/AUTOPILOT.json \
            data/WATERLINE-STATE.json \
            data/ROADMAP-STATE.json > /tmp/canonical-before.sha256
          node scripts/media-audit.mjs status --scope star-trek --json > /tmp/star-trek-before.json
          node scripts/media-audit.mjs status --scope doctor-who --json > /tmp/doctor-who-before.json
          node - <<'NODE'
          const fs = require('fs');
          const scopes = JSON.parse(fs.readFileSync('/tmp/media-audit-scopes-before.json', 'utf8')).scopes.map((row) => row.id);
          const star = JSON.parse(fs.readFileSync('/tmp/star-trek-before.json', 'utf8'));
          if (scopes.join('|') !== 'doctor-who|sitewide|star-trek') throw new Error(`unexpected defective scope order: ${scopes.join('|')}`);
          if (star.total !== 0 || star.complete !== 0) throw new Error(`expected merged 0/0 Star Trek denominator, found ${JSON.stringify(star)}`);
          NODE

          repair_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          echo "REPAIR_AT=$repair_at" >> "$GITHUB_ENV"

      - name: Recover the exact vote estate and harden specific-scope routing
        run: |
          set -euo pipefail
          node "$REPAIR_SCRIPT" apply
          node --check scripts/lib/media-audit.mjs
          node --check scripts/media-audit.mjs
          node --check scripts/media-audit-fixtures.mjs
          node --check scripts/doctor-who-pilot-cycle.mjs
          node scripts/media-audit-fixtures.mjs
          npm run doctor-who:pilot-cycle:check
          sha256sum -c /tmp/canonical-before.sha256

          git add \
            data/MEDIA-AUDIT-SCOPES.json \
            data/MEDIA-AUDIT.json \
            data/review/adapter-sdk/doctor-who-pilot-cycle-001.json \
            scripts/doctor-who-pilot-cycle.mjs \
            scripts/lib/media-audit.mjs \
            scripts/media-audit-fixtures.mjs \
            scripts/media-audit.mjs
          git diff --cached --check

      - name: Smoke the complete recovered candidate before creating a receipt
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee /tmp/media-audit-scope-order-candidate-gate.log
          npm run doctor-who:pilot-cycle:check
          node scripts/media-audit.mjs status --scope star-trek
          node scripts/media-audit.mjs status --scope doctor-who
          sha256sum -c /tmp/canonical-before.sha256

      - name: Create the post-smoke receipt and qualify its exact tree
        env:
          CANDIDATE_GATE_LOG: /tmp/media-audit-scope-order-candidate-gate.log
        run: |
          set -euo pipefail
          node "$REPAIR_SCRIPT" receipt
          git add data/review/adapter-sdk/doctor-who-pilot-cycle-001-media-scope-repair.json
          git diff --cached --check

          npm run gate 2>&1 | tee /tmp/media-audit-scope-order-final-gate.log
          npm run doctor-who:pilot-cycle:check
          node scripts/media-audit.mjs status --scope star-trek
          node scripts/media-audit.mjs status --scope doctor-who
          sha256sum -c /tmp/canonical-before.sha256

      - name: Publish the exact workflow-free repair under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm "$SELF" "$REPAIR_SCRIPT"
          git add -A
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch --depth=8 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Media audit: restore specific-scope precedence' \
            -m 'recover the exact pre-pilot Star Trek votes and denominator' \
            -m 'retain the completed Doctor Who cycle and issue no new lease'
          new_head="$(git rev-parse HEAD)"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/MEDIA-AUDIT-SCOPES.json
          data/MEDIA-AUDIT.json
          data/review/adapter-sdk/doctor-who-pilot-cycle-001-media-scope-repair.json
          data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
          scripts/doctor-who-pilot-cycle.mjs
          scripts/lib/media-audit.mjs
          scripts/media-audit-fixtures.mjs
          scripts/media-audit.mjs
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt
          git diff --stat refs/remotes/origin/main...HEAD > /tmp/final-stat.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"
          echo "base_sha=${EXACT_MAIN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload defect, recovery, gate, receipt, and path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-audit-scope-order-repair-${{ github.run_id }}
          path: |
            /tmp/media-audit-scopes-before.json
            /tmp/star-trek-before.json
            /tmp/doctor-who-before.json
            /tmp/star-trek-after.json
            /tmp/doctor-who-after.json
            /tmp/media-audit-scope-order-candidate-gate.log
            /tmp/media-audit-scope-order-final-gate.log
            /tmp/final-paths.txt
            /tmp/final-stat.txt
            data/review/adapter-sdk/doctor-who-pilot-cycle-001-media-scope-repair.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
