name: doctor-who-cycle-005-kaarsh-still-reattestation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-005-kaarsh-still-reattestation.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-005-kaarsh-still-reattestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-005-kaarsh-still-reattestation.yml
  EXACT_MAIN: 3b07edf7768478dba1e94ddda8471748aef34e50
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  PREFLIGHT_RUN: "30884868963"
  PREFLIGHT_ARTIFACT: doctor-who-cycle-005-preflight-30884868963
  PREFLIGHT_ARTIFACT_SHA256: bcf901d245e86e29dace2c3b890e6992948445f18d6e7abb6444413e31bb9d65
  ORIGINAL_RUN: "30882227014"
  ORIGINAL_ARTIFACT: doctor-who-cycle-005-kaarsh-still-verification-30882227014
  ORIGINAL_ARTIFACT_SHA256: 9c2165fae79d72fd3d40d4c5e407b5e64262f229d8d4cff2ba0d5aa3b1a7868c
  PREFLIGHT: /tmp/doctor-who-cycle-005-preflight-current
  ORIGINAL: /tmp/doctor-who-cycle-005-kaarsh-original-verification
  OUT: /tmp/doctor-who-cycle-005-kaarsh-still-reattestation

jobs:
  reattest:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 256

      - name: Bind exact current main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=256 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test -z "$(git status --porcelain)"

      - name: Download exact current preflight
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT }}
          path: ${{ env.PREFLIGHT }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.PREFLIGHT_RUN }}

      - name: Download exact original Kaarsh media verification
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORIGINAL_ARTIFACT }}
          path: ${{ env.ORIGINAL }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.ORIGINAL_RUN }}

      - name: Re-attest exact source and media custody to current main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test -f "$PREFLIGHT/selected-task.json"
          test -f "$PREFLIGHT/source-01.wikitext"
          test -f "$ORIGINAL/verification.json"
          test -f "$ORIGINAL/kaarsh-still-candidate.jpg"
          test -f "$ORIGINAL/source-image.bin"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const preflight = JSON.parse(fs.readFileSync(`${process.env.PREFLIGHT}/selected-task.json`, 'utf8'));
          const original = JSON.parse(fs.readFileSync(`${process.env.ORIGINAL}/verification.json`, 'utf8'));
          const currentSource = fs.readFileSync(`${process.env.PREFLIGHT}/source-01.wikitext`);
          const originalSource = fs.readFileSync(`${process.env.ORIGINAL}/source-01.wikitext`);
          const candidate = fs.readFileSync(`${process.env.ORIGINAL}/kaarsh-still-candidate.jpg`);
          const sourceImage = fs.readFileSync(`${process.env.ORIGINAL}/source-image.bin`);

          if (preflight.exact_main !== process.env.EXACT_MAIN || preflight.lease_issued !== false) throw new Error('current preflight custody drifted');
          if (preflight.task?.id !== 'ap_ed7221a03fdd4679379e23f8' || preflight.task?.status !== 'queued') throw new Error('current Kaarsh task drifted');
          if (preflight.task?.performer !== 'Dan Starkey' || preflight.task?.character !== 'Kaarsh') throw new Error('current performer-role drifted');
          if (preflight.task?.source_fingerprint !== 'ba3075acf7a348064e8e11359afa0ecc35fa231f8867e8c9496e101884366d43') throw new Error('current Kaarsh fingerprint drifted');
          if (preflight.queue?.queued !== 312 || preflight.queue?.resolved !== 4) throw new Error('current Doctor Who denominator drifted');
          const receipt = preflight.task?.source_receipts?.[0];
          if (!receipt || receipt.pageid !== 89948 || receipt.revision !== 2331498 || receipt.content_sha256 !== 'a656f352afef65b58a8945b08b0fbf869c6943a932125643cb60e236ff7cd3d4') throw new Error('current source receipt drifted');
          if (!currentSource.equals(originalSource) || sha256(currentSource) !== receipt.content_sha256) throw new Error('revision-bound source body drifted');

          if (original.task_id !== preflight.task.id || original.source_fingerprint !== preflight.task.source_fingerprint) throw new Error('original verification task binding drifted');
          if (original.file_title !== 'File:Kaarsh.jpg' || original.file_page_id !== 91567) throw new Error('original file-page custody drifted');
          if (original.source_sha256 !== 'e1300bbbea2f5bde0cfb6596b30e37f97018299bedf131514001e0ed996492da' || sha256(sourceImage) !== original.source_sha256) throw new Error('original source-image bytes drifted');
          if (original.candidate?.sha256 !== 'ccf68328d7cbb9a84844b4693c0e3029fb1200d5869513b0ecf68d7228af0cad' || sha256(candidate) !== original.candidate.sha256) throw new Error('review candidate bytes drifted');
          if (original.candidate?.width !== 640 || original.candidate?.height !== 373 || original.candidate?.bytes !== 41459) throw new Error('review candidate geometry drifted');
          if (original.boundary?.exact_file_named_by_revision_bound_source !== true || original.boundary?.generic_sontaran_substitution !== false || original.boundary?.candidate_adopted !== false || original.boundary?.lease_issued !== false) throw new Error('original media boundary drifted');

          const report = {
            version: 2,
            exact_main: process.env.EXACT_MAIN,
            task_id: preflight.task.id,
            performer: preflight.task.performer,
            character: preflight.task.character,
            performance_modes: preflight.task.performance_modes,
            source_page: receipt.source,
            source_page_id: receipt.pageid,
            source_revision: receipt.revision,
            source_content_sha256: receipt.content_sha256,
            source_fingerprint: preflight.task.source_fingerprint,
            file_title: original.file_title,
            file_page_id: original.file_page_id,
            file_description_url: original.file_description_url,
            original_url: original.original_url,
            source_width: original.api_width,
            source_height: original.api_height,
            source_bytes: sourceImage.length,
            source_sha256: sha256(sourceImage),
            candidate: {
              ...original.candidate,
              sha256: sha256(candidate),
              bytes: candidate.length,
            },
            visual_adjudication: {
              value: 'expected-character-depiction',
              note: 'Exact revision-named single-character Kaarsh game still; no logo, cover art, collage, or generic Sontaran substitution.',
              biometric_inference_used: false,
            },
            current_preflight: {
              run: Number(process.env.PREFLIGHT_RUN),
              artifact: process.env.PREFLIGHT_ARTIFACT,
              artifact_sha256: process.env.PREFLIGHT_ARTIFACT_SHA256,
              selection_sha256: fs.readFileSync(`${process.env.PREFLIGHT}/selection-sha256.txt`, 'utf8').trim(),
              queue: preflight.queue,
            },
            original_verification: {
              run: Number(process.env.ORIGINAL_RUN),
              artifact: process.env.ORIGINAL_ARTIFACT,
              artifact_sha256: process.env.ORIGINAL_ARTIFACT_SHA256,
              exact_main: original.exact_main,
            },
            boundary: {
              exact_file_named_by_revision_bound_source: true,
              byte_identity_unchanged: true,
              current_repository_duplicate: false,
              performer_portrait_reuse_authorized: false,
              generic_sontaran_substitution: false,
              candidate_adopted: false,
              lease_issued: false,
              repository_mutated: false,
            },
          };
          fs.writeFileSync(`${process.env.OUT}/verification.json`, `${JSON.stringify(report, null, 2)}\n`);
          fs.copyFileSync(`${process.env.ORIGINAL}/kaarsh-still-candidate.jpg`, `${process.env.OUT}/kaarsh-still-candidate.jpg`);
          fs.copyFileSync(`${process.env.ORIGINAL}/source-image.bin`, `${process.env.OUT}/source-image.bin`);
          fs.copyFileSync(`${process.env.PREFLIGHT}/source-01.wikitext`, `${process.env.OUT}/source-01.wikitext`);
          fs.copyFileSync(`${process.env.PREFLIGHT}/selected-task.json`, `${process.env.OUT}/selected-task.json`);
          NODE

          candidate_sha256="$(sha256sum "$OUT/kaarsh-still-candidate.jpg" | awk '{print $1}')"
          find images -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/current-image-sha256.txt"
          ! grep -Fq "$candidate_sha256" "$OUT/current-image-sha256.txt"
          sha256sum "$OUT"/* > "$OUT/all-files.sha256.tmp"
          mv "$OUT/all-files.sha256.tmp" "$OUT/all-files.sha256"
          cp /tmp/expected-paths.txt "$OUT/"
          cp /tmp/actual-paths.txt "$OUT/"
          printf '%s\n' "$EXACT_MAIN" > "$OUT/exact-main.txt"
          printf '%s\n' "$HEAD_SHA" > "$OUT/carrier-head.txt"
          test -z "$(git status --porcelain)"

      - name: Upload exact current-main Kaarsh re-attestation
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-005-kaarsh-still-reattestation-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: ${{ env.OUT }}
