name: apply-doctor-who-source-preservation-001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-doctor-who-source-preservation-001.yml"

permissions:
  contents: write

concurrency:
  group: apply-doctor-who-source-preservation-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  PRESERVED_COMMIT: 169391a8bf64562b5e6ac45bc6e122a2bc194e39
  SELF: .github/workflows/apply-doctor-who-source-preservation-001.yml
  REPAIR: .github/workflows/repair-doctor-who-preservation-readiness.yml
  RELEASE_TAG: preservation-doctor-who-169391a8bf64
  SOURCE_NAME: undercast-doctor-who-sources-169391a8bf64.tar.gz
  REPOSITORY_NAME: undercast-repository-169391a8bf64.tar.gz
  SOURCE_SHA256: a1be757a49298964862d41a9ca585ae91fc7ea121935f79f217e94a6fce331a7
  REPOSITORY_SHA256: 64731f7b041d2962da29e175da9b3d34df1bbc2d1e8de5187b0ec42d001e53ac
  SOURCE_UPLOAD_RUN: "30737218532"
  GH_TOKEN: ${{ github.token }}

jobs:
  preserve:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch, current main, and unpaid preservation ruling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          git cat-file -e "${PRESERVED_COMMIT}^{commit}"

          node scripts/doctor-who-activation-preflight.mjs check
          node - <<'NODE'
          const report = require('./data/review/adapter-sdk/doctor-who-activation-preflight-001.json');
          if (report.current.estate_state !== 'certified-paused' || report.current.scope_status !== 'paused') throw new Error('Doctor Who is not certified-paused');
          if (report.current.queue.total !== 316 || report.current.queue.claimable !== 0) throw new Error('paused queue denominator drifted');
          if (report.simulated_active.queue.claimable !== 316 || report.isolation.star_trek_changes !== 0) throw new Error('activation isolation proof drifted');
          if (report.decision.code !== 'source-preservation-before-activation') throw new Error(`unexpected incoming decision ${report.decision.code}`);
          if (report.preservation.require_source_snapshot || report.preservation.matching_receipt_present) throw new Error('incoming preservation debt is already paid');
          NODE

          sha256sum \
            data/specimens.json \
            data/CENSUS-COVERAGE.json \
            data/CENSUS-MANIFEST.json \
            data/AUTOPILOT.json > /tmp/canonical-before.sha256

      - name: Reconstitute and verify the smoke-passed release assets
        run: |
          set -euo pipefail
          rm -rf /tmp/doctor-who-release /tmp/doctor-who-source
          mkdir -p /tmp/doctor-who-release /tmp/doctor-who-source

          gh release download "$RELEASE_TAG" \
            --pattern "$SOURCE_NAME" \
            --dir /tmp/doctor-who-release \
            --repo "$GITHUB_REPOSITORY"

          source_archive="/tmp/doctor-who-release/$SOURCE_NAME"
          repository_archive="/tmp/doctor-who-release/$REPOSITORY_NAME"
          git archive --format=tar "$PRESERVED_COMMIT" | gzip -n -9 > "$repository_archive"
          test "$(sha256sum "$source_archive" | cut -d' ' -f1)" = "$SOURCE_SHA256"
          test "$(sha256sum "$repository_archive" | cut -d' ' -f1)" = "$REPOSITORY_SHA256"

          gh release view "$RELEASE_TAG" \
            --json tagName,targetCommitish,url,assets \
            --repo "$GITHUB_REPOSITORY" > /tmp/doctor-who-release.json
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('/tmp/doctor-who-release.json', 'utf8'));
          if (release.tagName !== process.env.RELEASE_TAG) throw new Error('release tag drifted');
          if (release.targetCommitish !== process.env.PRESERVED_COMMIT) throw new Error(`release target drifted: ${release.targetCommitish}`);
          const assets = new Map(release.assets.map((row) => [row.name, row]));
          const source = assets.get(process.env.SOURCE_NAME);
          const repository = assets.get(process.env.REPOSITORY_NAME);
          if (source?.digest !== `sha256:${process.env.SOURCE_SHA256}`) throw new Error(`source release digest drifted: ${source?.digest}`);
          if (repository?.digest !== `sha256:${process.env.REPOSITORY_SHA256}`) throw new Error(`repository release digest drifted: ${repository?.digest}`);
          NODE

          tar -xzf "$source_archive" -C /tmp/doctor-who-source
          bag_root="/tmp/doctor-who-source/doctor-who-source-bag"
          test -f "$bag_root/source-snapshot.json"
          node scripts/preserve-verify.mjs "$bag_root" --json > /tmp/doctor-who-source-verify.json

          BAG_ROOT="$bag_root" node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const snapshot = JSON.parse(fs.readFileSync(path.join(process.env.BAG_ROOT, 'source-snapshot.json'), 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/CENSUS-MANIFEST.json', 'utf8'));
          const doctor = snapshot.scopes?.['doctor-who'];
          if (snapshot.observations !== (manifest.observations || []).length) throw new Error('shared observation denominator drifted');
          if (snapshot.exact_revisions !== 1550 || snapshot.unique_source_urls !== 1550) throw new Error('exact source denominator drifted');
          if (!doctor || doctor.coverage_sources !== 298 || doctor.complete_receipts !== 298) throw new Error(`Doctor Who scope receipt is not 298/298: ${JSON.stringify(doctor)}`);
          if (doctor.manifest_sha256 !== '96202b4c128a3729fb7cf3e52b4c36f32a25a156c0df92d1aa379de99fb58f00') throw new Error(`scope manifest drifted: ${doctor.manifest_sha256}`);
          if (snapshot.repository_commit !== process.env.PRESERVED_COMMIT) throw new Error(`source bag commit drifted: ${snapshot.repository_commit}`);
          NODE

          {
            echo "BAG_ROOT=$bag_root"
            echo "SOURCE_ARCHIVE=$source_archive"
            echo "REPOSITORY_ARCHIVE=$repository_archive"
          } >> "$GITHUB_ENV"

      - name: Construct the preservation and paused re-certification candidate
        run: |
          set -euo pipefail
          node scripts/preserve-receipt.mjs \
            --source-receipt "$BAG_ROOT/source-snapshot.json" \
            --repository-snapshot "$REPOSITORY_ARCHIVE" \
            --source-archive "$SOURCE_ARCHIVE" \
            --release-tag "$RELEASE_TAG" \
            --repository-commit "$PRESERVED_COMMIT" \
            --workflow-run "$SOURCE_UPLOAD_RUN"

          node - <<'NODE'
          const fs = require('fs');
          const scopes = JSON.parse(fs.readFileSync('data/AUTOPILOT-SCOPES.json', 'utf8'));
          const scope = scopes.scopes.find((row) => row.id === 'doctor-who');
          if (!scope || scope.status !== 'paused') throw new Error('Doctor Who scope is missing or not paused');
          scope.certification.require_source_snapshot = true;
          scope.notes = 'Certified source-specific Tardis Wiki adapter. Exact source preservation is mandatory before activation; the scope remains paused until a separate lease-authority transaction.';
          fs.writeFileSync('data/AUTOPILOT-SCOPES.json', JSON.stringify(scopes, null, 2) + '\n');

          const registry = JSON.parse(fs.readFileSync('data/ESTATE-REGISTRY.json', 'utf8'));
          const estate = registry.estates.find((row) => row.id === 'doctor-who');
          if (!estate || estate.state !== 'certified-paused') throw new Error('Doctor Who estate is not certified-paused');
          estate.next_gate = 'Run a separately authorized activation transaction that preserves the exact 316-task denominator, issues at most one bounded Luna lease, and keeps canonical adoption and media review as separate payments.';
          fs.writeFileSync('data/ESTATE-REGISTRY.json', JSON.stringify(registry, null, 2) + '\n');
          NODE

          certified_at="$(node -p "require('${BAG_ROOT}/source-snapshot.json').created_at")"
          node scripts/autopilot.mjs certify \
            --scope doctor-who \
            --reviewed-by chatgpt-second-desk \
            --now "$certified_at"
          node scripts/census-adapter.mjs write
          node scripts/census-adapter.mjs check
          node scripts/doctor-who-activation-preflight.mjs write
          node scripts/doctor-who-activation-preflight.mjs check

          node - <<'NODE'
          const fs = require('fs');
          const snapshots = JSON.parse(fs.readFileSync('preservation/SNAPSHOTS.json', 'utf8'));
          const record = snapshots.snapshots.find((row) => row.id === process.env.RELEASE_TAG);
          const scopeReceipt = record?.scopes?.['doctor-who'];
          if (!record || record.status !== 'pending') throw new Error('pending Doctor Who preservation record is missing');
          if (record.repository_commit !== process.env.PRESERVED_COMMIT) throw new Error(`preservation record commit drifted: ${record.repository_commit}`);
          if (!scopeReceipt || scopeReceipt.coverage_sources !== 298 || scopeReceipt.complete_receipts !== 298) throw new Error('pending scope receipt is not 298/298');
          if (scopeReceipt.manifest_sha256 !== '96202b4c128a3729fb7cf3e52b4c36f32a25a156c0df92d1aa379de99fb58f00') throw new Error('pending scope manifest drifted');

          const scopes = JSON.parse(fs.readFileSync('data/AUTOPILOT-SCOPES.json', 'utf8'));
          const scope = scopes.scopes.find((row) => row.id === 'doctor-who');
          if (scope.status !== 'paused' || scope.certification.require_source_snapshot !== true) throw new Error('source-snapshot contract or pause boundary drifted');

          const certifications = JSON.parse(fs.readFileSync('data/AUTOPILOT-CERTIFICATIONS.json', 'utf8'));
          const certificate = certifications.certifications.find((row) => row.scope_id === 'doctor-who');
          if (!certificate || certificate.snapshot.rows !== 316 || certificate.snapshot.complete_receipts !== 298) throw new Error('re-certification denominator drifted');
          if (certificate.snapshot.source_snapshot_id !== process.env.RELEASE_TAG) throw new Error(`certificate did not bind source snapshot: ${certificate.snapshot.source_snapshot_id}`);
          if (certificate.snapshot.source_archive_sha256 !== process.env.SOURCE_SHA256) throw new Error('certificate source archive hash drifted');

          const preflight = JSON.parse(fs.readFileSync('data/review/adapter-sdk/doctor-who-activation-preflight-001.json', 'utf8'));
          if (preflight.current.queue.total !== 316 || preflight.current.queue.claimable !== 0) throw new Error('post-preservation paused queue drifted');
          if (preflight.simulated_active.queue.claimable !== 316 || preflight.isolation.star_trek_changes !== 0) throw new Error('post-preservation activation isolation drifted');
          if (!preflight.preservation.require_source_snapshot || !preflight.preservation.matching_receipt_present) throw new Error('post-preservation receipt is not effective');
          if (preflight.decision.code !== 'queue-and-preservation-preflight-passed') throw new Error(`preflight remains blocked: ${preflight.decision.code}`);
          if (preflight.boundary.real_lease_issued || preflight.boundary.estate_activation_authorized) throw new Error('preservation transaction acquired activation authority');
          NODE

          node scripts/preserve-status.mjs --json > /tmp/doctor-who-preservation-status.json
          node scripts/autopilot.mjs readiness --scope doctor-who > /tmp/doctor-who-readiness.txt 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/doctor-who-preservation-status.json', 'utf8'));
          const doctor = status.scopes.find((row) => row.scope_id === 'doctor-who');
          if (!doctor || doctor.sources !== 298 || doctor.archived !== true) throw new Error(`preservation status is not archived 298: ${JSON.stringify(doctor)}`);
          NODE

          sha256sum -c /tmp/canonical-before.sha256

      - name: Smoke the complete candidate before branch publication
        run: |
          set -euo pipefail
          git rm "$SELF" "$REPAIR"
          git add \
            data/AUTOPILOT-CERTIFICATIONS.json \
            data/AUTOPILOT-SCOPES.json \
            data/ESTATE-REGISTRY.json \
            data/journal/autopilot.jsonl \
            data/review/adapter-sdk/BASELINE.json \
            data/review/adapter-sdk/doctor-who-activation-preflight-001.json \
            preservation/SNAPSHOTS.json
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/doctor-who-preservation-finalizer-gate.log

      - name: Publish the workflow-free exact product under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          node scripts/doctor-who-activation-preflight.mjs check
          node scripts/estate-certification-fixtures.mjs
          node scripts/census-adapter.mjs check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Preservation: bind Doctor Who sources before activation' \
            -m 'retain the smoke-passed 1550-revision release and 298-source receipt' \
            -m 're-certify paused on current main and keep activation separate'
          new_head="$(git rev-parse HEAD)"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/AUTOPILOT-CERTIFICATIONS.json
          data/AUTOPILOT-SCOPES.json
          data/ESTATE-REGISTRY.json
          data/journal/autopilot.jsonl
          data/review/adapter-sdk/BASELINE.json
          data/review/adapter-sdk/doctor-who-activation-preflight-001.json
          preservation/SNAPSHOTS.json
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release, verification, gate, and path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-source-preservation-finalizer-${{ github.run_id }}
          path: |
            /tmp/doctor-who-release.json
            /tmp/doctor-who-source-verify.json
            /tmp/doctor-who-preservation-status.json
            /tmp/doctor-who-readiness.txt
            /tmp/doctor-who-preservation-finalizer-gate.log
            /tmp/final-paths.txt
            data/review/adapter-sdk/doctor-who-activation-preflight-001.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
