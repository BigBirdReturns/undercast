name: card-backfill-uc-040-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-040-RENDER.json"
      - "scripts/card-backfill-uc-040-render.mjs"
      - ".github/workflows/card-backfill-uc-040-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-040-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-003'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed portrait authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-040-RENDER.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-040'||row.actor!=='Tim Choate'||row.side!=='portrait'||row.reviewed_role!=='second-desk')throw new Error('UC-040 render authorization drift');
          if(row.gather_artifact?.artifact_id!==8633731478||row.gather_artifact?.head_sha!=='eccf1ea607d0f0d003694f595a30e470123f9c60')throw new Error('UC-040 gather custody drift');
          if(row.selection?.provider!=='MUBI'||row.selection?.sha256!=='6669fbe2284fb2f4651de3d1095b7a07c59b447d0768cc0ff675f6f8017e31c0')throw new Error('UC-040 selected portrait drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='performer-portrait'||row.ruling?.canonical_mutation!==false)throw new Error('UC-040 ruling drift');
          console.log('PASS — exact MUBI Tim Choate portrait and evidence-only ruling authorized');
          NODE
      - name: Retrieve and verify the exact gather artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-040-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8633731478/zip" > "$root/gather.zip"
          echo "7e986bbf9f0e7ef7394182530d2b4e01ffa1735c2432fefd61e1d190508811f8  $root/gather.zip" | sha256sum -c -
          unzip -q "$root/gather.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-040/manifest.json"
          echo "6669fbe2284fb2f4651de3d1095b7a07c59b447d0768cc0ff675f6f8017e31c0  $root/source/card-backfill-uc-040/candidates/02-mubi.webp" | sha256sum -c -
          echo "d72d01bb0a08fadcae4bb4faf5e08443394eb6fd3cb40cdc61f9e61b4e99f140  $root/source/card-backfill-uc-040/pages/mubi.png" | sha256sum -c -
      - name: Render the exact candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-040-render/source/card-backfill-uc-040
          OUT: ${{ runner.temp }}/card-backfill-uc-040-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-040-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-040-render/render.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-040-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-040-render/output
            ${{ runner.temp }}/card-backfill-uc-040-render/render.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
