name: star-trek-morgo-terminal-readback-v3

on:
  push:
    branches:
      - agent/star-trek-morgo-terminal-readback-recovery-v3

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-morgo-terminal-readback-v3
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  EXPECTED_TREE: 6d32c386636296e76bcab61baa387cb629967ac3
  EXPECTED_PARENT: 5e89a0ba59f36feae7986a9260b8fa17a824a8b7
  EXPECTED_MESSAGE: "Star Trek: publish Morgo cycle"
  RECEIPT_PATH: data/review/adapter-sdk/star-trek-morgo-cycle.json
  RECEIPT_SHA: bbaf8f35578fefe02e5497ed5b11c290dc139f5347cc09cc6a376214d88aaa89
  CHECKER_PATH: scripts/star-trek-morgo-cycle.mjs
  CHECKER_SHA: 96a01340a938ecaae780704947dd37ff4674dc797a45d901a8dee15bd99f9d26
  TASK_ID: ap_a7fb29c5cce85c86708ea0e6
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Morgo
  EXPECTED_FINGERPRINT: 279c816ebd1b83899f5b257f7880df5734bb855f4206c2fc92c5278c9370ff46
  EXPECTED_LEASE: lease_578930730585295673ca706d
  WALL_ID: UC-1398
  CYCLE_ID: cycle_cbd56708498f15573b441357
  CANDIDATE_COMMIT: 55e96dffe77c9562fa0b63c12cc58016db63754b
  CANDIDATE_RECEIPT_SHA: 3c5de16f13d0c758a1577e64b98007dc7c4968077fa45d66e8cea4d06eeb5295
  REVIEW_COMMIT: bac4761cd0704dfb935feafb781b01e25bf6d2df
  REVIEW_SHA: 1844a2f723931c348bc9659415b987b67d3b1449e62b8219484f9ad4a42173e0
  STILL_SHA: d9e6600f5b4c56540329bddd824b6d8392193f9c19cafebb6187d2872c21f548
  PORTRAIT_SHA: ae19bcd09869d848fd74202fcc3c59ac41dbef153f7a33844c278b91b8d4ea5f
  STILL_ITEM: ma_4cf320b41ba67ad4dbe2f5dd
  PORTRAIT_ITEM: ma_8254f59b1cc6004f0fa5f1a2
  PAGES_RUN_ID: 33019165708
  PAGES_JOB_ID: 98344940386
  NEXT_TASK_ID: ap_096624f177ae0c9f2e91836c
  NEXT_PERFORMER: Fred Tatasciore
  NEXT_CHARACTER: Risik
  NEXT_FINGERPRINT: 6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6
  RESULT_BRANCH: agent/star-trek-morgo-terminal-readback-result-v3
  VERIFIER_SOURCE: .github/recovery/star-trek-morgo-terminal-readback-v3/verifier.py
  VERIFIER: /tmp/star-trek-morgo-terminal-readback-v3.py
  OUT: /tmp/star-trek-morgo-terminal-readback-v3

jobs:
  verify:
    name: independently-verify-terminal-morgo-product-v3
    if: ${{ github.event.head_commit.message == 'Verify terminal Star Trek Morgo product v3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Seal and externalize the verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          while read -r digest relative; do
            test -f "$relative"
            test "$(sha256sum "$relative" | awk '{print $1}')" = "$digest"
          done < .github/recovery/star-trek-morgo-terminal-readback-v3/sealed-manifest.sha256
          cp "$VERIFIER_SOURCE" "$VERIFIER"
          chmod +x "$VERIFIER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["VERIFIER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Freeze canonical Git, Pages, and successor evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin "+refs/heads/main:refs/remotes/origin/main"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          main_tree="$(git show -s --format=%T "$main_commit")"
          main_parent="$(git show -s --format=%P "$main_commit")"
          main_message="$(git show -s --format=%s "$main_commit")"
          test "$main_commit" = "$EXPECTED_MAIN"
          test "$main_tree" = "$EXPECTED_TREE"
          test "$main_parent" = "$EXPECTED_PARENT"
          test "$main_message" = "$EXPECTED_MESSAGE"

          printf '%s\n' "$main_commit" > "$OUT/main-commit.txt"
          printf '%s\n' "$main_tree" > "$OUT/main-tree.txt"
          printf '%s\n' "$main_parent" > "$OUT/main-parent.txt"
          printf '%s\n' "$main_message" > "$OUT/main-message.txt"

          git checkout --detach "$main_commit"
          git clean -fdx
          npm ci --ignore-scripts

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}" > "$OUT/pages-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN_ID}/jobs?filter=latest&per_page=100" > "$OUT/pages-jobs.json"
          node scripts/thesis-rails.mjs next --json > "$OUT/next.json"
          python3 "$VERIFIER" inspect

      - name: Run canonical terminal gates
        shell: bash
        run: |
          set -Eeuo pipefail
          node "$CHECKER_PATH" | tee "$OUT/morgo-checker.log"
          node scripts/validate.mjs | tee "$OUT/repository-validate.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/waterline-validate.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

      - name: Write terminal readback receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$VERIFIER" receipt
          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-MORGO-TERMINAL-READBACK-V3"
             and .verdict == "pass"
             and .canonical.commit == env.EXPECTED_MAIN
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id == $wall
             and .queue == {total:2228,queued:1796,resolved:430,blocked:0,rejected:2,in_flight:0}
             and .pages.run_id == (env.PAGES_RUN_ID | tonumber)
             and .pages.job_id == (env.PAGES_JOB_ID | tonumber)
             and .pages.conclusion == "success"
             and .next.phase == "ready-for-one-cycle"
             and .next.candidate.task_id == env.NEXT_TASK_ID
             and .boundary.exact_head_deployment_complete == true
             and .boundary.queue_closed == true
             and .boundary.originating_lease_completed == true
             and .boundary.additional_lease_issued == false
             and .boundary.successor_claimed == false
             and .boundary.canonical_mutation_by_readback == false' \
            "$OUT/terminal-readback.json" >/dev/null
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload terminal readback evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-morgo-terminal-readback-v3
          path: /tmp/star-trek-morgo-terminal-readback-v3/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable terminal readback
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/terminal-readback.json" > "$OUT/readback.tmp"
          mv "$OUT/readback.tmp" "$OUT/terminal-readback.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-morgo-terminal-readback-v3
          git config user.email undercast-morgo-terminal-readback-v3@users.noreply.github.com
          git checkout --orphan morgo-terminal-readback-result-v3
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-morgo-terminal-readback-v3
          cp -a "$OUT"/. transport/star-trek-morgo-terminal-readback-v3/
          git add transport/star-trek-morgo-terminal-readback-v3
          git commit -m "Record Star Trek Morgo terminal readback v3"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
