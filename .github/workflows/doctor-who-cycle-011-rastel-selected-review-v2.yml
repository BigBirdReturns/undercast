      CARRIER: /tmp/doctor-who-cycle-011-rastel-selected-review-v2-carrier
      CONTROLLER_BLOB: 0f9fb818ed6aedcbf6f944a04e648499e15a940a
      CONTROLLER_GZIP_BYTES: "5662"
      CONTROLLER_GZIP_SHA256: 4a4ee8f161e457cd92aef200731953d6ac19fe6d3a4930d1977283678ccc96a4
      CONTROLLER_BYTES: "23320"
      CONTROLLER_SHA256: adc5d58966f32c10cfca1362852aa3daf7f5c987e3294fdb91dd01dc2aeb3ffc


    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct exact V2 denominator-repair controller
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/controller.sh.gz"
          test "$(wc -c < "$CARRIER/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$CARRIER/controller.sh.gz" > "$CARRIER/controller.sh"
          test "$(wc -c < "$CARRIER/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$CARRIER/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$CARRIER/controller.sh"
          CONTROLLER="$CARRIER/controller.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CONTROLLER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<selected-review-v2-controller-{index}>','exec')
          assert '${{' not in text
          PY

      - name: Execute exact V2 selected-candidate review
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$CARRIER/controller.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          "$CARRIER/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-selected-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-selected-review-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-selected-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2-source
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2-bootstrap
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2-recovery
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2-selection
            /tmp/doctor-who-cycle-011-rastel-selected-review-v2-carrier
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
