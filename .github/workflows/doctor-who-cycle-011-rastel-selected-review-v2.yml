    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-selected-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-selected-review-v2
  cancel-in-progress: true

