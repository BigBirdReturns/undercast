name: star-trek-risik-stage-runtime-extract-v1

on:
  push:
    branches:
      - agent/star-trek-risik-stage-runtime-extract-v1

permissions:
  contents: read

concurrency:
  group: star-trek-risik-stage-runtime-extract-v1
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 49b874152a57c1a8157bdb92b641c9889bda7a76
  SOURCE_TREE: 3415106a4085d43f8d27d85e962fa87b24465fcd
  PAYLOAD_PATH: .github/recovery/star-trek-morgo-stage-recovery-v3/payload.base64
  PAYLOAD_BLOB: 5af680f7d4de89d087494186e5f586577cb69382
  OUT: /tmp/star-trek-risik-stage-runtime-extract-v1

jobs:
  extract:
    name: extract-executed-morgo-stage-runtime
    if: ${{ github.event.head_commit.message == 'Extract proven Morgo stage runtime for Risik adaptation v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract exact sealed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_COMMIT")" = "$SOURCE_TREE"
          test "$(git rev-parse "$SOURCE_COMMIT:$PAYLOAD_PATH")" = "$PAYLOAD_BLOB"
          git show "$SOURCE_COMMIT:$PAYLOAD_PATH" > "$OUT/payload.base64"
          base64 -d "$OUT/payload.base64" > "$OUT/runtime.tar.gz"
          tar -tzf "$OUT/runtime.tar.gz" > "$OUT/runtime-files.txt"
          sha256sum "$OUT/payload.base64" "$OUT/runtime.tar.gz" > "$OUT/sha256.txt"

      - name: Upload exact stage runtime
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-stage-runtime-extract-v1
          path: /tmp/star-trek-risik-stage-runtime-extract-v1/
          if-no-files-found: error
          retention-days: 7
