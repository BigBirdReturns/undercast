name: repair-gredd-cycle-002-v2-yaml

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-gredd-cycle-002-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Repair only the escaped terminal-state serializer
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/complete-doctor-who-cycle-002-v2.yml
          self=.github/workflows/validate-gredd-cycle-002-v2.yml
          authorized_head="${{ github.event.pull_request.head.sha }}"
          target_branch="${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse HEAD)" = "$authorized_head"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "HEAD:$target")" = "1dabe5bbd073d429dc59851164fe81244f991796"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          text = path.read_text(encoding='utf-8')
          before = '''          const refreshedTerminalState = `runNode("scripts/census-adapter.mjs", ["write"]);
runNode("scripts/census-adapter.mjs", ["check"]);
runNode("scripts/autopilot.mjs", ["sync", "--scope", "doctor-who", "--now", context.timestamps.final_at]);
runNode("scripts/autopilot.mjs", ["validate"]);`;'''
          after = '''          const refreshedTerminalState = 'runNode("scripts/census-adapter.mjs", ["write"]);\\nrunNode("scripts/census-adapter.mjs", ["check"]);\\nrunNode("scripts/autopilot.mjs", ["sync", "--scope", "doctor-who", "--now", context.timestamps.final_at]);\\nrunNode("scripts/autopilot.mjs", ["validate"]);';'''
          if text.count(before) != 1:
              raise SystemExit(f'expected one malformed multiline serializer, found {text.count(before)}')
          text = text.replace(before, after)
          if text.count(after) != 1 or 'const refreshedTerminalState = `runNode' in text:
              raise SystemExit('terminal-state serializer repair did not close exactly')
          path.write_text(text, encoding='utf-8')
          PY

          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color "$target" | tee /tmp/actionlint.txt
          test ! -s /tmp/actionlint.txt
          git rm -f "$self"
          git add -- "$target"
          git diff --cached --check
          printf '%s\n' "$self" "$target" | sort > /tmp/expected-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          git commit \
            -m 'Doctor Who: close the Gredd v2 YAML serializer' \
            -m 'encode terminal adapter and Autopilot commands as explicit newline escapes' \
            -m 'self-delete the read-only validator without issuing a lease'
          repair_commit="$(git rev-parse HEAD)"
          echo "repair_commit=$repair_commit"
          printf '%s\n' "$repair_commit" > /tmp/repair-commit.txt

          git fetch --no-tags --depth=64 origin "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          test "$(git rev-parse refs/remotes/origin/${target_branch})" = "$authorized_head"
          git push origin "HEAD:refs/heads/${target_branch}" \
            --force-with-lease="refs/heads/${target_branch}:${authorized_head}"
      - name: Upload exact repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gredd-cycle-002-v2-yaml-repair-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/actionlint.txt
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/repair-commit.txt
