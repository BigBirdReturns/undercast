name: validate-gredd-cycle-002-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-gredd-cycle-002-v2.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Validate exact repaired writer
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/complete-doctor-who-cycle-002-v2.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          data = p.read_bytes()
          data.decode('utf-8')
          print(f'utf8_bytes={len(data)}')
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@latest -color "$target" | tee /tmp/actionlint.txt
          test ! -s /tmp/actionlint.txt
