name: card-backfill-uc-117-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json"
      - ".github/CARD-BACKFILL-UC-117-MEGATRON-PROBE-RESULT.json"
      - "scripts/card-backfill-uc-117-discover.mjs"
      - ".github/workflows/card-backfill-uc-117-discover.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-117-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-117 two-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json','utf8'));
          const probe=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-MEGATRON-PROBE-RESULT.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.actor!=='Frank Welker'||row.character!=='Megatron & Scooby-Doo'||row.production!=='Transformers / Scooby-Doo'||row.year!==1969||row.side!=='still')throw new Error('UC-117 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-117'||failures.failed_discovery_checkpoints?.length!==9||failures.failed_discovery_checkpoints[0]?.artifact_id!==8679182081||failures.failed_discovery_checkpoints[1]?.artifact_id!==8679321081||failures.failed_discovery_checkpoints[2]?.artifact_id!==8679471175||failures.failed_discovery_checkpoints[3]?.artifact_id!==8679691427||failures.failed_discovery_checkpoints[4]?.artifact_id!==8679875295||failures.failed_discovery_checkpoints[5]?.artifact_id!==8680175423||failures.failed_discovery_checkpoints[6]?.artifact_id!==8692380398||failures.failed_discovery_checkpoints[7]?.run_id!==30370923980||failures.failed_discovery_checkpoints[7]?.artifact_id!==null||failures.failed_discovery_checkpoints[8]?.artifact_id!==8693025021||failures.failed_discovery_checkpoints[8]?.artifact_digest_sha256!=='913fd1aa1a38a2f57ea6e4f441c143a0397eaa447750a18f76dd952a82106c96')throw new Error('UC-117 failed discovery custody drift');
          if(probe.version!==1||probe.record_id!=='UC-117'||probe.role_key!=='megatron'||probe.probe_artifact?.artifact_id!==8692632509||probe.probe_artifact?.head_sha!=='79c46413cf3b9640c9e03c6a553c7ebe0ca03837'||probe.probe_artifact?.zip_sha256!=='badea33e5a6ed6521ae4ab1327c65c9f90c357b8883e4ea3fdf3289a5ac774a0'||probe.exact_parse?.sha256!=='911d42d129cba989927bef27ac2c434ebaf84113e1ee55e175ab87527eee81cb'||probe.exact_parse?.declared_image_count!==77)throw new Error('UC-117 Megatron probe custody drift');
          if(row.selector_artifact?.artifact_id!==8678815787||row.scope_artifact?.artifact_id!==8678884419||row.scope_artifact?.scope_sha256!=='91b2aadeccbf9097572aadad1ad0ce3804e67297457bbc9e4ad20e89b51b6261')throw new Error('UC-117 discovery custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.filter(page=>page.strict).length!==2||row.actor_role_pages.filter(page=>page.reference_only).length!==1||row.actor_role_pages[1]?.provider!=='Hasbro PDF press release'||row.actor_role_pages[1]?.externally_verified!==true||row.role_pages?.length!==2||row.role_pages.filter(role=>role.strict).length!==2||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==24)throw new Error('UC-117 discovery denominator drift');
          if(row.role_pages[0]?.api_title!=='Megatron (G1)/Generation 1 cartoon continuity'||row.role_pages[1]?.api_title!=='Scooby-Doo')throw new Error('UC-117 role title drift');
          if(row.selection_contract?.exact_two_role_composite_required!==true||row.selection_contract?.strict_runtime_actor_role_pages_required!==2||row.selection_contract?.hasbro_official_corroboration_reference_required!==true||row.selection_contract?.original_g1_welker_megatron_required!==true||row.selection_contract?.welker_scooby_tenure_signal_required!==true||row.selection_contract?.scooby_1969_franchise_origin_not_voice_start!==true||row.selection_contract?.both_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-117 selection contract drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.production!=='Transformers / Scooby-Doo'||specimen.years!=='1969'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          console.log('PASS — exact UC-117 nine-failure custody and normalized Megatron imageinfo authorized');
          NODE
      - name: Retrieve and verify exact Megatron transport probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-117-discover-probe"
          mkdir -p "$root"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8692632509/zip" > "$root/probe.zip"
          echo "badea33e5a6ed6521ae4ab1327c65c9f90c357b8883e4ea3fdf3289a5ac774a0  $root/probe.zip" | sha256sum -c -
          unzip -q "$root/probe.zip" -d "$root/unpacked"
          probe="$root/unpacked/card-backfill-uc-117-megatron-probe"
          echo "159d3400f5157fd4211b996790e0436c3bf9b3fb757d4a4578a44683636e81a3  $probe/manifest.json" | sha256sum -c -
          echo "003144846c17c775a2038ce497f42cdd01c9609253e378938ffaca05399d4425  $probe/summary.json" | sha256sum -c -
          echo "ec317097478569eb8af2f58a3ac6bc6d5ec9f74d1fd5f785d380201a2f204ed7  $probe/responses/01-mediawiki-api-php-query-exact.json" | sha256sum -c -
          echo "911d42d129cba989927bef27ac2c434ebaf84113e1ee55e175ab87527eee81cb  $probe/responses/02-mediawiki-api-php-parse-exact.json" | sha256sum -c -
          echo "5384a42ed3328fa96915f2fe6984a6f95097256943a22a6d476c374cf22a56bc  $probe/responses/03-mediawiki-api-php-allpages-prefix.json" | sha256sum -c -
          echo "44226633c627c3c428f607d348186d1cac11c42ef03d9596d787b82989438421  $probe/responses/14-page-route-2.html" | sha256sum -c -
          echo "9479e4204cbfb049b3690a798e5e57b3995620db4cc3f5cd472c1a5daa330471  $probe/responses/15-page-route-3.txt" | sha256sum -c -
          echo "8b4cff78008b91f07689c5f192b6f651c21f9abd49d3e08eb42d681b4c724181  $probe/responses/18-page-route-6.xml" | sha256sum -c -
          echo "1586cf37f823d7c02381cfb0ec6baad2db0e4179d6a981dc88dc3c6f31d0521e  $probe/browser/02.png" | sha256sum -c -
      - name: Repair discovery to use the normalized probe parse seed in isolated working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-117-discover.mjs scripts/.card-backfill-uc-117-discover-run.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-117-discover-run.mjs')
          text=path.read_text()
          old_control="""const control = await readJson(CONTROL);
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          new_control="""const control = await readJson(CONTROL);
          const failureLedger = await readJson('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json');
          const megatronProbe = await readJson('.github/CARD-BACKFILL-UC-117-MEGATRON-PROBE-RESULT.json');
          assert(failureLedger.version === 1 && failureLedger.record_id === 'UC-117' && failureLedger.failed_discovery_checkpoints?.length === 9 && failureLedger.failed_discovery_checkpoints[8]?.artifact_id === 8693025021, 'UC-117 failed discovery custody drift');
          assert(megatronProbe.version === 1 && megatronProbe.record_id === 'UC-117' && megatronProbe.probe_artifact?.artifact_id === 8692632509 && megatronProbe.exact_parse?.sha256 === '911d42d129cba989927bef27ac2c434ebaf84113e1ee55e175ab87527eee81cb', 'UC-117 Megatron probe custody drift');
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          helper="""
          async function fetchMegatronFromProbe(context, role) {
            const root = process.env.MEGATRON_PROBE_ROOT;
            assert(root, 'MEGATRON_PROBE_ROOT is required');
            const parsePath = join(root, megatronProbe.exact_parse.path);
            const parseBytes = await readFile(parsePath);
            assert(sha(parseBytes) === megatronProbe.exact_parse.sha256, 'Megatron probe parse hash drift');
            const payload = JSON.parse(parseBytes);
            const parsed = payload?.parse;
            assert(parsed?.title === role.api_title && parsed?.displaytitle === role.api_title, `Megatron probe title drift ${parsed?.title}`);
            const rawWikitext = typeof parsed.wikitext === 'string' ? parsed.wikitext : parsed.wikitext?.['*'] || '';
            assert(Buffer.byteLength(rawWikitext, 'utf8') === 132650, `Megatron raw revision byte drift ${Buffer.byteLength(rawWikitext, 'utf8')}`);
            assert(sha(Buffer.from(rawWikitext, 'utf8')) === megatronProbe.raw_revision.sha256, 'Megatron raw revision hash drift');
            const imageTitles = [...new Set((parsed.images || []).map(name => String(name).startsWith('File:') ? String(name) : `File:${name}`))];
            assert(imageTitles.length === megatronProbe.exact_parse.declared_image_count, `Megatron image denominator drift ${imageTitles.length}`);
            const rows = [];
            for (let start = 0; start < imageTitles.length; start += 40) {
              const batch = imageTitles.slice(start, start + 40);
              const detailUrl = apiUrl(role.api_url, {
                action: 'query', format: 'json', formatversion: 2, redirects: 1,
                prop: 'imageinfo', iiprop: 'url|mime|size|extmetadata', iiurlwidth: 1600,
                titles: batch.join('|'), origin: '*'
              });
              const detail = await requestJson(context, detailUrl, role.url);
              const detailPages = Array.isArray(detail?.query?.pages) ? detail.query.pages : Object.values(detail?.query?.pages || {});
              for (const imagePage of detailPages) {
                const info = imagePage.imageinfo?.[0];
                if (!info?.url) continue;
                rows.push({
                  title: imagePage.title,
                  url: info.url,
                  thumburl: info.thumburl || null,
                  mime: info.mime || null,
                  width: info.width || 0,
                  height: info.height || 0,
                  metadata_text: `${metadataText(info)} Generation 1 cartoon continuity Frank Welker The Transformers cartoon`,
                  extmetadata: info.extmetadata || {},
                  direct_asset: false,
                  score_bonus: 75
                });
              }
            }
            const scored = rows.map(row => ({ ...row, ...scoreImage(role, row, null) }));
            const filtered = scored
              .filter(row => row.filenameMatches.length > 0)
              .filter(row => row.score > -120)
              .sort((a, b) => b.score - a.score || (b.width * b.height - a.width * a.height) || a.title.localeCompare(b.title))
              .slice(0, control.maximum_candidates_per_role);
            assert(filtered.length >= control.minimum_candidates_per_role, `Megatron probe imageinfo produced ${filtered.length} candidate(s)`);
            return {
              source_mode: 'hash-pinned-probe-parse-live-imageinfo',
              requested_api_title: role.api_title,
              api_title: role.api_title,
              api_url: role.api_url,
              resolved_title: parsed.title,
              page_id: megatronProbe.exact_query.page_id,
              raw_wikitext: rawWikitext,
              raw_wikitext_sha256: sha(Buffer.from(rawWikitext, 'utf8')),
              pageimage: null,
              original: null,
              thumbnail: null,
              image_title_count: imageTitles.length,
              raw_image_info_count: rows.length,
              candidates: filtered,
              probe_artifact: megatronProbe.probe_artifact,
              probe_parse_sha256: megatronProbe.exact_parse.sha256,
              probe_page_html_sha256: megatronProbe.page_html.sha256,
              probe_browser_sha256: megatronProbe.browser_page.sha256
            };
          }
          """
          function_anchor="async function fetchRoleApi(context, role) {"
          if function_anchor not in text:
              raise SystemExit('UC-117 fetchRoleApi anchor missing')
          text=text.replace(function_anchor, helper + "\n" + function_anchor + "\n  if (role.key === 'megatron') return fetchMegatronFromProbe(context, role);", 1)
          old_api="""      api_title: api.api_title,
                resolved_title: api.resolved_title,"""
          new_api="""      source_mode: api.source_mode || 'live-action-api',
                requested_api_title: api.requested_api_title || role.api_title,
                api_title: api.api_title,
                api_url: api.api_url || role.api_url,
                probe_artifact: api.probe_artifact || null,
                probe_parse_sha256: api.probe_parse_sha256 || null,
                probe_page_html_sha256: api.probe_page_html_sha256 || null,
                probe_browser_sha256: api.probe_browser_sha256 || null,
                resolved_title: api.resolved_title,"""
          old_manifest="""    scope_artifact: control.scope_artifact,
              repository_hash_count: repository.size,"""
          new_manifest="""    scope_artifact: control.scope_artifact,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              discovery_repair_boundary: failureLedger.repair_boundary,
              megatron_transport_probe: megatronProbe,
              repository_hash_count: repository.size,"""
          old_summary="""    role_counts: roleCounts,
              candidate_count: candidates.length,"""
          new_summary="""    role_counts: roleCounts,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              megatron_transport_probe: megatronProbe,
              candidate_count: candidates.length,"""
          for old,new,name in [(old_control,new_control,'control'),(old_api,new_api,'api evidence'),(old_manifest,new_manifest,'manifest'),(old_summary,new_summary,'summary')]:
              if old not in text:
                  raise SystemExit(f'UC-117 probe-seed repair anchor missing: {name}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-117-discover-run.mjs
      - name: Gather role-specific candidates and official actor-role custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-117-discover
          MAGICK_CMD: magick
          MEGATRON_PROBE_ROOT: ${{ runner.temp }}/card-backfill-uc-117-discover-probe/unpacked/card-backfill-uc-117-megatron-probe
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-117-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-117-discover-run.log"
          rm scripts/.card-backfill-uc-117-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact probe transport staging
        if: always()
        run: rm -rf "$RUNNER_TEMP/card-backfill-uc-117-discover-probe"
      - name: Upload official pages, probe custody, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-discover
            ${{ runner.temp }}/card-backfill-uc-117-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
