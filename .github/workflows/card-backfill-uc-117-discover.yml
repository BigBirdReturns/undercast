name: card-backfill-uc-117-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-117-discover.mjs"
      - ".github/workflows/card-backfill-uc-117-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-117-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review and PDF renderers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick poppler-utils
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-117 two-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.actor!=='Frank Welker'||row.character!=='Megatron & Scooby-Doo'||row.production!=='Transformers / Scooby-Doo'||row.year!==1969||row.side!=='still')throw new Error('UC-117 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-117'||failures.failed_discovery_checkpoints?.length!==2||failures.failed_discovery_checkpoints[0]?.artifact_id!==8679182081||failures.failed_discovery_checkpoints[1]?.artifact_id!==8679321081||failures.failed_discovery_checkpoints[1]?.head_sha!=='1da477b4815056f78d8b480e29b046391fca79fa'||failures.failed_discovery_checkpoints[1]?.artifact_digest_sha256!=='73f1b4b509c7248c1c184ac75a24f412aa3465ff16fdd937668f5347bea032fc')throw new Error('UC-117 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8678815787||row.scope_artifact?.artifact_id!==8678884419||row.scope_artifact?.scope_sha256!=='91b2aadeccbf9097572aadad1ad0ce3804e67297457bbc9e4ad20e89b51b6261')throw new Error('UC-117 discovery custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.filter(page=>page.strict).length!==3||row.actor_role_pages[1]?.provider!=='Hasbro PDF press release'||row.actor_role_pages[1]?.content_type!=='application/pdf'||row.actor_role_pages[1]?.url!=='https://newsroom.hasbro.com/node/34726/pdf'||row.role_pages?.length!==2||row.role_pages.filter(role=>role.strict).length!==2||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==24)throw new Error('UC-117 discovery denominator drift');
          if(row.selection_contract?.exact_two_role_composite_required!==true||row.selection_contract?.official_actor_role_spine_required!==true||row.selection_contract?.original_g1_welker_megatron_required!==true||row.selection_contract?.welker_scooby_tenure_signal_required!==true||row.selection_contract?.scooby_1969_franchise_origin_not_voice_start!==true||row.selection_contract?.both_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-117 selection contract drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.production!=='Transformers / Scooby-Doo'||specimen.years!=='1969'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          console.log('PASS — exact UC-117 Frank Welker PDF-backed discovery authorized');
          NODE
      - name: Preserve failures and add PDF evidence path in isolated working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-117-discover.mjs scripts/.card-backfill-uc-117-discover-run.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-117-discover-run.mjs')
          text=path.read_text()
          old_control="""const control = await readJson(CONTROL);
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          new_control="""const control = await readJson(CONTROL);
          const failureLedger = await readJson('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json');
          assert(failureLedger.version === 1 && failureLedger.record_id === 'UC-117' && failureLedger.failed_discovery_checkpoints?.length === 2 && failureLedger.failed_discovery_checkpoints[0]?.artifact_id === 8679182081 && failureLedger.failed_discovery_checkpoints[1]?.artifact_id === 8679321081, 'UC-117 failed discovery custody drift');
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          pdf_function="""async function inspectPdf(context, spec) {
            const documentRelative = `documents/${spec.key}.pdf`;
            const documentPath = join(OUT, documentRelative);
            const screenshotRelative = `pages/${spec.key}.png`;
            const screenshotPath = join(OUT, screenshotRelative);
            try {
              const response = await context.request.get(spec.url, {
                headers: { 'User-Agent': UA, Accept: 'application/pdf,*/*;q=0.2' },
                timeout: control.transport_timeout_ms,
                failOnStatusCode: false
              });
              assert(response.ok(), `${spec.key} PDF HTTP ${response.status()}`);
              const bytes = Buffer.from(await response.body());
              assert(bytes.length > 1000 && bytes.subarray(0, 4).toString('ascii') === '%PDF', `${spec.key} invalid PDF transport`);
              await mkdir(dirname(documentPath), { recursive: true });
              await writeFile(documentPath, bytes);
              const text = execFileSync('pdftotext', [documentPath, '-'], { encoding: 'utf8' });
              const hay = norm(text);
              const missing = (spec.required_terms || []).filter(term => !hay.includes(norm(term)));
              await mkdir(dirname(screenshotPath), { recursive: true });
              const base = screenshotPath.replace(/\.png$/i, '');
              execFileSync('pdftoppm', ['-png', '-f', '1', '-singlefile', '-r', '110', documentPath, base], { stdio: 'inherit' });
              const screenshotBytes = await readFile(screenshotPath);
              return {
                status: 'loaded',
                http_status: response.status(),
                transport: 'direct-pdf',
                title: spec.binding,
                resolved_url: response.url() || spec.url,
                required_terms: spec.required_terms || [],
                required_terms_missing: missing,
                body_text: text.slice(0, 50000),
                document: { path: documentRelative, sha256: sha(bytes), bytes: bytes.length, mime: 'application/pdf' },
                screenshot: { path: screenshotRelative, sha256: sha(screenshotBytes), bytes: screenshotBytes.length, ...identify(screenshotPath, 'image/png') }
              };
            } catch (error) {
              return {
                status: 'error',
                error: error.message,
                required_terms: spec.required_terms || [],
                required_terms_missing: spec.required_terms || []
              };
            }
          }

          """
          actor_old="""    const evidence = await inspectPage(context, actorPage);"""
          actor_new="""    const evidence = actorPage.content_type === 'application/pdf' ? await inspectPdf(context, actorPage) : await inspectPage(context, actorPage);"""
          old_manifest="""    scope_artifact: control.scope_artifact,
              repository_hash_count: repository.size,"""
          new_manifest="""    scope_artifact: control.scope_artifact,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              discovery_repair_boundary: failureLedger.repair_boundary,
              repository_hash_count: repository.size,"""
          old_summary="""    role_counts: roleCounts,
              candidate_count: candidates.length,"""
          new_summary="""    role_counts: roleCounts,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              candidate_count: candidates.length,"""
          if 'function apiUrl(base, params) {' not in text:
              raise SystemExit('UC-117 PDF function anchor missing')
          text=text.replace('function apiUrl(base, params) {', pdf_function + 'function apiUrl(base, params) {', 1)
          for old,new,name in [(old_control,new_control,'control'),(actor_old,actor_new,'actor loop'),(old_manifest,new_manifest,'manifest'),(old_summary,new_summary,'summary')]:
              if old not in text:
                  raise SystemExit(f'UC-117 PDF repair anchor missing: {name}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-117-discover-run.mjs
      - name: Gather role-specific candidates and official actor-role custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-117-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-117-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-117-discover-run.log"
          rm scripts/.card-backfill-uc-117-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, PDF, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-discover
            ${{ runner.temp }}/card-backfill-uc-117-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
