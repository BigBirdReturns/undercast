name: card-backfill-uc-117-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-117-discover.mjs"
      - ".github/workflows/card-backfill-uc-117-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-117-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-117 two-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.actor!=='Frank Welker'||row.character!=='Megatron & Scooby-Doo'||row.production!=='Transformers / Scooby-Doo'||row.year!==1969||row.side!=='still')throw new Error('UC-117 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-117'||failures.failed_discovery_checkpoints?.length!==6||failures.failed_discovery_checkpoints[0]?.artifact_id!==8679182081||failures.failed_discovery_checkpoints[1]?.artifact_id!==8679321081||failures.failed_discovery_checkpoints[2]?.artifact_id!==8679471175||failures.failed_discovery_checkpoints[3]?.artifact_id!==8679691427||failures.failed_discovery_checkpoints[4]?.artifact_id!==8679875295||failures.failed_discovery_checkpoints[5]?.artifact_id!==8680175423||failures.failed_discovery_checkpoints[5]?.head_sha!=='09edfe2405c44ea693d594f55bb0d524b47aade6'||failures.failed_discovery_checkpoints[5]?.artifact_digest_sha256!=='16c5c9a187be5c3426b7a2c55cefb4626c2bad83093d903e21640eceac0482d4')throw new Error('UC-117 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8678815787||row.scope_artifact?.artifact_id!==8678884419||row.scope_artifact?.scope_sha256!=='91b2aadeccbf9097572aadad1ad0ce3804e67297457bbc9e4ad20e89b51b6261')throw new Error('UC-117 discovery custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.filter(page=>page.strict).length!==2||row.actor_role_pages.filter(page=>page.reference_only).length!==1||row.actor_role_pages[1]?.provider!=='Hasbro PDF press release'||row.actor_role_pages[1]?.externally_verified!==true||row.role_pages?.length!==2||row.role_pages.filter(role=>role.strict).length!==2||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==24)throw new Error('UC-117 discovery denominator drift');
          if(row.role_pages[0]?.api_title!=='Megatron (G1)/Generation 1 cartoon continuity'||!row.role_pages[0]?.url?.endsWith('/Megatron_(G1)/Generation_1_cartoon_continuity'))throw new Error('UC-117 exact Megatron title drift');
          if(row.selection_contract?.exact_two_role_composite_required!==true||row.selection_contract?.strict_runtime_actor_role_pages_required!==2||row.selection_contract?.hasbro_official_corroboration_reference_required!==true||row.selection_contract?.original_g1_welker_megatron_required!==true||row.selection_contract?.welker_scooby_tenure_signal_required!==true||row.selection_contract?.scooby_1969_franchise_origin_not_voice_start!==true||row.selection_contract?.both_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-117 selection contract drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.production!=='Transformers / Scooby-Doo'||specimen.years!=='1969'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          console.log('PASS — exact UC-117 six-checkpoint custody and G1 cartoon-continuity title authorized');
          NODE
      - name: Preserve failures and verify exact API-visible Megatron title in isolated working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-117-discover.mjs scripts/.card-backfill-uc-117-discover-run.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-117-discover-run.mjs')
          text=path.read_text()
          old_control="""const control = await readJson(CONTROL);
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          new_control="""const control = await readJson(CONTROL);
          const failureLedger = await readJson('.github/CARD-BACKFILL-UC-117-DISCOVER-FAILURES.json');
          assert(failureLedger.version === 1 && failureLedger.record_id === 'UC-117' && failureLedger.failed_discovery_checkpoints?.length === 6 && failureLedger.failed_discovery_checkpoints[0]?.artifact_id === 8679182081 && failureLedger.failed_discovery_checkpoints[1]?.artifact_id === 8679321081 && failureLedger.failed_discovery_checkpoints[2]?.artifact_id === 8679471175 && failureLedger.failed_discovery_checkpoints[3]?.artifact_id === 8679691427 && failureLedger.failed_discovery_checkpoints[4]?.artifact_id === 8679875295 && failureLedger.failed_discovery_checkpoints[5]?.artifact_id === 8680175423, 'UC-117 failed discovery custody drift');
          assert(control.version === 1 && control.lane === 'card-backfill' && control.record_id === 'UC-117', 'UC-117 discovery scope drift');"""
          old_primary="""async function fetchRoleApi(context, role) {
            const primaryUrl = apiUrl(role.api_url, {
              action: 'query',
              format: 'json',
              formatversion: 2,
              redirects: 1,
              prop: 'revisions|pageimages',
              rvprop: 'content',
              rvslots: 'main',
              rvlimit: 1,
              piprop: 'name|original|thumbnail',
              pithumbsize: 1600,
              titles: role.api_title,
              origin: '*'
            });
            const primary = await requestJson(context, primaryUrl, role.url);
            const page = primary?.query?.pages?.[0];
            assert(page && !page.missing, `${role.key} API page missing`);
            const rawWikitext = revisionContent(page);"""
          new_primary="""async function fetchRoleApi(context, role) {
            let resolvedApiUrl = role.api_url;
            let resolvedApiTitle = role.api_title;
            const resolutionAttempts = [];
            const loadPrimary = async (base, title) => {
              const url = apiUrl(base, {
                action: 'query',
                format: 'json',
                formatversion: 2,
                redirects: 1,
                prop: 'revisions|pageimages',
                rvprop: 'content',
                rvslots: 'main',
                rvlimit: 1,
                piprop: 'name|original|thumbnail',
                pithumbsize: 1600,
                titles: title,
                origin: '*'
              });
              const result = await requestJson(context, url, role.url);
              return { result, page: result?.query?.pages?.[0], url };
            };
            let loaded = await loadPrimary(resolvedApiUrl, resolvedApiTitle);
            let primary = loaded.result;
            let page = loaded.page;
            resolutionAttempts.push({ api_url: resolvedApiUrl, title: resolvedApiTitle, result: page?.missing ? 'missing' : 'loaded' });
            if (!page || page.missing) {
              const bases = [...new Set([role.api_url, 'https://tfwiki.net/api.php', 'https://tfwiki.net/w/api.php'])];
              const queries = role.key === 'megatron'
                ? ['Megatron G1 cartoon continuity Frank Welker', 'intitle:Megatron G1 cartoon continuity', 'Megatron Generation 1 cartoon']
                : [role.api_title];
              outer: for (const base of bases) {
                for (const query of queries) {
                  try {
                    const searchUrl = apiUrl(base, {
                      action: 'query',
                      format: 'json',
                      formatversion: 2,
                      list: 'search',
                      srsearch: query,
                      srnamespace: 0,
                      srlimit: 30,
                      origin: '*'
                    });
                    const search = await requestJson(context, searchUrl, role.url);
                    const ranked = (search?.query?.search || []).map(row => {
                      const title = norm(row.title);
                      const snippet = norm(row.snippet || '');
                      let score = 0;
                      if (title.includes(norm(role.role))) score += 100;
                      if (title.includes('g1') || title.includes('generation 1')) score += 90;
                      if (title.includes('cartoon continuity')) score += 140;
                      if (snippet.includes('frank welker')) score += 80;
                      if (title === norm(role.api_title)) score += 40;
                      return { title: row.title, score };
                    }).sort((a, b) => b.score - a.score || a.title.localeCompare(b.title));
                    resolutionAttempts.push({ api_url: base, query, candidates: ranked.slice(0, 10) });
                    for (const candidate of ranked) {
                      if (candidate.score < 100) continue;
                      const test = await loadPrimary(base, candidate.title);
                      resolutionAttempts.push({ api_url: base, title: candidate.title, result: test.page?.missing ? 'missing' : 'loaded' });
                      if (test.page && !test.page.missing) {
                        resolvedApiUrl = base;
                        resolvedApiTitle = candidate.title;
                        primary = test.result;
                        page = test.page;
                        break outer;
                      }
                    }
                  } catch (error) {
                    resolutionAttempts.push({ api_url: base, query, error: error.message });
                  }
                }
              }
            }
            assert(page && !page.missing, `${role.key} API page missing after exact title and bounded fallback`);
            if (role.key === 'megatron') {
              const resolved = norm(resolvedApiTitle);
              assert(resolved.includes('megatron') && (resolved.includes('g1') || resolved.includes('generation 1')) && resolved.includes('cartoon'), `UC-117 Megatron API resolution escaped G1 cartoon boundary: ${resolvedApiTitle}`);
            }
            const rawWikitext = revisionContent(page);"""
          old_return="""  return {
              api_title: role.api_title,
              resolved_title: page.title,"""
          new_return="""  return {
              requested_api_title: role.api_title,
              api_title: resolvedApiTitle,
              api_url: resolvedApiUrl,
              resolution_attempts: resolutionAttempts,
              resolved_title: page.title,"""
          old_manifest="""    scope_artifact: control.scope_artifact,
              repository_hash_count: repository.size,"""
          new_manifest="""    scope_artifact: control.scope_artifact,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              discovery_repair_boundary: failureLedger.repair_boundary,
              repository_hash_count: repository.size,"""
          old_summary="""    role_counts: roleCounts,
              candidate_count: candidates.length,"""
          new_summary="""    role_counts: roleCounts,
              failed_discovery_checkpoints: failureLedger.failed_discovery_checkpoints,
              candidate_count: candidates.length,"""
          for old,new,name in [(old_control,new_control,'control'),(old_primary,new_primary,'primary resolver'),(old_return,new_return,'return'),(old_manifest,new_manifest,'manifest'),(old_summary,new_summary,'summary')]:
              if old not in text:
                  raise SystemExit(f'UC-117 API resolution anchor missing: {name}')
              text=text.replace(old,new,1)
          text=text.replace("const imageUrl = apiUrl(role.api_url, {", "const imageUrl = apiUrl(resolvedApiUrl, {", 1)
          text=text.replace("      titles: role.api_title,", "      titles: resolvedApiTitle,", 1)
          text=text.replace("const detailUrl = apiUrl(role.api_url, {", "const detailUrl = apiUrl(resolvedApiUrl, {", 1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-117-discover-run.mjs
      - name: Gather role-specific candidates and official actor-role custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-117-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-117-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-117-discover-run.log"
          rm scripts/.card-backfill-uc-117-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, exact title resolution, corroboration ledger, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-discover
            ${{ runner.temp }}/card-backfill-uc-117-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
