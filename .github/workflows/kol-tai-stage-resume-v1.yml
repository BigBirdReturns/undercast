name: kol-tai-stage-resume-v1

on:
  pull_request:
    branches:
      - agent/kol-tai-stage-resume-base-v1
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write

concurrency:
  group: kol-tai-exact-product
  cancel-in-progress: false

jobs:
  execute:
    name: unitkoltai-cycle
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 31832ca882b9b8d2a76f4a7f2d679844d7bde5ba
      SOURCE_HEAD: 4e6fd81330fcb48ae26d5733fbbbba7e9de4c580
      SOURCE_RUN: '32214946121'
      SOURCE_EXECUTION_RUN: '32307192027'
      SOURCE_MEDIA_ARTIFACT: '9385127694'
      SOURCE_MEDIA_DIGEST: 618c434d6bec523f51930dc90857978f4c4fa221d543f99cfe896ab40d28ff23
      SOURCE_CONTROLLER_ARTIFACT: '9385129837'
      SOURCE_CONTROLLER_DIGEST: 62b47d4491705bfc7beb60c0c0232d5a6965afc1f09e1abb1692f185eb5f0c63
      TASK_ID: ap_9e3a49dc256ff237dd30611b
      TASK_FINGERPRINT: 0476f56a4959105661f22140254bf364c76c4ace7ac513c111233c75e99cf9d2
      WALL_ID: UC-1389
      TEMP_BRANCH: agent/star-trek-kol-tai-repair-v4
      CANDIDATE_BRANCH: agent/star-trek-kol-tai-candidate-v4
      RESULT_BRANCH: agent/kol-tai-stage-resume-result-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Publish stage-resume run locator
        run: |
          set -euo pipefail
          carrier_head="$(git rev-parse HEAD)"
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/kol-tai-stage-resume-v1
          mkdir -p transport/kol-tai-stage-resume-v1
          jq -n \
            --argjson version 1 \
            --arg transaction KOL-TAI-STAGE-RESUME-RUN-START-V1 \
            --arg status started \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg head_sha "$carrier_head" \
            --arg canonical_parent "$EXPECTED_MAIN" \
            --arg source_head "$SOURCE_HEAD" \
            --argjson source_execution_run "$SOURCE_EXECUTION_RUN" \
            --arg task_id "$TASK_ID" \
            '{version:$version,transaction:$transaction,status:$status,run_id:$run_id,head_sha:$head_sha,canonical_parent:$canonical_parent,source_head:$source_head,source_execution_run:$source_execution_run,task_id:$task_id}' \
            > transport/kol-tai-stage-resume-v1/run-start.json
          git config user.name undercast-kol-tai-stage-resume
          git config user.email kol-tai-stage-resume@users.noreply.github.com
          git add transport/kol-tai-stage-resume-v1/run-start.json
          git commit -m 'Kol-Tai: publish stage-resume locator'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
          git checkout --detach "$carrier_head"

      - name: Recover exact preparation and controller artifacts
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          node scripts/star-trek-karl-four-cycle.mjs

          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_EXECUTION_RUN}/artifacts?per_page=100")"
          test "$(jq -r --argjson id "$SOURCE_MEDIA_ARTIFACT" '[.artifacts[] | select(.id==$id and .expired==false)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --argjson id "$SOURCE_MEDIA_ARTIFACT" '.artifacts[] | select(.id==$id) | .name' <<<"$artifacts")" = star-trek-kol-tai-media-v4
          test "$(jq -r --argjson id "$SOURCE_MEDIA_ARTIFACT" '.artifacts[] | select(.id==$id) | .digest' <<<"$artifacts")" = "sha256:${SOURCE_MEDIA_DIGEST}"
          test "$(jq -r --argjson id "$SOURCE_CONTROLLER_ARTIFACT" '[.artifacts[] | select(.id==$id and .expired==false)] | length' <<<"$artifacts")" = 1
          test "$(jq -r --argjson id "$SOURCE_CONTROLLER_ARTIFACT" '.artifacts[] | select(.id==$id) | .name' <<<"$artifacts")" = star-trek-kol-tai-controller-source-v4
          test "$(jq -r --argjson id "$SOURCE_CONTROLLER_ARTIFACT" '.artifacts[] | select(.id==$id) | .digest' <<<"$artifacts")" = "sha256:${SOURCE_CONTROLLER_DIGEST}"

          rm -rf /tmp/kol-tai-prep-resume /tmp/kol-tai-controller-v4 /tmp/unitkoltai-programs
          mkdir -p /tmp/kol-tai-prep-resume /tmp/kol-tai-controller-v4
          gh run download "$SOURCE_EXECUTION_RUN" -n star-trek-kol-tai-media-v4 -D /tmp/kol-tai-prep-resume
          gh run download "$SOURCE_EXECUTION_RUN" -n star-trek-kol-tai-controller-source-v4 -D /tmp/kol-tai-controller-v4
          jq -e --arg id "$TASK_ID" --arg parent "$EXPECTED_MAIN" '.task_id==$id and .canonical_parent==$parent and .maker_attribution=="unresolved" and .media_review.verdict=="pass" and (.facets|length)==2' /tmp/kol-tai-prep-resume/media-preparation.json >/dev/null
          jq -e --arg id "$TASK_ID" --arg parent "$EXPECTED_MAIN" '.task_id==$id and .canonical_parent==$parent and (.files|length)==5' /tmp/kol-tai-controller-v4/controller-source-manifest.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('/tmp/kol-tai-controller-v4')
          manifest = json.loads((root / 'controller-source-manifest.json').read_text())
          for row in manifest['files']:
              path = root / 'programs' / row['file']
              if not path.is_file():
                  raise SystemExit(f'missing controller program: {path}')
              if path.stat().st_size != row['bytes']:
                  raise SystemExit(f'controller byte drift: {path.name}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != row['sha256']:
                  raise SystemExit(f'controller hash drift: {path.name}')
          PY
          ln -sfn /tmp/kol-tai-controller-v4/programs /tmp/unitkoltai-programs
          chmod +x /tmp/kol-tai-controller-v4/programs/*
          bash -n /tmp/kol-tai-controller-v4/programs/unitkoltai-controller.sh
          node --check /tmp/kol-tai-controller-v4/programs/unitkoltai-stage.mjs
          node --check /tmp/kol-tai-controller-v4/programs/unitkoltai-review.mjs
          node --check /tmp/kol-tai-controller-v4/programs/unitkoltai-prior-phase.mjs
          node --check /tmp/kol-tai-controller-v4/programs/unitkoltai-finalize.mjs

      - name: Re-publish exact media custody under controller contract
        id: media_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kol-tai-media-v1
          path: /tmp/kol-tai-prep-resume/
          if-no-files-found: error
          retention-days: 30

      - name: Bridge preparation custody into controller runtime
        env:
          MEDIA_ARTIFACT_ID: ${{ steps.media_artifact.outputs.artifact-id }}
          MEDIA_ARTIFACT_DIGEST: ${{ steps.media_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          media_job="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="unitkoltai-cycle") | .id' | head -n1)"
          test -n "$media_job"
          test "$MEDIA_ARTIFACT_ID" -gt 0
          media_sha="${MEDIA_ARTIFACT_DIGEST#sha256:}"
          test -n "$media_sha"
          test "$media_sha" != "$MEDIA_ARTIFACT_DIGEST" || test "${#media_sha}" -eq 64
          printf 'MEDIA_PREP_RUN=%s\nMEDIA_PREP_JOB=%s\nMEDIA_PREP_ARTIFACT=%s\nMEDIA_PREP_ARTIFACT_SHA=%s\n' \
            "$GITHUB_RUN_ID" "$media_job" "$MEDIA_ARTIFACT_ID" "$media_sha" >> "$GITHUB_ENV"

      - name: Stage exact Kol-Tai candidate
        id: stage
        run: bash /tmp/kol-tai-controller-v4/programs/unitkoltai-controller.sh stage

      - name: Upload exact Kol-Tai candidate
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitkoltai-candidate-product
          path: /tmp/unitkoltai-candidate-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Review exact Kol-Tai candidate independently
        run: bash /tmp/kol-tai-controller-v4/programs/unitkoltai-controller.sh review

      - name: Upload exact independent Kol-Tai review
        id: review_artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitkoltai-independent-review
          path: /tmp/unitkoltai-review-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact reviewed Kol-Tai product
        id: publish
        run: bash /tmp/kol-tai-controller-v4/programs/unitkoltai-controller.sh publish

      - name: Upload exact Kol-Tai final product receipt
        id: final_receipt_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kol-tai-final-product-receipt
          path: /tmp/unitkoltai-final-product-receipt/
          if-no-files-found: error
          retention-days: 30

      - name: Seal exact Kol-Tai execution
        env:
          CANDIDATE_COMMIT: ${{ steps.stage.outputs.commit }}
          CANDIDATE_TREE: ${{ steps.stage.outputs.tree }}
          CANDIDATE_PATH_COUNT: ${{ steps.stage.outputs.path_count }}
          CANDIDATE_PATH_SHA256: ${{ steps.stage.outputs.path_sha256 }}
          PRODUCT_COMMIT: ${{ steps.publish.outputs.product_commit }}
          PRODUCT_TREE: ${{ steps.publish.outputs.product_tree }}
          PAGES_RUN: ${{ steps.publish.outputs.pages_run }}
          MEDIA_ARTIFACT_ID: ${{ steps.media_artifact.outputs.artifact-id }}
          MEDIA_ARTIFACT_DIGEST: ${{ steps.media_artifact.outputs.artifact-digest }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate_artifact.outputs.artifact-digest }}
          REVIEW_ARTIFACT_ID: ${{ steps.review_artifact.outputs.artifact-id }}
          REVIEW_ARTIFACT_DIGEST: ${{ steps.review_artifact.outputs.artifact-digest }}
          FINAL_RECEIPT_ARTIFACT_ID: ${{ steps.final_receipt_artifact.outputs.artifact-id }}
          FINAL_RECEIPT_ARTIFACT_DIGEST: ${{ steps.final_receipt_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          main_after="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          test "$(jq -r .sha <<<"$main_after")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.parents | length' <<<"$main_after")" = 1
          test "$(jq -r '.parents[0].sha' <<<"$main_after")" = "$EXPECTED_MAIN"
          test "$(jq -r '.commit.tree.sha' <<<"$main_after")" = "$PRODUCT_TREE"
          test "$(jq -r '.commit.message' <<<"$main_after")" = 'Star Trek: publish Kol-Tai cycle'
          rm -rf /tmp/kol-tai-stage-resume-execution-v1
          mkdir -p /tmp/kol-tai-stage-resume-execution-v1
          printf '%s\n' "$main_after" | jq . > /tmp/kol-tai-stage-resume-execution-v1/main-after.json
          cp /tmp/kol-tai-controller-v4/controller-source-manifest.json /tmp/kol-tai-stage-resume-execution-v1/
          cp /tmp/kol-tai-prep-resume/source-receipt.json /tmp/kol-tai-stage-resume-execution-v1/
          cp /tmp/kol-tai-prep-resume/media-preparation.json /tmp/kol-tai-stage-resume-execution-v1/
          cp /tmp/unitkoltai-final-product-receipt/thesis-next.json /tmp/kol-tai-stage-resume-execution-v1/
          cp /tmp/unitkoltai-final-product-receipt/thesis-status.json /tmp/kol-tai-stage-resume-execution-v1/
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-KOL-TAI-STAGE-RESUME-EXECUTION-V1 \
            --arg status success \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --argjson source_run "$SOURCE_RUN" \
            --argjson source_execution_run "$SOURCE_EXECUTION_RUN" \
            --arg workflow_head "$GITHUB_SHA" \
            --arg canonical_parent "$EXPECTED_MAIN" \
            --arg source_head "$SOURCE_HEAD" \
            --arg task_id "$TASK_ID" \
            --arg candidate_commit "$CANDIDATE_COMMIT" \
            --arg candidate_tree "$CANDIDATE_TREE" \
            --argjson candidate_path_count "$CANDIDATE_PATH_COUNT" \
            --arg candidate_path_ledger_sha256 "$CANDIDATE_PATH_SHA256" \
            --arg product_commit "$PRODUCT_COMMIT" \
            --arg product_tree "$PRODUCT_TREE" \
            --argjson pages_run "$PAGES_RUN" \
            --argjson media_artifact "$MEDIA_ARTIFACT_ID" \
            --arg media_digest "$MEDIA_ARTIFACT_DIGEST" \
            --argjson candidate_artifact "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --argjson review_artifact "$REVIEW_ARTIFACT_ID" \
            --arg review_digest "$REVIEW_ARTIFACT_DIGEST" \
            --argjson final_receipt_artifact "$FINAL_RECEIPT_ARTIFACT_ID" \
            --arg final_receipt_digest "$FINAL_RECEIPT_ARTIFACT_DIGEST" \
            '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,source_run:$source_run,source_execution_run:$source_execution_run,workflow_head:$workflow_head,canonical_parent:$canonical_parent,source_head:$source_head,task_id:$task_id,candidate:{commit:$candidate_commit,tree:$candidate_tree,path_count:$candidate_path_count,path_ledger_sha256:$candidate_path_ledger_sha256},product:{commit:$product_commit,tree:$product_tree,parent:$canonical_parent,pages_run:$pages_run},artifacts:{media:{id:$media_artifact,digest:$media_digest},candidate:{id:$candidate_artifact,digest:$candidate_digest},review:{id:$review_artifact,digest:$review_digest},final_receipt:{id:$final_receipt_artifact,digest:$final_receipt_digest},source_controller:{id:9385129837,digest:"sha256:62b47d4491705bfc7beb60c0c0232d5a6965afc1f09e1abb1692f185eb5f0c63"}}}' \
            > /tmp/kol-tai-stage-resume-execution-v1/kol-tai-stage-resume-execution-v1.json

      - name: Upload sealed Kol-Tai execution
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kol-tai-stage-resume-execution-v1
          path: /tmp/kol-tai-stage-resume-execution-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Retire every Kol-Tai ref after exact success
        if: success()
        run: |
          set -euo pipefail
          rm -rf /tmp/kol-tai-stage-resume-cleanup-v1
          mkdir -p /tmp/kol-tai-stage-resume-cleanup-v1
          git ls-remote --heads origin \
            | awk '$2 ~ /^refs\/heads\/agent\/(star-trek-kol-tai|kol-tai|rail-next-after-karl-four)/ {print $2}' \
            | sed 's#^refs/heads/##' \
            | LC_ALL=C sort -u \
            > /tmp/kol-tai-stage-resume-cleanup-v1/branches-before.txt
          while IFS= read -r branch; do
            test -z "$branch" || git push origin --delete "$branch"
          done < /tmp/kol-tai-stage-resume-cleanup-v1/branches-before.txt
          git ls-remote --heads origin \
            | awk '$2 ~ /^refs\/heads\/agent\/(star-trek-kol-tai|kol-tai|rail-next-after-karl-four)/ {print $2}' \
            | sed 's#^refs/heads/##' \
            | LC_ALL=C sort -u \
            > /tmp/kol-tai-stage-resume-cleanup-v1/branches-after.txt
          test ! -s /tmp/kol-tai-stage-resume-cleanup-v1/branches-after.txt
          jq -Rn '[inputs | select(length > 0)]' < /tmp/kol-tai-stage-resume-cleanup-v1/branches-before.txt > /tmp/kol-tai-stage-resume-cleanup-v1/branches-before.json
          main_now="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          test "$(jq -r .commit.message <<<"$main_now")" = 'Star Trek: publish Kol-Tai cycle'
          test "$(jq -r '.parents[0].sha' <<<"$main_now")" = "$EXPECTED_MAIN"
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-KOL-TAI-CLEANUP-STAGE-RESUME-V1 \
            --arg status success \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --arg product_commit "$(jq -r .sha <<<"$main_now")" \
            --slurpfile before /tmp/kol-tai-stage-resume-cleanup-v1/branches-before.json \
            '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,product_commit:$product_commit,deleted_branches:$before[0],remaining_branches:[]}' \
            > /tmp/kol-tai-stage-resume-cleanup-v1/kol-tai-cleanup-stage-resume-v1.json

      - name: Upload Kol-Tai cleanup receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kol-tai-cleanup-stage-resume-v1
          path: /tmp/kol-tai-stage-resume-cleanup-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Retire failed candidate and legacy carrier refs
        if: failure()
        run: |
          set +e
          git push origin --delete "$CANDIDATE_BRANCH" >/dev/null 2>&1 || true
          git push origin --delete "$TEMP_BRANCH" >/dev/null 2>&1 || true
