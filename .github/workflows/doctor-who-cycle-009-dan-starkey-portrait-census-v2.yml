name: doctor-who-cycle-009-dan-starkey-portrait-census-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-census-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-census-v2
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-census-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 2a29ca99a3cd1a455cd20ce6195076162c918edc
      BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-census-v2
      SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-census-v2.yml
      OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v2
      COMMONS_CATEGORY: Category:Dan Starkey
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      PRIOR_RUN: "31241343025"
      PRIOR_JOB: "93062737215"
      PRIOR_ARTIFACT: "9017107246"
      PRIOR_ARTIFACT_DIGEST: sha256:125ea89f15a2aedab7d2c05310171379be008a5583c71181d88389606edfdf72

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact successor and paid HTTP-429 failure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,images,receipt,tiles}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" > "$OUT/api/prior-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$PRIOR_JOB" > "$OUT/api/prior-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIOR_ARTIFACT" > "$OUT/api/prior-artifact.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          pr = json.loads((root / "api/pr.json").read_text())
          files = json.loads((root / "api/files.json").read_text())
          run = json.loads((root / "api/prior-run.json").read_text())
          job = json.loads((root / "api/prior-job.json").read_text())
          artifact = json.loads((root / "api/prior-artifact.json").read_text())
          assert pr["number"] == int(os.environ["PR"])
          assert pr["state"] == "open" and pr["draft"] is True and pr["merged"] is False
          assert pr["base"]["sha"] == os.environ["EXACT_MAIN"]
          assert pr["head"]["ref"] == os.environ["BRANCH"] and pr["head"]["sha"] == os.environ["HEAD"]
          assert pr["commits"] == 1 and pr["changed_files"] == 1
          assert len(files) == 1 and files[0]["filename"] == os.environ["SELF"] and files[0]["status"] == "added"
          assert run["id"] == int(os.environ["PRIOR_RUN"]) and run["head_sha"] == "5ccc905f50a35ff885d07efa73524b24b6b5dcc9"
          assert run["status"] == "completed" and run["conclusion"] == "failure"
          assert job["id"] == int(os.environ["PRIOR_JOB"]) and job["run_id"] == run["id"]
          assert job["status"] == "completed" and job["conclusion"] == "failure"
          steps = {row["number"]: row for row in job["steps"]}
          assert all(steps[n]["conclusion"] == "success" for n in range(1, 7))
          assert steps[7]["conclusion"] == "failure"
          assert artifact["id"] == int(os.environ["PRIOR_ARTIFACT"])
          assert artifact["expired"] is False and artifact["digest"] == os.environ["PRIOR_ARTIFACT_DIGEST"]
          assert artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == run["head_sha"]
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"

      - name: Revalidate current cycle, queue, waterline, and media gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/receipt/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/receipt/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/receipt/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/receipt/media-gate.log"
          jq -e '.total==316 and .statuses.queued==308 and .statuses.resolved==8 and .in_flight==0' "$OUT/receipt/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Census Commons with paced retry and retain exact thumbnails
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import email.utils, hashlib, html, json, os, re, time
          import urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          api = "https://commons.wikimedia.org/w/api.php"
          headers = {"User-Agent": "Undercast Dan Starkey portrait census/2.0 (read-only; paced)"}
          retry_events = []
          last_request = 0.0

          def retry_after(error, fallback):
              value = error.headers.get("Retry-After") if getattr(error, "headers", None) else None
              if value:
                  try: return max(float(value), fallback)
                  except ValueError:
                      try:
                          parsed = email.utils.parsedate_to_datetime(value)
                          return max(parsed.timestamp() - time.time(), fallback)
                      except Exception: pass
              return fallback

          def open_paced(url, timeout, label):
              global last_request
              for attempt in range(1, 10):
                  delay = max(0.0, 3.0 - (time.monotonic() - last_request))
                  if delay: time.sleep(delay)
                  last_request = time.monotonic()
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=timeout)
                  except urllib.error.HTTPError as error:
                      if error.code not in {429, 500, 502, 503, 504} or attempt == 9: raise
                      wait = min(120.0, retry_after(error, min(90.0, 4.0 * (2 ** (attempt - 1)))))
                      retry_events.append({"label": label, "attempt": attempt, "status": error.code, "wait_seconds": wait})
                      time.sleep(wait)
                  except OSError as error:
                      if attempt == 9: raise
                      wait = min(90.0, 3.0 * (2 ** (attempt - 1)))
                      retry_events.append({"label": label, "attempt": attempt, "error": type(error).__name__, "wait_seconds": wait})
                      time.sleep(wait)
              raise AssertionError("unreachable")

          def get(params, label):
              url = api + "?" + urllib.parse.urlencode(params, doseq=True)
              with open_paced(url, 90, label) as response:
                  return json.loads(response.read())

          rows, cont = [], {}
          while True:
              doc = get({"action":"query","list":"categorymembers","cmtitle":os.environ["COMMONS_CATEGORY"],"cmnamespace":"6","cmtype":"file","cmlimit":"max","format":"json","formatversion":"2","maxlag":"5",**cont}, "categorymembers")
              rows.extend(doc["query"]["categorymembers"])
              if "continue" not in doc: break
              cont = doc["continue"]
          titles = sorted({row["title"] for row in rows})
          assert 1 <= len(titles) <= 50 and len(titles) == len(rows)
          pages = []
          for offset in range(0, len(titles), 25):
              doc = get({"action":"query","prop":"imageinfo","titles":"|".join(titles[offset:offset+25]),"iiprop":"url|size|mime|sha1|timestamp|extmetadata","iiurlwidth":"1200","format":"json","formatversion":"2","maxlag":"5"}, f"imageinfo-{offset//25+1}")
              pages.extend(doc["query"]["pages"])

          specimens = json.loads(Path("data/specimens.json").read_text())
          sources = json.loads(Path("data/SOURCES.json").read_text())
          audit = json.loads(Path("data/MEDIA-AUDIT.json").read_text())
          cards = sorted((row for row in specimens if row.get("actor") == "Dan Starkey"), key=lambda row: row["id"])
          card_ids = {row["id"] for row in cards}
          source_rows = [row for row in sources if row.get("id") in card_ids]
          portrait_facets = sorted((row for row in audit.get("items", []) if row.get("actor") == "Dan Starkey" and row.get("side") == "portrait"), key=lambda row: row["wall_id"])
          verified_hashes = sorted({row.get("asset", {}).get("sha256") for row in portrait_facets if row.get("status") == "verified" and row.get("asset", {}).get("sha256")})
          assert len(cards) == 9 and len(portrait_facets) == 9 and verified_hashes

          urls = []
          def walk(value):
              if isinstance(value, dict):
                  for item in value.values(): walk(item)
              elif isinstance(value, list):
                  for item in value: walk(item)
              elif isinstance(value, str) and value.startswith(("http://", "https://")): urls.append(value)
          walk(source_rows); walk(portrait_facets)
          def norm(raw):
              try:
                  parsed = urllib.parse.urlsplit(raw)
                  path = urllib.parse.unquote(parsed.path).replace(" ", "_")
                  return urllib.parse.urlunsplit((parsed.scheme.lower(), parsed.netloc.lower(), path, "", "")).rstrip("/")
              except Exception: return raw
          canonical_urls = sorted({norm(url) for url in urls})
          canonical = set(canonical_urls)
          def metadata_value(meta, key):
              row = meta.get(key) or {}
              return html.unescape(re.sub("<[^>]+>", " ", str(row.get("value", "")))).strip()

          output = []
          for index, page in enumerate(sorted(pages, key=lambda row: row["title"]), 1):
              info = (page.get("imageinfo") or [None])[0]
              assert info
              meta = info.get("extmetadata") or {}
              title = page["title"]
              file_page = "https://commons.wikimedia.org/wiki/" + urllib.parse.quote(title.replace(" ", "_"), safe=":/_()")
              matches = sorted({norm(url) for url in [info.get("url"), info.get("descriptionurl"), file_page] if url and norm(url) in canonical})
              thumbnail_url = info.get("thumburl") or info["url"]
              with open_paced(thumbnail_url, 180, f"thumbnail-{index:02d}") as response:
                  data = response.read()
                  content_type = response.headers.get_content_type()
              assert len(data) > 1000 and content_type.startswith("image/")
              suffix = {"image/jpeg":".jpg","image/png":".png","image/webp":".webp","image/gif":".gif","image/tiff":".tif"}.get(content_type, ".img")
              filename = f"{index:02d}{suffix}"
              (root / "images" / filename).write_bytes(data)
              license_name = metadata_value(meta, "LicenseShortName") or metadata_value(meta, "UsageTerms")
              admissible = bool(re.search(r"^(CC BY(?:-SA)?(?: |$)|Public domain|PD)", license_name, re.I))
              output.append({"index":index,"pageid":page["pageid"],"title":title,"file_page":file_page,"original_url":info["url"],"description_url":info.get("descriptionurl"),"original_width":info.get("width"),"original_height":info.get("height"),"original_mime":info.get("mime"),"original_sha1_base36":info.get("sha1"),"original_timestamp":info.get("timestamp"),"thumbnail_url":thumbnail_url,"thumbnail_file":filename,"thumbnail_sha256":hashlib.sha256(data).hexdigest(),"thumbnail_bytes":len(data),"thumbnail_mime":content_type,"license_short_name":license_name,"license_url":metadata_value(meta,"LicenseUrl"),"artist":metadata_value(meta,"Artist"),"credit":metadata_value(meta,"Credit"),"description":metadata_value(meta,"ImageDescription"),"date_original":metadata_value(meta,"DateTimeOriginal"),"admissible_license_candidate":admissible,"canonical_origin_match":bool(matches),"canonical_origin_matches":matches})

          inventory = {"performer":"Dan Starkey","canonical_card_count":len(cards),"portrait_facet_count":len(portrait_facets),"verified_portrait_asset_sha256":verified_hashes,"canonical_urls":canonical_urls,"cards":[{"id":row["id"],"character":row.get("character"),"production":row.get("production"),"portrait":row.get("portrait")} for row in cards]}
          census = {"category":os.environ["COMMONS_CATEGORY"],"api":api,"file_count":len(output),"bounded_maximum":50,"minimum_request_spacing_seconds":3,"retry_event_count":len(retry_events),"files":output}
          census["identity"] = hashlib.sha256(json.dumps(census, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "receipt/canonical-inventory.json").write_text(json.dumps(inventory, indent=2, sort_keys=True) + "\n")
          (root / "receipt/commons-census.json").write_text(json.dumps(census, indent=2, sort_keys=True) + "\n")
          (root / "receipt/retry-events.json").write_text(json.dumps(retry_events, indent=2, sort_keys=True) + "\n")
          (root / "receipt/labels.tsv").write_text("\n".join(f"{row['index']:02d}\t{row['title']}\t{row['license_short_name']}\tmatch={str(row['canonical_origin_match']).lower()}" for row in output) + "\n")
          PY

      - name: Build contact sheet and seal read-only census
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v montage >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          ROOT="$OUT" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          rows = json.loads((root / "receipt/commons-census.json").read_text())["files"]
          for row in rows:
              source = root / "images" / row["thumbnail_file"]
              destination = root / "tiles" / f"{row['index']:02d}.jpg"
              label = f"{row['index']:02d} {row['title'].removeprefix('File:')}\n{row['license_short_name']} | canonical-match={str(row['canonical_origin_match']).lower()}"
              subprocess.run(["convert",str(source),"-auto-orient","-thumbnail","300x250>","-background","white","-gravity","center","-extent","320x270","-gravity","south","-fill","black","-pointsize","13","-annotate","+0+4",label,str(destination)], check=True)
          PY
          montage "$OUT"/tiles/*.jpg -tile 4x -geometry +8+8 -background '#dddddd' "$OUT/receipt/contact-sheet.jpg"
          identify "$OUT/receipt/contact-sheet.jpg" > "$OUT/receipt/contact-sheet-identify.txt"
          cp -R "$OUT/images" "$OUT/receipt/images"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          commons = json.loads((root / "receipt/commons-census.json").read_text())
          canonical = json.loads((root / "receipt/canonical-inventory.json").read_text())
          candidates = [row for row in commons["files"] if row["admissible_license_candidate"] and not row["canonical_origin_match"]]
          receipt = {"version":2,"status":"dan-starkey-commons-portrait-census-complete","canonical_main":os.environ["EXACT_MAIN"],"run":int(os.environ["GITHUB_RUN_ID"]),"attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"carrier_pr":int(os.environ["CARRIER_PR"]),"carrier_head":os.environ["CARRIER_HEAD"],"paid_prior_run":int(os.environ["PRIOR_RUN"]),"paid_prior_job":int(os.environ["PRIOR_JOB"]),"paid_prior_artifact":int(os.environ["PRIOR_ARTIFACT"]),"paid_prior_artifact_digest":os.environ["PRIOR_ARTIFACT_DIGEST"],"paid_defect":"Wikimedia HTTP 429 during unpaced thumbnail retrieval","task_id":os.environ["TASK_ID"],"source_fingerprint":os.environ["SOURCE_FINGERPRINT"],"performer":"Dan Starkey","category":commons["category"],"category_file_count":commons["file_count"],"retry_event_count":commons["retry_event_count"],"canonical_card_count":canonical["canonical_card_count"],"canonical_portrait_facet_count":canonical["portrait_facet_count"],"canonical_verified_portrait_hash_count":len(canonical["verified_portrait_asset_sha256"]),"license_and_origin_compatible_count":len(candidates),"license_and_origin_compatible_indices":[row["index"] for row in candidates],"admitted_portrait":None,"visual_review_pending":True,"queue_mutated":False,"lease_issued":False,"canonical_record_created":False,"media_adopted":False,"repository_write":False,"outside_human_dependency":False,"owner_physical_action_required":False,"next_gate":"independent exact-byte visual and license review, then selected-original and derivative qualification"}
          receipt["identity"] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "receipt/census-receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-census-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v2/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-census-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
