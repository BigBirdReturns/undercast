name: doctor-who-cycle-011-rastel-final-product-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-product-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-product-v4
  cancel-in-progress: true

env:
  SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
  SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
  SOURCE_V2_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v2
  SOURCE_V2_COMMIT: 50084410519397f965558b1a47b357062676efe7
  SOURCE_V2_BLOB: 2f7a2bc0af3c011b92fd4a8575e488cbd1cb5b94
  SOURCE_V2_BYTES: "24558"
  SOURCE_V2_SHA256: bda54f65cb746e462a1fcae85df42ca56a634d07817f4625777ac0f63b95eeb2
  SOURCE_V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v2.yml
  SOURCE_V2_STEM: doctor-who-cycle-011-rastel-final-product-v2
  SOURCE_V1_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v1
  SOURCE_V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml
  TARGET_STEM: doctor-who-cycle-011-rastel-final-product-v4
  BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v4
  SELF: .github/workflows/doctor-who-cycle-011-rastel-final-product-v4.yml
  V3_PR: "784"
  V3_HEAD: ee3b814ae7edc4768e0f69058e526337cc06fef3
  V3_RUN: "31338262511"
  V3_QUALIFY_JOB: "93307571780"
  TASK_ID: ap_25277c8fbe9e5369ed2e3d81
  WALL_ID: UC-1356
  EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
  PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-product-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      QUALIFY_OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v4-qualification
      PREFLIGHT_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v4-preflight
      PREFLIGHT_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_WORKFLOW: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-
      EXECUTOR_MAIN_PLACEHOLDER: __RASTEL_EXECUTOR_MAIN__
      EXECUTOR_PR_PLACEHOLDER: __RASTEL_EXECUTOR_PR__
      EXECUTOR_HEAD_PLACEHOLDER: __RASTEL_EXECUTOR_HEAD__
      EXECUTOR_BRANCH_PLACEHOLDER: __RASTEL_EXECUTOR_BRANCH__
      EXECUTOR_SELF_PLACEHOLDER: __RASTEL_EXECUTOR_SELF__
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v4-bootstrap-qualify

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V3 threshold failure and recover exact V2 qualification programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,jobs}
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V3_PR" > "$BOOTSTRAP/api/v3-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN" > "$BOOTSTRAP/api/v3-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN/jobs?per_page=100" > "$BOOTSTRAP/api/v3-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_V2_PATH?ref=$SOURCE_V2_COMMIT" > "$BOOTSTRAP/api/source.json"
          JOB_NAME=qualify EXPECTED_COUNT=2 python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BOOTSTRAP']); api=root/'api'
          read=lambda name:json.loads((api/name).read_text())
          pr=read('v3-pr.json'); run=read('v3-run.json'); jobs=read('v3-jobs.json')['jobs']; source=read('source.json')
          assert pr['number']==int(os.environ['V3_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['sha']==os.environ['V3_HEAD'] and pr['base']['sha']==os.environ['CURRENT_BASE']
          assert run['id']==int(os.environ['V3_RUN']) and run['head_sha']==os.environ['V3_HEAD']
          assert run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          by_name={row['name']:row for row in jobs}
          assert set(('qualify','settle','materialize'))<=set(by_name)
          q=by_name['qualify']; assert q['id']==int(os.environ['V3_QUALIFY_JOB']) and q['status']=='completed' and q['conclusion']=='failure'
          assert by_name['settle']['status']=='completed' and by_name['settle']['conclusion']=='skipped'
          assert by_name['materialize']['status']=='completed' and by_name['materialize']['conclusion']=='skipped'
          steps={row['name']:(row['status'],row['conclusion']) for row in q['steps']}
          assert steps['Recover exact V2 qualification programs outside transaction roots']==('completed','failure')
          assert steps['Execute recovered V3 qualification programs']==('completed','skipped')
          raw=base64.b64decode(source['content'])
          assert source['sha']==os.environ['SOURCE_V2_BLOB']
          assert len(raw)==int(os.environ['SOURCE_V2_BYTES'])
          assert hashlib.sha256(raw).hexdigest()==os.environ['SOURCE_V2_SHA256']
          text=raw.decode('utf-8')
          source_stem=os.environ['SOURCE_V2_STEM']; target=os.environ['TARGET_STEM']
          assert text.startswith(f'name: {source_stem}\n')
          assert all(f'\n  {name}:\n' in text for name in ('qualify','settle','materialize'))
          text=text.replace(source_stem,target)
          job=os.environ['JOB_NAME']; want=int(os.environ['EXPECTED_COUNT'])
          lines=text.splitlines(keepends=True)
          start=next(i for i,line in enumerate(lines) if line==f'  {job}:\n')
          end=next((i for i in range(start+1,len(lines)) if re.fullmatch(r'  [A-Za-z0-9_-]+:\n',lines[i])),len(lines))
          block=lines[start:end]; scripts=[]; i=0
          while i<len(block):
              if block[i]=='        run: |\n':
                  i+=1; body=[]
                  while i<len(block):
                      line=block[i]
                      if line.strip() and len(line)-len(line.lstrip(' '))<10: break
                      if line.startswith('          '): body.append(line[10:])
                      elif not line.strip(): body.append('\n')
                      else: break
                      i+=1
                  script=''.join(body); assert '${{' not in script; scripts.append(script); continue
              i+=1
          assert len(scripts)==want,(job,len(scripts),want)
          job_dir=root/'jobs'/job; job_dir.mkdir(parents=True,exist_ok=True); rows=[]
          for index,script in enumerate(scripts,1):
              path=job_dir/f'{index:02d}.sh'; path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              rows.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          receipt={
            'version':1,
            'status':'cycle-011-rastel-final-product-v4-source-threshold-repaired',
            'failed_v3':{'pr':int(os.environ['V3_PR']),'head':os.environ['V3_HEAD'],'run':int(os.environ['V3_RUN']),'qualify_job':int(os.environ['V3_QUALIFY_JOB']),'settle':'skipped','materialize':'skipped'},
            'source':{'commit':os.environ['SOURCE_V2_COMMIT'],'git_blob':source['sha'],'path':os.environ['SOURCE_V2_PATH'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},
            'repair':{'old_predicate':'len(data)>30000','new_predicate':'exact commit, blob, 24558 bytes, SHA-256, and three-job markers','other_recovered_program_bytes_changed':False},
            'job':job,'scripts':rows,'bootstrap_outside_transaction_roots':True,
            'boundary':{'qualification_executed':False,'settlement_executed':False,'materialization_executed':False,'repository_write':False,'product_constructed':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/f'{job}-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute recovered V4 qualification programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;; *=*) export "$row" ;; esac
            done < "$GITHUB_ENV"
          }
          for script in "$BOOTSTRAP"/jobs/qualify/*.sh; do bash "$script"; apply_github_env; done
          cp "$BOOTSTRAP/qualify-recovery.json" "$QUALIFY_OUT/v4-outer-recovery.json"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v4-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v4-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v4-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v4-qualification
            /tmp/doctor-who-cycle-011-rastel-final-product-v4-preflight
            /tmp/doctor-who-cycle-011-rastel-final-product-v4-bootstrap-qualify
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

