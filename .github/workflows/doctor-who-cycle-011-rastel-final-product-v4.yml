          text=text.replace(source_stem,target); job=os.environ['JOB_NAME']; want=int(os.environ['EXPECTED_COUNT'])
          lines=text.splitlines(keepends=True); start=next(i for i,line in enumerate(lines) if line==f'  {job}:\n'); end=next((i for i in range(start+1,len(lines)) if re.fullmatch(r'  [A-Za-z0-9_-]+:\n',lines[i])),len(lines)); block=lines[start:end]
          scripts=[]; i=0
