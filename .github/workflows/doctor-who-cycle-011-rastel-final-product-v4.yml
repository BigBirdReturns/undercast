                      elif not line.strip(): body.append('\n')
                      else: break
                      i+=1
                  script=''.join(body); assert '${{' not in script; scripts.append(script); continue
              i+=1
          assert len(scripts)==want
          job_dir=root/'jobs'/job; job_dir.mkdir(parents=True,exist_ok=True); rows=[]
          for index,script in enumerate(scripts,1):
              path=job_dir/f'{index:02d}.sh'; path.write_text(script); subprocess.run(['bash','-n',str(path)],check=True)
              rows.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          receipt={'version':1,'status':'cycle-011-rastel-final-product-v4-exact-source-recovered','job':job,'source':{'commit':os.environ['SOURCE_V2_COMMIT'],'git_blob':source['sha'],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()},'scripts':rows,'bootstrap_outside_transaction_roots':True}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/f'{job}-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute recovered V4 settlement programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() { [ -f "$GITHUB_ENV" ] || return 0; while IFS= read -r row; do [ -z "$row" ] && continue; case "$row" in *'<<'*) exit 1 ;; *=*) export "$row" ;; esac; done < "$GITHUB_ENV"; }
          for script in "$BOOTSTRAP"/jobs/settle/*.sh; do bash "$script"; apply_github_env; done
          cp "$BOOTSTRAP/settle-recovery.json" "$OUT/v4-outer-recovery.json"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v4-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v4-settlement
