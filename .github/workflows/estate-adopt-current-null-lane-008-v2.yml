name: estate-adopt-current-null-lane-008-v2

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-current-null-lane-008-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-current-null-lane-008-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-current-null-lane-008.mjs
  RULING: data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
  RECEIPT: data/review/estate-debt/COLLECT-008-CANONICAL-ADOPTION.json
  PUBLICATION: data/review/estate-debt/COLLECT-008-PUBLICATION.json
  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
  OLD_WORKFLOW: .github/workflows/estate-adopt-current-null-lane-008.yml
  V2_WORKFLOW: .github/workflows/estate-adopt-current-null-lane-008-v2.yml
  FAILED_HELPER: .github/workflows/estate-repair-collect008-staging.yml

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head custody
        id: custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$OLD_WORKFLOW"
          test -e "$V2_WORKFLOW"
          test -e "$FAILED_HELPER"
          echo "head=$AUTHORIZED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Announce complete evidence-sized payment
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-008 V2 started on workflow run $GITHUB_RUN_ID.

          Authorized head: ${{ steps.custody.outputs.head }}.
          Exact terminal ruling: 24 reviewed, 24 authorized, 0 blocked.
          Expected payment: 15 → 39 canonical adoptions; 40 → 16 remaining packet obligations; 693 → 717 complete pairs; 373 → 349 missing stills.

          The V2 lane preserves the substantive executor and source-date repair, replaces only the failed porcelain-string staging check with a NUL-safe changed-path census, and will create no receipt until the complete candidate tree passes the repository and rendered-browser gate.
          EOF_COMMENT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove executor, ledger, and exact 24-object denominator
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          grep -Fq 'source.fetched_at = String(now).slice(0, 10);' "$EXECUTOR"
          node scripts/estate-canonical-adoption-ledger.mjs
          node "$EXECUTOR" | tee /tmp/COLLECT-008-preflight.json
          test "$(node -p "require('/tmp/COLLECT-008-preflight.json').authorized")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-preflight.json').pending")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-preflight.json').already_adopted")" = "0"
          test "$(node -p "require('/tmp/COLLECT-008-preflight.json').expected_cumulative_after")" = "39"
          test "$(node -p "require('/tmp/COLLECT-008-preflight.json').expected_remaining_after")" = "16"
          cp data/quality.json /tmp/COLLECT-008-quality-before.json

      - name: Apply all 24 terminally authorized packet winners
        run: |
          set -euo pipefail
          node "$EXECUTOR" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --report /tmp/COLLECT-008-apply.json \
            --write
          test "$(node -p "require('/tmp/COLLECT-008-apply.json').counts.adopted")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-apply.json').counts.already_adopted")" = "0"
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"

      - name: Rebuild audit, serving projections, and permanent records
        run: |
          set -euo pipefail
          npm run media:audit -- sync
          node scripts/shard.mjs
          node scripts/build-record-pages.mjs

      - name: Validate exact 24-card quality payment before smoke
        run: |
          set -euo pipefail
          node "$EXECUTOR" \
            --before-quality /tmp/COLLECT-008-quality-before.json \
            --validate | tee /tmp/COLLECT-008-validation.json
          test "$(node -p "require('/tmp/COLLECT-008-validation.json').adoptions")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-validation.json').quality.complete_pairs")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-validation.json').quality.missing_still")" = "-24"
          test "$(node -p "require('/tmp/COLLECT-008-validation.json').quality.missing_portrait")" = "0"
          test "$(node -p "require('/tmp/COLLECT-008-validation.json').quality.missing_both")" = "0"
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"

      - name: Stage exact candidate tree with NUL-safe path census
        id: candidate
        run: |
          set -euo pipefail
          node --input-type=module - "$RULING" > /tmp/COLLECT-008-expected-images.txt <<'NODE'
          import fs from 'node:fs';
          const ruling = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const images = ruling.decisions
            .filter((row) => row.status === 'authorized-current-null')
            .map((row) => row.current.destination_path)
            .sort();
          if (images.length !== 24 || new Set(images).size !== 24) throw new Error(`expected 24 unique ruled destinations, found ${images.length}/${new Set(images).size}`);
          for (const image of images) console.log(image);
          NODE
          git diff --name-only -z > /tmp/COLLECT-008-tracked-paths.zlist
          git ls-files --others --exclude-standard -z > /tmp/COLLECT-008-untracked-paths.zlist
          node --input-type=module - \
            /tmp/COLLECT-008-expected-images.txt \
            /tmp/COLLECT-008-tracked-paths.zlist \
            /tmp/COLLECT-008-untracked-paths.zlist <<'NODE'
          import fs from 'node:fs';
          const expectedImages = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/).filter(Boolean).sort();
          const readZ = (file) => fs.readFileSync(file).toString('utf8').split('\0').filter(Boolean);
          const paths = [...new Set([...readZ(process.argv[3]), ...readZ(process.argv[4])])].sort();
          if (!paths.length) throw new Error('COLLECT-008 candidate produced no changed paths');
          const actualImages = paths.filter((file) => file.startsWith('images/')).sort();
          if (JSON.stringify(actualImages) !== JSON.stringify(expectedImages)) {
            throw new Error(`COLLECT-008 image path mismatch\nexpected=${expectedImages.join(',')}\nactual=${actualImages.join(',')}`);
          }
          const unexpected = paths.filter((file) => !file.startsWith('data/') && !file.startsWith('records/') && !expectedImages.includes(file));
          if (unexpected.length) throw new Error(`COLLECT-008 candidate escaped product boundary: ${unexpected.join(', ')}`);
          if (!paths.includes('data/specimens.json') || !paths.includes('data/SOURCES.json')) throw new Error('canonical ledgers were not changed');
          console.log(`PASS — ${paths.length} changed paths contain 24 exact images and remain inside data/, records/, and the ruled destination set`);
          NODE
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-008-candidate.patch
          git write-tree > /tmp/COLLECT-008-candidate.tree
          git diff --cached --quiet && { echo 'COLLECT-008 produced no staged candidate tree.' >&2; exit 1; }
          echo "tree=$(cat /tmp/COLLECT-008-candidate.tree)" >> "$GITHUB_OUTPUT"

      - name: Smoke-gate exact 24-card candidate tree
        run: npm run gate

      - name: Refuse post-smoke drift before acceptance
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-008-candidate.tree)" = "$(git write-tree)"
          node "$EXECUTOR" \
            --before-quality /tmp/COLLECT-008-quality-before.json \
            --validate
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"

      - name: Promote receipt and cumulative ledger only after smoke
        run: |
          set -euo pipefail
          node "$EXECUTOR" \
            --before-quality /tmp/COLLECT-008-quality-before.json \
            --authorized-parent "$AUTHORIZED_HEAD" \
            --gated-tree "$(cat /tmp/COLLECT-008-candidate.tree)" \
            --workflow-run "$GITHUB_RUN_ID" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --promote | tee /tmp/COLLECT-008-promotion.json
          node scripts/estate-canonical-adoption-ledger.mjs | tee /tmp/COLLECT-008-ledger-validation.json
          git add -- "$RECEIPT" "$LEDGER"
          git diff --exit-code

      - name: Retire obsolete launch surfaces and stage exact adoption tree
        run: |
          set -euo pipefail
          git rm "$OLD_WORKFLOW" "$V2_WORKFLOW" "$FAILED_HELPER"
          git add -- "$RECEIPT" "$LEDGER"
          PROMOTION_PATHS="$(git diff --cached --name-only "$(cat /tmp/COLLECT-008-candidate.tree)" | sort)"
          EXPECTED_PATHS="$(printf '%s\n%s\n%s\n%s\n%s\n' \
            "$FAILED_HELPER" \
            "$LEDGER" \
            "$OLD_WORKFLOW" \
            "$RECEIPT" \
            "$V2_WORKFLOW" | sort)"
          test "$PROMOTION_PATHS" = "$EXPECTED_PATHS"
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-008-adoption.patch
          git write-tree > /tmp/COLLECT-008-adoption.tree

      - name: Publish smoke-passed adoption under exact-head lease
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate collection: adopt complete current-null packet lane' \
            -m 'transaction=COLLECT-008' \
            -m 'batch_adoptions=24' \
            -m 'arbitrary_batch_size=false' \
            -m 'cumulative_adoptions=39' \
            -m 'remaining_packet_review=16' \
            -m 'complete_pairs_delta=24' \
            -m 'missing_still_delta=-24' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_candidate_tree=$(cat /tmp/COLLECT-008-candidate.tree)" \
            -m "published_adoption_tree=$(cat /tmp/COLLECT-008-adoption.tree)"
          ADOPTION_HEAD="$(git rev-parse HEAD)"
          ADOPTION_TREE="$(git rev-parse HEAD^{tree})"
          test "$ADOPTION_TREE" = "$(cat /tmp/COLLECT-008-adoption.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$ADOPTION_HEAD" >> "$GITHUB_OUTPUT"
          echo "tree=$ADOPTION_TREE" >> "$GITHUB_OUTPUT"

      - name: Reconcile published adoption into durable custody
        run: |
          set -euo pipefail
          node "$EXECUTOR" \
            --adoption-head "${{ steps.adoption.outputs.head }}" \
            --adoption-tree "${{ steps.adoption.outputs.tree }}" \
            --gated-tree "$(cat /tmp/COLLECT-008-candidate.tree)" \
            --workflow-run "$GITHUB_RUN_ID" \
            --reconciliation-parent "${{ steps.adoption.outputs.head }}" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --reconcile | tee /tmp/COLLECT-008-reconciliation.json
          node scripts/estate-canonical-adoption-ledger.mjs | tee /tmp/COLLECT-008-final-ledger-validation.json

      - name: Retire executor and stage final publication-custody tree
        run: |
          set -euo pipefail
          git rm "$EXECUTOR"
          git add -- "$LEDGER" "$PUBLICATION"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' "$EXECUTOR" "$LEDGER" "$PUBLICATION" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-008-publication.patch
          git write-tree > /tmp/COLLECT-008-publication.tree

      - name: Gate final publication-custody tree
        run: npm run gate

      - name: Refuse final post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-008-publication.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish final custody under adoption-head lease
        id: final
        run: |
          set -euo pipefail
          ADOPTION_HEAD="${{ steps.adoption.outputs.head }}"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$ADOPTION_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate custody: reconcile complete current-null lane publication' \
            -m 'transaction=COLLECT-008' \
            -m "adoption_head=${ADOPTION_HEAD}" \
            -m "adoption_tree=${{ steps.adoption.outputs.tree }}" \
            -m "gated_candidate_tree=$(cat /tmp/COLLECT-008-candidate.tree)" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_publication_tree=$(cat /tmp/COLLECT-008-publication.tree)"
          FINAL_HEAD="$(git rev-parse HEAD)"
          FINAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FINAL_TREE" = "$(cat /tmp/COLLECT-008-publication.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${ADOPTION_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"
          echo "tree=$FINAL_TREE" >> "$GITHUB_OUTPUT"

      - name: Report complete 24-card product payment
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-008 V2 passed every gate and published on workflow run $GITHUB_RUN_ID.

          ```text
          adoption head:       ${{ steps.adoption.outputs.head }}
          final custody head:  ${{ steps.final.outputs.head }}
          candidate tree:      $(cat /tmp/COLLECT-008-candidate.tree)
          adoption tree:       ${{ steps.adoption.outputs.tree }}
          final custody tree:  $(cat /tmp/COLLECT-008-publication.tree)
          adopted objects:     24
          cumulative:          39 / 55
          remaining review:    16
          complete pairs:      693 → 717
          missing stills:      373 → 349
          missing both:        109 → 109
          ```

          The complete 24-object candidate passed the repository and rendered-browser gate before the receipt existed. Publication custody passed the complete gate again. The obsolete workflow, failed staging helper, V2 workflow, and executor retired themselves.
          EOF_COMMENT

      - name: Report failed transaction
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-008 V2 failed closed on workflow run $GITHUB_RUN_ID.

          No 24-object payment claim is authorized unless both the smoke-passed adoption commit and final publication-custody commit exist on the exact branch. Preserve the corrected ruling and packet evidence; repair only the exact data, quality, path, gate, or lease failure.
          EOF_COMMENT

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-008-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-008-preflight.json
            /tmp/COLLECT-008-quality-before.json
            /tmp/COLLECT-008-apply.json
            /tmp/COLLECT-008-validation.json
            /tmp/COLLECT-008-expected-images.txt
            /tmp/COLLECT-008-tracked-paths.zlist
            /tmp/COLLECT-008-untracked-paths.zlist
            /tmp/COLLECT-008-candidate.patch
            /tmp/COLLECT-008-candidate.tree
            /tmp/COLLECT-008-promotion.json
            /tmp/COLLECT-008-ledger-validation.json
            /tmp/COLLECT-008-adoption.patch
            /tmp/COLLECT-008-adoption.tree
            /tmp/COLLECT-008-reconciliation.json
            /tmp/COLLECT-008-final-ledger-validation.json
            /tmp/COLLECT-008-publication.patch
            /tmp/COLLECT-008-publication.tree
            data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
            data/review/estate-debt/COLLECT-008-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-008-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
