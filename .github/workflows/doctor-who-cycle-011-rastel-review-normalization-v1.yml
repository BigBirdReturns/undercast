name: doctor-who-cycle-011-rastel-review-normalization-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-review-normalization-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-review-normalization-v1
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-review-normalization-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-review-normalization-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-review-normalization-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-review-normalization-v1
      MATERIALIZER_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-materializer-v1
      MATERIALIZER_WORKFLOW: doctor-who-cycle-011-rastel-finalizer-materializer-v1
      MATERIALIZER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-finalizer-materializer-v1-
      OLD_REVIEW_PR: "728"
      OLD_REVIEW_HEAD: 0d8c5c1623c92ce3c04c38e6cb6a5c24cae898cc
      OLD_REVIEW_RUN: "31294273106"
      OLD_REVIEW_JOB: "93196675184"
      OLD_REVIEW_ARTIFACT: "9032445196"
      OLD_REVIEW_ZIP_SHA256: 44b163750646ccd1d3dbcdcfb89a7d63c9ba5b54ca466285e5e73b07decb5e27
      OLD_REVIEW_IDENTITY: 5c9df66426b650778b4a95dbf7826c4bb0e1af24cefad3398a2cb222065ef338
      OLD_STATUS: cycle-010-merx-candidate-independently-approved-v1
      NEW_STATUS: cycle-011-rastel-candidate-independently-approved-v1
      OLD_TASK: ap_cab2d7f95d930401627c1b30
      OLD_LEASE: lease_b8955992c5af735f9e40b242
      OLD_WALL: UC-1355
      OLD_ROLE: Merx
      OLD_PRODUCTION: UNIT: Encounters
      OLD_SOURCE_FINGERPRINT: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      OLD_PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      OLD_CANDIDATE_PR: "726"
      OLD_CANDIDATE_HEAD: 992c1ae11106456fa20958aabe01a48c54f2e08c
      OLD_CANDIDATE_RUN: "31293712144"
      OLD_CANDIDATE_JOB: "93195270833"
      OLD_CANDIDATE_ARTIFACT: "9032284342"
      OLD_CANDIDATE_ZIP_SHA256: 31618c1732e5e9535e87643758093b481bc6b0e454f9b6c93ad98576aaafeb34
      OLD_CANDIDATE_IDENTITY: 558ddddb49246d5b0b18e2d121bed995f92310f6752baac0f16a7426f1b0c67f
      OLD_CANDIDATE_COMMIT: 966022bc743463ca545a3bead221cf422d418815
      OLD_CANDIDATE_TREE: 4df0f36f725a5a927334affac0c0e74d02453f49
      OLD_CANDIDATE_PATHS: "39"
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      ROLE: Rastel
      WALL_ID: UC-1356
      PRODUCTION: Master of the Daleks
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind normalization carrier and successful materializer artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,materializer,legacy,normalized,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$MATERIALIZER_BRANCH" -f per_page=100 > "$OUT/api/materializer-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'materializer-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['MATERIALIZER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_BASE']
          (api/'materializer-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'materializer-head.txt').write_text(source['head']['sha']+'\n')
          (api/'materializer-number.txt').write_text(str(source['number'])+'\n')
          PY
          materializer_head="$(cat "$OUT/api/materializer-head.txt")"
          materializer_pr="$(cat "$OUT/api/materializer-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$MATERIALIZER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/materializer-runs.json"
            run_id="$(MATERIALIZER_HEAD="$materializer_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/materializer-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['MATERIALIZER_HEAD'] and row['name']==os.environ['MATERIALIZER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/materializer-run.json"
              if [ "$(jq -r '.status' "$OUT/api/materializer-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/materializer-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/materializer-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/materializer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/materializer-artifacts.json"
          materializer_job="$(jq -r '.jobs[] | select(.name=="materialize" and .conclusion=="success") | .id' "$OUT/api/materializer-jobs.json")"
          test -n "$materializer_job"
          materializer_artifact="$(MATERIALIZER_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/materializer-artifacts.json').read_text())['artifacts']
          expected=os.environ['MATERIALIZER_ARTIFACT_PREFIX']+os.environ['MATERIALIZER_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,[(row['id'],row['name']) for row in rows]
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$materializer_artifact" > "$OUT/api/materializer-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$materializer_artifact/zip" > "$OUT/materializer.zip"
          materializer_sha="$(sha256sum "$OUT/materializer.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/materializer-artifact.json")" = "sha256:$materializer_sha"
          MATERIALIZER_PR="$materializer_pr" MATERIALIZER_HEAD="$materializer_head" MATERIALIZER_RUN="$run_id" MATERIALIZER_JOB="$materializer_job" MATERIALIZER_ARTIFACT="$materializer_artifact" MATERIALIZER_ZIP_SHA256="$materializer_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=root/'materializer'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'materializer.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in target.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(target).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          def status_row(status):
              rows=[]
              for path in target.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows])
              return rows[0]
          bindings_path,bindings=status_row('cycle-011-rastel-finalizer-exact-bindings-v1')
          transform_rows=[]
          for path in target.rglob('transformation.json'):
              data=json.loads(path.read_text()); transform_rows.append((path,data))
          assert len(transform_rows)==1
          transform_path,transform=transform_rows[0]
          for data in (bindings,transform):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          assert bindings['candidate']['task']==os.environ['TASK_ID'] and bindings['candidate']['wall']==os.environ['WALL_ID']
          assert bindings['candidate']['lease']==os.environ['EXPECTED_LEASE'] and bindings['candidate']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert bindings['queue']=={'before':{'queued':306,'resolved':10,'in_flight':0},'after':{'queued':305,'resolved':11,'in_flight':0}}
          assert transform['target']['bash_syntax'] is True and transform['target']['compile_errors']==[] and transform['boundary']['finalizer_executed'] is False
          (root/'receipt/bindings.json').write_text(json.dumps(bindings,indent=2,sort_keys=True)+'\n')
          (root/'receipt/transformation.json').write_text(json.dumps(transform,indent=2,sort_keys=True)+'\n')
          custody={'status':'cycle-011-rastel-materializer-artifact-authenticated','version':1,'source':{'pr':int(os.environ['MATERIALIZER_PR']),'head':os.environ['MATERIALIZER_HEAD'],'run':int(os.environ['MATERIALIZER_RUN']),'job':int(os.environ['MATERIALIZER_JOB']),'artifact':int(os.environ['MATERIALIZER_ARTIFACT']),'artifact_sha256':os.environ['MATERIALIZER_ZIP_SHA256']},'bindings_identity':bindings['identity'],'transformation_identity':transform['identity'],'ledgers':ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/materializer-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_BASE=%s\nMATERIALIZER_PR=%s\nMATERIALIZER_HEAD=%s\nMATERIALIZER_RUN=%s\nMATERIALIZER_JOB=%s\nMATERIALIZER_ARTIFACT=%s\nMATERIALIZER_ZIP_SHA256=%s\n' "$pr" "$head" "$base" "$materializer_pr" "$materializer_head" "$run_id" "$materializer_job" "$materializer_artifact" "$materializer_sha" >> "$GITHUB_ENV"

      - name: Authenticate exact legacy approval schema
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$OLD_REVIEW_PR" > "$OUT/api/legacy-review-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OLD_REVIEW_RUN" > "$OUT/api/legacy-review-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OLD_REVIEW_RUN/jobs?per_page=100" > "$OUT/api/legacy-review-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$OLD_REVIEW_ARTIFACT" > "$OUT/api/legacy-review-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$OLD_REVIEW_ARTIFACT/zip" > "$OUT/legacy.zip"
          test "$(sha256sum "$OUT/legacy.zip" | awk '{print $1}')" = "$OLD_REVIEW_ZIP_SHA256"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=root/'legacy'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          pr=json.loads((root/'api/legacy-review-pr.json').read_text()); run=json.loads((root/'api/legacy-review-run.json').read_text()); jobs=json.loads((root/'api/legacy-review-jobs.json').read_text())['jobs']; artifact=json.loads((root/'api/legacy-review-artifact.json').read_text())
          assert pr['number']==int(os.environ['OLD_REVIEW_PR']) and pr['head']['sha']==os.environ['OLD_REVIEW_HEAD'] and pr['merged'] is False
          assert run['id']==int(os.environ['OLD_REVIEW_RUN']) and run['head_sha']==os.environ['OLD_REVIEW_HEAD'] and run['conclusion']=='success'
          job=next(row for row in jobs if row['id']==int(os.environ['OLD_REVIEW_JOB'])); assert job['conclusion']=='success'
          assert artifact['id']==int(os.environ['OLD_REVIEW_ARTIFACT']) and artifact['digest']=='sha256:'+os.environ['OLD_REVIEW_ZIP_SHA256'] and artifact['expired'] is False
          with zipfile.ZipFile(root/'legacy.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          approvals=[]
          for path in target.rglob('*.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              if data.get('status')==os.environ['OLD_STATUS']:approvals.append((path,data))
          assert len(approvals)==1,[p.as_posix() for p,_ in approvals]
          path,approval=approvals[0]
          identity=approval.pop('identity'); assert identity==os.environ['OLD_REVIEW_IDENTITY']; assert sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; approval['identity']=identity
          (root/'receipt/legacy-approval.json').write_text(json.dumps(approval,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          metadata={'status':'exact-legacy-merx-approval-schema-authenticated','version':1,'path':path.relative_to(target).as_posix(),'bytes':path.stat().st_size,'sha256':sha(path.read_bytes()),'identity':identity}
          metadata['receipt_identity']=sha(json.dumps(metadata,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/legacy-schema.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n')
          PY

      - name: Project independent Rastel authority into exact legacy topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['OUT']); old=json.loads((root/'receipt/legacy-approval.json').read_text()); bindings=json.loads((root/'receipt/bindings.json').read_text())
          sha=lambda data:hashlib.sha256(data).hexdigest()
          old_identity=old.pop('identity')
          mapping={
              os.environ['OLD_STATUS']:os.environ['NEW_STATUS'],
              os.environ['OLD_TASK']:os.environ['TASK_ID'],
              os.environ['OLD_LEASE']:bindings['candidate']['lease'],
              os.environ['OLD_WALL']:os.environ['WALL_ID'],
              os.environ['OLD_ROLE']:os.environ['ROLE'],
              os.environ['OLD_PRODUCTION']:os.environ['PRODUCTION'],
              os.environ['OLD_SOURCE_FINGERPRINT']:os.environ['SOURCE_FINGERPRINT'],
              os.environ['OLD_PORTRAIT_SHA256']:os.environ['PORTRAIT_SHA256'],
              os.environ['OLD_CANDIDATE_PR']:str(bindings['producer']['pr']),
              os.environ['OLD_CANDIDATE_HEAD']:bindings['producer']['head'],
              os.environ['OLD_CANDIDATE_RUN']:str(bindings['producer']['run']),
              os.environ['OLD_CANDIDATE_JOB']:str(bindings['producer']['job']),
              os.environ['OLD_CANDIDATE_ARTIFACT']:str(bindings['producer']['artifact']),
              os.environ['OLD_CANDIDATE_ZIP_SHA256']:bindings['producer']['artifact_sha256'],
              os.environ['OLD_CANDIDATE_IDENTITY']:bindings['candidate']['receipt_identity'],
              os.environ['OLD_CANDIDATE_COMMIT']:bindings['candidate']['commit'],
              os.environ['OLD_CANDIDATE_TREE']:bindings['candidate']['tree'],
          }
          changes=[]
          def transform(value,path=()):
              if isinstance(value,dict):
                  return {key:transform(item,path+(key,)) for key,item in value.items()}
              if isinstance(value,list):
                  return [transform(item,path+('[]',)) for item in value]
              if isinstance(value,str):
                  result=value
                  for old_value,new_value in mapping.items():
                      if old_value in result:
                          count=result.count(old_value); result=result.replace(old_value,new_value); changes.append({'path':path,'old':old_value,'new':new_value,'occurrences':count})
                  result=result.replace('merx','rastel')
                  result=result.replace('Merx','Rastel')
                  result=result.replace('307 queued / 9 resolved / 0 in flight','306 queued / 10 resolved / 0 in flight')
                  result=result.replace('306 queued / 10 resolved / 0 in flight','305 queued / 11 resolved / 0 in flight')
                  return result
              if isinstance(value,int) and not isinstance(value,bool):
                  key=path[-1].lower() if path else ''
                  joined='.'.join(str(part).lower() for part in path)
                  if key in ('paths','path_count','candidate_paths') and value==int(os.environ['OLD_CANDIDATE_PATHS']):
                      changes.append({'path':path,'old':value,'new':bindings['candidate']['paths'],'occurrences':1}); return bindings['candidate']['paths']
                  if 'queue' in joined or key in ('queued','resolved','in_flight'):
                      if key=='queued' and value==307:changes.append({'path':path,'old':307,'new':306,'occurrences':1}); return 306
                      if key=='queued' and value==306:changes.append({'path':path,'old':306,'new':305,'occurrences':1}); return 305
                      if key=='resolved' and value==9:changes.append({'path':path,'old':9,'new':10,'occurrences':1}); return 10
                      if key=='resolved' and value==10:changes.append({'path':path,'old':10,'new':11,'occurrences':1}); return 11
                  if key in ('pr','candidate_pr') and value==int(os.environ['OLD_CANDIDATE_PR']):changes.append({'path':path,'old':value,'new':bindings['producer']['pr'],'occurrences':1}); return bindings['producer']['pr']
                  if key in ('run','candidate_run') and value==int(os.environ['OLD_CANDIDATE_RUN']):changes.append({'path':path,'old':value,'new':bindings['producer']['run'],'occurrences':1}); return bindings['producer']['run']
                  if key in ('job','candidate_job') and value==int(os.environ['OLD_CANDIDATE_JOB']):changes.append({'path':path,'old':value,'new':bindings['producer']['job'],'occurrences':1}); return bindings['producer']['job']
                  if key in ('artifact','candidate_artifact') and value==int(os.environ['OLD_CANDIDATE_ARTIFACT']):changes.append({'path':path,'old':value,'new':bindings['producer']['artifact'],'occurrences':1}); return bindings['producer']['artifact']
              return value
          normalized=transform(old)
          normalized['identity']=sha(json.dumps(normalized,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          def topology(value,path=()):
              rows=[]
              if isinstance(value,dict):
                  for key,item in value.items():rows.extend(topology(item,path+(key,)))
              elif isinstance(value,list):
                  rows.append((path,'list',len(value)))
                  for index,item in enumerate(value):rows.extend(topology(item,path+('[]',)))
              else:rows.append((path,type(value).__name__,None))
              return rows
          old_for_topology=dict(old); old_for_topology['identity']=old_identity
          old_topology=topology(old_for_topology); new_topology=topology(normalized)
          assert old_topology==new_topology
          flat=json.dumps(normalized,sort_keys=True,ensure_ascii=False)
          required=[os.environ['NEW_STATUS'],os.environ['TASK_ID'],bindings['candidate']['lease'],os.environ['WALL_ID'],os.environ['ROLE'],bindings['candidate']['commit'],bindings['candidate']['tree'],bindings['candidate']['receipt_identity'],os.environ['PORTRAIT_SHA256']]
          missing=[value for value in required if value not in flat]
          old_values=[os.environ['OLD_TASK'],os.environ['OLD_LEASE'],os.environ['OLD_WALL'],os.environ['OLD_CANDIDATE_HEAD'],os.environ['OLD_CANDIDATE_COMMIT'],os.environ['OLD_CANDIDATE_TREE'],os.environ['OLD_CANDIDATE_IDENTITY'],os.environ['OLD_PORTRAIT_SHA256']]
          residual={value:flat.count(value) for value in old_values if value in flat}
          assert not missing,missing
          assert not residual,residual
          (root/'normalized/approval.json').write_text(json.dumps(normalized,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          receipt={
              'status':'cycle-011-rastel-review-schema-normalized-v1','version':1,
              'legacy':{'pr':int(os.environ['OLD_REVIEW_PR']),'head':os.environ['OLD_REVIEW_HEAD'],'run':int(os.environ['OLD_REVIEW_RUN']),'job':int(os.environ['OLD_REVIEW_JOB']),'artifact':int(os.environ['OLD_REVIEW_ARTIFACT']),'artifact_sha256':os.environ['OLD_REVIEW_ZIP_SHA256'],'identity':old_identity},
              'substantive_authority':bindings['observer'],
              'candidate':bindings['candidate'],
              'normalized':{'status':normalized['status'],'identity':normalized['identity'],'sha256':sha((root/'normalized/approval.json').read_bytes()),'topology_equal':True},
              'changes':changes,
              'queue':bindings['queue'],
              'boundary':{'schema_projection_only':True,'substantive_review_reopened':False,'candidate_mutated':False,'finalizer_executed':False,'cycle_receipt_written':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/normalization.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          jq -e '.status=="cycle-011-rastel-review-schema-normalized-v1" and .boundary.schema_projection_only==true and .boundary.finalizer_executed==false' "$OUT/receipt/normalization.json" >/dev/null

      - name: Seal normalized review packet
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-review-normalization-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-review-normalization-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-review-normalization-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-review-normalization-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
