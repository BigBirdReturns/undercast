name: doctor-who-cycle-008-kreg-independent-media-review-v1

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-independent-media-review-v1.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: doctor-who-cycle-008-kreg-independent-media-review-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-independent-media-review-v1.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-review-v1
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-independent-media-review-v1

  SOURCE_PR: "524"
  SOURCE_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v11-single-deletion-census
  SOURCE_HEAD: 56a927b3c8b10587e934921138beff1a5d5b49e0
  SOURCE_RUN: "31110331798"
  SOURCE_JOB: "92646143078"
  SOURCE_ARTIFACT_ID: "8971420444"
  SOURCE_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v11-single-deletion-census-31110331798
  SOURCE_ARTIFACT_SHA256: 75dab09bac152256ba5b9f471b244af1916b509d453e60adbc39d5aa7503905c
  SOURCE_ARTIFACT_MEMBERS: "252"

  TASK_ID: ap_469d79ea29fd7f877395d20f
  PERFORMER: Dan Starkey
  ROLE: Kreg
  PERFORMANCE_MODE: voice
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_PARENT_REVISION: "3189022"
  SOURCE_TIMESTAMP: 2026-07-28T09:20:48Z
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  FILE_TITLE: File:Kree.jpg
  FILE_PAGE_ID: "387498"
  FILE_REVISION: "3851640"
  FILE_TIMESTAMP: 2026-07-28T09:19:09Z
  IMAGE_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  IMAGE_SHA1: 650069b8a22e7794b00ae6a2d8d32952e6a72ff2
  IMAGE_BYTES: "67113"
  IMAGE_WIDTH: "1053"
  IMAGE_HEIGHT: "805"
  DEFAULT_WEBP_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  REVIEWED_AT: 2026-08-06T14:23:00.000Z
  GH_TOKEN: ${{ github.token }}

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-independent-media-review-v1.yml

      - name: Bind exact reviewer, green census, immutable artifact, and reviewed image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/source" "$OUT/review"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          test -z "$(git status --porcelain)"

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$OUT/live-main.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" > "$OUT/live-carrier.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR}" > "$OUT/source-pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" > "$OUT/source-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/jobs?per_page=100" > "$OUT/source-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" > "$OUT/source-artifact.json"

          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['OUT'])
          def read(name):
              return json.loads((out / name).read_text())
          def fail(message):
              raise SystemExit(message)
          main = read('live-main.json')
          carrier = read('live-carrier.json')
          pr = read('source-pr.json')
          run = read('source-run.json')
          jobs = read('source-jobs.json').get('jobs', [])
          artifact = read('source-artifact.json')
          if main.get('object', {}).get('sha') != os.environ['EXACT_MAIN']:
              fail('live main drifted')
          if carrier.get('object', {}).get('sha') != os.environ['HEAD_SHA']:
              fail('review carrier ref drifted')
          if not (pr.get('number') == int(os.environ['SOURCE_PR']) and pr.get('state') == 'open' and pr.get('draft') is True and not pr.get('merged')):
              fail('source PR state drifted')
          if pr.get('base', {}).get('ref') != 'main' or pr.get('base', {}).get('sha') != os.environ['EXACT_MAIN']:
              fail('source PR base drifted')
          if pr.get('head', {}).get('ref') != os.environ['SOURCE_BRANCH'] or pr.get('head', {}).get('sha') != os.environ['SOURCE_HEAD']:
              fail('source PR head drifted')
          if pr.get('commits') != 2 or pr.get('changed_files') != 2:
              fail('source PR denominator drifted')
          if not (run.get('id') == int(os.environ['SOURCE_RUN']) and run.get('status') == 'completed' and run.get('conclusion') == 'success' and run.get('event') == 'pull_request'):
              fail('source run state drifted')
          if run.get('head_sha') != os.environ['SOURCE_HEAD'] or run.get('head_branch') != os.environ['SOURCE_BRANCH']:
              fail('source run head drifted')
          exact_jobs = [job for job in jobs if job.get('id') == int(os.environ['SOURCE_JOB']) and job.get('name') == 'census']
          if len(exact_jobs) != 1 or exact_jobs[0].get('status') != 'completed' or exact_jobs[0].get('conclusion') != 'success':
              fail('source job drifted')
          required_steps = {
              'Run actions/checkout@v4',
              'Bind V10 packet and prove unique one-character deletion',
              'Execute uniquely recovered checksum-bound structural census program',
              'Seal self-hashed V11 envelope over exact V6 program receipt',
              'Upload exact Kreg V11 bounded route-census packet'
          }
          observed = {step.get('name'): step.get('conclusion') for step in exact_jobs[0].get('steps', [])}
          if any(observed.get(step) != 'success' for step in required_steps):
              fail('source job steps drifted')
          if not (artifact.get('id') == int(os.environ['SOURCE_ARTIFACT_ID']) and artifact.get('name') == os.environ['SOURCE_ARTIFACT_NAME'] and artifact.get('digest') == f"sha256:{os.environ['SOURCE_ARTIFACT_SHA256']}" and artifact.get('expired') is False):
              fail('source artifact identity drifted')
          workflow_run = artifact.get('workflow_run', {})
          if workflow_run.get('id') != int(os.environ['SOURCE_RUN']) or workflow_run.get('head_sha') != os.environ['SOURCE_HEAD'] or workflow_run.get('head_branch') != os.environ['SOURCE_BRANCH']:
              fail('source artifact binding drifted')
          (out / 'source-artifact-url.txt').write_text(artifact['archive_download_url'] + '\n')
          PY

          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$OUT/source-artifact.zip" \
            "$(cat "$OUT/source-artifact-url.txt")"
          test "$(sha256sum "$OUT/source-artifact.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"

          python - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          out = pathlib.Path(os.environ['OUT'])
          source = out / 'source'
          zip_path = out / 'source-artifact.zip'
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def fail(message):
              raise SystemExit(message)
          with zipfile.ZipFile(zip_path) as zf:
              infos = zf.infolist()
              names = [info.filename for info in infos]
              if len(names) != int(os.environ['SOURCE_ARTIFACT_MEMBERS']) or len(names) != len(set(names)):
                  fail(f'artifact member denominator drifted: {len(names)}')
              for info in infos:
                  path = pathlib.PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0o170000
                  if path.is_absolute() or '..' in path.parts or stat.S_ISLNK(mode):
                      fail(f'unsafe artifact member: {info.filename}')
              zf.extractall(source)
          critical = {
              'single-deletion-proof.json': '3cc2c333b9bad3b0f684cda8c1c2103584780519f9b82ec567ef5dbd724dd77f',
              'route-census-summary.json': 'b45084a60f5fdd1f9a000ebca9379cbf6043776276938bd265ddbdf7a2b8507b',
              'kreg-media-recovery-metadata.json': '03147f3080a31bed26ee27f7a93876dcac1b1a833bba9d9b87981c734e7d67c0',
              'boundary.json': 'f3d760e6aa8e2d4afb7353472bbb1f2360cd0684293e6267301ac4a899c441f8',
              'quality-projection.json': '0cd719cd327717c9544697a74ff1551c81498c45234e4119fb28803ba2ce5e35',
              'recovery-receipt.json': 'd96700fe684af5338a18153b7212dbcb79f5de20adc88cfe13be589cf934d9d1',
              'v11-recovery-receipt.json': '87d7249bac36100ad5556ea22b76577e110a810b417da436345a3b3079fff8a0',
              'kreg-page.wikitext': os.environ['SOURCE_CONTENT_SHA256'],
              'file-imageinfo-api.json': 'e2f493735065c7ae953b2eccfc813b6aa465e9cf7e987c639ddb17705f801715',
              'file-page-api.json': '95074c0ba8a9c7e70168351fa1e005602cdd9d41e29a5fd1dbd61c760d12bd3c',
              'kreg-public-original.jpg': os.environ['IMAGE_SHA256'],
              'current-adoption-matches.txt': hashlib.sha256(b'').hexdigest(),
              'route-census.json': '48173490c931564b8f7a2c1f5d3d71a8bc318e61b34f9131bf2902357f9b9d36'
          }
          actual = {}
          for name, expected in critical.items():
              path = source / name
              if not path.is_file():
                  fail(f'missing critical artifact member: {name}')
              digest = sha(path.read_bytes())
              actual[name] = digest
              if digest != expected:
                  fail(f'critical artifact member drifted: {name}')
          (out / 'critical-member-hashes.json').write_text(json.dumps(actual, indent=2, sort_keys=True) + '\n')

          source_text = (source / 'kreg-page.wikitext').read_text()
          required_source = [
              '|image             =Kree.jpg',
              '|voice actor       = Dan Starkey',
              "'''Kreg''' was a [[Sontaran]]",
              'The Great Sontaran War'
          ]
          if any(token not in source_text for token in required_source):
              fail('source assignment drifted')

          summary = json.loads((source / 'route-census-summary.json').read_text())
          if summary.get('route_count') != 18 or summary.get('attempt_count') != 54 or summary.get('successful_attempts') != 54:
              fail('route census denominator drifted')
          if summary.get('verdict') != 'upload-byte-identity-not-publicly-recovered-public-original-representation-stable':
              fail('route census verdict drifted')
          if summary.get('exact_upload_identity_recovered') is not False or summary.get('exact_upload_matches') != 0:
              fail('upload identity boundary drifted')
          public = summary.get('public_original_representation', {})
          if public.get('sha256') != os.environ['IMAGE_SHA256'] or public.get('count') != 27 or public.get('bytes') != int(os.environ['IMAGE_BYTES']) or public.get('width', 1053) not in (None, 1053):
              fail('public original convergence drifted')
          derivative = summary.get('default_derivative', {})
          if derivative.get('sha256') != os.environ['DEFAULT_WEBP_SHA256'] or derivative.get('count') != 15:
              fail('default derivative convergence drifted')

          metadata = json.loads((source / 'kreg-media-recovery-metadata.json').read_text())
          if metadata.get('file_title') != os.environ['FILE_TITLE'] or metadata.get('pageid') != int(os.environ['FILE_PAGE_ID']):
              fail('file identity drifted')
          if metadata.get('public_original_representation', {}).get('sha256') != os.environ['IMAGE_SHA256']:
              fail('metadata image drifted')
          if metadata.get('file_page', {}).get('revision') != int(os.environ['FILE_REVISION']) or metadata.get('file_page', {}).get('content_bytes') != 0:
              fail('file-page evidence boundary drifted')

          boundary = json.loads((source / 'boundary.json').read_text())
          if boundary.get('exact_main') != os.environ['EXACT_MAIN'] or boundary.get('task_id') != os.environ['TASK_ID']:
              fail('source boundary identity drifted')
          if boundary.get('public_original_representation_recovered') is not True or boundary.get('visual_review_completed') is not False:
              fail('source review boundary drifted')
          forbidden_true = ['lease_issued','queue_mutated','canonical_record_created','media_adopted','waterline_event_written','cycle_receipt_written','product_published','cycle_008_started','outside_human_dependency']
          if any(boundary.get(key) is not False for key in forbidden_true):
              fail('source authority boundary drifted')

          v11 = json.loads((source / 'v11-recovery-receipt.json').read_text())
          receipt = v11.pop('receipt_sha256', None)
          stable = (json.dumps(v11, indent=2, sort_keys=True) + '\n').encode()
          if receipt != hashlib.sha256(stable).hexdigest():
              fail('V11 receipt self-hash drifted')
          if v11.get('transaction') != 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V11-CENSUS' or v11.get('run_id') != int(os.environ['SOURCE_RUN']) or v11.get('job_id') != int(os.environ['SOURCE_JOB']):
              fail('V11 receipt identity drifted')

          image = (source / 'kreg-public-original.jpg').read_bytes()
          if len(image) != int(os.environ['IMAGE_BYTES']) or sha(image) != os.environ['IMAGE_SHA256'] or not image.startswith(b'\xff\xd8') or not image.endswith(b'\xff\xd9'):
              fail('JPEG byte custody drifted')
          def jpeg_dimensions(data):
              index = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while index + 4 <= len(data):
                  if data[index] != 0xFF:
                      index += 1
                      continue
                  while index < len(data) and data[index] == 0xFF:
                      index += 1
                  if index >= len(data):
                      break
                  marker = data[index]
                  index += 1
                  if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  if index + 2 > len(data):
                      break
                  length = int.from_bytes(data[index:index+2], 'big')
                  if length < 2 or index + length > len(data):
                      break
                  if marker in sof:
                      height = int.from_bytes(data[index+3:index+5], 'big')
                      width = int.from_bytes(data[index+5:index+7], 'big')
                      return width, height
                  index += length
              raise ValueError('JPEG dimensions not found')
          if jpeg_dimensions(image) != (int(os.environ['IMAGE_WIDTH']), int(os.environ['IMAGE_HEIGHT'])):
              fail('JPEG dimensions drifted')
          identify = (source / 'kreg-public-original-identify.txt').read_text()
          for token in ['Format: JPEG', 'Geometry: 1053x805+0+0', 'exif:ImageDescription: Screenshot']:
              if token not in identify:
                  fail(f'image structural review token missing: {token}')

          review = {
              'schema_version': 1,
              'transaction': 'DOCTOR-WHO-CYCLE-008-KREG-INDEPENDENT-MEDIA-REVIEW-V1',
              'verdict': 'approved-for-separate-cycle-candidate',
              'exact_main': os.environ['EXACT_MAIN'],
              'carrier_head': os.environ['HEAD_SHA'],
              'reviewed_at': os.environ['REVIEWED_AT'],
              'reviewer': 'chatgpt-second-desk',
              'reviewer_role': 'second-desk',
              'task': {
                  'id': os.environ['TASK_ID'],
                  'performer': os.environ['PERFORMER'],
                  'role': os.environ['ROLE'],
                  'performance_mode': os.environ['PERFORMANCE_MODE']
              },
              'source': {
                  'page_id': int(os.environ['SOURCE_PAGE_ID']),
                  'revision': int(os.environ['SOURCE_REVISION']),
                  'parent_revision': int(os.environ['SOURCE_PARENT_REVISION']),
                  'timestamp': os.environ['SOURCE_TIMESTAMP'],
                  'fingerprint': os.environ['SOURCE_FINGERPRINT'],
                  'content_sha256': os.environ['SOURCE_CONTENT_SHA256'],
                  'image_assignment': 'Kree.jpg',
                  'file_title': os.environ['FILE_TITLE'],
                  'file_page_id': int(os.environ['FILE_PAGE_ID']),
                  'file_revision': int(os.environ['FILE_REVISION']),
                  'filename_character_mismatch_preserved': True
              },
              'census': {
                  'run_id': int(os.environ['SOURCE_RUN']),
                  'job_id': int(os.environ['SOURCE_JOB']),
                  'artifact_id': int(os.environ['SOURCE_ARTIFACT_ID']),
                  'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
                  'route_count': 18,
                  'header_profiles': 3,
                  'attempt_count': 54,
                  'successful_attempts': 54,
                  'exact_upload_identity_recovered': False,
                  'public_original_representation_stable': True
              },
              'media': {
                  'side': 'still',
                  'status': 'verified',
                  'identity_value': 'source-assigned-kreg',
                  'presentation_value': 'character-depiction',
                  'sha256': os.environ['IMAGE_SHA256'],
                  'sha1': os.environ['IMAGE_SHA1'],
                  'bytes': int(os.environ['IMAGE_BYTES']),
                  'width': int(os.environ['IMAGE_WIDTH']),
                  'height': int(os.environ['IMAGE_HEIGHT']),
                  'mime': 'image/jpeg',
                  'source_file': os.environ['FILE_TITLE'],
                  'public_representation_not_upload_byte_identity': True
              },
              'portrait': {
                  'status': 'absent',
                  'adopted': False,
                  'reason': 'Kreg is a voice performance; the reviewed asset is character evidence and is not represented as a Dan Starkey portrait'
              },
              'visual_review': {
                  'identity_basis': 'revision-bound source-page image assignment and exact file-page custody; not visual face recognition or biometric inference',
                  'observations': [
                      'single close-up depiction of one bald prosthetic humanoid or alien character',
                      'character wears a large purple-blue metallic-looking collar or armor element',
                      'bright uncluttered background; head and shoulders dominate the frame',
                      'no text overlay, logo, cover art, collage, generic silhouette, or unrelated second subject'
                  ],
                  'exact_character_name_visually_inferred': False,
                  'performer_identity_visually_inferred': False,
                  'generic_substitution_authorized': False,
                  'approved_use': 'source-assigned character still only'
              },
              'limitations': [
                  'the MediaWiki-advertised 67,431-byte upload identity was not publicly recovered',
                  'the publicly stable 67,113-byte full-dimension JPEG is a distinct delivered representation',
                  'the filename Kree.jpg differs from the character spelling Kreg and is preserved without correction',
                  'the image alone does not establish the exact character identity; the pinned source assignment does',
                  'the image makes no claim about Dan Starkey appearance or physical presence'
              ],
              'checks': {
                  'source_run_green': True,
                  'artifact_rehashed': True,
                  'critical_members_rehashed': True,
                  'source_assignment_exact': True,
                  'route_census_complete': True,
                  'public_original_reproduced': True,
                  'duplicate_current_adoption_absent': True,
                  'image_structure_valid': True,
                  'presentation_review_completed': True,
                  'identity_boundary_preserved': True,
                  'portrait_absence_preserved': True
              },
              'boundary': {
                  'repository_written': False,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'canonical_record_created': False,
                  'media_adopted': False,
                  'waterline_event_written': False,
                  'cycle_receipt_written': False,
                  'product_published': False,
                  'outside_human_dependency': False
              }
          }
          body = (json.dumps(review, indent=2, sort_keys=True) + '\n').encode()
          review['receipt_sha256'] = sha(body)
          final = (json.dumps(review, indent=2, sort_keys=True) + '\n').encode()
          review_dir = out / 'review'
          (review_dir / 'independent-media-review.json').write_bytes(final)
          (review_dir / 'independent-media-review.file.sha256').write_text(f"{sha(final)}  independent-media-review.json\n")
          (review_dir / 'visual-review.txt').write_text(
              'VERDICT: approved-for-separate-cycle-candidate\n'
              'PRESENTATION: one close-up prosthetic humanoid or alien character in purple-blue armor; no logo, collage, text overlay, cover art, or second subject.\n'
              'IDENTITY: source-assigned to Kreg by pinned page revision and File:Kree.jpg custody; no visual recognition or biometric inference.\n'
              'PORTRAIT: absent; the still is not represented as Dan Starkey.\n'
          )
          for name in ['kreg-public-original.jpg','kreg-page.wikitext','file-imageinfo-api.json','route-census-summary.json','kreg-media-recovery-metadata.json','boundary.json','single-deletion-proof.json','v11-recovery-receipt.json']:
              (review_dir / name).write_bytes((source / name).read_bytes())
          verify = json.loads(final)
          expected = verify.pop('receipt_sha256')
          if sha((json.dumps(verify, indent=2, sort_keys=True) + '\n').encode()) != expected:
              fail('independent media review self-hash drifted')
          PY

          test -z "$(git status --porcelain)"

      - name: Upload immutable Kreg independent media-review packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-independent-media-review-v1-${{ github.run_id }}
          path: ${{ env.OUT }}/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
