name: doctor-who-cycle-012-selection-cleanup-writer-v1

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-evidence-v1]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v1
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v1
      EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-evidence-v1
      EVIDENCE_WORKFLOW: doctor-who-cycle-012-selection-evidence-v1
      EVIDENCE_ARTIFACT_PREFIX: doctor-who-cycle-012-selection-evidence-v1-
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v1
      CLEANUP_MESSAGE: "CI: retire cycle 012 preselection transport"
      CLEANUP_NAME: undercast-cycle-012-cleanup
      CLEANUP_EMAIL: cycle-012-cleanup@users.noreply.github.com
      CLEANUP_DATE: 2026-08-10T08:15:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact writer installation and successful evidence source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,evidence,logs,receipt}
          installed="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$installed"
          test "$(git show -s --format=%P "$installed")" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN".."$installed")" = 1
          test -z "$(git rev-list --merges "$BASE_MAIN".."$installed")"
          test "$(git diff --name-status "$BASE_MAIN" "$installed")" = $'A\t'"$SELF"
          base_tree="$(git show -s --format=%T "$BASE_MAIN")"
          test -n "$base_tree"

          source_run='${{ github.event.workflow_run.id }}'
          source_head='${{ github.event.workflow_run.head_sha }}'
          source_attempt='${{ github.event.workflow_run.run_attempt }}'
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$source_run/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$EVIDENCE_BRANCH" -f per_page=100 > "$OUT/api/evidence-prs.json"

          SOURCE_RUN="$source_run" SOURCE_HEAD="$source_head" SOURCE_ATTEMPT="$source_attempt" INSTALLED_MAIN="$installed" BASE_TREE="$base_tree" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          run = load('source-run.json')
          jobs = load('source-jobs.json')['jobs']
          artifacts = load('source-artifacts.json')['artifacts']
          prs = load('evidence-prs.json')
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_HEAD'] and run['head_branch'] == os.environ['EVIDENCE_BRANCH']
          assert run['name'] == os.environ['EVIDENCE_WORKFLOW']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_attempt'] == int(os.environ['SOURCE_ATTEMPT'])
          matched = [row for row in jobs if row['name'] == 'retain' and row['status'] == 'completed' and row['conclusion'] == 'success']
          assert len(matched) == 1
          expected = os.environ['EVIDENCE_ARTIFACT_PREFIX'] + os.environ['SOURCE_RUN'] + '-attempt-' + os.environ['SOURCE_ATTEMPT']
          matches = [row for row in artifacts if row['name'] == expected and not row['expired']]
          assert len(matches) == 1, (expected, [(row['id'], row['name']) for row in artifacts])
          prs = [row for row in prs if row['head']['ref'] == os.environ['EVIDENCE_BRANCH'] and row['head']['sha'] == os.environ['SOURCE_HEAD']]
          assert len(prs) == 1
          assert prs[0]['state'] == 'open' and prs[0]['draft'] is True and prs[0]['merged_at'] is None
          assert prs[0]['base']['sha'] == os.environ['INSTALLED_MAIN']
          assert prs[0]['commits'] == 1 and prs[0]['changed_files'] == 1
          (root / 'source-job.txt').write_text(str(matched[0]['id']) + '\n')
          (root / 'artifact-id.txt').write_text(str(matches[0]['id']) + '\n')
          (root / 'evidence-pr.txt').write_text(str(prs[0]['number']) + '\n')
          PY

          artifact_id="$(cat "$OUT/api/artifact-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$OUT/api/evidence-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/evidence.zip"
          artifact_sha="$(sha256sum "$OUT/evidence.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/evidence-artifact.json")" = "sha256:$artifact_sha"
          printf 'INSTALLED_MAIN=%s\nBASE_TREE=%s\nSOURCE_RUN=%s\nSOURCE_HEAD=%s\nSOURCE_ATTEMPT=%s\nSOURCE_JOB=%s\nEVIDENCE_ARTIFACT=%s\nEVIDENCE_ARTIFACT_SHA256=%s\nEVIDENCE_PR=%s\n' \
            "$installed" "$base_tree" "$source_run" "$source_head" "$source_attempt" "$(cat "$OUT/api/source-job.txt")" "$artifact_id" "$artifact_sha" "$(cat "$OUT/api/evidence-pr.txt")" >> "$GITHUB_ENV"

      - name: Authenticate exact retained selection and cleanup authorization
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/evidence.zip" TARGET="$OUT/evidence" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest
          evidence = json.loads((target / 'evidence.json').read_text())
          identity = evidence.pop('identity')
          assert sha(json.dumps(evidence, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == identity
          evidence['identity'] = identity
          assert evidence['status'] == 'cycle-012-selection-evidence-retained-v1'
          assert evidence['version'] == 1
          assert evidence['source'] == {
              'pr': int(os.environ['EVIDENCE_PR']),
              'branch': os.environ['EVIDENCE_BRANCH'],
              'head': os.environ['SOURCE_HEAD'],
              'run': int(os.environ['SOURCE_RUN']),
              'attempt': int(os.environ['SOURCE_ATTEMPT']),
              'job': int(os.environ['SOURCE_JOB']),
          }
          assert evidence['canonical'] == {
              'base_main': os.environ['BASE_MAIN'],
              'installed_main': os.environ['INSTALLED_MAIN'],
              'base_tree': os.environ['BASE_TREE'],
              'writer_path': os.environ['SELF'],
          }
          assert evidence['selection']['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert evidence['selection']['identity'] == 'd17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a'
          assert evidence['selection']['selected_task_id'] == 'ap_8965086737382df0e88366db'
          assert evidence['selection']['normalized'] == {'performer': 'Dan Starkey', 'role': 'Senstarg', 'mode': 'unresolved'}
          assert evidence['counts']['cycle12_refs'] == 18
          assert evidence['counts']['observer_refs'] == 2
          assert evidence['counts']['auxiliary_refs'] == 2
          assert evidence['counts']['refs_to_delete'] == 22
          assert evidence['counts']['pull_requests'] == len(evidence['pull_requests'])
          assert len(evidence['refs_to_delete']) == 22
          assert len({(row['branch'], row['head']) for row in evidence['refs_to_delete']}) == 22
          assert all(row['action'] in {'close_without_merge', 'none'} for row in evidence['pull_requests'])
          assert evidence['boundary'] == {
              'selection_retained': True,
              'exact_heads_frozen': True,
              'repository_write': False,
              'canonical_mutation': False,
              'transport_mutation': False,
              'force_update': False,
              'merge': False,
              'lease_issued': False,
              'queue_mutated': False,
              'wall_created': False,
              'media_adopted': False,
              'cycle_receipt_written': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          (Path(os.environ['OUT']) / 'receipt/authorization.json').write_text(json.dumps(evidence, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Close exact pull requests and delete exact frozen refs
        shell: bash
        run: |
          set -euo pipefail
          auth="$OUT/receipt/authorization.json"
          : > "$OUT/logs/pr-actions.tsv"
          : > "$OUT/logs/ref-actions.tsv"
          : > "$OUT/logs/ref-already-absent.tsv"

          while IFS=$'\t' read -r number branch head action frozen_merged; do
            [ -n "$number" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number-before.json"
            NUMBER="$number" BRANCH_NAME="$branch" HEAD_SHA="$head" ACTION="$action" FROZEN_MERGED="$frozen_merged" python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['OUT']) / f"api/pr-{os.environ['NUMBER']}-before.json").read_text())
          assert row['number'] == int(os.environ['NUMBER'])
          assert row['head']['ref'] == os.environ['BRANCH_NAME'] and row['head']['sha'] == os.environ['HEAD_SHA']
          if os.environ['ACTION'] == 'close_without_merge':
              assert row['merged'] is False and row['state'] in {'open', 'closed'}
          else:
              assert os.environ['ACTION'] == 'none'
              assert row['merged'] is (os.environ['FROZEN_MERGED'] == 'true')
          PY
            if [ "$action" = close_without_merge ]; then
              state="$(jq -r '.state' "$OUT/api/pr-$number-before.json")"
              if [ "$state" = open ]; then
                gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$number" -f state=closed > "$OUT/api/pr-$number-after.json"
              else
                cp "$OUT/api/pr-$number-before.json" "$OUT/api/pr-$number-after.json"
              fi
              jq -e --arg head "$head" '.state=="closed" and .merged==false and .head.sha==$head' "$OUT/api/pr-$number-after.json" >/dev/null
            fi
            printf '%s\t%s\t%s\t%s\n' "$number" "$branch" "$head" "$action" >> "$OUT/logs/pr-actions.tsv"
          done < <(jq -r '.pull_requests[] | [.pr,.branch,.head,.action,(.merged|tostring)] | @tsv' "$auth")

          delete_exact_ref() {
            branch="$1"
            head="$2"
            kind="$3"
            ref_url="/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch"
            delete_url="/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            if current="$(gh api "$ref_url" --jq '.object.sha' 2>/dev/null)"; then
              test "$current" = "$head"
              gh api --method DELETE "$delete_url"
            else
              printf '%s\t%s\t%s\n' "$branch" "$head" "$kind" >> "$OUT/logs/ref-already-absent.tsv"
              return 0
            fi
            for attempt in $(seq 1 30); do
              if current="$(gh api "$ref_url" --jq '.object.sha' 2>/dev/null)"; then
                test "$current" = "$head"
                sleep 2
              else
                printf '%s\t%s\t%s\n' "$branch" "$head" "$kind" >> "$OUT/logs/ref-actions.tsv"
                return 0
              fi
            done
            echo "ref remained visible after deletion settlement: $branch" >&2
            return 1
          }

          while IFS=$'\t' read -r branch head kind; do
            [ -n "$branch" ] || continue
            delete_exact_ref "$branch" "$head" "$kind"
          done < <(jq -r '.refs_to_delete[] | [.branch,.head,.kind] | @tsv' "$auth")

          remaining=-1
          for attempt in $(seq 1 30); do
            gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/terminal-cycle12-refs-$attempt.json"
            remaining="$(jq 'length' "$OUT/api/terminal-cycle12-refs-$attempt.json")"
            if [ "$remaining" = 0 ]; then
              cp "$OUT/api/terminal-cycle12-refs-$attempt.json" "$OUT/api/terminal-cycle12-refs.json"
              break
            fi
            sleep 2
          done
          test "$remaining" = 0
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - name: Restore exact base tree and seal cleanup receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'message': os.environ['CLEANUP_MESSAGE'],
              'tree': os.environ['BASE_TREE'],
              'parents': [os.environ['INSTALLED_MAIN']],
              'author': {'name': os.environ['CLEANUP_NAME'], 'email': os.environ['CLEANUP_EMAIL'], 'date': os.environ['CLEANUP_DATE']},
              'committer': {'name': os.environ['CLEANUP_NAME'], 'email': os.environ['CLEANUP_EMAIL'], 'date': os.environ['CLEANUP_DATE']},
          }
          (Path(os.environ['OUT']) / 'commit.json').write_text(json.dumps(payload))
          PY
          cleanup_commit="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input "$OUT/commit.json" --jq '.sha')"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.tree.sha')" = "$BASE_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.parents[0].sha')" = "$INSTALLED_MAIN"
          jq -n --arg sha "$cleanup_commit" '{sha:$sha,force:false}' > "$OUT/main-update.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input "$OUT/main-update.json" > "$OUT/api/main-update.json"
          test "$(jq -r '.object.sha' "$OUT/api/main-update.json")" = "$cleanup_commit"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$cleanup_commit"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$cleanup_commit" --jq '.tree.sha')" = "$BASE_TREE"
          if gh api "/repos/$GITHUB_REPOSITORY/contents/$SELF?ref=$cleanup_commit" >/dev/null 2>&1; then
            echo "cleanup writer survived terminal tree" >&2
            exit 1
          fi
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" | jq 'length')" = 0

          CLEANUP_COMMIT="$cleanup_commit" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          auth = json.loads((root / 'receipt/authorization.json').read_text())
          deleted = [row for row in (root / 'logs/ref-actions.tsv').read_text().splitlines() if row]
          absent = [row for row in (root / 'logs/ref-already-absent.tsv').read_text().splitlines() if row]
          prs = [row for row in (root / 'logs/pr-actions.tsv').read_text().splitlines() if row]
          receipt = {
              'status': 'cycle-012-preselection-transport-cleanup-complete-v1',
              'version': 1,
              'writer': {'run': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT'])},
              'source': {
                  'pr': int(os.environ['EVIDENCE_PR']),
                  'head': os.environ['SOURCE_HEAD'],
                  'run': int(os.environ['SOURCE_RUN']),
                  'attempt': int(os.environ['SOURCE_ATTEMPT']),
                  'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['EVIDENCE_ARTIFACT']),
                  'artifact_sha256': os.environ['EVIDENCE_ARTIFACT_SHA256'],
                  'evidence_identity': auth['identity'],
                  'selection_identity': auth['selection']['identity'],
              },
              'canonical': {
                  'base_main': os.environ['BASE_MAIN'],
                  'installation_commit': os.environ['INSTALLED_MAIN'],
                  'cleanup_commit': os.environ['CLEANUP_COMMIT'],
                  'tree': os.environ['BASE_TREE'],
                  'writer_absent': True,
              },
              'cleanup': {
                  'authorized_refs': len(auth['refs_to_delete']),
                  'deleted_in_this_run': len(deleted),
                  'already_absent': len(absent),
                  'cycle12_refs_remaining': 0,
                  'pull_requests_processed': len(prs),
              },
              'boundary': {
                  'product_tree_changed': False,
                  'force_update': False,
                  'merge': False,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'wall_created': False,
                  'media_adopted': False,
                  'cycle_receipt_written': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/cleanup.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/CLEANUP_COMPLETE').write_text(receipt['identity'] + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
