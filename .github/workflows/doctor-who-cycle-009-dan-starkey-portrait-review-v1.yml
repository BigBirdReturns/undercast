name: doctor-who-cycle-009-dan-starkey-portrait-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 2a29ca99a3cd1a455cd20ce6195076162c918edc
      BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-review-v1
      SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v1.yml
      OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v1
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      WALL_ID: UC-1354
      DERIVATIVE_RUN: "31244751072"
      DERIVATIVE_JOB: "93071391543"
      DERIVATIVE_ARTIFACT: "9018129786"
      DERIVATIVE_ARTIFACT_DIGEST: sha256:94e131ba69cf11d4009f43e63f7573f67d643ab4e889337efb0ecec6b41f639d
      DERIVATIVE_RECEIPT_IDENTITY: 1bfcf412a6ac5709b4505c38191cc68d6db586514397b23ed5ba23755e04aa09
      DERIVATIVE_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      DERIVATIVE_BYTES: "51125"
      ORIGINAL_SHA256: 604065b587f639dc5528a8db58be729dffa13171698d963d81adbb8e9b69f149
      FILE_PAGE: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact review carrier and derivative producer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,producer,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DERIVATIVE_RUN" > "$OUT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$DERIVATIVE_JOB" > "$OUT/api/job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DERIVATIVE_ARTIFACT" > "$OUT/api/artifact.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          pr = json.loads((root / "api/pr.json").read_text())
          files = json.loads((root / "api/files.json").read_text())
          run = json.loads((root / "api/run.json").read_text())
          job = json.loads((root / "api/job.json").read_text())
          artifact = json.loads((root / "api/artifact.json").read_text())
          assert pr["number"] == int(os.environ["PR"])
          assert pr["state"] == "open" and pr["draft"] is True and pr["merged"] is False
          assert pr["base"]["sha"] == os.environ["EXACT_MAIN"]
          assert pr["head"]["ref"] == os.environ["BRANCH"] and pr["head"]["sha"] == os.environ["HEAD"]
          assert pr["commits"] == 1 and pr["changed_files"] == 1
          assert len(files) == 1 and files[0]["filename"] == os.environ["SELF"] and files[0]["status"] == "added"
          assert run["id"] == int(os.environ["DERIVATIVE_RUN"])
          assert run["head_sha"] == "0e1925705fc5d003b64b9c6235e3b6e4f291dd0e"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert job["id"] == int(os.environ["DERIVATIVE_JOB"]) and job["run_id"] == run["id"]
          assert job["status"] == "completed" and job["conclusion"] == "success"
          assert artifact["id"] == int(os.environ["DERIVATIVE_ARTIFACT"])
          assert artifact["expired"] is False and artifact["digest"] == os.environ["DERIVATIVE_ARTIFACT_DIGEST"]
          assert artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == run["head_sha"]
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"

      - name: Rehydrate, rehash, and inspect exact derivative bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DERIVATIVE_ARTIFACT/zip" > "$OUT/producer.zip"
          test "$(sha256sum "$OUT/producer.zip" | cut -d' ' -f1)" = "${DERIVATIVE_ARTIFACT_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["ROOT"])
          target = root / "producer"
          with zipfile.ZipFile(root / "producer.zip") as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  if not info.is_dir():
                      destination = target / path
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.read(info))
          prefix = "/tmp/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1/receipt/"
          ledger = (target / "SHA256SUMS.pre").read_text().splitlines()
          assert len(ledger) == 15
          for line in ledger:
              digest, original = line.split(None, 1)
              original = original.lstrip("*")
              assert original.startswith(prefix)
              path = target / original[len(prefix):]
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest
          assert hashlib.sha256((target / "SHA256SUMS.pre").read_bytes()).hexdigest() == (target / "SHA256SUMS").read_text().split()[0]
          receipt = json.loads((target / "derivative-qualification.json").read_text())
          derivative = (target / "uc-1354-portrait.jpg").read_bytes()
          assert receipt["identity"] == os.environ["DERIVATIVE_RECEIPT_IDENTITY"]
          assert receipt["status"] == "dan-starkey-portrait-derivative-qualified"
          assert receipt["task_id"] == os.environ["TASK_ID"] and receipt["wall_id"] == os.environ["WALL_ID"]
          assert receipt["selected_file_page"] == os.environ["FILE_PAGE"]
          assert receipt["original_sha256"] == os.environ["ORIGINAL_SHA256"]
          assert receipt["derivative_sha256"] == os.environ["DERIVATIVE_SHA256"]
          assert receipt["derivative_bytes"] == int(os.environ["DERIVATIVE_BYTES"])
          assert receipt["derivative_width"] == 420 and receipt["derivative_height"] == 600
          assert receipt["derivative_distinct_from_all_manifest_assets"] is True
          assert receipt["license"] == "CC BY-SA 2.0" and "Gage Skidmore" in receipt["author"]
          assert hashlib.sha256(derivative).hexdigest() == os.environ["DERIVATIVE_SHA256"]
          assert len(derivative) == int(os.environ["DERIVATIVE_BYTES"])
          (root / "receipt/uc-1354-portrait.jpg").write_bytes(derivative)
          (root / "receipt/producer-qualification.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "receipt/selected-metadata.json").write_bytes((target / "selected-metadata.json").read_bytes())
          PY
          if ! command -v identify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          identify "$OUT/receipt/uc-1354-portrait.jpg" > "$OUT/receipt/derivative-identify.txt"
          grep -E 'JPEG 420x600( |$)' "$OUT/receipt/derivative-identify.txt" >/dev/null

      - name: Seal independent exact-derivative visual disposition
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          producer = json.loads((root / "receipt/producer-qualification.json").read_text())
          derivative = (root / "receipt/uc-1354-portrait.jpg").read_bytes()
          review = {
              "version": 1,
              "status": "dan-starkey-portrait-derivative-visually-approved",
              "reviewed_by": "chatgpt-second-desk",
              "review_role": "independent-exact-byte-visual-review",
              "reviewed_run": int(os.environ["GITHUB_RUN_ID"]),
              "reviewed_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "carrier_pr": int(os.environ["CARRIER_PR"]),
              "carrier_head": os.environ["CARRIER_HEAD"],
              "canonical_main": os.environ["EXACT_MAIN"],
              "producer_run": int(os.environ["DERIVATIVE_RUN"]),
              "producer_job": int(os.environ["DERIVATIVE_JOB"]),
              "producer_artifact": int(os.environ["DERIVATIVE_ARTIFACT"]),
              "producer_artifact_digest": os.environ["DERIVATIVE_ARTIFACT_DIGEST"],
              "producer_receipt_identity": os.environ["DERIVATIVE_RECEIPT_IDENTITY"],
              "task_id": os.environ["TASK_ID"],
              "wall_id": os.environ["WALL_ID"],
              "candidate_side": "portrait",
              "candidate_sha256": hashlib.sha256(derivative).hexdigest(),
              "candidate_bytes": len(derivative),
              "candidate_dimensions": {"width": 420, "height": 600},
              "file_page": os.environ["FILE_PAGE"],
              "license": producer["license"],
              "author": producer["author"],
              "identity_basis": "Exact Commons title, description, file-page, author, license, and original-byte custody; no facial recognition or biometric inference.",
              "visual_observation": "The exact derivative contains one adult panel speaker in ordinary clothing. The face is fully visible and unobstructed; no second person, costume, prosthetic character, text overlay, or misleading character depiction is present. The center crop is stable and suitable for a performer portrait.",
              "presentation_disposition": "verified-performer-portrait-candidate",
              "character_identity_claimed": False,
              "performer_portrait_candidate_approved": True,
              "distinct_from_canonical_media": producer["derivative_distinct_from_all_manifest_assets"],
              "adopted": False,
              "queue_mutated": False,
              "lease_issued": False,
              "canonical_record_created": False,
              "media_adopted": False,
              "repository_write": False,
              "outside_human_dependency": False,
              "owner_physical_action_required": False,
              "next_gate": "portrait-bearing Megnus Jaka candidate rematerialization and complete rendered qualification",
          }
          assert review["candidate_sha256"] == os.environ["DERIVATIVE_SHA256"]
          review["identity"] = hashlib.sha256(json.dumps(review, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "receipt/visual-review.json").write_text(json.dumps(review, indent=2, sort_keys=True) + "\n")
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
