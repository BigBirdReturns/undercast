name: doctor-who-cycle-009-dan-starkey-portrait-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v2.yml"

permissions: {}
concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-review-v2
  cancel-in-progress: true

env:
  EXACT_MAIN: 2a29ca99a3cd1a455cd20ce6195076162c918edc
  BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-review-v2
  SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v2.yml
  OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v2
  TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
  SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
  TITLE: "File:Dan Starkey (27406944162).jpg"
  FILE_PAGE: "https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27406944162).jpg"
  THUMB_SHA256: 27d858e0f92bf1fca6515ad8f4ade64853f963ecc3f53ca9890f3825c9404149
  V1_RUN: "31241343025"
  V1_ARTIFACT: "9017107246"
  V1_DIGEST: 125ea89f15a2aedab7d2c05310171379be008a5583c71181d88389606edfdf72
  V1_HEAD: 5ccc905f50a35ff885d07efa73524b24b6b5dcc9

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-review-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bind exact read-only carrier and current boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,diagnostic,packet}
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          jq -e --arg h "$head" --arg b "$BRANCH" --arg m "$EXACT_MAIN" '.state=="open" and .draft==true and .commits==1 and .changed_files==1 and .head.sha==$h and .head.ref==$b and .base.sha==$m' "$OUT/api/pr.json" >/dev/null
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/autopilot.mjs validate
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/waterline.json"
          node scripts/media-audit.mjs gate --scope doctor-who
          jq -e '.total==316 and .statuses.queued==308 and .statuses.resolved==8 and .in_flight==0' "$OUT/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Verify V1 packet and recover exact licensed original
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT" > "$OUT/api/artifact.json"
          jq -e --argjson id "$V1_ARTIFACT" --argjson run "$V1_RUN" --arg head "$V1_HEAD" --arg d "sha256:$V1_DIGEST" '.id==$id and .expired==false and .digest==$d and .workflow_run.id==$run and .workflow_run.head_sha==$head' "$OUT/api/artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT/zip" > "$OUT/v1.zip"
          test "$(sha256sum "$OUT/v1.zip" | awk '{print $1}')" = "$V1_DIGEST"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, html, json, os, pathlib, random, re, time, urllib.error, urllib.parse, urllib.request, zipfile
          root=pathlib.Path(os.environ['ROOT']); target=root/'diagnostic'; target.mkdir()
          with zipfile.ZipFile(root/'v1.zip') as z:
            names={i.filename for i in z.infolist() if not i.is_dir()}
            assert {'images/01.jpg','images/02.jpg','images/03.jpg','receipt/canonical-inventory.json'} <= names
            for name in ('images/03.jpg','receipt/canonical-inventory.json'):
              p=pathlib.PurePosixPath(name); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(name))
          assert hashlib.sha256((target/'images/03.jpg').read_bytes()).hexdigest()==os.environ['THUMB_SHA256']
          assert hashlib.sha256((target/'receipt/canonical-inventory.json').read_bytes()).hexdigest()=='ad52bf20e54dd5cb97197615e85ecf80fa28545b39c63fc36fcee549621ea821'
          headers={'User-Agent':'Undercast exact portrait review/2.0 (read-only; BigBirdReturns/undercast)'}
          def fetch(url,binary=False,limit=None):
            last=None
            for n in range(8):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180) as r:
                  data=r.read(limit+1 if limit else None)
                  if limit and len(data)>limit: raise RuntimeError('byte ceiling exceeded')
                  return data if binary else json.loads(data)
              except urllib.error.HTTPError as e:
                last=e
                if e.code not in (429,500,502,503,504): raise
                delay=float(e.headers.get('Retry-After')) if (e.headers.get('Retry-After') or '').isdigit() else min(45,2**n+random.random())
              except (urllib.error.URLError,TimeoutError) as e: last=e; delay=min(45,2**n+random.random())
              if n<7: time.sleep(delay)
            raise RuntimeError(f'fetch exhausted: {last}')
          api='https://commons.wikimedia.org/w/api.php?'
          q=lambda p: fetch(api+urllib.parse.urlencode(p,doseq=True))
          rows=q({'action':'query','list':'categorymembers','cmtitle':'Category:Dan Starkey','cmnamespace':'6','cmtype':'file','cmlimit':'max','format':'json','formatversion':'2','origin':'*'})['query']['categorymembers']
          titles=sorted({x['title'] for x in rows}); assert len(titles)==16 and titles[2]==os.environ['TITLE']
          page=q({'action':'query','prop':'imageinfo','titles':os.environ['TITLE'],'iiprop':'url|size|mime|sha1|timestamp|extmetadata','format':'json','formatversion':'2','origin':'*'})['query']['pages'][0]
          ii=page['imageinfo'][0]; assert page['title']==os.environ['TITLE'] and ii['width']==5616 and ii['height']==3744 and ii['mime']=='image/jpeg'
          meta=ii.get('extmetadata') or {}
          val=lambda k: html.unescape(re.sub('<[^>]+>',' ',str((meta.get(k) or {}).get('value','')))).strip()
          license_name=val('LicenseShortName') or val('UsageTerms'); assert re.search(r'^(CC BY(?:-SA)?(?: |$)|Public domain|PD)',license_name,re.I)
          inventory=json.loads((target/'receipt/canonical-inventory.json').read_text())
          norm=lambda raw: urllib.parse.urlunsplit((urllib.parse.urlsplit(raw).scheme.lower(),urllib.parse.urlsplit(raw).netloc.lower(),urllib.parse.unquote(urllib.parse.urlsplit(raw).path).replace(' ','_'),'','')).rstrip('/')
          assert norm(os.environ['FILE_PAGE']) not in set(inventory['canonical_urls'])
          original=fetch(ii['url'],True,16_000_000); assert original[:2]==b'\xff\xd8' and original[-2:]==b'\xff\xd9'
          (root/'original.jpg').write_bytes(original)
          data={'category_file_count':16,'category_index':3,'title':page['title'],'file_page':os.environ['FILE_PAGE'],'pageid':page['pageid'],'original_url':ii['url'],'width':ii['width'],'height':ii['height'],'mime':ii['mime'],'original_sha1_base36':ii.get('sha1'),'original_timestamp':ii.get('timestamp'),'original_sha256':hashlib.sha256(original).hexdigest(),'original_bytes':len(original),'thumbnail_sha256':os.environ['THUMB_SHA256'],'license':license_name,'license_url':val('LicenseUrl'),'artist':val('Artist'),'credit':val('Credit'),'source_assignment_only':True,'visual_identity_claim':False,'canonical_origin_match':False}
          data['identity']=hashlib.sha256(json.dumps(data,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'packet/commons-metadata.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          (root/'packet/review-thumbnail.jpg').write_bytes((target/'images/03.jpg').read_bytes())
          PY
      - name: Create and seal reviewed portrait derivative
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y imagemagick; fi
          convert "$OUT/original.jpg" -auto-orient -resize '1000x1250^' -gravity center -extent 1000x1250 -strip -sampling-factor 4:2:0 -quality 88 "$OUT/packet/uc-1354-portrait.jpg"
          test "$(identify -format '%wx%h:%m' "$OUT/packet/uc-1354-portrait.jpg")" = '1000x1250:JPEG'
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); meta=json.loads((root/'packet/commons-metadata.json').read_text()); portrait=root/'packet/uc-1354-portrait.jpg'; digest=hashlib.sha256(portrait.read_bytes()).hexdigest()
          inventory=json.loads((root/'diagnostic/receipt/canonical-inventory.json').read_text()); assert digest not in set(inventory['verified_portrait_asset_sha256'])
          review={'version':1,'status':'approved-distinct-performer-portrait-candidate','canonical_main':os.environ['EXACT_MAIN'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'task_id':os.environ['TASK_ID'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],'performer':'Dan Starkey','role':'Megnus Jaka','wall_id':'UC-1354','target_path':'images/uc-1354-portrait.jpg','source_file_page':meta['file_page'],'source_assignment_basis':'Wikimedia Commons file title plus Category:Dan Starkey membership','visual_identity_claim':False,'visual_review':{'thumbnail_sha256':os.environ['THUMB_SHA256'],'disposition':'accept','basis':'single adult subject; unobstructed face; no character makeup; no other prominent subject; stable center crop','reviewed_by':'chatgpt-vision-second-desk'},'license':{'name':meta['license'],'url':meta['license_url'],'artist':meta['artist'],'credit':meta['credit']},'original':{'sha256':meta['original_sha256'],'bytes':meta['original_bytes'],'width':meta['width'],'height':meta['height']},'derivative':{'sha256':digest,'bytes':portrait.stat().st_size,'width':1000,'height':1250,'mime':'image/jpeg'},'canonical_origin_match':False,'canonical_hash_match':False,'character_still_adopted':False,'queue_mutated':False,'lease_issued':False,'canonical_record_created':False,'media_adopted':False,'repository_write':False,'outside_human_dependency':False,'owner_physical_action':False}
          review['identity']=hashlib.sha256(json.dumps(review,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/'packet/portrait-review.json').write_text(json.dumps(review,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$OUT/packet" && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS)
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v2/packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
