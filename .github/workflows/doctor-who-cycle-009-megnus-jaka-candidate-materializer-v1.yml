name: doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
      FAILED_RUN: "31240027076"
      FAILED_JOB: "93059331703"
      FAILED_HEAD: ae073f2af20a56732819151899fcc8168ed4a2ff
      DIAGNOSTICS_ARTIFACT: "9016719134"
      DIAGNOSTICS_ARTIFACT_DIGEST: sha256:a8c8f1d752348e9d385dfbd26dee04cdfd36ecc85d6f8821da540402bbb50354
      ORIGINAL_MATERIALIZER_SHA256: 6a0701eeda7b0839a5c339d31b387a446cd43a0e75e63138e6b98f4c07682f72
      REPAIRED_MATERIALIZER_SHA256: 7615646e44b57d741db777e85f20e89bd02b5464c3807685e0ba8ec7abf9a48a
      PREFLIGHT_RUN: "31237323043"
      PREFLIGHT_ARTIFACT: "9015893321"
      PREFLIGHT_ZIP_SHA256: 1a8ec1e3c248d93fccebe342b44eb1d4d2e4b8b069785309180c85d5343adf7c
      PREFLIGHT_IDENTITY: e530d17bac039c63278f5ae53c73d071b991e606a9eb4b3b74957f8ead1734b4
      EVIDENCE_RUN: "31239057687"
      EVIDENCE_ARTIFACT: "9016403859"
      EVIDENCE_ZIP_SHA256: 4f1665ad983e40525223539f6c1ad368f392c2d29887200cb3ee2ce4238d822f
      EVIDENCE_IDENTITY: dd59759b825c013869e5c7d75d99cdc12d2f38c4e46262e97a7aacd81bf7192c
      REVIEW_RUN: "31239209379"
      REVIEW_ARTIFACT: "9016447677"
      REVIEW_ZIP_SHA256: 3e62fc7f4224deb16d82efc9f117cc2c89d3dbe889668b6e70c3c9bffe39efec
      REVIEW_IDENTITY: b975d3e6f49a3e17f2c2c192eeb52029d4d8aae554a411ccf87c4295720e7a52
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      EXPECTED_WALL_ID: UC-1354
      SOURCE_URL: https://tardis.fandom.com/wiki/Megnus_Jaka
      SOURCE_PAGEID: "175060"
      SOURCE_REVISION: "3677686"
      SOURCE_TIMESTAMP: 2023-12-19T13:57:50Z
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      PRODUCT_URL: https://www.bigfinish.com/releases/v/doctor-who-the-first-sontarans-418
      CLAIM_AT: 2026-08-08T04:35:00.000Z
      SUBMIT_AT: 2026-08-08T04:36:00.000Z
      ACCEPT_AT: 2026-08-08T04:37:00.000Z
      MERGE_AT: 2026-08-08T04:38:00.000Z
      AUDIT_AT: 2026-08-08T04:38:30.000Z
      REVIEW_AT: 2026-08-08T04:39:00.000Z
      COMMIT_AT: 2026-08-08T04:40:00.000Z
      FETCHED_AT: 2026-08-08
      SELECTION_BASIS: Exact canonical cycle-009 preflight, revision-bound performance evidence, official production evidence, and independent absent-media disposition selected the deterministic Megnus Jaka voice obligation.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind clean carrier and recover exact failed materializer
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          export PR_NUMBER="$pr" PR_HEAD="$head" PR_BASE_SHA="$EXACT_MAIN"
          printf 'PR_NUMBER=%s\nPR_HEAD=%s\nPR_BASE_SHA=%s\n' "$pr" "$head" "$EXACT_MAIN" >> "$GITHUB_ENV"

          rm -rf /tmp/megnus-jaka-materializer
          mkdir -p /tmp/megnus-jaka-materializer/{archive,extracted}
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > /tmp/megnus-jaka-materializer/failed-run.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB" > /tmp/megnus-jaka-materializer/failed-job.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTICS_ARTIFACT" > /tmp/megnus-jaka-materializer/artifact.json
          jq -e --argjson run "$FAILED_RUN" --arg head "$FAILED_HEAD" \
            '.id==$run and .status=="completed" and .conclusion=="failure" and .head_sha==$head' \
            /tmp/megnus-jaka-materializer/failed-run.json >/dev/null
          jq -e --argjson job "$FAILED_JOB" --argjson run "$FAILED_RUN" \
            '.id==$job and .run_id==$run and .status=="completed" and .conclusion=="failure"' \
            /tmp/megnus-jaka-materializer/failed-job.json >/dev/null
          jq -e --argjson artifact "$DIAGNOSTICS_ARTIFACT" --argjson run "$FAILED_RUN" \
            --arg head "$FAILED_HEAD" --arg digest "$DIAGNOSTICS_ARTIFACT_DIGEST" \
            '.id==$artifact and .expired==false and .digest==$digest and .workflow_run.id==$run and .workflow_run.head_sha==$head' \
            /tmp/megnus-jaka-materializer/artifact.json >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTICS_ARTIFACT/zip" > /tmp/megnus-jaka-materializer/archive/diagnostics.zip
          test "sha256:$(sha256sum /tmp/megnus-jaka-materializer/archive/diagnostics.zip | cut -d' ' -f1)" = "$DIAGNOSTICS_ARTIFACT_DIGEST"
          sha256sum /tmp/megnus-jaka-materializer/archive/diagnostics.zip > /tmp/megnus-jaka-materializer/archive/downloaded-zip.sha256

          python3 - <<'PY'
          import hashlib
          import re
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path('/tmp/megnus-jaka-materializer')
          archive = root / 'archive/diagnostics.zip'
          target = root / 'extracted'
          with zipfile.ZipFile(archive) as rows:
              infos = rows.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if not info.is_dir():
                      output = target / path
                      output.parent.mkdir(parents=True, exist_ok=True)
                      output.write_bytes(rows.read(info))

          source = target / 'megnus-jaka-materializer/materialize.sh'
          assert source.is_file()
          original = source.read_bytes()
          assert hashlib.sha256(original).hexdigest() == '6a0701eeda7b0839a5c339d31b387a446cd43a0e75e63138e6b98f4c07682f72'
          text = original.decode()
          needle = '''  > "$OUT/receipt/claim-output.json"\nROOT="$OUT" python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot = Path(os.environ['ROOT'])\nbatch = json.loads((root / 'work/batch.json').read_text())\n'''
          replacement = '''  > "$OUT/receipt/claim-output.json"\nROOT="$OUT" python3 - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot = Path(os.environ['ROOT'])\nraw = (root / 'receipt/claim-output.json').read_text()\nstart = raw.find('{\\n  "version"')\nassert start >= 0, 'claim output did not contain the batch JSON object'\nbatch = json.loads(raw[start:])\n(root / 'work/batch.json').write_text(json.dumps(batch, indent=2) + '\\n')\n'''
          assert text.count(needle) == 1
          repaired = text.replace(needle, replacement)
          output = root / 'materialize.sh'
          output.write_text(repaired)
          assert hashlib.sha256(output.read_bytes()).hexdigest() == '7615646e44b57d741db777e85f20e89bd02b5464c3807685e0ba8ec7abf9a48a'

          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", repaired, re.S)
          assert len(blocks) == 10
          for index, block in enumerate(blocks, 1):
              compile(block, f'embedded-python-{index}', 'exec')
          PY

          test "$(sha256sum /tmp/megnus-jaka-materializer/extracted/megnus-jaka-materializer/materialize.sh | cut -d' ' -f1)" = "$ORIGINAL_MATERIALIZER_SHA256"
          test "$(sha256sum /tmp/megnus-jaka-materializer/materialize.sh | cut -d' ' -f1)" = "$REPAIRED_MATERIALIZER_SHA256"
          bash -n /tmp/megnus-jaka-materializer/materialize.sh
          chmod 700 /tmp/megnus-jaka-materializer/materialize.sh

      - name: Execute exact repaired candidate materializer
        shell: bash
        run: /tmp/megnus-jaka-materializer/materialize.sh

      - name: Upload exact candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload materializer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
            /tmp/megnus-jaka-materializer
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
