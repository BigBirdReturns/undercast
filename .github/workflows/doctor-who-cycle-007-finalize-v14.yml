name: doctor-who-cycle-007-finalize-v14

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-007-finalize-v14.yml"
      - "tmp/doctor-who-cycle-007-v14/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-007-finalize-v14-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CURRENT_MAIN: ${{ github.event.pull_request.base.sha }}
  REVIEWED_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  ORIGINAL_CARRIER_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  REVIEWED_CANDIDATE_COMMIT: 1bac55a7cd06e64840c79d42924472a0e0c6910e
  REVIEWED_CANDIDATE_TREE: 121ecef1c981e6da2048450902721e336c051138
  REVIEWED_CANDIDATE_GATE_SHA256: 6499879b6246646228767c38e87d45447082e89fb03fa48e6ef5950005d95dd6
  REVIEWED_LEASE_ID: lease_acb2309e7fb477769749751c
  REVIEWED_CLAIM_EVENT_ID: apj_e77313d150e2122c446e3638
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_SHA256: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_NAME: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_SHA256: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  REVIEW_RUN: "31066271720"
  REVIEW_JOB: "92504537621"
  REVIEW_ARTIFACT_ID: "8953936181"
  REVIEW_ARTIFACT_NAME: doctor-who-cycle-007-v8-independent-review-31066271720
  REVIEW_ARTIFACT_SHA256: 7adfaa0e3f83d5fe05774dbee75b77fd381750ccec2f5b825d517ad8b5530e0b
  REVIEW_RECEIPT_SHA256: 1d33abdd3f3e5b6fed603d1c2de4a339216f96c2e91433dc617af5e0a7f6ad88
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/doctor-who-cycle-007-finalize-v14.yml
  DRIVER: tmp/doctor-who-cycle-007-v14/driver.sh
  ROOT: /tmp/doctor-who-cycle-007-finalize-v14
  DIAGNOSTICS_ROOT: /tmp/doctor-who-cycle-007-finalize-v14/diagnostics
  REVIEW_ROOT: /tmp/doctor-who-cycle-007-finalize-v14/review
  REPLAY: /tmp/doctor-who-cycle-007-finalize-v14/replay
  INTEGRATION: /tmp/doctor-who-cycle-007-finalize-v14/integration
  OUT: /tmp/doctor-who-cycle-007-finalize-v14/out
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-finalize-v14/diagnostics/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-finalize-v14/out/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-finalize-v14/diagnostics/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-finalize-v14/diagnostics/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-finalize-v14/diagnostics/media-review
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v14-finalization'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT_NAME }}
          path: ${{ env.DIAGNOSTICS_ROOT }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31059092270

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.REVIEW_ARTIFACT_NAME }}
          path: ${{ env.REVIEW_ROOT }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31066271720

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct reviewed candidate, integrate current main, and seal final product
        shell: bash
        run: bash "$DRIVER"

      - name: Upload exact V14 finalization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-finalization-v14-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
