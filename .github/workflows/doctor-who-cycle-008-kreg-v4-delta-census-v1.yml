name: doctor-who-cycle-008-kreg-v4-delta-census-v1

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-v4-delta-census-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-v4-delta-census-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-v4-delta-census-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-v4-delta-census-v1.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-v4-delta-census-v1
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      SOURCE_COMMIT: a65136a6a7b86571cc6e7e773dbf594b2465c0c5
      SOURCE_PARENT: cf0c0abda404d3751677c1c7cfb1673bf791dfae
      SOURCE_PREFIX: .github/doctor-who-cycle-008/kreg-candidate-v4
      OUT: /tmp/doctor-who-cycle-008-kreg-v4-delta-census-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact read-only census carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,parts,archive,receipt}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d '[:space:]')" = 1
          floor="$(git rev-parse HEAD^)"
          test "$(git rev-list --count "$floor"..HEAD)" = 1
          test "$(git diff --name-only "$floor"...HEAD)" = "$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" FLOOR="$floor" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'api'
          pr=json.loads((root/'pr.json').read_text()); files=json.loads((root/'pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['FLOOR']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          git fetch --no-tags --filter=blob:none origin "$SOURCE_COMMIT"
          test "$(git show -s --format=%P "$SOURCE_COMMIT")" = "$SOURCE_PARENT"
          printf 'FLOOR_MAIN=%s\n' "$floor" >> "$GITHUB_ENV"

      - name: Census exact immutable shards and archive boundaries
        shell: bash
        run: |
          set -euo pipefail
          expected_bytes=(12320 12320 12320 12320 12320 12320 12320 12320 12320 12243 12243 12191)
          expected_sha=(
            d0f7debad507fb2130333215dddeb71a8ce11eb5cb331ab34bf531d97b9d6768
            156ff5023acdff4b9e78f9993cadac1c6b688d62b94d33046dde0bfa62a30530
            c295c068a34b68193918a3703537094cb07d477883a41eececa026c7df1f3e3a
            a8187b0d2b0082e4e5d9f0ee77721dcf96fe0cf70abb297f5786e8e649a7218f
            c271978c420217ce958185747767e1f6a0fc9eac2f127e3e79244bfce8d86eba
            e0e46b026b94a9f039e56f7b1b23536cefcd0f1771385404ee3a61b9ce880799
            7c2a3e47ea63315bf12c367c8ffe24c8de4cbb01de00b850608ca2021aa31daa
            c128f6d9941eddeaba1b62e2a124a726765ab6cce4ba6774da23f33e085b6f99
            9c8258ce6c125950bd888d3d3db4aed382cbeb2531351cbee7cba212e5b8fee8
            8cbbfb25b143dd55d01f2d9ebab127e6f6c3f214cd81bf92da8e943b0f06b9f6
            466cf45153852e948fb77a66090bf37349c70a4a4d1c67405bf66abaaf5a8a78
            8825c1b09918c1dc6c31de4dc4d2859df1706c0ae7adc541a73c660f604f6bd3
          )
          printf 'index\tgit_blob\texpected_bytes\tactual_bytes\texpected_sha256\tactual_sha256\tinvalid_bytes\tmatch\n' > "$OUT/shard-census.tsv"
          for index in $(seq 0 11); do
            part="$(printf '%02d' "$index")"
            source="$SOURCE_PREFIX/payload.part-$part.b64"
            target="$OUT/parts/payload.part-$part.b64"
            git show "$SOURCE_COMMIT:$source" > "$target"
            blob="$(git rev-parse "$SOURCE_COMMIT:$source")"
            bytes="$(wc -c < "$target" | tr -d '[:space:]')"
            sha="$(sha256sum "$target" | awk '{print $1}')"
            invalid="$(LC_ALL=C tr -d 'A-Za-z0-9+/=\n' < "$target" | wc -c | tr -d '[:space:]')"
            match=false
            if [ "$bytes" = "${expected_bytes[$index]}" ] && [ "$sha" = "${expected_sha[$index]}" ] && [ "$invalid" = 0 ]; then match=true; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$part" "$blob" "${expected_bytes[$index]}" "$bytes" "${expected_sha[$index]}" "$sha" "$invalid" "$match" >> "$OUT/shard-census.tsv"
          done
          cat "$OUT"/parts/payload.part-*.b64 > "$OUT/archive/product-delta.tar.xz.b64"
          wc -c "$OUT/archive/product-delta.tar.xz.b64" > "$OUT/archive/base64-bytes.txt"
          sha256sum "$OUT/archive/product-delta.tar.xz.b64" > "$OUT/archive/base64-sha256.txt"

          ROOT="$OUT" python3 - <<'PY'
          import base64,hashlib,json,os,tarfile,lzma
          from pathlib import Path
          root=Path(os.environ['ROOT']); src=root/'archive/product-delta.tar.xz.b64'
          raw=src.read_bytes(); compact=b''.join(raw.split())
          result={'raw_bytes':len(raw),'compact_bytes':len(compact),'compact_mod4':len(compact)%4,'raw_sha256':hashlib.sha256(raw).hexdigest()}
          try:
              decoded=base64.b64decode(compact,validate=True)
              (root/'archive/product-delta.tar.xz').write_bytes(decoded)
              result['decoded']=True; result['xz_bytes']=len(decoded); result['xz_sha256']=hashlib.sha256(decoded).hexdigest()
              try:
                  tar= lzma.decompress(decoded)
                  (root/'archive/product-delta.tar').write_bytes(tar)
                  result['xz_valid']=True; result['tar_bytes']=len(tar); result['tar_sha256']=hashlib.sha256(tar).hexdigest()
                  try:
                      with tarfile.open(root/'archive/product-delta.tar','r:') as tf:
                          result['tar_valid']=True
                          result['members']=[{'name':m.name,'bytes':m.size,'type':m.type.decode(errors='replace') if isinstance(m.type,bytes) else str(m.type)} for m in tf.getmembers()]
                  except Exception as exc:
                      result['tar_valid']=False; result['tar_error']=repr(exc)
              except Exception as exc:
                  result['xz_valid']=False; result['xz_error']=repr(exc)
          except Exception as exc:
              result['decoded']=False; result['decode_error']=repr(exc)
          (root/'archive/archive-census.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY

          git show "$SOURCE_COMMIT:$SOURCE_PREFIX/phase-02.sh" > "$OUT/phase-02.sh"
          sha256sum "$OUT/phase-02.sh" > "$OUT/phase-02-sha256.txt"
          jq -n --arg status complete --arg source "$SOURCE_COMMIT" --arg floor "$FLOOR_MAIN" --arg head "$AUTHORIZED_HEAD" '{status:$status,source_commit:$source,floor_main:$floor,carrier_head:$head,executed_product_logic:false,repository_write:false,merge_authority:false,outside_human_dependency:false}' > "$OUT/receipt/census-receipt.json"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" > "$OUT/SHA256SUMS"

      - name: Upload exact V4 delta census
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v4-delta-census-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-v4-delta-census-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
