name: doctor-who-cycle-008-kreg-post-merge-proof

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-post-merge-proof.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-post-merge-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-post-merge-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: read
    env:
      CANONICAL_MAIN: 47ccb38eab6a4b6e2a16ed92b04f1259b95de783
      CANONICAL_TREE: 5a2dec000457a9485e07add7de548317e35ca32a
      PRODUCT_PARENT: 951fb9e6b47f54075b5843a8e9ed007767fb6bca
      SELF: .github/workflows/doctor-who-cycle-008-kreg-post-merge-proof.yml
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      CYCLE_ID: cycle_89daa03cca72b8522c76725c
      STILL_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      OUT: /tmp/doctor-who-cycle-008-kreg-post-merge-proof
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-file proof carrier and canonical product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{receipt,logs,census}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          live="$(git rev-parse refs/remotes/origin/main)"
          test "$live" = "$CANONICAL_MAIN"
          test "$(git rev-parse "$CANONICAL_MAIN^{tree}")" = "$CANONICAL_TREE"
          test "$(git show -s --format=%P "$CANONICAL_MAIN")" = "$PRODUCT_PARENT"
          git diff --name-only "$PRODUCT_PARENT".."$CANONICAL_MAIN" | LC_ALL=C sort > "$OUT/census/product-paths.txt"
          test "$(wc -l < "$OUT/census/product-paths.txt")" = 48
          ! grep -Eq '^(\.github/|tmp/|records/)' "$OUT/census/product-paths.txt"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$CANONICAL_MAIN" > "$OUT/census/canonical-main.txt"
          printf '%s\n' "$CANONICAL_TREE" > "$OUT/census/canonical-tree.txt"
          printf '%s\n' "$PRODUCT_PARENT" > "$OUT/census/product-parent.txt"
          printf '%s\n' "$head" > "$OUT/census/carrier-head.txt"
          printf '%s\n' "$pr" > "$OUT/census/carrier-pr.txt"

      - name: Independently verify permanent receipt, queue, media, and declared hash
        shell: bash
        run: |
          set -euo pipefail
          receipt=data/review/adapter-sdk/doctor-who-cycle-008-kreg.json
          test -f "$receipt"
          jq -e --arg task "$TASK_ID" --arg lease "$LEASE_ID" --arg wall "$WALL_ID" --arg cycle "$CYCLE_ID" --arg still "$STILL_SHA256" '
            .task.id==$task and
            .lease.id==$lease and
            .lease.outcome=="completed" and
            .canonical.wall_id==$wall and
            .reviewed_cycle.id==$cycle and
            .reviewed_cycle.outcome=="completed" and
            .boundary.cycle_009_authorized==false and
            .boundary.ninth_lease_issued==false and
            .boundary.outside_human_dependency==false and
            .boundary.owner_physical_action_required==false and
            .boundary.portrait_adopted==false and
            .boundary.portrait_status=="absent" and
            .boundary.still_sha256==$still and
            .queue.before.total==316 and
            .queue.before.queued==309 and
            .queue.before.resolved==7 and
            .queue.before.in_flight==0 and
            .queue.after.total==316 and
            .queue.after.queued==308 and
            .queue.after.resolved==8 and
            .queue.after.in_flight==0 and
            .qualification.candidate_path_count==40 and
            .qualification.finalization_path_count==8 and
            .qualification.final_product_path_count==48 and
            .qualification.independent_candidate_gate_passed==true and
            .qualification.complete_receipt_bearing_gate_required==true and
            .qualification.rendered_browser_tests_required==true
          ' "$receipt" >/dev/null
          test "$(wc -c < images/uc-1353-still.jpg)" = 67113
          test "$(sha256sum images/uc-1353-still.jpg | awk '{print $1}')" = "$STILL_SHA256"
          declared="$(jq -r '.receipt_sha256' "$receipt")"
          [[ "$declared" =~ ^[0-9a-f]{64}$ ]]
          sha256sum "$receipt" > "$OUT/receipt/cycle-008-receipt.file.sha256"
          printf '%s\n' "$declared" > "$OUT/receipt/cycle-008-receipt.declared.sha256"
          cp "$receipt" "$OUT/receipt/cycle-008-receipt.json"
          test -z "$(git status --porcelain)"

      - name: Run permanent cycle checkers and workflow custody
        shell: bash
        run: |
          set -euo pipefail
          node scripts/doctor-who-cycle-008.mjs 2>&1 | tee "$OUT/logs/cycle-008-checker.log"
          node scripts/doctor-who-cycle-007.mjs 2>&1 | tee "$OUT/logs/cycle-007-checker.log"
          node scripts/publisher-custody.mjs check-workflows 2>&1 | tee "$OUT/logs/publisher-custody.log"
          node scripts/publisher-condition-custody.mjs check-workflows 2>&1 | tee "$OUT/logs/publisher-condition-custody.log"
          test -z "$(git status --porcelain)"

      - name: Run complete repository and rendered Chromium gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANONICAL_MAIN"

      - name: Seal terminal post-merge proof
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt={
            'status':'canonical-main-cycle-008-terminal',
            'canonical_main':os.environ['CANONICAL_MAIN'],
            'canonical_tree':os.environ['CANONICAL_TREE'],
            'product_parent':os.environ['PRODUCT_PARENT'],
            'product_path_count':48,
            'task':os.environ['TASK_ID'],
            'lease':os.environ['LEASE_ID'],
            'wall_id':os.environ['WALL_ID'],
            'cycle_id':os.environ['CYCLE_ID'],
            'queue':{'total':316,'queued':308,'resolved':8,'in_flight':0},
            'cycle_008_checker':'pass',
            'cycle_007_checker':'pass',
            'publisher_custody':'pass',
            'publisher_condition_custody':'pass',
            'complete_rendered_gate':'pass',
            'cycle_009_authorized':False,
            'ninth_lease_issued':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
            'repository_write':False,
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'receipt/post-merge-proof.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" > "$OUT/SHA256SUMS"
          ! grep -Fq "$OUT/SHA256SUMS.pre" "$OUT/SHA256SUMS.pre"

      - name: Upload terminal post-merge proof
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-post-merge-proof-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-post-merge-proof
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
