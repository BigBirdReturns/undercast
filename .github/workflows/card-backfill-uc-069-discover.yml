name: card-backfill-uc-069-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-069.json"
      - "scripts/card-backfill-uc-069-discover.mjs"
      - ".github/workflows/card-backfill-uc-069-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-069-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-012'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-012
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact UC-069 audit and official-source boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-069.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const record=specimens.find(row=>row.id==='UC-069');
          const item=(audit.items||[]).find(row=>row.id==='ma_0edd7077e6e6c50ecbdb6472');
          if(control.version!==1||control.record_id!=='UC-069'||control.actor!=='Danny DeVito'||control.side!=='still')throw new Error('UC-069 control drift');
          if(control.selector_artifact?.artifact_id!==8636218683||control.selector_artifact?.head_sha!=='336c9408be9b400aacbff4f393c26116518ebc3e')throw new Error('UC-069 selector custody drift');
          if(!record||record.actor!=='Danny DeVito'||record.character!=='The Penguin'||record.still)throw new Error('UC-069 canonical still boundary changed');
          if(!item||item.wall_id!=='UC-069'||item.side!=='still'||item.status!=='absent'||item.expected_subject!=='The Penguin'||item.asset)throw new Error('UC-069 audit boundary changed');
          if(control.source?.provider!=='DC'||control.source?.pinned_assets?.length!==3)throw new Error('UC-069 official source set drift');
          console.log('PASS — UC-069 remains an exact Danny DeVito Penguin still absence with three pinned official DC assets');
          NODE
      - name: Gather official DC assets, probe resolution, and build review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-069
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-069-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-069.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact official DC candidates and online checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-069-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-069
            ${{ runner.temp }}/card-backfill-uc-069.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
