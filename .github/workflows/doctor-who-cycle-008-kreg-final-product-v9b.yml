name: doctor-who-cycle-008-kreg-final-product-v9b

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-final-product-v9b.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-final-product-v9b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  OLD_WORKFLOW_BLOB: 1fb8af74baef0f1a92bafcdc316df371038dfc4d
  V8B_BRANCH: agent/doctor-who-cycle-008-kreg-independent-review-v8b
  V8B_WORKFLOW: doctor-who-cycle-008-kreg-independent-review-v8b
  CYCLE007_MERGE: e00b03436e354f3543cf4ed67a0c5b9f6ba4f97b
  TASK_ID: ap_469d79ea29fd7f877395d20f
  LEASE_ID: lease_e65f837070361eacbb1abd46
  WALL_ID: UC-1353
  SOURCE_URL: https://tardis.fandom.com/wiki/Kreg
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_TIMESTAMP: 2026-07-28T09:20:48Z
  SOURCE_BYTES: "840"
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  MEDIA_BYTES: "67113"
  MEDIA_WIDTH: "1053"
  MEDIA_HEIGHT: "805"
  MEDIA_ASSET_ID: "504051495"
  OLD_TASK_ID: ap_ffea809b980b468b33fa462c
  OLD_WALL_ID: UC-1352
  OLD_CYCLE_ID: cycle_540222fb1378fa680a43d080
  OLD_MEDIA_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  OLD_SOURCE_PAGE_ID: "301280"
  OLD_SOURCE_REVISION: "3711733"
  OLD_SOURCE_CONTENT_SHA256: 6f57112817f92b445ae7f32223f3d4e095c11f2c1702bab84eca4eccc17d8428
  OLD_SOURCE_FINGERPRINT: 8baf724d7501a98347e
  EXPECTED_CANDIDATE_PATHS: "40"
  EXPECTED_FINALIZATION_PATHS: "8"
  EXPECTED_FINAL_PATHS: "48"

jobs:
  finalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-final-product-v9b'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      finalization_main: ${{ steps.seal.outputs.finalization_main }}
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-final-product-v9b.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-final-product-v9b
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover and patch immutable finalizer scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT"
          mkdir -p "$SCRIPT_ROOT"/{api,finalize}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$OLD_WORKFLOW_BLOB" > "$SCRIPT_ROOT/api/blob.json"
          jq -e --arg sha "$OLD_WORKFLOW_BLOB" '.sha==$sha and .encoding=="base64"' "$SCRIPT_ROOT/api/blob.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/api/blob.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/source.yml"
          test "$(git hash-object "$SCRIPT_ROOT/source.yml")" = "$OLD_WORKFLOW_BLOB"
          SOURCE="$SCRIPT_ROOT/source.yml" TARGET="$SCRIPT_ROOT/finalize" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          source_path = Path(os.environ['SOURCE'])
          target = Path(os.environ['TARGET'])
          doc = yaml.safe_load(source_path.read_text())
          wanted = [
              ('Bind exact one-file finalizer and observed live main', None),
              ('Retain exact successful V8b review packet', None),
              ('Verify approved V8b authority and candidate bytes', None),
              ('Recompose exact candidate over finalization main', 'candidate'),
              ('Recover exact cycle-007 finalization templates', None),
              ('Derive deterministic eight-path cycle-008 finalization', 'finalize_product'),
              ('Run permanent checkers and complete rendered gate', None),
              ('Seal code-free forty-eight-path prototype packet', 'seal'),
              ('Retain finalize diagnostics and remove worktree', None),
          ]
          steps = doc['jobs']['finalize']['steps']
          found = {s.get('name'): (s.get('id'), s.get('run')) for s in steps if s.get('name') in {n for n, _ in wanted}}
          assert list(found) == [n for n, _ in wanted]

          def replace_assignment(text, variable, replacement):
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(variable + '=')]
              assert hits and hits[0] < 10, (variable, hits)
              lines[hits[0]] = replacement
              return '\n'.join(lines) + '\n'

          for index, (name, step_id) in enumerate(wanted, 1):
              actual_id, text = found[name]
              assert actual_id == step_id and text
              if name == 'Derive deterministic eight-path cycle-008 finalization':
                  text = replace_assignment(text, 'candidate', 'candidate="$CANDIDATE_COMMIT"')
              if name in ('Run permanent checkers and complete rendered gate', 'Seal code-free forty-eight-path prototype packet'):
                  text = replace_assignment(text, 'final', 'final="$FINAL_COMMIT"')
              if name == 'Recover exact cycle-007 finalization templates':
                  loop = "while IFS=$'\\t' read -r old new; do"
                  before = "  git show \"$cycle007_parent:$old\" > \"$OUT/templates/$(echo \"$old\" | sed 's#/#__#g').before\""
                  done = 'done < "$OUT/templates/finalization-path-map.tsv"'
                  assert text.count(loop) == 1 and text.count(before) == 1 and text.count(done) == 1
                  text = text.replace(loop, ': > "$OUT/templates/added-zero-baseline-paths.txt"\n' + loop)
                  replacement = '\n'.join([
                      '  if git cat-file -e "$cycle007_parent:$old" 2>/dev/null; then',
                      '    git show "$cycle007_parent:$old" > "$OUT/templates/$(echo "$old" | sed \'s#/#__#g\').before"',
                      '  else',
                      '    case "$old" in',
                      '      data/review/adapter-sdk/doctor-who-cycle-007-kragar.json|scripts/doctor-who-cycle-007.mjs)',
                      '        : > "$OUT/templates/$(echo "$old" | sed \'s#/#__#g\').before"',
                      '        printf \'%s\\n\' "$old" >> "$OUT/templates/added-zero-baseline-paths.txt"',
                      '        ;;',
                      '      *) printf \'unexpected zero-baseline cycle-007 template: %s\\n\' "$old" >&2; exit 1 ;;',
                      '    esac',
                      '  fi',
                  ])
                  text = text.replace(before, replacement)
                  audit = '\n'.join([
                      done,
                      "printf '%s\\n' \\",
                      "  'data/review/adapter-sdk/doctor-who-cycle-007-kragar.json' \\",
                      "  'scripts/doctor-who-cycle-007.mjs' \\",
                      '  > "$OUT/templates/expected-zero-baseline-paths.txt"',
                      'LC_ALL=C sort -u "$OUT/templates/added-zero-baseline-paths.txt" > "$OUT/templates/actual-zero-baseline-paths.txt"',
                      'diff -u "$OUT/templates/expected-zero-baseline-paths.txt" "$OUT/templates/actual-zero-baseline-paths.txt"',
                  ])
                  text = text.replace(done, audit)
              path = target / f'{index:02d}.sh'
              path.write_text(text)
              path.chmod(0o755)
          PY
          test "$(find "$SCRIPT_ROOT/finalize" -type f -name '*.sh' | wc -l)" = 9
          for script in "$SCRIPT_ROOT/finalize"/*.sh; do bash -n "$script"; done
          sha256sum "$SCRIPT_ROOT/finalize"/*.sh > "$SCRIPT_ROOT/finalize-scripts.sha256"

      - name: Bind exact one-file finalizer and observed live main
        run: bash "$SCRIPT_ROOT/finalize/01.sh"

      - name: Retain exact successful V8b review packet
        run: bash "$SCRIPT_ROOT/finalize/02.sh"

      - name: Verify approved V8b authority and candidate bytes
        run: bash "$SCRIPT_ROOT/finalize/03.sh"

      - name: Recompose exact candidate over finalization main
        id: candidate
        run: bash "$SCRIPT_ROOT/finalize/04.sh"

      - name: Recover exact cycle-007 finalization templates
        run: bash "$SCRIPT_ROOT/finalize/05.sh"

      - name: Derive deterministic eight-path cycle-008 finalization
        id: finalize_product
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: bash "$SCRIPT_ROOT/finalize/06.sh"

      - name: Run permanent checkers and complete rendered gate
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/07.sh"

      - name: Seal code-free forty-eight-path prototype packet
        id: seal
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/08.sh"

      - name: Upload V9b final-product prototype
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-prototype-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize/product
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain finalize diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          if [ -f "$SCRIPT_ROOT/finalize/09.sh" ]; then
            bash "$SCRIPT_ROOT/finalize/09.sh"
          fi

      - name: Upload finalizer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-finalize-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  review:
    needs: finalize
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review-scripts
      PROTOTYPE_ID: ${{ needs.finalize.outputs.artifact_id }}
      PROTOTYPE_DIGEST: ${{ needs.finalize.outputs.artifact_digest }}
      SOURCE_FINALIZATION_MAIN: ${{ needs.finalize.outputs.finalization_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover and patch immutable review scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT"
          mkdir -p "$SCRIPT_ROOT"/{api,review}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$OLD_WORKFLOW_BLOB" > "$SCRIPT_ROOT/api/blob.json"
          jq -r '.content' "$SCRIPT_ROOT/api/blob.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/source.yml"
          test "$(git hash-object "$SCRIPT_ROOT/source.yml")" = "$OLD_WORKFLOW_BLOB"
          SOURCE="$SCRIPT_ROOT/source.yml" TARGET="$SCRIPT_ROOT/review" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          doc = yaml.safe_load(Path(os.environ['SOURCE']).read_text())
          target = Path(os.environ['TARGET'])
          wanted = [
              ('Bind exact same-run prototype artifact and live review main', None),
              ('Verify prototype checksums, receipt, archive, bundle, and patch', None),
              ('Independently recompose exact forty-eight paths and run complete gate', 'review_product'),
              ('Seal approved-for-publication product packet', None),
              ('Retain review diagnostics and remove worktrees', None),
          ]
          steps = doc['jobs']['review']['steps']
          found = {s.get('name'): (s.get('id'), s.get('run')) for s in steps if s.get('name') in {n for n, _ in wanted}}
          assert list(found) == [n for n, _ in wanted]
          for index, (name, step_id) in enumerate(wanted, 1):
              actual_id, text = found[name]
              assert actual_id == step_id and text
              if name == 'Seal approved-for-publication product packet':
                  lines = text.splitlines()
                  hits = [i for i, line in enumerate(lines) if line.startswith('reviewed=')]
                  assert hits and hits[0] < 10, hits
                  lines[hits[0]] = 'reviewed="$REVIEWED_COMMIT"'
                  text = '\n'.join(lines) + '\n'
              path = target / f'{index:02d}.sh'
              path.write_text(text)
              path.chmod(0o755)
          PY
          test "$(find "$SCRIPT_ROOT/review" -type f -name '*.sh' | wc -l)" = 5
          for script in "$SCRIPT_ROOT/review"/*.sh; do bash -n "$script"; done
          sha256sum "$SCRIPT_ROOT/review"/*.sh > "$SCRIPT_ROOT/review-scripts.sha256"

      - name: Bind exact same-run prototype artifact and live review main
        run: bash "$SCRIPT_ROOT/review/01.sh"

      - name: Verify prototype checksums, receipt, archive, bundle, and patch
        run: bash "$SCRIPT_ROOT/review/02.sh"

      - name: Independently recompose exact forty-eight paths and run complete gate
        id: review_product
        run: bash "$SCRIPT_ROOT/review/03.sh"

      - name: Seal approved-for-publication product packet
        env:
          REVIEWED_COMMIT: ${{ steps.review_product.outputs.reviewed_commit }}
        run: bash "$SCRIPT_ROOT/review/04.sh"

      - name: Upload approved V9b final-product packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-approved-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain review diagnostics and remove worktrees
        if: always()
        shell: bash
        run: |
          if [ -f "$SCRIPT_ROOT/review/05.sh" ]; then
            bash "$SCRIPT_ROOT/review/05.sh"
          fi

      - name: Upload review failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-review-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
