name: doctor-who-cycle-008-kreg-final-product-v9b

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-final-product-v9b.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-final-product-v9b-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASELINE_WRAPPER_BLOB: c8a569b7abcf4e98b817f4b3168dbdf7b6e8a120
  CURRENT_WRAPPER_BLOB: 15bb7e0dabed62425f04e3a46bac4d64233ab210
  WRAPPER_BLOB: ebf348c4fc17a9ae1f420b113d661f0611c490ec
  OLD_WORKFLOW_BLOB: 1fb8af74baef0f1a92bafcdc316df371038dfc4d
  V8B_BRANCH: agent/doctor-who-cycle-008-kreg-independent-review-v8b
  V8B_WORKFLOW: doctor-who-cycle-008-kreg-independent-review-v8b
  CYCLE007_MERGE: e00b03436e354f3543cf4ed67a0c5b9f6ba4f97b
  TASK_ID: ap_469d79ea29fd7f877395d20f
  LEASE_ID: lease_e65f837070361eacbb1abd46
  WALL_ID: UC-1353
  SOURCE_URL: https://tardis.fandom.com/wiki/Kreg
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_TIMESTAMP: "2026-07-28T09:20:48Z"
  SOURCE_BYTES: "840"
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  MEDIA_BYTES: "67113"
  MEDIA_WIDTH: "1053"
  MEDIA_HEIGHT: "805"
  MEDIA_ASSET_ID: "504051495"
  OLD_TASK_ID: ap_ffea809b980b468b33fa462c
  OLD_WALL_ID: UC-1352
  OLD_CYCLE_ID: cycle_540222fb1378fa680a43d080
  OLD_MEDIA_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  OLD_SOURCE_PAGE_ID: "301280"
  OLD_SOURCE_REVISION: "3711733"
  OLD_SOURCE_CONTENT_SHA256: 6f57112817f92b445ae7f32223f3d4e095c11f2c1702bab84eca4eccc17d8428
  OLD_SOURCE_FINGERPRINT: 8baf724d7501a98347e
  EXPECTED_CANDIDATE_PATHS: "40"
  EXPECTED_FINALIZATION_PATHS: "8"
  EXPECTED_FINAL_PATHS: "48"
  NORMALIZER_BLOB: c48cb86a250b483ec7de1ab490568da4420b9b11
  NORMALIZER_SOURCE_SHA256: bddede8ea16fab41805ffb52adc90d6406c4e009efa34b753bd85719a975f48f
  NORMALIZER_GZIP_SHA256: 700664d1bd512e3edc07825c8cb358f5ccb57f77e4f97d7f5c2b1511e28d142a
  NORMALIZER_B64_SHA256: a6da7211786b4a337bb1673186fb834e3a2bd252ef28b6cb269c954d8be59b15
  REVIEWED_AT: "2026-08-07T20:42:01.000Z"

jobs:
  finalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-final-product-v9b'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      finalization_main: ${{ steps.seal.outputs.finalization_main }}
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-final-product-v9b.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-final-product-v9b
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-scripts
      REPAIR_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-exact-normalizer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover qualified custody scripts and install exact semantic normalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPAIR_ROOT"
          mkdir -p "$REPAIR_ROOT/api"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$BASELINE_WRAPPER_BLOB" > "$REPAIR_ROOT/api/baseline-wrapper.json"
          jq -e --arg sha "$BASELINE_WRAPPER_BLOB" '.sha==$sha and .encoding=="base64"' "$REPAIR_ROOT/api/baseline-wrapper.json" >/dev/null
          jq -r '.content' "$REPAIR_ROOT/api/baseline-wrapper.json" | tr -d '\n' | base64 --decode > "$REPAIR_ROOT/baseline-wrapper.yml"
          test "$(git hash-object "$REPAIR_ROOT/baseline-wrapper.yml")" = "$BASELINE_WRAPPER_BLOB"
          SOURCE="$REPAIR_ROOT/baseline-wrapper.yml" TARGET="$REPAIR_ROOT/recover-finalizer.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          source=Path(os.environ['SOURCE'])
          target=Path(os.environ['TARGET'])
          doc=yaml.safe_load(source.read_text())
          steps=doc['jobs']['finalize']['steps']
          matches=[s.get('run') for s in steps if s.get('name')=='Recover qualified scripts and bind the cycle-008 baseline to its generated registry']
          assert len(matches)==1 and isinstance(matches[0],str)
          target.write_text(matches[0])
          target.chmod(0o755)
          PY
          bash -n "$REPAIR_ROOT/recover-finalizer.sh"
          bash "$REPAIR_ROOT/recover-finalizer.sh"

          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$NORMALIZER_BLOB" > "$REPAIR_ROOT/api/normalizer-blob.json"
          jq -e --arg sha "$NORMALIZER_BLOB" '.sha==$sha and .encoding=="base64"' "$REPAIR_ROOT/api/normalizer-blob.json" >/dev/null
          jq -r '.content' "$REPAIR_ROOT/api/normalizer-blob.json" | tr -d '\n' | base64 --decode > "$REPAIR_ROOT/normalizer.py.gz"
          test "$(sha256sum "$REPAIR_ROOT/normalizer.py.gz" | awk '{print $1}')" = "$NORMALIZER_GZIP_SHA256"
          gzip -dc "$REPAIR_ROOT/normalizer.py.gz" > "$SCRIPT_ROOT/kreg-exact-normalizer.py"
          test "$(sha256sum "$SCRIPT_ROOT/kreg-exact-normalizer.py" | awk '{print $1}')" = "$NORMALIZER_SOURCE_SHA256"
          python3 -m py_compile "$SCRIPT_ROOT/kreg-exact-normalizer.py"
          chmod 0755 "$SCRIPT_ROOT/kreg-exact-normalizer.py"

          cat > "$SCRIPT_ROOT/finalize/06.sh" <<'SH'
          set -euo pipefail
          work="$OUT/work/final"
          candidate="$CANDIDATE_COMMIT"
          test "$(git -C "$work" rev-parse HEAD)" = "$candidate"
          test "$(git -C "$work" show -s --format=%P HEAD)" = "$FINALIZATION_MAIN"
          review_identity="$(cat "$OUT/source/v8b-review-identity.txt")"
          test "$review_identity" = "f8740ca65cc7d409e36e8631de444b413c7e309174179e9ef778ff895816af64"
          mkdir -p "$OUT/diagnostics" "$OUT/product"
          WORK="$work" REVIEWED_AT="$REVIEWED_AT" AUTHORIZED_HEAD="$AUTHORIZED_HEAD" FINALIZATION_MAIN="$FINALIZATION_MAIN" \
            python3 "$SCRIPT_ROOT/kreg-exact-normalizer.py" > "$OUT/diagnostics/exact-normalizer-result.json"
          jq -e --arg root "$work" '.status=="normalized" and .root==$root and (.paths|length)==8' "$OUT/diagnostics/exact-normalizer-result.json" >/dev/null
          jq -r '.cycle_id' "$OUT/diagnostics/exact-normalizer-result.json" > "$OUT/product/cycle-id.txt"
          cat > "$OUT/product/finalization-paths.txt" <<'EOF'
          data/ESTATE-REGISTRY.json
          data/WATERLINE-STATE.json
          data/journal/waterline.jsonl
          data/review/adapter-sdk/BASELINE.json
          data/review/adapter-sdk/doctor-who-cycle-008-kreg.json
          docs/AUTOPILOT.md
          package.json
          scripts/doctor-who-cycle-008.mjs
          EOF
          sed -i 's/^          //' "$OUT/product/finalization-paths.txt"
          test "$(wc -l < "$OUT/product/finalization-paths.txt")" = "$EXPECTED_FINALIZATION_PATHS"
          jq -r '.paths[]' "$OUT/diagnostics/exact-normalizer-result.json" | LC_ALL=C sort > "$OUT/diagnostics/normalizer-paths.txt"
          diff -u "$OUT/product/finalization-paths.txt" "$OUT/diagnostics/normalizer-paths.txt"
          jq -n --arg task "$TASK_ID" --arg lease "$LEASE_ID" --arg wall "$WALL_ID" --arg cycle "$(cat "$OUT/product/cycle-id.txt")" \
            --arg review_identity "$review_identity" --arg reviewed_at "$REVIEWED_AT" \
            '{task:$task,lease:$lease,wall:$wall,cycle_id:$cycle,review_identity:$review_identity,reviewed_at:$reviewed_at,normalizer_sha256:env.NORMALIZER_SOURCE_SHA256}' \
            > "$OUT/product/transform-seed.json"
          git -C "$work" add --pathspec-from-file="$OUT/product/finalization-paths.txt"
          git -C "$work" diff --cached --name-only | LC_ALL=C sort > "$OUT/diagnostics/precommit-finalization-paths.txt"
          diff -u "$OUT/product/finalization-paths.txt" "$OUT/diagnostics/precommit-finalization-paths.txt"
          test "$(wc -l < "$OUT/diagnostics/precommit-finalization-paths.txt")" = "$EXPECTED_FINALIZATION_PATHS"
          git -C "$work" commit -m 'Doctor Who: finalize reviewed cycle 008 Kreg receipt' >/dev/null
          final="$(git -C "$work" rev-parse HEAD)"
          test "$(git -C "$work" show -s --format=%P HEAD)" = "$candidate"
          git -C "$work" diff --name-only "$candidate".."$final" | LC_ALL=C sort > "$OUT/product/actual-finalization-paths.txt"
          diff -u "$OUT/product/finalization-paths.txt" "$OUT/product/actual-finalization-paths.txt"
          git -C "$work" diff --name-only "$FINALIZATION_MAIN".."$final" | LC_ALL=C sort > "$OUT/product/final-product-paths.txt"
          test "$(wc -l < "$OUT/product/final-product-paths.txt")" = "$EXPECTED_FINAL_PATHS"
          test -z "$(git -C "$work" status --porcelain)"
          printf 'final_commit=%s\n' "$final" >> "$GITHUB_OUTPUT"
          SH
          sed -i 's/^          //' "$SCRIPT_ROOT/finalize/06.sh"
          chmod 0755 "$SCRIPT_ROOT/finalize/06.sh"
          test "$(find "$SCRIPT_ROOT/finalize" -type f -name '*.sh' | wc -l)" = 9
          for script in "$SCRIPT_ROOT/finalize"/*.sh; do bash -n "$script"; done
          grep -Fq "! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS'" "$SCRIPT_ROOT/finalize/08.sh"
          sha256sum "$SCRIPT_ROOT/finalize"/*.sh "$SCRIPT_ROOT/kreg-exact-normalizer.py" > "$SCRIPT_ROOT/finalize-scripts.sha256"

      - name: Bind exact one-file finalizer and observed live main
        run: bash "$SCRIPT_ROOT/finalize/01.sh"

      - name: Retain exact successful V8b review packet
        run: bash "$SCRIPT_ROOT/finalize/02.sh"

      - name: Verify approved V8b authority and candidate bytes
        run: bash "$SCRIPT_ROOT/finalize/03.sh"

      - name: Recompose exact candidate over finalization main
        id: candidate
        run: bash "$SCRIPT_ROOT/finalize/04.sh"

      - name: Recover exact cycle-007 finalization templates
        run: bash "$SCRIPT_ROOT/finalize/05.sh"

      - name: Derive exact eight-path cycle-008 finalization
        id: finalize_product
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: bash "$SCRIPT_ROOT/finalize/06.sh"

      - name: Run permanent checkers and complete rendered gate
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/07.sh"

      - name: Seal code-free forty-eight-path prototype packet
        id: seal
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/08.sh"

      - name: Upload V9b final-product prototype
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-prototype-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize/product
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain finalize diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          if [ -f "$SCRIPT_ROOT/finalize/09.sh" ]; then
            bash "$SCRIPT_ROOT/finalize/09.sh"
          fi

      - name: Upload finalizer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-finalize-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-finalize
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  review:
    needs: finalize
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review-scripts
      REPAIR_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review-repair
      PROTOTYPE_ID: ${{ needs.finalize.outputs.artifact_id }}
      PROTOTYPE_DIGEST: ${{ needs.finalize.outputs.artifact_digest }}
      SOURCE_FINALIZATION_MAIN: ${{ needs.finalize.outputs.finalization_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover qualified independent-review scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPAIR_ROOT"
          mkdir -p "$REPAIR_ROOT/api"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$BASELINE_WRAPPER_BLOB" > "$REPAIR_ROOT/api/baseline-wrapper.json"
          jq -e --arg sha "$BASELINE_WRAPPER_BLOB" '.sha==$sha and .encoding=="base64"' "$REPAIR_ROOT/api/baseline-wrapper.json" >/dev/null
          jq -r '.content' "$REPAIR_ROOT/api/baseline-wrapper.json" | tr -d '\n' | base64 --decode > "$REPAIR_ROOT/baseline-wrapper.yml"
          test "$(git hash-object "$REPAIR_ROOT/baseline-wrapper.yml")" = "$BASELINE_WRAPPER_BLOB"
          SOURCE="$REPAIR_ROOT/baseline-wrapper.yml" TARGET="$REPAIR_ROOT/recover-review.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          source=Path(os.environ['SOURCE'])
          target=Path(os.environ['TARGET'])
          doc=yaml.safe_load(source.read_text())
          steps=doc['jobs']['review']['steps']
          matches=[s.get('run') for s in steps if s.get('name')=='Recover qualified independent-review scripts']
          assert len(matches)==1 and isinstance(matches[0],str)
          target.write_text(matches[0])
          target.chmod(0o755)
          PY
          bash -n "$REPAIR_ROOT/recover-review.sh"
          bash "$REPAIR_ROOT/recover-review.sh"
          ROOT="$SCRIPT_ROOT/review" python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          bind=root/'01.sh'
          text=bind.read_text()
          replacements=[
              ('target.mkdir()', 'target.mkdir(exist_ok=True)'),
              ('target.mkdir(parents=True)', 'target.mkdir(parents=True,exist_ok=True)'),
              ('target.mkdir(parents=True, exist_ok=False)', 'target.mkdir(parents=True, exist_ok=True)'),
          ]
          hits=sum(text.count(old) for old,_ in replacements)
          assert hits==1, hits
          for old,new in replacements:
              text=text.replace(old,new)
          bind.write_text(text)
          PY
          test "$(find "$SCRIPT_ROOT/review" -type f -name '*.sh' | wc -l)" = 5
          for script in "$SCRIPT_ROOT/review"/*.sh; do bash -n "$script"; done
          grep -Fq "! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS'" "$SCRIPT_ROOT/review/04.sh"
          sha256sum "$SCRIPT_ROOT/review"/*.sh > "$SCRIPT_ROOT/review-scripts.sha256"

      - name: Bind exact same-run prototype artifact and live review main
        run: bash "$SCRIPT_ROOT/review/01.sh"

      - name: Verify prototype checksums, receipt, archive, bundle, and patch
        run: bash "$SCRIPT_ROOT/review/02.sh"

      - name: Independently recompose exact forty-eight paths and run complete gate
        id: review_product
        run: bash "$SCRIPT_ROOT/review/03.sh"

      - name: Seal approved-for-publication product packet
        env:
          REVIEWED_COMMIT: ${{ steps.review_product.outputs.reviewed_commit }}
        run: bash "$SCRIPT_ROOT/review/04.sh"

      - name: Upload approved V9b final-product packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-approved-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain review diagnostics and remove worktrees
        if: always()
        shell: bash
        run: |
          if [ -f "$SCRIPT_ROOT/review/05.sh" ]; then
            bash "$SCRIPT_ROOT/review/05.sh"
          fi

      - name: Upload review failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9b-review-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9b-review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
