name: doctor-who-cycle-009-megnus-jaka-merger-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-merger-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-merger-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: ${{ github.event.pull_request.base.sha }}
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v1.yml
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v1
      PUBLISHER_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-final-publisher-v1
      PUBLISHER_WORKFLOW: doctor-who-cycle-009-megnus-jaka-final-publisher-v1
      PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      WALL_ID: UC-1354
      PRODUCT_PR_CHECKS: archive-contract,publisher-custody,publisher-custody-or-guard

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-commit guardian
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,publication,product,settlement,diagnostics}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$BASE_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$BASE_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$BASE_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); pr=json.loads((root/'api/carrier-pr.json').read_text()); files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$BASE_MAIN"

      - name: Wait for exact publisher success, product ref, and draft PR
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 1120); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$PUBLISHER_BRANCH" -f event=pull_request -F per_page=30 > "$OUT/api/publisher-runs.json"
            publisher_run="$(jq -r --arg name "$PUBLISHER_WORKFLOW" --arg branch "$PUBLISHER_BRANCH" '[.workflow_runs[] | select(.name==$name and .head_branch==$branch)] | sort_by(.id) | last | if .status=="completed" and .conclusion=="success" then .id else empty end' "$OUT/api/publisher-runs.json")"
            if [ -n "$publisher_run" ] && gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" > "$OUT/api/product-ref.json" 2>/dev/null; then
              gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="BigBirdReturns:$PRODUCT_BRANCH" -F per_page=100 > "$OUT/api/product-prs.json"
              if [ "$(jq 'length' "$OUT/api/product-prs.json")" = 1 ]; then ready=true; break; fi
            fi
            sleep 15
          done
          test "$ready" = true
          product_pr="$(jq -r '.[0].number' "$OUT/api/product-prs.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$product_pr" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$product_pr/files?per_page=100" > "$OUT/api/product-pr-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$publisher_run" > "$OUT/api/publisher-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$publisher_run/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$publisher_run/artifacts?per_page=100" > "$OUT/api/publisher-artifacts.json"
          ROOT="$OUT" RUN="$publisher_run" PR="$product_pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); run=json.loads((root/'api/publisher-run.json').read_text()); jobs=json.loads((root/'api/publisher-jobs.json').read_text())['jobs']; pr=json.loads((root/'api/product-pr.json').read_text()); ref=json.loads((root/'api/product-ref.json').read_text())
          assert run['id']==int(os.environ['RUN']) and run['name']==os.environ['PUBLISHER_WORKFLOW'] and run['head_branch']==os.environ['PUBLISHER_BRANCH'] and run['status']=='completed' and run['conclusion']=='success'
          by={j['name']:j for j in jobs}; assert set(by)=={'qualify','publish'} and all(j['conclusion']=='success' for j in by.values())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE_MAIN'] and pr['head']['ref']==os.environ['PRODUCT_BRANCH'] and pr['head']['sha']==ref['object']['sha']
          assert pr['commits']==1
          (root/'settlement/publisher-terminal.json').write_text(json.dumps({'run':run['id'],'head_sha':run['head_sha'],'jobs':{k:v['id'] for k,v in by.items()},'product_pr':pr['number'],'product_commit':pr['head']['sha']},indent=2,sort_keys=True)+'\n')
          PY
          printf 'PUBLISHER_RUN=%s\nPRODUCT_PR=%s\nPRODUCT_COMMIT=%s\n' "$publisher_run" "$product_pr" "$(jq -r '.object.sha' "$OUT/api/product-ref.json")" >> "$GITHUB_ENV"

      - name: Rehydrate exact publication receipt
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(jq -r '.artifacts[] | select(.expired==false and (.name|contains("-publication-")) and (.name|contains("diagnostics")|not)) | [.id,.name,.digest] | @tsv' "$OUT/api/publisher-artifacts.json")
          test "${#artifacts[@]}" = 1
          IFS=$'\t' read -r artifact_id artifact_name artifact_digest <<<"${artifacts[0]}"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/publication.zip"
          test "$(sha256sum "$OUT/publication.zip" | awk '{print $1}')" = "${artifact_digest#sha256:}"
          ROOT="$OUT" ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" ARTIFACT_DIGEST="$artifact_digest" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); target=root/'publication'
          with zipfile.ZipFile(root/'publication.zip') as z:
              names=z.namelist(); assert len(names)==len(set(names))
              for info in z.infolist():
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts and not info.is_dir()
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'; assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=target/name.lstrip('*'); assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          publication=json.loads((target/'publication.json').read_text()); manifest=json.loads((target/'file-manifest.json').read_text())
          assert publication['status']=='cycle-009-megnus-jaka-reviewed-product-ref-published'
          assert publication['workflow_run']==int(os.environ['PUBLISHER_RUN']) and publication['canonical_parent']==os.environ['BASE_MAIN']
          assert publication['product_branch']==os.environ['PRODUCT_BRANCH'] and publication['product_commit']==os.environ['PRODUCT_COMMIT']
          assert publication['product_tree']==manifest['final_tree'] and publication['product_path_count']==len(manifest['paths'])
          assert publication['approved_tree_preserved'] is True and publication['main_unchanged'] is True and publication['force_update'] is False
          meta={'artifact_id':int(os.environ['ARTIFACT_ID']),'artifact_name':os.environ['ARTIFACT_NAME'],'artifact_digest':os.environ['ARTIFACT_DIGEST'],'publication_identity':publication['identity']}
          (root/'settlement/publication-custody.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
          printf 'PUBLICATION_ARTIFACT=%s\nPUBLICATION_ARTIFACT_DIGEST=%s\n' "$artifact_id" "$artifact_digest" >> "$GITHUB_ENV"

      - name: Prove exact one-parent workflow-free product geometry
        shell: bash
        run: |
          set -euo pipefail
          product_tree="$(jq -r '.product_tree' "$OUT/publication/publication.json")"
          product_paths="$(jq -r '.product_path_count' "$OUT/publication/publication.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" --jq '.object.sha')" = "$PRODUCT_COMMIT"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$PRODUCT_COMMIT" > "$OUT/api/product-commit.json"
          test "$(jq -r '.parents|length' "$OUT/api/product-commit.json")" = 1
          test "$(jq -r '.parents[0].sha' "$OUT/api/product-commit.json")" = "$BASE_MAIN"
          test "$(jq -r '.tree.sha' "$OUT/api/product-commit.json")" = "$product_tree"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$BASE_MAIN...$PRODUCT_COMMIT" > "$OUT/api/product-compare.json"
          ROOT="$OUT" PATHS="$product_paths" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); compare=json.loads((root/'api/product-compare.json').read_text()); manifest=json.loads((root/'publication/file-manifest.json').read_text()); files=json.loads((root/'api/product-pr-files.json').read_text())
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          expected=sorted(r['path'] for r in manifest['paths']); actual=sorted(f['filename'] for f in compare['files']); pr_actual=sorted(f['filename'] for f in files)
          assert len(expected)==int(os.environ['PATHS']) and actual==expected==pr_actual
          assert not any(p.startswith('.github/workflows/') or '/.tmp/' in '/'+p or p.startswith('tmp/') or p.startswith('transport/') for p in expected)
          PY
          printf 'PRODUCT_TREE=%s\nPRODUCT_PATH_COUNT=%s\n' "$product_tree" "$product_paths" >> "$GITHUB_ENV"

      - name: Wait for exact repository custody checks on product PR
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a required <<< "$PRODUCT_PR_CHECKS"
          ready=false
          for _ in $(seq 1 480); do
            gh api "/repos/$GITHUB_REPOSITORY/commits/$PRODUCT_COMMIT/check-runs?per_page=100" > "$OUT/api/product-check-runs.json"
            ROOT="$OUT" REQUIRED="$PRODUCT_PR_CHECKS" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          runs=json.loads((Path(os.environ['ROOT'])/'api/product-check-runs.json').read_text())['check_runs']; required=os.environ['REQUIRED'].split(',')
          by={r['name']:r for r in runs}
          missing=[x for x in required if x not in by]
          bad=[x for x in required if x in by and not (by[x]['status']=='completed' and by[x]['conclusion']=='success')]
          if missing or bad: sys.exit(1)
          PY
            if [ "$?" = 0 ]; then ready=true; break; fi
            sleep 15
          done
          test "$ready" = true
          ROOT="$OUT" REQUIRED="$PRODUCT_PR_CHECKS" python3 - <<'PY'
          import json,os
          from pathlib import Path
          runs=json.loads((Path(os.environ['ROOT'])/'api/product-check-runs.json').read_text())['check_runs']; required=os.environ['REQUIRED'].split(','); by={r['name']:r for r in runs}
          receipt={x:{'id':by[x]['id'],'status':by[x]['status'],'conclusion':by[x]['conclusion'],'details_url':by[x]['details_url']} for x in required}
          (Path(os.environ['ROOT'])/'settlement/product-checks.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Check out exact product and rerun all permanent gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$PRODUCT_COMMIT"
          git checkout --detach "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P HEAD)" = "$BASE_MAIN"
          test "$(git show -s --format=%T HEAD)" = "$PRODUCT_TREE"
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/settlement/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/settlement/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/settlement/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/settlement/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/settlement/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/settlement/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/settlement/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/settlement/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/settlement/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/settlement/waterline-status.json" >/dev/null
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/settlement/autopilot-status.json" >/dev/null
          node scripts/gate.mjs | tee "$OUT/settlement/complete-gate.log"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - name: Seal exact fast-forward settlement
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/publication/publication.json" "$OUT/settlement/publication.bound.json"
          cp "$OUT/publication/file-manifest.json" "$OUT/settlement/file-manifest.bound.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); publication=json.loads((root/'publication/publication.json').read_text()); checks=json.loads((root/'settlement/product-checks.json').read_text()); waterline=json.loads((root/'settlement/waterline-status.json').read_text())
          receipt={'status':'cycle-009-megnus-jaka-exact-fast-forward-approved','verify_run':int(os.environ['GITHUB_RUN_ID']),'verify_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'canonical_parent':os.environ['BASE_MAIN'],'product_pr':int(os.environ['PRODUCT_PR']),'product_branch':os.environ['PRODUCT_BRANCH'],'product_commit':os.environ['PRODUCT_COMMIT'],'product_tree':os.environ['PRODUCT_TREE'],'product_path_count':int(os.environ['PRODUCT_PATH_COUNT']),'publisher_run':int(os.environ['PUBLISHER_RUN']),'publication_artifact':int(os.environ['PUBLICATION_ARTIFACT']),'publication_artifact_digest':os.environ['PUBLICATION_ARTIFACT_DIGEST'],'publication_identity':publication['identity'],'product_checks':checks,'task_id':os.environ['TASK_ID'],'wall_id':os.environ['WALL_ID'],'cycle_id':publication['cycle_id'],'receipt_sha256':publication['receipt_sha256'],'waterline_claim_allowed':waterline['claim_allowed'],'force_update':False,'main_mutated':False,'tenth_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/'settlement/settlement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/settlement" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/settlement/$rel" | sed "s#  $OUT/settlement/#  #"; done > "$OUT/settlement/SHA256SUMS.pre"
          sha256sum "$OUT/settlement/SHA256SUMS.pre" | sed "s#  $OUT/settlement/#  #" > "$OUT/settlement/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  fast_forward:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: ${{ github.event.pull_request.base.sha }}
      PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
      SETTLEMENT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1-settlement
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1-merge

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v1-settlement

      - name: Reverify same-run settlement and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          SETTLEMENT="$SETTLEMENT" OUT="$OUT" python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ['SETTLEMENT']); out=Path(os.environ['OUT']); repo=os.environ['GITHUB_REPOSITORY']; base=os.environ['BASE_MAIN']; branch=os.environ['PRODUCT_BRANCH']
          def gh(method,path,payload=None):
              cmd=['gh','api']
              if method!='GET': cmd+=['--method',method]
              cmd.append(path)
              if payload is None: p=subprocess.run(cmd,check=True,capture_output=True,text=True)
              else: p=subprocess.run(cmd+['--input','-'],input=json.dumps(payload),check=True,capture_output=True,text=True)
              return json.loads(p.stdout) if p.stdout.strip() else None
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'; assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=root/name.lstrip('*'); assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement.json').read_text()); publication=json.loads((root/'publication.bound.json').read_text()); manifest=json.loads((root/'file-manifest.bound.json').read_text())
          assert settlement['status']=='cycle-009-megnus-jaka-exact-fast-forward-approved'
          assert settlement['verify_run']==int(os.environ['GITHUB_RUN_ID']) and settlement['verify_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert settlement['canonical_parent']==base==publication['canonical_parent']==manifest['base_main']
          assert settlement['product_branch']==branch==publication['product_branch']
          assert settlement['product_commit']==publication['product_commit'] and settlement['product_tree']==publication['product_tree']==manifest['final_tree']
          assert settlement['product_path_count']==publication['product_path_count']==len(manifest['paths'])
          assert settlement['publication_identity']==publication['identity'] and settlement['force_update'] is False and settlement['main_mutated'] is False
          main=gh('GET',f'/repos/{repo}/git/ref/heads/main'); assert main['object']['sha']==base
          product_ref=gh('GET',f'/repos/{repo}/git/ref/heads/{branch}'); assert product_ref['object']['sha']==settlement['product_commit']
          commit=gh('GET',f'/repos/{repo}/git/commits/{settlement["product_commit"]}'); assert [p['sha'] for p in commit['parents']]==[base] and commit['tree']['sha']==settlement['product_tree']
          compare=gh('GET',f'/repos/{repo}/compare/{base}...{settlement["product_commit"]}'); assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert sorted(f['filename'] for f in compare['files'])==sorted(r['path'] for r in manifest['paths'])
          prs=gh('GET',f'/repos/{repo}/pulls?state=open&head=BigBirdReturns:{branch}&per_page=100'); assert len(prs)==1; pr=prs[0]
          assert pr['number']==settlement['product_pr'] and pr['draft'] is True and pr['base']['sha']==base and pr['head']['sha']==settlement['product_commit'] and pr['merged'] is False
          gh('PATCH',f'/repos/{repo}/git/refs/heads/main',{'sha':settlement['product_commit'],'force':False})
          for _ in range(60):
              main=gh('GET',f'/repos/{repo}/git/ref/heads/main')
              if main['object']['sha']==settlement['product_commit']: break
              time.sleep(2)
          assert main['object']['sha']==settlement['product_commit']
