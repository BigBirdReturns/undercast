name: card-backfill-uc-080-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-080-APPLY.json"
      - "scripts/card-backfill-uc-080-apply.mjs"
      - "scripts/card-backfill-uc-080-apply-custody.mjs"
      - ".github/workflows/card-backfill-uc-080-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-080-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-019'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-019
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Jeriba packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-080-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-080');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-080');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_b7a185b181d2292ce7e73ad7');
          if(row.version!==1||row.record_id!=='UC-080'||row.actor!=='Louis Gossett Jr.'||row.character!=="Jeriba 'Jerry' Shigan"||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-080 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8669650651||row.render_artifact?.head_sha!=='3472b559c639f07d6835500c27dcdc1ed2245409')throw new Error('UC-080 render custody drift');
          if(!row.failed_apply_checkpoints?.some(item=>item.run_id===30309556411&&item.artifact_id===8669787482))throw new Error('UC-080 failed apply custody drift');
          if(row.expected?.selected_source_sha256!=='0defb8e781dbeeb885a9b7d8177f5e6ab732686cf3d7a00a1483b800d0d8087b'||row.expected?.historic_press_sha256!=='cff0cfe0898e91461fe23038498c707b903768cd365bcaabcac53f4e25548e5b')throw new Error('UC-080 source authorization drift');
          if(row.expected?.candidate_sha256!=='3af5bb3ed284de3260940bd43cf8353141868ca808f25644f005b134476f89bf'||row.expected?.crop_preview_sha256!=='f6681b9b99a25b092e3bd447e3d362ca42089ddc76dc7fdef9abe3159b388d9a')throw new Error('UC-080 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==14||row.expected?.duplicate_item_count!==4||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-080 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-single-role-west-crop'||row.ruling?.canonical_mutation!==false)throw new Error('UC-080 ruling drift');
          if(!specimen||specimen.character!=="Jeriba 'Jerry' Shigan"||specimen.still)throw new Error('UC-080 specimen boundary drift');
          if(source?.still)throw new Error('UC-080 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-080'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-080 audit boundary drift');
          console.log(`PASS — UC-080 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-080-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8669650651/zip" > "$root/render.zip"
          echo "e21f57c8d991c2502e07671924e005e9c50673c5d70fa10217fdca1b2524714f  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-080"
          test -f "$base/manifest.json"
          echo "010d897decd31ac11cefbf835619586af652062ffeb29972ca067926e0d2e475  $base/manifest.json" | sha256sum -c -
          echo "a54fd78ff8ea5ff9503363656c61f3797ceb16af353833ef8bdb5e922a03f736  $base/duplicate-scan.json" | sha256sum -c -
          echo "ac169f8f8195a7778f9a722595f0d51e2d5bf4e484226bc566cbd2c1d1054421  $base/review.json" | sha256sum -c -
          echo "c1409e46a63734d2437a7de75c973879cd673fdd98c412155b5e0e8058e86874  $base/review.md" | sha256sum -c -
          echo "ce6980abb97e714116549da96beb8af4aed94198e10ae6497db1e1ebc7245541  $base/SHA256SUMS" | sha256sum -c -
          echo "0defb8e781dbeeb885a9b7d8177f5e6ab732686cf3d7a00a1483b800d0d8087b  $base/jeriba-original.jpg" | sha256sum -c -
          echo "cff0cfe0898e91461fe23038498c707b903768cd365bcaabcac53f4e25548e5b  $base/historic-images-press-photo.webp" | sha256sum -c -
          echo "b8393fbe8923c360fa5a3a35771a5fb048c6e57bc8d0527d0ba1a8e6609d7a12  $base/historic-images-product.txt" | sha256sum -c -
          echo "e59838f7b242fc15251f6c1988bea08b6ab17f0f300db09198b27373f3ddc136  $base/apple-tv-role.txt" | sha256sum -c -
          echo "d9837b38287652c671ac692816df49585d70c1f4bfe6e3e76bf00b3302d83dc2  $base/purepeople-role.txt" | sha256sum -c -
          echo "dc9338be33a5bfda9cba1396e11ca7a1271bedb73f2bb6cdebe0336138753978  $base/source-page-moria.png" | sha256sum -c -
          echo "9ee028d26aa0a22765e1e95979091ae969db24dfb0ddc36513d1cfd2243952d7  $base/source-page-purepeople.png" | sha256sum -c -
          echo "3af5bb3ed284de3260940bd43cf8353141868ca808f25644f005b134476f89bf  $base/uc-080-still-candidate.jpg" | sha256sum -c -
          echo "f6681b9b99a25b092e3bd447e3d362ca42089ddc76dc7fdef9abe3159b388d9a  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30309162833
          artifact_id=8669650651
          artifact_name=card-backfill-uc-080-render-30309162833
          artifact_zip_sha256=e21f57c8d991c2502e07671924e005e9c50673c5d70fa10217fdca1b2524714f
          artifact_head_sha=3472b559c639f07d6835500c27dcdc1ed2245409
          source_manifest_sha256=010d897decd31ac11cefbf835619586af652062ffeb29972ca067926e0d2e475
          source_sums_sha256=ce6980abb97e714116549da96beb8af4aed94198e10ae6497db1e1ebc7245541
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-080-apply/source/output/UC-080
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-080-apply"
          node --check scripts/card-backfill-uc-080-apply.mjs
          node --check scripts/card-backfill-uc-080-apply-custody.mjs
          node scripts/card-backfill-uc-080-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-080-apply-custody.mjs 2>&1 | tee "$root/custody.log"
          node scripts/card-backfill-uc-080-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-080');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-080');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_b7a185b181d2292ce7e73ad7');
          const manifest=JSON.parse(fs.readFileSync('data/review/card-backfill/UC-080/manifest.json','utf8'));
          if(!specimen||specimen.still)throw new Error('UC-080 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-080 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-080'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-080 audit disposition was canonically mutated');
          if(!manifest.custody?.failed_apply_checkpoints?.some(item=>item.run_id===30309556411&&item.artifact_id===8669787482))throw new Error('UC-080 failed apply custody was not retained');
          console.log('PASS — UC-080 remains canonically absent; reviewed evidence and failed-apply custody only were added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-080-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-080.json \
            .github/CARD-BACKFILL-UC-080-DISCOVER.json \
            .github/CARD-BACKFILL-UC-080-RENDER.json \
            .github/CARD-BACKFILL-UC-080-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-080-scope.yml \
            .github/workflows/card-backfill-uc-080-discover.yml \
            .github/workflows/card-backfill-uc-080-render.yml \
            .github/workflows/card-backfill-uc-080-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-080-scope.mjs \
            scripts/card-backfill-uc-080-discover.mjs \
            scripts/card-backfill-uc-080-discover-repair.mjs \
            scripts/card-backfill-uc-080-render.mjs \
            scripts/card-backfill-uc-080-apply.mjs \
            scripts/card-backfill-uc-080-apply-custody.mjs
          git add -A
          git diff --cached --check -- . ':(exclude,glob)data/review/card-backfill/UC-080/*.txt'
          git commit -m 'Card backfill: retain UC-080 Louis Gossett Jr. Jeriba still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-018
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-018 HEAD)
          test "${#changed[@]}" -eq 14
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-080/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-080-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-019
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-080-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-080-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-080-apply
            data/review/card-backfill/UC-080
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
