name: star-trek-kol-tai-run-rescue-v1

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/star-trek-kol-tai-run-rescue-v1.yml
      - transport/kol-tai-run-rescue-v1/**

concurrency:
  group: star-trek-kol-tai-run-rescue-v1
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  rescue:
    name: star-trek-kol-tai-run-rescue-v1
    if: github.event.pull_request.head.ref == 'agent/star-trek-kol-tai-run-rescue-v1'
    runs-on: macos-14
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 31832ca882b9b8d2a76f4a7f2d679844d7bde5ba
      EXACT_RUN_ID: '32227819333'
      TARGET_HEAD_BRANCH: agent/star-trek-kol-tai-repair-v4
      EXPECTED_SOURCE_HEAD: 4cd8a6d6cacbf3496a1fb9401c8ed1033db8dd66
      SOURCE_LOCATOR_BRANCH: agent/star-trek-kol-tai-result-v1
      RESULT_BRANCH: agent/star-trek-kol-tai-run-rescue-result-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publish exact-run rescue locator
        run: |
          set -euo pipefail
          carrier_head="$(git rev-parse HEAD)"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/kol-tai-run-rescue-v1
          mkdir -p transport/kol-tai-run-rescue-v1
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-KOL-TAI-RUN-RESCUE-V1 \
            --arg status started \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --arg workflow_head "$carrier_head" \
            --arg canonical_parent "$EXPECTED_MAIN" \
            --argjson exact_run_id "$EXACT_RUN_ID" \
            --arg target_head_branch "$TARGET_HEAD_BRANCH" \
            --arg expected_source_head "$EXPECTED_SOURCE_HEAD" \
            '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,canonical_parent:$canonical_parent,exact_run_id:$exact_run_id,target_head_branch:$target_head_branch,expected_source_head:$expected_source_head}' \
            > transport/kol-tai-run-rescue-v1/run-start.json
          git config user.name undercast-star-trek-kol-tai-run-rescue
          git config user.email star-trek-kol-tai-run-rescue@users.noreply.github.com
          git add transport/kol-tai-run-rescue-v1/run-start.json
          git commit -m 'Kol-Tai: publish exact-run rescue locator'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
          git checkout --detach "$carrier_head"

      - name: Cancel only duplicate Kol-Tai carriers and launch one clean exact attempt
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"

          locator_b64="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/transport/kol-tai-cycle-v1/run-start.json?ref=${SOURCE_LOCATOR_BRANCH}" --jq .content)"
          locator="$(printf '%s' "$locator_b64" | python3 -c 'import base64,sys; print(base64.b64decode(sys.stdin.read()).decode(), end="")')"
          test "$(jq -r .head_sha <<<"$locator")" = "$EXPECTED_SOURCE_HEAD"
          test "$(jq -r .status <<<"$locator")" = source-fixed-v9-direct
          test "$(jq -r .canonical_parent <<<"$locator")" = "$EXPECTED_MAIN"

          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fstar-trek-kol-tai-repair-v4&per_page=100")"
          jq -r '[.workflow_runs[] | select(.status != "completed") | .id] | unique | .[]' <<<"$runs" > /tmp/kol-tai-active-run-ids.txt
          test "$(grep -c "^${EXACT_RUN_ID}$" /tmp/kol-tai-active-run-ids.txt || true)" = 1

          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1 || true
          done < /tmp/kol-tai-active-run-ids.txt

          for attempt in {1..90}; do
            remaining=0
            while IFS= read -r run_id; do
              test -n "$run_id" || continue
              status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status 2>/dev/null || echo completed)"
              if test "$status" != completed; then
                remaining=$((remaining + 1))
              fi
            done < /tmp/kol-tai-active-run-ids.txt
            test "$remaining" = 0 && break
            sleep 2
          done

          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
          done < /tmp/kol-tai-active-run-ids.txt

          gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_RUN_ID}/rerun" >/dev/null

          rerun=''
          for attempt in {1..60}; do
            rerun="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EXACT_RUN_ID}")"
            run_attempt="$(jq -r .run_attempt <<<"$rerun")"
            status="$(jq -r .status <<<"$rerun")"
            if test "$run_attempt" -ge 3 && test "$status" != completed; then
              break
            fi
            sleep 2
          done
          test "$(jq -r .run_attempt <<<"$rerun")" -ge 3
          test "$(jq -r .status <<<"$rerun")" != completed

          rm -rf /tmp/kol-tai-run-rescue-v1
          mkdir -p /tmp/kol-tai-run-rescue-v1
          cp /tmp/kol-tai-active-run-ids.txt /tmp/kol-tai-run-rescue-v1/cancelled-run-ids.txt
          printf '%s\n' "$locator" | jq . > /tmp/kol-tai-run-rescue-v1/source-locator.json
          printf '%s\n' "$rerun" | jq . > /tmp/kol-tai-run-rescue-v1/exact-rerun.json

          git fetch --filter=blob:none --no-tags origin "$RESULT_BRANCH"
          git checkout --detach FETCH_HEAD
          python3 - "$(jq -r .run_attempt <<<"$rerun")" "$(jq -r .status <<<"$rerun")" <<'PY'
          from pathlib import Path
          import json
          import sys

          path = Path('transport/kol-tai-run-rescue-v1/run-start.json')
          data = json.loads(path.read_text())
          ids = [int(line) for line in Path('/tmp/kol-tai-active-run-ids.txt').read_text().splitlines() if line]
          data['status'] = 'success'
          data['cancelled_active_run_ids'] = ids
          data['relaunched_attempt'] = int(sys.argv[1])
          data['relaunched_status'] = sys.argv[2]
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git add transport/kol-tai-run-rescue-v1/run-start.json
          git commit -m 'Kol-Tai: seal one clean exact-run attempt'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"

      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-kol-tai-run-rescue-v1
          path: /tmp/kol-tai-run-rescue-v1/
          if-no-files-found: error
          retention-days: 30
