name: patch-doctor-who-cycle-002-checker-line

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-doctor-who-cycle-002-checker-line.yml"

permissions:
  contents: write

concurrency:
  group: patch-doctor-who-cycle-002-checker-line-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Replace the unique escaped receipt-hash checker line by marker
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: .github/workflows/patch-doctor-who-cycle-002-checker-line.yml
          WRITER: .github/workflows/complete-doctor-who-cycle-002-v2.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=64 origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          text = path.read_text()
          lines = text.splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip().startswith('const receiptHashBefore =')]
          ends = [i for i, line in enumerate(lines) if 'finalizerText = finalizerText.replace(receiptHashBefore, receiptHashAfter);' in line]
          if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
              raise SystemExit(f'expected one receipt checker patch block, starts={starts}, ends={ends}')

          replacement = r'''          const receiptHashLines = finalizerText.split('\n').filter((line) => line.includes('cycle 002 receipt hash drifted'));
          if (receiptHashLines.length !== 1) throw new Error(`expected one receipt hash checker line, found ${receiptHashLines.length}`);
          const receiptHashBefore = receiptHashLines[0];
          const receiptHashAfter = 'if (receipt.receipt_sha256 !== sha(JSON.stringify(stable(receiptBody), null, 2) + "\\n")) fail("cycle 002 receipt hash drifted");';
          finalizerText = finalizerText.replace(receiptHashBefore, receiptHashAfter);'''.splitlines()

          lines[starts[0]:ends[0] + 1] = replacement
          updated = '\n'.join(lines) + '\n'
          if updated.count("line.includes('cycle 002 receipt hash drifted')") != 1:
              raise SystemExit('marker-based checker replacement did not land exactly once')
          if updated.count('JSON.stringify(stable(receiptBody), null, 2)') != 1:
              raise SystemExit('pretty stable receipt hash replacement did not land exactly once')
          if 'expected one compact receipt hash checker' in updated:
              raise SystemExit('brittle compact-checker matcher survived')
          path.write_text(updated)
          PY

          grep -Fq "line.includes('cycle 002 receipt hash drifted')" "$WRITER"
          grep -Fq 'JSON.stringify(stable(receiptBody), null, 2)' "$WRITER"
          ! grep -Fq 'expected one compact receipt hash checker' "$WRITER"
          git rm "$SELF"
          git add "$WRITER"
          git diff --cached --check
          git commit \
            -m 'Doctor Who: repair Gredd receipt checker by unique marker' \
            -m 'replace the literal backslash-n checker input with stable pretty JSON and a real newline'
          patched_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "patched_head=$patched_head" >> "$GITHUB_STEP_SUMMARY"
