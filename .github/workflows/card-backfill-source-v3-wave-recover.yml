name: card-backfill-source-v3-wave-recover

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/card-backfill/WAVE-RECOVERY.json'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Failed source-v3 wave run whose immutable artifacts must be recovered'
        required: true
      source_head:
        description: 'Exact commit SHA used by the failed source wave'
        required: true
      model:
        description: 'Independent second-desk GitHub Model'
        required: false
        default: 'openai/gpt-4.1-mini'

permissions:
  contents: write
  actions: read
  models: read
  statuses: write

concurrency:
  group: card-backfill-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      source_head: ${{ steps.request.outputs.source_head }}
      mutation_head: ${{ steps.head.outputs.mutation_head }}
      matrix: ${{ steps.request.outputs.matrix }}
      wave_sha256: ${{ steps.request.outputs.wave_sha256 }}
      selected_count: ${{ steps.request.outputs.selected_count }}
      wave_batches: ${{ steps.request.outputs.wave_batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind recovery mutation to the exact request head
        id: head
        run: echo "mutation_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Re-prove inherited lessons before touching retained artifacts
        run: |
          set -euo pipefail
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-source-policy-v2-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate \
            --out "$RUNNER_TEMP/lessons-validation.json"

      - name: Resolve and verify the immutable source wave
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN: ${{ inputs.source_run_id || '' }}
          INPUT_HEAD: ${{ inputs.source_head || '' }}
        run: |
          set -euo pipefail
          request='.github/card-backfill/WAVE-RECOVERY.json'
          if [ -n "$INPUT_RUN" ]; then
            source_run_id="$INPUT_RUN"
            source_head="$INPUT_HEAD"
          else
            source_run_id=$(node -e "const p=require('./${request}');process.stdout.write(String(p.source_run_id))")
            source_head=$(node -e "const p=require('./${request}');process.stdout.write(String(p.source_head))")
          fi
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_head" =~ ^[0-9a-f]{40}$ ]]
          plan="$RUNNER_TEMP/source-plan"
          mkdir -p "$plan"
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "card-backfill-source-v3-wave-plan-${source_run_id}" \
            --dir "$plan"
          test -f "$plan/wave.json"
          test -f "$plan/assemble-matrix.json"
          node --input-type=module - "$plan/wave.json" "$plan/assemble-matrix.json" "$source_run_id" "$source_head" <<'NODE'
          import fs from 'node:fs';
          const [wavePath,matrixPath,runId,sourceHead]=process.argv.slice(2);
          const wave=JSON.parse(fs.readFileSync(wavePath,'utf8'));
          const matrix=JSON.parse(fs.readFileSync(matrixPath,'utf8'));
          if(wave.wave_batches!==4||wave.selected_count!==160)throw new Error(`recovery expects the proven four-batch/160-obligation wave; got ${wave.wave_batches}/${wave.selected_count}`);
          if(!Array.isArray(matrix.include)||matrix.include.length!==wave.wave_batches)throw new Error('recovery assemble matrix cardinality drift');
          const batches=new Set(matrix.include.map(row=>row.batch_sha256));
          if(batches.size!==wave.wave_batches)throw new Error('recovery matrix contains duplicate batches');
          if(!/^[0-9a-f]{40}$/.test(sourceHead))throw new Error('source head invalid');
          fs.writeFileSync(process.env.GITHUB_OUTPUT,`source_run_id=${runId}\nsource_head=${sourceHead}\nmatrix=${JSON.stringify(matrix)}\nwave_sha256=${wave.wave_sha256}\nselected_count=${wave.selected_count}\nwave_batches=${wave.wave_batches}\n`,{flag:'a'});
          NODE
          cp "$RUNNER_TEMP/lessons-validation.json" "$plan/lessons-recovery-validation.json"
          echo "PASS — recovery bound to source run $source_run_id at $source_head"
          echo 'REDISCOVERY — forbidden; immutable result artifacts only'

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-source-v3-wave-recovery-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/source-plan
          if-no-files-found: error
          retention-days: 90

  recover-batches:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-source-v3-wave-recovery-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - name: Download packetized evidence from the failed wave without rediscovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          BATCH_SHA: ${{ matrix.batch_sha256 }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original-$BATCH_SHA"
          mkdir -p "$original"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "card-backfill-source-v3-wave-result-${BATCH_SHA}-${SOURCE_RUN_ID}" \
            --dir "$original"
          test -f "$original/packets/batch-result.json"
          test -d "$original/packets/packets"
          echo 'PASS — retained packetized evidence recovered; source transport calls=0'

      - name: Independently adjudicate the retained packetized batch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model || 'openai/gpt-4.1-mini' }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
          BATCH_SHA: ${{ matrix.batch_sha256 }}
          BATCH_INDEX: ${{ matrix.batch_index }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original-$BATCH_SHA"
          final="$RUNNER_TEMP/recovered-$BATCH_SHA"
          mkdir -p "$final"
          cp -a "$original/packets" "$final/packets"
          node scripts/card-backfill-machine-adjudicate.mjs \
            --candidates "$final/packets" \
            --out "$final/machine-decisions.json" \
            --model "$MODEL" \
            --fallback-model 'openai/gpt-4o-mini' \
            --max-parallel 2 \
            --cycle 1 \
            --artifact-name "card-backfill-source-v3-wave-recovery-${GITHUB_RUN_ID}-${BATCH_SHA}" \
            --head-sha "$SOURCE_HEAD" | tee "$final/machine-adjudicate.log"
          node scripts/card-backfill-cohort-adjudicate.mjs \
            --candidates "$final/packets" \
            --decisions "$final/machine-decisions.json" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$final/adjudicated" \
            --source-run-id "$GITHUB_RUN_ID" | tee "$final/adjudicate.log"
          node --input-type=module - "$final" "$RUNNER_TEMP/planning/wave.json" "$SOURCE_HEAD" "$SOURCE_RUN_ID" "$BATCH_SHA" "$BATCH_INDEX" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const [final,wavePath,sourceHead,sourceRunId,batchSha,batchIndex]=process.argv.slice(2);
          const wave=JSON.parse(fs.readFileSync(wavePath,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(path.join(final,'adjudicated','adjudication-run-receipt.json'),'utf8'));
          if(receipt.batch_sha256!==batchSha)throw new Error('recovered adjudication batch drift');
          const result={
            version:1,
            lane:'card-backfill-source-v3-wave-result',
            source_head:sourceHead,
            source_workflow_run_id:Number(sourceRunId),
            recovery_workflow_run_id:Number(process.env.GITHUB_RUN_ID),
            wave_sha256:wave.wave_sha256,
            batch_sha256:batchSha,
            batch_index:Number(batchIndex),
            source_policy_id:wave.source_policy_id,
            source_policy_version:wave.source_policy_version,
            source_policy_revision:wave.source_policy_revision,
            lessons_contract_sha256:wave.lessons_contract_sha256,
            selected_count:receipt.counts.selected,
            counts:receipt.counts,
            adjudicated_path:'adjudicated',
            machine_decisions_path:'machine-decisions.json',
            artifact_only:true,
            rediscovery:false,
            canonical_mutation:false,
          };
          fs.writeFileSync(path.join(final,'wave-result.json'),JSON.stringify(result,null,2)+'\n');
          NODE
          echo 'PASS — recovered batch adjudicated from retained bytes; rediscovery=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-source-v3-wave-recovered-${{ matrix.batch_sha256 }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovered-${{ matrix.batch_sha256 }}
          if-no-files-found: error
          retention-days: 90

  reduce:
    needs: [plan, recover-batches]
    if: needs.recover-batches.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.mutation_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-source-v3-wave-recovery-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-source-v3-wave-recovered-*-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Permanently teach the reducer and future waves how to recover
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reducer=Path('scripts/card-backfill-wave-reduce.mjs')
          text=reducer.read_text()
          old='''  const sourceHead = option("--source-head");
          const observedHead = option("--observed-head", sourceHead);
          const now = option("--now", new Date().toISOString());
          if (!sourceHead || !/^[0-9a-f]{40}$/i.test(sourceHead)) throw new Error("source_head must be a full commit SHA");
          if (observedHead !== sourceHead) throw new Error(`refusing stale wave reduction: source_head ${sourceHead} differs from observed head ${observedHead}`);'''
          new='''  const sourceHead = option("--source-head");
          const mutationHead = option("--mutation-head", sourceHead);
          const observedHead = option("--observed-head", mutationHead);
          const now = option("--now", new Date().toISOString());
          if (!sourceHead || !/^[0-9a-f]{40}$/i.test(sourceHead)) throw new Error("source_head must be a full commit SHA");
          if (!mutationHead || !/^[0-9a-f]{40}$/i.test(mutationHead)) throw new Error("mutation_head must be a full commit SHA");
          if (observedHead !== mutationHead) throw new Error(`refusing stale wave reduction: mutation_head ${mutationHead} differs from observed head ${observedHead}`);'''
          if old not in text:
              raise SystemExit('wave reducer recovery seam drift')
          text=text.replace(old,new,1)
          text=text.replace('''    source_head: sourceHead,
            wave_sha256: wave.wave_sha256,''','''    source_head: sourceHead,
            mutation_head: mutationHead,
            wave_sha256: wave.wave_sha256,''',1)
          reducer.write_text(text)

          workflow=Path('.github/workflows/card-backfill-source-v2-autonomous.yml')
          text=workflow.read_text()
          old='''      - name: Merge, render, and independently adjudicate one immutable wave batch
                env:
                  MODEL: ${{ inputs.model || 'openai/gpt-4.1-mini' }}'''
          new='''      - name: Merge, render, and independently adjudicate one immutable wave batch
                env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  MODEL: ${{ inputs.model || 'openai/gpt-4.1-mini' }}'''
          if old not in text:
              raise SystemExit('wave model-token seam drift')
          workflow.write_text(text.replace(old,new,1))
          PY
          node --check scripts/card-backfill-wave-reduce.mjs
          grep -q 'GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}' .github/workflows/card-backfill-source-v2-autonomous.yml

      - name: Reduce four recovered immutable batches once
        env:
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
          MUTATION_HEAD: ${{ needs.plan.outputs.mutation_head }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          WAVE_SHA: ${{ needs.plan.outputs.wave_sha256 }}
        run: |
          set -euo pipefail
          observed_head=$(git rev-parse HEAD)
          node scripts/card-backfill-wave-reduce.mjs \
            --wave "$RUNNER_TEMP/planning/wave.json" \
            --results-root "$RUNNER_TEMP/results" \
            --staging-root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --adjudications-root .github/card-backfill/adjudications \
            --wave-receipt-root .github/card-backfill/waves \
            --source-head "$SOURCE_HEAD" \
            --mutation-head "$MUTATION_HEAD" \
            --observed-head "$observed_head" | tee "$RUNNER_TEMP/recovery-reduce.log"
          node scripts/card-backfill-staging.mjs validate \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill
          mkdir -p .github/card-backfill/recoveries
          node --input-type=module - "$RUNNER_TEMP/planning/wave.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const wave=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const receipt={
            version:1,
            lane:'card-backfill-wave-artifact-recovery',
            source_workflow_run_id:Number(process.env.SOURCE_RUN_ID),
            recovery_workflow_run_id:Number(process.env.GITHUB_RUN_ID),
            source_head:process.env.SOURCE_HEAD,
            mutation_head:process.env.MUTATION_HEAD,
            wave_sha256:wave.wave_sha256,
            selected_count:wave.selected_count,
            wave_batches:wave.wave_batches,
            rediscovery:false,
            source_transport_calls:0,
            recovered_from_packetized_artifacts:true,
            canonical_mutation:false,
          };
          receipt.recovery_sha256=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync(path.join('.github/card-backfill/recoveries',`${wave.wave_sha256}.json`),JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Commit one recovered wave transaction and the permanent repair
        env:
          MUTATION_HEAD: ${{ needs.plan.outputs.mutation_head }}
          SELECTED_COUNT: ${{ needs.plan.outputs.selected_count }}
          WAVE_BATCHES: ${{ needs.plan.outputs.wave_batches }}
        run: |
          set -euo pipefail
          git add -A -- \
            .github/workflows/card-backfill-source-v2-autonomous.yml \
            scripts/card-backfill-wave-reduce.mjs \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            .github/card-backfill/recoveries \
            data/review/card-backfill-staging
          git diff --cached --check
          git config user.name 'undercast-card-backfill-wave-recovery'
          git config user.email 'undercast-card-backfill-wave-recovery@users.noreply.github.com'
          git commit -m "Card backfill: recover ${WAVE_BATCHES} immutable batches (${SELECTED_COUNT} obligations)"
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          if [ "$remote_head" != "$MUTATION_HEAD" ]; then
            echo "branch moved from recovery head $MUTATION_HEAD to $remote_head; refusing stale recovery push"
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'PASS — one branch mutation recovered 160 obligations without rediscovery'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-source-v3-wave-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/planning
            ${{ runner.temp }}/recovery-reduce.log
          if-no-files-found: warn
          retention-days: 90
