name: ingest-leads

# KEYLESS. Harvests candidate performers from curated wiki categories into
# data/CANDIDATES.json — the triage worklist. Never touches the wall; nothing
# here is published as a card. grow.mjs (or a human) turns leads into specimens.

on:
  # Paused 2026-10-22: collection work requires a named driver and bounded review.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Harvest leads
        env:
          INGEST_MAX: "300"           # new leads per night
          CRAWL_DELAY_MS: "1200"      # be gentle with the wikis
          CONTACT: "bigbirdreturns@proton.me"  # goes in the crawler's User-Agent
        run: node scripts/ingest.mjs

      - name: Rebuild the disposable projections that record the lead count
        # scripts/shard.mjs writes candidate_count into data/shard-manifest.json and
        # data/archive.json embeds that manifest's sha256. Committing CANDIDATES.json
        # alone leaves a two-line projection drift that the Pages gate refuses, which
        # blocked every deploy from 2026-10-05 to 2026-10-22. Rebuild in the same commit.
        run: node scripts/shard.mjs

      - name: Commit
        run: |
          git config user.name  "undercast-bot"
          git config user.email "undercast-bot@users.noreply.github.com"
          git add data/CANDIDATES.json data/shard-manifest.json data/archive.json
          git diff --cached --quiet || git commit -m "ingest: harvest candidate leads ($(date -u +%F))"
          git push
