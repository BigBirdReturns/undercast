name: estate-adopt-batched-portraits-011

# Sole COLLECT-011 canonical-mutation authority. The duplicate evidence-only
# reconciliation workflow and classifier were retired before this launch.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-batched-portraits-011.yml
      - scripts/estate-adopt-batched-portraits-011.mjs
      - scripts/estate-run-collect011.sh
      - data/review/estate-debt/COLLECT-011-BATCHED-PORTRAIT-SECOND-DESK-RULING.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-batched-portraits-011
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect011.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Execute complete batched portrait payment
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-011-batched-portraits-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-011-preflight.json
            /tmp/COLLECT-011-quality-before.json
            /tmp/COLLECT-011-apply.json
            /tmp/COLLECT-011-validation.json
            /tmp/COLLECT-011-expected-images.txt
            /tmp/COLLECT-011-tracked-paths.zlist
            /tmp/COLLECT-011-untracked-paths.zlist
            /tmp/COLLECT-011-candidate.patch
            /tmp/COLLECT-011-candidate.tree
            /tmp/COLLECT-011-promotion.json
            /tmp/COLLECT-011-ledger-validation.json
            /tmp/COLLECT-011-adoption.patch
            /tmp/COLLECT-011-adoption.tree
            /tmp/COLLECT-011-reconciliation.json
            /tmp/COLLECT-011-final-ledger-validation.json
            /tmp/COLLECT-011-publication.patch
            /tmp/COLLECT-011-publication.tree
            data/review/estate-debt/COLLECT-011-BATCHED-PORTRAIT-SECOND-DESK-RULING.json
            data/review/estate-debt/COLLECT-011-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-011-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
