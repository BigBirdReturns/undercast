name: star-trek-morgo-independent-product-review-v2

on:
  push:
    branches:
      - agent/star-trek-morgo-independent-review-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-morgo-independent-product-review-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 5afac948405d67c94090f2da55a510689e5eb583
  EXPECTED_TREE: 639b57c87ca23e895ec730099c0ce937eb1b88da
  LIVE_MAIN: 5e89a0ba59f36feae7986a9260b8fa17a824a8b7
  LIVE_TREE: 0819bd9ace59e2d8cf8721a5acd1f5de5498cd87
  CLAIM_BRANCH: agent/star-trek-morgo-claim-result-v1
  CLAIM_COMMIT: 645b066b25309e1e8bdc2f13f64b8a04f95bfa96
  CLAIM_TREE: 408a69a0af29dea5052db22b564f63939c43f7a8
  SOURCE_REVIEW_BRANCH: agent/star-trek-morgo-source-review-result-v1
  SOURCE_REVIEW_COMMIT: 7198f9c272dbb1806fb6d2b6b09e889d4e57e7b0
  SOURCE_REVIEW_SHA: 603a4bdab4b58086d94c1d99751a749802d054659f1c16d04b15c7b111a83c5d
  MEDIA_BRANCH: agent/star-trek-morgo-media-result-v4
  MEDIA_COMMIT: 650234b00447c84eb86d36dfbb52f533c0a63202
  MEDIA_TREE: 6003094d90feaf8aafe414362100c10555eecc45
  MEDIA_RECEIPT_SHA: fb9b1fc40b507a133483ec220627de1595ee97c33483bf437d641355773eec15
  MEDIA_REVIEW_BRANCH: agent/star-trek-morgo-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 605d2cb6a6f459d1bb994d004bbec20cb78ebde7
  MEDIA_REVIEW_TREE: ce7a3872fb83082cc2f6c2de7e1db31de9b726a6
  MEDIA_REVIEW_SHA: f6f4ef76e5fa82554109621910242bb630e7aa18aee6321cca53552782113ecb
  CANDIDATE_BRANCH: agent/star-trek-morgo-candidate-v1
  CANDIDATE_COMMIT: 55e96dffe77c9562fa0b63c12cc58016db63754b
  CANDIDATE_TREE: e225af43510b2ee5ede543fce5e8c0a263434be9
  CANDIDATE_RECEIPT_SHA: 3c5de16f13d0c758a1577e64b98007dc7c4968077fa45d66e8cea4d06eeb5295
  CANDIDATE_MESSAGE: "Star Trek: stage reviewed Morgo candidate v1"
  STAGE_RESULT_BRANCH: agent/star-trek-morgo-stage-result-v3
  STAGE_RESULT_COMMIT: fe7ad44f88810c38a6053a4daac17927e6c971da
  STAGE_RESULT_TREE: 9a5598cc294956dc89afb317afd4ea932f1ef2af
  STAGE_PREFIX: transport/star-trek-morgo-stage-recovery-v3
  STAGE_ARTIFACT_ID: 9617042352
  STAGE_ARTIFACT_DIGEST: 08fce045087aa8a0e797d3a1f41dc4617620f9e9fed5ca6acf0d814fc200efef
  RESULT_BRANCH: agent/star-trek-morgo-independent-review-result-v2
  TASK_ID: ap_a7fb29c5cce85c86708ea0e6
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Morgo
  EXPECTED_FINGERPRINT: 279c816ebd1b83899f5b257f7880df5734bb855f4206c2fc92c5278c9370ff46
  EXPECTED_LEASE: lease_578930730585295673ca706d
  WALL_ID: UC-1398
  EXPECTED_STILL_SHA: d9e6600f5b4c56540329bddd824b6d8392193f9c19cafebb6187d2872c21f548
  EXPECTED_PORTRAIT_SHA: ae19bcd09869d848fd74202fcc3c59ac41dbef153f7a33844c278b91b8d4ea5f
  STILL_ITEM_ID: ma_4cf320b41ba67ad4dbe2f5dd
  PORTRAIT_ITEM_ID: ma_8254f59b1cc6004f0fa5f1a2
  EXPECTED_BATCH_SHA: fc73ab0fc7226d123a718b7970c7213ad6dee8c4bc0e6fbcc8d9d34c8a950111
  TRACKED_ROOT: .github/recovery/star-trek-morgo-independent-review-v2
  PAYLOAD_PATH: .github/recovery/star-trek-morgo-independent-review-v2/payload.base64
  PAYLOAD_SHA256: 770e131bf4b201f929ba8643f1f981bd966084b16813b8ba924c8a7fd0723869
  PAYLOAD_ROOT: /tmp/star-trek-morgo-independent-product-review-v2-runtime
  REVIEWER: /tmp/star-trek-morgo-independent-product-review-v2-runtime/reviewer.py
  OUT: /tmp/star-trek-morgo-independent-product-review-v2

jobs:
  review:
    name: independently-review-exact-morgo-candidate-v2
    if: ${{ github.event.head_commit.message == 'Review exact staged Star Trek Morgo candidate v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify and externalize the sealed reviewer
        shell: bash
        run: |
          set -Eeuo pipefail
          while read -r digest relative; do
            test -f "$relative"
            test "$(sha256sum "$relative" | awk '{print $1}')" = "$digest"
          done < "$TRACKED_ROOT/sealed-manifest.sha256"

          rm -rf "$PAYLOAD_ROOT"
          mkdir -p "$PAYLOAD_ROOT"
          tr -d '\n' < "$PAYLOAD_PATH" | base64 -d > /tmp/star-trek-morgo-independent-product-review-v2-runtime.tar.gz
          test "$(sha256sum /tmp/star-trek-morgo-independent-product-review-v2-runtime.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/star-trek-morgo-independent-product-review-v2-runtime.tar.gz -C "$PAYLOAD_ROOT"
          (cd "$PAYLOAD_ROOT" && sha256sum -c manifest.sha256)
          chmod +x "$REVIEWER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["REVIEWER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

      - name: Freeze exact candidate and evidence lineages
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags origin             main             "$CLAIM_BRANCH"             "$SOURCE_REVIEW_BRANCH"             "$MEDIA_BRANCH"             "$MEDIA_REVIEW_BRANCH"             "$CANDIDATE_BRANCH"             "$STAGE_RESULT_BRANCH"

          main_ref="refs/remotes/origin/main"
          claim_ref="refs/remotes/origin/${CLAIM_BRANCH}"
          source_ref="refs/remotes/origin/${SOURCE_REVIEW_BRANCH}"
          media_ref="refs/remotes/origin/${MEDIA_BRANCH}"
          media_review_ref="refs/remotes/origin/${MEDIA_REVIEW_BRANCH}"
          candidate_ref="refs/remotes/origin/${CANDIDATE_BRANCH}"
          stage_ref="refs/remotes/origin/${STAGE_RESULT_BRANCH}"

          test "$(git rev-parse "$main_ref")" = "$LIVE_MAIN"
          test "$(git show -s --format=%T "$main_ref")" = "$LIVE_TREE"
          test "$(git rev-parse "$claim_ref")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%T "$claim_ref")" = "$CLAIM_TREE"
          test "$(git rev-parse "$source_ref")" = "$SOURCE_REVIEW_COMMIT"
          test "$(git rev-parse "$media_ref")" = "$MEDIA_COMMIT"
          test "$(git show -s --format=%T "$media_ref")" = "$MEDIA_TREE"
          test "$(git rev-parse "$media_review_ref")" = "$MEDIA_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$media_review_ref")" = "$MEDIA_REVIEW_TREE"

          test "$(git rev-parse "$candidate_ref")" = "$CANDIDATE_COMMIT"
          test "$(git show -s --format=%T "$candidate_ref")" = "$CANDIDATE_TREE"
          test "$(git show -s --format=%P "$candidate_ref")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%s "$candidate_ref")" = "$CANDIDATE_MESSAGE"
          test "$(git rev-list --count "$claim_ref..$candidate_ref")" = "1"

          test "$(git rev-parse "$stage_ref")" = "$STAGE_RESULT_COMMIT"
          test "$(git show -s --format=%T "$stage_ref")" = "$STAGE_RESULT_TREE"
          test -z "$(git show -s --format=%P "$stage_ref")"

          git show "${candidate_ref}:data/review/adapter-sdk/star-trek-morgo-candidate.json" > "$OUT/candidate-receipt.json"
          git show "${source_ref}:transport/star-trek-morgo-source-review-v1/source-review.json" > "$OUT/source-review.json"
          git show "${media_ref}:transport/star-trek-morgo-media-v4/media-receipt.json" > "$OUT/media-receipt.json"
          git show "${media_review_ref}:transport/star-trek-morgo-media-review-v1/media-review.json" > "$OUT/media-review.json"
          git show "${stage_ref}:${STAGE_PREFIX}/candidate-commit.json" > "$OUT/candidate-commit.json"
          git show "${stage_ref}:${STAGE_PREFIX}/candidate-receipt.json" > "$OUT/stage-candidate-receipt.json"
          git show "${stage_ref}:${STAGE_PREFIX}/candidate-paths.txt" > "$OUT/stage-candidate-paths.txt"
          git show "${stage_ref}:${STAGE_PREFIX}/manifest.sha256" > "$OUT/stage-manifest.sha256"

          git diff-tree --no-commit-id --name-only -r "$candidate_ref" | LC_ALL=C sort > "$OUT/candidate-paths.txt"

          git checkout --detach "$candidate_ref"
          git clean -fdx
          npm ci --ignore-scripts
          python3 "$REVIEWER" inspect

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-before.json"
          test "$(jq -r .commit.sha "$OUT/main-before.json")" = "$LIVE_MAIN"

      - name: Run independent repository gates
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/validate.mjs | tee "$OUT/repository-validate.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$LIVE_MAIN"

      - name: Write independent product review receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$REVIEWER" receipt

          jq -e             --arg task "$TASK_ID"             --arg lease "$EXPECTED_LEASE"             --arg wall "$WALL_ID"             '.transaction == "STAR-TREK-MORGO-INDEPENDENT-PRODUCT-REVIEW-V2"
             and .verdict == "pass"
             and .candidate.commit == env.CANDIDATE_COMMIT
             and .candidate.tree == env.CANDIDATE_TREE
             and .candidate.receipt_sha256 == env.CANDIDATE_RECEIPT_SHA
             and .stage_result.commit == env.STAGE_RESULT_COMMIT
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.status == "resolved"
             and .task.wall_id == $wall
             and .queue == {total:2228,queued:1796,resolved:430,blocked:0,rejected:2,in_flight:0}
             and .media.still_sha256 == env.EXPECTED_STILL_SHA
             and .media.portrait_sha256 == env.EXPECTED_PORTRAIT_SHA
             and .boundary.performance_mode == "voice-animation"
             and .boundary.all_four_media_claims_enforced == true
             and .boundary.frozen_census_fallback_reviewed == true
             and .boundary.originating_lease_verified_in == "task.outcome.media_review.lease_id"
             and .boundary.waterline_cycle_recorded == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false'             "$OUT/independent-review.json" >/dev/null

          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload independent product review evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-morgo-independent-product-review-v2
          path: /tmp/star-trek-morgo-independent-product-review-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable independent product review
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq             --argjson id "$ARTIFACT_ID"             --arg digest "$ARTIFACT_DIGEST"             '.artifact={id:$id,digest:$digest}'             "$OUT/independent-review.json" > "$OUT/review.tmp"
          mv "$OUT/review.tmp" "$OUT/independent-review.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-morgo-independent-product-review-v2
          git config user.email undercast-morgo-independent-product-review-v2@users.noreply.github.com
          git checkout --orphan morgo-independent-product-review-result-v2
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-morgo-independent-product-review-v2
          cp -a "$OUT"/. transport/star-trek-morgo-independent-product-review-v2/
          git add transport/star-trek-morgo-independent-product-review-v2
          git commit -m "Record Star Trek Morgo independent product review v2"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
