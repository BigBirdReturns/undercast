name: estate-adopt-current-null-lane-008-v3

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-current-null-lane-008-v3.yml
      - scripts/estate-run-collect008-v3.sh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-current-null-lane-008-v3
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect008-v3.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Execute corrected smoke-first transaction
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-008-v3-corrected-lane-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-008-v3-preflight.json
            /tmp/COLLECT-008-v3-quality-before.json
            /tmp/COLLECT-008-v3-apply.json
            /tmp/COLLECT-008-v3-validation.json
            /tmp/COLLECT-008-v3-expected-images.txt
            /tmp/COLLECT-008-v3-tracked-paths.zlist
            /tmp/COLLECT-008-v3-untracked-paths.zlist
            /tmp/COLLECT-008-v3-candidate.patch
            /tmp/COLLECT-008-v3-candidate.tree
            /tmp/COLLECT-008-v3-promotion.json
            /tmp/COLLECT-008-v3-ledger-validation.json
            /tmp/COLLECT-008-v3-adoption.patch
            /tmp/COLLECT-008-v3-adoption.tree
            /tmp/COLLECT-008-v3-reconciliation.json
            /tmp/COLLECT-008-v3-final-ledger-validation.json
            /tmp/COLLECT-008-v3-publication.patch
            /tmp/COLLECT-008-v3-publication.tree
            data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
            data/review/estate-debt/COLLECT-008-K9-CROSS-CARD-DUPLICATE-RULING.json
            data/review/estate-debt/COLLECT-008-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-008-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
