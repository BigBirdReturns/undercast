name: card-backfill-uc-113-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-113-DISCOVER.json"
      - "scripts/card-backfill-uc-113-discover.mjs"
      - ".github/workflows/card-backfill-uc-113-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-113-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-025'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-025
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-113 official Marvel discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-113-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-113');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-113');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1d34489d543c01ca6616d57a');
          if(row.version!==1||row.record_id!=='UC-113'||row.actor!=='Taika Waititi'||row.character!=='Korg'||row.production!=='Thor: Ragnarok'||row.year!==2017||row.side!=='still')throw new Error('UC-113 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8676461183||row.scope_artifact?.artifact_id!==8676501540||row.scope_artifact?.scope_sha256!=='dcb1e53237893a870a87163d91f62be5f88b27783275ee44f336d6954607ef15')throw new Error('UC-113 discovery custody drift');
          if(row.pages?.length!==4||row.pages.filter(page=>page.strict).length!==4||row.pages.filter(page=>page.admission_lane==='final-character-frame').length!==1||row.minimum_final_candidates!==1)throw new Error('UC-113 discovery denominator drift');
          if(row.selection_contract?.official_marvel_final_frame_required!==true||row.selection_contract?.exact_2017_thor_ragnarok_korg_required!==true||row.selection_contract?.taika_waititi_actor_role_binding_required!==true||row.selection_contract?.character_frame_and_actor_role_custody_separate!==true||row.selection_contract?.final_character_image_not_performance_capture_image!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-113 selection contract drift');
          if(!specimen||specimen.actor!=='Taika Waititi'||specimen.character!=='Korg'||specimen.production!=='Thor: Ragnarok'||specimen.years!=='2017'||specimen.still)throw new Error('UC-113 specimen boundary drift');
          if(source?.still)throw new Error('UC-113 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-113'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-113 audit boundary drift');
          console.log('PASS — exact UC-113 official Marvel Korg discovery authorized');
          NODE
      - name: Gather official Marvel Korg candidates and custody receipts
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-113-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-113-discover.mjs
          node scripts/card-backfill-uc-113-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-113-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, final candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-113-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-113-discover
            ${{ runner.temp }}/card-backfill-uc-113-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
