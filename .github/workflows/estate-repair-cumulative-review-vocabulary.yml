name: estate-repair-cumulative-review-vocabulary

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-cumulative-review-vocabulary.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-cumulative-review-vocabulary
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Replace grammar gate with exact reviewed vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-cumulative-packet-batch.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''function acceptedIdentity(value) { return /^expected-subject(?:$|-)/.test(String(value || "")); }
          function acceptedPresentation(value) { return /(?:^|-)character-depiction$/.test(String(value || "")); }'''
          new = '''function acceptedIdentity(value) {
            return new Set(["expected-subject", "expected-subjects", "expected-subject-set"]).has(String(value || ""));
          }
          function acceptedPresentation(value) {
            return /^(?:(?:two|three|four|seven)-role-)?character-(?:depiction|composite)$/.test(String(value || ""));
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one review-vocabulary predicate pair, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Expand fixtures across retained typed variants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-cumulative-packet-batch.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''  assert(acceptedIdentity("expected-subject"), "expected-subject must pass");
            assert(acceptedIdentity("expected-subject-set"), "expected-subject-set must pass");
            assert(!acceptedIdentity("probable-subject"), "probable-subject must fail");
            assert(acceptedPresentation("character-depiction"), "character-depiction must pass");
            assert(acceptedPresentation("two-role-character-depiction"), "two-role character depiction must pass");
            assert(acceptedPresentation("three-role-character-depiction"), "three-role character depiction must pass");
            assert(!acceptedPresentation("performer-portrait"), "performer portrait must fail the still lane");'''
          new = '''  assert(acceptedIdentity("expected-subject"), "expected-subject must pass");
            assert(acceptedIdentity("expected-subjects"), "expected-subjects must pass");
            assert(acceptedIdentity("expected-subject-set"), "expected-subject-set must pass");
            assert(!acceptedIdentity("probable-subject"), "probable-subject must fail");
            assert(!acceptedIdentity("ambiguous-subjects"), "ambiguous-subjects must fail");
            assert(acceptedPresentation("character-depiction"), "character-depiction must pass");
            assert(acceptedPresentation("two-role-character-depiction"), "two-role character depiction must pass");
            assert(acceptedPresentation("three-role-character-depiction"), "three-role character depiction must pass");
            assert(acceptedPresentation("two-role-character-composite"), "two-role character composite must pass");
            assert(acceptedPresentation("three-role-character-composite"), "three-role character composite must pass");
            assert(!acceptedPresentation("performer-portrait"), "performer portrait must fail the still lane");'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prove semantic fixtures and live five-packet denominator
        run: |
          set -euo pipefail
          node scripts/estate-adopt-cumulative-packet-batch.mjs --fixtures
          node scripts/estate-canonical-adoption-ledger.mjs
          node scripts/estate-adopt-cumulative-packet-batch.mjs \
            --plan data/review/estate-debt/COLLECT-004-CANONICAL-ADOPTION-PLAN.json \
            | tee /tmp/COLLECT-004-vocabulary-repair-preflight.json

      - name: Retire the one-use repair workflow
        run: git rm .github/workflows/estate-repair-cumulative-review-vocabulary.yml

      - name: Publish exact repair under lease
        run: |
          set -euo pipefail
          git add scripts/estate-adopt-cumulative-packet-batch.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s\n' '.github/workflows/estate-repair-cumulative-review-vocabulary.yml' 'scripts/estate-adopt-cumulative-packet-batch.mjs' | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Estate collection: admit exact multi-role review vocabulary" \
            -m "evidence_standard=unchanged" \
            -m "accepted_identity=expected-subject,expected-subjects,expected-subject-set" \
            -m "accepted_presentation=typed-character-depiction-or-composite" \
            -m "probable_and_ambiguous=refused" \
            -m "one_use_repair_workflow=retired" \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report repair
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-004 review-vocabulary repair passed and self-retired on workflow run $GITHUB_RUN_ID.

          The reducer now admits the exact retained labels `expected-subject`, `expected-subjects`, and `expected-subject-set`, plus typed character depictions and composites. Probable or ambiguous identity and performer-portrait substitution remain rejected. The live five-packet preflight passed before publication of the repair. No canonical media was mutated by this workflow.
          EOF_COMMENT

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-004 review-vocabulary repair failed on workflow run $GITHUB_RUN_ID. No canonical media mutation or batch-002 payment claim is authorized. The cumulative ledger remains 5 adopted and 50 awaiting review.
          EOF_COMMENT
