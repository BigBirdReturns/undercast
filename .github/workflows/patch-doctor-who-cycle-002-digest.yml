name: patch-doctor-who-cycle-002-semantic-job-custody

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-doctor-who-cycle-002-digest.yml"

permissions:
  contents: write

concurrency:
  group: patch-doctor-who-cycle-002-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32

      - name: Patch only the global observation hash out of semantic job custody
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: .github/workflows/patch-doctor-who-cycle-002-digest.yml
          WRITER: .github/workflows/complete-doctor-who-cycle-002-v2.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=32 origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.env.WRITER;
          let text = await readFile(path, 'utf8');
          const anchor = `          await writeFile(path, text);\n          console.log('patched date-only source custody and deferred only the premature media gate');`;
          const count = text.split(anchor).length - 1;
          if (count !== 1) throw new Error(`expected one Gredd runtime-patch anchor, found ${count}`);
          const replacement = `          const digestBefore = 'const digestJobs = (jobs) => sha256(Buffer.from(JSON.stringify([...jobs].sort((a, b) => a.id.localeCompare(b.id)))));';\n          const digestAfter = 'const digestJobs = (jobs) => sha256(Buffer.from(JSON.stringify([...jobs].map(({ last_seen_coverage_sha256, ...row }) => row).sort((a, b) => a.id.localeCompare(b.id)))));';\n          const digestCount = text.split(digestBefore).length - 1;\n          if (digestCount !== 1) throw new Error(\`expected one broad job digest, found \${digestCount}\`);\n          text = text.replace(digestBefore, digestAfter);\n\n          await writeFile(path, text);\n          console.log('patched date-only source custody, deferred only the premature media gate, and excluded only the shared coverage observation hash from cross-scope semantic custody');`;
          await writeFile(path, text.replace(anchor, replacement));
          NODE

          grep -Fq 'last_seen_coverage_sha256, ...row' "$WRITER"
          grep -Fq 'excluded only the shared coverage observation hash' "$WRITER"
          git rm "$SELF"
          git add "$WRITER"
          git diff --cached --check
          git commit -m 'Doctor Who: scope-bind Gredd cross-estate Autopilot custody' \
            -m 'exclude only the shared last-seen coverage observation hash while preserving every semantic task field'
          patched_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "patched_head=$patched_head" >> "$GITHUB_STEP_SUMMARY"
