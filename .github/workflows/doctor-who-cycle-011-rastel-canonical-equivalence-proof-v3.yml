name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      INSTALL_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      NEWLINE_SIBLING: 1c92734e501ed4667ac86c4203a6dbac282392ee
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3
      SELF: .github/workflows/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3
      PUBLISHER_RUN: "31351009242"
      VERIFY_JOB: "93341697741"
      WRITE_JOB: "93342073975"
      HANDOFF_ARTIFACT: "9048990139"
      HANDOFF_NAME: doctor-who-cycle-011-rastel-trusted-publisher-v2-handoff-31351009242-attempt-1
      HANDOFF_DIGEST: "sha256:34a27c1823dbcea8745115ed7d873f9b1bafec99c7dc74247204020468c68c9d"
      PUBLICATION_IDENTITY: fb292e861040e665d778434c27b657c65e80c7b31d886d48f4b7ce26b9ee4a10
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      PUBLICATION_HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE_ISO: 2026-08-10T01:10:00+00:00
      SOURCE_COMMIT: b96ddfe68d33a6b7a335aab14b87484f598a5694
      SOURCE_BLOB: 459858193f5c80885389e1a4cbe26b6ea7f9ab13
      SOURCE_STEM: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v2
      TARGET_STEM: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3-bootstrap

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V2 proof and repair only executable AWK representations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,jobs}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path(os.environ['BOOTSTRAP'])
          source = json.loads((root / 'api/source-blob.json').read_text())
          raw = base64.b64decode(source['content'])
          git_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert source['sha'] == os.environ['SOURCE_BLOB'] == git_blob
          text = raw.decode('utf-8')
          source_stem = os.environ['SOURCE_STEM']
          target_stem = os.environ['TARGET_STEM']
          source_count = text.count(source_stem)
          assert source_count >= 8
          assert text.startswith(f'name: {source_stem}\n')
          text = text.replace(source_stem, target_stem)
          lines = text.splitlines(keepends=True)
          repairs = {
              'original-deletion-refusal': 0,
              'original-workflow-refusal': 0,
              'v1-deletion-count': 0,
              'v2-deletion-count': 0,
              'total-deletion-count': 0,
          }
          for index, line in enumerate(lines):
              if 'original-to-canonical.tsv' in line and "awk '$1" in line:
                  lines[index] = '''          test -z "$(awk '$1=="D" {print}' "$OUT/api/original-to-canonical.tsv")"\n'''
                  repairs['original-deletion-refusal'] += 1
              elif 'original-to-canonical.tsv' in line and "awk '$2" in line:
                  lines[index] = r'''          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/api/original-to-canonical.tsv")"''' + '\n'
                  repairs['original-workflow-refusal'] += 1
              elif 'install-to-canonical.tsv' in line and 'awk -v p="$V1_PATH"' in line:
                  lines[index] = '''          test "$(awk -v p="$V1_PATH" '$1=="D" && $2==p {n++} END {print n+0}' "$OUT/api/install-to-canonical.tsv")" = 1\n'''
                  repairs['v1-deletion-count'] += 1
              elif 'install-to-canonical.tsv' in line and 'awk -v p="$V2_PATH"' in line:
                  lines[index] = '''          test "$(awk -v p="$V2_PATH" '$1=="D" && $2==p {n++} END {print n+0}' "$OUT/api/install-to-canonical.tsv")" = 1\n'''
                  repairs['v2-deletion-count'] += 1
              elif 'install-to-canonical.tsv' in line and "awk '$1" in line:
                  lines[index] = '''          test "$(awk '$1=="D" {n++} END {print n+0}' "$OUT/api/install-to-canonical.tsv")" = 2\n'''
                  repairs['total-deletion-count'] += 1
          assert all(value == 1 for value in repairs.values()), repairs
          patched = ''.join(lines)
          assert source_stem not in patched
          assert patched.count(target_stem) == source_count
          assert '\\\"D\\\"' not in patched
          assert """awk '$1=="D" {print}'""" in patched
          assert r"""awk '$2 ~ /^\.github\/workflows\// {print}'""" in patched
          (root / 'source-v2.yml').write_bytes(raw)
          (root / 'proof-v3.yml').write_text(patched)
          workflow_lines = patched.splitlines(keepends=True)
          start = next(i for i, row in enumerate(workflow_lines) if row == '  prove:\n')
          block = workflow_lines[start:]
          scripts = []
          i = 0
          while i < len(block):
              if block[i] == '        run: |\n':
                  i += 1
                  body = []
                  while i < len(block):
                      row = block[i]
                      if row.strip() and len(row) - len(row.lstrip(' ')) < 10:
                          break
                      if row.startswith('          '):
                          body.append(row[10:])
                      elif not row.strip():
                          body.append('\n')
                      else:
                          break
                      i += 1
                  scripts.append(''.join(body))
                  continue
              i += 1
          assert len(scripts) == 4
          script_rows = []
          python_blocks = 0
          for number, script in enumerate(scripts, 1):
              path = root / 'jobs' / f'{number:02d}.sh'
              path.write_text(script)
              subprocess.run(['bash', '-n', str(path)], check=True)
              blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", script, re.S)
              for offset, program in enumerate(blocks, 1):
                  compile(program, f'<equivalence-v3-{number}-{offset}>', 'exec')
              python_blocks += len(blocks)
              script_rows.append({'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          assert python_blocks == 3
          receipt = {
              'status': 'cycle-011-rastel-canonical-equivalence-proof-v3-recovered',
              'version': 3,
              'source': {'commit': os.environ['SOURCE_COMMIT'], 'git_blob': git_blob, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()},
              'repair': {'source_stem_occurrences': source_count, 'target_stem_occurrences': patched.count(target_stem), 'awk_lines': repairs, 'other_source_bytes_changed': False},
              'programs': script_rows,
              'embedded_python_programs': python_blocks,
              'boundary': {'repository_write': False, 'canonical_mutation': False, 'cycle_012_authorized': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'recovery.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          printf 'D\tx\nM\t.github/workflows/y.yml\n' | awk '$1=="D" {print}' > "$BOOTSTRAP/awk-delete.out"
          test "$(cat "$BOOTSTRAP/awk-delete.out")" = $'D\tx'
          printf 'M\t.github/workflows/y.yml\n' | awk '$2 ~ /^\.github\/workflows\// {print}' > "$BOOTSTRAP/awk-workflow.out"
          test "$(cat "$BOOTSTRAP/awk-workflow.out")" = $'M\t.github/workflows/y.yml'

      - name: Execute recovered canonical-equivalence proof
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in
                *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;;
                *=*) export "$row" ;;
              esac
            done < "$GITHUB_ENV"
          }
          for script in "$BOOTSTRAP"/jobs/01.sh "$BOOTSTRAP"/jobs/02.sh "$BOOTSTRAP"/jobs/03.sh; do
            bash "$script"
            apply_github_env
          done
          cp "$BOOTSTRAP/recovery.json" "$OUT/receipt/v3-recovery.json"
          bash "$BOOTSTRAP/jobs/04.sh"
          apply_github_env

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/api
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/handoff
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/logs
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/api
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/handoff
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/logs
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3/receipt
            /tmp/doctor-who-cycle-011-rastel-canonical-equivalence-proof-v3-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0