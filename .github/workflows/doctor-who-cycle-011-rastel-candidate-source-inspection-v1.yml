name: doctor-who-cycle-011-rastel-candidate-source-inspection-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-source-inspection-v1
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v1
      MERX_TASK: ap_cab2d7f95d930401627c1b30
      RASTEL_TASK: ap_25277c8fbe9e5369ed2e3d81
      MEDIA_PR: "747"
      MEDIA_BRANCH: agent/doctor-who-cycle-011-rastel-media-review-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact inspection carrier and current main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,candidates,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$MEDIA_PR" > "$OUT/api/media-pr.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])/'api'
          own=json.loads((root/'carrier.json').read_text())
          media=json.loads((root/'media-pr.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert media['number']==int(os.environ['MEDIA_PR']) and media['draft'] is True and media['merged'] is False
          assert media['base']['sha']==os.environ['MAIN'] and media['head']['ref']==os.environ['MEDIA_BRANCH']
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Discover exact successful Merx candidate source
        shell: bash
        run: |
          set -euo pipefail
          for number in $(seq 720 733); do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number.json"
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" > "$OUT/api/files-$number.json"
          done
          ROOT="$OUT" python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT']); api=root/'api'; candidates=root/'candidates'
          rows=[]
          for number in range(720,734):
              pr=json.loads((api/f'pr-{number}.json').read_text())
              files=json.loads((api/f'files-{number}.json').read_text())
              for row in files:
                  path=row['filename']
                  if not path.endswith(('.yml','.yaml')): continue
                  raw=subprocess.run(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}?ref={pr['head']['sha']}"],check=True,capture_output=True,text=True)
                  payload=json.loads(raw.stdout)
                  data=base64.b64decode(payload['content'])
                  text=data.decode('utf-8','replace')
                  score=0
                  weights=[(os.environ['MERX_TASK'],10),('lease.claimed',5),('draft.accept',5),('task.merged',5),('media-verified',4),('candidate',2),('materialize',2),('record-cycle',-3),('product.bundle',-2)]
                  for needle,weight in weights: score+=text.count(needle)*weight
                  name=f"pr-{number}-{Path(path).name}"
                  (candidates/name).write_bytes(data)
                  rows.append({'pr':number,'title':pr['title'],'state':pr['state'],'head':pr['head']['sha'],'branch':pr['head']['ref'],'path':path,'git_blob':payload['sha'],'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'score':score,'markers':{needle:text.count(needle) for needle,_ in weights},'artifact':f'candidates/{name}'})
          eligible=[row for row in rows if row['markers'][os.environ['MERX_TASK']]>0 and row['markers']['lease.claimed']>0 and row['markers']['draft.accept']>0 and row['markers']['task.merged']>0]
          assert eligible, 'no exact Merx candidate workflow found'
          maximum=max(row['score'] for row in eligible)
          selected=[row for row in eligible if row['score']==maximum]
          assert len(selected)==1, selected
          selected=selected[0]
          source=root/selected['artifact']
          (root/'source/workflow.yml').write_bytes(source.read_bytes())
          selected['source_artifact']='source/workflow.yml'
          (root/'source/selection.json').write_text(json.dumps(selected,indent=2,sort_keys=True)+'\n')
          (root/'source/census.json').write_text(json.dumps(sorted(rows,key=lambda r:(-r['score'],r['pr'],r['path'])),indent=2,sort_keys=True)+'\n')
          PY

      - name: Extract source environment and executable blocks without execution
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['ROOT']); source=root/'source/workflow.yml'
          text=source.read_text()
          lines=text.splitlines()
          env={}
          in_env=False
          env_indent=None
          for line in lines:
              stripped=line.lstrip(); indent=len(line)-len(stripped)
              if stripped=='env:':
                  if not in_env:
                      in_env=True; env_indent=indent
                  continue
              if in_env:
                  if stripped and indent<=env_indent: break
                  if ':' in stripped:
                      key,value=stripped.split(':',1)
                      if key and key.replace('_','').isalnum(): env[key.strip()]=value.strip()
          blocks=[]
          for match in re.finditer(r'(?m)^(\s*)run:\s*\|\s*\n',text):
              indent=len(match.group(1)); pos=match.end(); collected=[]
              while pos<len(text):
                  end=text.find('\n',pos)
                  if end<0: end=len(text)
                  line=text[pos:end]; stripped=line.lstrip(); current=len(line)-len(stripped)
                  if stripped and current<=indent: break
                  collected.append(line[indent+2:] if len(line)>=indent+2 else '')
                  pos=end+1
              body='\n'.join(collected).rstrip()+'\n'
              blocks.append({'index':len(blocks),'bytes':len(body.encode()),'sha256':hashlib.sha256(body.encode()).hexdigest(),'bash_syntax':'not_executed'})
              (root/f'source/run-{len(blocks)-1:02d}.sh').write_text(body)
          assert blocks
          report={'status':'cycle-011-rastel-candidate-source-inspected-v1','version':1,'inspection_run':int(os.environ['GITHUB_RUN_ID']),'inspection_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'canonical_main':os.environ['MAIN'],'selected_source':json.loads((root/'source/selection.json').read_text()),'environment':env,'run_blocks':blocks,'merx_task_occurrences':text.count(os.environ['MERX_TASK']),'rastel_task_occurrences':text.count(os.environ['RASTEL_TASK']),'executed':False,'repository_write':False,'lease_issued':False,'queue_mutated':False,'cycle_011_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          report['identity']=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/inspection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          for script in "$OUT"/source/run-*.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          report=json.loads((root/'receipt/inspection.json').read_text())
          for row in report['run_blocks']: row['bash_syntax']='pass'
          report.pop('identity',None)
          report['identity']=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/inspection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
