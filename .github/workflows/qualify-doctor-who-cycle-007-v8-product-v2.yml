name: qualify-doctor-who-cycle-007-v8-product-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qualify-doctor-who-cycle-007-v8-product-v2.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: qualify-doctor-who-cycle-007-v8-product-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  QUALIFIER_BRANCH: agent/doctor-who-cycle-007-v8-product-qualifier-v2
  FINALIZER_BRANCH: agent/doctor-who-cycle-007-v8-finalizer-v2
  FINALIZER_WORKFLOW_NAME: finalize-doctor-who-cycle-007-v8-v2
  FINALIZER_WORKFLOW_PATH: .github/workflows/finalize-doctor-who-cycle-007-v8-v2.yml
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-completion-v8-final
  SELF: .github/workflows/qualify-doctor-who-cycle-007-v8-product-v2.yml
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  ROOT: /tmp/doctor-who-cycle-007-v8-product-qualification-v2
  OUT: /tmp/doctor-who-cycle-007-v8-product-qualification-v2/out
  FINALIZATION: /tmp/doctor-who-cycle-007-v8-product-qualification-v2/finalization
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-product-qualifier-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact qualifier and repaired finalizer carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$OUT" "$FINALIZATION"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$HEAD_BRANCH" = "$QUALIFIER_BRANCH"
          printf '%s\n' "$SELF" > "$OUT/expected-qualifier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-qualifier-paths.txt"
          diff -u "$OUT/expected-qualifier-paths.txt" "$OUT/actual-qualifier-paths.txt"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${FINALIZER_BRANCH}:refs/remotes/origin/${FINALIZER_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          finalizer_head="$(git rev-parse refs/remotes/origin/${FINALIZER_BRANCH})"
          test "$(git show -s --format=%P "$finalizer_head")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$finalizer_head")" = "1"
          printf '%s\n' "$FINALIZER_WORKFLOW_PATH" > "$OUT/expected-finalizer-paths.txt"
          git diff --name-only "$EXACT_MAIN"..."$finalizer_head" | LC_ALL=C sort > "$OUT/actual-finalizer-paths.txt"
          diff -u "$OUT/expected-finalizer-paths.txt" "$OUT/actual-finalizer-paths.txt"
          printf '%s\n' "$finalizer_head" > "$OUT/finalizer-head.txt"

      - name: Discover green repaired finalizer, product branch, and unique PR
        id: product
        shell: bash
        run: |
          set -euo pipefail
          finalizer_head="$(cat "$OUT/finalizer-head.txt")"
          run=''
          for _ in $(seq 1 360); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${FINALIZER_BRANCH}&per_page=100" --jq ".workflow_runs[] | select(.name==\"${FINALIZER_WORKFLOW_NAME}\" and .head_sha==\"${finalizer_head}\" and .status==\"completed\" and .conclusion==\"success\") | .id" | head -1)"
            test -n "$run" && break
            sleep 5
          done
          test -n "$run"
          job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" --jq '.jobs[] | select(.name=="finalize" and .status=="completed" and .conclusion=="success") | .id' | head -1)"
          test -n "$job"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" > "$OUT/finalizer-jobs.json"
          jq -e '.jobs | length==1 and all(.[]; .status=="completed" and .conclusion=="success" and all(.steps[]; .conclusion=="success" or .conclusion=="skipped"))' "$OUT/finalizer-jobs.json" >/dev/null
          product_head=''
          for _ in $(seq 1 180); do
            product_head="$(git ls-remote --heads origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
            test -n "$product_head" && break
            sleep 5
          done
          test -n "$product_head"
          git fetch --no-tags origin "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$product_head"
          test "$(git show -s --format=%P "$product_head")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$product_head")" = "1"
          product_tree="$(git rev-parse "${product_head}^{tree}")"
          git diff --name-only "$EXACT_MAIN"..."$product_head" | LC_ALL=C sort > "$OUT/product-paths.txt"
          test -s "$OUT/product-paths.txt"
          ! grep -E '^(\.github/workflows/|tmp/)' "$OUT/product-paths.txt" >/dev/null
          product_pr=''
          for _ in $(seq 1 180); do
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=BigBirdReturns:${PRODUCT_BRANCH}&per_page=100")"
            if test "$(jq 'length' <<<"$pulls")" = 1; then
              product_pr="$(jq -r '.[0].number' <<<"$pulls")"; break
            fi
            sleep 5
          done
          test -n "$product_pr"
          test "$(jq -r '.[0].head.sha' <<<"$pulls")" = "$product_head"
          test "$(jq -r '.[0].base.sha' <<<"$pulls")" = "$EXACT_MAIN"
          test "$(jq -r '.[0].draft' <<<"$pulls")" = false
          name="doctor-who-cycle-007-v8-finalization-v2-${run}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts?per_page=100" > "$OUT/finalizer-artifacts.json"
          id="$(jq -r --arg name "$name" '.artifacts[] | select(.name==$name and .expired==false) | .id' "$OUT/finalizer-artifacts.json" | head -1)"
          digest="$(jq -r --arg name "$name" '.artifacts[] | select(.name==$name and .expired==false) | .digest' "$OUT/finalizer-artifacts.json" | head -1)"
          test -n "$id" -a -n "$digest"
          printf 'run=%s\njob=%s\nname=%s\nid=%s\ndigest=%s\nproduct_pr=%s\nproduct_head=%s\nproduct_tree=%s\n' "$run" "$job" "$name" "$id" "$digest" "$product_pr" "$product_head" "$product_tree" > "$OUT/discovered-product.txt"
          printf 'run=%s\nname=%s\nproduct_pr=%s\nproduct_head=%s\nproduct_tree=%s\n' "$run" "$name" "$product_pr" "$product_head" "$product_tree" >> "$GITHUB_OUTPUT"
          printf 'FINALIZER_RUN=%s\nFINALIZER_JOB=%s\nFINALIZATION_ARTIFACT_ID=%s\nFINALIZATION_ARTIFACT_DIGEST=%s\nPRODUCT_PR=%s\nPRODUCT_HEAD=%s\nPRODUCT_TREE=%s\n' "$run" "$job" "$id" "${digest#sha256:}" "$product_pr" "$product_head" "$product_tree" >> "$GITHUB_ENV"

      - name: Download immutable repaired finalization custody
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.product.outputs.name }}
          path: ${{ env.FINALIZATION }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ steps.product.outputs.run }}

      - name: Compare live product to finalization custody
        shell: bash
        run: |
          set -euo pipefail
          custody="$(find "$FINALIZATION" -type f -name product-custody.txt -print -quit)"
          final_paths="$(find "$FINALIZATION" -type f -name product-paths.txt -print -quit)"
          review_receipt="$(find "$FINALIZATION" -type f -name independent-review-receipt.json -print -quit)"
          review_sha="$(find "$FINALIZATION" -type f -name independent-review-receipt.sha256 -print -quit)"
          test -n "$custody" -a -n "$final_paths" -a -n "$review_receipt" -a -n "$review_sha"
          grep -Fx "product_commit=${PRODUCT_HEAD}" "$custody" >/dev/null
          grep -Fx "product_tree=${PRODUCT_TREE}" "$custody" >/dev/null
          grep -Fx "product_branch=${PRODUCT_BRANCH}" "$custody" >/dev/null
          grep -Fx "product_paths=$(wc -l < "$OUT/product-paths.txt")" "$custody" >/dev/null
          cmp "$OUT/product-paths.txt" "$final_paths"
          test "$(sha256sum "$review_receipt" | awk '{print $1}')" = "$(cat "$review_sha")"
          cp "$review_receipt" "$OUT/independent-review-receipt.json"
          cp "$review_sha" "$OUT/independent-review-receipt.sha256"
          git checkout --detach "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact qualification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null

      - name: Verify exact Kragar semantics, chronology, and custody
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const records=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const row=records.find((item)=>item.id==='UC-1352');
          if(!row) throw new Error('UC-1352 missing');
          const text=JSON.stringify(row);
          for(const marker of ['Dan Starkey','Kragar','physical-prosthetic']) if(!text.includes(marker)) throw new Error(`UC-1352 marker missing: ${marker}`);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!pkg.scripts?.['doctor-who:cycle-007:check']) throw new Error('cycle-007 gate missing');
          NODE
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/cycle-006-chronology.log"
          npm run doctor-who:cycle-007:check | tee "$OUT/cycle-007.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard.log"

      - name: Run complete repository and rendered qualification gate
        shell: bash
        run: |
          set -euo pipefail
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Seal exact repaired product qualification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$PRODUCT_HEAD"
          gate_sha="$(sha256sum "$OUT/complete-gate.log" | awk '{print $1}')"
          receipt_sha="$(cat "$OUT/independent-review-receipt.sha256")"
          cat > "$OUT/product-qualification.json" <<JSON
          {
            "schema_version": 1,
            "transaction": "DOCTOR-WHO-CYCLE-007-KRAGAR-PRODUCT-QUALIFICATION-V2",
            "canonical_main": "$EXACT_MAIN",
            "product_branch": "$PRODUCT_BRANCH",
            "product_pr": $PRODUCT_PR,
            "product_commit": "$PRODUCT_HEAD",
            "product_tree": "$PRODUCT_TREE",
            "product_paths": $(wc -l < "$OUT/product-paths.txt"),
            "finalizer_run": $FINALIZER_RUN,
            "finalizer_job": $FINALIZER_JOB,
            "finalization_artifact_id": $FINALIZATION_ARTIFACT_ID,
            "finalization_artifact_sha256": "$FINALIZATION_ARTIFACT_DIGEST",
            "independent_review_receipt_sha256": "$receipt_sha",
            "complete_gate_sha256": "$gate_sha",
            "verdict": "approved-for-exact-merge"
          }
          JSON
          sha256sum "$OUT/product-qualification.json" | awk '{print $1}' > "$OUT/product-qualification.sha256"

      - name: Upload immutable repaired product qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-product-qualification-v2-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: ${{ env.OUT }}
