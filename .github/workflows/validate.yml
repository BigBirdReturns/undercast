name: archive-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-archive-materializer-evidence
      MATERIALIZER_COMMIT: d51e52ed54b7eef00d585f0dff1e94cf72870ecb
      MATERIALIZER_BLOB: 66743db30b74cd5b32df7dd59ab0dbc53b232f76
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install rendered-test runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run canonical gate
        run: npm run gate
      - name: Execute exact immutable DEC-0016 materializer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ux-02a-archive-materializer'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git fetch --no-tags origin \
            +refs/heads/agent/collection-only-operations:refs/remotes/origin/agent/collection-only-operations
          test "$(git rev-parse refs/remotes/origin/agent/collection-only-operations)" = "$MATERIALIZER_COMMIT"
          test "$(git rev-parse "$MATERIALIZER_COMMIT:tmp/ux02a-materialize.sh")" = "$MATERIALIZER_BLOB"
          git show "$MATERIALIZER_COMMIT:tmp/ux02a-materialize.sh" > /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          printf 'carrier=%s\nmaterializer_commit=%s\nmaterializer_blob=%s\n' \
            "${{ github.event.pull_request.head.sha }}" "$MATERIALIZER_COMMIT" "$MATERIALIZER_BLOB" \
            > "$EVIDENCE/input-identity.txt"
          bash /tmp/ux02a-materialize.sh
      - name: Upload exact DEC-0016 qualification evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'agent/ux-02a-archive-materializer'
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-archive-materializer-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-archive-materializer-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Upload projection drift diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: projection-drift
          path: .ci/projection-drift
          if-no-files-found: ignore
          retention-days: 14
