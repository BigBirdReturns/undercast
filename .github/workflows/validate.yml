name: archive-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: archive-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical gate
        run: npm run gate

      - name: Upload projection drift diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: projection-drift
          path: .ci/projection-drift
          if-no-files-found: ignore
          retention-days: 14
