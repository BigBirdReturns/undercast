name: archive-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install rendered-test runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run canonical gate
        run: npm run gate
      - name: Package exact tracked checkout for bounded local composition
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z | tar --null -T - -czf "${RUNNER_TEMP}/undercast-tracked-checkout.tgz"
      - name: Upload exact tracked checkout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-current-main-checkout-${{ github.run_id }}
          path: ${{ runner.temp }}/undercast-tracked-checkout.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Upload projection drift diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: projection-drift
          path: .ci/projection-drift
          if-no-files-found: ignore
          retention-days: 14
