name: archive-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/ux-02-dec0016-final-materializer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-dec0016-evidence
      TARGET_BRANCH: agent/ux-02-navigation-parity
      TARGET_EXPECTED_SHA: 634f0a69b95b65c22c6bc680941570f543143e9f
      QUALIFIED_BRANCH: agent/ux-02-qualified-product-4fe
      QUALIFIED_EXPECTED_SHA: 4fe485057180d3b3947bc5c70c5241ae21e5a106
      COMPOSITION_SHA256: f4ce4e4a0c3cf736adc703fd0c1f1bd0115db52bb9ade545bb5bb7afaf1908a8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ux-02-dec0016-final-materializer
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct exact current-main DEC-0016 product
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}" \
            "+refs/heads/${QUALIFIED_BRANCH}:refs/remotes/origin/${QUALIFIED_BRANCH}"
          BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          TARGET_SHA="$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})"
          QUALIFIED_SHA="$(git rev-parse refs/remotes/origin/${QUALIFIED_BRANCH})"
          test "$TARGET_SHA" = "$TARGET_EXPECTED_SHA"
          test "$QUALIFIED_SHA" = "$QUALIFIED_EXPECTED_SHA"
          git show "$TARGET_SHA:tmp/ux-02-navigation-continuity-v6.py" > /tmp/ux-02-navigation-continuity-v6.py
          test "$(sha256sum /tmp/ux-02-navigation-continuity-v6.py | awk '{print $1}')" = "$COMPOSITION_SHA256"
          printf 'SOURCE_SHA=%s\nBASE_SHA=%s\nTARGET_SHA=%s\nQUALIFIED_SHA=%s\n' \
            "$SOURCE_SHA" "$BASE_SHA" "$TARGET_SHA" "$QUALIFIED_SHA" >> "$GITHUB_ENV"

          git reset --hard "$BASE_SHA"
          git clean -fdx
          python /tmp/ux-02-navigation-continuity-v6.py
          npm ci 2>&1 | tee "$EVIDENCE/npm-ci.log"
          node scripts/shard.mjs 2>&1 | tee "$EVIDENCE/shard-before.log"
          node scripts/build-record-pages.mjs 2>&1 | tee "$EVIDENCE/records-before.log"
          node --check assets/site-navigation.js
          node --check scripts/site-seams.mjs
          node --check tests/rendered/site.spec.mjs
          node --check tests/rendered/ux-journeys.spec.mjs
          node scripts/site-seams.mjs 2>&1 | tee "$EVIDENCE/site-seams.log"
          grep -Fq '## DEC-0016 — Compact archive navigation is progressive enhancement, not a new destination' docs/DECISIONS.md
          grep -Fq 'DEC-0015 remains the authority for dense mobile evidence' docs/DECISIONS.md
          grep -Fq 'Connections and Constellations remain contextual or secondary under DEC-0009' docs/DECISIONS.md
          git diff --check

          EXPECTED_RECORDS="$(node --input-type=module -e 'import {readFileSync} from "node:fs"; const live=JSON.parse(readFileSync("data/specimens.json","utf8")); const retired=JSON.parse(readFileSync("data/tombstones.json","utf8")); console.log(live.length+(retired.records||[]).length);')"
          GENERATED_RECORDS="$(find records -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l | tr -d ' ')"
          test "$GENERATED_RECORDS" = "$EXPECTED_RECORDS"
          find records -mindepth 2 -maxdepth 2 -type f -name index.html -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > "$EVIDENCE/generated-records-before.sha256"

          cat > /tmp/ux02a-expected-paths <<'PATHS'
          404.html
          assets/site-navigation.js
          assets/site-shell.css
          constellation.html
          coverage.html
          data/archive.json
          docs/DECISIONS.md
          docs/UX-READINESS.md
          index.html
          recognition.html
          scripts/build-record-pages.mjs
          scripts/site-seams.mjs
          tests/rendered/site.spec.mjs
          tests/rendered/ux-journeys.spec.mjs
          PATHS
          sed -i 's/^          //' /tmp/ux02a-expected-paths
          { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } \
            | LC_ALL=C sort -u > /tmp/ux02a-actual-paths
          diff -u /tmp/ux02a-expected-paths /tmp/ux02a-actual-paths
          if grep -Eq '^records/|^\.github/|^\.ci/|^tmp/' /tmp/ux02a-actual-paths; then
            printf 'transport, workflow, or generated record entered the product denominator\n' >&2
            exit 1
          fi

          git config user.name undercast-transaction-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mapfile -t permanent_paths < /tmp/ux02a-expected-paths
          git add -- "${permanent_paths[@]}"
          git commit -m 'UX: normalize mobile archive navigation and current location'
          PRODUCT_SHA="$(git rev-parse HEAD)"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          test -z "$(git status --porcelain)"
          printf 'PRODUCT_SHA=%s\nGENERATED_RECORDS=%s\n' "$PRODUCT_SHA" "$GENERATED_RECORDS" >> "$GITHUB_ENV"

      - name: Prove collection policy and generated-record replay
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ux02a-pr-event.json <<'JSON'
          {
            "pull_request": {
              "labels": [{"name": "owner-approved-product-change"}],
              "body": "Implements DEC-0016 while preserving DEC-0009, DEC-0012 and DEC-0015."
            }
          }
          JSON
          node scripts/corpus-ops.mjs check-pr --base "$BASE_SHA" --event /tmp/ux02a-pr-event.json --json \
            2>&1 | tee "$EVIDENCE/collection-policy.log"
          node scripts/build-record-pages.mjs 2>&1 | tee "$EVIDENCE/records-replay.log"
          find records -mindepth 2 -maxdepth 2 -type f -name index.html -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > "$EVIDENCE/generated-records-after.sha256"
          diff -u "$EVIDENCE/generated-records-before.sha256" "$EVIDENCE/generated-records-after.sha256" \
            | tee "$EVIDENCE/generated-records.diff"
          node scripts/shard.mjs 2>&1 | tee "$EVIDENCE/shard-replay.log"
          test -z "$(git status --porcelain)"

      - name: Install all supported browser engines
        shell: bash
        run: timeout 1200s npx playwright install --with-deps chromium firefox webkit 2>&1 | tee "$EVIDENCE/playwright-install.log"

      - name: Run five-engine UX matrix
        id: ux
        shell: bash
        run: timeout 1200s npm run test:ux 2>&1 | tee "$EVIDENCE/test-ux.log"

      - name: Run canonical complete repository gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 1800s npm run gate 2>&1 | tee "$EVIDENCE/gate.log"
          test -z "$(git status --porcelain)"

      - name: Verify stable main and publish workflow-free product
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 1
          git diff --name-only "$BASE_SHA"..HEAD | LC_ALL=C sort > /tmp/ux02a-final-paths
          diff -u /tmp/ux02a-expected-paths /tmp/ux02a-final-paths
          git diff --check "$BASE_SHA"..HEAD
          test -z "$(git status --porcelain)"
          {
            printf 'status=success\n'
            printf 'run=%s\n' "$GITHUB_RUN_ID"
            printf 'base=%s\n' "$BASE_SHA"
            printf 'transport=%s\n' "$SOURCE_SHA"
            printf 'prior_target=%s\n' "$TARGET_SHA"
            printf 'qualified_source=%s\n' "$QUALIFIED_SHA"
            printf 'composition_sha256=%s\n' "$COMPOSITION_SHA256"
            printf 'product=%s\n' "$PRODUCT_SHA"
            printf 'decision=DEC-0016\n'
            printf 'generated_records=%s\n' "$GENERATED_RECORDS"
            printf 'changed_paths=14\n'
            cat /tmp/ux02a-final-paths
          } > "$EVIDENCE/qualification.txt"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          jq -n --arg body "UX-02A DEC-0016 materializer run ${GITHUB_RUN_ID} passed collection-policy preflight, ${GENERATED_RECORDS}-page exact generated-record replay, the five-engine UX matrix, committed visual baselines and the complete repository gate. It published workflow-free one-commit product ${PRODUCT_SHA} on stable main ${BASE_SHA}." \
            '{body:$body}' > /tmp/ux02a-comment.json
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/ux02a-comment.json \
            "https://api.github.com/repos/BigBirdReturns/undercast/issues/255/comments" \
            >/dev/null || true

      - name: Record failed qualification stage
        if: failure()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE"
          printf 'status=failure\nrun=%s\ntransport=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$EVIDENCE/status.txt"

      - name: Upload DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
