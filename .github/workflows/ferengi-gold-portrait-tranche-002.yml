name: ferengi-gold-portrait-tranche-002

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-PORTRAIT-TRANCHE-002.json"
      - ".github/workflows/ferengi-gold-portrait-tranche-002.yml"
      - "scripts/ferengi-gold-portrait-tranche-002.mjs"

permissions:
  contents: write

concurrency:
  group: ferengi-gold-portrait-tranche-002-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-search:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify active Ferengi lock and exact tranche authorization
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-portrait-tranche-002"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock-before.log"
          node --input-type=module - <<'NODE' | tee "$root/authorization.log"
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-PORTRAIT-TRANCHE-002.json','utf8'));
          if(row.scope!=='star-trek'||row.species!=='ferengi'||row.reviewed_role!=='second-desk')throw new Error('tranche scope or review authority drift');
          const ids=(row.apply||[]).map(entry=>entry.id);
          if(JSON.stringify(ids)!==JSON.stringify(['UC-1292','UC-1293','UC-1295']))throw new Error(`unexpected apply ids ${ids.join(',')}`);
          if(new Set((row.apply||[]).map(entry=>entry.sha256)).size!==3)throw new Error('applied portraits must have three distinct byte hashes');
          if((row.gather||[]).length!==8)throw new Error('residual gather target set must contain eight actors');
          console.log(`PASS — exact tranche applies ${ids.join(', ')} and searches eight residual actors`);
          NODE
      - name: Apply three reviewed portraits and gather exact-page residual candidates
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT_DIR: ${{ runner.temp }}/ferengi-gold-portrait-tranche-002/search
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-portrait-tranche-002"
          node scripts/ferengi-gold-portrait-tranche-002.mjs apply 2>&1 | tee "$root/apply.log"
          node scripts/ferengi-gold-portrait-tranche-002.mjs gather 2>&1 | tee "$root/gather.log"
      - name: Stage bytes, rebuild projections and enforce exact-subject rulings
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-portrait-tranche-002"
          node scripts/media-stage.mjs --ids UC-1292 UC-1293 UC-1295 | tee "$root/media-stage.log"
          node scripts/credits.mjs | tee "$root/credits-1.log"
          node scripts/shard.mjs | tee "$root/shard-1.log"
          node scripts/build-contract.mjs | tee "$root/contract-1.log"
          node scripts/media-audit.mjs sync | tee "$root/media-sync.log"
          node scripts/ferengi-gold-portrait-tranche-002.mjs resolution | tee "$root/resolution-build.log"
          node scripts/media-audit.mjs resolve --input data/review/ferengi-gold/portrait-tranche-002-media-resolution-2026-07-25.json | tee "$root/media-resolve.log"
          node scripts/credits.mjs | tee "$root/credits-2.log"
          node scripts/shard.mjs | tee "$root/shard-2.log"
          node scripts/build-contract.mjs | tee "$root/contract-2.log"
          node scripts/ds9-census.mjs --project-only | tee "$root/ds9-census.log"
          node scripts/ds9-graph.mjs --project-only | tee "$root/ds9-graph.log"
          node scripts/ds9-eligibility-queue.mjs | tee "$root/ds9-eligibility.log"
          node scripts/ds9-maker-queue.mjs | tee "$root/ds9-maker.log"
          node scripts/build-record-pages.mjs | tee "$root/record-pages.log"
          node scripts/ferengi-gold-portrait-tranche-002.mjs validate | tee "$root/validate-tranche.log"
          node scripts/media-audit.mjs validate | tee "$root/validate-media.log"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock-after.log"
      - name: Build permanent candidate and remove completed tranche operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-media-review'
          git config user.email 'undercast-media-review@users.noreply.github.com'
          rm -f .github/FERENGI-GOLD-PORTRAIT-TRANCHE-002.json .github/workflows/ferengi-gold-portrait-tranche-002.yml scripts/ferengi-gold-portrait-tranche-002.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Ferengi gold: apply two Playbill portraits and Corsentino'
      - name: Install Chromium for permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-portrait-tranche-002"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain exact application, search, review and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-portrait-tranche-002-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ferengi-gold-portrait-tranche-002
            data/review/ferengi-gold/portrait-tranche-002-applied-2026-07-25.json
            data/review/ferengi-gold/portrait-tranche-002-media-resolution-2026-07-25.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
