name: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main.yml
      CARRIER: /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-carrier
      CONTROLLER_BLOB: cd29970d2e6b8deda1f6f9f9761d3a281b1848f1
      CONTROLLER_GZIP_BYTES: "4202"
      CONTROLLER_GZIP_SHA256: 4fe09b76188b2d16bfd97dfaa164a610651c0b6f9ccf50efc3b81a7c7ec45f10
      CONTROLLER_BYTES: "15190"
      CONTROLLER_SHA256: 0cad6e9c9f2e55650c89ac3d82006bbd5ffdfd2f9b3e17a17981e853d1357436

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate one-blob V10 controller transport and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/controller.sh.gz"
          test "$(wc -c < "$CARRIER/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$CARRIER/controller.sh.gz" > "$CARRIER/controller.sh"
          test "$(wc -c < "$CARRIER/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$CARRIER/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$CARRIER/controller.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-carrier/controller.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==1
          for index,block in enumerate(blocks,1):
              compile(block,f'<rastel-v10-controller-{index}>','exec')
          assert "export EXACT_LEASE_ID='lease_a6fc819786f4296a40bdc540'" in text
          assert "assert lease==os.environ['EXACT_LEASE_ID']" in text
          assert "assert re.fullmatch(r'lease_[0-9a-f]{24}',lease),lease" not in text
          assert text.count("len(lease)==31")==2
          PY
          chmod 700 "$CARRIER/controller.sh"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" exec "$CARRIER/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport
            /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-bootstrap
            /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-control
            /tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-carrier
            !/tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-carrier/v7.zip
            !/tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-carrier/v9.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
