name: ferengi-gold-integrity-audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ferengi-gold-integrity-audit.yml"
      - "scripts/ferengi-gold-integrity-audit.mjs"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the active species lock
        run: node scripts/star-trek-species-gold.mjs validate
      - name: Bind duplicate and composite findings to exact repository state
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ferengi-gold-integrity/report.json"
          mkdir -p "$(dirname "$out")"
          node scripts/ferengi-gold-integrity-audit.mjs --out "$out" | tee "$RUNNER_TEMP/ferengi-gold-integrity/run.log"
      - name: Upload exact records, tasks, credits and source-revision evidence
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-integrity
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
