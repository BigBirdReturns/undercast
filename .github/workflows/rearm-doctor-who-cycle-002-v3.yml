name: rearm-doctor-who-cycle-002-v3

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rearm-doctor-who-cycle-002-v3.yml"

permissions:
  contents: write

concurrency:
  group: rearm-doctor-who-cycle-002-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rearm:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Touch only the already-defined v3 writer and self-delete
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: .github/workflows/rearm-doctor-who-cycle-002-v3.yml
          WRITER: .github/workflows/complete-doctor-who-cycle-002-v3.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=64 origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          grep -Fq 'name: complete-doctor-who-cycle-002-gredd-v3' "$WRITER"
          grep -Fq 'branches:' "$WRITER"
          printf '\n# one-shot rearm from %s\n' "$AUTHORIZED_HEAD" >> "$WRITER"
          git rm "$SELF"
          git add "$WRITER"
          git diff --cached --check
          git commit \
            -m 'Doctor Who: rearm the already-defined Gredd v3 writer' \
            -m 'touch only the existing push-bound workflow so GitHub dispatches its first subsequent event'
          rearmed_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "rearmed_head=$rearmed_head" >> "$GITHUB_STEP_SUMMARY"
