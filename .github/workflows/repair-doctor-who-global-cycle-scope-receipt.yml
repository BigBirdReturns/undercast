name: repair-doctor-who-global-cycle-scope-receipt

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-doctor-who-global-cycle-scope-receipt.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-global-cycle-scope-receipt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EVENT_BASE: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/repair-doctor-who-global-cycle-scope-receipt.yml
  PATCHER: scripts/apply-doctor-who-global-cycle-scope-receipt.py
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch, descendant current main, and apply scope-bound receipt repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          current_main="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$EVENT_BASE" "$current_main"
          export CURRENT_MAIN="$current_main"
          echo "CURRENT_MAIN=$CURRENT_MAIN" >> "$GITHUB_ENV"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git rebase refs/remotes/origin/main
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$CURRENT_MAIN"

          python "$PATCHER"
          node --check scripts/doctor-who-activation.mjs
          node --check scripts/lib/waterline.mjs
          node scripts/doctor-who-activation.mjs check
          node scripts/waterline-fixtures.mjs
          npm run waterline:fixtures

      - name: Stage exact workflow-free repair and run complete candidate gate
        run: |
          set -euo pipefail
          git rm "$SELF" "$PATCHER"
          git add \
            data/review/adapter-sdk/doctor-who-activation-001.json \
            docs/AUTOPILOT.md \
            scripts/doctor-who-activation.mjs \
            scripts/lib/waterline.mjs \
            scripts/waterline-fixtures.mjs
          git diff --cached --check
          node scripts/doctor-who-activation.mjs check
          npm run gate 2>&1 | tee /tmp/doctor-who-global-cycle-scope-receipt-candidate-gate.log

      - name: Commit exact repair and run complete workflow-free final gate
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git commit \
            -m 'Activation: require scope-bound cycle receipts' \
            -m 'match reviewed receipts by scope and lease instead of lease alone' \
            -m 'prove colliding cross-scope lease IDs cannot release custody'
          new_head="$(git rev-parse HEAD)"
          echo "PRODUCT_HEAD=$new_head" >> "$GITHUB_ENV"

          node scripts/doctor-who-activation.mjs check
          npm run gate 2>&1 | tee /tmp/doctor-who-global-cycle-scope-receipt-final-gate.log

          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git status --porcelain)"

      - name: Publish exact five-path product under branch lease
        run: |
          set -euo pipefail
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CURRENT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$CURRENT_MAIN"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/review/adapter-sdk/doctor-who-activation-001.json
          docs/AUTOPILOT.md
          scripts/doctor-who-activation.mjs
          scripts/lib/waterline.mjs
          scripts/waterline-fixtures.mjs
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${PRODUCT_HEAD}" >> "$GITHUB_STEP_SUMMARY"
          echo "base_main=${CURRENT_MAIN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scope-bound receipt and complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-global-cycle-scope-receipt-${{ github.run_id }}
          path: |
            /tmp/doctor-who-global-cycle-scope-receipt-candidate-gate.log
            /tmp/doctor-who-global-cycle-scope-receipt-final-gate.log
            /tmp/expected-final-paths.txt
            /tmp/final-paths.txt
            data/review/adapter-sdk/doctor-who-activation-001.json
            scripts/doctor-who-activation.mjs
            scripts/lib/waterline.mjs
            scripts/waterline-fixtures.mjs
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
