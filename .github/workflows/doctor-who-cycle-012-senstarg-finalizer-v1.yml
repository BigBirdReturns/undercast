name: doctor-who-cycle-012-senstarg-finalizer-v1

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-finalizer-v1.yml"
      - ".github/finalizer/doctor-who-cycle-012-senstarg-finalizer-v1.part-*"

# Historical cycle checkers run on the canonical base and again after the
# cycle-012 receipt and registry closure. The reviewed candidate stays exact.
concurrency:
  group: doctor-who-cycle-012-senstarg-finalizer-v1
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Finalize, verify, and publish Senstarg cycle 012
        shell: bash
        run: |
          cat .github/finalizer/doctor-who-cycle-012-senstarg-finalizer-v1.part-{09,10,11,12} > /tmp/senstarg-bootstrap.sh
          test "$(wc -c < /tmp/senstarg-bootstrap.sh | tr -d ' ')" = 7499
          test "$(sha256sum /tmp/senstarg-bootstrap.sh | cut -d' ' -f1)" = 34a2b7978b70b61898cd44a78699c6d7ad513bde9b29254637ee8c9b3a0301af
          bash -n /tmp/senstarg-bootstrap.sh
          bash /tmp/senstarg-bootstrap.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-who-cycle-012-senstarg-terminal-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-finalizer-v1/final
            /tmp/senstarg-finalizer-v1.sh
            /tmp/senstarg-bootstrap.sh
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
