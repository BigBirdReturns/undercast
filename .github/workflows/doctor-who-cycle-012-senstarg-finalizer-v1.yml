name: doctor-who-cycle-012-senstarg-finalizer-v1

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-finalizer-v1.yml"
      - ".github/finalizer/doctor-who-cycle-012-senstarg-finalizer-v1.part-*"

permissions: {}
concurrency:
  group: doctor-who-cycle-012-senstarg-finalizer-v1
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREINSTALL_MAIN: 95fcd0d535c33c9c9a7ef0b299c8d15ed97b3134
      PREINSTALL_TREE: c9665b9c951780b179431c228ea5d09e1e05a39d
      CANDIDATE_BASE: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      OUT: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1
      SOURCE: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-review
      CANDIDATE: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-candidate
      BASEWT: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-base
      WORK: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-work
      FINALWT: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-product

      REVIEW_PR: "945"
      REVIEW_HEAD: 1c688b9bf88d3e3cd611cac7d6eea63c912caa91
      REVIEW_RUN: "31552463171"
      REVIEW_JOB: "93977876861"
      REVIEW_ARTIFACT: "9124806216"
      REVIEW_ZIP_SHA256: 5dc2e9af5537ab7ca8b06a9cc705e88c0bfbae03565489f35f723f6561a8f8a6
      REVIEW_IDENTITY: ab471a7fde54cb4421ba62fc2dd3ffbe11bcf9d74e5568ace91173f5a1fabb91
      REVIEW_REBASED_COMMIT: e99c7a6bf6fae4a5acbb4af6172b0bf486fee5e2
      REVIEW_REBASED_TREE: b94e43d82f4f61cefcfc23fc27c3dac5ca710248

      CANDIDATE_PR: "943"
      CANDIDATE_RUN: "31517397491"
      CANDIDATE_JOB: "93865867660"
      CANDIDATE_ARTIFACT: "9111727123"
      CANDIDATE_ZIP_SHA256: c9d195d52a1fd6760f0ba33a57b57345c32b07376e42feb19930b4c393029777
      CANDIDATE_RECEIPT_ID: b0eb5d20f5a5c2e84ef738e3be34e4590259ef695224fea09988619596e2228c
      CANDIDATE_ORIGINAL_COMMIT: a594903e9d9a61b65600fd626075117d6815fb0d
      CANDIDATE_ORIGINAL_TREE: df201873e6481f2de123fc5f2fb066a37efd5c8e

      TASK_ID: ap_8965086737382df0e88366db
      LEASE_ID: lease_91feba4df199b92d8b266081
      WALL_ID: UC-1357
      SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      STILL_PATH: images/uc-1357-still.webp
      STILL_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      STILL_ORIGIN: https://static.wikia.nocookie.net/tardis/images/a/a1/Senstarg.jpg/revision/latest?cb=20140802021356
      PORTRAIT_PATH: images/uc-1357-portrait.jpg
      PORTRAIT_SHA256: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_by_Gage_Skidmore.jpg

      PRIOR_CYCLE_ID: cycle_74cdc938b028a932a766d209
      ORIGINAL_CYCLE011_CHECKER_SHA: 4f94425d4d29c74197ed5449415677b27b50225fc941bbe59b81f162b18d421e
      REVIEWED_AT: 2026-08-12T01:30:00.000Z
      CANDIDATE_COMMIT_AT: 2026-08-11T08:35:00Z
      CLOSURE_COMMIT_AT: 2026-08-12T01:32:00Z
      PRODUCT_COMMIT_AT: 2026-08-12T01:35:00Z
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Reconstruct and execute exact receipt-bearing Senstarg finalizer
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/finalizer -maxdepth 1 -type f -name 'doctor-who-cycle-012-senstarg-finalizer-v1.part-*' | sort)
          test "${#parts[@]}" = 8
          read -r -a sizes <<< "2000 2000 2000 2000 2000 2000 2000 1028"
          read -r -a hashes <<< "b03dc1b389c7478587fe00e2545bcd469df05e8fc0ea3e3dcb279f55828b83da 553ef788d40a6fa43e5c7d7a1a0e290cef24972a2e8dcd57dfd8a99e3510e019 aca21678d18a9f9812d043edf2651410a0858ba3c2bcfb9249b3d82c1100231e 755735ae8d07c906cd34ed9a043b248664a774868b8020f5fb33afdf4c72b9aa 99038e7c25607e83611adbe272400b676c8622712412a4466d507f2fc5edb8da 4d7a22a1b97e08e8962186736c14dca2741583449d24ccb1afb3c848bec8ae32 fb910b7f28357539b30f96fe02baab2371a45374921f4cf744b56bbe1c560ee7 a5d542d0ec0097ce4e2fa86e6d013f5517e6b5f2affd22a24b27e54cf202b8db"
          : > /tmp/senstarg-finalizer-v1.sh.gz.b64
          for index in "${!parts[@]}"; do
            test "$(wc -c < "${parts[$index]}" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "${parts[$index]}" | awk '{print $1}')" = "${hashes[$index]}"
            cat "${parts[$index]}" >> /tmp/senstarg-finalizer-v1.sh.gz.b64
          done
          test "$(wc -c < /tmp/senstarg-finalizer-v1.sh.gz.b64 | tr -d ' ')" = "15028"
          test "$(sha256sum /tmp/senstarg-finalizer-v1.sh.gz.b64 | awk '{print $1}')" = "4dc74700936d4129da05ee206280735f4aac64f8ad16a64ec0ca4a19fb697d54"
          base64 -d /tmp/senstarg-finalizer-v1.sh.gz.b64 > /tmp/senstarg-finalizer-v1.sh.gz
          test "$(wc -c < /tmp/senstarg-finalizer-v1.sh.gz | tr -d ' ')" = "11271"
          test "$(sha256sum /tmp/senstarg-finalizer-v1.sh.gz | awk '{print $1}')" = "aa230566615776bcc31e791ed1664febf17e2877ddc86c5759153b4712f10722"
          gzip -dc /tmp/senstarg-finalizer-v1.sh.gz > /tmp/senstarg-finalizer-v1.sh
          test "$(wc -c < /tmp/senstarg-finalizer-v1.sh | tr -d ' ')" = "43379"
          test "$(sha256sum /tmp/senstarg-finalizer-v1.sh | awk '{print $1}')" = "8c815ba59540410441734e8ce1f78519ecfb88869d8189afd268552f2e58fe7e"
          bash -n /tmp/senstarg-finalizer-v1.sh
          chmod 700 /tmp/senstarg-finalizer-v1.sh
          /tmp/senstarg-finalizer-v1.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-finalizer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1/final
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-finalizer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-finalizer-v1
            /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-review
            /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-candidate
            /tmp/senstarg-finalizer-v1.sh
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  publish:
    needs: verify
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREINSTALL_MAIN: 95fcd0d535c33c9c9a7ef0b299c8d15ed97b3134
      PUBLISH_OUT: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-publish
      ARTIFACT_NAME: doctor-who-cycle-012-senstarg-finalizer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Publish exact reviewed Senstarg product by ordinary fast-forward
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PUBLISH_OUT"
          mkdir -p "$PUBLISH_OUT"/{api,product}
          INSTALLED_MAIN="$(git rev-parse HEAD)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P "$INSTALLED_MAIN")" = "$PREINSTALL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$PUBLISH_OUT/api/artifacts.json"
          ROOT="$PUBLISH_OUT" python3 - <<'PYMETA'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); rows=json.loads((root/'api/artifacts.json').read_text())['artifacts']
          rows=[x for x in rows if x['name']==os.environ['ARTIFACT_NAME'] and not x['expired']]
          assert len(rows)==1,[(x['id'],x['name']) for x in rows]
          (root/'api/artifact.json').write_text(json.dumps(rows[0],indent=2,sort_keys=True)+'\n')
          (root/'api/artifact-id.txt').write_text(str(rows[0]['id'])+'\n')
          PYMETA
          ARTIFACT_ID="$(cat "$PUBLISH_OUT/api/artifact-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$PUBLISH_OUT/product.zip"
          ROOT="$PUBLISH_OUT" python3 - <<'PYVERIFY'
          import hashlib,json,os,stat,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); target=root/'product'; sha=lambda b:hashlib.sha256(b).hexdigest()
          meta=json.loads((root/'api/artifact.json').read_text())
          assert meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert meta['digest']=='sha256:'+sha((root/'product.zip').read_bytes())
          with zipfile.ZipFile(root/'product.zip') as z:
              infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); mode=(info.external_attr>>16)&0xffff
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename and not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target.joinpath(*p.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'; assert sealed.read_text().split()[0]==sha(pre.read_bytes())
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=target/name.strip().lstrip('*').removeprefix('./'); assert p.is_file() and sha(p.read_bytes())==digest,(p,digest)
          q=json.loads((target/'qualification.json').read_text()); body=dict(q); identity=body.pop('identity')
          assert identity==sha(json.dumps(body,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          assert q['status']=='cycle-012-senstarg-receipt-bearing-product-qualified'
          assert q['canonical']['preinstall_main']==os.environ['PREINSTALL_MAIN'] and q['canonical']['installed_main']==os.environ['GITHUB_SHA'] and q['canonical']['paths']==49
          assert all(q['gates'].values()) and q['boundary']['product_tree_transport_free'] is True and q['boundary']['maker_attribution_resolved'] is False
          assert q['cycle']['queue']=={'total':316,'queued':304,'resolved':12,'in_flight':0} and q['cycle']['maker_attribution']=='unresolved'
          assert q['product']['bundle_sha256']==sha((target/'product.bundle').read_bytes())
          subprocess.run(['git','bundle','verify',str(target/'product.bundle')],check=True)
          PYVERIFY
          git fetch "$PUBLISH_OUT/product/product.bundle" refs/heads/senstarg-product:refs/remotes/senstarg-product
          PRODUCT_COMMIT="$(cat "$PUBLISH_OUT/product/product-commit.txt")"
          PRODUCT_TREE="$(cat "$PUBLISH_OUT/product/product-tree.txt")"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          test -z "$(git ls-tree -r --name-only "$PRODUCT_TREE" | grep -E '^\.github/(workflows/doctor-who-cycle-012-senstarg-finalizer-v1\.yml|finalizer/doctor-who-cycle-012-senstarg-finalizer-v1\.part-)')"
          test "$(git diff --name-only "$PREINSTALL_MAIN" "$PRODUCT_COMMIT" | wc -l | tr -d ' ')" = "49"
          git push origin "$PRODUCT_COMMIT:refs/heads/main"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PRODUCT_COMMIT"
          PRODUCT_COMMIT="$PRODUCT_COMMIT" PRODUCT_TREE="$PRODUCT_TREE" INSTALLED_MAIN="$INSTALLED_MAIN" ROOT="$PUBLISH_OUT" python3 - <<'PYRECEIPT'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          q=json.loads((root/'product/qualification.json').read_text())
          receipt={'version':1,'status':'cycle-012-senstarg-canonical-publication-complete','run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'installed_main':os.environ['INSTALLED_MAIN'],'product_commit':os.environ['PRODUCT_COMMIT'],'product_tree':os.environ['PRODUCT_TREE'],'qualification_identity':q['identity'],'cycle_id':q['cycle']['cycle_id'],'queue':q['cycle']['queue'],'maker_attribution':'unresolved','force_update':False}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'publication-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PYRECEIPT
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-publication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-finalizer-v1-publish/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
