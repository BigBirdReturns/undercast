name: doctor-who-cycle-012-senstarg-finalizer-v1

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-finalizer-v1.yml"
      - ".github/finalizer/doctor-who-cycle-012-senstarg-finalizer-v1.part-*"

# The sealed finalizer is verified before one explicit compatibility transform.
# Historical cycle checks run again after cycle-012 registry and receipt closure.
concurrency:
  group: doctor-who-cycle-012-senstarg-finalizer-v1
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Finalize, verify, and publish Senstarg cycle 012
        shell: bash
        run: |
          cat .github/finalizer/doctor-who-cycle-012-senstarg-finalizer-v1.part-{09,10,11,12,13,14} > /tmp/senstarg-bootstrap.sh
          test "$(wc -c < /tmp/senstarg-bootstrap.sh | tr -d ' ')" = 10295
          test "$(sha256sum /tmp/senstarg-bootstrap.sh | cut -d' ' -f1)" = 1c80320c4a21623b2c1b6931595f1d4ec10fdf8c784b1f1e8b16f00a6422b58d
          bash -n /tmp/senstarg-bootstrap.sh
          bash /tmp/senstarg-bootstrap.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-who-cycle-012-senstarg-terminal-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-finalizer-v1/final
            /tmp/senstarg-finalizer-v1.sh
            /tmp/senstarg-finalizer-v1-exec.sh
            /tmp/senstarg-bootstrap.sh
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
