name: card-backfill-uc-178-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-178-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-178-DISCOVER-FAILURES.json"
      - ".github/CARD-BACKFILL-UC-178.json"
      - "scripts/card-backfill-uc-178-discover.mjs"
      - "scripts/card-backfill-uc-178-discover.part*.b64"
      - ".github/workflows/card-backfill-uc-178-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-178-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-041
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify two retained construction failures and exact direct-discoverer boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-178-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-178-DISCOVER-FAILURES.json','utf8'));
          const scope=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-178.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(x=>x.id==='UC-178');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(x=>x.id==='UC-178');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(x=>x.id==='ma_14ee98b417aa8d0c8175a1a2');
          if(c.version!==1||c.record_id!=='UC-178'||c.actor!=='Eric Stoltz'||c.character!=='Rocky Dennis'||c.production!=='Mask (1985)'||c.years!=='1985'||c.universe!=='Film'||c.side!=='still')throw new Error('UC-178 discovery identity drift');
          if(c.selector_artifact?.artifact_id!==8745619768||c.scope_artifact?.artifact_id!==8745725034||c.scope_artifact?.scope_sha256!=='a4ece0858ff15dbed9904c193fae3bed119df8c5fb2651d5635926297cee0b04')throw new Error('UC-178 upstream custody drift');
          if(c.source_pages?.length!==3||c.candidate_orbits?.length!==2||c.minimum_width!==500||c.minimum_height!==400||c.maximum_candidates!==40||c.expected_repository_hash_count!==2070)throw new Error('UC-178 discovery denominator drift');
          if(c.selection_contract?.exact_eric_stoltz_rocky_dennis_mask_1985_still_required!==true||c.selection_contract?.actor_role_evidence_must_be_independent_from_selected_image!==true||c.selection_contract?.afi_and_tcm_actor_role_custody_required!==true||c.selection_contract?.academy_michael_westmore_and_zoltan_elek_makeup_award_custody_required!==true||c.selection_contract?.visual_second_desk_required!==true||c.selection_contract?.canonical_mutation!==false)throw new Error('UC-178 selection contract drift');
          if(failures.version!==1||failures.record_id!=='UC-178'||failures.failed_discovery_checkpoints?.length!==2)throw new Error('UC-178 failure-ledger shape drift');
          const [first,second]=failures.failed_discovery_checkpoints;
          if(first.run_id!==30508103255||first.artifact_id!==8746092778||first.head_sha!=='5454867227fe5e7a3bb0486b4a387d16abc5836b'||first.artifact_digest_sha256!=='32d93ad1e5f33deec760ba149be42d39112027e9fca51a2c21048d0668297253'||first.loader_git_blob_sha1!=='7b13465be4ee2c0c762288484f4fdf913c97c653'||first.declared_decoded_sha256!=='171fdebaf22950ba855a0e10ab9fe6a1e67d2254822af3dc31e2cfd7323b31b7'||first.observed_decoded_sha256!=='4bbc3a15a13625719883f1e9157c16838da92ae2a7ffc286afe18e5c9ad4c46f'||first.discoverer_written!==false||first.browser_launch_started!==false||first.canonical_mutation!==false)throw new Error('UC-178 digest failure custody drift');
          if(second.run_id!==30508350365||second.artifact_id!==8746179265||second.head_sha!=='232348942f9f63e89946201956f9299891870de2'||second.artifact_digest_sha256!=='e660fe1d4c9ff5501ea9b6e9c41e9841a4fe5999a6bc642f834d4e566305f93e'||second.loader_git_blob_sha1!=='96130842b0ad15990054ea7b8c1027b4f365c3bc'||second.materialized_discoverer_sha256!=='4bbc3a15a13625719883f1e9157c16838da92ae2a7ffc286afe18e5c9ad4c46f'||second.syntax_check_started!==true||second.syntax_check_passed!==false||second.syntax_error!=="Identifier 'imageLike' has already been declared"||second.browser_launch_started!==false||second.source_transport_started!==false||second.canonical_mutation!==false)throw new Error('UC-178 syntax failure custody drift');
          if(JSON.stringify(first.part_git_blob_sha1s)!==JSON.stringify(['eccdad0d9d12c23aa9b176e70e5034cdb0325717','c1d9e0f0c9309e86eb3e38bc5b1efcb52b9b5591','dfeebf56fb2f212444757d844e6db08c286fe079','ba4759d004cb330689769e5889b70b587b5ee0ff','68eda6aa7f9813b30a8947ec26e359059b6d2e01','033301e5e0c021d05e03b6c65dc939a43ee80152']))throw new Error('UC-178 failed chunk custody drift');
          const repair=failures.repair_boundary||{};
          if(repair.failed_chunk_files_and_blob_sha1s_must_remain_named_in_failure_custody!==true||repair.failed_chunk_materializer_must_not_execute_again!==true||repair.direct_single_blob_discoverer_required!==true||repair.direct_discoverer_git_blob_sha1!=='38afbaad3ff8107b89bb7a622fcad5119b0d7e70'||repair.direct_discoverer_sha256!=='5643bd6d9d0e5dd5b2274b6464e419fe9a0106275d4e3bd0b0cec6cdbe6bad7c'||repair.direct_discoverer_must_pass_node_syntax_check_before_execution!==true||repair.source_pages_required_terms_and_typed_custody_unchanged!==true||repair.candidate_orbits_source_floor_maximum_candidates_and_duplicate_denominator_unchanged!==true||repair.actor_role_evidence_must_remain_independent_from_selected_image!==true||repair.visual_second_desk_required!==true||repair.canonical_mutation!==false)throw new Error('UC-178 direct-discoverer repair boundary drift');
          const script=fs.readFileSync('scripts/card-backfill-uc-178-discover.mjs');
          if(execFileSync('git',['hash-object','scripts/card-backfill-uc-178-discover.mjs'],{encoding:'utf8'}).trim()!==repair.direct_discoverer_git_blob_sha1)throw new Error('UC-178 direct discoverer Git blob drift');
          if(createHash('sha256').update(script).digest('hex')!==repair.direct_discoverer_sha256)throw new Error('UC-178 direct discoverer SHA-256 drift');
          for(const [index,expected] of first.part_git_blob_sha1s.entries()){
            const path=`scripts/card-backfill-uc-178-discover.part${String(index+1).padStart(2,'0')}.b64`;
            if(execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim()!==expected)throw new Error(`UC-178 failed chunk blob drift ${path}`);
          }
          if(scope.selector_artifact?.artifact_id!==8745619768||scope.scope_contract?.exact_eric_stoltz_rocky_dennis_mask_1985_still_required!==true||scope.scope_contract?.canonical_mutation!==false)throw new Error('UC-178 scope control drift');
          if(!specimen||specimen.actor!=='Eric Stoltz'||specimen.character!=='Rocky Dennis'||specimen.production!=='Mask (1985)'||specimen.years!=='1985'||specimen.designer!=='Michael Westmore'||specimen.transform!==4||specimen.still||specimen.portrait?.src!=='images/uc-178-portrait.jpg')throw new Error('UC-178 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-178-portrait.jpg'||!audit||audit.status!=='absent'||audit.asset)throw new Error('UC-178 canonical absence boundary drift');
          console.log('PASS — two UC-178 pre-transport construction failures retained and exact direct discoverer authorized');
          NODE
      - name: Gather independent receipts and exact first-party visual candidate orbits
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-178-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-178-discover.mjs
          node scripts/card-backfill-uc-178-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-178-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload typed page receipts, exact candidate bytes, exclusions, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-178-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-178-discover
            ${{ runner.temp }}/card-backfill-uc-178-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
