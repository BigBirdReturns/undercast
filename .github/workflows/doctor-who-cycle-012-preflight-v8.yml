name: doctor-who-cycle-012-preflight-v8

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v8.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v8
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v8
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v8.yml
      OUT: /tmp/doctor-who-cycle-012-preflight-v8
      DIAGNOSTIC_PR: "859"
      DIAGNOSTIC_BRANCH: agent/doctor-who-cycle-012-preflight-v6
      DIAGNOSTIC_HEAD: 81ff351954e3481b870fd6a9873815cf99aa949e
      DIAGNOSTIC_RUN: "31362028270"
      DIAGNOSTIC_JOB: "93372613233"
      DIAGNOSTIC_ARTIFACT: "9052755861"
      DIAGNOSTIC_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v6-repair2-diagnostics-31362028270-attempt-1
      DIAGNOSTIC_ARTIFACT_SHA256: 81774b1929e470254543ce14be0754f4d2fc8f7b60f9309e271bb3c0ab3e4b05
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      PRIOR_CUSTODY_IDENTITY: a999f0cf3c55cf11bb594ea388258700ef010aabb9974b6c6b853c151cdc7275
      COMMAND_IDENTITY: 60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf
      RECOVERY_IDENTITY: c09c5692102eabddf910b635155f64057e983bf70ea16e3ae19797cca4dc003e
      SELECTED_TASK: ap_8965086737382df0e88366db
      SELECTED_PERFORMER: Dan Starkey
      SELECTED_ROLE: Senstarg
      SELECTED_MODE: unresolved
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1","agent/doctor-who-cycle-012-preflight-v4","agent/doctor-who-cycle-012-preflight-v5","agent/doctor-who-cycle-012-preflight-v6","agent/doctor-who-cycle-012-preflight-v7"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"},{"pr":857,"branch":"agent/doctor-who-cycle-012-preflight-v4"},{"pr":858,"branch":"agent/doctor-who-cycle-012-preflight-v5"},{"pr":859,"branch":"agent/doctor-who-cycle-012-preflight-v6"},{"pr":860,"branch":"agent/doctor-who-cycle-012-preflight-v7"}]'
      OBSERVER_PRS_JSON: '[{"pr":855,"branch":"observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3"},{"pr":856,"branch":"observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4"}]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind clean adapter and exact failed diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,diagnostic,receipt,payload,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(git merge-base "$CLEANUP_MAIN" "$MAIN")" = "$CLEANUP_MAIN"
          test "$(git rev-list --count "$CLEANUP_MAIN".."$MAIN")" = 1
          test "$(git show -s --format=%T "$CLEANUP_MAIN")" = "$TREE"
          git diff --name-status "$CLEANUP_MAIN" "$MAIN" | LC_ALL=C sort > "$OUT/logs/cleanup-to-main.tsv"
          printf 'M\tdata/MEDIA-SEARCH-LATEST.json\nM\tdata/journal/media-search.jsonl\n' | LC_ALL=C sort > "$OUT/logs/expected-cleanup-to-main.tsv"
          cmp "$OUT/logs/cleanup-to-main.tsv" "$OUT/logs/expected-cleanup-to-main.tsv"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$DIAGNOSTIC_PR" > "$OUT/api/diagnostic-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN" > "$OUT/api/diagnostic-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN/jobs?per_page=100" > "$OUT/api/diagnostic-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTIC_ARTIFACT" > "$OUT/api/diagnostic-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTIC_ARTIFACT/zip" > "$OUT/source/diagnostic.zip"
          test "$(sha256sum "$OUT/source/diagnostic.zip" | awk '{print $1}')" = "$DIAGNOSTIC_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/diagnostic-artifact.json")" = "sha256:$DIAGNOSTIC_ARTIFACT_SHA256"

          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          api = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((api / name).read_text())
          carrier = load('carrier-pr.json')
          source_pr = load('diagnostic-pr.json')
          run = load('diagnostic-run.json')
          jobs = load('diagnostic-jobs.json')['jobs']
          artifact = load('diagnostic-artifact.json')
          assert carrier['number'] == int(os.environ['CARRIER_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CARRIER_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert source_pr['number'] == int(os.environ['DIAGNOSTIC_PR'])
          assert source_pr['state'] == 'closed' and source_pr['draft'] is True and source_pr['merged_at'] is None
          assert source_pr['base']['sha'] == os.environ['MAIN']
          assert source_pr['head']['ref'] == os.environ['DIAGNOSTIC_BRANCH'] and source_pr['head']['sha'] == os.environ['DIAGNOSTIC_HEAD']
          assert source_pr['commits'] == 3 and source_pr['changed_files'] == 3
          assert run['id'] == int(os.environ['DIAGNOSTIC_RUN'])
          assert run['head_sha'] == os.environ['DIAGNOSTIC_HEAD'] and run['head_branch'] == os.environ['DIAGNOSTIC_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          rows = [row for row in jobs if row['id'] == int(os.environ['DIAGNOSTIC_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['conclusion'] == 'failure'
          steps = {row['name']: row['conclusion'] for row in rows[0].get('steps', [])}
          assert steps['Recover and run lifecycle-neutral V6 selector'] == 'failure'
          assert artifact['id'] == int(os.environ['DIAGNOSTIC_ARTIFACT'])
          assert artifact['name'] == os.environ['DIAGNOSTIC_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['DIAGNOSTIC_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['DIAGNOSTIC_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['DIAGNOSTIC_HEAD']
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Authenticate the fully paid selector denominator
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/source/diagnostic.zip" TARGET="$OUT/diagnostic" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))

          candidate_paths = list(target.rglob('payload/candidates.json'))
          assert len(candidate_paths) == 1, [str(path) for path in candidate_paths]
          root = candidate_paths[0].parent.parent
          expected = {
              'payload/candidates.json': (104773, '1fe91fd261db35ca13ba1f0e3d1a4562e015011045ea35bfc58fc0296bfa98d0'),
              'receipt/autopilot-status.json': (427, '450e44de9ee5700d87e8fa123e5c51132be82b344bb4ec1d5cac088ce26adfd6'),
              'receipt/waterline-status.json': (2966, '515aae2f677e62305580ed45fe5848d5f2a1a9f675c67831231b7f954dc9fdf7'),
              'receipt/transport-custody.json': (5364, '60b5afee23db67ebd07e2a375bdb7ae3b6436c0fbb7a0bdb1cae738b320cb3de'),
              'receipt/terminal-proof.json': (2437, '44f06487171ae3389ade6e3378ff92007e3b05f827bbee69b5997535262ab522'),
              'receipt/selector-command.json': (644, '2d688b177bb51ebb04e35e72e4631c3b29ab3c3942fec38a33d8421e3d80d170'),
              'receipt/program-recovery.json': (3410, 'e996841a3578f53411aa99bc93e00a82298c99d5e098b9d5677ae7573fad8516'),
              'logs/complete-gate.log': (39744, '961f0bfa6e124a6dbe473ec029914443a64b6c566e3ab1762387cba525d8a1a7'),
              'logs/cycle-010.log': (135, '49b29636adef2bac6e400d1b40c0dad9121a9b494126d851f4068c8b126d7a8f'),
              'logs/cycle-011.log': (200, '963c33a1d9111f9588b0e7b54a9f4bd90c143892154195caab3cfc69c4c923f1'),
              'logs/media-gate.log': (285, '1daabdc1a07f2f867e06efe11f360c989a7175c53428ac1cc9f4a38adf19a8d3'),
              'logs/media-validate.log': (79, '4dd11fe74a4b513b82ca688548fcc1e947b42027af3058c70db6bd50bd29b48d'),
              'logs/waterline-validate.log': (79, 'edb3d89ef58adad3f471ffebf66cd525ae79820ba7eb41d326587c46cf3c76c1'),
              'logs/autopilot.log': (89, '8571d7c9e0bb0437373e89398b53461de0e4818430623b888fce263cf0632a0f'),
              'logs/cleanup-to-current.tsv': (66, 'defda11c3a35305cad2d2402c10b7cf4131e999b5e54dc7dba9a3ad1b41e1a17'),
              'logs/expected-cleanup-to-current.tsv': (66, 'defda11c3a35305cad2d2402c10b7cf4131e999b5e54dc7dba9a3ad1b41e1a17'),
              'logs/carrier.tsv': (189, '22a7b1aa6eea0061ce00aee4791b9368e803e65740855699eb71f57643f12899'),
              'logs/expected-carrier.tsv': (189, '22a7b1aa6eea0061ce00aee4791b9368e803e65740855699eb71f57643f12899'),
              'source/selector-command.sh': (147, '02306f7b765078c44724a1abda6351aa6c56792ac87da0b695d3af7bb676a895'),
          }
          for rel, (size, digest) in expected.items():
              path = root / rel
              assert path.is_file(), rel
              data = path.read_bytes()
              assert len(data) == size and sha(data) == digest, (rel, len(data), sha(data))
          assert (root / 'logs/cleanup-to-current.tsv').read_bytes() == (root / 'logs/expected-cleanup-to-current.tsv').read_bytes()
          assert (root / 'logs/carrier.tsv').read_bytes() == (root / 'logs/expected-carrier.tsv').read_bytes()
          assert 'gate: PASS — 26 step(s) in 117s' in (root / 'logs/complete-gate.log').read_text()
          assert '22/22 complete' in (root / 'logs/media-gate.log').read_text()

          def load(rel):
              return json.loads((root / rel).read_text())
          def verify_identity(data, expected_identity):
              identity = data.pop('identity')
              assert identity == expected_identity
              assert sha(json.dumps(data, sort_keys=True, separators=(',', ':')).encode()) == identity
              data['identity'] = identity
              return data

          proof = verify_identity(load('receipt/terminal-proof.json'), os.environ['PROOF_IDENTITY'])
          prior_custody = verify_identity(load('receipt/transport-custody.json'), os.environ['PRIOR_CUSTODY_IDENTITY'])
          command = verify_identity(load('receipt/selector-command.json'), os.environ['COMMAND_IDENTITY'])
          recovery = verify_identity(load('receipt/program-recovery.json'), os.environ['RECOVERY_IDENTITY'])
          autopilot = load('receipt/autopilot-status.json')
          waterline = load('receipt/waterline-status.json')
          candidates = load('payload/candidates.json')

          assert proof['status'] == 'cycle-011-rastel-terminal-cleanup-independently-proved-v1'
          assert proof['canonical']['main'] == os.environ['CLEANUP_MAIN']
          assert proof['canonical']['tree'] == os.environ['TREE']
          assert proof['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert proof['media'] == {'complete': 22, 'total': 22, 'debt': 0}
          assert all(proof['gates'].values())
          assert proof['authority']['cycle_012_selection_authorized'] is True
          assert proof['authority']['cycle_012_lease_issued'] is False
          assert proof['authority']['cycle_012_product_authority'] is False
          assert prior_custody['status'] == 'cycle-012-preselection-transport-custody-frozen-v3'
          assert prior_custody['canonical_main'] == os.environ['MAIN']
          assert prior_custody['counts'] == {'stale_cycle12_refs': 10, 'observer_refs': 2, 'refs_to_delete': 12, 'pull_requests': 10}
          assert prior_custody['boundary']['lease_issued'] is False
          assert command['status'] == 'cycle-012-selector-command-recovered-v1'
          assert command['active_profile'] == 'text-vision'
          assert command['command'] == 'node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile text-vision --limit 200 --json'
          assert recovery['status'] == 'cycle-012-preflight-v6-repair2-source-recovered-v1'
          assert autopilot == {
              'version': 1,
              'updated_at': '2026-08-09T16:41:00.000Z',
              'coverage_sha256': '605cf86fcf22a22c2563cdb1fc66995e2a509f487971a312897f9f75cef25b0e',
              'total': 316,
              'claimable': 305,
              'in_flight': 0,
              'expired_leases': 0,
              'statuses': {'queued': 305, 'resolved': 11},
              'scopes': {'doctor-who': {'total': 316, 'statuses': {'queued': 305, 'resolved': 11}}},
          }
          assert waterline['scope_id'] == 'doctor-who' and waterline['phase'] == 'ready-for-cycle'
          assert waterline['claim_allowed'] is True and waterline['claim_reasons'] == []
          assert waterline['media']['total'] == 22 and waterline['media']['complete'] == 22 and waterline['media']['debt'] == 0
          assert waterline['jobs']['total'] == 316 and waterline['jobs']['in_flight'] == 0
          assert waterline['jobs']['statuses'] == {'queued': 305, 'resolved': 11}
          assert waterline['cycles']['unreceipted'] == []
          assert candidates['version'] == 1 and candidates['scope_id'] == 'doctor-who'
          assert candidates['profile']['id'] == 'text-vision' and candidates['profile']['status'] == 'active'
          assert candidates['counts'] == {'compatible': 305, 'incompatible': 0}
          assert isinstance(candidates['compatible'], list) and len(candidates['compatible']) == 305
          assert candidates.get('incompatible', []) == []
          assert len({row['task_id'] for row in candidates['compatible']}) == 305
          selected = candidates['compatible'][0]
          assert selected == {
              'task_id': os.environ['SELECTED_TASK'],
              'performer': os.environ['SELECTED_PERFORMER'],
              'character': os.environ['SELECTED_ROLE'],
              'priority': 800,
              'performance_modes': [os.environ['SELECTED_MODE']],
              'required_capabilities': [],
              'missing_capabilities': [],
              'attention': None,
              'reasons': [],
              'sources': ['https://tardis.fandom.com/wiki/Senstarg'],
              'source_fingerprint': '4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2',
          }
          paid = {
              'status': 'cycle-012-selector-paid-denominator-authenticated-v1',
              'version': 1,
              'diagnostic': {
                  'pr': int(os.environ['DIAGNOSTIC_PR']),
                  'head': os.environ['DIAGNOSTIC_HEAD'],
                  'run': int(os.environ['DIAGNOSTIC_RUN']),
                  'job': int(os.environ['DIAGNOSTIC_JOB']),
                  'artifact': int(os.environ['DIAGNOSTIC_ARTIFACT']),
                  'artifact_sha256': os.environ['DIAGNOSTIC_ARTIFACT_SHA256'],
              },
              'paid': {
                  'terminal_proof_identity': proof['identity'],
                  'prior_transport_custody_identity': prior_custody['identity'],
                  'selector_command_identity': command['identity'],
                  'program_recovery_identity': recovery['identity'],
                  'complete_rendered_gate': True,
                  'media_22_of_22': True,
                  'queue': {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0},
                  'candidate_count': 305,
              },
              'selected_task': selected,
              'boundary': {
                  'adapter_only': True,
                  'repository_write': False,
                  'canonical_mutation': False,
                  'transport_mutation': False,
                  'lease_issued': False,
                  'cycle_012_product_authority': False,
              },
          }
          paid['identity'] = sha(json.dumps(paid, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          out = Path(os.environ['OUT'])
          (out / 'receipt/paid-denominator.json').write_text(json.dumps(paid, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (out / 'payload/selected-task.json').write_text(json.dumps(selected, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY

      - name: Freeze current exact transport custody without writing
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/cycle12-refs.json"
          for number in 793 794 795 796 797 798 857 858 859 860 855 856; do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number.json"
          done
          for branch in observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3 observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4; do
            key="$(printf '%s' "$branch" | tr '/-' '__')"
            gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > "$OUT/api/ref-$key.json"
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          stale = json.loads(os.environ['STALE_BRANCHES_JSON'])
          stale_pr_specs = json.loads(os.environ['STALE_PRS_JSON'])
          observer_specs = json.loads(os.environ['OBSERVER_PRS_JSON'])
          raw = json.loads((api / 'cycle12-refs.json').read_text())
          refs = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in raw]
          by_branch = {row['branch']: row['head'] for row in refs}
          expected = set(stale) | {os.environ['BRANCH']}
          observed = set(by_branch)
          assert observed == expected, {'extra': sorted(observed - expected), 'missing': sorted(expected - observed)}
          stale_refs = [{'branch': branch, 'head': by_branch[branch], 'kind': 'stale-cycle-012'} for branch in sorted(stale)]
          pull_rows = []
          for spec in stale_pr_specs:
              pr = json.loads((api / f"pr-{spec['pr']}.json").read_text())
              assert pr['number'] == spec['pr']
              assert pr['head']['ref'] == spec['branch'] and pr['head']['sha'] == by_branch[spec['branch']]
              assert pr['draft'] is True and pr['merged_at'] is None
              assert pr['state'] in {'open', 'closed'}
              pull_rows.append({'pr': pr['number'], 'branch': spec['branch'], 'head': pr['head']['sha'], 'action': 'close_without_merge' if pr['state'] == 'open' else 'none'})
          observer_refs = []
          for spec in observer_specs:
              pr = json.loads((api / f"pr-{spec['pr']}.json").read_text())
              key = spec['branch'].replace('/', '__').replace('-', '_')
              ref = json.loads((api / f'ref-{key}.json').read_text())
              head = ref['object']['sha']
              assert pr['number'] == spec['pr'] and pr['head']['ref'] == spec['branch'] and pr['head']['sha'] == head
              assert pr['draft'] is True and pr['merged_at'] is None and pr['state'] in {'open', 'closed'}
              observer_refs.append({'branch': spec['branch'], 'head': head, 'kind': 'terminal-proof-observer'})
              pull_rows.append({'pr': pr['number'], 'branch': spec['branch'], 'head': head, 'action': 'close_without_merge' if pr['state'] == 'open' else 'none'})
          assert len(stale_refs) == 12 and len(observer_refs) == 2
          assert len(pull_rows) == 12 and len({row['pr'] for row in pull_rows}) == 12
          paid = json.loads((root / 'receipt/paid-denominator.json').read_text())
          custody = {
              'status': 'cycle-012-preselection-transport-custody-frozen-v4',
              'version': 4,
              'canonical_main': os.environ['MAIN'],
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'selector': {'pr': int(os.environ['CARRIER_PR']), 'branch': os.environ['BRANCH'], 'head': os.environ['CARRIER_HEAD']},
              'paid_denominator_identity': paid['identity'],
              'refs_to_delete': stale_refs + observer_refs,
              'pull_requests': sorted(pull_rows, key=lambda row: row['pr']),
              'counts': {'stale_cycle12_refs': 12, 'observer_refs': 2, 'refs_to_delete': 14, 'pull_requests': 12},
              'boundary': {
                  'selection_required_before_write': True,
                  'exact_heads_frozen': True,
                  'repository_write': False,
                  'force_update': False,
                  'merge': False,
                  'main_mutation': False,
                  'lease_issued': False,
                  'cycle_012_product_authority': False,
              },
          }
          custody['identity'] = hashlib.sha256(json.dumps(custody, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'payload/transport-custody.json').write_text(json.dumps(custody, indent=2, sort_keys=True) + '\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal exact cycle 012 selection adapter receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          paid = json.loads((root / 'receipt/paid-denominator.json').read_text())
          custody = json.loads((root / 'payload/transport-custody.json').read_text())
          selected = json.loads((root / 'payload/selected-task.json').read_text())
          receipt = {
              'status': 'cycle-012-doctor-who-selector-qualified-v8',
              'version': 8,
              'carrier': {'pr': int(os.environ['CARRIER_PR']), 'head': os.environ['CARRIER_HEAD'], 'base': os.environ['MAIN'], 'branch': os.environ['BRANCH']},
              'canonical_main': os.environ['MAIN'],
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'paid_denominator': {'identity': paid['identity'], 'diagnostic': paid['diagnostic'], 'complete_rendered_gate': True},
              'transport_custody': {'identity': custody['identity'], 'refs_to_delete': custody['counts']['refs_to_delete'], 'pull_requests': custody['counts']['pull_requests']},
              'queue': {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0},
              'selected_task_id': selected['task_id'],
              'selected_task': selected,
              'normalized': {'performer': selected['performer'], 'role': selected['character'], 'mode': selected['performance_modes'][0], 'modes': selected['performance_modes']},
              'boundary': {
                  'selection_only': True,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'canonical_mutated': False,
                  'transport_mutation': False,
                  'wall_created': False,
                  'media_adopted': False,
                  'cycle_receipt_written': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          assert receipt['selected_task_id'] == os.environ['SELECTED_TASK']
          assert receipt['normalized'] == {'performer': os.environ['SELECTED_PERFORMER'], 'role': os.environ['SELECTED_ROLE'], 'mode': os.environ['SELECTED_MODE'], 'modes': [os.environ['SELECTED_MODE']]}
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (root / 'payload/selection.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'payload/SELECTION_COMPLETE').write_text(receipt['identity'] + '\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v8/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v8-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v8
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
