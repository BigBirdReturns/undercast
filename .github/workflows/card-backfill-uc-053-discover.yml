name: card-backfill-uc-053-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-053.json"
      - "scripts/card-backfill-uc-053-discover.mjs"
      - ".github/workflows/card-backfill-uc-053-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-053-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-007'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Install deterministic review-sheet renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
          montage -version | head -n 2
      - name: Verify exact UC-053 audit and discovery boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-053.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const record=specimens.find(row=>row.id==='UC-053');
          const item=(audit.items||[]).find(row=>row.id==='ma_9b741f7fe89dac87a1cfd255');
          if(control.version!==1||control.record_id!=='UC-053'||control.actor!=='Gary Oldman'||control.side!=='still')throw new Error('UC-053 control drift');
          if(!record||record.actor!=='Gary Oldman'||record.character!=='Dracula'||record.still)throw new Error('UC-053 canonical still boundary changed');
          if(!item||item.wall_id!=='UC-053'||item.side!=='still'||item.status!=='absent'||item.expected_subject!=='Dracula'||item.asset)throw new Error('UC-053 audit boundary changed');
          if(!Array.isArray(control.sources)||control.sources.length!==12)throw new Error('UC-053 source orbit must retain twelve exact lanes');
          if(control.sources.filter(row=>row.type==='imdb-media').some(row=>!/rm\d+/.test(row.media_id||'')))throw new Error('UC-053 IMDb media IDs incomplete');
          console.log('PASS — UC-053 remains a source-declared Dracula still absence with twelve exact discovery lanes');
          NODE
      - name: Gather, hash and build the Dracula review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-053
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-053-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-053.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages, hashes and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-053-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-053
            ${{ runner.temp }}/card-backfill-uc-053.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
