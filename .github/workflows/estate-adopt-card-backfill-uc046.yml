name: estate-adopt-card-backfill-uc046

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-card-backfill-uc046.yml
      - scripts/estate-adopt-card-backfill-packet.mjs
      - scripts/estate-adopt-card-backfill-packet-fixtures.mjs
      - data/review/estate-debt/COLLECT-003-IDENTITY-CORRECTION.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-card-backfill-uc046
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RECORD_ID: UC-046
  SIDE: still
  PACKET_ROOT: data/review/card-backfill/UC-046
  EXPECTED_SHA: 3047a7e99fbbb293bc67cf4731acfa56434adae90b342d9d100b0a669d8196
  RECEIPT: data/review/estate-debt/COLLECT-003-UC-046-STILL-ADOPTION.json
  CANDIDATE_RECEIPT: /tmp/COLLECT-003-UC-046-STILL-CANDIDATE.json

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head custody
        id: custody
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git rev-parse HEAD)"
          test "$CURRENT_HEAD" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          REMOTE_HEAD="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          test "$REMOTE_HEAD" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          echo "head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"

      - name: Announce corrected adoption candidate
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-003 UC-046 still candidate construction started on workflow run $GITHUB_RUN_ID.

          Authorized branch head: ${{ steps.custody.outputs.head }}.
          Correct subject: Lon Chaney as The Phantom in The Phantom of the Opera (1925).
          Exact packet candidate SHA-256: $EXPECTED_SHA.

          The transaction will create the structured canonical candidate, rebuild generated truth, and run the complete canonical smoke before any acceptance receipt exists. It will publish only if post-smoke validation and the exact-head lease pass.
          EOF_COMMENT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove smoke-first adoption fixtures
        run: node scripts/estate-adopt-card-backfill-packet-fixtures.mjs

      - name: Capture exact pre-adoption quality
        run: cp data/quality.json /tmp/COLLECT-003-quality-before.json

      - name: Prove corrected packet and absent canonical target
        run: |
          set -euo pipefail
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            | tee /tmp/COLLECT-003-preflight.json

      - name: Materialize structured canonical candidate without acceptance receipt
        run: |
          set -euo pipefail
          trap 'git reset --hard "$AUTHORIZED_HEAD"; git clean -fd' ERR
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            --authorized-parent "$AUTHORIZED_HEAD" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --now "$NOW" \
            --write
          test ! -e "$RECEIPT"
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --validate

      - name: Rebuild audit, serving projections, quality, and route
        run: |
          set -euo pipefail
          npm run media:audit -- sync
          node scripts/shard.mjs
          node scripts/build-record-pages.mjs
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --validate

      - name: Refuse mutation outside canonical and generated surfaces
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
          test -n "$CHANGED"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              data/*|records/*|images/uc-046-still.jpg) ;;
              *) echo "Unexpected adoption path: $changed_path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          test ! -e "$RECEIPT"

      - name: Snapshot complete candidate tree for smoke
        id: candidate
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-status
          git diff --cached --binary > /tmp/COLLECT-003-UC-046-candidate.patch
          git write-tree > /tmp/COLLECT-003-UC-046-candidate.tree
          git diff --cached --quiet && { echo 'Canonical candidate produced no staged change.' >&2; exit 1; }
          echo "tree=$(cat /tmp/COLLECT-003-UC-046-candidate.tree)" >> "$GITHUB_OUTPUT"

      - name: Run complete canonical smoke on candidate tree
        run: npm run gate

      - name: Revalidate exact target after complete smoke
        run: |
          set -euo pipefail
          git diff --exit-code
          PRE_TREE="$(cat /tmp/COLLECT-003-UC-046-candidate.tree)"
          POST_TREE="$(git write-tree)"
          test "$PRE_TREE" = "$POST_TREE"
          test ! -e "$RECEIPT"
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --validate

      - name: Promote acceptance receipt only after smoke passes
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CANDIDATE_TREE="$(cat /tmp/COLLECT-003-UC-046-candidate.tree)"
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --candidate-receipt "$CANDIDATE_RECEIPT" \
            --receipt "$RECEIPT" \
            --quality-before /tmp/COLLECT-003-quality-before.json \
            --quality-after data/quality.json \
            --workflow-run "$GITHUB_RUN_ID" \
            --candidate-tree "$CANDIDATE_TREE" \
            --now "$NOW" \
            --promote
          node scripts/estate-adopt-card-backfill-packet.mjs \
            --record "$RECORD_ID" \
            --side "$SIDE" \
            --packet-root "$PACKET_ROOT" \
            --expected-sha "$EXPECTED_SHA" \
            --receipt "$RECEIPT" \
            --validate
          git add -- "$RECEIPT"
          git diff --exit-code
          PROMOTION_PATHS="$(git diff --cached --name-only "$CANDIDATE_TREE")"
          test "$PROMOTION_PATHS" = "$RECEIPT"
          git diff --cached --binary > /tmp/COLLECT-003-UC-046-adoption.patch
          git write-tree > /tmp/COLLECT-003-UC-046-adoption.tree

      - name: Refuse stale target publication
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          REMOTE_HEAD="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          test "$REMOTE_HEAD" = "$AUTHORIZED_HEAD"

      - name: Commit and publish exact smoke-passed adoption
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE_TREE="$(cat /tmp/COLLECT-003-UC-046-candidate.tree)"
          FINAL_TREE="$(cat /tmp/COLLECT-003-UC-046-adoption.tree)"
          RECEIPT_SHA="$(node -p "require('./$RECEIPT').receipt_sha256")"
          git commit -m "Estate collection: adopt smoke-passed UC-046 Phantom still" \
            -m "record=${RECORD_ID}/${SIDE}" \
            -m "candidate_sha256=${EXPECTED_SHA}" \
            -m "complete_pairs_delta=1" \
            -m "missing_still_delta=-1" \
            -m "receipt_sha256=${RECEIPT_SHA}" \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_candidate_tree=${CANDIDATE_TREE}" \
            -m "published_tree=${FINAL_TREE}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report successful canonical payment
        if: success()
        run: |
          PUBLISHED_HEAD="$(git rev-parse HEAD)"
          CANDIDATE_TREE="$(cat /tmp/COLLECT-003-UC-046-candidate.tree)"
          FINAL_TREE="$(cat /tmp/COLLECT-003-UC-046-adoption.tree)"
          BEFORE_PAIRS="$(node -p "require('/tmp/COLLECT-003-quality-before.json').metrics.complete_pairs")"
          AFTER_PAIRS="$(node -p "require('./data/quality.json').metrics.complete_pairs")"
          BEFORE_MISSING="$(node -p "require('/tmp/COLLECT-003-quality-before.json').metrics.missing_still")"
          AFTER_MISSING="$(node -p "require('./data/quality.json').metrics.missing_still")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-003 UC-046 still passed complete smoke and was canonically adopted on workflow run $GITHUB_RUN_ID.

          Subject: Lon Chaney as The Phantom in The Phantom of the Opera (1925).
          Candidate SHA-256: $EXPECTED_SHA.
          Authorized parent: $AUTHORIZED_HEAD.
          Published commit: $PUBLISHED_HEAD.
          Gated candidate tree: $CANDIDATE_TREE.
          Published tree with post-smoke receipt: $FINAL_TREE.
          Complete pairs: $BEFORE_PAIRS → $AFTER_PAIRS.
          Missing stills: $BEFORE_MISSING → $AFTER_MISSING.

          The acceptance receipt did not exist in the candidate tree. It was created only after the complete canonical gate, rendered-browser checks, post-smoke target validation, measured quality reconciliation, and exact-head publication lease passed. This claims one canonical adoption on the consolidation branch. It does not claim merge to main or live deployment.
          EOF_COMMENT

      - name: Report failed canonical candidate
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-003 UC-046 still candidate failed on workflow run $GITHUB_RUN_ID.

          Correct target: Lon Chaney as The Phantom in The Phantom of the Opera (1925).
          Authorized parent: ${{ steps.custody.outputs.head || env.AUTHORIZED_HEAD }}.
          Exact candidate SHA-256: $EXPECTED_SHA.

          No canonical acceptance claim is authorized. A candidate may be repaired with stronger or additional data, but no acceptance receipt may be promoted until the complete smoke, target validation, quality reconciliation, and exact-head lease pass.
          EOF_COMMENT

      - name: Preserve exact candidate and adoption artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-003-UC-046-still-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-003-preflight.json
            /tmp/COLLECT-003-quality-before.json
            /tmp/COLLECT-003-UC-046-STILL-CANDIDATE.json
            /tmp/COLLECT-003-UC-046-candidate.patch
            /tmp/COLLECT-003-UC-046-candidate.tree
            /tmp/COLLECT-003-UC-046-adoption.patch
            /tmp/COLLECT-003-UC-046-adoption.tree
            data/review/estate-debt/COLLECT-003-IDENTITY-CORRECTION.json
            data/review/estate-debt/COLLECT-003-UC-046-STILL-ADOPTION.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
