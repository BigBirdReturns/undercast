name: record-tosk-cycle

on:
  push:
    branches: [agent/star-trek-gold-completion]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: record-tosk-cycle
  cancel-in-progress: false

jobs:
  receipt:
    if: github.ref == 'refs/heads/agent/star-trek-gold-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-gold-completion
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify the terminal lease and record its reviewed receipt
        run: |
          set -euo pipefail
          mkdir -p .waterline cycle-receipt
          node scripts/waterline.mjs status --scope star-trek --json > cycle-receipt/before.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const before=JSON.parse(await readFile('cycle-receipt/before.json','utf8'));
          const lease=before.cycles.unreceipted.find(row=>row.lease_id==='lease_caac98ab2c967572183445c9');
          if(before.phase!=='receipt-required') throw new Error(`expected receipt-required, got ${before.phase}`);
          if(!lease||lease.task_statuses?.ap_525b90d304dca267e9231889!=='resolved') throw new Error('Tosk lease is not terminal and resolved');
          if(before.media.debt!==0) throw new Error('Tosk cycle left media debt');
          NODE
          cat > .waterline/cycle.json <<'JSON'
          {
            "version": 1,
            "scope_id": "star-trek",
            "lease_id": "lease_caac98ab2c967572183445c9",
            "outcome": "completed",
            "reviewed_by": "chatgpt-second-desk",
            "reviewed_role": "second-desk",
            "reviewed_at": "2026-07-24T15:25:00.000Z",
            "note": "The durable Tosk lease resumed from committed state, added UC-1279, rejected the character image misfiled as a performer portrait, returned all 752 Star Trek media facets to verified or honestly absent, resolved the task, and passed the complete canonical gate before publication.",
            "evidence": [
              {"type":"workflow-run","value":"Tosk process run 30079258879, exact-source evidence run 30079435900, and the self-cleaning finish-tosk-cycle branch-push gate that published commit 061de5a2efc0b1959352558dfe50b4ff63bb2f16"},
              {"type":"commit","value":"061de5a2efc0b1959352558dfe50b4ff63bb2f16"},
              {"type":"restart-proof","value":"Lease lease_caac98ab2c967572183445c9 was committed in data/review/trek-cycle-002-tosk-lease.json before process run 30079258879 resumed it"}
            ]
          }
          JSON
          node scripts/waterline.mjs record-cycle --input .waterline/cycle.json
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > cycle-receipt/after.json
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const after=JSON.parse(await readFile('cycle-receipt/after.json','utf8'));
          if(after.phase!=='ready-for-cycle'||!after.claim_allowed) throw new Error(`post-receipt waterline is ${after.phase}`);
          if(after.cycles.successful_receipts!==2||after.cycles.unreceipted.length!==0) throw new Error('Tosk receipt did not produce exactly two successful cycles and zero unreceipted leases');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: trek-cycle-002-tosk-receipt
          path: cycle-receipt
          if-no-files-found: error
          retention-days: 30
      - name: Publish the durable receipt and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm -rf .waterline cycle-receipt
          rm -f .github/workflows/record-tosk-cycle.yml
          git config user.name 'undercast-cycle-operator'
          git config user.email 'undercast-cycle-operator@users.noreply.github.com'
          git add data/WATERLINE-STATE.json data/journal/waterline.jsonl .github/workflows/record-tosk-cycle.yml
          git diff --cached --check
          git commit -m 'Cycle 2: receipt the completed Tosk loop'
          git push origin HEAD:agent/star-trek-gold-completion
