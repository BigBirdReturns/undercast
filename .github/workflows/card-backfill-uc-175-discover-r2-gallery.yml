name: card-backfill-uc-175-discover-r2-gallery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-175-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-175-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-175-discover-r2-gallery.mjs"
      - ".github/workflows/card-backfill-uc-175-discover-r2-gallery.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-175-discover-r2-gallery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-039'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-039
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify failed visual checkpoint and exact R2-D2 gallery repair boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-175-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-175-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-175');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-175');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4f6f8c344e4fe375194d8f22');
          const failed=failures.failed_discovery_checkpoints?.[0];
          if(row.version!==1||row.record_id!=='UC-175'||row.actor!=='Ben Burtt'||row.character!=='The voices of R2-D2 & WALL·E'||row.production!=='Star Wars / WALL·E'||row.years!=='1977–'||row.side!=='still')throw new Error('UC-175 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8734947403||row.scope_artifact?.artifact_id!==8735112701||row.scope_artifact?.scope_sha256!=='1304300caac883990f9a03dcd0605e7f0f345ed4e4483339336ba2e2109e3ac0')throw new Error('UC-175 upstream custody drift');
          if(failures.version!==1||failures.record_id!=='UC-175'||failures.failed_discovery_checkpoints?.length!==1)throw new Error('UC-175 failure ledger drift');
          if(failed?.run_id!==30480498637||failed?.artifact_id!==8735470319||failed?.head_sha!=='fc17835fe99562c8ca62c9f182c3a9acb009554c'||failed?.artifact_digest_sha256!=='e8f682cf8747ea805047e1c392c08ac2d3ac0b5d96d6d46b339aa37b50567ab1')throw new Error('UC-175 failed artifact custody drift');
          if(failed?.manifest_sha256!=='b2eb1f39fb9de178beec73f70fbb876d04045ffe70f184e564276eea0be2ff9b'||failed?.selected_r2d2_sha256!=='08016e63cbed95fec653e31b3ab94555e9cf223b62fb7ac3a634d542feb1f981'||failed?.accepted_walle_sha256!=='d93d4066c4b72e0e2323ca7e9f294bd349a9142d6e356950a115c35471109c15')throw new Error('UC-175 failed selection byte custody drift');
          if(failures.repair_boundary?.official_starwars_biography_gallery_only!==true||failures.repair_boundary?.allowed_image_host!=='lumiere-a.akamaihd.net'||failures.repair_boundary?.general_source_floor_unchanged!==true||failures.repair_boundary?.r2d2_dome_torso_side_legs_center_foot_and_complete_silhouette_required!==true||failures.repair_boundary?.visual_second_desk_required_before_render!==true||failures.repair_boundary?.canonical_mutation!==false)throw new Error('UC-175 repair boundary drift');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-175-portrait.jpg'||!source||source.still||source.portrait?.src!=='images/uc-175-portrait.jpg'||!audit||audit.status!=='absent'||audit.asset)throw new Error('UC-175 canonical boundary drift');
          console.log('PASS — UC-175 failed visual checkpoint retained and official R2-D2 gallery repair authorized');
          NODE
      - name: Gather the official R2-D2 Biography Gallery orbit
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-175-r2-gallery
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-175-discover-r2-gallery.mjs
          node scripts/card-backfill-uc-175-discover-r2-gallery.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-175-r2-gallery-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload failed-checkpoint custody, official gallery candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-175-r2-gallery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-175-r2-gallery
            ${{ runner.temp }}/card-backfill-uc-175-r2-gallery-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
