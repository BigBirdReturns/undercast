name: doctor-who-cycle-012-preflight-v13

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v13.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v13
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v13'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-preflight-v13
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v13.yml
      WRAP: /tmp/doctor-who-cycle-012-preflight-v13-wrapper
      OUT: /tmp/doctor-who-cycle-012-preflight-v13
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      V12_PR: "865"
      V12_HEAD: 1bd7c7ea15daa654817aefebe95a275e0165ed64
      V12_BRANCH: agent/doctor-who-cycle-012-preflight-v12
      V12_RUN: "31365527947"
      V12_JOB: "93382971259"
      V12_ARTIFACT: "9053984574"
      V12_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v12-diagnostics-31365527947-attempt-1
      V12_ARTIFACT_BYTES: "26483"
      V12_ARTIFACT_SHA256: a6c603c800d01f1c868b8fffe71065d9915408c167f33fe9ae37cde9ba405d24
      V12_ARTIFACT_FILES: "3"
      V12_CARRIER_B64_BYTES: "6840"
      V12_CARRIER_B64_SHA256: 56f90859f12583a499134b8b01adb76bdaa11ba2b8bd745b582a35541a7b55fc
      V12_CARRIER_GZIP_BYTES: "5128"
      V12_CARRIER_GZIP_SHA256: 841aa6453e56e41344940a0ed9affb4e7e5df413d32f2334c3cdee48120f9fd5
      V12_CARRIER_BYTES: "13879"
      V12_CARRIER_SHA256: 8850785fb7821d40687e0b722bd7be37b477e7830e71e5e1049a2d6c9fdf530b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind V12 geometry failure and execute exact V13 repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WRAP" "$OUT" \
            /tmp/doctor-who-cycle-012-preflight-v13-source \
            /tmp/doctor-who-cycle-012-preflight-v13-runner \
            /tmp/doctor-who-cycle-012-preflight-v13-v10-failure \
            /tmp/doctor-who-cycle-012-preflight-v13-v11-failure
          mkdir -p "$WRAP"/{api,extracted,logs,receipt}

          test "$CURRENT_BASE" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          git diff --name-status "$MAIN"...HEAD > "$WRAP/logs/carrier.tsv"
          printf 'A\t%s\n' "$SELF" > "$WRAP/logs/expected-carrier.tsv"
          cmp "$WRAP/logs/carrier.tsv" "$WRAP/logs/expected-carrier.tsv"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V12_PR" > "$WRAP/api/v12-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V12_RUN" > "$WRAP/api/v12-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V12_RUN/jobs?per_page=100" > "$WRAP/api/v12-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V12_ARTIFACT" > "$WRAP/api/v12-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V12_ARTIFACT/zip" > "$WRAP/v12-diagnostics.zip"
          test "$(sha256sum "$WRAP/v12-diagnostics.zip" | awk '{print $1}')" = "$V12_ARTIFACT_SHA256"

          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['WRAP'])
          api = root / 'api'
          load = lambda name: json.loads((api / name).read_text())
          pr = load('v12-pr.json')
          run = load('v12-run.json')
          jobs = load('v12-jobs.json')['jobs']
          artifact = load('v12-artifact.json')

          assert pr['number'] == int(os.environ['V12_PR'])
          assert pr['state'] in {'open', 'closed'} and pr['draft'] is True and pr['merged_at'] is None
          assert pr['base']['sha'] == os.environ['MAIN']
          assert pr['head']['ref'] == os.environ['V12_BRANCH'] and pr['head']['sha'] == os.environ['V12_HEAD']
          assert pr['commits'] == 1 and pr['changed_files'] == 1

          assert run['id'] == int(os.environ['V12_RUN'])
          assert run['head_sha'] == os.environ['V12_HEAD'] and run['head_branch'] == os.environ['V12_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          rows = [row for row in jobs if row['id'] == int(os.environ['V12_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'failure'
          steps = rows[0]['steps']
          target = [row for row in steps if row['name'] == 'Reconstruct and execute exact V12 padding repair']
          assert len(target) == 1 and target[0]['status'] == 'completed' and target[0]['conclusion'] == 'failure'
          uploads = [(row['status'], row['conclusion']) for row in steps if row['name'] == 'Run actions/upload-artifact@v4']
          assert uploads == [('completed', 'skipped'), ('completed', 'success')], uploads

          assert artifact['id'] == int(os.environ['V12_ARTIFACT'])
          assert artifact['name'] == os.environ['V12_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['V12_ARTIFACT_BYTES'])
          assert artifact['digest'] == 'sha256:' + os.environ['V12_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['V12_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['V12_HEAD']

          destination = root / 'extracted'
          with zipfile.ZipFile(root / 'v12-diagnostics.zip') as archive:
              infos = archive.infolist()
              assert len({row.filename for row in infos}) == len(infos)
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  target_path = destination.joinpath(*path.parts)
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  target_path.write_bytes(archive.read(info))

          files = sorted(path.relative_to(destination).as_posix() for path in destination.rglob('*') if path.is_file())
          expected = [
              'doctor-who-cycle-012-preflight-v12-carrier/carrier.sh',
              'doctor-who-cycle-012-preflight-v12-carrier/carrier.sh.gz',
              'doctor-who-cycle-012-preflight-v12-carrier/carrier.sh.gz.b64',
          ]
          assert files == expected and len(files) == int(os.environ['V12_ARTIFACT_FILES'])

          carrier_root = destination / 'doctor-who-cycle-012-preflight-v12-carrier'
          carrier = carrier_root / 'carrier.sh'
          gzip_path = carrier_root / 'carrier.sh.gz'
          b64_path = carrier_root / 'carrier.sh.gz.b64'
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert carrier.stat().st_size == int(os.environ['V12_CARRIER_BYTES'])
          assert digest(carrier) == os.environ['V12_CARRIER_SHA256']
          assert gzip_path.stat().st_size == int(os.environ['V12_CARRIER_GZIP_BYTES'])
          assert digest(gzip_path) == os.environ['V12_CARRIER_GZIP_SHA256']
          assert b64_path.stat().st_size == int(os.environ['V12_CARRIER_B64_BYTES'])
          assert digest(b64_path) == os.environ['V12_CARRIER_B64_SHA256']

          text = carrier.read_text()
          geometry_bug = "$'A\\\\t'"
          geometry_fix = "$'A\\t'"
          assert text.count(geometry_bug) == 1
          assert text.count(geometry_fix) == 0
          assert 'export BRANCH=agent/doctor-who-cycle-012-preflight-v12' in text
          assert 'export SELF=.github/workflows/doctor-who-cycle-012-preflight-v12.yml' in text

          receipt = {
              'status': 'cycle-012-selector-v12-carrier-geometry-failure-bound-v1',
              'version': 1,
              'source': {
                  'pr': int(os.environ['V12_PR']),
                  'branch': os.environ['V12_BRANCH'],
                  'head': os.environ['V12_HEAD'],
                  'run': int(os.environ['V12_RUN']),
                  'job': int(os.environ['V12_JOB']),
                  'artifact': int(os.environ['V12_ARTIFACT']),
                  'artifact_sha256': os.environ['V12_ARTIFACT_SHA256'],
              },
              'carrier': {
                  'bytes': carrier.stat().st_size,
                  'sha256': digest(carrier),
                  'diagnostic_files': len(files),
              },
              'failure': {
                  'stage': 'carrier-geometry',
                  'predicate': 'git diff name-status must contain an actual tab',
                  'observed_source_token': geometry_bug,
                  'required_source_token': geometry_fix,
                  'v11_diagnostics_read': False,
                  'selector_runner_reconstructed': False,
                  'selector_executed': False,
                  'selection_emitted': False,
              },
              'boundary': {
                  'repository_write': False,
                  'canonical_mutation': False,
                  'transport_mutation': False,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'cycle_receipt_written': False,
                  'cycle_012_product_authority': False,
              },
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt' / 'v12-failure.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path(os.environ['WRAP'])
          source = root / 'extracted/doctor-who-cycle-012-preflight-v12-carrier/carrier.sh'
          text = source.read_text()
          source_sha = hashlib.sha256(source.read_bytes()).hexdigest()
          assert source_sha == os.environ['V12_CARRIER_SHA256']

          replacements = [
              ('export BRANCH=agent/doctor-who-cycle-012-preflight-v12', 'export BRANCH=agent/doctor-who-cycle-012-preflight-v13'),
              ('export SELF=.github/workflows/doctor-who-cycle-012-preflight-v12.yml', 'export SELF=.github/workflows/doctor-who-cycle-012-preflight-v13.yml'),
              ('export OUT=/tmp/doctor-who-cycle-012-preflight-v12', 'export OUT=/tmp/doctor-who-cycle-012-preflight-v13'),
              ('export PACKET=/tmp/doctor-who-cycle-012-preflight-v12-source', 'export PACKET=/tmp/doctor-who-cycle-012-preflight-v13-source'),
              ('export SOURCE_ROOT=/tmp/doctor-who-cycle-012-preflight-v12-source/doctor-who-cycle-012-preflight-v6-repair2', 'export SOURCE_ROOT=/tmp/doctor-who-cycle-012-preflight-v13-source/doctor-who-cycle-012-preflight-v6-repair2'),
              ('export RUNNER_ROOT=/tmp/doctor-who-cycle-012-preflight-v12-runner', 'export RUNNER_ROOT=/tmp/doctor-who-cycle-012-preflight-v13-runner'),
              ('export FAILURE_ROOT=/tmp/doctor-who-cycle-012-preflight-v12-v10-failure', 'export FAILURE_ROOT=/tmp/doctor-who-cycle-012-preflight-v13-v10-failure'),
              ('export V11_FAILURE_ROOT=/tmp/doctor-who-cycle-012-preflight-v12-v11-failure', 'export V11_FAILURE_ROOT=/tmp/doctor-who-cycle-012-preflight-v13-v11-failure'),
              ("$'A\\\\t'", "$'A\\t'"),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new, 1)

          assert 'export BRANCH=agent/doctor-who-cycle-012-preflight-v13' in text
          assert 'export SELF=.github/workflows/doctor-who-cycle-012-preflight-v13.yml' in text
          assert "$'A\\\\t'" not in text
          assert text.count("$'A\\t'") == 1

          patched = root / 'patched-carrier.sh'
          patched.write_text(text)
          patched_sha = hashlib.sha256(patched.read_bytes()).hexdigest()
          repair = {
              'status': 'cycle-012-selector-v13-exact-carrier-repair-v1',
              'version': 1,
              'source': {'sha256': source_sha, 'bytes': source.stat().st_size},
              'patched': {'sha256': patched_sha, 'bytes': patched.stat().st_size},
              'replacements': {
                  'transport_rebindings': 8,
                  'geometry_tab_repairs': 1,
                  'total': len(replacements),
              },
              'semantics': {
                  'selector_runner_changed': False,
                  'source_packet_changed': False,
                  'selected_task_changed': False,
                  'lease_authority_changed': False,
                  'product_authority_changed': False,
              },
          }
          repair['identity'] = hashlib.sha256(json.dumps(repair, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt' / 'v13-repair.json').write_text(json.dumps(repair, indent=2, sort_keys=True) + '\n')

          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1):
              compile(block, f'<cycle-012-v13-carrier-{index}>', 'exec')
          PY

          bash -n "$WRAP/patched-carrier.sh"
          chmod 700 "$WRAP/patched-carrier.sh"
          "$WRAP/patched-carrier.sh"

          test -f "$OUT/payload/selection.json"
          test -f "$OUT/payload/SELECTION_COMPLETE"
          cp "$WRAP/receipt/v12-failure.json" "$OUT/payload/v12-failure.json"
          cp "$WRAP/receipt/v13-repair.json" "$OUT/payload/v13-repair.json"
          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          payload = Path(os.environ['OUT']) / 'payload'
          selection = json.loads((payload / 'selection.json').read_text())
          identity = selection.pop('identity')
          expected = hashlib.sha256(json.dumps(selection, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          assert identity == expected
          selection['identity'] = identity
          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert selection['carrier'] == {
              'pr': int(os.environ['CURRENT_PR']),
              'head': os.environ['CURRENT_HEAD'],
              'base': os.environ['MAIN'],
              'branch': os.environ['BRANCH'],
          }
          assert selection['selected_task_id'] == 'ap_8965086737382df0e88366db'
          assert selection['normalized'] == {'performer': 'Dan Starkey', 'role': 'Senstarg', 'mode': 'unresolved'}
          assert selection['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert selection['boundary'] == {
              'selection_only': True,
              'lease_issued': False,
              'queue_mutated': False,
              'canonical_mutated': False,
              'transport_mutation': False,
              'wall_created': False,
              'media_adopted': False,
              'cycle_receipt_written': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          assert (payload / 'SELECTION_COMPLETE').read_text() == identity + '\n'
          PY

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v13-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v13/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v13-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v13-wrapper
            /tmp/doctor-who-cycle-012-preflight-v13
            /tmp/doctor-who-cycle-012-preflight-v13-source
            /tmp/doctor-who-cycle-012-preflight-v13-runner
            /tmp/doctor-who-cycle-012-preflight-v13-v10-failure
            /tmp/doctor-who-cycle-012-preflight-v13-v11-failure
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
