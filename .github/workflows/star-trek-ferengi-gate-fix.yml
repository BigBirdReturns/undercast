name: star-trek-ferengi-gate-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-FERENGI-GATE-FIX.json"
      - ".github/workflows/star-trek-ferengi-gate-fix.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-ferengi-gate-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - name: Verify exact membership without conflating valid orders
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='tests/rendered/site.spec.mjs';
          let text=fs.readFileSync(path,'utf8');
          const before='  expect(names).toEqual(expected.names);';
          const after='  expect(names).toHaveLength(expected.names.length);\n  expect(new Set(names).size).toBe(names.length);\n  expect([...names].sort()).toEqual([...expected.names].sort());';
          if(!text.includes(before)) throw new Error('Ferengi rendered membership assertion drifted');
          text=text.replace(before,after);
          fs.writeFileSync(path,text);
          const commandPath='.github/STAR-TREK-FERENGI-SATURATE.json';
          const command=JSON.parse(fs.readFileSync(commandPath,'utf8'));
          command.gate_retry_at=new Date().toISOString();
          command.gate_retry_reason='Rendered test now checks exact membership and uniqueness without treating taxonomy order as display order.';
          fs.writeFileSync(commandPath,JSON.stringify(command,null,2)+'\n');
          NODE
          rm -f .github/STAR-TREK-FERENGI-GATE-FIX.json
          rm -f .github/workflows/star-trek-ferengi-gate-fix.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Population: test exact Ferengi membership independent of display order"
          git push origin HEAD:agent/star-trek-population-002
