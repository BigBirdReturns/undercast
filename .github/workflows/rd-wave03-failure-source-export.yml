name: RD-W03 failure source export

on:
  pull_request:
    paths:
      - .github/workflows/rd-wave03-failure-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact affected permanent files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rd-wave03-failure-source"
          mkdir -p "$out/files"
          exec > >(tee "$out/export.log") 2>&1

          export_one() {
            local sha="$1"
            local path="$2"
            local dst="$out/files/$path"
            mkdir -p "$(dirname "$dst")"
            git show "$sha:$path" > "$dst"
            printf '%s  %s\n' "$(sha256sum "$dst" | awk '{print $1}')" "$path" >> "$out/sha256sums.txt"
          }

          export_one 6899a2d09c8ddd62a62ce22fc59557ea6fddf84b .github/workflows/rd-wave03-rd01-intake.yml
          export_one 134e7811419d20443134fe565bf4cf69af70fa45 .github/workflows/rd-wave03-rd02-intake.yml
          export_one b0700020c4c84e0ec355a76861c9a788b04a89eb .github/workflows/rd-wave03-rd03-intake.yml
          export_one 1db75a178f4da96d22109902e3d5a9ff79a6080f .github/workflows/rd-wave03-rd04-intake.yml
          export_one 6f1e9f6ea6b14753d30161d55c3facc3a466bc66 .github/workflows/rd-wave03-rd05-intake.yml
          export_one 9acd031d7bfc3d0f343525e65b17a5140ee46f43 .github/workflows/rd-wave03-rd06-intake.yml
          export_one 6f1e9f6ea6b14753d30161d55c3facc3a466bc66 scripts/rd-wave03-rd05-build.mjs
          export_one 9acd031d7bfc3d0f343525e65b17a5140ee46f43 scripts/rd-wave03-rd06-validate.mjs
          export_one 9acd031d7bfc3d0f343525e65b17a5140ee46f43 schema/rd-wave03-rd06-intake.schema.json

          test "$(find "$out/files" -type f | wc -l)" -eq 9
          sort -o "$out/sha256sums.txt" "$out/sha256sums.txt"
          cat "$out/sha256sums.txt"

      - name: Upload exact source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-failure-source-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-failure-source
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
