name: inspect-doctor-who-cycle-002-gredd-transport

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-doctor-who-cycle-002.yml"
      - ".ci/doctor-who-cycle-002/scripts.tgz.b64"

permissions:
  contents: read

concurrency:
  group: inspect-doctor-who-cycle-002-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/apply-doctor-who-cycle-002.yml
  TRANSPORT: .ci/doctor-who-cycle-002/scripts.tgz.b64
  TRANSPORT_SHA256: d824b3af5b5f02210c7893c8090077a887b649f8be5231ded1effe66d6169837

jobs:
  inspect:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bind current main and prove the two-path carrier rebases cleanly
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=64 origin \
            refs/heads/main:refs/remotes/origin/main \
            "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse refs/remotes/origin/${{ github.event.pull_request.head.ref }})" = "${{ github.event.pull_request.head.sha }}"
          git rebase refs/remotes/origin/main
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "${{ github.event.pull_request.base.sha }}"
          cat > /tmp/expected-paths.txt <<PATHS
          $TRANSPORT
          $SELF
          PATHS
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          echo "rebased_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "base_main=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode, enumerate, and syntax-check the exact transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/doctor-who-cycle-002
          tr -d '\n\r\t ' < "$TRANSPORT" | base64 --decode > /tmp/doctor-who-cycle-002-scripts.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-002-scripts.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          sha256sum /tmp/doctor-who-cycle-002-scripts.tgz "$TRANSPORT" > /tmp/transport-sha256.txt
          tar -tzf /tmp/doctor-who-cycle-002-scripts.tgz | tee /tmp/transport-files.txt
          tar -xzf /tmp/doctor-who-cycle-002-scripts.tgz -C /tmp/doctor-who-cycle-002
          find /tmp/doctor-who-cycle-002 -maxdepth 1 -type f -print | sort > /tmp/extracted-files.txt
          test "$(wc -l < /tmp/extracted-files.txt)" -eq 2
          while IFS= read -r file; do node --check "$file"; done < /tmp/extracted-files.txt
          test -z "$(git status --porcelain)"

      - name: Extract the current Dan Starkey and Gredd media surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const specimens = read('data/specimens.json');
          const audit = read('data/MEDIA-AUDIT.json');
          const manifest = read('data/media-manifest.json');
          const output = {
            specimens: specimens.filter(row => row.actor === 'Dan Starkey' || row.character === 'Gredd'),
            media_audit: audit.items.filter(row => row.actor === 'Dan Starkey' || row.character === 'Gredd'),
            media_manifest: Object.entries(manifest).filter(([key, value]) =>
              key.toLowerCase().includes('starkey') || JSON.stringify(value).toLowerCase().includes('starkey')),
          };
          fs.writeFileSync('/tmp/dan-starkey-media-surface.json', `${JSON.stringify(output, null, 2)}\n`);
          NODE
          grep -RIn --exclude='*.jsonl' --exclude='AUTOPILOT.json' --exclude='CENSUS-COVERAGE.json' \
            -E 'Dan Starkey|Gredd' data scripts package.json docs \
            > /tmp/dan-starkey-grep.txt || true
          sha256sum \
            data/specimens.json \
            data/MEDIA-AUDIT.json \
            data/media-manifest.json \
            data/quality.json \
            > /tmp/current-input-sha256.txt

      - name: Upload exact scripts and current media evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-gredd-transport-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
            /tmp/transport-sha256.txt
            /tmp/transport-files.txt
            /tmp/extracted-files.txt
            /tmp/doctor-who-cycle-002
            /tmp/dan-starkey-media-surface.json
            /tmp/dan-starkey-grep.txt
            /tmp/current-input-sha256.txt
