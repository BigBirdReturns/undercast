name: doctor-who-cycle-012-evidence-preflight-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-evidence-preflight-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-evidence-preflight-v3
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-evidence-preflight-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-evidence-preflight-v3
      SELF: .github/workflows/doctor-who-cycle-012-evidence-preflight-v3.yml
      OUT: /tmp/doctor-who-cycle-012-evidence-preflight-v3
      SELECTOR_PACKET: /tmp/doctor-who-cycle-012-evidence-preflight-v3-selector
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      SELECTOR_PR: "866"
      SELECTOR_BRANCH: agent/doctor-who-cycle-012-preflight-v13
      SELECTOR_HEAD: a0265638e30fbb669a09bb5ce1704c9853dbc2ce
      SELECTOR_RUN: "31368785967"
      SELECTOR_JOB: "93392885230"
      SELECTOR_ARTIFACT: "9055273612"
      SELECTOR_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v13-31368785967-attempt-1
      SELECTOR_ARTIFACT_BYTES: "170382"
      SELECTOR_ARTIFACT_SHA256: c1ce1b79cbcdb29cf66f8cfd142269cac243777e4a7ad710f55bb795f09c3aeb
      SELECTOR_ARTIFACT_FILES: "15"
      SELECTOR_LEDGER_ROWS: "13"
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V13 selection packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SELECTOR_PACKET"
          mkdir -p "$OUT"/{api,source,logs,receipt,payload} "$SELECTOR_PACKET"

          test "$CURRENT_BASE" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SELECTOR_PR" > "$OUT/api/selector-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN" > "$OUT/api/selector-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN/jobs?per_page=100" > "$OUT/api/selector-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT" > "$OUT/api/selector-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT/zip" > "$OUT/selector.zip"
          test "$(sha256sum "$OUT/selector.zip" | awk '{print $1}')" = "$SELECTOR_ARTIFACT_SHA256"

          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          out = Path(os.environ['OUT'])
          api = out / 'api'
          load = lambda name: json.loads((api / name).read_text())
          own = load('carrier-pr.json')
          selector_pr = load('selector-pr.json')
          run = load('selector-run.json')
          jobs = load('selector-jobs.json')['jobs']
          artifact = load('selector-artifact.json')

          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha'] == os.environ['MAIN']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1

          assert selector_pr['number'] == int(os.environ['SELECTOR_PR'])
          assert selector_pr['state'] == 'open' and selector_pr['draft'] is True and selector_pr['merged'] is False
          assert selector_pr['base']['sha'] == os.environ['MAIN']
          assert selector_pr['head']['ref'] == os.environ['SELECTOR_BRANCH']
          assert selector_pr['head']['sha'] == os.environ['SELECTOR_HEAD']
          assert selector_pr['commits'] == 1 and selector_pr['changed_files'] == 1

          assert run['id'] == int(os.environ['SELECTOR_RUN'])
          assert run['head_sha'] == os.environ['SELECTOR_HEAD']
          assert run['head_branch'] == os.environ['SELECTOR_BRANCH']
          assert run['event'] == 'pull_request'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['run_attempt'] == 1

          rows = [row for row in jobs if row['id'] == int(os.environ['SELECTOR_JOB'])]
          assert len(rows) == 1
          job = rows[0]
          assert job['name'] == 'select' and job['status'] == 'completed' and job['conclusion'] == 'success'
          steps = {row['name']: (row['status'], row['conclusion']) for row in job['steps']}
          assert steps['Bind V12 geometry failure and execute exact V13 repair'] == ('completed', 'success')
          uploads = [(row['status'], row['conclusion']) for row in job['steps'] if row['name'] == 'Run actions/upload-artifact@v4']
          assert uploads == [('completed', 'success'), ('completed', 'skipped')], uploads

          assert artifact['id'] == int(os.environ['SELECTOR_ARTIFACT'])
          assert artifact['name'] == os.environ['SELECTOR_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['SELECTOR_ARTIFACT_BYTES'])
          assert artifact['digest'] == 'sha256:' + os.environ['SELECTOR_ARTIFACT_SHA256']
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SELECTOR_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SELECTOR_HEAD']

          target = Path(os.environ['SELECTOR_PACKET'])
          with zipfile.ZipFile(out / 'selector.zip') as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  destination = target.joinpath(*path.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(info))

          files = sorted(path.relative_to(target).as_posix() for path in target.rglob('*') if path.is_file())
          expected = sorted([
              'SELECTION_COMPLETE',
              'SHA256SUMS',
              'SHA256SUMS.pre',
              'autopilot-status.json',
              'candidates.json',
              'complete-gate.log',
              'selection.json',
              'selector-command.json',
              'source-authentication.json',
              'terminal-proof.json',
              'transport-custody.json',
              'v11-failure.json',
              'v12-failure.json',
              'v13-repair.json',
              'waterline-status.json',
          ])
          assert files == expected
          assert len(files) == int(os.environ['SELECTOR_ARTIFACT_FILES'])

          digest = lambda data: hashlib.sha256(data).hexdigest()
          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert digest(pre.read_bytes()) == sealed.read_text().split()[0]
          rows = [raw for raw in pre.read_text().splitlines() if raw.strip()]
          assert len(rows) == int(os.environ['SELECTOR_LEDGER_ROWS'])
          for raw in rows:
              expected_digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and digest(path.read_bytes()) == expected_digest

          selection = json.loads((target / 'selection.json').read_text())
          identity = selection.pop('identity')
          assert identity == os.environ['SELECTION_IDENTITY']
          assert digest(json.dumps(selection, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == identity
          selection['identity'] = identity
          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert selection['carrier'] == {
              'pr': int(os.environ['SELECTOR_PR']),
              'head': os.environ['SELECTOR_HEAD'],
              'base': os.environ['MAIN'],
              'branch': os.environ['SELECTOR_BRANCH'],
          }
          assert selection['selected_task_id'] == os.environ['TASK_ID']
          assert selection['normalized'] == {
              'performer': os.environ['PERFORMER'],
              'role': os.environ['ROLE'],
              'mode': os.environ['MODE'],
          }
          task = selection['selected_task']
          assert task['task_id'] == os.environ['TASK_ID']
          assert task['performer'] == os.environ['PERFORMER']
          assert task['character'] == os.environ['ROLE']
          assert task['performance_modes'] == [os.environ['MODE']]
          assert task['sources'] == [os.environ['SOURCE_URL']]
          assert task['source_fingerprint'] == os.environ['SOURCE_FINGERPRINT']
          assert selection['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert selection['boundary'] == {
              'selection_only': True,
              'lease_issued': False,
              'queue_mutated': False,
              'canonical_mutated': False,
              'transport_mutation': False,
              'wall_created': False,
              'media_adopted': False,
              'cycle_receipt_written': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          assert (target / 'SELECTION_COMPLETE').read_text() == identity + '\n'
          expected_identities = {
              'selector-command.json': '60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf',
              'source-authentication.json': '27360e4986a5cf33d6046e66afde5d57444265ec78a8812e920d2ec364011bb4',
              'terminal-proof.json': '9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835',
              'transport-custody.json': 'fbe1b123c9ad17a23ff717fbaa47e2f59cc85032fc48a94648eb1d64e20f2da0',
              'v11-failure.json': '4fa80a2b079affa2bb575b94612adab32d42decad6da02d359e6316621baa68b',
              'v12-failure.json': 'cf8290c7b2bc94a0f0995b9a4334c9e72c322ed6a3390fcd2972ac5cde462a3c',
              'v13-repair.json': '73a7e8519c9489432573742a4fac4b7f6bbacf723e7ed560a7615ae89316ba3b',
          }
          for name, expected_identity in expected_identities.items():
              receipt = json.loads((target / name).read_text())
              receipt_identity = receipt.pop('identity')
              assert receipt_identity == expected_identity
              assert digest(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == receipt_identity

          (out / 'receipt' / 'selection.json').write_text(json.dumps(selection, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY

      - name: Fetch and bind exact Senstarg source revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path

          out = Path(os.environ['OUT'])
          source_dir = out / 'source'
          source_dir.mkdir(parents=True, exist_ok=True)
          selection = json.loads((out / 'receipt' / 'selection.json').read_text())
          source_url = selection['selected_task']['sources'][0]
          parsed = urllib.parse.urlparse(source_url)
          assert parsed.scheme == 'https' and parsed.netloc == 'tardis.fandom.com'
          marker = '/wiki/'
          assert marker in parsed.path
          title = urllib.parse.unquote(parsed.path.split(marker, 1)[1]).replace('_', ' ')
          assert title.casefold() == os.environ['ROLE'].casefold()

          params = urllib.parse.urlencode({
              'action': 'query',
              'prop': 'revisions',
              'rvprop': 'ids|timestamp|content',
              'rvslots': 'main',
              'redirects': '1',
              'titles': title,
              'format': 'json',
              'formatversion': '2',
          })
          api_url = f'{parsed.scheme}://{parsed.netloc}/api.php?{params}'
          request = urllib.request.Request(
              api_url,
              headers={
                  'User-Agent': 'undercast-cycle-012-evidence/2.0 (GitHub Actions; read-only source custody)',
                  'Accept': 'application/json',
              },
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              assert response.status == 200
              raw = response.read()

          api_sha256 = hashlib.sha256(raw).hexdigest()
          (source_dir / 'source-api.json').write_bytes(raw)
          payload = json.loads(raw)
          pages = payload.get('query', {}).get('pages', [])
          assert len(pages) == 1, pages
          page = pages[0]
          assert not page.get('missing', False)
          assert int(page['pageid']) > 0
          assert page['title'].casefold() == os.environ['ROLE'].casefold()
          revisions = page.get('revisions', [])
          assert len(revisions) == 1
          revision = revisions[0]
          assert int(revision['revid']) > 0
          slots = revision.get('slots', {})
          main = slots.get('main', {})
          content = main.get('content', main.get('*'))
          assert isinstance(content, str) and content.strip()
          content_bytes = content.encode('utf-8')
          content_sha256 = hashlib.sha256(content_bytes).hexdigest()
          (source_dir / 'source.wikitext').write_bytes(content_bytes)

          lowered = content.casefold()
          assert os.environ['ROLE'].casefold() in lowered
          assert os.environ['PERFORMER'].casefold() in lowered

          source = {
              'status': 'cycle-012-doctor-who-source-revision-bound-v2',
              'version': 2,
              'selected_task_id': os.environ['TASK_ID'],
              'performer': os.environ['PERFORMER'],
              'role': os.environ['ROLE'],
              'mode': os.environ['MODE'],
              'source_url': source_url,
              'source_fingerprint': os.environ['SOURCE_FINGERPRINT'],
              'api_url': api_url,
              'api_response_sha256': api_sha256,
              'page_id': int(page['pageid']),
              'page_title': page['title'],
              'revision_id': int(revision['revid']),
              'revision_timestamp': revision['timestamp'],
              'content_bytes': len(content_bytes),
              'content_sha256': content_sha256,
              'assertions': {
                  'role_present': True,
                  'performer_present': True,
                  'exact_page_title': True,
                  'immutable_revision_recorded': True,
              },
              'boundary': {
                  'source_read_only': True,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'media_adopted': False,
                  'cycle_receipt_written': False,
                  'canonical_mutated': False,
                  'cycle_012_product_authority': False,
              },
          }
          source['identity'] = hashlib.sha256(json.dumps(source, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (source_dir / 'source.json').write_text(json.dumps(source, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY

      - name: Rerun complete canonical repository gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run gate > "$OUT/logs/complete-gate.log" 2>&1
          grep -q '^gate: PASS' "$OUT/logs/complete-gate.log"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - name: Seal evidence packet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          out = Path(os.environ['OUT'])
          payload = out / 'payload'
          payload.mkdir(parents=True, exist_ok=True)
          selector_target = payload / 'selector'
          shutil.copytree(Path(os.environ['SELECTOR_PACKET']), selector_target)

          source = json.loads((out / 'source' / 'source.json').read_text())
          selection = json.loads((out / 'receipt' / 'selection.json').read_text())
          gate_path = out / 'logs' / 'complete-gate.log'
          gate_sha256 = hashlib.sha256(gate_path.read_bytes()).hexdigest()

          shutil.copy2(out / 'source' / 'source-api.json', payload / 'source-api.json')
          shutil.copy2(out / 'source' / 'source.wikitext', payload / 'source.wikitext')
          shutil.copy2(out / 'source' / 'source.json', payload / 'source.json')
          shutil.copy2(gate_path, payload / 'complete-gate.log')

          evidence = {
              'status': 'cycle-012-doctor-who-evidence-preflight-complete-v2',
              'version': 2,
              'carrier': {
                  'pr': int(os.environ['CURRENT_PR']),
                  'head': os.environ['CURRENT_HEAD'],
                  'base': os.environ['MAIN'],
                  'branch': os.environ['BRANCH'],
              },
              'selector': {
                  'pr': int(os.environ['SELECTOR_PR']),
                  'head': os.environ['SELECTOR_HEAD'],
                  'run': int(os.environ['SELECTOR_RUN']),
                  'job': int(os.environ['SELECTOR_JOB']),
                  'artifact': int(os.environ['SELECTOR_ARTIFACT']),
                  'artifact_sha256': os.environ['SELECTOR_ARTIFACT_SHA256'],
                  'selection_identity': selection['identity'],
              },
              'selected': {
                  'task_id': selection['selected_task_id'],
                  'performer': selection['normalized']['performer'],
                  'role': selection['normalized']['role'],
                  'mode': selection['normalized']['mode'],
                  'source_url': selection['selected_task']['sources'][0],
                  'source_fingerprint': selection['selected_task']['source_fingerprint'],
              },
              'source': {
                  'identity': source['identity'],
                  'page_id': source['page_id'],
                  'revision_id': source['revision_id'],
                  'revision_timestamp': source['revision_timestamp'],
                  'content_bytes': source['content_bytes'],
                  'content_sha256': source['content_sha256'],
                  'api_response_sha256': source['api_response_sha256'],
              },
              'queue': selection['queue'],
              'gates': {
                  'complete_repository_gate': True,
                  'complete_gate_log_sha256': gate_sha256,
                  'selector_complete_gate_sha256': hashlib.sha256((selector_target / 'complete-gate.log').read_bytes()).hexdigest(),
                  'selection_checksum_ledger': True,
                  'source_revision_bound': True,
                  'performer_and_role_present': True,
                  'clean_worktree': True,
                  'live_main_unchanged': True,
              },
              'boundary': {
                  'evidence_only': True,
                  'repository_write': False,
                  'transport_mutation': False,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'wall_created': False,
                  'media_adopted': False,
                  'cycle_receipt_written': False,
                  'canonical_mutated': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          evidence['identity'] = hashlib.sha256(json.dumps(evidence, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (payload / 'evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (payload / 'EVIDENCE_COMPLETE').write_text(evidence['identity'] + '\n')
          PY

          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          payload = Path(os.environ['OUT']) / 'payload'
          pre = payload / 'SHA256SUMS.pre'
          sealed = payload / 'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest() == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              expected, name = raw.split(None, 1)
              path = payload / name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == expected
          evidence = json.loads((payload / 'evidence.json').read_text())
          identity = evidence.pop('identity')
          assert hashlib.sha256(json.dumps(evidence, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest() == identity
          evidence['identity'] = identity
          assert evidence['status'] == 'cycle-012-doctor-who-evidence-preflight-complete-v2'
          assert evidence['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert all(evidence['gates'].values())
          assert evidence['boundary'] == {
              'evidence_only': True,
              'repository_write': False,
              'transport_mutation': False,
              'lease_issued': False,
              'queue_mutated': False,
              'wall_created': False,
              'media_adopted': False,
              'cycle_receipt_written': False,
              'canonical_mutated': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          assert (payload / 'EVIDENCE_COMPLETE').read_text() == identity + '\n'
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-evidence-preflight-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-evidence-preflight-v3/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-evidence-preflight-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-evidence-preflight-v3
            /tmp/doctor-who-cycle-012-evidence-preflight-v3-selector
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
