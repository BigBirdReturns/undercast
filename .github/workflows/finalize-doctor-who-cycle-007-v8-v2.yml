name: finalize-doctor-who-cycle-007-v8-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-doctor-who-cycle-007-v8-v2.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-doctor-who-cycle-007-v8-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  FINALIZER_BRANCH: agent/doctor-who-cycle-007-v8-finalizer-v2
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-completion-v8-final
  SELF: .github/workflows/finalize-doctor-who-cycle-007-v8-v2.yml
  CANDIDATE_BRANCH: agent/doctor-who-cycle-007-v8-materializer
  CANDIDATE_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_COMMIT_EXPECTED: 1bac55a7cd06e64840c79d42924472a0e0c6910e
  CANDIDATE_TREE_EXPECTED: 121ecef1c981e6da2048450902721e336c051138
  CANDIDATE_GATE_EXPECTED: 6499879b6246646228767c38e87d45447082e89fb03fa48e6ef5950005d95dd6
  CANDIDATE_ARTIFACT: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_SHA256: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_SHA256: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  REVIEW_BRANCH: agent/doctor-who-cycle-007-v8-independent-review-v4-probe
  REVIEW_WORKFLOW_NAME: review-doctor-who-cycle-007-v8-v4-probe
  REVIEW_WORKFLOW_PATH: .github/workflows/review-doctor-who-cycle-007-v8-v4-probe.yml
  SOURCE_REVIEW_HEAD: 245bacc9d7e58ceda4ebfd16dc33254b97263f34
  SOURCE_REVIEW_ARCHIVE: tmp/review-doctor-who-cycle-007-v8.mjs.xz.b64
  SOURCE_REVIEW_BLOB: a79b0aaa277a852d91a0670f387d74789d456ea1
  SOURCE_REVIEWER_SHA256: 5053bb53dc96c35b846dd57fe16d8b58d6bd334e03290399ddf98011ad174fe1
  ARCHIVE_PART_01: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-01
  ARCHIVE_PART_02: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-02
  ARCHIVE_PART_03: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-03
  ARCHIVE_PART_04: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-04
  FIX_02: tmp/doctor-who-cycle-007-v8-02-materialize.sh
  FIX_03: tmp/doctor-who-cycle-007-v8-03-candidate.sh
  ARCHIVE_SHA256: 406d599a071b75202e764b391fc2080435aa9f14cb565f8b643e4417620a20ce
  MANIFEST_SHA256: ba59a8c89ed462e29416d398aae6151b375d85b0d415fa23f5b69d32eedb9e54
  FIX_02_SHA256: 4c2c40f1cad46a2d0787f02d6395ae77f9cffcfe5316ae27009ac6f58e104fe6
  FIX_03_SHA256: f454636883f6e1f3fcadf5308866614acb92c83abf83ef5df2ad63775c931910
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  ROOT: /tmp/doctor-who-cycle-007-v8-finalizer-v2
  OUT: /tmp/doctor-who-cycle-007-v8-finalizer-v2/out
  CARRIER: /tmp/doctor-who-cycle-007-v8-finalizer-v2/carrier
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-v8-finalizer-v2/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/media-review
  CANDIDATE_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/candidate-artifact
  DIAGNOSTICS_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/candidate-diagnostics
  REVIEW_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/hosted-review
  REPLAY_DIR: /tmp/doctor-who-cycle-007-v8-finalizer-v2/replayed-review
  REVIEWER_V2: /tmp/doctor-who-cycle-007-v8-finalizer-v2/reviewer-v2.mjs
  REVIEWER: /tmp/doctor-who-cycle-007-v8-finalizer-v2/reviewer-v3.mjs
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-finalizer-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Bind exact finalizer, candidate, and repaired review carriers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$OUT" "$CARRIER" "$CYCLE_ASSET_DIR" "$SELECTION_DIR" "$PREFLIGHT_DIR" "$MEDIA_DIR" "$CANDIDATE_DIR" "$DIAGNOSTICS_DIR" "$REVIEW_DIR" "$REPLAY_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$FINALIZER_BRANCH"
          printf '%s\n' "$SELF" > "$OUT/expected-finalizer-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-finalizer-paths.txt"
          diff -u "$OUT/expected-finalizer-paths.txt" "$OUT/actual-finalizer-paths.txt"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git fetch --no-tags --depth=2 origin "$SOURCE_REVIEW_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "$CANDIDATE_HEAD"
          review_head="$(git rev-parse refs/remotes/origin/${REVIEW_BRANCH})"
          test "$(git show -s --format=%P "$review_head")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$review_head")" = "1"
          printf '%s\n' "$REVIEW_WORKFLOW_PATH" > "$OUT/expected-review-paths.txt"
          git diff --name-only "$EXACT_MAIN"..."$review_head" | LC_ALL=C sort > "$OUT/actual-review-paths.txt"
          diff -u "$OUT/expected-review-paths.txt" "$OUT/actual-review-paths.txt"
          git show "${review_head}:${REVIEW_WORKFLOW_PATH}" > "$OUT/review-workflow.yml"
          grep -F 'contents: read' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F 'contents: write' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F '04-finalize.sh' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F '05-final-gate.sh' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F 'git push' "$OUT/review-workflow.yml" >/dev/null
          printf '%s\n' "$review_head" > "$OUT/review-head.txt"

      - name: Discover exact green repaired review
        id: review
        shell: bash
        run: |
          set -euo pipefail
          review_head="$(cat "$OUT/review-head.txt")"
          run=''
          for _ in $(seq 1 240); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${REVIEW_BRANCH}&per_page=100" --jq ".workflow_runs[] | select(.name==\"${REVIEW_WORKFLOW_NAME}\" and .head_sha==\"${review_head}\" and .status==\"completed\" and .conclusion==\"success\") | .id" | head -1)"
            test -n "$run" && break
            sleep 5
          done
          test -n "$run"
          job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" --jq '.jobs[] | select(.name=="review" and .status=="completed" and .conclusion=="success") | .id' | head -1)"
          test -n "$job"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/jobs?per_page=100" > "$OUT/review-jobs.json"
          jq -e '.jobs | length==1 and all(.[]; .status=="completed" and .conclusion=="success" and all(.steps[]; .conclusion=="success" or .conclusion=="skipped"))' "$OUT/review-jobs.json" >/dev/null
          name="doctor-who-cycle-007-v8-independent-review-v4-${run}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts?per_page=100" > "$OUT/review-artifacts.json"
          id="$(jq -r --arg name "$name" '.artifacts[] | select(.name==$name and .expired==false) | .id' "$OUT/review-artifacts.json" | head -1)"
          digest="$(jq -r --arg name "$name" '.artifacts[] | select(.name==$name and .expired==false) | .digest' "$OUT/review-artifacts.json" | head -1)"
          test -n "$id" -a -n "$digest"
          printf 'run=%s\njob=%s\nname=%s\nid=%s\ndigest=%s\nhead=%s\n' "$run" "$job" "$name" "$id" "$digest" "$review_head" > "$OUT/review-custody.txt"
          printf 'run=%s\njob=%s\nname=%s\nid=%s\ndigest=%s\nhead=%s\n' "$run" "$job" "$name" "$id" "$digest" "$review_head" >> "$GITHUB_OUTPUT"
          printf 'REVIEW_RUN=%s\nREVIEW_JOB=%s\nREVIEW_ARTIFACT_NAME=%s\nREVIEW_ARTIFACT_ID=%s\nREVIEW_ARTIFACT_DIGEST=%s\nREVIEW_HEAD=%s\n' "$run" "$job" "$name" "$id" "${digest#sha256:}" "$review_head" >> "$GITHUB_ENV"

      - name: Download immutable repaired review
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.review.outputs.name }}
          path: ${{ env.REVIEW_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ steps.review.outputs.run }}

      - name: Download immutable qualified candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Download immutable candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT }}
          path: ${{ env.DIAGNOSTICS_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Replay repaired reviewer and require byte-identical receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}")" = "$SOURCE_REVIEW_BLOB"
          git show "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}" | base64 --decode | xz --decompress > "$REVIEWER_V2"
          test "$(sha256sum "$REVIEWER_V2" | awk '{print $1}')" = "$SOURCE_REVIEWER_SHA256"
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('/tmp/doctor-who-cycle-007-v8-finalizer-v2/reviewer-v2.mjs')
          target=Path('/tmp/doctor-who-cycle-007-v8-finalizer-v2/reviewer-v3.mjs')
          text=source.read_text(); error='candidate workflow marker missing: ${marker}'
          pos=text.find(error); start=text.rfind('for (const marker of [',0,pos); end=text.find(';',pos)
          if pos<0 or start<0 or end<0: raise SystemExit('candidate marker block missing')
          gh_head='$'+'{{ github.event.pull_request.head.sha }}'; env_head='$'+'{{ env.HEAD_SHA }}'
          replacement='''for (const marker of [
            "CARRIER_BRANCH: agent/doctor-who-cycle-007-v8-materializer",
            "__GH_HEAD__",
            "__ENV_HEAD__",
            "github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-materializer'",
            'test "$(git rev-parse HEAD)" = "$HEAD_SHA"',
            'test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"',
            'test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/${CARRIER_BRANCH})" = "$HEAD_SHA"',
          ]) assert(candidateWorkflow.includes(marker), `candidate workflow structural marker missing: ${marker}`);'''
          replacement=replacement.replace('__GH_HEAD__','HEAD_SHA: '+gh_head).replace('__ENV_HEAD__','ref: '+env_head)
          text=text[:start]+replacement+text[end+1:]
          text,n=re.subn(r'(reviewer_revision\s*:\s*)2\b',r'\g<1>3',text)
          if n<1 or 'candidate workflow marker missing:' in text: raise SystemExit('reviewer derivation failed')
          target.write_text(text)
          PY
          node --check "$REVIEWER"
          reviewer_sha="$(sha256sum "$REVIEWER" | awk '{print $1}')"
          hosted_reviewer="$(find "$REVIEW_DIR" -type f -name reviewer-v3.sha256 -print -quit)"
          test -n "$hosted_reviewer"
          test "$(awk '{print $1}' "$hosted_reviewer")" = "$reviewer_sha"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100" > "$OUT/candidate-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > "$OUT/candidate-jobs.json"
          git show "$CANDIDATE_HEAD:.github/workflows/materialize-doctor-who-cycle-007-v8.yml" > "$OUT/candidate-workflow.yml"
          node "$REVIEWER" "$CANDIDATE_DIR" "$DIAGNOSTICS_DIR" "$OUT/candidate-artifacts.json" "$OUT/candidate-jobs.json" "$OUT/candidate-workflow.yml" "$REPLAY_DIR" | tee "$OUT/replayed-review.log"
          hosted_receipt="$(find "$REVIEW_DIR" -type f -name independent-review-receipt.json -print -quit)"
          hosted_sha="$(find "$REVIEW_DIR" -type f -name independent-review-receipt.sha256 -print -quit)"
          test -n "$hosted_receipt" -a -n "$hosted_sha"
          cmp "$REPLAY_DIR/independent-review-receipt.json" "$hosted_receipt"
          cmp "$REPLAY_DIR/independent-review-receipt.sha256" "$hosted_sha"
          receipt_sha="$(sha256sum "$hosted_receipt" | awk '{print $1}')"
          test "$(cat "$hosted_sha")" = "$receipt_sha"
          cp "$hosted_receipt" "$OUT/independent-review-receipt.json"
          cp "$hosted_sha" "$OUT/independent-review-receipt.sha256"
          printf 'REVIEW_RECEIPT=%s\nREVIEW_RECEIPT_SHA256=%s\nINDEPENDENT_REVIEW_RECEIPT=%s\nINDEPENDENT_REVIEW_RECEIPT_SHA256=%s\n' "$OUT/independent-review-receipt.json" "$receipt_sha" "$OUT/independent-review-receipt.json" "$receipt_sha" >> "$GITHUB_ENV"

      - name: Extract exact candidate materializer payload
        shell: bash
        run: |
          set -euo pipefail
          for path in "$ARCHIVE_PART_01" "$ARCHIVE_PART_02" "$ARCHIVE_PART_03" "$ARCHIVE_PART_04" "$FIX_02" "$FIX_03"; do
            mkdir -p "$CARRIER/$(dirname "$path")"; git show "$CANDIDATE_HEAD:$path" > "$CARRIER/$path"
          done
          cat "$CARRIER/$ARCHIVE_PART_01" "$CARRIER/$ARCHIVE_PART_02" "$CARRIER/$ARCHIVE_PART_03" "$CARRIER/$ARCHIVE_PART_04" > "$OUT/payload.b64"
          test "$(wc -c < "$OUT/payload.b64")" = "34576"
          base64 --decode "$OUT/payload.b64" > "$OUT/payload.tar.gz"
          test "$(sha256sum "$OUT/payload.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xzf "$OUT/payload.tar.gz" -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          install -m 0755 "$CARRIER/$FIX_02" "$CYCLE_ASSET_DIR/02-materialize.sh"
          install -m 0755 "$CARRIER/$FIX_03" "$CYCLE_ASSET_DIR/03-candidate.sh"
          test "$(sha256sum "$CYCLE_ASSET_DIR/02-materialize.sh" | awk '{print $1}')" = "$FIX_02_SHA256"
          test "$(sha256sum "$CYCLE_ASSET_DIR/03-candidate.sh" | awk '{print $1}')" = "$FIX_03_SHA256"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          for path in 01-prepare.sh 02-materialize.sh 03-candidate.sh 04-finalize.sh 05-final-gate.sh prepare-inputs.mjs apply-doctor-who-cycle-007.mjs apply-doctor-who-cycle-finalize-007.mjs; do test -x "$CYCLE_ASSET_DIR/$path"; done
          bash -n "$CYCLE_ASSET_DIR/04-finalize.sh"; bash -n "$CYCLE_ASSET_DIR/05-final-gate.sh"

      - name: Checkout exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXACT_MAIN"
          git checkout -B "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/chronology-floor.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody-floor.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard-floor.log"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Download exact cycle-007 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-selection-31023209453
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31023209453

      - name: Download exact complete cycle-007 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-preflight-31024339060
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31024339060

      - name: Download exact final Kragar media review
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-31027579331
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31027579331

      - name: Rematerialize exact candidate
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          bash "$CYCLE_ASSET_DIR/01-prepare.sh"
          bash "$CYCLE_ASSET_DIR/02-materialize.sh"
          bash "$CYCLE_ASSET_DIR/03-candidate.sh"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_EXPECTED"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_EXPECTED"
          test "$(cat "$OUT/candidate-gate.sha256")" = "$CANDIDATE_GATE_EXPECTED"

      - name: Execute reviewed finalization and receipt-bearing gate
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          finalizer_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="finalize") | .id' | head -1)"
          test -n "$finalizer_job"
          export CANDIDATE_COMMIT="$CANDIDATE_COMMIT_EXPECTED"
          export CANDIDATE_GATE_SHA256="$CANDIDATE_GATE_EXPECTED"
          export CANDIDATE_ARTIFACT_NAME="$CANDIDATE_ARTIFACT"
          export CANDIDATE_ARTIFACT_ID CANDIDATE_ARTIFACT_SHA256
          export CANDIDATE_ARTIFACT_DIGEST="$CANDIDATE_ARTIFACT_SHA256"
          export CANDIDATE_WORKFLOW_RUN="$CANDIDATE_RUN" CANDIDATE_WORKFLOW_JOB="$CANDIDATE_JOB"
          export WORKFLOW_JOB="$finalizer_job" FINALIZER_WORKFLOW_JOB="$finalizer_job"
          cp "$OUT/independent-review-receipt.json" "$CYCLE_ASSET_DIR/independent-review-receipt.json"
          cp "$OUT/independent-review-receipt.sha256" "$CYCLE_ASSET_DIR/independent-review-receipt.sha256"
          bash "$CYCLE_ASSET_DIR/04-finalize.sh"
          bash "$CYCLE_ASSET_DIR/05-final-gate.sh"

      - name: Publish exact workflow-free product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${REVIEW_BRANCH})" = "$REVIEW_HEAD"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/product-paths.txt"
          test -s "$OUT/product-paths.txt"
          ! grep -E '^(\.github/workflows/|tmp/)' "$OUT/product-paths.txt" >/dev/null
          git diff --check "$EXACT_MAIN"...HEAD
          printf 'product_commit=%s\nproduct_tree=%s\nproduct_branch=%s\nproduct_paths=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$PRODUCT_BRANCH" "$(wc -l < "$OUT/product-paths.txt")" > "$OUT/product-custody.txt"
          git push --force origin "HEAD:refs/heads/${PRODUCT_BRANCH}"

      - name: Upload complete V2 finalization custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-finalization-v2-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: ${{ env.OUT }}
