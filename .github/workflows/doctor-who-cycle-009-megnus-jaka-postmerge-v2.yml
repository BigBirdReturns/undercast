name: doctor-who-cycle-009-megnus-jaka-postmerge-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-postmerge-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-postmerge-v2
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-postmerge-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-postmerge-v2
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-postmerge-v2.yml
      CANONICAL_PARENT: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      CANONICAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      CANONICAL_PATH_COUNT: "48"
      PRODUCT_PR: "692"
      GUARDIAN_PR: "705"
      GUARDIAN_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v6
      GUARDIAN_HEAD: 4693c2bf1d1be3130ac8edc0e794a3706e0ea3c9
      GUARDIAN_RUN: "31283977708"
      GUARDIAN_VERIFY_JOB: "93169637747"
      GUARDIAN_WRITE_JOB: "93169876709"
      SETTLEMENT_ARTIFACT: "9029272310"
      SETTLEMENT_DIGEST: sha256:ae222fc17c61f1b7aa4601a8e9e623eddd938a749e5fd449b7897225b569cbb4
      MERGE_ARTIFACT: "9029274774"
      MERGE_DIGEST: sha256:34485fe8b54d21fe1f6b038394186e4298c0031d0a271242d9da04308ad77dcf
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_4ca825307ad0d4510f44c7d9
      WALL_ID: UC-1354
      CYCLE_ID: cycle_42b1d086ae8eab34f09827dc
      WATERLINE_EVENT: waterline_4efd5e425f182ff9b1a81bce
      PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact current-main observer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,settlement,merge,proof}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rehydrate exact V6 settlement and canonical merge
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$GUARDIAN_PR" > "$OUT/api/guardian-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN" > "$OUT/api/guardian-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN/jobs?per_page=100" > "$OUT/api/guardian-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN/artifacts?per_page=100" > "$OUT/api/guardian-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SETTLEMENT_ARTIFACT/zip" > "$OUT/settlement.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$MERGE_ARTIFACT/zip" > "$OUT/merge.zip"
          test "$(sha256sum "$OUT/settlement.zip" | cut -d' ' -f1)" = "${SETTLEMENT_DIGEST#sha256:}"
          test "$(sha256sum "$OUT/merge.zip" | cut -d' ' -f1)" = "${MERGE_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/guardian-pr.json').read_text())
          run=json.loads((root/'api/guardian-run.json').read_text())
          jobs=json.loads((root/'api/guardian-jobs.json').read_text())['jobs']
          artifacts=json.loads((root/'api/guardian-artifacts.json').read_text())['artifacts']
          assert pr['number']==int(os.environ['GUARDIAN_PR'])
          assert pr['state']=='closed' and pr['merged'] is False and pr['draft'] is True
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_PARENT']
          assert pr['head']['ref']==os.environ['GUARDIAN_BRANCH'] and pr['head']['sha']==os.environ['GUARDIAN_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['GUARDIAN_RUN'])
          assert run['name']=='doctor-who-cycle-009-megnus-jaka-merger-v6'
          assert run['head_branch']==os.environ['GUARDIAN_BRANCH'] and run['head_sha']==os.environ['GUARDIAN_HEAD']
          assert run['event']=='pull_request' and run['run_attempt']==1
          assert run['status']=='completed' and run['conclusion']=='success'
          by={row['name']:row for row in jobs}
          assert set(by)=={'verify','fast_forward'}
          assert by['verify']['id']==int(os.environ['GUARDIAN_VERIFY_JOB'])
          assert by['fast_forward']['id']==int(os.environ['GUARDIAN_WRITE_JOB'])
          assert all(row['status']=='completed' and row['conclusion']=='success' for row in by.values())
          art={row['id']:row for row in artifacts}
          expected={
              int(os.environ['SETTLEMENT_ARTIFACT']):os.environ['SETTLEMENT_DIGEST'],
              int(os.environ['MERGE_ARTIFACT']):os.environ['MERGE_DIGEST'],
          }
          assert set(expected) <= set(art)
          for ident,digest in expected.items():
              row=art[ident]
              assert row['expired'] is False and row['digest']==digest
              assert row['workflow_run']['id']==int(os.environ['GUARDIAN_RUN'])
              assert row['workflow_run']['head_sha']==os.environ['GUARDIAN_HEAD']
          for name in ('settlement','merge'):
              target=root/name
              with zipfile.ZipFile(root/f'{name}.zip') as archive:
                  infos=archive.infolist()
                  assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir():
                          continue
                      out=target/path
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(archive.read(info))
              ledger=target/'SHA256SUMS.pre'
              sealed=target/'SHA256SUMS'
              assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
              for raw in ledger.read_text().splitlines():
                  if not raw.strip():
                      continue
                  digest,name=raw.split(None,1)
                  path=target/name.lstrip('*')
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement/settlement.json').read_text())
          settlement_identity=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==settlement_identity
          settlement['identity']=settlement_identity
          merge=json.loads((root/'merge/merge.json').read_text())
          merge_identity=merge.pop('identity')
          assert hashlib.sha256(json.dumps(merge,sort_keys=True,separators=(',',':')).encode()).hexdigest()==merge_identity
          merge['identity']=merge_identity
          assert settlement['status']=='cycle-009-megnus-jaka-exact-fast-forward-approved-v3'
          assert settlement['verify_run']==int(os.environ['GUARDIAN_RUN']) and settlement['verify_attempt']==1
          assert settlement['carrier_pr']==int(os.environ['GUARDIAN_PR']) and settlement['carrier_head']==os.environ['GUARDIAN_HEAD']
          assert settlement['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert settlement['product_pr']==int(os.environ['PRODUCT_PR'])
          assert settlement['product_commit']==os.environ['CANONICAL_MAIN']
          assert settlement['product_tree']==os.environ['CANONICAL_TREE']
          assert settlement['product_path_count']==int(os.environ['CANONICAL_PATH_COUNT'])
          assert settlement['task_id']==os.environ['TASK_ID']
          assert settlement['lease_id']==os.environ['LEASE_ID']
          assert settlement['wall_id']==os.environ['WALL_ID']
          assert settlement['cycle_id']==os.environ['CYCLE_ID']
          assert settlement['force_update'] is False and settlement['main_mutated'] is False
          assert settlement['cycle_010_authorized'] is False
          assert merge['status']=='cycle-009-megnus-jaka-canonically-fast-forwarded-v3'
          assert merge['merge_run']==int(os.environ['GUARDIAN_RUN']) and merge['merge_attempt']==1
          assert merge['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert merge['canonical_main']==os.environ['CANONICAL_MAIN']
          assert merge['canonical_tree']==os.environ['CANONICAL_TREE']
          assert merge['canonical_path_count']==int(os.environ['CANONICAL_PATH_COUNT'])
          assert merge['product_pr']==int(os.environ['PRODUCT_PR'])
          assert merge['settlement_identity']==settlement['identity']
          assert merge['force_update'] is False and merge['cycle_010_authorized'] is False
          assert (root/'merge/settlement.bound.json').read_bytes()==(root/'settlement/settlement.json').read_bytes()
          custody={
              'guardian':{'pr':pr['number'],'head':pr['head']['sha'],'run':run['id'],
                          'verify_job':by['verify']['id'],'fast_forward_job':by['fast_forward']['id']},
              'settlement':{'artifact':int(os.environ['SETTLEMENT_ARTIFACT']),
                            'digest':os.environ['SETTLEMENT_DIGEST'],'identity':settlement['identity']},
              'merge':{'artifact':int(os.environ['MERGE_ARTIFACT']),
                       'digest':os.environ['MERGE_DIGEST'],'identity':merge['identity']},
          }
          (root/'proof/guardian-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY

      - name: Prove exact canonical commit and product disposition
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$CANONICAL_MAIN" > "$OUT/api/canonical-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$CANONICAL_PARENT...$CANONICAL_MAIN" > "$OUT/api/canonical-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          commit=json.loads((root/'api/canonical-commit.json').read_text())
          compare=json.loads((root/'api/canonical-compare.json').read_text())
          pr=json.loads((root/'api/product-pr.json').read_text())
          assert [row['sha'] for row in commit['parents']]==[os.environ['CANONICAL_PARENT']]
          assert commit['tree']['sha']==os.environ['CANONICAL_TREE']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          actual=sorted(row['filename'] for row in compare['files'])
          expected=(root/'settlement/product-paths.txt').read_text().splitlines()
          assert len(actual)==len(expected)==int(os.environ['CANONICAL_PATH_COUNT'])
          assert actual==sorted(expected)
          assert hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest()==(
              root/'settlement/product-paths.sha256').read_text().strip()
          assert not any(path.startswith('.github/workflows/') or path.startswith('tmp/') or path.startswith('transport/') for path in actual)
          assert pr['number']==int(os.environ['PRODUCT_PR'])
          assert pr['state']=='closed' and pr['merged'] is True
          assert pr['base']['ref']=='main'
          assert pr['head']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['merge_commit_sha']==os.environ['CANONICAL_MAIN']
          assert pr['commits']==1 and pr['changed_files']==int(os.environ['CANONICAL_PATH_COUNT'])
          proof={'canonical_main':os.environ['CANONICAL_MAIN'],'canonical_tree':os.environ['CANONICAL_TREE'],
                 'canonical_parent':os.environ['CANONICAL_PARENT'],'path_count':len(actual),
                 'paths_sha256':hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest(),
                 'product_pr':pr['number'],'product_pr_state':pr['state'],'product_pr_merged':pr['merged']}
          (root/'proof/canonical.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          PY

      - name: Rerun terminal permanent and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T HEAD)" = "$CANONICAL_TREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/proof/cycle-007.log"
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/proof/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/proof/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/proof/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/proof/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/proof/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/proof/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/proof/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/proof/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/proof/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/proof/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/proof/waterline-status.json" >/dev/null
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          state=json.load(open('data/AUTOPILOT.json'))
          job=next(row for row in state['jobs'] if row['id']==os.environ['TASK_ID'])
          assert job['status']=='resolved' and job['role_on_wall'] is True and job['wall_ids']==[os.environ['WALL_ID']]
          assert job['outcome']['kind']=='audited-wall'
          assert job['outcome']['media_review']['lease_id']==os.environ['LEASE_ID']
          card=next(row for row in json.load(open('data/specimens.json')) if row['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Megnus Jaka' and card['kind']=='voice'
          assert 'still' not in card
          assert card['portrait']['src']=='images/uc-1354-portrait.jpg'
          assert hashlib.sha256(Path(card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.load(open('data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json'))
          assert receipt['transaction']=='DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA'
          assert receipt['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert receipt['task']['id']==os.environ['TASK_ID']
          assert receipt['task']['performer']=='Dan Starkey' and receipt['task']['role']=='Megnus Jaka'
          assert receipt['task']['performance_mode']=='voice'
          assert receipt['lease']['id']==os.environ['LEASE_ID']
          assert receipt['canonical']['wall_id']==os.environ['WALL_ID']
          assert receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID']
          assert receipt['reviewed_cycle']['event_id']==os.environ['WATERLINE_EVENT']
          assert receipt['reviewed_cycle']['outcome']=='completed'
          assert receipt['queue']['before']=={'total':316,'queued':308,'resolved':8,'in_flight':0}
          assert receipt['queue']['after']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert receipt['boundary']['cycle_010_authorized'] is False
          assert receipt['boundary']['tenth_lease_issued'] is False
          PY
          npm run gate 2>&1 | tee "$OUT/proof/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/proof/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal terminal post-merge proof
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          guardian=json.loads((root/'proof/guardian-custody.json').read_text())
          canonical=json.loads((root/'proof/canonical.json').read_text())
          status=json.loads((root/'proof/autopilot-status.json').read_text())
          waterline=json.loads((root/'proof/waterline-status.json').read_text())
          settlement=json.loads((root/'settlement/settlement.json').read_text())
          merge=json.loads((root/'merge/merge.json').read_text())
          receipt={
              'status':'cycle-009-megnus-jaka-terminal-postmerge-proved-v1',
              'proof_run':int(os.environ['GITHUB_RUN_ID']),
              'proof_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'canonical_parent':canonical['canonical_parent'],
              'canonical_main':canonical['canonical_main'],
              'canonical_tree':canonical['canonical_tree'],
              'canonical_path_count':canonical['path_count'],
              'canonical_paths_sha256':canonical['paths_sha256'],
              'product_pr':canonical['product_pr'],
              'product_pr_state':canonical['product_pr_state'],
              'product_pr_merged':canonical['product_pr_merged'],
              'guardian':guardian['guardian'],
              'settlement_artifact':guardian['settlement']['artifact'],
              'settlement_digest':guardian['settlement']['digest'],
              'settlement_identity':settlement['identity'],
              'merge_artifact':guardian['merge']['artifact'],
              'merge_digest':guardian['merge']['digest'],
              'merge_identity':merge['identity'],
              'task_id':os.environ['TASK_ID'],
              'lease_id':os.environ['LEASE_ID'],
              'wall_id':os.environ['WALL_ID'],
              'cycle_id':os.environ['CYCLE_ID'],
              'queue':{'total':status['total'],'queued':status['statuses']['queued'],
                       'resolved':status['statuses']['resolved'],'in_flight':status['in_flight']},
              'media_debt':waterline['media']['debt'],
              'unreceipted_cycles':waterline['cycles']['unreceipted'],
              'next_selector_allowed':waterline['claim_allowed'],
              'next_selector_reasons':waterline['claim_reasons'],
              'cycle_010_lease_issued':False,
              'cleanup_authorized':True,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          assert receipt['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert receipt['media_debt']==0 and receipt['unreceipted_cycles']==[]
          assert receipt['next_selector_allowed'] is True and receipt['next_selector_reasons']==[]
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'proof/postmerge-proof.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/proof" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/proof/$rel" | sed "s#  $OUT/proof/#  #"
          done > "$OUT/proof/SHA256SUMS.pre"
          sha256sum "$OUT/proof/SHA256SUMS.pre" | sed "s#  $OUT/proof/#  #" > "$OUT/proof/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-v2-proof-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-v2/proof
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
