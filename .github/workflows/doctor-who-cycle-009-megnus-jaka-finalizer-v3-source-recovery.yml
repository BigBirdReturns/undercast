name: doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery.yml
      SOURCE_COMMIT: 181f821f2348a3cb47ca75c52cd42c9b030ef3ca
      RUNNER_GZIP_SHA256: d07fd349cf8e95571d516074c9c9618050e31242a5e112ca2b6bb78649a1cd19
      RUNNER_SHA256: 878acf29393fabc86f3250649a56f2fde01a9058c7674466f656e30419a92a8c
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover and seal exact V3 finalizer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,receipt,source}

          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_MAIN"

          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git show -s --format=%B "$SOURCE_COMMIT" > "$OUT/source/source-commit-message.txt"

          MESSAGE="$OUT/source/source-commit-message.txt" RUNNER_GZ="$OUT/source/finalizer-v3.sh.gz" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          text = Path(os.environ['MESSAGE']).read_text()
          begin = 'RUNNER_GZIP_BASE64_BEGIN'
          end = 'RUNNER_GZIP_BASE64_END'
          assert text.count(begin) == 1
          assert text.count(end) == 1
          payload = ''.join(text.split(begin, 1)[1].split(end, 1)[0].split())
          assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload, validate=True))
          PY

          test "$(sha256sum "$OUT/source/finalizer-v3.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$OUT/source/finalizer-v3.sh.gz" > "$OUT/source/finalizer-v3.sh"
          test "$(sha256sum "$OUT/source/finalizer-v3.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$OUT/source/finalizer-v3.sh"
          chmod 0644 "$OUT/source/finalizer-v3.sh"

          nl -ba "$OUT/source/finalizer-v3.sh" > "$OUT/source/finalizer-v3.numbered.txt"
          grep -nE 'record-cycle|Materialize exact eight-path|finalization-facts|receipt_sha256|EXPECTED_CYCLE_ID|final-product|git diff|changed|path' \
            "$OUT/source/finalizer-v3.sh" > "$OUT/source/finalizer-v3-key-lines.txt" || true

          SOURCE="$OUT/source/finalizer-v3.sh" CONTEXT="$OUT/source/finalizer-v3-post-record-context.txt" python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path(os.environ['SOURCE']).read_text().splitlines()
          needles = ('record-cycle', 'recorded cycle_', 'finalization-facts.json')
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          assert hits
          selected = set()
          for hit in hits:
              selected.update(range(max(0, hit - 25), min(len(lines), hit + 90)))
          out = '\n'.join(f'{i + 1:6d}\t{lines[i]}' for i in sorted(selected)) + '\n'
          Path(os.environ['CONTEXT']).write_text(out)
          PY

          python3 - <<'PY' > "$OUT/receipt/recovery.json"
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['OUT'])
          runner = out / 'source/finalizer-v3.sh'
          runner_gz = out / 'source/finalizer-v3.sh.gz'
          receipt = {
              'version': 1,
              'operation': 'doctor-who-cycle-009-finalizer-v3-source-recovery',
              'canonical_main': os.environ['EXACT_MAIN'],
              'carrier_pr': int(os.environ['PR_NUMBER']),
              'carrier_head': os.environ['PR_HEAD'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'runner_bytes': runner.stat().st_size,
              'runner_sha256': hashlib.sha256(runner.read_bytes()).hexdigest(),
              'runner_gzip_bytes': runner_gz.stat().st_size,
              'runner_gzip_sha256': hashlib.sha256(runner_gz.read_bytes()).hexdigest(),
              'repository_write': False,
              'product_publication': False,
              'canonical_mutation': False,
          }
          identity = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          receipt['identity'] = identity
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

          sha256sum $(find "$OUT" -type f ! -name SHA256SUMS | sort) > "$OUT/SHA256SUMS"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXACT_MAIN"

      - name: Upload exact recovered finalizer source
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
