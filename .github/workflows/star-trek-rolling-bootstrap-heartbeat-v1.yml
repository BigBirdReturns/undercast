name: star-trek-rolling-bootstrap-heartbeat-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-bootstrap-heartbeat-v1
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_BRANCH: agent/star-trek-rolling-continuation-v1
      RESULT_BRANCH: agent/star-trek-post-kzinti-cycle-result-v1
      STATE_PATH: transport/star-trek-rolling-continuation-v1/state.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wake the bootstrap after a quiet interval
        run: |
          set -euo pipefail
          test -f "$STATE_PATH"
          iteration="$(jq -r .iteration "$STATE_PATH")"
          stage="$(jq -r .stage "$STATE_PATH")"
          status="$(jq -r .status "$STATE_PATH")"
          test "$iteration" = 0 || exit 0
          test "$status" = bootstrap || test "$status" = running || exit 0
          test "$stage" = awaiting-predecessor || test "$stage" = bootstrap || exit 0
          sleep 120
          if git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}" | grep -q .; then exit 0; fi
          git fetch --filter=blob:none --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" FETCH_HEAD
          test "$(jq -r .iteration "$STATE_PATH")" = 0 || exit 0
          attempts="$(jq -r '.recovery.bootstrap_heartbeats // 0' "$STATE_PATH")"
          if test "$attempts" -ge 120; then
            tmp="$(mktemp)"
            jq --argjson attempts "$attempts" --argjson run "$GITHUB_RUN_ID" '.status="boundary" | .stage="boundary" | .boundary={kind:"bootstrap-timeout",reason:"post-Kzinti bootstrap did not reach a verified result within the sealed retry ceiling",attempts:$attempts,workflow_run:$run,canonical_mutation:false,lease_taken:false}' "$STATE_PATH" > "$tmp"
            mv "$tmp" "$STATE_PATH"
          else
            tmp="$(mktemp)"
            jq --argjson attempts "$((attempts + 1))" --argjson run "$GITHUB_RUN_ID" '.recovery.bootstrap_heartbeats=$attempts | .recovery.last_bootstrap_heartbeat_run=$run' "$STATE_PATH" > "$tmp"
            mv "$tmp" "$STATE_PATH"
          fi
          git config user.name undercast-star-trek-bootstrap-heartbeat
          git config user.email bootstrap-heartbeat@users.noreply.github.com
          git add "$STATE_PATH"
          git commit -m 'Star Trek rolling continuation: bootstrap heartbeat'
          git push origin "HEAD:refs/heads/${CONTROL_BRANCH}"

  inspect-benbassat-probes:
    if: ${{ github.event.head_commit.message == 'Inspect Star Trek Benbassat probes v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_BRANCH: agent/star-trek-rolling-continuation-v1
      TARGET_V1: 0464a7dcaa20655f4d7315a36fe1af285d04cf0d
      TARGET_V2: d7511e6ea41ba4d041842a05d436280b04b15bdc
      RESULT_BRANCH: agent/star-trek-benbassat-probe-inspection-result-v1
      OUT: /tmp/star-trek-benbassat-probe-inspection-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture exact source-probe runs and diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          gh run list --repo "$GITHUB_REPOSITORY" --branch "$CONTROL_BRANCH" --limit 100 --json databaseId,name,status,conclusion,headSha,event,displayTitle,createdAt,updatedAt,url > "$OUT/runs.json"
          for pair in v1:$TARGET_V1 v2:$TARGET_V2; do
            label="${pair%%:*}"
            sha="${pair#*:}"
            run_id="$(jq -r --arg sha "$sha" '[.[] | select(.headSha==$sha)] | sort_by(.databaseId) | last.databaseId // empty' "$OUT/runs.json")"
            test -n "$run_id"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$OUT/${label}-run.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "$OUT/${label}-jobs.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$OUT/${label}-artifacts.json"
            jq -r '.jobs[].id' "$OUT/${label}-jobs.json" | while read -r job_id; do
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --job "$job_id" --log > "$OUT/${label}-job-${job_id}.log" 2>&1 || true
            done
          done
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main.json"
          git show HEAD:transport/star-trek-rolling-continuation-v1/state.json > "$OUT/rolling-state.json"
          jq -n --arg transaction STAR-TREK-BENBASSAT-PROBE-INSPECTION-V1 --arg target_v1 "$TARGET_V1" --arg target_v2 "$TARGET_V2" --arg main "$(jq -r .commit.sha "$OUT/main.json")" --slurpfile v1 "$OUT/v1-run.json" --slurpfile v2 "$OUT/v2-run.json" '{version:1,transaction:$transaction,status:"captured",main:$main,target_v1:$target_v1,target_v2:$target_v2,v1:{id:$v1[0].id,status:$v1[0].status,conclusion:$v1[0].conclusion},v2:{id:$v2[0].id,status:$v2[0].status,conclusion:$v2[0].conclusion},canonical_mutation:false,lease_mutation:false}' > "$OUT/status.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
      - name: Publish probe inspection
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name undercast-benbassat-probe-inspector
          git config user.email benbassat-probe-inspector@users.noreply.github.com
          git checkout --orphan benbassat-probe-inspection-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-benbassat-probe-inspection-v1
          cp -a "$OUT"/. transport/star-trek-benbassat-probe-inspection-v1/
          git add transport/star-trek-benbassat-probe-inspection-v1
          git commit -m 'Record Star Trek Benbassat probe inspection v1'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
