name: doctor-who-cycle-009-cleanup-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-cleanup-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-cleanup-v4
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  CANONICAL_PARENT: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  CANONICAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  BRANCH: agent/doctor-who-cycle-009-cleanup-v4
  SELF: .github/workflows/doctor-who-cycle-009-cleanup-v4.yml
  PROOF_RUN: "31286873493"
  PROOF_ARTIFACT: "9030160281"
  PROOF_DIGEST: sha256:f1a08d336434d4159c18da24c52eae460e25c73ac15e42f818eb1c1b9c5649a8
  PROOF_HEAD: 4136226d397a12231714f2454c975f8b40253fc7
  V3_PR: "709"
  V3_SOURCE_HEAD: 9d329e26baeb855055989a6eecf7c497a4399154
  V3_CURRENT_HEAD: 94fc60c8cbbbea81d9baa84ef39adf85f63ce1f4
  V3_RUN: "31287552877"
  V3_VERIFY_JOB: "93179029640"
  V3_CLEANUP_JOB: "93179079321"
  V3_ARTIFACT: "9030324989"
  V3_DIGEST: sha256:2a1998c1f2170b74cff855348cc04a9763d7774d1f970008f811447e382152aa
  V3_TARGET_COUNT: "82"
  V3_TARGET_SHA256: a3622470813613e81fa08d7e0e6b0ce527e06252043ca01f7b13556e10c31d23
  TARGET_COUNT: "83"
  TARGET_SHA256: ccc4ef2a60cba8d1ac99f2812b269198b924d94711da5cae071f3662ea85e7ce
  REQUIRED_CHECK: publisher-custody-or-guard

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-cleanup-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      OUT: /tmp/doctor-who-cycle-009-cleanup-v4-verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute checksum-bound V4 verifier
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          RUNNER_GZ_B64: 
          RUNNER_SHA256: 5afc491f2f16f12db67a9ca96532c7b9c15cd8a8bbbf28d13a387662c4a83f1d
        run: |
          set -euo pipefail
          runner=/tmp/doctor-who-cycle-009-cleanup-v4-verify-runner.sh
          printf '%s' "$RUNNER_GZ_B64" | base64 -d | gzip -d > "$runner"
          test "$(sha256sum "$runner" | cut -d' ' -f1)" = "$RUNNER_SHA256"
          bash -n "$runner"
          chmod 700 "$runner"
          exec "$runner"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v4-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v4-verify/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v4-verify-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v4-verify
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  cleanup:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      SETTLEMENT: /tmp/doctor-who-cycle-009-cleanup-v4-settlement
      OUT: /tmp/doctor-who-cycle-009-cleanup-v4-write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v4-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v4-settlement

      - name: Execute checksum-bound isolated V4 writer
        shell: bash
        env:
          RUNNER_GZ_B64: 
          RUNNER_SHA256: b880ef32b0aa0c5d2bb5f76cea6f6b0f293a5ab6b97d2bfe70662f240b5d4e79
        run: |
          set -euo pipefail
          runner=/tmp/doctor-who-cycle-009-cleanup-v4-writer.sh
          printf '%s' "$RUNNER_GZ_B64" | base64 -d | gzip -d > "$runner"
          test "$(sha256sum "$runner" | cut -d' ' -f1)" = "$RUNNER_SHA256"
          bash -n "$runner"
          chmod 700 "$runner"
          exec "$runner"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v4-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v4-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v4-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v4-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
