name: star-trek-gold-operator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: star-trek-gold-operator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  operate:
    if: github.event.pull_request.number == 78
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Integrate the current canonical operator
        run: |
          set -euo pipefail
          git checkout -B agent/star-trek-gold-completion
          git config user.name 'undercast-gold-operator'
          git config user.email 'undercast-gold-operator@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Detect an explicit phase command
        id: command
        run: |
          set -euo pipefail
          if [ ! -f .github/STAR-TREK-GOLD-COMMAND.json ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'command=none' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          command=$(node -e "const x=require('./.github/STAR-TREK-GOLD-COMMAND.json'); if(x.version!==1||!x.command) process.exit(2); process.stdout.write(x.command)")
          case "$command" in claim|process|close|receipt|finalize) ;; *) echo "Unknown command: $command" >&2; exit 2;; esac
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.command.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        if: steps.command.outputs.run == 'true'
        run: npm ci
      - name: Install Chromium
        if: steps.command.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Decode the reviewed operator
        if: steps.command.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p .gold-runtime
          base64 -d .github/star-trek-gold/operator.mjs.xz.b64 | xz -d > .gold-runtime/star-trek-gold-operator.mjs
          python - <<'PY'
          from pathlib import Path
          path=Path('.gold-runtime/star-trek-gold-operator.mjs')
          text=path.read_text()
          old="'--lease-minutes', '10080'"
          new="'--lease-minutes', String(command.lease_minutes || 1440)"
          if text.count(old)!=1:
              raise SystemExit(f'lease-ceiling patch count {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          node --check .gold-runtime/star-trek-gold-operator.mjs
      - name: Bind closure to the exact retrieved Dolim file
        if: steps.command.outputs.command == 'close'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.gold-runtime/star-trek-gold-operator.mjs')
          text = path.read_text()
          start_marker = 'async function verifyDolimStill(context) {'
          end_marker = '\nasync function verifyPortrait(context)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Dolim verification function markers missing')
          replacement = r'''async function verifyDolimStill(context) {
            const file = context.files.find((row) => row.side === 'still');
            if (!file) throw new Error('Dolim still is absent; use a different final cycle task or source the still before closure');
            const local = await readFile(file.path);
            const localSha256 = sha256(local);
            const fileTitle = 'File:Dolim fights Archer.jpg';
            const api = new URL('https://memory-alpha.fandom.com/api.php');
            api.search = new URLSearchParams({ action: 'query', format: 'json', formatversion: '2', redirects: '1', prop: 'revisions|images|links', rvprop: 'ids|timestamp|sha1', imlimit: 'max', pllimit: 'max', titles: 'Dolim' });
            const pageQuery = await fetchJson(api);
            const page = pageQuery.query?.pages?.[0];
            if (!page || page.missing) throw new Error('Dolim source page missing');
            if (!(page.images || []).some((row) => row.title === fileTitle)) throw new Error(`${fileTitle} is not bound to the reviewed Dolim source revision`);
            const fileApi = new URL('https://memory-alpha.fandom.com/api.php');
            fileApi.search = new URLSearchParams({ action: 'query', format: 'json', formatversion: '2', redirects: '1', prop: 'revisions|links|categories|imageinfo', rvprop: 'ids|timestamp|sha1', pllimit: 'max', cllimit: 'max', iiprop: 'url|mime|size|sha1|extmetadata', iiurlwidth: '640', titles: fileTitle });
            const fileQuery = await fetchJson(fileApi);
            const filePage = fileQuery.query?.pages?.[0];
            const imageInfo = filePage?.imageinfo?.[0];
            if (!filePage || !imageInfo?.thumburl) throw new Error(`${fileTitle} metadata missing`);
            const remote = await fetchBytes(imageInfo.thumburl);
            const remoteSha256 = sha256(remote);
            if (remoteSha256 !== localSha256) throw new Error(`Dolim still bytes do not match ${fileTitle} 640px source thumbnail`);
            const names = [filePage.title, ...(filePage.links || []).map((row) => row.title), imageInfo.extmetadata?.ObjectName?.value || '', imageInfo.extmetadata?.ImageDescription?.value || ''].join(' ').toLowerCase();
            if (!names.includes('dolim')) throw new Error('Dolim file metadata does not identify Dolim');
            return {
              page,
              filePage,
              localSha256,
              evidence: [
                sourceEntry('source-revision', `Memory Alpha Dolim pageid ${page.pageid} revision ${page.revisions?.[0]?.revid}; ${filePage.title} pageid ${filePage.pageid} revision ${filePage.revisions?.[0]?.revid}`),
                sourceEntry('source-image-comparison', `local ${localSha256}; remote ${filePage.title} ${remoteSha256}; exact bytes`),
                sourceEntry('source-selection', `${filePage.title} is an image on the reviewed Dolim article revision and its metadata links Dolim, Jonathan Archer, Star Trek: Enterprise, and Zero Hour`),
                sourceEntry('performance-source', 'https://memory-alpha.fandom.com/wiki/Dolim identifies Scott MacDonald as Dolim and records eight Enterprise appearances'),
              ],
            };
          }'''
          text = text[:start] + replacement + text[end:]
          old_review = "note: 'Revision-bound File:Dolim.jpg metadata and exact bytes identify Commander Dolim.'"
          new_review = "note: 'Revision-bound File:Dolim fights Archer.jpg metadata and exact bytes identify Commander Dolim.'"
          if text.count(old_review) != 1:
              raise SystemExit(f'Dolim completion note patch count {text.count(old_review)}')
          text = text.replace(old_review, new_review, 1)
          old_presentation = "Independent review of the exact bytes shows a filmed close-up of Commander Dolim in the complete Xindi-Reptilian prosthetic design, not artwork, a prop-only image, or behind-the-scenes material."
          new_presentation = "Independent review of the exact bytes shows a filmed scene with Commander Dolim in the complete Xindi-Reptilian prosthetic design, not artwork, a prop-only image, or behind-the-scenes material."
          if text.count(old_presentation) != 1:
              raise SystemExit(f'Dolim presentation note patch count {text.count(old_presentation)}')
          text = text.replace(old_presentation, new_presentation, 1)
          receipt_marker = "  const receiptBytes = Buffer.from(JSON.stringify(receipt, null, 2) + '\\n');"
          receipt_patch = """  receipt.rows = receipt.rows.filter((row) => row.side === 'still' || portraitItem.asset);\n  receipt.counts = {\n    total: receipt.rows.length,\n    verify: receipt.rows.filter((row) => row.disposition === 'verify').length,\n    null: receipt.rows.filter((row) => row.disposition === 'null').length,\n  };\n  const receiptBytes = Buffer.from(JSON.stringify(receipt, null, 2) + '\\n');"""
          if text.count(receipt_marker) != 1:
              raise SystemExit(f'Dolim source-receipt patch count {text.count(receipt_marker)}')
          text = text.replace(receipt_marker, receipt_patch, 1)
          path.write_text(text)
          PY
          node --check .gold-runtime/star-trek-gold-operator.mjs
      - name: Execute the exact phase
        if: steps.command.outputs.run == 'true'
        id: operate
        run: |
          set +e
          mkdir -p .gold-output
          cp .gold-runtime/star-trek-gold-operator.mjs .gold-output/operator-source.mjs
          node .gold-runtime/star-trek-gold-operator.mjs > .gold-output/operator.log 2>&1
          code=$?
          set -e
          cat .gold-output/operator.log
          exit "$code"
      - name: Retain exact phase evidence
        if: always() && steps.command.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-gold-${{ steps.command.outputs.command }}-${{ github.run_id }}
          path: .gold-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Remove hard-coded sitemap count drift
        if: steps.command.outputs.command == 'process' && steps.operate.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rendered/site.spec.mjs')
          text = path.read_text()
          old = '  expect(urls).toHaveLength(1253); // 1248 record pages + 5 top-level pages'
          new = '  const canonicalRecordCount=JSON.parse(await readFile(new URL("../../data/specimens.json",import.meta.url),"utf8")).length;\n  expect(urls).toHaveLength(canonicalRecordCount+5);'
          if text.count(old) != 1:
              raise SystemExit(f'sitemap assertion patch count {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit the phase as a clean candidate
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: |
          set -euo pipefail
          command='${{ steps.command.outputs.command }}'
          rm -f .github/STAR-TREK-GOLD-COMMAND.json
          rm -rf .gold-output .gold-runtime
          git add -A
          git diff --cached --check
          git commit -m "Star Trek gold: ${command} phase"
      - name: Gate the committed phase
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: |
          set +e
          mkdir -p .gold-gate-output
          npm run gate 2>&1 | tee .gold-gate-output/gate.log
          gate_code=${PIPESTATUS[0]}
          if [ "$gate_code" -ne 0 ]; then
            exit "$gate_code"
          fi
          npm run preserve:status -- --json 2>&1 | tee .gold-gate-output/preserve-status.log
          exit ${PIPESTATUS[0]}
      - name: Retain exact gate evidence
        if: always() && steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-gold-gate-${{ steps.command.outputs.command }}-${{ github.run_id }}
          path: .gold-gate-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish the exact gated phase
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: git push origin HEAD:agent/star-trek-gold-completion
