name: star-trek-gold-operator

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: star-trek-gold-operator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  operate:
    if: github.event.pull_request.number == 78
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Integrate the current canonical operator
        run: |
          set -euo pipefail
          git checkout -B agent/star-trek-gold-completion
          git config user.name 'undercast-gold-operator'
          git config user.email 'undercast-gold-operator@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Detect an explicit phase command
        id: command
        run: |
          set -euo pipefail
          if [ ! -f .github/STAR-TREK-GOLD-COMMAND.json ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'command=none' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          command=$(node -e "const x=require('./.github/STAR-TREK-GOLD-COMMAND.json'); if(x.version!==1||!x.command) process.exit(2); process.stdout.write(x.command)")
          case "$command" in claim|process|close|receipt|finalize) ;; *) echo "Unknown command: $command" >&2; exit 2;; esac
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.command.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        if: steps.command.outputs.run == 'true'
        run: npm ci
      - name: Install Chromium
        if: steps.command.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Decode the reviewed operator
        if: steps.command.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p .gold-runtime
          base64 -d .github/star-trek-gold/operator.mjs.xz.b64 | xz -d > .gold-runtime/star-trek-gold-operator.mjs
          python - <<'PY'
          from pathlib import Path
          path=Path('.gold-runtime/star-trek-gold-operator.mjs')
          text=path.read_text()
          old="'--lease-minutes', '10080'"
          new="'--lease-minutes', String(command.lease_minutes || 1440)"
          if text.count(old)!=1:
              raise SystemExit(f'lease-ceiling patch count {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          node --check .gold-runtime/star-trek-gold-operator.mjs
      - name: Resolve exact Dolim candidate provenance
        if: steps.command.outputs.command == 'close'
        run: |
          set -euo pipefail
          mkdir -p .gold-output
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const api = async (params) => {
            const url = new URL('https://memory-alpha.fandom.com/api.php');
            url.search = new URLSearchParams({ action: 'query', format: 'json', formatversion: '2', redirects: '1', ...params });
            const response = await fetch(url, { headers: { 'User-Agent': 'undercast-gold-operator/1.0 (bigbirdreturns@proton.me)' } });
            if (!response.ok) throw new Error(`${url} returned ${response.status}`);
            return response.json();
          };
          const local = await readFile('images/uc-1280-still.jpg');
          const localSha256 = sha256(local);
          const pageQuery = await api({ prop: 'revisions|pageimages|images', rvprop: 'ids|timestamp|sha1', piprop: 'name', imlimit: 'max', titles: 'Dolim' });
          const page = pageQuery.query?.pages?.[0];
          if (!page || page.missing) throw new Error('Dolim source page missing');
          const names = (page.images || []).map((row) => row.title).filter((title) => /\.(?:jpe?g|png)$/i.test(title) && title.toLowerCase().includes('dolim')).slice(0, 20);
          const candidates = [];
          for (const title of names) {
            const query = await api({ prop: 'revisions|links|categories|imageinfo', rvprop: 'ids|timestamp|sha1', pllimit: 'max', cllimit: 'max', iiprop: 'url|mime|size|sha1|extmetadata', iiurlwidth: '640', titles: title });
            const filePage = query.query?.pages?.[0];
            const imageInfo = filePage?.imageinfo?.[0];
            if (!imageInfo?.thumburl) continue;
            const response = await fetch(imageInfo.thumburl, { headers: { 'User-Agent': 'undercast-gold-operator/1.0 (bigbirdreturns@proton.me)' } });
            if (!response.ok) throw new Error(`${imageInfo.thumburl} returned ${response.status}`);
            const remote = Buffer.from(await response.arrayBuffer());
            candidates.push({
              title: filePage.title,
              pageid: filePage.pageid,
              revision: filePage.revisions?.[0]?.revid || null,
              revision_timestamp: filePage.revisions?.[0]?.timestamp || null,
              mediawiki_sha1: imageInfo.sha1 || null,
              thumburl: imageInfo.thumburl,
              remote_sha256: sha256(remote),
              remote_bytes: remote.length,
              exact: sha256(remote) === localSha256,
              object_name: imageInfo.extmetadata?.ObjectName?.value || null,
              description: imageInfo.extmetadata?.ImageDescription?.value || null,
              links: (filePage.links || []).map((row) => row.title),
              categories: (filePage.categories || []).map((row) => row.title),
            });
          }
          const result = {
            version: 1,
            source_page: { title: page.title, pageid: page.pageid, revision: page.revisions?.[0]?.revid || null, revision_timestamp: page.revisions?.[0]?.timestamp || null, lead_file: page.pageimage || null },
            local: { path: 'images/uc-1280-still.jpg', sha256: localSha256, bytes: local.length },
            candidates,
            exact_matches: candidates.filter((row) => row.exact),
          };
          await writeFile('.gold-output/dolim-source-diagnostic.json', JSON.stringify(result, null, 2) + '\n');
          console.log(`Dolim source candidates: ${candidates.length}; exact matches: ${result.exact_matches.map((row) => row.title).join(', ') || 'none'}`);
          JS
      - name: Execute the exact phase
        if: steps.command.outputs.run == 'true'
        id: operate
        run: |
          set +e
          mkdir -p .gold-output
          cp .gold-runtime/star-trek-gold-operator.mjs .gold-output/operator-source.mjs
          node .gold-runtime/star-trek-gold-operator.mjs > .gold-output/operator.log 2>&1
          code=$?
          set -e
          cat .gold-output/operator.log
          exit "$code"
      - name: Retain exact phase evidence
        if: always() && steps.command.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-gold-${{ steps.command.outputs.command }}-${{ github.run_id }}
          path: .gold-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Remove hard-coded sitemap count drift
        if: steps.command.outputs.command == 'process' && steps.operate.outcome == 'success'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/rendered/site.spec.mjs')
          text = path.read_text()
          old = '  expect(urls).toHaveLength(1253); // 1248 record pages + 5 top-level pages'
          new = '  const canonicalRecordCount=JSON.parse(await readFile(new URL("../../data/specimens.json",import.meta.url),"utf8")).length;\n  expect(urls).toHaveLength(canonicalRecordCount+5);'
          if text.count(old) != 1:
              raise SystemExit(f'sitemap assertion patch count {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit the phase as a clean candidate
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: |
          set -euo pipefail
          command='${{ steps.command.outputs.command }}'
          rm -f .github/STAR-TREK-GOLD-COMMAND.json
          rm -rf .gold-output .gold-runtime
          git add -A
          git diff --cached --check
          git commit -m "Star Trek gold: ${command} phase"
      - name: Gate the committed phase
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: |
          set +e
          mkdir -p .gold-gate-output
          npm run gate 2>&1 | tee .gold-gate-output/gate.log
          gate_code=${PIPESTATUS[0]}
          if [ "$gate_code" -ne 0 ]; then
            exit "$gate_code"
          fi
          npm run preserve:status -- --json 2>&1 | tee .gold-gate-output/preserve-status.log
          exit ${PIPESTATUS[0]}
      - name: Retain exact gate evidence
        if: always() && steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-gold-gate-${{ steps.command.outputs.command }}-${{ github.run_id }}
          path: .gold-gate-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Publish the exact gated phase
        if: steps.command.outputs.run == 'true' && steps.operate.outcome == 'success'
        run: git push origin HEAD:agent/star-trek-gold-completion
