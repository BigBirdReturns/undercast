name: repair-doctor-who-activation-final-baseline

on:
  push:
    branches:
      - agent/doctor-who-pilot-activation-current
    paths:
      - ".github/workflows/repair-doctor-who-activation-final-baseline.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-activation-final-baseline-current
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/doctor-who-pilot-activation-current
  EXPECTED_MAIN: 23ea1165065500e540b84eb0aa6f1de203cfc530
  SELF: .github/workflows/repair-doctor-who-activation-final-baseline.yml
  PRIMARY: .github/workflows/apply-doctor-who-activation-001.yml

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the adapter baseline to the final registry state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXPECTED_MAIN"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-doctor-who-activation-001.yml')
          text = path.read_text()
          old = """          fs.writeFileSync('data/ESTATE-REGISTRY.json', JSON.stringify(registry, null, 2) + '\\n');
          NODE

          set +e
          node scripts/waterline.mjs gate \\
"""
          new = """          fs.writeFileSync('data/ESTATE-REGISTRY.json', JSON.stringify(registry, null, 2) + '\\n');
          NODE

          # BASELINE.json binds ESTATE-REGISTRY.json; regenerate only after the
          # lease-specific next_gate above becomes the final registry state.
          node scripts/census-adapter.mjs write
          node scripts/census-adapter.mjs check

          set +e
          node scripts/waterline.mjs gate \\
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'final adapter baseline insertion: expected one match, found {count}')
          path.write_text(text.replace(old, new))
          PY

          git add "$PRIMARY"
          git rm "$SELF"
          git diff --cached --check

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Activation: bind adapter baseline to final registry state' \
            -m 'regenerate after the lease-specific next-gate mutation'

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"
