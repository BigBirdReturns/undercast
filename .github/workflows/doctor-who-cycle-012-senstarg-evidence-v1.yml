name: doctor-who-cycle-012-senstarg-evidence-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-evidence-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-evidence-v1
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-senstarg-evidence-v1
      SELF: .github/workflows/doctor-who-cycle-012-senstarg-evidence-v1.yml
      OUT: /tmp/doctor-who-cycle-012-senstarg-evidence-v1
      SELECTOR_PACKET: /tmp/doctor-who-cycle-012-senstarg-evidence-v1-selector
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      SELECTOR_PR: "866"
      SELECTOR_BRANCH: agent/doctor-who-cycle-012-preflight-v13
      SELECTOR_HEAD: a0265638e30fbb669a09bb5ce1704c9853dbc2ce
      SELECTOR_RUN: "31368785967"
      SELECTOR_JOB: "93392885230"
      SELECTOR_ARTIFACT: "9055273612"
      SELECTOR_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v13-31368785967-attempt-1
      SELECTOR_ARTIFACT_BYTES: "170382"
      SELECTOR_ARTIFACT_SHA256: c1ce1b79cbcdb29cf66f8cfd142269cac243777e4a7ad710f55bb795f09c3aeb
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      TRANSPORT_IDENTITY: fbe1b123c9ad17a23ff717fbaa47e2f59cc85032fc48a94648eb1d64e20f2da0
      TERMINAL_PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      V12_FAILURE_IDENTITY: cf8290c7b2bc94a0f0995b9a4334c9e72c322ed6a3390fcd2972ac5cde462a3c
      V13_REPAIR_IDENTITY: 73a7e8519c9489432573742a4fac4b7f6bbacf723e7ed560a7615ae89316ba3b
      EXPECTED_TASK: ap_8965086737382df0e88366db
      EXPECTED_PERFORMER: Dan Starkey
      EXPECTED_ROLE: Senstarg
      EXPECTED_MODE: unresolved
      EXPECTED_PRIORITY: "800"
      EXPECTED_SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      EXPECTED_SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      SOURCE_ORIGIN: https://tardis.fandom.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind one-commit evidence carrier and exact successful selector
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SELECTOR_PACKET"
          mkdir -p "$OUT"/{api,logs,receipt,selection,source,payload} "$SELECTOR_PACKET"

          test "$CURRENT_BASE" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SELECTOR_PR" > "$OUT/api/selector-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN" > "$OUT/api/selector-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN/jobs?per_page=100" > "$OUT/api/selector-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT" > "$OUT/api/selector-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT/zip" > "$OUT/selector.zip"
          test "$(sha256sum "$OUT/selector.zip" | awk '{print $1}')" = "$SELECTOR_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/selector-artifact.json")" = "sha256:$SELECTOR_ARTIFACT_SHA256"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          api = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((api / name).read_text())
          carrier = load('carrier-pr.json')
          selector = load('selector-pr.json')
          run = load('selector-run.json')
          jobs = load('selector-jobs.json')['jobs']
          artifact = load('selector-artifact.json')

          assert carrier['number'] == int(os.environ['CURRENT_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CURRENT_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1

          assert selector['number'] == int(os.environ['SELECTOR_PR'])
          assert selector['state'] in {'open', 'closed'} and selector['draft'] is True and selector['merged_at'] is None
          assert selector['base']['sha'] == os.environ['MAIN']
          assert selector['head']['ref'] == os.environ['SELECTOR_BRANCH'] and selector['head']['sha'] == os.environ['SELECTOR_HEAD']
          assert selector['commits'] == 1 and selector['changed_files'] == 1

          assert run['id'] == int(os.environ['SELECTOR_RUN'])
          assert run['head_sha'] == os.environ['SELECTOR_HEAD'] and run['head_branch'] == os.environ['SELECTOR_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          rows = [row for row in jobs if row['id'] == int(os.environ['SELECTOR_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['status'] == 'completed' and rows[0]['conclusion'] == 'success'
          steps = rows[0]['steps']
          target = [row for row in steps if row['name'] == 'Bind V12 geometry failure and execute exact V13 repair']
          assert len(target) == 1 and target[0]['status'] == 'completed' and target[0]['conclusion'] == 'success'
          uploads = [(row['status'], row['conclusion']) for row in steps if row['name'] == 'Run actions/upload-artifact@v4']
          assert uploads == [('completed', 'success'), ('completed', 'skipped')], uploads

          assert artifact['id'] == int(os.environ['SELECTOR_ARTIFACT'])
          assert artifact['name'] == os.environ['SELECTOR_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['SELECTOR_ARTIFACT_BYTES'])
          assert artifact['digest'] == 'sha256:' + os.environ['SELECTOR_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SELECTOR_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SELECTOR_HEAD']
          PY

      - name: Authenticate selector packet and normalize exact Senstarg authority
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/selector.zip" TARGET="$SELECTOR_PACKET" python3 - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          target = Path(os.environ['TARGET'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))

          files = sorted(path.relative_to(target).as_posix() for path in target.rglob('*') if path.is_file())
          expected_files = sorted([
              'SELECTION_COMPLETE',
              'SHA256SUMS',
              'SHA256SUMS.pre',
              'autopilot-status.json',
              'candidates.json',
              'complete-gate.log',
              'selection.json',
              'selector-command.json',
              'source-authentication.json',
              'terminal-proof.json',
              'transport-custody.json',
              'v11-failure.json',
              'v12-failure.json',
              'v13-repair.json',
              'waterline-status.json',
          ])
          assert files == expected_files, {'extra': sorted(set(files)-set(expected_files)), 'missing': sorted(set(expected_files)-set(files))}

          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest

          def load(name):
              return json.loads((target / name).read_text())

          def verify_identity(data, expected=None):
              copy = dict(data)
              identity = copy.pop('identity')
              assert sha(json.dumps(copy, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == identity
              if expected is not None:
                  assert identity == expected
              return identity

          selection = load('selection.json')
          transport = load('transport-custody.json')
          terminal = load('terminal-proof.json')
          source_auth = load('source-authentication.json')
          v12_failure = load('v12-failure.json')
          v13_repair = load('v13-repair.json')
          command = load('selector-command.json')
          autopilot = load('autopilot-status.json')
          waterline = load('waterline-status.json')
          candidates = load('candidates.json')

          verify_identity(selection, os.environ['SELECTION_IDENTITY'])
          verify_identity(transport, os.environ['TRANSPORT_IDENTITY'])
          verify_identity(terminal, os.environ['TERMINAL_PROOF_IDENTITY'])
          verify_identity(source_auth)
          verify_identity(v12_failure, os.environ['V12_FAILURE_IDENTITY'])
          verify_identity(v13_repair, os.environ['V13_REPAIR_IDENTITY'])
          verify_identity(command)

          assert (target / 'SELECTION_COMPLETE').read_text().strip() == os.environ['SELECTION_IDENTITY']
          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert selection['canonical']['main'] == os.environ['MAIN']
          assert selection['carrier'] == {
              'base': os.environ['MAIN'],
              'branch': os.environ['SELECTOR_BRANCH'],
              'head': os.environ['SELECTOR_HEAD'],
              'pr': int(os.environ['SELECTOR_PR']),
          }
          assert selection['selected_task_id'] == os.environ['EXPECTED_TASK']
          task = selection['selected_task']
          assert task['task_id'] == os.environ['EXPECTED_TASK']
          assert task['performer'] == os.environ['EXPECTED_PERFORMER']
          assert task['character'] == os.environ['EXPECTED_ROLE']
          assert task['performance_modes'] == [os.environ['EXPECTED_MODE']]
          assert task['priority'] == int(os.environ['EXPECTED_PRIORITY'])
          assert task['sources'] == [os.environ['EXPECTED_SOURCE_URL']]
          assert task['source_fingerprint'] == os.environ['EXPECTED_SOURCE_FINGERPRINT']
          assert selection['normalized'] == {
              'performer': os.environ['EXPECTED_PERFORMER'],
              'role': os.environ['EXPECTED_ROLE'],
              'mode': os.environ['EXPECTED_MODE'],
          }
          assert selection['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert selection['waterline']['claim_allowed'] is True
          assert selection['waterline']['media_debt'] == 0 and selection['waterline']['unreceipted'] == []
          assert selection['transport_custody'] == {'identity': os.environ['TRANSPORT_IDENTITY'], 'pull_requests': 17, 'refs_to_delete': 19}
          assert selection['boundary'] == {
              'selection_only': True,
              'lease_issued': False,
              'queue_mutated': False,
              'canonical_mutated': False,
              'wall_created': False,
              'media_adopted': False,
              'cycle_receipt_written': False,
              'transport_mutation': False,
              'cycle_012_product_authority': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          assert transport['selector'] == {'pr': int(os.environ['SELECTOR_PR']), 'branch': os.environ['SELECTOR_BRANCH'], 'head': os.environ['SELECTOR_HEAD']}
          assert transport['counts'] == {'stale_cycle12_refs': 17, 'observer_refs': 2, 'refs_to_delete': 19, 'pull_requests': 17}
          assert len(transport['refs_to_delete']) == 19 and len(transport['pull_requests']) == 17
          assert terminal['authority']['cycle_012_selection_authorized'] is True
          assert terminal['authority']['cycle_012_lease_issued'] is False
          assert source_auth['recovered']['selected_task_id'] == os.environ['EXPECTED_TASK']
          assert source_auth['recovered']['total_compatible'] == 305 and source_auth['recovered']['returned_compatible'] == 200
          assert v12_failure['failure']['selection_emitted'] is False
          assert v13_repair['semantics'] == {
              'selector_runner_changed': False,
              'source_packet_changed': False,
              'selected_task_changed': False,
              'lease_authority_changed': False,
              'product_authority_changed': False,
          }
          assert command['identity'] == selection['command']['identity']
          assert autopilot['total'] == 316 and autopilot['statuses']['queued'] == 305 and autopilot['statuses']['resolved'] == 11 and autopilot['in_flight'] == 0
          assert waterline['claim_allowed'] is True and waterline['jobs']['in_flight'] == 0 and waterline['media']['debt'] == 0 and waterline['cycles']['unreceipted'] == []
          assert isinstance(candidates.get('compatible'), list) and len(candidates['compatible']) == 200
          assert candidates['compatible'][0]['task_id'] == os.environ['EXPECTED_TASK']

          normalized = {
              'task_id': os.environ['EXPECTED_TASK'],
              'performer': os.environ['EXPECTED_PERFORMER'],
              'role': os.environ['EXPECTED_ROLE'],
              'mode': os.environ['EXPECTED_MODE'],
              'priority': int(os.environ['EXPECTED_PRIORITY']),
              'source_url': os.environ['EXPECTED_SOURCE_URL'],
              'source_fingerprint': os.environ['EXPECTED_SOURCE_FINGERPRINT'],
              'selection_identity': os.environ['SELECTION_IDENTITY'],
              'transport_identity': os.environ['TRANSPORT_IDENTITY'],
          }
          root = Path(os.environ['OUT'])
          (root / 'selection/normalized.json').write_text(json.dumps(normalized, indent=2, sort_keys=True) + '\n')
          for name in expected_files:
              src = target / name
              dst = root / 'selection' / name
              dst.write_bytes(src.read_bytes())
          PY

          printf 'CANONICAL_MAIN=%s\nTASK_ID=%s\nPERFORMER=%s\nROLE=%s\nMODE=%s\nSOURCE_URL=%s\nSOURCE_FINGERPRINT=%s\n' \
            "$MAIN" "$EXPECTED_TASK" "$EXPECTED_PERFORMER" "$EXPECTED_ROLE" "$EXPECTED_MODE" "$EXPECTED_SOURCE_URL" "$EXPECTED_SOURCE_FINGERPRINT" >> "$GITHUB_ENV"

      - name: Retrieve latest Senstarg source and freeze exact immutable revision
        shell: bash
        run: |
          set -euo pipefail
          title="$(SOURCE_URL="$SOURCE_URL" python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse
          url = urlparse(os.environ['SOURCE_URL'])
          assert url.scheme == 'https' and url.netloc == 'tardis.fandom.com'
          assert url.query == '' and url.fragment == '' and url.path.startswith('/wiki/')
          title = unquote(url.path.removeprefix('/wiki/')).replace('_', ' ')
          assert title == os.environ['ROLE']
          print(title)
          PY
          )"

          curl --fail --location --compressed --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --get "$SOURCE_ORIGIN/api.php" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode "titles=$title" \
            --data-urlencode redirects=1 \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            -D "$OUT/source/title-headers.txt" \
            -o "$OUT/source/title-query.json"

          SOURCE_TITLE="$title" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import unicodedata
          from pathlib import Path

          root = Path(os.environ['OUT'])
          payload = json.loads((root / 'source/title-query.json').read_text())
          pages = payload.get('query', {}).get('pages', [])
          assert len(pages) == 1, pages
          page = pages[0]
          assert 'missing' not in page and int(page['pageid']) > 0
          revisions = page.get('revisions', [])
          assert len(revisions) == 1, revisions
          revision = revisions[0]
          slots = revision.get('slots', {})
          main = slots.get('main', {})
          content = main.get('content')
          if content is None:
              content = main.get('*')
          if content is None:
              content = revision.get('*')
          assert isinstance(content, str) and content

          def fold(value):
              value = unicodedata.normalize('NFKC', value).casefold()
              return re.sub(r'\s+', ' ', value)

          body = fold(content)
          performer = fold(os.environ['PERFORMER'])
          role = fold(os.environ['ROLE'])
          title = fold(page.get('title', ''))
          assert performer in body, (os.environ['PERFORMER'], page.get('title'))
          assert role in body or role == title, (os.environ['ROLE'], page.get('title'))

          raw = content.encode('utf-8')
          discovery = {
              'requested_title': os.environ['SOURCE_TITLE'],
              'resolved_title': page.get('title'),
              'page_id': int(page['pageid']),
              'revision_id': int(revision['revid']),
              'parent_id': revision.get('parentid'),
              'timestamp': revision.get('timestamp'),
              'content_bytes': len(raw),
              'content_sha256': hashlib.sha256(raw).hexdigest(),
              'performer_match': True,
              'role_match': True,
          }
          (root / 'source/discovery.json').write_text(json.dumps(discovery, indent=2, sort_keys=True) + '\n')
          (root / 'source/discovered-content.wikitext').write_text(content)
          PY

          page_id="$(jq -r '.page_id' "$OUT/source/discovery.json")"
          revision_id="$(jq -r '.revision_id' "$OUT/source/discovery.json")"
          content_sha="$(jq -r '.content_sha256' "$OUT/source/discovery.json")"

          curl --fail --location --compressed --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --get "$SOURCE_ORIGIN/api.php" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode "revids=$revision_id" \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            -D "$OUT/source/revision-headers.txt" \
            -o "$OUT/source/revision-query.json"

          SOURCE_PAGE_ID="$page_id" SOURCE_REVISION_ID="$revision_id" DISCOVERED_CONTENT_SHA256="$content_sha" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import unicodedata
          from pathlib import Path

          root = Path(os.environ['OUT'])
          payload = json.loads((root / 'source/revision-query.json').read_text())
          pages = payload.get('query', {}).get('pages', [])
          assert len(pages) == 1, pages
          page = pages[0]
          assert int(page['pageid']) == int(os.environ['SOURCE_PAGE_ID'])
          revisions = page.get('revisions', [])
          assert len(revisions) == 1, revisions
          revision = revisions[0]
          assert int(revision['revid']) == int(os.environ['SOURCE_REVISION_ID'])
          slots = revision.get('slots', {})
          main = slots.get('main', {})
          content = main.get('content')
          if content is None:
              content = main.get('*')
          if content is None:
              content = revision.get('*')
          assert isinstance(content, str) and content
          raw = content.encode('utf-8')
          digest = hashlib.sha256(raw).hexdigest()
          assert digest == os.environ['DISCOVERED_CONTENT_SHA256']
          assert content == (root / 'source/discovered-content.wikitext').read_text()

          def fold(value):
              value = unicodedata.normalize('NFKC', value).casefold()
              return re.sub(r'\s+', ' ', value)

          body = fold(content)
          performer = fold(os.environ['PERFORMER'])
          role = fold(os.environ['ROLE'])
          title = fold(page.get('title', ''))
          assert performer in body
          assert role in body or role == title

          source = {
              'url': os.environ['SOURCE_URL'],
              'origin': os.environ['SOURCE_ORIGIN'],
              'requested_title': os.environ['ROLE'],
              'resolved_title': page.get('title'),
              'page_id': int(page['pageid']),
              'revision_id': int(revision['revid']),
              'parent_id': revision.get('parentid'),
              'timestamp': revision.get('timestamp'),
              'content_bytes': len(raw),
              'content_sha256': digest,
              'source_fingerprint': os.environ['SOURCE_FINGERPRINT'],
              'performer': os.environ['PERFORMER'],
              'role': os.environ['ROLE'],
              'performer_match': True,
              'role_match': True,
              'discovery_and_revision_queries_match': True,
          }
          source['identity'] = hashlib.sha256(json.dumps(source, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (root / 'source/source.json').write_text(json.dumps(source, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'source/content.wikitext').write_text(content)
          PY

          printf 'SOURCE_PAGE_ID=%s\nSOURCE_REVISION_ID=%s\nSOURCE_CONTENT_SHA256=%s\nSOURCE_RECEIPT_IDENTITY=%s\n' \
            "$page_id" "$revision_id" "$content_sha" "$(jq -r '.identity' "$OUT/source/source.json")" >> "$GITHUB_ENV"

      - name: Rerun current-main queue, media, waterline, and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal checksum-bound Senstarg evidence packet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['OUT'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          selection = json.loads((root / 'selection/selection.json').read_text())
          transport = json.loads((root / 'selection/transport-custody.json').read_text())
          normalized = json.loads((root / 'selection/normalized.json').read_text())
          source = json.loads((root / 'source/source.json').read_text())
          autopilot = json.loads((root / 'receipt/autopilot-status.json').read_text())
          waterline = json.loads((root / 'receipt/waterline-status.json').read_text())

          receipt = {
              'status': 'cycle-012-doctor-who-senstarg-evidence-complete-v1',
              'version': 1,
              'carrier': {
                  'pr': int(os.environ['CURRENT_PR']),
                  'branch': os.environ['BRANCH'],
                  'head': os.environ['CURRENT_HEAD'],
                  'base': os.environ['MAIN'],
              },
              'selector': {
                  'pr': int(os.environ['SELECTOR_PR']),
                  'branch': os.environ['SELECTOR_BRANCH'],
                  'head': os.environ['SELECTOR_HEAD'],
                  'run': int(os.environ['SELECTOR_RUN']),
                  'job': int(os.environ['SELECTOR_JOB']),
                  'artifact': int(os.environ['SELECTOR_ARTIFACT']),
                  'artifact_sha256': os.environ['SELECTOR_ARTIFACT_SHA256'],
                  'selection_identity': os.environ['SELECTION_IDENTITY'],
                  'transport_identity': os.environ['TRANSPORT_IDENTITY'],
              },
              'canonical_main': os.environ['MAIN'],
              'task': {
                  'id': normalized['task_id'],
                  'performer': normalized['performer'],
                  'role': normalized['role'],
                  'mode': normalized['mode'],
                  'priority': normalized['priority'],
                  'source_url': normalized['source_url'],
                  'source_fingerprint': normalized['source_fingerprint'],
              },
              'source': source,
              'queue': {
                  'total': autopilot['total'],
                  'queued': autopilot['statuses']['queued'],
                  'resolved': autopilot['statuses']['resolved'],
                  'in_flight': autopilot['in_flight'],
              },
              'waterline': {
                  'phase': waterline['phase'],
                  'claim_allowed': waterline['claim_allowed'],
                  'media_debt': waterline['media']['debt'],
                  'unreceipted': waterline['cycles']['unreceipted'],
              },
              'transport_custody': {
                  'identity': transport['identity'],
                  'refs_to_delete': transport['counts']['refs_to_delete'],
                  'pull_requests': transport['counts']['pull_requests'],
                  'retained_selector': transport['selector'],
              },
              'gates': {
                  'selector_artifact': True,
                  'selector_checksum_ledger': True,
                  'selector_self_hash': True,
                  'selector_completion_marker': True,
                  'transport_custody': True,
                  'cycle_010': True,
                  'cycle_011': True,
                  'autopilot': True,
                  'media_22_of_22': True,
                  'waterline': True,
                  'complete_rendered_gate': True,
                  'source_title_query': True,
                  'immutable_revision_query': True,
                  'source_queries_byte_equal': True,
                  'source_content_sha256': True,
                  'performer_match': True,
                  'role_match': True,
              },
              'boundary': {
                  'evidence_only': True,
                  'repository_write': False,
                  'transport_mutation': False,
                  'lease_issued': False,
                  'queue_mutated': False,
                  'canonical_mutated': False,
                  'wall_created': False,
                  'character_image_adopted': False,
                  'performer_portrait_adopted': False,
                  'cycle_receipt_written': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = sha(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          payload = root / 'payload'
          payload.mkdir(parents=True, exist_ok=True)
          (payload / 'evidence.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (payload / 'EVIDENCE_COMPLETE').write_text(receipt['identity'] + '\n')

          copies = {
              'selection.json': root / 'selection/selection.json',
              'transport-custody.json': root / 'selection/transport-custody.json',
              'terminal-proof.json': root / 'selection/terminal-proof.json',
              'selector-command.json': root / 'selection/selector-command.json',
              'source-authentication.json': root / 'selection/source-authentication.json',
              'v12-failure.json': root / 'selection/v12-failure.json',
              'v13-repair.json': root / 'selection/v13-repair.json',
              'source.json': root / 'source/source.json',
              'source-title-query.json': root / 'source/title-query.json',
              'source-revision-query.json': root / 'source/revision-query.json',
              'source-content.wikitext': root / 'source/content.wikitext',
              'source-title-headers.txt': root / 'source/title-headers.txt',
              'source-revision-headers.txt': root / 'source/revision-headers.txt',
              'autopilot-status.json': root / 'receipt/autopilot-status.json',
              'waterline-status.json': root / 'receipt/waterline-status.json',
              'cycle-010.log': root / 'logs/cycle-010.log',
              'cycle-011.log': root / 'logs/cycle-011.log',
              'media-gate.log': root / 'logs/media-gate.log',
              'complete-gate.log': root / 'logs/complete-gate.log',
          }
          for name, src in copies.items():
              assert src.is_file(), src
              (payload / name).write_bytes(src.read_bytes())
          PY

          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do
              sha256sum "$name"
            done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            test "$(cat EVIDENCE_COMPLETE)" = "$(jq -r '.identity' evidence.json)"
            sha256sum -c SHA256SUMS.pre
            test "$(sha256sum SHA256SUMS.pre | awk '{print $1}')" = "$(awk '{print $1}' SHA256SUMS)"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-evidence-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-evidence-v1
            /tmp/doctor-who-cycle-012-senstarg-evidence-v1-selector
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
