name: doctor-who-cycle-008-kreg-bootstrap-v7e

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7e.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-bootstrap-v7e-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-bootstrap-v7e'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7e.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7e
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      SOURCE_COMMIT: b82847c60f0594ff0ba29f0663e61824117abff2
      SOURCE_BLOB: a5fd78adbcb59ebdc8b619d981f561b577960d22
      SOURCE_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7b.yml
      V6_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v6
      V6_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v6
      OUT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7e
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7e-stable-scripts
      V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
      V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
      V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
      ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
      MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
      MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
      RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
      PREFLIGHT_ARTIFACT: "8962423257"
      PREFLIGHT_DIGEST: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
      CENSUS_ARTIFACT: "8971420444"
      CENSUS_DIGEST: 75dab09bac152256ba5b9f471b244af1916b509d453e60adbc39d5aa7503905c
      REVIEW_ARTIFACT: "8971625526"
      REVIEW_DIGEST: 3e9d57566cddd961074a7f46839b565bb797d86958993f555cb5add9f5982b5c
      PUBLICATION_ARTIFACT: "8972359020"
      PUBLICATION_DIGEST: 40a7726498b5d2030b732c78a4da51e5da821fb622c6cc4e616489f48962d339
      MEDIA_ASSET_ID: "504051495"
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover immutable V7b source and construct stable repaired scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SCRIPT_ROOT"
          mkdir -p "$OUT"/{api,diagnostics,recovered,work} "$SCRIPT_ROOT/scripts"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          floor="$1"
          test "$(git rev-list --count "$floor"..HEAD)" = 1
          test "$(git diff --name-only "$floor"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$floor"...HEAD)" = $'A\t'"$SELF"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$SCRIPT_ROOT/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$SCRIPT_ROOT/pr-files.json"
          ROOT="$SCRIPT_ROOT" FLOOR="$floor" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'pr.json').read_text())
          files=json.loads((root/'pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main'
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY

          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          live="$(git rev-parse refs/remotes/origin/main)"
          test "$(git merge-base "$floor" "$live")" = "$floor"
          if [ "$live" != "$floor" ]; then
            gh api "/repos/$GITHUB_REPOSITORY/compare/$floor...$live" > "$SCRIPT_ROOT/floor-to-live.json"
            jq -e --arg FLOOR "$floor" --arg LIVE "$live" \
              '.merge_base_commit.sha==$FLOOR and .head_commit.sha==$LIVE and .behind_by==0 and (.files|length)>0 and ([.files[].filename] | all(startswith(".github/workflows/")))' \
              "$SCRIPT_ROOT/floor-to-live.json" >/dev/null
          fi

          gh api "/repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT" > "$SCRIPT_ROOT/source-commit.json"
          jq -e --arg commit "$SOURCE_COMMIT" --arg path "$SOURCE_PATH" --arg blob "$SOURCE_BLOB" \
            '.sha==$commit and any(.files[]; .filename==$path and .sha==$blob and .status=="added")' \
            "$SCRIPT_ROOT/source-commit.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$SCRIPT_ROOT/source-blob.json"
          jq -e --arg blob "$SOURCE_BLOB" '.sha==$blob and .encoding=="base64"' "$SCRIPT_ROOT/source-blob.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/source-blob.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/v7b.yml"
          test "$(git hash-object "$SCRIPT_ROOT/v7b.yml")" = "$SOURCE_BLOB"

          SOURCE="$SCRIPT_ROOT/v7b.yml" TARGET="$SCRIPT_ROOT/scripts" python3 - <<'PY'
          import os, re
          from pathlib import Path
          import yaml

          source=Path(os.environ['SOURCE'])
          target=Path(os.environ['TARGET'])
          doc=yaml.safe_load(source.read_text())
          assert isinstance(doc,dict) and isinstance(doc.get('jobs'),dict)
          steps=doc['jobs']['qualify']['steps']
          wanted=[
            'Bind exact one-file carrier and descendant-safe live main',
            'Retain exact terminal V6 diagnostic packet',
            'Recover immutable V1 package',
            'Recover retained evidence and served Kreg media',
            'Adaptively execute exact V1 runner',
            'Normalize and squash exact forty-path candidate',
            'Gate candidate and recompose over any workflow-only main successor',
            'Seal deterministic candidate packet',
          ]
          found={s.get('name'):s.get('run') for s in steps if s.get('name') in wanted}
          assert list(found)==wanted, (list(found),wanted)

          stable_expr="base=" + "'$" + "{{ steps.gate.outputs.stable_main }}'"
          candidate_expr="candidate=" + "'$" + "{{ steps.gate.outputs.candidate_commit }}'"
          counts={'stable':0,'candidate':0,'base_sha':0,'artifact_downloads':0}
          artifact_pattern=re.compile(
              r'(?m)^(?P<indent>[ \t]*)gh api "(?P<endpoint>/repos/\$GITHUB_REPOSITORY/actions/artifacts/\$[^"]+/zip)" > "(?P<target>[^"]+)"$'
          )

          for i,name in enumerate(wanted,1):
              text=found[name]
              for old,new in [('env.FLOOR','$FLOOR'),('env.LIVE','$LIVE'),('env.CURRENT','$CURRENT')]:
                  text=text.replace(old,new)
              old="assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['FLOOR']"
              counts['base_sha'] += text.count(old)
              text=text.replace(old, "assert pr['base']['ref']=='main'")
              counts['stable'] += text.count(stable_expr)
              counts['candidate'] += text.count(candidate_expr)
              text=text.replace(stable_expr, 'base="$(cat "$OUT/stable-main.txt")"')
              text=text.replace(candidate_expr, 'candidate="$(cat "$OUT/final-candidate-commit.txt")"')

              def redirect_safe(match):
                  counts['artifact_downloads'] += 1
                  indent=match.group('indent')
                  endpoint=match.group('endpoint')
                  output=match.group('target')
                  return (
                      f'{indent}curl --fail --silent --show-error --location '
                      f'--header "Authorization: Bearer $GH_TOKEN" '
                      f'--header "X-GitHub-Api-Version: 2022-11-28" '
                      f'--output "{output}" "https://api.github.com{endpoint}"'
                  )
              text=artifact_pattern.sub(redirect_safe,text)
              p=target/f'{i:02d}.sh'
              p.write_text(text)
              p.chmod(0o755)

          assert counts['base_sha']==1, counts
          assert counts['stable']==1, counts
          assert counts['candidate']==1, counts
          assert counts['artifact_downloads']>=2, counts
          (target.parent/'repair-counts.json').write_text(__import__('json').dumps(counts,indent=2,sort_keys=True)+'\n')
          PY
          test "$(find "$SCRIPT_ROOT/scripts" -maxdepth 1 -type f -name '*.sh' | wc -l)" = 8
          for script in "$SCRIPT_ROOT/scripts"/*.sh; do bash -n "$script"; done
          printf 'SOURCE_COMMIT=%s\nSOURCE_BLOB=%s\nFLOOR_MAIN=%s\n' "$SOURCE_COMMIT" "$SOURCE_BLOB" "$floor" >> "$GITHUB_ENV"
          printf 'source_commit=%s\nsource_blob=%s\nfloor=%s\ninitial_live_main=%s\n' \
            "$SOURCE_COMMIT" "$SOURCE_BLOB" "$floor" "$live" > "$SCRIPT_ROOT/source-identity.txt"

      - name: Execute the eight repaired substantive scripts in stable custody
        shell: bash
        run: |
          set -euo pipefail
          : > "$SCRIPT_ROOT/execution-order.txt"
          mapfile -t scripts < <(find "$SCRIPT_ROOT/scripts" -maxdepth 1 -type f -name '*.sh' | LC_ALL=C sort)
          test "${#scripts[@]}" = 8
          for script in "${scripts[@]}"; do
            printf '%s\n' "$(basename "$script")" >> "$SCRIPT_ROOT/execution-order.txt"
            bash "$script"
            if [ -s "$GITHUB_ENV" ]; then
              set -a
              source "$GITHUB_ENV"
              set +a
            fi
          done
          mkdir -p "$OUT/diagnostics" "$OUT/recovered"
          cp "$SCRIPT_ROOT/execution-order.txt" "$OUT/diagnostics/execution-order.txt"
          cp "$SCRIPT_ROOT/repair-counts.json" "$OUT/diagnostics/repair-counts.json"
          cp "$SCRIPT_ROOT/v7b.yml" "$OUT/recovered/v7b.yml"
          cp "$SCRIPT_ROOT/source-identity.txt" "$OUT/recovered/source-identity.txt"
          test -f "$OUT/packet/qualification-receipt.json"
          test -f "$OUT/packet/candidate-product.tar.gz"
          test -f "$OUT/packet/candidate.bundle"
          test -f "$OUT/packet/candidate.patch"
          test -f "$OUT/packet/candidate-files.json"
          test -f "$OUT/packet/candidate-paths.txt"
          jq -e '.status=="qualified-candidate" and .path_count==40 and .task==env.TASK_ID and .lease==env.LEASE_ID and .wall_id==env.WALL_ID' \
            "$OUT/packet/qualification-receipt.json" >/dev/null

      - name: Rebind immutable source, carrier, and exact live main
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$OUT/recovered/source-blob-rebind.json"
          jq -e --arg blob "$SOURCE_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/recovered/source-blob-rebind.json" >/dev/null
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$(jq -r '.base_main' "$OUT/packet/qualification-receipt.json")"
          find "$OUT/packet" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/diagnostics/packet-sha256.txt"

      - name: Retain terminal diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/diagnostics" "$OUT/recovered/v7e-transport"
          work="$OUT/work/main"
          if [ -d "$work" ]; then
            git -C "$work" status --short > "$OUT/diagnostics/final-worktree-status.txt" || true
            git -C "$work" diff > "$OUT/diagnostics/final-worktree.diff" || true
            git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
          fi
          rm -rf "$OUT/work"
          if [ -d "$SCRIPT_ROOT" ]; then
            cp -a "$SCRIPT_ROOT/." "$OUT/recovered/v7e-transport/"
          fi
          rm -rf "$SCRIPT_ROOT"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V7e candidate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-bootstrap-v7e-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7e
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
