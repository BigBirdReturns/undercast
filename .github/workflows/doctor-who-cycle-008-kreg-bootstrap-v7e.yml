name: doctor-who-cycle-008-kreg-bootstrap-v7d

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7e.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-bootstrap-v7e-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-bootstrap-v7d'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7d.yml
      REPAIR_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7d-repair.yml
      WRAPPER_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7e.yml
      ORIGINAL_HEAD: 98853c9f1d277829d8b25a59681bee8a96571bc2
      PREVIOUS_REPAIR_HEAD: a35c3632fc3c2d7a83d8988300e58e2783e9ca60
      PREVIOUS_REPAIR_BLOB: c6d9a1e7fc5c8b7bbc6daadc1e36541a7846596e
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7d
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      SOURCE_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7b
      SOURCE_PATH: .github/workflows/doctor-who-cycle-008-kreg-bootstrap-v7b.yml
      V6_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v6
      V6_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v6
      OUT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d-stable-scripts
      CONTROL_ROOT: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7e-control
      V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
      V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
      V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
      ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
      MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
      MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
      RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
      PREFLIGHT_ARTIFACT: "8962423257"
      PREFLIGHT_DIGEST: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
      CENSUS_ARTIFACT: "8971420444"
      CENSUS_DIGEST: 75dab09bac152256ba5b9f471b244af1916b509d453e60adbc39d5aa7503905c
      REVIEW_ARTIFACT: "8971625526"
      REVIEW_DIGEST: 3e9d57566cddd961074a7f46839b565bb797d86958993f555cb5add9f5982b5c
      PUBLICATION_ARTIFACT: "8972359020"
      PUBLICATION_DIGEST: 40a7726498b5d2030b732c78a4da51e5da821fb622c6cc4e616489f48962d339
      MEDIA_ASSET_ID: "504051495"
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover and patch the exact V7d transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SCRIPT_ROOT" "$CONTROL_ROOT"
          mkdir -p "$OUT/diagnostics" "$CONTROL_ROOT"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_REPAIR_HEAD"
          floor="$(git rev-parse "$ORIGINAL_HEAD^")"
          test "$(git rev-list --count "$floor"..HEAD)" = 3
          test "$(git rev-parse "$PREVIOUS_REPAIR_HEAD:$REPAIR_PATH")" = "$PREVIOUS_REPAIR_BLOB"
          test "$(git hash-object "$REPAIR_PATH")" = "$PREVIOUS_REPAIR_BLOB"
          test "$(git diff --name-only "$floor"..."$ORIGINAL_HEAD")" = "$ORIGINAL_PATH"
          test "$(git diff --name-status "$floor"..."$ORIGINAL_HEAD")" = $'A\t'"$ORIGINAL_PATH"
          test "$(git diff --name-only "$ORIGINAL_HEAD"..."$PREVIOUS_REPAIR_HEAD")" = "$REPAIR_PATH"
          test "$(git diff --name-status "$ORIGINAL_HEAD"..."$PREVIOUS_REPAIR_HEAD")" = $'A\t'"$REPAIR_PATH"
          test "$(git diff --name-only "$PREVIOUS_REPAIR_HEAD"...HEAD)" = "$WRAPPER_PATH"
          test "$(git diff --name-status "$PREVIOUS_REPAIR_HEAD"...HEAD)" = $'A\t'"$WRAPPER_PATH"
          printf '%s\n%s\n%s\n' "$ORIGINAL_PATH" "$REPAIR_PATH" "$WRAPPER_PATH" | LC_ALL=C sort > "$CONTROL_ROOT/expected-carrier-paths.txt"
          git diff --name-only "$floor"...HEAD | LC_ALL=C sort > "$CONTROL_ROOT/actual-carrier-paths.txt"
          diff -u "$CONTROL_ROOT/expected-carrier-paths.txt" "$CONTROL_ROOT/actual-carrier-paths.txt"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$CONTROL_ROOT/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$CONTROL_ROOT/pr-files.json"
          ROOT="$CONTROL_ROOT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'pr.json').read_text())
          files=json.loads((root/'pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main'
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==3 and pr['changed_files']==3
          assert sorted((f['filename'],f['status']) for f in files)==sorted([
              (os.environ['ORIGINAL_PATH'],'added'),
              (os.environ['REPAIR_PATH'],'added'),
              (os.environ['WRAPPER_PATH'],'added'),
          ])
          PY

          git show "$PREVIOUS_REPAIR_HEAD:$REPAIR_PATH" > "$CONTROL_ROOT/v7d-repair.yml"
          test "$(git hash-object "$CONTROL_ROOT/v7d-repair.yml")" = "$PREVIOUS_REPAIR_BLOB"
          SOURCE="$CONTROL_ROOT/v7d-repair.yml" TARGET="$CONTROL_ROOT" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          source=Path(os.environ['SOURCE'])
          target=Path(os.environ['TARGET'])
          doc=yaml.safe_load(source.read_text())
          steps=doc['jobs']['qualify']['steps']
          names=[
              'Recover V7b scripts into a stable transport namespace',
              'Execute all eight scripts outside the output namespace',
              'Rebind exact source and carrier refs',
          ]
          found={s.get('name'):s.get('run') for s in steps if s.get('name') in names}
          assert list(found)==names, (list(found),names)
          stage1=found[names[0]]

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} replacement count {count}')
              return text.replace(old,new)

          stage1=replace_once(
              stage1,
              'test "$(git rev-parse HEAD^)" = "$ORIGINAL_HEAD"',
              'test "$(git rev-parse HEAD^)" = "$PREVIOUS_REPAIR_HEAD"',
              'head parent',
          )
          stage1=replace_once(
              stage1,
              'test "$(git rev-list --count "$floor"..HEAD)" = 2',
              'test "$(git rev-list --count "$floor"..HEAD)" = 3',
              'commit count',
          )
          stage1=replace_once(
              stage1,
              '''test "$(git diff --name-only "$ORIGINAL_HEAD"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$ORIGINAL_HEAD"...HEAD)" = $'A\\t'"$SELF"
          printf '%s\\n%s\\n' "$ORIGINAL_PATH" "$SELF" | LC_ALL=C sort > "$SCRIPT_ROOT/expected-carrier-paths.txt"''',
              '''test "$(git diff --name-only "$ORIGINAL_HEAD"..."$PREVIOUS_REPAIR_HEAD")" = "$REPAIR_PATH"
          test "$(git diff --name-status "$ORIGINAL_HEAD"..."$PREVIOUS_REPAIR_HEAD")" = $'A\\t'"$REPAIR_PATH"
          test "$(git diff --name-only "$PREVIOUS_REPAIR_HEAD"...HEAD)" = "$WRAPPER_PATH"
          test "$(git diff --name-status "$PREVIOUS_REPAIR_HEAD"...HEAD)" = $'A\\t'"$WRAPPER_PATH"
          printf '%s\\n%s\\n%s\\n' "$ORIGINAL_PATH" "$REPAIR_PATH" "$WRAPPER_PATH" | LC_ALL=C sort > "$SCRIPT_ROOT/expected-carrier-paths.txt"''',
              'three-path geometry',
          )
          stage1=replace_once(
              stage1,
              "assert pr['commits']==2 and pr['changed_files']==2",
              "assert pr['commits']==3 and pr['changed_files']==3",
              'PR denominator',
          )
          stage1=replace_once(
              stage1,
              '''              (os.environ['ORIGINAL_PATH'],'added'),
              (os.environ['SELF'],'added'),''',
              '''              (os.environ['ORIGINAL_PATH'],'added'),
              (os.environ['REPAIR_PATH'],'added'),
              (os.environ['WRAPPER_PATH'],'added'),''',
              'PR paths',
          )
          stage1=replace_once(
              stage1,
              '.merge_base_commit.sha==$FLOOR and .head_commit.sha==$LIVE and .behind_by==0',
              '.merge_base_commit.sha==$FLOOR and (.commits|length)>0 and .commits[-1].sha==$LIVE and .behind_by==0',
              'compare response head',
          )
          for index,text in enumerate((stage1,found[names[1]],found[names[2]]),1):
              path=target/f'stage-{index}.sh'
              path.write_text(text)
              path.chmod(0o755)
          PY
          for script in "$CONTROL_ROOT"/stage-*.sh; do bash -n "$script"; done
          printf 'FLOOR_MAIN=%s\n' "$floor" >> "$GITHUB_ENV"

      - name: Execute the corrected V7d candidate transaction
        shell: bash
        run: |
          set -euo pipefail
          bash "$CONTROL_ROOT/stage-1.sh"
          if [ -s "$GITHUB_ENV" ]; then set -a; source "$GITHUB_ENV"; set +a; fi
          bash "$CONTROL_ROOT/stage-2.sh"
          if [ -s "$GITHUB_ENV" ]; then set -a; source "$GITHUB_ENV"; set +a; fi
          bash "$CONTROL_ROOT/stage-3.sh"

      - name: Retain terminal diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/diagnostics" "$OUT/recovered/v7e-control" "$OUT/recovered/v7d-transport"
          work="$OUT/work/main"
          if [ -d "$work" ]; then
            git -C "$work" status --short > "$OUT/diagnostics/final-worktree-status.txt" || true
            git -C "$work" diff > "$OUT/diagnostics/final-worktree.diff" || true
            git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
          fi
          rm -rf "$OUT/work"
          if [ -d "$SCRIPT_ROOT" ]; then cp -a "$SCRIPT_ROOT/." "$OUT/recovered/v7d-transport/"; fi
          if [ -d "$CONTROL_ROOT" ]; then cp -a "$CONTROL_ROOT/." "$OUT/recovered/v7e-control/"; fi
          rm -rf "$SCRIPT_ROOT" "$CONTROL_ROOT"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V7d candidate packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-bootstrap-v7d-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-bootstrap-v7d
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
