name: review-doctor-who-cycle-007-v8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/review-doctor-who-cycle-007-v8.yml"
      - "tmp/review-doctor-who-cycle-007-v8.mjs.xz.b64"

permissions:
  contents: read
  actions: read

concurrency:
  group: review-doctor-who-cycle-007-v8
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  CANDIDATE_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_DIGEST: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_DIGEST: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  SELF: .github/workflows/review-doctor-who-cycle-007-v8.yml
  REVIEWER_ARCHIVE: tmp/review-doctor-who-cycle-007-v8.mjs.xz.b64
  REVIEWER: /tmp/review-doctor-who-cycle-007-v8.mjs
  REVIEWER_SHA256: 39cd11ce6835f4ebfe7cf6090661e94c393cf111566be018b2db296b802219bc
  ROOT: /tmp/doctor-who-cycle-007-v8-independent-review
  CANDIDATE: /tmp/doctor-who-cycle-007-v8-independent-review/candidate
  DIAGNOSTICS: /tmp/doctor-who-cycle-007-v8-independent-review/diagnostics
  OUT: /tmp/doctor-who-cycle-007-v8-independent-review/out
  GH_TOKEN: ${{ github.token }}

jobs:
  review:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-independent-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact two-path independent-review carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CANDIDATE" "$DIAGNOSTICS" "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" "$REVIEWER_ARCHIVE" | LC_ALL=C sort > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          base64 --decode "$REVIEWER_ARCHIVE" | xz --decompress > "$REVIEWER"
          test "$(sha256sum "$REVIEWER" | awk '{print $1}')" = "$REVIEWER_SHA256"
          node --check "$REVIEWER"
          git fetch --no-tags --depth=2 origin "$CANDIDATE_HEAD"
          git show "$CANDIDATE_HEAD:.github/workflows/materialize-doctor-who-cycle-007-v8.yml" > "$OUT/candidate-workflow.yml"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100" > "$OUT/candidate-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > "$OUT/candidate-jobs.json"
          jq -e \
            --argjson run "$CANDIDATE_RUN" \
            --arg head "$CANDIDATE_HEAD" \
            --argjson candidate_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_digest "sha256:${CANDIDATE_ARTIFACT_DIGEST}" \
            --argjson diagnostics_id "$DIAGNOSTICS_ARTIFACT_ID" \
            --arg diagnostics_digest "sha256:${DIAGNOSTICS_ARTIFACT_DIGEST}" '
              .total_count == 2 and
              any(.artifacts[];
                .id == $candidate_id and
                .name == "doctor-who-cycle-007-candidate-31059092270" and
                .digest == $candidate_digest and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $head and
                .expired == false
              ) and
              any(.artifacts[];
                .id == $diagnostics_id and
                .name == "doctor-who-cycle-007-v8-candidate-only-31059092270" and
                .digest == $diagnostics_digest and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $head and
                .expired == false
              )
            ' "$OUT/candidate-artifacts.json" >/dev/null

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-candidate-31059092270
          path: ${{ env.CANDIDATE }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31059092270

      - name: Download immutable candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-candidate-only-31059092270
          path: ${{ env.DIAGNOSTICS }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31059092270

      - name: Perform independent candidate review
        shell: bash
        run: |
          set -euo pipefail
          node "$REVIEWER" \
            "$CANDIDATE" \
            "$DIAGNOSTICS" \
            "$OUT/candidate-artifacts.json" \
            "$OUT/candidate-jobs.json" \
            "$OUT/candidate-workflow.yml" \
            "$OUT" \
            | tee "$OUT/review.log"
          test -z "$(git status --porcelain)"

      - name: Upload independent review artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-independent-review-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
