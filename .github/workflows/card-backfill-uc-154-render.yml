name: card-backfill-uc-154-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-154-RENDER.json"
      - "scripts/card-backfill-uc-154-render.part-00.mjs"
      - "scripts/card-backfill-uc-154-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-154-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-154-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-033'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-033
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-154 first-film render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-154-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-154');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-154');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_067190c9e8aa5e6b9b695e62');
          if(row.version!==1||row.record_id!=='UC-154'||row.actor!=='Tyler Mane'||row.character!=='Michael Myers'||row.production!=='Halloween (2007)'||row.years!=='2007–2009'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-154 render authorization drift');
          if(row.targeted_artifact?.artifact_id!==8711102405||row.targeted_artifact?.head_sha!=='a85d2a15a4c3c7c132449069b2dc0510abd33700'||row.targeted_artifact?.zip_sha256!=='23fab6e17bb651669ba499d9e143a786eee8d0c2d42cab9814dbf8dcb096c392'||row.targeted_artifact?.candidate_count!==1)throw new Error('UC-154 targeted custody drift');
          if(row.failed_discovery_checkpoints?.length!==1||row.failed_discovery_checkpoints[0]?.artifact_id!==8710917909||row.source_pages?.length!==4)throw new Error('UC-154 discovery or source denominator drift');
          if(row.selected?.sha256!=='a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28'||row.selected?.bytes!==56506||row.selected?.width!==1080||row.selected?.height!==720)throw new Error('UC-154 selected source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.resize!=='1260x1000^'||row.render?.gravity!=='east'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-154 render geometry drift');
          if(!specimen||specimen.actor!=='Tyler Mane'||specimen.character!=='Michael Myers'||specimen.production!=='Halloween (2007)'||specimen.years!=='2007–2009'||specimen.still||specimen.portrait?.src!=='images/uc-154-portrait.jpg')throw new Error('UC-154 specimen boundary drift');
          if(source?.still)throw new Error('UC-154 source-ledger still boundary drift');
          if(!audit||audit.wall_id!=='UC-154'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-154 audit boundary drift');
          console.log('PASS — exact UC-154 first-film Michael Myers render authorized');
          NODE
      - name: Retrieve and verify exact targeted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-render"
          mkdir -p "$root/targeted"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8711102405/zip" > "$root/targeted.zip"
          echo "23fab6e17bb651669ba499d9e143a786eee8d0c2d42cab9814dbf8dcb096c392  $root/targeted.zip" | sha256sum -c -
          unzip -q "$root/targeted.zip" -d "$root/targeted"
          source="$root/targeted/card-backfill-uc-154-targeted"
          echo "5b395bd341a4c9d58351f9339e8f21d14369636c6201f4f452a7bdf31b729f7f  $source/manifest.json" | sha256sum -c -
          echo "858b2c142f54352eaf74872e3682ff61a2c29351434e44034bfb9e453adec22b  $source/summary.json" | sha256sum -c -
          echo "65925b9c21f80fb8075230c0b5266ccbdbbc71115f0cdcc6078b4fd9378b5a31  $source/contact-sheet.jpg" | sha256sum -c -
          echo "a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28  $source/michael-myers-2007-original.jpg" | sha256sum -c -
          echo "bc162b5772b43d4df3b2a47582d10ed1467611f1bb3c2ad8a46ad94b8089ed87  $source/pages/afi-halloween-2007.png" | sha256sum -c -
          echo "1399ea6a666a43dbb85feffdf71c1ba28c4ef86972f1e7f938f9c8c97933405a  $source/pages/tyler-mane-official-halloween-interview.png" | sha256sum -c -
          echo "c5f2a1b0151c2f4a7158473ec007ae4565b85496f846703e61cf24807673b302  $source/pages/official-kristina-klebe-archive.png" | sha256sum -c -
          echo "bb802ee99864abf8d6b92420eb4eb3eec2e1c46d86aa00b94d5b18308adff0eb  $source/pages/official-halloween-2007-trailer.png" | sha256sum -c -
      - name: Render exact first-film candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-154-render/targeted/card-backfill-uc-154-targeted
          OUT: ${{ runner.temp }}/card-backfill-uc-154-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-render"
          cat scripts/card-backfill-uc-154-render.part-00.mjs scripts/card-backfill-uc-154-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-154-render"
          rm -rf "$root/targeted" "$root/targeted.zip"
      - name: Upload exact source, page receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-154-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-154-render/output
            ${{ runner.temp }}/card-backfill-uc-154-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
