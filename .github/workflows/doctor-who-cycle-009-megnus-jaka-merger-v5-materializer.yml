name: doctor-who-cycle-009-megnus-jaka-merger-v5-materializer

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-merger-v5-materializer
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer.yml

      PREVIOUS_MATERIALIZER_PR: "701"
      PREVIOUS_MATERIALIZER_HEAD: 86d7fc03fb03cf008218f818492c460a6f363128
      PREVIOUS_MATERIALIZER_RUN: "31282588190"
      PREVIOUS_MATERIALIZER_JOB: "93166189125"
      PREVIOUS_MATERIALIZER_ARTIFACT: "9028865735"
      PREVIOUS_MATERIALIZER_ARTIFACT_DIGEST: sha256:a33dfa2accf7095e35ba7ea6e0503ee68752a8b586ced8e2058a3b17310db691
      PREVIOUS_PROGRAM_SHA256: c3980b95fa31b0c24acb04bb8cd16ff913a2f06b859e547e01815e5b491ef58e
      PREVIOUS_PROGRAM_GZIP_SHA256: 11b1ab81dd1214ca34a7ac5bf5d5171eafafdfab4d8aec336f8ab844f29f94fe

      SOURCE_PR: "696"
      SOURCE_HEAD: 2505d5e73227722b47ad995056cb832ead7e21ea
      SOURCE_BLOB: 9569ffeb46a4cf3d420a2d66caa1db83a365ee94
      SOURCE_SHA256: 8f8846250515d704e6c4cf972549ba9309fbb0727b0df905471bd52edf3f7114
      SOURCE_RUN: "31281770764"
      SOURCE_JOB: "93164166555"
      SOURCE_ARTIFACT: "9028631914"
      SOURCE_ARTIFACT_DIGEST: sha256:78f05f2bdf4013ee36b6d6f75ef4a756b7f6683c88a0f09d26983a9bef63bcae
      PUBLISHER_RUN: "31280432624"

      TARGET_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v5
      TARGET_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v5.yml
      MATERIALIZER_PROGRAM_SHA256: d5eb7fb147990f1894cfc36539a18d8e5f1b1d3d3cbc4d0e98405b8b5c15cf6d
      MATERIALIZER_PROGRAM_GZIP_SHA256: 991c1d7c4ded24124e049439fbd9a362e2cfa14ed2093e7671fb03a4671a8622
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate predecessor and recover exact corrected materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,predecessor,product}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-list --count "$EXPECTED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXPECTED_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXPECTED_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXPECTED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PREVIOUS_MATERIALIZER_PR" > "$OUT/api/predecessor-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_MATERIALIZER_RUN" > "$OUT/api/predecessor-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_MATERIALIZER_RUN/jobs?per_page=100" > "$OUT/api/predecessor-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_MATERIALIZER_ARTIFACT" > "$OUT/api/predecessor-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_MATERIALIZER_ARTIFACT/zip" > "$OUT/predecessor.zip"

          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT'])
          carrier=json.loads((root/'api/carrier-pr.json').read_text())
          assert carrier['number']==int(os.environ['PR']) and carrier['state']=='open' and carrier['draft'] is True and carrier['merged'] is False
          assert carrier['base']['sha']==os.environ['EXPECTED_MAIN'] and carrier['head']['sha']==os.environ['HEAD']
          assert carrier['head']['ref']==os.environ['BRANCH'] and carrier['commits']==1 and carrier['changed_files']==1
          predecessor=json.loads((root/'api/predecessor-pr.json').read_text())
          assert predecessor['number']==int(os.environ['PREVIOUS_MATERIALIZER_PR']) and predecessor['draft'] is True and predecessor['merged'] is False
          assert predecessor['state'] in {'open','closed'}
          assert predecessor['base']['sha']==os.environ['EXPECTED_MAIN'] and predecessor['head']['sha']==os.environ['PREVIOUS_MATERIALIZER_HEAD']
          assert predecessor['commits']==1 and predecessor['changed_files']==1
          run=json.loads((root/'api/predecessor-run.json').read_text())
          jobs=json.loads((root/'api/predecessor-jobs.json').read_text())['jobs']
          artifact=json.loads((root/'api/predecessor-artifact.json').read_text())
          assert run['id']==int(os.environ['PREVIOUS_MATERIALIZER_RUN'])
          assert run['name']=='doctor-who-cycle-009-megnus-jaka-merger-v4-materializer'
          assert run['head_sha']==os.environ['PREVIOUS_MATERIALIZER_HEAD'] and run['status']=='completed' and run['conclusion']=='failure'
          assert run['run_attempt']==1
          by={row['name']:row for row in jobs}
          assert set(by)=={'publish'}
          assert by['publish']['id']==int(os.environ['PREVIOUS_MATERIALIZER_JOB']) and by['publish']['conclusion']=='failure'
          assert artifact['id']==int(os.environ['PREVIOUS_MATERIALIZER_ARTIFACT']) and artifact['expired'] is False
          assert artifact['workflow_run']['id']==int(os.environ['PREVIOUS_MATERIALIZER_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['PREVIOUS_MATERIALIZER_HEAD']
          assert artifact['digest']==os.environ['PREVIOUS_MATERIALIZER_ARTIFACT_DIGEST']
          archive_bytes=(root/'predecessor.zip').read_bytes()
          assert hashlib.sha256(archive_bytes).hexdigest()==os.environ['PREVIOUS_MATERIALIZER_ARTIFACT_DIGEST'].removeprefix('sha256:')
          expected_files=[
            '__pycache__/materializer.cpython-312.pyc',
            'api/carrier-pr.json',
            'api/predecessor-artifact.json',
            'api/predecessor-jobs.json',
            'api/predecessor-pr.json',
            'api/predecessor-run.json',
            'diagnostic.zip',
            'diagnostic/api/carrier-files.json',
            'diagnostic/api/carrier-pr.json',
            'diagnostic/api/publication-artifact.json',
            'diagnostic/api/publisher-jobs.json',
            'diagnostic/api/publisher-run.json',
            'diagnostic/publication.zip',
            'materializer.py',
            'materializer.py.gz',
            'predecessor.zip',
            'predecessor/__pycache__/materializer.cpython-312.pyc',
            'predecessor/materializer.py',
            'predecessor/materializer.py.gz',
            'predecessor/materializer.py.gz.b64',
          ]
          target=root/'predecessor'
          with zipfile.ZipFile(root/'predecessor.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              assert sorted(row.filename for row in infos if not row.is_dir())==expected_files
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          program=target/'materializer.py'; compressed=target/'materializer.py.gz'
          assert hashlib.sha256(program.read_bytes()).hexdigest()==os.environ['PREVIOUS_PROGRAM_SHA256']
          assert hashlib.sha256(compressed.read_bytes()).hexdigest()==os.environ['PREVIOUS_PROGRAM_GZIP_SHA256']
          assert hashlib.sha256((target/'diagnostic.zip').read_bytes()).hexdigest()==os.environ['SOURCE_ARTIFACT_DIGEST'].removeprefix('sha256:')
          PY

          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          lines=(root/'predecessor/materializer.py').read_text().splitlines(keepends=True)
          for lineno in (130,136,165):
              line=lines[lineno-1]
              old='\\'*4+'n'
              new='\\'*2+'n'
              expected=2 if lineno in (130,136) else 1
              assert line.count(old)==expected,(lineno,line.count(old),repr(line))
              lines[lineno-1]=line.replace(old,new)
          source=''.join(lines)
          replacements={
            'doctor-who-cycle-009-megnus-jaka-merger-v4':'doctor-who-cycle-009-megnus-jaka-merger-v5',
            'target-v4':'target-v5',
            'guardian-v4-published':'guardian-v5-published',
          }
          expected={
            'doctor-who-cycle-009-megnus-jaka-merger-v4':2,
            'target-v4':2,
            'guardian-v4-published':1,
          }
          for old,new in replacements.items():
              assert source.count(old)==expected[old],(old,source.count(old))
              source=source.replace(old,new)
          marker='target_ref = gh_json("GET", f"/repos/{repo}/git/ref/heads/{os.environ[\'TARGET_BRANCH\']}")\n'
          assert source.count(marker)==1
          validation=r'''# Validate the complete generated workflow before any remote object or ref write.
          target_path = root / "product" / "target-v5.yml"
          assert target_path.read_bytes() == target_bytes
          printf_lines = [line for line in target.splitlines() if "printf 'CARRIER_PR=%s" in line]
          assert len(printf_lines) == 1 and printf_lines[0].count("\\") == 2
          guard_write_lines = [line for line in target.splitlines() if "carrier-guard-check.json" in line and "write_text" in line]
          assert len(guard_write_lines) == 1 and guard_write_lines[0].count("\\") == 1
          ruby_program = (
              "require 'yaml'; require 'json'; "
              "doc=YAML.safe_load(File.read(ARGV[0]), aliases: true); "
              "runs=[]; doc.fetch('jobs').each_value{|job| "
              "job.fetch('steps',[]).each{|step| runs << step['run'] if step.is_a?(Hash) && step['run'].is_a?(String)}}; "
              "STDOUT.write(JSON.generate(runs))"
          )
          parsed = subprocess.run(
              ["ruby", "-e", ruby_program, str(target_path)],
              check=True,
              capture_output=True,
              text=True,
          )
          runs = json.loads(parsed.stdout)
          assert len(runs) == 6
          run_root = root / "product" / "run-blocks"
          run_root.mkdir(parents=True, exist_ok=True)
          python_heredocs = 0
          for index, script in enumerate(runs, 1):
              run_path = run_root / f"run-{index:02d}.sh"
              run_path.write_text(script)
              subprocess.run(["bash", "-n", str(run_path)], check=True)
              rows = script.splitlines()
              cursor = 0
              while cursor < len(rows):
                  if "<<'PY'" not in rows[cursor]:
                      cursor += 1
                      continue
                  end = cursor + 1
                  body = []
                  while end < len(rows) and rows[end].strip() != "PY":
                      body.append(rows[end])
                      end += 1
                  assert end < len(rows)
                  compile("\n".join(body) + "\n", f"{run_path.name}:heredoc-{python_heredocs + 1}", "exec")
                  python_heredocs += 1
                  cursor = end + 1
          assert python_heredocs == 8

          '''
          source=source.replace(marker,validation+marker)
          assert 'doctor-who-cycle-009-megnus-jaka-merger-v4' not in source
          assert 'target-v4' not in source and 'guardian-v4-published' not in source
          patched=root/'materializer.py'; patched.write_text(source)
          assert hashlib.sha256(patched.read_bytes()).hexdigest()==os.environ['MATERIALIZER_PROGRAM_SHA256']
          PY
          gzip -n -9 -c "$OUT/materializer.py" > "$OUT/materializer.py.gz"
          test "$(sha256sum "$OUT/materializer.py.gz" | awk '{print $1}')" = "$MATERIALIZER_PROGRAM_GZIP_SHA256"
          python3 -m py_compile "$OUT/materializer.py"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 "$OUT/materializer.py"
          ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV[0]), aliases: true)' "$OUT/product/target-v5.yml"
          test "$(find "$OUT/product/run-blocks" -type f -name 'run-*.sh' | wc -l)" = 6
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"
          done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v5-materializer-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v5-materializer-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
