name: doctor-who-cycle-009-preeligibility-census-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-preeligibility-census-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-preeligibility-census-v2
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-preeligibility-census-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 47ccb38eab6a4b6e2a16ed92b04f1259b95de783
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-009-preeligibility-census-v2
      SELF: .github/workflows/doctor-who-cycle-009-preeligibility-census-v2.yml
      OUT: /tmp/doctor-who-cycle-009-preeligibility-census-v2
      SCOPE_ID: doctor-who
      PROFILE_ID: text-vision
      CYCLE_008_ID: cycle_89daa03cca72b8522c76725c
      CYCLE_008_LEASE: lease_e65f837070361eacbb1abd46
      CYCLE_008_REVIEWED_AT: "2026-08-07T20:42:01.000Z"
      ELIGIBLE_AT: "2026-08-08T20:42:01.000Z"
      EXPECTED_TOTAL: "316"
      EXPECTED_QUEUED: "308"
      EXPECTED_RESOLVED: "8"
      EXPECTED_IN_FLIGHT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path read-only carrier and canonical cycle-008 main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostics,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Validate canonical cycle, queue, waterline, and corpus without mutation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs validate
          node scripts/validate.mjs
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal opaque selector commitments from the reviewed-cycle cadence anchor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import {
            capabilityPolicySha256,
            rankCapabilityCandidates,
            validateCapabilityPolicy,
            validateState,
          } from './scripts/lib/autopilot.mjs';

          const env = process.env;
          const parse = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const sha = (value) => createHash('sha256').update(value).digest('hex');
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]));
          };
          const stableJson = (value) => JSON.stringify(stable(value));
          const fail = (message) => { throw new Error(message); };
          const collectObjects = (value, predicate, out = []) => {
            if (Array.isArray(value)) {
              for (const row of value) collectObjects(row, predicate, out);
            } else if (value && typeof value === 'object') {
              if (predicate(value)) out.push(value);
              for (const row of Object.values(value)) collectObjects(row, predicate, out);
            }
            return out;
          };

          const statePath = 'data/AUTOPILOT.json';
          const policyPath = 'data/AUTOPILOT-CAPABILITIES.json';
          const waterlinePath = 'data/WATERLINE-STATE.json';
          const cycleReceiptPath = 'data/review/adapter-sdk/doctor-who-cycle-008-kreg.json';
          const selectorPath = 'scripts/lib/autopilot-capabilities.mjs';
          const state = parse(statePath);
          const policy = parse(policyPath);
          const waterline = parse(waterlinePath);
          const cycleReceipt = parse(cycleReceiptPath);
          const selectorSource = readFileSync(selectorPath, 'utf8');

          validateState(state);
          validateCapabilityPolicy(policy);
          const scoped = state.jobs.filter((job) => job.scope === env.SCOPE_ID);
          const queued = scoped.filter((job) => job.status === 'queued');
          const resolved = scoped.filter((job) => job.status === 'resolved');
          const inFlight = scoped.filter((job) => ['leased', 'drafted', 'merged'].includes(job.status));
          if (scoped.length !== Number(env.EXPECTED_TOTAL)) fail('Doctor Who task denominator drifted');
          if (queued.length !== Number(env.EXPECTED_QUEUED)) fail('Doctor Who queued denominator drifted');
          if (resolved.length !== Number(env.EXPECTED_RESOLVED)) fail('Doctor Who resolved denominator drifted');
          if (inFlight.length !== Number(env.EXPECTED_IN_FLIGHT)) fail('Doctor Who in-flight denominator drifted');

          const comparatorPattern = /function queueOrder\(a, b\) \{\s*return b\.priority - a\.priority \|\| a\.scope\.localeCompare\(b\.scope\) \|\| a\.performer\.localeCompare\(b\.performer\) \|\| a\.character\.localeCompare\(b\.character\);\s*\}/s;
          if (!comparatorPattern.test(selectorSource)) fail('canonical queue comparator changed');
          const ranked = rankCapabilityCandidates({ state, scope: env.SCOPE_ID, policy, profileId: env.PROFILE_ID });
          if (ranked.profile.status !== 'active') fail('capability profile is not active');
          if (ranked.compatible.length !== queued.length || ranked.incompatible.length !== 0) fail('capability-filtered queue denominator drifted');
          const manual = [...queued].sort((a, b) => b.priority - a.priority || a.scope.localeCompare(b.scope) || a.performer.localeCompare(b.performer) || a.character.localeCompare(b.character));
          const libraryIds = ranked.compatible.map((row) => row.task.id);
          const manualIds = manual.map((row) => row.id);
          if (stableJson(libraryIds) !== stableJson(manualIds)) fail('library ranking and independent comparator disagree');
          if (!ranked.compatible.length) fail('compatible queue is unexpectedly empty');

          if (cycleReceipt.transaction !== 'DOCTOR-WHO-CYCLE-008-KREG') fail('cycle-008 receipt transaction drifted');
          if (cycleReceipt.reviewed_cycle?.id !== env.CYCLE_008_ID || cycleReceipt.reviewed_cycle?.outcome !== 'completed') fail('cycle-008 reviewed-cycle identity drifted');
          if (cycleReceipt.lease?.id !== env.CYCLE_008_LEASE || cycleReceipt.lease?.outcome !== 'completed') fail('cycle-008 lease identity drifted');
          if (cycleReceipt.boundary?.cycle_009_authorized !== false || cycleReceipt.boundary?.ninth_lease_issued !== false) fail('no-ninth-lease boundary drifted');
          const after = cycleReceipt.queue?.after;
          if (!after || after.total !== Number(env.EXPECTED_TOTAL) || after.queued !== Number(env.EXPECTED_QUEUED) || after.resolved !== Number(env.EXPECTED_RESOLVED) || after.in_flight !== 0) fail('cycle-008 receipt queue tuple drifted');
          const anchor = env.CYCLE_008_REVIEWED_AT;
          const anchors = [cycleReceipt.generated_at, cycleReceipt.reviewed_cycle?.closed_at, cycleReceipt.reviewed_cycle?.reviewed_at];
          if (!anchors.every((value) => value === anchor)) fail('cycle-008 cadence anchor drifted');
          const derivedEligibleAt = new Date(Date.parse(anchor) + 24 * 60 * 60 * 1000).toISOString();
          if (derivedEligibleAt !== env.ELIGIBLE_AT) fail('derived cycle-009 eligibility timestamp drifted');
          const observed = new Date();
          const eligibleMs = Date.parse(derivedEligibleAt);
          if (!Number.isFinite(eligibleMs) || observed.getTime() >= eligibleMs) fail('pre-eligibility census ran at or after the authorized boundary');

          const waterlineCycles = collectObjects(waterline, (row) => row.id === env.CYCLE_008_ID);
          if (waterlineCycles.length !== 1) fail('cycle-008 waterline receipt is not unique');
          const waterlineCycle = waterlineCycles[0];
          if (waterlineCycle.scope_id !== env.SCOPE_ID || waterlineCycle.lease_id !== env.CYCLE_008_LEASE || waterlineCycle.outcome !== 'completed') fail('cycle-008 waterline receipt drifted');

          const identityRow = (job) => ({
            id: job.id,
            scope: job.scope,
            priority: job.priority,
            performer: job.performer,
            character: job.character,
            performance_modes: [...(job.performance_modes || [])].sort(),
            source_fingerprint: job.source_fingerprint,
          });
          const orderedPreimage = ranked.compatible.map((row) => identityRow(row.task));
          const firstPreimage = identityRow(ranked.compatible[0].task);
          const receipt = {
            status: 'preeligible-cycle-009-selector-census-sealed',
            census_run: Number(env.GITHUB_RUN_ID),
            census_attempt: Number(env.GITHUB_RUN_ATTEMPT),
            carrier_pr: Number(env.CARRIER_PR),
            carrier_head: env.CARRIER_HEAD,
            canonical_main: env.CANONICAL_MAIN,
            observed_at: observed.toISOString(),
            eligibility_basis: 'cycle_008_reviewed_at_plus_24_hours',
            eligibility_anchor_at: anchor,
            eligible_at: derivedEligibleAt,
            milliseconds_until_eligible: eligibleMs - observed.getTime(),
            completed_cycle_id: env.CYCLE_008_ID,
            scope_id: env.SCOPE_ID,
            capability_profile_id: env.PROFILE_ID,
            capability_profile_status: ranked.profile.status,
            queue: {
              total: scoped.length,
              queued: queued.length,
              resolved: resolved.length,
              in_flight: inFlight.length,
              compatible: ranked.compatible.length,
              incompatible: ranked.incompatible.length,
            },
            queue_order_rule: ['priority_desc', 'scope_asc', 'performer_asc', 'character_asc'],
            queue_state_sha256: sha(readFileSync(statePath)),
            capability_policy_sha256: capabilityPolicySha256(policy),
            selector_source_sha256: sha(selectorSource),
            waterline_state_sha256: sha(readFileSync(waterlinePath)),
            cycle_008_receipt_file_sha256: sha(readFileSync(cycleReceiptPath)),
            ordered_compatible_queue_commitment: sha(stableJson(orderedPreimage)),
            first_eligible_candidate_commitment: sha(`${derivedEligibleAt}\n${stableJson(firstPreimage)}`),
            candidate_identity_disclosed: false,
            selection_preimage_retained: false,
            next_candidate_selected: false,
            task_id: null,
            lease_id: null,
            wall_id: null,
            subject: null,
            performer: null,
            role: null,
            mode: null,
            repository_write: false,
            queue_mutated: false,
            lease_issued: false,
            cycle_009_authorized: false,
            outside_human_dependency: false,
            owner_physical_action_required: false,
          };
          receipt.identity = sha(stableJson(receipt));
          writeFileSync(`${env.OUT}/receipt/preeligibility-selector-census.json`, JSON.stringify(receipt, null, 2) + '\n');
          console.log('pre-eligibility selector census sealed without candidate disclosure');
          NODE
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          ! grep -Fq "$OUT/receipt/SHA256SUMS.pre" "$OUT/receipt/SHA256SUMS.pre"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload pre-eligibility selector census
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-preeligibility-census-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-preeligibility-census-v2/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload census diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-preeligibility-census-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-preeligibility-census-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
