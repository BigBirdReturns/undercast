name: cadmar-cycle-monitor

on:
  push:
    branches:
      - agent/star-trek-cadmar-monitor-v1

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 974ea1668633a56f1ad1b39e95adfb5cfe7fa799
      RESULT_BRANCH: agent/star-trek-cadmar-monitor-result-v1
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover Cadmar cycle run and logs
        run: |
          set -euo pipefail
          rm -rf /tmp/cadmar-monitor
          mkdir -p /tmp/cadmar-monitor
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_HEAD&per_page=100" > /tmp/cadmar-monitor/runs.json
          run_id="$(jq -r '[.workflow_runs[] | select(.head_sha==env.TARGET_HEAD) | select(.path==".github/workflows/star-trek-cadmar-cycle-v1.yml")][0].id // empty' /tmp/cadmar-monitor/runs.json)"
          test -n "$run_id"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/cadmar-monitor/run.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/cadmar-monitor/jobs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/cadmar-monitor/artifacts.json
          job_id="$(jq -r '.jobs[0].id // empty' /tmp/cadmar-monitor/jobs.json)"
          test -n "$job_id"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > /tmp/cadmar-monitor/job.log || true
          export run_id job_id
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/cadmar-monitor/run.json').read_text())
          jobs = json.loads(Path('/tmp/cadmar-monitor/jobs.json').read_text())
          artifacts = json.loads(Path('/tmp/cadmar-monitor/artifacts.json').read_text())
          payload = {
              'version': 1,
              'transaction': 'STAR-TREK-CADMAR-CYCLE-MONITOR',
              'target_head': os.environ['TARGET_HEAD'],
              'run_id': int(os.environ['run_id']),
              'job_id': int(os.environ['job_id']),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'run_attempt': run.get('run_attempt'),
              'created_at': run.get('created_at'),
              'updated_at': run.get('updated_at'),
              'jobs': [{
                  'id': row.get('id'),
                  'name': row.get('name'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'steps': row.get('steps'),
              } for row in jobs.get('jobs', [])],
              'artifacts': [{
                  'id': row.get('id'),
                  'name': row.get('name'),
                  'size_in_bytes': row.get('size_in_bytes'),
                  'digest': row.get('digest'),
                  'expired': row.get('expired'),
              } for row in artifacts.get('artifacts', [])],
          }
          Path('/tmp/cadmar-monitor/summary.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Publish Cadmar cycle monitor result
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/cadmar-cycle-monitor
          mkdir -p transport/cadmar-cycle-monitor
          cp -a /tmp/cadmar-monitor/. transport/cadmar-cycle-monitor/
          git config user.name undercast-cadmar-monitor
          git config user.email cadmar-monitor@users.noreply.github.com
          git add transport/cadmar-cycle-monitor
          git commit -m 'Cadmar: publish failed cycle monitor receipt'
          git push --force origin "HEAD:refs/heads/$RESULT_BRANCH"
