name: doctor-who-cycle-008-kreg-candidate-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-00.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-01.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-02.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-03.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-04.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-05.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-06.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-07.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-08.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-09.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-10.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-11.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-01.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-02.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-03.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-04.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-05.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-06.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-07.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-08.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-09.sh"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/phase-10.sh"
      - ".github/workflows/doctor-who-cycle-008-kreg-candidate-v4.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: doctor-who-cycle-008-kreg-candidate-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLOOR_MAIN: cf0c0abda404d3751677c1c7cfb1673bf791dfae
  SOURCE_BUILD_MAIN: 3228efd6ede786586352b1b990a94d16ab02d5f9
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-candidate-v4
  WORKFLOW_PATH: .github/workflows/doctor-who-cycle-008-kreg-candidate-v4.yml
  DELTA_PREFIX: .github/doctor-who-cycle-008/kreg-candidate-v4/payload.part-
  DELTA_B64_BYTES: "147557"
  DELTA_B64_SHA256: 4a9abadc3dd7dfec98447ff5af03b6286b347f0981de77c5b4c70ceca679007b
  DELTA_XZ_BYTES: "109228"
  DELTA_XZ_SHA256: c2527ef7c9a056cad36fd24bf24ca6b9f44c67ea19ef627dc4a21ba199947444
  DELTA_TAR_BYTES: "184320"
  DELTA_TAR_SHA256: adeaf07199f7a0a3b4d79b2c255a61a131e6ec29afacb7006457f129ade75a97
  DELTA_MANIFEST_SHA256: 0048626847dbb1f4770f83de487c05e6b36c9aff2d1eb54465d4aa61b5f58c3b
  SETTLEMENT_SHA256: 6d49a9b52bfe03df15667a7de3c04238c0bad3cac409728c6aa5a26b5ca8eed3
  EXPECTED_PATHS_SHA256: 936c96600265d2b2a82443ee98e603ac24e9b01b8184a8f82e3e0082b23a7786
  FILE_MANIFEST_SHA256: 644e33c8d745b2d868daef7e5e941422280b3a8b3a26b89760a4d059d6d124e7
  REVIEW_ARTIFACT_NAME: doctor-who-cycle-008-kreg-independent-media-review-v1-31110923065
  REVIEW_RUN: "31110923065"
  OBSERVER_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-prepublish-v1-observer-31112660901
  OBSERVER_RUN: "31112660901"
  OUT: /tmp/doctor-who-cycle-008-kreg-candidate-v4
  PAYLOAD_OUT: /tmp/doctor-who-cycle-008-kreg-candidate-v4/payload
  PRODUCT_OUT: /tmp/doctor-who-cycle-008-kreg-candidate-v4/product
  WORKTREE: /tmp/doctor-who-cycle-008-kreg-candidate-v4/worktree
  GH_TOKEN: ${{ github.token }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

jobs:
  candidate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-candidate-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Verify exact qualifier programs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-01.sh' | awk '{print $1}')" = "9bea5bf59189332380f0a5f692cf33be537ea8c3dca47fc1f3cb597ba784b24d"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-01.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-02.sh' | awk '{print $1}')" = "e60bc761a6adfc79a2db5cd633bef0007e8475cbf8cdb130f5ab5a4925de96da"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-02.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-03.sh' | awk '{print $1}')" = "392d02a2d8ee927ac98873ec67f4c5b6ae7429272da60adb6bc22d69c579b201"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-03.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-04.sh' | awk '{print $1}')" = "51dc8b5808b33a8d9ddd377bc58af1483a3e0cd5dc356bd6e49a4414422a34a3"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-04.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-05.sh' | awk '{print $1}')" = "3f74feb92c30829fa1721fd5ffe185744f9a38aec0e96a522da07366af6036f0"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-05.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-06.sh' | awk '{print $1}')" = "9e9c640072dda24c57925033298af3ea731f5aee33f38b347d3a41d1e83d1f83"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-06.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-07.sh' | awk '{print $1}')" = "c432405f75296b86fda9b586fb25e0646d29ed43df49a5b728f778a16ddd56c8"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-07.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-08.sh' | awk '{print $1}')" = "ee1575706884ea214dd625bd47e08af5a4518883fc7e4801f70f7782b20676a2"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-08.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-09.sh' | awk '{print $1}')" = "b41773321b12f77d317fc68fbd67be6e573c085d32909c98742f5b1c0b89f734"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-09.sh'
          test "$(sha256sum '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-10.sh' | awk '{print $1}')" = "a209a7602555514eaf08bb4fab5e126fc7cfa925807c9e313c9083163ab84d70"
          bash -n '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-10.sh'

      - name: Bind direct one-commit carrier and unchanged live main
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-01.sh'

      - name: Reassemble and verify checksum-bound delta settlement
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-02.sh'

      - name: Bind exact successful preflight, census, review, and publication evidence
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-03.sh'

      - name: Download exact independent-review packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REVIEW_ARTIFACT_NAME }}
          path: ${{ env.OUT }}/review
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.REVIEW_RUN }}

      - name: Download exact media-publication observer packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.OBSERVER_ARTIFACT_NAME }}
          path: ${{ env.OUT }}/observer
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.OBSERVER_RUN }}

      - name: Verify review receipts and immutable served media
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-04.sh'

      - name: Reconstruct and verify exactly forty workflow-free product members
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-05.sh'

      - name: Overlay exact product, commit before gate, and verify commit blobs
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-06.sh'

      - name: Install exact dependencies and Chromium
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-07.sh'

      - name: Run complete canonical and rendered gate on the clean candidate commit
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-08.sh'

      - name: Seal deterministic candidate bundle, archive, patch, and receipt
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-09.sh'

      - name: Rebind unchanged live main after complete qualification
        shell: bash
        run: bash '.github/doctor-who-cycle-008/kreg-candidate-v4/phase-10.sh'

      - name: Upload immutable Kreg candidate V4 qualification packet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-who-cycle-008-kreg-candidate-v4-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
