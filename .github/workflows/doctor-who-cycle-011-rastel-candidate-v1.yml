name: doctor-who-cycle-011-rastel-candidate-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      EXACT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-v1
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      EXPECTED_WALL_ID: UC-1356
      SOURCE_URL: https://tardis.fandom.com/wiki/Rastel
      SOURCE_PAGEID: "171335"
      SOURCE_REVISION: "3722691"
      SOURCE_SHA256: 740bc0ffb8732261d1df15661aa4e193c7a7f8d94aa96f96ac92c02e41ce8776
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      PRODUCT_URL: https://www.bigfinish.com/releases/v/doctor-who-dark-eyes-4-980
      COVER_SHA256: b1efc0bcd009050a3b6fc1593312a6ddeb8139ac1770f9c45a806fa617bb57cf
      COVER_BYTES: "87752"
      PREFLIGHT_PR: "744"
      PREFLIGHT_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PREFLIGHT_RUN: "31298921410"
      PREFLIGHT_JOB: "93208436364"
      PREFLIGHT_ARTIFACT: "9033898468"
      PREFLIGHT_ZIP_SHA256: 204eac7333f1d057ee9e6d1950f97ec049a4931020e634857ffd0c28f8d8d9f5
      PREFLIGHT_IDENTITY: ac55077e5dfd2ad81fc0fa0e1f74f3619100619e6a3488cfbb4ee84859927303
      EVIDENCE_PR: "746"
      EVIDENCE_HEAD: 1326e0595e284a730261078bc345af4091a9df1c
      EVIDENCE_RUN: "31299338135"
      EVIDENCE_JOB: "93209484740"
      EVIDENCE_ARTIFACT: "9034030268"
      EVIDENCE_ZIP_SHA256: 521c2b4527cd92418003c0a65ee7a040d3fe8672eb1ff313d8392d81439b45d5
      EVIDENCE_IDENTITY: c900abac9bf49e19ffe65c6e01ccf3e0e772a26b23c7f25773a08647ddd615b9
      REVIEW_PR: "749"
      REVIEW_HEAD: 5a0cbae240a9b1b260783a6de079a524581b0b45
      REVIEW_RUN: "31323694254"
      REVIEW_JOB: "93270561975"
      REVIEW_ARTIFACT: "9040937208"
      REVIEW_ZIP_SHA256: 759f16f2c0f6fc81799471e557463bd02e45b984afad3369c39f4eaf4024b7a1
      REVIEW_IDENTITY: 0163f68ea539b2908969e44b06095ec5024396a4f598e0834e02510f6e64c97d
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      PORTRAIT_BYTES: "44412"
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg
      PORTRAIT_LICENSE: CC BY-SA 2.0
      PORTRAIT_AUTHOR: Gage Skidmore
      SELECTION_BASIS: cycle-011-preflight-v1:ac55077e5dfd2ad81fc0fa0e1f74f3619100619e6a3488cfbb4ee84859927303
      CLAIM_AT: 2026-08-09T16:35:00.000Z
      SUBMIT_AT: 2026-08-09T16:37:00.000Z
      ACCEPT_AT: 2026-08-09T16:38:00.000Z
      MERGE_AT: 2026-08-09T16:39:00.000Z
      AUDIT_AT: 2026-08-09T16:40:00.000Z
      REVIEW_AT: 2026-08-09T16:41:00.000Z
      COMMIT_AT: 2026-08-09T16:42:00.000Z
      FETCHED_AT: 2026-08-09
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      SOURCE_CHUNK_SHA256: 1a10e85937545d4042edb429add1c1d07d4adf81fb6f4c33c3929ef142fdc121
      SOURCE_GZIP_SHA256: 0bdef49fd07272ab96d65946fc2107b04228afe6c181c4d307401e96507569c3
      SOURCE_MATERIALIZER_SHA256: 154de7a44efa304f5b64a3c09d21f0f169f58c14e4454b0b5767630745eae740
      SOURCE_MATERIALIZER_BYTES: "37671"
      PATCH_BLOB: 3c7bbac9b039997d5a279f519379cce29ab16bbe
      PATCH_B64_SHA256: b978e3e6b6649e9e6ba543999f1497c974b1722c14611083d23e9cc4d8f0a165
      PATCH_B64_BYTES: "10836"
      PATCH_GZIP_SHA256: ba2f2040430a7f6c4cfdb343a3ef801c9976d6fa56182698cfd295ee863548c4
      PATCH_GZIP_BYTES: "8125"
      PATCH_SHA256: 2c3cb04a0610aa255db77ddef050a86c829dada95273d963af5647d7087963ef
      PATCH_BYTES: "38060"
      MATERIALIZER_SHA256: 10291dfa21ad654e8f69767422ec19e6575858b6d4b998aac086a482e0895669
      MATERIALIZER_BYTES: "39549"
      CONTROL: /tmp/doctor-who-cycle-011-rastel-candidate-v1-control

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct proven candidate source and apply exact Rastel patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$CONTROL"
          mkdir -p "$OUT" "$CONTROL"
          head="$PR_HEAD"
          pr="$PR_NUMBER"
          test "$(git rev-parse HEAD)" = "$head"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$EXACT_MAIN")" = "$EXACT_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          : > "$CONTROL/materializer.gz.b64"
          for blob in \
            fecc507c2b8f21b347523ae4f785b39d38498284 \
            ef3062c0d02aeb6dce1014c041a12a96bed355ba \
            dab6d7aa3e0a5b3b37469ffc51645767026d93f7 \
            d275eb15601fb60c58ac9c84a5121438bc7b1b87 \
            e83ca4e276922443ef3928cb5c65b60f4497f1ba \
            a9113b9fc07a946f27b42cc703a369baae251891 \
            d511af7e0c6bafcb0f8e949cfe764257cb6c7ae8
          do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$CONTROL/materializer.gz.b64"
          done
          test "$(sha256sum "$CONTROL/materializer.gz.b64" | awk '{print $1}')" = "$SOURCE_CHUNK_SHA256"

          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CONTROL/patch.gz.b64"
          test "$(wc -c < "$CONTROL/patch.gz.b64" | tr -d ' ')" = "$PATCH_B64_BYTES"
          test "$(sha256sum "$CONTROL/patch.gz.b64" | awk '{print $1}')" = "$PATCH_B64_SHA256"

          python3 - <<'PY'
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['CONTROL'])
          raw=base64.b64decode((root/'materializer.gz.b64').read_text())
          assert len(raw)>0 and hashlib.sha256(raw).hexdigest()==os.environ['SOURCE_GZIP_SHA256']
          original=gzip.decompress(raw)
          assert len(original)==int(os.environ['SOURCE_MATERIALIZER_BYTES'])
          assert hashlib.sha256(original).hexdigest()==os.environ['SOURCE_MATERIALIZER_SHA256']
          (root/'materialize.original.sh').write_bytes(original)

          patch_raw=base64.b64decode((root/'patch.gz.b64').read_text())
          assert len(patch_raw)==int(os.environ['PATCH_GZIP_BYTES'])
          assert hashlib.sha256(patch_raw).hexdigest()==os.environ['PATCH_GZIP_SHA256']
          patch=gzip.decompress(patch_raw)
          assert len(patch)==int(os.environ['PATCH_BYTES'])
          assert hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']
          (root/'materialize.patch').write_bytes(patch)

          receipt={
            'version':1,
            'status':'cycle-011-rastel-candidate-patch-bound',
            'source':{
              'chunk_sha256':os.environ['SOURCE_CHUNK_SHA256'],
              'gzip_sha256':os.environ['SOURCE_GZIP_SHA256'],
              'materializer_sha256':os.environ['SOURCE_MATERIALIZER_SHA256'],
              'materializer_bytes':len(original),
            },
            'patch':{
              'blob':os.environ['PATCH_BLOB'],
              'base64_sha256':os.environ['PATCH_B64_SHA256'],
              'gzip_sha256':os.environ['PATCH_GZIP_SHA256'],
              'sha256':os.environ['PATCH_SHA256'],
              'bytes':len(patch),
            },
            'expected':{
              'materializer_sha256':os.environ['MATERIALIZER_SHA256'],
              'materializer_bytes':int(os.environ['MATERIALIZER_BYTES']),
            },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'patch-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

          cp "$CONTROL/materialize.original.sh" "$CONTROL/materialize.sh"
          (cd "$CONTROL" && patch --batch --forward -p0 < materialize.patch)
          test "$(wc -c < "$CONTROL/materialize.sh" | tr -d ' ')" = "$MATERIALIZER_BYTES"
          test "$(sha256sum "$CONTROL/materialize.sh" | awk '{print $1}')" = "$MATERIALIZER_SHA256"
          test -z "$(grep -E 'Merx|merx|MERX' "$CONTROL/materialize.sh" || true)"
          grep -F 'DOCTOR-WHO-CYCLE-011-RASTEL-CANDIDATE-V1' "$CONTROL/materialize.sh" >/dev/null
          grep -F 'cycle_012_authorized' "$CONTROL/materialize.sh" >/dev/null
          bash -n "$CONTROL/materialize.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path(__import__('os').environ['CONTROL'],'materialize.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==10
          for index,block in enumerate(blocks,1):
              compile(block,f'<rastel-candidate-{index}>','exec')
          PY
          cp "$CONTROL/patch-receipt.json" "$OUT/patch-receipt.json"

      - name: Execute exact candidate-only Rastel transaction
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$CONTROL/materialize.sh"
          exec "$CONTROL/materialize.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v1
            /tmp/doctor-who-cycle-011-rastel-candidate-v1-control
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
