name: estate-repair-collect004-schema

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect004-schema.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect004-schema
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Admit exact permanent multi-role review enums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-cumulative-packet-batch.mjs')
          text = path.read_text()

          replacements = {
              'function acceptedIdentity(value) { return /^expected-subject(?:$|-)/.test(String(value || "")); }': '''function acceptedIdentity(value) {
            return /^(?:expected-subject(?:$|-)|expected-subjects$)/.test(String(value || ""));
          }''',
              'function acceptedPresentation(value) { return /(?:^|-)character-depiction$/.test(String(value || "")); }': '''function acceptedPresentation(value) {
            const typed = String(value || "");
            return /(?:^|-)character-depiction$/.test(typed)
              || /^(?:two|three)-role-character-composite$/.test(typed);
          }''',
              '  assert(acceptedIdentity("expected-subject-set"), "expected-subject-set must pass");': '''  assert(acceptedIdentity("expected-subject-set"), "expected-subject-set must pass");
            assert(acceptedIdentity("expected-subjects"), "permanent expected-subjects enum must pass");''',
              '  assert(acceptedPresentation("three-role-character-depiction"), "three-role character depiction must pass");': '''  assert(acceptedPresentation("three-role-character-depiction"), "three-role character depiction must pass");
            assert(acceptedPresentation("two-role-character-composite"), "permanent two-role character composite must pass");
            assert(acceptedPresentation("three-role-character-composite"), "permanent three-role character composite must pass");''',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact schema patch expected one match, found {count}: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
          node scripts/estate-adopt-cumulative-packet-batch.mjs --fixtures
          node scripts/estate-adopt-cumulative-packet-batch.mjs \
            --plan data/review/estate-debt/COLLECT-004-CANONICAL-ADOPTION-PLAN.json \
            > /tmp/COLLECT-004-schema-preflight.json
          test "$(node -p "require('/tmp/COLLECT-004-schema-preflight.json').pending")" = 5
          test "$(node -p "require('/tmp/COLLECT-004-schema-preflight.json').authorized")" = 5

      - name: Retire this one-shot repair and publish exact source fix
        run: |
          set -euo pipefail
          rm .github/workflows/estate-repair-collect004-schema.yml
          git add scripts/estate-adopt-cumulative-packet-batch.mjs .github/workflows/estate-repair-collect004-schema.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/estate-repair-collect004-schema.yml\nscripts/estate-adopt-cumulative-packet-batch.mjs'
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: admit permanent multi-role review enums' \
            -m 'expected-subjects remains exact expected-subject identity' \
            -m 'two/three-role-character-composite remain exact still presentations' \
            -m 'probable identity and performer portrait remain rejected' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "repair_run=${GITHUB_RUN_ID}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report repaired schema boundary
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-004 preflight failure repaired on workflow run $GITHUB_RUN_ID.

          The repair admits only the exact permanent multi-role enums already present in the retained packets:

          - identity: \`expected-subjects\`
          - presentation: \`two-role-character-composite\`
          - presentation: \`three-role-character-composite\`

          Existing rejection boundaries remain unchanged: probable identity and performer-portrait substitution still fail the still lane. The five-packet COLLECT-004 preflight passed before publication. This one-shot repair workflow deleted itself; the bounded adoption workflow now owns the next exact-head run.
          EOF_COMMENT

      - name: Report failed schema repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-004 schema repair failed closed on workflow run $GITHUB_RUN_ID.

          No canonical mutation or cumulative adoption claim is authorized. Preserve the exact retained manifest enums and repair only the validator/fixture mismatch; do not rewrite packet evidence or weaken probable-identity and portrait-substitution rejection.
          EOF_COMMENT
