name: doctor-who-cycle-012-media-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-review-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-review-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      PREDECESSOR_MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      EVIDENCE_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      SELECTOR_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-media-review-v2
      SELF: .github/workflows/doctor-who-cycle-012-media-review-v2.yml
      OUT: /tmp/doctor-who-cycle-012-media-review-v2
      CENSUS_ROOT: /tmp/doctor-who-cycle-012-media-review-v2-census
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      CENSUS_PR: "886"
      CENSUS_HEAD: 6df4b5ff49100ac6a30577d6b85f25897c1d11f0
      CENSUS_RUN: "31379311959"
      CENSUS_JOB: "93425661894"
      CENSUS_ARTIFACT: "9059303657"
      CENSUS_ARTIFACT_NAME: doctor-who-cycle-012-media-census-v10-31379311959-attempt-1
      CENSUS_ARTIFACT_BYTES: "431517"
      CENSUS_ARTIFACT_SHA256: 079914134398cb06d7062c36a4b9c645e54ec620e06016ba51e18e6b9f1ed71d
      CENSUS_ARTIFACT_MEMBERS: "23"
      CENSUS_IDENTITY: 2b08dff44dd90153e12387d3dc3ebcf2550a607aa12b7a00a67907b19abcc1b4
      V8_FAILURE_IDENTITY: ca886c0374d5e7d72cd2f22aea940f94088f0dd1859fe1a7dece8ea915d4952e
      V9_FAILURE_IDENTITY: ee79e8eab79ef3ca62cff70f2b1d18d077cd98737a004127567a627d30ad661d

      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb817592c3f6c2
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION: "3243079"
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_IMAGE_BYTES: "17554"
      SOURCE_IMAGE_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      PORTRAIT_SOURCE_PATH: images/uc-1348-portrait.jpg
      PORTRAIT_SOURCE_SHA256: 6ee6c78d48f5ea533d60945988d2cf148312deaff2688d34796c44f931e9121b
      PORTRAIT_FILE: /tmp/doctor-who-cycle-012-media-review-v2/review/performer-portrait-candidate.jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V10 census and current reviewer geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$CENSUS_ROOT"
          mkdir -p "$OUT"/{api,census,review,receipt,logs,payload} "$CENSUS_ROOT"

          test "$CURRENT_BASE" = "$MAIN"
          test "$CURRENT_HEAD" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CENSUS_PR" > "$OUT/api/census-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CENSUS_RUN" > "$OUT/api/census-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CENSUS_RUN/jobs?per_page=100" > "$OUT/api/census-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CENSUS_ARTIFACT" > "$OUT/api/census-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CENSUS_ARTIFACT/zip" > "$OUT/census.zip"

          test "$(wc -c < "$OUT/census.zip" | tr -d ' ')" = "$CENSUS_ARTIFACT_BYTES"
          test "$(sha256sum "$OUT/census.zip" | awk '{print $1}')" = "$CENSUS_ARTIFACT_SHA256"

          python3 - <<'PY'
          import hashlib,json,os,shutil,stat,zipfile
          from pathlib import Path,PurePosixPath

          out=Path(os.environ['OUT'])
          target=Path(os.environ['CENSUS_ROOT'])
          sha=lambda data: hashlib.sha256(data).hexdigest()
          api=out/'api'

          own=json.loads((api/'carrier.json').read_text())
          census_pr=json.loads((api/'census-pr.json').read_text())
          run=json.loads((api/'census-run.json').read_text())
          jobs=json.loads((api/'census-jobs.json').read_text())['jobs']
          artifact=json.loads((api/'census-artifact.json').read_text())

          assert own['number']==int(os.environ['CURRENT_PR'])
          assert own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['base']['ref']=='main' and own['base']['sha']==os.environ['MAIN']
          assert own['commits']==1 and own['changed_files']==1

          assert census_pr['number']==int(os.environ['CENSUS_PR'])
          assert census_pr['state']=='open' and census_pr['draft'] is True and census_pr['merged'] is False
          assert census_pr['head']['ref']=='agent/doctor-who-cycle-012-media-census-v10'
          assert census_pr['head']['sha']==os.environ['CENSUS_HEAD'] and census_pr['base']['ref']=='main'
          assert census_pr['commits']==1 and census_pr['changed_files']==1

          assert run['id']==int(os.environ['CENSUS_RUN'])
          assert run['head_sha']==os.environ['CENSUS_HEAD']
          assert run['name']=='doctor-who-cycle-012-media-census-v10'
          assert run['status']=='completed' and run['conclusion']=='success'
          matched=[job for job in jobs if job['id']==int(os.environ['CENSUS_JOB'])]
          assert len(matched)==1 and matched[0]['name']=='inspect' and matched[0]['conclusion']=='success'

          assert artifact['id']==int(os.environ['CENSUS_ARTIFACT'])
          assert artifact['name']==os.environ['CENSUS_ARTIFACT_NAME']
          assert artifact['size_in_bytes']==int(os.environ['CENSUS_ARTIFACT_BYTES'])
          assert artifact['digest']=='sha256:'+os.environ['CENSUS_ARTIFACT_SHA256']
          assert artifact['expired'] is False

          with zipfile.ZipFile(out/'census.zip') as archive:
              infos=archive.infolist()
              assert len(infos)==int(os.environ['CENSUS_ARTIFACT_MEMBERS'])
              assert len(infos)==len({info.filename for info in infos})
              roots={PurePosixPath(info.filename).parts[0] for info in infos}
              assert roots=={
                  'doctor-who-cycle-012-media-census-v10',
                  'doctor-who-cycle-012-media-census-v8-failure',
                  'doctor-who-cycle-012-media-census-v9-failure',
              }
              for info in infos:
                  pure=PurePosixPath(info.filename)
                  assert not pure.is_absolute() and '..' not in pure.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff
                  assert not stat.S_ISLNK(mode)
                  assert not info.is_dir()
                  path=target.joinpath(*pure.parts)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(archive.read(info))

          ledgers=[]
          for sealed in sorted(target.rglob('SHA256SUMS')):
              pre=sealed.with_name('SHA256SUMS.pre')
              assert pre.is_file()
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():
                      continue
                  digest,name=raw.split(None,1)
                  path=sealed.parent/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest
                  count+=1
              ledgers.append({
                  'root':sealed.parent.relative_to(target).as_posix(),
                  'rows':count,
                  'sha256':sha(pre.read_bytes()),
              })
          assert len(ledgers)==3

          def load_exact(status):
              rows=[]
              for path in target.rglob('*.json'):
                  try:
                      data=json.loads(path.read_text())
                  except Exception:
                      continue
                  if data.get('status')==status:
                      rows.append((path,data))
              assert len(rows)==1,(status,[str(path) for path,_ in rows])
              return rows[0]

          v8_path,v8=load_exact('cycle-012-media-census-v8-pre-repair-count-classified-v1')
          v9_path,v9=load_exact('cycle-012-media-census-v9-supervisor-transport-classified-v1')
          census_path,census=load_exact('cycle-012-doctor-who-media-census-complete-v2')

          for data,expected in (
              (v8,os.environ['V8_FAILURE_IDENTITY']),
              (v9,os.environ['V9_FAILURE_IDENTITY']),
              (census,os.environ['CENSUS_IDENTITY']),
          ):
              identity=data.pop('identity')
              assert identity==expected
              assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
              data['identity']=identity

          marker=census_path.with_name('CENSUS_COMPLETE')
          assert marker.is_file() and marker.read_text().strip()==census['identity']
          assert census['carrier']=={
              'pr':int(os.environ['CENSUS_PR']),
              'head':os.environ['CENSUS_HEAD'],
              'base':os.environ['PREDECESSOR_MAIN'],
          }
          assert census['canonical']=={
              'live_main':os.environ['PREDECESSOR_MAIN'],
              'evidence_main':os.environ['EVIDENCE_MAIN'],
              'selector_main':os.environ['SELECTOR_MAIN'],
          }
          assert census['task']=={
              'id':os.environ['TASK_ID'],
              'performer':os.environ['PERFORMER'],
              'role':os.environ['ROLE'],
              'mode':os.environ['MODE'],
              'source_url':os.environ['SOURCE_URL'],
              'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],
          }
          assert census['source']['page_id']==int(os.environ['SOURCE_PAGE_ID'])
          assert census['source']['revision_id']==int(os.environ['SOURCE_REVISION'])
          assert census['source']['content_sha256']==os.environ['SOURCE_CONTENT_SHA256']
          assert census['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert census['waterline']=={'claim_allowed':True,'media_debt':0,'unreceipted':[]}
          assert all(census['gates'].values())
          assert census['boundary']=={
              'media_census_only':True,
              'lease_issued':False,
              'queue_mutated':False,
              'repository_write':False,
              'canonical_mutated':False,
              'wall_created':False,
              'character_image_adopted':False,
              'performer_portrait_adopted':False,
              'cycle_receipt_written':False,
              'cycle_012_product_authority':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }

          character=census['character_image']
          candidate=character['candidate']
          assert character['image_field_raw']=='Senstarg.jpg'
          assert character['image_field_status']=='candidate'
          assert character['image_title']=='File:Senstarg.jpg'
          assert character['parsed_images']==['Senstarg.jpg']
          assert character['adopted'] is False and candidate['adopted'] is False
          assert candidate['bytes']==int(os.environ['SOURCE_IMAGE_BYTES'])
          assert candidate['sha256']==os.environ['SOURCE_IMAGE_SHA256']
          assert candidate['width']==730 and candidate['height']==532

          packet=census_path.parent
          source_file=packet/'source/source-image-candidate'
          inventory_file=packet/'portraits/inventory.json'
          assert source_file.is_file() and source_file.stat().st_size==int(os.environ['SOURCE_IMAGE_BYTES'])
          assert sha(source_file.read_bytes())==os.environ['SOURCE_IMAGE_SHA256']
          inventory=json.loads(inventory_file.read_text())
          assert inventory['status']=='cycle-012-dan-starkey-canonical-portrait-inventory-v1'
          assert inventory['performer']==os.environ['PERFORMER']
          assert inventory['portrait_count']==8
          assert inventory['canonical_image_count']==2115
          assert inventory['canonical_unique_digest_count']==2114
          assert inventory['portrait_adopted'] is False
          selected=[row for row in inventory['portraits'] if row['src']==os.environ['PORTRAIT_SOURCE_PATH']]
          assert len(selected)==1 and selected[0]['sha256']==os.environ['PORTRAIT_SOURCE_SHA256']

          copies={
              'media-census.json':census_path,
              'portraits/inventory.json':inventory_file,
              'source/source-image-candidate':source_file,
              'source/census.json':packet/'source/census.json',
              'source/imageinfo-normalized.json':packet/'source/imageinfo-normalized.json',
              'source/imageinfo.json':packet/'source/imageinfo.json',
              'receipt/evidence-custody.json':packet/'receipt/evidence-custody.json',
          }
          for rel,source in copies.items():
              assert source.is_file()
              destination=out/'census'/rel
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(source.read_bytes())

          custody={
              'status':'cycle-012-v10-media-census-authenticated-for-current-main-review-v1',
              'version':1,
              'carrier':{
                  'pr':int(os.environ['CURRENT_PR']),
                  'head':os.environ['CURRENT_HEAD'],
                  'base':os.environ['MAIN'],
              },
              'census':{
                  'pr':int(os.environ['CENSUS_PR']),
                  'head':os.environ['CENSUS_HEAD'],
                  'run':int(os.environ['CENSUS_RUN']),
                  'job':int(os.environ['CENSUS_JOB']),
                  'artifact':int(os.environ['CENSUS_ARTIFACT']),
                  'artifact_bytes':int(os.environ['CENSUS_ARTIFACT_BYTES']),
                  'artifact_sha256':os.environ['CENSUS_ARTIFACT_SHA256'],
                  'identity':census['identity'],
                  'canonical_main':census['canonical']['live_main'],
              },
              'current_main':os.environ['MAIN'],
              'current_main_delta':{
                  'from':os.environ['PREDECESSOR_MAIN'],
                  'to':os.environ['MAIN'],
                  'expected_path':'.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml',
                  'permanent_product_bytes_changed':False,
              },
              'task':census['task'],
              'ledgers':ledgers,
              'predecessor_failure_identities':[v8['identity'],v9['identity']],
              'boundary':{
                  'media_review_only':True,
                  'lease_issued':False,
                  'queue_mutated':False,
                  'repository_write':False,
                  'canonical_mutated':False,
                  'media_adopted':False,
                  'cycle_receipt_written':False,
                  'cycle_012_product_authority':False,
              },
          }
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (out/'receipt/census-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          test "$(git diff --name-status "$PREDECESSOR_MAIN".."$MAIN")" = $'A\t.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml'
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Rehydrate installed main and rerun complete gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          npm ci
          npx playwright install --with-deps chromium

          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null

          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null

          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null

          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Independently disposition character image and select licensed portrait source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path

          root=Path(os.environ['OUT'])
          sha=lambda data: hashlib.sha256(data).hexdigest()
          census=json.loads((root/'census/media-census.json').read_text())
          inventory=json.loads((root/'census/portraits/inventory.json').read_text())
          canonical={row['sha256'] for row in inventory['canonical_images']}

          source=root/'census/source/source-image-candidate'
          data=source.read_bytes()
          assert source.stat().st_size==int(os.environ['SOURCE_IMAGE_BYTES'])
          digest=sha(data)
          assert digest==os.environ['SOURCE_IMAGE_SHA256']
          if data[:4]==b'RIFF' and data[8:12]==b'WEBP':
              actual_mime='image/webp'
              extension='.webp'
          elif data[:3]==b'\xff\xd8\xff':
              actual_mime='image/jpeg'
              extension='.jpg'
          elif data[:8]==b'\x89PNG\r\n\x1a\n':
              actual_mime='image/png'
              extension='.png'
          else:
              raise AssertionError('unsupported character-image signature')
          assert digest not in canonical
          character_path=root/'review'/('character-image-candidate'+extension)
          character_path.write_bytes(data)
          character={
              'status':'exact-revision-field-candidate-verified',
              'artifact':'review/'+character_path.name,
              'candidate_sha256':digest,
              'candidate_bytes':len(data),
              'source_title':census['character_image']['candidate']['title'],
              'reported_mime':census['character_image']['candidate']['mime'],
              'actual_mime':actual_mime,
              'width':census['character_image']['candidate']['width'],
              'height':census['character_image']['candidate']['height'],
              'canonical_image_collision':False,
              'rationale':'The immutable Senstarg revision directly names this byte-distinct file in its infobox image field.',
              'adopted':False,
          }

          licensed=[]
          for row in inventory['portraits']:
              license_text=str(row.get('license') or '').casefold()
              if not row.get('origin') or not row.get('author'):
                  continue
              if not any(token in license_text for token in ('cc by','creative commons','public domain','cc0')):
                  continue
              path=Path(row['src'])
              assert path.is_file()
              assert path.stat().st_size==row['bytes']
              assert sha(path.read_bytes())==row['sha256']
              licensed.append(row)
          assert licensed
          licensed.sort(key=lambda row:(-row['bytes'],row['src'],row['sha256']))
          portrait_source=licensed[0]
          assert portrait_source['src']==os.environ['PORTRAIT_SOURCE_PATH']
          assert portrait_source['sha256']==os.environ['PORTRAIT_SOURCE_SHA256']

          digest_ledger='\n'.join(sorted(canonical)).encode()
          decision={
              'status':'cycle-012-senstarg-media-review-decision-preimage-v2',
              'version':2,
              'character_image':character,
              'portrait_source':portrait_source,
              'portrait_selection':{
                  'eligible_sources':len(licensed),
                  'policy':'largest-byte-count licensed canonical Dan Starkey portrait, then source path and SHA-256',
              },
              'canonical_image_inventory':{
                  'rows':len(inventory['canonical_images']),
                  'unique_digests':len(canonical),
                  'sorted_digest_ledger_sha256':sha(digest_ledger),
              },
              'character_image_adopted':False,
              'performer_portrait_adopted':False,
          }
          decision['identity']=sha(json.dumps(decision,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'review/decision-preimage.json').write_text(json.dumps(decision,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (root/'review/portrait-source.txt').write_text(portrait_source['src']+'\n')
          PY

          source_portrait="$(cat "$OUT/review/portrait-source.txt")"
          test "$source_portrait" = "$PORTRAIT_SOURCE_PATH"
          test -f "$source_portrait"
          test "$(sha256sum "$source_portrait" | awk '{print $1}')" = "$PORTRAIT_SOURCE_SHA256"

          SOURCE_PORTRAIT="$source_portrait" node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          function mimeFor(bytes) {
            if (bytes.length >= 12 && bytes.subarray(0, 4).toString('ascii') === 'RIFF' && bytes.subarray(8, 12).toString('ascii') === 'WEBP') return 'image/webp';
            if (bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) return 'image/jpeg';
            if (bytes.length >= 8 && bytes.subarray(0, 8).equals(Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a]))) return 'image/png';
            throw new Error('unsupported portrait source signature');
          }

          (async () => {
            const source = fs.readFileSync(process.env.SOURCE_PORTRAIT);
            const sourceMime = mimeFor(source);
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 900, height: 900 } });
            const result = await page.evaluate(async ({ b64, sourceMime }) => {
              const img = new Image();
              img.src = `data:${sourceMime};base64,${b64}`;
              await img.decode();
              const iw = img.naturalWidth;
              const ih = img.naturalHeight;
              const ratio = 420 / 600;
              let sw;
              let sh;
              if (iw / ih >= ratio) {
                sh = Math.floor(ih * 0.94);
                sw = Math.floor(sh * ratio);
                if (sw > iw * 0.96) {
                  sw = Math.floor(iw * 0.96);
                  sh = Math.floor(sw / ratio);
                }
              } else {
                sw = Math.floor(iw * 0.94);
                sh = Math.floor(sw / ratio);
                if (sh > ih * 0.96) {
                  sh = Math.floor(ih * 0.96);
                  sw = Math.floor(sh * ratio);
                }
              }
              const sx = Math.max(0, Math.min(iw - sw, Math.round((iw - sw) * 0.5)));
              const sy = Math.max(0, Math.min(ih - sh, Math.round((ih - sh) * 0.18)));
              const canvas = document.createElement('canvas');
              canvas.width = 420;
              canvas.height = 600;
              const ctx = canvas.getContext('2d');
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 420, 600);
              return {
                url: canvas.toDataURL('image/jpeg', 0.92),
                source: { width: iw, height: ih, mime: sourceMime },
                crop: { x: sx, y: sy, width: sw, height: sh },
                target: { width: 420, height: 600 },
                quality: 0.92,
              };
            }, { b64: source.toString('base64'), sourceMime });
            await browser.close();
            const bytes = Buffer.from(result.url.split(',')[1], 'base64');
            if (bytes.length < 10000) throw new Error(`portrait candidate too small: ${bytes.length}`);
            fs.mkdirSync(path.dirname(process.env.PORTRAIT_FILE), { recursive: true });
            fs.writeFileSync(process.env.PORTRAIT_FILE, bytes);
            delete result.url;
            fs.writeFileSync(path.join(process.env.OUT, 'review', 'portrait-crop.json'), JSON.stringify(result, null, 2) + '\n');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          test -s "$PORTRAIT_FILE"
          test "$(wc -c < "$PORTRAIT_FILE" | tr -d ' ')" -gt 10000
          test "$(od -An -tx1 -N3 "$PORTRAIT_FILE" | tr -d ' \n')" = ffd8ff
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Verify candidate collisions and seal independent media review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path

          root=Path(os.environ['OUT'])
          sha=lambda data: hashlib.sha256(data).hexdigest()
          census=json.loads((root/'census/media-census.json').read_text())
          inventory=json.loads((root/'census/portraits/inventory.json').read_text())
          custody=json.loads((root/'receipt/census-custody.json').read_text())
          decision=json.loads((root/'review/decision-preimage.json').read_text())
          autopilot=json.loads((root/'receipt/autopilot-status.json').read_text())
          waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          canonical={row['sha256'] for row in inventory['canonical_images']}

          decision_identity=decision.pop('identity')
          assert sha(json.dumps(decision,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==decision_identity
          decision['identity']=decision_identity

          character=decision['character_image']
          character_file=root/character['artifact']
          assert character_file.is_file()
          assert character_file.stat().st_size==character['candidate_bytes']
          assert sha(character_file.read_bytes())==character['candidate_sha256']
          assert character['candidate_sha256'] not in canonical
          assert character['canonical_image_collision'] is False and character['adopted'] is False
          assert character['actual_mime']=='image/webp'

          portrait_file=Path(os.environ['PORTRAIT_FILE'])
          assert portrait_file.is_file() and portrait_file.read_bytes()[:3]==b'\xff\xd8\xff'
          portrait_digest=sha(portrait_file.read_bytes())
          source=decision['portrait_source']
          assert portrait_digest!=source['sha256']
          assert portrait_digest not in canonical
          crop=json.loads((root/'review/portrait-crop.json').read_text())
          assert crop['target']=={'width':420,'height':600}
          portrait={
              'status':'byte-distinct-candidate-verified',
              'artifact':'review/performer-portrait-candidate.jpg',
              'candidate_sha256':portrait_digest,
              'candidate_bytes':portrait_file.stat().st_size,
              'target_dimensions':crop['target'],
              'source':source,
              'source_dimensions':crop['source'],
              'crop':crop['crop'],
              'jpeg_quality':crop['quality'],
              'canonical_image_collision':False,
              'adopted':False,
          }

          assert autopilot['total']==316
          assert autopilot['statuses']=={'queued':305,'resolved':11}
          assert autopilot['in_flight']==0
          assert waterline['claim_allowed'] is True
          assert waterline['claim_reasons']==[]
          assert waterline['jobs']['in_flight']==0
          assert waterline['media']['debt']==0
          assert waterline['cycles']['unreceipted']==[]

          receipt={
              'status':'cycle-012-doctor-who-media-independently-adjudicated-v2',
              'version':2,
              'carrier':{
                  'pr':int(os.environ['CURRENT_PR']),
                  'head':os.environ['CURRENT_HEAD'],
                  'base':os.environ['MAIN'],
              },
              'census':custody['census'],
              'census_custody_identity':custody['identity'],
              'canonical':{
                  'current_main':os.environ['MAIN'],
                  'census_main':os.environ['PREDECESSOR_MAIN'],
                  'evidence_main':os.environ['EVIDENCE_MAIN'],
                  'selector_main':os.environ['SELECTOR_MAIN'],
              },
              'task':census['task'],
              'character_image':character,
              'performer_portrait':portrait,
              'official_link_candidates':census['character_image']['official_link_candidates'],
              'queue':{
                  'total':autopilot['total'],
                  'queued':autopilot['statuses']['queued'],
                  'resolved':autopilot['statuses']['resolved'],
                  'in_flight':autopilot['in_flight'],
              },
              'waterline':{
                  'claim_allowed':waterline['claim_allowed'],
                  'media_debt':waterline['media']['debt'],
                  'unreceipted':waterline['cycles']['unreceipted'],
              },
              'decision_preimage_identity':decision['identity'],
              'gates':{
                  'census_artifact':True,
                  'census_checksum_ledgers':True,
                  'census_identity':True,
                  'current_main_cleanup_writer_delta':True,
                  'cycle_010':True,
                  'cycle_011':True,
                  'autopilot':True,
                  'media_22_of_22':True,
                  'waterline':True,
                  'complete_rendered_gate':True,
                  'character_exact_revision_field':True,
                  'character_actual_mime_verified':True,
                  'character_byte_distinct':True,
                  'portrait_source_license_boundary':True,
                  'portrait_source_exact_bytes':True,
                  'portrait_byte_distinct':True,
              },
              'boundary':{
                  'media_review_only':True,
                  'lease_issued':False,
                  'queue_mutated':False,
                  'repository_write':False,
                  'canonical_mutated':False,
                  'wall_created':False,
                  'character_image_adopted':False,
                  'performer_portrait_adopted':False,
                  'cycle_receipt_written':False,
                  'product_constructed':False,
                  'cycle_012_product_authority':False,
                  'outside_human_dependency':False,
                  'owner_physical_action_required':False,
              },
          }
          assert receipt['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert receipt['waterline']=={'claim_allowed':True,'media_debt':0,'unreceipted':[]}
          assert all(receipt['gates'].values())
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'payload/media-review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (root/'payload/REVIEW_COMPLETE').write_text(receipt['identity']+'\n')

          copies={
              'review/decision-preimage.json':root/'review/decision-preimage.json',
              'review/character-image-candidate.webp':root/'review/character-image-candidate.webp',
              'review/performer-portrait-candidate.jpg':root/'review/performer-portrait-candidate.jpg',
              'review/portrait-crop.json':root/'review/portrait-crop.json',
              'receipt/census-custody.json':root/'receipt/census-custody.json',
              'receipt/autopilot-status.json':root/'receipt/autopilot-status.json',
              'receipt/waterline-status.json':root/'receipt/waterline-status.json',
              'census/media-census.json':root/'census/media-census.json',
              'census/portraits/inventory.json':root/'census/portraits/inventory.json',
              'census/source/census.json':root/'census/source/census.json',
              'census/source/imageinfo-normalized.json':root/'census/source/imageinfo-normalized.json',
          }
          for rel,source_path in copies.items():
              assert source_path.is_file()
              destination=root/'payload'/rel
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(source_path.read_bytes())

          for name in (
              'cycle-010.log',
              'cycle-011.log',
              'autopilot.log',
              'media-validate.log',
              'media-gate.log',
              'waterline-validate.log',
              'complete-gate.log',
          ):
              source_path=root/'logs'/name
              assert source_path.is_file()
              destination=root/'payload/logs'/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(source_path.read_bytes())
          PY

          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" |
            sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-media-review-v2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-review-v2
            /tmp/doctor-who-cycle-012-media-review-v2-census
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
