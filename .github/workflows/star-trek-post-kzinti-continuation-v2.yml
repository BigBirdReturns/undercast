name: star-trek-post-kzinti-continuation-v2

on:
  push:
    branches:
      - agent/star-trek-post-kzinti-continuation-v2

permissions:
  contents: read

concurrency:
  group: star-trek-post-kzinti-continuation-v2
  cancel-in-progress: true

jobs:
  park:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Park until Kzinti Flyer terminal custody exists
        run: echo 'Post-Kzinti continuation v2 parked; original carrier is preserved in branch history.'
