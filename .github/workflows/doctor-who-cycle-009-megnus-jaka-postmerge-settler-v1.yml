name: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1.yml
      CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      CANONICAL_PARENT: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      CANONICAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      OBSERVER_PR: "706"
      OBSERVER_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-postmerge-v2
      OBSERVER_HEAD: 259dd9d7723c01b690c16da4df750002ddbb9594
      OBSERVER_WORKFLOW: doctor-who-cycle-009-megnus-jaka-postmerge-v2
      PROOF_STATUS: cycle-009-megnus-jaka-terminal-postmerge-proved-v1
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_4ca825307ad0d4510f44c7d9
      WALL_ID: UC-1354
      CYCLE_ID: cycle_42b1d086ae8eab34f09827dc
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact settler and observer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,proof,settlement}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$OBSERVER_PR" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$OBSERVER_BRANCH" > "$OUT/api/observer-ref.json"
          ROOT="$OUT" SELF_PR="$pr" SELF_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          own=json.loads((root/'api/carrier-pr.json').read_text())
          observer=json.loads((root/'api/observer-pr.json').read_text())
          ref=json.loads((root/'api/observer-ref.json').read_text())
          assert own['number']==int(os.environ['SELF_PR'])
          assert own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['ref']=='main' and own['base']['sha']==os.environ['CANONICAL_MAIN']
          assert own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['SELF_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert observer['number']==int(os.environ['OBSERVER_PR'])
          assert observer['state']=='open' and observer['draft'] is True and observer['merged'] is False
          assert observer['base']['ref']=='main' and observer['base']['sha']==os.environ['CANONICAL_MAIN']
          assert observer['head']['ref']==os.environ['OBSERVER_BRANCH']
          assert observer['head']['sha']==os.environ['OBSERVER_HEAD']
          assert observer['commits']==1 and observer['changed_files']==1
          assert ref['object']['sha']==os.environ['OBSERVER_HEAD']
          PY
          printf 'SELF_PR=%s\nSELF_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Wait for and authenticate terminal observer proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 80); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$OBSERVER_HEAD&event=pull_request&per_page=100" > "$OUT/api/observer-runs.json"
            if ROOT="$OUT" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/observer-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['name']==os.environ['OBSERVER_WORKFLOW'] and row['head_sha']==os.environ['OBSERVER_HEAD']]
          if not rows:
              sys.exit(1)
          row=sorted(rows,key=lambda item:item['id'])[-1]
          if row['status']!='completed':
              sys.exit(1)
          if row['conclusion']!='success':
              raise SystemExit('terminal observer run failed')
          (Path(os.environ['ROOT'])/'api/observer-run.json').write_text(json.dumps(row,indent=2,sort_keys=True)+'\n')
          PY
            then found=true; break; fi
            sleep 15
          done
          test "$found" = true

          OBSERVER_RUN="$(jq -r '.id' "$OUT/api/observer-run.json")"
          OBSERVER_ATTEMPT="$(jq -r '.run_attempt' "$OUT/api/observer-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN/jobs?per_page=100" > "$OUT/api/observer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN/artifacts?per_page=100" > "$OUT/api/observer-artifacts.json"
          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          run=json.loads((root/'api/observer-run.json').read_text())
          jobs=json.loads((root/'api/observer-jobs.json').read_text())['jobs']
          artifacts=json.loads((root/'api/observer-artifacts.json').read_text())['artifacts']
          assert run['name']==os.environ['OBSERVER_WORKFLOW']
          assert run['head_branch']==os.environ['OBSERVER_BRANCH']
          assert run['head_sha']==os.environ['OBSERVER_HEAD']
          assert run['event']=='pull_request' and run['run_attempt']==1
          assert run['status']=='completed' and run['conclusion']=='success'
          assert len(jobs)==1 and jobs[0]['name']=='prove'
          assert jobs[0]['status']=='completed' and jobs[0]['conclusion']=='success'
          expected=f"{os.environ['OBSERVER_WORKFLOW']}-proof-{run['id']}-attempt-{run['run_attempt']}"
          rows=[row for row in artifacts if row['name']==expected]
          assert len(rows)==1 and rows[0]['expired'] is False
          artifact=rows[0]
          assert artifact['workflow_run']['id']==run['id']
          assert artifact['workflow_run']['head_sha']==os.environ['OBSERVER_HEAD']
          (root/'api/proof-artifact.json').write_text(json.dumps(artifact,indent=2,sort_keys=True)+'\n')
          PY

          PROOF_ARTIFACT="$(jq -r '.id' "$OUT/api/proof-artifact.json")"
          PROOF_DIGEST="$(jq -r '.digest' "$OUT/api/proof-artifact.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT/zip" > "$OUT/proof.zip"
          test "$(sha256sum "$OUT/proof.zip" | cut -d' ' -f1)" = "${PROOF_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT'])
          target=root/'proof'
          with zipfile.ZipFile(root/'proof.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():
                      continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'
          sealed=target/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=target/name.lstrip('*')
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest

          proof=json.loads((target/'postmerge-proof.json').read_text())
          identity=proof.pop('identity')
          assert hashlib.sha256(json.dumps(proof,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          proof['identity']=identity
          assert proof['status']==os.environ['PROOF_STATUS']
          assert proof['proof_run']==json.loads((root/'api/observer-run.json').read_text())['id']
          assert proof['proof_attempt']==1
          assert proof['carrier_pr']==int(os.environ['OBSERVER_PR'])
          assert proof['carrier_head']==os.environ['OBSERVER_HEAD']
          assert proof['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert proof['canonical_main']==os.environ['CANONICAL_MAIN']
          assert proof['canonical_tree']==os.environ['CANONICAL_TREE']
          assert proof['canonical_path_count']==48
          assert proof['product_pr']==692 and proof['product_pr_state']=='closed' and proof['product_pr_merged'] is True
          assert proof['task_id']==os.environ['TASK_ID']
          assert proof['lease_id']==os.environ['LEASE_ID']
          assert proof['wall_id']==os.environ['WALL_ID']
          assert proof['cycle_id']==os.environ['CYCLE_ID']
          assert proof['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert proof['media_debt']==0 and proof['unreceipted_cycles']==[]
          assert proof['next_selector_allowed'] is True and proof['next_selector_reasons']==[]
          assert proof['cycle_010_lease_issued'] is False
          assert proof['cleanup_authorized'] is True and proof['canonical_mutation'] is False
          assert proof['outside_human_dependency'] is False
          assert proof['owner_physical_action_required'] is False
          (root/'settlement/proof.bound.json').write_bytes((target/'postmerge-proof.json').read_bytes())
          PY
          printf 'observer_run=%s\nobserver_attempt=%s\nproof_artifact=%s\nproof_digest=%s\n' \
            "$OBSERVER_RUN" "$OBSERVER_ATTEMPT" "$PROOF_ARTIFACT" "$PROOF_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Seal code-free postmerge settlement
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          proof=json.loads((root/'settlement/proof.bound.json').read_text())
          receipt={
              'status':'cycle-009-megnus-jaka-postmerge-settlement-approved-v1',
              'settler_run':int(os.environ['GITHUB_RUN_ID']),
              'settler_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'settler_pr':int(os.environ['SELF_PR']),
              'settler_head':os.environ['SELF_HEAD'],
              'canonical_main':os.environ['CANONICAL_MAIN'],
              'observer_pr':int(os.environ['OBSERVER_PR']),
              'observer_branch':os.environ['OBSERVER_BRANCH'],
              'observer_head':os.environ['OBSERVER_HEAD'],
              'observer_run':proof['proof_run'],
              'observer_attempt':proof['proof_attempt'],
              'proof_artifact':int(os.environ['PROOF_ARTIFACT']),
              'proof_digest':os.environ['PROOF_DIGEST'],
              'proof_identity':proof['identity'],
              'observer_close_authorized':True,
              'settler_close_authorized':True,
              'branch_deletion_authorized':False,
              'cycle_010_selector_authorized':proof['next_selector_allowed'],
              'cycle_010_lease_issued':False,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'settlement/settlement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/settlement" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/settlement/$rel" | sed "s#  $OUT/settlement/#  #"
          done > "$OUT/settlement/SHA256SUMS.pre"
          sha256sum "$OUT/settlement/SHA256SUMS.pre" | sed "s#  $OUT/settlement/#  #" > "$OUT/settlement/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
        env:
          PROOF_ARTIFACT: ${{ steps.proof.outputs.proof_artifact }}
          PROOF_DIGEST: ${{ steps.proof.outputs.proof_digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  settle:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      OBSERVER_PR: "706"
      OBSERVER_HEAD: 259dd9d7723c01b690c16da4df750002ddbb9594
      SETTLEMENT: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-settlement
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-outcome

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-settlement

      - name: Reverify proof and close completed transport PRs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          SETTLEMENT="$SETTLEMENT" OUT="$OUT" python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          root=Path(os.environ['SETTLEMENT'])
          out=Path(os.environ['OUT'])
          repo=os.environ['GITHUB_REPOSITORY']

          def gh(method,path,payload=None):
              cmd=['gh','api']
              if method!='GET':
                  cmd+=['--method',method]
              cmd.append(path)
              if payload is None:
                  proc=subprocess.run(cmd,check=True,capture_output=True,text=True)
              else:
                  proc=subprocess.run(cmd+['--input','-'],input=json.dumps(payload),check=True,capture_output=True,text=True)
              return json.loads(proc.stdout) if proc.stdout.strip() else None

          ledger=root/'SHA256SUMS.pre'
          sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=root/name.lstrip('*')
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest

          settlement=json.loads((root/'settlement.json').read_text())
          identity=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          settlement['identity']=identity
          proof=json.loads((root/'proof.bound.json').read_text())
          proof_identity=proof.pop('identity')
          assert hashlib.sha256(json.dumps(proof,sort_keys=True,separators=(',',':')).encode()).hexdigest()==proof_identity
          proof['identity']=proof_identity

          assert settlement['status']=='cycle-009-megnus-jaka-postmerge-settlement-approved-v1'
          assert settlement['settler_run']==int(os.environ['GITHUB_RUN_ID'])
          assert settlement['settler_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert settlement['canonical_main']==os.environ['CANONICAL_MAIN']
          assert settlement['observer_pr']==int(os.environ['OBSERVER_PR'])
          assert settlement['observer_head']==os.environ['OBSERVER_HEAD']
          assert settlement['proof_identity']==proof['identity']
          assert settlement['observer_close_authorized'] is True
          assert settlement['settler_close_authorized'] is True
          assert settlement['branch_deletion_authorized'] is False
          assert settlement['cycle_010_selector_authorized'] is True
          assert settlement['cycle_010_lease_issued'] is False
          assert settlement['canonical_mutation'] is False

          main=gh('GET',f'/repos/{repo}/git/ref/heads/main')
          assert main['object']['sha']==os.environ['CANONICAL_MAIN']
          observer=gh('GET',f'/repos/{repo}/pulls/{settlement["observer_pr"]}')
          assert observer['state']=='open' and observer['draft'] is True and observer['merged'] is False
          assert observer['head']['sha']==settlement['observer_head']
          own=gh('GET',f'/repos/{repo}/pulls/{settlement["settler_pr"]}')
          assert own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['head']['sha']==settlement['settler_head']

          body=(
              'Terminal cycle-009 post-merge proof retained.\n\n'
              '```text\n'
              f'observer run:      {settlement["observer_run"]}\n'
              f'proof artifact:    {settlement["proof_artifact"]}\n'
              f'proof digest:      {settlement["proof_digest"]}\n'
              f'proof identity:    {settlement["proof_identity"]}\n'
              f'canonical main:    {settlement["canonical_main"]}\n'
              'queue:             307 queued / 9 resolved / 0 in flight\n'
              'next selector:     authorized\n'
              'cycle-010 lease:   not issued\n'
              'canonical mutation:false\n'
              '```\n\n'
              'Closed without merge after checksum-bound proof retention.'
          )
          gh('POST',f'/repos/{repo}/issues/{settlement["observer_pr"]}/comments',{'body':body})
          gh('PATCH',f'/repos/{repo}/pulls/{settlement["observer_pr"]}',{'state':'closed'})
          observer=gh('GET',f'/repos/{repo}/pulls/{settlement["observer_pr"]}')
          assert observer['state']=='closed' and observer['merged'] is False

          own_body=(
              'Cycle-009 terminal observer settled.\n\n'
              '```text\n'
              f'proof identity:  {settlement["proof_identity"]}\n'
              f'settlement:      {settlement["identity"]}\n'
              f'canonical main:  {settlement["canonical_main"]}\n'
              'observer closed:  true\n'
              'selector allowed: true\n'
              'lease issued:     false\n'
              '```\n\n'
              'This write lane changed PR state only and is closed without merge.'
          )
          gh('POST',f'/repos/{repo}/issues/{settlement["settler_pr"]}/comments',{'body':own_body})
          gh('PATCH',f'/repos/{repo}/pulls/{settlement["settler_pr"]}',{'state':'closed'})
          own=gh('GET',f'/repos/{repo}/pulls/{settlement["settler_pr"]}')
          assert own['state']=='closed' and own['merged'] is False

          after=gh('GET',f'/repos/{repo}/git/ref/heads/main')
          assert after['object']['sha']==os.environ['CANONICAL_MAIN']

          outcome={
              'status':'cycle-009-megnus-jaka-postmerge-prs-settled-v1',
              'settle_run':int(os.environ['GITHUB_RUN_ID']),
              'settle_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'canonical_main':os.environ['CANONICAL_MAIN'],
              'observer_pr':settlement['observer_pr'],
              'observer_state':observer['state'],
              'observer_merged':observer['merged'],
              'settler_pr':settlement['settler_pr'],
              'settler_state':own['state'],
              'settler_merged':own['merged'],
              'proof_identity':settlement['proof_identity'],
              'settlement_identity':settlement['identity'],
              'cycle_010_selector_authorized':True,
              'cycle_010_lease_issued':False,
              'branch_deletion_performed':False,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          outcome['identity']=hashlib.sha256(json.dumps(outcome,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'outcome.json').write_text(json.dumps(outcome,indent=2,sort_keys=True)+'\n')
          (out/'settlement.bound.json').write_bytes((root/'settlement.json').read_bytes())
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"
          done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-outcome-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-outcome
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-postmerge-outcome-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-postmerge-outcome
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
