name: star-trek-population-002-claim

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-002-CLAIM.json"
      - ".github/workflows/star-trek-population-002-claim.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-population-002-claim
  cancel-in-progress: false

jobs:
  claim:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install live-site verification runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Prove the merged Zek state is live before claiming the next card
        env:
          LIVE_ORIGIN: https://bigbirdreturns.github.io/undercast
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-claim
          rm -rf "$out"
          mkdir -p "$out"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { chromium } from '@playwright/test';
          const out='/tmp/star-trek-population-002-claim';
          const origin=process.env.LIVE_ORIGIN;
          const expectedArchive=JSON.parse(fs.readFileSync('data/archive.json','utf8'));
          const expectedHash=expectedArchive.canonical.records.sha256;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          let liveArchive=null,liveSpecies=null,lastError='';
          for(let attempt=1;attempt<=40;attempt++){
            try{
              const nonce=`?population002=${Date.now()}`;
              const [archiveResponse,speciesResponse]=await Promise.all([
                fetch(`${origin}/data/archive.json${nonce}`,{cache:'no-store'}),
                fetch(`${origin}/data/species.json${nonce}`,{cache:'no-store'})
              ]);
              if(!archiveResponse.ok||!speciesResponse.ok) throw new Error(`HTTP archive=${archiveResponse.status} species=${speciesResponse.status}`);
              liveArchive=await archiveResponse.json();
              liveSpecies=await speciesResponse.json();
              const ferengi=(liveSpecies.taxa||[]).find(row=>row.key==='species:star-trek:ferengi');
              const zek=(ferengi?.credits||[]).find(row=>row.character==='Zek'&&row.performer==='Wallace Shawn');
              if(liveArchive?.canonical?.records?.count===1250
                && liveArchive?.canonical?.records?.sha256===expectedHash
                && ferengi?.counts?.primary_card_records===15
                && ferengi?.counts?.primary_card_credits===17
                && ferengi?.counts?.unfiled_named_credits===37
                && zek?.status==='primary-card'
                && zek?.wall_ids?.includes('UC-1281')){
                break;
              }
              lastError=`attempt ${attempt}: count=${liveArchive?.canonical?.records?.count} hash=${liveArchive?.canonical?.records?.sha256} ferengi=${JSON.stringify(ferengi?.counts)} zek=${JSON.stringify(zek)}`;
            }catch(error){lastError=`attempt ${attempt}: ${error.message}`;}
            if(attempt===40) throw new Error(`live deployment did not converge: ${lastError}`);
            await sleep(15000);
          }
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const url=`${origin}/index.html?species=Ferengi&population002=${Date.now()}`;
          await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
          await page.locator('#result-status').waitFor({state:'attached',timeout:90000});
          await page.waitForFunction(()=>document.querySelector('#result-status')?.textContent?.includes('specimens match'),null,{timeout:90000});
          const status=(await page.locator('#result-status').textContent())?.trim();
          const names=await page.locator('.charname').allTextContents();
          if(status!=='15 specimens match; 15 shown.') throw new Error(`live rendered count drifted: ${status}`);
          if(!names.includes('Zek')) throw new Error(`live rendered Ferengi wall lacks Zek: ${JSON.stringify(names)}`);
          await page.screenshot({path:`${out}/live-ferengi-wall.png`,fullPage:true});
          await browser.close();
          const receipt={
            version:1,
            verified_at:new Date().toISOString(),
            live_origin:origin,
            merged_main:'c915644bb09ef65c01aed29668b9cdd9b0838f70',
            archive:{count:liveArchive.canonical.records.count,sha256:liveArchive.canonical.records.sha256},
            ferengi:(liveSpecies.taxa||[]).find(row=>row.key==='species:star-trek:ferengi').counts,
            rendered:{status,names}
          };
          fs.writeFileSync(`${out}/live-deployment-receipt.json`,JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE
      - name: Verify exact Arridor task identity and current readiness
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-claim
          node scripts/corpus-ops.mjs status --json | tee "$out/corpus-before.json"
          node scripts/waterline.mjs status --scope star-trek --json | tee "$out/waterline-before.json"
          node scripts/autopilot.mjs readiness --scope star-trek --require-active --json | tee "$out/readiness.json"
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const command=JSON.parse(fs.readFileSync('.github/STAR-TREK-POPULATION-002-CLAIM.json','utf8'));
          const autopilotBytes=fs.readFileSync('data/AUTOPILOT.json');
          const state=JSON.parse(autopilotBytes);
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const job=(state.jobs||[]).find(row=>row.id===command.task_id);
          if(!job) throw new Error('Arridor task is absent from durable state');
          if(job.scope!=='star-trek'||job.performer!=='Dan Shor'||job.character!=='Arridor') throw new Error(`Arridor identity drifted: ${JSON.stringify(job)}`);
          if(job.status!=='queued'||job.queueable!==true) throw new Error(`Arridor is not queueable: ${job.status}`);
          if(!(job.performance_modes||[]).some(mode=>['physical-prosthetic','physical-and-voice'].includes(mode))) throw new Error('Arridor is not a physical performance task');
          if(!(job.source_receipts||[]).some(row=>row.revision&&row.content_sha256)) throw new Error('Arridor lacks an exact revision-bound source receipt');
          const inFlight=(state.jobs||[]).filter(row=>row.scope==='star-trek'&&['leased','drafted','merged'].includes(row.status));
          const debt=(audit.items||[]).filter(row=>row.scope==='star-trek'&&['review','attention'].includes(row.status));
          if(inFlight.length||debt.length) throw new Error(`claim refused: in-flight=${inFlight.length} media-debt=${debt.length}`);
          const selected={
            task_id:job.id,performer:job.performer,character:job.character,
            categories:job.categories,performance_modes:job.performance_modes,
            source_fingerprint:job.source_fingerprint,source_receipts:job.source_receipts,
            autopilot_sha256:crypto.createHash('sha256').update(autopilotBytes).digest('hex')
          };
          fs.writeFileSync('/tmp/star-trek-population-002-claim/selected.json',JSON.stringify(selected,null,2)+'\n');
          NODE
      - name: Persist one restart-safe Arridor lease
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-claim
          node scripts/autopilot.mjs claim \
            --agent luna \
            --scope star-trek \
            --capability-profile text-vision \
            --task-id ap_06b3c87ad3a1485e80ba650c \
            --limit 1 \
            --lease-minutes 360 \
            --selection-basis "Second visible population cycle: highest-ranked remaining exact-source physical Ferengi gap after Zek, with a dedicated character identity and direct visitor impact on the Ferengi wall." \
            --out data/review/trek-population-002-arridor-lease.json \
            --prompt data/review/trek-population-002-arridor-prompt.md \
            | tee "$out/claim.json"
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > "$out/waterline-after.json"
      - name: Commit the lease before any Arridor processing
        run: |
          set -euo pipefail
          out=/tmp/star-trek-population-002-claim
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          rm -f .github/STAR-TREK-POPULATION-002-CLAIM.json
          rm -f .github/workflows/star-trek-population-002-claim.yml
          git add data/AUTOPILOT.json data/journal/autopilot.jsonl \
            data/review/trek-population-002-arridor-lease.json \
            data/review/trek-population-002-arridor-prompt.md \
            .github/STAR-TREK-POPULATION-002-CLAIM.json \
            .github/workflows/star-trek-population-002-claim.yml
          git diff --cached --check
          git commit -m "Population: lease Dan Shor as Arridor"
          git show --stat --oneline HEAD > "$out/commit.txt"
          git push origin HEAD:agent/star-trek-population-002
      - name: Retain public-deployment and claim receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-002-claim-${{ github.run_id }}
          path: /tmp/star-trek-population-002-claim
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
