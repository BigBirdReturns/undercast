name: fix-operational-metric-ledger-custody-v2

on:
  push:
    branches:
      - agent/operational-metric-ledger-custody
    paths:
      - .github/workflows/fix-operational-metric-ledger-custody-v2.yml
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fix-operational-metric-ledger-custody-v2
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-metric-ledger-custody
  AUTHORIZED_MAIN: 0e20d87f1c10cbc4d734b5c1247d88b55b82b3d6
  SELF: .github/workflows/fix-operational-metric-ledger-custody-v2.yml
  OLD_SELF: .github/workflows/fix-operational-metric-ledger-custody.yml
  PATCHER: scripts/apply-metric-ledger-custody-hotfix.mjs
  RECEIPT: data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind the exact hotfix denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"

          git diff --name-only "$AUTHORIZED_MAIN...HEAD" | sort > /tmp/start-paths.txt
          printf '%s\n' \
            "$SELF" \
            "$OLD_SELF" \
            "$PATCHER" \
            scripts/lib/metric-readiness.mjs \
            scripts/metric-readiness-fixtures.mjs \
            | sort > /tmp/expected-start-paths.txt
          diff -u /tmp/expected-start-paths.txt /tmp/start-paths.txt

      - name: Apply exact source, validation, and receipt-binding repairs
        run: |
          set -euo pipefail
          node --check "$PATCHER"
          node "$PATCHER" apply
          node --check scripts/lib/metric-readiness.mjs
          node --check scripts/metric-readiness-fixtures.mjs
          node --check scripts/lib/waterline.mjs
          node --check scripts/waterline.mjs

      - name: Prove adversarial custody and current readiness
        run: |
          set -euo pipefail
          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/hotfix-status.json
          node "$PATCHER" verify-status /tmp/hotfix-status.json

          if node scripts/waterline.mjs status \
            --scope star-trek \
            --cost-ledger data/operational-reliability/RIGHTS-CASES.json \
            --json > /tmp/mismatch.out 2> /tmp/mismatch.err; then
            echo 'mismatched ledger override unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'does not match configured observation source' /tmp/mismatch.err

      - name: Author the candidate receipt and run the complete gate
        run: |
          set -euo pipefail
          node "$PATCHER" author-receipt /tmp/hotfix-status.json
          git add \
            scripts/lib/metric-readiness.mjs \
            scripts/metric-readiness-fixtures.mjs \
            scripts/lib/waterline.mjs \
            scripts/waterline.mjs \
            docs/OPERATIONAL-METRICS.md \
            "$RECEIPT"
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/metric-ledger-custody-candidate-gate.log

      - name: Retire temporary authority, promote receipt, and gate the final tree
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          node "$PATCHER" promote-receipt
          git add "$RECEIPT"
          git rm "$SELF" "$OLD_SELF" "$PATCHER"
          git diff --cached --check

          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/final-hotfix-status.json
          npm run gate 2>&1 | tee /tmp/metric-ledger-custody-final-gate.log

      - name: Publish exact hotfix custody under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json
          docs/OPERATIONAL-METRICS.md
          scripts/lib/metric-readiness.mjs
          scripts/lib/waterline.mjs
          scripts/metric-readiness-fixtures.mjs
          scripts/waterline.mjs
          PATHS
          sort -u /tmp/expected-final-paths.txt -o /tmp/expected-final-paths.txt
          git diff --cached --name-only refs/remotes/origin/main | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git config user.name undercast-operational-reliability
          git config user.email undercast-operational-reliability@users.noreply.github.com
          git commit \
            -m 'Operations: bind metrics to exact ledger custody' \
            -m 'validate configured sources and rows' \
            -m 'bind numeric receipts to source hash and population' \
            -m 'reopen measurement on every ledger revision'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"

      - name: Upload hotfix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-metric-ledger-custody-v2-${{ github.run_id }}
          path: |
            /tmp/hotfix-status.json
            /tmp/final-hotfix-status.json
            /tmp/mismatch.err
            /tmp/metric-ledger-custody-candidate-gate.log
            /tmp/metric-ledger-custody-final-gate.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
