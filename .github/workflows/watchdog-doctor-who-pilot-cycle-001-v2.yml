name: watchdog-doctor-who-pilot-cycle-001-v2

on:
  push:
    branches:
      - agent/doctor-who-pilot-cycle-001-current
    paths:
      - ".github/workflows/watchdog-doctor-who-pilot-cycle-001-v2.yml"

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: agent/doctor-who-pilot-cycle-001-current
  PR_NUMBER: "184"
  SELF: .github/workflows/watchdog-doctor-who-pilot-cycle-001-v2.yml
  GH_TOKEN: ${{ github.token }}
  MATERIALIZER: scripts/apply-doctor-who-pilot-cycle-001.mjs
  RECEIPT: data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
  CHECKER: scripts/doctor-who-pilot-cycle.mjs

concurrency:
  group: doctor-who-pilot-cycle-001
  cancel-in-progress: true

jobs:
  close-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Exit a completed PR or bind the open exact head
        id: bind
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          if [ "$state" != OPEN ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$(git rev-parse refs/remotes/origin/main)"
          echo "EXACT_MAIN=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_ENV"
          echo "AUTHORIZED_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CYCLE_AT=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Install exact dependencies and rendered runtime
        if: steps.bind.outputs.active == 'true'
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Patch only live compatibility seams and materialize
        if: steps.bind.outputs.active == 'true'
        run: |
          set -euo pipefail
          if [ ! -f "$RECEIPT" ] || [ ! -f "$CHECKER" ]; then
            test -f "$MATERIALIZER"
            python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-doctor-who-pilot-cycle-001.mjs')
          s = p.read_text()
          s = s.replace("const abs = (p) => path.join(ROOT, p);", "const abs = (p) => path.isAbsolute(p) ? p : path.join(ROOT, p);")
          s = s.replace("['action', 'disposition', 'status', 'outcome', 'type']", "['action', 'disposition', 'status', 'outcome', 'type', 'result', 'kind']")
          s = s.replace("wiki: SOURCE,", "wiki: 'https://en.wikipedia.org/wiki/Dan_Starkey',")
          start = s.index('function recordCycle(')
          end = s.index('\nfunction findCycleReceipt()', start)
          replacement = r'''function recordCycle(wallId, gateLogSha) {
            globalThis.__WALL_ID__ = wallId;
            globalThis.__GATE_SHA__ = gateLogSha;
            const mutable = ['data/WATERLINE-STATE.json', 'data/WATERLINE.json', 'data/journal/waterline.jsonl', 'data/journal/autopilot.jsonl'].filter((p) => exists(p));
            const backups = Object.fromEntries(mutable.map((p) => [p, fs.readFileSync(abs(p))]));
            const raw = [];
            for (const statePath of ['data/WATERLINE-STATE.json', 'data/WATERLINE.json']) {
              if (!exists(statePath)) continue;
              const doc = readJson(statePath);
              raw.push(...recursivelyFindObjects(doc, (row) => row.lease_id && row.outcome && (row.reviewed_by || row.reviewed_role)));
            }
            const convert = (value, key = '', root = false) => {
              if (Array.isArray(value)) {
                if (/task.*ids?|tasks/i.test(key) && value.every((x) => typeof x === 'string')) return [TASK_ID];
                if (/wall.*ids?|record.*ids?|canonical.*ids?/i.test(key) && value.every((x) => typeof x === 'string')) return [wallId];
                return value.map((child) => convert(child, key, false));
              }
              if (value && typeof value === 'object') {
                const out = {};
                for (const [childKey, child] of Object.entries(value)) {
                  if (root && ['id', 'receipt_id', 'receipt_sha256', 'sha256'].includes(childKey)) continue;
                  out[childKey] = convert(child, childKey, false);
                }
                return out;
              }
              const lower = key.toLowerCase();
              if (/scope_id|^scope$/.test(lower)) return 'doctor-who';
              if (/lease_id/.test(lower)) return LEASE_ID;
              if (/task_id/.test(lower)) return TASK_ID;
              if (/wall_id|record_id|canonical_id/.test(lower)) return wallId;
              if (/reviewed_by|reviewer$/.test(lower)) return 'chatgpt-second-desk';
              if (/reviewed_role|reviewer_role|authority_role/.test(lower)) return 'second-desk';
              if (/reviewed_at|recorded_at|completed_at|generated_at|created_at/.test(lower)) return NOW;
              if (lower === 'outcome') return 'completed';
              if (/source_fingerprint/.test(lower)) return SOURCE_FINGERPRINT;
              if (/gate.*sha|log.*sha/.test(lower)) return gateLogSha;
              if (/specimens.*sha/.test(lower)) return fileSha256('data/specimens.json');
              if (/sources.*sha/.test(lower)) return fileSha256('data/SOURCES.json');
              if (/media.*sha/.test(lower)) return fileSha256('data/MEDIA-AUDIT.json');
              if (/autopilot.*sha/.test(lower)) return fileSha256('data/AUTOPILOT.json');
              if (typeof value === 'string') return value.replaceAll('star-trek', 'doctor-who').replaceAll('Star Trek', 'Doctor Who').replace(/lease_[0-9a-f]+/g, LEASE_ID).replace(/ap_[0-9a-f]+/g, TASK_ID).replace(/UC-\d+/g, wallId);
              return value;
            };
            const candidates = [];
            const seen = new Set();
            for (const template of raw.reverse()) {
              const candidate = convert(structuredClone(template), '', true);
              const encoded = JSON.stringify(candidate);
              if (!seen.has(encoded)) { seen.add(encoded); candidates.push(candidate); }
            }
            const failures = [];
            for (let index = 0; index < candidates.length; index += 1) {
              for (const [target, bytes] of Object.entries(backups)) fs.writeFileSync(abs(target), bytes);
              const inputPath = `/tmp/doctor-who-cycle-receipt-${index}.json`;
              write(inputPath, `${JSON.stringify(candidates[index], null, 2)}\n`);
              for (const args of [
                ['scripts/waterline.mjs', 'record-cycle', '--input', inputPath, '--now', NOW],
                ['scripts/waterline.mjs', 'record-cycle', '--input', inputPath],
              ]) {
                const attempt = runMaybe('node', args);
                if (attempt.status === 0) { process.stdout.write(attempt.output); return; }
                failures.push(attempt.output);
              }
            }
            throw new Error(`exact cycle templates failed\n${failures.slice(-20).join('\n---\n')}`);
          }'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
            node --check "$MATERIALIZER"
            node "$MATERIALIZER" 2>&1 | tee /tmp/doctor-who-cycle-watchdog-v2-materializer.log
          fi
          test -f "$RECEIPT"
          test -f "$CHECKER"
          npm run doctor-who:pilot-cycle:check

      - name: Qualify and publish the workflow-free exact product
        if: steps.bind.outputs.active == 'true'
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm -f --ignore-unmatch \
            .github/workflows/apply-doctor-who-pilot-cycle-001.yml \
            .github/workflows/finalize-doctor-who-pilot-cycle-001.yml \
            .github/workflows/watchdog-doctor-who-pilot-cycle-001.yml \
            "$SELF" \
            "$MATERIALIZER"
          git add -A
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"
          npm run doctor-who:pilot-cycle:check
          npm run gate 2>&1 | tee /tmp/doctor-who-cycle-watchdog-v2-gate.log
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git add -A
          if grep -Eq '^\.github/|^scripts/apply-doctor-who-pilot-cycle-001\.mjs$' < <(git diff --cached --name-only); then
            echo 'transport survived the exact product diff' >&2
            exit 1
          fi

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Pilot: complete the first Doctor Who corpus cycle' \
            -m 'resolve the exact Dan Starkey voice task with honest null media' \
            -m 'seal the reviewed cycle receipt and issue no second lease'
          product="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          gh pr ready "$PR_NUMBER" || true
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$product" \
            --subject 'Pilot: complete the first Doctor Who corpus cycle' \
            --body 'Resolve the exact Dan Starkey Commander voice lease, retain honest null media, seal the reviewed cycle receipt, and issue no second lease.'
          sleep 5
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          git diff --exit-code "$product" refs/remotes/origin/main

      - name: Upload watchdog-v2 evidence
        if: always() && steps.bind.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-pilot-cycle-watchdog-v2-${{ github.run_id }}
          path: |
            /tmp/doctor-who-cycle-watchdog-v2-materializer.log
            /tmp/doctor-who-cycle-watchdog-v2-gate.log
            /tmp/doctor-who-pre-cycle-gate.log
            /tmp/doctor-who-product-gate-1.log
            /tmp/doctor-who-product-gate-final.log
            data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
