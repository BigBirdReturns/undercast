name: doctor-who-cycle-012-media-census-v9

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v9.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v9
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SUPERVISOR_BLOB: f5cd8698c2d782ef21df549d93680092d827e48e
      SUPERVISOR_B64_BYTES: "7284"
      SUPERVISOR_B64_SHA256: 038ac7756e17ea5c8426d3d61b8b9c109581f219d08afec1b904f968fc8cbef8
      SUPERVISOR_GZIP_BYTES: "5463"
      SUPERVISOR_GZIP_SHA256: 73abb6cec5aabc0f07bb4305c381937815c77d369007a59682410825e192a3b9
      SUPERVISOR_BYTES: "15493"
      SUPERVISOR_SHA256: f4c3b7a616e3f8ac2f03a57b797282ff5a332716685c064a5b1573ad40e5c1bf
      ROOT: /tmp/doctor-who-cycle-012-media-census-v9-supervisor
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact V9 pre-repair count correction
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SUPERVISOR_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$ROOT/supervisor.sh.gz.b64"
          test "$(wc -c < "$ROOT/supervisor.sh.gz.b64" | tr -d ' ')" = "$SUPERVISOR_B64_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz.b64" | awk '{print $1}')" = "$SUPERVISOR_B64_SHA256"
          base64 -d "$ROOT/supervisor.sh.gz.b64" > "$ROOT/supervisor.sh.gz"
          test "$(wc -c < "$ROOT/supervisor.sh.gz" | tr -d ' ')" = "$SUPERVISOR_GZIP_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz" | awk '{print $1}')" = "$SUPERVISOR_GZIP_SHA256"
          gzip -dc "$ROOT/supervisor.sh.gz" > "$ROOT/supervisor.sh"
          test "$(wc -c < "$ROOT/supervisor.sh" | tr -d ' ')" = "$SUPERVISOR_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh" | awk '{print $1}')" = "$SUPERVISOR_SHA256"
          bash -n "$ROOT/supervisor.sh"
          SUPERVISOR="$ROOT/supervisor.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['SUPERVISOR']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-media-census-v9-supervisor-{index}>','exec')
          PY
          chmod 700 "$ROOT/supervisor.sh"
          "$ROOT/supervisor.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v9-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v9/payload
            /tmp/doctor-who-cycle-012-media-census-v5-failure/payload
            /tmp/doctor-who-cycle-012-media-census-v8-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v9-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v9
            /tmp/doctor-who-cycle-012-media-census-v9-loader
            /tmp/doctor-who-cycle-012-media-census-v5-failure
            /tmp/doctor-who-cycle-012-media-census-v8-failure
            /tmp/doctor-who-cycle-012-media-census-v9-supervisor
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
