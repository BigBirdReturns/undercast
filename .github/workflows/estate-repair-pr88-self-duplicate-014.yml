name: estate-repair-pr88-self-duplicate-014

# Repairs only the post-write duplicate validator. It does not mutate product data.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-pr88-self-duplicate-014.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-pr88-self-duplicate-014
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-pr88-direct-only-014.mjs

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Make duplicate validation state-aware
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$EXECUTOR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-pr88-direct-only-014.mjs')
          text = path.read_text(encoding='utf-8')

          old_index = '''  const existingHashes = new Set();
          for (const asset of Object.values(mediaManifestDoc.value.assets || {})) if (/^[0-9a-f]{64}$/.test(asset?.sha256 || "")) existingHashes.add(asset.sha256);
          for (const absolute of await listFilesRecursively(path.join(resolvedRoot, "images"))) {
            const bytes = await readFile(absolute);
            existingHashes.add(sha256(bytes));
          }'''
          new_index = '''  const existingByHash = new Map();
          const addExisting = (hash, label) => {
            if (!/^[0-9a-f]{64}$/.test(hash || "")) return;
            const rows = existingByHash.get(hash) || [];
            rows.push(label);
            existingByHash.set(hash, rows);
          };
          for (const [src, asset] of Object.entries(mediaManifestDoc.value.assets || {})) addExisting(asset?.sha256, `manifest:${src}`);
          for (const absolute of await listFilesRecursively(path.join(resolvedRoot, "images"))) {
            const bytes = await readFile(absolute);
            const relative = path.relative(resolvedRoot, absolute).split(path.sep).join("/");
            addExisting(sha256(bytes), relative);
          }'''
          if text.count(old_index) != 1:
              raise SystemExit(f'existing-hash index expected one match, found {text.count(old_index)}')
          text = text.replace(old_index, new_index)

          old_assert = '''    assert(sha256(candidateBytes) === item.sha256, `${item.obligation_id} candidate SHA-256 drifted`);
              assert(!existingHashes.has(item.sha256), `${item.obligation_id} duplicates an existing current-branch media byte`);'''
          new_assert = '''    assert(sha256(candidateBytes) === item.sha256, `${item.obligation_id} candidate SHA-256 drifted`);'''
          if text.count(old_assert) != 1:
              raise SystemExit(f'early duplicate assertion expected one match, found {text.count(old_assert)}')
          text = text.replace(old_assert, new_assert)

          old_state = '''    const destinationExists = await exists(destination.absolute);
              let state;
              if (currentSpecimen === null && currentSource === null) {
                assert(!destinationExists, `${item.obligation_id} destination exists before adoption`);
                state = "pending";
              } else {
                assert(sameJson(currentSpecimen, intended) && sameJson(currentSource, intended), `${item.obligation_id} current binding is neither null nor the exact intended adoption`);
                assert(destinationExists, `${item.obligation_id} adopted destination is missing`);
                assert(sha256(await readFile(destination.absolute)) === item.sha256, `${item.obligation_id} adopted destination bytes drifted`);
                state = "already-adopted";
              }'''
          new_state = '''    const destinationExists = await exists(destination.absolute);
              const duplicateMatches = existingByHash.get(item.sha256) || [];
              const forbiddenMatches = duplicateMatches.filter((match) => match !== item.destination);
              assert(forbiddenMatches.length === 0, `${item.obligation_id} duplicates existing current-branch media outside its intended destination: ${forbiddenMatches.join(", ")}`);
              let state;
              if (currentSpecimen === null && currentSource === null) {
                assert(!destinationExists, `${item.obligation_id} destination exists before adoption`);
                assert(duplicateMatches.length === 0, `${item.obligation_id} candidate bytes already exist before adoption: ${duplicateMatches.join(", ")}`);
                state = "pending";
              } else {
                assert(sameJson(currentSpecimen, intended) && sameJson(currentSource, intended), `${item.obligation_id} current binding is neither null nor the exact intended adoption`);
                assert(destinationExists, `${item.obligation_id} adopted destination is missing`);
                assert(sha256(await readFile(destination.absolute)) === item.sha256, `${item.obligation_id} adopted destination bytes drifted`);
                assert(duplicateMatches.length === 1 && duplicateMatches[0] === item.destination, `${item.obligation_id} adopted hash custody is not exactly its intended destination: ${duplicateMatches.join(", ")}`);
                state = "already-adopted";
              }'''
          if text.count(old_state) != 1:
              raise SystemExit(f'state transition block expected one match, found {text.count(old_state)}')
          text = text.replace(old_state, new_state)

          path.write_text(text, encoding='utf-8')
          PY

          node --check "$EXECUTOR"
          grep -Fq 'const existingByHash = new Map();' "$EXECUTOR"
          grep -Fq 'forbiddenMatches.length === 0' "$EXECUTOR"
          grep -Fq 'duplicateMatches.length === 0' "$EXECUTOR"
          grep -Fq 'duplicateMatches.length === 1 && duplicateMatches[0] === item.destination' "$EXECUTOR"
          git diff --check -- "$EXECUTOR"

      - name: Gate executor repair
        run: npm run gate -- --skip-rendered

      - name: Publish exact repair under lease
        id: publish
        run: |
          set -euo pipefail
          test -z "$(git ls-files --others --exclude-standard)"
          PATHS="$(git diff --name-only | sort)"
          test "$PATHS" = "$EXECUTOR"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$EXECUTOR"
          git diff --cached --check
          git commit \
            -m 'Estate adoption: make PR88 duplicate validation state-aware' \
            -m 'transaction=COLLECT-014' \
            -m 'candidate_duplicate_rule=unchanged' \
            -m 'postwrite_self_destination=allowed' \
            -m 'cross_card_duplicates=forbidden' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report repair
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-014 duplicate-state repair passed the repository gate on workflow run ${GITHUB_RUN_ID}. Repair head: ${{ steps.publish.outputs.head }}. Pending candidates still require zero current matches; adopted candidates permit exactly their intended destination and reject every other match. No product data or acceptance receipt was mutated."
