name: doctor-who-cycle-012-selection-cleanup-evidence-v7

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-evidence-v7
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V1_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      V3_MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      V4_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      V5_MAIN: 108ea5f461ceb24d9253f246e7d88fc8ca8d74bb
      V6_MAIN: 9bee98eaaddfb91f71c9a9044e40292fc30cf6b1
      INSTALLED_MAIN: 820f21a613884d5a677de4fd099d49194d794198
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      WRITER_V5: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
      WRITER_V6: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml
      WRITER_V7: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml
      WRITER_V7_BLOB: cd13952b342d36c08958fa192a96f7b76347bdee
      BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v7
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v7.yml
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7
      V4_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v4
      V6_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-failure
      V6_EXPORT_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-export
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      INSTALLER_PR: "909"
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v7
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      V4_EVIDENCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-evidence-v4
      V4_EVIDENCE_HEAD: d8334a284814b1ae36d5a1f0207ff3fd6024caa6
      V4_EVIDENCE_RUN: "31411609257"
      V4_EVIDENCE_JOB: "93530760468"
      V4_EVIDENCE_ARTIFACT: "9071888609"
      V4_EVIDENCE_ARTIFACT_NAME: doctor-who-cycle-012-selection-cleanup-evidence-v4-31411609257-attempt-1
      V4_EVIDENCE_ARTIFACT_BYTES: "784771"
      V4_EVIDENCE_ARTIFACT_SHA256: 36cb13103951de5be321b39f51a73dc0e7cbba25033b1eb649e9f315bd0e9d39
      V4_EVIDENCE_IDENTITY: 452c643a3d9870d3a5b6509ec38cee52b3fb18cc73694307ecaa5774a1870004
      V6_FAILURE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-evidence-v6
      V6_FAILURE_HEAD: 46c3d256b6f8e033445da83670a95a723fe9deba
      V6_FAILURE_RUN: "31424444209"
      V6_FAILURE_JOB: "93572695132"
      V6_FAILURE_ARTIFACT: "9076617349"
      V6_FAILURE_ARTIFACT_NAME: doctor-who-cycle-012-selection-cleanup-evidence-v6-diagnostics-31424444209-attempt-1
      V6_FAILURE_ARTIFACT_BYTES: "2926969"
      V6_FAILURE_ARTIFACT_SHA256: 33667d97def34703ed221ec044718931aca19301535f0d9967d54b5701125245
      V6_EXPORT_PR: "907"
      V6_EXPORT_BRANCH: agent/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
      V6_EXPORT_WORKFLOW: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
      V6_EXPORT_HEAD: 6329d7ebd609caac0ef3ea5b9c10c89c39dd146f
      V6_EXPORT_RUN: "31449465453"
      V6_EXPORT_JOB: "93650624198"
      V6_EXPORT_ARTIFACT: "9085765566"
      V6_EXPORT_ARTIFACT_NAME: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1-diagnostics-31449465453-attempt-1
      V6_EXPORT_ARTIFACT_BYTES: "50442"
      V6_EXPORT_ARTIFACT_SHA256: 244e4ec73061218de0b79241c3bceccafee775cb4040c6178b8c163f88f37f5f
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      CARRIER_BLOBS: "2a0b9a35d6431929953fb36c77560a23c5b83186 b262ced1c1ea2ada6b33c542602561894eefa7bc a6dfca0f004813681e75f3c8a2502c45b9cc87e5 826f287056c12a2fd53f193f72a5478c8837cc80 ad916af91359d1d5149696d8a4f47a05b7dd6105"
      CARRIER_B64_BYTES: "7312"
      CARRIER_GZIP_BYTES: "5482"
      CARRIER_GZIP_SHA256: bb79008a18a75fa18270f4bf2589c7b8b05c80f20ff896e1871e97bd19bb1a5b
      CARRIER_BYTES: "19009"
      CARRIER_SHA256: ae048e6d53e81dbc79865a45ef4100eb7619321320bf8194d205946f54522721
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader

    steps:
      - name: Reconstruct and execute exact cycle 012 cleanup evidence V7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.gz.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$LOADER/carrier.sh.gz.b64"
          done
          test "$(wc -c < "$LOADER/carrier.sh.gz.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          base64 -d "$LOADER/carrier.sh.gz.b64" > "$LOADER/carrier.sh.gz"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY[123]'\n(.*?)\nPY[123]",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v7-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v4
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-failure
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-export
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
