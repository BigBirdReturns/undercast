name: doctor-who-cycle-012-selection-cleanup-evidence-v7

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-evidence-v7
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader
      CARRIER_BLOBS: "8abe8bbc342cb4c0af5c1691c24fa5e17213c196 15d07c8b9e7a267a370b2e7a25016cdf76ce0602 402cadbfb691dee8a75a9c63a8759b6821d75057 1881f20a55870f7f3fa6389c8f05479f1354a746 5124ef11469742e30392be746309eca9164d766e cc77d453026dcdbb55f8798e0ef207ab04a04b14"
      CARRIER_B64_BYTES: "8996"
      CARRIER_B64_SHA256: a364a846d8e27a4e55f0ebe7befc93657d1013904da7a04dd4aa8d5dbeb02bbb
      CARRIER_GZIP_BYTES: "6746"
      CARRIER_GZIP_SHA256: b3d153b933bd487dc14d120bdc7965a371bbbea396034fb5b8032ceedc79cfa7
      CARRIER_BYTES: "23115"
      CARRIER_SHA256: 9a8e66fc7fdbf77bfe248385301d3c373656abd6cc7cf1ecb677635c415ba7a4

    steps:
      - name: Reconstruct and execute exact self-contained cleanup evidence V7 carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.gz.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$LOADER/carrier.sh.gz.b64"
          done
          test "$(wc -c < "$LOADER/carrier.sh.gz.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$LOADER/carrier.sh.gz.b64" > "$LOADER/carrier.sh.gz"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY[123]'\n(.*?)\nPY[123]",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v7-self-contained-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v4
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-failure
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-export
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
