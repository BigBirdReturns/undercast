      V6_EXPORT_ARTIFACT_SHA256: 244e4ec73061218de0b79241c3bceccafee775cb4040c6178b8c163f88f37f5f
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      CHUNK_01_BLOB: 158fbf20b36e3a2f6947f126b80b7648a46680dc
      CHUNK_01_BYTES: "1800"
      CHUNK_01_SHA256: 5dc20f3cfde4e143651ebd3badfdfdc8e366ae1813709bc07f915a0f66ceace4
      CHUNK_02_BLOB: bd36ff5c4d9c2847849dce9b710c29ee79e14e00
      CHUNK_02_BYTES: "1800"
      CHUNK_02_SHA256: 5cb054f38412f728f7c3b7bb70a149275c094afed602f126d373bdee47fbd48a
      CHUNK_03_BLOB: cb5d20a843d2590098adb7ca5779471db83fd15a
      CHUNK_03_BYTES: "1800"
      CHUNK_03_SHA256: dac3531a33fa9bdbf862edbb625992d58c5abdfd2ee87d67da332e5f0a119e2d
      CHUNK_04_BLOB: e6e16b06fd0c5ccffc191ec9bd1f5f91147fa725
      CHUNK_04_BYTES: "154"
      CHUNK_04_SHA256: c2f3a111f6be3061447e6aaaf9fca4b05e6fd3259ab9238cb40121fd9ce9ca46
      CARRIER_GZIP_BYTES: "5554"
      CARRIER_GZIP_SHA256: 06f57f0ff8a0f1541705a0e2c7e08cc0d5f8f103bfcf1b56c2807562da038a0e
      CARRIER_BYTES: "19399"
      CARRIER_SHA256: 9f338b58976d9ebd102c1ab5067cc65bf5597ff59028495376da0cea9889da1b
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader

    steps:
      - name: Reconstruct and execute repaired cycle 012 cleanup evidence V7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.gz"
          for index in 01 02 03 04; do
            blob_var="CHUNK_${index}_BLOB"
            bytes_var="CHUNK_${index}_BYTES"
            sha_var="CHUNK_${index}_SHA256"
            blob="${!blob_var}"
            expected_bytes="${!bytes_var}"
            expected_sha="${!sha_var}"
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" > "$LOADER/chunk-$index.json"
            jq -r '.content' "$LOADER/chunk-$index.json" | tr -d '\n' | base64 -d > "$LOADER/chunk-$index.bin"
            test "$(git hash-object --stdin < "$LOADER/chunk-$index.bin")" = "$blob"
            test "$(wc -c < "$LOADER/chunk-$index.bin" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$LOADER/chunk-$index.bin" | awk '{print $1}')" = "$expected_sha"
            cat "$LOADER/chunk-$index.bin" >> "$LOADER/carrier.sh.gz"
          done
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY[123]'\n(.*?)\nPY[123]",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v7-repair3-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v4
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-failure
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-v6-export
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v7-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
