name: card-backfill-uc-051-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-051-APPLY.json"
      - "scripts/card-backfill-uc-051-apply.mjs"
      - ".github/workflows/card-backfill-uc-051-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-051-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-006'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-051-APPLY.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-051'||row.actor!=='Jeff Goldblum'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-051 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8634336171||row.render_artifact?.head_sha!=='d8a20ba4258b6ef2ae875b8c216502b07c99fbee')throw new Error('UC-051 render custody drift');
          if(row.expected?.candidate_sha256!=='a6e23837c93a0d64419cc142379a563f4fd76f9f8738c2c2be7c7a331dc4f1a6')throw new Error('UC-051 candidate authorization drift');
          if(row.expected?.crop_preview_sha256!=='c1385a01ad6b87b1bf471d1806fa132b33cb8b0a739df49a14b7a1fca9c0a5c5')throw new Error('UC-051 crop authorization drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass'||row.ruling?.canonical_mutation!==false)throw new Error('UC-051 exact-subject ruling drift');
          console.log('PASS — exact UC-051 candidate, crop and evidence-only ruling authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-051-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8634336171/zip" > "$root/render.zip"
          echo "63bc14170778eee58a532466bc0894810dea8f96bfe34d7c83fc662e41f4596c  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          test -f "$root/source/output/manifest.json"
          echo "a6e23837c93a0d64419cc142379a563f4fd76f9f8738c2c2be7c7a331dc4f1a6  $root/source/output/uc-051-still-candidate.jpg" | sha256sum -c -
          echo "c1385a01ad6b87b1bf471d1806fa132b33cb8b0a739df49a14b7a1fca9c0a5c5  $root/source/output/card-crop-preview.jpg" | sha256sum -c -
          echo "123fcfe230b3282fba8b9a5b627f7ebc92fc555d14623e2d230c4e0d8b1ec23d  $root/source/output/source-page.png" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-051-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-051-apply"
          node scripts/card-backfill-uc-051-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-051-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-051');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-051');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_22b77b3114c55e740970c581');
          if(!specimen||specimen.still)throw new Error('UC-051 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-051 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-051'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-051 audit disposition was canonically mutated');
          const preserved=fs.existsSync('images/uc-051-still.jpg');
          console.log(`PASS — UC-051 remains canonically absent; preserved historical byte present=${preserved}; only reviewed evidence was added`);
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-051.json \
            .github/CARD-BACKFILL-UC-051-RENDER.json \
            .github/CARD-BACKFILL-UC-051-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-051-discover.yml \
            .github/workflows/card-backfill-uc-051-render.yml \
            .github/workflows/card-backfill-uc-051-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-051-discover.mjs \
            scripts/card-backfill-uc-051-render.mjs \
            scripts/card-backfill-uc-051-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-051 Brundlefly still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-005...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-051/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-051-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-051-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-006
      - name: Retain materialization, evidence, gate and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-051-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-051-apply
            data/review/card-backfill/UC-051
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
