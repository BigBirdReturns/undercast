name: star-trek-kukulkan-probe-v4

on:
  pull_request:
    branches:
      - agent/star-trek-kukulkan-probe-base-v1
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-kukulkan-probe-v4
  cancel-in-progress: true

jobs:
  probe:
    name: unitkukulkan-probe-v2
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: af8c0891b38275889bc90ca76af763ce6dd9b59c
      BUILDER_SOURCE_HEAD: 4e6fd81330fcb48ae26d5733fbbbba7e9de4c580
      V4_WORKFLOW_COMMIT: 193426eb567a0843883cea9ffdac5e5c3d59b0cf
      TEMPLATE_RUN: '32307192027'
      TEMPLATE_ARTIFACT_ID: '9385129837'
      TEMPLATE_ARTIFACT_DIGEST: 62b47d4491705bfc7beb60c0c0232d5a6965afc1f09e1abb1692f185eb5f0c63
      TARGET_CHARACTER: Kukulkan
      TARGET_PERFORMER: James Doohan
      TARGET_SOURCE: https://memory-alpha.fandom.com/wiki/Kukulkan
      TARGET_SLUG: kukulkan
      TARGET_UNIT: kukulkan
      TARGET_UPPER: KUKULKAN
      RESULT_BRANCH: agent/star-trek-kukulkan-probe-result-v4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preserve live-bound probe programs
        run: |
          set -euo pipefail
          cp .github/recovery/generalize-doohan-builder-v2.py /tmp/generalize-doohan-builder-v2.py
          cp .github/recovery/patch-next-doohan-transform-v1.py /tmp/patch-next-doohan-transform-v1.py
          cp .github/recovery/kukulkan-probe-prep-v2.sh /tmp/kukulkan-probe-prep-v2.sh
          cp .github/recovery/kukulkan-probe-prep-v3.sh /tmp/kukulkan-probe-prep-v3.sh
          cp .github/recovery/kukulkan-probe-prep-v4.sh /tmp/kukulkan-probe-prep-v4.sh
          cp .github/recovery/kukulkan-probe-controller-v2.sh /tmp/kukulkan-probe-controller-v2.sh
          cp .github/recovery/kukulkan-probe-seal-v2.sh /tmp/kukulkan-probe-seal-v2.sh
          python3 -m py_compile /tmp/generalize-doohan-builder-v2.py /tmp/patch-next-doohan-transform-v1.py
          chmod +x /tmp/kukulkan-probe-prep-v2.sh /tmp/kukulkan-probe-prep-v3.sh /tmp/kukulkan-probe-prep-v4.sh /tmp/kukulkan-probe-controller-v2.sh /tmp/kukulkan-probe-seal-v2.sh

      - name: Bind live rail and freeze exact Kukulkan source and media
        run: /tmp/kukulkan-probe-prep-v4.sh

      - name: Upload exact Kukulkan source and media v4
        id: prep_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kukulkan-media-v4
          path: /tmp/kol-tai-prep-v4/
          if-no-files-found: error
          retention-days: 30

      - name: Generate prior-bound Kukulkan controller v4
        env:
          PREP_ARTIFACT_ID: ${{ steps.prep_artifact.outputs.artifact-id }}
          PREP_ARTIFACT_DIGEST: ${{ steps.prep_artifact.outputs.artifact-digest }}
          PREP_RUN: ${{ github.run_id }}
        run: /tmp/kukulkan-probe-controller-v2.sh

      - name: Upload exact Kukulkan controller source v4
        id: controller_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kukulkan-controller-source-v4
          path: /tmp/kukulkan-controller-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Seal non-mutating Kukulkan probe v4
        env:
          PREP_ARTIFACT_ID: ${{ steps.prep_artifact.outputs.artifact-id }}
          PREP_ARTIFACT_DIGEST: ${{ steps.prep_artifact.outputs.artifact-digest }}
          CONTROLLER_ARTIFACT_ID: ${{ steps.controller_artifact.outputs.artifact-id }}
          CONTROLLER_ARTIFACT_DIGEST: ${{ steps.controller_artifact.outputs.artifact-digest }}
        run: /tmp/kukulkan-probe-seal-v2.sh

      - name: Upload sealed Kukulkan probe v4
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kukulkan-probe-v4
          path: /tmp/kukulkan-probe-receipt-v2/
          if-no-files-found: error
          retention-days: 30
