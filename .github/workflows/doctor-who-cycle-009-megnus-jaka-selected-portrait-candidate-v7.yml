name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: a3e2c80f4c8826de253e8b10be8a73507b27395e
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v7
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7
      RECOVERY_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v7
      CONTROL: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v7
      SOURCE_COMMIT: f46148d4bf6028da77227f1db94d5f83d79de778
      SOURCE_BLOB: ebe02eebb17e542438f0fd636aa14b3073870d1c
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v6.yml
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path successor and immutable V6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL" "$OUT" "$RECOVERY_ROOT"
          mkdir -p "$CONTROL"/{api,receipt}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$CONTROL/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$CONTROL/api/files.json"
          ROOT="$CONTROL" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY

          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$CONTROL/api/source-content.json"
          test "$(jq -r .sha "$CONTROL/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$CONTROL/api/source-blob.json"
          jq -r .content "$CONTROL/api/source-blob.json" | tr -d '\n' | base64 -d > "$CONTROL/source-v6.yml"
          test "$(git hash-object "$CONTROL/source-v6.yml")" = "$SOURCE_BLOB"

          ruby -ryaml -rjson - "$CONTROL/source-v6.yml" "$CONTROL/source-env.json" "$CONTROL/recovered-run.sh" <<'RB'
          source, env_out, run_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.fetch('env')
          steps = doc.dig('jobs', 'materialize', 'steps')
          step = steps.find { |row| row['name'] == 'Recover V5 proof, stage exact candidate delta, and execute' }
          raise 'exact V6 execution step not found' unless step && step['run'].is_a?(String)
          File.write(env_out, JSON.generate(env))
          File.write(run_out, step['run'])
          RB
          bash -n "$CONTROL/recovered-run.sh"
          test "$(grep -Fc 'exec "$script"' "$CONTROL/recovered-run.sh")" = 1

          ROOT="$CONTROL" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          env=json.loads((root/'source-env.json').read_text())
          excluded={'EXACT_MAIN','BRANCH','SELF','OUT','RECOVERY_ROOT'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          sha256sum "$CONTROL/source-v6.yml" "$CONTROL/recovered-run.sh" > "$CONTROL/receipt/source-sha256.txt"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Execute exact V6 candidate transaction over composability-v3 main
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          chmod 700 "$CONTROL/recovered-run.sh"
          exec "$CONTROL/recovered-run.sh"

      - name: Upload exact selected-portrait candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v7
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v7
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
