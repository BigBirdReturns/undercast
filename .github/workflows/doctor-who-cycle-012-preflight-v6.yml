name: doctor-who-cycle-012-preflight-v6

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v6.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v6
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v6
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v6.yml
      OUT: /tmp/doctor-who-cycle-012-preflight-v6
      PROOF_PACKET: /tmp/doctor-who-cycle-012-preflight-v6-proof
      PROOF_PR: "856"
      PROOF_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4
      PROOF_HEAD: f47f0845de78496f20f3ce4446921ce1d9637afd
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v4-31360254095-attempt-1
      PROOF_ARTIFACT_SHA256: 3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1","agent/doctor-who-cycle-012-preflight-v4","agent/doctor-who-cycle-012-preflight-v5"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"},{"pr":857,"branch":"agent/doctor-who-cycle-012-preflight-v4"},{"pr":858,"branch":"agent/doctor-who-cycle-012-preflight-v5"}]'
      PRIOR_SELECTOR_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PRIOR_SELECTOR_PATH: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      PRIOR_SELECTOR_BLOB: 49e902869ea04409d40690dff73e7ad10f8cc5c1
      ACTIVE_PROFILE: text-vision

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind one-commit current-main selector and disjoint cleanup ancestry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PROOF_PACKET"
          mkdir -p "$OUT"/{api,receipt,logs,source,payload} "$PROOF_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(git merge-base "$CLEANUP_MAIN" "$MAIN")" = "$CLEANUP_MAIN"
          test "$(git rev-list --count "$CLEANUP_MAIN".."$MAIN")" = 1
          test "$(git show -s --format=%T "$CLEANUP_MAIN")" = "$PRODUCT_TREE"
          git diff --name-status "$CLEANUP_MAIN" "$MAIN" | LC_ALL=C sort > "$OUT/logs/cleanup-to-current.tsv"
          printf 'M\tdata/MEDIA-SEARCH-LATEST.json\nM\tdata/journal/media-search.jsonl\n' | LC_ALL=C sort > "$OUT/logs/expected-cleanup-to-current.tsv"
          cmp "$OUT/logs/cleanup-to-current.tsv" "$OUT/logs/expected-cleanup-to-current.tsv"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > "$OUT/api/proof-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN/jobs?per_page=100" > "$OUT/api/proof-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" > "$OUT/api/proof-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT/zip" > "$OUT/proof.zip"
          test "$(sha256sum "$OUT/proof.zip" | awk '{print $1}')" = "$PROOF_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/proof-artifact.json")" = "sha256:$PROOF_ARTIFACT_SHA256"

          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          api = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((api / name).read_text())
          carrier = load('carrier-pr.json')
          proof_pr = load('proof-pr.json')
          proof_run = load('proof-run.json')
          proof_jobs = load('proof-jobs.json')['jobs']
          proof_artifact = load('proof-artifact.json')
          assert carrier['number'] == int(os.environ['CARRIER_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CARRIER_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert proof_pr['number'] == int(os.environ['PROOF_PR'])
          assert proof_pr['state'] == 'open' and proof_pr['draft'] is True and proof_pr['merged_at'] is None
          assert proof_pr['head']['ref'] == os.environ['PROOF_BRANCH'] and proof_pr['head']['sha'] == os.environ['PROOF_HEAD']
          assert proof_run['id'] == int(os.environ['PROOF_RUN'])
          assert proof_run['head_sha'] == os.environ['PROOF_HEAD'] and proof_run['head_branch'] == os.environ['PROOF_BRANCH']
          assert proof_run['event'] == 'pull_request' and proof_run['status'] == 'completed' and proof_run['conclusion'] == 'success'
          rows = [row for row in proof_jobs if row['id'] == int(os.environ['PROOF_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'prove' and rows[0]['conclusion'] == 'success'
          assert proof_artifact['id'] == int(os.environ['PROOF_ARTIFACT'])
          assert proof_artifact['name'] == os.environ['PROOF_ARTIFACT_NAME']
          assert proof_artifact['digest'] == 'sha256:' + os.environ['PROOF_ARTIFACT_SHA256'] and proof_artifact['expired'] is False
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Authenticate terminal proof and freeze live transport custody
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/proof.zip" TARGET="$PROOF_PACKET" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = Path(os.environ['TARGET'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          pre = target / 'SHA256SUMS.pre'
          sealed = target / 'SHA256SUMS'
          assert pre.is_file() and sealed.is_file()
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = target / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest
          rows = []
          for path in target.rglob('terminal-proof.json'):
              data = json.loads(path.read_text())
              if data.get('status') == 'cycle-011-rastel-terminal-cleanup-independently-proved-v1':
                  rows.append((path, data))
          assert len(rows) == 1
          _, proof = rows[0]
          identity = proof.pop('identity')
          assert identity == os.environ['PROOF_IDENTITY']
          assert sha(json.dumps(proof, sort_keys=True, separators=(',', ':')).encode()) == identity
          proof['identity'] = identity
          assert proof['canonical']['main'] == os.environ['CLEANUP_MAIN']
          assert proof['canonical']['tree'] == os.environ['PRODUCT_TREE']
          assert proof['canonical']['product_file_delta'] == 0
          assert proof['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert proof['media'] == {'complete': 22, 'total': 22, 'debt': 0}
          assert all(proof['gates'].values())
          assert proof['authority']['cycle_012_selection_authorized'] is True
          assert proof['authority']['cycle_012_lease_issued'] is False
          markers = list(target.rglob('TERMINAL_PROOF_COMPLETE'))
          assert len(markers) == 1 and markers[0].read_text().strip() == identity
          root = Path(os.environ['OUT'])
          (root / 'receipt/terminal-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          PY

          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/cycle12-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PROOF_BRANCH" > "$OUT/api/proof-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$SUPERSEDED_OBSERVER_BRANCH" > "$OUT/api/superseded-observer-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr-live.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SUPERSEDED_OBSERVER_PR" > "$OUT/api/superseded-observer-pr.json"
          for number in 793 794 795 796 797 798 857 858; do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/stale-pr-$number.json"
          done

          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          stale = json.loads(os.environ['STALE_BRANCHES_JSON'])
          expected_prs = json.loads(os.environ['STALE_PRS_JSON'])
          raw_refs = json.loads((api / 'cycle12-refs.json').read_text())
          refs = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in raw_refs]
          observed = {row['branch'] for row in refs}
          expected = set(stale) | {os.environ['BRANCH']}
          assert observed == expected, {'extra': sorted(observed - expected), 'missing': sorted(expected - observed)}
          by_branch = {row['branch']: row['head'] for row in refs}
          stale_refs = [{'branch': branch, 'head': by_branch[branch], 'kind': 'stale-cycle-012'} for branch in sorted(stale)]
          stale_prs = []
          mapped = {row['branch']: row['pr'] for row in expected_prs}
          for branch, number in mapped.items():
              pr = json.loads((api / f'stale-pr-{number}.json').read_text())
              assert pr['number'] == number
              assert pr['head']['ref'] == branch and pr['head']['sha'] == by_branch[branch]
              assert pr['merged_at'] is None and pr['draft'] is True
              assert pr['state'] in {'open', 'closed'}
              stale_prs.append({'pr': number, 'branch': branch, 'head': by_branch[branch], 'action': 'close_without_merge' if pr['state'] == 'open' else 'none'})
          for branch in sorted(set(stale) - set(mapped)):
              rows = json.loads(subprocess.check_output([
                  'gh', 'api', '--method', 'GET', f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls",
                  '-f', 'state=all', '-f', f"head={os.environ['GITHUB_REPOSITORY_OWNER']}:{branch}", '-f', 'per_page=100'
              ], text=True))
              assert rows == [], (branch, [(row['number'], row['state']) for row in rows])
          proof_ref = json.loads((api / 'proof-ref.json').read_text())
          superseded_ref = json.loads((api / 'superseded-observer-ref.json').read_text())
          proof_pr = json.loads((api / 'proof-pr-live.json').read_text())
          superseded_pr = json.loads((api / 'superseded-observer-pr.json').read_text())
          assert proof_ref['object']['sha'] == os.environ['PROOF_HEAD']
          superseded_head = superseded_ref['object']['sha']
          assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] == 'open' and proof_pr['merged_at'] is None
          assert proof_pr['head']['ref'] == os.environ['PROOF_BRANCH'] and proof_pr['head']['sha'] == os.environ['PROOF_HEAD']
          assert superseded_pr['number'] == int(os.environ['SUPERSEDED_OBSERVER_PR'])
          assert superseded_pr['state'] == 'closed' and superseded_pr['merged_at'] is None
          assert superseded_pr['head']['ref'] == os.environ['SUPERSEDED_OBSERVER_BRANCH'] and superseded_pr['head']['sha'] == superseded_head
          observer_refs = [
              {'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'kind': 'consumed-terminal-proof'},
              {'branch': os.environ['SUPERSEDED_OBSERVER_BRANCH'], 'head': superseded_head, 'kind': 'superseded-terminal-proof'},
          ]
          observer_prs = [
              {'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'action': 'close_without_merge'},
              {'pr': int(os.environ['SUPERSEDED_OBSERVER_PR']), 'branch': os.environ['SUPERSEDED_OBSERVER_BRANCH'], 'head': superseded_head, 'action': 'none'},
          ]
          custody = {
              'status': 'cycle-012-preselection-transport-custody-frozen-v3',
              'version': 3,
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'canonical_main': os.environ['MAIN'],
              'canonical_advance': {'commits': 1, 'paths': ['data/MEDIA-SEARCH-LATEST.json', 'data/journal/media-search.jsonl']},
              'selector': {'branch': os.environ['BRANCH'], 'head': os.environ['CARRIER_HEAD'], 'pr': int(os.environ['CARRIER_PR'])},
              'proof': {'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'run': int(os.environ['PROOF_RUN']), 'job': int(os.environ['PROOF_JOB']), 'artifact': int(os.environ['PROOF_ARTIFACT']), 'artifact_sha256': os.environ['PROOF_ARTIFACT_SHA256'], 'identity': os.environ['PROOF_IDENTITY']},
              'refs_to_delete': stale_refs + observer_refs,
              'pull_requests': sorted(stale_prs + observer_prs, key=lambda row: row['pr']),
              'counts': {'stale_cycle12_refs': len(stale_refs), 'observer_refs': len(observer_refs), 'refs_to_delete': len(stale_refs) + len(observer_refs), 'pull_requests': len(stale_prs) + len(observer_prs)},
              'boundary': {'selection_required_before_write': True, 'exact_heads_frozen': True, 'force_update': False, 'merge': False, 'main_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False},
          }
          assert custody['counts'] == {'stale_cycle12_refs': 10, 'observer_refs': 2, 'refs_to_delete': 12, 'pull_requests': 10}
          custody['identity'] = hashlib.sha256(json.dumps(custody, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/transport-custody.json').write_text(json.dumps(custody, indent=2, sort_keys=True) + '\n')
          PY

      - name: Rerun current-main queue, media, waterline, and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Recover and execute exact repository-native selector
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/contents/$PRIOR_SELECTOR_PATH?ref=$PRIOR_SELECTOR_HEAD" > "$OUT/api/prior-selector-source.json"
          test "$(jq -r '.sha' "$OUT/api/prior-selector-source.json")" = "$PRIOR_SELECTOR_BLOB"
          jq -r '.content' "$OUT/api/prior-selector-source.json" | tr -d '\n' | base64 -d > "$OUT/source/prior-selector.yml"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['OUT'])
          text = (root / 'source/prior-selector.yml').read_text()
          lines = text.splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if re.match(r'^\s+run:\s*\|\s*$', lines[index]):
                  indent = len(lines[index]) - len(lines[index].lstrip())
                  index += 1
                  body = []
                  while index < len(lines):
                      current = lines[index]
                      current_indent = len(current) - len(current.lstrip())
                      if current.strip() and current_indent <= indent:
                          break
                      body.append(current[indent + 2:] if len(current) >= indent + 2 else '')
                      index += 1
                  blocks.append('\n'.join(body))
                  continue
              index += 1
          candidates = []
          for block in blocks:
              logical = []
              pending = ''
              for raw in block.splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  pending = (pending + ' ' + line).strip()
                  if pending.endswith('\\'):
                      pending = pending[:-1].strip()
                      continue
                  logical.append(pending)
                  pending = ''
              if pending:
                  logical.append(pending)
              for line in logical:
                  lower = line.lower()
                  if 'scripts/autopilot.mjs' not in line:
                      continue
                  if 'candidate' not in lower and ' next ' not in ' ' + lower + ' ':
                      continue
                  if any(token in lower for token in (' claim ', ' submit ', ' --write', ' record-cycle')):
                      continue
                  command = re.split(r'\s+(?:>|\|\s*tee\b)', line, maxsplit=1)[0].strip()
                  if '--scope' in command and 'doctor-who' in command:
                      candidates.append(command)
          candidates = list(dict.fromkeys(candidates))
          assert len(candidates) == 1, candidates
          command = candidates[0]
          assert os.environ['ACTIVE_PROFILE'] in command and '--json' in command
          (root / 'source/selector-command.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + command + '\n')
          receipt = {'status': 'cycle-012-selector-command-recovered-v1', 'version': 1, 'source': {'commit': os.environ['PRIOR_SELECTOR_HEAD'], 'path': os.environ['PRIOR_SELECTOR_PATH'], 'git_blob': os.environ['PRIOR_SELECTOR_BLOB'], 'bytes': len(text.encode()), 'sha256': hashlib.sha256(text.encode()).hexdigest()}, 'command': command, 'active_profile': os.environ['ACTIVE_PROFILE'], 'run_blocks': len(blocks)}
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/selector-command.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          chmod 700 "$OUT/source/selector-command.sh"
          bash "$OUT/source/selector-command.sh" > "$OUT/payload/candidates.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          data = json.loads((root / 'payload/candidates.json').read_text())
          selected = None
          if isinstance(data, list) and data:
              selected = data[0]
          elif isinstance(data, dict):
              for key in ('selected_task', 'selected', 'candidate', 'next'):
                  if isinstance(data.get(key), dict):
                      selected = data[key]
                      break
              if selected is None:
                  for key in ('candidates', 'tasks', 'items', 'results'):
                      if isinstance(data.get(key), list) and data[key]:
                          selected = data[key][0]
                          break
          assert isinstance(selected, dict), (type(data).__name__, data if isinstance(data, dict) else len(data))
          def first(*keys):
              for key in keys:
                  value = selected.get(key)
                  if value not in (None, ''):
                      return value
          task_id = first('id', 'task_id', 'taskId')
          if not (isinstance(task_id, str) and task_id.startswith('ap_')):
              task = selected.get('task') if isinstance(selected.get('task'), dict) else {}
              task_id = task.get('id') or task.get('task_id')
          assert isinstance(task_id, str) and task_id.startswith('ap_'), selected
          state = first('status', 'state', 'current_status')
          if state is not None:
              assert state == 'queued', state
          performer = first('performer', 'actor', 'performer_name')
          role = first('role', 'character', 'character_name')
          mode = first('mode', 'performance_mode')
          proof = json.loads((root / 'receipt/terminal-proof.json').read_text())
          transport = json.loads((root / 'receipt/transport-custody.json').read_text())
          command = json.loads((root / 'receipt/selector-command.json').read_text())
          autopilot = json.loads((root / 'receipt/autopilot-status.json').read_text())
          waterline = json.loads((root / 'receipt/waterline-status.json').read_text())
          receipt = {
              'status': 'cycle-012-doctor-who-selector-qualified-v3',
              'version': 3,
              'carrier': {'pr': int(os.environ['CARRIER_PR']), 'head': os.environ['CARRIER_HEAD'], 'base': os.environ['MAIN'], 'branch': os.environ['BRANCH']},
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'canonical_main': os.environ['MAIN'],
              'terminal_proof': {'pr': int(os.environ['PROOF_PR']), 'head': os.environ['PROOF_HEAD'], 'run': int(os.environ['PROOF_RUN']), 'job': int(os.environ['PROOF_JOB']), 'artifact': int(os.environ['PROOF_ARTIFACT']), 'artifact_sha256': os.environ['PROOF_ARTIFACT_SHA256'], 'identity': proof['identity']},
              'transport_custody': {'identity': transport['identity'], 'refs_to_delete': transport['counts']['refs_to_delete'], 'pull_requests': transport['counts']['pull_requests']},
              'command': {'identity': command['identity'], 'text': command['command'], 'source': command['source'], 'active_profile': command['active_profile']},
              'queue': {'total': autopilot['total'], 'queued': autopilot['statuses']['queued'], 'resolved': autopilot['statuses']['resolved'], 'in_flight': autopilot['in_flight']},
              'waterline': waterline,
              'selected_task_id': task_id,
              'selected_task': selected,
              'normalized': {'performer': performer, 'role': role, 'mode': mode},
              'boundary': {'selection_only': True, 'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False, 'transport_mutation': False, 'wall_created': False, 'media_adopted': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (root / 'payload/selection.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'payload/transport-custody.json').write_text(json.dumps(transport, indent=2, sort_keys=True) + '\n')
          PY
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v6-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v6/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v6-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v6
            /tmp/doctor-who-cycle-012-preflight-v6-proof
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
