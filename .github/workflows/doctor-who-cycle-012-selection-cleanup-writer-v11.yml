name: doctor-who-cycle-012-selection-cleanup-writer-v11

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v11
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v11
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v11-
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_MESSAGE: Doctor Who cycle 012 current-main transport cleanup V11
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      OUTSIDE_PREFIX: observer/cycle012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

    steps:
      - name: Authenticate evidence and execute exact current-main cleanup V11
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,evidence,mutation,payload}

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_CONTEXT" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_CONTEXT/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_CONTEXT/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"

          SOURCE_RUN="$OUT/api/source-run.json" SOURCE_JOBS="$OUT/api/source-jobs.json" SOURCE_ARTIFACTS="$OUT/api/source-artifacts.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path(os.environ['SOURCE_RUN']).read_text())
          jobs=json.loads(Path(os.environ['SOURCE_JOBS']).read_text())['jobs']
          artifacts=json.loads(Path(os.environ['SOURCE_ARTIFACTS']).read_text())['artifacts']
          assert run['id']==int(os.environ['SOURCE_RUN_CONTEXT'])
          assert run['event']=='pull_request'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['name']==os.environ['SOURCE_WORKFLOW']
          assert run['head_branch']==os.environ['SOURCE_BRANCH']
          assert run['head_sha']==os.environ['SOURCE_HEAD_CONTEXT']
          assert run['run_attempt']==int(os.environ['SOURCE_ATTEMPT_CONTEXT'])
          retain=[job for job in jobs if job['name']=='retain']
          assert len(retain)==1 and retain[0]['status']=='completed' and retain[0]['conclusion']=='success'
          expected=f"{os.environ['ARTIFACT_PREFIX']}{run['id']}-attempt-{run['run_attempt']}"
          matched=[a for a in artifacts if a['name']==expected and a['expired'] is False]
          assert len(matched)==1
          Path(os.environ['OUT'],'api','source-artifact-id.txt').write_text(str(matched[0]['id'])+'\n')
          PY

          artifact_id="$(cat "$OUT/api/source-artifact-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/api/evidence.zip"
          artifact_digest="$(jq -r '.digest' "$OUT/api/source-artifact.json")"
          test "$artifact_digest" != null
          test "sha256:$(sha256sum "$OUT/api/evidence.zip" | awk '{print $1}')" = "$artifact_digest"

          ZIP="$OUT/api/evidence.zip" DEST="$OUT/evidence" python3 - <<'PY'
          import os, stat, zipfile
          from pathlib import Path, PurePosixPath
          source=Path(os.environ['ZIP'])
          dest=Path(os.environ['DEST'])
          with zipfile.ZipFile(source) as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({i.filename for i in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  target=dest.joinpath(*path.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(info))
          PY

          (
            cd "$OUT/evidence"
            sha256sum -c SHA256SUMS.pre
            sha256sum -c SHA256SUMS
            test "$(cat EVIDENCE_COMPLETE)" = "$(jq -r '.identity' evidence.json)"
          )

          EVIDENCE="$OUT/evidence/evidence.json" ARTIFACT="$OUT/api/source-artifact.json" python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          identity=evidence.pop('identity')
          assert re.fullmatch(r'[0-9a-f]{64}',identity)
          assert hashlib.sha256(json.dumps(evidence,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          evidence['identity']=identity
          assert evidence['status']=='cycle-012-current-main-cleanup-evidence-v11'
          assert evidence['version']==11
          expected_paths=[
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml',
            '.github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v11.yml',
          ]
          assert evidence['canonical']['writer_path']==os.environ['WRITER_PATH']
          assert evidence['canonical']['cleanup_paths']==expected_paths
          assert evidence['canonical']['preserved_paths']==[
              'data/MEDIA-SEARCH-LATEST.json',
              'data/journal/media-search.jsonl',
          ]
          assert evidence['retained']=={
            'task':'ap_8965086737382df0e88366db',
            'performer':'Dan Starkey',
            'role':'Senstarg',
            'mode':'physical-prosthetic',
            'kind':'face',
            'wall':'UC-1357',
            'selection_identity':'d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a',
            'source_evidence_identity':'ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f',
            'source_receipt_identity':'1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a',
            'media_review_identity':'eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587',
            'modality_identity':'ef754232b56a25f9f703cbaaaa03290f1cb9a3d97c354d00a58e21e75f732e50',
          }
          assert evidence['boundary']=={
            'cleanup_authority':True,
            'repository_write_here':False,
            'canonical_mutation_here':False,
            'force_update':False,
            'merge':False,
            'lease_issued':False,
            'queue_mutated':False,
            'wall_created':False,
            'media_adopted':False,
            'cycle_receipt_written':False,
            'cycle_012_product_authority':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          refs=evidence['refs']
          assert refs and len(refs)==len({row['branch'] for row in refs})
          assert any(row['branch']==os.environ['SOURCE_BRANCH'] and row['action']=='close_without_merge_and_delete_ref' for row in refs)
          artifact=json.loads(Path(os.environ['ARTIFACT']).read_text())
          assert artifact['digest'].startswith('sha256:') and artifact['expired'] is False
          PY

          main="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main" = "$(jq -r '.canonical.main' "$OUT/evidence/evidence.json")"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$main" > "$OUT/api/main-commit-preflight.json"
          test "$(jq -r '.tree.sha' "$OUT/api/main-commit-preflight.json")" = "$(jq -r '.canonical.tree' "$OUT/evidence/evidence.json")"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$WRITER_PATH?ref=$main" > "$OUT/api/writer-content-preflight.json"
          test "$(jq -r '.sha' "$OUT/api/writer-content-preflight.json")" = "$(jq -r '.canonical.writer_blob' "$OUT/evidence/evidence.json")"

          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "outside:$OUTSIDE_PREFIX" "terminal:$TERMINAL_PREFIX"; do
            label="${spec%%:*}"
            prefix="${spec#*:}"
            gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" > "$OUT/api/live-$label-refs.json" || printf '[]\n' > "$OUT/api/live-$label-refs.json"
          done

          EVIDENCE="$OUT/evidence/evidence.json" API_ROOT="$OUT/api" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          root=Path(os.environ['API_ROOT'])
          live=[]
          for label in ('agent','observer','outside','terminal'):
              rows=json.loads((root/f'live-{label}-refs.json').read_text())
              for row in rows:
                  live.append({'branch':row['ref'].removeprefix('refs/heads/'),'head':row['object']['sha'],'kind':label})
          live.sort(key=lambda row:row['branch'])
          expected=sorted(({'branch':row['branch'],'head':row['head'],'kind':row['kind']} for row in evidence['refs']),key=lambda row:row['branch'])
          assert live==expected
          repo=os.environ['GITHUB_REPOSITORY']
          for index,row in enumerate(evidence['refs'],1):
              ref=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/git/ref/heads/{row["branch"]}'],text=True))
              assert ref['object']['sha']==row['head']
              pr=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/pulls/{row["pr"]}'],text=True))
              assert pr['head']['ref']==row['branch'] and pr['head']['sha']==row['head']
              assert pr['state']==row['pr_state'] and pr['merged'] is row['pr_merged'] and pr['draft'] is row['pr_draft']
              if row['action']=='close_without_merge_and_delete_ref':
                  assert pr['state']=='open' and pr['merged'] is False and pr['draft'] is True
              elif row['action']=='delete_ref_only':
                  assert pr['state']=='closed'
              else:
                  raise AssertionError(row)
              (root/f'frozen-ref-{index:03d}.json').write_text(json.dumps(ref,indent=2,sort_keys=True)+'\n')
              (root/f'frozen-pr-{index:03d}.json').write_text(json.dumps(pr,indent=2,sort_keys=True)+'\n')
          PY

          EVIDENCE="$OUT/evidence/evidence.json" OUT_DIR="$OUT/mutation" python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          entries=[{'path':path,'mode':'100644','type':'blob','sha':None} for path in evidence['canonical']['cleanup_paths']]
          Path(os.environ['OUT_DIR'],'tree-input.json').write_text(json.dumps({'base_tree':evidence['canonical']['tree'],'tree':entries},sort_keys=True)+'\n')
          PY
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input "$OUT/mutation/tree-input.json" > "$OUT/mutation/tree.json"

          SOURCE_RUN="$OUT/api/source-run.json" EVIDENCE="$OUT/evidence/evidence.json" TREE="$OUT/mutation/tree.json" OUT_DIR="$OUT/mutation" python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path(os.environ['SOURCE_RUN']).read_text())
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          tree=json.loads(Path(os.environ['TREE']).read_text())
          stamp=run['updated_at']
          person={'name':os.environ['CLEANUP_NAME'],'email':os.environ['CLEANUP_EMAIL'],'date':stamp}
          payload={'message':os.environ['CLEANUP_MESSAGE'],'tree':tree['sha'],'parents':[evidence['canonical']['main']],'author':person,'committer':person}
          Path(os.environ['OUT_DIR'],'commit-input.json').write_text(json.dumps(payload,sort_keys=True)+'\n')
          PY
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input "$OUT/mutation/commit-input.json" > "$OUT/mutation/commit.json"
          cleanup_commit="$(jq -r '.sha' "$OUT/mutation/commit.json")"

          gh api "/repos/$GITHUB_REPOSITORY/compare/$main...$cleanup_commit" > "$OUT/mutation/current-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$BASE_PRODUCT...$cleanup_commit" > "$OUT/mutation/product-compare.json"
          EVIDENCE="$OUT/evidence/evidence.json" CURRENT_COMPARE="$OUT/mutation/current-compare.json" PRODUCT_COMPARE="$OUT/mutation/product-compare.json" COMMIT="$OUT/mutation/commit.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          current=json.loads(Path(os.environ['CURRENT_COMPARE']).read_text())
          product=json.loads(Path(os.environ['PRODUCT_COMPARE']).read_text())
          commit=json.loads(Path(os.environ['COMMIT']).read_text())
          assert [row['sha'] for row in commit['parents']]==[evidence['canonical']['main']]
          assert current['status']=='ahead' and current['ahead_by']==1 and current['behind_by']==0 and current['total_commits']==1
          assert sorted((f['filename'],f['status']) for f in current['files'])==sorted((path,'removed') for path in evidence['canonical']['cleanup_paths'])
          assert sorted(f['filename'] for f in product['files'])==evidence['canonical']['preserved_paths']
          assert all(f['status']=='modified' for f in product['files'])
          PY

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$main"
          printf '{"sha":"%s","force":false}\n' "$cleanup_commit" > "$OUT/mutation/main-update.json"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input "$OUT/mutation/main-update.json" > "$OUT/mutation/main-update-result.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$cleanup_commit"

          EVIDENCE="$OUT/evidence/evidence.json" OUT_DIR="$OUT/mutation" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          root=Path(os.environ['OUT_DIR'])
          repo=os.environ['GITHUB_REPOSITORY']
          actions=[]
          for row in evidence['refs']:
              ref=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/git/ref/heads/{row["branch"]}'],text=True))
              assert ref['object']['sha']==row['head']
              pr=json.loads(subprocess.check_output(['gh','api',f'/repos/{repo}/pulls/{row["pr"]}'],text=True))
              assert pr['head']['ref']==row['branch'] and pr['head']['sha']==row['head']
              if row['action']=='close_without_merge_and_delete_ref':
                  assert pr['state']=='open' and pr['merged'] is False
                  subprocess.run(['gh','api','--method','PATCH',f'/repos/{repo}/pulls/{row["pr"]}','--input','-'],input=json.dumps({'state':'closed'}),text=True,check=True,capture_output=True)
              else:
                  assert row['action']=='delete_ref_only' and pr['state']=='closed'
              subprocess.run(['gh','api','--method','DELETE',f'/repos/{repo}/git/refs/heads/{row["branch"]}'],check=True,capture_output=True,text=True)
              actions.append({'branch':row['branch'],'head':row['head'],'pr':row['pr'],'action':row['action']})
          (root/'transport-actions.json').write_text(json.dumps(actions,indent=2,sort_keys=True)+'\n')
          PY

          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "outside:$OUTSIDE_PREFIX" "terminal:$TERMINAL_PREFIX"; do
            label="${spec%%:*}"
            prefix="${spec#*:}"
            gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" > "$OUT/mutation/terminal-$label-refs.json" || printf '[]\n' > "$OUT/mutation/terminal-$label-refs.json"
            test "$(jq 'length' "$OUT/mutation/terminal-$label-refs.json")" = 0
          done

          EVIDENCE="$OUT/evidence/evidence.json" SOURCE_RUN="$OUT/api/source-run.json" SOURCE_ARTIFACT="$OUT/api/source-artifact.json" COMMIT="$OUT/mutation/commit.json" CURRENT_COMPARE="$OUT/mutation/current-compare.json" PRODUCT_COMPARE="$OUT/mutation/product-compare.json" ACTIONS="$OUT/mutation/transport-actions.json" OUT_DIR="$OUT/payload" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          run=json.loads(Path(os.environ['SOURCE_RUN']).read_text())
          artifact=json.loads(Path(os.environ['SOURCE_ARTIFACT']).read_text())
          commit=json.loads(Path(os.environ['COMMIT']).read_text())
          current=json.loads(Path(os.environ['CURRENT_COMPARE']).read_text())
          product=json.loads(Path(os.environ['PRODUCT_COMPARE']).read_text())
          actions=json.loads(Path(os.environ['ACTIONS']).read_text())
          receipt={
              'status':'cycle-012-current-main-cleanup-complete-v11','version':11,
              'source':{'workflow':run['name'],'run':run['id'],'head':run['head_sha'],'attempt':run['run_attempt'],'artifact':artifact['id'],'artifact_sha256':artifact['digest'].removeprefix('sha256:'),'evidence_identity':evidence['identity']},
              'canonical':{'parent':evidence['canonical']['main'],'parent_tree':evidence['canonical']['tree'],'commit':commit['sha'],'tree':commit['tree']['sha'],'removed_paths':evidence['canonical']['cleanup_paths'],'preserved_paths':evidence['canonical']['preserved_paths'],'ordinary_child':True,'force_update':False,'current_compare_status':current['status'],'product_compare_status':product['status']},
              'transport':{'actions':actions,'remaining_refs':{'agent':0,'observer':0,'outside':0,'terminal':0}},
              'retained':evidence['retained'],
              'boundary':{'cleanup_complete':True,'lease_issued':False,'queue_mutated':False,'wall_created':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out=Path(os.environ['OUT_DIR'])
          out.mkdir(parents=True,exist_ok=True)
          (out/'cleanup.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'CLEANUP_COMPLETE').write_text(receipt['identity']+'\n')
          (out/'current-compare.json').write_text(json.dumps(current,indent=2,sort_keys=True)+'\n')
          (out/'product-compare.json').write_text(json.dumps(product,indent=2,sort_keys=True)+'\n')
          (out/'transport-actions.json').write_text(json.dumps(actions,indent=2,sort_keys=True)+'\n')
          PY

          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
            sha256sum -c SHA256SUMS
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v11/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v11-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v11
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
