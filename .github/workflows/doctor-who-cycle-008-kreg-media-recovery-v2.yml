name: doctor-who-cycle-008-kreg-media-recovery-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery-v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v2.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v2
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery-v2
  PREFLIGHT_RUN: "31088359558"
  PREFLIGHT_JOB: "92573114327"
  PREFLIGHT_HEAD: e44f5578c31bccd9e9271af12d16171f592870ad
  PREFLIGHT_ARTIFACT_ID: "8962423257"
  PREFLIGHT_ARTIFACT: doctor-who-cycle-008-preflight-v3-31088359558
  PREFLIGHT_ARTIFACT_SHA256: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
  FAILED_RUN: "31089142456"
  FAILED_JOB: "92575646615"
  FAILED_HEAD: f11d284d714f394ecbb04ca5b80c6b2250e468f9
  FAILED_ARTIFACT_ID: "8962669958"
  FAILED_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-31089142456
  FAILED_ARTIFACT_SHA256: 2ec85663d82a667b1029acf381cd25645461d89491afa4aa275aeae79a9acc17
  FAILED_DERIVATIVE_BYTES: "32034"
  FAILED_DERIVATIVE_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  TASK_ID: ap_469d79ea29fd7f877395d20f
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  FILE_TITLE: File:Kree.jpg
  FILE_PAGE_ID: "387498"
  FILE_TIMESTAMP: 2026-07-28T09:19:09Z
  FILE_BYTES: "67431"
  FILE_WIDTH: "1053"
  FILE_HEIGHT: "805"
  FILE_SHA1: 319cfa66634da164e2efd998cb85702fb609a83e
  FILE_MIME: image/jpeg
  FILE_MEDIA_TYPE: BITMAP
  GH_TOKEN: ${{ github.token }}

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v2.yml
            data
            images
            scripts

      - name: Bind exact main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/preflight" "$OUT/download-attempts"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            > "$OUT/main-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick file >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"
          file --version | head -1 | tee "$OUT/file-version.txt"

      - name: Bind exact successful preflight and failed derivative assumption
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREFLIGHT_ARTIFACT_ID}" > "$OUT/preflight-artifact-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}" > "$OUT/preflight-run-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}/jobs?per_page=100" > "$OUT/preflight-jobs-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FAILED_ARTIFACT_ID}" > "$OUT/failed-artifact-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}" > "$OUT/failed-run-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}/jobs?per_page=100" > "$OUT/failed-jobs-api.json"

          jq -e --argjson id "$PREFLIGHT_ARTIFACT_ID" --arg name "$PREFLIGHT_ARTIFACT" --arg digest "sha256:${PREFLIGHT_ARTIFACT_SHA256}" --argjson run "$PREFLIGHT_RUN" '
            .id==$id and .name==$name and .digest==$digest and .workflow_run.id==$run and .expired==false
          ' "$OUT/preflight-artifact-api.json" >/dev/null
          jq -e --argjson run "$PREFLIGHT_RUN" --arg head "$PREFLIGHT_HEAD" '
            .id==$run and .head_sha==$head and .status=="completed" and .conclusion=="success"
          ' "$OUT/preflight-run-api.json" >/dev/null
          jq -e --argjson job "$PREFLIGHT_JOB" '
            any(.jobs[]; .id==$job and .name=="preflight" and .status=="completed" and .conclusion=="success")
          ' "$OUT/preflight-jobs-api.json" >/dev/null

          jq -e --argjson id "$FAILED_ARTIFACT_ID" --arg name "$FAILED_ARTIFACT_NAME" --arg digest "sha256:${FAILED_ARTIFACT_SHA256}" --argjson run "$FAILED_RUN" '
            .id==$id and .name==$name and .digest==$digest and .workflow_run.id==$run and .expired==false
          ' "$OUT/failed-artifact-api.json" >/dev/null
          jq -e --argjson run "$FAILED_RUN" --arg head "$FAILED_HEAD" '
            .id==$run and .head_sha==$head and .status=="completed" and .conclusion=="failure"
          ' "$OUT/failed-run-api.json" >/dev/null
          jq -e --argjson job "$FAILED_JOB" '
            any(.jobs[];
              .id==$job and .name=="recover" and .status=="completed" and .conclusion=="failure" and
              any(.steps[]; .name=="Recover exact source-file metadata, page body, and bytes" and .conclusion=="failure")
            )
          ' "$OUT/failed-jobs-api.json" >/dev/null

      - name: Download exact cycle-008 preflight packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT }}
          path: ${{ env.OUT }}/preflight
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.PREFLIGHT_RUN }}

      - name: Verify exact Kreg task and frozen source body
        shell: bash
        run: |
          set -euo pipefail
          packet="$OUT/preflight"
          for file in selected-task.json source-01.wikitext recovered-sources.json boundary.json complete-gate.sha256 selection-sha256.txt; do
            test -f "$packet/$file"
          done
          test "$(sha256sum "$packet/source-01.wikitext" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"
          test "$(wc -c < "$packet/source-01.wikitext")" -eq 840
          jq -e --arg exact "$EXACT_MAIN" --arg task "$TASK_ID" --arg fingerprint "$SOURCE_FINGERPRINT" '
            .exact_main==$exact and .lease_issued==false and .global_active_count==0 and
            .queue.queued==309 and .queue.resolved==7 and
            .counts.compatible==309 and .counts.incompatible==0 and
            .selected.task_id==$task and .selected.performer=="Dan Starkey" and
            .selected.character=="Kreg" and .selected.performance_modes==["voice"] and
            .selected.source_fingerprint==$fingerprint and .task.status=="queued"
          ' "$packet/selected-task.json" >/dev/null
          grep -F '|image             =Kree.jpg' "$packet/source-01.wikitext" >/dev/null
          grep -F '|voice actor       = Dan Starkey' "$packet/source-01.wikitext" >/dev/null
          grep -F '|only              = The Great Sontaran War (audio story)' "$packet/source-01.wikitext" >/dev/null

      - name: Recover MediaWiki metadata and an exact original asset
        shell: bash
        run: |
          set -euo pipefail
          api='https://tardis.fandom.com/api.php'
          ua='Undercast exact Kreg media recovery/2.0'

          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=imageinfo \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'iiprop=url|size|mime|sha1|timestamp|mediatype|extmetadata' \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H "User-Agent: $ua" \
            > "$OUT/file-imageinfo-api.json"

          jq -e \
            --arg title "$FILE_TITLE" \
            --argjson pageid "$FILE_PAGE_ID" \
            --arg timestamp "$FILE_TIMESTAMP" \
            --argjson size "$FILE_BYTES" \
            --argjson width "$FILE_WIDTH" \
            --argjson height "$FILE_HEIGHT" \
            --arg sha1 "$FILE_SHA1" \
            --arg mime "$FILE_MIME" \
            --arg mediatype "$FILE_MEDIA_TYPE" '
              .query.pages | length==1 and
              .[0].title==$title and .[0].pageid==$pageid and (.[0].missing|not) and
              (.[0].imageinfo|length)==1 and
              .[0].imageinfo[0].timestamp==$timestamp and
              .[0].imageinfo[0].size==$size and
              .[0].imageinfo[0].width==$width and
              .[0].imageinfo[0].height==$height and
              .[0].imageinfo[0].sha1==$sha1 and
              .[0].imageinfo[0].mime==$mime and
              .[0].imageinfo[0].mediatype==$mediatype and
              (.[0].imageinfo[0].url|type)=="string"
          ' "$OUT/file-imageinfo-api.json" >/dev/null

          advertised_url="$(jq -r '.query.pages[0].imageinfo[0].url' "$OUT/file-imageinfo-api.json")"
          base_url="${advertised_url%%\?*}"
          asset_url="${base_url%/revision/latest}"

          curl -fsSL --retry 4 --retry-all-errors "$advertised_url" \
            -H "User-Agent: $ua" \
            -D "$OUT/default-delivery-headers.txt" \
            -o "$OUT/default-delivery"
          default_bytes="$(wc -c < "$OUT/default-delivery")"
          default_sha256="$(sha256sum "$OUT/default-delivery" | awk '{print $1}')"
          default_sha1="$(sha1sum "$OUT/default-delivery" | awk '{print $1}')"
          default_mime="$(file --brief --mime-type "$OUT/default-delivery")"
          jq -n \
            --arg url "$advertised_url" \
            --argjson bytes "$default_bytes" \
            --arg sha1 "$default_sha1" \
            --arg sha256 "$default_sha256" \
            --arg mime "$default_mime" \
            --argjson prior_bytes "$FAILED_DERIVATIVE_BYTES" \
            --arg prior_sha256 "$FAILED_DERIVATIVE_SHA256" \
            --argjson original_bytes "$FILE_BYTES" \
            --arg original_sha1 "$FILE_SHA1" '
            {
              url:$url,
              delivered_bytes:$bytes,
              delivered_sha1:$sha1,
              delivered_sha256:$sha256,
              delivered_mime:$mime,
              matches_original:($bytes==$original_bytes and $sha1==$original_sha1),
              prior_failed_derivative:{bytes:$prior_bytes,sha256:$prior_sha256}
            }
          ' > "$OUT/default-delivery.json"

          printf '%s\n' \
            "${advertised_url}&format=original" \
            "${base_url}?format=original" \
            "${asset_url}?format=original" \
            "$advertised_url" \
            | awk '!seen[$0]++' > "$OUT/candidate-urls.txt"

          : > "$OUT/download-attempts.jsonl"
          index=0
          while IFS= read -r candidate_url; do
            index=$((index+1))
            body="$OUT/download-attempts/attempt-${index}.bin"
            headers="$OUT/download-attempts/attempt-${index}.headers"
            if curl -fsSL --retry 4 --retry-all-errors "$candidate_url" \
              -H "User-Agent: $ua" \
              -H 'Accept: image/jpeg,image/*;q=0.9,*/*;q=0.1' \
              -D "$headers" \
              -o "$body"; then
              bytes="$(wc -c < "$body")"
              sha1="$(sha1sum "$body" | awk '{print $1}')"
              sha256="$(sha256sum "$body" | awk '{print $1}')"
              mime="$(file --brief --mime-type "$body")"
              success=true
            else
              bytes=0
              sha1=''
              sha256=''
              mime=''
              success=false
              rm -f "$body"
            fi
            jq -nc \
              --argjson index "$index" \
              --arg url "$candidate_url" \
              --argjson success "$success" \
              --argjson bytes "$bytes" \
              --arg sha1 "$sha1" \
              --arg sha256 "$sha256" \
              --arg mime "$mime" \
              --argjson expected_bytes "$FILE_BYTES" \
              --arg expected_sha1 "$FILE_SHA1" \
              '{index:$index,url:$url,curl_success:$success,bytes:$bytes,sha1:$sha1,sha256:$sha256,mime:$mime,exact_original:($success and $bytes==$expected_bytes and $sha1==$expected_sha1)}' \
              >> "$OUT/download-attempts.jsonl"
          done < "$OUT/candidate-urls.txt"
          jq -s '.' "$OUT/download-attempts.jsonl" > "$OUT/download-attempts.json"

          exact_matches="$(jq '[.[]|select(.exact_original)]|length' "$OUT/download-attempts.json")"
          test "$exact_matches" -ge 1
          selected_index="$(jq -r '[.[]|select(.exact_original)][0].index' "$OUT/download-attempts.json")"
          selected_url="$(jq -r '[.[]|select(.exact_original)][0].url' "$OUT/download-attempts.json")"
          cp "$OUT/download-attempts/attempt-${selected_index}.bin" "$OUT/kreg-source-original.jpg"
          cp "$OUT/download-attempts/attempt-${selected_index}.headers" "$OUT/original-delivery-headers.txt"

          test "$(wc -c < "$OUT/kreg-source-original.jpg")" -eq "$FILE_BYTES"
          test "$(sha1sum "$OUT/kreg-source-original.jpg" | awk '{print $1}')" = "$FILE_SHA1"
          test "$(file --brief --mime-type "$OUT/kreg-source-original.jpg")" = "$FILE_MIME"
          identify -verbose "$OUT/kreg-source-original.jpg" > "$OUT/source-identify-verbose.txt"
          identify -format '%m %w %h %[channels]\n' "$OUT/kreg-source-original.jpg" > "$OUT/source-identify.txt"
          read -r identified_format identified_width identified_height identified_channels < "$OUT/source-identify.txt"
          test "$identified_format" = "JPEG"
          test "$identified_width" -eq "$FILE_WIDTH"
          test "$identified_height" -eq "$FILE_HEIGHT"
          sha256sum "$OUT/kreg-source-original.jpg" > "$OUT/source-sha256.txt"

          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H "User-Agent: $ua" \
            > "$OUT/file-page-api.json"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const imageApi = JSON.parse(fs.readFileSync(`${out}/file-imageinfo-api.json`, 'utf8'));
          const pageApi = JSON.parse(fs.readFileSync(`${out}/file-page-api.json`, 'utf8'));
          const attempts = JSON.parse(fs.readFileSync(`${out}/download-attempts.json`, 'utf8'));
          const imagePage = imageApi.query.pages[0];
          const info = imagePage.imageinfo[0];
          const page = pageApi.query?.pages?.[0];
          const revision = page?.revisions?.[0];
          if (!page || !revision || !revision.slots?.main || typeof revision.slots.main.content !== 'string') {
            throw new Error('file-page revision/content unavailable');
          }
          const content = revision.slots.main.content;
          fs.writeFileSync(`${out}/file-page.wikitext`, content);
          const selected = attempts.find((attempt) => attempt.exact_original);
          const sourceSha256 = fs.readFileSync(`${out}/source-sha256.txt`, 'utf8').trim().split(/\s+/)[0];
          const metadata = {
            file_title: imagePage.title,
            pageid: imagePage.pageid,
            image_timestamp: info.timestamp,
            mime: info.mime,
            mediatype: info.mediatype,
            source_width: info.width,
            source_height: info.height,
            source_bytes: info.size,
            mediawiki_sha1: info.sha1,
            source_sha256: sourceSha256,
            advertised_url: info.url,
            selected_original_url: selected.url,
            selected_attempt_index: selected.index,
            descriptionshorturl: info.descriptionshorturl,
            extmetadata: info.extmetadata,
            file_page_revision: revision.revid,
            file_page_parent_revision: revision.parentid,
            file_page_timestamp: revision.timestamp,
            file_page_bytes: Buffer.byteLength(content),
            file_page_sha256: crypto.createHash('sha256').update(content).digest('hex')
          };
          fs.writeFileSync(`${out}/kreg-source-metadata.json`, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Refuse duplicate adoption and project both quality paths
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(awk '{print $1}' "$OUT/source-sha256.txt")"
          find images -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/current-image-sha256.txt"
          if grep -F "${source_sha}  " "$OUT/current-image-sha256.txt"; then
            echo 'Kreg source bytes already exist in repository media' >&2
            exit 1
          fi
          grep -R -n -E "(${source_sha}|File:Kree\.jpg|Kree\.jpg)" data > "$OUT/current-adoption-matches.txt" || true
          test ! -s "$OUT/current-adoption-matches.txt"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/current-media-gate.log"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const doc = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const records = Array.isArray(doc) ? doc : (doc.records ?? doc.specimens ?? doc.items);
          if (!Array.isArray(records)) throw new Error('specimen collection shape is unsupported');
          const src = (value) => typeof value === 'string' ? value : value?.src;
          const missing = records.filter((record) => !src(record.still) && !src(record.portrait)).length;
          const current = {total: records.length, fully_unillustrated: missing, ratio: missing / records.length};
          const exactStill = {total: records.length + 1, fully_unillustrated: missing, ratio: missing / (records.length + 1)};
          const noMedia = {total: records.length + 1, fully_unillustrated: missing + 1, ratio: (missing + 1) / (records.length + 1)};
          if (!(exactStill.ratio < current.ratio)) throw new Error('exact-still projection is not non-regressing');
          fs.writeFileSync(`${process.env.OUT}/quality-projection.json`, `${JSON.stringify({current, exact_character_still: exactStill, no_media: noMedia}, null, 2)}\n`);
          NODE
          test -z "$(git status --porcelain)"

      - name: Record strict no-write recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(awk '{print $1}' "$OUT/source-sha256.txt")"
          selected_url="$(jq -r '.selected_original_url' "$OUT/kreg-source-metadata.json")"
          file_revision="$(jq -r '.file_page_revision' "$OUT/kreg-source-metadata.json")"
          jq -n \
            --arg exact "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" \
            --arg file "$FILE_TITLE" \
            --arg source_sha "$source_sha" \
            --arg mediawiki_sha1 "$FILE_SHA1" \
            --arg selected_url "$selected_url" \
            --argjson file_revision "$file_revision" '
            {
              version:2,
              exact_main:$exact,
              task_id:$task,
              performer:"Dan Starkey",
              role:"Kreg",
              source_fingerprint:$fingerprint,
              performance_mode:"voice",
              source_file:$file,
              original_recovered:true,
              source_image_sha256:$source_sha,
              mediawiki_sha1:$mediawiki_sha1,
              selected_original_url:$selected_url,
              file_page_revision:$file_revision,
              derivative_mismatch_paid:true,
              visual_review_completed:false,
              lease_issued:false,
              queue_mutated:false,
              canonical_record_created:false,
              media_adopted:false,
              waterline_event_written:false,
              cycle_receipt_written:false,
              product_published:false,
              cycle_008_started:false
            }' > "$OUT/boundary.json"
          test -z "$(git status --porcelain)"

      - name: Rebind live main after recovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Seal self-hashed recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="recover") | .id' | head -1)"
          test -n "$job_id"
          source_sha="$(awk '{print $1}' "$OUT/source-sha256.txt")"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V2" \
            --arg verdict "exact-original-recovered-pending-visual-adjudication" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --arg task "$TASK_ID" \
            --arg source_sha "$source_sha" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            --argjson preflight_run "$PREFLIGHT_RUN" \
            --argjson preflight_artifact "$PREFLIGHT_ARTIFACT_ID" \
            --argjson failed_run "$FAILED_RUN" \
            --argjson failed_artifact "$FAILED_ARTIFACT_ID" '
            {
              schema_version:1,
              transaction:$transaction,
              verdict:$verdict,
              exact_main:$main,
              carrier_head:$carrier,
              task_id:$task,
              source_image_sha256:$source_sha,
              run_id:$run,
              job_id:$job,
              preflight:{run_id:$preflight_run,artifact_id:$preflight_artifact},
              paid_failure:{run_id:$failed_run,artifact_id:$failed_artifact,reason:"CDN default URL delivered a transformed WebP derivative instead of the MediaWiki-advertised JPEG original"},
              checks:{
                preflight_bound:true,
                failed_derivative_assumption_bound:true,
                mediawiki_metadata_pinned:true,
                exact_original_selected_by_byte_count_and_sha1:true,
                duplicate_adoption_refused:true,
                quality_paths_projected:true,
                live_main_rebound:true
              },
              boundary:{
                repository_written:false,
                visual_adjudication_completed:false,
                lease_issued:false,
                queue_mutated:false,
                media_adopted:false,
                cycle_receipt_written:false,
                product_published:false,
                outside_human_dependency:false
              }
            }' > "$OUT/recovery-receipt.json"
          sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}' > "$OUT/recovery-receipt.sha256"
          test "$(sha256sum "$OUT/recovery-receipt.json" | awk '{print $1}')" = "$(cat "$OUT/recovery-receipt.sha256")"

      - name: Upload exact Kreg media-recovery V2 packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-v2-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
