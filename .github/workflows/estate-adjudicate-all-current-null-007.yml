name: estate-adjudicate-all-current-null-007

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adjudicate-all-current-null-007.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adjudicate-all-current-null-007
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  OUT: data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json

jobs:
  adjudicate:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head audit custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Adjudicate the complete remaining current-null lane
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlob = (bytes) => crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`, 'utf8')).update(bytes).digest('hex');
          const readBytes = (file) => fs.readFileSync(file);
          const readJsonDoc = (file) => {
            const bytes = readBytes(file);
            return { file, bytes, sha256: sha256(bytes), git_blob: gitBlob(bytes), value: JSON.parse(bytes.toString('utf8')) };
          };
          const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
          const exact = (rows, predicate, label) => {
            const found = rows.filter(predicate);
            if (found.length !== 1) throw new Error(`${label}: expected one row, found ${found.length}`);
            return found[0];
          };
          const parseChecksums = (text, label) => {
            const map = new Map();
            for (const [index, raw] of String(text).split(/\r?\n/).entries()) {
              if (!raw.trim()) continue;
              const match = raw.match(/^([0-9a-f]{64})\s+\*?(.+)$/i);
              if (!match) throw new Error(`${label}:${index + 1} is not a SHA-256 row`);
              const name = match[2].trim().replace(/^\.\//, '');
              if (!name || name.includes('/') || map.has(name)) throw new Error(`${label}:${index + 1} repeats or nests ${name}`);
              map.set(name, match[1].toLowerCase());
            }
            if (!map.size) throw new Error(`${label} is empty`);
            return map;
          };

          const censusDoc = readJsonDoc('data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json');
          const ledgerDoc = readJsonDoc('data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json');
          const specimens = readJsonDoc('data/specimens.json').value;
          const sources = readJsonDoc('data/SOURCES.json').value;
          const census = censusDoc.value;
          const ledger = ledgerDoc.value;

          if (census.transaction !== 'COLLECT-005' || census.counts?.null_without_prior_state !== 27) throw new Error('COLLECT-005 current-null denominator drifted');
          if (ledger.cumulative?.canonical_adoptions !== 15 || ledger.cumulative?.remaining_for_canonical_review !== 40) throw new Error('paid ledger is not at the COLLECT-006 boundary');

          const adopted = new Set((ledger.adopted_obligations || []).map((row) => row.obligation_id));
          const laneRows = (census.packets || [])
            .filter((row) => row.lane === 'null-binding-without-prior-state' && !adopted.has(row.obligation_id))
            .sort((a, b) => a.obligation_id.localeCompare(b.obligation_id));
          if (laneRows.length !== 24) throw new Error(`expected all 24 unpaid current-null objects, found ${laneRows.length}`);

          const specimenById = new Map(specimens.map((row) => [row.id, row]));
          const sourceById = new Map(sources.map((row) => [row.id, row]));
          const decisions = [];

          for (const row of laneRows) {
            const key = row.obligation_id;
            const reasons = [];
            const specimen = specimenById.get(row.record_id);
            const source = sourceById.get(row.record_id);
            if (!specimen || !source) reasons.push('canonical-record-missing');
            if (specimen && source) {
              if (specimen.actor !== row.actor || source.actor !== row.actor) reasons.push('actor-drift');
              if (specimen.character !== row.character || source.character !== row.character) reasons.push('character-drift');
              if (!same(specimen[row.side], source[row.side])) reasons.push('canonical-row-disagreement');
              if (specimen[row.side] !== null || source[row.side] !== null) reasons.push('current-binding-not-null');
              const other = row.side === 'still' ? 'portrait' : 'still';
              if (!(specimen[other]?.src && source[other]?.src && same(specimen[other], source[other]))) reasons.push('opposite-side-incomplete');
            }

            const custody = row.custody || {};
            for (const field of ['candidate_hash_pass', 'manifest_checksum_bound', 'candidate_checksum_bound', 'independent_review_ready', 'duplicate_screen_pass', 'packet_ready']) {
              if (custody[field] !== true) reasons.push(`custody-${field}-failed`);
            }

            let manifestHash = null;
            let candidateHash = null;
            let manifestBound = false;
            let candidateBound = false;
            try {
              const manifestBytes = readBytes(row.manifest_path);
              manifestHash = sha256(manifestBytes);
              if (manifestHash !== row.manifest_sha256) reasons.push('manifest-hash-drift');
              const candidateBytes = readBytes(row.candidate_path);
              candidateHash = sha256(candidateBytes);
              if (candidateHash !== row.candidate_sha256) reasons.push('candidate-hash-drift');
              const checksums = parseChecksums(readBytes(row.checksum_path).toString('utf8'), row.checksum_path);
              manifestBound = checksums.get(path.posix.basename(row.manifest_path)) === row.manifest_sha256;
              candidateBound = checksums.get(path.posix.basename(row.candidate_path)) === row.candidate_sha256;
              if (!manifestBound) reasons.push('manifest-not-checksum-bound');
              if (!candidateBound) reasons.push('candidate-not-checksum-bound');
            } catch (error) {
              reasons.push(`packet-read-failure:${error.message}`);
            }

            const destinationExists = fs.existsSync(row.suggested_destination_path);
            if (destinationExists) reasons.push('versioned-destination-exists');
            const otherSide = row.side === 'still' ? 'portrait' : 'still';
            const authorized = reasons.length === 0;
            decisions.push({
              decision_id: key,
              record_id: row.record_id,
              side: row.side,
              actor: row.actor,
              character: row.character,
              production: row.production ?? null,
              packet_generation: row.packet_generation,
              status: authorized ? 'authorized-current-null' : 'blocked-current-null',
              reasons,
              packet: {
                root: row.packet_root,
                manifest_path: row.manifest_path,
                manifest_sha256: row.manifest_sha256,
                manifest_hash_pass: manifestHash === row.manifest_sha256,
                manifest_checksum_bound: manifestBound,
                candidate_path: row.candidate_path,
                candidate_sha256: row.candidate_sha256,
                candidate_hash_pass: candidateHash === row.candidate_sha256,
                candidate_checksum_bound: candidateBound,
                candidate_mime: row.candidate_mime,
                independent_review_ready: custody.independent_review_ready === true,
                duplicate_screen_pass: custody.duplicate_screen_pass === true,
                packet_ready: custody.packet_ready === true
              },
              current: {
                specimen_binding: specimen?.[row.side] ?? null,
                source_binding: source?.[row.side] ?? null,
                canonical_rows_agree: specimen && source ? same(specimen[row.side], source[row.side]) : false,
                other_side: otherSide,
                other_side_present: Boolean(specimen?.[otherSide]?.src && source?.[otherSide]?.src && same(specimen[otherSide], source[otherSide])),
                destination_path: row.suggested_destination_path,
                destination_exists: destinationExists
              },
              proposed_binding: authorized ? {
                src: row.suggested_destination_path,
                kind: row.side === 'still' ? 'still' : 'portrait',
                origin: row.suggested_origin,
                pin: true,
                focus: row.suggested_focus
              } : null,
              quality_effect: row.side === 'still'
                ? { complete_pairs: 1, missing_still: -1, missing_portrait: 0, missing_both: 0 }
                : { complete_pairs: 1, missing_still: 0, missing_portrait: -1, missing_both: 0 }
            });
          }

          const authorized = decisions.filter((row) => row.status === 'authorized-current-null');
          const blocked = decisions.filter((row) => row.status === 'blocked-current-null');
          const quality = authorized.reduce((sum, row) => ({
            complete_pairs: sum.complete_pairs + row.quality_effect.complete_pairs,
            missing_still: sum.missing_still + row.quality_effect.missing_still,
            missing_portrait: sum.missing_portrait + row.quality_effect.missing_portrait,
            missing_both: sum.missing_both + row.quality_effect.missing_both
          }), { complete_pairs: 0, missing_still: 0, missing_portrait: 0, missing_both: 0 });

          const result = {
            version: 1,
            transaction: 'COLLECT-007',
            operation: 'exact-current-null-whole-lane-adjudication',
            status: blocked.length ? 'partially-authorized' : 'authorized',
            recorded_at: new Date().toISOString(),
            source: {
              current_head: process.env.AUTHORIZED_HEAD,
              census_path: censusDoc.file,
              census_sha256: censusDoc.sha256,
              census_git_blob: censusDoc.git_blob,
              ledger_path: ledgerDoc.file,
              ledger_sha256: ledgerDoc.sha256,
              ledger_git_blob: ledgerDoc.git_blob,
              canonical_adoptions_before: 15,
              remaining_packet_review_before: 40
            },
            denominator: {
              original_current_null_lane: 27,
              already_paid_from_lane: 3,
              remaining_lane: 24,
              reviewed: decisions.length,
              authorized: authorized.length,
              blocked: blocked.length
            },
            quality_effect_if_all_authorized_are_adopted: quality,
            authorized_obligations: authorized.map((row) => row.decision_id),
            blocked_obligations: blocked.map((row) => ({ decision_id: row.decision_id, reasons: row.reasons })),
            decisions,
            boundary: {
              canonical_mutation: false,
              discovery_performed: false,
              packet_evidence_rewritten: false,
              arbitrary_batch_size_used: false,
              complete_remaining_lane_reviewed: true,
              missing_prior_state_label_treated_as_metadata_not_contrary_evidence: true,
              next_authorized_work: authorized.length
                ? 'adopt every authorized object as one evidence-sized tranche; keep blocked objects visibly blocked'
                : 'repair only the exact blocked evidence or current-state conditions'
            }
          };
          if (result.denominator.reviewed !== 24 || result.denominator.authorized + result.denominator.blocked !== 24) throw new Error('whole-lane adjudication does not reconcile');
          fs.mkdirSync(path.dirname(process.env.OUT), { recursive: true });
          fs.writeFileSync(process.env.OUT, `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify({ transaction: result.transaction, status: result.status, denominator: result.denominator, quality_effect: quality, authorized_obligations: result.authorized_obligations }, null, 2));
          NODE

      - name: Validate cumulative custody and stage immutable ruling
        run: |
          set -euo pipefail
          node scripts/estate-canonical-adoption-ledger.mjs
          node --input-type=module - "$OUT" <<'NODE'
          import fs from 'node:fs';
          const ruling = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (ruling.transaction !== 'COLLECT-007' || ruling.denominator?.reviewed !== 24) throw new Error('COLLECT-007 denominator drifted');
          if (ruling.denominator.authorized + ruling.denominator.blocked !== 24) throw new Error('COLLECT-007 does not reconcile');
          if (ruling.boundary?.canonical_mutation !== false || ruling.boundary?.complete_remaining_lane_reviewed !== true) throw new Error('COLLECT-007 escaped audit boundary');
          NODE
          git rm .github/workflows/estate-adjudicate-all-current-null-007.yml
          git add -- "$OUT"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/estate-adjudicate-all-current-null-007.yml' "$OUT" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-007-adjudication.tree

      - name: Run repository gate without redundant rendered-browser pass
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-007-adjudication.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish complete lane ruling under exact-head lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          AUTHORIZED="$(node -p "require('./$OUT').denominator.authorized")"
          BLOCKED="$(node -p "require('./$OUT').denominator.blocked")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adjudication: rule complete remaining current-null lane' \
            -m 'transaction=COLLECT-007' \
            -m 'reviewed=24' \
            -m "authorized=${AUTHORIZED}" \
            -m "blocked=${BLOCKED}" \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-007-adjudication.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report whole-lane ruling
        if: success()
        run: |
          AUTHORIZED="$(node -p "require('./$OUT').denominator.authorized")"
          BLOCKED="$(node -p "require('./$OUT').denominator.blocked")"
          BODY="COLLECT-007 reviewed the complete 24-object remaining current-null lane on workflow run ${GITHUB_RUN_ID}. Authorized: ${AUTHORIZED}. Blocked: ${BLOCKED}. No canonical media changed. The next transaction must adopt the entire authorized set as one evidence-sized tranche rather than restore an arbitrary card cadence."
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Report failed adjudication
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-007 whole-lane adjudication failed closed on workflow run ${GITHUB_RUN_ID}. No canonical mutation or adoption claim is authorized."

      - name: Preserve adjudication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-007-current-null-adjudication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
            /tmp/COLLECT-007-adjudication.tree
          if-no-files-found: warn
          retention-days: 30
