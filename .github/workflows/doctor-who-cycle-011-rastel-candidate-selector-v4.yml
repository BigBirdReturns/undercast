      V8_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-v8-current-main-31333047499-attempt-1
      V9_PR: "767"
      V9_HEAD: 83b8b0867b64e56f43955a77390173f05e2924fa
      V9_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-packet-v9
      V9_RUN: "31333660931"
      V9_JOB: "93295812614"
      V9_JOB_NAME: finalize
      V9_ARTIFACT: "9043662459"
      V9_ARTIFACT_FILES: "391"
      V9_ARTIFACT_SIZE: "53773564"
      V9_ARTIFACT_SHA256: 4a499d6050f721094b273d638725b29a7f3d5a6fed41ba91e5a0919f69a97673
      V9_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-packet-v9-31333660931-attempt-1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact V3 topology failure and execute clean three-candidate selector
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER/v3a2"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/runner.sh.gz"
          test "$(wc -c < "$CARRIER/runner.sh.gz" | tr -d ' ')" = "$RUNNER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$CARRIER/runner.sh.gz" > "$CARRIER/runner.sh"
          test "$(wc -c < "$CARRIER/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$CARRIER/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$CARRIER/runner.sh"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V3A2_PR" > "$CARRIER/v3a2/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3A2_RUN" > "$CARRIER/v3a2/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3A2_RUN/jobs?per_page=100" > "$CARRIER/v3a2/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3A2_ARTIFACT" > "$CARRIER/v3a2/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3A2_ARTIFACT/zip" > "$CARRIER/v3a2/diagnostics.zip"
          test "$(sha256sum "$CARRIER/v3a2/diagnostics.zip" | awk '{print $1}')" = "$V3A2_ARTIFACT_SHA256"
          python3 - <<'PY'
          import hashlib, json, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['CARRIER'])
          v3 = root / 'v3a2'
          load = lambda name: json.loads((v3 / name).read_text())
          pr = load('pr.json'); run = load('run.json'); jobs = load('jobs.json')['jobs']; artifact = load('artifact.json')
          assert pr['number'] == int(os.environ['V3A2_PR'])
          assert pr['state'] == 'open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha'] == os.environ['MAIN']
          assert pr['head']['sha'] == os.environ['V3A2_HEAD'] and pr['head']['ref'] == os.environ['V3A2_BRANCH']
          assert pr['commits'] == 2 and pr['changed_files'] == 1
          assert run['id'] == int(os.environ['V3A2_RUN']) and run['head_sha'] == os.environ['V3A2_HEAD']
          assert run['head_branch'] == os.environ['V3A2_BRANCH'] and run['status'] == 'completed' and run['conclusion'] == 'failure'
          matches = [job for job in jobs if job['id'] == int(os.environ['V3A2_JOB'])]
          assert len(matches) == 1
          job = matches[0]
          assert job['name'] == 'select' and job['status'] == 'completed' and job['conclusion'] == 'failure'
          step = [x for x in job['steps'] if x['name'] == 'Authenticate exact three-candidate selector runner and execute']
          assert len(step) == 1 and step[0]['status'] == 'completed' and step[0]['conclusion'] == 'failure'
          assert artifact['id'] == int(os.environ['V3A2_ARTIFACT']) and artifact['name'] == os.environ['V3A2_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['V3A2_ARTIFACT_SIZE']) and artifact['expired'] is False
          assert artifact['digest'] == 'sha256:' + os.environ['V3A2_ARTIFACT_SHA256']
          assert artifact['workflow_run']['id'] == int(os.environ['V3A2_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['V3A2_HEAD']
          destination = v3 / 'extracted'; destination.mkdir()
          with zipfile.ZipFile(v3 / 'diagnostics.zip') as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['V3A2_ARTIFACT_FILES'])
              assert len({x.filename for x in infos}) == len(infos)
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode) and not info.is_dir()
                  target = destination.joinpath(*path.parts); target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))
          files = [p for p in destination.rglob('*') if p.is_file()]
          assert len(files) == 3
          by_name = {p.name: p for p in files}
          expected = {
              'runner.sh': (51257, '825f752ae2a75d446b8381d5cb860952aa90c236209a3f9f05253e9a197191c3'),
              'runner.patch': (5812, 'abf66b8b9919b9c6f5706292ddd0dfc04ba5f5be4a19572e3d9d842b4703a7'),
              'runner.source.sh.gz': (12179, '8cfa5b3ab67502f79b80f23a58054d30294e39534e7169a69da538a7f7f2020f'),
          }
          assert set(by_name) == set(expected)
          for name, (size, digest) in expected.items():
              data = by_name[name].read_bytes(); assert len(data) == size and hashlib.sha256(data).hexdigest() == digest
          retained = by_name['runner.sh'].read_text()
          assert retained == (root / 'runner.sh').read_text()
          assert 'test "$(git show -s --format=%P HEAD)" = "$MAIN"' in retained
          assert 'test "$(git rev-list --count "$MAIN"..HEAD)" = 1' in retained
          assert "assert own['commits'] == 1 and own['changed_files'] == 1" in retained
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", retained, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1): compile(block, f'<selector-v4-retained-{index}>', 'exec')
          receipt = {
              'version': 1,
              'status': 'cycle-011-rastel-selector-v3-two-commit-topology-failure-bound-v1',
              'source': {'pr': int(os.environ['V3A2_PR']), 'head': os.environ['V3A2_HEAD'], 'run': int(os.environ['V3A2_RUN']), 'job': int(os.environ['V3A2_JOB']), 'artifact': int(os.environ['V3A2_ARTIFACT']), 'artifact_sha256': os.environ['V3A2_ARTIFACT_SHA256']},
              'failure': {'carrier_commits': 2, 'required_carrier_commits': 1, 'runner_bytes': int(os.environ['RUNNER_BYTES']), 'runner_sha256': os.environ['RUNNER_SHA256'], 'runner_reached_candidate_api': False},
              'repair': {'fresh_one_commit_carrier': True, 'runner_changed': False},
              'repository_write': False, 'candidate_authority_created': False, 'cycle_receipt_written': False, 'cycle_012_authorization': False,
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (v3 / 'topology-failure-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          chmod 700 "$CARRIER/runner.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$CARRIER/runner.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4-source/api
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4-source/v1
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4-source/v2
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v4-carrier
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v4-source/*.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
