      V1_ARTIFACT_SHA256: d06783422691beaa4a3c0c98a3b8ace35f6a5704a1d51c044a0576cb98350c94
      V1_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-selector-v1-diagnostics-31334240792-attempt-1
      V2_PR: "773"
      V2_HEAD: 8ebf04145f81ae70b4e31ac1bed426df3653c0bf
      V2_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-selector-v2
      V2_RUN: "31334789759"
