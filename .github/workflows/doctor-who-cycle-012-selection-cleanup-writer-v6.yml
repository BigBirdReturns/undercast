name: doctor-who-cycle-012-selection-cleanup-writer-v6

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-evidence-v6]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v6
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'doctor-who-cycle-012-selection-cleanup-evidence-v6' &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V1_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      V3_MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      V4_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      INSTALL_PARENT: 108ea5f461ceb24d9253f246e7d88fc8ca8d74bb
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      WRITER_V5: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
      WRITER_V6: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-evidence-v6
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v6
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-evidence-v6-
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v6
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_DATE: 2026-08-10T19:15:00Z
      CLEANUP_MESSAGE: Doctor Who cycle 012 preselection transport cleanup V6
      CARRIER_BLOB: b97f56e951b322284ba93b9bf5d4a5c5340afd55
      CARRIER_GZIP_BYTES: "5498"
      CARRIER_GZIP_SHA256: 22116331c79c6804f6f626069b2846cb707d42717c6a0dc530ab262d45607e4e
      CARRIER_BYTES: "22584"
      CARRIER_SHA256: 9fb5f5e7b0658b364b0971fc18f54b6979bade2d71ab83047eb5b17f9d87cced
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v6-loader
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and execute exact V6 cleanup writer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==6
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-writer-v6-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v6-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v6/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v6-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v6
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v6-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
