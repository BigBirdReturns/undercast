name: doctor-who-cycle-012-preflight-v7

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v7
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v7
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v7.yml
      SOURCE_BLOB: eecd8ef67d2fcdea6e348357b66519444814b7f4
      BOOTSTRAP: /tmp/doctor-who-cycle-012-preflight-v7-bootstrap
      OUT: /tmp/doctor-who-cycle-012-preflight-v7
      PROOF_PACKET: /tmp/doctor-who-cycle-012-preflight-v7-proof
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      V6_PR: "859"
      V6_HEAD: e1bc8c03d68fe3814ded7d888f2ca7fb2dff8c32
      V6_BRANCH: agent/doctor-who-cycle-012-preflight-v6
      V6_RUN: "31361788729"
      V6_JOB: "93371917008"
      V6_ARTIFACT: "9052611235"
      V6_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v6-repair-diagnostics-31361788729-attempt-1
      V6_ARTIFACT_SHA256: 80a6bb3319f1d97ad2b04b3bc46589d53ec55207bc75d2fb48d272c00659cd71

      PROOF_PR: "856"
      PROOF_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4
      PROOF_HEAD: f47f0845de78496f20f3ce4446921ce1d9637afd
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v4-31360254095-attempt-1
      PROOF_ARTIFACT_SHA256: 3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1","agent/doctor-who-cycle-012-preflight-v4","agent/doctor-who-cycle-012-preflight-v5","agent/doctor-who-cycle-012-preflight-v6"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"},{"pr":857,"branch":"agent/doctor-who-cycle-012-preflight-v4"},{"pr":858,"branch":"agent/doctor-who-cycle-012-preflight-v5"},{"pr":859,"branch":"agent/doctor-who-cycle-012-preflight-v6"}]'
      PRIOR_SELECTOR_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PRIOR_SELECTOR_PATH: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      PRIOR_SELECTOR_BLOB: 49e902869ea04409d40690dff73e7ad10f8cc5c1
      ACTIVE_PROFILE: text-vision

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V6 programs with state-stable proof custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,scripts}

          test "$CURRENT_BASE" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r '.content' "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source.yml"
          test "$(git hash-object --stdin < "$BOOTSTRAP/source.yml")" = "$SOURCE_BLOB"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V6_PR" > "$BOOTSTRAP/api/v6-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V6_RUN" > "$BOOTSTRAP/api/v6-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V6_RUN/jobs?per_page=100" > "$BOOTSTRAP/api/v6-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V6_ARTIFACT" > "$BOOTSTRAP/api/v6-artifact.json"

          SOURCE="$BOOTSTRAP/source.yml" TARGET="$BOOTSTRAP/scripts" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path(os.environ['BOOTSTRAP'])
          source = Path(os.environ['SOURCE']).read_text()
          api = root / 'api'
          load = lambda name: json.loads((api / name).read_text())
          v6_pr = load('v6-pr.json')
          v6_run = load('v6-run.json')
          v6_jobs = load('v6-jobs.json')['jobs']
          v6_artifact = load('v6-artifact.json')

          assert v6_pr['number'] == int(os.environ['V6_PR'])
          assert v6_pr['state'] in {'open', 'closed'} and v6_pr['draft'] is True and v6_pr['merged_at'] is None
          assert v6_pr['base']['sha'] == os.environ['MAIN']
          assert v6_pr['head']['ref'] == os.environ['V6_BRANCH'] and v6_pr['head']['sha'] == os.environ['V6_HEAD']
          assert v6_pr['commits'] == 2 and v6_pr['changed_files'] == 2
          assert v6_run['id'] == int(os.environ['V6_RUN'])
          assert v6_run['head_sha'] == os.environ['V6_HEAD'] and v6_run['head_branch'] == os.environ['V6_BRANCH']
          assert v6_run['status'] == 'completed' and v6_run['conclusion'] == 'failure'
          rows = [row for row in v6_jobs if row['id'] == int(os.environ['V6_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['conclusion'] == 'failure'
          steps = {row['name']: (row['status'], row['conclusion']) for row in rows[0]['steps']}
          assert steps['Recover, repair, and execute exact V6 selector programs'] == ('completed', 'failure')
          assert v6_artifact['id'] == int(os.environ['V6_ARTIFACT'])
          assert v6_artifact['name'] == os.environ['V6_ARTIFACT_NAME']
          assert v6_artifact['digest'] == 'sha256:' + os.environ['V6_ARTIFACT_SHA256']
          assert v6_artifact['expired'] is False
          assert v6_artifact['workflow_run']['id'] == int(os.environ['V6_RUN'])
          assert v6_artifact['workflow_run']['head_sha'] == os.environ['V6_HEAD']

          lines = source.splitlines(keepends=True)
          names = [
              'Bind one-commit current-main selector and disjoint cleanup ancestry',
              'Authenticate terminal proof and freeze live transport custody',
              'Rerun current-main queue, media, waterline, and rendered gates',
              'Recover and execute exact repository-native selector',
          ]

          def extract(name):
              marker = f'- name: {name}'
              starts = [index for index, line in enumerate(lines) if line.strip() == marker]
              assert len(starts) == 1, (name, starts)
              start = starts[0]
              run_index = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'run: |')
              run_indent = len(lines[run_index]) - len(lines[run_index].lstrip(' '))
              content_indent = run_indent + 2
              output = []
              for line in lines[run_index + 1:]:
                  if not line.strip():
                      output.append('\n')
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  if indent < content_indent:
                      break
                  output.append(line[content_indent:])
              script = ''.join(output)
              assert script.startswith('set -euo pipefail\n')
              return script

          scripts = [extract(name) for name in names]
          opener = '$' + '{' + '{'
          closer = '}' + '}'
          repairs = []

          def replace_exact(index, old, new):
              script = scripts[index]
              count = script.count(old)
              assert count == 1, (index, old, count)
              scripts[index] = script.replace(old, new, 1)
              repairs.append({
                  'program': index + 1,
                  'old_sha256': hashlib.sha256(old.encode()).hexdigest(),
                  'new_sha256': hashlib.sha256(new.encode()).hexdigest(),
              })

          replace_exact(0, "head='" + opener + " github.event.pull_request.head.sha " + closer + "'", 'head="$CURRENT_HEAD"')
          replace_exact(0, "base='" + opener + " github.event.pull_request.base.sha " + closer + "'", 'base="$CURRENT_BASE"')
          replace_exact(0, "pr='" + opener + " github.event.pull_request.number " + closer + "'", 'pr="$CURRENT_PR"')
          replace_exact(
              0,
              "assert proof_pr['state'] == 'open' and proof_pr['draft'] is True and proof_pr['merged_at'] is None",
              "assert proof_pr['state'] in {'open', 'closed'} and proof_pr['draft'] is True and proof_pr['merged_at'] is None",
          )
          replace_exact(
              1,
              'for number in 793 794 795 796 797 798 857 858; do',
              'for number in 793 794 795 796 797 798 857 858 859; do',
          )
          replace_exact(
              1,
              "assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] == 'open' and proof_pr['merged_at'] is None",
              "assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] in {'open', 'closed'} and proof_pr['merged_at'] is None",
          )
          replace_exact(
              1,
              "{'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'action': 'close_without_merge'},",
              "{'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'action': 'close_without_merge' if proof_pr['state'] == 'open' else 'none'},",
          )
          replace_exact(
              1,
              "assert custody['counts'] == {'stale_cycle12_refs': 10, 'observer_refs': 2, 'refs_to_delete': 12, 'pull_requests': 10}",
              "assert custody['counts'] == {'stale_cycle12_refs': 11, 'observer_refs': 2, 'refs_to_delete': 13, 'pull_requests': 11}",
          )
          assert len(repairs) == 8

          target = Path(os.environ['TARGET'])
          script_rows = []
          for index, script in enumerate(scripts, 1):
              assert opener not in script
              path = target / f'{index:02d}.sh'
              path.write_text(script)
              subprocess.run(['bash', '-n', str(path)], check=True)
              blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", script, re.S)
              for block_index, block in enumerate(blocks, 1):
                  compile(block, f'<cycle-012-v7-{index}-{block_index}>', 'exec')
              script_rows.append({
                  'index': index,
                  'name': names[index - 1],
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'python_blocks': len(blocks),
              })

          receipt = {
              'status': 'cycle-012-preflight-v7-state-stable-recovery-v1',
              'version': 1,
              'source': {
                  'git_blob': os.environ['SOURCE_BLOB'],
                  'bytes': len(source.encode()),
                  'sha256': hashlib.sha256(source.encode()).hexdigest(),
              },
              'failed_v6': {
                  'pr': int(os.environ['V6_PR']),
                  'head': os.environ['V6_HEAD'],
                  'run': int(os.environ['V6_RUN']),
                  'job': int(os.environ['V6_JOB']),
                  'artifact': int(os.environ['V6_ARTIFACT']),
                  'artifact_sha256': os.environ['V6_ARTIFACT_SHA256'],
                  'failure': 'terminal proof pull request state changed after V6 repair publication',
                  'selection_emitted': False,
                  'lease_issued': False,
              },
              'target': {
                  'pr': int(os.environ['CURRENT_PR']),
                  'head': os.environ['CURRENT_HEAD'],
                  'base': os.environ['MAIN'],
                  'branch': os.environ['BRANCH'],
              },
              'repairs': repairs,
              'programs': script_rows,
              'boundary': {
                  'substantive_selector_changed': False,
                  'proof_artifact_changed': False,
                  'repository_write': False,
                  'canonical_mutation': False,
                  'transport_mutation': False,
                  'lease_issued': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = hashlib.sha256(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          (target / 'recovery.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Execute exact state-stable V7 selector
        shell: bash
        run: |
          set -euo pipefail
          load_github_env() {
            [ -s "$GITHUB_ENV" ] || return 0
            while IFS='=' read -r key value; do
              [ -n "$key" ] || continue
              export "$key=$value"
            done < "$GITHUB_ENV"
          }

          for script in "$BOOTSTRAP"/scripts/[0-9][0-9].sh; do
            bash "$script"
            load_github_env
          done

          cp "$BOOTSTRAP/scripts/recovery.json" "$OUT/payload/v7-recovery.json"
          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" |
            sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v7/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v7
            /tmp/doctor-who-cycle-012-preflight-v7-proof
            /tmp/doctor-who-cycle-012-preflight-v7-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
