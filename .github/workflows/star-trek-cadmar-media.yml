name: star-trek-cadmar-media
on:
  push:
    branches:
      - agent/star-trek-cadmar-media-v1
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
      SOURCE_RUN: 32070667347
      SOURCE_ARTIFACT: 9301591487
      SOURCE_ARTIFACT_SHA: e569ea3a26b0e6a84af4519bdc237b73c7a1f4056001615c36a6f798dbbc8bdb
      SCOUT_RUN: 32073110902
      SCOUT_ARTIFACT: 9302442340
      SCOUT_ARTIFACT_SHA: e4c2f64ff76ab75d3326dbec3ddfe817ec0a7cefa816b1ad249d74a4be873ff7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 -m pip install --quiet pillow
      - name: Recover exact source and scout artifacts
        run: |
          rm -rf /tmp/star-trek-cadmar-source-probe /tmp/star-trek-cadmar-media-scout-v2
          mkdir -p /tmp/star-trek-cadmar-source-probe /tmp/star-trek-cadmar-media-scout-v2
          gh run download "$SOURCE_RUN" -n star-trek-cadmar-source-probe -D /tmp/star-trek-cadmar-source-probe
          gh run download "$SCOUT_RUN" -n star-trek-cadmar-media-scout-v2 -D /tmp/star-trek-cadmar-media-scout-v2
      - name: Prepare and review exact Cadmar media
        run: python3 .github/scripts/star-trek-cadmar-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-media
          path: /tmp/star-trek-cadmar-media/
          if-no-files-found: error
          retention-days: 30
