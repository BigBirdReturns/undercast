name: card-backfill-uc-070-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-070-APPLY.json"
      - "scripts/card-backfill-uc-070-apply.mjs"
      - ".github/workflows/card-backfill-uc-070-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-070-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-013'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-013
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-070-APPLY.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-070'||row.actor!=='Bill Nighy'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-070 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8636849054||row.render_artifact?.head_sha!=='10a42746078eb781e2d956a711c06c220c83078f')throw new Error('UC-070 render custody drift');
          if(row.failed_render_checkpoint?.artifact_id!==8636751669)throw new Error('UC-070 failed-render checkpoint drift');
          if(row.expected?.candidate_sha256!=='3d8e34a8b291c88be576dfcfea6bd2649f5d7a2d237d57382ba64cf3639cc0f9')throw new Error('UC-070 candidate authorization drift');
          if(row.expected?.crop_preview_sha256!=='f6d004aebd0568223179d129c5feb49fab8a8a336361eaee0ef386464352ef93'||row.ruling?.crop_ruling!=='pass-center-focus')throw new Error('UC-070 crop authorization drift');
          console.log('PASS — exact UC-070 Davy Jones candidate and centered crop authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-070-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8636849054/zip" > "$root/render.zip"
          echo "418037a263cd92282f6255678b8be93b5d5264c58038a9c30ec57ac0cb18ca0c  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          test -f "$root/source/output/manifest.json"
          echo "3d8e34a8b291c88be576dfcfea6bd2649f5d7a2d237d57382ba64cf3639cc0f9  $root/source/output/uc-070-still-candidate.jpg" | sha256sum -c -
          echo "f6d004aebd0568223179d129c5feb49fab8a8a336361eaee0ef386464352ef93  $root/source/output/card-crop-preview.jpg" | sha256sum -c -
          echo "64ccf82c69b86a093ca977e2a96d3a6d9dee47135ba853333f22368ae5e6fc8f  $root/source/output/source-page.png" | sha256sum -c -
          echo "917eb374eb89e34e1d11b2b9f653c0a6b19d5f7cb3a12cd5d7eac38590e390db  $root/source/output/manifest.json" | sha256sum -c -
          echo "37f4ad63ae1314474986c6cd9ebf3692d782f29b1a06ede56771acc5438156a9  $root/source/output/duplicate-scan.json" | sha256sum -c -
          echo "d2eeef925f9240fc1ebfb7da4b95f8b936732cf8be847620f4de0a298629b1f9  $root/source/output/review.json" | sha256sum -c -
          echo "b9e5eb625d4cfd6a31626145f35bfe8c93521885513aa47db7d376ed5ef2636f  $root/source/output/review.md" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-070-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-070-apply"
          node scripts/card-backfill-uc-070-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-070-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-070');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-070');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_d00211e3a56dbe99d337f38e');
          if(!specimen||specimen.still)throw new Error('UC-070 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-070 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-070'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-070 audit disposition was canonically mutated');
          console.log('PASS — UC-070 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-070.json \
            .github/CARD-BACKFILL-UC-070-RENDER.json \
            .github/CARD-BACKFILL-UC-070-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-070-discover.yml \
            .github/workflows/card-backfill-uc-070-render.yml \
            .github/workflows/card-backfill-uc-070-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-070-discover.mjs \
            scripts/card-backfill-uc-070-render.mjs \
            scripts/card-backfill-uc-070-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-070 Davy Jones still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-012...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-070/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-070-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-070-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-013
      - name: Retain materialization, evidence, gate and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-070-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-070-apply
            data/review/card-backfill/UC-070
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
