name: estate-repair-collect010-portrait-kinds

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect010-portrait-kinds.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect010-portrait-kinds
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-normalized-review-010.mjs
  REPAIR: data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Record exact portrait provenance repair and bind executor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$EXECUTOR"
          test ! -e "$REPAIR"

          cat > "$REPAIR" <<'JSON'
          {
            "version": 1,
            "transaction": "COLLECT-010",
            "operation": "portrait-provenance-kind-schema-repair",
            "status": "authorized",
            "recorded_at": "2026-08-01T16:02:00Z",
            "defect": "The semantic adapter serialized the media side label portrait into image.kind, but the canonical image schema reserves portrait kinds for provenance classes copyright or free.",
            "correction": {
              "UC-040/portrait": {
                "kind": "copyright",
                "basis": "The retained MUBI cast-page portrait is a copyrighted editorial/cast image and carries no free license claim."
              },
              "UC-146/portrait": {
                "kind": "free",
                "author": "Gage Skidmore",
                "license": "CC BY-SA 3.0",
                "year": 2016,
                "basis": "The retained Wikimedia Commons packet identifies File:Tim Rose by Gage Skidmore.jpg, author Gage Skidmore, and license CC BY-SA 3.0."
              }
            },
            "boundary": {
              "candidate_bytes_changed": false,
              "packet_evidence_rewritten": false,
              "identity_ruling_changed": false,
              "presentation_ruling_changed": false,
              "crop_ruling_changed": false,
              "duplicate_ruling_changed": false,
              "canonical_mutation": false,
              "evidence_standard_changed": false
            }
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-normalized-review-010.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  semanticRuling: "data/review/estate-debt/COLLECT-010-PACKET-SEMANTIC-ADAPTER-RULING.json",\n',
                  '  semanticRuling: "data/review/estate-debt/COLLECT-010-PACKET-SEMANTIC-ADAPTER-RULING.json",\n  portraitRepair: "data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json",\n',
              ),
              (
                  '  assert(binding.kind === side, `${key} proposed binding kind drifted`);',
                  '  if (side === "still") assert(binding.kind === "still", `${key} still provenance kind drifted`);\n  else assert(new Set(["copyright", "free"]).has(binding.kind), `${key} portrait provenance kind drifted`);',
              ),
              (
                  '  const [vocabularyDoc, semanticDoc, censusDoc, ledgerDoc, specimensDoc, sourcesDoc] = await Promise.all([\n    readDoc(resolvedRoot, DEFAULTS.vocabularyRuling, "normalized vocabulary ruling"),\n    readDoc(resolvedRoot, DEFAULTS.semanticRuling, "semantic adapter ruling"),\n    readDoc(resolvedRoot, DEFAULTS.census, "COLLECT-005 census"),',
                  '  const [vocabularyDoc, semanticDoc, portraitRepairDoc, censusDoc, ledgerDoc, specimensDoc, sourcesDoc] = await Promise.all([\n    readDoc(resolvedRoot, DEFAULTS.vocabularyRuling, "normalized vocabulary ruling"),\n    readDoc(resolvedRoot, DEFAULTS.semanticRuling, "semantic adapter ruling"),\n    readDoc(resolvedRoot, DEFAULTS.portraitRepair, "portrait provenance repair"),\n    readDoc(resolvedRoot, DEFAULTS.census, "COLLECT-005 census"),',
              ),
              (
                  '  const semantic = semanticDoc.value;\n  const authorizedKeys = validateRulings(vocabulary, semantic);',
                  '  const semantic = semanticDoc.value;\n  const portraitRepair = portraitRepairDoc.value;\n  assert(portraitRepair?.transaction === "COLLECT-010" && portraitRepair.operation === "portrait-provenance-kind-schema-repair" && portraitRepair.status === "authorized", "portrait provenance repair identity drifted");\n  assert(portraitRepair.boundary?.candidate_bytes_changed === false && portraitRepair.boundary?.packet_evidence_rewritten === false && portraitRepair.boundary?.evidence_standard_changed === false, "portrait provenance repair escaped its boundary");\n  assert(sameJson(Object.keys(portraitRepair.correction || {}).sort(), ["UC-040/portrait", "UC-146/portrait"]), "portrait provenance repair set drifted");\n  const authorizedKeys = validateRulings(vocabulary, semantic);',
              ),
              (
                  '    validateBinding(decision.proposed_binding, side, key);\n    assert(decision.proposed_binding.src === row.suggested_destination_path, `${key} destination differs from census`);\n    assert(decision.proposed_binding.origin === row.suggested_origin && sameJson(decision.proposed_binding.focus, row.suggested_focus), `${key} binding origin or focus differs from census`);',
                  '    const provenanceRepair = portraitRepair.correction?.[key] || null;\n    const intended = provenanceRepair\n      ? { ...decision.proposed_binding, kind: provenanceRepair.kind, ...(provenanceRepair.author ? { author: provenanceRepair.author } : {}), ...(provenanceRepair.license ? { license: provenanceRepair.license } : {}), ...(provenanceRepair.year ? { year: provenanceRepair.year } : {}) }\n      : decision.proposed_binding;\n    validateBinding(intended, side, key);\n    assert(intended.src === row.suggested_destination_path, `${key} destination differs from census`);\n    assert(intended.origin === row.suggested_origin && sameJson(intended.focus, row.suggested_focus), `${key} binding origin or focus differs from census`);',
              ),
              (
                  '    const destination = resolveInside(resolvedRoot, decision.proposed_binding.src, `${key} destination`);',
                  '    const destination = resolveInside(resolvedRoot, intended.src, `${key} destination`);',
              ),
              (
                  '      assert(sameJson(specimenCurrent, decision.proposed_binding) && sameJson(sourceCurrent, decision.proposed_binding), `${key} current binding is neither null nor the exact intended adoption`);',
                  '      assert(sameJson(specimenCurrent, intended) && sameJson(sourceCurrent, intended), `${key} current binding is neither null nor the exact intended adoption`);',
              ),
              (
                  '    contexts.push({ key, recordId, side, row, decision, specimen, source, candidateBytes, destination, intended: decision.proposed_binding, state });',
                  '    contexts.push({ key, recordId, side, row, decision, specimen, source, candidateBytes, destination, intended, state });',
              ),
              (
                  '  return { resolvedRoot, vocabularyDoc, semanticDoc, censusDoc, ledgerDoc, specimensDoc, sourcesDoc, vocabulary, semantic, census, ledger, contexts };',
                  '  return { resolvedRoot, vocabularyDoc, semanticDoc, portraitRepairDoc, censusDoc, ledgerDoc, specimensDoc, sourcesDoc, vocabulary, semantic, portraitRepair, census, ledger, contexts };',
              ),
              (
                  '      semantic_adapter: {\n        path: inspection.semanticDoc.safe,\n        sha256: inspection.semanticDoc.sha256,\n        git_blob: inspection.semanticDoc.git_blob,\n      },',
                  '      semantic_adapter: {\n        path: inspection.semanticDoc.safe,\n        sha256: inspection.semanticDoc.sha256,\n        git_blob: inspection.semanticDoc.git_blob,\n      },\n      portrait_provenance_repair: {\n        path: inspection.portraitRepairDoc.safe,\n        sha256: inspection.portraitRepairDoc.sha256,\n        git_blob: inspection.portraitRepairDoc.git_blob,\n      },',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact portrait-kind repair expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          node --check "$EXECUTOR"
          node "$EXECUTOR" | tee /tmp/COLLECT-010-portrait-kind-preflight.json
          test "$(node -p "require('/tmp/COLLECT-010-portrait-kind-preflight.json').authorized")" = "12"
          test "$(node -p "require('/tmp/COLLECT-010-portrait-kind-preflight.json').pending")" = "12"
          test "$(node -p "require('./$REPAIR').correction['UC-040/portrait'].kind")" = "copyright"
          test "$(node -p "require('./$REPAIR').correction['UC-146/portrait'].kind")" = "free"

      - name: Stage exact repair and retire one-shot authority
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect010-portrait-kinds.yml
          git add -- "$EXECUTOR" "$REPAIR"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' \
            '.github/workflows/estate-repair-collect010-portrait-kinds.yml' \
            "$EXECUTOR" \
            "$REPAIR" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-010-portrait-kind-repair.tree

      - name: Run repository gate without rendered-browser duplication
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-010-portrait-kind-repair.tree)" = "$(git write-tree)"
          node "$EXECUTOR" > /tmp/COLLECT-010-portrait-kind-postgate.json
          test "$(node -p "require('/tmp/COLLECT-010-portrait-kind-postgate.json').pending")" = "12"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish portrait provenance repair under exact-head lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: repair COLLECT-010 portrait provenance kinds' \
            -m 'transaction=COLLECT-010' \
            -m 'uc040_kind=copyright' \
            -m 'uc146_kind=free' \
            -m 'candidate_bytes_changed=false' \
            -m 'packet_evidence_rewritten=false' \
            -m 'evidence_standard_changed=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-010-portrait-kind-repair.tree)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report repaired portrait provenance
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-010 portrait provenance repair passed every gate on workflow run ${GITHUB_RUN_ID}. Repair head: ${{ steps.publish.outputs.head }}. UC-040 is bound as copyright provenance and UC-146 as free CC BY-SA 3.0 provenance. Candidate bytes, identity rulings, presentation rulings, crop rulings, duplicate rulings, and the evidence standard are unchanged."

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-010 portrait provenance repair failed closed on workflow run ${GITHUB_RUN_ID}. No twelve-object payment claim is authorized."

      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-010-portrait-kind-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-010-portrait-kind-preflight.json
            /tmp/COLLECT-010-portrait-kind-postgate.json
            /tmp/COLLECT-010-portrait-kind-repair.tree
            data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json
          if-no-files-found: warn
          retention-days: 30
