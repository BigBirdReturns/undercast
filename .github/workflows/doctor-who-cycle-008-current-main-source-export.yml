name: doctor-who-cycle-008-current-main-source-export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-current-main-source-export.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-008-current-main-source-export
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-current-main-source-export.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-current-main-source-export

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-current-main-source-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-file read-only carrier and canonical main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Export exact current-main source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "$EXACT_MAIN" | gzip -n > "$OUT/undercast-37d681f-source.tar.gz"
          git rev-parse "$EXACT_MAIN^{tree}" > "$OUT/main-tree.txt"
          git ls-tree -r --full-tree "$EXACT_MAIN" > "$OUT/ls-tree.txt"
          sha256sum "$OUT/ls-tree.txt" | awk '{print $1}' > "$OUT/ls-tree.sha256"
          sha256sum "$OUT/undercast-37d681f-source.tar.gz" > "$OUT/export.sha256"
          printf 'exact_main=%s\nmain_tree=%s\ntracked_paths=%s\narchive_bytes=%s\n' \
            "$EXACT_MAIN" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            "$(git ls-tree -r --name-only "$EXACT_MAIN" | wc -l)" \
            "$(wc -c < "$OUT/undercast-37d681f-source.tar.gz")" > "$OUT/custody.txt"

      - name: Upload exact current-main source export
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-current-main-source-export-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
