name: star-trek-anastasia-finalizer-recovery-v1

on:
  pull_request:
    types:
      - closed
    branches:
      - agent/star-trek-anastasia-cycle-v1
    paths:
      - .github/recovery/star-trek-anastasia-cycle-v1/finalizer-recovery.trigger

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: star-trek-anastasia-finalizer-recovery-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 97956ce415d565d968cc5f66067142183ec28a1f
  EXPECTED_TREE: ff8adadb6dd36ab84a21336bdd30ce3cb17b5335
  CARRIER_BRANCH: agent/star-trek-anastasia-cycle-v1
  CANDIDATE_BRANCH: agent/star-trek-anastasia-candidate-v1
  RECOVERY_TRIGGER_BRANCH: agent/anastasia-finalizer-recovery-trigger-pr-v1
  CANDIDATE_COMMIT: 9330681b10c681ff08c2889be18b47671ff47401
  CANDIDATE_TREE: a7f952e76600a148e99fe44fa694bb98ef1ea67b
  CANDIDATE_PATH_COUNT: '44'
  CANDIDATE_PATH_LEDGER_SHA256: 6374da8128b6d0047fa9e197760eb2976fe915cc6968b320b83bce0dd31e1b31
  TASK_ID: ap_82712ddec2c606e4c7d1a152
  WALL_ID: UC-1395
  LEASE_ID: lease_7d5e1311748aad6fae189b59
  SOURCE_FINGERPRINT: 8c45968f68d0b1afab3be38b612d0cee8a3c0ed1ae424cbc3ff51993aac39060
  CONTROLLER_SHA256: 2eaaa9de01ab5b529df6cf17183c72ad099fef1837177d5d5411365c1cf5f76d
  CONTROLLER_B64_SHA256: 523d20c4f656de45c5cff182694718f780f48c1153cb9fd2e3f4f3dc4359e2a8
  CONTROLLER: /tmp/star-trek-anastasia-controller-v1.mjs
  SOURCE_RUN: '32619140152'
  STAGE_ARTIFACT_ID: '9487851739'
  STAGE_ARTIFACT_DIGEST: 19046c8b4f9ef68d71628816184276e7f69fc98179ab9da9f635fd84efc2798e
  REVIEW_ARTIFACT_ID: '9487860916'
  REVIEW_ARTIFACT_DIGEST: 6712542cd1d77718c564663b0fd5d16b0f81654c3115c83dc0338c7cbc02b532
  REVIEW_SHA256: a981414aa4d8066d6bc6fdedae402a01a96bf1ee8a3476c2189e359d88d229d5
  MEDIA_RUN: '32609675555'
  MEDIA_ARTIFACT: '9485147987'
  MEDIA_DIGEST: c7e507c8e791204c96fa5c54cdf27cb15a113487785868df6d78cf09444f0bfb
  STAGE_ROOT: /tmp/star-trek-anastasia-stage-v1
  REVIEW_ROOT: /tmp/star-trek-anastasia-review-v1
  FINAL_ROOT: /tmp/star-trek-anastasia-final-v1

jobs:
  recover:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/star-trek-anastasia-cycle-v1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and verify sealed Anastasia controller
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-anastasia-cycle-v1/controller.mjs.gz.b64.part-* > /tmp/anastasia-controller.b64
          echo "$CONTROLLER_B64_SHA256  /tmp/anastasia-controller.b64" | sha256sum -c -
          base64 -d /tmp/anastasia-controller.b64 | gzip -d > "$CONTROLLER"
          echo "$CONTROLLER_SHA256  $CONTROLLER" | sha256sum -c -
          node --check "$CONTROLLER"

      - name: Verify canonical, candidate, and retained artifact custody
        shell: bash
        run: |
          set -Eeuo pipefail
          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          test "$(jq -r .sha <<<"$live")" = "$EXPECTED_MAIN"
          test "$(jq -r .commit.tree.sha <<<"$live")" = "$EXPECTED_TREE"
          test "$(jq -r '.parents | length' <<<"$live")" = 1
          test "$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | cut -f1)" = "$CANDIDATE_COMMIT"

          stage_meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STAGE_ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"$stage_meta")" = false
          test "$(jq -r .name <<<"$stage_meta")" = star-trek-anastasia-stage-v1
          test "${STAGE_ARTIFACT_DIGEST}" = "$(jq -r .digest <<<"$stage_meta" | sed 's/^sha256://')"
          test "$(jq -r .workflow_run.id <<<"$stage_meta")" = "$SOURCE_RUN"

          review_meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"$review_meta")" = false
          test "$(jq -r .name <<<"$review_meta")" = star-trek-anastasia-independent-review-v1
          test "${REVIEW_ARTIFACT_DIGEST}" = "$(jq -r .digest <<<"$review_meta" | sed 's/^sha256://')"
          test "$(jq -r .workflow_run.id <<<"$review_meta")" = "$SOURCE_RUN"

      - uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-stage-v1
          path: /tmp/star-trek-anastasia-stage-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32619140152

      - uses: actions/download-artifact@v4
        with:
          name: star-trek-anastasia-independent-review-v1
          path: /tmp/star-trek-anastasia-review-v1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32619140152

      - name: Verify exact stage and independent-review artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd "$STAGE_ROOT" && sha256sum -c manifest.sha256)
          (cd "$REVIEW_ROOT" && sha256sum -c manifest.sha256)
          test "$(jq -r .candidate.commit "$STAGE_ROOT/candidate-metadata.json")" = "$CANDIDATE_COMMIT"
          test "$(jq -r .candidate.tree "$STAGE_ROOT/candidate-metadata.json")" = "$CANDIDATE_TREE"
          test "$(jq -r .candidate.path_count "$STAGE_ROOT/candidate-metadata.json")" = "$CANDIDATE_PATH_COUNT"
          test "$(jq -r .candidate.path_ledger_sha256 "$STAGE_ROOT/candidate-metadata.json")" = "$CANDIDATE_PATH_LEDGER_SHA256"
          test "$(jq -r .task.id "$STAGE_ROOT/stage.json")" = "$TASK_ID"
          test "$(jq -r .task.source_fingerprint "$STAGE_ROOT/stage.json")" = "$SOURCE_FINGERPRINT"
          test "$(jq -r .wall_id "$STAGE_ROOT/stage.json")" = "$WALL_ID"
          test "$(jq -r .lease.id "$STAGE_ROOT/stage.json")" = "$LEASE_ID"
          test "$(jq -r .candidate.commit "$REVIEW_ROOT/independent-review.json")" = "$CANDIDATE_COMMIT"
          test "$(jq -r .review_sha256 "$REVIEW_ROOT/independent-review.json")" = "$REVIEW_SHA256"
          test "$(jq -r .verdict "$REVIEW_ROOT/independent-review.json")" = pass

      - name: Finalize reviewed candidate and refresh adapter baseline
        id: finalize
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --filter=blob:none --no-tags origin main "$CANDIDATE_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")" = "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          npm ci --ignore-scripts --no-audit --no-fund

          rm -rf "$FINAL_ROOT"
          mkdir -p "$FINAL_ROOT"
          STAGE_ROOT="$STAGE_ROOT" REVIEW_ROOT="$REVIEW_ROOT" FINAL_ROOT="$FINAL_ROOT" \
            EXPECTED_MAIN="$EXPECTED_MAIN" EXPECTED_TREE="$EXPECTED_TREE" MEDIA_CANONICAL_PARENT="$EXPECTED_MAIN" CANDIDATE_BRANCH="$CANDIDATE_BRANCH" \
            CANDIDATE_COMMIT="$CANDIDATE_COMMIT" CANDIDATE_TREE="$CANDIDATE_TREE" CANDIDATE_PATH_COUNT="$CANDIDATE_PATH_COUNT" CANDIDATE_PATH_LEDGER_SHA256="$CANDIDATE_PATH_LEDGER_SHA256" \
            STAGE_ARTIFACT_ID="$STAGE_ARTIFACT_ID" STAGE_ARTIFACT_DIGEST="$STAGE_ARTIFACT_DIGEST" REVIEW_ARTIFACT_ID="$REVIEW_ARTIFACT_ID" REVIEW_ARTIFACT_DIGEST="$REVIEW_ARTIFACT_DIGEST" \
            MEDIA_RUN="$MEDIA_RUN" MEDIA_ARTIFACT="$MEDIA_ARTIFACT" MEDIA_DIGEST="sha256:${MEDIA_DIGEST}" \
            node "$CONTROLLER" finalize | tee "$FINAL_ROOT/finalize.stdout.log"
          jq -e '.transaction=="STAR-TREK-ANASTASIA-KOMANANOV-FINALIZATION-V1" and .status=="qualified"' "$FINAL_ROOT/finalization.json" >/dev/null

          node scripts/census-adapter.mjs write | tee "$FINAL_ROOT/adapter-write.stdout.log"
          test -n "$(git status --porcelain -- data/review/adapter-sdk/BASELINE.json)"

          python3 - "$CANDIDATE_COMMIT" /tmp/anastasia-recovery-paths.z <<'PY'
          from pathlib import Path
          import subprocess, sys
          base, out = sys.argv[1], Path(sys.argv[2])
          paths = []
          for command in (
              ['git', 'diff', '--name-only', '-z', base],
              ['git', 'ls-files', '--others', '--exclude-standard', '-z'],
          ):
              paths.extend(p.decode() for p in subprocess.check_output(command).split(b'\0') if p)
          paths = sorted(set(paths))
          if not paths:
              raise SystemExit('Anastasia recovery produced no finalizer changes')
          blocked = [p for p in paths if p.startswith(('.github/', 'transport/', '.luna/'))]
          if blocked:
              raise SystemExit('Anastasia recovery escaped product scope: ' + ', '.join(blocked))
          out.write_bytes(b'\0'.join(p.encode() for p in paths) + b'\0')
          PY
          while IFS= read -r -d '' file; do git add -- "$file"; done < /tmp/anastasia-recovery-paths.z
          test -n "$(git diff --cached --name-only)"
          git config user.name undercast-star-trek-anastasia-recovery-publisher
          git config user.email star-trek-anastasia-recovery-publisher@users.noreply.github.com
          product_tree="$(git write-tree)"
          product_commit="$(printf '%s\n' 'Star Trek: publish Anastasia Komananov cycle' | git commit-tree "$product_tree" -p "$EXPECTED_MAIN")"
          test "$(git rev-parse "${product_commit}^{tree}")" = "$product_tree"
          test "$(git rev-parse "${product_commit}^")" = "$EXPECTED_MAIN"
          git diff --name-only "$EXPECTED_MAIN" "$product_commit" | LC_ALL=C sort -u > "$FINAL_ROOT/product-paths.txt"
          test -z "$(grep -E '^(\.github/|transport/)' "$FINAL_ROOT/product-paths.txt" || true)"
          test "$(grep -c '^data/review/adapter-sdk/star-trek-anastasia-komananov-cycle.json$' "$FINAL_ROOT/product-paths.txt")" = 1
          test "$(grep -c '^scripts/star-trek-anastasia-komananov-cycle.mjs$' "$FINAL_ROOT/product-paths.txt")" = 1
          test "$(grep -c '^data/review/adapter-sdk/BASELINE.json$' "$FINAL_ROOT/product-paths.txt")" = 1
          test "$(grep -c '^images/uc-1395-still.jpg$' "$FINAL_ROOT/product-paths.txt")" = 1
          test "$(grep -c '^images/uc-1395-portrait.jpg$' "$FINAL_ROOT/product-paths.txt")" = 1
          product_path_count="$(wc -l < "$FINAL_ROOT/product-paths.txt" | tr -d ' ')"
          product_path_ledger_sha256="$(sha256sum "$FINAL_ROOT/product-paths.txt" | cut -d' ' -f1)"

          git checkout --detach "$product_commit"
          node scripts/star-trek-anastasia-komananov-cycle.mjs
          node scripts/star-trek-queen-of-hearts-cycle.mjs
          node scripts/thesis-rails.mjs validate
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/waterline.mjs validate
          node scripts/corpus-ops.mjs validate
          node scripts/validate.mjs
          node scripts/gate.mjs --skip-rendered
          test -z "$(git status --porcelain)"

          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$live" = "$EXPECTED_MAIN"
          git push origin "${product_commit}:refs/heads/main"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$product_commit"

          dispatch_epoch="$(date -u +%s)"
          gh workflow run pages.yml --ref main
          pages_run=''
          for _ in $(seq 1 180); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&event=workflow_dispatch&per_page=30")"
            pages_run="$(jq -r --arg sha "$product_commit" --argjson epoch "$dispatch_epoch" '[.workflow_runs[] | select(.head_sha==$sha and ((.created_at|fromdateiso8601) >= $epoch))] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
            if test -n "$pages_run"; then
              status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${pages_run}" --jq .status)"
              if test "$status" = completed; then
                test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${pages_run}" --jq .conclusion)" = success
                break
              fi
            fi
            sleep 5
          done
          test -n "$pages_run"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${pages_run}" --jq .conclusion)" = success

          jq -n \
            --arg product_commit "$product_commit" \
            --arg product_tree "$product_tree" \
            --argjson product_path_count "$product_path_count" \
            --arg product_path_ledger_sha256 "$product_path_ledger_sha256" \
            --argjson pages_run "$pages_run" \
            --arg receipt_sha256 "$(jq -r .receipt_sha256 "$FINAL_ROOT/receipt.json")" \
            --arg checker_sha256 "$(jq -r .checker_sha256 "$FINAL_ROOT/finalization.json")" \
            --arg reviewed_cycle "$(jq -r .reviewed_cycle "$FINAL_ROOT/finalization.json")" \
            --arg next_task "$(jq -r .next.task_id "$FINAL_ROOT/finalization.json")" \
            '{version:1,transaction:"STAR-TREK-ANASTASIA-KOMANANOV-RECOVERY-TERMINAL-V1",status:"published",product_commit:$product_commit,product_tree:$product_tree,product_path_count:$product_path_count,product_path_ledger_sha256:$product_path_ledger_sha256,pages_run:$pages_run,receipt_sha256:$receipt_sha256,checker_sha256:$checker_sha256,reviewed_cycle:$reviewed_cycle,next_task:$next_task,reused_candidate:true,reused_independent_review:true,additional_lease_issued:false,adapter_baseline_refreshed:true}' \
            > "$FINAL_ROOT/terminal.json"
          cp data/review/adapter-sdk/star-trek-anastasia-komananov-cycle.json "$FINAL_ROOT/canonical-receipt.json"
          cp scripts/star-trek-anastasia-komananov-cycle.mjs "$FINAL_ROOT/canonical-checker.mjs"
          echo "product_commit=$product_commit" >> "$GITHUB_OUTPUT"
          echo "pages_run=$pages_run" >> "$GITHUB_OUTPUT"

      - name: Retire exact temporary Anastasia execution refs
        shell: bash
        run: |
          set -Eeuo pipefail
          refs=(
            "$CANDIDATE_BRANCH"
            "$CARRIER_BRANCH"
            "$RECOVERY_TRIGGER_BRANCH"
            agent/anastasia-cycle-trigger-pr-v1
            agent/anastasia-installer-trigger-pr-v1
            agent/anastasia-installer-trigger-pr-v2
            agent/anastasia-workflow-blob-trigger-pr-v3
            agent/anastasia-workflow-blob-trigger-pr-v4
          )
          for branch in "${refs[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
          for _ in $(seq 1 30); do
            remaining=''
            for branch in "${refs[@]}"; do
              remaining+="$(git ls-remote --heads origin "refs/heads/${branch}")"
            done
            test -z "$remaining" && break
            sleep 2
          done
          remaining=''
          for branch in "${refs[@]}"; do
            remaining+="$(git ls-remote --heads origin "refs/heads/${branch}")"
          done
          test -z "$remaining"
          jq -n --arg status complete --arg product_commit "${{ steps.finalize.outputs.product_commit }}" --argjson temporary_refs_remaining 0 '{version:1,transaction:"STAR-TREK-ANASTASIA-RECOVERY-CLEANUP-V1",status:$status,product_commit:$product_commit,temporary_refs_remaining:$temporary_refs_remaining,preserved_media_evidence_refs:true}' > "$FINAL_ROOT/cleanup.json"
          (cd "$FINAL_ROOT" && find . -maxdepth 1 -type f ! -name manifest.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done > manifest.sha256 && sha256sum -c manifest.sha256)

      - name: Upload terminal Anastasia recovery execution
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-terminal-recovery-v1
          path: /tmp/star-trek-anastasia-final-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve recovery failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-anastasia-recovery-failure-${{ github.run_id }}
          path: |
            /tmp/star-trek-anastasia-stage-v1/
            /tmp/star-trek-anastasia-review-v1/
            /tmp/star-trek-anastasia-final-v1/
            /tmp/star-trek-anastasia-controller-v1.mjs
          if-no-files-found: warn
          retention-days: 30
