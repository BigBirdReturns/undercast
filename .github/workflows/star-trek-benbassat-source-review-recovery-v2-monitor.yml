name: star-trek-benbassat-source-review-recovery-v2-monitor

on:
  push:
    branches:
      - agent/star-trek-benbassat-source-review-recovery-v2-monitor

permissions:
  actions: read
  contents: write

env:
  TARGET_BRANCH: agent/star-trek-benbassat-source-review-recovery-v2
  TARGET_HEAD: ff28f1d7712bef9a7431ceffcb55119b8522e6ea
  TARGET_WORKFLOW: star-trek-benbassat-source-review-recovery-v2
  TARGET_RESULT_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  RESULT_BRANCH: agent/star-trek-benbassat-source-review-recovery-v2-monitor-result
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  OUT: /tmp/star-trek-benbassat-source-review-recovery-v2-monitor

jobs:
  monitor:
    name: monitor-corrected-benbassat-source-review
    if: ${{ github.event.head_commit.message == 'Monitor Benbassat source review recovery v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture exact target workflow state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          run_id=''; status=''; found=false
          for _ in $(seq 1 120); do
            gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f branch="$TARGET_BRANCH" -f per_page=100 > "$OUT/runs.json"
            run_id="$(jq -r --arg name "$TARGET_WORKFLOW" --arg sha "$TARGET_HEAD" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha)] | sort_by(.id) | last.id // empty' "$OUT/runs.json")"
            if test -n "$run_id"; then
              found=true
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$OUT/run.json"
              status="$(jq -r .status "$OUT/run.json")"
              test "$status" = completed && break
            fi
            sleep 5
          done
          if test "$found" = true; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "$OUT/jobs.json"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$OUT/artifacts.json"
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$OUT/run.log" 2>&1 || true
          else
            printf '{"jobs":[]}\n' > "$OUT/jobs.json"
            printf '{"artifacts":[],"total_count":0}\n' > "$OUT/artifacts.json"
            printf 'No workflow run was registered for the exact target head.\n' > "$OUT/run.log"
          fi
          main="$(gh api "/repos/${GITHUB_REPOSITORY}/branches/main")"; test "$(jq -r .commit.sha <<<"$main")" = "$EXPECTED_MAIN"; printf '%s\n' "$main" | jq . > "$OUT/main.json"
          git ls-remote --heads origin "refs/heads/${TARGET_RESULT_BRANCH}" > "$OUT/target-result-ref.txt"
          jq -n --arg transaction STAR-TREK-BENBASSAT-SOURCE-REVIEW-RECOVERY-V2-MONITOR --argjson found "$found" --arg run_id "$run_id" --arg status "$status" --arg conclusion "$(test -f "$OUT/run.json" && jq -r .conclusion "$OUT/run.json" || echo '')" --arg target_result_ref "$(cat "$OUT/target-result-ref.txt")" --arg canonical "$EXPECTED_MAIN" '{version:1,transaction:$transaction,workflow_registered:$found,run:{id:$run_id,status:$status,conclusion:$conclusion},target_result_ref:$target_result_ref,canonical:{commit:$canonical},canonical_mutation:false,lease_mutation:false}' > "$OUT/status.json"
      - name: Publish monitor result
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git config user.name undercast-benbassat-source-review-v2-monitor
          git config user.email undercast-benbassat-source-review-v2-monitor@users.noreply.github.com
          git checkout --orphan benbassat-source-review-v2-monitor-result
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-benbassat-source-review-recovery-v2-monitor
          cp -a "$OUT"/. transport/star-trek-benbassat-source-review-recovery-v2-monitor/
          git add transport/star-trek-benbassat-source-review-recovery-v2-monitor
          git commit -m 'Record Benbassat source-review recovery v2 monitor'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
