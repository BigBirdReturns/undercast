name: apply-doctor-who-activation-001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-doctor-who-activation-001.yml"

permissions:
  contents: write

concurrency:
  group: apply-doctor-who-activation-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  AUTHORIZED_CLEAN_HEAD: 79362e21d9d526f1310467574e69fe909eb80adb
  SELF: .github/workflows/apply-doctor-who-activation-001.yml
  PATCHER: scripts/apply-doctor-who-global-cycle-receipt.py

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact repair denominator and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          git merge-base --is-ancestor "$AUTHORIZED_CLEAN_HEAD" HEAD

          printf '%s\n' "$SELF" "$PATCHER" | sort > /tmp/expected-start-paths.txt
          git diff --name-only "$AUTHORIZED_CLEAN_HEAD...HEAD" | sort > /tmp/actual-start-paths.txt
          diff -u /tmp/expected-start-paths.txt /tmp/actual-start-paths.txt

      - name: Apply global cycle-through-receipt custody and focused proof
        run: |
          set -euo pipefail
          python "$PATCHER"
          node --check scripts/lib/waterline.mjs
          node --check scripts/waterline-fixtures.mjs
          node --check scripts/doctor-who-activation.mjs
          node scripts/waterline-fixtures.mjs
          node scripts/metric-readiness-fixtures.mjs
          node scripts/corpus-ops-fixtures.mjs
          node scripts/doctor-who-activation.mjs check

      - name: Stage durable repair and run complete candidate gate
        run: |
          set -euo pipefail
          git add \
            data/review/adapter-sdk/doctor-who-activation-001.json \
            docs/AUTOPILOT.md \
            scripts/doctor-who-activation.mjs \
            scripts/lib/waterline.mjs \
            scripts/waterline-fixtures.mjs
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/doctor-who-global-cycle-candidate-gate.log

      - name: Retire temporary authority and run complete final-tree gate
        run: |
          set -euo pipefail
          git rm "$SELF" "$PATCHER"
          git diff --cached --check
          node scripts/waterline-fixtures.mjs
          node scripts/metric-readiness-fixtures.mjs
          node scripts/corpus-ops-fixtures.mjs
          node scripts/doctor-who-activation.mjs check
          npm run gate 2>&1 | tee /tmp/doctor-who-global-cycle-final-gate.log

      - name: Publish exact workflow-free repair under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Activation: hold the global cycle through reviewed receipt' \
            -m 'block cross-scope claims after terminal task handling until the exact lease is receipted'
          new_head="$(git rev-parse HEAD)"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/review/adapter-sdk/doctor-who-activation-001.json
          docs/AUTOPILOT.md
          scripts/doctor-who-activation.mjs
          scripts/lib/waterline.mjs
          scripts/waterline-fixtures.mjs
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload receipt-custody repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-global-cycle-receipt-${{ github.run_id }}
          path: |
            /tmp/expected-start-paths.txt
            /tmp/actual-start-paths.txt
            /tmp/doctor-who-global-cycle-candidate-gate.log
            /tmp/doctor-who-global-cycle-final-gate.log
            /tmp/final-paths.txt
            data/review/adapter-sdk/doctor-who-activation-001.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
