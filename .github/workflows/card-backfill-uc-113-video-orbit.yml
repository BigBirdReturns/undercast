name: card-backfill-uc-113-video-orbit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-113-VIDEO-ORBIT.json"
      - "scripts/card-backfill-uc-113-video-orbit.mjs"
      - ".github/workflows/card-backfill-uc-113-video-orbit.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-113-video-orbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  orbit:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-025'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-025
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-113 video-orbit authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-113-VIDEO-ORBIT.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-113');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-113');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1d34489d543c01ca6616d57a');
          if(row.version!==1||row.record_id!=='UC-113'||row.actor!=='Taika Waititi'||row.character!=='Korg'||row.production!=='Thor: Ragnarok'||row.year!==2017||row.side!=='still')throw new Error('UC-113 video-orbit authorization drift');
          if(row.discovery_checkpoint?.artifact_id!==8676847359||row.discovery_checkpoint?.head_sha!=='607c3ee8cf7e5d53f44513a157dd7136d8fe4285'||row.discovery_checkpoint?.rejected_thumbnail_sha256!=='c53983eb193bae23bb37d440224fe2e6e38a5cefea23a820d58794c2b3acbc16')throw new Error('UC-113 rejected-thumbnail custody drift');
          if(row.failed_video_orbit_checkpoints?.length!==2||row.failed_video_orbit_checkpoints[0]?.artifact_id!==8676934325||row.failed_video_orbit_checkpoints[1]?.artifact_id!==8676993291)throw new Error('UC-113 failed video-orbit custody drift');
          if(row.video_page?.provider!=='Marvel'||row.video_page?.expected_duration_seconds!==45||row.sample_times_seconds?.length!==16||row.minimum_sample_frames!==10)throw new Error('UC-113 video denominator drift');
          if(row.selection_contract?.official_marvel_video_required!==true||row.selection_contract?.completed_korg_frame_required!==true||row.selection_contract?.performance_capture_thumbnail_rejected!==true||row.selection_contract?.character_frame_and_actor_role_custody_separate!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-113 video selection contract drift');
          if(!specimen||specimen.actor!=='Taika Waititi'||specimen.character!=='Korg'||specimen.production!=='Thor: Ragnarok'||specimen.years!=='2017'||specimen.still)throw new Error('UC-113 specimen boundary drift');
          if(source?.still)throw new Error('UC-113 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-113'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-113 audit boundary drift');
          console.log('PASS — exact UC-113 official Marvel video frame orbit repair v3 authorized');
          NODE
      - name: Repair Marvel hydration and player activation in isolated working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-113-video-orbit.mjs scripts/.card-backfill-uc-113-video-orbit-run.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-113-video-orbit-run.mjs')
          text=path.read_text()
          old_hydration="""  const page = await context.newPage();
            const response = await page.goto(control.video_page.url, { waitUntil: 'domcontentloaded', timeout: control.transport_timeout_ms });
            await page.waitForTimeout(1800);
            await acceptBanners(page);
            const body = await page.locator('body').innerText().catch(() => '');
            const hay = norm(body);
            const missing = control.video_page.required_terms.filter(term => !hay.includes(norm(term)));"""
          new_hydration="""  const page = await context.newPage();
            let response = await page.goto(control.video_page.url, { waitUntil: 'domcontentloaded', timeout: control.transport_timeout_ms });
            await page.waitForTimeout(1800);
            await acceptBanners(page);
            let body = '';
            let missing = [...control.video_page.required_terms];
            for (let attempt = 0; attempt < 12; attempt++) {
              await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
              for (let index = 0; index < 4; index++) {
                await page.mouse.wheel(0, 1200);
                await page.waitForTimeout(180);
              }
              body = await page.locator('body').innerText().catch(() => '');
              const html = await page.content().catch(() => '');
              const hay = norm(`${body} ${html}`);
              missing = control.video_page.required_terms.filter(term => !hay.includes(norm(term)));
              if (!missing.length) break;
              if (attempt === 5) {
                response = await page.reload({ waitUntil: 'domcontentloaded', timeout: control.transport_timeout_ms }).catch(() => response);
                await page.waitForTimeout(1800);
                await acceptBanners(page);
              }
              await page.waitForTimeout(1000);
            }"""
          old_player="""  const located = await locateVideo(page);
            const initialVideo = await prepareVideo(located.video);
            assert(initialVideo.video_width >= 640 && initialVideo.video_height >= 360, `official Marvel video geometry drift ${initialVideo.video_width}x${initialVideo.video_height}`);"""
          new_player="""  const mainPoster = page.locator('img[src*="poster_5793447558001"]').first();
            let mainPosterClicked = false;
            if (await mainPoster.count().catch(() => 0)) {
              await mainPoster.scrollIntoViewIfNeeded().catch(() => {});
              const box = await mainPoster.boundingBox().catch(() => null);
              if (box) {
                await page.mouse.click(box.x + box.width / 2, box.y + box.height / 2);
                mainPosterClicked = true;
                await page.waitForTimeout(2200);
              }
            }
            await clickPlay(page);
            await page.waitForTimeout(2200);
            const located = await locateVideo(page);
            const initialVideo = await prepareVideo(located.video);
            const videoAttributes = await located.video.evaluate(element => ({
              src: element.getAttribute('src') || '',
              current_src: element.currentSrc || '',
              poster: element.poster || '',
              ready_state: element.readyState,
              network_state: element.networkState,
              paused: element.paused,
              ended: element.ended,
              error: element.error ? { code: element.error.code, message: element.error.message || '' } : null
            }));
            await writeJson(join(OUT, 'video-probe.json'), {
              main_poster_clicked: mainPosterClicked,
              frame_url: located.frame.url(),
              frame_index: located.index,
              initial_video: initialVideo,
              video_attributes: videoAttributes,
              frame_urls: page.frames().map(frame => frame.url())
            });
            assert(initialVideo.video_width >= 640 && initialVideo.video_height >= 360, `official Marvel video geometry drift ${initialVideo.video_width}x${initialVideo.video_height}`);"""
          if old_hydration not in text:
              raise SystemExit('UC-113 hydration repair anchor missing')
          if old_player not in text:
              raise SystemExit('UC-113 player activation repair anchor missing')
          text=text.replace(old_hydration,new_hydration,1).replace(old_player,new_player,1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-113-video-orbit-run.mjs
      - name: Sample the official Finding Korg video at fixed timestamps
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-113-video-orbit
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-113-video-orbit-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-113-video-orbit-run.log"
          rm scripts/.card-backfill-uc-113-video-orbit-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official video frames, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-113-video-orbit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-113-video-orbit
            ${{ runner.temp }}/card-backfill-uc-113-video-orbit-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
