name: doctor-who-cycle-010-merx-final-review-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-review-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-review-v4
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-review-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      MAIN_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      BRANCH: agent/doctor-who-cycle-010-merx-final-review-v4
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-review-v4.yml
      OUT: /tmp/doctor-who-cycle-010-merx-final-review-v4
      SOURCE: /tmp/doctor-who-cycle-010-merx-final-review-v4-source
      WORKTREE: /tmp/doctor-who-cycle-010-merx-final-review-v4-worktree
      SOURCE_PR: "733"
      SOURCE_HEAD: 881d842c726806f504d127f55c076e3cac1c2a48
      SOURCE_RUN: "31296497918"
      SOURCE_JOB: "93202315133"
      SOURCE_ARTIFACT: "9033129375"
      SOURCE_ZIP_SHA256: 68b856c3798005b3ac14c64b51259086ed8aff3723b6fa1e3b555de5012972c2
      SOURCE_QUALIFICATION_ID: a5128c75241f5ebb1ad7741c259d54d38d5df28d528be485bce886a6518a2e2f
      PRODUCT_COMMIT: 3e0af3953c4950047944608ae71bb5992c7dedfb
      PRODUCT_TREE: d00688b092cf91de09bc14505a92f0178aafae0c
      PRODUCT_PATHS: "50"
      PRODUCT_BUNDLE_SHA256: f4897f23973bf81e7f35ca09f2915599372c3343e16285b7f079774faf5ef645
      PRODUCT_TAR_SHA256: 08d604ba1d503ac0be0ecd079350bd6ad3becaae2b32ff9d65cfe3d0e214c9ec
      PRODUCT_PATCH_SHA256: dc89e52ad024c9efb0cdbcc8fb426b844f2169a8069001e69b9da61c2ee59a97
      FILE_MANIFEST_SHA256: b91d4ed69851b88af1209f584cd695102ff62481a3697455657ccdaf517ed834
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      FAILED_REVIEW_PR: "736"
      FAILED_REVIEW_HEAD: 79fd951a04eda483a6678fc14937968756a37014
      FAILED_REVIEW_RUN: "31296967172"
      FAILED_REVIEW_JOB: "93203551613"
      FAILED_REVIEW_ARTIFACT: "9033265083"
      FAILED_REVIEW_DIGEST: sha256:f857c4ae02150584eb3ad548e585cab96631749080b220b8c113a52a1e9749f8
      CONTROL: /tmp/doctor-who-cycle-010-merx-final-review-v4-control
      RUNNER_B64_SHA256: 743b713f9c295881d14ba093e2efd9d9aac9b76e4b9a084d2eed3104948bea5b
      RUNNER_GZIP_SHA256: 692329dffc14a9b13a4f823c187472927ffdcf8896529bf98ef1429327a64b46
      RUNNER_SHA256: e5068ede4052eb1aabc53f6ae597e229c25c9502ce7698397ee6cf3ea5e36e5d
      RUNNER_BYTES: "16488"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and compile exact independent reviewer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          : > "$CONTROL/runner.sh.gz.b64"
          for blob in \
            545387adf9b9a1cf6d98280944c1880e2b66dbd6 \
            d2b734b28f88ecfcacef6470c796d3cac76bad6a \
            edeb98bd07970a0746d3485b3db5f518b9fe0594; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$CONTROL/runner.sh.gz.b64"
          done
          test "$(sha256sum "$CONTROL/runner.sh.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$CONTROL/runner.sh.gz.b64" > "$CONTROL/runner.sh.gz"
          test "$(sha256sum "$CONTROL/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$CONTROL/runner.sh.gz" > "$CONTROL/runner.sh"
          test "$(wc -c < "$CONTROL/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$CONTROL/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$CONTROL/runner.sh"
          RUNNER="$CONTROL/runner.sh" python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          text=Path(os.environ['RUNNER']).read_text()
          blocks=list(re.finditer(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",text,re.S))
          assert len(blocks)==4
          for i,match in enumerate(blocks):
              compile(textwrap.dedent(match.group(1)),f'<embedded-{i}>','exec')
          PY

      - name: Execute exact independent Merx final-product review
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$CONTROL/runner.sh"
          exec "$CONTROL/runner.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-review-v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-review-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-review-v4
            /tmp/doctor-who-cycle-010-merx-final-review-v4-source
            /tmp/doctor-who-cycle-010-merx-final-review-v4-control
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
