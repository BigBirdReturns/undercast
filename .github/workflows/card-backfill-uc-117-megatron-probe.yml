name: card-backfill-uc-117-megatron-probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-117-MEGATRON-PROBE.json"
      - "scripts/card-backfill-uc-117-megatron-probe.mjs"
      - ".github/workflows/card-backfill-uc-117-megatron-probe.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-117-megatron-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-027'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-027
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify exact UC-117 Megatron probe authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-117-MEGATRON-PROBE.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-117');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-117');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_e34d57677891f2a69d198694');
          if(row.version!==1||row.record_id!=='UC-117'||row.role_key!=='megatron'||row.actor!=='Frank Welker'||row.character!=='Megatron'||row.continuity!=='Generation 1 cartoon continuity')throw new Error('UC-117 probe authorization drift');
          if(row.requested_title!=='Megatron (G1)/Generation 1 cartoon continuity'||row.api_bases?.length!==3||row.page_routes?.length!==8||row.required_signals?.length!==4)throw new Error('UC-117 probe denominator drift');
          if(row.failed_discovery_checkpoint?.artifact_id!==8692380398||row.failed_discovery_checkpoint?.head_sha!=='c8e446eb487e6f00960ef2adace1fcca2786af2d'||row.failed_discovery_checkpoint?.artifact_digest_sha256!=='49141093a91d6a189b673c90ca2df2f1cd34ee574dfb1d960fdda17bdad88ba0')throw new Error('UC-117 probe custody drift');
          if(!specimen||specimen.actor!=='Frank Welker'||specimen.character!=='Megatron & Scooby-Doo'||specimen.still)throw new Error('UC-117 specimen boundary drift');
          if(source?.still)throw new Error('UC-117 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-117'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-117 audit boundary drift');
          if(row.canonical_mutation!==false)throw new Error('UC-117 probe mutation drift');
          console.log(`PASS — UC-117 Megatron probe control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Probe TFWiki exact-title transports
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-117-megatron-probe
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-117-megatron-probe.mjs
          node scripts/card-backfill-uc-117-megatron-probe.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-117-megatron-probe-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact route responses, browser receipts, and transport ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-117-megatron-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-117-megatron-probe
            ${{ runner.temp }}/card-backfill-uc-117-megatron-probe-run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
