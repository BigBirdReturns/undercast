name: finalize-doctor-who-cycle-007-v8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/finalize-doctor-who-cycle-007-v8.yml"
      - "tmp/finalize-doctor-who-cycle-007-v8.sh.xz.b64"
      - "tmp/apply-doctor-who-cycle-finalize-007-review-rebind.mjs.xz.b64"
      - "tmp/doctor-who-cycle-007-v8-05-final-gate-review-bound.sh"

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-doctor-who-cycle-007-v8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_BASE_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  PUBLICATION_MAIN: 008f4bd0c89b888042f07c2ab31ceb643bb6c1eb
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  FINALIZER_BRANCH: agent/doctor-who-cycle-007-v8-finalizer-v1
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-completion-v8
  CANDIDATE_BRANCH: agent/doctor-who-cycle-007-v8-materializer
  CANDIDATE_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  REVIEWED_CANDIDATE_COMMIT: 1bac55a7cd06e64840c79d42924472a0e0c6910e
  REVIEWED_CANDIDATE_TREE: 121ecef1c981e6da2048450902721e336c051138
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_SHA256: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT_NAME: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_SHA256: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  INDEPENDENT_REVIEW_CARRIER_HEAD: 242819495ad4f85df4e8784f223a653f5c36668a
  INDEPENDENT_REVIEW_RUN: "31066145495"
  INDEPENDENT_REVIEW_JOB: "92504162223"
  INDEPENDENT_REVIEW_ARTIFACT_NAME: doctor-who-cycle-007-independent-review-31066145495
  INDEPENDENT_REVIEW_ARTIFACT_ID: "8953892152"
  INDEPENDENT_REVIEW_ARTIFACT_SHA256: 379e0e1837beda9b9031f814ecbc136edd5065400c59184929f334aa82c192f5
  INDEPENDENT_REVIEW_RECEIPT_SHA256: fd00947e2d6adca2a6bf558c667d93c96e8c3cf4fcdc31071b1343ecd2ae83c5
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  SELF: .github/workflows/finalize-doctor-who-cycle-007-v8.yml
  SCRIPT_SOURCE: tmp/finalize-doctor-who-cycle-007-v8.sh.xz.b64
  SCRIPT_ARCHIVE_SHA256: 5f367e889e41dd59b6f0a5cb0f772d7c051f56348bccc171209fc836a8559d19
  SCRIPT_SHA256: e49bde3c34e58dd8018e3d45a53749f6a44d18472c14b1715cc3c475dc3e05cf
  PATCHED_FINALIZER_ARCHIVE_TRACKED: tmp/apply-doctor-who-cycle-finalize-007-review-rebind.mjs.xz.b64
  FINAL_GATE_OVERRIDE_TRACKED: tmp/doctor-who-cycle-007-v8-05-final-gate-review-bound.sh
  PATCHED_FINALIZER_ARCHIVE_SOURCE: /tmp/apply-doctor-who-cycle-finalize-007-review-rebind.mjs.xz.b64
  FINAL_GATE_OVERRIDE_SOURCE: /tmp/doctor-who-cycle-007-v8-05-final-gate-review-bound.sh
  ROOT: /tmp/doctor-who-cycle-007-v8-finalization
  OUT: /tmp/doctor-who-cycle-007-v8-finalization/out
  CANDIDATE_DIR: /tmp/doctor-who-cycle-007-v8-finalization/candidate
  DIAGNOSTICS_DIR: /tmp/doctor-who-cycle-007-v8-finalization/diagnostics
  REVIEW_DIR: /tmp/doctor-who-cycle-007-v8-finalization/review
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-v8-finalization/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-v8-finalization/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-v8-finalization/diagnostics/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-v8-finalization/diagnostics/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-v8-finalization/diagnostics/media-review
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-finalizer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          timeout 180s npx playwright install chromium
          if ! command -v identify >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get update -o Acquire::Retries=3 >/dev/null
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180s apt-get install -y --no-install-recommends imagemagick >/dev/null
          fi
          identify -version | head -1

      - name: Download immutable reviewed candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Download immutable reviewed candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT_NAME }}
          path: ${{ env.DIAGNOSTICS_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Download immutable independent candidate-review receipt
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.INDEPENDENT_REVIEW_ARTIFACT_NAME }}
          path: ${{ env.REVIEW_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.INDEPENDENT_REVIEW_RUN }}

      - name: Reconstruct, receipt, and completely gate the workflow-free product
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SCRIPT_SOURCE" | awk '{print $1}')" = "$SCRIPT_ARCHIVE_SHA256"
          base64 --decode "$SCRIPT_SOURCE" | xz --decompress > /tmp/finalize-doctor-who-cycle-007-v8.sh
          test "$(sha256sum /tmp/finalize-doctor-who-cycle-007-v8.sh | awk '{print $1}')" = "$SCRIPT_SHA256"
          chmod 0755 /tmp/finalize-doctor-who-cycle-007-v8.sh
          cp tmp/apply-doctor-who-cycle-finalize-007-review-rebind.mjs.xz.b64 "$PATCHED_FINALIZER_ARCHIVE_SOURCE"
          cp tmp/doctor-who-cycle-007-v8-05-final-gate-review-bound.sh "$FINAL_GATE_OVERRIDE_SOURCE"
          chmod 0644 "$PATCHED_FINALIZER_ARCHIVE_SOURCE"
          chmod 0755 "$FINAL_GATE_OVERRIDE_SOURCE"
          /tmp/finalize-doctor-who-cycle-007-v8.sh

      - name: Upload exact receipt-bearing final product evidence
        id: final-upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-final-product-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.OUT }}
            ${{ env.CYCLE_CONTEXT }}
            data/review/adapter-sdk/doctor-who-cycle-007-kragar.json
            data/review/adapter-sdk/doctor-who-cycle-007-kragar-independent-candidate-review.json
            scripts/doctor-who-cycle-007.mjs

      - name: Publish only the exact workflow-free product branch
        shell: bash
        env:
          FINAL_ARTIFACT_ID: ${{ steps.final-upload.outputs.artifact-id }}
          FINAL_ARTIFACT_DIGEST: ${{ steps.final-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          final="$(cat "$OUT/final-commit.txt")"
          test "$(git rev-parse HEAD)" = "$final"
          test -n "$FINAL_ARTIFACT_ID"
          test -n "$FINAL_ARTIFACT_DIGEST"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$PUBLICATION_MAIN"
          remote="$(git ls-remote --heads origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test -z "$remote" || test "$remote" = "$final"
          if test -z "$remote"; then
            git push origin "$final:refs/heads/${PRODUCT_BRANCH}"
          fi
          test "$(git ls-remote --heads origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')" = "$final"
          digest="${FINAL_ARTIFACT_DIGEST#sha256:}"
          printf 'product_branch=%s\nfinal_commit=%s\nfinal_tree=%s\nfinal_gate_sha256=%s\nfinal_artifact_id=%s\nfinal_artifact_sha256=%s\n' \
            "$PRODUCT_BRANCH" "$final" "$(cat "$OUT/final-tree.txt")" "$(cat "$OUT/final-gate.sha256")" "$FINAL_ARTIFACT_ID" "$digest" \
            > "$OUT/publication-custody.txt"

      - name: Upload immutable publication custody
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-publication-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.OUT }}/publication-custody.txt
            ${{ env.OUT }}/finalization-authority.json
            ${{ env.OUT }}/finalization-authority.sha256
            ${{ env.OUT }}/final-summary.txt
