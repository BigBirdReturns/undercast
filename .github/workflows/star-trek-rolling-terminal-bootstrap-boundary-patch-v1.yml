name: star-trek-rolling-terminal-bootstrap-boundary-patch-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-terminal-bootstrap-boundary-patch-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bind an empty bootstrap predecessor to independently read main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/star-trek-rolling-terminal-v1.yml')
          text=path.read_text()
          old='          expected="$(jq -r .expected_predecessor "$ROOT/state.json")"\n          test "$live_sha" = "$expected"\n'
          new='          expected="$(jq -r \' .expected_predecessor // empty \' "$ROOT/state.json")"\n          test -n "$expected" || expected="$live_sha"\n          test "$live_sha" = "$expected"\n'
          # Normalize spaces introduced only to protect nested quoting.
          new=new.replace("jq -r ' .expected", "jq -r '.expected").replace("empty ' \"", "empty' \"")
          if old not in text: raise SystemExit('terminal bootstrap predecessor pattern drifted')
          path.write_text(text.replace(old,new,1))
          PY
          git diff --check
          git config user.name undercast-star-trek-terminal-bootstrap-patcher
          git config user.email terminal-bootstrap-patcher@users.noreply.github.com
          git add -- .github/workflows/star-trek-rolling-terminal-v1.yml
          git rm -- .github/workflows/star-trek-rolling-terminal-bootstrap-boundary-patch-v1.yml
          git commit -m 'Star Trek rolling continuation: seal empty bootstrap predecessor boundary'
          git push origin HEAD:agent/star-trek-rolling-continuation-v1
