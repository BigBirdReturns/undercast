name: doctor-who-cycle-012-media-census-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v3
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BLOBS: "bd29483411ccca1e1c33fb42c459ab604002e49e 73a699b70db3dc8585c7d4042a862fc32d06fd93 b1848706cd7358a18e74d295f840bf069cd38907"
      CARRIER_B64_BYTES: "8124"
      CARRIER_B64_SHA256: 0349416903c8d375b0e5b6b680c7b3ce2ba19f0c9d406dc73fbceee7dbed6060
      CARRIER_GZIP_BYTES: "6091"
      CARRIER_GZIP_SHA256: 0f3bc52d1accd82c6db373d1180ac12c89479f823de3845eb060330942a6bf64
      CARRIER_BYTES: "20766"
      CARRIER_SHA256: 662f2defb885d6e001cfe7eb0f1d12fcd47028115550f0df36c851f64f0d2e84
      CARRIER_ROOT: /tmp/doctor-who-cycle-012-media-census-v3-carrier
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      PRESELECTION_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-media-census-v3
      SELF: .github/workflows/doctor-who-cycle-012-media-census-v3.yml
      OUT: /tmp/doctor-who-cycle-012-media-census-v3
      EVIDENCE_PR: "871"
      EVIDENCE_HEAD: 61e1acdcb13966087374de518e85dc2db9eb1ee8
      EVIDENCE_RUN: "31370980255"
      EVIDENCE_JOB: "93399665207"
      EVIDENCE_ARTIFACT: "9056104797"
      EVIDENCE_ARTIFACT_NAME: doctor-who-cycle-012-senstarg-evidence-v2-31370980255-attempt-1
      EVIDENCE_ARTIFACT_SHA256: 0109348293dcd1dd9ca1b1e89cf16d073ce1fa026aa8d63b1f06dcdef5651b4e
      EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION: "3243079"
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_ORIGIN: https://tardis.fandom.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact read-only Senstarg media census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER_ROOT"
          mkdir -p "$CARRIER_ROOT"
          : > "$CARRIER_ROOT/carrier.sh.gz.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$CARRIER_ROOT/carrier.sh.gz.b64"
          done
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh.gz.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh.gz.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$CARRIER_ROOT/carrier.sh.gz.b64" > "$CARRIER_ROOT/carrier.sh.gz"
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$CARRIER_ROOT/carrier.sh.gz" > "$CARRIER_ROOT/carrier.sh"
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$CARRIER_ROOT/carrier.sh"
          CARRIER="$CARRIER_ROOT/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==6
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-012-media-census-v3-{index}>','exec')
          PY
          chmod 700 "$CARRIER_ROOT/carrier.sh"
          "$CARRIER_ROOT/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-media-census-v3/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v3
            /tmp/doctor-who-cycle-012-media-census-v3-carrier
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
