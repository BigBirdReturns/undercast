name: card-backfill-source-v3-wave-migration-lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the branch while the parallel wave reducer is installed
        run: |
          echo 'Single-cohort branch writers are retired during the source-v3 wave migration.'
          echo 'Discovery will resume through immutable parallel artifacts and one serialized reducer.'
          echo 'manual_continue_required=false'
          echo 'canonical_mutation=false'
