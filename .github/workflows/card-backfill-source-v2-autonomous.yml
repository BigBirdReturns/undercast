name: card-backfill-source-v3-wave-autonomous

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-source-v2-autonomous.yml'
      - '.github/CARD-BACKFILL-LESSONS.json'
      - '.github/CARD-BACKFILL-COHORT.json'
      - 'scripts/card-backfill-source-v3-wave-plan.mjs'
      - 'scripts/card-backfill-wave-reduce.mjs'
      - 'scripts/card-backfill-lessons.mjs'
      - 'scripts/card-backfill-lessons-fixtures.mjs'
      - 'scripts/card-backfill-attempt-index-fixtures.mjs'
      - 'scripts/card-backfill-wave-fixtures.mjs'
      - 'scripts/lib/card-backfill-wave.mjs'
      - 'scripts/lib/card-backfill-attempt-index.mjs'
      - 'scripts/lib/card-backfill-lessons.mjs'
      - 'scripts/lib/card-backfill-source-policy-v2.mjs'
      - 'scripts/lib/card-backfill-source-policy-v3.mjs'
      - 'scripts/card-backfill-source-v2.mjs'
      - 'scripts/card-backfill-source-v2-enrich-report.mjs'
      - 'scripts/card-backfill-machine-adjudicate.mjs'
  workflow_dispatch:
    inputs:
      cohort_limit:
        description: 'Obligations per immutable wave batch (1-50)'
        required: false
        default: '40'
      wave_batches:
        description: 'Parallel immutable batches per wave (1-4)'
        required: false
        default: '4'
      model:
        description: 'Independent second-desk GitHub Model'
        required: false
        default: 'openai/gpt-4.1-mini'

permissions:
  contents: write
  actions: write
  models: read
  statuses: write

concurrency:
  group: card-backfill-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      source_head: ${{ steps.head.outputs.source_head }}
      discover_matrix: ${{ steps.plan.outputs.discover_matrix }}
      assemble_matrix: ${{ steps.plan.outputs.assemble_matrix }}
      selected_count: ${{ steps.plan.outputs.selected_count }}
      wave_batches: ${{ steps.plan.outputs.wave_batches }}
      wave_sha256: ${{ steps.plan.outputs.wave_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind the complete wave to the exact triggering head
        id: head
        run: echo "source_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish an observable inherited-wave status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_HEAD: ${{ steps.head.outputs.source_head }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD}" \
            -f state=pending \
            -f context='card-backfill/source-v3-wave' \
            -f description="run ${GITHUB_RUN_ID}: validating inherited lessons" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove every earlier lesson is inherited before selecting work
        run: |
          set -euo pipefail
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-source-policy-v2-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate \
            --out "$RUNNER_TEMP/card-backfill-source-v3-wave-plan/lessons-validation.json"

      - name: Select disjoint immutable source-policy-v3 batches
        id: plan
        env:
          BATCH_LIMIT: ${{ inputs.cohort_limit || '40' }}
          WAVE_BATCHES: ${{ inputs.wave_batches || '4' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/card-backfill-source-v3-wave-plan"
          mkdir -p "$out"
          set +e
          node scripts/card-backfill-source-v3-wave-plan.mjs \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$out" \
            --batch-limit "$BATCH_LIMIT" \
            --wave-batches "$WAVE_BATCHES" > "$out/plan.log" 2>&1
          status=$?
          set -e
          cat "$out/plan.log"
          if [ "$status" -ne 0 ]; then
            if grep -q 'no source-policy-v3 wave available' "$out/plan.log"; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'discover_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              echo 'assemble_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
              echo 'selected_count=0' >> "$GITHUB_OUTPUT"
              echo 'wave_batches=0' >> "$GITHUB_OUTPUT"
              echo 'wave_sha256=' >> "$GITHUB_OUTPUT"
              echo 'PASS — source-policy-v3 wave is drained or yielding to publication'
              exit 0
            fi
            exit "$status"
          fi
          discover=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],'utf8'))))" "$out/discover-matrix.json")
          assemble=$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1],'utf8'))))" "$out/assemble-matrix.json")
          selected=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(p.selected_count))" "$out/wave.json")
          batches=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(p.wave_batches))" "$out/wave.json")
          wave=$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(p.wave_sha256)" "$out/wave.json")
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "discover_matrix=$discover" >> "$GITHUB_OUTPUT"
          echo "assemble_matrix=$assemble" >> "$GITHUB_OUTPUT"
          echo "selected_count=$selected" >> "$GITHUB_OUTPUT"
          echo "wave_batches=$batches" >> "$GITHUB_OUTPUT"
          echo "wave_sha256=$wave" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: card-backfill-source-v3-wave-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-source-v3-wave-plan
          if-no-files-found: error
          retention-days: 90

  discover:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.discover_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deterministic image inspection
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-source-v3-wave-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - name: Produce one immutable wave shard without branch mutation
        env:
          BATCH: ${{ matrix.batch_sha256 }}
          SHARD: ${{ matrix.shard_id }}
          PLAN_PATH: ${{ matrix.plan_path }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wave-$BATCH-$SHARD"
          output="$root/output"
          plan="$RUNNER_TEMP/planning/$PLAN_PATH"
          mkdir -p "$output"
          node scripts/card-backfill-source-v2.mjs \
            --baseline "$GITHUB_WORKSPACE" \
            --plan "$plan" \
            --out "$output/candidates" \
            --journal "$output/media-search.jsonl" \
            --latest "$output/latest.json" \
            --run-id "${GITHUB_RUN_ID}-wave-${BATCH}-shard-${SHARD}" \
            --contact 'bigbirdreturns@proton.me' \
            --delay-ms 350 \
            --magick magick | tee "$output/retrieve.log"
          node scripts/card-backfill-source-v2-enrich-report.mjs \
            --report "$output/candidates/report.json" | tee "$output/enrich.log"
          cp "$plan" "$output/retrieval-plan.json"
          echo 'immutable wave result: discovery artifact only; branch mutation=false'

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-source-v3-wave-shard-${{ matrix.batch_sha256 }}-${{ matrix.shard_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/wave-${{ matrix.batch_sha256 }}-${{ matrix.shard_id }}/output
          if-no-files-found: error
          retention-days: 90

  assemble:
    needs: [plan, discover]
    if: needs.plan.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.assemble_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install deterministic render tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-source-v3-wave-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-source-v3-wave-shard-${{ matrix.batch_sha256 }}-*-${{ github.run_id }}
          path: ${{ runner.temp }}/shards
          merge-multiple: false

      - name: Merge, render, and independently adjudicate one immutable wave batch
        env:
          MODEL: ${{ inputs.model || 'openai/gpt-4.1-mini' }}
          BATCH_SHA: ${{ matrix.batch_sha256 }}
          BATCH_INDEX: ${{ matrix.batch_index }}
          BATCH_PATH: ${{ matrix.batch_path }}
          SCOPES_PATH: ${{ matrix.scopes_path }}
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
        run: |
          set -euo pipefail
          final="$RUNNER_TEMP/final-$BATCH_SHA"
          batch="$RUNNER_TEMP/planning/$BATCH_PATH"
          scopes="$RUNNER_TEMP/planning/$SCOPES_PATH"
          wave="$RUNNER_TEMP/planning/wave.json"
          mkdir -p "$final"
          node scripts/card-backfill-cohort-merge.mjs \
            --batch "$batch" \
            --shards-root "$RUNNER_TEMP/shards" \
            --out "$final/candidates" \
            --run-id "$GITHUB_RUN_ID-wave-$BATCH_SHA" | tee "$final/merge.log"
          node scripts/card-backfill-cohort-packetize.mjs \
            --baseline "$GITHUB_WORKSPACE" \
            --candidates "$final/candidates" \
            --report "$final/candidates/report.json" \
            --batch "$batch" \
            --scopes "$scopes" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$final/packets" \
            --magick magick | tee "$final/packetize.log"
          node scripts/card-backfill-machine-adjudicate.mjs \
            --candidates "$final/packets" \
            --out "$final/machine-decisions.json" \
            --model "$MODEL" \
            --fallback-model 'openai/gpt-4o-mini' \
            --max-parallel 2 \
            --cycle 1 \
            --artifact-name "card-backfill-source-v3-wave-${GITHUB_RUN_ID}-${BATCH_SHA}" \
            --head-sha "$SOURCE_HEAD" | tee "$final/machine-adjudicate.log"
          node scripts/card-backfill-cohort-adjudicate.mjs \
            --candidates "$final/packets" \
            --decisions "$final/machine-decisions.json" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$final/adjudicated" \
            --source-run-id "$GITHUB_RUN_ID" | tee "$final/adjudicate.log"
          cp "$batch" "$final/batch.json"
          node --input-type=module - "$final" "$batch" "$wave" "$SOURCE_HEAD" "$BATCH_INDEX" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const [final,batchPath,wavePath,sourceHead,batchIndex]=process.argv.slice(2);
          const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
          const wave=JSON.parse(fs.readFileSync(wavePath,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(path.join(final,'adjudicated','adjudication-run-receipt.json'),'utf8'));
          const result={
            version:1,
            lane:'card-backfill-source-v3-wave-result',
            source_head:sourceHead,
            wave_sha256:wave.wave_sha256,
            batch_sha256:batch.batch_sha256,
            batch_index:Number(batchIndex),
            source_policy_id:wave.source_policy_id,
            source_policy_version:wave.source_policy_version,
            source_policy_revision:wave.source_policy_revision,
            lessons_contract_sha256:wave.lessons_contract_sha256,
            selected_count:batch.selected_count,
            counts:receipt.counts,
            adjudicated_path:'adjudicated',
            machine_decisions_path:'machine-decisions.json',
            artifact_only:true,
            canonical_mutation:false,
          };
          fs.writeFileSync(path.join(final,'wave-result.json'),JSON.stringify(result,null,2)+'\n');
          NODE
          echo 'immutable wave result: adjudication artifact only; branch mutation=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-source-v3-wave-result-${{ matrix.batch_sha256 }}-${{ github.run_id }}
          path: ${{ runner.temp }}/final-${{ matrix.batch_sha256 }}
          if-no-files-found: error
          retention-days: 90

  reduce-wave:
    needs: [plan, assemble]
    if: needs.plan.outputs.ready == 'true' && needs.assemble.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-source-v3-wave-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-source-v3-wave-result-*-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Re-prove inherited lessons at the one branch-mutation boundary
        run: |
          set -euo pipefail
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate \
            --out "$RUNNER_TEMP/lessons-validation.json"

      - name: Reduce all immutable wave results into staging exactly once
        env:
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
        run: |
          set -euo pipefail
          observed_head=$(git rev-parse HEAD)
          node scripts/card-backfill-wave-reduce.mjs \
            --wave "$RUNNER_TEMP/planning/wave.json" \
            --results-root "$RUNNER_TEMP/results" \
            --staging-root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --adjudications-root .github/card-backfill/adjudications \
            --wave-receipt-root .github/card-backfill/waves \
            --source-head "$SOURCE_HEAD" \
            --observed-head "$observed_head" | tee "$RUNNER_TEMP/wave-reduce.log"
          node scripts/card-backfill-staging.mjs validate \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill

      - name: Commit the exact wave reduction
        env:
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
          WAVE_BATCHES: ${{ needs.plan.outputs.wave_batches }}
          SELECTED_COUNT: ${{ needs.plan.outputs.selected_count }}
          WAVE_SHA: ${{ needs.plan.outputs.wave_sha256 }}
        run: |
          set -euo pipefail
          git add -A -- \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            data/review/card-backfill-staging
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'wave reduction was already present; no duplicate commit required'
            exit 0
          fi
          git config user.name 'undercast-card-backfill-wave-reducer'
          git config user.email 'undercast-card-backfill-wave-reducer@users.noreply.github.com'
          git commit -m "Card backfill: reduce ${WAVE_BATCHES} wave batches (${SELECTED_COUNT} obligations)"
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          if [ "$remote_head" != "$SOURCE_HEAD" ]; then
            echo "branch moved from source head $SOURCE_HEAD to $remote_head; refusing stale wave reduction push"
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "published wave reduction $WAVE_SHA"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-source-v3-wave-reduction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/planning
            ${{ runner.temp }}/lessons-validation.json
            ${{ runner.temp }}/wave-reduce.log
          if-no-files-found: warn
          retention-days: 90

  continue:
    needs: [plan, reduce-wave]
    if: needs.plan.outputs.ready == 'true' && needs.reduce-wave.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Re-arm the next parallel wave without a chat turn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH_LIMIT: ${{ inputs.cohort_limit || '40' }}
          WAVE_BATCHES: ${{ inputs.wave_batches || '4' }}
          MODEL: ${{ inputs.model || 'openai/gpt-4.1-mini' }}
        run: |
          set -euo pipefail
          sleep 10
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/card-backfill-source-v2-autonomous.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f "inputs[cohort_limit]=${BATCH_LIMIT}" \
            -f "inputs[wave_batches]=${WAVE_BATCHES}" \
            -f "inputs[model]=${MODEL}"
          echo 'PASS — source-policy-v3 parallel wave campaign re-armed itself'
          echo 'manual_continue_required=false'

  report-status:
    needs: [plan, discover, assemble, reduce-wave]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish the final inherited-wave status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_HEAD: ${{ github.sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          READY: ${{ needs.plan.outputs.ready }}
          REDUCE_RESULT: ${{ needs.reduce-wave.result }}
          SELECTED: ${{ needs.plan.outputs.selected_count }}
          WAVE_BATCHES: ${{ needs.plan.outputs.wave_batches }}
        run: |
          set -euo pipefail
          state=failure
          description="run ${GITHUB_RUN_ID}: wave failed before exact reduction"
          if [ "$PLAN_RESULT" = success ] && [ "$READY" != true ]; then
            state=success
            description="run ${GITHUB_RUN_ID}: policy frontier drained or yielded"
          elif [ "$REDUCE_RESULT" = success ]; then
            state=success
            description="run ${GITHUB_RUN_ID}: reduced ${WAVE_BATCHES} batches / ${SELECTED} obligations"
          fi
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD}" \
            -f state="$state" \
            -f context='card-backfill/source-v3-wave' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "state=$state"
          echo "$description"
