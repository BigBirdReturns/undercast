name: doctor-who-cycle-009-megnus-jaka-evidence-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-evidence-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v5.yml
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-evidence-v2
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
      SOURCE_WRAPPER_BLOB: 058da917ee8ef74ab409549949865fca8b364334
      SOURCE_WORKFLOW_BLOB: 7840ebdff69c2e64e8e7830ba4d424a0172edd08
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v5
      SCRIPT_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v5-scripts
      PREFLIGHT_RUN: "31237323043"
      PREFLIGHT_JOB: "93052146087"
      PREFLIGHT_ARTIFACT: "9015893321"
      PREFLIGHT_DIGEST: sha256:1a8ec1e3c248d93fccebe342b44eb1d4d2e4b8b069785309180c85d5343adf7c
      PREFLIGHT_HEAD: 2f52b1e546631ac74a227cabf6f0431c8a1470d2
      PREFLIGHT_IDENTITY: e530d17bac039c63278f5ae53c73d071b991e606a9eb4b3b74957f8ead1734b4
      TASK: ap_45bb5fdcdf4aff65aa7a87c3
      PERFORMER: Dan Starkey
      ROLE: Megnus Jaka
      MODE: voice
      SOURCE: https://tardis.fandom.com/wiki/Megnus_Jaka
      PAGEID: "175060"
      REVISION: "3677686"
      SOURCE_TIMESTAMP: "2023-12-19T13:57:50Z"
      SOURCE_BYTES: "721"
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      TARDIS_API: https://tardis.fandom.com/api.php
      PRODUCT: https://www.bigfinish.com/releases/v/doctor-who-the-first-sontarans-418
      NEWS: https://www.bigfinish.com/news/v/doctor-who-the-first-sontarans
      PRODUCT_IMAGE: https://admin.bigfinish.com/storage/images/optimised/fd995076-e237-4ca0-94da-91467049f48f__600x600.webp
      NEWS_IMAGE: https://www.bigfinish.com/image/news/184/large.jpg
      USER_AGENT: Undercast-cycle-009-evidence/5.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover V4 wrapper and pay extracted-event binding defect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT"
          mkdir -p "$SCRIPT_ROOT"/{api,bootstrap,run}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_WRAPPER_BLOB" > "$SCRIPT_ROOT/api/wrapper.json"
          jq -e --arg sha "$SOURCE_WRAPPER_BLOB" '.sha==$sha and .encoding=="base64"' "$SCRIPT_ROOT/api/wrapper.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/api/wrapper.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/wrapper.yml"
          test "$(git hash-object "$SCRIPT_ROOT/wrapper.yml")" = "$SOURCE_WRAPPER_BLOB"
          SOURCE="$SCRIPT_ROOT/wrapper.yml" TARGET="$SCRIPT_ROOT/bootstrap/recover.sh" ruby <<'RUBY'
          require 'yaml'
          doc=YAML.safe_load(File.read(ENV.fetch('SOURCE')), aliases: true)
          rows=doc.fetch('jobs').fetch('recover').fetch('steps').select{|s| s['name']=='Recover immutable V3 evidence program and pay exact packet-shape defect'}
          abort 'unexpected V4 bootstrap' unless rows.length==1 && rows[0]['run'].is_a?(String)
          File.write(ENV.fetch('TARGET'),rows[0]['run']); File.chmod(0755,ENV.fetch('TARGET'))
          RUBY
          bash -n "$SCRIPT_ROOT/bootstrap/recover.sh"
          bash "$SCRIPT_ROOT/bootstrap/recover.sh"
          SCRIPT="$SCRIPT_ROOT/run/01.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['SCRIPT']); text=path.read_text()
          replacements={
            "head='${{ github.event.pull_request.head.sha }}'": 'head="$EVENT_HEAD"',
            "pr='${{ github.event.pull_request.number }}'": 'pr="$EVENT_PR"',
            "test '${{ github.event.pull_request.base.sha }}' = \"$MAIN\"": 'test "$EVENT_BASE" = "$MAIN"',
          }
          for old,new in replacements.items():
            assert text.count(old)==1,(old,text.count(old)); text=text.replace(old,new)
          path.write_text(text)
          PY
          for script in "$SCRIPT_ROOT/run"/*.sh; do bash -n "$script"; done
          grep -F 'head="$EVENT_HEAD"' "$SCRIPT_ROOT/run/01.sh" >/dev/null
          grep -F 'pr="$EVENT_PR"' "$SCRIPT_ROOT/run/01.sh" >/dev/null
          grep -F 'test "$EVENT_BASE" = "$MAIN"' "$SCRIPT_ROOT/run/01.sh" >/dev/null
          grep -F "'required_capabilities':[]" "$SCRIPT_ROOT/run/02.sh" >/dev/null
          sha256sum "$SCRIPT_ROOT/run"/*.sh > "$SCRIPT_ROOT/run-scripts-v5.sha256"

      - name: Bind exact one-parent one-path V5 carrier
        shell: bash
        run: bash "$SCRIPT_ROOT/run/01.sh"

      - name: Verify canonical gates and complete exact preflight packet
        shell: bash
        run: bash "$SCRIPT_ROOT/run/02.sh"

      - name: Recover public production and media evidence
        shell: bash
        run: |
          set -euo pipefail
          bash "$SCRIPT_ROOT/run/03.sh"
          receipt="$OUT/receipt/evidence-recovery.json"
          jq -e --arg main "$MAIN" --arg task "$TASK" --arg performer "$PERFORMER" --arg role "$ROLE" --arg mode "$MODE" '.status=="cycle-009-megnus-jaka-evidence-recovered" and .canonical_main==$main and .task_id==$task and .performer==$performer and .role==$role and .performance_mode==$mode and .candidate_asset_count==2 and .media_adopted==false and .lease_issued==false and .queue_mutated==false and .repository_write==false and .cycle_009_product_authorized==false and .outside_human_dependency==false and .owner_physical_action_required==false' "$receipt" >/dev/null
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - name: Upload immutable V5 evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v5/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload V5 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v5
            /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v5-scripts
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
