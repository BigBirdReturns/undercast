name: star-trek-historical-check-route-patch-v1

on:
  push:
    branches:
      - agent/star-trek-next-bounded-cycle-claim

concurrency:
  group: star-trek-historical-check-route-patch-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Route historical Kukulkan validation through the product projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          for path in Path('.github/workflows').glob('star-trek-*.yml'):
              text=path.read_text()
              updated=text.replace('node scripts/star-trek-kukulkan-cycle.mjs','npm run star-trek:kukulkan-cycle:check')
              if updated!=text:
                  path.write_text(updated); changed.append(str(path))
          if not changed: raise SystemExit('no historical Kukulkan workflow route required patching')
          Path('/tmp/historical-route-paths.txt').write_text('\n'.join(sorted(changed))+'\n')
          PY
          git diff --check
          git config user.name undercast-star-trek-history-route-patcher
          git config user.email history-route-patcher@users.noreply.github.com
          while IFS= read -r path; do git add -- "$path"; done < /tmp/historical-route-paths.txt
          git commit -m 'Star Trek: route historical product checks through projection'
          git push origin HEAD:agent/star-trek-next-bounded-cycle-claim
