name: doctor-who-cycle-009-operational-reliability-diagnostic-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-operational-reliability-diagnostic-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-operational-reliability-diagnostic-v4
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  BRANCH: agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v4
  SELF: .github/workflows/doctor-who-cycle-009-operational-reliability-diagnostic-v4.yml
  OUT: /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v4
  PRODUCT_PR: "692"
  PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
  PRODUCT_COMMIT: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  PRODUCT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  PRODUCT_PATHS: "48"
  SNAPSHOT_ID: preservation-20260801-7054b6e620ee
  SNAPSHOT_COMMIT: 7054b6e620eeb140d4ae279e01e2e1b0daa6d33c
  PRIOR_PROOF_PR: "695"
  PRIOR_PROOF_HEAD: bd51435393fa8c18d783091a2a51b4de2d734241
  PRIOR_PROOF_RUN: "31281724716"
  PRIOR_PROOF_JOB: "93164054240"
  PRIOR_PROOF_ARTIFACT: "9028620679"
  PRIOR_PROOF_ARTIFACT_DIGEST: sha256:e5b236c6a0b2ba0bdc39965f9d8d73e2719ed258a7fc7793560170d7adec2357
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact diagnostic carrier and prior failed proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostic,product}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" > "$OUT/api/product-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$PRODUCT_COMMIT" > "$OUT/api/product-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$EXACT_MAIN...$PRODUCT_COMMIT" > "$OUT/api/product-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRIOR_PROOF_PR" > "$OUT/api/prior-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_PROOF_RUN" > "$OUT/api/prior-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_PROOF_RUN/jobs?per_page=100" > "$OUT/api/prior-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_PROOF_RUN/artifacts?per_page=100" > "$OUT/api/prior-artifacts.json"

          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          carrier=json.loads((root/'api/carrier-pr.json').read_text())
          product=json.loads((root/'api/product-pr.json').read_text())
          ref=json.loads((root/'api/product-ref.json').read_text())
          commit=json.loads((root/'api/product-commit.json').read_text())
          compare=json.loads((root/'api/product-compare.json').read_text())
          prior=json.loads((root/'api/prior-pr.json').read_text())
          run=json.loads((root/'api/prior-run.json').read_text())
          jobs=json.loads((root/'api/prior-jobs.json').read_text())['jobs']
          artifacts=json.loads((root/'api/prior-artifacts.json').read_text())['artifacts']
          assert carrier['number']==int(os.environ['PR_NUMBER']) and carrier['state']=='open' and carrier['draft'] is True and carrier['merged'] is False
          assert carrier['base']['sha']==os.environ['EXACT_MAIN'] and carrier['head']['sha']==os.environ['PR_HEAD'] and carrier['head']['ref']==os.environ['BRANCH']
          assert carrier['commits']==1 and carrier['changed_files']==1
          assert product['number']==int(os.environ['PRODUCT_PR']) and product['state']=='open' and product['draft'] is True and product['merged'] is False
          assert product['base']['sha']==os.environ['EXACT_MAIN'] and product['head']['sha']==os.environ['PRODUCT_COMMIT'] and product['head']['ref']==os.environ['PRODUCT_BRANCH']
          assert product['commits']==1 and product['changed_files']==int(os.environ['PRODUCT_PATHS'])
          assert ref['object']['sha']==os.environ['PRODUCT_COMMIT']
          assert [x['sha'] for x in commit['parents']]==[os.environ['EXACT_MAIN']] and commit['tree']['sha']==os.environ['PRODUCT_TREE']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1 and len(compare['files'])==int(os.environ['PRODUCT_PATHS'])
          assert prior['number']==int(os.environ['PRIOR_PROOF_PR']) and prior['head']['sha']==os.environ['PRIOR_PROOF_HEAD'] and prior['merged'] is False
          assert run['id']==int(os.environ['PRIOR_PROOF_RUN']) and run['status']=='completed' and run['conclusion']=='failure'
          match=[x for x in jobs if x['id']==int(os.environ['PRIOR_PROOF_JOB'])]
          assert len(match)==1 and match[0]['name']=='prove' and match[0]['conclusion']=='failure'
          artifact=[x for x in artifacts if x['id']==int(os.environ['PRIOR_PROOF_ARTIFACT'])]
          assert len(artifact)==1 and artifact[0]['digest']==os.environ['PRIOR_PROOF_ARTIFACT_DIGEST'] and artifact[0]['expired'] is False
          PY

          git fetch --no-tags --filter=blob:none origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$PRODUCT_COMMIT"
          git cat-file -e "$SNAPSHOT_COMMIT^{commit}" || git fetch --no-tags --filter=blob:none origin "$SNAPSHOT_COMMIT"
          git cat-file -e "$SNAPSHOT_COMMIT^{commit}"
          git worktree add --detach "$OUT/product" "$PRODUCT_COMMIT"
          test "$(git -C "$OUT/product" rev-parse HEAD)" = "$PRODUCT_COMMIT"

      - name: Record exact endpoint probe return codes
        shell: bash
        run: |
          set -euo pipefail
          cd "$OUT/product"
          ROOT="$OUT" python3 - <<'PY'
          import collections, hashlib, json, os, subprocess
          from pathlib import Path

          root=Path(os.environ['ROOT'])
          snapshot=os.environ['SNAPSHOT_COMMIT']
          target=os.environ['PRODUCT_COMMIT']

          def run(args, *, binary=False):
              p=subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              return {
                  'argv': args,
                  'returncode': p.returncode,
                  'stdout_bytes': len(p.stdout),
                  'stderr': p.stderr.decode('utf-8','replace'),
                  '_stdout': p.stdout if binary else p.stdout.decode('utf-8','replace'),
              }

          result={
              'status':'endpoint-probe-complete',
              'snapshot_commit':snapshot,
              'product_commit':target,
              'repository_write':False,
              'product_mutation':False,
              'main_mutation':False,
              'cycle_010_authorized':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }

          historical=[
            ('47ccb38eab6a4b6e2a16ed92b04f1259b95de783','data/review/adapter-sdk/doctor-who-cycle-008-kreg.json'),
            ('47ccb38eab6a4b6e2a16ed92b04f1259b95de783','scripts/doctor-who-cycle-008.mjs'),
            ('759589336a140487ebf3baad8c3f95fd9943b16b','data/review/adapter-sdk/doctor-who-cycle-008-composability.json'),
            ('759589336a140487ebf3baad8c3f95fd9943b16b','scripts/doctor-who-cycle-008.mjs'),
            ('a9b1a29098e36f03340ff6678b3edd06f1d1d3e2','data/review/adapter-sdk/doctor-who-cycle-008-composability-v2.json'),
            ('a9b1a29098e36f03340ff6678b3edd06f1d1d3e2','scripts/doctor-who-cycle-008.mjs'),
          ]
          hrows=[]
          for commit,path in historical:
              show=run(['git','show',f'{commit}:{path}'],binary=True)
              rev=run(['git','rev-parse',f'{commit}:{path}'])
              hrows.append({
                  'commit':commit,'path':path,
                  'show_returncode':show['returncode'],'show_stderr':show['stderr'],'show_bytes':show['stdout_bytes'],
                  'show_sha256':hashlib.sha256(show['_stdout']).hexdigest() if show['returncode']==0 else None,
                  'rev_parse_returncode':rev['returncode'],'rev_parse_stderr':rev['stderr'],
                  'git_blob':rev['_stdout'].strip() if rev['returncode']==0 else None,
              })
          result['historical_object_probe']=hrows

          selection=run(['node','scripts/operational-reliability.mjs','select-snapshot','--registry','preservation/SNAPSHOTS.json'])
          result['snapshot_selection']={k:v for k,v in selection.items() if k!='_stdout'}
          result['snapshot_selection']['stdout']=selection['_stdout']
          try:
              selected=json.loads(selection['_stdout']) if selection['returncode']==0 else None
          except Exception as exc:
              selected={'parse_error':repr(exc)}
          result['snapshot_selection']['parsed']=selected

          diff=run(['git','diff','--name-only','--no-renames','-z',f'{snapshot}..{target}','--','.'],binary=True)
          result['name_only_diff']={k:v for k,v in diff.items() if k!='_stdout'}
          paths=[]
          decode_error=None
          if diff['returncode']==0:
              try:
                  paths=sorted(x.decode('utf-8') for x in diff['_stdout'].split(b'\0') if x)
              except Exception as exc:
                  decode_error=repr(exc)
          result['name_only_diff'].update({
              'path_count':len(paths),
              'decode_error':decode_error,
              'paths_sha256':hashlib.sha256(('\n'.join(paths)+'\n').encode()).hexdigest() if paths else None,
              'first_paths':paths[:20],
              'last_paths':paths[-20:] if paths else [],
          })
          (root/'diagnostic/diff.stdout.bin').write_bytes(diff['_stdout'])
          (root/'diagnostic/diff.stderr.txt').write_text(diff['stderr'])
          if paths:
              (root/'diagnostic/paths.txt').write_text('\n'.join(paths)+'\n')

          endpoint_rows=[]
          hist=collections.Counter()
          abnormal=[]
          for path in paths:
              row={'path':path}
              for label,commit in (('snapshot',snapshot),('product',target)):
                  probe=run(['git','cat-file','-e',f'{commit}:{path}'])
                  row[f'{label}_returncode']=probe['returncode']
                  row[f'{label}_stderr']=probe['stderr']
                  hist[f'{label}:{probe["returncode"]}']+=1
              endpoint_rows.append(row)
              if row['snapshot_returncode'] not in (0,128) or row['product_returncode'] not in (0,128):
                  abnormal.append(row)
          result['cat_file_probe']={
              'returncode_histogram':dict(sorted(hist.items())),
              'abnormal_count':len(abnormal),
              'abnormal_rows':abnormal[:200],
              'sample_rows':endpoint_rows[:20]+endpoint_rows[-20:] if endpoint_rows else [],
          }
          (root/'diagnostic/endpoint-probes.json').write_text(json.dumps(endpoint_rows,indent=2,sort_keys=True)+'\n')

          tree_rows={}
          for label,commit in (('snapshot',snapshot),('product',target)):
              tree=run(['git','ls-tree','-r','--name-only','-z',commit],binary=True)
              tree_rows[label]={k:v for k,v in tree.items() if k!='_stdout'}
              tree_rows[label]['path_count']=len([x for x in tree['_stdout'].split(b'\0') if x]) if tree['returncode']==0 else None
              (root/f'diagnostic/{label}-ls-tree.stdout.bin').write_bytes(tree['_stdout'])
              (root/f'diagnostic/{label}-ls-tree.stderr.txt').write_text(tree['stderr'])
          result['ls_tree_probe']=tree_rows

          body=dict(result)
          result['identity']=hashlib.sha256(json.dumps(body,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'diagnostic/diagnostic.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY

          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Seal diagnostic packet
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/api/carrier-pr.json" "$OUT/diagnostic/"
          cp "$OUT/api/product-pr.json" "$OUT/diagnostic/"
          cp "$OUT/api/prior-run.json" "$OUT/diagnostic/"
          cp "$OUT/api/prior-jobs.json" "$OUT/diagnostic/"
          cp "$OUT/api/prior-artifacts.json" "$OUT/diagnostic/"
          find "$OUT/diagnostic" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/diagnostic/$rel" | sed "s#  $OUT/diagnostic/#  #"
          done > "$OUT/diagnostic/SHA256SUMS.pre"
          sha256sum "$OUT/diagnostic/SHA256SUMS.pre" | sed "s#  $OUT/diagnostic/#  #" > "$OUT/diagnostic/SHA256SUMS"
          test -z "$(git status --porcelain)"

      - name: Upload exact endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-diagnostic-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v4/diagnostic
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
