name: doctor-who-cycle-008-kreg-independent-review-v8b

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/doctor-who-cycle-008/kreg-independent-review-v8b/**"
      - ".github/workflows/doctor-who-cycle-008-kreg-independent-review-v8b.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-independent-review-v8b-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-independent-review-v8b'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-independent-review-v8b.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-independent-review-v8b
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      V7B_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7b
      V7B_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v7b
      OUT: /tmp/doctor-who-cycle-008-kreg-independent-review-v8b
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Reconstruct and execute checksum-bound review program
        shell: bash
        run: |
          set -euo pipefail
          root=.github/doctor-who-cycle-008/kreg-independent-review-v8b
          mkdir -p "$OUT/diagnostics"
          test "$(wc -c < "$root/review.part-00.b64")" = "4248"
          test "$(sha256sum "$root/review.part-00.b64" | awk '{print $1}')" = "aa5286ff6725bc767f455b45a10d55d946d144d159e32e1e45f2f616797dd4cc"
          test "$(wc -c < "$root/review.part-01.b64")" = "4248"
          test "$(sha256sum "$root/review.part-01.b64" | awk '{print $1}')" = "b6818875cf6f6c5b0e6506477bb624ef2a98e7b55f86345d158305f663b6b1bf"
          test "$(wc -c < "$root/review.part-02.b64")" = "4248"
          test "$(sha256sum "$root/review.part-02.b64" | awk '{print $1}')" = "0230951db00944a4ab01021ac069861b24ffccb16e7bd1f64fbf28596de1ed97"
          test "$(wc -c < "$root/review.part-03.b64")" = "4248"
          test "$(sha256sum "$root/review.part-03.b64" | awk '{print $1}')" = "c618328de71152a4539f0fc7508bbcb24bde236db95a2c386c6824ff6695ece6"
          test "$(wc -c < "$root/review.part-04.b64")" = "4248"
          test "$(sha256sum "$root/review.part-04.b64" | awk '{print $1}')" = "8639fe88b9575eb500f59a17ce61f456f9120a5ee1878973b8da586588ffaf1b"
          test "$(wc -c < "$root/review.part-05.b64")" = "4252"
          test "$(sha256sum "$root/review.part-05.b64" | awk '{print $1}')" = "07bf6255c751b495b83ab05efcdda2d3138bcc94bc588bd0ad620a0eb9cd2269"
          cat "$root"/review.part-*.b64 > /tmp/kreg-v8b-review.b64
          base64 --decode /tmp/kreg-v8b-review.b64 > /tmp/kreg-v8b-review.sh
          test "$(wc -c < /tmp/kreg-v8b-review.sh)" = "19118"
          test "$(sha256sum /tmp/kreg-v8b-review.sh | awk '{print $1}')" = "173084ea0a2e5c5011756dd478878d53319eec3f10888d0ba4e62279b5620725"
          bash -n /tmp/kreg-v8b-review.sh
          bash /tmp/kreg-v8b-review.sh
      - name: Upload immutable V8b review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-independent-review-v8b-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-independent-review-v8b
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
