name: star-trek-henoch-source-review-v1

on:
  push:
    branches:
      - agent/star-trek-henoch-source-review-v1

permissions:
  contents: write

concurrency:
  group: star-trek-henoch-source-review-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 28ea3efc9f71d6207794d45cc654af765b36c63e
  EXPECTED_TREE: 52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c
  EXPECTED_PARENT: 4a2f98c4dc2039f596857cfdff01e701acbd2e4d
  EXPECTED_MESSAGE: "Star Trek: publish Risik cycle"
  SOURCE_BRANCH: agent/star-trek-henoch-source-result-v1
  SOURCE_COMMIT: 5a583aee75283d4ac2594f215a91aecc39d574aa
  SOURCE_TREE: 32a540b406d559356eb1463f4bea28d775d88e4b
  SOURCE_RECEIPT_SHA: b8be2358b407972ee2d97184c5529f0ef17eb2abe778ad5b6a5413593c4880c1
  SOURCE_ARTIFACT_ID: "9674407683"
  SOURCE_ARTIFACT_DIGEST: 6d4d0da56edbe5b57c8028ff9bb938eb1175f04b42a057e22c6fc679d6746c0c
  CLAIM_BRANCH: agent/star-trek-henoch-claim-result-v1
  CLAIM_COMMIT: d1039f1e3cb263d7be47b63cba05eca9f0cf24b8
  CLAIM_TREE: affc7614a284b8b8acfdeb8b14871fdd135a6f46
  CLAIM_RECEIPT_SHA: 3f86f82e287de56e401dd754b846fab4e0d60618931e24e129885e689fc44b05
  EXPECTED_LEASE: lease_7495c4d823c439f1ae201c13
  TASK_ID: ap_3d10b7a97efdbdd11c50bc2a
  EXPECTED_PERFORMER: Leonard Nimoy
  EXPECTED_CHARACTER: Henoch
  EXPECTED_FINGERPRINT: 53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839
  ROLE_PAGEID: "25807"
  ROLE_REVISION: "3444389"
  ROLE_CONTENT_SHA: 9348ab67b8db52bf6e14aee932494d35e5c54107a837b249dd4c40236a22e6b5
  RESULT_BRANCH: agent/star-trek-henoch-source-review-result-v1
  OUT: /tmp/star-trek-henoch-source-review-v1

jobs:
  review:
    name: independently-review-frozen-henoch-source
    if: ${{ github.event.head_commit.message == 'Review frozen Star Trek Henoch source v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify carrier, frozen source, and claim identities
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/source"

          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%s HEAD)" = "Review frozen Star Trek Henoch source v1"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P "$EXPECTED_MAIN")" = "$EXPECTED_PARENT"
          test "$(git show -s --format=%s "$EXPECTED_MAIN")" = "$EXPECTED_MESSAGE"
          git diff --name-only "$EXPECTED_MAIN" HEAD | LC_ALL=C sort > "$OUT/carrier-paths.txt"
          printf '%s\n' .github/workflows/star-trek-henoch-source-review-v1.yml \
            > "$OUT/expected-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/carrier-paths.txt"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          source_ref="refs/remotes/origin/${SOURCE_BRANCH}"
          claim_ref="refs/remotes/origin/${CLAIM_BRANCH}"
          test "$(git rev-parse "$source_ref")" = "$SOURCE_COMMIT"
          test "$(git show -s --format=%T "$source_ref")" = "$SOURCE_TREE"
          test -z "$(git show -s --format=%P "$source_ref")"
          test "$(git rev-parse "$claim_ref")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%T "$claim_ref")" = "$CLAIM_TREE"
          test "$(git show -s --format=%P "$claim_ref")" = "$EXPECTED_MAIN"

          for name in \
            source-probe.json \
            claim-receipt.json \
            claim-task-state.json \
            henoch-api.json \
            henoch-discovery-api.json \
            henoch-extract.txt \
            henoch-source.wikitext \
            manifest.sha256
          do
            git show "${source_ref}:transport/star-trek-henoch-source-v1/${name}" \
              > "$OUT/source/${name}"
          done
          git show "${claim_ref}:data/review/adapter-sdk/star-trek-henoch-claim.json" \
            > "$OUT/claim-receipt.json"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          out = Path(os.environ["OUT"])

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          def digest_json(path, field, omitted=()):
              payload = json.loads(path.read_text(encoding="utf-8"))
              expected = payload[field]
              body = dict(payload)
              body.pop(field, None)
              for key in omitted:
                  body.pop(key, None)
              actual = hashlib.sha256(
                  (json.dumps(stable(body), indent=2, ensure_ascii=False) + "\n").encode()
              ).hexdigest()
              if actual != expected:
                  raise SystemExit(f"{path.name} identity mismatch: {actual} != {expected}")
              return payload

          probe = digest_json(
              out / "source/source-probe.json",
              "receipt_sha256",
              ("artifact",),
          )
          claim = digest_json(out / "claim-receipt.json", "receipt_sha256")

          if probe["receipt_sha256"] != os.environ["SOURCE_RECEIPT_SHA"]:
              raise SystemExit("Henoch source receipt identity drifted")
          if probe.get("artifact") != {
              "id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "digest": os.environ["SOURCE_ARTIFACT_DIGEST"],
          }:
              raise SystemExit("Henoch source artifact identity drifted")
          if claim["receipt_sha256"] != os.environ["CLAIM_RECEIPT_SHA"]:
              raise SystemExit("Henoch claim receipt identity drifted")

          expected_task = {
              "id": os.environ["TASK_ID"],
              "performer": os.environ["EXPECTED_PERFORMER"],
              "character": os.environ["EXPECTED_CHARACTER"],
              "source_fingerprint": os.environ["EXPECTED_FINGERPRINT"],
              "performance_modes": ["physical-prosthetic"],
              "status": "leased",
              "attempts": 1,
          }
          if any(probe["task"].get(key) != value for key, value in expected_task.items()):
              raise SystemExit(f"Henoch source task drifted: {probe['task']}")
          if any(claim["task"].get(key) != value for key, value in expected_task.items()):
              raise SystemExit(f"Henoch claim task drifted: {claim['task']}")
          if (
              probe["claim"].get("commit") != os.environ["CLAIM_COMMIT"]
              or probe["claim"].get("tree") != os.environ["CLAIM_TREE"]
              or probe["claim"].get("receipt_sha256") != os.environ["CLAIM_RECEIPT_SHA"]
              or probe["claim"].get("lease_id") != os.environ["EXPECTED_LEASE"]
              or claim["lease"].get("id") != os.environ["EXPECTED_LEASE"]
          ):
              raise SystemExit("Henoch lease or claim custody drifted")

          expected_queue = {
              "total": 2228,
              "queued": 1794,
              "resolved": 431,
              "blocked": 0,
              "rejected": 2,
              "in_flight": 1,
          }
          if probe.get("queue") != expected_queue:
              raise SystemExit(f"Henoch queue drifted: {probe.get('queue')}")
          if claim.get("queue", {}).get("after") != expected_queue:
              raise SystemExit("Henoch claim queue and source queue disagree")

          revision = probe["source_revision"]
          discovery = probe["source_discovery"]
          required_revision = {
              "title": "Henoch",
              "pageid": int(os.environ["ROLE_PAGEID"]),
              "revision": int(os.environ["ROLE_REVISION"]),
              "content_sha256": os.environ["ROLE_CONTENT_SHA"],
          }
          if any(revision.get(key) != value for key, value in required_revision.items()):
              raise SystemExit(f"Henoch exact source revision drifted: {revision}")
          if any(discovery.get(key) != value for key, value in required_revision.items()):
              raise SystemExit(f"Henoch source discovery drifted: {discovery}")
          if revision.get("page_image", {}).get("source") is None:
              raise SystemExit("Henoch role page image disappeared")

          role_bytes = (out / "source/henoch-source.wikitext").read_bytes()
          extract_bytes = (out / "source/henoch-extract.txt").read_bytes()
          if hashlib.sha256(role_bytes).hexdigest() != os.environ["ROLE_CONTENT_SHA"]:
              raise SystemExit("Henoch wikitext bytes drifted")
          if hashlib.sha256(extract_bytes).hexdigest() != revision["rendered_extract_sha256"]:
              raise SystemExit("Henoch extract bytes drifted")

          role_text = role_bytes.decode("utf-8")
          required_patterns = [
              r"\|actor\s*=\s*\[\[Leonard Nimoy\]\]",
              r"Henoch was played by \[\[Leonard Nimoy\]\]",
              r"occupied \[\[Spock\]\]'s body",
              r"\{\{TOS\|Return to Tomorrow\}\}",
          ]
          for pattern in required_patterns:
              if not re.search(pattern, role_text, re.I):
                  raise SystemExit(f"Henoch frozen source lacks required marker: {pattern}")

          expected_boundary = {
              "source_revision_frozen": True,
              "discovery_and_exact_revision_agree": True,
              "independent_source_review_complete": False,
              "canonical_mutation": False,
              "lease_mutation": False,
              "additional_lease_issued": False,
              "product_staged": False,
              "media_review_complete": False,
              "waterline_cycle_recorded": False,
          }
          if any(probe["boundary"].get(key) != value for key, value in expected_boundary.items()):
              raise SystemExit(f"Henoch source boundary drifted: {probe['boundary']}")
          if (
              probe["canonical_parent"] != os.environ["EXPECTED_MAIN"]
              or probe["canonical_tree"] != os.environ["EXPECTED_TREE"]
          ):
              raise SystemExit("Henoch source canonical boundary drifted")
          PY

      - name: Freeze and independently review supporting exact revisions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from html import unescape
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import hashlib
          import json
          import os
          import re

          out = Path(os.environ["OUT"])
          probe = json.loads((out / "source/source-probe.json").read_text(encoding="utf-8"))

          def request_json(params, user_agent):
              url = "https://memory-alpha.fandom.com/api.php?" + urlencode(params)
              request = Request(
                  url,
                  headers={"User-Agent": user_agent, "Accept": "application/json"},
              )
              with urlopen(request, timeout=90) as response:
                  payload = json.load(response)
              return url, payload

          query_url, query_payload = request_json(
              {
                  "action": "query",
                  "prop": "revisions|pageimages|extracts",
                  "titles": "Leonard Nimoy|Return to Tomorrow (episode)",
                  "redirects": "1",
                  "rvprop": "ids|timestamp|content",
                  "rvslots": "main",
                  "rvlimit": "1",
                  "piprop": "original|name",
                  "explaintext": "1",
                  "format": "json",
                  "formatversion": "2",
              },
              "UNDERCAST-Henoch-Independent-Source-Review/1.0",
          )
          pages = query_payload.get("query", {}).get("pages", [])
          by_title = {page.get("title"): page for page in pages}
          required_titles = {"Leonard Nimoy", "Return to Tomorrow (episode)"}
          if set(by_title) != required_titles:
              raise SystemExit(f"supporting page set drifted: {set(by_title)}")

          def freeze_page(title, key):
              page = by_title[title]
              revision = (page.get("revisions") or [None])[0] or {}
              slots = revision.get("slots") or {}
              content = (slots.get("main") or {}).get("content")
              if not isinstance(content, str):
                  raise SystemExit(f"{title} source content missing")
              extract = page.get("extract") or ""
              record = {
                  "title": title,
                  "pageid": page.get("pageid"),
                  "revision": revision.get("revid"),
                  "parentid": revision.get("parentid"),
                  "timestamp": revision.get("timestamp"),
                  "content_sha256": hashlib.sha256(content.encode()).hexdigest(),
                  "extract_sha256": hashlib.sha256(extract.encode()).hexdigest(),
                  "page_image": page.get("original"),
                  "query": query_url,
              }
              (out / f"{key}.wikitext").write_text(content, encoding="utf-8")
              (out / f"{key}-extract.txt").write_text(extract, encoding="utf-8")
              return record

          support = {
              "performer": freeze_page("Leonard Nimoy", "leonard-nimoy"),
              "episode": freeze_page(
                  "Return to Tomorrow (episode)",
                  "return-to-tomorrow-episode",
              ),
          }
          (out / "support-query-api.json").write_text(
              json.dumps(query_payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          def fetch_rendered(oldid, expected_title, key):
              url, payload = request_json(
                  {
                      "action": "parse",
                      "oldid": str(oldid),
                      "prop": "text|displaytitle|revid",
                      "format": "json",
                      "formatversion": "2",
                  },
                  "UNDERCAST-Henoch-Independent-Rendered-Review/1.0",
              )
              parsed = payload.get("parse") or {}
              if parsed.get("revid") != oldid:
                  raise SystemExit(
                      f"{expected_title} rendered revision drifted: "
                      f"{parsed.get('revid')} != {oldid}"
                  )
              if parsed.get("title") != expected_title:
                  raise SystemExit(
                      f"{expected_title} rendered title drifted: {parsed.get('title')}"
                  )
              html = parsed.get("text") or ""
              text = unescape(re.sub(r"<[^>]+>", " ", html))
              text = re.sub(r"\s+", " ", text).strip()
              (out / f"{key}-rendered-api.json").write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              (out / f"{key}-rendered.html").write_text(html, encoding="utf-8")
              (out / f"{key}-rendered.txt").write_text(text + "\n", encoding="utf-8")
              return {
                  "title": expected_title,
                  "revision": oldid,
                  "request": url,
                  "api_sha256": hashlib.sha256(
                      (
                          json.dumps(
                              payload,
                              sort_keys=True,
                              separators=(",", ":"),
                              ensure_ascii=False,
                          )
                          + "\n"
                      ).encode()
                  ).hexdigest(),
                  "html_sha256": hashlib.sha256(html.encode()).hexdigest(),
                  "text_sha256": hashlib.sha256(text.encode()).hexdigest(),
              }, text

          role_rendered, role_text = fetch_rendered(
              int(os.environ["ROLE_REVISION"]),
              "Henoch",
              "henoch-role",
          )
          performer_rendered, performer_text = fetch_rendered(
              support["performer"]["revision"],
              "Leonard Nimoy",
              "leonard-nimoy",
          )
          episode_rendered, episode_text = fetch_rendered(
              support["episode"]["revision"],
              "Return to Tomorrow (episode)",
              "return-to-tomorrow-episode",
          )

          required_role = [
              "Played by: Leonard Nimoy",
              "Henoch in Spock's body",
              "Return to Tomorrow",
          ]
          for marker in required_role:
              if marker.casefold() not in role_text.casefold():
                  raise SystemExit(f"rendered Henoch page lacks marker: {marker}")

          required_performer = [
              "Henoch (in Spock's body)",
              'TOS: "Return to Tomorrow"',
          ]
          for marker in required_performer:
              if marker.casefold() not in performer_text.casefold():
                  raise SystemExit(f"rendered Leonard Nimoy page lacks marker: {marker}")

          required_episode = [
              "First aired: 9 February 1968",
              "Telepathic aliens take over Kirk and Spock's bodies",
              "Henoch",
              "Leonard Nimoy",
          ]
          for marker in required_episode:
              if marker.casefold() not in episode_text.casefold():
                  raise SystemExit(f"rendered episode page lacks marker: {marker}")

          rendered = {
              "version": 1,
              "transaction": "STAR-TREK-HENOCH-RENDERED-SOURCE-REVIEW-V1",
              "reviewed_at": datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "role": role_rendered,
              "performer": performer_rendered,
              "episode": episode_rendered,
              "verified": {
                  "performer_credit": True,
                  "host_body": "Spock's body",
                  "production": "Return to Tomorrow",
                  "first_aired": "9 February 1968",
                  "series": "Star Trek",
              },
          }
          (out / "supporting-sources.json").write_text(
              json.dumps(support, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          (out / "rendered-review.json").write_text(
              json.dumps(rendered, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write independent Henoch source review
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os

          out = Path(os.environ["OUT"])
          probe = json.loads((out / "source/source-probe.json").read_text(encoding="utf-8"))
          support = json.loads((out / "supporting-sources.json").read_text(encoding="utf-8"))
          rendered = json.loads((out / "rendered-review.json").read_text(encoding="utf-8"))

          review = {
              "version": 1,
              "transaction": "STAR-TREK-HENOCH-SOURCE-REVIEW-V1",
              "reviewed_at": datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "reviewer": "chatgpt-henoch-independent-source-reviewer-v1",
              "reviewed_role": "second-desk",
              "verdict": "pass",
              "canonical_parent": os.environ["EXPECTED_MAIN"],
              "canonical_tree": os.environ["EXPECTED_TREE"],
              "claim": probe["claim"],
              "source": {
                  "branch": os.environ["SOURCE_BRANCH"],
                  "commit": os.environ["SOURCE_COMMIT"],
                  "tree": os.environ["SOURCE_TREE"],
                  "receipt_sha256": probe["receipt_sha256"],
                  "artifact": probe["artifact"],
                  "role_revision": probe["source_revision"],
              },
              "supporting_sources": support,
              "rendered_revision_evidence": rendered,
              "task": {
                  "id": os.environ["TASK_ID"],
                  "lease_id": os.environ["EXPECTED_LEASE"],
                  "performer": os.environ["EXPECTED_PERFORMER"],
                  "character": os.environ["EXPECTED_CHARACTER"],
                  "source_fingerprint": os.environ["EXPECTED_FINGERPRINT"],
                  "status": "leased",
                  "attempts": 1,
              },
              "adjudication": {
                  "adjudicated_kind": "physical",
                  "performance_mode": "physical-prosthetic",
                  "performance_scope": (
                      "Leonard Nimoy's physical screen performance as Henoch while "
                      "Henoch occupies Spock's body in the Star Trek episode "
                      "Return to Tomorrow (1968)."
                  ),
                  "series": "Star Trek",
                  "episode": "Return to Tomorrow",
                  "production": "Return to Tomorrow",
                  "year": "1968",
                  "first_aired": "9 February 1968",
                  "embodied_character": "Henoch",
                  "host_character": "Spock",
                  "host_body": "Spock's body",
                  "physical_performance_attributed": True,
                  "prosthetic_performance_attributed": False,
                  "host_character_prosthetic_continuity": True,
                  "makeup_design_attributed": False,
                  "character_design_attributed": False,
                  "animation_labor_attributed": False,
                  "voice_direction_attributed": False,
                  "vocal_processing_attributed": False,
                  "sound_attributed": False,
                  "maker_attribution": "unresolved",
                  "transformation_measured": False,
              },
              "media_boundary": {
                  "character_page_image": probe["source_revision"]["page_image"],
                  "still_status": "pending-source-bound-media-review",
                  "portrait_status": "pending-independent-performer-media-review",
                  "host_body_image_is_character_evidence": True,
                  "cross_facet_substitution": False,
                  "byte_distinctness_pending": True,
                  "source_distinctness_pending": True,
              },
              "boundary": {
                  "source_revision_frozen": True,
                  "supporting_revisions_frozen_by_second_desk": True,
                  "rendered_revision_frozen": True,
                  "independent_source_review_complete": True,
                  "canonical_mutation": False,
                  "lease_mutation": False,
                  "additional_lease_issued": False,
                  "media_prepared": False,
                  "product_staged": False,
                  "waterline_cycle_recorded": False,
              },
          }

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          body = json.dumps(stable(review), indent=2, ensure_ascii=False) + "\n"
          review["review_sha256"] = hashlib.sha256(body.encode()).hexdigest()
          (out / "source-review.json").write_text(
              json.dumps(stable(review), indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            '.transaction == "STAR-TREK-HENOCH-SOURCE-REVIEW-V1"
             and .verdict == "pass"
             and .canonical_parent == env.EXPECTED_MAIN
             and .canonical_tree == env.EXPECTED_TREE
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.status == "leased"
             and .task.attempts == 1
             and .adjudication.adjudicated_kind == "physical"
             and .adjudication.performance_mode == "physical-prosthetic"
             and .adjudication.series == "Star Trek"
             and .adjudication.episode == "Return to Tomorrow"
             and .adjudication.year == "1968"
             and .adjudication.first_aired == "9 February 1968"
             and .adjudication.embodied_character == "Henoch"
             and .adjudication.host_character == "Spock"
             and .adjudication.host_body == "Spock'\''s body"
             and .adjudication.physical_performance_attributed == true
             and .adjudication.prosthetic_performance_attributed == false
             and .adjudication.host_character_prosthetic_continuity == true
             and .adjudication.makeup_design_attributed == false
             and .adjudication.character_design_attributed == false
             and .adjudication.maker_attribution == "unresolved"
             and .adjudication.transformation_measured == false
             and .media_boundary.host_body_image_is_character_evidence == true
             and .media_boundary.cross_facet_substitution == false
             and .boundary.source_revision_frozen == true
             and .boundary.supporting_revisions_frozen_by_second_desk == true
             and .boundary.rendered_revision_frozen == true
             and .boundary.independent_source_review_complete == true
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false
             and .boundary.media_prepared == false
             and .boundary.product_staged == false
             and .boundary.waterline_cycle_recorded == false' \
            "$OUT/source-review.json" >/dev/null

          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$EXPECTED_MAIN"
          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$OUT/manifest.sha256"
          sha256sum -c "$OUT/manifest.sha256"

      - name: Upload independent Henoch source-review evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-source-review-v1
          path: /tmp/star-trek-henoch-source-review-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable Henoch source-review result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/source-review.json" > "$OUT/source-review.tmp"
          mv "$OUT/source-review.tmp" "$OUT/source-review.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum > "$OUT/manifest.sha256"
          sha256sum -c "$OUT/manifest.sha256"

          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git config user.name undercast-henoch-source-review-v1
          git config user.email undercast-henoch-source-review-v1@users.noreply.github.com
          git checkout --orphan henoch-source-review-result-v1
          git rm -rf -q . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-henoch-source-review-v1
          cp -a "$OUT"/. transport/star-trek-henoch-source-review-v1/
          git add transport/star-trek-henoch-source-review-v1
          test -z "$(
            git diff --cached --name-only \
              | grep -Ev '^transport/star-trek-henoch-source-review-v1/' \
              || true
          )"
          git commit -m "Record Star Trek Henoch independent source review v1"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"

          result_commit="$(git rev-parse HEAD)"
          test "$(
            git ls-remote origin "refs/heads/${RESULT_BRANCH}" | awk '{print $1}'
          )" = "$result_commit"
          test -z "$(git show -s --format=%P "$result_commit")"
          test "$(git show -s --format=%s "$result_commit")" \
            = "Record Star Trek Henoch independent source review v1"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" \
            = "$EXPECTED_MAIN"
          git show \
            "${result_commit}:transport/star-trek-henoch-source-review-v1/source-review.json" \
            | jq -e \
                --argjson artifact "$ARTIFACT_ID" \
                --arg digest "$ARTIFACT_DIGEST" \
                '.transaction == "STAR-TREK-HENOCH-SOURCE-REVIEW-V1"
                 and .verdict == "pass"
                 and .artifact == {id:$artifact,digest:$digest}
                 and .boundary.independent_source_review_complete == true
                 and .boundary.canonical_mutation == false
                 and .boundary.lease_mutation == false
                 and .boundary.additional_lease_issued == false' \
                >/dev/null
