name: estate-repair-collect010-rendered-fixtures-retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired repair authority
        run: |
          echo 'This one-shot COLLECT-010 rendered-fixture repair is complete and retired.' >&2
          echo 'The durable fixture and receipt are already committed.' >&2
          exit 1
