name: doctor-who-cycle-012-senstarg-evidence-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-evidence-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-evidence-v2
  cancel-in-progress: true

jobs:
  evidence:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      SELECTOR_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-senstarg-evidence-v2
      SELF: .github/workflows/doctor-who-cycle-012-senstarg-evidence-v2.yml
      OUT: /tmp/doctor-who-cycle-012-senstarg-evidence-v2
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      SOURCE_PR: "868"
      SOURCE_BRANCH: agent/doctor-who-cycle-012-evidence-preflight-v3
      SOURCE_HEAD: 6645b7410675b53f2ac663f8cedd9a7a92c38e38
      SOURCE_RUN: "31369813777"
      SOURCE_JOB: "93396049687"
      SOURCE_ARTIFACT: "9055623682"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-012-evidence-preflight-v3-diagnostics-31369813777-attempt-1
      SOURCE_ARTIFACT_BYTES: "610199"
      SOURCE_ARTIFACT_SHA256: 5ea38aff2da21cf41ff77e147ec2ec073535f5052145dbc4e09471b5361261f0
      SOURCE_ARTIFACT_FILES: "26"
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      SOURCE_API_SHA256: 8805e77dcb9d40c4db73fc6b1b5fd54d3d9e8c8a20f5049c62be566a2025ad18
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION_ID: "3243079"
      SOURCE_REVISION_TIMESTAMP: 2022-03-07T11:08:05Z
      SELECTOR_PR: "866"
      SELECTOR_BRANCH: agent/doctor-who-cycle-012-preflight-v13
      SELECTOR_HEAD: a0265638e30fbb669a09bb5ce1704c9853dbc2ce
      SELECTOR_RUN: "31368785967"
      SELECTOR_JOB: "93392885230"
      SELECTOR_ARTIFACT: "9055273612"
      SELECTOR_ARTIFACT_SHA256: c1ce1b79cbcdb29cf66f8cfd142269cac243777e4a7ad710f55bb795f09c3aeb
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      TRANSPORT_IDENTITY: fbe1b123c9ad17a23ff717fbaa47e2f59cc85032fc48a94648eb1d64e20f2da0
      TERMINAL_PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      V12_FAILURE_IDENTITY: cf8290c7b2bc94a0f0995b9a4334c9e72c322ed6a3390fcd2972ac5cde462a3c
      V13_REPAIR_IDENTITY: 73a7e8519c9489432573742a4fac4b7f6bbacf723e7ed560a7615ae89316ba3b
      EXPECTED_TASK: ap_8965086737382df0e88366db
      EXPECTED_PERFORMER: Dan Starkey
      EXPECTED_ROLE: Senstarg
      EXPECTED_MODE: unresolved
      EXPECTED_SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      EXPECTED_SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact source-evidence failure and immutable diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,extracted,payload/selector,payload/source,payload/logs,payload/status,receipt}

          test "$CURRENT_BASE" = "$LIVE_MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$LIVE_MAIN"
          test "$(git rev-list --count "$LIVE_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$LIVE_MAIN"..HEAD)"
          test "$(git diff --name-status "$LIVE_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/diagnostics.zip"
          test "$(sha256sum "$OUT/source/diagnostics.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/source-artifact.json")" = "sha256:$SOURCE_ARTIFACT_SHA256"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          carrier = load('carrier-pr.json')
          source_pr = load('source-pr.json')
          run = load('source-run.json')
          jobs = load('source-jobs.json')['jobs']
          artifact = load('source-artifact.json')
          assert carrier['number'] == int(os.environ['CURRENT_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['LIVE_MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CURRENT_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert source_pr['number'] == int(os.environ['SOURCE_PR'])
          assert source_pr['head']['ref'] == os.environ['SOURCE_BRANCH'] and source_pr['head']['sha'] == os.environ['SOURCE_HEAD']
          assert source_pr['base']['sha'] == os.environ['SELECTOR_MAIN']
          assert source_pr['draft'] is True and source_pr['merged_at'] is None
          assert source_pr['commits'] == 1 and source_pr['changed_files'] == 1
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_HEAD'] and run['head_branch'] == os.environ['SOURCE_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          matched = [row for row in jobs if row['id'] == int(os.environ['SOURCE_JOB'])]
          assert len(matched) == 1 and matched[0]['name'] == 'evidence' and matched[0]['conclusion'] == 'failure'
          steps = {row['name']: row['conclusion'] for row in matched[0].get('steps', [])}
          assert steps['Authenticate exact V13 selection packet'] == 'success'
          assert steps['Fetch and bind exact Senstarg source revision'] == 'success'
          assert steps['Rerun complete canonical repository gate'] == 'failure'
          assert steps['Seal evidence packet'] == 'skipped'
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['SOURCE_ARTIFACT_BYTES'])
          assert artifact['digest'] == 'sha256:' + os.environ['SOURCE_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['SOURCE_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['SOURCE_HEAD']
          PY

      - name: Authenticate retained selector and exact Senstarg revision
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/source/diagnostics.zip" TARGET="$OUT/extracted" python3 - <<'PY'
          import hashlib, json, os, re, shutil, stat, unicodedata, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          target = Path(os.environ['TARGET'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          expected = {
              'doctor-who-cycle-012-evidence-preflight-v3-selector/SELECTION_COMPLETE',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/SHA256SUMS',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/SHA256SUMS.pre',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/autopilot-status.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/candidates.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/complete-gate.log',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/selection.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/selector-command.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/source-authentication.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/terminal-proof.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/transport-custody.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/v11-failure.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/v12-failure.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/v13-repair.json',
              'doctor-who-cycle-012-evidence-preflight-v3-selector/waterline-status.json',
              'doctor-who-cycle-012-evidence-preflight-v3/api/carrier-pr.json',
              'doctor-who-cycle-012-evidence-preflight-v3/api/selector-artifact.json',
              'doctor-who-cycle-012-evidence-preflight-v3/api/selector-jobs.json',
              'doctor-who-cycle-012-evidence-preflight-v3/api/selector-pr.json',
              'doctor-who-cycle-012-evidence-preflight-v3/api/selector-run.json',
              'doctor-who-cycle-012-evidence-preflight-v3/logs/complete-gate.log',
              'doctor-who-cycle-012-evidence-preflight-v3/receipt/selection.json',
              'doctor-who-cycle-012-evidence-preflight-v3/selector.zip',
              'doctor-who-cycle-012-evidence-preflight-v3/source/source-api.json',
              'doctor-who-cycle-012-evidence-preflight-v3/source/source.json',
              'doctor-who-cycle-012-evidence-preflight-v3/source/source.wikitext',
          }
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['SOURCE_ARTIFACT_FILES'])
              assert len(infos) == len({row.filename for row in infos})
              assert {row.filename for row in infos} == expected
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))

          selector = target / 'doctor-who-cycle-012-evidence-preflight-v3-selector'
          evidence = target / 'doctor-who-cycle-012-evidence-preflight-v3'
          pre = selector / 'SHA256SUMS.pre'
          sealed = selector / 'SHA256SUMS'
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = selector / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest

          def load_identity(path, expected_identity=None):
              data = json.loads(path.read_text())
              identity = data.pop('identity')
              assert sha(json.dumps(data, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == identity
              if expected_identity is not None:
                  assert identity == expected_identity
              data['identity'] = identity
              return data

          selection = load_identity(selector / 'selection.json', os.environ['SELECTION_IDENTITY'])
          transport = load_identity(selector / 'transport-custody.json', os.environ['TRANSPORT_IDENTITY'])
          terminal = load_identity(selector / 'terminal-proof.json', os.environ['TERMINAL_PROOF_IDENTITY'])
          load_identity(selector / 'v12-failure.json', os.environ['V12_FAILURE_IDENTITY'])
          load_identity(selector / 'v13-repair.json', os.environ['V13_REPAIR_IDENTITY'])
          source = load_identity(evidence / 'source/source.json', os.environ['SOURCE_RECEIPT_IDENTITY'])

          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v5'
          assert selection['canonical']['main'] == os.environ['SELECTOR_MAIN']
          assert selection['carrier'] == {
              'base': os.environ['SELECTOR_MAIN'], 'branch': os.environ['SELECTOR_BRANCH'],
              'head': os.environ['SELECTOR_HEAD'], 'pr': int(os.environ['SELECTOR_PR']),
          }
          assert selection['selected_task_id'] == os.environ['EXPECTED_TASK']
          assert selection['normalized'] == {
              'performer': os.environ['EXPECTED_PERFORMER'],
              'role': os.environ['EXPECTED_ROLE'],
              'mode': os.environ['EXPECTED_MODE'],
          }
          assert selection['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert selection['boundary']['selection_only'] is True
          assert selection['boundary']['lease_issued'] is False
          assert selection['boundary']['canonical_mutated'] is False
          assert transport['counts'] == {'stale_cycle12_refs': 17, 'observer_refs': 2, 'refs_to_delete': 19, 'pull_requests': 17}
          assert terminal['authority']['cycle_012_selection_authorized'] is True
          assert terminal['authority']['cycle_012_lease_issued'] is False

          api_bytes = (evidence / 'source/source-api.json').read_bytes()
          content_bytes = (evidence / 'source/source.wikitext').read_bytes()
          assert sha(api_bytes) == os.environ['SOURCE_API_SHA256']
          assert sha(content_bytes) == os.environ['SOURCE_CONTENT_SHA256']
          assert source['status'] == 'cycle-012-doctor-who-source-revision-bound-v2'
          assert source['selected_task_id'] == os.environ['EXPECTED_TASK']
          assert source['performer'] == os.environ['EXPECTED_PERFORMER']
          assert source['role'] == os.environ['EXPECTED_ROLE']
          assert source['mode'] == os.environ['EXPECTED_MODE']
          assert source['source_url'] == os.environ['EXPECTED_SOURCE_URL']
          assert source['source_fingerprint'] == os.environ['EXPECTED_SOURCE_FINGERPRINT']
          assert source['page_id'] == int(os.environ['SOURCE_PAGE_ID'])
          assert source['revision_id'] == int(os.environ['SOURCE_REVISION_ID'])
          assert source['revision_timestamp'] == os.environ['SOURCE_REVISION_TIMESTAMP']
          assert source['api_response_sha256'] == os.environ['SOURCE_API_SHA256']
          assert source['content_sha256'] == os.environ['SOURCE_CONTENT_SHA256']
          assert source['assertions'] == {
              'exact_page_title': True, 'immutable_revision_recorded': True,
              'performer_present': True, 'role_present': True,
          }
          folded = re.sub(r'\s+', ' ', unicodedata.normalize('NFKC', content_bytes.decode()).casefold())
          assert unicodedata.normalize('NFKC', os.environ['EXPECTED_PERFORMER']).casefold() in folded
          assert unicodedata.normalize('NFKC', os.environ['EXPECTED_ROLE']).casefold() in folded

          shutil.copytree(selector, root / 'payload/selector', dirs_exist_ok=True)
          for source_name, target_name in [
              ('source/source-api.json', 'source-api.json'),
              ('source/source.json', 'source.json'),
              ('source/source.wikitext', 'source.wikitext'),
          ]:
              src = evidence / source_name
              (root / 'payload/source' / target_name).write_bytes(src.read_bytes())
          auth = {
              'status': 'cycle-012-senstarg-source-diagnostic-authenticated-v1',
              'source_pr': int(os.environ['SOURCE_PR']),
              'source_run': int(os.environ['SOURCE_RUN']),
              'source_job': int(os.environ['SOURCE_JOB']),
              'artifact': int(os.environ['SOURCE_ARTIFACT']),
              'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
              'selection_identity': selection['identity'],
              'transport_identity': transport['identity'],
              'source_identity': source['identity'],
              'gate_failure': 'playwright browser absent',
              'source_retrieval_complete': True,
              'source_retried': False,
          }
          auth['identity'] = sha(json.dumps(auth, sort_keys=True, separators=(',', ':')).encode())
          (root / 'payload/source-authentication.json').write_text(json.dumps(auth, indent=2, sort_keys=True) + '\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"

      - name: Rerun current-main lifecycle, media, waterline, and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$LIVE_MAIN"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/payload/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/payload/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/payload/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/payload/status/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/payload/status/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/payload/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/payload/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/payload/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/payload/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/payload/status/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/payload/status/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/payload/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/payload/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"

      - name: Seal checksum-bound Senstarg evidence packet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          selection = json.loads((root / 'payload/selector/selection.json').read_text())
          transport = json.loads((root / 'payload/selector/transport-custody.json').read_text())
          source = json.loads((root / 'payload/source/source.json').read_text())
          source_auth = json.loads((root / 'payload/source-authentication.json').read_text())
          autopilot = json.loads((root / 'payload/status/autopilot-status.json').read_text())
          waterline = json.loads((root / 'payload/status/waterline-status.json').read_text())
          receipt = {
              'status': 'cycle-012-doctor-who-senstarg-evidence-complete-v2',
              'version': 2,
              'carrier': {
                  'pr': int(os.environ['CURRENT_PR']), 'branch': os.environ['BRANCH'],
                  'head': os.environ['CURRENT_HEAD'], 'base': os.environ['LIVE_MAIN'],
              },
              'canonical': {'live_main': os.environ['LIVE_MAIN'], 'selector_main': os.environ['SELECTOR_MAIN']},
              'selector': {
                  'pr': int(os.environ['SELECTOR_PR']), 'branch': os.environ['SELECTOR_BRANCH'],
                  'head': os.environ['SELECTOR_HEAD'], 'run': int(os.environ['SELECTOR_RUN']),
                  'job': int(os.environ['SELECTOR_JOB']), 'artifact': int(os.environ['SELECTOR_ARTIFACT']),
                  'artifact_sha256': os.environ['SELECTOR_ARTIFACT_SHA256'],
                  'selection_identity': selection['identity'], 'transport_identity': transport['identity'],
              },
              'task': {
                  'id': os.environ['EXPECTED_TASK'], 'performer': os.environ['EXPECTED_PERFORMER'],
                  'role': os.environ['EXPECTED_ROLE'], 'mode': os.environ['EXPECTED_MODE'],
                  'source_url': os.environ['EXPECTED_SOURCE_URL'],
                  'source_fingerprint': os.environ['EXPECTED_SOURCE_FINGERPRINT'],
              },
              'source': source,
              'source_authentication_identity': source_auth['identity'],
              'queue': {
                  'total': autopilot['total'], 'queued': autopilot['statuses']['queued'],
                  'resolved': autopilot['statuses']['resolved'], 'in_flight': autopilot['in_flight'],
              },
              'waterline': {
                  'phase': waterline['phase'], 'claim_allowed': waterline['claim_allowed'],
                  'media_debt': waterline['media']['debt'], 'unreceipted': waterline['cycles']['unreceipted'],
              },
              'gates': {
                  'source_diagnostic_authenticated': True, 'source_not_retried': True,
                  'immutable_revision': True, 'performer_match': True, 'role_match': True,
                  'cycle_010': True, 'cycle_011': True, 'autopilot': True,
                  'media_22_of_22': True, 'waterline': True, 'complete_rendered_gate': True,
              },
              'boundary': {
                  'evidence_only': True, 'repository_write': False, 'transport_mutation': False,
                  'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False,
                  'wall_created': False, 'character_image_adopted': False,
                  'performer_portrait_adopted': False, 'cycle_receipt_written': False,
                  'cycle_012_product_authority': False, 'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = sha(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          (root / 'payload/evidence.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'payload/EVIDENCE_COMPLETE').write_text(receipt['identity'] + '\n')
          PY

          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(cat "$OUT/payload/EVIDENCE_COMPLETE")" = "$(jq -r '.identity' "$OUT/payload/evidence.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-evidence-v2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-evidence-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-evidence-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
