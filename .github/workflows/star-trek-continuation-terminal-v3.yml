name: star-trek-continuation-terminal-v3

on:
  push:
    branches:
      - agent/star-trek-continuation-terminal-v3

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-continuation-terminal-v3
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Execute structured continuation reconciliation
        run: |
          set -euo pipefail
          cp .github/recovery/star-trek-continuation-terminal-v3.py /tmp/star-trek-continuation-terminal-v3.py
          python3 -m py_compile /tmp/star-trek-continuation-terminal-v3.py
          python3 /tmp/star-trek-continuation-terminal-v3.py
      - name: Upload structured terminal package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-continuation-terminal-v3-${{ github.run_id }}
          path: /tmp/star-trek-continuation-terminal-v3/
          if-no-files-found: warn
          retention-days: 30
