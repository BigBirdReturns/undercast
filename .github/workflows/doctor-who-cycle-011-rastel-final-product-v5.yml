name: doctor-who-cycle-011-rastel-final-product-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-product-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-product-v5
  cancel-in-progress: true

env:
  SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
  SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
  SOURCE_V2_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v2
  SOURCE_V2_COMMIT: 50084410519397f965558b1a47b357062676efe7
  SOURCE_V2_BLOB: 2f7a2bc0af3c011b92fd4a8575e488cbd1cb5b94
  SOURCE_V2_BYTES: "24558"
  SOURCE_V2_SHA256: bda54f65cb746e462a1fcae85df42ca56a634d07817f4625777ac0f63b95eeb2
  SOURCE_V2_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v2.yml
  SOURCE_V2_STEM: doctor-who-cycle-011-rastel-final-product-v2
  SOURCE_V1_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v1
  SOURCE_V1_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml
  SOURCE_V4_HEAD: 77406e59ac593b891c76c555511d44511b117394
  SOURCE_V4_BLOB: d370135379143677f6daa04b83f2c17d56827575
  SOURCE_V4_BYTES: "22218"
  SOURCE_V4_SHA256: dbba0af4ef7fa4daaf18700ea291f7551e1565ed0a3a6498a11c4cefba532c5a
  SOURCE_V4_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v4.yml
  SOURCE_V4_STEM: doctor-who-cycle-011-rastel-final-product-v4
  TARGET_STEM: doctor-who-cycle-011-rastel-final-product-v5
  BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v5
  SELF: .github/workflows/doctor-who-cycle-011-rastel-final-product-v5.yml
  RECOVERY_BLOB: 67aec9264648f06f1b85e0c2c7fba7751b1728de
  RECOVERY_BYTES: "6354"
  RECOVERY_SHA256: f3151ef7b2fc354b9c3d1230043df3a1a88dff7045b0b1c7855920ac7c87c933
  V3_PR: "784"
  V3_HEAD: ee3b814ae7edc4768e0f69058e526337cc06fef3
  V3_RUN: "31338262511"
  V3_QUALIFY_JOB: "93307571780"
  V4_PR: "799"
  TASK_ID: ap_25277c8fbe9e5369ed2e3d81
  WALL_ID: UC-1356
  EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
  PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-product-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      JOB_NAME: qualify
      EXPECTED_COUNT: "2"
      QUALIFY_OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-qualification
      PREFLIGHT_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v5-preflight
      PREFLIGHT_BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_WORKFLOW: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2
      PREFLIGHT_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-finalizer-execution-preflight-v2-
      EXECUTOR_MAIN_PLACEHOLDER: __RASTEL_EXECUTOR_MAIN__
      EXECUTOR_PR_PLACEHOLDER: __RASTEL_EXECUTOR_PR__
      EXECUTOR_HEAD_PLACEHOLDER: __RASTEL_EXECUTOR_HEAD__
      EXECUTOR_BRANCH_PLACEHOLDER: __RASTEL_EXECUTOR_BRANCH__
      EXECUTOR_SELF_PLACEHOLDER: __RASTEL_EXECUTOR_SELF__
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-qualify
      RECOVERY_ROOT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-qualify

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact registration-repair runner and recover qualification programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RECOVERY_ROOT"
          mkdir -p "$RECOVERY_ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RECOVERY_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$RECOVERY_ROOT/runner.sh"
          test "$(wc -c < "$RECOVERY_ROOT/runner.sh" | tr -d ' ')" = "$RECOVERY_BYTES"
          test "$(sha256sum "$RECOVERY_ROOT/runner.sh" | awk '{print $1}')" = "$RECOVERY_SHA256"
          bash -n "$RECOVERY_ROOT/runner.sh"
          RUNNER="$RECOVERY_ROOT/runner.sh" python3 - <<'PY'
          import re,os
          from pathlib import Path
          text=Path(os.environ['RUNNER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==1
          compile(blocks[0],'<rastel-final-product-v5-recovery>','exec')
          PY
          chmod 700 "$RECOVERY_ROOT/runner.sh"
          "$RECOVERY_ROOT/runner.sh"

      - name: Execute recovered V5 qualification programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() {
            [ -f "$GITHUB_ENV" ] || return 0
            while IFS= read -r row; do
              [ -z "$row" ] && continue
              case "$row" in *'<<'*) echo "unsupported multiline GITHUB_ENV row" >&2; exit 1 ;; *=*) export "$row" ;; esac
            done < "$GITHUB_ENV"
          }
          for script in "$BOOTSTRAP"/jobs/qualify/*.sh; do bash "$script"; apply_github_env; done
          cp "$BOOTSTRAP/qualify-recovery.json" "$QUALIFY_OUT/v5-registration-recovery.json"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v5-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-qualification
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-preflight
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-qualify
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-qualify
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  settle:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      JOB_NAME: settle
      EXPECTED_COUNT: "2"
      PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v5-settle-input
      OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-settlement
      QUALIFICATION_NAME: doctor-who-cycle-011-rastel-final-product-v5-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-settle
      RECOVERY_ROOT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-settle

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact registration-repair runner and recover settlement programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RECOVERY_ROOT"
          mkdir -p "$RECOVERY_ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RECOVERY_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$RECOVERY_ROOT/runner.sh"
          test "$(wc -c < "$RECOVERY_ROOT/runner.sh" | tr -d ' ')" = "$RECOVERY_BYTES"
          test "$(sha256sum "$RECOVERY_ROOT/runner.sh" | awk '{print $1}')" = "$RECOVERY_SHA256"
          bash -n "$RECOVERY_ROOT/runner.sh"
          chmod 700 "$RECOVERY_ROOT/runner.sh"
          "$RECOVERY_ROOT/runner.sh"

      - name: Execute recovered V5 settlement programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() { [ -f "$GITHUB_ENV" ] || return 0; while IFS= read -r row; do [ -z "$row" ] && continue; case "$row" in *'<<'*) exit 1 ;; *=*) export "$row" ;; esac; done < "$GITHUB_ENV"; }
          for script in "$BOOTSTRAP"/jobs/settle/*.sh; do bash "$script"; apply_github_env; done
          cp "$BOOTSTRAP/settle-recovery.json" "$OUT/v5-registration-recovery.json"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v5-settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-settlement-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-settle-input
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-settlement
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-settle
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-settle
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  materialize:
    needs: settle
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_PR: "${{ github.event.pull_request.number }}"
      CARRIER_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      JOB_NAME: materialize
      EXPECTED_COUNT: "2"
      QUALIFICATION_NAME: doctor-who-cycle-011-rastel-final-product-v5-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      SETTLEMENT_NAME: doctor-who-cycle-011-rastel-final-product-v5-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      QUAL_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v5-materialize-qualification
      SETTLE_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v5-materialize-settlement
      CONTROL_OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-control
      PRODUCT_OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-product
      PRODUCT_WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-product-v5-review-worktree
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-materialize
      RECOVERY_ROOT: /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-materialize

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact registration-repair runner and recover materialization programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RECOVERY_ROOT"
          mkdir -p "$RECOVERY_ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RECOVERY_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$RECOVERY_ROOT/runner.sh"
          test "$(wc -c < "$RECOVERY_ROOT/runner.sh" | tr -d ' ')" = "$RECOVERY_BYTES"
          test "$(sha256sum "$RECOVERY_ROOT/runner.sh" | awk '{print $1}')" = "$RECOVERY_SHA256"
          bash -n "$RECOVERY_ROOT/runner.sh"
          chmod 700 "$RECOVERY_ROOT/runner.sh"
          "$RECOVERY_ROOT/runner.sh"

      - name: Execute recovered V5 materialization programs
        shell: bash
        run: |
          set -euo pipefail
          apply_github_env() { [ -f "$GITHUB_ENV" ] || return 0; while IFS= read -r row; do [ -z "$row" ] && continue; case "$row" in *'<<'*) exit 1 ;; *=*) export "$row" ;; esac; done < "$GITHUB_ENV"; }
          for script in "$BOOTSTRAP"/jobs/materialize/*.sh; do bash "$script"; apply_github_env; done
          cp "$BOOTSTRAP/materialize-recovery.json" "$CONTROL_OUT/v5-registration-recovery.json"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-product
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-control
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-materialize-qualification
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-materialize-settlement
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-control
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-product
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-bootstrap-materialize
            /tmp/doctor-who-cycle-011-rastel-final-product-v5-recovery-materialize
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
