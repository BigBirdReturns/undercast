name: card-backfill-uc-070-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-070.json"
      - "scripts/card-backfill-uc-070-discover.mjs"
      - ".github/workflows/card-backfill-uc-070-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-070-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-013'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-013
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-070 audit and official-source boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-070.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-070'||row.actor!=='Bill Nighy'||row.character!=='Davy Jones'||row.side!=='still')throw new Error('UC-070 control drift');
          if(row.audit_id!=='ma_d00211e3a56dbe99d337f38e'||row.selector_artifact?.artifact_id!==8636606479||row.selector_artifact?.head_sha!=='a793cd5ef8a8349caa1995a82dcc912707fa4d9d')throw new Error('UC-070 selector or audit custody drift');
          if(row.sources?.length!==4||!row.sources.some(source=>source.key==='disney-dead-mans-chest')||row.sources.filter(source=>source.provider==='Industrial Light & Magic').length!==3)throw new Error('UC-070 official source set drift');
          console.log('PASS — exact UC-070 audit, selector and Disney/ILM source set bound');
          NODE
      - name: Gather and hash exact Davy Jones candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-070
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-070-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-070-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages, hashes and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-070-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-070
            ${{ runner.temp }}/card-backfill-uc-070-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
