name: apply-doctor-who-certified-paused-001

on:
  push:
    branches:
      - agent/doctor-who-certified-paused-001
    paths:
      - ".github/workflows/apply-doctor-who-certified-paused-001.yml"

permissions:
  contents: write

concurrency:
  group: apply-doctor-who-certified-paused-001
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/doctor-who-certified-paused-001
  AUTHORIZED_HEAD: ${{ github.sha }}
  EXACT_MAIN: 57f1d7dc4b41679d660ed51b85d3fc7e0d8f9e43
  SELF: .github/workflows/apply-doctor-who-certified-paused-001.yml

jobs:
  apply:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Regenerate the derivative adapter baseline
        run: |
          set -euo pipefail
          node scripts/census-adapter.mjs write
          node scripts/census-adapter.mjs check
          git rm "$SELF"
          git add data/review/adapter-sdk/BASELINE.json
          git diff --cached --check

      - name: Smoke the complete certified-paused product
        run: |
          set -euo pipefail
          node scripts/estate-certification-fixtures.mjs
          npm run adapter:fixtures
          npm run gate 2>&1 | tee /tmp/certified-paused-gate.log

      - name: Publish the workflow-free exact product under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          node scripts/census-adapter.mjs check
          node scripts/estate-certification-fixtures.mjs

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Estate registry: publish Doctor Who certified-paused state' \
            -m 'regenerate the adapter baseline after the state transition' \
            -m 'complete rendered gate passed before publication'
          new_head="$(git rev-parse HEAD)"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/ESTATE-REGISTRY.json
          data/review/adapter-sdk/BASELINE.json
          package.json
          scripts/estate-certification-fixtures.mjs
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate and path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-certified-paused-${{ github.run_id }}
          path: |
            /tmp/certified-paused-gate.log
            /tmp/final-paths.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
