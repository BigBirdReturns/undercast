name: doctor-who-cycle-007-finalize-v13

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-007-finalize-v13.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-007-finalize-v13-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CURRENT_MAIN: ${{ github.event.pull_request.base.sha }}
  REVIEWED_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  ORIGINAL_CARRIER_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  REVIEWED_CANDIDATE_COMMIT: 1bac55a7cd06e64840c79d42924472a0e0c6910e
  REVIEWED_CANDIDATE_TREE: 121ecef1c981e6da2048450902721e336c051138
  REVIEWED_CANDIDATE_GATE_SHA256: 6499879b6246646228767c38e87d45447082e89fb03fa48e6ef5950005d95dd6
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_SHA256: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_NAME: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_SHA256: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  REVIEW_RUN: "31066271720"
  REVIEW_JOB: "92504537621"
  REVIEW_ARTIFACT_ID: "8953936181"
  REVIEW_ARTIFACT_NAME: doctor-who-cycle-007-v8-independent-review-31066271720
  REVIEW_ARTIFACT_SHA256: 7adfaa0e3f83d5fe05774dbee75b77fd381750ccec2f5b825d517ad8b5530e0b
  REVIEW_RECEIPT_SHA256: 1d33abdd3f3e5b6fed603d1c2de4a339216f96c2e91433dc617af5e0a7f6ad88
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/doctor-who-cycle-007-finalize-v13.yml
  ROOT: /tmp/doctor-who-cycle-007-finalize-v13
  DIAGNOSTICS_ROOT: /tmp/doctor-who-cycle-007-finalize-v13/diagnostics
  REVIEW_ROOT: /tmp/doctor-who-cycle-007-finalize-v13/review
  REPLAY: /tmp/doctor-who-cycle-007-finalize-v13/replay
  INTEGRATION: /tmp/doctor-who-cycle-007-finalize-v13/integration
  OUT: /tmp/doctor-who-cycle-007-finalize-v13/out
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-finalize-v13/diagnostics/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-finalize-v13/out/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-finalize-v13/diagnostics/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-finalize-v13/diagnostics/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-finalize-v13/diagnostics/media-review
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v13-finalization'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-file read-only finalization carrier and current main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT" "$DIAGNOSTICS_ROOT" "$REVIEW_ROOT" "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-list --count "$CURRENT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$CURRENT_MAIN" HEAD)" = "$CURRENT_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$CURRENT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CURRENT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          test "$(git merge-base "$REVIEWED_MAIN" "$CURRENT_MAIN")" = "$REVIEWED_MAIN"
          git diff --name-only "$REVIEWED_MAIN"..."$CURRENT_MAIN" | LC_ALL=C sort > "$OUT/current-main-drift-paths.txt"
          test -z "$(git status --porcelain)"

      - name: Bind immutable candidate, diagnostics, and independent-review custody
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}" > "$OUT/candidate-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > "$OUT/candidate-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" > "$OUT/candidate-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${DIAGNOSTICS_ARTIFACT_ID}" > "$OUT/diagnostics-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}" > "$OUT/review-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEW_RUN}/jobs?per_page=100" > "$OUT/review-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_ARTIFACT_ID}" > "$OUT/review-artifact.json"

          jq -e --argjson run "$CANDIDATE_RUN" --arg head "$ORIGINAL_CARRIER_HEAD" \
            '.id == $run and .head_sha == $head and .status == "completed" and .conclusion == "success"' \
            "$OUT/candidate-run.json" >/dev/null
          jq -e --argjson job "$CANDIDATE_JOB" \
            'any(.jobs[]; .id == $job and .name == "materialize" and .status == "completed" and .conclusion == "success")' \
            "$OUT/candidate-jobs.json" >/dev/null
          jq -e --argjson id "$CANDIDATE_ARTIFACT_ID" --arg name "$CANDIDATE_ARTIFACT_NAME" \
            --arg digest "sha256:${CANDIDATE_ARTIFACT_SHA256}" --argjson run "$CANDIDATE_RUN" --arg head "$ORIGINAL_CARRIER_HEAD" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $head' \
            "$OUT/candidate-artifact.json" >/dev/null
          jq -e --argjson id "$DIAGNOSTICS_ARTIFACT_ID" --arg name "$DIAGNOSTICS_ARTIFACT_NAME" \
            --arg digest "sha256:${DIAGNOSTICS_ARTIFACT_SHA256}" --argjson run "$CANDIDATE_RUN" --arg head "$ORIGINAL_CARRIER_HEAD" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $head' \
            "$OUT/diagnostics-artifact.json" >/dev/null
          jq -e --argjson run "$REVIEW_RUN" \
            '.id == $run and .status == "completed" and .conclusion == "success"' "$OUT/review-run.json" >/dev/null
          jq -e --argjson job "$REVIEW_JOB" \
            'any(.jobs[]; .id == $job and .name == "review" and .status == "completed" and .conclusion == "success")' \
            "$OUT/review-jobs.json" >/dev/null
          jq -e --argjson id "$REVIEW_ARTIFACT_ID" --arg name "$REVIEW_ARTIFACT_NAME" \
            --arg digest "sha256:${REVIEW_ARTIFACT_SHA256}" --argjson run "$REVIEW_RUN" \
            '.id == $id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run' \
            "$OUT/review-artifact.json" >/dev/null

      - name: Download immutable candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT_NAME }}
          path: ${{ env.DIAGNOSTICS_ROOT }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31059092270

      - name: Download immutable independent review
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REVIEW_ARTIFACT_NAME }}
          path: ${{ env.REVIEW_ROOT }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31066271720

      - name: Verify exact review, payload, and no-publication boundary
        shell: bash
        run: |
          set -euo pipefail
          review="$REVIEW_ROOT/doctor-who-cycle-007-v8-independent-review.json"
          test -f "$review"
          test "$(jq -r '.receipt_sha256' "$review")" = "$REVIEW_RECEIPT_SHA256"
          jq -e --arg main "$REVIEWED_MAIN" --arg commit "$REVIEWED_CANDIDATE_COMMIT" \
            --arg tree "$REVIEWED_CANDIDATE_TREE" --arg gate "$REVIEWED_CANDIDATE_GATE_SHA256" '
              .transaction == "DOCTOR-WHO-CYCLE-007-KRAGAR-INDEPENDENT-CANDIDATE-REVIEW-V1" and
              .verdict == "approved-for-separate-finalization" and
              .base_main == $main and
              .candidate.commit == $commit and .candidate.tree == $tree and
              .candidate.gate_sha256 == $gate and .candidate.paths == 41 and
              .target.wall_id == "UC-1352" and
              .target.task_id == "ap_ffea809b980b468b33fa462c" and
              .target.still_sha256 == "f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409" and
              .boundary.canonical_lease_issued == false and
              .boundary.live_queue_mutated == false and
              .boundary.merge_authorized == false and
              .boundary.product_published == false
            ' "$review" >/dev/null

          test -f "$CYCLE_ASSET_DIR/transport-manifest.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.CYCLE_ASSET_DIR;
          const manifest = JSON.parse(fs.readFileSync(`${root}/transport-manifest.json`, 'utf8'));
          if (manifest.version !== 8 || manifest.transaction !== 'DOCTOR-WHO-CYCLE-007-KRAGAR-MATERIALIZER-V8') {
            throw new Error('payload manifest identity drifted');
          }
          if (manifest.exact_main !== process.env.REVIEWED_MAIN || manifest.attested_main !== process.env.ATTESTED_MAIN) {
            throw new Error('payload main custody drifted');
          }
          const corrected = {
            '02-materialize.sh': {
              bytes: 1927,
              sha256: '4c2c40f1cad46a2d0787f02d6395ae77f9cffcfe5316ae27009ac6f58e104fe6',
            },
            '03-candidate.sh': {
              bytes: 2619,
              sha256: 'f454636883f6e1f3fcadf5308866614acb92c83abf83ef5df2ad63775c931910',
            },
          };
          for (const row of manifest.files) {
            const bytes = fs.readFileSync(`${root}/${row.path}`);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            const expected = corrected[row.path] ?? row;
            if (bytes.length !== expected.bytes || digest !== expected.sha256 || row.mode !== '100755') {
              throw new Error(`payload member drifted: ${row.path}`);
            }
          }
          NODE
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          for script in "$CYCLE_ASSET_DIR"/*.sh; do bash -n "$script"; done
          for script in "$CYCLE_ASSET_DIR"/*.mjs; do node --check "$script"; done
          test "$(cat "$DIAGNOSTICS_ROOT/candidate-commit.txt")" = "$REVIEWED_CANDIDATE_COMMIT"
          test "$(cat "$DIAGNOSTICS_ROOT/candidate-tree.txt")" = "$REVIEWED_CANDIDATE_TREE"
          test "$(cat "$DIAGNOSTICS_ROOT/candidate-gate.sha256")" = "$REVIEWED_CANDIDATE_GATE_SHA256"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deterministic runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Reconstruct exact independently reviewed candidate object
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$REPLAY" "$REVIEWED_MAIN"
          cd "$REPLAY"
          git checkout -B agent/doctor-who-cycle-007-exact-replay "$REVIEWED_MAIN"
          npm ci
          export EXACT_MAIN="$REVIEWED_MAIN"
          export AUTHORIZED_HEAD="$ORIGINAL_CARRIER_HEAD"
          bash "$CYCLE_ASSET_DIR/01-prepare.sh"
          bash "$CYCLE_ASSET_DIR/02-materialize.sh"

          cp "$DIAGNOSTICS_ROOT/expected-candidate-paths.txt" "$OUT/expected-candidate-paths.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } |
            LC_ALL=C sort > "$OUT/replay-candidate-paths.txt"
          diff -u "$OUT/expected-candidate-paths.txt" "$OUT/replay-candidate-paths.txt"
          git add --pathspec-from-file="$OUT/expected-candidate-paths.txt"
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/replay-staged-paths.txt"
          diff -u "$OUT/expected-candidate-paths.txt" "$OUT/replay-staged-paths.txt"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          replay_tree="$(git write-tree)"
          test "$replay_tree" = "$REVIEWED_CANDIDATE_TREE"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE='1785975531 +0000'
          export GIT_COMMITTER_DATE='1785975531 +0000'
          replay_commit="$(
            printf '%s\n' 'Doctor Who: stage cycle 007 Kragar candidate' |
              git commit-tree "$replay_tree" -p "$REVIEWED_MAIN"
          )"
          test "$replay_commit" = "$REVIEWED_CANDIDATE_COMMIT"
          git reset --hard "$replay_commit"
          test "$(git rev-parse HEAD)" = "$REVIEWED_CANDIDATE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$REVIEWED_CANDIDATE_TREE"
          test "$(git show -s --format=%P HEAD)" = "$REVIEWED_MAIN"
          test -z "$(git status --porcelain)"

          git diff --binary "$REVIEWED_MAIN"..HEAD > "$OUT/reviewed-candidate.diff"
          git bundle create "$OUT/reviewed-candidate.bundle" HEAD "^$REVIEWED_MAIN"
          git cat-file -p HEAD > "$OUT/reviewed-candidate-commit-object.txt"
          printf '%s\n' "$REVIEWED_CANDIDATE_COMMIT" > "$OUT/candidate-commit.txt"
          printf '%s\n' "$REVIEWED_CANDIDATE_TREE" > "$OUT/candidate-tree.txt"

      - name: Integrate reviewed candidate content onto exact current main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$INTEGRATION" "$CURRENT_MAIN"
          cd "$INTEGRATION"
          git checkout -B agent/doctor-who-cycle-007-integrated-product "$CURRENT_MAIN"

          comm -12 "$OUT/current-main-drift-paths.txt" "$OUT/expected-candidate-paths.txt" > "$OUT/candidate-overlap.txt"
          test ! -s "$OUT/candidate-overlap.txt"
          git apply --binary "$OUT/reviewed-candidate.diff"
          { git diff --name-only; git ls-files --others --exclude-standard; } |
            LC_ALL=C sort > "$OUT/integrated-candidate-paths.txt"
          diff -u "$OUT/expected-candidate-paths.txt" "$OUT/integrated-candidate-paths.txt"

          npm ci
          npx playwright install --with-deps chromium
          git add --pathspec-from-file="$OUT/expected-candidate-paths.txt"
          npm run gate 2>&1 | tee "$OUT/integrated-candidate-gate.log"
          sha256sum "$OUT/integrated-candidate-gate.log" | awk '{print $1}' > "$OUT/integrated-candidate-gate.sha256"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/integrated-candidate-staged-paths.txt"
          diff -u "$OUT/expected-candidate-paths.txt" "$OUT/integrated-candidate-staged-paths.txt"

      - name: Bind finalization job identity
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "$OUT/finalization-jobs.json"
          job="$(jq -r '.jobs[] | select(.name == "finalize") | .id' "$OUT/finalization-jobs.json")"
          test "$job" -gt 0
          printf 'WORKFLOW_JOB=%s\n' "$job" >> "$GITHUB_ENV"
          printf '%s\n' "$job" > "$OUT/finalization-job.txt"

      - name: Write reviewed cycle receipt over integrated candidate
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ env.REVIEWED_CANDIDATE_COMMIT }}
          CANDIDATE_GATE_SHA256: ${{ env.REVIEWED_CANDIDATE_GATE_SHA256 }}
          CANDIDATE_ARTIFACT_NAME: ${{ env.CANDIDATE_ARTIFACT_NAME }}
          CANDIDATE_ARTIFACT_ID: ${{ env.CANDIDATE_ARTIFACT_ID }}
          CANDIDATE_ARTIFACT_SHA256: ${{ env.CANDIDATE_ARTIFACT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$INTEGRATION"
          bash "$CYCLE_ASSET_DIR/04-finalize.sh"

      - name: Run complete receipt-bearing gate and seal one-commit current-main product
        shell: bash
        run: |
          set -euo pipefail
          cd "$INTEGRATION"
          cat > "$OUT/expected-finalizer-paths.txt" <<'PATHS'
          data/ESTATE-REGISTRY.json
          data/WATERLINE-STATE.json
          data/journal/waterline.jsonl
          data/review/adapter-sdk/BASELINE.json
          data/review/adapter-sdk/doctor-who-cycle-007-kragar.json
          docs/AUTOPILOT.md
          package.json
          scripts/doctor-who-cycle-007.mjs
          PATHS
          sed -i 's/^          //' "$OUT/expected-finalizer-paths.txt"
          LC_ALL=C sort -o "$OUT/expected-finalizer-paths.txt" "$OUT/expected-finalizer-paths.txt"

          { git diff --name-only; git ls-files --others --exclude-standard; } |
            LC_ALL=C sort > "$OUT/actual-finalizer-paths.txt"
          diff -u "$OUT/expected-finalizer-paths.txt" "$OUT/actual-finalizer-paths.txt"
          git add --pathspec-from-file="$OUT/expected-finalizer-paths.txt"
          cat "$OUT/expected-candidate-paths.txt" "$OUT/expected-finalizer-paths.txt" |
            LC_ALL=C sort -u > "$OUT/expected-final-paths.txt"
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/pre-gate-final-paths.txt"
          diff -u "$OUT/expected-final-paths.txt" "$OUT/pre-gate-final-paths.txt"
          test -z "$(grep '^\.github/workflows/' "$OUT/pre-gate-final-paths.txt" || true)"

          npm run gate 2>&1 | tee "$OUT/final-gate.log"
          sha256sum "$OUT/final-gate.log" | awk '{print $1}' > "$OUT/final-gate.sha256"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/post-gate-final-paths.txt"
          diff -u "$OUT/expected-final-paths.txt" "$OUT/post-gate-final-paths.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Doctor Who: complete reviewed cycle 007 for Kragar'
          git rev-parse HEAD > "$OUT/integrated-final-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$OUT/integrated-final-tree.txt"
          test "$(git show -s --format=%P HEAD)" = "$CURRENT_MAIN"
          git diff --name-only "$CURRENT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/integrated-final-paths.txt"
          diff -u "$OUT/expected-final-paths.txt" "$OUT/integrated-final-paths.txt"
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/cycle-007-check.log"

          git format-patch --stdout "$CURRENT_MAIN"..HEAD > "$OUT/doctor-who-cycle-007-current-main.patch"
          git bundle create "$OUT/doctor-who-cycle-007-current-main.bundle" HEAD "^$CURRENT_MAIN"
          git diff --binary "$CURRENT_MAIN"..HEAD > "$OUT/doctor-who-cycle-007-current-main.diff"
          git show --stat --oneline --decorate HEAD > "$OUT/integrated-final-stat.txt"
          sha256sum \
            data/review/adapter-sdk/doctor-who-cycle-007-kragar.json \
            scripts/doctor-who-cycle-007.mjs \
            "$OUT/doctor-who-cycle-007-current-main.patch" \
            "$OUT/doctor-who-cycle-007-current-main.bundle" \
            > "$OUT/final-product.sha256"
          test -z "$(git status --porcelain)"

      - name: Create immutable current-main publication handoff
        shell: bash
        run: |
          set -euo pipefail
          cd "$INTEGRATION"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const out = process.env.OUT;
          const files = fs.readFileSync(`${out}/integrated-final-paths.txt`, 'utf8')
            .trim().split(/\n/).filter(Boolean);
          const hashes = {};
          for (const file of files) {
            hashes[file] = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          }
          const handoff = {
            schema_version: 1,
            kind: 'doctor-who-cycle-007-current-main-product',
            repository: process.env.GITHUB_REPOSITORY,
            run_id: Number(process.env.GITHUB_RUN_ID),
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            event_name: process.env.GITHUB_EVENT_NAME,
            carrier_head: process.env.HEAD_SHA,
            current_main: process.env.CURRENT_MAIN,
            reviewed_main: process.env.REVIEWED_MAIN,
            reviewed_candidate_commit: process.env.REVIEWED_CANDIDATE_COMMIT,
            reviewed_candidate_tree: process.env.REVIEWED_CANDIDATE_TREE,
            independent_review_receipt_sha256: process.env.REVIEW_RECEIPT_SHA256,
            integrated_final_commit: fs.readFileSync(`${out}/integrated-final-commit.txt`, 'utf8').trim(),
            integrated_final_tree: fs.readFileSync(`${out}/integrated-final-tree.txt`, 'utf8').trim(),
            integrated_candidate_gate_sha256: fs.readFileSync(`${out}/integrated-candidate-gate.sha256`, 'utf8').trim(),
            final_gate_sha256: fs.readFileSync(`${out}/final-gate.sha256`, 'utf8').trim(),
            files: hashes,
            boundary: {
              repository_written: false,
              product_published: false,
              merge_authorized: false,
              eighth_lease_issued: false,
            },
          };
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const body = JSON.stringify(stable(handoff), null, 2) + '\n';
          handoff.receipt_sha256 = crypto.createHash('sha256').update(body).digest('hex');
          fs.writeFileSync(`${out}/publisher-handoff.json`, JSON.stringify(handoff, null, 2) + '\n');
          NODE
          test -z "$(git status --porcelain)"

      - name: Upload exact finalization and current-main product artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-finalization-v13-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
