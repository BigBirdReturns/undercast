name: doctor-who-cycle-008-kreg-media-recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery.yml
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery
  PREFLIGHT_RUN: "31088359558"
  PREFLIGHT_JOB: "92573114327"
  PREFLIGHT_HEAD: e44f5578c31bccd9e9271af12d16171f592870ad
  PREFLIGHT_ARTIFACT_ID: "8962423257"
  PREFLIGHT_ARTIFACT: doctor-who-cycle-008-preflight-v3-31088359558
  PREFLIGHT_ARTIFACT_SHA256: 38c606f921bdd06f3285967b37194dc50cc558bba43c115aee5d88045f9d445c
  TASK_ID: ap_469d79ea29fd7f877395d20f
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  FILE_TITLE: File:Kree.jpg
  GH_TOKEN: ${{ github.token }}

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery.yml
            data
            images
            scripts

      - name: Bind exact main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/preflight"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            > "$OUT/main-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Bind exact successful cycle-008 preflight
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREFLIGHT_ARTIFACT_ID}" > "$OUT/preflight-artifact-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}" > "$OUT/preflight-run-api.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREFLIGHT_RUN}/jobs?per_page=100" > "$OUT/preflight-jobs-api.json"

          jq -e \
            --argjson id "$PREFLIGHT_ARTIFACT_ID" \
            --arg name "$PREFLIGHT_ARTIFACT" \
            --arg digest "sha256:${PREFLIGHT_ARTIFACT_SHA256}" \
            --argjson run "$PREFLIGHT_RUN" '
              .id == $id and .name == $name and .digest == $digest and
              .workflow_run.id == $run and .expired == false
            ' "$OUT/preflight-artifact-api.json" >/dev/null

          jq -e \
            --argjson run "$PREFLIGHT_RUN" \
            --arg head "$PREFLIGHT_HEAD" '
              .id == $run and .head_sha == $head and
              .status == "completed" and .conclusion == "success"
            ' "$OUT/preflight-run-api.json" >/dev/null

          jq -e \
            --argjson job "$PREFLIGHT_JOB" '
              any(.jobs[];
                .id == $job and .name == "preflight" and
                .status == "completed" and .conclusion == "success" and
                any(.steps[]; .name == "Bind one-file carrier and fully cleaned cycle-007 main" and .conclusion == "success") and
                any(.steps[]; .name == "Prove live cycle-007 floor and complete gate" and .conclusion == "success") and
                any(.steps[]; .name == "Select deterministic cycle-008 task without claiming it" and .conclusion == "success") and
                any(.steps[]; .name == "Recover every revision-bound source body" and .conclusion == "success") and
                any(.steps[]; .name == "Export exact controls and no-write boundary" and .conclusion == "success")
              )
            ' "$OUT/preflight-jobs-api.json" >/dev/null

      - name: Download exact cycle-008 preflight packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT }}
          path: ${{ env.OUT }}/preflight
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.PREFLIGHT_RUN }}

      - name: Verify exact Kreg task and source body
        shell: bash
        run: |
          set -euo pipefail
          packet="$OUT/preflight"
          for file in selected-task.json source-01.wikitext recovered-sources.json boundary.json complete-gate.sha256 selection-sha256.txt; do
            test -f "$packet/$file"
          done
          test "$(sha256sum "$packet/source-01.wikitext" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"
          test "$(wc -c < "$packet/source-01.wikitext")" -eq 840
          jq -e \
            --arg exact "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" '
              .exact_main == $exact and .lease_issued == false and
              .global_active_count == 0 and
              .queue.queued == 309 and .queue.resolved == 7 and
              .counts.compatible == 309 and .counts.incompatible == 0 and
              .selected.task_id == $task and
              .selected.performer == "Dan Starkey" and
              .selected.character == "Kreg" and
              .selected.performance_modes == ["voice"] and
              .selected.source_fingerprint == $fingerprint and
              .task.status == "queued"
            ' "$packet/selected-task.json" >/dev/null
          grep -F '|image             =Kree.jpg' "$packet/source-01.wikitext" >/dev/null
          grep -F '|voice actor       = Dan Starkey' "$packet/source-01.wikitext" >/dev/null
          grep -F '|only              = The Great Sontaran War (audio story)' "$packet/source-01.wikitext" >/dev/null

      - name: Recover exact source-file metadata, page body, and bytes
        shell: bash
        run: |
          set -euo pipefail
          api='https://tardis.fandom.com/api.php'
          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=imageinfo \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'iiprop=url|size|mime|sha1|timestamp|mediatype|extmetadata' \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H 'User-Agent: Undercast exact Kreg media recovery/1.0' \
            > "$OUT/file-imageinfo-api.json"

          jq -e \
            --arg title "$FILE_TITLE" '
              .query.pages | length == 1 and
              .[0].title == $title and
              (.[0].missing | not) and
              (.[0].imageinfo | length == 1) and
              (.[0].imageinfo[0].url | type == "string") and
              .[0].imageinfo[0].size > 0 and
              .[0].imageinfo[0].width > 0 and
              .[0].imageinfo[0].height > 0
            ' "$OUT/file-imageinfo-api.json" >/dev/null

          file_url="$(jq -r '.query.pages[0].imageinfo[0].url' "$OUT/file-imageinfo-api.json")"
          curl -fsSL --retry 4 --retry-all-errors "$file_url" \
            -H 'User-Agent: Undercast exact Kreg media recovery/1.0' \
            -o "$OUT/kreg-source-original"
          test "$(wc -c < "$OUT/kreg-source-original")" -eq "$(jq -r '.query.pages[0].imageinfo[0].size' "$OUT/file-imageinfo-api.json")"
          identify -verbose "$OUT/kreg-source-original" > "$OUT/source-identify-verbose.txt"
          identify -format '%m %w %h %[channels]\n' "$OUT/kreg-source-original" > "$OUT/source-identify.txt"
          sha256sum "$OUT/kreg-source-original" > "$OUT/source-sha256.txt"

          curl -fsSL --retry 4 --retry-all-errors --get "$api" \
            --data-urlencode action=query \
            --data-urlencode prop=revisions \
            --data-urlencode "titles=$FILE_TITLE" \
            --data-urlencode 'rvprop=ids|timestamp|content' \
            --data-urlencode rvslots=main \
            --data-urlencode format=json \
            --data-urlencode formatversion=2 \
            --data-urlencode origin='*' \
            -H 'User-Agent: Undercast exact Kreg media recovery/1.0' \
            > "$OUT/file-page-api.json"
          jq -r '.query.pages[0].revisions[0].slots.main.content' "$OUT/file-page-api.json" > "$OUT/file-page.wikitext"

          jq '
            .query.pages[0] as $page |
            $page.imageinfo[0] as $ii |
            {
              file_title: $page.title,
              pageid: $page.pageid,
              timestamp: $ii.timestamp,
              mime: $ii.mime,
              mediatype: $ii.mediatype,
              source_width: $ii.width,
              source_height: $ii.height,
              source_bytes: $ii.size,
              mediawiki_sha1: $ii.sha1,
              source_url: $ii.url,
              descriptionshorturl: $ii.descriptionshorturl,
              extmetadata: $ii.extmetadata
            }
          ' "$OUT/file-imageinfo-api.json" > "$OUT/kreg-source-metadata.json"
          jq --arg sha "$(awk '{print $1}' "$OUT/source-sha256.txt")" '. + {source_sha256:$sha}' \
            "$OUT/kreg-source-metadata.json" > "$OUT/kreg-source-metadata.bound.json"
          mv "$OUT/kreg-source-metadata.bound.json" "$OUT/kreg-source-metadata.json"

      - name: Refuse duplicate adoption and project quality paths
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(awk '{print $1}' "$OUT/source-sha256.txt")"
          find images -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/current-image-sha256.txt"
          if grep -F "${source_sha}  " "$OUT/current-image-sha256.txt"; then
            echo 'Kreg source bytes already exist in repository media' >&2
            exit 1
          fi
          grep -R -n -E "(${source_sha}|File:Kree\.jpg|Kree\.jpg)" data > "$OUT/current-adoption-matches.txt" || true
          test ! -s "$OUT/current-adoption-matches.txt"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/current-media-gate.log"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const doc = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const records = Array.isArray(doc) ? doc : (doc.records ?? doc.specimens ?? doc.items);
          if (!Array.isArray(records)) throw new Error('specimen collection shape is unsupported');
          const src = (value) => typeof value === 'string' ? value : value?.src;
          const missing = records.filter((record) => !src(record.still) && !src(record.portrait)).length;
          const current = {total: records.length, fully_unillustrated: missing, ratio: missing / records.length};
          const exact_still = {total: records.length + 1, fully_unillustrated: missing, ratio: missing / (records.length + 1)};
          const no_media = {total: records.length + 1, fully_unillustrated: missing + 1, ratio: (missing + 1) / (records.length + 1)};
          if (!(exact_still.ratio < current.ratio)) throw new Error('exact-still projection is not non-regressing');
          fs.writeFileSync(`${process.env.OUT}/quality-projection.json`, `${JSON.stringify({current, exact_character_still: exact_still, no_media}, null, 2)}\n`);
          NODE
          test -z "$(git status --porcelain)"

      - name: Record strict no-write media-recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg exact "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" \
            --arg file "$FILE_TITLE" \
            --arg source_sha "$(awk '{print $1}' "$OUT/source-sha256.txt")" '
            {
              version:1,
              exact_main:$exact,
              task_id:$task,
              performer:"Dan Starkey",
              role:"Kreg",
              source_fingerprint:$fingerprint,
              performance_mode:"voice",
              source_file:$file,
              source_image_sha256:$source_sha,
              visual_review_completed:false,
              lease_issued:false,
              queue_mutated:false,
              canonical_record_created:false,
              media_adopted:false,
              waterline_event_written:false,
              cycle_receipt_written:false,
              product_published:false
            }' > "$OUT/boundary.json"
          test -z "$(git status --porcelain)"

      - name: Upload exact Kreg media-recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
