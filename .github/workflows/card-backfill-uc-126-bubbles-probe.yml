name: card-backfill-uc-126-bubbles-probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-126-BUBBLES-PROBE.json"
      - "scripts/card-backfill-uc-126-bubbles-probe.mjs"
      - ".github/workflows/card-backfill-uc-126-bubbles-probe.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-126-bubbles-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-031'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical request runtime
        run: npm ci
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-126 Bubbles probe authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-126-BUBBLES-PROBE.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-126-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-126');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_90375b50fca2bd3603ba9946');
          if(row.version!==1||row.record_id!=='UC-126'||row.role_key!=='bubbles'||row.actor!=='Tara Strong'||row.production!=='The Powerpuff Girls (1998)'||row.api_title!=='Bubbles (1998 TV series)'||row.file_titles?.length!==6)throw new Error('UC-126 Bubbles probe authorization drift');
          if(row.selector_artifact_id!==8706098863||row.scope_artifact_id!==8706377703||row.failed_discovery_count!==5||failures.failed_discovery_checkpoints?.length!==5)throw new Error('UC-126 Bubbles probe custody drift');
          if(row.file_titles[0]!=='File:185px-Bubbles (Original) Pic.jpg'||row.minimum_width!==100||row.minimum_height!==100||row.expected_repository_hash_count!==2070||row.canonical_mutation!==false)throw new Error('UC-126 Bubbles probe denominator drift');
          if(!specimen||specimen.actor!=='Tara Strong'||specimen.character!=='Bubbles, Timmy, Harley & Twilight'||specimen.still)throw new Error('UC-126 specimen boundary drift');
          if(!audit||audit.status!=='absent'||audit.asset)throw new Error('UC-126 audit boundary drift');
          console.log('PASS — exact UC-126 Bubbles imageinfo and delivery probe authorized');
          NODE
      - name: Probe exact Bubbles imageinfo and byte transports
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-126-bubbles-probe
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-126-bubbles-probe.mjs
          node scripts/card-backfill-uc-126-bubbles-probe.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-126-bubbles-probe-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload imageinfo, transports, retained bytes, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-126-bubbles-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-126-bubbles-probe
            ${{ runner.temp }}/card-backfill-uc-126-bubbles-probe-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
