name: RD-W03 registered v2 review fix

on:
  push:
    branches:
      - main
    paths:
      - tmp/rd-wave03-v2-review-fix.trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rd-wave03-v2-review-fix-registered
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_PATH: tmp/rd-wave03-v2-review-fix.trigger
      WORKFLOW_PATH: .github/workflows/rd-wave03-v2-review-fix.yml
      PATCHER_PATH: tmp/rd-wave03-v2-review-fix.py
      TARGET_BRANCH: agent/ssc-rd-wave03-hosted-executor-v2
      EXPECTED_TARGET_HEAD: adb0c8c8f129e194b2608ae1d530be6ba1b45749
      EXPECTED_TARGET_PARENT: e149be170525ded693bd2a607515857765e63ede
      OLD_WORKFLOW_BLOB: 348f1a56e0f15e8075e23af8f0041008aa909449
      OLD_HELPER_BLOB: 17bd8a05fd30995d70a836c84a6e1c2310107398
      NEW_WORKFLOW_BLOB: 693b3ee89783f46883c13c81a0f4a6850c0d6e8e
      NEW_HELPER_BLOB: 39d2a87c266b2be0bed79ada118bd4d5e861c6a8
      PATCHER_BLOB: aa7aec033d25143844a361a55b2706b319b7a014
      EVIDENCE: ${{ runner.temp }}/rd-wave03-v2-review-fix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify registered trigger and target lease
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          parent="$(git show -s --format=%P "$GITHUB_SHA")"
          test -n "$parent"
          test "$parent" != *" "*
          test "$(cat "$TRIGGER_PATH")" = "$parent"
          mapfile -t changed < <(git diff --name-only "$parent" "$GITHUB_SHA" | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TRIGGER_PATH"
          test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$(git rev-parse "$GITHUB_SHA:$WORKFLOW_PATH")"
          test "$(git rev-parse "$parent:$PATCHER_PATH")" = "$PATCHER_BLOB"
          test "$(git rev-parse "$GITHUB_SHA:$PATCHER_PATH")" = "$PATCHER_BLOB"
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"
          test "$(git show -s --format=%P "$EXPECTED_TARGET_HEAD")" = "$EXPECTED_TARGET_PARENT"
          test "$(git rev-parse "$EXPECTED_TARGET_HEAD:.github/workflows/rd-wave03-hosted-executor.yml")" = "$OLD_WORKFLOW_BLOB"
          test "$(git rev-parse "$EXPECTED_TARGET_HEAD:tmp/rd-wave03-integration.sh")" = "$OLD_HELPER_BLOB"
          printf 'trigger_parent=%s\ntarget_head=%s\npatcher_blob=%s\n' \
            "$parent" "$EXPECTED_TARGET_HEAD" "$PATCHER_BLOB" > "$EVIDENCE/preflight.txt"

      - name: Patch and validate exact replacement head
        shell: bash
        run: |
          set -euo pipefail
          worktree="$EVIDENCE/worktree"
          git worktree add --detach "$worktree" "$EXPECTED_TARGET_HEAD"
          git -C "$worktree" config user.name github-actions[bot]
          git -C "$worktree" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 "$PATCHER_PATH" "$worktree"
          ruby -ryaml -e 'YAML.load_file(ARGV.fetch(0))' "$worktree/.github/workflows/rd-wave03-hosted-executor.yml"
          bash -n "$worktree/tmp/rd-wave03-integration.sh"
          blocks="$EVIDENCE/run-blocks"
          mkdir -p "$blocks"
          ruby -ryaml -e '
            y = YAML.load_file(ARGV.fetch(0))
            out = ARGV.fetch(1)
            index = 0
            y.fetch("jobs").each do |job_name, job|
              (job["steps"] || []).each do |step|
                next unless step.key?("run")
                File.write(File.join(out, format("%02d-%s.sh", index, job_name)), step.fetch("run"))
                index += 1
              end
            end
            abort "unexpected run block count" unless index == 11
          ' "$worktree/.github/workflows/rd-wave03-hosted-executor.yml" "$blocks"
          find "$blocks" -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          test -z "$(grep -n '\`' "$worktree/.github/workflows/rd-wave03-hosted-executor.yml" || true)"
          cd "$worktree"
          git add -- .github/workflows/rd-wave03-hosted-executor.yml tmp/rd-wave03-integration.sh
          git commit --amend --no-edit --no-verify
          new_head="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P "$new_head")" = "$EXPECTED_TARGET_PARENT"
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$new_head" | LC_ALL=C sort)
          expected=(.github/workflows/rd-wave03-hosted-executor.yml tmp/rd-wave03-integration.sh)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          test "$(git rev-parse "$new_head:.github/workflows/rd-wave03-hosted-executor.yml")" = "$NEW_WORKFLOW_BLOB"
          test "$(git rev-parse "$new_head:tmp/rd-wave03-integration.sh")" = "$NEW_HELPER_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'old_head=%s\nnew_head=%s\nworkflow_blob=%s\nhelper_blob=%s\n' \
            "$EXPECTED_TARGET_HEAD" "$new_head" "$NEW_WORKFLOW_BLOB" "$NEW_HELPER_BLOB" | tee "$EVIDENCE/receipt.txt"
          gh pr comment 332 --repo BigBirdReturns/undercast --body "Registered Wave-03 review-fix run ${GITHUB_RUN_ID} paid the current P1/P2 findings in replacement head ${new_head}: rejected predecessor runs must end cancelled or failed, unrelated same-SHA workflows are excluded, and the integration receipt emits adoption_effect. Exact two-path/one-parent custody and YAML/Bash checks passed."

      - name: Upload bounded review-fix receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-v2-review-fix-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-v2-review-fix
          if-no-files-found: warn
          retention-days: 30

      - name: Retire registered patch transport from live main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          temporary=(
            .github/workflows/rd-wave03-v2-review-fix.yml
            tmp/rd-wave03-v2-review-fix.py
            tmp/rd-wave03-v2-review-fix.trigger
          )
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            live="$(git rev-parse refs/remotes/origin/main)"
            git merge-base --is-ancestor "$GITHUB_SHA" "$live"
            for path in "${temporary[@]}"; do
              test "$(git rev-parse "$GITHUB_SHA:$path")" = "$(git rev-parse "$live:$path")"
            done
            git checkout -B rd-wave03-v2-review-fix-cleanup "$live"
            git rm -- "${temporary[@]}"
            git commit --no-verify -m 'CI: retire completed Wave-03 registered v2 review fix'
            cleanup="$(git rev-parse HEAD)"
            if git push --force-with-lease="refs/heads/main:$live" origin HEAD:refs/heads/main; then
              gh pr comment 332 --repo BigBirdReturns/undercast --body "Registered Wave-03 review-fix transport was removed from live main by cleanup commit ${cleanup}. No patch workflow, patcher, or trigger survives."
              exit 0
            fi
          done
          exit 1
