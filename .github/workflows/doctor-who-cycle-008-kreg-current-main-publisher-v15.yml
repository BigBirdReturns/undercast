name: doctor-who-cycle-008-kreg-current-main-publisher-v15

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-current-main-publisher-v15.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-current-main-publisher-v15
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-current-main-publisher-v15'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-008-kreg-current-main-publisher-v15
      SELF: .github/workflows/doctor-who-cycle-008-kreg-current-main-publisher-v15.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-current-main-publisher-v15
      EXPECTED_MAIN: 951fb9e6b47f54075b5843a8e9ed007767fb6bca
      ORIGINAL_REVIEW_MAIN: e39b5f5bec011b84a32bc46021089d3432c6c5df
      SOURCE_ARTIFACT_ID: "9011633536"
      SOURCE_ARTIFACT_DIGEST: sha256:0fd16d0b3be40060e6291881ee76dad0c1806880202a53cf8326fb0c55bb5c80
      SOURCE_RUN: "31224465447"
      SOURCE_ATTEMPT: "1"
      SOURCE_REVIEW_IDENTITY: 7d1b10e5058fd4709d5172b8ff92f617f44a75079331dd6add7f71417ccf4a9c
      SOURCE_SETTLEMENT_IDENTITY: dc88202659926fd7cf9b8640359a9c47effd052b8f1caaac97a79ffa0dcb6e71
      PRODUCT_BRANCH: agent/doctor-who-cycle-008-kreg-product-v13-31224049249
      PRODUCT_TITLE: "Doctor Who: complete reviewed cycle 008 for Kreg"
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      EXPECTED_PATHS: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path carrier, current main, and retained V13 handoff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostics,receipt,source,work}
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          head='${{ github.event.pull_request.head.sha }}'
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" LIVE="$live" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['LIVE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$OUT/api/source-artifact.json"
          jq -e --argjson id "$SOURCE_ARTIFACT_ID" --arg digest "$SOURCE_ARTIFACT_DIGEST" --argjson run "$SOURCE_RUN" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' "$OUT/api/source-artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$OUT/source/handoff.zip"
          test "$(sha256sum "$OUT/source/handoff.zip" | awk '{print $1}')" = "${SOURCE_ARTIFACT_DIGEST#sha256:}"
          ZIP="$OUT/source/handoff.zip" TARGET="$OUT/handoff" python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  data=f.read(i); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          printf 'LIVE_MAIN=%s\nCARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$live" "$pr" "$head" >> "$GITHUB_ENV"

      - name: Verify checksum custody, self-hashed receipts, archive geometry, and composability
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT/handoff" python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT'])
          expected={'SHA256SUMS','SHA256SUMS.pre','product-files.json','product-paths.txt','product.tar.gz','settlement.json','source-review-receipt.json'}
          assert {p.name for p in root.iterdir() if p.is_file()}==expected
          self_rows=0
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest,original=line.split(None,1); name=Path(original).name
              if name=='SHA256SUMS.pre':
                  self_rows+=1; assert digest==hashlib.sha256(b'').hexdigest(); continue
              p=root/name; assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          assert self_rows in (0,1)
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          settlement=json.loads((root/'settlement.json').read_text()); sid=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==sid
          review=json.loads((root/'source-review-receipt.json').read_text()); rid=review.pop('identity')
          assert hashlib.sha256(json.dumps(review,sort_keys=True,separators=(',',':')).encode()).hexdigest()==rid
          assert sid==os.environ['SOURCE_SETTLEMENT_IDENTITY'] and rid==os.environ['SOURCE_REVIEW_IDENTITY']
          assert settlement['status']=='verified-for-trusted-publication' and review['status']=='approved-for-publication'
          assert settlement['publisher_run']==int(os.environ['SOURCE_RUN']) and settlement['publisher_attempt']==int(os.environ['SOURCE_ATTEMPT'])
          assert settlement['publication_main']==os.environ['ORIGINAL_REVIEW_MAIN'] and review['review_main']==os.environ['ORIGINAL_REVIEW_MAIN']
          assert settlement['task']==os.environ['TASK_ID'] and settlement['lease']==os.environ['LEASE_ID'] and settlement['wall_id']==os.environ['WALL_ID']
          assert settlement['path_count']==int(os.environ['EXPECTED_PATHS']) and review['path_count']==int(os.environ['EXPECTED_PATHS'])
          assert settlement['merge_authority'] is False and settlement['cycle_009_authorized'] is False and settlement['outside_human_dependency'] is False
          paths=(root/'product-paths.txt').read_text().splitlines(); rows=json.loads((root/'product-files.json').read_text())
          assert len(paths)==int(os.environ['EXPECTED_PATHS']) and paths==sorted(paths) and len(paths)==len(set(paths)) and [r['path'] for r in rows]==paths
          assert all(not p.startswith('.github/') and not p.startswith('.tmp/') and not p.startswith('tmp/') for p in paths)
          with tarfile.open(root/'product.tar.gz','r:gz') as tf:
              members=tf.getmembers(); assert [m.name for m in members]==paths
              for m,r in zip(members,rows):
                  p=PurePosixPath(m.name); assert not p.is_absolute() and '..' not in p.parts and m.isfile() and not m.issym() and not m.islnk()
                  data=tf.extractfile(m).read(); assert len(data)==r['bytes'] and hashlib.sha256(data).hexdigest()==r['sha256']
                  assert (m.mode&0o7777)==(int(r['git_mode'],8)&0o7777)
          (root/'verified-identities.json').write_text(json.dumps({'settlement':sid,'review':rid,'self_rows':self_rows},indent=2,sort_keys=True)+'\n')
          PY
          git fetch --no-tags --filter=blob:none origin "$ORIGINAL_REVIEW_MAIN" "$LIVE_MAIN"
          git merge-base --is-ancestor "$ORIGINAL_REVIEW_MAIN" "$LIVE_MAIN"
          git diff --name-only "$ORIGINAL_REVIEW_MAIN".."$LIVE_MAIN" | LC_ALL=C sort > "$OUT/diagnostics/review-to-live-paths.txt"
          test -s "$OUT/diagnostics/review-to-live-paths.txt"
          python3 - "$OUT/diagnostics/review-to-live-paths.txt" <<'PY'
          import sys
          rows=open(sys.argv[1]).read().splitlines()
          assert rows and all(p.startswith('.github/workflows/') for p in rows)
          PY
          comm -12 "$OUT/handoff/product-paths.txt" "$OUT/diagnostics/review-to-live-paths.txt" > "$OUT/diagnostics/main-product-overlap.txt"
          test ! -s "$OUT/diagnostics/main-product-overlap.txt"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" > "$OUT/api/preexisting-ref.json" 2>/dev/null; then exit 1; fi
          gh api "/repos/$GITHUB_REPOSITORY/pulls?state=all&head=BigBirdReturns:$PRODUCT_BRANCH&per_page=100" > "$OUT/api/preexisting-prs.json"
          jq -e 'length==0' "$OUT/api/preexisting-prs.json" >/dev/null
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"

      - name: Recompose exact current-main product and run both permanent checkers plus complete gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/product"
          git worktree add --detach "$work" "$LIVE_MAIN"
          tar -xzf "$OUT/handoff/product.tar.gz" -C "$work"
          git -C "$work" add --pathspec-from-file="$OUT/handoff/product-paths.txt"
          git -C "$work" config user.name undercast-cycle-008-current-main-verifier
          git -C "$work" config user.email cycle-008-current-main-verifier@users.noreply.github.com
          git -C "$work" commit -m "$PRODUCT_TITLE" >/dev/null
          local_commit="$(git -C "$work" rev-parse HEAD)"
          local_tree="$(git -C "$work" rev-parse 'HEAD^{tree}')"
          test "$(git -C "$work" show -s --format=%P HEAD)" = "$LIVE_MAIN"
          git -C "$work" diff --name-only "$LIVE_MAIN"..HEAD | LC_ALL=C sort > "$OUT/diagnostics/local-product-paths.txt"
          diff -u "$OUT/handoff/product-paths.txt" "$OUT/diagnostics/local-product-paths.txt"
          test "$(git -C "$work" show "HEAD:images/uc-1353-still.jpg" | sha256sum | awk '{print $1}')" = "$MEDIA_SHA256"
          test -z "$(git -C "$work" status --porcelain)"
          cd "$work"
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/diagnostics/current-main-complete-gate.log"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"
          git worktree remove --force "$work"
          printf 'LOCAL_COMMIT=%s\nLOCAL_TREE=%s\n' "$local_commit" "$local_tree" >> "$GITHUB_ENV"
          printf 'local_tree=%s\n' "$local_tree" >> "$GITHUB_OUTPUT"

      - name: Publish exact Git objects and create one draft 48-path product PR
        id: publish_product
        shell: bash
        run: |
          set -euo pipefail
          main_tree="$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$LIVE_MAIN" --jq '.tree.sha')"
          ROOT="$OUT" REPO="$GITHUB_REPOSITORY" MAIN="$LIVE_MAIN" MAIN_TREE="$main_tree" python3 - <<'PY'
          import base64,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['ROOT']); handoff=root/'handoff'; repo=os.environ['REPO']; main=os.environ['MAIN']; rows=json.loads((handoff/'product-files.json').read_text())
          def live(): return subprocess.check_output(['gh','api',f'/repos/{repo}/git/ref/heads/main','--jq','.object.sha'],text=True).strip()
          assert live()==main; blobs={}
          with tarfile.open(handoff/'product.tar.gz','r:gz') as tf:
              members={m.name:m for m in tf.getmembers()}
              for r in rows:
                  assert live()==main
                  data=tf.extractfile(members[r['path']]).read()
                  payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
                  sha=json.loads(subprocess.check_output(['gh','api','--method','POST',f'/repos/{repo}/git/blobs','--input','-'],input=payload))['sha']
                  assert sha==r['git_blob']; blobs[r['path']]=sha; assert live()==main
          tree={'base_tree':os.environ['MAIN_TREE'],'tree':[{'path':r['path'],'mode':r['git_mode'],'type':'blob','sha':blobs[r['path']]} for r in rows]}
          (root/'tree-request.json').write_text(json.dumps(tree,indent=2)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"
          tree="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input "$OUT/tree-request.json" --jq '.sha')"
          test "$tree" = "$LOCAL_TREE"
          jq -n --arg message "$PRODUCT_TITLE" --arg tree "$tree" --arg parent "$LIVE_MAIN" '{message:$message,tree:$tree,parents:[$parent]}' > "$OUT/commit-request.json"
          commit="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input "$OUT/commit-request.json" --jq '.sha')"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"
          jq -n --arg ref "refs/heads/$PRODUCT_BRANCH" --arg sha "$commit" '{ref:$ref,sha:$sha}' > "$OUT/ref-request.json"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" --input "$OUT/ref-request.json" > "$OUT/api/created-ref.json"
          touch "$OUT/ref-created"
          printf -v body '## Trusted current-main Kreg cycle-008 product\n\nThis draft contains the exact forty-eight files from V13 handoff artifact `%s`, recomposed over canonical parent `%s` after proving all intervening changes were workflow-only and disjoint.\n\nBoth permanent Doctor Who cycle checkers and the complete rendered repository gate passed on this exact tree before publication.\n\n```text\ntask:         %s\nlease:        %s\nwall:         %s\npaths:        48\nqueue:        309/7/0 -> 308/8/0\ncycle 009:    unauthorized\nforce update: false\n```\n' "$SOURCE_ARTIFACT_ID" "$LIVE_MAIN" "$TASK_ID" "$LEASE_ID" "$WALL_ID"
          jq -n --arg title "$PRODUCT_TITLE" --arg head "$PRODUCT_BRANCH" --arg base main --arg body "$body" '{title:$title,head:$head,base:$base,body:$body,draft:true,maintainer_can_modify:false}' > "$OUT/pr-request.json"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/pulls" --input "$OUT/pr-request.json" > "$OUT/api/created-pr.json"
          pr="$(jq -r '.number' "$OUT/api/created-pr.json")"
          touch "$OUT/pr-created"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/product-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$commit" > "$OUT/api/product-commit.json"
          jq -e --arg branch "$PRODUCT_BRANCH" --arg parent "$LIVE_MAIN" --arg commit "$commit" '.state=="open" and .draft==true and .merged==false and .base.ref=="main" and .base.sha==$parent and .head.ref==$branch and .head.sha==$commit and .commits==1 and .changed_files==48' "$OUT/api/product-pr.json" >/dev/null
          jq -e --arg parent "$LIVE_MAIN" --arg tree "$tree" '.parents|length==1 and .[0].sha==$parent and .tree.sha==$tree' "$OUT/api/product-commit.json" >/dev/null
          jq -r '.[].filename' "$OUT/api/product-files.json" | LC_ALL=C sort > "$OUT/diagnostics/published-product-paths.txt"
          diff -u "$OUT/handoff/product-paths.txt" "$OUT/diagnostics/published-product-paths.txt"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" --jq '.object.sha')" = "$commit"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$LIVE_MAIN"
          printf 'PRODUCT_COMMIT=%s\nPRODUCT_TREE=%s\nPRODUCT_PR=%s\n' "$commit" "$tree" "$pr" >> "$GITHUB_ENV"
          printf 'product_commit=%s\nproduct_tree=%s\nproduct_pr=%s\n' "$commit" "$tree" "$pr" >> "$GITHUB_OUTPUT"

      - name: Seal trusted current-main publication receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt={'status':'draft-product-published-current-main','publisher_run':int(os.environ['GITHUB_RUN_ID']),'publisher_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_run':int(os.environ['SOURCE_RUN']),'source_attempt':int(os.environ['SOURCE_ATTEMPT']),'source_artifact':int(os.environ['SOURCE_ARTIFACT_ID']),'source_artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'source_review_identity':os.environ['SOURCE_REVIEW_IDENTITY'],'source_settlement_identity':os.environ['SOURCE_SETTLEMENT_IDENTITY'],'canonical_parent':os.environ['LIVE_MAIN'],'product_branch':os.environ['PRODUCT_BRANCH'],'product_commit':os.environ['PRODUCT_COMMIT'],'product_tree':os.environ['PRODUCT_TREE'],'product_pr':int(os.environ['PRODUCT_PR']),'path_count':48,'task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall_id':os.environ['WALL_ID'],'queue_before':{'queued':309,'resolved':7,'in_flight':0},'queue_after':{'queued':308,'resolved':8,'in_flight':0},'permanent_cycle_008_check':'pass','permanent_cycle_007_check':'pass','complete_rendered_gate':'pass','repository_write':True,'merge_authority':False,'force_update':False,'cycle_009_authorized':False,'outside_human_dependency':False}
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'receipt/trusted-publication-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          cp "$OUT/handoff/product-paths.txt" "$OUT/receipt/product-paths.txt"
          cp "$OUT/handoff/product-files.json" "$OUT/receipt/product-files.json"
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"

      - name: Upload trusted current-main publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-current-main-publication-v15-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-current-main-publisher-v15/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove any partial product authority after failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [ -f "$OUT/pr-created" ] && [ -s "$OUT/api/created-pr.json" ]; then
            pr="$(jq -r '.number' "$OUT/api/created-pr.json")"
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$pr" -f state=closed > "$OUT/api/cleanup-pr.json" 2>&1
          fi
          if [ -f "$OUT/ref-created" ]; then
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$PRODUCT_BRANCH" > "$OUT/api/cleanup-ref.json" 2>&1
          fi

      - name: Upload publisher diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-current-main-publisher-v15-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-current-main-publisher-v15
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
