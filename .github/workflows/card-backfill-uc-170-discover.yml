name: card-backfill-uc-170-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-170-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-170-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-170-discover-v2.mjs"
      - ".github/workflows/card-backfill-uc-170-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-170-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-035'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-035
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-170 Kif-exception discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-170-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-170-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-170');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-170');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_f1583034cfdddaa201e1bcc3');
          if(row.version!==1||row.record_id!=='UC-170'||row.kind!=='voice'||row.actor!=='Maurice LaMarche'||row.character!=='The Brain, Kif Kroker, Egon Spengler'||row.production!=='Animaniacs / Futurama'||row.years!=='1980s–'||row.side!=='still')throw new Error('UC-170 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-170'||failures.failed_discovery_checkpoints?.length!==2||failures.failed_discovery_checkpoints[0]?.run_id!==30422811904||failures.failed_discovery_checkpoints[0]?.artifact_id!==8712519412||failures.failed_discovery_checkpoints[0]?.artifact_digest_sha256!=='f6972bf7b27a29f2ef7878c342aeb27f5d379afc87c664ed1e5c5c4e840a6cec'||failures.failed_discovery_checkpoints[1]?.run_id!==30423023665||failures.failed_discovery_checkpoints[1]?.artifact_id!==8712595529||failures.failed_discovery_checkpoints[1]?.artifact_digest_sha256!=='24e8d98a029282027baeafaabad52287fcc89872163bd3d052cf321f6ed2608f')throw new Error('UC-170 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8712290331||row.selector_artifact?.head_sha!=='a0258de5785cf6959e198077d63e3e51e1853411'||row.selector_artifact?.zip_sha256!=='74e795444342ff84537688c6e17edea7e2c86d7ea9e3d3ee854e79061dfe4b68')throw new Error('UC-170 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8712363186||row.scope_artifact?.head_sha!=='a5869e6fac8bfb55427b6786c248a6f3d7de7bcb'||row.scope_artifact?.scope_sha256!=='34a98dd77320a26cc03f156375a35a11a3eaec8fd8cbefd8746aa27bf58e56ec')throw new Error('UC-170 scope custody drift');
          if(row.actor_role_pages?.length!==4||row.actor_role_pages.some(page=>page.strict!==true)||row.roles?.length!==3||row.roles[0]?.key!=='brain'||row.roles[1]?.key!=='kif'||row.roles[2]?.key!=='egon')throw new Error('UC-170 discovery denominator drift');
          const kif=row.roles.find(role=>role.key==='kif');
          if(kif?.generic_width_floor_exception?.required_file_title!=='File:Character Kif.png'||kif?.generic_width_floor_exception?.required_pageimage_source!==true||kif?.generic_width_floor_exception?.required_width!==144||kif?.generic_width_floor_exception?.required_height!==444||kif?.generic_width_floor_exception?.generic_width_floor!==180)throw new Error('UC-170 Kif exception drift');
          if(row.selection_contract?.exact_three_role_animated_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['brain','kif','egon'])||row.selection_contract?.minimum_candidates_per_role!==1||row.selection_contract?.kif_exact_pageimage_width_exception_required!==true||row.selection_contract?.kif_exact_pageimage_width!==144||row.selection_contract?.kif_exact_pageimage_height!==444||row.selection_contract?.generic_width_floor_remains_180!==true||row.selection_contract?.live_action_egon_and_harold_ramis_imagery_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-170 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Maurice LaMarche'||specimen.character!=='The Brain, Kif Kroker, Egon Spengler'||specimen.production!=='Animaniacs / Futurama'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-170'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-170 audit boundary drift');
          console.log('PASS — UC-170 two-failure custody and exact 144x444 Kif page-image exception authorized');
          NODE
      - name: Gather institutional receipts, raw revisions, and exact character candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-170-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-170-discover-v2.mjs
          node scripts/card-backfill-uc-170-discover-v2.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-170-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload failure custody, institutional pages, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-170-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-170-discover
            ${{ runner.temp }}/card-backfill-uc-170-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
