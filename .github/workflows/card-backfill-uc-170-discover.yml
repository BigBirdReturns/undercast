name: card-backfill-uc-170-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-170-DISCOVER.json"
      - "scripts/card-backfill-uc-170-discover.mjs"
      - ".github/workflows/card-backfill-uc-170-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-170-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-035'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-035
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-170 three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-170-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-170');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-170');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_f1583034cfdddaa201e1bcc3');
          if(row.version!==1||row.record_id!=='UC-170'||row.kind!=='voice'||row.actor!=='Maurice LaMarche'||row.character!=='The Brain, Kif Kroker, Egon Spengler'||row.production!=='Animaniacs / Futurama'||row.years!=='1980s–'||row.side!=='still')throw new Error('UC-170 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8712290331||row.selector_artifact?.head_sha!=='a0258de5785cf6959e198077d63e3e51e1853411'||row.selector_artifact?.zip_sha256!=='74e795444342ff84537688c6e17edea7e2c86d7ea9e3d3ee854e79061dfe4b68'||row.selector_artifact?.selected_sha256!=='3e1f2a8607450c460b38b220812104e84af1bb0069286080618b98b43838b423')throw new Error('UC-170 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8712363186||row.scope_artifact?.head_sha!=='a5869e6fac8bfb55427b6786c248a6f3d7de7bcb'||row.scope_artifact?.zip_sha256!=='fcf6380b316db41775a294c6798a5995ecb7f2744cd3ac62cf0642fce4f42c77'||row.scope_artifact?.scope_sha256!=='34a98dd77320a26cc03f156375a35a11a3eaec8fd8cbefd8746aa27bf58e56ec')throw new Error('UC-170 scope custody drift');
          if(row.actor_role_pages?.length!==4||row.actor_role_pages.some(page=>page.strict!==true)||row.roles?.length!==3||row.roles[0]?.key!=='brain'||row.roles[1]?.key!=='kif'||row.roles[2]?.key!=='egon')throw new Error('UC-170 discovery denominator drift');
          if(row.selection_contract?.exact_three_role_animated_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['brain','kif','egon'])||row.selection_contract?.minimum_candidates_per_role!==1||row.selection_contract?.maximum_candidates_per_role!==24||row.selection_contract?.maurice_lamarche_voice_performance_required_for_all_three_roles!==true||row.selection_contract?.role_specific_production_and_chronology_required!==true||row.selection_contract?.canonical_1980s_plus_is_broad_career_envelope_only!==true||row.selection_contract?.raw_revision_and_image_metadata_required_for_each_role!==true||row.selection_contract?.live_action_egon_and_harold_ramis_imagery_forbidden!==true||row.selection_contract?.single_role_or_two_role_candidate_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-170 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Maurice LaMarche'||specimen.character!=='The Brain, Kif Kroker, Egon Spengler'||specimen.production!=='Animaniacs / Futurama'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-170-portrait.jpg')throw new Error('UC-170 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-170'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-170 audit boundary drift');
          console.log('PASS — exact UC-170 Maurice LaMarche three-role discovery authorized');
          NODE
      - name: Gather institutional role receipts, raw revisions, and character candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-170-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-170-discover.mjs
          node scripts/card-backfill-uc-170-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-170-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload institutional pages, raw revisions, character candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-170-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-170-discover
            ${{ runner.temp }}/card-backfill-uc-170-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
