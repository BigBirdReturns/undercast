name: card-backfill-uc-172-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-172-DISCOVER.json"
      - "scripts/card-backfill-uc-172-discover-build.py"
      - ".github/workflows/card-backfill-uc-172-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-172-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-037'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-037
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-172 three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-172-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-172');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-172');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ab0bdc7a6add0fd55b7b1f66');
          if(row.version!==1||row.record_id!=='UC-172'||row.kind!=='voice'||row.actor!=='Jim Cummings'||row.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||row.production!=='Disney'||row.years!=='1980s–'||row.side!=='still')throw new Error('UC-172 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8730189672||row.selector_artifact?.head_sha!=='2d0a314e943b4efc878bdcb532bc051dbdc0cbc7'||row.selector_artifact?.zip_sha256!=='35aad2572ed9e5109cd9ccd991d142dd1c73aaaab2ef349a1746c5796b8a4fa5'||row.selector_artifact?.selected_sha256!=='f621c3ca29a3db2593688454247581d927df0d677bfb6831ed47d4cb8b04286f')throw new Error('UC-172 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8730433588||row.scope_artifact?.head_sha!=='87564e2cb1253a102770b70aacb238fbe7d582fe'||row.scope_artifact?.zip_sha256!=='53346d6c658da6fc5914a1d7651a73f42598428c655134491d643c6d7b2d9a8c'||row.scope_artifact?.scope_sha256!=='884585e330ae43dc0a0b0f6185be3a4ae8e5bda823705bf2310f82de6221190b')throw new Error('UC-172 scope custody drift');
          if(row.actor_role_pages?.length!==3||row.actor_role_pages.some(page=>page.strict!==true)||row.roles?.length!==3||row.roles[0]?.key!=='pooh'||row.roles[1]?.key!=='tigger'||row.roles[2]?.key!=='darkwing')throw new Error('UC-172 discovery denominator drift');
          if(row.selection_contract?.exact_three_role_animated_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['pooh','tigger','darkwing'])||row.selection_contract?.minimum_candidates_per_role!==1||row.selection_contract?.maximum_candidates_per_role!==24||row.selection_contract?.strict_runtime_actor_role_pages_required!==3||row.selection_contract?.jim_cummings_voice_performance_required_for_all_three_roles!==true||row.selection_contract?.pooh_inherited_voice_separation_required!==true||row.selection_contract?.tigger_inherited_voice_separation_required!==true||row.selection_contract?.sterling_holloway_pooh_substitute_forbidden!==true||row.selection_contract?.paul_winchell_tigger_substitute_forbidden!==true||row.selection_contract?.darkwing_1991_animated_television_character_required!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-172 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Jim Cummings'||specimen.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||specimen.production!=='Disney'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-172'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-172 audit boundary drift');
          console.log('PASS — exact UC-172 Jim Cummings three-role discovery authorized');
          NODE
      - name: Build isolated discoverer from pinned gate-proven implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/BigBirdReturns/undercast/contents/scripts/card-backfill-uc-171-discover.mjs?ref=2bd6a22c521ba365e60367e1e39a7066d92699e1" --jq .content | tr -d '\n' | base64 -d > scripts/.card-backfill-uc-171-discover-source.mjs
          test "$(git hash-object scripts/.card-backfill-uc-171-discover-source.mjs)" = "3c5f75e8117407a60044f4078445b502aef9dfae"
          python3 scripts/card-backfill-uc-172-discover-build.py
          node --check scripts/.card-backfill-uc-172-discover-run.mjs
          echo "generated $(sha256sum scripts/.card-backfill-uc-172-discover-run.mjs | cut -d' ' -f1)"
      - name: Gather D23 role receipts, raw revisions, and character candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-172-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-172-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-172-discover-run.log"
          rm scripts/.card-backfill-uc-171-discover-source.mjs scripts/.card-backfill-uc-172-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload D23 pages, raw revisions, character candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-172-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-172-discover
            ${{ runner.temp }}/card-backfill-uc-172-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
