name: RD-W03 qualification workflow lint

on:
  pull_request:
    paths:
      - .github/workflows/rd-wave03-qualification-lint.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 54f05bfae34f66e71f9f1532b5ba266b1c53c73d
          fetch-depth: 0
          persist-credentials: false

      - name: Run exact actionlint
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rd-wave03-qualification-lint"
          mkdir -p "$out"
          exec > >(tee "$out/lint.log") 2>&1
          archive="$out/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o "$archive"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$out" actionlint
          "$out/actionlint" -shellcheck= .github/workflows/rd-wave03-pull-request-qualification.yml

      - name: Upload lint receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-qualification-lint-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-qualification-lint
          if-no-files-found: error
          retention-days: 30
