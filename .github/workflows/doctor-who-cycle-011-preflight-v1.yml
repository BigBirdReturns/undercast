name: doctor-who-cycle-011-preflight-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-preflight-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-preflight-v1
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-preflight-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-preflight-v1
      SELF: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      OUT: /tmp/doctor-who-cycle-011-preflight-v1
      MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      TERMINAL_PR: "743"
      TERMINAL_HEAD: d350ddc3c6889403698ebe696e6de3b916863c8c
      TERMINAL_RUN: "31298652693"
      TERMINAL_JOB: "93207756165"
      TERMINAL_ARTIFACT: "9033819564"
      TERMINAL_ZIP_SHA256: bbf00160acad42cd028a2b9d8581bc6195f3a1d8bbf0c1431b10aa53d54075db
      TERMINAL_IDENTITY: b56e0b34e027ffa25e8c4279d620cf7c75c70428b91d6196dc3262c4f746f2b1
      PRIOR_CYCLE: cycle_fb68b31d510d9fe9f05ff4a1
      PRIOR_TASK: ap_cab2d7f95d930401627c1b30
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact carrier and terminal cycle-010 proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,terminal,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$TERMINAL_PR" > "$OUT/api/terminal-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN" > "$OUT/api/terminal-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN/jobs?per_page=100" > "$OUT/api/terminal-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN/artifacts?per_page=100" > "$OUT/api/terminal-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TERMINAL_ARTIFACT/zip" > "$OUT/terminal.zip"
          test "$(sha256sum "$OUT/terminal.zip" | awk '{print $1}')" = "$TERMINAL_ZIP_SHA256"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); api=root/'api'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          own=json.loads((api/'carrier.json').read_text())
          terminal_pr=json.loads((api/'terminal-pr.json').read_text())
          run=json.loads((api/'terminal-run.json').read_text())
          jobs=json.loads((api/'terminal-jobs.json').read_text())['jobs']
          artifacts=json.loads((api/'terminal-artifacts.json').read_text())['artifacts']
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert terminal_pr['number']==int(os.environ['TERMINAL_PR'])
          assert terminal_pr['state']=='closed' and terminal_pr['merged'] is False and terminal_pr['draft'] is True
          assert terminal_pr['base']['sha']==os.environ['MAIN'] and terminal_pr['head']['sha']==os.environ['TERMINAL_HEAD']
          assert terminal_pr['commits']==1 and terminal_pr['changed_files']==1
          assert run['id']==int(os.environ['TERMINAL_RUN'])
          assert run['name']=='doctor-who-cycle-010-merx-postmerge-v1'
          assert run['head_sha']==os.environ['TERMINAL_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['TERMINAL_JOB']))
          assert job['name']=='prove' and job['status']=='completed' and job['conclusion']=='success'
          artifact=next(row for row in artifacts if row['id']==int(os.environ['TERMINAL_ARTIFACT']))
          assert artifact['expired'] is False and artifact['digest']=='sha256:'+os.environ['TERMINAL_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['TERMINAL_RUN']) and artifact['workflow_run']['head_sha']==os.environ['TERMINAL_HEAD']
          target=root/'terminal'
          with zipfile.ZipFile(root/'terminal.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          proof=json.loads((target/'proof/postmerge-proof.json').read_text())
          identity=proof.pop('identity')
          assert identity==os.environ['TERMINAL_IDENTITY']
          assert sha(json.dumps(proof,sort_keys=True,separators=(',',':')).encode())==identity
          proof['identity']=identity
          assert proof['status']=='cycle-010-merx-terminal-postmerge-proved-v1'
          assert proof['canonical_main']==os.environ['MAIN'] and proof['canonical_tree']==os.environ['TREE']
          assert proof['canonical_path_count']==50
          assert proof['queue']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert proof['media']['debt']==0 and proof['unreceipted_cycles']==[]
          assert proof['next_selector_allowed'] is True and proof['next_selector_reasons']==[]
          assert proof['cycle_011_lease_issued'] is False and proof['cleanup_authorized'] is True
          assert proof['cycle_id']==os.environ['PRIOR_CYCLE'] and proof['task_id']==os.environ['PRIOR_TASK']
          assert all(proof['gates'].values())
          (root/'receipt/terminal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rerun current-main permanent and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > "$OUT/receipt/readiness.json"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline.log"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          npm run gate 2>&1 | tee "$OUT/logs/gate.log"
          grep -F 'gate: PASS' "$OUT/logs/gate.log" >/dev/null
          jq -e '.total==316 and .statuses.queued==306 and .statuses.resolved==10 and .in_flight==0' "$OUT/receipt/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Select the deterministic cycle-011 task without claiming
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile text-vision --limit 200 --json > "$OUT/receipt/candidates.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          sha=lambda b:hashlib.sha256(b).hexdigest()
          stable=lambda value:[stable(row) for row in value] if isinstance(value,list) else ({key:stable(value[key]) for key in sorted(value)} if isinstance(value,dict) else value)
          state_bytes=Path('data/AUTOPILOT.json').read_bytes()
          state=json.loads(state_bytes)
          report=json.loads((root/'receipt/candidates.json').read_text())
          status=json.loads((root/'receipt/status.json').read_text())
          water=json.loads((root/'receipt/waterline.json').read_text())
          readiness=json.loads((root/'receipt/readiness.json').read_text())
          ready=readiness[0] if isinstance(readiness,list) else readiness
          doctor=[row for row in state['jobs'] if row.get('scope')=='doctor-who']
          active=[row for row in doctor if row.get('status') in {'leased','drafted','merged'}]
          assert len(doctor)==316 and status['statuses']=={'queued':306,'resolved':10} and status['in_flight']==0 and not active
          assert water['claim_allowed'] is True and water['claim_reasons']==[]
          assert ready['effective_status']=='active' and ready['lease_status']=='ready' and ready['lease_token']
          assert report['profile']['id']=='text-vision' and report['profile']['status']=='active'
          assert report['counts']=={'compatible':306,'incompatible':0}
          assert report['compatible']
          selected=report['compatible'][0]
          task=next(row for row in doctor if row['id']==selected['task_id'])
          assert task['status']=='queued' and task['attempts']==0
          assert task['priority']==800 and task['source_fingerprint']==selected['source_fingerprint']
          assert task['sources'] and task['source_receipts']
          assert all(receipt['source'] in task['sources'] for receipt in task['source_receipts'])
          journal=[json.loads(raw) for raw in Path('data/journal/autopilot.jsonl').read_text().splitlines() if raw.strip()]
          claims=[row for row in journal if row.get('op')=='lease.claimed' and row.get('scope')=='doctor-who']
          cycles=[row for row in json.loads(Path('data/WATERLINE-STATE.json').read_text())['cycles'] if row.get('scope_id')=='doctor-who']
          assert len(claims)==len(cycles)==10
          assert claims[-1]['task_id']==os.environ['PRIOR_TASK'] and cycles[-1]['id']==os.environ['PRIOR_CYCLE']
          packet={
              'version':1,
              'status':'cycle-011-read-only-preflight-complete',
              'canonical_main':os.environ['MAIN'],
              'canonical_tree':os.environ['TREE'],
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'terminal_proof':{'pr':int(os.environ['TERMINAL_PR']),'head':os.environ['TERMINAL_HEAD'],'run':int(os.environ['TERMINAL_RUN']),'job':int(os.environ['TERMINAL_JOB']),'artifact':int(os.environ['TERMINAL_ARTIFACT']),'artifact_sha256':os.environ['TERMINAL_ZIP_SHA256'],'identity':os.environ['TERMINAL_IDENTITY']},
              'prior_cycle':os.environ['PRIOR_CYCLE'],
              'prior_task':os.environ['PRIOR_TASK'],
              'queue':{'total':316,'queued':306,'resolved':10,'in_flight':0,'compatible':306,'incompatible':0},
              'selection_strategy':'repository-native-priority-desc-scope-performer-character-first-compatible',
              'capability_profile':report['profile'],
              'capability_policy_sha256':report['policy_sha256'],
              'selected':selected,
              'task':task,
              'readiness':ready,
              'state_file_sha256':sha(state_bytes),
              'lease_issued':False,
              'queue_mutated':False,
              'repository_write':False,
              'cycle_011_authority':'selection-only',
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          packet['identity']=sha(json.dumps(stable(packet),separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/preflight.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT/receipt" "$OUT/logs" -type f -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            if [ -f "$OUT/receipt/$rel" ]; then path="receipt/$rel"; else path="logs/$rel"; fi
            sha256sum "$OUT/$path" | sed "s#  $OUT/#  #"
          done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
              assert name.lstrip('*').startswith(('receipt/','logs/'))
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-preflight-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-preflight-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-preflight-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
