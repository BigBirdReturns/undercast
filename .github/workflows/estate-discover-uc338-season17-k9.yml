name: estate-discover-uc338-season17-k9

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-discover-uc338-season17-k9.yml

permissions:
  contents: read

concurrency:
  group: estate-discover-uc338-season17-k9
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  discover:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head read custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Install bounded discovery dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow

      - name: Harvest official Season 17 story media
        run: |
          set -euo pipefail
          mkdir -p /tmp/uc338-discovery
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, unquote

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageDraw, ImageFont

          out = Path('/tmp/uc338-discovery')
          raw = out / 'raw'
          raw.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'UnderCast evidence discovery/1.0 (+https://github.com/BigBirdReturns/undercast)'})

          pages = {
            'nightmare-of-eden': 'https://www.doctorwho.tv/stories/nightmare-of-eden',
            'creature-from-the-pit': 'https://www.doctorwho.tv/stories/the-creature-from-the-pit',
            'horns-of-nimon': 'https://www.doctorwho.tv/stories/the-horns-of-nimon',
            'shada': 'https://www.doctorwho.tv/stories/shada',
            'k9-character': 'https://www.doctorwho.tv/characters/k-9',
          }
          explicit = {
            'nightmare-of-eden-card': 'https://cms.doctorwho.tv/sites/default/files/2022-03/EDEN%20-%20446x666.jpg?imwidth=1200',
            'horns-of-nimon-card': 'https://cms.doctorwho.tv/sites/default/files/2022-03/Nimono%20-%20446x666.jpg?imwidth=1200',
            'creature-from-the-pit-card': 'https://www.doctorwho.tv/sites/default/files/2022-03/PIT%20-%20446x666.jpg?imwidth=1200',
            'shada-card': 'https://www.doctorwho.tv/sites/default/files/2022-03/Shada%20-%20446x666.jpg?imwidth=1200',
            'k9-character-card': 'https://cms.doctorwho.tv/sites/default/files/2022-03/K9%20-%20446x666.jpg?imwidth=1200',
          }

          candidates = []
          page_html = {}
          image_pattern = re.compile(r'https?://[^"\'<>\\ ]+?\.(?:jpe?g|png|webp)(?:\?[^"\'<>\\ ]*)?', re.I)
          css_pattern = re.compile(r'url\(["\']?([^"\')]+)["\']?\)', re.I)

          def add(url, source, label='html'):
            if not url:
              return
            url = url.strip().replace('&amp;', '&')
            if url.startswith('//'):
              url = 'https:' + url
            if not url.startswith(('http://', 'https://')):
              url = urljoin(source, url)
            host = urlparse(url).hostname or ''
            if host not in {'www.doctorwho.tv', 'doctorwho.tv', 'cms.doctorwho.tv'}:
              return
            if not re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)', url, re.I):
              return
            candidates.append({'url': url, 'source_page': source, 'label': label})

          for slug, page in pages.items():
            response = session.get(page, timeout=30)
            response.raise_for_status()
            html = response.text
            page_html[slug] = html
            (out / f'{slug}.html').write_text(html, encoding='utf-8')
            soup = BeautifulSoup(html, 'html.parser')
            for meta in soup.find_all('meta'):
              key = str(meta.get('property') or meta.get('name') or '').lower()
              if key in {'og:image', 'og:image:url', 'twitter:image', 'twitter:image:src'}:
                add(meta.get('content'), page, key)
            for tag in soup.find_all(['img', 'source']):
              for attr in ['src', 'data-src', 'data-original']:
                add(tag.get(attr), page, f'{tag.name}:{attr}')
              for attr in ['srcset', 'data-srcset']:
                for item in str(tag.get(attr) or '').split(','):
                  add(item.strip().split(' ')[0], page, f'{tag.name}:{attr}')
            for tag in soup.find_all(style=True):
              for match in css_pattern.findall(str(tag.get('style'))):
                add(match, page, 'inline-style')
            for match in image_pattern.findall(html):
              add(match, page, 'html-regex')

          for label, url in explicit.items():
            candidates.append({'url': url, 'source_page': pages.get(label.replace('-card',''), 'explicit'), 'label': label})

          # Preserve first-seen custody while collapsing exact URLs.
          unique = []
          seen_urls = set()
          for row in candidates:
            normalized = row['url'].replace('https://cms.doctorwho.tv//', 'https://cms.doctorwho.tv/').replace('https://www.doctorwho.tv//', 'https://www.doctorwho.tv/')
            row['url'] = normalized
            if normalized in seen_urls:
              continue
            seen_urls.add(normalized)
            unique.append(row)

          records = []
          seen_hashes = {}
          for index, row in enumerate(unique, 1):
            try:
              response = session.get(row['url'], timeout=30, allow_redirects=True)
              response.raise_for_status()
              content_type = response.headers.get('content-type', '').split(';')[0].lower()
              if not content_type.startswith('image/'):
                continue
              data = response.content
              if len(data) < 5000:
                continue
              with Image.open(io.BytesIO(data)) as image:
                image.load()
                width, height = image.size
                fmt = (image.format or '').lower()
                if width < 240 or height < 180:
                  continue
              digest = hashlib.sha256(data).hexdigest()
              if digest in seen_hashes:
                records[seen_hashes[digest]]['duplicate_urls'].append(row['url'])
                records[seen_hashes[digest]]['source_pages'].append(row['source_page'])
                continue
              ext = {'jpeg': 'jpg', 'jpg': 'jpg', 'png': 'png', 'webp': 'webp'}.get(fmt, 'img')
              filename = f'{len(records)+1:03d}-{digest[:12]}.{ext}'
              (raw / filename).write_bytes(data)
              record = {
                'index': len(records)+1,
                'filename': f'raw/{filename}',
                'sha256': digest,
                'bytes': len(data),
                'mime': content_type,
                'width': width,
                'height': height,
                'url': row['url'],
                'final_url': response.url,
                'label': row['label'],
                'source_pages': [row['source_page']],
                'duplicate_urls': [],
              }
              seen_hashes[digest] = len(records)
              records.append(record)
            except Exception as error:
              records.append({
                'index': len(records)+1,
                'url': row['url'],
                'source_pages': [row['source_page']],
                'label': row['label'],
                'error': str(error),
              })

          valid = [row for row in records if 'filename' in row]
          manifest = {
            'version': 1,
            'operation': 'official-season-17-k9-media-harvest',
            'authorized_head': '${{ env.AUTHORIZED_HEAD }}',
            'pages': pages,
            'candidate_urls_examined': len(unique),
            'downloaded_unique_images': len(valid),
            'images': records,
            'canonical_mutation': False,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          font = ImageFont.load_default()
          cell_w, cell_h = 360, 300
          thumb_w, thumb_h = 340, 240
          columns = 4
          for sheet_no, start in enumerate(range(0, len(valid), 16), 1):
            batch = valid[start:start+16]
            rows = (len(batch) + columns - 1) // columns
            sheet = Image.new('RGB', (columns * cell_w, rows * cell_h), 'white')
            draw = ImageDraw.Draw(sheet)
            for offset, record in enumerate(batch):
              x = (offset % columns) * cell_w
              y = (offset // columns) * cell_h
              with Image.open(out / record['filename']) as image:
                image = image.convert('RGB')
                image.thumbnail((thumb_w, thumb_h))
                px = x + (cell_w - image.width) // 2
                py = y + 8 + (thumb_h - image.height) // 2
                sheet.paste(image, (px, py))
              tail = unquote(urlparse(record['url']).path.rsplit('/', 1)[-1])[:40]
              caption = f"#{record['index']:03d} {record['width']}x{record['height']} {record['sha256'][:8]}\n{tail}"
              draw.multiline_text((x + 8, y + 252), caption, fill='black', font=font, spacing=2)
            sheet.save(out / f'contact-sheet-{sheet_no:02d}.jpg', quality=90)

          print(json.dumps({'downloaded': len(valid), 'examined': len(unique), 'sheets': (len(valid)+15)//16}, indent=2))
          PY

      - name: Preserve bounded discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: UC-338-season17-official-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uc338-discovery
          if-no-files-found: error
          retention-days: 30
