name: card-backfill-uc-069-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-069-RENDER.json"
      - "scripts/card-backfill-uc-069-render.mjs"
      - ".github/workflows/card-backfill-uc-069-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-069-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-012'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-012
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed Penguin authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-069-RENDER.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-069'||row.actor!=='Danny DeVito'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-069 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8636436462||row.discovery_artifact?.head_sha!=='7e1ed2b9d8d03efcfb39ba0e2a9d9929c3b7e8ac')throw new Error('UC-069 discovery custody drift');
          if(row.selection?.sha256!=='4f968665d354aed320244ea02d233d3fd318a6844cf7a7207fff44bf56c956eb'||row.selection?.source_manifest_sha256!=='53e59768305f52d7b87ff31e97c59e883195c14b531e34bf8e56fb9c0c699669')throw new Error('UC-069 selected source drift');
          if(row.rejected_visual_duplicates?.length!==6||row.crop?.gravity!=='east'||row.ruling?.crop_ruling!=='pass-east-focus')throw new Error('UC-069 visual-duplicate or crop ruling drift');
          console.log('PASS — exact official DC Penguin source and east-focused crop authorized');
          NODE
      - name: Retrieve and verify exact DC discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-069-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8636436462/zip" > "$root/discovery.zip"
          echo "7e46d111c8d42f026f5bbfcebf523cabc7f427e69441f884d31e503c49baa5bd  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-069/manifest.json"
          echo "53e59768305f52d7b87ff31e97c59e883195c14b531e34bf8e56fb9c0c699669  $root/source/card-backfill-uc-069/manifest.json" | sha256sum -c -
          echo "4f968665d354aed320244ea02d233d3fd318a6844cf7a7207fff44bf56c956eb  $root/source/card-backfill-uc-069/candidates/19-dc-gallery-03-unparameterized.jpg" | sha256sum -c -
          echo "12a694b3db192ce101901bcf74c2c8c0614775e97c7d93aa25fa7727695266ae  $root/source/card-backfill-uc-069/source-page.png" | sha256sum -c -
      - name: Render exact Penguin candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-069-render/source/card-backfill-uc-069
          OUT: ${{ runner.temp }}/card-backfill-uc-069-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-069-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-069-render/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-069-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-069-render/output
            ${{ runner.temp }}/card-backfill-uc-069-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
