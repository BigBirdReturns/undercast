name: refresh-autopilot-queue

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/autopilot.yml"
      - "scripts/autopilot*.mjs"
      - "scripts/census-adapter*.mjs"
      - "scripts/census-doctor-who-fixtures.mjs"
      - "scripts/estate-certification-fixtures.mjs"
      - "scripts/doctor-who-activation.mjs"
      - "data/review/adapter-sdk/BASELINE.json"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: autopilot-queue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Report producer and snapshot readiness
        run: npm run autopilot -- readiness
      - name: Refresh one certified scope when its cadence is due
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set +e
          npm run autopilot -- refresh --due --refreshed-by undercast-bot
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "No certified scope is due."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Reconcile only certified census scopes with downstream evidence
        run: npm run autopilot -- sync
      - name: Regenerate deterministic adapter baseline
        run: npm run adapter:write && npm run adapter:check
      - name: Validate refreshed queue and adapter contracts
        run: |
          set -euo pipefail
          npm run autopilot -- validate
          node scripts/autopilot-fixtures.mjs
          node scripts/autopilot-capability-fixtures.mjs
          node scripts/autopilot-certification-fixtures.mjs
          node scripts/autopilot-cli-fixtures.mjs
          npm run adapter:fixtures
          node scripts/estate-certification-fixtures.mjs
          node scripts/doctor-who-activation.mjs check
      - name: Materialize the checked-in fixture state
        run: |
          rm -rf "$RUNNER_TEMP/autopilot-fixtures"
          git worktree add --detach --quiet "$RUNNER_TEMP/autopilot-fixtures" "$GITHUB_SHA"
      - name: Validate queue and certification contracts
        working-directory: ${{ runner.temp }}/autopilot-fixtures
        run: npm run autopilot -- validate && npm run autopilot:fixtures
      - name: Remove the checked-in fixture state
        if: always()
        run: |
          git worktree remove --force "$RUNNER_TEMP/autopilot-fixtures" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/autopilot-fixtures"
      - name: Report queue state
        run: npm run autopilot -- status
      - name: Commit state changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "undercast-bot"
          git config user.email "undercast-bot@users.noreply.github.com"
          git add data sitemap.xml 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: refresh and reconcile certified census work ($(date -u +%F))"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && exit 0 || sleep $((i*3)); done
          echo "push failed after retries"; exit 1
