      PROGRAM_RECOVERY_IDENTITY: "c09c5692102eabddf910b635155f64057e983bf70ea16e3ae19797cca4dc003e"
      COMMAND_IDENTITY: "60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf"
