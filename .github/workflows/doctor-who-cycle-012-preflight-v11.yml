      PROOF_HEAD: "f47f0845de78496f20f3ce4446921ce1d9637afd"
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_SHA256: "3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d"
      PROOF_IDENTITY: "9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835"
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: "observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3"
      CYCLE12_PREFIX: "agent/doctor-who-cycle-012-"
      REQUIRED_STALE_JSON: "[\"agent/doctor-who-cycle-012-candidate-parameter-census-v1\",\"agent/doctor-who-cycle-012-candidate-source-inspection-v1\",\"agent/doctor-who-cycle-012-evidence-preflight-v1\",\"agent/doctor-who-cycle-012-evidence-preflight-v2\",\"agent/doctor-who-cycle-012-media-census-v1\",\"agent/doctor-who-cycle-012-media-census-v2\",\"agent/doctor-who-cycle-012-media-review-v1\",\"agent/doctor-who-cycle-012-preflight-v1\",\"agent/doctor-who-cycle-012-preflight-v4\",\"agent/doctor-who-cycle-012-preflight-v5\",\"agent/doctor-who-cycle-012-preflight-v6\",\"agent/doctor-who-cycle-012-preflight-v7\",\"agent/doctor-who-cycle-012-preflight-v8\",\"agent/doctor-who-cycle-012-preflight-v9\",\"agent/doctor-who-cycle-012-preflight-v10\"]"
      SELECTED_TASK: "ap_8965086737382df0e88366db"
      SELECTED_PERFORMER: "Dan Starkey"
      SELECTED_ROLE: "Senstarg"
      SELECTED_MODE: "unresolved"
      SELECTED_SOURCE: "https://tardis.fandom.com/wiki/Senstarg"
      SELECTED_SOURCE_FINGERPRINT: "4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2"
      ACTIVE_PROFILE: "text-vision"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V10 root-denominator failure and execute V11 selector
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$FAILURE_ROOT"
          mkdir -p "$FAILURE_ROOT"/{api,extracted}
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V10_PR" > "$FAILURE_ROOT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V10_RUN" > "$FAILURE_ROOT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V10_RUN/jobs?per_page=100" > "$FAILURE_ROOT/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V10_ARTIFACT" > "$FAILURE_ROOT/api/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V10_ARTIFACT/zip" > "$FAILURE_ROOT/diagnostics.zip"
          test "$(sha256sum "$FAILURE_ROOT/diagnostics.zip" | awk '{print $1}')" = "$V10_ARTIFACT_SHA256"
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['FAILURE_ROOT'])
          load = lambda name: json.loads((root / 'api' / name).read_text())
          pr = load('pr.json'); run = load('run.json'); jobs = load('jobs.json')['jobs']; artifact = load('artifact.json')
          assert pr['number'] == int(os.environ['V10_PR'])
          assert pr['state'] in {'open', 'closed'} and pr['draft'] is True and pr['merged_at'] is None
          assert pr['base']['sha'] == os.environ['MAIN']
          assert pr['head']['ref'] == os.environ['V10_BRANCH'] and pr['head']['sha'] == os.environ['V10_HEAD']
          assert pr['commits'] == 1 and pr['changed_files'] == 1
          assert run['id'] == int(os.environ['V10_RUN'])
          assert run['head_sha'] == os.environ['V10_HEAD'] and run['head_branch'] == os.environ['V10_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          rows = [row for row in jobs if row['id'] == int(os.environ['V10_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['conclusion'] == 'failure'
          steps = rows[0]['steps']
          target = [row for row in steps if row['name'] == 'Authenticate failed V9 and execute checksum-bound V10 selector']
          assert len(target) == 1 and target[0]['status'] == 'completed' and target[0]['conclusion'] == 'failure'
          uploads = [(row['status'], row['conclusion']) for row in steps if row['name'] == 'Run actions/upload-artifact@v4']
          assert uploads == [('completed', 'skipped'), ('completed', 'success')], uploads
          assert artifact['id'] == int(os.environ['V10_ARTIFACT'])
          assert artifact['name'] == os.environ['V10_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['V10_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['V10_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['V10_HEAD']

          destination = root / 'extracted'
          with zipfile.ZipFile(root / 'diagnostics.zip') as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['V10_ARTIFACT_FILES'])
              assert len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  target_path = destination.joinpath(*path.parts)
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  target_path.write_bytes(archive.read(info))

          files = [path for path in destination.rglob('*') if path.is_file()]
          assert len(files) == int(os.environ['V10_ARTIFACT_FILES'])
          by_name = {path.name: path for path in files}
          assert hashlib.sha256(by_name['runner.sh'].read_bytes()).hexdigest() == os.environ['PRIOR_RUNNER_SHA256']
          source_zip = by_name['source.zip']
          assert hashlib.sha256(source_zip.read_bytes()).hexdigest() == os.environ['SOURCE_ARTIFACT_SHA256']
          v9_failure = by_name['v9-failure.json']
          assert hashlib.sha256(v9_failure.read_bytes()).hexdigest() == os.environ['V9_FAILURE_SHA256']
          v9_obj = json.loads(v9_failure.read_text())
          saved = v9_obj.pop('identity')
          actual = hashlib.sha256(json.dumps(v9_obj, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert saved == actual == os.environ['V9_FAILURE_IDENTITY']
          v9_obj['identity'] = saved

          with zipfile.ZipFile(source_zip) as source_archive:
              source_infos = source_archive.infolist()
              assert len(source_infos) == int(os.environ['SOURCE_ARTIFACT_FILES'])
              source_roots = {PurePosixPath(row.filename).parts[0] for row in source_infos}
          expected_roots = {
              os.environ['SOURCE_ARTIFACT_ROOT'],
              os.environ['SOURCE_ARTIFACT_ROOT'] + '-bootstrap',
              os.environ['SOURCE_ARTIFACT_ROOT'] + '-proof',
          }
          assert source_roots == expected_roots

          receipt = {
              'status': 'cycle-012-selector-v10-source-root-denominator-failure-bound-v1',
              'version': 1,
              'source': {'pr': int(os.environ['V10_PR']), 'head': os.environ['V10_HEAD'], 'run': int(os.environ['V10_RUN']), 'job': int(os.environ['V10_JOB']), 'artifact': int(os.environ['V10_ARTIFACT']), 'artifact_sha256': os.environ['V10_ARTIFACT_SHA256']},
              'failure': {'stage': 'source-artifact-safe-extraction', 'actual_roots': sorted(source_roots), 'required_by_v10': [os.environ['SOURCE_ARTIFACT_ROOT']], 'selection_emitted': False},
              'repair': {'exact_roots': sorted(expected_roots), 'file_count': int(os.environ['SOURCE_ARTIFACT_FILES']), 'other_runner_bytes_changed': False},
              'boundary': {'repository_write': False, 'canonical_mutation': False, 'transport_mutation': False, 'lease_issued': False, 'queue_mutated': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'v10-failure.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (root / 'v9-failure.json').write_text(json.dumps(v9_obj, indent=2, sort_keys=True) + '\n')
          PY

          rm -rf "$RUNNER_ROOT"
          mkdir -p "$RUNNER_ROOT"
          : > "$RUNNER_ROOT/runner.sh.gz.b64"
          for blob in $RUNNER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$RUNNER_ROOT/runner.sh.gz.b64"
          done
          test "$(wc -c < "$RUNNER_ROOT/runner.sh.gz.b64" | tr -d ' ')" = "$RUNNER_B64_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$RUNNER_ROOT/runner.sh.gz.b64" > "$RUNNER_ROOT/runner.sh.gz"
          test "$(wc -c < "$RUNNER_ROOT/runner.sh.gz" | tr -d ' ')" = "$RUNNER_GZIP_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$RUNNER_ROOT/runner.sh.gz" > "$RUNNER_ROOT/runner.sh"
          test "$(wc -c < "$RUNNER_ROOT/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$RUNNER_ROOT/runner.sh"
          RUNNER="$RUNNER_ROOT/runner.sh" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER']).read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 2
          for index, block in enumerate(blocks, 1):
              compile(block, f'<cycle-012-v11-{index}>', 'exec')
          PY
          chmod 700 "$RUNNER_ROOT/runner.sh"
          "$RUNNER_ROOT/runner.sh"

          cp "$FAILURE_ROOT/v9-failure.json" "$OUT/payload/v9-failure.json"
          cp "$FAILURE_ROOT/v10-failure.json" "$OUT/payload/v10-failure.json"
          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v11/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v11-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v11
            /tmp/doctor-who-cycle-012-preflight-v11-source
            /tmp/doctor-who-cycle-012-preflight-v11-runner
            /tmp/doctor-who-cycle-012-preflight-v11-v10-failure
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
