      V9_FAILURE_IDENTITY: "f8e946502e209a5a57737c6824ba7cd6d5876c56373e0055a3816bcc2792a666"
      CANDIDATES_SHA256: "1fe91fd261db35ca13ba1f0e3d1a4562e015011045ea35bfc58fc0296bfa98d0"
      COMMAND_SCRIPT_SHA256: "02306f7b765078c44724a1abda6351aa6c56792ac87da0b695d3af7bb676a895"
      COMMAND_RECEIPT_SHA256: "2d688b177bb51ebb04e35e72e4631c3b29ab3c3942fec38a33d8421e3d80d170"
      SOURCE_TRANSPORT_SHA256: "60b5afee23db67ebd07e2a375bdb7ae3b6436c0fbb7a0bdb1cae738b320cb3de"
      TERMINAL_PROOF_SHA256: "44f06487171ae3389ade6e3378ff92007e3b05f827bbee69b5997535262ab522"
      AUTOPILOT_STATUS_SHA256: "450e44de9ee5700d87e8fa123e5c51132be82b344bb4ec1d5cac088ce26adfd6"
      WATERLINE_STATUS_SHA256: "515aae2f677e62305580ed45fe5848d5f2a1a9f675c67831231b7f954dc9fdf7"
