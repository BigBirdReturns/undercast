      PACKET: "/tmp/doctor-who-cycle-012-preflight-v11-source"
      SOURCE_ROOT: "/tmp/doctor-who-cycle-012-preflight-v11-source/doctor-who-cycle-012-preflight-v6-repair2"
      SOURCE_HEAD: "81ff351954e3481b870fd6a9873815cf99aa949e"
