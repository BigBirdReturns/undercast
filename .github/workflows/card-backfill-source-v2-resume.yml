name: card-backfill-amortized-resume-after-publication

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-source-v2-resume.yml'
      - 'data/review/card-backfill/batches/**'
      - 'data/review/card-backfill-staging/publications/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: card-backfill-amortized-publication-resume-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Resume the measured, cache-aware wave after permanent publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run card-backfill-amortized-wave.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f cohort_limit=40 \
            -f wave_batches=4 \
            -f workers_per_batch=4 \
            -f model=openai/gpt-4.1-mini
          echo 'PASS — permanent publication re-armed the amortized source-policy-v3 wave'
          echo 'manual_continue_required=false'
