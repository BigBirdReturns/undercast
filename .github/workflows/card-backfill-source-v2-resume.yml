name: card-backfill-source-v2-resume-after-publication

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-source-v2-resume.yml'
      - 'data/review/card-backfill/batches/**'
      - 'data/review/card-backfill-staging/publications/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: card-backfill-source-v2-resume-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Resume source-policy-v2 after permanent publication without a chat turn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/card-backfill-source-v2-autonomous.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[cohort_limit]=40' \
            -f 'inputs[model]=openai/gpt-4.1-mini'
          echo 'PASS — permanent publication re-armed source-policy-v2'
