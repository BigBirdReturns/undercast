name: card-backfill-source-v3-wave-resume-after-publication

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-source-v2-resume.yml'
      - 'data/review/card-backfill/batches/**'
      - 'data/review/card-backfill-staging/publications/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: card-backfill-source-v3-wave-resume-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Resume the next inherited source-policy-v3 wave without a chat turn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/card-backfill-source-v2-autonomous.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[cohort_limit]=40' \
            -f 'inputs[wave_batches]=4' \
            -f 'inputs[model]=openai/gpt-4.1-mini'
          echo 'PASS — permanent publication re-armed source-policy-v3 parallel waves'
          echo 'manual_continue_required=false'
