name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected-bootstrap
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      WRAPPER_B64_BYTES: "5856"
      WRAPPER_B64_SHA256: 032bf1bea834209abebda284846a4f1fd30e9b6f3c79526db8f87336352d90ad
      WRAPPER_GZIP_BYTES: "4391"
      WRAPPER_GZIP_SHA256: 4bec04bf757af49105f0c31822ce2b096283175992c5c6e892da9c00345f5f69
      WRAPPER_BYTES: "12202"
      WRAPPER_SHA256: 6049f913d3e6e8bb121240ea2dba37c249ac81c1ee650924044380b6c12ca28b

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact V4 wrapper and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rastel-preflight-v4-wrapper
          mkdir -p /tmp/rastel-preflight-v4-wrapper
          : > /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz.b64
          for blob in \
            0383e167d01591bb339798a76d39973cfe5d27c0 \
            b2966edcc6f986c74a40f7228d1a3c76a73463a8 \
            89728e5f430e058f234a6729733b68ed3eac8b3b; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz.b64
          done
          test "$(wc -c < /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz.b64 | tr -d ' ')" = "$WRAPPER_B64_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz.b64 | awk '{print $1}')" = "$WRAPPER_B64_SHA256"
          base64 -d /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz.b64 > /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz
          test "$(wc -c < /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz | tr -d ' ')" = "$WRAPPER_GZIP_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz | awk '{print $1}')" = "$WRAPPER_GZIP_SHA256"
          gzip -dc /tmp/rastel-preflight-v4-wrapper/wrapper.sh.gz > /tmp/rastel-preflight-v4-wrapper/wrapper.sh
          test "$(wc -c < /tmp/rastel-preflight-v4-wrapper/wrapper.sh | tr -d ' ')" = "$WRAPPER_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v4-wrapper/wrapper.sh | awk '{print $1}')" = "$WRAPPER_SHA256"
          bash -n /tmp/rastel-preflight-v4-wrapper/wrapper.sh
          chmod 700 /tmp/rastel-preflight-v4-wrapper/wrapper.sh
          exec /tmp/rastel-preflight-v4-wrapper/wrapper.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected-bootstrap
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v4-selected-bootstrap
            /tmp/rastel-preflight-v4-wrapper
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
