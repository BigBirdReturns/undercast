name: complete-star-trek-enwright-cycle

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/star-trek-enwright-completion.yml"
      - ".ci/star-trek-enwright/scripts.tgz.b64"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-star-trek-enwright-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/star-trek-enwright-completion.yml
  TRANSPORT: .ci/star-trek-enwright/scripts.tgz.b64
  TRANSPORT_SHA256: 677f6e6f2691552c7395a58ef26210f1e61553b9b96757373f6cb5cc25d7433c
  CYCLE_CONTEXT: /tmp/star-trek-enwright-cycle-context.json
  GH_TOKEN: ${{ github.token }}

jobs:
  complete:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 32

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch, fetched live main, and decoded transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=32 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          exact_main="$(git rev-parse refs/remotes/origin/main)"
          test -n "$exact_main"
          export EXACT_MAIN="$exact_main"
          echo "EXACT_MAIN=$exact_main" >> "$GITHUB_ENV"

          cycle_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          test -n "$cycle_at"
          echo "CYCLE_AT=$cycle_at" >> "$GITHUB_ENV"

          tr -d '\n\r\t ' < "$TRANSPORT" | base64 --decode > /tmp/star-trek-enwright-scripts.tgz
          test "$(sha256sum /tmp/star-trek-enwright-scripts.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          mkdir -p /tmp/star-trek-enwright-scripts
          tar -xzf /tmp/star-trek-enwright-scripts.tgz -C /tmp/star-trek-enwright-scripts
          test "$(find /tmp/star-trek-enwright-scripts -maxdepth 1 -type f | wc -l)" -eq 2
          node --check /tmp/star-trek-enwright-scripts/apply-star-trek-enwright-cycle.mjs
          node --check /tmp/star-trek-enwright-scripts/apply-star-trek-enwright-finalize.mjs

          git rebase refs/remotes/origin/main
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          cat > /tmp/expected-transport-paths.txt <<PATHS
          $TRANSPORT
          $SELF
          PATHS
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-transport-paths.txt
          diff -u /tmp/expected-transport-paths.txt /tmp/actual-transport-paths.txt
          echo "exact_main=$EXACT_MAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "rebased_launcher=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "cycle_at=$cycle_at" >> "$GITHUB_STEP_SUMMARY"

      - name: Resume the sole lease and materialize the terminal candidate
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/star-trek-enwright-scripts/apply-star-trek-enwright-cycle.mjs

          # Canonical adoption changes the shared coverage-file bytes even though
          # only Enwright's role_on_wall projection changes semantically. Renew
          # both active certificates so each retains the current global file
          # receipt before the complete candidate gate.
          certification_at="$(cat /tmp/star-trek-enwright-candidate-at.txt)"
          node scripts/autopilot.mjs certify \
            --scope star-trek \
            --reviewed-by chatgpt-second-desk \
            --now "$certification_at"
          node scripts/autopilot.mjs certify \
            --scope doctor-who \
            --reviewed-by chatgpt-second-desk \
            --now "$certification_at"
          node scripts/autopilot.mjs sync --now "$certification_at"

          node scripts/autopilot.mjs validate
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/waterline.mjs validate --scope star-trek
          node scripts/waterline.mjs validate --scope doctor-who
          node scripts/doctor-who-pilot-cycle.mjs
          node scripts/doctor-who-correction-drill.mjs
          test -s "$CYCLE_CONTEXT"
          test -s /tmp/star-trek-enwright-candidate-at.txt
          test -s /tmp/star-trek-enwright-reviewed-at.txt
          test -s /tmp/star-trek-enwright-final-at.txt

      - name: Commit and completely gate the workflow-free candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SELF" "$TRANSPORT"
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git add -A
          git diff --cached --check
          if git diff --cached --name-only "$EXACT_MAIN" | grep -Eq '^(\.github/|\.ci/|images/)'; then
            echo 'temporary transport or unauthorized image bytes survived in candidate' >&2
            git diff --cached --name-only "$EXACT_MAIN" >&2
            exit 1
          fi

          candidate_at="$(cat /tmp/star-trek-enwright-candidate-at.txt)"
          GIT_AUTHOR_DATE="$candidate_at" GIT_COMMITTER_DATE="$candidate_at" git commit \
            -m 'Star Trek: resolve James Doohan as the Enwright voice' \
            -m 'resume the exact persisted lease and correct the non-authoritative physical hint' \
            -m 'close both media facets as honest absence and retain receipt custody separately'
          candidate_head="$(git rev-parse HEAD)"
          echo "CANDIDATE_COMMIT=$candidate_head" >> "$GITHUB_ENV"
          echo "$candidate_head" > /tmp/star-trek-enwright-candidate-head.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/star-trek-enwright-candidate-paths.txt
          ! grep -Eq '^(\.github/|\.ci/|images/)' /tmp/star-trek-enwright-candidate-paths.txt

          npm run gate 2>&1 | tee /tmp/star-trek-enwright-candidate-gate.log
          candidate_gate_sha="$(sha256sum /tmp/star-trek-enwright-candidate-gate.log | awk '{print $1}')"
          echo "CANDIDATE_GATE_SHA256=$candidate_gate_sha" >> "$GITHUB_ENV"
          echo "$candidate_gate_sha" > /tmp/star-trek-enwright-candidate-gate.sha256

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain)"
          echo "candidate_head=$candidate_head" >> "$GITHUB_STEP_SUMMARY"
          echo "candidate_gate_sha256=$candidate_gate_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact candidate and complete-gate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-enwright-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/star-trek-enwright-cycle-context.json
            /tmp/star-trek-enwright-candidate-head.txt
            /tmp/star-trek-enwright-candidate-paths.txt
            /tmp/star-trek-enwright-candidate-gate.log
            /tmp/star-trek-enwright-candidate-gate.sha256
            /tmp/expected-transport-paths.txt
            /tmp/actual-transport-paths.txt

      - name: Record the exact reviewed cycle and permanent checker
        shell: bash
        env:
          CANDIDATE_ARTIFACT_NAME: star-trek-enwright-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          job_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name == "complete") | .id' | head -n 1)"
          test "$job_id" -gt 0
          export WORKFLOW_JOB_ID="$job_id"
          export CANDIDATE_COMMIT
          export CANDIDATE_GATE_SHA256
          node /tmp/star-trek-enwright-scripts/apply-star-trek-enwright-finalize.mjs
          npm run star-trek:enwright-cycle:check
          node scripts/doctor-who-pilot-cycle.mjs
          node scripts/doctor-who-correction-drill.mjs
          node scripts/autopilot.mjs validate
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/waterline.mjs validate --scope star-trek
          node scripts/waterline.mjs validate --scope doctor-who
          echo "workflow_job=$job_id" >> "$GITHUB_STEP_SUMMARY"
          echo "candidate_artifact_id=${CANDIDATE_ARTIFACT_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "candidate_artifact_sha256=${CANDIDATE_ARTIFACT_SHA256}" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, completely gate, and publish the exact final product
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          final_at="$(cat /tmp/star-trek-enwright-final-at.txt)"
          GIT_AUTHOR_DATE="$final_at" GIT_COMMITTER_DATE="$final_at" git commit \
            -m 'Star Trek: complete and receipt the Enwright cycle' \
            -m 'retain exact lease, source, voice-only modality, canonical, media, and queue custody' \
            -m 'return both active estates to the ordinary zero-debt waterline'
          final_head="$(git rev-parse HEAD)"
          echo "$final_head" > /tmp/star-trek-enwright-final-head.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/star-trek-enwright-final-paths.txt
          ! grep -Eq '^(\.github/|\.ci/|images/|scripts/apply-star-trek-enwright)' /tmp/star-trek-enwright-final-paths.txt
          for required in \
            data/AUTOPILOT.json \
            data/AUTOPILOT-CERTIFICATIONS.json \
            data/CENSUS-COVERAGE.json \
            data/ESTATE-REGISTRY.json \
            data/MEDIA-AUDIT.json \
            data/SOURCES.json \
            data/WATERLINE-STATE.json \
            data/review/star-trek-enwright-cycle.json \
            data/specimens.json \
            scripts/star-trek-enwright-cycle.mjs; do
            grep -Fxq "$required" /tmp/star-trek-enwright-final-paths.txt || {
              echo "required permanent path missing: $required" >&2
              exit 1
            }
          done

          npm run gate 2>&1 | tee /tmp/star-trek-enwright-final-gate.log
          final_gate_sha="$(sha256sum /tmp/star-trek-enwright-final-gate.log | awk '{print $1}')"
          echo "$final_gate_sha" > /tmp/star-trek-enwright-final-gate.sha256
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain)"
          npm run star-trek:enwright-cycle:check

          git fetch --no-tags --depth=32 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "final_head=$final_head" >> "$GITHUB_STEP_SUMMARY"
          echo "final_gate_sha256=$final_gate_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "final_paths=$(wc -l < /tmp/star-trek-enwright-final-paths.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact final publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-enwright-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/star-trek-enwright-cycle-context.json
            /tmp/star-trek-enwright-permanent-receipt.json
            /tmp/star-trek-enwright-cycle-receipt-input.json
            /tmp/star-trek-enwright-candidate-head.txt
            /tmp/star-trek-enwright-final-head.txt
            /tmp/star-trek-enwright-candidate-paths.txt
            /tmp/star-trek-enwright-final-paths.txt
            /tmp/star-trek-enwright-candidate-gate.log
            /tmp/star-trek-enwright-final-gate.log
            /tmp/star-trek-enwright-candidate-gate.sha256
            /tmp/star-trek-enwright-final-gate.sha256
