name: star-trek-risik-independent-product-review-v1

on:
  push:
    branches:
      - agent/star-trek-risik-independent-review-recovery-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-risik-independent-product-review-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  EXPECTED_MAIN_TREE: 6d32c386636296e76bcab61baa387cb629967ac3
  EXPECTED_MAIN_MESSAGE: "Star Trek: publish Morgo cycle"

  CLAIM_BRANCH: agent/star-trek-risik-claim-result-v2
  CLAIM_COMMIT: eff3da84c7718d0894afda1fbc4e790bc88265da
  CLAIM_TREE: 289b2393496d1146e69e0219784564623b844863
  CLAIM_RECEIPT_PATH: data/review/adapter-sdk/star-trek-risik-claim.json

  CANDIDATE_BRANCH: agent/star-trek-risik-candidate-v1
  CANDIDATE_COMMIT: 03afc14da5b1cbe53cb99708edddb3c4c33a0adf
  CANDIDATE_TREE: 945e4da7a8b325173ac2b7b8da9fd3d65c5525c3
  CANDIDATE_MESSAGE: "Star Trek: stage reviewed Risik candidate v1"
  CANDIDATE_RECEIPT_PATH: data/review/adapter-sdk/star-trek-risik-candidate.json
  CANDIDATE_RECEIPT_SHA: 831bc23f0060dfdebd3c99ffd905947bf3143344568ee174fe66dac4fcab1641

  STAGE_RESULT_BRANCH: agent/star-trek-risik-stage-result-v2
  STAGE_RESULT_COMMIT: 88682ec369b551875f08dc91e197ae8dcb3c70ec
  STAGE_RESULT_TREE: a1d3e30452e5a905b0c984ee13e604a376037f91
  STAGE_RESULT_PATH: transport/star-trek-risik-stage-v2/stage-result.json
  STAGE_ARTIFACT_ID: "9636943540"
  STAGE_ARTIFACT_DIGEST: 2684dd4709770a3be1d146dbfd99230aea5a4bfe081a1c10699bab6876447468

  SOURCE_REVIEW_BRANCH: agent/star-trek-risik-source-review-result-v2
  SOURCE_REVIEW_COMMIT: c4841daaed48105eaa7eec4b39443ac1f49d930b
  SOURCE_REVIEW_TREE: 814c734bf02378e2481e2d600f566342c3f997c8
  SOURCE_REVIEW_SHA: 9205d21aa691550f1da1ae3b6351e4869e574ee14b446d1026d3ca7153300ee6
  SOURCE_REVIEW_PATH: transport/star-trek-risik-source-review-v2/source-review.json

  RECONCILIATION_BRANCH: agent/star-trek-risik-media-reconciliation-result-v1
  RECONCILIATION_COMMIT: 934d15d6ebf3f0b42b05ed94bc8efe9f256fa2df
  RECONCILIATION_TREE: af0db02e139886ba235ba5c61e912b99384ee031
  RECONCILIATION_SHA: 4817c8158c87ca9a8ed95ea9ca93a5020249719e10159066b47d44ce1ad83355
  RECONCILIATION_PATH: transport/star-trek-risik-media-reconciliation-v1/media-reconciliation.json

  MEDIA_BRANCH: agent/star-trek-risik-media-result-v1
  MEDIA_COMMIT: 86b6fcd580f9439b97f96a20bcace2bfcbcc102d
  MEDIA_TREE: 933fee84fa5b034f3d753d6a225f6196398fe69f
  MEDIA_RECEIPT_SHA: 9ccbd09cd8d94751071d65cc327dd04babce8db05f59fc8e47db1832e2547b7c
  MEDIA_RECEIPT_PATH: transport/star-trek-risik-media-v1/media-receipt.json

  MEDIA_REVIEW_BRANCH: agent/star-trek-risik-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 1361fe7b0250f59a88255c8f4649bed389c05890
  MEDIA_REVIEW_TREE: 076ec25f5ee0b2be7eafc6ae15efd13925fc3194
  MEDIA_REVIEW_SHA: 3fe266654351e5df2cabcbce6045ab3fc13e575b2ce049c245e5aee500d87598
  MEDIA_REVIEW_PATH: transport/star-trek-risik-media-review-v1/media-review.json

  TASK_ID: ap_096624f177ae0c9f2e91836c
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Risik
  EXPECTED_FINGERPRINT: 6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6
  EXPECTED_LEASE: lease_5d07d02fd67ea40a4950b1dd
  WALL_ID: UC-1399
  EXPECTED_STILL_SHA: 3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9
  EXPECTED_PORTRAIT_SHA: e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42
  STILL_ITEM_ID: ma_c33a2bc57b2edeb77c2170e9
  PORTRAIT_ITEM_ID: ma_1c7457e3778e5c94ece5dabd

  RESULT_BRANCH: agent/star-trek-risik-independent-review-result-v1
  REVIEWER_SOURCE: .github/recovery/star-trek-risik-independent-product-review-v1/reviewer.py
  REVIEWER: /tmp/star-trek-risik-independent-product-review-v1.py
  OUT: /tmp/star-trek-risik-independent-product-review-v1

jobs:
  review:
    name: independently-review-risik-candidate-v1
    if: ${{ github.event.head_commit.message == 'Independently review Star Trek Risik candidate v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify sealed reviewer and freeze exact review inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum -c .github/recovery/star-trek-risik-independent-product-review-v1/sealed-manifest.sha256
          cp "$REVIEWER_SOURCE" "$REVIEWER"
          chmod +x "$REVIEWER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["REVIEWER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "+refs/heads/${STAGE_RESULT_BRANCH}:refs/remotes/origin/${STAGE_RESULT_BRANCH}" \
            "+refs/heads/${SOURCE_REVIEW_BRANCH}:refs/remotes/origin/${SOURCE_REVIEW_BRANCH}" \
            "+refs/heads/${RECONCILIATION_BRANCH}:refs/remotes/origin/${RECONCILIATION_BRANCH}" \
            "+refs/heads/${MEDIA_BRANCH}:refs/remotes/origin/${MEDIA_BRANCH}" \
            "+refs/heads/${MEDIA_REVIEW_BRANCH}:refs/remotes/origin/${MEDIA_REVIEW_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_MAIN_TREE"
          test "$(git show -s --format=%s "$EXPECTED_MAIN")" = "$EXPECTED_MAIN_MESSAGE"

          test "$(git rev-parse "refs/remotes/origin/${CLAIM_BRANCH}")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%T "$CLAIM_COMMIT")" = "$CLAIM_TREE"
          test "$(git show -s --format=%P "$CLAIM_COMMIT")" = "$EXPECTED_MAIN"

          test "$(git rev-parse "refs/remotes/origin/${CANDIDATE_BRANCH}")" = "$CANDIDATE_COMMIT"
          test "$(git show -s --format=%T "$CANDIDATE_COMMIT")" = "$CANDIDATE_TREE"
          test "$(git show -s --format=%P "$CANDIDATE_COMMIT")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%s "$CANDIDATE_COMMIT")" = "$CANDIDATE_MESSAGE"
          test "$(git rev-parse "$CANDIDATE_COMMIT:.github")" = "$(git rev-parse "$EXPECTED_MAIN:.github")"

          test "$(git rev-parse "refs/remotes/origin/${STAGE_RESULT_BRANCH}")" = "$STAGE_RESULT_COMMIT"
          test "$(git show -s --format=%T "$STAGE_RESULT_COMMIT")" = "$STAGE_RESULT_TREE"
          test -z "$(git show -s --format=%P "$STAGE_RESULT_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}")" = "$SOURCE_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_REVIEW_COMMIT")" = "$SOURCE_REVIEW_TREE"
          test -z "$(git show -s --format=%P "$SOURCE_REVIEW_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${RECONCILIATION_BRANCH}")" = "$RECONCILIATION_COMMIT"
          test "$(git show -s --format=%T "$RECONCILIATION_COMMIT")" = "$RECONCILIATION_TREE"
          test -z "$(git show -s --format=%P "$RECONCILIATION_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${MEDIA_BRANCH}")" = "$MEDIA_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_COMMIT")" = "$MEDIA_TREE"
          test -z "$(git show -s --format=%P "$MEDIA_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${MEDIA_REVIEW_BRANCH}")" = "$MEDIA_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_REVIEW_COMMIT")" = "$MEDIA_REVIEW_TREE"
          test -z "$(git show -s --format=%P "$MEDIA_REVIEW_COMMIT")"

          git show "$STAGE_RESULT_COMMIT:$STAGE_RESULT_PATH" > "$OUT/stage-result.json"
          git show "$CLAIM_COMMIT:$CLAIM_RECEIPT_PATH" > "$OUT/claim-receipt.json"
          git show "$SOURCE_REVIEW_COMMIT:$SOURCE_REVIEW_PATH" > "$OUT/source-review.json"
          git show "$RECONCILIATION_COMMIT:$RECONCILIATION_PATH" > "$OUT/media-reconciliation.json"
          git show "$MEDIA_COMMIT:$MEDIA_RECEIPT_PATH" > "$OUT/media-receipt.json"
          git show "$MEDIA_REVIEW_COMMIT:$MEDIA_REVIEW_PATH" > "$OUT/media-review.json"

          printf '%s\n' "$CANDIDATE_COMMIT" > "$OUT/candidate-commit.txt"
          printf '%s\n' "$CANDIDATE_TREE" > "$OUT/candidate-tree.txt"
          printf '%s\n' "$CLAIM_COMMIT" > "$OUT/candidate-parent.txt"
          printf '%s\n' "$CANDIDATE_MESSAGE" > "$OUT/candidate-message.txt"
          git diff --name-only "$CLAIM_COMMIT" "$CANDIDATE_COMMIT" | LC_ALL=C sort > "$OUT/candidate-changed-paths.txt"

          git checkout --detach "$CANDIDATE_COMMIT"
          git clean -fdx
          npm ci --ignore-scripts

      - name: Hydrate immutable Git custody and run repository controls
        shell: bash
        run: |
          set -Eeuo pipefail
          if test "$(git rev-parse --is-shallow-repository)" = true; then
            git fetch --no-tags --unshallow origin '+refs/heads/*:refs/remotes/origin/*'
          else
            git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          fi
          for commit in \
            39a58f2c5538da1adb7657623ee300dbca54a82d \
            efdce8dec82fb803fd165d7af0c1a6c77e3eecb8 \
            84688c5308db55aae6a97a753d593aa15fe91d37
          do
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$commit"
            fi
            git cat-file -e "${commit}^{commit}"
          done
          test "$(git rev-parse --is-shallow-repository)" = false

          node scripts/validate.mjs | tee "$OUT/repository-validate.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/waterline-validate.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"

          test -z "$(git status --porcelain)"
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$EXPECTED_MAIN"
          printf '%s\n' "$EXPECTED_MAIN" > "$OUT/main-after.txt"

          jq -n \
            --arg repository_validate "$(sha256sum "$OUT/repository-validate.log" | awk '{print $1}')" \
            --arg media_gate "$(sha256sum "$OUT/media-gate.log" | awk '{print $1}')" \
            --arg waterline_validate "$(sha256sum "$OUT/waterline-validate.log" | awk '{print $1}')" \
            --arg thesis_validate "$(sha256sum "$OUT/thesis-validate.log" | awk '{print $1}')" \
            --arg autopilot_fixtures "$(sha256sum "$OUT/autopilot-fixtures.log" | awk '{print $1}')" \
            '{
              repository_validate:{verdict:"pass",log_sha256:$repository_validate},
              media_gate:{verdict:"pass",scope:"star-trek",log_sha256:$media_gate},
              waterline_validate:{verdict:"pass",log_sha256:$waterline_validate},
              thesis_validate:{verdict:"pass",log_sha256:$thesis_validate},
              autopilot_fixtures:{verdict:"pass",log_sha256:$autopilot_fixtures},
              working_tree_clean:true,
              canonical_main_unchanged:true
            }' > "$OUT/control-results.json"

      - name: Perform independent product review
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$REVIEWER" inspect
          python3 "$REVIEWER" receipt

          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            --arg candidate "$CANDIDATE_COMMIT" \
            --arg receipt "$CANDIDATE_RECEIPT_SHA" \
            '.transaction == "STAR-TREK-RISIK-INDEPENDENT-PRODUCT-REVIEW-V1"
             and .verdict == "pass"
             and .candidate.commit == $candidate
             and .candidate.receipt_sha256 == $receipt
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id == $wall
             and .queue == {total:2228,queued:1795,resolved:431,blocked:0,rejected:2,in_flight:0}
             and .record.production == "Something Borrowed, Something Green"
             and .record.kind == "voice"
             and .source_review.review_sha256 == env.SOURCE_REVIEW_SHA
             and .media_reconciliation.reconciliation_sha256 == env.RECONCILIATION_SHA
             and .media.review_sha256 == env.MEDIA_REVIEW_SHA
             and .candidate_publication_admissible == true
             and .boundary.independent_product_review_complete == true
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false
             and .boundary.waterline_cycle_recorded == false
             and .boundary.pages_deployed == false' \
            "$OUT/independent-review.json" >/dev/null

          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload independent Risik product review
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-independent-product-review-v1-${{ github.run_id }}
          path: /tmp/star-trek-risik-independent-product-review-v1/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish immutable Risik independent review
        if: ${{ success() }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/independent-review.json" > "$OUT/review.tmp"
          mv "$OUT/review.tmp" "$OUT/independent-review.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-risik-independent-product-review-v1
          git config user.email undercast-risik-independent-product-review-v1@users.noreply.github.com
          git checkout --orphan risik-independent-product-review-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-risik-independent-product-review-v1
          cp -a "$OUT"/. transport/star-trek-risik-independent-product-review-v1/
          git add transport/star-trek-risik-independent-product-review-v1
          git commit -m "Record Star Trek Risik independent product review v1"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
