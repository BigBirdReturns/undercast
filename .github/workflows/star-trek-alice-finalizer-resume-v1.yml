name: star-trek-alice-finalizer-resume-v1

on:
  push:
    branches: [agent/star-trek-alice-finalizer-v1]

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-alice-finalizer-resume-v1
  cancel-in-progress: false

env:
  CURRENT_MAIN: 6377c4c7ba5ed4fa7d7eb3c499d32c258aec9834
  CURRENT_TREE: 882177302edde4fea93563a9c6bd63deb0514483
  ORIGINAL_MAIN: 91254f17fa1ebb6e8502c6201e9bc8651ef4d4ac
  ORIGINAL_TREE: e395cd3e679aadf60243f5b7bfe0ee7b2b079874
  CLAIM_COMMIT: 31499f3d871c7a4d8a749af5a90e361a50153a50
  CLAIM_TREE: 9612f0169cc670847f468459d489aa408e79ec62
  ORIGINAL_CANDIDATE_BRANCH: agent/star-trek-alice-candidate-v1
  ORIGINAL_CANDIDATE_COMMIT: 2e34c0e3f6435132608c8a5cdbf75c4e71f09ed3
  ORIGINAL_CANDIDATE_TREE: 2d033986aa32071bc99795405f34ea52947b849d
  REBASED_CANDIDATE_BRANCH: agent/star-trek-alice-candidate-rebased-v1
  REBASED_CANDIDATE_COMMIT: 2f61ae8527b49b52ee9f5beb3f6d954e70551d2f
  REBASED_CANDIDATE_TREE: 7965b58d25639ff175d42296de3d1edead73b14c
  CANDIDATE_PATH_COUNT: "43"
  CANDIDATE_PATH_LEDGER_SHA256: 60190b11be5fbdd872ab23fbb858f29d42ae0d3946470da96113709fc9b6bc62
  STAGE_RECEIPT_SHA256: f6d95cc371fc3e1e1f76017425197525433ee0769bf28327b9623e37f7745bb9
  REVIEW_SHA256: ab8afb35a596ebe1cb1a77fb284d6528abd54346755c19c4ef01475dda7083a6
  REVIEW_ARTIFACT_ID: "9515617615"
  REVIEW_ARTIFACT_DIGEST: 4bcc580257e3b7007b127b8805342c39e021c9019c14dd62f31320aeb45e4034
  REVIEW_SOURCE_RUN: "32714526882"
  REVIEW_SOURCE_HEAD: 9d268e6b3499b813cb49e83746147ee08a80b0b6
  STAGE_RESULT_BRANCH: agent/star-trek-alice-stage-result-v1
  STAGE_PREFIX: transport/star-trek-alice-stage-v1
  MEDIA_RESULT_BRANCH: agent/star-trek-alice-media-result-v1
  FINALIZER_BRANCH: agent/star-trek-alice-finalizer-v1
  RESULT_BRANCH: agent/star-trek-alice-finalizer-result-v1
  STAGE_ROOT: /tmp/star-trek-alice-stage-input-v1
  REVIEW_ROOT: /tmp/star-trek-alice-independent-review-v2
  FINAL_ROOT: /tmp/star-trek-alice-final-v1
  DIAGNOSTIC_ROOT: /tmp/star-trek-alice-finalizer-diagnostics-resume-v1
  CONTROLLER: /tmp/star-trek-alice-finalizer-controller.mjs
  DRIVER: /tmp/star-trek-alice-finalizer-driver-resume-v1.sh
  CONTROLLER_SHA256: bdb9d77c5116bdb130d0e3b5a946b2a8397e966070b2e3448dd3340c6b3fac5d
  CONTROLLER_B64_SHA256: 76660d641670ea98436cd001d31720de8111b859c5544b44aa0994d2b6bb0851
  DRIVER_SHA256: c4c68764ce51ba8e0de3fe39b12a0dcdabcb1ea1e7e5948b61b2611ce5981e0d
  DRIVER_B64_SHA256: 63da7a23c19b4c3d842052dab803c6d78205854728f55b7a87faf1b2b7b0b837
  TASK_ID: ap_c7ff8298a99fe94fc55bbdbc
  LEASE_ID: lease_e1da8637695057922f1840d4
  WALL_ID: UC-1396

jobs:
  finalize:
    name: resume-finalize-publish-and-deploy-alice
    if: ${{ github.event.head_commit.message == 'Resume Star Trek Alice finalizer v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      product_commit: ${{ steps.pipeline.outputs.product_commit }}
      product_tree: ${{ steps.pipeline.outputs.product_tree }}
      pages_run: ${{ steps.pipeline.outputs.pages_run }}
      receipt_sha256: ${{ steps.pipeline.outputs.receipt_sha256 }}
      checker_sha256: ${{ steps.pipeline.outputs.checker_sha256 }}
      reviewed_cycle: ${{ steps.pipeline.outputs.reviewed_cycle }}
      next_task: ${{ steps.pipeline.outputs.next_task }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f61ae8527b49b52ee9f5beb3f6d954e70551d2f
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download retained independent review
        uses: actions/download-artifact@v4
        with:
          name: star-trek-alice-independent-review-v2
          path: /tmp/star-trek-alice-independent-review-v2
          repository: ${{ github.repository }}
          run-id: 32714526882
          github-token: ${{ github.token }}

      - name: Verify retained candidate, review, and canonical custody
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$FINALIZER_BRANCH" "$STAGE_RESULT_BRANCH" "$REBASED_CANDIDATE_BRANCH"
          test "$(git rev-parse HEAD)" = "$REBASED_CANDIDATE_COMMIT"
          test "$(git show -s --format=%T HEAD)" = "$REBASED_CANDIDATE_TREE"
          test "$(git show -s --format=%P HEAD)" = "$CURRENT_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$CURRENT_MAIN"
          test "$(git show -s --format=%T refs/remotes/origin/main)" = "$CURRENT_TREE"
          test "$(git rev-parse "refs/remotes/origin/${REBASED_CANDIDATE_BRANCH}")" = "$REBASED_CANDIDATE_COMMIT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          test "$(jq -r .verdict "$REVIEW_ROOT/independent-review.json")" = pass
          test "$(jq -r .review_sha256 "$REVIEW_ROOT/independent-review.json")" = "$REVIEW_SHA256"
          test "$(jq -r .rebased_candidate.commit "$REVIEW_ROOT/independent-review.json")" = "$REBASED_CANDIDATE_COMMIT"
          test "$(jq -r .rebased_candidate.tree "$REVIEW_ROOT/independent-review.json")" = "$REBASED_CANDIDATE_TREE"
          test "$(jq -r .task.id "$REVIEW_ROOT/independent-review.json")" = "$TASK_ID"
          test "$(jq -r .task.lease_id "$REVIEW_ROOT/independent-review.json")" = "$LEASE_ID"
          test "$(jq -r .task.wall_id "$REVIEW_ROOT/independent-review.json")" = "$WALL_ID"
          test "$(sha256sum "$REVIEW_ROOT/rebased-committed-paths.txt" | awk '{print $1}')" = "$CANDIDATE_PATH_LEDGER_SHA256"
          test "$(wc -l < "$REVIEW_ROOT/rebased-committed-paths.txt" | tr -d ' ')" = "$CANDIDATE_PATH_COUNT"
          review_meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEW_ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"$review_meta")" = false
          test "$(jq -r .name <<<"$review_meta")" = star-trek-alice-independent-review-v2
          test "$(jq -r .workflow_run.id <<<"$review_meta")" = "$REVIEW_SOURCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$review_meta")" = "$REVIEW_SOURCE_HEAD"
          test "$(jq -r .digest <<<"$review_meta" | sed 's/^sha256://')" = "$REVIEW_ARTIFACT_DIGEST"
          while read -r digest original_path; do
            file="$REVIEW_ROOT/$(basename "$original_path")"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$digest"
          done < "$REVIEW_ROOT/manifest.sha256"

      - name: Reconstruct normalized finalization-only driver
        shell: bash
        run: |
          set -Eeuo pipefail
          controller_b64=/tmp/controller.mjs.gz.b64
          driver_b64=/tmp/driver.sh.gz.b64
          git show "refs/remotes/origin/${FINALIZER_BRANCH}:.github/recovery/star-trek-alice-finalizer-v1/controller.mjs.gz.b64" > "$controller_b64"
          : > "$driver_b64"
          for part in 00 01 02 03; do
            git show "refs/remotes/origin/${FINALIZER_BRANCH}:.github/recovery/star-trek-alice-finalizer-resume-v1/driver.sh.gz.b64.part-${part}" >> "$driver_b64"
          done
          echo "$CONTROLLER_B64_SHA256  $controller_b64" | sha256sum -c -
          echo "$DRIVER_B64_SHA256  $driver_b64" | sha256sum -c -
          base64 -d "$controller_b64" | gzip -d > "$CONTROLLER"
          base64 -d "$driver_b64" | gzip -d > "$DRIVER"
          echo "$CONTROLLER_SHA256  $CONTROLLER" | sha256sum -c -
          echo "$DRIVER_SHA256  $DRIVER" | sha256sum -c -
          node --check "$CONTROLLER"
          bash -n "$DRIVER"
          chmod +x "$DRIVER"

      - name: Finalize retained Alice candidate, publish, deploy, and read back
        id: pipeline
        shell: bash
        run: "$DRIVER finalize"

      - name: Upload terminal Alice evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-alice-terminal-resume-v1
          path: /tmp/star-trek-alice-final-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal locator branch
        shell: bash
        env:
          TERMINAL_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          TERMINAL_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: "$DRIVER publish-result"

      - name: Preserve resume failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-alice-finalizer-resume-failure-${{ github.run_id }}
          path: |
            /tmp/star-trek-alice-stage-input-v1/
            /tmp/star-trek-alice-independent-review-v2/
            /tmp/star-trek-alice-final-v1/
            /tmp/star-trek-alice-finalizer-diagnostics-resume-v1/
            /tmp/star-trek-alice-finalizer-controller.mjs
            /tmp/star-trek-alice-finalizer-driver-resume-v1.sh
          if-no-files-found: warn
          retention-days: 30
