name: doctor-who-cycle-012-senstarg-materializer-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-materializer-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-materializer-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-materializer-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_MAIN: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      CURRENT_TREE: 33b1ff1ea4f191ee42ce09afc9a88a01c7006e71
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-review-v1
      SELF: .github/workflows/doctor-who-cycle-012-senstarg-materializer-review-v1.yml
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      SOURCE_PR: "934"
      SOURCE_BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-derivation-v1
      SOURCE_HEAD: 86a4184fbb95d1302e9444bf37ba99adbaa7c967
      SOURCE_WORKFLOW: doctor-who-cycle-012-senstarg-materializer-derivation-v1
      SOURCE_RUN: "31476730537"
      SOURCE_ARTIFACT: "9095521701"
      SOURCE_ARTIFACT_SHA256: "9d82ec7624d55046aa4068bf3a8b18d89984abd831bc90c9865343f1bf97fa32"
      SOURCE_DERIVATION_IDENTITY: "776cc1081f65b1f7eb6296d51195224a8c431af8a0844dc416655d531b7fded7"
      TARGET_BYTES: "42256"
      TARGET_SHA256: "715e853a7cecc300066460504e79c428810fc4f6d359fdd8fe0e1b0f2a4ba232"
      TARGET_GZIP_BYTES: "10066"
      TARGET_GZIP_SHA256: "4e8642176fb6a07aa1195b0f9b784bcad64c3720a2a8e1dac4531f87aeed1a1b"
      PATCH_BYTES: "72165"
      PATCH_SHA256: "7c2726dd1daea000799977183101671b9bc7cd1c6c41979e4293b2941b68297a"
      REVIEW_TEXT_BLOB: "7b81c8cec4537799f4a17ca642a88956ff3a1b57"
      REVIEW_B64_BYTES: "4639"
      REVIEW_B64_SHA256: "b5fca1d5227737e9ad08b09550a29a7c3fd726c56e3ac2dc7c0a89fe62d1ebf4"
      REVIEW_GZIP_BYTES: "3478"
      REVIEW_GZIP_SHA256: "758a8c564e057134d7192eb1f6ad9d49dd6ff6b11374673999c351177eadbd98"
      REVIEW_BYTES: "11258"
      REVIEW_SHA256: "39c0f0c9d754b5d50d67effb301070e94bbd8d0baccccbdaeed6802dc36d7b4e"
      OUT: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1
      LOADER: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1-loader
    steps:
      - name: Reconstruct, repair, and execute exact independent Senstarg materializer review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$REVIEW_TEXT_BLOB" > "$LOADER/blob.json"
          jq -r '.content' "$LOADER/blob.json" | tr -d '\n' | base64 -d > "$LOADER/review.sh.gz.b64"
          test "$(git hash-object --stdin < "$LOADER/review.sh.gz.b64")" = "$REVIEW_TEXT_BLOB"
          test "$(wc -c < "$LOADER/review.sh.gz.b64" | tr -d ' ')" = "$REVIEW_B64_BYTES"
          test "$(sha256sum "$LOADER/review.sh.gz.b64" | awk '{print $1}')" = "$REVIEW_B64_SHA256"
          base64 -d "$LOADER/review.sh.gz.b64" > "$LOADER/review.sh.gz"
          test "$(wc -c < "$LOADER/review.sh.gz" | tr -d ' ')" = "$REVIEW_GZIP_BYTES"
          test "$(sha256sum "$LOADER/review.sh.gz" | awk '{print $1}')" = "$REVIEW_GZIP_SHA256"
          gzip -t "$LOADER/review.sh.gz"
          gzip -dc "$LOADER/review.sh.gz" > "$LOADER/review.sh"
          test "$(wc -c < "$LOADER/review.sh" | tr -d ' ')" = "$REVIEW_BYTES"
          test "$(sha256sum "$LOADER/review.sh" | awk '{print $1}')" = "$REVIEW_SHA256"
          REVIEW="$LOADER/review.sh" python3 - <<'PY'
          import os
          from pathlib import Path

          path=Path(os.environ['REVIEW'])
          text=path.read_text()

          old_refs="""agents=api(f'/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/git/matching-refs/heads/{os.environ[\"AGENT_PREFIX\"]}')
          assert len(agents)==2
          assert agents[0]['ref'].endswith(os.environ['SOURCE_BRANCH'])
          assert agents[0]['object']['sha']==os.environ['SOURCE_HEAD']
          assert agents[1]['ref'].endswith(os.environ['BRANCH'])
          assert agents[1]['object']['sha']==os.environ['CURRENT_HEAD']"""
          new_refs="""agents=api(f'/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/git/matching-refs/heads/{os.environ[\"AGENT_PREFIX\"]}')
          by_branch={row['ref'].removeprefix('refs/heads/'):row['object']['sha'] for row in agents}
          assert by_branch=={
              os.environ['SOURCE_BRANCH']:os.environ['SOURCE_HEAD'],
              os.environ['BRANCH']:os.environ['CURRENT_HEAD'],
          }"""

          old_literals="""for literal in ['Dan Starkey', 'Senstarg', 'physical-prosthetic', 'The Vanquishers']:
              assert literal in text"""
          new_literals="""for literal in ['Dan Starkey', 'Senstarg', 'physical-prosthetic', 'The Vanquishers', 'ap_8965086737382df0e88366db', 'UC-1357']:
              assert literal in text"""

          old_carried="""for carried in [
              'ap_8965086737382df0e88366db',
              'UC-1357',
              'images/uc-1357-still.webp',
              'images/uc-1357-portrait.jpg',
              '4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713',
              '5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e',
          ]:
              assert carried not in text"""
          new_carried="""for carried in [
              'images/uc-1357-still.webp',
              'images/uc-1357-portrait.jpg',
              '4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713',
              '5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e',
          ]:
              assert carried not in text"""

          for old,new in ((old_refs,new_refs),(old_literals,new_literals),(old_carried,new_carried)):
              assert text.count(old)==1
              assert text.count(new)==0
              text=text.replace(old,new)
              assert old not in text and text.count(new)==1

          path.write_text(text)
          PY
          bash -n "$LOADER/review.sh"
          REVIEW="$LOADER/review.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['REVIEW']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==7
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-senstarg-review-{index}>','exec')
          PY
          chmod 700 "$LOADER/review.sh"
          "$LOADER/review.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1
            /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
