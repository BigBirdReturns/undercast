name: doctor-who-cycle-012-senstarg-materializer-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-012-senstarg-materializer-review-v1.yml"]

permissions: {}
concurrency:
  group: doctor-who-cycle-012-senstarg-materializer-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-materializer-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      TREE: 33b1ff1ea4f191ee42ce09afc9a88a01c7006e71
      HEAD: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-review-v1
      PATH_SELF: .github/workflows/doctor-who-cycle-012-senstarg-materializer-review-v1.yml
      CANDIDATE_BRANCH: agent/doctor-who-cycle-012-senstarg-candidate-v1
      CANDIDATE_HEAD: 0598d2e128b395b924a5fe8d8a5540270bcf75b9
      SOURCE_PR: "934"
      SOURCE_BRANCH: agent/doctor-who-cycle-012-senstarg-materializer-derivation-v1
      SOURCE_HEAD: 86a4184fbb95d1302e9444bf37ba99adbaa7c967
      SOURCE_RUN: "31476730537"
      SOURCE_ARTIFACT: "9095521701"
      SOURCE_ZIP_SHA: 9d82ec7624d55046aa4068bf3a8b18d89984abd831bc90c9865343f1bf97fa32
      DERIVATION_ID: 776cc1081f65b1f7eb6296d51195224a8c431af8a0844dc416655d531b7fded7
      TARGET_SHA: 715e853a7cecc300066460504e79c428810fc4f6d359fdd8fe0e1b0f2a4ba232
      GZIP_SHA: 4e8642176fb6a07aa1195b0f9b784bcad64c3720a2a8e1dac4531f87aeed1a1b
      PATCH_SHA: 7c2726dd1daea000799977183101671b9bc7cd1c6c41979e4293b2941b68297a
      TASK: ap_8965086737382df0e88366db
      WALL: UC-1357
      STILL_PATH: images/uc-1357-still.webp
      STILL_SHA: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      PORTRAIT_PATH: images/uc-1357-portrait.jpg
      PORTRAIT_SHA: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e
      OUT: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1
    steps:
      - name: Independently review exact Senstarg materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{source,payload}
          python3 - <<'PY'
          import gzip,hashlib,json,os,re,subprocess,textwrap,zipfile
          from pathlib import Path,PurePosixPath
          E=os.environ; root=Path(E['OUT']); source=root/'source'; payload=root/'payload'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def api(path,binary=False):
              data=subprocess.check_output(['gh','api',f'/repos/{E["GITHUB_REPOSITORY"]}{path}'])
              return data if binary else json.loads(data)
          main=api('/git/ref/heads/main'); commit=api('/git/commits/'+E['MAIN'])
          pr=api('/pulls/'+E['PR']); compare=api('/compare/'+E['MAIN']+'...'+E['HEAD'])
          refs=api('/git/matching-refs/heads/agent/doctor-who-cycle-012-')
          source_pr=api('/pulls/'+E['SOURCE_PR']); run=api('/actions/runs/'+E['SOURCE_RUN'])
          jobs=api('/actions/runs/'+E['SOURCE_RUN']+'/jobs?per_page=100')['jobs']
          artifact=api('/actions/artifacts/'+E['SOURCE_ARTIFACT'])
          assert main['object']['sha']==E['MAIN'] and commit['tree']['sha']==E['TREE']
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['ref']==E['BRANCH'] and pr['head']['sha']==E['HEAD'] and pr['base']['sha']==E['MAIN']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert [(x['filename'],x['status']) for x in compare['files']]==[(E['PATH_SELF'],'added')]
          observed={x['ref'].removeprefix('refs/heads/'):x['object']['sha'] for x in refs}
          assert observed=={E['CANDIDATE_BRANCH']:E['CANDIDATE_HEAD'],E['SOURCE_BRANCH']:E['SOURCE_HEAD'],E['BRANCH']:E['HEAD']}
          assert source_pr['state']=='closed' and source_pr['merged'] is False
          assert source_pr['head']['ref']==E['SOURCE_BRANCH'] and source_pr['head']['sha']==E['SOURCE_HEAD']
          assert source_pr['base']['sha']==E['MAIN'] and source_pr['commits']==1 and source_pr['changed_files']==1
          assert run['name']=='doctor-who-cycle-012-senstarg-materializer-derivation-v1' and run['head_sha']==E['SOURCE_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success'
          rows=[x for x in jobs if x['name']=='derive']; assert len(rows)==1 and rows[0]['conclusion']=='success'
          assert artifact['id']==int(E['SOURCE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+E['SOURCE_ZIP_SHA']
          zip_bytes=api('/actions/artifacts/'+E['SOURCE_ARTIFACT']+'/zip',True)
          assert sha(zip_bytes)==E['SOURCE_ZIP_SHA']
          zip_path=root/'source.zip'; zip_path.write_bytes(zip_bytes)
          with zipfile.ZipFile(zip_path) as z:
              infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
              assert all(not PurePosixPath(x.filename).is_absolute() and '..' not in PurePosixPath(x.filename).parts for x in infos)
              z.extractall(source)
          pre=source/'SHA256SUMS.pre'; sealed=source/'SHA256SUMS'
          assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for line in pre.read_text().splitlines():
              if not line.strip(): continue
              digest,rel=line.split(None,1); path=source/rel.strip().lstrip('*').removeprefix('./')
              assert path.is_file() and sha(path.read_bytes())==digest
          files=[p for p in source.rglob('*') if p.is_file()]
          def exact(size,digest):
              rows=[p for p in files if p.stat().st_size==size and sha(p.read_bytes())==digest]
              assert len(rows)==1,(size,digest,[str(p) for p in rows]); return rows[0]
          target=exact(42256,E['TARGET_SHA']); packed=exact(10066,E['GZIP_SHA']); patch=exact(72165,E['PATCH_SHA'])
          assert gzip.decompress(packed.read_bytes())==target.read_bytes()
          subprocess.run(['bash','-n',str(target)],check=True)
          text=target.read_text(); blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==10
          for i,block in enumerate(blocks,1): compile(textwrap.dedent(block),f'<target-{i}>','exec')
          for value in ['Dan Starkey','Senstarg','physical-prosthetic','The Vanquishers']: assert value in text
          for value in [E['TASK'],E['WALL'],E['STILL_PATH'],E['PORTRAIT_PATH'],E['STILL_SHA'],E['PORTRAIT_SHA']]: assert value not in text
          for value in ["os.environ['TASK_ID']","os.environ['EXPECTED_WALL_ID']","os.environ['STILL_PATH']","os.environ['PORTRAIT_PATH']"]: assert value in text
          derivations=[]; modalities=[]
          for path in files:
              if path.suffix!='.json': continue
              try: row=json.loads(path.read_text())
              except Exception: continue
              if isinstance(row,dict) and row.get('status')=='cycle-012-senstarg-materializer-derived-v1': derivations.append(row)
              if isinstance(row,dict) and row.get('status')=='cycle-012-senstarg-performance-modality-adjudicated-v1': modalities.append(row)
          assert len(derivations)==1 and len(modalities)==1
          d=derivations[0]; body=dict(d); identity=body.pop('identity')
          assert identity==E['DERIVATION_ID']==sha(json.dumps(body,sort_keys=True,separators=(',',':')).encode())
          assert d['derivation']['target']['sha256']==E['TARGET_SHA'] and d['derivation']['target']['gzip_sha256']==E['GZIP_SHA']
          assert d['derivation']['patch']['sha256']==E['PATCH_SHA'] and d['boundary']['target_executed'] is False
          m=modalities[0]
          assert m['task']['id']==E['TASK'] and m['target']['wall_id']==E['WALL']
          assert m['target']['mode']=='physical-prosthetic' and m['target']['kind']=='face' and m['target']['maker_attribution']=='unresolved'
          assert m['target']['character_image']['target_path']==E['STILL_PATH'] and m['target']['character_image']['sha256']==E['STILL_SHA']
          assert m['target']['performer_portrait']['target_path']==E['PORTRAIT_PATH'] and m['target']['performer_portrait']['sha256']==E['PORTRAIT_SHA']
          receipt={'status':'cycle-012-senstarg-materializer-independently-reviewed-v1','version':1,
            'source':{'pr':int(E['SOURCE_PR']),'head':E['SOURCE_HEAD'],'run':int(E['SOURCE_RUN']),'artifact':int(E['SOURCE_ARTIFACT']),'artifact_sha256':E['SOURCE_ZIP_SHA'],'derivation_identity':E['DERIVATION_ID']},
            'target':{'bytes':42256,'sha256':E['TARGET_SHA'],'gzip_bytes':10066,'gzip_sha256':E['GZIP_SHA'],'patch_bytes':72165,'patch_sha256':E['PATCH_SHA'],'bash_syntax':'pass','embedded_python_programs':10},
            'task':{'id':E['TASK'],'performer':'Dan Starkey','role':'Senstarg','production':'The Vanquishers','year':2021,'mode':'physical-prosthetic','kind':'face','wall_id':E['WALL'],'still_sha256':E['STILL_SHA'],'portrait_sha256':E['PORTRAIT_SHA'],'maker_attribution':'unresolved'},
            'canonical':{'main':E['MAIN'],'tree':E['TREE']},
            'boundary':{'independent_review_only':True,'materializer_executed':False,'lease_issued':False,'queue_mutated':False,'wall_created':False,'media_adopted':False,'candidate_constructed':False,'cycle_receipt_written':False,'product_constructed':False,'canonical_mutation':False,'cycle_012_product_authority':False,'cycle_013_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (payload/'review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); (payload/'REVIEW_COMPLETE').write_text(receipt['identity']+'\n')
          for src,name in [(target,'materializer.senstarg-v1.sh'),(packed,'materializer.senstarg-v1.sh.gz'),(patch,'source-to-target.patch')]: (payload/name).write_bytes(src.read_bytes())
          rows=[f"{sha(p.read_bytes())}  {p.name}" for p in sorted(payload.iterdir()) if p.is_file() and p.name not in {'SHA256SUMS.pre','SHA256SUMS'}]
          (payload/'SHA256SUMS.pre').write_text('\n'.join(rows)+'\n'); (payload/'SHA256SUMS').write_text(sha((payload/'SHA256SUMS.pre').read_bytes())+'  SHA256SUMS.pre\n')
          PY
          (cd "$OUT/payload" && sha256sum -c SHA256SUMS.pre && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-materializer-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-materializer-review-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
