name: card-backfill-uc-107-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-107-RENDER.json"
      - "scripts/card-backfill-uc-107-render.mjs"
      - ".github/workflows/card-backfill-uc-107-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-107-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-023'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-107 render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-107-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-107');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-107');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1b74425768d476b9f0339c17');
          if(row.version!==1||row.record_id!=='UC-107'||row.actor!=='Pedro Pascal'||row.character!=='The Mandalorian'||row.production!=='The Mandalorian'||row.year!==2019||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-107 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8673117402||row.discovery_artifact?.head_sha!=='b640488402fcd6b619402cf40bb8913525121c4b'||row.discovery_artifact?.candidate_count!==4||row.discovery_artifact?.represented_asset_count!==2)throw new Error('UC-107 discovery custody drift');
          if(row.selected_source?.sha256!=='0305588c69ada14b52dde327ec4ea71cc7ab8c97d3b88a97f7dbd9a8db9f6bfd'||row.selected_source?.asset_key!=='desert-gunslinger'||row.selected_source?.width!==4000||row.selected_source?.height!==2667)throw new Error('UC-107 selected source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.candidate_gravity!=='east'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-107 render geometry drift');
          if(row.embodiment_boundary?.frame_specific_physical_occupant!=='not asserted'||!String(row.embodiment_boundary?.prohibited_inference||'').includes('does not claim'))throw new Error('UC-107 embodiment boundary drift');
          if(!specimen||specimen.character!=='The Mandalorian'||specimen.production!=='The Mandalorian'||specimen.years!=='2019'||specimen.still)throw new Error('UC-107 specimen boundary drift');
          if(source?.still)throw new Error('UC-107 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-107'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-107 audit boundary drift');
          console.log(`PASS — UC-107 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-render"
          mkdir -p "$root/source" "$root/output"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8673117402/zip" > "$root/discovery.zip"
          echo "f9d9f7bbcc27c374bc0affa59c492c4e2d1b73201203814c1822449edf0324d9  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-107-discover"
          test -f "$base/manifest.json"
          echo "021fdb62d3cb244dd2844cbf2e1b04fc5a23e750fe3f796474eb5a392b7e7687  $base/manifest.json" | sha256sum -c -
          echo "88a9f18729ef406cff9800a0530c257c9dd926a9eaa05d82ba602a5f6f6081ff  $base/summary.json" | sha256sum -c -
          echo "f9b1488ee93b5bd40e80326d96cb7260d63572d1f2b9e37189dc470c3898e50a  $base/contact-sheet-final.jpg" | sha256sum -c -
          echo "0305588c69ada14b52dde327ec4ea71cc7ab8c97d3b88a97f7dbd9a8db9f6bfd  $base/candidates/003-desert-gunslinger-declared-delivery.jpg" | sha256sum -c -
          echo "6b1760cb9a666ef8d8b50949bca5350f8de5f5834e22f94e97f3d6eeda1cb1de  $base/pages/disney-plus-first-look.png" | sha256sum -c -
          echo "5401faf3438960bc163b51e6e258ff987a368097685abfa4d932a5eecf6d5629  $base/pages/lucasfilm-cast-announcement.png" | sha256sum -c -
          echo "e9c9402b548e13b0b0c2db86f2b38cffbabf7823518e27f8721423c458e3f95b  $base/pages/star-wars-celebration-2019.png" | sha256sum -c -
          cat > "$root/discovery-artifact-receipt.txt" <<'EOF'
          run_id=30318563408
          artifact_id=8673117402
          artifact_name=card-backfill-uc-107-discover-30318563408
          artifact_zip_sha256=f9d9f7bbcc27c374bc0affa59c492c4e2d1b73201203814c1822449edf0324d9
          artifact_head_sha=b640488402fcd6b619402cf40bb8913525121c4b
          manifest_sha256=021fdb62d3cb244dd2844cbf2e1b04fc5a23e750fe3f796474eb5a392b7e7687
          summary_sha256=88a9f18729ef406cff9800a0530c257c9dd926a9eaa05d82ba602a5f6f6081ff
          contact_sheet_sha256=f9b1488ee93b5bd40e80326d96cb7260d63572d1f2b9e37189dc470c3898e50a
          selected_source_sha256=0305588c69ada14b52dde327ec4ea71cc7ab8c97d3b88a97f7dbd9a8db9f6bfd
          EOF
      - name: Render exact candidate and evidence packet
        env:
          CONTROL: .github/CARD-BACKFILL-UC-107-RENDER.json
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-107-render/source/card-backfill-uc-107-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-107-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-render"
          node --check scripts/card-backfill-uc-107-render.mjs
          node scripts/card-backfill-uc-107-render.mjs 2>&1 | tee "$root/render.log"
          (cd "$root/output/UC-107" && sha256sum -c SHA256SUMS)
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-107-render"
          if [ -d "$root" ]; then
            rm -rf "$root/source" "$root/discovery.zip"
          fi
      - name: Upload exact source, custody, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-107-render-${{ github.run_id }}
          path: ${{ runner.temp }}/card-backfill-uc-107-render
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
