name: ferengi-status-beacon

on:
  workflow_dispatch:
  push:
    branches: [agent/star-trek-ferengi-gold]
    paths: [.github/workflows/ferengi-status-beacon.yml]

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  status:
    if: github.ref_name == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record exact branch, PR, corpus and deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-status-beacon"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/pulls/86" > "$root/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/main" > "$root/main.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=agent/star-trek-ferengi-gold&per_page=100" > "$root/runs.json"
          node --input-type=module - <<'NODE' > "$root/status.json"
          import fs from 'node:fs';import crypto from 'node:crypto';
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const exists=p=>fs.existsSync(p);
          const plan=read('data/STAR-TREK-GOLD.json'),species=read('data/species.json'),specimens=read('data/specimens.json'),media=read('data/MEDIA-AUDIT.json');
          const pr=read(process.env.RUNNER_TEMP+'/ferengi-status-beacon/pr.json'),main=read(process.env.RUNNER_TEMP+'/ferengi-status-beacon/main.json');
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');const ids=[...new Set(taxon.wall_records.map(row=>row.id))];
          const byId=new Map(specimens.map(row=>[row.id,row]));const audit=new Map(media.items.map(row=>[`${row.wall_id}|${row.side}`,row]));
          const still_open=ids.filter(id=>!byId.get(id)?.still?.src||audit.get(`${id}|still`)?.status!=='verified');
          const portrait_open=ids.filter(id=>!byId.get(id)?.portrait?.src||audit.get(`${id}|portrait`)?.status!=='verified');
          const entry=plan.sequence.find(row=>row.id==='ferengi');const active=plan.sequence.filter(row=>row.state==='active'||row.state==='candidate-gold').map(row=>row.id);
          const archive=fs.readFileSync('data/archive.json');
          console.log(JSON.stringify({version:1,observed_at:new Date().toISOString(),branch_sha:process.env.GITHUB_SHA,pr:{state:pr.state,draft:pr.draft,merged:pr.merged,merge_commit_sha:pr.merge_commit_sha,head_sha:pr.head?.sha},main_sha:main.sha,ferengi:{state:entry.state,receipt:entry.receipt||null,primary_cards:ids.length,still_open,portrait_open,eligible_unfiled:Math.max(0,Number(taxon.counts.unfiled_named_credits||0)-Number(entry.reviewed_category_exclusions||0))},active_species:active,final_portrait_receipt_exists:exists('data/review/ferengi-gold/final-portraits-applied-2026-07-25.json'),archive_sha256:crypto.createHash('sha256').update(archive).digest('hex')},null,2));
          NODE
          curl -fsSL --retry 2 "https://bigbirdreturns.github.io/undercast/data/archive.json?v=$(date +%s)" -o "$root/live-archive.json" || true
          if [ -s "$root/live-archive.json" ]; then sha256sum "$root/live-archive.json" > "$root/live-archive.sha256"; fi
      - name: Upload terminal status receipt
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-status-beacon
          path: ${{ runner.temp }}/ferengi-status-beacon
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Remove the beacon from the branch
        run: |
          set -euo pipefail
          git config user.name 'undercast-status'
          git config user.email 'undercast-status@users.noreply.github.com'
          rm -f .github/workflows/ferengi-status-beacon.yml
          git add -A
          git commit -m 'Ferengi gold: remove terminal status beacon'
          git push origin HEAD:agent/star-trek-ferengi-gold
