name: card-backfill-local-desk-recovery-v2

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-local-desk-recovery-v2.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-local-desk-recovery-v2-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  recover-install-and-yield:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime

      - name: Recover the retained wave, install the local desk, and yield explicitly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/card-backfill-local-desk-recover.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-local-desk-recovery-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-planning
            ${{ runner.temp }}/recovered-results
            ${{ runner.temp }}/lessons-local-desk-validation.json
            ${{ runner.temp }}/local-desk-recovery-reduce.log
          if-no-files-found: warn
          retention-days: 90
