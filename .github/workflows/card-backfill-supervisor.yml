name: card-backfill-supervisor

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Typed reason the previous transaction yielded control'
        required: false
        default: 'explicit-dispatch'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-supervisor-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  route:
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      YIELD_REASON: ${{ inputs.reason || 'explicit-dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove and compute the one permitted successor
        id: route
        run: |
          set -euo pipefail
          node scripts/card-backfill-route-next-fixtures.mjs
          node scripts/card-backfill-route-next.mjs \
            --out "$RUNNER_TEMP/card-backfill-next-action.json" \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/card-backfill-next-action.json"

      - name: Dispatch retained-decision reduction once
        if: steps.route.outputs.action == 'stage'
        run: |
          set -euo pipefail
          active=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow card-backfill-stage.yml \
            --branch "$HEAD_BRANCH" \
            --limit 50 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')
          if [ "$active" -gt 0 ]; then
            echo "PASS — staging already active ($active); duplicate dispatch refused"
            exit 0
          fi
          gh workflow run card-backfill-stage.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH"
          echo 'PASS — supervisor dispatched retained-decision staging'

      - name: Dispatch permanent publication once
        if: steps.route.outputs.action == 'publish'
        run: |
          set -euo pipefail
          active=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow card-backfill-publication.yml \
            --branch "$HEAD_BRANCH" \
            --limit 50 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')
          if [ "$active" -gt 0 ]; then
            echo "PASS — publication already active ($active); duplicate dispatch refused"
            exit 0
          fi
          gh workflow run card-backfill-publication.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH"
          echo 'PASS — supervisor dispatched permanent publication'

      - name: Dispatch the next cache-aware discovery wave once
        if: steps.route.outputs.action == 'discover'
        run: |
          set -euo pipefail
          current_head=$(git rev-parse HEAD)
          active_json=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow card-backfill-amortized-wave.yml \
            --branch "$HEAD_BRANCH" \
            --limit 50 \
            --json databaseId,status,url,workflowName,createdAt,headSha \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")]')
          current=$(node -e 'const rows=JSON.parse(process.argv[1]);const head=process.argv[2];process.stdout.write(String(rows.filter(row=>row.headSha===head).length))' "$active_json" "$current_head")
          stale_json=$(node -e 'const rows=JSON.parse(process.argv[1]);const head=process.argv[2];process.stdout.write(JSON.stringify(rows.filter(row=>row.headSha!==head)))' "$active_json" "$current_head")
          stale=$(node -e 'const rows=JSON.parse(process.argv[1]);process.stdout.write(String(rows.length))' "$stale_json")
          if [ "$stale" -gt 0 ]; then
            echo "STALE_AMORTIZED_RUNS — $stale_json"
            node -e 'for(const row of JSON.parse(process.argv[1]))console.log(row.databaseId)' "$stale_json" | while read -r run_id; do
              if ! gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
                if [ "$status" != completed ]; then
                  echo "failed to cancel stale amortized run $run_id (status=$status)" >&2
                  exit 1
                fi
                echo "PASS — stale amortized run $run_id completed before cancellation"
              else
                echo "PASS — cancelled stale amortized run $run_id"
              fi
            done
          fi
          if [ "$current" -gt 0 ]; then
            echo "CURRENT_HEAD_AMORTIZED_RUNS — $active_json"
            echo "PASS — current-head amortized discovery already active ($current); duplicate dispatch refused"
            exit 0
          fi
          gh workflow run card-backfill-amortized-wave.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f cohort_limit=40 \
            -f wave_batches=4 \
            -f workers_per_batch=4 \
            -f model=repository-local
          echo 'PASS — supervisor dispatched the next 4x40 amortized local-desk wave'

      - name: Record the unattended target stop
        if: steps.route.outputs.action == 'stop'
        run: |
          set -euo pipefail
          echo "PASS — unattended target reached at ${{ steps.route.outputs.completed }}/${{ steps.route.outputs.target }} permanent packets"

      - name: Publish observable supervisor custody
        if: always()
        run: |
          set -euo pipefail
          state=success
          if [ "${{ job.status }}" != success ]; then state=failure; fi
          description="action=${{ steps.route.outputs.action || 'failed' }}; completed=${{ steps.route.outputs.completed || '?' }}/${{ steps.route.outputs.target || '?' }}; yield=${YIELD_REASON}"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='card-backfill/supervisor' \
            -f description="${description:0:140}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'
