name: ferengi-gold-exact-portrait-orbit-003

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-EXACT-PORTRAIT-ORBIT-003.json"
      - ".github/workflows/ferengi-gold-exact-portrait-orbit-003.yml"
      - "scripts/ferengi-gold-exact-portrait-orbit-003.mjs"

permissions:
  contents: write

concurrency:
  group: ferengi-gold-exact-portrait-orbit-003-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate active Ferengi lock and exact residual target set
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-exact-portrait-orbit-003"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock.log"
          node --input-type=module - <<'NODE' | tee "$root/authorization.log"
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-EXACT-PORTRAIT-ORBIT-003.json','utf8'));
          if(row.scope!=='star-trek'||row.species!=='ferengi'||row.reviewed_role!=='second-desk')throw new Error('exact portrait orbit scope or authority drift');
          if(row.expected_cards!==10)throw new Error(`exact portrait orbit expected_cards drift: ${row.expected_cards}`);
          const cards=(row.actors||[]).flatMap(actor=>actor.cards||[]);
          if(cards.length!==10||new Set(cards).size!==10)throw new Error('exact portrait orbit must cover ten unique residual cards');
          if((row.actors||[]).length!==8)throw new Error('exact portrait orbit must cover eight residual performers');
          console.log(`PASS — exact portrait orbit covers ${row.actors.length} performers / ${cards.length} cards`);
          NODE
      - name: Gather exact identity, profile API and source-search candidates
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/ferengi-gold-exact-portrait-orbit-003/candidates
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-exact-portrait-orbit-003"
          node scripts/ferengi-gold-exact-portrait-orbit-003.mjs --out "$OUT" 2>&1 | tee "$root/gather.log"
      - name: Remove the completed one-shot search operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-media-search'
          git config user.email 'undercast-media-search@users.noreply.github.com'
          rm -f .github/FERENGI-GOLD-EXACT-PORTRAIT-ORBIT-003.json .github/workflows/ferengi-gold-exact-portrait-orbit-003.yml scripts/ferengi-gold-exact-portrait-orbit-003.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Ferengi gold: retain exact residual portrait orbit receipt boundary'
      - name: Install Chromium for permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-exact-portrait-orbit-003"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain exact candidate bytes, source pairs and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-exact-portrait-orbit-003-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-exact-portrait-orbit-003
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
