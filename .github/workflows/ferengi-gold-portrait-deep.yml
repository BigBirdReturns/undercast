name: ferengi-gold-portrait-deep

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-PORTRAIT-DEEP-001.json"
      - ".github/workflows/ferengi-gold-portrait-deep.yml"
      - "scripts/ferengi-gold-portrait-deep.mjs"
      - "data/STAR-TREK-GOLD.json"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-portrait-deep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the exact residual portrait target partition
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-portrait-deep"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock.log"
          node --check scripts/ferengi-gold-portrait-deep.mjs
          node --input-type=module - <<'NODE' | tee "$root/control.log"
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-PORTRAIT-DEEP-001.json','utf8'));
          if(row.scope!=='star-trek'||row.species!=='ferengi'||row.operation!=='candidate-only-deep-portrait-orbit')throw new Error('deep portrait control scope drift');
          if(!Array.isArray(row.actors)||row.actors.length!==10)throw new Error(`expected 10 residual performers, found ${row.actors?.length}`);
          const cards=row.actors.flatMap(actor=>actor.cards||[]);
          if(cards.length!==row.expected_cards||new Set(cards).size!==cards.length)throw new Error('deep portrait card partition is incomplete or duplicated');
          console.log(`PASS — ${row.actors.length} exact performers / ${cards.length} residual portrait cards`);
          NODE
      - name: Gather exact-ID image galleries and named-page candidates
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/ferengi-gold-portrait-deep
        run: |
          set -euo pipefail
          node scripts/ferengi-gold-portrait-deep.mjs --out "$OUT" 2>&1 | tee "$OUT/gather.log"
      - name: Upload exact candidate images, hashes, provider receipts and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-portrait-deep-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-portrait-deep
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
