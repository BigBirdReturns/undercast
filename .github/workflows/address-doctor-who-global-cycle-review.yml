name: address-doctor-who-global-cycle-review

on:
  push:
    branches:
      - agent/doctor-who-global-cycle-receipt
    paths:
      - ".github/workflows/address-doctor-who-global-cycle-review.yml"

permissions:
  contents: write

concurrency:
  group: address-doctor-who-global-cycle-review
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/doctor-who-global-cycle-receipt
  AUTHORIZED_HEAD: ${{ github.sha }}
  EXACT_MAIN: 79362e21d9d526f1310467574e69fe909eb80adb
  SELF: .github/workflows/address-doctor-who-global-cycle-review.yml
  PATCHER: scripts/apply-doctor-who-global-cycle-review-provenance.py
  GH_TOKEN: ${{ github.token }}

jobs:
  address:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch and main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Apply review-bound executable provenance repair
        run: |
          set -euo pipefail
          CURRENT_MAIN="$EXACT_MAIN" python "$PATCHER"
          node --check scripts/doctor-who-activation.mjs
          node scripts/doctor-who-activation.mjs check
          node scripts/waterline-fixtures.mjs

          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/review/adapter-sdk/doctor-who-activation-001.json').read_text())
          summary = {
              'receipt_sha256': report['receipt_sha256'],
              'global_cycle_custody': report['global_cycle_custody'],
          }
          Path('/tmp/doctor-who-global-cycle-review.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Gate the exact workflow-free product
        run: |
          set -euo pipefail
          git rm "$SELF" "$PATCHER"
          git add \
            data/review/adapter-sdk/doctor-who-activation-001.json \
            scripts/doctor-who-activation.mjs
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/doctor-who-global-cycle-review-gate.log

          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check
          git write-tree > /tmp/gated-tree.txt

      - name: Publish the exact gated tree under branch lease
        run: |
          set -euo pipefail
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Activation: bind global-cycle custody to executable proof' \
            -m 'recompute active, terminal-unreceipted, and reviewed-release transitions' \
            -m 'bind the retained receipt to exact proof code and the review transaction'
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/gated-tree.txt)"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/review/adapter-sdk/doctor-who-activation-001.json
          docs/AUTOPILOT.md
          scripts/doctor-who-activation.mjs
          scripts/lib/waterline.mjs
          scripts/waterline-fixtures.mjs
          PATHS
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          node scripts/doctor-who-activation.mjs check
          node scripts/waterline-fixtures.mjs
          test -z "$(git status --porcelain)"

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"
          echo "gated_tree=$(cat /tmp/gated-tree.txt)" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/doctor-who-global-cycle-review.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact review-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-global-cycle-review-${{ github.run_id }}
          path: |
            /tmp/doctor-who-global-cycle-review.json
            /tmp/doctor-who-global-cycle-review-gate.log
            /tmp/gated-tree.txt
            /tmp/final-paths.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
