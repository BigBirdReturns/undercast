name: doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census.yml"
      - ".github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census.yml
  PAYLOAD: .github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64
  PAYLOAD_COMMIT: 6a934012e557823526d00e1db7291c829509f37d
  PAYLOAD_BLOB: f4419b90892db8599d6167700c75d45811134353
  PAYLOAD_TEXT_SHA256: b6f4a43937f2d4dde2a0e6b2615a27b07e198196c2536674ee05b5466b8085a0
  PAYLOAD_GZIP_SHA256: b13f60d33e14a815f9f2726eb36ed0f4f84e5845afc5a57722ab3b2a3f7e307c
  PAYLOAD_SCRIPT_SHA256: 3bf24df1df2ee04bb7542a69fe0cab3c61f5dec4b443107b92f0e6e825a0e890
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census

  V9_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v9-structural-census
  V9_HEAD: 65eecbf0500423d1995ce9cc8822b296b7a69372
  V9_PATH: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v9-structural-census.yml
  V9_BLOB: ae5cd1d71e3e69cdc0f8dbb7949c4247121496ed
  V9_RUN: "31108822494"
  V9_JOB: "92640923136"
  V9_ARTIFACT_ID: "8970757653"
  V9_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v9-structural-census-31108822494
  V9_ARTIFACT_SHA256: 7ea71e02a010e16c159e2eb73424332e667d1318eec0aea52e45be2093cb049c

