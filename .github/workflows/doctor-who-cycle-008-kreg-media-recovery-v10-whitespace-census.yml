  V4_HEAD: af1211dc0cb48a6d0b98662196ceebb0807ae344
  V4_ARTIFACT_ID: "8964088254"
  V4_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v4-census-31092600523
  V4_ARTIFACT_SHA256: 6d22dba6a0f6e48f9255d0c5bc09fdf53b1e9a797512c7551f7f2c1963f0475f

  V5_RUN: "31106715390"
  V5_JOB: "92633661067"
  V5_HEAD: 3079bff64c73bb65c7f22f51ae5a21e785ebf87b
  V5_ARTIFACT_ID: "8969880228"
  V5_ARTIFACT_NAME: doctor-who-cycle-008-kreg-media-recovery-v5-census-31106715390
  V5_ARTIFACT_SHA256: 57d3ed4c7d7370bbff47e3981c208cf5491f145163386844d93b33c012b05084

  TASK_ID: ap_469d79ea29fd7f877395d20f
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_PARENT_REVISION: "3189022"
  SOURCE_TIMESTAMP: 2026-07-28T09:20:48Z

  FILE_TITLE: File:Kree.jpg
  FILE_PAGE_ID: "387498"
  FILE_TIMESTAMP: 2026-07-28T09:19:09Z
  UPLOAD_BYTES: "67431"
  UPLOAD_WIDTH: "1053"
  UPLOAD_HEIGHT: "805"
  UPLOAD_SHA1: 319cfa66634da164e2efd998cb85702fb609a83e
  PUBLIC_JPEG_BYTES: "67113"
  PUBLIC_JPEG_SHA1: 650069b8a22e7794b00ae6a2d8d32952e6a72ff2
  PUBLIC_JPEG_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  DEFAULT_WEBP_BYTES: "32034"
  DEFAULT_WEBP_SHA1: 686cc98189739cf6770b4e1cca62ba73783872bc
  DEFAULT_WEBP_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  GH_TOKEN: ${{ github.token }}

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 4
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census.yml
            .github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64
            data
            images
            scripts

      - name: Bind V9 packet and decode only after ASCII-whitespace normalization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$OUT/v9-packet" /tmp/kreg-v10-census
          shallow_file="$(git rev-parse --git-path shallow)"
          {
            echo "head=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "expected_head=$HEAD_SHA"
            echo "rev_count=$(git rev-list --count "$EXACT_MAIN"..HEAD 2>/dev/null || true)"
            echo "merge_base=$(git merge-base "$EXACT_MAIN" HEAD 2>/dev/null || true)"
            echo "head_parent=$(git rev-parse HEAD^ 2>/dev/null || true)"
            echo "payload_parent=$(git show -s --format=%P "$PAYLOAD_COMMIT" 2>/dev/null || true)"
            echo "payload_blob=$(git rev-parse "$PAYLOAD_COMMIT:$PAYLOAD" 2>/dev/null || true)"
            echo "payload_text_sha256=$(sha256sum "$PAYLOAD" 2>/dev/null | awk '{print $1}' || true)"
            echo "shallow_file=$shallow_file"
            if test -f "$shallow_file"; then sed 's/^/shallow_commit=/' "$shallow_file"; fi
          } > "$OUT/prebind-diagnostics.txt"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "2"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$(git rev-parse HEAD^)" = "$PAYLOAD_COMMIT"
          test "$(git show -s --format=%P "$PAYLOAD_COMMIT")" = "$EXACT_MAIN"
          test "$(git rev-parse "$PAYLOAD_COMMIT:$PAYLOAD")" = "$PAYLOAD_BLOB"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_TEXT_SHA256"
          if test -f "$shallow_file"; then ! grep -Fx "$EXACT_MAIN" "$shallow_file" >/dev/null; fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB}" > "$OUT/payload-blob.json"
          jq -e --arg blob "$PAYLOAD_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/payload-blob.json" >/dev/null
          jq -r '.content' "$OUT/payload-blob.json" | tr -d '\n' | base64 -d > "$OUT/payload-from-blob.b64"
          test "$(git hash-object "$OUT/payload-from-blob.b64")" = "$PAYLOAD_BLOB"
          test "$(sha256sum "$OUT/payload-from-blob.b64" | awk '{print $1}')" = "$PAYLOAD_TEXT_SHA256"
          cmp "$PAYLOAD" "$OUT/payload-from-blob.b64"

          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${V9_BLOB}" > "$OUT/v9-wrapper-blob.json"
          jq -e --arg blob "$V9_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/v9-wrapper-blob.json" >/dev/null
          jq -r '.content' "$OUT/v9-wrapper-blob.json" | tr -d '\n' | base64 -d > "$OUT/v9-wrapper.yml"
          test "$(git hash-object "$OUT/v9-wrapper.yml")" = "$V9_BLOB"
          grep -F "PAYLOAD_B64_SHA256: $PAYLOAD_TEXT_SHA256" "$OUT/v9-wrapper.yml" >/dev/null
          grep -F 'base64 -d "$PAYLOAD"' "$OUT/v9-wrapper.yml" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V9_RUN}" > "$OUT/v9-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V9_RUN}/jobs?per_page=100" > "$OUT/v9-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V9_ARTIFACT_ID}" > "$OUT/v9-artifact.json"
          jq -e --argjson run "$V9_RUN" --arg head "$V9_HEAD" --arg branch "$V9_BRANCH" '
            .id==$run and .head_sha==$head and .head_branch==$branch and
            .status=="completed" and .conclusion=="failure" and .event=="pull_request"
          ' "$OUT/v9-run.json" >/dev/null
          jq -e --argjson job "$V9_JOB" '
            any(.jobs[];
              .id==$job and .name=="census" and .status=="completed" and .conclusion=="failure" and
              any(.steps[]; .name=="Bind corrected transport hash and paid V6 V7 V8 failures" and .conclusion=="failure") and
              any(.steps[]; .name=="Execute unchanged checksum-bound structural census program" and .conclusion=="skipped") and
              any(.steps[]; .name=="Upload exact Kreg V9 bounded route-census packet" and .conclusion=="success")
            )
          ' "$OUT/v9-jobs.json" >/dev/null
          jq -e --argjson id "$V9_ARTIFACT_ID" --arg name "$V9_ARTIFACT_NAME" --arg digest "sha256:${V9_ARTIFACT_SHA256}" --argjson run "$V9_RUN" --arg head "$V9_HEAD" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and
            .workflow_run.id==$run and .workflow_run.head_sha==$head
          ' "$OUT/v9-artifact.json" >/dev/null
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$OUT/v9-artifact.zip" \
            "$(jq -r '.archive_download_url' "$OUT/v9-artifact.json")"
          test "$(sha256sum "$OUT/v9-artifact.zip" | awk '{print $1}')" = "$V9_ARTIFACT_SHA256"
          python - <<'PY'
          import os, pathlib, zipfile
          out = pathlib.Path(os.environ['OUT'])
          expected = sorted([
              'prebind-diagnostics.txt',
              'v6-artifacts.json','v6-blob.json','v6-jobs.json','v6-path.txt','v6-run.json','v6-wrapper.yml',
              'v7-artifacts.json','v7-blob.json','v7-jobs.json','v7-path.txt','v7-run.json','v7-wrapper.yml',
              'v8-artifact.json','v8-artifact.zip','v8-blob.json','v8-diagnostic/prebind-diagnostics.txt',
              'v8-jobs.json','v8-path.txt','v8-run.json','v8-wrapper.yml'
          ])
          target = out / 'v9-packet'
          with zipfile.ZipFile(out / 'v9-artifact.zip') as zf:
              names = zf.namelist()
              if sorted(names) != expected or len(names) != len(set(names)):
                  raise SystemExit(f'V9 packet members drifted: {names!r}')
              for name in names:
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe V9 packet member: {name}')
              zf.extractall(target)
          PY
          grep -Fx 'rev_count=2' "$OUT/v9-packet/prebind-diagnostics.txt"
          grep -Fx "merge_base=$EXACT_MAIN" "$OUT/v9-packet/prebind-diagnostics.txt"
          grep -Fx "payload_blob=$PAYLOAD_BLOB" "$OUT/v9-packet/prebind-diagnostics.txt"
          grep -Fx "payload_sha256=$PAYLOAD_TEXT_SHA256" "$OUT/v9-packet/prebind-diagnostics.txt"
          ! test -e "$OUT/v9-packet/route-census-summary.json"
          ! test -e "$OUT/v9-packet/kreg-public-original.jpg"

          PAYLOAD_PATH="$PAYLOAD" NORMALIZED_PATH="/tmp/kreg-v10-census/payload.compact.b64" GZIP_PATH="/tmp/kreg-v10-census/census.sh.gz" DIAGNOSTIC_PATH="$OUT/payload-byte-diagnostics.json" python - <<'PY'
          import base64, hashlib, json, os, pathlib
          payload = pathlib.Path(os.environ['PAYLOAD_PATH']).read_bytes()
          alphabet = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          whitespace = {9, 10, 11, 12, 13, 32}
          bad = [{'offset': i, 'byte': b, 'hex': f'{b:02x}'} for i, b in enumerate(payload) if b not in alphabet and b not in whitespace]
          counts = {name: payload.count(bytes([value])) for name, value in {
              'tab': 9, 'line_feed': 10, 'vertical_tab': 11,
              'form_feed': 12, 'carriage_return': 13, 'space': 32
          }.items()}
          compact = bytes(b for b in payload if b not in whitespace)
          report = {
              'payload_bytes': len(payload),
              'payload_sha256': hashlib.sha256(payload).hexdigest(),
              'ascii_whitespace_counts': counts,
              'non_alphabet_non_whitespace_count': len(bad),
              'non_alphabet_non_whitespace': bad[:100],
              'compact_bytes': len(compact),
              'compact_sha256': hashlib.sha256(compact).hexdigest(),
              'compact_length_mod_4': len(compact) % 4,
              'normalization': 'remove ASCII HT LF VT FF CR SP only',
              'arbitrary_garbage_ignored': False
          }
          try:
              decoded = base64.b64decode(compact, validate=True) if not bad else b''
              report['strict_base64_valid'] = not bad
              report['decoded_bytes'] = len(decoded)
              report['decoded_sha256'] = hashlib.sha256(decoded).hexdigest() if decoded else None
          except Exception as exc:
              report['strict_base64_valid'] = False
              report['decode_error'] = str(exc)
              decoded = b''
          pathlib.Path(os.environ['DIAGNOSTIC_PATH']).write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          if bad or not report['strict_base64_valid']:
              raise SystemExit('payload contains non-whitespace garbage or is not strict base64 after ASCII-whitespace normalization')
          pathlib.Path(os.environ['NORMALIZED_PATH']).write_bytes(compact + b'\n')
          pathlib.Path(os.environ['GZIP_PATH']).write_bytes(decoded)
          PY
          jq -e '.non_alphabet_non_whitespace_count==0 and .strict_base64_valid==true and .arbitrary_garbage_ignored==false' "$OUT/payload-byte-diagnostics.json" >/dev/null
          test "$(sha256sum /tmp/kreg-v10-census/census.sh.gz | awk '{print $1}')" = "$PAYLOAD_GZIP_SHA256"
          gzip -dc /tmp/kreg-v10-census/census.sh.gz > /tmp/kreg-v10-census/census.sh
          test "$(sha256sum /tmp/kreg-v10-census/census.sh | awk '{print $1}')" = "$PAYLOAD_SCRIPT_SHA256"
          chmod 0555 /tmp/kreg-v10-census/census.sh

      - name: Execute unchanged checksum-bound structural census program
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/kreg-v10-census/census.sh

      - name: Seal self-hashed V10 envelope over exact V6 program receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/recovery-receipt.json"
          test -f "$OUT/route-census-summary.json"
          test -f "$OUT/kreg-media-recovery-metadata.json"
          test -f "$OUT/boundary.json"
          test -f "$OUT/kreg-public-original.jpg"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const pretty = (value) => `${JSON.stringify(stable(value), null, 2)}\n`;
          const bytes = (name) => fs.readFileSync(`${out}/${name}`);
          const child = JSON.parse(bytes('recovery-receipt.json'));
          const summary = JSON.parse(bytes('route-census-summary.json'));
          const boundary = JSON.parse(bytes('boundary.json'));
          const byteDiagnostic = JSON.parse(bytes('payload-byte-diagnostics.json'));
          if (child.transaction !== 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V6-CENSUS') throw new Error('child program transaction drifted');
          if (child.exact_main !== process.env.EXACT_MAIN || child.carrier_head !== process.env.HEAD_SHA) throw new Error('child carrier binding drifted');
          if (child.run_id !== Number(process.env.GITHUB_RUN_ID) || child.task_id !== process.env.TASK_ID) throw new Error('child run or task drifted');
          if (summary.route_count !== 18 || summary.attempt_count !== 54) throw new Error('route matrix denominator drifted');
          if (!boundary.public_original_representation_recovered || boundary.visual_review_completed) throw new Error('review boundary drifted');
          if (sha(bytes('kreg-public-original.jpg')) !== process.env.PUBLIC_JPEG_SHA256) throw new Error('public original bytes drifted');
          if (byteDiagnostic.non_alphabet_non_whitespace_count !== 0 || byteDiagnostic.strict_base64_valid !== true || byteDiagnostic.arbitrary_garbage_ignored !== false) throw new Error('payload normalization boundary drifted');
          const envelope = {
            schema_version: 1,
            transaction: 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V10-CENSUS',
            verdict: summary.verdict,
            exact_main: process.env.EXACT_MAIN,
            carrier_head: process.env.HEAD_SHA,
            payload_commit: process.env.PAYLOAD_COMMIT,
            payload_blob: process.env.PAYLOAD_BLOB,
            payload_text_sha256: process.env.PAYLOAD_TEXT_SHA256,
            payload_gzip_sha256: process.env.PAYLOAD_GZIP_SHA256,
            payload_script_sha256: process.env.PAYLOAD_SCRIPT_SHA256,
            payload_normalization: {
              rule: byteDiagnostic.normalization,
              whitespace_counts: byteDiagnostic.ascii_whitespace_counts,
              compact_sha256: byteDiagnostic.compact_sha256,
              arbitrary_garbage_ignored: false
            },
            run_id: Number(process.env.GITHUB_RUN_ID),
            job_id: child.job_id,
            task_id: process.env.TASK_ID,
            route_count: summary.route_count,
            header_profiles: 3,
            attempt_count: summary.attempt_count,
            successful_attempts: summary.successful_attempts,
            exact_upload_identity_recovered: summary.exact_upload_identity_recovered,
            public_original_sha256: process.env.PUBLIC_JPEG_SHA256,
            replayed_program: {
              transaction: child.transaction,
              receipt_file_sha256: sha(bytes('recovery-receipt.json')),
              route_summary_sha256: sha(bytes('route-census-summary.json')),
              metadata_sha256: sha(bytes('kreg-media-recovery-metadata.json')),
              boundary_sha256: sha(bytes('boundary.json'))
            },
            paid_v9: {
              run_id: Number(process.env.V9_RUN),
              job_id: Number(process.env.V9_JOB),
              head: process.env.V9_HEAD,
              workflow_blob: process.env.V9_BLOB,
              artifact_id: Number(process.env.V9_ARTIFACT_ID),
              artifact_sha256: process.env.V9_ARTIFACT_SHA256,
              reason: 'direct GNU base64 decode rejected an otherwise exact immutable payload text before the structural program ran'
            },
            checks: {
              exact_two_commit_carrier: true,
              checkout_matches_immutable_payload_blob: true,
              only_ascii_whitespace_normalized: true,
              strict_base64_validation_passed: true,
              gzip_and_script_digests_unchanged: true,
              V9_packet_replayed: true,
              bounded_route_header_matrix_completed: true,
              public_original_representation_converged: true,
              default_webp_derivative_reproduced: true,
              duplicate_adoption_refused: true,
              live_main_rebound: true
            },
            boundary: {
              repository_written: false,
              visual_adjudication_completed: false,
              lease_issued: false,
              queue_mutated: false,
              canonical_record_created: false,
              media_adopted: false,
              waterline_event_written: false,
              cycle_receipt_written: false,
              product_published: false,
              outside_human_dependency: false
            }
          };
          const body = pretty(envelope);
          envelope.receipt_sha256 = sha(Buffer.from(body));
          const finalBytes = Buffer.from(pretty(envelope));
          fs.writeFileSync(`${out}/v10-recovery-receipt.json`, finalBytes);
          fs.writeFileSync(`${out}/v10-recovery-receipt.file.sha256`, `${sha(finalBytes)}  v10-recovery-receipt.json\n`);
          const verify = JSON.parse(finalBytes);
          const expected = verify.receipt_sha256;
          delete verify.receipt_sha256;
          if (sha(Buffer.from(pretty(verify))) !== expected) throw new Error('V10 receipt self-hash drifted');
          NODE
          test -z "$(git status --porcelain)"

      - name: Upload exact Kreg V10 bounded route-census packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-v10-whitespace-census-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
