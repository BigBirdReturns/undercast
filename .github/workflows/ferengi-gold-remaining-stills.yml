name: ferengi-gold-remaining-stills

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-REMAINING-STILLS.json"
      - ".github/workflows/ferengi-gold-remaining-stills.yml"
      - "scripts/ferengi-gold-remaining-stills.mjs"
      - "data/STAR-TREK-GOLD.json"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-remaining-stills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the single active Ferengi species lock
        run: node scripts/star-trek-species-gold.mjs validate
      - name: Download exact original candidates for all four remaining still obligations
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/ferengi-gold-remaining-stills
        run: node scripts/ferengi-gold-remaining-stills.mjs
      - name: Upload exact bytes, hashes, provenance and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-remaining-stills-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-gold-remaining-stills
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
