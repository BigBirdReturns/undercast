name: doctor-who-cycle-009-megnus-jaka-final-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-review-v2
  cancel-in-progress: true

env:
  EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  BRANCH: agent/doctor-who-cycle-009-megnus-jaka-final-review-v2
  SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v2.yml
  OUT: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2
  SOURCE_PR: "686"
  SOURCE_HEAD: 38ab599a0744283a4794a6cfdd388e0bda7a44ac
  SOURCE_RUN: "31308519800"
  SOURCE_JOB: "93245591364"
  SOURCE_ARTIFACT: "9045255853"
  SOURCE_ARTIFACT_NAME: doctor-who-cycle-009-megnus-jaka-final-product-v5-31308519800-attempt-1
  SOURCE_DIGEST: sha256:bf01408ee6d4904ba0f721303293bd7a659115c2df4bd5e8fb9e5788edb97b5e
  SOURCE_RECEIPT_ID: 8d8561a4a3f5e7931b53bb8bb0c5a043122d09086007ab48c479f424937e4b24
  CANDIDATE_COMMIT: 35f507417bb4b2efade613b3b643080363a0350f
  CANDIDATE_TREE: e59fc81b63c6e512a858d7b3353a58d4e5945796
  FINAL_COMMIT: ad4a3e3c84bcfc3a9212a2612269486dfa950907
  FINAL_TREE: 2906464d3de99880a68bf97b912e64aad8c4e594
  FINAL_BUNDLE_SHA256: e4e58c2604bdac9585e851ce137c6bc1ffb250fba4dc94489b10ae805e7e1823
  FINAL_ARCHIVE_SHA256: 115511b4ece1cedae6f0d442d19b64ac9fb3fdca005797da05d0e4364181f1c5
  FINAL_PATCH_SHA256: b159c9dfe467a6bd2c3293c3f0898495e60e113a4276ed8a9a5d6997ddfcd63c
  FINAL_PATHS_SHA256: 4f334e418c57492ac79aa3b291ef36c00262709a38d216e2451fcdecd9854ba2
  FINAL_FILES_SHA256: 3029370d32b9cae4033e36d683bce80ed156ed238d8d9ab9b77e3521fb083ad1
  FINAL_GATE_SHA256: 158666a9e53a71ba1d953a29025f025b74710cc772b672835d6aa973ebde26b4
  TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
  LEASE_ID: lease_4ca825307ad0d4510f44c7d9
  WALL_ID: UC-1354
  PORTRAIT_PATH: images/uc-1354-portrait.jpg
  PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
  CYCLE_ID: cycle_42b1d086ae8eab34f09827dc

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-review-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact V5 run and independently verify artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,review,work}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > "$OUT/api/source-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          jq -e --argjson n "$SOURCE_PR" --arg head "$SOURCE_HEAD" --arg base "$EXACT_MAIN" '.number==$n and .state=="open" and .draft==true and .merged==false and .head.sha==$head and .base.sha==$base and .commits==1 and .changed_files==1' "$OUT/api/source-pr.json" >/dev/null
          jq -e --argjson id "$SOURCE_RUN" --arg head "$SOURCE_HEAD" '.id==$id and .head_sha==$head and .event=="pull_request" and .status=="completed" and .conclusion=="success"' "$OUT/api/source-run.json" >/dev/null
          jq -e --argjson id "$SOURCE_JOB" --argjson run "$SOURCE_RUN" '.id==$id and .run_id==$run and .name=="materialize" and .status=="completed" and .conclusion=="success"' "$OUT/api/source-job.json" >/dev/null
          jq -e --argjson id "$SOURCE_ARTIFACT" --arg name "$SOURCE_ARTIFACT_NAME" --arg digest "$SOURCE_DIGEST" --argjson run "$SOURCE_RUN" '.id==$id and .name==$name and .expired==false and .digest==$digest and .workflow_run.id==$run' "$OUT/api/source-artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/final-product.zip"
          test "$(sha256sum "$OUT/source/final-product.zip" | awk '{print $1}')" = "${SOURCE_DIGEST#sha256:}"

          ZIP="$OUT/source/final-product.zip" TARGET="$OUT/source/final-product" python3 - <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import zipfile
          z=Path(os.environ['ZIP']); target=Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as archive:
              infos=archive.infolist(); names=[row.filename for row in infos]
              assert len(names)==len(set(names))
              for row in infos:
                  p=PurePosixPath(row.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  if row.is_dir(): continue
                  data=archive.read(row)
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY

          ROOT="$OUT/source/final-product" python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          required=['final-product-receipt.json','finalization-facts.json','final-product-paths.txt','final-product-files.json','final-product.bundle','final-product.patch','final-product.tar.gz','final-product-gate.log','SHA256SUMS.pre','SHA256SUMS']
          assert all((root/p).is_file() for p in required)
          sha=lambda data: hashlib.sha256(data).hexdigest()
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest, original=line.split(None,1)
              p=root/Path(original.strip()).name
              assert p.is_file() and sha(p.read_bytes())==digest
          assert sha((root/'SHA256SUMS.pre').read_bytes())==(root/'SHA256SUMS').read_text().split()[0]
          assert sha((root/'final-product.bundle').read_bytes())==os.environ['FINAL_BUNDLE_SHA256']
          assert sha((root/'final-product.tar.gz').read_bytes())==os.environ['FINAL_ARCHIVE_SHA256']
          assert sha((root/'final-product.patch').read_bytes())==os.environ['FINAL_PATCH_SHA256']
          assert sha((root/'final-product-paths.txt').read_bytes())==os.environ['FINAL_PATHS_SHA256']
          assert sha((root/'final-product-files.json').read_bytes())==os.environ['FINAL_FILES_SHA256']
          assert sha((root/'final-product-gate.log').read_bytes())==os.environ['FINAL_GATE_SHA256']

          receipt=json.loads((root/'final-product-receipt.json').read_text()); identity=receipt.pop('identity')
          assert identity==os.environ['SOURCE_RECEIPT_ID']
          assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          assert receipt['transaction']=='DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-FINAL-PRODUCT-V1'
          assert receipt['status']=='qualified-final-product-prototype'
          assert receipt['canonical_parent']==os.environ['EXACT_MAIN']
          assert receipt['candidate_commit']==os.environ['CANDIDATE_COMMIT'] and receipt['candidate_tree']==os.environ['CANDIDATE_TREE']
          assert receipt['final_commit']==os.environ['FINAL_COMMIT'] and receipt['final_tree']==os.environ['FINAL_TREE']
          assert receipt['path_count']==48 and receipt['task']==os.environ['TASK_ID'] and receipt['lease']==os.environ['LEASE_ID'] and receipt['wall_id']==os.environ['WALL_ID']
          assert receipt['performer']=='Dan Starkey' and receipt['role']=='Megnus Jaka' and receipt['performance_mode']=='voice'
          assert receipt['portrait_path']==os.environ['PORTRAIT_PATH'] and receipt['portrait_sha256']==os.environ['PORTRAIT_SHA256'] and receipt['still_disposition']=='absent'
          assert receipt['cycle_id']==os.environ['CYCLE_ID'] and receipt['cycle_outcome']=='completed'
          assert receipt['queue_before']=={'queued':308,'resolved':8,'in_flight':0} and receipt['queue_after']=={'queued':307,'resolved':9,'in_flight':0}
          assert receipt['repository_write'] is False and receipt['product_publication'] is False and receipt['product_merge'] is False and receipt['cycle_010_authorized'] is False

          finalization=['data/ESTATE-REGISTRY.json','data/WATERLINE-STATE.json','data/journal/waterline.jsonl','data/review/adapter-sdk/BASELINE.json','data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json','docs/AUTOPILOT.md','package.json','scripts/doctor-who-cycle-009.mjs']
          assert receipt['finalization_paths']==finalization
          facts=json.loads((root/'finalization-facts.json').read_text())
          assert facts['candidate_commit']==os.environ['CANDIDATE_COMMIT'] and facts['candidate_tree']==os.environ['CANDIDATE_TREE']
          assert facts['cycle_id']==os.environ['CYCLE_ID'] and facts['finalization_paths']==finalization and facts['path_count']==8
          assert facts['task']==os.environ['TASK_ID'] and facts['lease']==os.environ['LEASE_ID'] and facts['wall_id']==os.environ['WALL_ID']
          assert facts['portrait_sha256']==os.environ['PORTRAIT_SHA256'] and facts['queue_after']=={'queued':307,'resolved':9,'in_flight':0} and facts['cycle_010_authorized'] is False

          paths=(root/'final-product-paths.txt').read_text().splitlines(); rows=json.loads((root/'final-product-files.json').read_text())
          assert len(paths)==48 and paths==sorted(paths) and len(paths)==len(set(paths))
          assert [row['path'] for row in rows]==paths
          assert all(not p.startswith('.github/workflows/') and not p.startswith('.tmp/') and not p.startswith('tmp/') and not p.startswith('records/') for p in paths)
          assert os.environ['PORTRAIT_PATH'] in paths and 'data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json' in paths and 'scripts/doctor-who-cycle-009.mjs' in paths
          with tarfile.open(root/'final-product.tar.gz','r:gz') as archive:
              members=[row for row in archive.getmembers() if row.isfile()]
              assert [row.name.lstrip('./') for row in members]==paths
              for member, expected in zip(members,rows):
                  data=archive.extractfile(member).read()
                  blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
                  assert sha(data)==expected['sha256'] and blob==expected['git_blob']
          (root/'final-product-receipt.verified.json').write_text(json.dumps({**receipt,'identity':identity},indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

      - name: Rehydrate exact final commit and rerun complete gate
        shell: bash
        run: |
          set -euo pipefail
          root="$OUT/source/final-product"
          git bundle verify "$root/final-product.bundle" > "$OUT/review/bundle-verify.txt"
          test "$(git bundle list-heads "$root/final-product.bundle" | awk '$2=="refs/heads/doctor-who-cycle-009-megnus-jaka-final"{print $1}')" = "$FINAL_COMMIT"
          git fetch "$root/final-product.bundle" "refs/heads/doctor-who-cycle-009-megnus-jaka-final:refs/verification/megnus-jaka-final"
          test "$(git rev-parse refs/verification/megnus-jaka-final)" = "$FINAL_COMMIT"
          test "$(git show -s --format=%P "$FINAL_COMMIT")" = "$EXACT_MAIN"
          test "$(git rev-parse "$FINAL_COMMIT^{tree}")" = "$FINAL_TREE"
          git diff --name-only "$EXACT_MAIN".."$FINAL_COMMIT" > "$OUT/review/final-paths.unsorted.txt"
          LC_ALL=C sort "$OUT/review/final-paths.unsorted.txt" > "$OUT/review/final-paths.txt"
          diff -u "$root/final-product-paths.txt" "$OUT/review/final-paths.txt"
          test -z "$(git diff --name-only "$EXACT_MAIN".."$FINAL_COMMIT" | grep -E '^(\.github/workflows/|\.tmp/|tmp/|records/)' || true)"
          test "$(git show "$FINAL_COMMIT:$PORTRAIT_PATH" | sha256sum | awk '{print $1}')" = "$PORTRAIT_SHA256"
          git diff --check "$EXACT_MAIN".."$FINAL_COMMIT"

          git worktree add --detach "$OUT/work/final" "$FINAL_COMMIT"
          cd "$OUT/work/final"
          test "$(git rev-parse HEAD)" = "$FINAL_COMMIT"
          test -z "$(git status --porcelain)"
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/review/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/review/cycle-009.log"
          npm run autopilot:validate | tee "$OUT/review/autopilot.log"
          npm run media:gate -- --scope doctor-who | tee "$OUT/review/media-gate.log"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/review/final-review-gate.log"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" --jq '.head.sha')" = "$SOURCE_HEAD"
          git worktree remove --force "$OUT/work/final"

      - name: Seal independent publication verdict
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); source=root/'source/final-product'; review=root/'review'
          receipt={
            'transaction':'DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-FINAL-REVIEW-V2',
            'status':'approved-for-trusted-publication',
            'review_run':int(os.environ['GITHUB_RUN_ID']),
            'review_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'review_head':os.environ['PR_HEAD'],
            'canonical_parent':os.environ['EXACT_MAIN'],
            'source_pr':int(os.environ['SOURCE_PR']),
            'source_head':os.environ['SOURCE_HEAD'],
            'source_run':int(os.environ['SOURCE_RUN']),
            'source_job':int(os.environ['SOURCE_JOB']),
            'source_artifact':int(os.environ['SOURCE_ARTIFACT']),
            'source_artifact_digest':os.environ['SOURCE_DIGEST'],
            'source_receipt_identity':os.environ['SOURCE_RECEIPT_ID'],
            'candidate_commit':os.environ['CANDIDATE_COMMIT'],
            'candidate_tree':os.environ['CANDIDATE_TREE'],
            'final_commit':os.environ['FINAL_COMMIT'],
            'final_tree':os.environ['FINAL_TREE'],
            'path_count':48,
            'task':os.environ['TASK_ID'],
            'lease':os.environ['LEASE_ID'],
            'wall_id':os.environ['WALL_ID'],
            'performer':'Dan Starkey',
            'role':'Megnus Jaka',
            'performance_mode':'voice',
            'portrait_path':os.environ['PORTRAIT_PATH'],
            'portrait_sha256':os.environ['PORTRAIT_SHA256'],
            'still_disposition':'absent',
            'cycle_id':os.environ['CYCLE_ID'],
            'queue_before':{'queued':308,'resolved':8,'in_flight':0},
            'queue_after':{'queued':307,'resolved':9,'in_flight':0},
            'review_gate_sha256':hashlib.sha256((review/'final-review-gate.log').read_bytes()).hexdigest(),
            'product_publication_authorized':True,
            'canonical_merge_authorized':False,
            'repository_write':False,
            'cycle_010_authorized':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          (review/'independent-final-review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          for name in ['final-product-receipt.json','finalization-facts.json','final-product-paths.txt','final-product-files.json']:
              (review/name).write_bytes((source/name).read_bytes())
          PY
          find "$OUT/review" -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/review/SHA256SUMS.pre"
          sha256sum "$OUT/review/SHA256SUMS.pre" > "$OUT/review/SHA256SUMS"

      - name: Upload independent final-product review
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload reviewer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
