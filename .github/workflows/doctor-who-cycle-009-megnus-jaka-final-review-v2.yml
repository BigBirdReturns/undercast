name: doctor-who-cycle-009-megnus-jaka-final-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-review-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: "707f2c14c4dc183afceb732c2b56124ed3a37c93"
      BRANCH: "agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v2"
      SELF: ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v2.yml"
      OUT: "/tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2"
      WORKTREE: "/tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/worktree"
      SOURCE_PR: "686"
      SOURCE_BRANCH: "agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v5"
      SOURCE_HEAD: "26c9b8880ff249b450792c386a2deac3ebc90c08"
      SOURCE_WORKFLOW: "doctor-who-cycle-009-megnus-jaka-final-product-v5"
      SOURCE_RUN: "31278507873"
      SOURCE_JOB: "93155885116"
      SOURCE_ARTIFACT: "9027766388"
      SOURCE_ARTIFACT_NAME: "doctor-who-cycle-009-megnus-jaka-final-product-v5-31278507873-attempt-1"
      SOURCE_ARTIFACT_SHA256: "16ff11ac2ebdb4ba36c08c29a21fafb53500698d6ec263487ae611d08212371d"
      SOURCE_QUALIFICATION_ID: "3f96fb67b63e3a6ce669eebefea573d3a1eb91bae46e45d3736d5506c0e6fa5a"
      FINAL_COMMIT: "2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6"
      FINAL_TREE: "50b59f4a945c12b7a1718bc0046608b6335f6aab"
      FINAL_PATHS: "48"
      TASK_ID: "ap_45bb5fdcdf4aff65aa7a87c3"
      LEASE_ID: "lease_4ca825307ad0d4510f44c7d9"
      WALL_ID: "UC-1354"
      PERFORMER: "Dan Starkey"
      ROLE: "Megnus Jaka"
      PORTRAIT_PATH: "images/uc-1354-portrait.jpg"
      PORTRAIT_SHA256: "997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68"
      CYCLE_ID: "cycle_42b1d086ae8eab34f09827dc"
      CYCLE_EVENT_ID: "waterline_4efd5e425f182ff9b1a81bce"
      CYCLE_RECEIPT_SHA256: "87bf140c482d211c01ef3e95def02cfb7e0a202fbe23a1b531c31eb773f422d5"
      CYCLE_RECEIPT_FILE_SHA256: "45d1341a135f13226ef85e93d94f360916d4629dfed580f22c5013a2c8cfcaf5"
      CHECKER_SHA256: "56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2"
      REVIEWED_AT: "2026-08-08T19:58:14Z"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact review carrier and V5 source authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,review,product,logs,diagnostics}

          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$BASE_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$BASE_MAIN"..HEAD)"
          test "$(git diff --name-only "$BASE_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$BASE_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$OUT/api/carrier-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$OUT/api/source-artifacts.json"

          ROOT="$OUT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          carrier = json.loads((root / 'api/carrier-pr.json').read_text())
          carrier_files = json.loads((root / 'api/carrier-files.json').read_text())
          source_pr = json.loads((root / 'api/source-pr.json').read_text())
          run = json.loads((root / 'api/source-run.json').read_text())
          jobs = json.loads((root / 'api/source-jobs.json').read_text())['jobs']
          artifacts = json.loads((root / 'api/source-artifacts.json').read_text())['artifacts']

          assert carrier['number'] == int(os.environ['PR_NUMBER'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged'] is False
          assert carrier['base']['ref'] == 'main' and carrier['base']['sha'] == os.environ['BASE_MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['PR_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert len(carrier_files) == 1 and carrier_files[0]['filename'] == os.environ['SELF'] and carrier_files[0]['status'] == 'added'

          assert source_pr['number'] == int(os.environ['SOURCE_PR'])
          assert source_pr['state'] == 'open' and source_pr['draft'] is True and source_pr['merged'] is False
          assert source_pr['base']['ref'] == 'main' and source_pr['base']['sha'] == os.environ['BASE_MAIN']
          assert source_pr['head']['ref'] == os.environ['SOURCE_BRANCH'] and source_pr['head']['sha'] == os.environ['SOURCE_HEAD']
          assert source_pr['commits'] == 1 and source_pr['changed_files'] == 1

          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['name'] == os.environ['SOURCE_WORKFLOW']
          assert run['head_branch'] == os.environ['SOURCE_BRANCH'] and run['head_sha'] == os.environ['SOURCE_HEAD']
          assert run['event'] == 'pull_request' and run['run_attempt'] == 1
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          selected_jobs = [job for job in jobs if job['id'] == int(os.environ['SOURCE_JOB'])]
          assert len(selected_jobs) == 1 and selected_jobs[0]['name'] == 'materialize' and selected_jobs[0]['conclusion'] == 'success'
          selected_artifacts = [row for row in artifacts if row['id'] == int(os.environ['SOURCE_ARTIFACT'])]
          assert len(selected_artifacts) == 1
          artifact = selected_artifacts[0]
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['SOURCE_ARTIFACT_SHA256']
          assert artifact['expired'] is False
          PY

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source.zip"
          test "$(sha256sum "$OUT/source.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_SHA256"
          ROOT="$OUT" python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['ROOT'])
          target = root / 'source'
          with zipfile.ZipFile(root / 'source.zip') as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not info.is_dir()
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          PY

      - name: Verify exact 48-path artifact and qualification seal
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT/source" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          ledger = root / 'SHA256SUMS.pre'
          seal = root / 'SHA256SUMS'
          assert ledger.is_file() and seal.is_file()
          assert hashlib.sha256(ledger.read_bytes()).hexdigest() == seal.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest, name = raw.split(None, 1)
              path = root / name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest

          q = json.loads((root / 'qualification.json').read_text())
          m = json.loads((root / 'file-manifest.json').read_text())
          assert q['status'] == 'cycle-009-megnus-jaka-receipt-bearing-product-qualified'
          assert q['identity'] == os.environ['SOURCE_QUALIFICATION_ID']
          assert q['qualification_run'] == int(os.environ['SOURCE_RUN']) and q['qualification_attempt'] == 1
          assert q['carrier_pr'] == int(os.environ['SOURCE_PR']) and q['carrier_head'] == os.environ['SOURCE_HEAD']
          assert q['canonical_parent'] == os.environ['BASE_MAIN']
          assert q['product']['commit'] == os.environ['FINAL_COMMIT'] and q['product']['tree'] == os.environ['FINAL_TREE'] and q['product']['paths'] == int(os.environ['FINAL_PATHS'])
          assert q['finalization']['cycle_id'] == os.environ['CYCLE_ID'] and q['finalization']['cycle_event_id'] == os.environ['CYCLE_EVENT_ID']
          assert q['finalization']['receipt_sha256'] == os.environ['CYCLE_RECEIPT_SHA256'] and q['finalization']['receipt_file_sha256'] == os.environ['CYCLE_RECEIPT_FILE_SHA256']
          assert q['finalization']['checker_sha256'] == os.environ['CHECKER_SHA256'] and q['finalization']['reviewed_at'] == os.environ['REVIEWED_AT']
          assert q['queue_after'] == {'total': 316, 'queued': 307, 'resolved': 9, 'in_flight': 0}
          assert q['media']['character_still'] == 'absent' and q['media']['performer_portrait'] == 'verified'
          assert q['media']['portrait_path'] == os.environ['PORTRAIT_PATH'] and q['media']['portrait_sha256'] == os.environ['PORTRAIT_SHA256']
          assert q['boundary'] == {'repository_write': False, 'product_published': False, 'product_merged': False, 'cycle_010_authorized': False, 'tenth_lease_issued': False, 'outside_human_dependency': False, 'owner_physical_action_required': False}

          assert m['base_main'] == os.environ['BASE_MAIN'] and m['final_commit'] == os.environ['FINAL_COMMIT'] and m['final_tree'] == os.environ['FINAL_TREE']
          assert len(m['paths']) == int(os.environ['FINAL_PATHS']) and len({row['path'] for row in m['paths']}) == int(os.environ['FINAL_PATHS'])
          assert all(row['status'] in {'A', 'M'} for row in m['paths'])
          assert not any(row['path'].startswith('.github/workflows/') or '/tmp/' in row['path'] or row['path'].startswith('tmp/') for row in m['paths'])
          assert hashlib.sha256((root / 'product.bundle').read_bytes()).hexdigest() == q['product']['bundle_sha256']
          assert hashlib.sha256((root / 'product.tar').read_bytes()).hexdigest() == q['product']['tar_sha256']
          assert hashlib.sha256((root / 'product.patch').read_bytes()).hexdigest() == q['product']['patch_sha256']
          assert hashlib.sha256((root / 'file-manifest.json').read_bytes()).hexdigest() == q['product']['file_manifest_sha256']
          PY

      - name: Reconstruct exact reviewed commit and every Git object
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$OUT/source/product.bundle" "HEAD:refs/review/cycle009-final"
          test "$(git rev-parse refs/review/cycle009-final)" = "$FINAL_COMMIT"
          test "$(git show -s --format=%P "$FINAL_COMMIT")" = "$BASE_MAIN"
          test "$(git show -s --format=%T "$FINAL_COMMIT")" = "$FINAL_TREE"
          test "$(git rev-list --count "$BASE_MAIN".."$FINAL_COMMIT")" = 1
          test -z "$(git rev-list --merges "$BASE_MAIN".."$FINAL_COMMIT")"
          git worktree add --detach "$WORKTREE" "$FINAL_COMMIT"
          git -C "$WORKTREE" diff --name-only "$BASE_MAIN"...HEAD | LC_ALL=C sort > "$OUT/review/actual-paths.txt"

          ROOT="$OUT" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import tarfile
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          repo = Path(os.environ['WORKTREE'])
          source = root / 'source'
          manifest = json.loads((source / 'file-manifest.json').read_text())
          actual = (root / 'review/actual-paths.txt').read_text().splitlines()
          expected = sorted(row['path'] for row in manifest['paths'])
          assert actual == expected and len(actual) == int(os.environ['FINAL_PATHS'])

          with tarfile.open(source / 'product.tar', 'r') as archive:
              members = archive.getmembers()
              rows = [row for row in manifest['paths'] if row['status'] != 'D']
              assert [member.name for member in members] == [row['path'] for row in rows]
              for member, row in zip(members, rows):
                  assert member.isfile()
                  data = archive.extractfile(member).read()
                  assert len(data) == row['bytes'] and hashlib.sha256(data).hexdigest() == row['sha256']
                  live = (repo / row['path']).read_bytes()
                  assert live == data
                  line = subprocess.check_output(['git', '-C', str(repo), 'ls-tree', os.environ['FINAL_COMMIT'], '--', row['path']], text=True).strip()
                  mode, kind, blob, _ = line.split(None, 3)
                  assert kind == 'blob' and mode == row['mode'] and blob == row['git_blob']
          PY

      - name: Independently prove Megnus Jaka semantics
        shell: bash
        working-directory: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/worktree
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          stable = lambda value: [stable(item) for item in value] if isinstance(value, list) else {key: stable(value[key]) for key in sorted(value)} if isinstance(value, dict) else value
          pretty = lambda value: json.dumps(stable(value), indent=2, ensure_ascii=False) + '\n'
          read = lambda path: json.loads(Path(path).read_text())
          jsonl = lambda path: [json.loads(line) for line in Path(path).read_text().splitlines() if line]
          sha = lambda data: hashlib.sha256(data).hexdigest()

          receipt_path = Path('data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json')
          checker_path = Path('scripts/doctor-who-cycle-009.mjs')
          receipt = read(receipt_path)
          body = dict(receipt)
          identity = body.pop('receipt_sha256')
          assert identity == os.environ['CYCLE_RECEIPT_SHA256'] == sha(pretty(body).encode())
          assert sha(receipt_path.read_bytes()) == os.environ['CYCLE_RECEIPT_FILE_SHA256']
          assert sha(checker_path.read_bytes()) == os.environ['CHECKER_SHA256']

          assert receipt['canonical_parent'] == os.environ['BASE_MAIN']
          assert receipt['task']['id'] == os.environ['TASK_ID'] and receipt['task']['performer'] == os.environ['PERFORMER'] and receipt['task']['role'] == os.environ['ROLE'] and receipt['task']['performance_mode'] == 'voice'
          assert receipt['lease']['id'] == os.environ['LEASE_ID']
          assert receipt['canonical']['wall_id'] == os.environ['WALL_ID']
          assert receipt['queue'] == {'before': {'total': 316, 'queued': 308, 'resolved': 8, 'in_flight': 0}, 'after': {'total': 316, 'queued': 307, 'resolved': 9, 'in_flight': 0}}
          assert receipt['reviewed_cycle']['id'] == os.environ['CYCLE_ID'] and receipt['reviewed_cycle']['event_id'] == os.environ['CYCLE_EVENT_ID'] and receipt['reviewed_cycle']['reviewed_at'] == os.environ['REVIEWED_AT']
          assert receipt['qualification']['checker_sha256'] == os.environ['CHECKER_SHA256'] and receipt['qualification']['historical_claims'] == 9 and receipt['qualification']['denominator'] == 316
          assert receipt['boundary']['cycle_010_authorized'] is False and receipt['boundary']['tenth_lease_issued'] is False and receipt['boundary']['outside_human_dependency'] is False and receipt['boundary']['owner_physical_action_required'] is False

          card = next(row for row in read('data/specimens.json') if row['id'] == os.environ['WALL_ID'])
          source = next(row for row in read('data/SOURCES.json') if row['id'] == os.environ['WALL_ID'])
          assert card['actor'] == os.environ['PERFORMER'] and card['character'] == os.environ['ROLE'] and card['production'] == 'The First Sontarans' and card['kind'] == 'voice'
          assert 'still' not in card and source['still'] is None
          assert card['portrait']['src'] == os.environ['PORTRAIT_PATH'] and source['portrait'] == card['portrait']
          assert sha(Path(os.environ['PORTRAIT_PATH']).read_bytes()) == os.environ['PORTRAIT_SHA256']

          audit = read('data/MEDIA-AUDIT.json')
          facets = sorted([row for row in audit['items'] if row['wall_id'] == os.environ['WALL_ID']], key=lambda row: row['side'])
          assert len(facets) == 2 and [row['side'] for row in facets] == ['portrait', 'still']
          portrait = next(row for row in facets if row['side'] == 'portrait')
          still = next(row for row in facets if row['side'] == 'still')
          assert portrait['status'] == 'verified' and portrait['asset']['sha256'] == os.environ['PORTRAIT_SHA256']
          assert portrait['claims']['identity']['value'] == 'expected' and portrait['claims']['presentation']['value'] == 'neutral-human'
          assert still['status'] == 'absent' and still['asset'] is None

          state = read('data/AUTOPILOT.json')
          task = next(row for row in state['jobs'] if row['id'] == os.environ['TASK_ID'])
          assert task['status'] == 'resolved' and task['wall_ids'] == [os.environ['WALL_ID']]
          doctor = [row for row in state['jobs'] if row['scope'] == 'doctor-who']
          assert {'total': len(doctor), 'queued': sum(row['status'] == 'queued' for row in doctor), 'resolved': sum(row['status'] == 'resolved' for row in doctor), 'in_flight': sum(row['status'] in {'leased', 'drafted', 'merged'} for row in doctor)} == {'total': 316, 'queued': 307, 'resolved': 9, 'in_flight': 0}

          water = read('data/WATERLINE-STATE.json')
          cycles = [row for row in water['cycles'] if row.get('scope_id') == 'doctor-who' and row.get('lease_id') == os.environ['LEASE_ID']]
          assert len(cycles) == 1 and cycles[0]['id'] == os.environ['CYCLE_ID'] and cycles[0]['outcome'] == 'completed' and cycles[0]['task_ids'] == [os.environ['TASK_ID']]
          events = [row for row in jsonl('data/journal/waterline.jsonl') if row.get('id') == os.environ['CYCLE_EVENT_ID'] and row.get('lease_id') == os.environ['LEASE_ID'] and row.get('receipt_id') == os.environ['CYCLE_ID']]
          assert len(events) == 1
          PY

      - name: Run independent permanent and complete rendered gates
        shell: bash
        working-directory: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/worktree
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/logs/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/logs/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/logs/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/logs/waterline-status.json" >/dev/null
          node scripts/gate.mjs | tee "$OUT/logs/complete-gate.log"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - name: Seal code-free independent publication handoff
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/source/product.tar" "$OUT/product/product.tar"
          cp "$OUT/source/product.bundle" "$OUT/product/product.bundle"
          cp "$OUT/source/product.patch" "$OUT/product/product.patch"
          cp "$OUT/source/file-manifest.json" "$OUT/product/file-manifest.json"
          cp "$OUT/source/qualification.json" "$OUT/review/source-qualification.json"
          cp "$OUT/source/finalization-facts.json" "$OUT/review/finalization-facts.json"

          ROOT="$OUT" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          source = json.loads((root / 'source/qualification.json').read_text())
          manifest = json.loads((root / 'source/file-manifest.json').read_text())
          receipt = {
              'status': 'cycle-009-megnus-jaka-approved-for-publication',
              'version': 1,
              'review_run': int(os.environ['GITHUB_RUN_ID']),
              'review_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr': int(os.environ['PR_NUMBER']),
              'carrier_head': os.environ['PR_HEAD'],
              'canonical_parent': os.environ['BASE_MAIN'],
              'source': {
                  'pr': int(os.environ['SOURCE_PR']),
                  'head': os.environ['SOURCE_HEAD'],
                  'run': int(os.environ['SOURCE_RUN']),
                  'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_sha256': os.environ['SOURCE_ARTIFACT_SHA256'],
                  'qualification_identity': os.environ['SOURCE_QUALIFICATION_ID'],
              },
              'product': {
                  'commit': os.environ['FINAL_COMMIT'],
                  'tree': os.environ['FINAL_TREE'],
                  'paths': int(os.environ['FINAL_PATHS']),
                  'tar_sha256': hashlib.sha256((root / 'product/product.tar').read_bytes()).hexdigest(),
                  'bundle_sha256': hashlib.sha256((root / 'product/product.bundle').read_bytes()).hexdigest(),
                  'patch_sha256': hashlib.sha256((root / 'product/product.patch').read_bytes()).hexdigest(),
                  'file_manifest_sha256': hashlib.sha256((root / 'product/file-manifest.json').read_bytes()).hexdigest(),
              },
              'semantic': {
                  'task': os.environ['TASK_ID'],
                  'lease': os.environ['LEASE_ID'],
                  'wall': os.environ['WALL_ID'],
                  'performer': os.environ['PERFORMER'],
                  'role': os.environ['ROLE'],
                  'mode': 'voice',
                  'queue_after': {'total': 316, 'queued': 307, 'resolved': 9, 'in_flight': 0},
                  'character_still': 'absent',
                  'performer_portrait': 'verified',
                  'portrait_path': os.environ['PORTRAIT_PATH'],
                  'portrait_sha256': os.environ['PORTRAIT_SHA256'],
                  'cycle_id': os.environ['CYCLE_ID'],
                  'cycle_event_id': os.environ['CYCLE_EVENT_ID'],
                  'cycle_receipt_sha256': os.environ['CYCLE_RECEIPT_SHA256'],
                  'checker_sha256': os.environ['CHECKER_SHA256'],
              },
              'gates': {
                  'cycle_008': 'pass',
                  'cycle_009': 'pass',
                  'autopilot': 'pass',
                  'media': 'pass',
                  'waterline': 'pass',
                  'complete_rendered': 'pass',
              },
              'boundary': {
                  'repository_write': False,
                  'product_published': False,
                  'product_merged': False,
                  'cycle_010_authorized': False,
                  'tenth_lease_issued': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
              'next_gate': 'isolated checksum-bound product publication followed by guarded canonical fast-forward and post-merge proof',
          }
          assert source['product']['commit'] == receipt['product']['commit'] and source['product']['tree'] == receipt['product']['tree'] and len(manifest['paths']) == receipt['product']['paths']
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (root / 'review/approval.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          PY

          find "$OUT" -type f ! -path "$OUT/source/*" ! -path "$OUT/api/*" ! -name source.zip ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - name: Upload independent approved product handoff
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/SHA256SUMS
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/SHA256SUMS.pre
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/product
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/review
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2/logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload independent-review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
