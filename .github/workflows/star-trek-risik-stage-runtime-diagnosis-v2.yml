name: star-trek-risik-stage-runtime-diagnosis-v2

on:
  push:
    branches:
      - agent/star-trek-risik-stage-runtime-diagnosis-v2

permissions:
  contents: read

concurrency:
  group: star-trek-risik-stage-runtime-diagnosis-v2
  cancel-in-progress: false

env:
  RUNTIME_ARCHIVE_SHA: c6a41963f8efc533a06e10ba68d6ab25ff37e3a507589e386532a3440662cb8e
  RUNTIME_ROOT: /tmp/star-trek-risik-stage-runtime-v1

jobs:
  diagnose:
    name: inspect-media-resolution-runtime
    if: ${{ github.event.head_commit.message == 'Inspect Risik stage media-resolution runtime v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and print exact stage media step
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNTIME_ROOT" /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          mkdir -p "$RUNTIME_ROOT"
          cat .github/recovery/star-trek-risik-stage-recovery-v1/runtime.tar.gz.b64.* | base64 -d > /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          test "$(sha256sum /tmp/star-trek-risik-stage-runtime-v1.tar.gz | awk '{print $1}')" = "$RUNTIME_ARCHIVE_SHA"
          tar -xzf /tmp/star-trek-risik-stage-runtime-v1.tar.gz -C "$RUNTIME_ROOT"
          (cd "$RUNTIME_ROOT" && sha256sum -c manifest.sha256)
          printf '%s\n' '===== steps/01.sh item bindings ====='
          grep -n -C 5 -E 'STILL_ITEM_ID|PORTRAIT_ITEM_ID|item_id|media-review' "$RUNTIME_ROOT/steps/01.sh" || true
          printf '%s\n' '===== steps/03.sh ====='
          cat "$RUNTIME_ROOT/steps/03.sh"
          printf '%s\n' '===== lifecycle media bindings ====='
          grep -n -C 5 -E 'STILL_ITEM_ID|PORTRAIT_ITEM_ID|media-audit|resolution' "$RUNTIME_ROOT/candidate-lifecycle.py" || true
