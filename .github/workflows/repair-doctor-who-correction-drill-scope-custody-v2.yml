name: repair-doctor-who-correction-drill-scope-custody-v2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-doctor-who-correction-drill-scope-custody-v2.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-correction-drill-scope-custody-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/repair-doctor-who-correction-drill-scope-custody-v2.yml
  CHECKER: scripts/doctor-who-correction-drill.mjs
  RECEIPT: data/review/adapter-sdk/doctor-who-correction-drill-001-scope-custody.json
  V1_COMMIT: 3a21c9949dd80de55b0ce63b3e0cd0ef0d74c7db
  V1_WORKFLOW: .github/workflows/repair-doctor-who-correction-drill-scope-custody.yml

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 6

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact main, clean transport, and retained patch source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=6 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          git cat-file -e "${V1_COMMIT}^{commit}"
          git show "${V1_COMMIT}:${V1_WORKFLOW}" > /tmp/scope-custody-v1.yml
          test -s /tmp/scope-custody-v1.yml
          repaired_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          echo "REPAIRED_AT=$repaired_at" >> "$GITHUB_ENV"
          echo "repaired_at=$repaired_at" >> "$GITHUB_STEP_SUMMARY"
          echo "exact_main=$EXACT_MAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute corrected retained patch and focused proofs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          source = Path('/tmp/scope-custody-v1.yml').read_text()
          old = 'if "PILOT_RECEIPT_SHA256" in script:'
          new = 'if "const PILOT_RECEIPT_SHA256 =" in script or "=== PILOT_RECEIPT_SHA256" in script:'
          if source.count(old) != 1:
              raise SystemExit(f'expected one stale identifier guard, found {source.count(old)}')
          source = source.replace(old, new)
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, '/tmp/scope-custody-patcher.py', 'exec'), {'__name__': '__main__'})
          PY

          node --check "$CHECKER"
          npm run doctor-who:correction-drill:check 2>&1 | tee /tmp/doctor-who-correction-drill-scope-custody-focused.log
          npm run autopilot:fixtures 2>&1 | tee /tmp/doctor-who-correction-drill-scope-custody-autopilot.log

      - name: Stage exact workflow-free two-path product and run candidate gate
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm "$SELF"
          git add "$CHECKER" "$RECEIPT"
          cat > /tmp/expected-product-paths.txt <<'PATHS'
          data/review/adapter-sdk/doctor-who-correction-drill-001-scope-custody.json
          scripts/doctor-who-correction-drill.mjs
          PATHS
          git diff --cached --name-only "$EXACT_MAIN" | sort > /tmp/candidate-product-paths.txt
          diff -u /tmp/expected-product-paths.txt /tmp/candidate-product-paths.txt
          git diff --cached --check
          test -z "$(git diff --name-only)"
          npm run gate 2>&1 | tee /tmp/doctor-who-correction-drill-scope-custody-candidate-gate.log
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit exact repair and run final workflow-free gate
        run: |
          set -euo pipefail
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Corrections: scope-bind the Doctor Who drill checker' \
            -m 'preserve historical custody while allowing one unrelated active cycle' \
            -m 'refuse Doctor Who drift and concurrent lease groups'
          new_head="$(git rev-parse HEAD)"
          echo "NEW_HEAD=$new_head" >> "$GITHUB_ENV"
          echo "product_head=$new_head" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/final-product-paths.txt
          diff -u /tmp/expected-product-paths.txt /tmp/final-product-paths.txt
          git diff --check "$EXACT_MAIN"...HEAD
          npm run gate 2>&1 | tee /tmp/doctor-who-correction-drill-scope-custody-final-gate.log
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          test -z "$(git status --porcelain)"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$SELF"
          ! git ls-tree -r --name-only HEAD | grep -Fx "$V1_WORKFLOW"

      - name: Publish exact repair under branch lease
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=6 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=$NEW_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "durable_paths=2" >> "$GITHUB_STEP_SUMMARY"
          echo "lease_issued=false" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repair and complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-correction-drill-scope-custody-${{ github.run_id }}
          path: |
            /tmp/doctor-who-correction-drill-scope-custody-focused.log
            /tmp/doctor-who-correction-drill-scope-custody-autopilot.log
            /tmp/doctor-who-correction-drill-scope-custody-candidate-gate.log
            /tmp/doctor-who-correction-drill-scope-custody-final-gate.log
            /tmp/expected-product-paths.txt
            /tmp/candidate-product-paths.txt
            /tmp/final-product-paths.txt
            data/review/adapter-sdk/doctor-who-correction-drill-001-scope-custody.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
