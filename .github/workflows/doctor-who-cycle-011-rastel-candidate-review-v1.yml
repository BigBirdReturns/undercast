name: doctor-who-cycle-011-rastel-candidate-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-review-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-review-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-review-v1
      SRC: /tmp/doctor-who-cycle-011-rastel-candidate-review-v1-source
      WORK: /tmp/doctor-who-cycle-011-rastel-candidate-review-v1-worktree
      TRANSPORT: /tmp/doctor-who-cycle-011-rastel-candidate-review-v1-transport

      SOURCE_PR: "764"
      SOURCE_HEAD: 5cb7aa31683e93be66cda1e183f952b247660cf1
      SOURCE_RUN: "31333047499"
      SOURCE_JOB: "93294232952"
      SOURCE_ARTIFACT: "9043522453"
      SOURCE_ZIP_SHA256: 9ddec6d920d2a443ce0d495b6cfd6d7327d6036c0594757773569b97b032ad49
      SOURCE_FILES: "363"
      LEDGER_ENTRIES: "54"

      CANDIDATE_IDENTITY: 180ad04ea2288e0f3f99b59991d90b35c6fcc8d640c18fd9af33dbb250082626
      CANDIDATE_COMMIT: 244def71baddd9bdf4591384438b041894d868a1
      CANDIDATE_TREE: 237226254d6ab45b796b7dbf427f4ac21d765d92
      CANDIDATE_PATHS: "38"
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d

      PATHS_SHA256: ed6a06dee98e62a676235f7b1381a59d460a315526cd2ca8e06f990f9ecc9a9a
      PATH_POLICY_SHA256: f29da4fb85d521d518faff40fea84e5da9f430bdb1f401933f90b9b66ac57d29
      FILE_MANIFEST_SHA256: ca1f0ac0a7cf3e50ff4309979ecd4c5c9625719726fee6adac9cc1f300164815
      DELTA_MANIFEST_SHA256: 68756591458f0df50533c0b4ded7980cbdd7549eb3a76bc1b52a950134a9f369
      PATCH_SHA256: 3b91b402786e56ad4efb3d70aa2996bc0d3dbc4a338b66a904d96f192f9f19d7
      BUNDLE_SHA256: 73845e2a6f6267257df53151ebca198c7f75b4ffdc69468cd201f5b0454ae2fd
      TAR_SHA256: 4f7848127b48071c32f0ed1fc9786fb3c1200ac6135559bf6dddfb3f30af8059
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

      V2_IDENTITY: 7f6a131ac6e04aec0696b82cbb6a4637d4e0024ecf0e452c66a18f7ac6c68dd9
      V6_IDENTITY: 3329fabe553b759fb2249c972496354bcd8badb489e9b319d093d914e375585a
      V7_IDENTITY: f0e16fbabf33263ab718a40f765f6a0de927559c8155222ca5176551d6bee6ce
      V8_IDENTITY: 4080051f3dec29207d0b9e99857ca616c00964f3c53e1fc610da139c27748b4d

      CYCLE009_SHA256: ad86e82591ebbeb6fd24e72dba87aba9ac062104bd23904d073ee88d8aa1f021
      CYCLE010_SHA256: 52318d988bef4d03a46afa0dad6c0a6e487e96afc32cbe59e800a0c1c028280f

      REVIEWER_BLOBS: "458dbc4ac9512f343f634af0ebf2771a7ec14f19 a22cb4d75d7bc2bf07a99a636d4bc0747a66efae 26360dcec222667d8abae12f7a29843859c91d21"
      REVIEWER_CHUNK_BYTES: "3000 3000 2880"
      REVIEWER_CHUNK_SHA256: "bb0c0986aeb4591ea8449b128f1a1a809ac02b57319adc41b17df730d2dd9f4e 04925ff28a1fbc2ff09d80f999f84ac3202548d240549452261c3a6bba3c5421 2c22c1c5216607c44cc7d7cdaff2aed0d0ff5afb9f3a6069f4f13bbd4f91a319"
      REVIEWER_B64_BYTES: "8880"
      REVIEWER_B64_SHA256: e97089dbf1fde79bc9f88a0395fa32c1d8af5c06aa7bf7ab8db9ec53a7e63229
      REVIEWER_GZIP_BYTES: "6658"
      REVIEWER_GZIP_SHA256: 66498bc08afe533810e4bc94de90ac2a8b16d4d33b57665f61f348d8d595d009
      REVIEWER_BYTES: "25399"
      REVIEWER_SHA256: b04ac3f4368d87a5146b134e2dea3446a1b782c91a0f3b64d46d68ff823d8fde

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct exact independent reviewer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRANSPORT"
          mkdir -p "$TRANSPORT"
          : > "$TRANSPORT/reviewer.sh.gz.b64"
          read -r -a blobs <<< "$REVIEWER_BLOBS"
          read -r -a sizes <<< "$REVIEWER_CHUNK_BYTES"
          read -r -a hashes <<< "$REVIEWER_CHUNK_SHA256"
          test "${#blobs[@]}" = 3
          for index in 0 1 2; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$TRANSPORT/chunk.$index"
            test "$(wc -c < "$TRANSPORT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$TRANSPORT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$TRANSPORT/chunk.$index" >> "$TRANSPORT/reviewer.sh.gz.b64"
          done
          test "$(wc -c < "$TRANSPORT/reviewer.sh.gz.b64" | tr -d ' ')" = "$REVIEWER_B64_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh.gz.b64" | awk '{print $1}')" = "$REVIEWER_B64_SHA256"
          base64 -d "$TRANSPORT/reviewer.sh.gz.b64" > "$TRANSPORT/reviewer.sh.gz"
          test "$(wc -c < "$TRANSPORT/reviewer.sh.gz" | tr -d ' ')" = "$REVIEWER_GZIP_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh.gz" | awk '{print $1}')" = "$REVIEWER_GZIP_SHA256"
          gzip -dc "$TRANSPORT/reviewer.sh.gz" > "$TRANSPORT/reviewer.sh"
          test "$(wc -c < "$TRANSPORT/reviewer.sh" | tr -d ' ')" = "$REVIEWER_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh" | awk '{print $1}')" = "$REVIEWER_SHA256"
          bash -n "$TRANSPORT/reviewer.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-review-v1-transport/reviewer.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<rastel-independent-review-{index}>','exec')
          PY

      - name: Execute exact independent candidate reconstruction and gate
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$TRANSPORT/reviewer.sh"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" exec "$TRANSPORT/reviewer.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-review-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v1
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v1-source
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v1-transport
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
