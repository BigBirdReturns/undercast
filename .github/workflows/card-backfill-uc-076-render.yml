name: card-backfill-uc-076-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-076-RENDER.json"
      - "scripts/card-backfill-uc-076-render.mjs"
      - ".github/workflows/card-backfill-uc-076-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-076-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-016'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-016
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact reviewed two-role authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-076-RENDER.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-076'||row.actor!=='Felix Silla'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-076 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8641884927||row.discovery_artifact?.head_sha!=='85ce78a0543ecea24b247a69c666e40acaed538b')throw new Error('UC-076 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==2)throw new Error('UC-076 failed checkpoint drift');
          if(row.selection?.twiki?.sha256!=='19888475f2a81965143bacaf2948ed67e9ecc5d5d5ecedeb87184abdc8894949')throw new Error('UC-076 Twiki selection drift');
          if(row.selection?.cousin_itt?.sha256!=='b0b720c99886b6c4a2cf4d3153f619469be624836b87fafbb9b0d6095d0fd4f4')throw new Error('UC-076 Cousin Itt selection drift');
          if(row.composite?.width!==1260||row.composite?.panel_width!==624||row.composite?.divider_width!==12||row.wall_crop?.width!==1246)throw new Error('UC-076 composite geometry drift');
          console.log('PASS — exact Twiki and Cousin Itt sources and diptych recipe authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-076-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8641884927/zip" > "$root/discovery.zip"
          echo "1fa4e96f15a671c1051fb84d696d61c728d79eabbae14bbb713ebb08ab4eab97  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-076"
          test -f "$base/manifest.json"
          echo "29d604e127ecca3cd987cdda49cdd19d5f727c62204f49f125a0149866f45767  $base/manifest.json" | sha256sum -c -
          echo "19888475f2a81965143bacaf2948ed67e9ecc5d5d5ecedeb87184abdc8894949  $base/candidates/twiki/024-buckwiki-twiki-metadata.jpg" | sha256sum -c -
          echo "b0b720c99886b6c4a2cf4d3153f619469be624836b87fafbb9b0d6095d0fd4f4  $base/candidates/cousin-itt/122-tmz-itt-feature-metadata.webp" | sha256sum -c -
          echo "bda0dba7a0086f9ed20eca9c9ff593ba553e42d486cf6f532312f844df90ea5a  $base/pages/twiki-buckwiki-twiki.png" | sha256sum -c -
          echo "fc36ae40cb3c9648b7b65622afb74cc8bd49153b1b7eee8f8b44edbe70f0bf24  $base/pages/cousin-itt-tmz-itt-feature.png" | sha256sum -c -
      - name: Render exact role diptych and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-076-render/source/card-backfill-uc-076
          OUT: ${{ runner.temp }}/card-backfill-uc-076-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-076-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-076-render/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact sources, panels, diptych, pages, and reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-076-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-076-render/output
            ${{ runner.temp }}/card-backfill-uc-076-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
