jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v11-single-deletion-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 4
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v11-single-deletion-census.yml
            .github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64
            data
            images
            scripts

      - name: Bind V10 packet and prove unique one-character deletion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$OUT/v10-packet" /tmp/kreg-v11-census
          shallow_file="$(git rev-parse --git-path shallow)"
          {
            echo "head=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "expected_head=$HEAD_SHA"
            echo "rev_count=$(git rev-list --count "$EXACT_MAIN"..HEAD 2>/dev/null || true)"
            echo "merge_base=$(git merge-base "$EXACT_MAIN" HEAD 2>/dev/null || true)"
            echo "head_parent=$(git rev-parse HEAD^ 2>/dev/null || true)"
            echo "payload_parent=$(git show -s --format=%P "$PAYLOAD_COMMIT" 2>/dev/null || true)"
            echo "payload_blob=$(git rev-parse "$PAYLOAD_COMMIT:$PAYLOAD" 2>/dev/null || true)"
            echo "payload_text_sha256=$(sha256sum "$PAYLOAD" 2>/dev/null | awk '{print $1}' || true)"
            echo "shallow_file=$shallow_file"
            if test -f "$shallow_file"; then sed 's/^/shallow_commit=/' "$shallow_file"; fi
          } > "$OUT/prebind-diagnostics.txt"

          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "2"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$(git rev-parse HEAD^)" = "$PAYLOAD_COMMIT"
          test "$(git show -s --format=%P "$PAYLOAD_COMMIT")" = "$EXACT_MAIN"
          test "$(git rev-parse "$PAYLOAD_COMMIT:$PAYLOAD")" = "$PAYLOAD_BLOB"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_TEXT_SHA256"
          if test -f "$shallow_file"; then ! grep -Fx "$EXACT_MAIN" "$shallow_file" >/dev/null; fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PAYLOAD_BLOB}" > "$OUT/payload-blob.json"
          jq -e --arg blob "$PAYLOAD_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/payload-blob.json" >/dev/null
          jq -r '.content' "$OUT/payload-blob.json" | tr -d '\n' | base64 -d > "$OUT/payload-from-blob.b64"
          test "$(git hash-object "$OUT/payload-from-blob.b64")" = "$PAYLOAD_BLOB"
          test "$(sha256sum "$OUT/payload-from-blob.b64" | awk '{print $1}')" = "$PAYLOAD_TEXT_SHA256"
          cmp "$PAYLOAD" "$OUT/payload-from-blob.b64"

          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${V10_BLOB}" > "$OUT/v10-wrapper-blob.json"
          jq -e --arg blob "$V10_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/v10-wrapper-blob.json" >/dev/null
          jq -r '.content' "$OUT/v10-wrapper-blob.json" | tr -d '\n' | base64 -d > "$OUT/v10-wrapper.yml"
          test "$(git hash-object "$OUT/v10-wrapper.yml")" = "$V10_BLOB"
          grep -F "PAYLOAD_TEXT_SHA256: $PAYLOAD_TEXT_SHA256" "$OUT/v10-wrapper.yml" >/dev/null
          grep -F "PAYLOAD_GZIP_SHA256: $PAYLOAD_GZIP_SHA256" "$OUT/v10-wrapper.yml" >/dev/null
          grep -F "PAYLOAD_SCRIPT_SHA256: $PAYLOAD_SCRIPT_SHA256" "$OUT/v10-wrapper.yml" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V10_RUN}" > "$OUT/v10-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V10_RUN}/jobs?per_page=100" > "$OUT/v10-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${V10_ARTIFACT_ID}" > "$OUT/v10-artifact.json"
          jq -e --argjson run "$V10_RUN" --arg head "$V10_HEAD" --arg branch "$V10_BRANCH" '
            .id==$run and .head_sha==$head and .head_branch==$branch and
            .status=="completed" and .conclusion=="failure" and .event=="pull_request"
          ' "$OUT/v10-run.json" >/dev/null
          jq -e --argjson job "$V10_JOB" '
            any(.jobs[];
              .id==$job and .name=="census" and .status=="completed" and .conclusion=="failure" and
              any(.steps[]; .name=="Bind V9 packet and decode only after ASCII-whitespace normalization" and .conclusion=="failure") and
              any(.steps[]; .name=="Execute unchanged checksum-bound structural census program" and .conclusion=="skipped") and
              any(.steps[]; .name=="Upload exact Kreg V10 bounded route-census packet" and .conclusion=="success")
            )
          ' "$OUT/v10-jobs.json" >/dev/null
          jq -e --argjson id "$V10_ARTIFACT_ID" --arg name "$V10_ARTIFACT_NAME" --arg digest "sha256:${V10_ARTIFACT_SHA256}" --argjson run "$V10_RUN" --arg head "$V10_HEAD" '
            .id==$id and .name==$name and .digest==$digest and .expired==false and
            .workflow_run.id==$run and .workflow_run.head_sha==$head
          ' "$OUT/v10-artifact.json" >/dev/null
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$OUT/v10-artifact.zip" \
            "$(jq -r '.archive_download_url' "$OUT/v10-artifact.json")"
          test "$(sha256sum "$OUT/v10-artifact.zip" | awk '{print $1}')" = "$V10_ARTIFACT_SHA256"
          python - <<'PY'
          import os, pathlib, zipfile
          out = pathlib.Path(os.environ['OUT'])
          expected = sorted([
              'payload-blob.json','payload-byte-diagnostics.json','payload-from-blob.b64','prebind-diagnostics.txt',
              'v9-artifact.json','v9-artifact.zip','v9-jobs.json','v9-run.json','v9-wrapper-blob.json','v9-wrapper.yml',
              'v9-packet/prebind-diagnostics.txt',
              'v9-packet/v6-artifacts.json','v9-packet/v6-blob.json','v9-packet/v6-jobs.json','v9-packet/v6-path.txt','v9-packet/v6-run.json','v9-packet/v6-wrapper.yml',
              'v9-packet/v7-artifacts.json','v9-packet/v7-blob.json','v9-packet/v7-jobs.json','v9-packet/v7-path.txt','v9-packet/v7-run.json','v9-packet/v7-wrapper.yml',
              'v9-packet/v8-artifact.json','v9-packet/v8-artifact.zip','v9-packet/v8-blob.json','v9-packet/v8-diagnostic/prebind-diagnostics.txt',
              'v9-packet/v8-jobs.json','v9-packet/v8-path.txt','v9-packet/v8-run.json','v9-packet/v8-wrapper.yml'
          ])
          target = out / 'v10-packet'
          with zipfile.ZipFile(out / 'v10-artifact.zip') as zf:
              names = zf.namelist()
              if sorted(names) != expected or len(names) != len(set(names)):
                  raise SystemExit(f'V10 packet members drifted: {names!r}')
              for name in names:
                  p = pathlib.PurePosixPath(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe V10 packet member: {name}')
              zf.extractall(target)
          PY
          cmp "$PAYLOAD" "$OUT/v10-packet/payload-from-blob.b64"
          jq -e --arg payload "$PAYLOAD_TEXT_SHA256" --arg compact "$PAYLOAD_COMPACT_BEFORE_SHA256" '
            .payload_bytes==10441 and .payload_sha256==$payload and
            .ascii_whitespace_counts=={"carriage_return":0,"form_feed":0,"line_feed":136,"space":0,"tab":0,"vertical_tab":0} and
            .non_alphabet_non_whitespace_count==0 and .compact_bytes==10305 and
            .compact_length_mod_4==1 and .compact_sha256==$compact and
            .arbitrary_garbage_ignored==false
          ' "$OUT/v10-packet/payload-byte-diagnostics.json" >/dev/null
          ! test -e "$OUT/v10-packet/route-census-summary.json"
          ! test -e "$OUT/v10-packet/kreg-public-original.jpg"

          PAYLOAD_PATH="$PAYLOAD" GZIP_PATH="/tmp/kreg-v11-census/census.sh.gz" PROOF_PATH="$OUT/single-deletion-proof.json" CORRECTED_PATH="$OUT/payload-corrected.compact.b64" python - <<'PY'
          import base64, hashlib, json, os, pathlib
          payload = pathlib.Path(os.environ['PAYLOAD_PATH']).read_bytes()
          whitespace = {9, 10, 11, 12, 13, 32}
          compact = bytes(b for b in payload if b not in whitespace)
          expected_gzip = os.environ['PAYLOAD_GZIP_SHA256']
          matches = []
          for offset in range(len(compact)):
              candidate = compact[:offset] + compact[offset+1:]
              if len(candidate) % 4:
                  continue
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(decoded).hexdigest() == expected_gzip:
                  matches.append((offset, compact[offset], candidate, decoded))
          if len(matches) != 1:
              raise SystemExit(f'expected one digest-matching single deletion, found {len(matches)}')
          offset, removed, corrected, decoded = matches[0]
          compact_count = 0
          raw_offset = None
          for raw_index, byte in enumerate(payload):
              if byte in whitespace:
                  continue
              if compact_count == offset:
                  raw_offset = raw_index
                  break
              compact_count += 1
          if raw_offset is None:
              raise SystemExit('could not map compact offset to raw file')
          line = payload[:raw_offset].count(b'\n') + 1
          last_newline = payload.rfind(b'\n', 0, raw_offset)
          column = raw_offset - (last_newline + 1) + 1
          line_end = payload.find(b'\n', raw_offset)
          if line_end < 0:
              line_end = len(payload)
          source_line = payload[last_newline+1:line_end]
          corrected_line = source_line[:column-1] + source_line[column:]
          proof = {
              'algorithm': 'exhaustive single-character deletion; strict base64 decode; accept only frozen gzip SHA-256',
              'candidate_count': len(compact),
              'digest_matching_deletions': 1,
              'compact_before_bytes': len(compact),
              'compact_before_sha256': hashlib.sha256(compact).hexdigest(),
              'compact_after_bytes': len(corrected),
              'compact_after_sha256': hashlib.sha256(corrected).hexdigest(),
              'removed_compact_offset_zero_based': offset,
              'removed_raw_offset_zero_based': raw_offset,
              'removed_line_one_based': line,
              'removed_column_one_based': column,
              'removed_byte': removed,
              'removed_hex': f'{removed:02x}',
              'removed_character': chr(removed),
              'source_line': source_line.decode('ascii'),
              'source_line_length': len(source_line),
              'corrected_line': corrected_line.decode('ascii'),
              'corrected_line_length': len(corrected_line),
              'decoded_gzip_bytes': len(decoded),
              'decoded_gzip_sha256': hashlib.sha256(decoded).hexdigest(),
              'payload_replaced': False,
              'arbitrary_garbage_ignored': False
          }
          pathlib.Path(os.environ['PROOF_PATH']).write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          pathlib.Path(os.environ['CORRECTED_PATH']).write_bytes(corrected + b'\n')
          pathlib.Path(os.environ['GZIP_PATH']).write_bytes(decoded)
          PY
          jq -e --arg before "$PAYLOAD_COMPACT_BEFORE_SHA256" --arg after "$PAYLOAD_COMPACT_AFTER_SHA256" --arg gzip "$PAYLOAD_GZIP_SHA256" --argjson offset "$CORRECTION_COMPACT_OFFSET" --argjson raw "$CORRECTION_RAW_OFFSET" --argjson line "$CORRECTION_LINE" --argjson column "$CORRECTION_COLUMN" --argjson byte "$CORRECTION_BYTE" --arg char "$CORRECTION_CHARACTER" '
            .digest_matching_deletions==1 and .candidate_count==10305 and
            .compact_before_bytes==10305 and .compact_before_sha256==$before and
            .compact_after_bytes==10304 and .compact_after_sha256==$after and
            .removed_compact_offset_zero_based==$offset and .removed_raw_offset_zero_based==$raw and
            .removed_line_one_based==$line and .removed_column_one_based==$column and
            .removed_byte==$byte and .removed_character==$char and
            .source_line_length==77 and .corrected_line_length==76 and
            .decoded_gzip_bytes==7727 and .decoded_gzip_sha256==$gzip and
            .payload_replaced==false and .arbitrary_garbage_ignored==false
          ' "$OUT/single-deletion-proof.json" >/dev/null
          test "$(sha256sum /tmp/kreg-v11-census/census.sh.gz | awk '{print $1}')" = "$PAYLOAD_GZIP_SHA256"
          gzip -dc /tmp/kreg-v11-census/census.sh.gz > /tmp/kreg-v11-census/census.sh
          test "$(wc -c < /tmp/kreg-v11-census/census.sh)" = "28528"
          test "$(sha256sum /tmp/kreg-v11-census/census.sh | awk '{print $1}')" = "$PAYLOAD_SCRIPT_SHA256"
          head -n 1 /tmp/kreg-v11-census/census.sh | grep -Fx '#!/usr/bin/env bash'
          bash -n /tmp/kreg-v11-census/census.sh
          chmod 0555 /tmp/kreg-v11-census/census.sh

      - name: Execute uniquely recovered checksum-bound structural census program
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/kreg-v11-census/census.sh

      - name: Seal self-hashed V11 envelope over exact V6 program receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/recovery-receipt.json"
          test -f "$OUT/route-census-summary.json"
          test -f "$OUT/kreg-media-recovery-metadata.json"
          test -f "$OUT/boundary.json"
          test -f "$OUT/kreg-public-original.jpg"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const pretty = (value) => `${JSON.stringify(stable(value), null, 2)}\n`;
          const bytes = (name) => fs.readFileSync(`${out}/${name}`);
          const child = JSON.parse(bytes('recovery-receipt.json'));
          const summary = JSON.parse(bytes('route-census-summary.json'));
          const boundary = JSON.parse(bytes('boundary.json'));
          const proof = JSON.parse(bytes('single-deletion-proof.json'));
          if (child.transaction !== 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V6-CENSUS') throw new Error('child program transaction drifted');
          if (child.exact_main !== process.env.EXACT_MAIN || child.carrier_head !== process.env.HEAD_SHA) throw new Error('child carrier binding drifted');
          if (child.run_id !== Number(process.env.GITHUB_RUN_ID) || child.task_id !== process.env.TASK_ID) throw new Error('child run or task drifted');
          if (summary.route_count !== 18 || summary.attempt_count !== 54) throw new Error('route matrix denominator drifted');
          if (!boundary.public_original_representation_recovered || boundary.visual_review_completed) throw new Error('review boundary drifted');
          if (sha(bytes('kreg-public-original.jpg')) !== process.env.PUBLIC_JPEG_SHA256) throw new Error('public original bytes drifted');
          if (proof.digest_matching_deletions !== 1 || proof.removed_compact_offset_zero_based !== Number(process.env.CORRECTION_COMPACT_OFFSET) || proof.removed_character !== process.env.CORRECTION_CHARACTER) throw new Error('unique correction drifted');
          const envelope = {
            schema_version: 1,
            transaction: 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V11-CENSUS',
            verdict: summary.verdict,
            exact_main: process.env.EXACT_MAIN,
            carrier_head: process.env.HEAD_SHA,
