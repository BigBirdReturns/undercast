            public_original_sha256: process.env.PUBLIC_JPEG_SHA256,
            replayed_program: {
              transaction: child.transaction,
              receipt_file_sha256: sha(bytes('recovery-receipt.json')),
              route_summary_sha256: sha(bytes('route-census-summary.json')),
              metadata_sha256: sha(bytes('kreg-media-recovery-metadata.json')),
              boundary_sha256: sha(bytes('boundary.json'))
            },
            paid_v10: {
              run_id: Number(process.env.V10_RUN),
              job_id: Number(process.env.V10_JOB),
              head: process.env.V10_HEAD,
              workflow_blob: process.env.V10_BLOB,
              artifact_id: Number(process.env.V10_ARTIFACT_ID),
              artifact_sha256: process.env.V10_ARTIFACT_SHA256,
              reason: 'strict byte census proved one extra base64-alphabet character; no route program executed'
            },
            checks: {
              exact_two_commit_carrier: true,
              checkout_matches_immutable_payload_blob: true,
              exhaustive_single_deletion_search: true,
              unique_digest_matching_deletion: true,
              exact_offset_byte_line_column_bound: true,
              gzip_and_script_digests_reproduced: true,
              V10_packet_replayed: true,
              bounded_route_header_matrix_completed: true,
              public_original_representation_converged: true,
              default_webp_derivative_reproduced: true,
              duplicate_adoption_refused: true,
