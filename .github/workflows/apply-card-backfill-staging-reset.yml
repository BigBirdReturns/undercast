name: apply-card-backfill-two-packet-record-breaker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-card-backfill-staging-reset.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-card-backfill-two-packet-record-breaker
  cancel-in-progress: false

env:
  SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || 'agent/card-backfill-next-041' }}
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Replace the 20-packet wait with the discrete record-breaking minimum
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          control_path = Path('.github/CARD-BACKFILL-COHORT.json')
          control = json.loads(control_path.read_text())
          control['staging']['minimum_publication_batch'] = 2
          control['staging']['record_breaker'] = {
              'old_permanent_packets_per_continue': 1,
              'minimum_discrete_improvement': 2,
              'rule': 'Publish once at least two independently accepted packets are staged; retain the 40-packet target and 50-packet ceiling.',
          }
          control['fixed_cost_reset']['publication'] = 'publish immediately at two accepted packets when necessary to beat the serial record; otherwise fill toward the 40-packet target, never exceeding 50'
          control_path.write_text(json.dumps(control, indent=2) + '\n')

          lib_path = Path('scripts/lib/card-backfill-staging.mjs')
          text = lib_path.read_text()
          replacements = [
              (
                  '  if (minimum !== 20 || target !== 40 || maximum !== 50) throw new Error("publication policy must remain 20/40/50");',
                  '  if (!Number.isInteger(minimum) || !Number.isInteger(target) || !Number.isInteger(maximum) || minimum < 2 || target < minimum || maximum < target || maximum > 50) throw new Error("publication policy must remain an ordered 2-50 window");',
              ),
              (
                  '  if (plan.selected_count < 20 || plan.selected_count > 50 || plan.selected_count !== plan.selected?.length) throw new Error(`publication batch must contain 20-50 packets; observed ${plan.selected_count}`);',
                  '  const minimum = Number(plan.policy?.minimum);\n  const maximum = Number(plan.policy?.maximum);\n  if (!Number.isInteger(minimum) || !Number.isInteger(maximum) || plan.selected_count < minimum || plan.selected_count > maximum || plan.selected_count !== plan.selected?.length) throw new Error(`publication batch must contain ${minimum}-${maximum} packets; observed ${plan.selected_count}`);',
              ),
              (
                  '  const recomputed = buildPublicationPlan({ ledger, control: { batch: { minimum: 20, target: 40, maximum: 50 }, staging: { minimum_publication_batch: 20, target_publication_batch: 40, maximum_publication_batch: 50 } }, now: plan.generated_at, limit: plan.policy?.requested_limit });',
                  '  const policy = plan.policy || {};\n  const recomputed = buildPublicationPlan({ ledger, control: { batch: { minimum: policy.minimum, target: policy.target, maximum: policy.maximum }, staging: { minimum_publication_batch: policy.minimum, target_publication_batch: policy.target, maximum_publication_batch: policy.maximum } }, now: plan.generated_at, limit: plan.policy?.requested_limit });',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one staging-library match, observed {count}: {old[:80]}')
              text = text.replace(old, new)
          lib_path.write_text(text)

          fixture_path = Path('scripts/card-backfill-staging-fixtures.mjs')
          fixture = fixture_path.read_text()
          fixture_replacements = [
              ('batch: { minimum: 20, target: 40, maximum: 50 }', 'batch: { minimum: 2, target: 40, maximum: 50 }'),
              ('staging: { minimum_publication_batch: 20, target_publication_batch: 40, maximum_publication_batch: 50 }', 'staging: { minimum_publication_batch: 2, target_publication_batch: 40, maximum_publication_batch: 50 }'),
              ('assert.equal(firstReceipt.publication_window.ready_without_existing_staging, false);', 'assert.equal(firstReceipt.publication_window.ready_without_existing_staging, true);'),
              ('assert.equal(waitPlan.ready, false);', 'assert.equal(waitPlan.ready, true);'),
          ]
          for old, new in fixture_replacements:
              count = fixture.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one staging-fixture match, observed {count}: {old}')
              fixture = fixture.replace(old, new)
          fixture_path.write_text(fixture)

          publication_path = Path('.github/workflows/card-backfill-publication.yml')
          publication = publication_path.read_text()
          old = "description: 'Optional permanent publication size (20-50; blank uses target 40)'"
          new = "description: 'Optional permanent publication size (2-50; blank uses target 40)'"
          if publication.count(old) != 1:
              raise SystemExit('publication input-description anchor drift')
          publication_path.write_text(publication.replace(old, new))

          docs_path = Path('docs/CARD-BACKFILL-COHORTS.md')
          docs = docs_path.read_text()
          docs = docs.replace('twenty to fifty accepted packets', 'two to fifty accepted packets')
          docs = docs.replace('twenty to fifty packets', 'two to fifty packets')
          docs += '\n## Record-breaking publication floor\n\nThe prior serial rate was one permanent packet per continuation. The publication floor is therefore two independently accepted packets: the smallest discrete result that beats the old rate. The system still fills toward forty when accepted inventory is available and never exceeds fifty in one permanent transaction.\n'
          docs_path.write_text(docs)
          PY

          rm -f .github/workflows/apply-card-backfill-staging-reset.yml

      - name: Prove the two-packet floor before publication
        run: |
          set -euo pipefail
          node --check scripts/lib/card-backfill-staging.mjs
          node --check scripts/card-backfill-staging-fixtures.mjs
          node -e "const c=JSON.parse(require('fs').readFileSync('.github/CARD-BACKFILL-COHORT.json','utf8'));if(c.staging.minimum_publication_batch!==2)throw new Error('two-packet floor missing');console.log('two-packet floor: PASS')"
          npm run card-backfill:staging:fixtures
          git diff --check

      - name: Refuse path escape
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/CARD-BACKFILL-COHORT.json',
              '.github/workflows/apply-card-backfill-staging-reset.yml',
              '.github/workflows/card-backfill-publication.yml',
              'docs/CARD-BACKFILL-COHORTS.md',
              'scripts/card-backfill-staging-fixtures.mjs',
              'scripts/lib/card-backfill-staging.mjs',
          }
          raw = subprocess.check_output(['git', 'status', '--porcelain=v1', '-z'])
          actual = {entry[3:].decode('utf-8') for entry in raw.split(b'\0') if entry}
          if actual != expected:
              raise SystemExit(f'changed-path denominator drift; missing={sorted(expected-actual)}; extra={sorted(actual-expected)}')
          print(f'PASS — exact {len(expected)}-path record-breaker transaction')
          PY

      - name: Commit and push the record-breaking floor
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: publish from two accepted packets'
          remote_head=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          test "$remote_head" = "$SOURCE_HEAD"
          git push origin "HEAD:$SOURCE_BRANCH"
