name: card-backfill-amortized-activation

on:
  pull_request:
    branches:
      - agent/card-backfill-next-040
    paths:
      - '.github/workflows/card-backfill-amortized-activation.yml'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-amortized-activation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  activate:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch retained-wave recovery once
        run: |
          set -euo pipefail
          gh workflow run card-backfill-amortized-recovery.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f source_run_id=30593861671 \
            -f model=openai/gpt-4.1-mini
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='card-backfill/retained-wave-recovery' \
            -f description='recovering 140 packetized obligations; rediscovery=0'
          echo 'PASS — retained-wave recovery explicitly dispatched'
          echo 'manual_continue_required=false'
