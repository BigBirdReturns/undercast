name: card-backfill-amortized-activation

on:
  pull_request:
    branches:
      - agent/card-backfill-next-040
    paths:
      - '.github/workflows/card-backfill-amortized-activation.yml'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-amortized-activation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  activate:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch an exact control-loop snapshot
        run: |
          set -euo pipefail
          gh workflow run card-backfill-control-loop-snapshot.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH"
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='card-backfill/control-loop-snapshot' \
            -f description='exact control-loop snapshot dispatched'
          echo 'PASS — exact control-loop snapshot dispatched'
