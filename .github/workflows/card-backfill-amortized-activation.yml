name: card-backfill-validated-recovery-export

on:
  pull_request:
    branches:
      - agent/card-backfill-next-040
    paths:
      - '.github/workflows/card-backfill-amortized-activation.yml'

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: card-backfill-validated-recovery-export-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  export-validated-transaction:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime

      - name: Rebuild and export the exact validated recovery commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-install-local-desk-v2.mjs
          python3 - scripts/card-backfill-local-desk-recover.sh "$RUNNER_TEMP/card-backfill-recovery-export.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8")
          installer_old = "node scripts/card-backfill-install-local-desk.mjs"
          installer_new = "node scripts/card-backfill-install-local-desk-v2.mjs"
          if source.count(installer_old) != 1:
              raise SystemExit("recovery installer seam drift")
          source = source.replace(installer_old, installer_new, 1)

          slash = chr(92)
          stage_old = "git add -A -- " + slash + "\n"
          stage_new = "git add -A -- scripts/card-backfill-amortization-fixtures.mjs " + slash + "\n" + stage_old
          if source.count(stage_old) != 1:
              raise SystemExit("recovery staging seam drift")
          source = source.replace(stage_old, stage_new, 1)

          marker = "remote_head=$(git ls-remote origin"
          index = source.find(marker)
          if index < 0:
              raise SystemExit("recovery push seam drift")
          export_tail = r'''final_head=$(git rev-parse HEAD)
changed="$RUNNER_TEMP/recovery-changed-files.txt"
tree_listing="$RUNNER_TEMP/recovery-tree-ls.txt"
archive="$RUNNER_TEMP/recovery-commit-tree.tar"
metadata="$RUNNER_TEMP/recovery-commit-metadata.txt"
git diff --name-only "$MUTATION_HEAD..$final_head" > "$changed"
test -s "$changed"
: > "$tree_listing"
while IFS= read -r path; do
  git ls-tree "$final_head" -- "$path" >> "$tree_listing"
done < "$changed"
tar -cf "$archive" -T "$changed"
printf 'parent=%s\ncommit=%s\nchanged=%s\n' "$MUTATION_HEAD" "$final_head" "$(wc -l < "$changed")" > "$metadata"
publish_status "$INITIAL_HEAD" success "validated recovery transaction exported; selected=140; accepted=2; rediscovery=0"
SUCCESS=1
echo "PASS — exported validated recovery commit ${final_head}; changed=$(wc -l < "$changed"); branch mutation delegated to Git Data API"
'''
          Path(sys.argv[2]).write_text(source[:index] + export_tail, encoding="utf-8")
          PY
          bash -n "$RUNNER_TEMP/card-backfill-recovery-export.sh"
          bash "$RUNNER_TEMP/card-backfill-recovery-export.sh"
          test -s "$RUNNER_TEMP/recovery-commit-tree.tar"
          test -s "$RUNNER_TEMP/recovery-changed-files.txt"
          test -s "$RUNNER_TEMP/recovery-tree-ls.txt"
          test -s "$RUNNER_TEMP/recovery-commit-metadata.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-validated-recovery-transaction-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recovery-commit-tree.tar
            ${{ runner.temp }}/recovery-changed-files.txt
            ${{ runner.temp }}/recovery-tree-ls.txt
            ${{ runner.temp }}/recovery-commit-metadata.txt
            ${{ runner.temp }}/local-desk-recovery-reduce.log
            ${{ runner.temp }}/lessons-local-desk-validation.json
          if-no-files-found: error
          retention-days: 90
