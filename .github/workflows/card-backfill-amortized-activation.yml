name: card-backfill-amortized-activation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-amortized-activation-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Explicitly activate the unattended campaign supervisor
        run: |
          set -euo pipefail
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f reason=manual-activation
          echo 'PASS — unattended supervisor explicitly activated'
          echo 'manual_continue_required=false'
