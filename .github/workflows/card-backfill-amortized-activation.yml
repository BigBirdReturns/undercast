name: card-backfill-amortized-activation

on:
  pull_request:
    branches:
      - agent/card-backfill-next-040
    paths:
      - '.github/workflows/card-backfill-amortized-activation.yml'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-amortized-activation-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  activate:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Dispatch the first cache-aware, cost-balanced wave
        run: |
          set -euo pipefail
          gh workflow run card-backfill-amortized-wave.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f cohort_limit=40 \
            -f wave_batches=4 \
            -f workers_per_batch=4 \
            -f model=openai/gpt-4.1-mini
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context='card-backfill/amortized-wave' \
            -f description='first cache-aware wave dispatched; awaiting plan'
          echo 'PASS — first amortized wave dispatched without a chat continuation'
          echo 'manual_continue_required=false'
