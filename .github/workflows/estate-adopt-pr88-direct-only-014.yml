name: estate-adopt-pr88-direct-only-014

# Sole canonical-mutation authority for the nine PR #88 direct-only objects.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-pr88-direct-only-014.yml
      - scripts/estate-adopt-pr88-direct-only-014.mjs
      - scripts/estate-run-collect014.sh
      - scripts/estate-run-collect014-v2.sh
      - data/review/estate-debt/COLLECT-001-PR88-OVERLAP.json
      - data/review/estate-debt/COLLECT-014-PR88-DIRECT-ONLY-AUDIT.json
      - data/review/pr88-direct-only/MANIFEST.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-pr88-direct-only-014
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect014-v2.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Install deterministic crop dependency
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1

      - name: Execute PR88 direct-only current-head payment
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-014-pr88-direct-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-014-crop-rows.tsv
            /tmp/COLLECT-014-preflight.json
            /tmp/COLLECT-014-quality-before.json
            /tmp/COLLECT-014-apply.json
            /tmp/COLLECT-014-validation.json
            /tmp/COLLECT-014-tracked-paths.zlist
            /tmp/COLLECT-014-untracked-paths.zlist
            /tmp/COLLECT-014-expected-images.txt
            /tmp/COLLECT-014-candidate.patch
            /tmp/COLLECT-014-candidate.tree
            /tmp/COLLECT-014-promotion.json
            /tmp/COLLECT-014-adoption.patch
            /tmp/COLLECT-014-adoption.tree
            /tmp/COLLECT-014-reconciliation.json
            /tmp/COLLECT-014-publication.patch
            /tmp/COLLECT-014-publication.tree
            data/review/estate-debt/COLLECT-014-PR88-DIRECT-ONLY-AUDIT.json
            data/review/estate-debt/COLLECT-014-PR88-DIRECT-ONLY-RULING.json
            data/review/estate-debt/COLLECT-014-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-014-PUBLICATION.json
            data/review/pr88-direct-only/
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
