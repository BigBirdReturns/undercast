name: estate-adopt-census-tranche

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-census-tranche.yml
      - scripts/estate-adopt-census-tranche.mjs
      - scripts/estate-canonical-adoption-ledger.mjs
      - data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION-PLAN.json
      - data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json
      - data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-census-tranche
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PLAN: data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION-PLAN.json
  RECEIPT: data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION.json
  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head custody
        id: custody
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git rev-parse HEAD)"
          test "$CURRENT_HEAD" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          echo "head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"

      - name: Announce evidence-sized product payment
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 census-selected canonical adoption started on workflow run $GITHUB_RUN_ID.

          Authorized head: ${{ steps.custody.outputs.head }}.
          The estate census found exactly two safe direct adoptions among 45 unpaid packets: UC-054/still and UC-125/still. This transaction adopts all and only that safe set. It does not pad the batch to five, perform discovery, or lower packet review standards.

          The visitor-facing candidate tree will be complete before any COLLECT-005 acceptance receipt or cumulative-ledger mutation exists.
          EOF_COMMENT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove evidence-sized reducer semantics
        run: node scripts/estate-adopt-census-tranche.mjs --fixtures

      - name: Prove prior cumulative ledger
        run: node scripts/estate-canonical-adoption-ledger.mjs

      - name: Capture exact pre-adoption quality
        run: cp data/quality.json /tmp/COLLECT-005-quality-before.json

      - name: Prove census denominator, packet custody, and current null bindings
        run: |
          set -euo pipefail
          node scripts/estate-adopt-census-tranche.mjs --plan "$PLAN" | tee /tmp/COLLECT-005-preflight.json

      - name: Apply all and only census-safe packet winners
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/estate-adopt-census-tranche.mjs \
            --plan "$PLAN" \
            --now "$NOW" \
            --report /tmp/COLLECT-005-apply.json \
            --write
          test ! -e "$RECEIPT"

      - name: Rebuild audit, serving projections, and permanent records
        run: |
          set -euo pipefail
          npm run media:audit -- sync
          node scripts/shard.mjs
          node scripts/build-record-pages.mjs

      - name: Validate exact quality payment before smoke
        run: |
          set -euo pipefail
          node scripts/estate-adopt-census-tranche.mjs \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-005-quality-before.json \
            --validate | tee /tmp/COLLECT-005-validation.json
          test ! -e "$RECEIPT"

      - name: Stage only the product-paying candidate tree
        id: candidate
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
          test -n "$CHANGED"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              data/*|records/*|images/uc-054-still-19b340e06492.webp|images/uc-125-still-893236a2686b.jpg) ;;
              *) echo "Unexpected COLLECT-005 candidate path: $changed_path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          test ! -e "$RECEIPT"
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-005-candidate.patch
          git write-tree > /tmp/COLLECT-005-candidate.tree
          git diff --cached --quiet && { echo 'COLLECT-005 produced no candidate tree.' >&2; exit 1; }
          echo "tree=$(cat /tmp/COLLECT-005-candidate.tree)" >> "$GITHUB_OUTPUT"

      - name: Smoke-gate exact census-selected candidate tree
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(cat /tmp/COLLECT-005-candidate.tree)" = "$(git write-tree)"
          test ! -e "$RECEIPT"
          node scripts/estate-adopt-census-tranche.mjs \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-005-quality-before.json \
            --validate

      - name: Promote receipt and cumulative ledger only after smoke
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CANDIDATE_TREE="$(cat /tmp/COLLECT-005-candidate.tree)"
          node scripts/estate-adopt-census-tranche.mjs \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-005-quality-before.json \
            --receipt "$RECEIPT" \
            --ledger "$LEDGER" \
            --authorized-parent "$AUTHORIZED_HEAD" \
            --gated-tree "$CANDIDATE_TREE" \
            --workflow-run "$GITHUB_RUN_ID" \
            --now "$NOW" \
            --promote | tee /tmp/COLLECT-005-promotion.json
          node scripts/estate-canonical-adoption-ledger.mjs | tee /tmp/COLLECT-005-ledger-validation.json
          git add -- "$RECEIPT" "$LEDGER"
          git diff --exit-code

      - name: Retire one-shot mutation authority
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-adopt-census-tranche.yml scripts/estate-adopt-census-tranche.mjs
          git add -- "$RECEIPT" "$LEDGER"
          PROMOTION_PATHS="$(git diff --cached --name-only "$(cat /tmp/COLLECT-005-candidate.tree)" | sort)"
          EXPECTED_PATHS="$(printf '%s\n%s\n%s\n%s\n' \
            '.github/workflows/estate-adopt-census-tranche.yml' \
            'scripts/estate-adopt-census-tranche.mjs' \
            "$LEDGER" \
            "$RECEIPT" | sort)"
          test "$PROMOTION_PATHS" = "$EXPECTED_PATHS"
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-005-final.patch
          git write-tree > /tmp/COLLECT-005-final.tree

      - name: Refuse stale target publication
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"

      - name: Commit and publish exact gated payment
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          CANDIDATE_TREE="$(cat /tmp/COLLECT-005-candidate.tree)"
          FINAL_TREE="$(cat /tmp/COLLECT-005-final.tree)"
          git commit -m "Estate collection: adopt complete census-safe tranche" \
            -m "transaction=COLLECT-005" \
            -m "batch_adoptions=2" \
            -m "census_safe_denominator=2" \
            -m "arbitrary_batch_size=false" \
            -m "cumulative_adoptions=12" \
            -m "remaining_packet_review=43" \
            -m "complete_pairs_delta=2" \
            -m "missing_still_delta=-2" \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_candidate_tree=${CANDIDATE_TREE}" \
            -m "published_tree=${FINAL_TREE}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report evidence-sized product payment
        if: success()
        run: |
          PUBLISHED_HEAD="$(git rev-parse HEAD)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 passed and published on workflow run $GITHUB_RUN_ID.

          ```text
          published head:          $PUBLISHED_HEAD
          gated candidate tree:    $(cat /tmp/COLLECT-005-candidate.tree)
          published final tree:    $(cat /tmp/COLLECT-005-final.tree)
          safe census denominator: 2
          adopted:                 2
          cumulative adoptions:    12 / 55
          remaining review:        43
          complete pairs:          688 → 690
          missing stills:          378 → 376
          missing both:            109 → 109
          ```

          UC-054/still and UC-125/still are now versioned canonical media. Their proven-wrong historical images remain retained and unbound. The transaction did not pad itself to five: it exhausted the exact safe-direct set, passed the complete gate including rendered-browser checks, appended the receipt and ledger only afterward, published under an exact-head lease, and deleted its one-shot mutation authority.
          EOF_COMMENT

      - name: Report failed product payment
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 failed closed on workflow run $GITHUB_RUN_ID.

          No canonical payment claim is authorized. The cumulative ledger remains 10 adopted and 45 awaiting review unless the post-smoke COLLECT-005 receipt and ledger update were published together. Repair the exact failed custody, quality, gate, or lease boundary without adding unsafe packets merely to reach a larger batch.
          EOF_COMMENT

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-005-census-tranche-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-005-preflight.json
            /tmp/COLLECT-005-apply.json
            /tmp/COLLECT-005-validation.json
            /tmp/COLLECT-005-quality-before.json
            /tmp/COLLECT-005-candidate.patch
            /tmp/COLLECT-005-candidate.tree
            /tmp/COLLECT-005-promotion.json
            /tmp/COLLECT-005-ledger-validation.json
            /tmp/COLLECT-005-final.patch
            /tmp/COLLECT-005-final.tree
            data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json
            data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION-PLAN.json
            data/review/estate-debt/COLLECT-005-CANONICAL-ADOPTION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
