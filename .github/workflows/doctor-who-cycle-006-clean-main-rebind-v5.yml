name: doctor-who-cycle-006-clean-main-rebind-v5

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-006-clean-main-rebind-v5.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-006-clean-main-rebind-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-006-clean-main-rebind-v5.yml
  EXACT_MAIN: 3b4cca5765032ede455803255b3292f43d99fe10
  PRIOR_MAIN: be5db794b9aca7bd74e2a9e6a3d64cb6b3072a17
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-006-clean-main-rebind-v5
  PRIOR_REBIND_RUN: "30984463005"
  PRIOR_REBIND_ARTIFACT: doctor-who-cycle-006-clean-main-rebind-v4-30984463005
  PRIOR_REBIND_RECEIPT_SHA256: 4c517f3def45cb479944f5d210bb8886832feec1d60d07350724700a80efbbad

jobs:
  rebind:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-clean-main-rebind-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact current main and bounded product-neutral drift
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          cat > "$OUT/expected-main-drift.txt" <<'EOF'
          .github/workflows/apply-collection-mode.yml
          data/MEDIA-SEARCH-LATEST.json
          data/journal/media-search.jsonl
          EOF
          git diff --name-only "$PRIOR_MAIN" "$EXACT_MAIN" | LC_ALL=C sort > "$OUT/actual-main-drift.txt"
          diff -u "$OUT/expected-main-drift.txt" "$OUT/actual-main-drift.txt"
          git diff --check "$PRIOR_MAIN" "$EXACT_MAIN"
          ! git diff --name-only "$PRIOR_MAIN" "$EXACT_MAIN" | grep -E '(^|/)(autopilot|waterline|doctor-who|adapter-sdk|specimens|credits|sources|census|media-audit|images)(/|\.|-|$)'
          for path in \
            .github/workflows/doctor-who-cycle-006-clean-main-rebind-v5.yml \
            .ci/doctor-who-cycle-006-v4 \
            .ci/doctor-who-cycle-006-v5 \
            tmp/doctor-who-cycle-006; do
            test ! -e "$path"
          done
          printf 'exact_main=%s\nprior_main=%s\nexact_tree=%s\n' \
            "$EXACT_MAIN" "$PRIOR_MAIN" "$(git rev-parse "${EXACT_MAIN}^{tree}")" \
            > "$OUT/main-identity.txt"

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Download prior exact Kayste rebind packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_REBIND_ARTIFACT }}
          path: ${{ env.OUT }}/prior
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.PRIOR_REBIND_RUN }}

      - name: Rebind prior packet to exact current main
        shell: bash
        run: |
          set -euxo pipefail
          prior="$OUT/prior"
          test -f "$prior/exact-main.txt"
          test -f "$prior/current-main-rebind.json"
          test -f "$prior/current-main-rebind.sha256"
          test "$(cat "$prior/exact-main.txt")" = "$PRIOR_MAIN"
          test "$(cat "$prior/current-main-rebind.sha256")" = "$PRIOR_REBIND_RECEIPT_SHA256"
          test "$(jq -cS . "$prior/current-main-rebind.json" | sha256sum | awk '{print $1}')" = "$PRIOR_REBIND_RECEIPT_SHA256"
          jq -e --arg prior "$PRIOR_MAIN" '
            .exact_main == $prior and
            .lease_issued == false and
            .global_active_count == 0 and
            .task.id == "ap_c8e74653ac0877837814db21" and
            .task.performer == "Dan Starkey" and
            .task.role == "Kayste" and
            .queue.queued == 311 and
            .queue.resolved == 5 and
            .boundary.claim_authorized == true and
            .boundary.queue_mutated == false and
            .boundary.canonical_record_created == false and
            .boundary.media_adopted == false and
            .boundary.cycle_receipt_written == false
          ' "$prior/current-main-rebind.json" >/dev/null
          jq -S \
            --arg current "$EXACT_MAIN" \
            --arg prior "$PRIOR_MAIN" \
            --arg prior_sha "$PRIOR_REBIND_RECEIPT_SHA256" \
            '.version = 6 |
             .exact_main = $current |
             .previous_rebind = {exact_main:$prior, receipt_sha256:$prior_sha} |
             .main_drift = {
               allowed_paths:[".github/workflows/apply-collection-mode.yml","data/MEDIA-SEARCH-LATEST.json","data/journal/media-search.jsonl"],
               doctor_who_semantic_drift:false
             } |
             .boundary.claim_authorized = true |
             .boundary.queue_mutated = false |
             .boundary.canonical_record_created = false |
             .boundary.media_adopted = false |
             .boundary.cycle_receipt_written = false' \
            "$prior/current-main-rebind.json" > "$OUT/current-main-rebind.json"
          jq -cS . "$OUT/current-main-rebind.json" | sha256sum | awk '{print $1}' > "$OUT/current-main-rebind.sha256"
          printf '%s\n' "$EXACT_MAIN" > "$OUT/exact-main.txt"

      - name: Prove rolling Doctor Who custody and complete gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs validate | tee "$OUT/autopilot-validate.log"
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > "$OUT/readiness.json"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/status.json"
          node scripts/waterline.mjs validate --scope doctor-who | tee "$OUT/waterline.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/media-gate.log"
          node scripts/doctor-who-cycle-004-still-correction.mjs | tee "$OUT/cycle-004.log"
          node scripts/doctor-who-cycle-005.mjs | tee "$OUT/cycle-005.log"
          node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile text-vision --limit 200 --json > "$OUT/current-candidates.json"
          jq -e '.in_flight == 0 and .statuses.queued == 311 and .statuses.resolved == 5' "$OUT/status.json" >/dev/null
          jq -e '.compatible[0].task_id == "ap_c8e74653ac0877837814db21"' "$OUT/current-candidates.json" >/dev/null
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Record read-only terminal boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg exact "$EXACT_MAIN" \
            --arg prior "$PRIOR_MAIN" \
            '{version:1,exact_main:$exact,prior_main:$prior,lease_issued:false,queue_mutated:false,canonical_record_created:false,media_adopted:false,cycle_receipt_written:false,product_published:false}' \
            > "$OUT/boundary.json"
          test -z "$(git status --porcelain)"

      - name: Upload exact current-main rebind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-clean-main-rebind-v5-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
