name: doctor-who-cycle-012-selection-cleanup-writer-v7

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-evidence-v7]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v7
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'doctor-who-cycle-012-selection-cleanup-evidence-v7' &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V1_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      V3_MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      V4_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      V5_MAIN: 108ea5f461ceb24d9253f246e7d88fc8ca8d74bb
      V6_MAIN: 9bee98eaaddfb91f71c9a9044e40292fc30cf6b1
      INSTALL_PARENT: 9bee98eaaddfb91f71c9a9044e40292fc30cf6b1
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      WRITER_V5: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
      WRITER_V6: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml
      WRITER_V7: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-evidence-v7
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v7
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-evidence-v7-
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v7
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_DATE: 2026-08-11T01:40:00Z
      CLEANUP_MESSAGE: Doctor Who cycle 012 preselection transport cleanup V7
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v7-loader
      V4_CARRIER_BLOB: d102afad855240ecfea45ae0b9e6f534e10ad01a
      V4_CARRIER_GZIP_BYTES: "5371"
      V4_CARRIER_GZIP_SHA256: 4593f99e19a21b55174688f847a0e1b558570580be6fae195a4b0747c2ca434e
      V4_CARRIER_BYTES: "21756"
      V4_CARRIER_SHA256: 672bb074f1e50e272e1a3115882b0acc9bda42a0bab5e8c0b8ecf32c082aac04
      V7_CARRIER_BYTES: "22406"
      V7_CARRIER_SHA256: a829dcc3d4a871c25364d97ce7d12e292add6ab10fc10b32484eb7574a5ff482

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Derive and execute exact cycle 012 cleanup writer V7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V4_CARRIER_BLOB" > "$LOADER/v4-blob.json"
          jq -r '.content' "$LOADER/v4-blob.json" | tr -d '\n' | base64 -d > "$LOADER/v4-carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/v4-carrier.sh.gz")" = "$V4_CARRIER_BLOB"
          test "$(wc -c < "$LOADER/v4-carrier.sh.gz" | tr -d ' ')" = "$V4_CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/v4-carrier.sh.gz" | awk '{print $1}')" = "$V4_CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/v4-carrier.sh.gz" > "$LOADER/v4-carrier.sh"
          test "$(wc -c < "$LOADER/v4-carrier.sh" | tr -d ' ')" = "$V4_CARRIER_BYTES"
          test "$(sha256sum "$LOADER/v4-carrier.sh" | awk '{print $1}')" = "$V4_CARRIER_SHA256"
          cat > "$LOADER/transform.py" <<'PY'
          from pathlib import Path
          import re
          import os
          src=Path(os.environ['IN']).read_text()

          old='''installed="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$installed"
          test "$(git show -s --format=%P "$installed")" = "$INSTALL_PARENT"
          test "$(git show -s --format=%P "$INSTALL_PARENT")" = "$V1_MAIN"
          test "$(git show -s --format=%P "$V1_MAIN")" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN".."$installed")" = 3
          test -z "$(git rev-list --merges "$BASE_MAIN".."$installed")"
          test "$(git show -s --format=%T "$BASE_MAIN")" = "$BASE_TREE"
          git diff --name-status "$BASE_MAIN" "$installed" | LC_ALL=C sort > "$OUT/logs/installed.tsv"
          printf 'A\\t%s\\nA\\t%s\\nA\\t%s\\n' "$WRITER_V1" "$WRITER_V3" "$WRITER_V4" | LC_ALL=C sort > "$OUT/logs/expected-installed.tsv"
          cmp "$OUT/logs/installed.tsv" "$OUT/logs/expected-installed.tsv"'''
          new='''installed="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD)" = "$installed"
          test "$(git show -s --format=%P "$installed")" = "$V6_MAIN"
          test "$(git show -s --format=%P "$V6_MAIN")" = "$V5_MAIN"
          test "$(git show -s --format=%P "$V5_MAIN")" = "$V4_MAIN"
          test "$(git show -s --format=%P "$V4_MAIN")" = "$V3_MAIN"
          test "$(git show -s --format=%P "$V3_MAIN")" = "$V1_MAIN"
          test "$(git show -s --format=%P "$V1_MAIN")" = "$BASE_MAIN"
          test "$INSTALL_PARENT" = "$V6_MAIN"
          test "$(git rev-list --count "$BASE_MAIN".."$installed")" = 6
          test -z "$(git rev-list --merges "$BASE_MAIN".."$installed")"
          test "$(git show -s --format=%T "$BASE_MAIN")" = "$BASE_TREE"
          git diff --name-status "$BASE_MAIN" "$installed" | LC_ALL=C sort > "$OUT/logs/installed.tsv"
          printf 'A\\t%s\\nA\\t%s\\nA\\t%s\\nA\\t%s\\nA\\t%s\\nA\\t%s\\n' "$WRITER_V1" "$WRITER_V3" "$WRITER_V4" "$WRITER_V5" "$WRITER_V6" "$WRITER_V7" | LC_ALL=C sort > "$OUT/logs/expected-installed.tsv"
          cmp "$OUT/logs/installed.tsv" "$OUT/logs/expected-installed.tsv"'''
          assert src.count(old)==1
          src=src.replace(old,new)

          src=src.replace('import json\nimport os\nfrom pathlib import Path\n\nroot = Path(os.environ[\'OUT\']) / \'api\'',
                          'import json\nimport os\nimport subprocess\nfrom pathlib import Path\n\nroot = Path(os.environ[\'OUT\']) / \'api\'',1)
          old='''matched_prs = [
              row for row in prs
              if row['head']['ref'] == os.environ['SOURCE_BRANCH']
              and row['head']['sha'] == os.environ['SOURCE_HEAD']
          ]
          assert len(matched_prs) == 1
          pr = matched_prs[0]
          assert pr['draft'] is True and pr['merged_at'] is None
          assert pr['base']['ref'] == 'main'
          assert pr['base']['sha'] == os.environ['INSTALLED_MAIN']
          assert pr['commits'] == 1 and pr['changed_files'] == 1

          (root / 'source-job.txt').write_text(str(matched_jobs[0]['id']) + '\\n')
          (root / 'evidence-artifact.txt').write_text(str(matched_artifacts[0]['id']) + '\\n')
          (root / 'source-pr.txt').write_text(str(pr['number']) + '\\n')'''
          new='''matched_prs = [
              row for row in prs
              if row['head']['ref'] == os.environ['SOURCE_BRANCH']
              and row['head']['sha'] == os.environ['SOURCE_HEAD']
          ]
          assert len(matched_prs) == 1
          summary = matched_prs[0]
          pr = json.loads(subprocess.check_output([
              'gh','api',f'/repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{summary["number"]}'
          ], text=True))
          assert pr['head']['ref'] == os.environ['SOURCE_BRANCH'] and pr['head']['sha'] == os.environ['SOURCE_HEAD']
          assert pr['state'] == 'open' and pr['draft'] is True and pr['merged'] is False and pr['merged_at'] is None
          assert pr['base']['ref'] == 'main' and pr['base']['sha'] == os.environ['INSTALLED_MAIN']
          assert pr['commits'] == 1 and pr['changed_files'] == 1

          (root / 'source-job.txt').write_text(str(matched_jobs[0]['id']) + '\\n')
          (root / 'evidence-artifact.txt').write_text(str(matched_artifacts[0]['id']) + '\\n')
          (root / 'source-pr.txt').write_text(str(pr['number']) + '\\n')'''
          assert src.count(old)==1
          src=src.replace(old,new)

          src=src.replace("assert evidence['status'] == 'cycle-012-selection-cleanup-evidence-v4'", "assert evidence['status'] == 'cycle-012-selection-cleanup-evidence-v7'",1)
          old='''assert evidence['canonical'] == {
              'base_main': os.environ['BASE_MAIN'],
              'v1_installation': os.environ['V1_MAIN'],
              'installation_parent': os.environ['INSTALL_PARENT'],
              'installed_main': os.environ['INSTALLED_MAIN'],
              'base_tree': os.environ['BASE_TREE'],
              'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V3'], os.environ['WRITER_V4']],
          }'''
          new='''assert evidence['canonical'] == {
              'base_main': os.environ['BASE_MAIN'],
              'v1_installation': os.environ['V1_MAIN'],
              'v3_installation': os.environ['V3_MAIN'],
              'v4_installation': os.environ['V4_MAIN'],
              'v5_installation': os.environ['V5_MAIN'],
              'v6_installation': os.environ['V6_MAIN'],
              'installation_parent': os.environ['INSTALL_PARENT'],
              'installed_main': os.environ['INSTALLED_MAIN'],
              'base_tree': os.environ['BASE_TREE'],
              'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V3'], os.environ['WRITER_V4'], os.environ['WRITER_V5'], os.environ['WRITER_V6'], os.environ['WRITER_V7']],
          }'''
          assert src.count(old)==1
          src=src.replace(old,new)

          old='''required = {
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v1',
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v2',
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v2-install',
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v3',
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v4',
              'agent/doctor-who-cycle-012-preflight-v13',
              'agent/doctor-who-cycle-012-senstarg-evidence-v2',
              'observer/doctor-who-cycle-012-selection-evidence-v1',
              'observer/doctor-who-cycle-012-senstarg-evidence-v4',
              'observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3',
              'observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4',
              os.environ['SOURCE_BRANCH'],
          }
          assert required <= ref_names, sorted(required - ref_names)'''
          new='''required = {
              'agent/doctor-who-cycle-012-selection-cleanup-writer-v7',
              'agent/doctor-who-cycle-012-preflight-v13',
              'agent/doctor-who-cycle-012-senstarg-evidence-v2',
              'observer/doctor-who-cycle-012-selection-evidence-v1',
              'observer/doctor-who-cycle-012-senstarg-evidence-v4',
              os.environ['SOURCE_BRANCH'],
          }
          assert required <= ref_names, sorted(required - ref_names)'''
          assert src.count(old)==1
          src=src.replace(old,new)
          src=src.replace("assert agent_count >= 26 and observer_count >= 3 and terminal_observer_count == 2 and len(refs) >= 31",
                          "assert agent_count >= 3 and observer_count >= 2 and terminal_observer_count >= 0 and len(refs) >= 5",1)

          src=src.replace("'status': 'cycle-012-selection-cleanup-complete-v4'", "'status': 'cycle-012-selection-cleanup-complete-v7'",1)
          src=src.replace("'version': 4,", "'version': 7,",1)
          old='''        'base_main': os.environ['BASE_MAIN'],
                  'v1_installation': os.environ['V1_MAIN'],
                  'installation_parent': os.environ['INSTALL_PARENT'],
                  'installed_main': os.environ['INSTALLED_MAIN'],'''
          new='''        'base_main': os.environ['BASE_MAIN'],
                  'v1_installation': os.environ['V1_MAIN'],
                  'v3_installation': os.environ['V3_MAIN'],
                  'v4_installation': os.environ['V4_MAIN'],
                  'v5_installation': os.environ['V5_MAIN'],
                  'v6_installation': os.environ['V6_MAIN'],
                  'installation_parent': os.environ['INSTALL_PARENT'],
                  'installed_main': os.environ['INSTALLED_MAIN'],'''
          assert src.count(old)==1
          src=src.replace(old,new)

          Path(os.environ['OUTFILE']).write_text(src)
          PY
          python3 -m py_compile "$LOADER/transform.py"
          IN="$LOADER/v4-carrier.sh" OUTFILE="$LOADER/carrier.sh" python3 "$LOADER/transform.py"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$V7_CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$V7_CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==6
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-writer-v7-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v7/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v7
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v7-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
