name: doctor-who-cycle-008-kreg-v1-payload-recovery-v3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-v1-payload-recovery-v3.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-008-kreg-v1-payload-recovery-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-v1-payload-recovery-v3.yml
  ROOT_MAIN: ceca35cd4456c9e948de2e0a3c30a78d81a88c7e
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-v1-payload-recovery-v3
  V1_BLOB: 06d2eed93b9e2a03b4d23dcaf6f82e0c131df498
  V1_TEXT_SHA256: 614bda7dd19ad5934c773a607a7d0ceb674efff66a7ce8d62eb287e4156ed83d
  V1_GZIP_SHA256: 3a395fc2194fe207f32eb393b7680be6658875e8114aebb2c6210dd180b80504
  ENV_SHA256: c8483b7d1226731a5e1a1e9879e2caa53cb8a7b23bc0d294f827871188be3871
  MANIFEST_SHA256: b96979efed799976096f0bc4f94fc9a74116e25319bf16859d3a6ab3cd29fed9
  MATERIALIZER_SHA256: ce40bf80c3d1ebcafd729f834fe04b52b24da29abef00403110c09a68ab4e274
  RUNNER_SHA256: 72c911f8be1b2fa0bdc9ec88b914ddec3be0379408bf3435e2cde82a4167a44d
  OUT: /tmp/doctor-who-cycle-008-kreg-v1-payload-recovery-v3
  GH_TOKEN: ${{ github.token }}

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-v1-payload-recovery-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-commit descendant-safe carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/extracted"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$HEAD_BRANCH" = "$AUTHORIZED_BRANCH"
          test "$(git show -s --format=%P HEAD)" = "$ROOT_MAIN"
          test "$(git rev-list --count "$ROOT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$ROOT_MAIN" HEAD)" = "$ROOT_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$ROOT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          live_main="$(git rev-parse refs/remotes/origin/main)"
          test "$(git merge-base "$ROOT_MAIN" "$live_main")" = "$ROOT_MAIN"
          git diff --name-only "$ROOT_MAIN"..."$live_main" | LC_ALL=C sort > "$OUT/live-main-delta-paths.txt"
          ! grep -Fx "$SELF" "$OUT/live-main-delta-paths.txt" >/dev/null
          git diff --quiet
          git diff --cached --quiet
          printf '%s\n' "$live_main" > "$OUT/live-main.txt"
          printf 'head=%s\nroot_main=%s\nlive_main=%s\ncarrier_tree=%s\n' \
            "$HEAD_SHA" "$ROOT_MAIN" "$live_main" "$(git rev-parse 'HEAD^{tree}')" \
            > "$OUT/carrier-identity.txt"

      - name: Recover and verify immutable V1 Git blob
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${V1_BLOB}" > "$OUT/v1-blob.json"
          jq -e --arg blob "$V1_BLOB" '.sha==$blob and .encoding=="base64"' "$OUT/v1-blob.json" >/dev/null
          jq -r '.content' "$OUT/v1-blob.json" | tr -d '\n' | base64 --decode > "$OUT/kreg-candidate-v1-payload.tar.gz.b64"
          test "$(git hash-object "$OUT/kreg-candidate-v1-payload.tar.gz.b64")" = "$V1_BLOB"
          test "$(sha256sum "$OUT/kreg-candidate-v1-payload.tar.gz.b64" | awk '{print $1}')" = "$V1_TEXT_SHA256"
          base64 --decode "$OUT/kreg-candidate-v1-payload.tar.gz.b64" > "$OUT/kreg-candidate-v1-payload.tar.gz"
          test "$(sha256sum "$OUT/kreg-candidate-v1-payload.tar.gz" | awk '{print $1}')" = "$V1_GZIP_SHA256"
          PAYLOAD_ARCHIVE="$OUT/kreg-candidate-v1-payload.tar.gz" PAYLOAD_TARGET="$OUT/extracted" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ['PAYLOAD_ARCHIVE'])
          target = pathlib.Path(os.environ['PAYLOAD_TARGET'])
          expected = ['env.sh', 'manifest.json', 'materialize.py', 'runner.sh']
          rows = []
          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              names = [member.name for member in members]
              if names != expected or len(names) != len(set(names)):
                  raise SystemExit(f'payload member set drifted: {names!r}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe payload member: {member.name}')
              tf.extractall(target)
          for path in sorted(target.iterdir()):
              data = path.read_bytes()
              rows.append({'path': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          report = {
              'archive_bytes': archive.stat().st_size,
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'member_count': len(rows),
              'members': rows,
              'executed': False,
          }
          (target.parent / 'payload-inspection.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          test "$(sha256sum "$OUT/extracted/env.sh" | awk '{print $1}')" = "$ENV_SHA256"
          test "$(sha256sum "$OUT/extracted/manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(sha256sum "$OUT/extracted/materialize.py" | awk '{print $1}')" = "$MATERIALIZER_SHA256"
          test "$(sha256sum "$OUT/extracted/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          sha256sum "$OUT"/kreg-candidate-v1-payload.tar.gz* "$OUT"/extracted/* > "$OUT/SHA256SUMS"
          printf 'v1_blob=%s\nv1_text_sha256=%s\nv1_gzip_sha256=%s\n' \
            "$V1_BLOB" "$V1_TEXT_SHA256" "$V1_GZIP_SHA256" > "$OUT/v1-identity.txt"

      - name: Rebind unchanged live main after recovery
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$(cat "$OUT/live-main.txt")"
          git diff --quiet
          git diff --cached --quiet

      - name: Upload exact V1 recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v1-payload-recovery-v3-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
