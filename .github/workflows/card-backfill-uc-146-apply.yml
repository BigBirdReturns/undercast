name: card-backfill-uc-146-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-146-APPLY.json"
      - "scripts/card-backfill-uc-146-apply.part-00.mjs"
      - "scripts/card-backfill-uc-146-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-146-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-146-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-032'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-032
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-146 portrait packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-146-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-146');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-146');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_c4167741dd920f9d90aad34a');
          if(row.version!==1||row.record_id!=='UC-146'||row.actor!=='Tim Rose'||row.character!=='Admiral Ackbar / Salacious B. Crumb'||row.production!=='Return of the Jedi'||row.years!=='1983–2019'||row.side!=='portrait'||row.reviewed_role!=='second-desk')throw new Error('UC-146 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8709951246||row.render_artifact?.head_sha!=='33f3c003f836292abe29b82215ca7d1a7d0bf611'||row.render_artifact?.zip_sha256!=='bfef5a56b443bfcbd3eb6350287b62f3f617a2fe1c5586d2ff53d7327ceee431')throw new Error('UC-146 render custody drift');
          if(row.expected?.selected_source?.sha256!=='76ed05827a4175c0443b6b6aa1a031832a2ceabb43b2557e8e0f04aee485eefc'||row.expected?.alternative_source?.sha256!=='7d850403d4313f35ff0cf8e265ac480707a5c99b03671d667cd25f776a3d01a2')throw new Error('UC-146 portrait source authorization drift');
          if(row.expected?.exact_portrait_record?.sha256!=='6b4ff11644ad859afa8a4ab1e21afe0be53aeb779f685b03020758e46cbf8e50'||row.expected?.candidate?.sha256!=='7c83cea2474d7a6a06aea6b68760b5c63a226787d853063ea75fb4345ba034be'||row.expected?.crop_preview?.sha256!=='bb0347ad428614e5c38bfdf24d86764d36c6b2338527e72f8484965f0474dd07')throw new Error('UC-146 candidate or portrait authorization drift');
          if(row.expected?.packet_file_count!==17||row.expected?.duplicate_item_count!==4||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.discovery_candidate_count!==2||row.expected?.failed_discovery_checkpoint_count!==2||row.expected?.strict_identity_page_count!==2||row.expected?.reference_only_identity_page_count!==2)throw new Error('UC-146 packet denominator drift');
          if(row.ruling?.identity!=='expected-person'||row.ruling?.presentation!=='untransformed-performer-portrait'||row.ruling?.crop_ruling!=='pass-centered-contain-portrait-layout'||row.ruling?.collision_ruling!=='pass-disambiguated-tim-rose-actor-identity'||row.ruling?.character_separation_ruling!=='pass-portrait-separated-from-existing-character-still'||row.ruling?.canonical_mutation!==false)throw new Error('UC-146 ruling drift');
          if(!specimen||specimen.actor!=='Tim Rose'||specimen.character!=='Admiral Ackbar / Salacious B. Crumb'||specimen.production!=='Return of the Jedi'||specimen.years!=='1983–2019'||specimen.portrait||specimen.still?.src!=='images/uc-146-still.jpg')throw new Error('UC-146 specimen boundary drift');
          if(source?.portrait)throw new Error('UC-146 source-ledger portrait boundary drift');
          if(!audit||audit.wall_id!=='UC-146'||audit.side!=='portrait'||audit.status!=='absent'||audit.asset)throw new Error('UC-146 audit boundary drift');
          console.log(`PASS — UC-146 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8709951246/zip" > "$root/render.zip"
          echo "bfef5a56b443bfcbd3eb6350287b62f3f617a2fe1c5586d2ff53d7327ceee431  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-146"
          test -f "$base/manifest.json"
          echo "e95d06140c2dd4f17d9b4a6de62982ed099279bb9a1b7e80b57de6f30576fc5f  $base/manifest.json" | sha256sum -c -
          echo "eb849b97dd20c8a7b831cb78572216410091b9fd785206d235dcd2c7af582513  $base/duplicate-scan.json" | sha256sum -c -
          echo "639824201018e936760f34ecaa87eb9907f5b170d3558c9f50a09c3501966118  $base/review.json" | sha256sum -c -
          echo "0b7d17bf6204f69e5046138e1bd48743d9c1fd519f0eca43dbb7001802d1e2fe  $base/review.md" | sha256sum -c -
          echo "4147dcb3ec2c6416bccc1ee4e439e5ccadbc412e150c9cb4b452c4d2ffa7bc3b  $base/SHA256SUMS" | sha256sum -c -
          echo "6b4ff11644ad859afa8a4ab1e21afe0be53aeb779f685b03020758e46cbf8e50  $base/exact-portrait-record.json" | sha256sum -c -
          echo "76ed05827a4175c0443b6b6aa1a031832a2ceabb43b2557e8e0f04aee485eefc  $base/tim-rose-original.jpg" | sha256sum -c -
          echo "7d850403d4313f35ff0cf8e265ac480707a5c99b03671d667cd25f776a3d01a2  $base/tim-rose-alternative-celebration-europe-ii.jpg" | sha256sum -c -
          echo "fe3b83a5701471a3d23ff0481b08d6624e1b9164ee9c16a8e3738baa6fa44197  $base/source-api-commons-phoenix-2016.json" | sha256sum -c -
          echo "47f204ad1d0a77386c683e3b52a56ca15405e03c28ef11403db68321ab338208  $base/source-api-commons-celebration-europe-ii.json" | sha256sum -c -
          echo "268a9d85684b17cba3931697ec14946f31f1a59f34858d981b6088691d8beec7  $base/source-page-commons-category-timothy-m-rose.png" | sha256sum -c -
          echo "731a481c3d2d5617366f408c97b050354f941042212f1ec439162ecd8843b5a0  $base/source-page-commons-phoenix-2016.png" | sha256sum -c -
          echo "8e1abd846182645a15fd7675df80ddbd8d8b38263b70e62315952d4733a7cd94  $base/source-page-commons-celebration-europe-ii.png" | sha256sum -c -
          echo "f7fc882f85cdce36dc2882b212926394f615ba2499cf3dba32cc872553d6b00a  $base/source-page-wikipedia-tim-rose-actor.png" | sha256sum -c -
          echo "2f4c253a1d73734f6a8575fc78e1e6527a8aae42ba048cf66f380bec246a4cb0  $base/source-page-mediamikes-tim-rose-interview.png" | sha256sum -c -
          echo "7c83cea2474d7a6a06aea6b68760b5c63a226787d853063ea75fb4345ba034be  $base/uc-146-portrait-candidate.jpg" | sha256sum -c -
          echo "bb0347ad428614e5c38bfdf24d86764d36c6b2338527e72f8484965f0474dd07  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30415348678
          artifact_id=8709951246
          artifact_name=card-backfill-uc-146-render-30415348678
          artifact_zip_sha256=bfef5a56b443bfcbd3eb6350287b62f3f617a2fe1c5586d2ff53d7327ceee431
          artifact_head_sha=33f3c003f836292abe29b82215ca7d1a7d0bf611
          source_manifest_sha256=e95d06140c2dd4f17d9b4a6de62982ed099279bb9a1b7e80b57de6f30576fc5f
          source_sums_sha256=4147dcb3ec2c6416bccc1ee4e439e5ccadbc412e150c9cb4b452c4d2ffa7bc3b
          EOF
      - name: Materialize and independently validate the evidence-only portrait packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-146-apply/source/output/UC-146
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-apply"
          cat scripts/card-backfill-uc-146-apply.part-00.mjs scripts/card-backfill-uc-146-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-146');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-146');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_c4167741dd920f9d90aad34a');
          if(!specimen||specimen.portrait||specimen.still?.src!=='images/uc-146-still.jpg')throw new Error('UC-146 specimen was canonically mutated');
          if(source?.portrait)throw new Error('UC-146 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-146'||audit.side!=='portrait'||audit.status!=='absent'||audit.asset)throw new Error('UC-146 audit disposition was canonically mutated');
          console.log('PASS — UC-146 portrait remains canonically absent; existing character still remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-146.json \
            .github/CARD-BACKFILL-UC-146-DISCOVER.json \
            .github/CARD-BACKFILL-UC-146-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-146-RENDER.json \
            .github/CARD-BACKFILL-UC-146-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-146-scope.yml \
            .github/workflows/card-backfill-uc-146-discover.yml \
            .github/workflows/card-backfill-uc-146-render.yml \
            .github/workflows/card-backfill-uc-146-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-146-scope.mjs \
            scripts/card-backfill-uc-146-discover.mjs \
            scripts/card-backfill-uc-146-discover-repair.py \
            scripts/card-backfill-uc-146-render.part-00.mjs \
            scripts/card-backfill-uc-146-render.part-01.mjs \
            scripts/card-backfill-uc-146-apply.part-00.mjs \
            scripts/card-backfill-uc-146-apply.part-01.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-146 Tim Rose portrait'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-031
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-031 HEAD)
          test "${#changed[@]}" -eq 17
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-146/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent portrait candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-146-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-032
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-146-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-146-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-146-apply
            data/review/card-backfill/UC-146
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
