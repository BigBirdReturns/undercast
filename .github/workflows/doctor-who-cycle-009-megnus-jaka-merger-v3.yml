name: doctor-who-cycle-009-megnus-jaka-merger-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-merger-v3
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-merger-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v3
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v3.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3
      SOURCE_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-source
      SOURCE_COMMIT: 2505d5e73227722b47ad995056cb832ead7e21ea
      SOURCE_BLOB: 9569ffeb46a4cf3d420a2d66caa1db83a365ee94
      SOURCE_SHA256: 8f8846250515d704e6c4cf972549ba9309fbb0727b0df905471bd52edf3f7114
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v2.yml
      WRAPPER_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      WRAPPER_PR_NUMBER: ${{ github.event.pull_request.number }}
      WRAPPER_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V2 guardian and patch one stale publisher-name assertion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"/{api,receipt}
          test "$(git rev-parse HEAD)" = "$WRAPPER_PR_HEAD"
          test "$WRAPPER_PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$SOURCE_ROOT/api/source-content.json"
          test "$(jq -r .sha "$SOURCE_ROOT/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$SOURCE_ROOT/api/source-blob.json"
          jq -r .content "$SOURCE_ROOT/api/source-blob.json" | tr -d '\n' | base64 -d > "$SOURCE_ROOT/source-v2.yml"
          test "$(git hash-object "$SOURCE_ROOT/source-v2.yml")" = "$SOURCE_BLOB"
          test "$(sha256sum "$SOURCE_ROOT/source-v2.yml" | cut -d' ' -f1)" = "$SOURCE_SHA256"

          ruby -ryaml -rjson - "$SOURCE_ROOT/source-v2.yml" "$SOURCE_ROOT/source-env.json" "$SOURCE_ROOT" <<'RB'
          source, env_out, root = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          verify = doc.dig('jobs', 'verify')
          raise 'exact V2 verify job missing' unless verify.is_a?(Hash)
          names = [
            'Bind exact guardian and publication receipt',
            'Bind exact workflow-free product and required checks',
            'Rerun permanent and rendered product gates',
            'Seal code-free exact fast-forward settlement',
          ]
          steps = verify.fetch('steps')
          programs = names.map do |name|
            row = steps.find { |step| step['name'] == name }
            raise "missing exact V2 step #{name}" unless row && row['run'].is_a?(String)
            row['run']
          end
          File.write(env_out, JSON.generate(verify.fetch('env')))
          programs.each_with_index { |program, index| File.write(File.join(root, "verify-#{index + 1}.sh"), program) }
          RB

          ROOT="$SOURCE_ROOT" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          first=root/'verify-1.sh'
          text=first.read_text()
          replacements={
            "head='${{ github.event.pull_request.head.sha }}'": 'head="$WRAPPER_PR_HEAD"',
            "pr='${{ github.event.pull_request.number }}'": 'pr="$WRAPPER_PR_NUMBER"',
            "test '${{ github.event.pull_request.base.sha }}' = \"$EXPECTED_MAIN\"": 'test "$WRAPPER_PR_BASE_SHA" = "$EXPECTED_MAIN"',
            "run['name']=='doctor-who-cycle-009-megnus-jaka-final-publisher-v1'": "run['name']=='doctor-who-cycle-009-megnus-jaka-final-publisher-v2'",
          }
          for old,new in replacements.items():
              assert text.count(old)==1, old
              text=text.replace(old,new)
          first.write_text(text)
          for path in sorted(root.glob('verify-*.sh')):
              assert '${{' not in path.read_text(), path
          env=json.loads((root/'source-env.json').read_text())
          excluded={'GH_TOKEN','BRANCH','SELF','OUT'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
              fh.write(f'BRANCH={os.environ["BRANCH"]}\n')
              fh.write(f'SELF={os.environ["SELF"]}\n')
              fh.write(f'OUT={os.environ["OUT"]}\n')
          PY
          for script in "$SOURCE_ROOT"/verify-*.sh; do bash -n "$script"; done
          sha256sum "$SOURCE_ROOT"/source-v2.yml "$SOURCE_ROOT"/verify-*.sh > "$SOURCE_ROOT/receipt/programs.sha256"

      - name: Execute exact recovered publication binding
        shell: bash
        run: bash "$SOURCE_ROOT/verify-1.sh"

      - name: Execute exact recovered product binding
        shell: bash
        run: bash "$SOURCE_ROOT/verify-2.sh"

      - name: Execute exact recovered permanent and rendered gates
        shell: bash
        run: bash "$SOURCE_ROOT/verify-3.sh"

      - name: Execute exact recovered settlement seal
        shell: bash
        run: bash "$SOURCE_ROOT/verify-4.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v3-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3
            /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  fast_forward:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-writer-source
      SOURCE_COMMIT: 2505d5e73227722b47ad995056cb832ead7e21ea
      SOURCE_BLOB: 9569ffeb46a4cf3d420a2d66caa1db83a365ee94
      SOURCE_SHA256: 8f8846250515d704e6c4cf972549ba9309fbb0727b0df905471bd52edf3f7114
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v2.yml
      SETTLEMENT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-settlement
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-merge

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v3-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-settlement

      - name: Recover exact isolated V2 writer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE_ROOT" && mkdir -p "$SOURCE_ROOT/api"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$SOURCE_ROOT/api/source-content.json"
          test "$(jq -r .sha "$SOURCE_ROOT/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$SOURCE_ROOT/api/source-blob.json"
          jq -r .content "$SOURCE_ROOT/api/source-blob.json" | tr -d '\n' | base64 -d > "$SOURCE_ROOT/source-v2.yml"
          test "$(git hash-object "$SOURCE_ROOT/source-v2.yml")" = "$SOURCE_BLOB"
          test "$(sha256sum "$SOURCE_ROOT/source-v2.yml" | cut -d' ' -f1)" = "$SOURCE_SHA256"
          ruby -ryaml -rjson - "$SOURCE_ROOT/source-v2.yml" "$SOURCE_ROOT/source-env.json" "$SOURCE_ROOT/writer.sh" <<'RB'
          source, env_out, run_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          job = doc.dig('jobs', 'fast_forward')
          raise 'exact V2 fast_forward job missing' unless job.is_a?(Hash)
          row = job.fetch('steps').find { |step| step['name'] == 'Reverify settlement and non-forcedly fast-forward main' }
          raise 'exact V2 writer program missing' unless row && row['run'].is_a?(String)
          File.write(env_out, JSON.generate(job.fetch('env')))
          File.write(run_out, row['run'])
          RB
          ROOT="$SOURCE_ROOT" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          script=root/'writer.sh'
          assert '${{' not in script.read_text()
          env=json.loads((root/'source-env.json').read_text())
          excluded={'GH_TOKEN','SETTLEMENT','OUT'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
              fh.write(f'SETTLEMENT={os.environ["SETTLEMENT"]}\n')
              fh.write(f'OUT={os.environ["OUT"]}\n')
          PY
          bash -n "$SOURCE_ROOT/writer.sh"

      - name: Execute exact isolated non-forced fast-forward
        shell: bash
        run: bash "$SOURCE_ROOT/writer.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v3-merge-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-merge
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v3-merge-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-merge
            /tmp/doctor-who-cycle-009-megnus-jaka-merger-v3-writer-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
