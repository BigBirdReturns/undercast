name: extract-maryl-helper-for-queen-v1

on:
  push:
    branches:
      - agent/extract-maryl-helper-for-queen-v1

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESULT_BRANCH: agent/extract-maryl-helper-for-queen-result-v1
      ROOT: transport/extract-maryl-helper-for-queen-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and verify completed Maryl controller
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/extract-maryl-helper-for-queen-v1
          mkdir -p /tmp/extract-maryl-helper-for-queen-v1
          git fetch --filter=blob:none --no-tags origin agent/star-trek-maryl-cycle-v5
          for part in 00 01 02 03 04 05 06 07; do
            git show "origin/agent/star-trek-maryl-cycle-v5:.github/recovery/star-trek-maryl-cycle-v1/part-${part}.mjs"
          done > /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs
          node --check /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs
          sha256sum /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs > /tmp/extract-maryl-helper-for-queen-v1/controller.sha256
          grep -nE '^function |^async function |^const cmd|switch \(cmd\)|if \(cmd' /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs > /tmp/extract-maryl-helper-for-queen-v1/function-index.txt || true
          jq -n \
            --arg sha "$(cut -d' ' -f1 /tmp/extract-maryl-helper-for-queen-v1/controller.sha256)" \
            --argjson bytes "$(stat -c %s /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs)" \
            --argjson lines "$(wc -l < /tmp/extract-maryl-helper-for-queen-v1/maryl-controller.mjs | tr -d ' ')" \
            '{version:1,transaction:"EXTRACT-MARYL-HELPER-FOR-QUEEN-V1",sha256:$sha,bytes:$bytes,lines:$lines,node_check:"pass"}' \
            > /tmp/extract-maryl-helper-for-queen-v1/result.json
          git config user.name undercast-maryl-controller-extract
          git config user.email maryl-controller-extract@users.noreply.github.com
          git switch --orphan extract-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/extract-maryl-helper-for-queen-v1/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'Extract completed Maryl controller for Queen recovery'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
