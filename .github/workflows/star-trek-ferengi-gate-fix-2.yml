name: star-trek-ferengi-gate-fix-2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-FERENGI-GATE-FIX-2.json"
      - ".github/workflows/star-trek-ferengi-gate-fix-2.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-ferengi-gate-fix-2
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - name: Assert unique stable cards and the exact role-name multiset
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='tests/rendered/site.spec.mjs';
          let text=fs.readFileSync(path,'utf8');
          const returnBefore='    return {counts:taxon.counts,names:taxon.wall_records.map(row=>byId.get(row.id).character)};';
          const returnAfter='    return {counts:taxon.counts,ids:taxon.wall_records.map(row=>row.id),names:taxon.wall_records.map(row=>byId.get(row.id).character)};';
          if(!text.includes(returnBefore)) throw new Error('Ferengi expected record projection drifted');
          text=text.replace(returnBefore,returnAfter);
          const assertionBefore='  expect(names).toHaveLength(expected.names.length);\n  expect(new Set(names).size).toBe(names.length);\n  expect([...names].sort()).toEqual([...expected.names].sort());';
          const assertionAfter='  expect(names).toHaveLength(expected.names.length);\n  expect([...names].sort()).toEqual([...expected.names].sort());\n  const ids=await page.locator("article.cast").evaluateAll(nodes=>nodes.map(node=>node.dataset.uid));\n  expect(ids).toHaveLength(expected.ids.length);\n  expect(new Set(ids).size).toBe(ids.length);\n  expect([...ids].sort()).toEqual([...expected.ids].sort());';
          if(!text.includes(assertionBefore)) throw new Error('Ferengi rendered assertion block drifted');
          text=text.replace(assertionBefore,assertionAfter);
          fs.writeFileSync(path,text);
          const commandPath='.github/STAR-TREK-FERENGI-SATURATE.json';
          const command=JSON.parse(fs.readFileSync(commandPath,'utf8'));
          command.gate_retry_at=new Date().toISOString();
          command.gate_retry_reason='Exact role-name multiset may contain duplicate role names; uniqueness belongs to stable wall IDs.';
          fs.writeFileSync(commandPath,JSON.stringify(command,null,2)+'\n');
          NODE
          rm -f .github/STAR-TREK-FERENGI-GATE-FIX-2.json
          rm -f .github/workflows/star-trek-ferengi-gate-fix-2.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Population: verify Ferengi cards by stable IDs and exact role multiset"
          git push origin HEAD:agent/star-trek-population-002
