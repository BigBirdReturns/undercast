name: doctor-who-cycle-009-operational-reliability-diagnostic-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-operational-reliability-diagnostic-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-operational-reliability-diagnostic-v5
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  BRANCH: agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v5
  SELF: .github/workflows/doctor-who-cycle-009-operational-reliability-diagnostic-v5.yml
  OUT: /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v5
  BOOTSTRAP: /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v5-bootstrap
  PRODUCT_PR: "692"
  PRODUCT_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
  PRODUCT_COMMIT: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  PRODUCT_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  PRODUCT_PATHS: "48"
  SNAPSHOT_ID: preservation-20260801-7054b6e620ee
  SNAPSHOT_COMMIT: 7054b6e620eeb140d4ae279e01e2e1b0daa6d33c
  PRIOR_PROOF_PR: "695"
  PRIOR_PROOF_HEAD: bd51435393fa8c18d783091a2a51b4de2d734241
  PRIOR_PROOF_RUN: "31281724716"
  PRIOR_PROOF_JOB: "93164054240"
  PRIOR_PROOF_ARTIFACT: "9028620679"
  PRIOR_PROOF_ARTIFACT_DIGEST: sha256:e5b236c6057f79e979dab4324bb5d1695c7f9671005d4d74fd7a3deb3db9b8fb
  SOURCE_COMMIT: 75c7f4a6d4a5a44f386f7c0ece580e1b2819a40d
  SOURCE_PATH: .github/workflows/doctor-who-cycle-009-operational-reliability-diagnostic-v4.yml
  SOURCE_BLOB: 41164fd98dfb9f281616f0121a70928c40d74ce8
  SOURCE_SHA256: e154f0ec9b6cba311e6e5ea8f6176f52594812773955281a5d19d51b892d2a7d
  SOURCE_BYTES: "15029"
  SOURCE_BIND_SHA256: 79b871e0ee7185248e6c7e40e4bdff99f33ca91eaa90f77a094d93c5ffa1a9fb
  SOURCE_BIND_BYTES: "4336"
  PATCHED_BIND_SHA256: 204d87ce82311267f456cd8c49eea5fc5af68938b246a479639dcdfc701fe86d
  PATCHED_BIND_BYTES: "4328"
  PROBE_SHA256: c2a3726f2a934a9bb88825eb578da6fb5646df656cc9a47805ea791a5d8a8cf5
  PROBE_BYTES: "5255"
  SEAL_SHA256: ff6e6376f33054220ae5019a09efcec5eea02cf7cba0e01aa1bd81c27f12fc6f
  SEAL_BYTES: "660"
  PR_HEAD: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  diagnose:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover and execute exact diagnostic programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP/api"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-commit.json"
          jq -e --arg parent "$EXACT_MAIN" '.parents|length==1 and .[0].sha==$parent' "$BOOTSTRAP/api/source-commit.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-content.json"
          test "$(jq -r .sha "$BOOTSTRAP/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r .content "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source.yml"
          test "$(git hash-object "$BOOTSTRAP/source.yml")" = "$SOURCE_BLOB"
          test "$(wc -c < "$BOOTSTRAP/source.yml")" = "$SOURCE_BYTES"
          test "$(sha256sum "$BOOTSTRAP/source.yml" | cut -d' ' -f1)" = "$SOURCE_SHA256"

          ruby -ryaml - "$BOOTSTRAP/source.yml" "$BOOTSTRAP/bind-source.sh" "$BOOTSTRAP/probe.sh" "$BOOTSTRAP/seal.sh" <<'RB'
          source, bind_out, probe_out, seal_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          steps = doc.dig('jobs', 'diagnose', 'steps')
          names = {
            'Bind exact diagnostic carrier and prior failed proof' => bind_out,
            'Record exact endpoint probe return codes' => probe_out,
            'Seal diagnostic packet' => seal_out,
          }
          names.each do |name, out|
            row = steps.find { |step| step['name'] == name }
            raise "missing #{name}" unless row && row['run'].is_a?(String)
            File.write(out, row['run'])
          end
          RB

          test "$(wc -c < "$BOOTSTRAP/bind-source.sh")" = "$SOURCE_BIND_BYTES"
          test "$(sha256sum "$BOOTSTRAP/bind-source.sh" | cut -d' ' -f1)" = "$SOURCE_BIND_SHA256"
          test "$(wc -c < "$BOOTSTRAP/probe.sh")" = "$PROBE_BYTES"
          test "$(sha256sum "$BOOTSTRAP/probe.sh" | cut -d' ' -f1)" = "$PROBE_SHA256"
          test "$(wc -c < "$BOOTSTRAP/seal.sh")" = "$SEAL_BYTES"
          test "$(sha256sum "$BOOTSTRAP/seal.sh" | cut -d' ' -f1)" = "$SEAL_SHA256"

          python3 - "$BOOTSTRAP/bind-source.sh" "$BOOTSTRAP/bind.sh" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text()
          old='mkdir -p "$OUT"/{api,diagnostic,product}'
          new='mkdir -p "$OUT"/{api,diagnostic}'
          assert source.count(old)==1
          Path(sys.argv[2]).write_text(source.replace(old,new))
          PY
          test "$(wc -c < "$BOOTSTRAP/bind.sh")" = "$PATCHED_BIND_BYTES"
          test "$(sha256sum "$BOOTSTRAP/bind.sh" | cut -d' ' -f1)" = "$PATCHED_BIND_SHA256"
          bash -n "$BOOTSTRAP/bind.sh"
          bash -n "$BOOTSTRAP/probe.sh"
          bash -n "$BOOTSTRAP/seal.sh"
          bash "$BOOTSTRAP/bind.sh"
          bash "$BOOTSTRAP/probe.sh"
          bash "$BOOTSTRAP/seal.sh"

      - name: Upload exact endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-diagnostic-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v5/diagnostic
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostic bootstrap on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-operational-reliability-diagnostic-v5-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v5
            /tmp/doctor-who-cycle-009-operational-reliability-diagnostic-v5-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
