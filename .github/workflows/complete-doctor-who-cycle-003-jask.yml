name: complete-doctor-who-cycle-003-jask

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/complete-doctor-who-cycle-003-jask.yml"
      - ".ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-003-jask-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/complete-doctor-who-cycle-003-jask.yml
  TRANSPORT: .ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64
  TRANSPORT_SHA256: 05882f504169135ebed97041e83a71d093d1b3cd0ca7df675fdcdcef627a07cf
  MATERIALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-003.mjs
  FINALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-finalize-003.mjs
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-003
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-003-context.json
  GH_TOKEN: ${{ github.token }}

jobs:
  cycle-003:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 128

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify -version

      - name: Download the exact read-only Jask portrait preparation artifact
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-003-jask-portrait-30864593885
          path: /tmp/doctor-who-cycle-003-portrait-preparation
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30864593885

      - name: Bootstrap and bind the exact transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CYCLE_ASSET_DIR"
          tr -d '\n\r\t ' < "$TRANSPORT" | base64 --decode > /tmp/doctor-who-cycle-003-bootstrap.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-003-bootstrap.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-003-bootstrap.tgz -C "$CYCLE_ASSET_DIR"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh
          bash "$CYCLE_ASSET_DIR/01-bind-decode.sh"

      - name: Claim, materialize, review, and resolve exactly one Jask task
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Stage and completely gate the workflow-free terminal candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate-gate.sh"

      - name: Commit the terminal candidate and bind workflow job custody
        id: candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-candidate-commit.sh"

      - name: Upload exact terminal candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*

      - name: Write and validate the reviewed cycle and permanent checker
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          WORKFLOW_JOB_ID: ${{ steps.candidate.outputs.workflow_job_id }}
          CANDIDATE_GATE_SHA256: ${{ steps.candidate.outputs.candidate_gate_sha256 }}
          CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-003-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: bash "$CYCLE_ASSET_DIR/05-finalize.sh"

      - name: Commit, completely gate, and publish the exact final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/06-final-gate-publish.sh"

      - name: Upload complete cycle and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*
            data/review/adapter-sdk/doctor-who-cycle-003-jask.json
