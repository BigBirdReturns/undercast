name: complete-doctor-who-cycle-003-jask

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/complete-doctor-who-cycle-003-jask.yml"
      - ".ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-003-jask-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/complete-doctor-who-cycle-003-jask.yml
  TRANSPORT: .ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64
  TRANSPORT_SHA256: 05882f504169135ebed97041e83a71d093d1b3cd0ca7df675fdcdcef627a07cf
  MATERIALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-003.mjs
  FINALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-finalize-003.mjs
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-003
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-003-context.json
  GH_TOKEN: ${{ github.token }}

jobs:
  cycle-003:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 128

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify -version

      - name: Download the exact read-only Jask portrait preparation artifact
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-003-jask-portrait-30864593885
          path: /tmp/doctor-who-cycle-003-portrait-preparation
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30864593885

      - name: Bootstrap and bind the exact transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CYCLE_ASSET_DIR"
          tr -d '\n\r\t ' < "$TRANSPORT" | base64 --decode > /tmp/doctor-who-cycle-003-bootstrap.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-003-bootstrap.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-003-bootstrap.tgz -C "$CYCLE_ASSET_DIR"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh

          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=128 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          exact_main="$(git rev-parse refs/remotes/origin/main)"
          test -n "$exact_main"
          echo "EXACT_MAIN=$exact_main" >> "$GITHUB_ENV"
          cycle_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          test -n "$cycle_at"
          echo "CYCLE_AT=$cycle_at" >> "$GITHUB_ENV"

          git rebase refs/remotes/origin/main
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$exact_main"
          cat > /tmp/expected-transport-paths.txt <<PATHS
          $TRANSPORT
          $SELF
          PATHS
          sort -o /tmp/expected-transport-paths.txt /tmp/expected-transport-paths.txt
          git diff --name-only "$exact_main"...HEAD | sort > /tmp/actual-transport-paths.txt
          diff -u /tmp/expected-transport-paths.txt /tmp/actual-transport-paths.txt

          cp /tmp/doctor-who-cycle-003-bootstrap.tgz /tmp/doctor-who-cycle-003-transport.tgz
          portrait_root=/tmp/doctor-who-cycle-003-portrait-preparation/doctor-who-cycle-003-jask-portrait
          test -f "$portrait_root/portrait.jpg"
          test -f "$portrait_root/commons-metadata.json"
          cp "$portrait_root/portrait.jpg" "$CYCLE_ASSET_DIR/jask-portrait.jpg"
          cp "$portrait_root/commons-metadata.json" "$CYCLE_ASSET_DIR/jask-portrait-metadata.json"

          cat > /tmp/expected-transport-files.txt <<'FILES'
          ./
          ./01-bind-decode.sh
          ./02-materialize.sh
          ./03-candidate-gate.sh
          ./04-candidate-commit.sh
          ./05-finalize.sh
          ./06-final-gate-publish.sh
          ./apply-doctor-who-cycle-003.mjs
          ./apply-doctor-who-cycle-finalize-003.mjs
          ./transport-manifest.json
          FILES
          tar -tzf /tmp/doctor-who-cycle-003-transport.tgz > /tmp/actual-transport-files.txt
          diff -u /tmp/expected-transport-files.txt /tmp/actual-transport-files.txt
          test "$(sha256sum "$MATERIALIZER" | awk '{print $1}')" = "a52ba145524d18c64a3245076bdce4ab73a57554c502944c29fbabbea95b68db"
          test "$(sha256sum "$FINALIZER" | awk '{print $1}')" = "28d6ff920704106fded58ae2eb1d26fe194098c1276def738dfd34d94f85c1fd"
          test "$(sha256sum "$CYCLE_ASSET_DIR/jask-portrait.jpg" | awk '{print $1}')" = "6ee6c78d48f5ea533d60945988d2cf148312deaff2688d34796c44f931e9121b"
          test "$(sha256sum "$CYCLE_ASSET_DIR/jask-portrait-metadata.json" | awk '{print $1}')" = "ff82fb019d52125f25dc25c9d9fdcae4cffb4cbe07902d2920faa44b56a1b687"
          node --check "$MATERIALIZER"
          node --check "$FINALIZER"
          identify -format '%w %h\n' "$CYCLE_ASSET_DIR/jask-portrait.jpg" > /tmp/doctor-who-cycle-003-prepared-portrait-dimensions.txt
          test "$(cat /tmp/doctor-who-cycle-003-prepared-portrait-dimensions.txt)" = "420 600"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const metadata = JSON.parse(fs.readFileSync(`${process.env.CYCLE_ASSET_DIR}/jask-portrait-metadata.json`, 'utf8'));
          if (metadata.pageid !== 49252093) throw new Error('portrait Commons page ID drifted');
          if (metadata.description_url !== 'https://commons.wikimedia.org/wiki/File:Dan_Starkey_by_Gage_Skidmore.jpg') throw new Error('portrait origin drifted');
          if (metadata.author !== 'Gage Skidmore' || metadata.license !== 'CC BY-SA 3.0') throw new Error('portrait attribution drifted');
          if (metadata.source_sha256 !== 'f3263902fc3488fc24991a569cb7152d3629dc1bd5c900f74970e30bc376891e') throw new Error('portrait source digest drifted');
          if (metadata.portrait_sha256 !== '6ee6c78d48f5ea533d60945988d2cf148312deaff2688d34796c44f931e9121b') throw new Error('portrait candidate digest drifted');
          if (metadata.boundary?.performer_identity_only !== true || metadata.boundary?.character_evidence !== false || metadata.boundary?.jask_or_generic_sontaran_depiction !== false) throw new Error('portrait use boundary drifted');
          const transport = JSON.parse(fs.readFileSync(`${process.env.CYCLE_ASSET_DIR}/transport-manifest.json`, 'utf8'));
          if (transport.transaction !== 'DOCTOR-WHO-CYCLE-003-JASK' || transport.boundary?.one_task_maximum !== true || transport.boundary?.no_fourth_lease !== true || transport.boundary?.self_delete_before_candidate_commit !== true) throw new Error('transport boundary drifted');
          for (const entry of transport.files || []) {
            const path = `${process.env.CYCLE_ASSET_DIR}/${entry.path}`;
            const bytes = fs.readFileSync(path);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== entry.sha256 || bytes.length !== entry.bytes) throw new Error(`transport payload drifted: ${entry.path}`);
          }
          NODE

          sha256sum \
            /tmp/doctor-who-cycle-003-transport.tgz \
            "$MATERIALIZER" \
            "$FINALIZER" \
            "$CYCLE_ASSET_DIR/jask-portrait.jpg" \
            "$CYCLE_ASSET_DIR/jask-portrait-metadata.json" \
            "$CYCLE_ASSET_DIR/transport-manifest.json" \
            > /tmp/doctor-who-cycle-003-transport-sha256.txt
          echo "exact_main=$exact_main" >> "$GITHUB_STEP_SUMMARY"
          echo "rebased_launcher=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "cycle_at=$cycle_at" >> "$GITHUB_STEP_SUMMARY"

      - name: Claim, materialize, review, and resolve exactly one Jask task
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Stage and completely gate the workflow-free terminal candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate-gate.sh"

      - name: Commit the terminal candidate and bind workflow job custody
        id: candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-candidate-commit.sh"

      - name: Upload exact terminal candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*

      - name: Write and validate the reviewed cycle and permanent checker
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          WORKFLOW_JOB_ID: ${{ steps.candidate.outputs.workflow_job_id }}
          CANDIDATE_GATE_SHA256: ${{ steps.candidate.outputs.candidate_gate_sha256 }}
          CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-003-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: bash "$CYCLE_ASSET_DIR/05-finalize.sh"

      - name: Commit, completely gate, and publish the exact final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/06-final-gate-publish.sh"

      - name: Upload complete cycle and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*
            data/review/adapter-sdk/doctor-who-cycle-003-jask.json
