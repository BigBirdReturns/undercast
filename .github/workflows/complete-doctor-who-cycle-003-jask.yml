name: complete-doctor-who-cycle-003-jask

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/complete-doctor-who-cycle-003-jask.yml"
      - ".ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64*"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-003-jask-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/complete-doctor-who-cycle-003-jask.yml
  TRANSPORT: .ci/doctor-who-cycle-003/scripts-and-assets.tgz.b64
  TRANSPORT_SHA256: dd8dc9d36864e61250e1bee4706b0b311897bd9b48e1e356f4f3e3e06cfaa77f
  MATERIALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-003.mjs
  FINALIZER: /tmp/doctor-who-cycle-003/apply-doctor-who-cycle-finalize-003.mjs
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-003
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-003-context.json
  GH_TOKEN: ${{ github.token }}

jobs:
  cycle-003:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 128
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies and runtimes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Download exact reviewed portrait preparation
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-003-jask-portrait-30864593885
          path: /tmp/doctor-who-cycle-003-portrait-preparation
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30864593885
      - name: Decode, bind, and future-proof exact chunked transport
        shell: bash
        run: |
          set -euo pipefail
          parts=( "$TRANSPORT" "$TRANSPORT".part-* )
          test "${#parts[@]}" -eq 12
          mkdir -p "$CYCLE_ASSET_DIR"
          cat "${parts[@]}" | tr -d '\n\r\t ' | base64 --decode > /tmp/doctor-who-cycle-003-bootstrap.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-003-bootstrap.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-003-bootstrap.tgz -C "$CYCLE_ASSET_DIR"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh
          python3 - <<'PY'
          from pathlib import Path
          import glob, hashlib, json, os

          binder = Path('/tmp/doctor-who-cycle-003/01-bind-decode.sh')
          text = binder.read_text()
          old = 'cat > /tmp/expected-transport-paths.txt <<PATHS\n$TRANSPORT\n$SELF\nPATHS\n'
          paths = [os.environ['TRANSPORT'], *sorted(glob.glob(os.environ['TRANSPORT'] + '.part-*')), os.environ['SELF']]
          new = 'cat > /tmp/expected-transport-paths.txt <<PATHS\n' + '\n'.join(paths) + '\nPATHS\n'
          if text.count(old) != 1:
              raise SystemExit('binder path block drifted')
          binder.write_text(text.replace(old, new, 1))
          manifest_path = Path('/tmp/doctor-who-cycle-003/transport-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          entry = next(item for item in manifest['files'] if item['path'] == '01-bind-decode.sh')
          payload = binder.read_bytes()
          entry['sha256'] = hashlib.sha256(payload).hexdigest()
          entry['bytes'] = len(payload)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          bash "$CYCLE_ASSET_DIR/01-bind-decode.sh"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          path = Path('scripts/doctor-who-correction-drill.mjs')
          before = path.read_text()
          before_sha = hashlib.sha256(before.encode()).hexdigest()

          old_function = '''function validateActiveLeaseIsolation(jobs, unreceiptedGroups, { doctorWhoAllowed }) {
            const active = (jobs || []).filter((job) => ACTIVE_JOB_STATUSES.has(job.status));
            const leaseGroups = new Map();
            const addGroup = (scope, leaseId, members, source) => {
              assert(String(scope || "").trim() && String(leaseId || "").trim(), `${source} lease group lacks scope or lease identity`);
              if (!doctorWhoAllowed) assert(scope !== "doctor-who", `Doctor Who acquired ${source} work before milestone completion: ${leaseId}`);
              const key = `${scope}|${leaseId}`;
              if (!leaseGroups.has(key)) leaseGroups.set(key, []);
              leaseGroups.get(key).push(...members);
            };
            for (const job of active) {
              const leaseId = String(job.lease?.id || "").trim();
              assert(leaseId, `active job ${job.scope}:${job.id} lacks lease identity`);
              addGroup(job.scope, leaseId, [job.id], "active");
            }
            for (const group of unreceiptedGroups || []) {
              addGroup(group.scope_id, group.lease_id, (group.task_ids || []).map((id) => `journal:${id}`), "unreceipted journal");
            }
            assert(leaseGroups.size <= 1, `global one-cycle boundary has multiple active or unreceipted lease groups: ${[...leaseGroups.keys()].join(", ")}`);
            return { active, unreceiptedGroups: unreceiptedGroups || [], leaseGroups };
          }'''
          new_function = '''function validateActiveLeaseIsolation(jobs, unreceiptedGroups, { doctorWhoAllowed, doctorWhoTerminalReceiptPending = false }) {
            const active = (jobs || []).filter((job) => ACTIVE_JOB_STATUSES.has(job.status));
            const jobById = new Map((jobs || []).map((job) => [job.id, job]));
            const leaseGroups = new Map();
            const addGroup = (scope, leaseId, members, source) => {
              assert(String(scope || "").trim() && String(leaseId || "").trim(), `${source} lease group lacks scope or lease identity`);
              if (!doctorWhoAllowed && scope === "doctor-who") {
                const terminalReceiptPending = doctorWhoTerminalReceiptPending
                  && source === "unreceipted journal"
                  && active.length === 0
                  && members.length === 1
                  && members.every((member) => {
                    const taskId = String(member).replace(/^journal:/, "");
                    const job = jobById.get(taskId);
                    return job?.scope === "doctor-who" && job.status === "resolved";
                  });
                assert(terminalReceiptPending, `Doctor Who acquired ${source} work before milestone completion: ${leaseId}`);
              }
              const key = `${scope}|${leaseId}`;
              if (!leaseGroups.has(key)) leaseGroups.set(key, []);
              leaseGroups.get(key).push(...members);
            };
            for (const job of active) {
              const leaseId = String(job.lease?.id || "").trim();
              assert(leaseId, `active job ${job.scope}:${job.id} lacks lease identity`);
              addGroup(job.scope, leaseId, [job.id], "active");
            }
            for (const group of unreceiptedGroups || []) {
              addGroup(group.scope_id, group.lease_id, (group.task_ids || []).map((id) => `journal:${id}`), "unreceipted journal");
            }
            assert(leaseGroups.size <= 1, `global one-cycle boundary has multiple active or unreceipted lease groups: ${[...leaseGroups.keys()].join(", ")}`);
            return { active, unreceiptedGroups: unreceiptedGroups || [], leaseGroups };
          }'''
          if before.count(old_function) != 1:
              raise SystemExit('active-lease isolation function drifted')
          after = before.replace(old_function, new_function, 1)

          old_live = '''const unreceiptedLeaseGroups = unreceiptedJournalLeaseGroups(waterline, waterlineState, autopilotJournal);
          const activeLeaseState = validateActiveLeaseIsolation(autopilot.jobs || [], unreceiptedLeaseGroups, {
            doctorWhoAllowed: roadmapCompletion.completed,
          });'''
          new_live = '''const unreceiptedLeaseGroups = unreceiptedJournalLeaseGroups(waterline, waterlineState, autopilotJournal);
          const reviewedDoctorWhoCycles = (waterlineState.cycles || []).filter((cycle) =>
            cycle.scope_id === "doctor-who" && cycle.outcome === "completed" && cycle.closed_at && cycle.reviewed_at
          ).length;
          const doctorWhoTerminalReceiptPending = !roadmapCompletion.completed
            && reviewedDoctorWhoCycles >= 1
            && unreceiptedLeaseGroups.length === 1
            && unreceiptedLeaseGroups[0].scope_id === "doctor-who"
            && (unreceiptedLeaseGroups[0].task_ids || []).length === 1;
          const activeLeaseState = validateActiveLeaseIsolation(autopilot.jobs || [], unreceiptedLeaseGroups, {
            doctorWhoAllowed: roadmapCompletion.completed,
            doctorWhoTerminalReceiptPending,
          });'''
          if after.count(old_live) != 1:
              raise SystemExit('live lease-isolation composition drifted')
          after = after.replace(old_live, new_live, 1)

          old_fixture = '''validateActiveLeaseIsolation([
            { id: "fixture-star", scope: "star-trek", status: "leased", lease: { id: "lease_fixture" } },
            { id: "fixture-doctor-queued", scope: "doctor-who", status: "queued" },
          ], [], { doctorWhoAllowed: false });
          expectFailure('''
          new_fixture = '''validateActiveLeaseIsolation([
            { id: "fixture-star", scope: "star-trek", status: "leased", lease: { id: "lease_fixture" } },
            { id: "fixture-doctor-queued", scope: "doctor-who", status: "queued" },
          ], [], { doctorWhoAllowed: false });
          validateActiveLeaseIsolation([
            { id: "fixture-doctor-resolved", scope: "doctor-who", status: "resolved" },
          ], [{ scope_id: "doctor-who", lease_id: "lease_terminal_receipt_pending", task_ids: ["fixture-doctor-resolved"] }], {
            doctorWhoAllowed: false,
            doctorWhoTerminalReceiptPending: true,
          });
          expectFailure(
            () => validateActiveLeaseIsolation([
              { id: "fixture-doctor-queued", scope: "doctor-who", status: "queued" },
            ], [{ scope_id: "doctor-who", lease_id: "lease_nonterminal", task_ids: ["fixture-doctor-queued"] }], {
              doctorWhoAllowed: false,
              doctorWhoTerminalReceiptPending: true,
            }),
            /before milestone completion/,
            "nonterminal Doctor Who unreceipted group",
          );
          expectFailure('''
          if after.count(old_fixture) != 1:
              raise SystemExit('embedded lease fixture anchor drifted')
          after = after.replace(old_fixture, new_fixture, 1)

          old_message = 'one unrelated active lease group, future certified refreshes and corrections, and separately reviewed roadmap completion'
          new_message = 'one globally bounded active or resolved receipt-pending lease group, future certified refreshes and corrections, and separately reviewed roadmap completion'
          if after.count(old_message) != 1:
              raise SystemExit('pass-message anchor drifted')
          after = after.replace(old_message, new_message, 1)
          path.write_text(after)
          after_sha = hashlib.sha256(after.encode()).hexdigest()
          report = {
            'version': 1,
            'transaction': 'DOCTOR-WHO-CYCLE-003-RECEIPT-REQUIRED-CUSTODY',
            'base_main': '95c0a10b6e3c6e592ec30fae44bb8108b997ab49',
            'failed_run': 30868357154,
            'failed_job': 91865101803,
            'failed_artifact_id': 8876995578,
            'failed_artifact_sha256': 'd2e7a9d4e4e0d62fa44548a6345365789505a1125d4f248c081bb0c9a7339315',
            'checker': str(path),
            'checker_sha256_before': before_sha,
            'checker_sha256_after': after_sha,
            'correction': 'Permit exactly one resolved Doctor Who journal lease group to remain receipt-pending after at least one reviewed Doctor Who cycle, while retaining the global single-group lock.',
            'refusals': [
              'active Doctor Who task',
              'queued or other nonterminal task',
              'multiple tasks in one pending group',
              'multiple active or unreceipted lease groups',
              'first Doctor Who work without a prior reviewed cycle',
            ],
            'boundary': {
              'candidate_receipt_still_required': True,
              'second_concurrent_lease_allowed': False,
              'roadmap_completion_claimed': False,
              'historical_drill_receipt_mutated': False,
            },
          }
          Path('/tmp/doctor-who-cycle-003-receipt-required-custody.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          node --check scripts/doctor-who-correction-drill.mjs
      - name: Claim, materialize, review, and resolve exactly one Jask task
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"
      - name: Stage and completely gate workflow-free terminal candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -f "$TRANSPORT".part-*
          bash "$CYCLE_ASSET_DIR/03-candidate-gate.sh"
      - name: Commit terminal candidate and bind workflow job custody
        id: candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-candidate-commit.sh"
      - name: Upload exact terminal candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*
      - name: Write and validate reviewed cycle and permanent checker
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          WORKFLOW_JOB_ID: ${{ steps.candidate.outputs.workflow_job_id }}
          CANDIDATE_GATE_SHA256: ${{ steps.candidate.outputs.candidate_gate_sha256 }}
          CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-003-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: bash "$CYCLE_ASSET_DIR/05-finalize.sh"
      - name: Commit, completely gate, and publish exact final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/06-final-gate-publish.sh"
      - name: Upload complete cycle and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-003-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/doctor-who-cycle-003*
            /tmp/expected-transport-*
            /tmp/actual-transport-*
            data/review/adapter-sdk/doctor-who-cycle-003-jask.json
