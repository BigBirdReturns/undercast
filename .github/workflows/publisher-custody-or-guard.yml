name: publisher-custody-or-guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-custody-or-guard.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-custody-or-guard.mjs"

permissions:
  contents: read

concurrency:
  group: publisher-custody-or-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/publisher-custody.mjs
            scripts/publisher-custody-or-guard.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refuse write-capable PR jobs hidden behind satisfiable OR branches
        run: |
          node scripts/publisher-custody-or-guard.mjs --self-test
          node scripts/publisher-custody-or-guard.mjs
