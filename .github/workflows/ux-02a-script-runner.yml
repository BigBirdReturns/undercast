name: ux-02a-script-runner

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ux-02a-script-runner
  cancel-in-progress: true

# This synchronize revision bootstraps the newly added workflow after its
# one-file carrier exists on the pull-request branch.
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ux-02a-script-runner'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-script-runner-evidence
      MATERIALIZER_COMMIT: d51e52ed54b7eef00d585f0dff1e94cf72870ecb
      MATERIALIZER_BLOB: 66743db30b74cd5b32df7dd59ab0dbc53b232f76
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Recover and execute exact registered DEC-0016 materializer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            +refs/heads/agent/collection-only-operations:refs/remotes/origin/agent/collection-only-operations
          test "$(git rev-parse refs/remotes/origin/agent/collection-only-operations)" = "$MATERIALIZER_COMMIT"
          test "$(git rev-parse "$MATERIALIZER_COMMIT:tmp/ux02a-materialize.sh")" = "$MATERIALIZER_BLOB"
          git show "$MATERIALIZER_COMMIT:tmp/ux02a-materialize.sh" > /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          printf 'carrier=%s\nmaterializer_commit=%s\nmaterializer_blob=%s\n' \
            "$(git rev-parse HEAD)" "$MATERIALIZER_COMMIT" "$MATERIALIZER_BLOB" \
            > "$EVIDENCE/input-identity.txt"
          bash /tmp/ux02a-materialize.sh

      - name: Upload exact DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-script-runner-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-script-runner-evidence
          if-no-files-found: warn
          retention-days: 30
