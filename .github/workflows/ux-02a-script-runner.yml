name: complete-doctor-who-cycle-006-kayste-current-main
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  actions: read
concurrency:
  group: complete-doctor-who-cycle-006-kayste-current-main
  cancel-in-progress: false
env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/ux-02a-script-runner.yml
  TRANSPORT: .ci/doctor-who-cycle-006-v3/scripts.tgz.b64
  TRANSPORT_PARTS: "5"
  TRANSPORT_SHA256: 42e49167e148e290045697d771baf6afdd7d7b69ef999e7ee47bac0eefc77a64
  PREPARE: .ci/doctor-who-cycle-006-v3/prepare.sh
  PREPARE_SHA256: b9ffb7be8f0cad7bc71d6432328d6852a3de2f732b93234534d34e239e7d2ddc
  FINALIZE_HELPER: .ci/doctor-who-cycle-006-v3/finalize.sh
  FINALIZE_HELPER_SHA256: c400c62ca363ab27cb1be3ec25af76b866a101d484ee5bf91cc94a2a27f3d528
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-006
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-006-context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-006-selection
  MEDIA_DIR: /tmp/doctor-who-cycle-006-media
  REBIND_DIR: /tmp/doctor-who-cycle-006-rebind
  GH_TOKEN: ${{ github.token }}
jobs:
  cycle-006:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-kayste-completion-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-preflight-30950611825
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30950611825
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-kayste-media-preflight-30951744686
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30951744686
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-clean-main-rebind-v6-30989625719
          path: ${{ env.REBIND_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30989625719
      - name: Materialize and gate exact candidate
        run: |
          test "$(sha256sum "$PREPARE" | awk '{print $1}')" = "$PREPARE_SHA256"
          bash "$PREPARE"
      - name: Upload exact candidate evidence
        id: candidate
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-candidate-${{ github.run_id }}
          path: /tmp/doctor-who-cycle-006-*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Finalize, gate, and publish exact product
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: bash /tmp/doctor-who-cycle-006-finalize-current.sh
      - name: Upload complete cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-final-${{ github.run_id }}
          path: |
            /tmp/doctor-who-cycle-006-*
            data/review/adapter-sdk/doctor-who-cycle-006-kayste.json
            scripts/doctor-who-cycle-006.mjs
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
