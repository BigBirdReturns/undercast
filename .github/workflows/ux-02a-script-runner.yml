name: complete-doctor-who-cycle-006-kayste

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-006-kayste
  cancel-in-progress: false

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/ux-02a-script-runner.yml
  TRANSPORT: .ci/doctor-who-cycle-006-v6/scripts.tgz.b64
  TRANSPORT_PARTS: "5"
  TRANSPORT_SHA256: 74f24e76001c25540ccccd5c6e14259f502db738587ec94cd9e06ce752b4b02d
  MATERIALIZER_SHA256: 7b2a4d1c1cc24062bfaf855c2ea8df294f8f39ad33f8d3e8fbbd97317da8d2b1
  FINALIZER_SHA256: f2d95747bff46244705f5fa7653cd09c6e256a5803461b07845e6e685c5fef44
  TRANSPORT_MANIFEST_SHA256: f843fb8750972d8bd4e27cac816d1db9bd56b42bf45181374d50c059d5d2e8f9
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-006
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-006-context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-006-selection
  MEDIA_DIR: /tmp/doctor-who-cycle-006-media
  REBIND_DIR: /tmp/doctor-who-cycle-006-rebind
  GH_TOKEN: ${{ github.token }}

jobs:
  cycle-006:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-kayste-completion-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1

      - name: Download exact cycle-006 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-preflight-30950611825
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30950611825

      - name: Download exact Kayste media packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-kayste-media-preflight-30951744686
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30951744686

      - name: Download exact clean-main cycle-006 rebind
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-clean-main-rebind-v6-30989625719
          path: ${{ env.REBIND_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30989625719

      - name: Decode and bind strict cycle-006 custody
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t parts < <(printf '%s\n' "$TRANSPORT" "$TRANSPORT".part-* | sort)
          test "${#parts[@]}" -eq "$TRANSPORT_PARTS"
          mkdir -p "$CYCLE_ASSET_DIR"
          cat "${parts[@]}" | tr -d '\n\r\t ' | base64 --decode > /tmp/doctor-who-cycle-006-bootstrap.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-006-bootstrap.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-006-bootstrap.tgz -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-006.mjs" | awk '{print $1}')" = "$MATERIALIZER_SHA256"
          test "$(sha256sum "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-006.mjs" | awk '{print $1}')" = "$FINALIZER_SHA256"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$TRANSPORT_MANIFEST_SHA256"

          binder="$CYCLE_ASSET_DIR/01-bind-decode.sh"
          binder_before="$(sha256sum "$binder" | awk '{print $1}')"
          python3 - "$binder" <<'PYBINDER'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = "if (sha(Buffer.from(JSON.stringify(rebind))) !== declaredRebind) throw new Error('Kayste rebind canonical hash drifted');"
          new = "if (sha(Buffer.from(JSON.stringify(rebind) + '\\n')) !== declaredRebind) throw new Error('Kayste rebind canonical hash drifted');"
          if text.count(old) != 1:
              raise SystemExit(f"expected one unnormalized rebind-hash assertion, found {text.count(old)}")
          if text.count(new) != 0:
              raise SystemExit("normalized rebind-hash assertion already present before repair")
          path.write_text(text.replace(old, new, 1))
          PYBINDER
          binder_after="$(sha256sum "$binder" | awk '{print $1}')"
          test "$binder_before" != "$binder_after"
          test "$(grep -F "JSON.stringify(rebind) + '\\n'" "$binder" | wc -l)" -eq 1
          ! grep -F "sha(Buffer.from(JSON.stringify(rebind)))" "$binder"
          bash -n "$binder"
          printf 'binder_sha_before=%s\nbinder_sha_after=%s\n' "$binder_before" "$binder_after"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh
          bash "$binder"

          materializer="$CYCLE_ASSET_DIR/apply-doctor-who-cycle-006.mjs"
          finalizer="$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-006.mjs"
          materializer_before="$(sha256sum "$materializer" | awk '{print $1}')"
          finalizer_before="$(sha256sum "$finalizer" | awk '{print $1}')"
          test "$materializer_before" = "$MATERIALIZER_SHA256"
          test "$finalizer_before" = "$FINALIZER_SHA256"
          python3 - "$materializer" "$finalizer" <<'PYMEDIA'
          from pathlib import Path
          import sys

          materializer = Path(sys.argv[1])
          finalizer = Path(sys.argv[2])

          materializer_text = materializer.read_text()
          portrait_old = '''card.portrait = {
            src: portraitPath,
            kind: "portrait",
            origin: PORTRAIT_ORIGIN,
          '''
          portrait_new = '''card.portrait = {
            src: portraitPath,
            kind: "free",
            origin: PORTRAIT_ORIGIN,
          '''
          presentation_old = '      value: "performer-portrait",\n'
          presentation_new = '      value: "neutral-human",\n'
          if materializer_text.count(portrait_old) != 1:
              raise SystemExit(f"expected one invalid Kayste portrait provenance block, found {materializer_text.count(portrait_old)}")
          if materializer_text.count(portrait_new) != 0:
              raise SystemExit("corrected Kayste portrait provenance block already present before repair")
          if materializer_text.count(presentation_old) != 1:
              raise SystemExit(f"expected one unsupported portrait presentation vote, found {materializer_text.count(presentation_old)}")
          if materializer_text.count(presentation_new) != 0:
              raise SystemExit("supported portrait presentation vote already present before repair")
          materializer_text = materializer_text.replace(portrait_old, portrait_new, 1)
          materializer_text = materializer_text.replace(presentation_old, presentation_new, 1)
          materializer.write_text(materializer_text)

          finalizer_text = finalizer.read_text()
          kind_old = 'wall.portrait.kind !== "portrait"'
          kind_new = 'wall.portrait.kind !== "free"'
          vote_old = 'row.value === "performer-portrait"'
          vote_new = 'row.value === "neutral-human"'
          if finalizer_text.count(kind_old) != 1:
              raise SystemExit(f"expected one schema-invalid portrait checker, found {finalizer_text.count(kind_old)}")
          if finalizer_text.count(kind_new) != 0:
              raise SystemExit("schema-valid portrait checker already present before repair")
          if finalizer_text.count(vote_old) != 1:
              raise SystemExit(f"expected one unsupported presentation checker, found {finalizer_text.count(vote_old)}")
          if finalizer_text.count(vote_new) != 0:
              raise SystemExit("supported presentation checker already present before repair")
          finalizer_text = finalizer_text.replace(kind_old, kind_new, 1)
          finalizer_text = finalizer_text.replace(vote_old, vote_new, 1)
          finalizer.write_text(finalizer_text)
          PYMEDIA
          materializer_after="$(sha256sum "$materializer" | awk '{print $1}')"
          finalizer_after="$(sha256sum "$finalizer" | awk '{print $1}')"
          test "$materializer_before" != "$materializer_after"
          test "$finalizer_before" != "$finalizer_after"
          test "$(grep -F 'kind: "free"' "$materializer" | wc -l)" -eq 1
          ! grep -F 'kind: "portrait"' "$materializer"
          test "$(grep -F 'value: "neutral-human"' "$materializer" | wc -l)" -eq 1
          ! grep -F 'value: "performer-portrait"' "$materializer"
          test "$(grep -F 'wall.portrait.kind !== "free"' "$finalizer" | wc -l)" -eq 1
          ! grep -F 'wall.portrait.kind !== "portrait"' "$finalizer"
          test "$(grep -F 'row.value === "neutral-human"' "$finalizer" | wc -l)" -eq 1
          ! grep -F 'row.value === "performer-portrait"' "$finalizer"
          node --check "$materializer"
          node --check "$finalizer"
          printf 'materializer_sha_before=%s\nmaterializer_sha_after=%s\nfinalizer_sha_before=%s\nfinalizer_sha_after=%s\n' \
            "$materializer_before" "$materializer_after" "$finalizer_before" "$finalizer_after"
          printf '%s\n' "$materializer_after" > /tmp/doctor-who-cycle-006-effective-materializer.sha256
          printf '%s\n' "$finalizer_after" > /tmp/doctor-who-cycle-006-effective-finalizer.sha256

      - name: Claim, materialize, review, and resolve exactly one Kayste task
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Stage and completely gate workflow-free terminal candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate-gate.sh"

      - name: Commit terminal candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-candidate-commit.sh"

      - name: Upload exact terminal candidate evidence
        id: candidate-upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.CYCLE_CONTEXT }}
            /tmp/doctor-who-cycle-006-candidate-*
            /tmp/doctor-who-cycle-006-materialize.log
            /tmp/doctor-who-cycle-006-candidate-gate.log
            /tmp/doctor-who-cycle-006-candidate-gate.sha256
            /tmp/doctor-who-cycle-006-normalized-verification.json
            /tmp/doctor-who-cycle-006-kayste-portrait.jpg
            /tmp/doctor-who-cycle-006-effective-materializer.sha256
            /tmp/doctor-who-cycle-006-effective-finalizer.sha256
            /tmp/apply-doctor-who-cycle-006.mjs
            /tmp/apply-doctor-who-cycle-finalize-006.mjs

      - name: Bind candidate artifact and workflow job custody
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="cycle-006") | .id' | head -1)"
          test -n "$job_id"
          digest="${ARTIFACT_DIGEST#sha256:}"
          candidate="$(cat /tmp/doctor-who-cycle-006-candidate-commit.txt)"
          candidate_gate="$(cat /tmp/doctor-who-cycle-006-candidate-gate.sha256)"
          artifact_name="doctor-who-cycle-006-candidate-${GITHUB_RUN_ID}"
          test -n "$ARTIFACT_ID" -a -n "$digest" -a -n "$candidate" -a -n "$candidate_gate"
          printf 'CANDIDATE_COMMIT=%s\n' "$candidate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_GATE_SHA256=%s\n' "$candidate_gate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'WORKFLOW_JOB=%s\n' "$job_id" >> "$GITHUB_ENV"

      - name: Write and validate reviewed cycle and permanent checker
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/05-finalize.sh"

      - name: Commit, completely gate, and publish exact final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/06-final-gate-publish.sh"

      - name: Upload complete cycle and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            ${{ env.CYCLE_CONTEXT }}
            /tmp/doctor-who-cycle-006-candidate-*
            /tmp/doctor-who-cycle-006-final-*
            /tmp/doctor-who-cycle-006-finalize.log
            /tmp/doctor-who-cycle-006-materialize.log
            /tmp/doctor-who-cycle-006-candidate-gate.log
            /tmp/doctor-who-cycle-006-final-gate.log
            /tmp/doctor-who-cycle-006-normalized-verification.json
            /tmp/doctor-who-cycle-006-kayste-portrait.jpg
            /tmp/doctor-who-cycle-006-effective-materializer.sha256
            /tmp/doctor-who-cycle-006-effective-finalizer.sha256
            /tmp/apply-doctor-who-cycle-006.mjs
            /tmp/apply-doctor-who-cycle-finalize-006.mjs
            data/review/adapter-sdk/doctor-who-cycle-006-kayste.json
            scripts/doctor-who-cycle-006.mjs
