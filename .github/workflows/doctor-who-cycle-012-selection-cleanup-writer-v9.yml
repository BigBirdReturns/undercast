name: doctor-who-cycle-012-selection-cleanup-writer-v9

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-residual-evidence-v9]
    types: [completed]

permissions: {}
concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v9
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'doctor-who-cycle-012-selection-cleanup-residual-evidence-v9' &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      V8_MAIN: 31bbd0231ff52dfe5a1c6b3b50f2f77c16c3099e
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-residual-evidence-v9
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v9
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-residual-evidence-v9-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v9
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_DATE: 2026-08-11T04:30:00Z
      CLEANUP_MESSAGE: Doctor Who cycle 012 residual preselection transport cleanup V9
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v9-loader
      CARRIER_BLOBS: >-
        0b069f484ac85fd78ecd12bb57fffb23d647695d
        71ac22af005c87c6d604713aad1f078bfefb5fc0
        2e98523a9931f7b8c94b48dcf6d6badfcce058fa
        d94802e666aa292bf0793aa185ae1456f8d1f9ad
        da5a9e885b86acacca083c28241fdebe8a083983
      CARRIER_B64_BYTES: "19880"
      CARRIER_B64_SHA256: 954c27826f107d470e92724b972ed2edd122d94be16ac826448938126261a57d
      CARRIER_BYTES: "14910"
      CARRIER_SHA256: 00ad7ba02f293bd1fd01a37c4ff48347833d4bf0f96360ac975b99cfd0729356

    steps:
      - name: Reconstruct and execute exact residual cleanup writer V9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.b64"
          index=0
          for blob in $CARRIER_BLOBS; do
            index=$((index+1))
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" > "$LOADER/blob-$index.json"
            jq -r '.content' "$LOADER/blob-$index.json" | tr -d '\n' | base64 -d > "$LOADER/chunk-$index.txt"
            test "$(git hash-object --stdin < "$LOADER/chunk-$index.txt")" = "$blob"
            cat "$LOADER/chunk-$index.txt" >> "$LOADER/carrier.sh.b64"
          done
          test "$(wc -c < "$LOADER/carrier.sh.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$LOADER/carrier.sh.b64" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-residual-cleanup-writer-v9-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v9-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v9/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v9-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v9
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v9-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
