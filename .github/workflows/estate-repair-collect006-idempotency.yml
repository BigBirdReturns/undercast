name: estate-repair-collect006-idempotency

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect006-idempotency.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect006-idempotency
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-exact-null-batch.mjs
  PLAN: data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION-PLAN.json

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Make exact-null adoption state idempotent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-exact-null-batch.mjs')
          text = path.read_text(encoding='utf-8')

          old_state = '''    const specimenCurrent = specimen[row.side] ?? null;
              const sourceCurrent = source[row.side] ?? null;
              assert(specimenCurrent === null && sourceCurrent === null, `${key} current canonical binding is no longer exact null`);
              const otherSide = row.side === "still" ? "portrait" : "still";
              assert(specimen[otherSide]?.src && source[otherSide]?.src && sameJson(specimen[otherSide], source[otherSide]), `${key} other side is not complete and consistent`);
              const intended = intendedImage(row);
              const destination = resolveInside(resolvedRoot, row.destination_path, `${key} destination`);
              assert(!(await exists(destination.absolute)), `${key} versioned destination already exists before adoption`);
              contexts.push({ key, row, manifest, candidateBytes, destination, state: "pending", intended });'''
          new_state = '''    const specimenCurrent = specimen[row.side] ?? null;
              const sourceCurrent = source[row.side] ?? null;
              const otherSide = row.side === "still" ? "portrait" : "still";
              assert(specimen[otherSide]?.src && source[otherSide]?.src && sameJson(specimen[otherSide], source[otherSide]), `${key} other side is not complete and consistent`);
              const intended = intendedImage(row);
              const destination = resolveInside(resolvedRoot, row.destination_path, `${key} destination`);
              const destinationExists = await exists(destination.absolute);
              let state;
              if (specimenCurrent === null && sourceCurrent === null) {
                assert(!destinationExists, `${key} versioned destination already exists before adoption`);
                state = "pending";
              } else {
                assert(sameJson(specimenCurrent, intended) && sameJson(sourceCurrent, intended), `${key} current binding is neither null nor the exact planned adoption`);
                assert(destinationExists, `${key} exact adopted destination is missing`);
                const destinationBytes = await readFile(destination.absolute);
                assert(sha256(destinationBytes) === row.candidate_sha256, `${key} adopted destination bytes drifted`);
                state = "already-adopted";
              }
              contexts.push({ key, row, manifest, candidateBytes, destination, state, intended });'''

          old_apply = '''async function applyTransaction({ inspection, now, reportPath }) {
            const date = String(now || new Date().toISOString()).slice(0, 10);'''
          new_apply = '''async function applyTransaction({ inspection, now, reportPath }) {
            const pending = inspection.contexts.filter((context) => context.state === "pending");
            const date = String(now || new Date().toISOString()).slice(0, 10);'''

          old_loop = '''  for (const context of inspection.contexts) {
              specimenById.get(context.row.record_id)[context.row.side] = context.intended;'''
          new_loop = '''  for (const context of pending) {
              specimenById.get(context.row.record_id)[context.row.side] = context.intended;'''

          old_counts = '''    counts: { authorized: inspection.contexts.length, adopted: inspection.contexts.length },
              adoptions: inspection.contexts.map((context) => ({ obligation_id: context.key, destination_path: context.row.destination_path, candidate_sha256: context.row.candidate_sha256 })),
              boundary: { discovery_performed: false, packet_evidence_rewritten: false, quality_baseline_reset: false, complete_gate_required_before_receipt: true, canonical_mutation: true },'''
          new_counts = '''    counts: { authorized: inspection.contexts.length, adopted: pending.length, already_adopted: inspection.contexts.length - pending.length },
              adoptions: inspection.contexts.map((context) => ({ obligation_id: context.key, state: context.state === "pending" ? "adopted" : "already-adopted", destination_path: context.row.destination_path, candidate_sha256: context.row.candidate_sha256 })),
              boundary: { discovery_performed: false, packet_evidence_rewritten: false, quality_baseline_reset: false, complete_gate_required_before_receipt: true, canonical_mutation: pending.length > 0 },'''

          old_validate = '''async function validateAdopted({ inspection, beforeQualityPath }) {
            for (const context of inspection.contexts) {'''
          new_validate = '''async function validateAdopted({ inspection, beforeQualityPath }) {
            const pending = inspection.contexts.filter((context) => context.state === "pending");
            assert(pending.length === 0, `COLLECT-006 still has ${pending.length} pending adoption(s)`);
            for (const context of inspection.contexts) {'''

          old_output = '''    pending: inspection.contexts.length,
              prior_cumulative_adoptions: inspection.plan.custody.prior_canonical_adoptions,'''
          new_output = '''    pending: inspection.contexts.filter((context) => context.state === "pending").length,
              already_adopted: inspection.contexts.filter((context) => context.state === "already-adopted").length,
              prior_cumulative_adoptions: inspection.plan.custody.prior_canonical_adoptions,'''

          replacements = [(old_state, new_state), (old_apply, new_apply), (old_loop, new_loop), (old_counts, new_counts), (old_validate, new_validate), (old_output, new_output)]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact idempotency patch expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove repaired executor and live exact-null denominator
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          node "$EXECUTOR" --fixtures
          node scripts/estate-canonical-adoption-ledger.mjs
          node "$EXECUTOR" --plan "$PLAN" | tee /tmp/COLLECT-006-idempotency-preflight.json
          test "$(node -p "require('/tmp/COLLECT-006-idempotency-preflight.json').authorized")" = "3"
          test "$(node -p "require('/tmp/COLLECT-006-idempotency-preflight.json').pending")" = "3"
          test "$(node -p "require('/tmp/COLLECT-006-idempotency-preflight.json').already_adopted")" = "0"

      - name: Stage repaired source and retire one-shot authority
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect006-idempotency.yml
          git add -- "$EXECUTOR"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/estate-repair-collect006-idempotency.yml' "$EXECUTOR" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-006-idempotency-repair.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-006-idempotency-repair.tree)" = "$(git write-tree)"
          node "$EXECUTOR" --plan "$PLAN" > /tmp/COLLECT-006-idempotency-postgate.json
          test "$(node -p "require('/tmp/COLLECT-006-idempotency-postgate.json').pending")" = "3"

      - name: Commit and publish exact repair under lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: make COLLECT-006 exact-null state idempotent' \
            -m 'lawful_before_state=exact-null' \
            -m 'lawful_after_state=exact-planned-binding' \
            -m 'unexpected_binding=refused' \
            -m 'evidence_standard=unchanged' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "repair_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-006-idempotency-repair.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report repaired executor
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-006 executor idempotency repaired and fully gated on workflow run $GITHUB_RUN_ID.

          The executor now recognizes only exact-null before adoption and the exact planned versioned binding after adoption. Any other current binding, missing destination, or byte drift still fails closed. The three-record live preflight passed, the complete repository gate and rendered-browser checks passed, and the one-shot repair workflow deleted itself. No canonical media was mutated.
          EOF_COMMENT

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-006 executor repair failed closed on workflow run $GITHUB_RUN_ID. No canonical mutation or batch-four payment claim is authorized.
          EOF_COMMENT
