name: doctor-who-cycle-011-rastel-media-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-media-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-media-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-media-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-media-review-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-media-review-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-media-review-v1
      EVIDENCE_PR: "746"
      EVIDENCE_HEAD: 1326e0595e284a730261078bc345af4091a9df1c
      EVIDENCE_RUN: "31299338135"
      EVIDENCE_JOB: "93209484740"
      EVIDENCE_ARTIFACT: "9034030268"
      EVIDENCE_ZIP_SHA256: 521c2b4527cd92418003c0a65ee7a040d3fe8672eb1ff313d8392d81439b45d5
      EVIDENCE_IDENTITY: c900abac9bf49e19ffe65c6e01ccf3e0e772a26b23c7f25773a08647ddd615b9
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      COVER_SHA256: b1efc0bcd009050a3b6fc1593312a6ddeb8139ac1770f9c45a806fa617bb57cf
      COVER_BYTES: "87752"
      COVER_WIDTH: "600"
      COVER_HEIGHT: "600"
      SOURCE_WALL: UC-1351
      SOURCE_PORTRAIT: images/uc-1351-portrait.jpg
      SOURCE_PORTRAIT_SHA256: fb8b506c7c51b18cc4ffb6aec70125cf378a3395894814305c1ec1fe37d8854a
      SOURCE_PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg
      SOURCE_PORTRAIT_LICENSE: CC BY-SA 2.0
      SOURCE_PORTRAIT_AUTHOR: Gage Skidmore
      CANDIDATE_FILE: /tmp/doctor-who-cycle-011-rastel-media-review-v1/review/uc-1356-portrait-candidate.jpg
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact evidence artifact and carrier geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,evidence,review,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" > "$OUT/api/evidence-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > "$OUT/api/evidence-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN/jobs?per_page=100" > "$OUT/api/evidence-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT" > "$OUT/api/evidence-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT/zip" > "$OUT/evidence.zip"
          test "$(sha256sum "$OUT/evidence.zip" | awk '{print $1}')" = "$EVIDENCE_ZIP_SHA256"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); api=root/'api'; target=root/'evidence'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          own=json.loads((api/'carrier.json').read_text())
          evidence_pr=json.loads((api/'evidence-pr.json').read_text())
          run=json.loads((api/'evidence-run.json').read_text())
          jobs=json.loads((api/'evidence-jobs.json').read_text())['jobs']
          artifact=json.loads((api/'evidence-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert evidence_pr['number']==int(os.environ['EVIDENCE_PR']) and evidence_pr['state']=='open' and evidence_pr['draft'] is True and evidence_pr['merged'] is False
          assert evidence_pr['base']['sha']==os.environ['MAIN'] and evidence_pr['head']['sha']==os.environ['EVIDENCE_HEAD']
          assert evidence_pr['commits']==1 and evidence_pr['changed_files']==1
          assert run['id']==int(os.environ['EVIDENCE_RUN']) and run['name']=='doctor-who-cycle-011-rastel-evidence-v2'
          assert run['head_sha']==os.environ['EVIDENCE_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['EVIDENCE_JOB']))
          assert job['name']=='recover' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['EVIDENCE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['EVIDENCE_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['EVIDENCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['EVIDENCE_HEAD']
          with zipfile.ZipFile(root/'evidence.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          evidence=json.loads((target/'receipt/evidence.json').read_text()); identity=evidence.pop('identity')
          assert identity==os.environ['EVIDENCE_IDENTITY']
          assert sha(json.dumps(evidence,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          evidence['identity']=identity
          assert evidence['status']=='cycle-011-rastel-evidence-complete-v2'
          assert evidence['canonical_main']==os.environ['MAIN'] and evidence['canonical_tree']==os.environ['TREE']
          assert evidence['task']=={'id':os.environ['TASK_ID'],'performer':os.environ['PERFORMER'],'role':os.environ['ROLE'],'mode':os.environ['MODE'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT']}
          assert evidence['source']['image_field']=='' and evidence['source']['image_titles']==[] and evidence['source']['images']==[]
          assert evidence['source']['character_image_status']=='absent' and evidence['source']['adopted'] is False
          official=evidence['official']
          assert official['cover_sha256']==os.environ['COVER_SHA256'] and official['cover_bytes']==int(os.environ['COVER_BYTES'])
          assert official['classification']=='official-publication-cover-unadopted-review-candidate'
          assert official['exact_role_identity_from_official_route'] is False
          assert official['character_still_adopted'] is False and official['performer_portrait_adopted'] is False
          assert evidence['portrait_inventory']['record_count']==7 and evidence['portrait_inventory']['unique_local_digest_count']==7
          assert not any(evidence['boundary'].values())
          (root/'review/evidence.bound.json').write_text(json.dumps(evidence,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rehydrate current main and rerun complete gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$TREE"
          test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/review/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/review/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          jq -e '.total==316 and .statuses.queued==306 and .statuses.resolved==10 and .in_flight==0' "$OUT/review/autopilot-status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/review/waterline-status.json" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Derive and seal byte-distinct Rastel performer portrait candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_PORTRAIT"
          test "$(sha256sum "$SOURCE_PORTRAIT" | awk '{print $1}')" = "$SOURCE_PORTRAIT_SHA256"
          ROOT="$OUT" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          inventory=json.loads((root/'evidence/portraits/inventory.json').read_text())
          assert inventory['performer']==os.environ['PERFORMER']
          assert inventory['record_count']==7 and inventory['unique_local_digest_count']==7
          assert inventory['byte_duplicate_groups']=={}
          row=next(item for item in inventory['records'] if item['wall_id']==os.environ['SOURCE_WALL'])
          assert row['sha256']==os.environ['SOURCE_PORTRAIT_SHA256']
          portrait=row['portrait']
          assert portrait['src']==os.environ['SOURCE_PORTRAIT']
          assert portrait['origin']==os.environ['SOURCE_PORTRAIT_ORIGIN']
          assert portrait['license']==os.environ['SOURCE_PORTRAIT_LICENSE']
          assert portrait['author']==os.environ['SOURCE_PORTRAIT_AUTHOR']
          (root/'review/canonical-portrait-hashes.txt').write_text(''.join(sorted(item['sha256']+'\n' for item in inventory['records'] if item.get('sha256'))))
          PY
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const { chromium }=require('playwright');
          (async()=>{
            const source=fs.readFileSync(process.env.SOURCE_PORTRAIT);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:900,height:900}});
            const result=await page.evaluate(async ({b64})=>{
              const img=new Image();
              img.src='data:image/jpeg;base64,'+b64;
              await img.decode();
              const iw=img.naturalWidth, ih=img.naturalHeight;
              const ratio=420/600;
              let sw,sh;
              if (iw/ih >= ratio) {
                sh=Math.floor(ih*0.94);
                sw=Math.floor(sh*ratio);
                if (sw>iw*0.96) { sw=Math.floor(iw*0.96); sh=Math.floor(sw/ratio); }
              } else {
                sw=Math.floor(iw*0.94);
                sh=Math.floor(sw/ratio);
                if (sh>ih*0.96) { sh=Math.floor(ih*0.96); sw=Math.floor(sh*ratio); }
              }
              const sx=Math.max(0,Math.min(iw-sw,Math.round((iw-sw)*0.48)));
              const sy=Math.max(0,Math.min(ih-sh,Math.round((ih-sh)*0.18)));
              const canvas=document.createElement('canvas');
              canvas.width=420; canvas.height=600;
              const ctx=canvas.getContext('2d');
              ctx.imageSmoothingEnabled=true;
              ctx.imageSmoothingQuality='high';
              ctx.drawImage(img,sx,sy,sw,sh,0,0,420,600);
              return {url:canvas.toDataURL('image/jpeg',0.92),source:{width:iw,height:ih},crop:{x:sx,y:sy,width:sw,height:sh},target:{width:420,height:600},quality:0.92};
            },{b64:source.toString('base64')});
            await browser.close();
            const bytes=Buffer.from(result.url.split(',')[1],'base64');
            fs.mkdirSync(path.dirname(process.env.CANDIDATE_FILE),{recursive:true});
            fs.writeFileSync(process.env.CANDIDATE_FILE,bytes);
            delete result.url;
            fs.writeFileSync(path.join(process.env.OUT,'review','crop.json'),JSON.stringify(result,null,2)+'\n');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          candidate_sha="$(sha256sum "$CANDIDATE_FILE" | awk '{print $1}')"
          test "$candidate_sha" != "$SOURCE_PORTRAIT_SHA256"
          test "$(wc -c < "$CANDIDATE_FILE" | tr -d ' ')" -gt 10000
          test -z "$(grep -Fx "$candidate_sha" "$OUT/review/canonical-portrait-hashes.txt" || true)"
          while IFS= read -r -d '' image; do
            test "$(sha256sum "$image" | awk '{print $1}')" != "$candidate_sha"
          done < <(find images -type f -print0)
          ROOT="$OUT" CANDIDATE_SHA="$candidate_sha" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          evidence=json.loads((root/'review/evidence.bound.json').read_text())
          crop=json.loads((root/'review/crop.json').read_text())
          candidate=Path(os.environ['CANDIDATE_FILE'])
          candidate_sha=os.environ['CANDIDATE_SHA']
          source_bytes=Path(os.environ['SOURCE_PORTRAIT']).read_bytes()
          receipt={
            'status':'cycle-011-rastel-media-independently-adjudicated-v1',
            'version':1,
            'review_run':int(os.environ['GITHUB_RUN_ID']),
            'review_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'canonical_main':os.environ['MAIN'],
            'evidence':{'pr':int(os.environ['EVIDENCE_PR']),'head':os.environ['EVIDENCE_HEAD'],'run':int(os.environ['EVIDENCE_RUN']),'job':int(os.environ['EVIDENCE_JOB']),'artifact':int(os.environ['EVIDENCE_ARTIFACT']),'artifact_sha256':os.environ['EVIDENCE_ZIP_SHA256'],'identity':evidence['identity']},
            'task':evidence['task'],
            'character_still':{'status':'absent','source_image_field':'','source_image_titles':[],'official_cover_sha256':os.environ['COVER_SHA256'],'official_cover_dimensions':{'width':int(os.environ['COVER_WIDTH']),'height':int(os.environ['COVER_HEIGHT'])},'official_cover_classification':'branded-multi-subject-publication-composite','official_cover_exact_rastel_identity':False,'official_cover_adopted':False,'rationale':'Revision-bound source supplies no image. The official cover is a branded Dark Eyes 4 composite with Daleks and human cast; neither source text nor official metadata identifies a depicted figure as Rastel.'},
            'performer_portrait':{'status':'byte-distinct-candidate-verified','candidate_artifact':'review/uc-1356-portrait-candidate.jpg','candidate_sha256':candidate_sha,'candidate_bytes':candidate.stat().st_size,'target_dimensions':crop['target'],'source_wall':os.environ['SOURCE_WALL'],'source_path':os.environ['SOURCE_PORTRAIT'],'source_sha256':os.environ['SOURCE_PORTRAIT_SHA256'],'source_bytes':len(source_bytes),'source_origin':os.environ['SOURCE_PORTRAIT_ORIGIN'],'source_license':os.environ['SOURCE_PORTRAIT_LICENSE'],'source_author':os.environ['SOURCE_PORTRAIT_AUTHOR'],'crop':crop['crop'],'jpeg_quality':crop['quality'],'canonical_portrait_collision':False,'canonical_image_collision':False,'adopted':False},
            'gates':{'evidence_custody':True,'cycle_009_composability':True,'cycle_010':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True,'candidate_byte_distinct':True,'candidate_dimensions':True},
            'boundary':{'lease_issued':False,'queue_mutated':False,'canonical_record_created':False,'character_still_adopted':False,'performer_portrait_adopted':False,'cycle_receipt_written':False,'repository_write':False,'cycle_011_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          (root/'review/media-review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-media-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-media-review-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-media-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-media-review-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
