name: doctor-who-cycle-011-rastel-publisher-repair-materializer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-publisher-repair-materializer-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: 39cf752efaba48271b078152235045be948b0d64
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      SOURCE_BLOB: d95911818b7e9efcb27e4279852076617595319c
      SELF: .github/workflows/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1
      REPAIR_BRANCH: agent/doctor-who-cycle-011-rastel-trusted-publisher-v1-repair
      REPAIR_MESSAGE: "CI: repair trusted Rastel publisher filesystem custody"
      REPAIR_NAME: undercast-cycle-011-publisher-repair
      REPAIR_EMAIL: cycle-011-publisher-repair@users.noreply.github.com
      REPAIR_DATE: 2026-08-10T02:40:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact source and apply only demonstrated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,packet}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$ORIGINAL_MAIN")" = "$ORIGINAL_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          git show "$INSTALLED_MAIN:$SOURCE_PATH" > "$OUT/packet/source.yml"
          test "$(git hash-object "$OUT/packet/source.yml")" = "$SOURCE_BLOB"
          cp "$OUT/packet/source.yml" "$OUT/packet/repaired.yml"
          SOURCE="$OUT/packet/source.yml" REPAIRED="$OUT/packet/repaired.yml" python3 - <<'PY'
          import difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          source=Path(os.environ['SOURCE']); repaired=Path(os.environ['REPAIRED'])
          original=source.read_text(); text=original
          replacements=[]
          def replace_once(name,old,new):
              global text
              count=text.count(old)
              assert count==1,(name,count)
              text=text.replace(old,new)
              replacements.append({'name':name,'occurrences':count,'old_sha256':hashlib.sha256(old.encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest()})
          replace_once(
              'installation-parent-binding',
              '      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386\n      SELF:',
              '      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386\n      INSTALLATION_PARENT: 39cf752efaba48271b078152235045be948b0d64\n      SELF:',
          )
          replace_once(
              'successor-installation-geometry',
              '          test "$(git show -s --format=%P HEAD)" = "$ORIGINAL_MAIN"\n          test "$(git rev-list --count "$ORIGINAL_MAIN"..HEAD)" = 1\n          test -z "$(git rev-list --merges "$ORIGINAL_MAIN"..HEAD)"\n          test "$(git diff --name-status "$ORIGINAL_MAIN"...HEAD)" = $\'A\\t\'"$SELF"\n',
              '          test "$(git show -s --format=%P HEAD)" = "$INSTALLATION_PARENT"\n          test "$(git rev-list --count "$INSTALLATION_PARENT"..HEAD)" = 1\n          test -z "$(git rev-list --merges "$INSTALLATION_PARENT"..HEAD)"\n          test "$(git diff --name-status "$INSTALLATION_PARENT"...HEAD)" = $\'M\\t\'"$SELF"\n          test "$(git diff --name-status "$ORIGINAL_MAIN"...HEAD)" = $\'A\\t\'"$SELF"\n',
          )
          replace_once(
              'precreated-review-directory',
              '          z=Path(os.environ[\'ZIP\']); target=Path(os.environ[\'TARGET\']); target.mkdir()\n',
              '          z=Path(os.environ[\'ZIP\']); target=Path(os.environ[\'TARGET\']); target.mkdir(exist_ok=True)\n',
          )
          assert text.count('target.mkdir(exist_ok=True)')==1
          assert text.count('target.mkdir()')==0
          assert text.count('INSTALLATION_PARENT: 39cf752efaba48271b078152235045be948b0d64')==1
          repaired.write_text(text)
          subprocess.run(['ruby','-e','require "yaml"; YAML.load_file(ARGV[0], aliases: true)',str(repaired)],check=True)
          dollar='$'
          assert dollar+'{{ github.event.workflow_run.id }}' in text
          assert text.count('.github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml')>=4
          patch=''.join(difflib.unified_diff(original.splitlines(True),text.splitlines(True),fromfile='source.yml',tofile='repaired.yml'))
          Path(os.environ['OUT'],'packet','repair.patch').write_text(patch)
          receipt={
              'status':'cycle-011-rastel-trusted-publisher-filesystem-repair-materialized-v1','version':1,
              'source':{'main':os.environ['INSTALLED_MAIN'],'path':os.environ['SOURCE_PATH'],'git_blob':os.environ['SOURCE_BLOB'],'bytes':source.stat().st_size,'sha256':hashlib.sha256(source.read_bytes()).hexdigest()},
              'repaired':{'parent':os.environ['INSTALLED_MAIN'],'path':os.environ['SOURCE_PATH'],'bytes':repaired.stat().st_size,'sha256':hashlib.sha256(repaired.read_bytes()).hexdigest(),'patch_bytes':Path(os.environ['OUT'],'packet','repair.patch').stat().st_size,'patch_sha256':hashlib.sha256(Path(os.environ['OUT'],'packet','repair.patch').read_bytes()).hexdigest()},
              'replacements':replacements,
              'failure':{'publisher_runs':[31349714816,31349717611],'verify_jobs':[93338127808,93338177511],'exception':'FileExistsError','path':'/tmp/doctor-who-cycle-011-rastel-trusted-publisher-v1-verify/review'},
              'boundary':{'product_bytes_changed':False,'approval_predicate_changed':False,'cycle_predicate_changed':False,'gate_predicate_changed':False,'write_predicate_changed':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(os.environ['OUT'],'packet','receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/packet" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/packet/$rel" | sed "s#  $OUT/packet/#  #"; done > "$OUT/packet/SHA256SUMS.pre"
          sha256sum "$OUT/packet/SHA256SUMS.pre" | sed "s#  $OUT/packet/#  #" > "$OUT/packet/SHA256SUMS"

      - name: Verify checksum ledger and unchanged live main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'packet'; pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-repair-materializer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1/packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: 39cf752efaba48271b078152235045be948b0d64
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      SOURCE_BLOB: d95911818b7e9efcb27e4279852076617595319c
      REPAIR_BRANCH: agent/doctor-who-cycle-011-rastel-trusted-publisher-v1-repair
      REPAIR_MESSAGE: "CI: repair trusted Rastel publisher filesystem custody"
      REPAIR_NAME: undercast-cycle-011-publisher-repair
      REPAIR_EMAIL: cycle-011-publisher-repair@users.noreply.github.com
      REPAIR_DATE: 2026-08-10T02:40:00Z
      ARTIFACT_ID: ${{ needs.qualify.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.qualify.outputs.artifact_digest }}
      OUT: /tmp/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1-publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.INSTALLED_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1-publish/packet
          merge-multiple: true

      - name: Reauthenticate materialized repair and create exact branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{api,receipt}
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$OUT/api/artifact.json"
          expected="$ARTIFACT_DIGEST"; case "$expected" in sha256:*) ;; *) expected="sha256:$expected" ;; esac
          jq -e --arg digest "$expected" '.id==(env.ARTIFACT_ID|tonumber) and .expired==false and .digest==$digest' "$OUT/api/artifact.json" >/dev/null
          root="$OUT/packet"; pre="$root/SHA256SUMS.pre"; sealed="$root/SHA256SUMS"
          test "$(sha256sum "$pre" | awk '{print $1}')" = "$(awk '{print $1}' "$sealed")"
          while read -r digest name; do test "$(sha256sum "$root/${name#\*}" | awk '{print $1}')" = "$digest"; done < "$pre"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['OUT']); packet=root/'packet'; sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt=json.loads((packet/'receipt.json').read_text()); identity=receipt.pop('identity')
          assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())==identity
          receipt['identity']=identity
          assert receipt['status']=='cycle-011-rastel-trusted-publisher-filesystem-repair-materialized-v1'
          assert receipt['source']['main']==os.environ['INSTALLED_MAIN'] and receipt['source']['git_blob']==os.environ['SOURCE_BLOB']
          assert not any(receipt['boundary'].values())
          data=(packet/'repaired.yml').read_bytes()
          assert sha(data)==receipt['repaired']['sha256'] and len(data)==receipt['repaired']['bytes']
          payload={'content':base64.b64encode(data).decode(),'encoding':'base64'}
          (root/'blob.json').write_text(json.dumps(payload))
          blob=json.loads(subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input',str(root/'blob.json')],text=True))['sha']
          base_tree=json.loads(subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits/{os.environ['INSTALLED_MAIN']}"],text=True))['tree']['sha']
          tree_payload={'base_tree':base_tree,'tree':[{'path':os.environ['SOURCE_PATH'],'mode':'100644','type':'blob','sha':blob}]}
          (root/'tree.json').write_text(json.dumps(tree_payload))
          tree=json.loads(subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/trees",'--input',str(root/'tree.json')],text=True))['sha']
          commit_payload={'message':os.environ['REPAIR_MESSAGE'],'tree':tree,'parents':[os.environ['INSTALLED_MAIN']],'author':{'name':os.environ['REPAIR_NAME'],'email':os.environ['REPAIR_EMAIL'],'date':os.environ['REPAIR_DATE']},'committer':{'name':os.environ['REPAIR_NAME'],'email':os.environ['REPAIR_EMAIL'],'date':os.environ['REPAIR_DATE']}}
          (root/'commit.json').write_text(json.dumps(commit_payload))
          commit=json.loads(subprocess.check_output(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/commits",'--input',str(root/'commit.json')],text=True))['sha']
          branch=os.environ['REPAIR_BRANCH']
          probe=subprocess.run(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/{branch}"],capture_output=True,text=True)
          assert probe.returncode!=0,probe.stdout+probe.stderr
          ref_payload={'ref':'refs/heads/'+branch,'sha':commit}; (root/'ref.json').write_text(json.dumps(ref_payload))
          subprocess.run(['gh','api','--method','POST',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/refs",'--input',str(root/'ref.json')],check=True)
          publication={'status':'cycle-011-rastel-trusted-publisher-repair-branch-created-v1','version':1,'source_artifact':int(os.environ['ARTIFACT_ID']),'source_digest':os.environ['ARTIFACT_DIGEST'],'parent':os.environ['INSTALLED_MAIN'],'branch':branch,'commit':commit,'tree':tree,'workflow_blob':blob,'workflow_sha256':sha(data),'workflow_bytes':len(data),'force_update':False,'main_mutated':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          publication['identity']=sha(json.dumps(publication,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/publication.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$REPAIR_BRANCH" --jq '.object.sha')" = "$(jq -r '.commit' "$OUT/receipt/publication.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-repair-publication-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-repair-materializer-v1-publish/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
