name: card-backfill-uc-174-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-174-APPLY.json"
      - "scripts/card-backfill-uc-174-apply.mjs"
      - ".github/workflows/card-backfill-uc-174-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-174-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-038'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-038
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic validator renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact reviewed UC-174 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-174-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-174');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-174');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_21dca9535e54bec8e0e15391');
          if(row.version!==1||row.record_id!=='UC-174'||row.kind!=='voice'||row.actor!=='John DiMaggio'||row.character!=='Bender, Jake the Dog, Marcus Fenix'||row.production!=='Futurama / Adventure Time / Gears of War'||row.years!=='1990s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-174 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8734554129||row.render_artifact?.head_sha!=='3fcfb9c1aa122ac947d37f13084cde6b875f7e5a'||row.render_artifact?.zip_sha256!=='781977bad924c61ee23f769a6de5d06d57409e3a490e7c911bb92e695856cd35')throw new Error('UC-174 render custody drift');
          if(Object.keys(row.expected_files||{}).length!==24||row.expected?.packet_file_count!==24||row.expected?.checksum_row_count!==23||row.expected?.duplicate_item_count!==5||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.discovery_candidate_count!==43||JSON.stringify(row.expected?.role_counts)!==JSON.stringify({bender:2,jake:24,marcus:17})||row.expected?.failed_discovery_checkpoint_count!==1||row.expected?.source_page_count!==4||row.expected?.role_count!==3)throw new Error('UC-174 packet denominator drift');
          if(row.expected_files?.['bender-original.webp']?.sha256!=='82afa6ffe64755389b1012fd4d5dbd78d00fd9511f94a2060f32a4a897e99abe'||row.expected_files?.['jake-original.webp']?.sha256!=='97ee77b17442a135d1cdb59679592a8520760b3a4492bda281ffd77c449ea4b8'||row.expected_files?.['marcus-original.webp']?.sha256!=='6f050f7f4b149bc52faba29d096ad25177216694c098ea5a34035b3fa44d3627'||row.expected_files?.['uc-174-still-candidate.jpg']?.sha256!=='851a34e2c324301dae1ab5f83c9bd6f1f6d7d60d472337833bea17afbf0e2a99'||row.expected_files?.['card-crop-preview.jpg']?.sha256!=='992edda209fe64d20903155c6be4794296c4e8ce91b86869042d40d67a2da4c4')throw new Error('UC-174 selected source or render drift');
          if(row.ruling?.identity!=='exact-three-role-subject-set'||row.ruling?.presentation!=='three-role-cross-medium-character-composite'||row.ruling?.crop_ruling!=='pass-face-and-full-source-triptych'||row.ruling?.chronology_ruling!=='pass-role-specific-production-medium-and-career-envelope'||row.ruling?.marcus_selection_ruling!=='pass-full-body-object-over-chest-only-pageimage'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-174 ruling drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='John DiMaggio'||specimen.character!=='Bender, Jake the Dog, Marcus Fenix'||specimen.production!=='Futurama / Adventure Time / Gears of War'||specimen.years!=='1990s–'||specimen.still||specimen.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-174'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-174 audit boundary drift');
          console.log(`PASS — UC-174 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8734554129/zip" > "$root/render.zip"
          echo "781977bad924c61ee23f769a6de5d06d57409e3a490e7c911bb92e695856cd35  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-174"
          test -d "$base"
          echo "f6309a21221997b37a52a62cf7b41c15ea843b7a5b50396527f89ae53dac5dd6  $base/manifest.json" | sha256sum -c -
          echo "505c6fe8acbbecfc670beab9ab4bbf3785b1d40e60ec8a8e51acfc043d2f77f0  $base/review.json" | sha256sum -c -
          echo "9706b6ceb2664042620bdc0d9960d6748bbab429d6082c451ea4cf89903cd036  $base/duplicate-scan.json" | sha256sum -c -
          echo "3cfeeb8cc6628d338ad2201a9d279d25502b686ce14c91a173db32753b50650a  $base/SHA256SUMS" | sha256sum -c -
          echo "bdab9eef38cd76185b5819fddd01c5a59540a588abb17db741122194067e1dd9  $base/exact-voice-record.json" | sha256sum -c -
          echo "82afa6ffe64755389b1012fd4d5dbd78d00fd9511f94a2060f32a4a897e99abe  $base/bender-original.webp" | sha256sum -c -
          echo "97ee77b17442a135d1cdb59679592a8520760b3a4492bda281ffd77c449ea4b8  $base/jake-original.webp" | sha256sum -c -
          echo "6f050f7f4b149bc52faba29d096ad25177216694c098ea5a34035b3fa44d3627  $base/marcus-original.webp" | sha256sum -c -
          echo "851a34e2c324301dae1ab5f83c9bd6f1f6d7d60d472337833bea17afbf0e2a99  $base/uc-174-still-candidate.jpg" | sha256sum -c -
          echo "992edda209fe64d20903155c6be4794296c4e8ce91b86869042d40d67a2da4c4  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30478340011
          artifact_id=8734554129
          artifact_name=card-backfill-uc-174-render-30478340011
          artifact_zip_sha256=781977bad924c61ee23f769a6de5d06d57409e3a490e7c911bb92e695856cd35
          artifact_head_sha=3fcfb9c1aa122ac947d37f13084cde6b875f7e5a
          source_manifest_sha256=f6309a21221997b37a52a62cf7b41c15ea843b7a5b50396527f89ae53dac5dd6
          source_sums_sha256=3cfeeb8cc6628d338ad2201a9d279d25502b686ce14c91a173db32753b50650a
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-174-apply/source/output/UC-174
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-apply"
          node --check scripts/card-backfill-uc-174-apply.mjs
          node scripts/card-backfill-uc-174-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-174-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-174');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-174');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_21dca9535e54bec8e0e15391');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 specimen was canonically mutated');
          if(!source||source.still||source.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-174'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-174 audit disposition was canonically mutated');
          console.log('PASS — UC-174 still remains canonically absent; existing John DiMaggio portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-174.json \
            .github/CARD-BACKFILL-UC-174-DISCOVER.json \
            .github/CARD-BACKFILL-UC-174-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-174-RENDER.json \
            .github/CARD-BACKFILL-UC-174-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-174-scope.yml \
            .github/workflows/card-backfill-uc-174-discover.yml \
            .github/workflows/card-backfill-uc-174-render.yml \
            .github/workflows/card-backfill-uc-174-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-174-scope.mjs \
            scripts/card-backfill-uc-174-discover-build.py \
            scripts/card-backfill-uc-174-render.mjs \
            scripts/card-backfill-uc-174-apply.mjs
          git add -A
          git diff --cached --check -- . \
            ':(exclude)data/review/card-backfill/UC-174/source-raw-bender.wikitext' \
            ':(exclude)data/review/card-backfill/UC-174/source-raw-jake.wikitext' \
            ':(exclude)data/review/card-backfill/UC-174/source-raw-marcus.wikitext'
          echo "6b6eec068fd4449ced076e74b945cec3cdae7c941b02aae0429476fb0226f407  data/review/card-backfill/UC-174/source-raw-bender.wikitext" | sha256sum -c -
          echo "f144acce1e51ce05700a88d05fd45a46a90beded5456fa928d9e8ed3950fcbce  data/review/card-backfill/UC-174/source-raw-jake.wikitext" | sha256sum -c -
          echo "035382281a389e731904fe7bd98457523d0f3c22c3c80dfcb0845db18a887d32  data/review/card-backfill/UC-174/source-raw-marcus.wikitext" | sha256sum -c -
          git commit -m 'Card backfill: retain UC-174 John DiMaggio three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-037
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-037 HEAD)
          test "${#changed[@]}" -eq 24
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-174/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-174-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-038
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-174-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-174-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-174-apply
            data/review/card-backfill/UC-174
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
