name: ferengi-gold-portraits

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-PORTRAITS.json"
      - ".github/workflows/ferengi-gold-portraits.yml"
      - "scripts/ferengi-gold-portrait-gather.mjs"
      - "data/STAR-TREK-GOLD.json"

permissions:
  contents: read

concurrency:
  group: ferengi-gold-portraits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the active species and exact portrait target count
        run: |
          set -euo pipefail
          node scripts/star-trek-species-gold.mjs validate
          node --check scripts/ferengi-gold-portrait-gather.mjs
          node scripts/star-trek-species-gold.mjs targets --species ferengi --out "$RUNNER_TEMP/ferengi-targets.json" > "$RUNNER_TEMP/ferengi-targets.log"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const targets=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ferengi-targets.json','utf8'));
          const portrait=targets.targets.filter(row=>row.missing_portrait);
          const still=targets.targets.filter(row=>row.missing_still);
          if(still.length)throw new Error(`portrait orbit cannot start while ${still.length} Ferengi stills remain open`);
          if(portrait.length!==22)throw new Error(`expected 22 Ferengi portrait targets at this boundary, found ${portrait.length}`);
          console.log(`PASS — ${portrait.length} exact Ferengi portrait targets; no still obligations remain`);
          NODE

  gather:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Gather one independently attributable portrait orbit
        env:
          CONTACT: bigbirdreturns@proton.me
          OUT: ${{ runner.temp }}/ferengi-gold-portraits-${{ matrix.batch }}
        run: |
          set -euo pipefail
          node scripts/ferengi-gold-portrait-gather.mjs \
            --batch "${{ matrix.batch }}" \
            --batches 4 \
            --out "$OUT" \
            2>&1 | tee "$OUT.log"
          mv "$OUT.log" "$OUT/gather.log"
      - name: Upload exact candidate images, hashes, providers and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-portraits-${{ github.run_id }}-batch-${{ matrix.batch }}
          path: ${{ runner.temp }}/ferengi-gold-portraits-${{ matrix.batch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
