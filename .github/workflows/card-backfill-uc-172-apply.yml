name: card-backfill-uc-172-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-172-APPLY.json"
      - "scripts/card-backfill-uc-172-apply.part-00.mjs"
      - "scripts/card-backfill-uc-172-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-172-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-172-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-037'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-037
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-172 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-172-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-172');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-172');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ab0bdc7a6add0fd55b7b1f66');
          if(row.version!==1||row.record_id!=='UC-172'||row.kind!=='voice'||row.actor!=='Jim Cummings'||row.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||row.production!=='Disney'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-172 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8731415645||row.render_artifact?.head_sha!=='e646764d6905235ebd570f2aab426191860ef716'||row.render_artifact?.upload_digest_sha256!=='862ec8e873f5c5e2f9dc2292b2fe40bb006d002f82e204789c49e46551ea71b9')throw new Error('UC-172 render custody drift');
          if(Object.keys(row.expected_files||{}).length!==23||row.denominators?.packet_file_count!==23||row.denominators?.checksum_row_count!==22||row.denominators?.selected_role_count!==3||row.denominators?.actor_role_binding_count!==3||row.denominators?.strict_actor_role_page_count!==3||row.denominators?.raw_revision_count!==3||row.denominators?.api_receipt_count!==6||row.denominators?.failed_discovery_checkpoint_count!==0||row.denominators?.duplicate_item_count!==5||row.denominators?.repository_hash_count!==2070||row.denominators?.discovery_candidate_count!==25)throw new Error('UC-172 packet denominator drift');
          if(row.expected_files?.['pooh-original.webp']?.sha256!=='09791a6423565dc6aab43b4ac298c4665b66ccf5394c0f8cae510625abf78875'||row.expected_files?.['tigger-original.webp']?.sha256!=='064f1c031920489c8255eaac00a7e388d059219ef2ed27ee4d63e48ac9572de8'||row.expected_files?.['darkwing-original.webp']?.sha256!=='cc1829664ec9ac3bb0affbfd1e855d45d9a879064961ec7e3e32c39ad4792533')throw new Error('UC-172 selected source authorization drift');
          if(row.expected_files?.['exact-voice-record.json']?.sha256!=='b7ef5235e38bb525b9af2eb11a1343cfa6e05a152210a94f661b402d11da5954'||row.expected_files?.['uc-172-still-candidate.jpg']?.sha256!=='6f1610661a3c20eec3bfa61c3b799364d05e8096973485a29cfe1dfcc87ec2ec'||row.expected_files?.['card-crop-preview.jpg']?.sha256!=='ff4f4548a518589bbf8a2c47433fd97ee2e29b5d32962fefde9822f5e82180df')throw new Error('UC-172 candidate authorization drift');
          if(row.ruling?.identity!=='exact-three-role-subject-set'||row.ruling?.presentation!=='three-role-animated-character-composite'||row.ruling?.crop_ruling!=='pass-face-and-full-source-triptych'||row.ruling?.chronology_ruling!=='pass-cummings-era-inheritance-and-1991-boundaries'||row.ruling?.inheritance_ruling!=='pass-pooh-and-tigger-predecessor-separation'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-172 ruling drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Jim Cummings'||specimen.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||specimen.production!=='Disney'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-172'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-172 audit boundary drift');
          console.log(`PASS — UC-172 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify exact internal render packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8731415645/zip" > "$root/render.zip"
          transport="$(sha256sum "$root/render.zip" | cut -d' ' -f1)"
          echo "$transport  $root/render.zip" | tee "$root/download-transport-sha256.txt"
          echo "DOWNLOAD_TRANSPORT_SHA256=$transport" >> "$GITHUB_ENV"
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-172"
          test -d "$base"
          test "$(find "$base" -maxdepth 1 -type f | wc -l)" -eq 23
          echo "22fe4433365a25f231db7127e0762bbedaa1b9b1f20de72941a577f31a726202  $base/manifest.json" | sha256sum -c -
          echo "37094aff3fa6732a714990043defc169f9347ba5c3b65004c365a84ce144d4b0  $base/SHA256SUMS" | sha256sum -c -
          echo "b7ef5235e38bb525b9af2eb11a1343cfa6e05a152210a94f661b402d11da5954  $base/exact-voice-record.json" | sha256sum -c -
          echo "6f1610661a3c20eec3bfa61c3b799364d05e8096973485a29cfe1dfcc87ec2ec  $base/uc-172-still-candidate.jpg" | sha256sum -c -
          echo "ff4f4548a518589bbf8a2c47433fd97ee2e29b5d32962fefde9822f5e82180df  $base/card-crop-preview.jpg" | sha256sum -c -
          echo "09791a6423565dc6aab43b4ac298c4665b66ccf5394c0f8cae510625abf78875  $base/pooh-original.webp" | sha256sum -c -
          echo "064f1c031920489c8255eaac00a7e388d059219ef2ed27ee4d63e48ac9572de8  $base/tigger-original.webp" | sha256sum -c -
          echo "cc1829664ec9ac3bb0affbfd1e855d45d9a879064961ec7e3e32c39ad4792533  $base/darkwing-original.webp" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30470459468
          artifact_id=8731415645
          artifact_name=card-backfill-uc-172-render-30470459468
          artifact_upload_digest_sha256=862ec8e873f5c5e2f9dc2292b2fe40bb006d002f82e204789c49e46551ea71b9
          artifact_head_sha=e646764d6905235ebd570f2aab426191860ef716
          source_manifest_sha256=22fe4433365a25f231db7127e0762bbedaa1b9b1f20de72941a577f31a726202
          source_sums_sha256=37094aff3fa6732a714990043defc169f9347ba5c3b65004c365a84ce144d4b0
          transport_semantics=downloaded ZIP container recorded; internal file hashes are authoritative
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-172-apply/source/output/UC-172
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-apply"
          cat scripts/card-backfill-uc-172-apply.part-00.mjs scripts/card-backfill-uc-172-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d' ' -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-172');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-172');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_ab0bdc7a6add0fd55b7b1f66');
          const manifest=JSON.parse(fs.readFileSync('data/review/card-backfill/UC-172/manifest.json','utf8'));
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 specimen was canonically mutated');
          if(!source||source.still||source.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-172'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-172 audit disposition was canonically mutated');
          if(!manifest.custody?.render_artifact_transport?.downloaded_transport_zip_sha256)throw new Error('UC-172 render transport custody missing');
          console.log('PASS — UC-172 still remains canonically absent; existing Jim Cummings portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-172.json \
            .github/CARD-BACKFILL-UC-172-DISCOVER.json \
            .github/CARD-BACKFILL-UC-172-RENDER.json \
            .github/CARD-BACKFILL-UC-172-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-172-scope.yml \
            .github/workflows/card-backfill-uc-172-discover.yml \
            .github/workflows/card-backfill-uc-172-render.yml \
            .github/workflows/card-backfill-uc-172-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-172-scope.mjs \
            scripts/card-backfill-uc-172-discover-build.py \
            scripts/card-backfill-uc-172-render.part-00.mjs \
            scripts/card-backfill-uc-172-render.part-01.mjs \
            scripts/card-backfill-uc-172-apply.part-00.mjs \
            scripts/card-backfill-uc-172-apply.part-01.mjs
          git add -A
          git diff --cached --check -- . \
            ':(exclude)data/review/card-backfill/UC-172/source-raw-pooh.wikitext' \
            ':(exclude)data/review/card-backfill/UC-172/source-raw-tigger.wikitext' \
            ':(exclude)data/review/card-backfill/UC-172/source-raw-darkwing.wikitext'
          echo "f2d7932dd5891d6bc4d48855ffa9b60196744b11e4e135e3c0704b9a08bef559  data/review/card-backfill/UC-172/source-raw-pooh.wikitext" | sha256sum -c -
          echo "95ed91ff10d406ce11fbea9948eaed1d2f286926425327b7dde34667469c9c92  data/review/card-backfill/UC-172/source-raw-tigger.wikitext" | sha256sum -c -
          echo "a27d7f61f5e0888e33a951476a4af5d5f3ec564da21e72bb0e9773711117bc0a  data/review/card-backfill/UC-172/source-raw-darkwing.wikitext" | sha256sum -c -
          git commit -m 'Card backfill: retain UC-172 Jim Cummings three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-036
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-036 HEAD)
          test "${#changed[@]}" -eq 23
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-172/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-037
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-172-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-172-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-172-apply
            data/review/card-backfill/UC-172
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
