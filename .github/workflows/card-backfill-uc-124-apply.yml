name: card-backfill-uc-124-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-124-APPLY.json"
      - "scripts/card-backfill-uc-124-apply.part-00.mjs"
      - "scripts/card-backfill-uc-124-apply.part-01.mjs"
      - "scripts/card-backfill-uc-124-apply.part-02.mjs"
      - ".github/workflows/card-backfill-uc-124-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-124-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-029'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-029
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-124 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-124-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-124');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-124');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4885717de938b33c412d571d');
          if(row.version!==1||row.record_id!=='UC-124'||row.actor!=='James Earl Jones'||row.character!=='Mufasa (and Darth Vader)'||row.production!=='The Lion King / Star Wars'||row.year!==1994||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-124 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8704655432||row.render_artifact?.head_sha!=='1a0430c850117cf27cb3707e83e72b258887a90f'||row.render_artifact?.zip_sha256!=='91a426ee4ddf36a692650fb788dfa77618331cb1d847748d4a20c875259d834c')throw new Error('UC-124 render custody drift');
          if(row.expected?.mufasa_source?.sha256!=='2b75544a317d0ff344dc2e3af005d00e9b6cc37abbb0f4c76cdcce303043049e'||row.expected?.vader_source?.sha256!=='199a80bba0490bd2327409d90ae78fadbbcc1fed80782cdac1d8e6b9bb2d3921')throw new Error('UC-124 source authorization drift');
          if(row.expected?.exact_role_record?.sha256!=='937083579bac51ad92c591c0eaad15a80d26fb22d1688906f29a1d57fb36efe2'||row.expected?.candidate?.sha256!=='9f5a40b1038bf448f33bc0855debfaa57fd5ff67437017e40aca88138441c667'||row.expected?.crop_preview?.sha256!=='1e64f4d72dcaab456361aadcf73d0fe820effce64a421db1f8f3802dd28c4a2a')throw new Error('UC-124 candidate or role authorization drift');
          if(row.expected?.packet_file_count!==14||row.expected?.duplicate_item_count!==4||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==2||row.expected?.discovery_candidate_count!==2||row.expected?.failed_discovery_count!==2)throw new Error('UC-124 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='two-role-voice-character-composite'||row.ruling?.crop_ruling!=='pass-two-panel-face-and-context-layout'||row.ruling?.chronology_ruling!=='pass-1994-lion-king-chronology-separated-from-vader-history'||row.ruling?.embodiment_ruling!=='pass-jones-voice-separated-from-vader-suit-occupancy'||row.ruling?.canonical_mutation!==false)throw new Error('UC-124 ruling drift');
          if(!specimen||specimen.actor!=='James Earl Jones'||specimen.character!=='Mufasa (and Darth Vader)'||specimen.production!=='The Lion King / Star Wars'||specimen.years!=='1994'||specimen.still)throw new Error('UC-124 specimen boundary drift');
          if(source?.still)throw new Error('UC-124 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-124'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-124 audit boundary drift');
          console.log(`PASS — UC-124 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8704655432/zip" > "$root/render.zip"
          echo "91a426ee4ddf36a692650fb788dfa77618331cb1d847748d4a20c875259d834c  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-124"
          test -f "$base/manifest.json"
          echo "dd55ae878d7297364ce11615b03ba440748e46c99b727123a4f6a8a89690315f  $base/manifest.json" | sha256sum -c -
          echo "1593ba8b5cbbf67ac2b39d2c07e730d4b59996c5a8b8b77ef5aa617b83c5d3e4  $base/duplicate-scan.json" | sha256sum -c -
          echo "47e94e17f8c8aee87b20fbaadd4c77bf1788dc26f4897100a204ceb8b6e65276  $base/review.json" | sha256sum -c -
          echo "5e0cd167f0b4b517a4a80bf82f8e3c60ba413501afcd3f39b9eee5fe599d9b92  $base/review.md" | sha256sum -c -
          echo "2129c54b09d29e563e2a5ee13b745074435b15203ccf1afd5951671862a91c6d  $base/SHA256SUMS" | sha256sum -c -
          echo "937083579bac51ad92c591c0eaad15a80d26fb22d1688906f29a1d57fb36efe2  $base/exact-role-record.json" | sha256sum -c -
          echo "2b75544a317d0ff344dc2e3af005d00e9b6cc37abbb0f4c76cdcce303043049e  $base/mufasa-original.jpg" | sha256sum -c -
          echo "199a80bba0490bd2327409d90ae78fadbbcc1fed80782cdac1d8e6b9bb2d3921  $base/vader-original.jpg" | sha256sum -c -
          echo "c65aba98879486a020146a588db1af9aa830017160484253254d2bc18b83e6c6  $base/source-page-disney-james-earl-jones.png" | sha256sum -c -
          echo "0a7a2d06cb2e256506436d3d5d9f1cd18d7972909a7b9c7d1310a47e92f92581  $base/source-page-starwars-james-earl-jones-vader.png" | sha256sum -c -
          echo "7e18062613423b566cee9363dec3004d327714c832b4ee417398d49ff9059492  $base/source-page-d23-lion-king-1994-film.png" | sha256sum -c -
          echo "aa941b85b1f6f76489200c734ef9ccd4cde695082a5393d085c28d0a9ea4e8f6  $base/source-page-d23-remembering-james-earl-jones.png" | sha256sum -c -
          echo "9f5a40b1038bf448f33bc0855debfaa57fd5ff67437017e40aca88138441c667  $base/uc-124-still-candidate.jpg" | sha256sum -c -
          echo "1e64f4d72dcaab456361aadcf73d0fe820effce64a421db1f8f3802dd28c4a2a  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30400845135
          artifact_id=8704655432
          artifact_name=card-backfill-uc-124-render-30400845135
          artifact_zip_sha256=91a426ee4ddf36a692650fb788dfa77618331cb1d847748d4a20c875259d834c
          artifact_head_sha=1a0430c850117cf27cb3707e83e72b258887a90f
          source_manifest_sha256=dd55ae878d7297364ce11615b03ba440748e46c99b727123a4f6a8a89690315f
          source_sums_sha256=2129c54b09d29e563e2a5ee13b745074435b15203ccf1afd5951671862a91c6d
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-124-apply/source/output/UC-124
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-apply"
          cat scripts/card-backfill-uc-124-apply.part-00.mjs scripts/card-backfill-uc-124-apply.part-01.mjs scripts/card-backfill-uc-124-apply.part-02.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-124');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-124');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_4885717de938b33c412d571d');
          if(!specimen||specimen.still)throw new Error('UC-124 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-124 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-124'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-124 audit disposition was canonically mutated');
          console.log('PASS — UC-124 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-124.json \
            .github/CARD-BACKFILL-UC-124-DISCOVER.json \
            .github/CARD-BACKFILL-UC-124-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-124-RENDER.json \
            .github/CARD-BACKFILL-UC-124-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-124-scope.yml \
            .github/workflows/card-backfill-uc-124-discover.yml \
            .github/workflows/card-backfill-uc-124-render.yml \
            .github/workflows/card-backfill-uc-124-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-124-scope.mjs \
            scripts/card-backfill-uc-124-discover.mjs \
            scripts/card-backfill-uc-124-render.part-00.mjs \
            scripts/card-backfill-uc-124-render.part-01.mjs \
            scripts/card-backfill-uc-124-render.part-02.mjs \
            scripts/card-backfill-uc-124-render.part-03.mjs \
            scripts/card-backfill-uc-124-apply.part-00.mjs \
            scripts/card-backfill-uc-124-apply.part-01.mjs \
            scripts/card-backfill-uc-124-apply.part-02.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-124 James Earl Jones two-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-028
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-028 HEAD)
          test "${#changed[@]}" -eq 14
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-124/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-029
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-124-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-124-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-124-apply
            data/review/card-backfill/UC-124
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
