name: doctor-who-cycle-011-rastel-transport-cleanup-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-transport-cleanup-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-transport-cleanup-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-transport-cleanup-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-transport-cleanup-v1.yml
      PREFIX: agent/doctor-who-cycle-011-rastel-
      OUT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-verification
      PACKET: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-proof
      OBSERVER_BRANCH: agent/doctor-who-cycle-011-rastel-postmerge-v1
      OBSERVER_WORKFLOW: doctor-who-cycle-011-rastel-postmerge-v1
      PROOF_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-postmerge-v1-

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind cleanup carrier and terminal proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET"
          mkdir -p "$OUT"/{api,payload,receipt,logs} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$CARRIER_BASE"
          test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CARRIER_BASE"..HEAD)"
          test "$(git diff --name-status "$CARRIER_BASE"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$OBSERVER_BRANCH" -f per_page=100 > "$OUT/api/observer-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'observer-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['OBSERVER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True
          (api/'observer-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'observer-head.txt').write_text(source['head']['sha']+'\n')
          (api/'observer-number.txt').write_text(str(source['number'])+'\n')
          PY
          observer_head="$(cat "$OUT/api/observer-head.txt")"
          observer_pr="$(cat "$OUT/api/observer-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$OBSERVER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/observer-runs.json"
            run_id="$(OBSERVER_HEAD="$observer_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/observer-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['OBSERVER_HEAD'] and row['name']==os.environ['OBSERVER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/observer-run.json"
              if [ "$(jq -r '.status' "$OUT/api/observer-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/observer-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/observer-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/observer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/observer-artifacts.json"
          observer_job="$(jq -r '.jobs[] | select(.name=="observe" and .conclusion=="success") | .id' "$OUT/api/observer-jobs.json")"
          test -n "$observer_job"
          proof_artifact="$(OBSERVER_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/observer-artifacts.json').read_text())['artifacts']
          expected=os.environ['PROOF_ARTIFACT_PREFIX']+os.environ['OBSERVER_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$proof_artifact" > "$OUT/api/proof-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$proof_artifact/zip" > "$OUT/proof.zip"
          proof_sha="$(sha256sum "$OUT/proof.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/proof-artifact.json")" = "sha256:$proof_sha"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nOBSERVER_PR=%s\nOBSERVER_HEAD=%s\nOBSERVER_RUN=%s\nOBSERVER_JOB=%s\nPROOF_ARTIFACT=%s\nPROOF_ZIP_SHA256=%s\n' "$pr" "$head" "$observer_pr" "$observer_head" "$run_id" "$observer_job" "$proof_artifact" "$proof_sha" >> "$GITHUB_ENV"

      - name: Authenticate terminal proof and freeze exact transport census
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'proof.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          rows=[]
          for path in packet.rglob('*.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              if data.get('status')=='cycle-011-rastel-terminal-canonical-proof-v1':rows.append((path,data))
          assert len(rows)==1,[p.as_posix() for p,_ in rows]
          path,proof=rows[0]
          identity=proof.pop('identity'); assert sha(json.dumps(proof,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; proof['identity']=identity
          assert all(proof['gates'].values())
          assert proof['authority']=={'cleanup_authorized':True,'cycle_012_selector_authorized':True,'cycle_012_lease_issued':False,'repository_mutation':False,'canonical_mutation':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          assert proof['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          (root/'receipt/terminal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-terminal-proof-authenticated-for-cleanup-v1','version':1,'observer':{'pr':int(os.environ['OBSERVER_PR']),'head':os.environ['OBSERVER_HEAD'],'run':int(os.environ['OBSERVER_RUN']),'job':int(os.environ['OBSERVER_JOB']),'artifact':int(os.environ['PROOF_ARTIFACT']),'artifact_sha256':os.environ['PROOF_ZIP_SHA256'],'proof_identity':identity},'canonical':proof['canonical'],'ledgers':ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/proof-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          canonical="$(jq -r '.canonical.main' "$OUT/receipt/terminal-proof.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          printf 'CANONICAL_MAIN=%s\n' "$canonical" >> "$GITHUB_ENV"
          : > "$OUT/api/all-pulls.jsonl"
          for page in $(seq 1 20); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f sort=created -f direction=desc -f per_page=100 -f page="$page" > "$OUT/api/pulls-page-$page.json"
            count="$(jq 'length' "$OUT/api/pulls-page-$page.json")"
            [ "$count" = 0 ] && break
            jq -c '.[]' "$OUT/api/pulls-page-$page.json" >> "$OUT/api/all-pulls.jsonl"
            [ "$count" -lt 100 ] && break
          done
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/matching-refs.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          proof=json.loads((root/'receipt/terminal-proof.json').read_text())
          pulls=[]
          for raw in (root/'api/all-pulls.jsonl').read_text().splitlines():
              row=json.loads(raw)
              branch=row['head']['ref']
              if not branch.startswith(os.environ['PREFIX']) or branch==os.environ['BRANCH']:continue
              pulls.append({'pr':row['number'],'branch':branch,'head':row['head']['sha'],'state':row['state'],'draft':row['draft'],'merged':row['merged'],'base_ref':row['base']['ref'],'base_sha':row['base']['sha'],'action':'none' if row['merged'] or row['state']=='closed' else 'close_without_merge'})
          by_pr={row['pr']:row for row in pulls}; assert len(by_pr)==len(pulls)
          refs=[]
          for row in json.loads((root/'api/matching-refs.json').read_text()):
              ref=row['ref']; prefix='refs/heads/'; assert ref.startswith(prefix)
              branch=ref[len(prefix):]
              if not branch.startswith(os.environ['PREFIX']) or branch==os.environ['BRANCH']:continue
              refs.append({'branch':branch,'head':row['object']['sha'],'action':'delete_exact_ref'})
          by_branch={row['branch']:row for row in refs}; assert len(by_branch)==len(refs)
          for row in pulls:
              if row['branch'] in by_branch:assert by_branch[row['branch']]['head']==row['head']
          authorization={'status':'cycle-011-rastel-transport-cleanup-authorized-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'branch':os.environ['BRANCH'],'retained':True},'terminal_proof_identity':proof['identity'],'canonical_main':proof['canonical']['main'],'pull_requests':sorted(pulls,key=lambda row:row['pr']),'refs':sorted(refs,key=lambda row:row['branch']),'counts':{'pull_requests':len(pulls),'close_without_merge':sum(row['action']=='close_without_merge' for row in pulls),'refs':len(refs)},'boundary':{'prefix':os.environ['PREFIX'],'exact_heads_frozen':True,'cleanup_carrier_retained':True,'main_mutation':False,'force_update':False,'merge':False,'cycle_012_lease_issued':False}}
          authorization['identity']=sha(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode())
          (root/'payload/authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v1-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-verification/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v1-verification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-verification
            /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-proof
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  cleanup:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-input
      OUT: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-result
      AUTHORIZATION_NAME: doctor-who-cycle-011-rastel-transport-cleanup-v1-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      PREFIX: agent/doctor-who-cycle-011-rastel-
      RETAINED_BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate same-run cleanup authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']
          rows=[row for row in rows if row['name']==os.environ['AUTHORIZATION_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/authorization-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/authorization.zip"
          zip_sha="$(sha256sum "$OUT/authorization.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/authorization-artifact.json")" = "sha256:$zip_sha"
          AUTHORIZATION_ARTIFACT="$artifact" AUTHORIZATION_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'authorization.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          auth=json.loads((packet/'authorization.json').read_text()); identity=auth.pop('identity'); assert sha(json.dumps(auth,sort_keys=True,separators=(',',':')).encode())==identity; auth['identity']=identity
          assert auth['status']=='cycle-011-rastel-transport-cleanup-authorized-v1'
          assert auth['carrier']['branch']==os.environ['RETAINED_BRANCH'] and auth['carrier']['retained'] is True
          assert auth['boundary']=={'prefix':os.environ['PREFIX'],'exact_heads_frozen':True,'cleanup_carrier_retained':True,'main_mutation':False,'force_update':False,'merge':False,'cycle_012_lease_issued':False}
          assert all(row['branch'].startswith(os.environ['PREFIX']) and row['branch']!=os.environ['RETAINED_BRANCH'] for row in auth['refs'])
          assert all(row['branch'].startswith(os.environ['PREFIX']) and row['branch']!=os.environ['RETAINED_BRANCH'] for row in auth['pull_requests'])
          (out/'receipt/authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          PY
          canonical="$(jq -r '.canonical_main' "$OUT/receipt/authorization.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          printf 'AUTHORIZATION_ARTIFACT=%s\nAUTHORIZATION_ZIP_SHA256=%s\nCANONICAL_MAIN=%s\n' "$artifact" "$zip_sha" "$canonical" >> "$GITHUB_ENV"

      - name: Close unmerged carriers and delete only exact frozen refs
        shell: bash
        run: |
          set -euo pipefail
          : > "$OUT/logs/pr-transitions.jsonl"
          jq -c '.pull_requests[]' "$OUT/receipt/authorization.json" | while IFS= read -r raw; do
            pr="$(jq -r '.pr' <<< "$raw")"; branch="$(jq -r '.branch' <<< "$raw")"; head="$(jq -r '.head' <<< "$raw")"; action="$(jq -r '.action' <<< "$raw")"
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr-$pr-before.json"
            test "$(jq -r '.head.ref' "$OUT/api/pr-$pr-before.json")" = "$branch"
            test "$(jq -r '.head.sha' "$OUT/api/pr-$pr-before.json")" = "$head"
            merged="$(jq -r '.merged' "$OUT/api/pr-$pr-before.json")"
            state="$(jq -r '.state' "$OUT/api/pr-$pr-before.json")"
            if [ "$action" = close_without_merge ]; then
              test "$merged" = false
              if [ "$state" = open ]; then gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$pr" -f state=closed > "$OUT/api/pr-$pr-close.json"; fi
            fi
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr-$pr-after.json"
            after="$(jq -r '.state' "$OUT/api/pr-$pr-after.json")"
            test "$(jq -r '.head.sha' "$OUT/api/pr-$pr-after.json")" = "$head"
            jq -nc --argjson pr "$pr" --arg branch "$branch" --arg head "$head" --arg before "$state" --arg after "$after" --argjson merged "$merged" '{pr:$pr,branch:$branch,head:$head,state_before:$before,state_after:$after,merged:$merged}' >> "$OUT/logs/pr-transitions.jsonl"
          done
          : > "$OUT/logs/ref-transitions.jsonl"
          jq -c '.refs[]' "$OUT/receipt/authorization.json" | while IFS= read -r raw; do
            branch="$(jq -r '.branch' <<< "$raw")"; head="$(jq -r '.head' <<< "$raw")"
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > "$OUT/api/ref-$(printf '%s' "$branch" | sha256sum | cut -c1-16)-before.json" 2>/dev/null; then
              test "$(jq -r '.object.sha' "$OUT/api/ref-$(printf '%s' "$branch" | sha256sum | cut -c1-16)-before.json")" = "$head"
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
              before=present
            else
              before=absent
            fi
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" > /dev/null 2>&1; then echo "ref survived: $branch" >&2; exit 1; fi
            jq -nc --arg branch "$branch" --arg head "$head" --arg before "$before" '{branch:$branch,head:$head,state_before:$before,state_after:"absent"}' >> "$OUT/logs/ref-transitions.jsonl"
          done
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$RETAINED_BRANCH" --jq '.object.sha')" = "${{ github.event.pull_request.head.sha }}"

      - name: Seal transport-cleanup receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); auth=json.loads((root/'receipt/authorization.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          prs=[json.loads(line) for line in (root/'logs/pr-transitions.jsonl').read_text().splitlines() if line]
          refs=[json.loads(line) for line in (root/'logs/ref-transitions.jsonl').read_text().splitlines() if line]
          assert len(prs)==auth['counts']['pull_requests'] and len(refs)==auth['counts']['refs']
          assert all(row['state_after']=='closed' or row['merged'] is True for row in prs)
          assert all(row['state_after']=='absent' for row in refs)
          receipt={'status':'cycle-011-rastel-transport-cleanup-complete-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'authorization':{'artifact':int(os.environ['AUTHORIZATION_ARTIFACT']),'artifact_sha256':os.environ['AUTHORIZATION_ZIP_SHA256'],'identity':auth['identity']},'canonical_main':os.environ['CANONICAL_MAIN'],'pull_requests':prs,'refs':refs,'retained_carrier':auth['carrier'],'boundary':{'all_authorized_unmerged_prs_closed':True,'all_authorized_refs_absent':True,'cleanup_carrier_retained':True,'main_mutation':False,'force_update':False,'merge':False,'cycle_012_lease_issued':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/cleanup.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-transport-cleanup-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-input
            /tmp/doctor-who-cycle-011-rastel-transport-cleanup-v1-result
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
