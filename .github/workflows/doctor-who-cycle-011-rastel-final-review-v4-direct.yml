name: doctor-who-cycle-011-rastel-final-review-v4-direct

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-review-v4-direct.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-review-v4-direct
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-review-v4-direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      MAIN_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v4-direct
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-review-v4-direct.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct
      PACKET: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-source
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct-worktree
      PRODUCER_PR: "810"
      PRODUCER_HEAD: 9df9884e69503303eeb259188ea81f036c6b3dec
      PRODUCER_RUN: "31344933751"
      PRODUCER_JOB: "93325000918"
      PRODUCT_ARTIFACT: "9047037477"
      PRODUCT_ZIP_SHA256: 0ea2c211fde52bff07d16897c2dc9930727b632867d0343e5f56e3ba3c32d294
      PRODUCT_ZIP_FILES: "88"
      QUALIFICATION_IDENTITY: 6310be38d267151128cfe7db70af84aeb56c5feddc654729762890b1a627311c
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_BYTES: "109414"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_BYTES: "5023669"
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_BYTES: "23818240"
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_BYTES: "11852"
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CANDIDATE_COMMIT: 244def71baddd9bdf4591384438b041894d868a1
      CANDIDATE_TREE: 237226254d6ab45b796b7dbf427f4ac21d765d92
      CANDIDATE_RECEIPT: 180ad04ea2288e0f3f99b59991d90b35c6fcc8d640c18fd9af33dbb250082626
      CANDIDATE_APPROVAL: b236fa93c5e5c9b240109644586bbe8115a1c04b807c429766a53559addc48ae
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact carrier, producer, and artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,receipt,logs,handoff} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$MAIN_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCER_PR" > "$OUT/api/producer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN" > "$OUT/api/producer-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN/jobs?per_page=100" > "$OUT/api/producer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCT_ARTIFACT" > "$OUT/api/product-artifact.json"
          CARRIER_HEAD="$head" CARRIER_PR="$pr" CARRIER_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          read=lambda name:json.loads((root/name).read_text())
          own=read('carrier-pr.json'); producer=read('producer-pr.json')
          run=read('producer-run.json'); jobs=read('producer-jobs.json')['jobs']; artifact=read('product-artifact.json')
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert producer['number']==int(os.environ['PRODUCER_PR']) and producer['state']=='open' and producer['draft'] is True and producer['merged'] is False
          assert producer['base']['sha']==os.environ['MAIN'] and producer['head']['sha']==os.environ['PRODUCER_HEAD']
          assert producer['commits']==1 and producer['changed_files']==1
          assert run['id']==int(os.environ['PRODUCER_RUN']) and run['head_sha']==os.environ['PRODUCER_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['PRODUCER_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='success'
          artifact_expected='sha256:'+os.environ['PRODUCT_ZIP_SHA256']
          assert artifact['id']==int(os.environ['PRODUCT_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==artifact_expected
          assert artifact['workflow_run']['id']==int(os.environ['PRODUCER_RUN']) and artifact['workflow_run']['head_sha']==os.environ['PRODUCER_HEAD']
          PY
          printf 'REVIEWER_PR=%s\nREVIEWER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Authenticate qualification and exact handoff bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRODUCT_ARTIFACT/zip" > "$OUT/product.zip"
          test "$(sha256sum "$OUT/product.zip" | awk '{print $1}')" = "$PRODUCT_ZIP_SHA256"
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'product.zip') as archive:
              infos=archive.infolist(); files=[row for row in infos if not row.is_dir()]
              assert len(files)==int(os.environ['PRODUCT_ZIP_FILES']) and len(files)==len({row.filename for row in files})
              for info in files:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file(): continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip(): continue
                  digest,name=raw.split(None,1); path=sealed.parent/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':sealed.parent.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert len(ledgers)>=2
          qpath=packet/'final/qualification.json'; q=json.loads(qpath.read_text()); identity=q.pop('identity')
          assert identity==os.environ['QUALIFICATION_IDENTITY']
          assert sha(json.dumps(q,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          q['identity']=identity
          assert q['status']=='cycle-011-rastel-receipt-bearing-product-qualified'
          assert q['canonical_parent']==os.environ['MAIN']
          assert q['carrier']=={'attempt':1,'head':os.environ['PRODUCER_HEAD'],'pr':int(os.environ['PRODUCER_PR']),'run':int(os.environ['PRODUCER_RUN'])}
          assert q['candidate']['commit']==os.environ['CANDIDATE_COMMIT'] and q['candidate']['tree']==os.environ['CANDIDATE_TREE'] and q['candidate']['receipt_identity']==os.environ['CANDIDATE_RECEIPT']
          assert q['independent_qualification']['identity']==os.environ['CANDIDATE_APPROVAL']
          assert q['finalization']['cycle_id']==os.environ['CYCLE_ID'] and q['finalization']['cycle_event_id']==os.environ['WATERLINE_EVENT']
          assert q['finalization']['receipt_sha256']==os.environ['RECEIPT_IDENTITY'] and q['finalization']['receipt_file_sha256']==os.environ['RECEIPT_FILE_SHA256']
          assert q['finalization']['qualification_identity']==os.environ['CANDIDATE_APPROVAL']
          assert q['media']=={'character_still':'absent','performer_portrait':'verified','portrait_path':'images/uc-1356-portrait.jpg','portrait_sha256':os.environ['PORTRAIT_SHA256']}
          assert q['queue_after']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert q['boundary']=={'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False,'product_merged':False,'product_published':False,'repository_write':False,'twelfth_lease_issued':False}
          assert q['product']=={'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'commit':os.environ['PRODUCT_COMMIT'],'file_manifest_sha256':os.environ['MANIFEST_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],'paths':int(os.environ['PRODUCT_PATHS']),'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'tree':os.environ['PRODUCT_TREE']}
          rows=[
            ('product.bundle',int(os.environ['PRODUCT_BUNDLE_BYTES']),os.environ['PRODUCT_BUNDLE_SHA256']),
            ('product.patch',int(os.environ['PRODUCT_PATCH_BYTES']),os.environ['PRODUCT_PATCH_SHA256']),
            ('product.tar',int(os.environ['PRODUCT_TAR_BYTES']),os.environ['PRODUCT_TAR_SHA256']),
            ('file-manifest.json',int(os.environ['MANIFEST_BYTES']),os.environ['MANIFEST_SHA256']),
          ]
          for name,size,digest in rows:
              source=packet/'final'/name
              assert source.is_file() and source.stat().st_size==size and sha(source.read_bytes())==digest
              shutil.copy2(source,root/'handoff'/name)
          (root/'receipt/source-qualification.json').write_text(json.dumps(q,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-final-product-source-authenticated-v1','version':1,'producer':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'job':int(os.environ['PRODUCER_JOB']),'artifact':int(os.environ['PRODUCT_ARTIFACT']),'artifact_sha256':os.environ['PRODUCT_ZIP_SHA256']},'qualification_identity':identity,'ledgers':ledgers,'handoff':[{'path':name,'bytes':size,'sha256':digest} for name,size,digest in rows]}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/source-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY

      - name: Independently verify product object, manifest, TAR, and patch
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify "$OUT/handoff/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch --no-tags "$OUT/handoff/product.bundle" "$PRODUCT_COMMIT:refs/rastel-final-review-v4/$PRODUCT_COMMIT"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          test "$(git rev-list --count "$MAIN".."$PRODUCT_COMMIT")" = 1
          test -z "$(git rev-list --merges "$MAIN".."$PRODUCT_COMMIT")"
          git diff --name-only "$MAIN" "$PRODUCT_COMMIT" | LC_ALL=C sort > "$OUT/logs/actual-paths.txt"
          git diff --name-status "$MAIN" "$PRODUCT_COMMIT" > "$OUT/logs/actual-name-status.tsv"
          test "$(wc -l < "$OUT/logs/actual-paths.txt" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(awk '$1 ~ /^D/ {print}' "$OUT/logs/actual-name-status.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/actual-name-status.tsv")"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          expected=set((root/'logs/actual-paths.txt').read_text().splitlines())
          manifest=json.loads((root/'handoff/file-manifest.json').read_text())
          assert manifest.get('version')==1 and isinstance(manifest.get('files'),list)
          rows={row['path']:row for row in manifest['files']}
          assert len(rows)==int(os.environ['PRODUCT_PATHS']) and set(rows)==expected
          with tarfile.open(root/'handoff/product.tar','r:') as archive:
              infos=[info for info in archive.getmembers() if info.isfile()]
              assert len(infos)==len(expected) and {PurePosixPath(info.name).as_posix() for info in infos}==expected
              assert not any(info.issym() or info.islnk() for info in archive.getmembers())
              for info in infos:
                  name=PurePosixPath(info.name).as_posix(); row=rows[name]; data=archive.extractfile(info).read()
                  assert len(data)==int(row['bytes']) and sha(data)==row['sha256']
                  assert subprocess.check_output(['git','show',os.environ['PRODUCT_COMMIT']+':'+name])==data
                  tree=subprocess.check_output(['git','ls-tree',os.environ['PRODUCT_COMMIT'],'--',name],text=True).strip()
                  mode,kind,blob,path=tree.split(None,3)
                  assert kind=='blob' and path==name and mode==str(row['mode']) and blob==row['blob']
                  assert info.mode==int(mode[-3:],8)
          patch=subprocess.check_output(['git','diff','--binary',os.environ['MAIN'],os.environ['PRODUCT_COMMIT']])
          assert len(patch)==int(os.environ['PRODUCT_PATCH_BYTES']) and sha(patch)==os.environ['PRODUCT_PATCH_SHA256']
          assert (root/'handoff/product.patch').read_bytes()==patch
          receipt_path='data/review/adapter-sdk/doctor-who-cycle-011-rastel.json'
          assert rows[receipt_path]['sha256']==os.environ['RECEIPT_FILE_SHA256']
          verification={'status':'cycle-011-rastel-final-product-object-verified-v1','version':1,'product':{'commit':os.environ['PRODUCT_COMMIT'],'tree':os.environ['PRODUCT_TREE'],'parent':os.environ['MAIN'],'paths':int(os.environ['PRODUCT_PATHS'])},'artifacts':{'bundle':os.environ['PRODUCT_BUNDLE_SHA256'],'patch':os.environ['PRODUCT_PATCH_SHA256'],'tar':os.environ['PRODUCT_TAR_SHA256'],'manifest':os.environ['MANIFEST_SHA256']},'checks':{'one_parent':True,'tree':True,'workflow_free':True,'deletion_free':True,'manifest_complete':True,'tar_members':True,'tar_modes':True,'git_modes':True,'git_blobs':True,'committed_bytes':True,'binary_patch':True,'receipt_file':True}}
          verification['identity']=sha(json.dumps(verification,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/object-verification.json').write_text(json.dumps(verification,indent=2,sort_keys=True)+'\n')
          PY

      - name: Rerun complete permanent and rendered product gate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT_COMMIT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal independent approval and publication handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          source=json.loads((root/'receipt/source-qualification.json').read_text())
          custody=json.loads((root/'receipt/source-custody.json').read_text())
          objects=json.loads((root/'receipt/object-verification.json').read_text())
          autopilot=json.loads((root/'receipt/autopilot-status.json').read_text())
          waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          approval={'status':'cycle-011-rastel-final-product-independently-approved-v1','version':1,'reviewer':{'pr':int(os.environ['REVIEWER_PR']),'head':os.environ['REVIEWER_HEAD']},'producer':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'job':int(os.environ['PRODUCER_JOB']),'artifact':int(os.environ['PRODUCT_ARTIFACT']),'artifact_sha256':os.environ['PRODUCT_ZIP_SHA256'],'qualification_identity':source['identity']},'product':source['product'],'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['WATERLINE_EVENT'],'receipt_identity':os.environ['RECEIPT_IDENTITY'],'receipt_file_sha256':os.environ['RECEIPT_FILE_SHA256']},'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'source_custody_identity':custody['identity'],'object_verification_identity':objects['identity'],'gates':{'source_artifact':True,'checksum_ledgers':True,'bundle':True,'tar_manifest_modes_blobs_bytes':True,'binary_patch':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True,'clean_reconstruction':True},'boundary':{'approved_for_default_branch_publication':True,'repository_product_ref_created':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          approval['identity']=sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/approval.json').write_text(json.dumps(approval,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          shutil.copy2(root/'receipt/approval.json',root/'handoff/review-approval.json')
          handoff={'status':'cycle-011-rastel-publication-handoff-ready-v1','version':1,'approval_identity':approval['identity'],'product':approval['product'],'cycle':approval['cycle'],'source_artifact':int(os.environ['PRODUCT_ARTIFACT']),'boundary':{'default_branch_publisher_required':True,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False}}
          handoff['identity']=sha(json.dumps(handoff,sort_keys=True,separators=(',',':')).encode())
          (root/'handoff/publication-handoff.json').write_text(json.dumps(handoff,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v4-direct-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-review-v4-direct
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
