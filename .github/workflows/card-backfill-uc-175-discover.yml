name: card-backfill-uc-175-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-175-DISCOVER.json"
      - "scripts/card-backfill-uc-175-discover.mjs"
      - ".github/workflows/card-backfill-uc-175-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-175-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-039'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-039
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-175 sound-performance discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-175-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-175');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-175');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4f6f8c344e4fe375194d8f22');
          if(row.version!==1||row.record_id!=='UC-175'||row.kind!=='voice'||row.actor!=='Ben Burtt'||row.character!=='The voices of R2-D2 & WALL·E'||row.production!=='Star Wars / WALL·E'||row.years!=='1977–'||row.side!=='still')throw new Error('UC-175 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8734947403||row.selector_artifact?.head_sha!=='85708599c4221d90d086e8e0838023895b44571b'||row.selector_artifact?.zip_sha256!=='9428660e0ea84e3f0d27657622f72611a05889eeaf38a652e71f2f8e31a787c4'||row.selector_artifact?.selected_sha256!=='4882b13b6b6aad7ddf6e42a2a0eec5c6d24daaa11eb54fb3145415cd142daaa8')throw new Error('UC-175 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8735112701||row.scope_artifact?.head_sha!=='28243c5017467fa67b8e85a4d26cd32f231509b7'||row.scope_artifact?.zip_sha256!=='d3adaa3ace71a61077d593425438c5c26f0660d072cce938b050f084dd3bc6d9'||row.scope_artifact?.scope_sha256!=='1304300caac883990f9a03dcd0605e7f0f345ed4e4483339336ba2e2109e3ac0')throw new Error('UC-175 scope custody drift');
          if(row.source_pages?.length!==4||row.source_pages.some(page=>page.strict!==true)||row.roles?.length!==2||row.roles[0]?.key!=='r2d2'||row.roles[1]?.key!=='walle')throw new Error('UC-175 discovery denominator drift');
          if(row.selection_contract?.exact_two_role_sound_performance_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['r2d2','walle'])||row.selection_contract?.required_candidate_count_per_role!==1||row.selection_contract?.strict_source_pages_required!==4||row.selection_contract?.ben_burtt_sound_performance_required_for_both_roles!==true||row.selection_contract?.sound_performance_must_remain_separate_from_visible_operators_builders_and_animators!==true||row.selection_contract?.r2d2_original_star_wars_sound_performance_required!==true||row.selection_contract?.walle_2008_pixar_sound_performance_required!==true||row.selection_contract?.official_character_asset_required_for_both_roles!==true||row.selection_contract?.single_role_candidate_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-175 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Ben Burtt'||specimen.character!=='The voices of R2-D2 & WALL·E'||specimen.production!=='Star Wars / WALL·E'||specimen.years!=='1977–'||specimen.still||specimen.portrait?.src!=='images/uc-175-portrait.jpg')throw new Error('UC-175 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-175-portrait.jpg')throw new Error('UC-175 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-175'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-175 audit boundary drift');
          console.log('PASS — exact UC-175 Ben Burtt two-role sound-performance discovery authorized');
          NODE
      - name: Gather official page receipts and exact character assets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-175-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-175-discover.mjs
          node scripts/card-backfill-uc-175-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-175-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, exact character assets, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-175-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-175-discover
            ${{ runner.temp }}/card-backfill-uc-175-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
