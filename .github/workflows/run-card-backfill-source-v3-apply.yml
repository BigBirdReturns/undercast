# Execute after the workflow exists on the branch.
name: run-card-backfill-source-v3-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/run-card-backfill-source-v3-apply.yml'
      - 'scripts/apply-card-backfill-source-v3.py'
      - 'scripts/lib/card-backfill-source-policy-v3.mjs'
      - 'scripts/card-backfill-source-policy-v3-fixtures.mjs'
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/run-card-backfill-source-v3-apply.yml'

permissions:
  contents: write

concurrency:
  group: run-card-backfill-source-v3-apply-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/card-backfill-next-041' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-041
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply exact source-policy-v3 transformation
        run: python3 scripts/apply-card-backfill-source-v3.py
      - name: Install complete gate runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
      - name: Prove source-policy-v3 and the full repository
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-source-v2.mjs
          node --check scripts/card-backfill-source-v2-plan.mjs
          node --check scripts/card-backfill-machine-adjudicate.mjs
          node scripts/card-backfill-source-policy-v2-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-fixtures.mjs
          npm run media:search:fixtures
          node scripts/card-backfill-source-v2-plan.mjs --control .github/CARD-BACKFILL-COHORT.json --out "$RUNNER_TEMP/source-v3-plan" --limit 40
          grep -qx 'planner=source-policy-v3' "$RUNNER_TEMP/source-v3-plan/summary.txt"
          npm run gate
      - name: Commit and push source-policy-v3
        run: |
          set -euo pipefail
          git add -- scripts/lib/card-backfill-source-policy-v2.mjs scripts/lib/card-backfill-source-policy-v3.mjs scripts/card-backfill-source-policy-v2-fixtures.mjs scripts/card-backfill-source-policy-v3-fixtures.mjs scripts/card-backfill-source-v2-plan.mjs scripts/card-backfill-source-v2.mjs scripts/card-backfill-source-v2-enrich-report.mjs scripts/card-backfill-machine-adjudicate.mjs
          git diff --cached --check
          git config user.name 'undercast-card-backfill-source-v3'
          git config user.email 'undercast-card-backfill-source-v3@users.noreply.github.com'
          git commit -m 'Card backfill: require explicit source binding before download'
          git push origin HEAD:agent/card-backfill-next-041
