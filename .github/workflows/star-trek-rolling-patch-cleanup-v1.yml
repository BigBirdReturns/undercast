name: star-trek-rolling-patch-cleanup-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-patch-cleanup-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact patch markers and retire patch carriers
        run: |
          set -euo pipefail
          branch=agent/star-trek-rolling-continuation-v1
          ready=false
          for attempt in $(seq 1 120); do
            git fetch --filter=blob:none --no-tags origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            rolling=.github/recovery/rolling-cycle-controller-rebind-v1.py
            bootstrap=.github/workflows/star-trek-rolling-bootstrap-lwaxana-v1.yml
            post=.github/recovery/post-kzinti-cycle-controller-rebind-v1.py
            kz=.github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py
            if grep -Fq 'star-trek-rolling-media-v1", text)' "$rolling" \
              && ! grep -Fq 'data/review/adapter-sdk/star-trek-[a-z0-9-]+-cycle\\.json",' "$rolling" \
              && grep -Fq "log','--first-parent','HEAD'" "$bootstrap" \
              && grep -Fq 'fs.rmSync(temp,{recursive:true,force:true})' "$bootstrap" \
              && grep -Fq 'star-trek-post-kzinti-media-v1", text)' "$post" \
              && ! grep -Fq 'data/review/adapter-sdk/star-trek-[a-z0-9-]+-cycle\\.json", prior_receipt_rel' "$kz"; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          for path in \
            .github/workflows/star-trek-rolling-template-patch-v1.yml \
            .github/workflows/star-trek-rolling-inherited-template-patch-v1.yml \
            .github/workflows/star-trek-lwaxana-projection-patch-v1.yml \
            .github/workflows/star-trek-rolling-patch-cleanup-v1.yml; do
            test ! -f "$path" || git rm -- "$path"
          done
          git diff --cached --check
          git config user.name undercast-star-trek-patch-cleanup
          git config user.email patch-cleanup@users.noreply.github.com
          git commit -m 'Star Trek rolling continuation: retire completed patch carriers'
          git push origin "HEAD:refs/heads/${branch}"
