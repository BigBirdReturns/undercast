name: doctor-who-cycle-006-current-main-rebind-v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-006-current-main-rebind-v2.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-006-current-main-rebind-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-006-current-main-rebind-v2.yml
  EXACT_MAIN: e149be170525ded693bd2a607515857765e63ede
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-006-current-main-rebind-v2
  SELECTION_RUN: "30950611825"
  SELECTION_ARTIFACT: doctor-who-cycle-006-preflight-30950611825
  MEDIA_RUN: "30951744686"
  MEDIA_ARTIFACT: doctor-who-cycle-006-kayste-media-preflight-30951744686

jobs:
  rebind:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact clean main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test ! -e tmp/ux02a.trigger
          test ! -e .github/workflows/rd-wave03-hosted-executor.yml
          test ! -e tmp/rd-wave03-integration.sh
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies, rendered runtime, and image inspector
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null

      - name: Download exact cycle-006 selection packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: ${{ env.OUT }}/selection
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.SELECTION_RUN }}

      - name: Download exact Kayste media packet
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MEDIA_ARTIFACT }}
          path: ${{ env.OUT }}/media
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.MEDIA_RUN }}

      - name: Prove rolling Doctor Who custody through cycle 005
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          node scripts/autopilot.mjs validate | tee "$OUT/autopilot-validate.log"
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > "$OUT/readiness.json"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/status.json"
          node scripts/waterline.mjs validate --scope doctor-who | tee "$OUT/waterline.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/media-gate.log"
          node scripts/doctor-who-activation.mjs | tee "$OUT/activation.log"
          node scripts/doctor-who-pilot-cycle.mjs | tee "$OUT/pilot.log"
          node scripts/doctor-who-correction-drill.mjs | tee "$OUT/correction-drill.log"
          node scripts/doctor-who-cycle-002.mjs | tee "$OUT/cycle-002.log"
          node scripts/doctor-who-cycle-003.mjs | tee "$OUT/cycle-003.log"
          node scripts/doctor-who-cycle-004-still-correction.mjs | tee "$OUT/cycle-004.log"
          node scripts/doctor-who-cycle-005.mjs | tee "$OUT/cycle-005.log"
          node scripts/autopilot.mjs candidates \
            --scope doctor-who \
            --capability-profile text-vision \
            --limit 200 \
            --json > "$OUT/current-candidates.json"
          test -z "$(git status --porcelain)"

      - name: Rebind exact Kayste source, portrait, and quality boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';

          const out = process.env.OUT;
          const expected = {
            taskId: 'ap_c8e74653ac0877837814db21',
            performer: 'Dan Starkey',
            role: 'Kayste',
            mode: 'voice',
            sourceFingerprint: '5a28fd22ffbd22398bd63338896f32f83edc5b88dc9248e3045fb5e5e85f82e2',
            sourceContentSha: '3ff314fbae95a13aead70ca7934692859d27e1ab57d7289b608692dd44bf06e2',
            sourcePageId: 184657,
            sourceRevision: 2593000,
            portraitPageId: 76686103,
            portraitTitle: 'File:Dan Starkey (27229445610).jpg',
            portraitPage: 'https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg',
            portraitLicense: 'CC BY-SA 2.0',
            portraitAuthor: 'Gage Skidmore',
            portraitOriginalSha: 'efba431abf95c92d66b91d01b29dc34e2237f7211fb1118e27dd92f48eea4d21',
            portraitOriginalBytes: 8419150,
            portraitSha: 'fb8b502322d70d59c670095d45e05f6daa6f7b546bb806d86eb2eac673b58c3e',
            portraitBytes: 48063,
            portraitDimensions: '420x600',
            selectionRun: 30950611825,
            selectionArtifactId: 8908947768,
            selectionArtifactSha: '15f153e93224d75d3168664ba1c55ebf42c61e864280aded3e3c571c5cde4413',
            mediaRun: 30951744686,
            mediaArtifactId: 8909395297,
            mediaArtifactSha: '63438fedf66432d459f0f8fa4343244ee650230de95218ff5648f7da4c8f2ed2',
          };
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const selection = JSON.parse(fs.readFileSync(`${out}/selection/selected-task.json`, 'utf8'));
          const media = JSON.parse(fs.readFileSync(`${out}/media/portrait-candidate-receipt.json`, 'utf8'));
          const qualityProjection = JSON.parse(fs.readFileSync(`${out}/media/quality-projection.json`, 'utf8'));
          const candidates = JSON.parse(fs.readFileSync(`${out}/current-candidates.json`, 'utf8'));
          const readiness = JSON.parse(fs.readFileSync(`${out}/readiness.json`, 'utf8'));
          const status = JSON.parse(fs.readFileSync(`${out}/status.json`, 'utf8'));
          const state = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('data/media-manifest.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json', 'utf8'));
          const quality = JSON.parse(fs.readFileSync('data/quality.json', 'utf8'));
          const sourceBody = fs.readFileSync(`${out}/selection/source-01.wikitext`);
          const portraitPath = `${out}/media/dan-starkey-candidate-420x600.jpg`;
          const originalPath = `${out}/media/dan-starkey-candidate-original.jpg`;
          const portrait = fs.readFileSync(portraitPath);
          const original = fs.readFileSync(originalPath);

          const activeStatuses = new Set(['leased', 'drafted', 'merged']);
          const active = state.jobs.filter((job) => activeStatuses.has(job.status));
          if (active.length !== 0) throw new Error(`global estate has ${active.length} active job(s)`);
          if (status.in_flight !== 0) throw new Error('Doctor Who status reports active work');
          if (!Array.isArray(readiness) || readiness.length !== 1 || readiness[0].lease_status !== 'ready' || !readiness[0].lease_token) throw new Error('Doctor Who is not lease-ready');
          if (candidates.compatible?.[0]?.task_id !== expected.taskId) throw new Error('current deterministic first task is not Kayste');

          const task = state.jobs.find((job) => job.id === expected.taskId);
          if (!task || task.status !== 'queued' || task.scope !== 'doctor-who') throw new Error('Kayste durable task is not queued');
          if (task.performer !== expected.performer || task.character !== expected.role) throw new Error('Kayste durable identity drifted');
          if (!task.performance_modes?.includes(expected.mode)) throw new Error('Kayste voice mode drifted');
          if (task.source_fingerprint !== expected.sourceFingerprint) throw new Error('Kayste source fingerprint drifted');
          const receipt = task.source_receipts?.[0];
          if (receipt?.pageid !== expected.sourcePageId || receipt?.revision !== expected.sourceRevision || receipt?.content_sha256 !== expected.sourceContentSha) throw new Error('Kayste source receipt drifted');
          if (selection.task.id !== expected.taskId || selection.task.source_fingerprint !== expected.sourceFingerprint) throw new Error('selection artifact drifted');
          if (sha256(sourceBody) !== expected.sourceContentSha) throw new Error('recovered Kayste source body drifted');

          if (media.selected.pageid !== expected.portraitPageId || media.selected.title !== expected.portraitTitle) throw new Error('Commons file identity drifted');
          if (media.selected.description_url !== expected.portraitPage || media.selected.license !== expected.portraitLicense) throw new Error('Commons source or license drifted');
          if (!String(media.selected.artist).includes(expected.portraitAuthor)) throw new Error('Commons author drifted');
          if (media.original.sha256 !== expected.portraitOriginalSha || media.original.bytes !== expected.portraitOriginalBytes) throw new Error('original portrait receipt drifted');
          if (media.candidate.sha256 !== expected.portraitSha || media.candidate.bytes !== expected.portraitBytes || media.candidate.dimensions !== expected.portraitDimensions) throw new Error('prepared portrait receipt drifted');
          if (portrait.length !== expected.portraitBytes || sha256(portrait) !== expected.portraitSha) throw new Error('prepared portrait bytes drifted');
          if (original.length !== expected.portraitOriginalBytes || sha256(original) !== expected.portraitOriginalSha) throw new Error('original portrait bytes drifted');
          const identify = spawnSync('identify', ['-format', '%wx%h', portraitPath], {encoding: 'utf8'});
          if (identify.status !== 0 || identify.stdout.trim() !== expected.portraitDimensions) throw new Error('prepared portrait dimensions drifted');

          const existingHashes = new Set(Object.values(manifest.assets ?? {}).map((entry) => entry?.sha256).filter(Boolean));
          for (const item of audit.items ?? []) if (item.asset?.sha256) existingHashes.add(item.asset.sha256);
          if (existingHashes.has(expected.portraitSha) || existingHashes.has(expected.portraitOriginalSha)) throw new Error('reviewed portrait now duplicates current media');

          const max = quality.baseline?.maximum_missing_both_ratio;
          if (!Number.isFinite(max)) throw new Error('quality maximum is missing');
          if (!(qualityProjection.kayste_both_absent.ratio > max)) throw new Error('both-absent Kayste unexpectedly meets quality floor');
          if (!(qualityProjection.kayste_portrait_only.ratio <= max)) throw new Error('portrait-only Kayste no longer meets quality floor');
          if (qualityProjection.current.records !== quality.total || qualityProjection.current.missing_both !== quality.metrics.missing_both) throw new Error('quality denominator drifted');

          const queue = state.jobs.filter((job) => job.scope === 'doctor-who').reduce((acc, job) => {
            acc[job.status] = (acc[job.status] || 0) + 1;
            return acc;
          }, {});
          const rebound = {
            version: 3,
            exact_main: process.env.EXACT_MAIN,
            lease_issued: false,
            global_active_count: active.length,
            task: {
              id: expected.taskId,
              performer: task.performer,
              role: task.character,
              performance_modes: task.performance_modes,
              source_fingerprint: task.source_fingerprint,
              source_receipts: task.source_receipts,
            },
            queue,
            readiness: readiness[0],
            evidence: {
              selection_run: expected.selectionRun,
              selection_artifact_id: expected.selectionArtifactId,
              selection_artifact_sha256: expected.selectionArtifactSha,
              media_run: expected.mediaRun,
              media_artifact_id: expected.mediaArtifactId,
              media_artifact_sha256: expected.mediaArtifactSha,
            },
            portrait: {
              source_file: expected.portraitTitle,
              source_pageid: expected.portraitPageId,
              source_url: expected.portraitPage,
              author: expected.portraitAuthor,
              license: expected.portraitLicense,
              original_sha256: expected.portraitOriginalSha,
              original_bytes: expected.portraitOriginalBytes,
              candidate_sha256: expected.portraitSha,
              candidate_bytes: expected.portraitBytes,
              candidate_dimensions: expected.portraitDimensions,
              current_media_duplicate: false,
              adopted: false,
              visual_reviewed: true,
              use_boundary: 'performer portrait only; Kayste character still remains absent',
            },
            quality: {
              current: qualityProjection.current,
              both_absent: qualityProjection.kayste_both_absent,
              portrait_only: qualityProjection.kayste_portrait_only,
              maximum_missing_both_ratio: max,
            },
            boundary: {
              wave03_executor_present: false,
              ux02a_trigger_present: false,
              claim_authorized: true,
              queue_mutated: false,
              canonical_record_created: false,
              media_adopted: false,
              cycle_receipt_written: false,
            },
          };
          const canonical = JSON.stringify(rebound);
          fs.writeFileSync(`${out}/current-main-rebind.json`, `${JSON.stringify(rebound, null, 2)}\n`);
          fs.writeFileSync(`${out}/current-main-rebind.sha256`, `${sha256(Buffer.from(canonical))}\n`);
          fs.copyFileSync(portraitPath, `${out}/kayste-performer-portrait-candidate.jpg`);
          fs.copyFileSync(`${out}/selection/source-01.wikitext`, `${out}/kayste-source.wikitext`);
          NODE
          test -z "$(git status --porcelain)"

      - name: Run complete repository gate on exact clean main
        shell: bash
        run: |
          set -euo pipefail
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Record exact read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$EXACT_MAIN" > "$OUT/exact-main.txt"
          printf '%s\n' "$HEAD_SHA" > "$OUT/carrier-head.txt"
          cp /tmp/expected-paths.txt "$OUT/"
          cp /tmp/actual-paths.txt "$OUT/"
          git ls-tree -r --full-tree "$EXACT_MAIN" > "$OUT/exact-tree.txt"
          test -z "$(git status --porcelain)"

      - name: Upload exact clean-main Kayste rebind
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-current-main-rebind-v2-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: ${{ env.OUT }}
