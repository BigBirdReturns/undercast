name: estate-publish-uc338-season17-packet

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-publish-uc338-season17-packet.yml
      - scripts/estate-build-uc338-season17-packet.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-publish-uc338-season17-packet
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILDER: scripts/estate-build-uc338-season17-packet.py
  PACKET_ROOT: data/review/card-backfill/UC-338-season17-replacement
  PUBLICATION: data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head evidence custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$BUILDER"
          test ! -e "$PACKET_ROOT"
          test ! -e "$PUBLICATION"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: |
          npm ci
          python -m pip install --quiet requests beautifulsoup4 'pillow==12.2.0'
          npx playwright install --with-deps chromium

      - name: Build exact Season 17 replacement packet
        run: |
          set -euo pipefail
          python "$BUILDER" | tee /tmp/COLLECT-012-packet-build.json
          test "$(node -p "require('/tmp/COLLECT-012-packet-build.json').source_sha256")" = "328564b9d55be07a33d61b26cf21a0a5e0b7067f355bae295e0be16ba6f08e1d"
          test "$(node -p "require('/tmp/COLLECT-012-packet-build.json').candidate_sha256")" = "fe30c21c2a1781bb83e4d6ecf3ac4c000985af02e568af7014c104031701e8e0"
          test "$(node -p "require('/tmp/COLLECT-012-packet-build.json').preview_sha256")" = "231990cc3f29de0b1d2827f2e7e49502c73a1337d6a1f3a17a3151facf2913dd"
          test "$(node -p "require('/tmp/COLLECT-012-packet-build.json').destination")" = "images/uc-338-still-fe30c21c2a17.jpg"
          test "$(node -p "require('/tmp/COLLECT-012-packet-build.json').files")" = "11"

      - name: Prove source and candidate are not repository duplicates
        run: |
          set -euo pipefail
          SOURCE_SHA="$(node -p "require('/tmp/COLLECT-012-packet-build.json').source_sha256")"
          CANDIDATE_SHA="$(node -p "require('/tmp/COLLECT-012-packet-build.json').candidate_sha256")"
          PREVIEW_SHA="$(node -p "require('/tmp/COLLECT-012-packet-build.json').preview_sha256")"
          : > /tmp/COLLECT-012-duplicate-scan.tsv
          while IFS= read -r -d '' file; do
            case "$file" in
              "$PACKET_ROOT"/*) continue ;;
            esac
            hash="$(sha256sum "$file" | cut -d' ' -f1)"
            case "$hash" in
              "$SOURCE_SHA"|"$CANDIDATE_SHA"|"$PREVIEW_SHA") printf '%s\t%s\n' "$hash" "$file" >> /tmp/COLLECT-012-duplicate-scan.tsv ;;
            esac
          done < <(find images data/review/card-backfill -type f -print0)
          test ! -s /tmp/COLLECT-012-duplicate-scan.tsv
          test "$SOURCE_SHA" != "47b6ac14459f0efe8dfb1e54c3dc43f6887cf10434465c7af8f139c4ffac90c3"
          test "$CANDIDATE_SHA" != "416f0403769742e5b9128c05e7c2c7631ecc8ad24ab352ee688ff3e138545372"

      - name: Stage exact packet tree and retire builder
        run: |
          set -euo pipefail
          git add -- "$PACKET_ROOT"
          git rm "$BUILDER"
          PATHS="$(git diff --cached --name-only | sort)"
          test "$(printf '%s\n' "$PATHS" | grep -c '^data/review/card-backfill/UC-338-season17-replacement/')" = "11"
          test "$(printf '%s\n' "$PATHS" | grep -c '^scripts/estate-build-uc338-season17-packet.py$')" = "1"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-012-packet.tree

      - name: Gate exact evidence packet tree
        run: npm run gate

      - name: Refuse post-gate packet drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-012-packet.tree)" = "$(git write-tree)"
          test ! -e "$BUILDER"

      - name: Bind publication receipt to gated packet tree
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          build = json.loads(Path('/tmp/COLLECT-012-packet-build.json').read_text())
          packet_manifest = Path(os.environ['PACKET_ROOT']) / 'manifest.json'
          manifest_bytes = packet_manifest.read_bytes()
          publication = {
            'version': 1,
            'transaction': 'COLLECT-012',
            'operation': 'uc338-season17-replacement-packet-publication',
            'status': 'published-evidence-only',
            'recorded_at': '2026-08-01T17:10:00Z',
            'authorization': {
              'authorized_parent': os.environ['AUTHORIZED_HEAD'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'gated_packet_tree': Path('/tmp/COLLECT-012-packet.tree').read_text().strip(),
            },
            'discovery': {
              'workflow_run': 30709305079,
              'artifact_id': 8821353486,
              'artifact_sha256': '4c0202e1597d038fe96993a7cb5b7d8154a36c9e081132bda85f0f9e7fa67fff',
              'selected_index': 15,
            },
            'packet': {
              'root': os.environ['PACKET_ROOT'],
              'manifest_path': str(packet_manifest),
              'manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'packet_sha256': build['packet_sha256'],
              'source_sha256': build['source_sha256'],
              'candidate_sha256': build['candidate_sha256'],
              'wall_preview_sha256': build['preview_sha256'],
              'canonical_destination': build['destination'],
              'files': build['files'],
            },
            'ruling': {
              'obligation_id': 'UC-338/still',
              'status': 'authorized-era-specific-distinct-still',
              'source_page': 'https://www.doctorwho.tv/stories/the-horns-of-nimon',
              'source_asset': 'https://cms.doctorwho.tv/sites/default/files/2022-03/Horns%20of%20Nimon%20-%201920x1080.jpg',
              'season': 17,
              'performance_credit': 'K9 (voice): David Brierly',
            },
            'boundary': {
              'canonical_mutation': False,
              'original_packet_rewritten': False,
              'cross_card_duplicate_policy_lowered': False,
              'temporary_builder_retired': True,
              'next_authorized_work': 'adopt UC-338/still as the final imported packet obligation',
            },
          }
          path = Path(os.environ['PUBLICATION'])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(publication, indent=2) + '\n', encoding='utf-8')
          PY
          git add -- "$PUBLICATION"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-012-publication.tree

      - name: Gate final packet-publication custody tree
        run: npm run gate

      - name: Publish exact packet custody under lease
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-012-publication.tree)" = "$(git write-tree)"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate evidence: publish distinct Season 17 K9 packet' \
            -m 'transaction=COLLECT-012' \
            -m 'obligation=UC-338/still' \
            -m 'source_sha256=328564b9d55be07a33d61b26cf21a0a5e0b7067f355bae295e0be16ba6f08e1d' \
            -m 'candidate_sha256=fe30c21c2a1781bb83e4d6ecf3ac4c000985af02e568af7014c104031701e8e0' \
            -m 'original_packet_rewritten=false' \
            -m 'canonical_mutation=false' \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_packet_tree=$(cat /tmp/COLLECT-012-packet.tree)" \
            -m "gated_publication_tree=$(cat /tmp/COLLECT-012-publication.tree)"
          PUBLISHED_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-012 published the exact Season 17 replacement packet for UC-338/still on workflow run ${GITHUB_RUN_ID}. Published head: ${PUBLISHED_HEAD}. Both the evidence packet tree and final publication-custody tree passed the complete repository and rendered-browser gate. The original deferred packet remains untouched; the temporary builder retired itself."

      - name: Preserve packet publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-012-UC338-season17-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-012-packet-build.json
            /tmp/COLLECT-012-duplicate-scan.tsv
            /tmp/COLLECT-012-packet.tree
            /tmp/COLLECT-012-publication.tree
            data/review/card-backfill/UC-338-season17-replacement
            data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json
          if-no-files-found: warn
          retention-days: 30
