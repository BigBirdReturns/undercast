name: doctor-who-cycle-012-rastel-materializer-source-export-v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/doctor-who-cycle-012-rastel-materializer-source-export-v2.yml

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_MAIN: 108ea5f461ceb24d9253f246e7d88fc8ca8d74bb
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      BRANCH: agent/doctor-who-cycle-012-rastel-materializer-source-export-v2
      SELF: .github/workflows/doctor-who-cycle-012-rastel-materializer-source-export-v2.yml
      OUT: /tmp/doctor-who-cycle-012-rastel-materializer-source-export-v1
      MODALITY_PR: '900'
      MODALITY_HEAD: 7f61343525a5ca5dcc304ee6daab0e25ee0f1dd3
      MODALITY_RUN: '31416341086'
      MODALITY_JOB: '93546159625'
      MODALITY_ARTIFACT: '9073823711'
      MODALITY_ARTIFACT_BYTES: '85596'
      MODALITY_ARTIFACT_SHA256: f90daaae4b9059e675deaf41d2542c48e08e7e3caa3f932f97f16b3946bdf2b0
      MODALITY_IDENTITY: ef754232b56a25f9f703cbaaaa03290f1cb9a3d97c354d00a58e21e75f732e50
      MATERIALIZER_BLOB: 11e1b8305c39ba8c23c4be10c39601c7f382424e
      MATERIALIZER_GZIP_BYTES: '11787'
      MATERIALIZER_GZIP_SHA256: 29ec7e97a642e64f4cd4f5ee2e5ab55c4ebbe6e8cece80df10c5cba701b45b46
      MATERIALIZER_BYTES: '48773'
      MATERIALIZER_SHA256: 578a634d4d8ab95a49197e03451413e8f6bf25a2005bbbe3d74195a0d1ee8b47
      CONTROLLER_TEXT_BLOB: 304bff444a5663bb710932522963b3c54652d536
      CONTROLLER_B64_BYTES: '4104'
      CONTROLLER_B64_SHA256: 7472941a92fc7f7a449b9a1ef1f0c53ec86c27ca082844b3686959f11c009c82
      CONTROLLER_GZIP_BYTES: '3077'
      CONTROLLER_GZIP_SHA256: eed7371a3d6977a027797c6facaa611f291d8c748ffcaf4ae55beaf360efef6f
      CONTROLLER_BYTES: '8236'
      CONTROLLER_SHA256: 3a7dad62b2fcea62baffb714732bd7e131bcdbd23e818e82245880e95888c969
      LOADER: /tmp/doctor-who-cycle-012-rastel-materializer-source-export-v2-loader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and execute exact read-only materializer source export
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          git fetch origin main --depth=1
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_TEXT_BLOB" > "$LOADER/controller-text-blob.json"
          jq -r '.content' "$LOADER/controller-text-blob.json" | tr -d '\n' | base64 -d > "$LOADER/controller.sh.gz.b64"
          test "$(git hash-object --stdin < "$LOADER/controller.sh.gz.b64")" = "$CONTROLLER_TEXT_BLOB"
          test "$(wc -c < "$LOADER/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$LOADER/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d "$LOADER/controller.sh.gz.b64" > "$LOADER/controller.sh.gz"
          test "$(wc -c < "$LOADER/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$LOADER/controller.sh.gz" > "$LOADER/controller.sh"
          test "$(wc -c < "$LOADER/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$LOADER/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$LOADER/controller.sh"
          chmod 700 "$LOADER/controller.sh"
          "$LOADER/controller.sh"
      - name: Upload exact materializer source export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-rastel-materializer-source-export-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-rastel-materializer-source-export-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-rastel-materializer-source-export-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-rastel-materializer-source-export-v1
            /tmp/doctor-who-cycle-012-rastel-materializer-source-export-v2-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
