name: queen-source-run-index-v1

on:
  push:
    branches:
      - agent/queen-source-run-index-v1

permissions:
  actions: read
  contents: write

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_BRANCH: agent/queen-source-run-index-result-v1
      ROOT: transport/queen-source-run-index-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Index retained Queen workflow run heads
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/queen-source-run-index-v1
          mkdir -p /tmp/queen-source-run-index-v1
          : > /tmp/queen-source-run-index-v1/rows.jsonl
          branches=(
            agent/star-trek-queen-hearts-cycle-v1
            agent/star-trek-queen-of-hearts-cycle-v1
            agent/star-trek-queen-hearts-media-v1
            agent/star-trek-queen-of-hearts-source-media-v1
          )
          for n in $(seq 1 15); do branches+=("agent/star-trek-queen-hearts-source-v${n}"); done
          for branch in "${branches[@]}"; do
            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${encoded}&per_page=100")"
            jq -c --arg branch "$branch" '.workflow_runs[] | {queried_branch:$branch,id,name,path,event,status,conclusion,head_branch,head_sha,created_at,updated_at,run_number,run_attempt}' <<<"$runs" >> /tmp/queen-source-run-index-v1/rows.jsonl
          done
          jq -s 'sort_by(.created_at)' /tmp/queen-source-run-index-v1/rows.jsonl > /tmp/queen-source-run-index-v1/runs.json
          jq -s 'group_by(.queried_branch) | map({branch:.[0].queried_branch,count:length,heads:(map({head_sha,name,path,status,conclusion,created_at,id})|unique_by(.head_sha))})' /tmp/queen-source-run-index-v1/rows.jsonl > /tmp/queen-source-run-index-v1/by-branch.json
          jq -n \
            --argjson rows "$(wc -l < /tmp/queen-source-run-index-v1/rows.jsonl | tr -d ' ')" \
            --argjson unique_heads "$(jq -r '.[].head_sha' /tmp/queen-source-run-index-v1/runs.json | sort -u | wc -l | tr -d ' ')" \
            '{version:1,transaction:"QUEEN-SOURCE-RUN-INDEX-V1",rows:$rows,unique_heads:$unique_heads}' \
            > /tmp/queen-source-run-index-v1/status.json
          git config user.name undercast-queen-source-index
          git config user.email queen-source-index@users.noreply.github.com
          git switch --orphan index-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/queen-source-run-index-v1/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'Index Queen of Hearts historical source run heads'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
