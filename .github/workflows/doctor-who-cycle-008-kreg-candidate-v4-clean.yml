name: doctor-who-cycle-008-kreg-candidate-v4-clean

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-candidate-v4-clean.yml"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-00.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-01.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-02.b64"
      - ".github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-03.b64"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: doctor-who-cycle-008-kreg-candidate-v4-clean-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-candidate-v4-clean
  OUT: /tmp/doctor-who-cycle-008-kreg-candidate-v4-clean
  RUNNER_PATH: /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.sh
  RUNNER_PART_00: .github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-00.b64
  RUNNER_PART_01: .github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-01.b64
  RUNNER_PART_02: .github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-02.b64
  RUNNER_PART_03: .github/doctor-who-cycle-008/kreg-candidate-v4/runner.part-03.b64
  PART_00_SHA256: ec675753305318afeda56d24db4221c22aee589c5cd7ad5df40892163f7530a1
  PART_01_SHA256: 108089be8503950576344a8747e72b8b7af2e64e54a2e9817bd111b6e9f1b1d5
  PART_02_SHA256: 4f29c5160e99a4d44fd51492efd089a32a7679e5f94b00ff19d2717df60dbdec
  PART_03_SHA256: 955744bc24db2f8d094ac555578f0f1565b7c53532a6b3a61cbd1aecc5502f54
  JOINED_B64_CHARS: "5396"
  JOINED_B64_SHA256: 94e28e49f057084319a238c76e51474fa04619ed7eddb2ff583c88b635e3360d
  RUNNER_GZIP_SHA256: 44c00775bdc49d11811b246c8544c58e2488c30533963eebade7ceb12532f474
  RUNNER_BYTES: "13187"
  RUNNER_SHA256: 8721954c904ba069542522db28fe483d6345e2ec1ecc7bba0d52445d06f674e4

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-candidate-v4-clean'
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct, verify, and execute exact Kreg candidate runner
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "$AUTHORIZED_BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(sha256sum "$RUNNER_PART_00" | awk '{print $1}')" = "$PART_00_SHA256"
          test "$(sha256sum "$RUNNER_PART_01" | awk '{print $1}')" = "$PART_01_SHA256"
          test "$(sha256sum "$RUNNER_PART_02" | awk '{print $1}')" = "$PART_02_SHA256"
          test "$(sha256sum "$RUNNER_PART_03" | awk '{print $1}')" = "$PART_03_SHA256"

          cat "$RUNNER_PART_00" "$RUNNER_PART_01" "$RUNNER_PART_02" "$RUNNER_PART_03" \
            | tr -d '\r\n' > /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.b64
          test "$(wc -c < /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.b64)" = "$JOINED_B64_CHARS"
          test "$(sha256sum /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.b64 | awk '{print $1}')" = "$JOINED_B64_SHA256"

          base64 --decode /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.b64 \
            > /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.sh.gz
          test "$(sha256sum /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.sh.gz | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc /tmp/doctor-who-cycle-008-kreg-candidate-v4-runner.sh.gz > "$RUNNER_PATH"
          test "$(wc -c < "$RUNNER_PATH")" = "$RUNNER_BYTES"
          test "$(sha256sum "$RUNNER_PATH" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0555 "$RUNNER_PATH"
          bash -n "$RUNNER_PATH"
          ! grep -F '/mnt/data/' "$RUNNER_PATH"
          bash "$RUNNER_PATH"

      - name: Upload exact Kreg candidate qualification packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-candidate-v4-clean-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
