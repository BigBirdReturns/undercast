name: rebind-cycle004-still-correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rebind-cycle004-still-correction.yml"

permissions:
  contents: write

concurrency:
  group: rebind-cycle004-still-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 39a58f2c5538da1adb7657623ee300dbca54a82d
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  SELF: .github/workflows/rebind-cycle004-still-correction.yml
  TARGET: .github/workflows/complete-doctor-who-cycle-004-jask-still-correction.yml
  OLD_SHA256: 578e4814fea70dbb23e1125a31d71645a1b548249df86821e46ced3f3b79501f
  NEW_SHA256: 6f976c27a58bf98cd95f634c31d5ba2e00a91fc6fa1fd5dd771d4b01782c52e3

jobs:
  rebind:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-004-jask-still-correction'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 256

      - name: Rebind only the exact transport digest and self-delete
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=256 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          python3 - <<'PY'
          from pathlib import Path
          import os
          target = Path(os.environ['TARGET'])
          text = target.read_text()
          old = os.environ['OLD_SHA256']
          new = os.environ['NEW_SHA256']
          if text.count(old) != 1:
              raise SystemExit(f'expected one old transport digest, found {text.count(old)}')
          if new in text:
              raise SystemExit('new transport digest already present')
          target.write_text(text.replace(old, new, 1))
          PY

          git rm -f "$SELF"
          git add "$TARGET"
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$TARGET $SELF " || {
            git diff --cached --name-only >&2
            exit 1
          }
          git commit -m 'Transport: bind repacked cycle 004 still correction to UX-02 main'
          rebound="$(git rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "rebound_head=$rebound" >> "$GITHUB_STEP_SUMMARY"
          echo "transport_sha256=$NEW_SHA256" >> "$GITHUB_STEP_SUMMARY"
