name: star-trek-cadmar-program-diagnostic

on:
  push:
    branches:
      - agent/star-trek-cadmar-program-diagnostic-v1

permissions:
  contents: write
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
      LOCATOR_BRANCH: agent/star-trek-cadmar-program-diagnostic-locator-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Publish diagnostic locator
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_MAIN"
          rm -rf /tmp/cadmar-program-diagnostic
          mkdir -p /tmp/cadmar-program-diagnostic
          cat > /tmp/cadmar-program-diagnostic/run.json <<JSON
          {"run_id":$GITHUB_RUN_ID,"head_sha":"$GITHUB_SHA","canonical_parent":"$EXPECTED_MAIN"}
          JSON
          git fetch origin main --depth=1
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$LOCATOR_BRANCH"
          mkdir -p transport/cadmar-program-diagnostic
          cp /tmp/cadmar-program-diagnostic/run.json transport/cadmar-program-diagnostic/run.json
          git config user.name undercast-cadmar-program-diagnostic
          git config user.email cadmar-program-diagnostic@users.noreply.github.com
          git add transport/cadmar-program-diagnostic/run.json
          git commit -m 'Cadmar: publish program diagnostic locator'
          git push --force origin "HEAD:refs/heads/$LOCATOR_BRANCH"
          git checkout -B agent/star-trek-cadmar-program-diagnostic-v1 "$GITHUB_SHA"
      - name: Preserve and identify raw Cadmar program carrier
        run: |
          set -euo pipefail
          cp .github/cadmar-programs.tar.xz /tmp/cadmar-program-diagnostic/cadmar-programs.raw
          stat -c 'RAW_BYTES=%s' .github/cadmar-programs.tar.xz | tee /tmp/cadmar-program-diagnostic/values.txt
          sha256sum .github/cadmar-programs.tar.xz | tee -a /tmp/cadmar-program-diagnostic/values.txt
          file .github/cadmar-programs.tar.xz | tee -a /tmp/cadmar-program-diagnostic/values.txt
          xxd -l 128 .github/cadmar-programs.tar.xz | tee -a /tmp/cadmar-program-diagnostic/values.txt
          strings -n 8 .github/cadmar-programs.tar.xz | head -n 100 | tee -a /tmp/cadmar-program-diagnostic/values.txt || true
          base64 .github/cadmar-programs.tar.xz > /tmp/cadmar-program-diagnostic/cadmar-programs.raw.b64
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-program-diagnostic-raw
          path: /tmp/cadmar-program-diagnostic/
          if-no-files-found: error
          retention-days: 30
