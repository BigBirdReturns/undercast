name: homepage-ux-operator

on:
  push:
    branches: [agent/homepage-purpose-and-theme]
    paths:
      - ".github/HOMEPAGE-UX-COMMAND.json"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/HOMEPAGE-UX-COMMAND.json"
      - ".github/homepage-ux/**"
      - ".github/workflows/homepage-ux-operator.yml"

permissions:
  contents: write

concurrency:
  group: homepage-ux-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/homepage-purpose-and-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prepare branch
        run: |
          set -euo pipefail
          git checkout -B agent/homepage-purpose-and-theme
          git config user.name 'undercast-ux-operator'
          git config user.email 'undercast-ux-operator@users.noreply.github.com'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply the deterministic product pass
        id: apply
        run: |
          set +e
          mkdir -p .homepage-ux-output
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/homepage-ux/apply.mjs')
          text = path.read_text()
          replacements = {
              '  await open(page,`index.html#${missing}`);': '  await open(page,"index.html#"+missing);',
              '  const absence=page.locator(`[data-uid="${missing}"] .absence-plate`).first();': '  const absence=page.locator(\'[data-uid="\'+missing+\'"] .absence-plate\').first();',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'embedded-test repair count for {old!r}: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cp .github/homepage-ux/apply.mjs .homepage-ux-output/apply-source.mjs
          node --check .github/homepage-ux/apply.mjs 2>&1 | tee .homepage-ux-output/apply-check.log
          check_code=${PIPESTATUS[0]}
          if [ "$check_code" -ne 0 ]; then exit "$check_code"; fi
          node .github/homepage-ux/apply.mjs 2>&1 | tee .homepage-ux-output/apply.log
          code=${PIPESTATUS[0]}
          git status --short > .homepage-ux-output/apply-status.txt
          git diff --stat > .homepage-ux-output/apply-diff-stat.txt
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          set -e
          rm -rf .github/homepage-ux
          rm -f .github/HOMEPAGE-UX-COMMAND.json
          rm -f .github/workflows/homepage-ux-operator.yml
          git add -A
          git diff --cached --check
          git commit -m 'UX: make the archive routes and themes legible'
      - name: Run the complete canonical gate
        id: gate
        run: |
          set +e
          npm run gate 2>&1 | tee .homepage-ux-output/gate.log
          code=${PIPESTATUS[0]}
          git status --short > .homepage-ux-output/status.txt
          git show --stat --oneline --decorate HEAD > .homepage-ux-output/commit.txt
          exit "$code"
      - name: Retain exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ux-gate-${{ github.run_id }}
          path: .homepage-ux-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish the gated candidate
        if: steps.apply.outcome == 'success' && steps.gate.outcome == 'success'
        run: git push origin HEAD:agent/homepage-purpose-and-theme
