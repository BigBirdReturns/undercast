name: homepage-ux-operator

on:
  push:
    branches: [agent/homepage-purpose-and-theme]
    paths:
      - ".github/HOMEPAGE-UX-COMMAND.json"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/HOMEPAGE-UX-COMMAND.json"
      - ".github/homepage-ux/**"
      - ".github/workflows/homepage-ux-operator.yml"

permissions:
  contents: write

concurrency:
  group: homepage-ux-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'agent/homepage-purpose-and-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prepare branch
        run: |
          set -euo pipefail
          git checkout -B agent/homepage-purpose-and-theme
          git config user.name 'undercast-ux-operator'
          git config user.email 'undercast-ux-operator@users.noreply.github.com'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply the deterministic product pass
        id: apply
        run: |
          set +e
          output=/tmp/homepage-ux-output
          rm -rf "$output" .homepage-ux-output
          mkdir -p "$output"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/homepage-ux/apply.mjs')
          text = path.read_text()

          def swap(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return value.replace(old, new, 1)

          text = swap(text,
              '  await open(page,`index.html#${missing}`);',
              '  await open(page,"index.html#"+missing);',
              'embedded test route')
          text = swap(text,
              '  const absence=page.locator(`[data-uid="${missing}"] .absence-plate`).first();',
              '  const absence=page.locator(\'[data-uid="\'+missing+\'"] .absence-plate\').first();',
              'embedded test selector')
          text = swap(text,
              '  await expect(absence.locator(".absence-stamp")).toContainText(/not on file/i);',
              '  await expect(absence).toHaveAttribute("data-absence-label",/not on file/i);',
              'canonical absence label regression')
          text = swap(text,
              "coverageCss = replaceAllExact(coverageCss, '#387151', 'var(--pass)', 2, \"coverage pass colors\");",
              "coverageCss = replaceAllExact(coverageCss, '#387151', 'var(--pass)', 3, \"coverage pass colors\");",
              'coverage pass cardinality')
          text = swap(text,
              "constellationCss = replaceOnce(constellationCss, 'rgba(32,31,27,.08)', 'var(--dot)', \"constellation texture\");",
              "constellationCss = replaceOnce(constellationCss, 'background-image:radial-gradient(circle at 1px 1px,rgba(32,31,27,.08) 1px,transparent 0)', 'background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0)', \"constellation texture\");",
              'constellation texture scope')
          text = swap(text,
              '  const initial = storedTheme() || (media.matches ? "dark" : "light");',
              '  const initial = storedTheme() || "light";',
              'deterministic initial theme')
          text = swap(text,
              '\n  media.addEventListener?.("change", (event) => {\n    if (!storedTheme()) applyTheme(event.matches ? "dark" : "light", false);\n  });',
              '',
              'remove implicit theme switching')
          text = swap(text,
              '    }\n    if (persist) {',
              '    }\n    for (const source of document.querySelectorAll(\'picture.absence-plate source[srcset*="placeholder-dark-clean.png"]\')) source.media = dark ? "all" : "not all";\n    if (persist) {',
              'theme-aware absence sources')

          lines = text.splitlines()
          matches = [index for index, line in enumerate(lines) if "'  return `<span class=\"portrait absence-plate\"" in line]
          if len(matches) != 1:
              raise SystemExit(f'index absence markup line: expected one match, found {len(matches)}')
          lines[matches[0]] = '  \'  return `<picture class="portrait absence-plate" data-absence-label="${esc(what)} not on file" role="img" aria-label="${esc(aria)}"><source media="${document.documentElement.dataset.theme === "dark" ? "all" : "not all"}" srcset="${ABSENCE_PLATES.dark}"><img src="${ABSENCE_PLATES.light}" alt="" aria-hidden="true" loading="lazy"></picture>`;\','
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          text = swap(text,
              '  transform:scale(1.035);\n',
              '',
              'full-bleed absence geometry')
          text = swap(text,
              '.absence-dark{display:none!important}\n[data-theme="dark"] .absence-light{display:none!important}\n[data-theme="dark"] .absence-dark{display:block!important}\n@media(prefers-color-scheme:dark){\n  html:not([data-theme]) .absence-light{display:none!important}\n  html:not([data-theme]) .absence-dark{display:block!important}\n}',
              '.record-absence .absence-dark{display:none!important}\n[data-theme="dark"] .record-absence .absence-light{display:none!important}\n[data-theme="dark"] .record-absence .absence-dark{display:block!important}\n@media(prefers-color-scheme:dark){\n  html:not([data-theme]) .record-absence .absence-light{display:none!important}\n  html:not([data-theme]) .record-absence .absence-dark{display:block!important}\n}',
              'scope dual-image switching')
          text = swap(text,
              '.absence-stamp,.record-absence span,.uc-absence-stamp{',
              '.absence-plate::after{content:attr(data-absence-label)}\n.absence-stamp,.absence-plate::after,.record-absence span,.uc-absence-stamp{',
              'absence stamp pseudo-element')
          text = swap(text,
              'filter:getComputedStyle(node.querySelector(".absence-dark")).filter',
              'filter:getComputedStyle(node.querySelector("img")).filter',
              'absence treatment regression')

          test_marker = 'let tests = await read("tests/rendered/site.spec.mjs");'
          test_patch = (
              'let tests = await read("tests/rendered/site.spec.mjs");\n'
              'tests = replaceOnce(tests,\n'
              '  \'  expect(texture.paper).toBe("rgb(233, 228, 216)");\\n  expect(texture.image).toContain("rgba(32, 31, 27, 0.08)");\\n  expect(texture.size).toBe("17px 17px");\\n  for(const selector of [".eyebrow",".hero-side label",".scope-note",".node:not(.person-node) .node-type"]) await expectContrast(page,selector,"rgb(217, 212, 201)");\',\n'
              '  \'  expect(texture.paper).toBe("rgb(21, 18, 13)");\\n  expect(texture.image).toContain("rgba(234, 227, 212");\\n  expect(texture.size).toBe("17px 17px");\\n  for(const selector of [".eyebrow",".hero-side label",".scope-note",".node:not(.person-node) .node-type"]) await expectContrast(page,selector);\',\n'
              '  "persisted dark constellation contract"\n'
              ');'
          )
          text = swap(text, test_marker, test_patch, 'persisted dark constellation test patch')

          marker = '  "record builder theme controls");'
          marker_index = text.index(marker)
          count_index = text.rfind('  3,', 0, marker_index)
          if count_index < 0 or text[count_index:marker_index].strip() != '3,':
              raise SystemExit('record builder control cardinality was not found in the expected block')
          text = text[:count_index] + '  1,' + text[count_index + 4:]
          marker_index = text.index(marker)
          marker_end = marker_index + len(marker)
          extra = (
              '\nbuilder = replaceAllExact(builder,\n'
              '  \'<a class="site-primary" aria-current="page" href="./">Permanent record</a></nav>\',\n'
              '  \'<a class="site-primary" aria-current="page" href="./">Permanent record</a><button class="theme-toggle requires-js" type="button" data-theme-toggle aria-pressed="false">☾ Dark</button></nav>\',\n'
              '  2,\n'
              '  "record tombstone theme controls");'
          )
          text = text[:marker_end] + extra + text[marker_end:]
          path.write_text(text)
          PY
          cp .github/homepage-ux/apply.mjs "$output/apply-source.mjs"
          node --check .github/homepage-ux/apply.mjs 2>&1 | tee "$output/apply-check.log"
          check_code=${PIPESTATUS[0]}
          if [ "$check_code" -ne 0 ]; then exit "$check_code"; fi
          node .github/homepage-ux/apply.mjs 2>&1 | tee "$output/apply.log"
          apply_code=${PIPESTATUS[0]}
          if [ "$apply_code" -ne 0 ]; then
            git status --short > "$output/apply-status.txt"
            git diff --stat > "$output/apply-diff-stat.txt"
            exit "$apply_code"
          fi
          node scripts/shard.mjs 2>&1 | tee "$output/projection.log"
          projection_code=${PIPESTATUS[0]}
          git status --short > "$output/apply-status.txt"
          git diff --stat > "$output/apply-diff-stat.txt"
          if [ "$projection_code" -ne 0 ]; then exit "$projection_code"; fi
          set -e
          rm -rf .github/homepage-ux .homepage-ux-output
          rm -f .github/HOMEPAGE-UX-COMMAND.json
          rm -f .github/workflows/homepage-ux-operator.yml
          git add -A
          git diff --cached --check
          git commit -m 'UX: make the archive routes and themes legible'
      - name: Run the complete canonical gate
        id: gate
        run: |
          set +e
          output=/tmp/homepage-ux-output
          npm run gate 2>&1 | tee "$output/gate.log"
          code=${PIPESTATUS[0]}
          git status --short > "$output/status.txt"
          git show --stat --oneline --decorate HEAD > "$output/commit.txt"
          exit "$code"
      - name: Retain exact verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ux-gate-${{ github.run_id }}
          path: /tmp/homepage-ux-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish the gated candidate
        if: steps.apply.outcome == 'success' && steps.gate.outcome == 'success'
        run: git push origin HEAD:agent/homepage-purpose-and-theme
