name: star-trek-bounded-patch-cleanup-v1

on:
  push:
    branches:
      - agent/star-trek-next-bounded-cycle-claim

concurrency:
  group: star-trek-bounded-patch-cleanup-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for exact bounded patch markers and retire patch carriers
        run: |
          set -euo pipefail
          branch=agent/star-trek-next-bounded-cycle-claim
          ready=false
          for attempt in $(seq 1 120); do
            git fetch --filter=blob:none --no-tags origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            kz=.github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py
            post=.github/recovery/post-kzinti-cycle-controller-rebind-v1.py
            workflow=.github/workflows/star-trek-post-kzinti-cycle-v1.yml
            direct="$(grep -RFl 'node scripts/star-trek-kukulkan-cycle.mjs' .github/workflows/star-trek-*.yml 2>/dev/null || true)"
            if ! grep -Fq 'data/review/adapter-sdk/star-trek-[a-z0-9-]+-cycle\\.json", prior_receipt_rel' "$kz" \
              && grep -Fq 'star-trek-post-kzinti-media-v1", text)' "$post" \
              && grep -Fq '(.prior.checker_path | length > 0)' "$workflow" \
              && test -z "$direct"; then
              ready=true; break
            fi
            sleep 5
          done
          test "$ready" = true
          for path in \
            .github/workflows/star-trek-controller-template-patch-v1.yml \
            .github/workflows/star-trek-historical-check-route-patch-v1.yml \
            .github/workflows/star-trek-bounded-patch-cleanup-v1.yml; do
            test ! -f "$path" || git rm -- "$path"
          done
          git diff --cached --check
          git config user.name undercast-star-trek-bounded-patch-cleanup
          git config user.email bounded-patch-cleanup@users.noreply.github.com
          git commit -m 'Star Trek: retire completed bounded patch carriers'
          git push origin "HEAD:refs/heads/${branch}"
