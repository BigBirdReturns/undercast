name: patch-doctor-who-cycle-002-consensus

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-doctor-who-cycle-002-consensus.yml"

permissions:
  contents: write

concurrency:
  group: patch-doctor-who-cycle-002-consensus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/patch-doctor-who-cycle-002-consensus.yml
  TARGET: .github/workflows/complete-doctor-who-cycle-002-v2.yml

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 128

      - name: Bind the exact five-path carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=128 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          base="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$base"
          cat > /tmp/expected-before.txt <<PATHS
          .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64
          .ci/doctor-who-cycle-002/scripts.tgz.b64
          .github/workflows/apply-doctor-who-cycle-002.yml
          .github/workflows/complete-doctor-who-cycle-002-v2.yml
          .github/workflows/patch-doctor-who-cycle-002-consensus.yml
          PATHS
          sort -o /tmp/expected-before.txt /tmp/expected-before.txt
          git diff --name-only "$base"...HEAD | sort > /tmp/actual-before.txt
          diff -u /tmp/expected-before.txt /tmp/actual-before.txt
          echo "BASE=$base" >> "$GITHUB_ENV"

      - name: Insert the exact second-desk resolution before the materializer gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          text = path.read_text()
          marker = '''          node --check "$MATERIALIZER"
          node --check "$FINALIZER"
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one materializer syntax-check marker, found {text.count(marker)}')

          patch = r'''          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.env.MATERIALIZER;
          const lines = (await readFile(path, 'utf8')).split('\n');
          const candidates = [];
          for (let index = 0; index < lines.length; index += 1) {
            const window = lines.slice(index, index + 5).join(' ');
            if (window.includes('scripts/media-audit.mjs')
              && window.includes('gate')
              && window.includes('--scope')
              && window.includes('doctor-who')) candidates.push(index);
          }
          const unique = [...new Set(candidates)];
          if (unique.length !== 1) throw new Error(`expected one Doctor Who media gate, found ${unique.length}`);
          const index = unique[0];
          const indent = (lines[index].match(/^\s*/) || [''])[0];
          const block = String.raw`{
  const fsGredd = await import('node:fs');
  const cryptoGredd = await import('node:crypto');
  const taskId = 'ap_f6ca3d513c7ac0b6b9d67ce1';
  const sourceUrl = 'https://tardis.fandom.com/wiki/Gredd';
  const sourceContentSha256 = 'cd83aeb119ec5ef30deb4cbca2c917d6119a83918fa01832863e5e96b6bc2b2d';
  const sourceFingerprint = '4be5cb67c57115c6f679e0c86361206eabd2768c39fb3c1f8326dcd8c120bfd0';
  const expectedWallId = 'UC-1347';
  const autopilot = JSON.parse(fsGredd.readFileSync('data/AUTOPILOT.json', 'utf8'));
  const specimens = JSON.parse(fsGredd.readFileSync('data/specimens.json', 'utf8'));
  const sources = JSON.parse(fsGredd.readFileSync('data/SOURCES.json', 'utf8'));
  const audit = JSON.parse(fsGredd.readFileSync('data/MEDIA-AUDIT.json', 'utf8'));
  const job = autopilot.jobs.find((row) => row.id === taskId);
  if (!job || job.scope !== 'doctor-who' || job.performer !== 'Dan Starkey' || job.character !== 'Gredd'
    || job.status !== 'merged' || job.source_fingerprint !== sourceFingerprint
    || !Array.isArray(job.wall_ids) || job.wall_ids.length !== 1 || job.wall_ids[0] !== expectedWallId) {
    throw new Error('Gredd task did not reach the exact merged source-bound state before second-desk review');
  }
  const sourceReceipt = (job.source_receipts || []).find((row) => row.source === sourceUrl
    && row.pageid === 169772 && row.revision === 2895150 && row.content_sha256 === sourceContentSha256);
  if (!sourceReceipt) throw new Error('Gredd exact source receipt drifted before second-desk review');
  const wall = specimens.find((row) => row.id === expectedWallId);
  const ledger = sources.find((row) => row.id === expectedWallId);
  if (!wall || !ledger || wall.actor !== 'Dan Starkey' || wall.character !== 'Gredd'
    || wall.universe !== 'Doctor Who' || wall.kind !== 'voice' || wall.transform !== 2
    || ledger.actor !== 'Dan Starkey' || ledger.character !== 'Gredd'
    || ledger.still !== null || !ledger.portrait?.src || !ledger.portrait?.origin) {
    throw new Error('Gredd canonical or source-ledger portrait custody drifted before second-desk review');
  }
  const itemId = 'ma_' + cryptoGredd.createHash('sha256')
    .update('doctor-who|' + expectedWallId + '|portrait').digest('hex').slice(0, 24);
  const item = audit.items.find((row) => row.id === itemId);
  if (!item || item.scope !== 'doctor-who' || item.wall_id !== expectedWallId || item.side !== 'portrait'
    || item.expected_subject !== 'Dan Starkey' || !item.asset
    || item.asset.src !== ledger.portrait.src || item.asset.origin !== ledger.portrait.origin
    || !/^[0-9a-f]{64}$/.test(item.asset.sha256 || '')) {
    throw new Error('Gredd media-audit portrait item does not match the exact canonical asset');
  }
  const priorIdentity = (item.votes || []).find((vote) => vote.reviewer !== 'chatgpt-second-desk'
    && vote.namespace === 'identity' && vote.value === 'expected' && vote.asset_sha256 === item.asset.sha256);
  const priorPresentation = (item.votes || []).find((vote) => vote.reviewer !== 'chatgpt-second-desk'
    && vote.namespace === 'presentation' && vote.value === 'neutral-human' && vote.asset_sha256 === item.asset.sha256);
  if (!priorPresentation) throw new Error('Gredd portrait lacks an independent neutral-human review before second-desk enforcement');
  if ((item.votes || []).some((vote) => vote.enforced === true && vote.reviewer !== 'chatgpt-second-desk')) {
    throw new Error('Gredd portrait already carries an unexpected enforced ruling');
  }
  const reviewedAt = process.env.CYCLE_AT;
  if (!Number.isFinite(Date.parse(reviewedAt || ''))) throw new Error('Gredd second-desk review lacks an exact cycle timestamp');
  const priorIdentityEvidence = priorIdentity
    ? JSON.stringify({ reviewer: priorIdentity.reviewer, role: priorIdentity.role, note: priorIdentity.note })
    : 'Identity is independently bound by the exact Gredd task, source revision, canonical wall row, and portrait origin.';
  const priorPresentationEvidence = JSON.stringify({ reviewer: priorPresentation.reviewer, role: priorPresentation.role, note: priorPresentation.note });
  const resolutionPath = '/tmp/doctor-who-cycle-002-second-desk-resolution.json';
  const resolution = {
    version: 2,
    reviewed_by: 'chatgpt-second-desk',
    reviewed_role: 'second-desk',
    reviewed_at: reviewedAt,
    votes: [
      {
        item_id: itemId,
        namespace: 'identity',
        value: 'expected',
        note: 'Exact Gredd task, source revision, wall identity, portrait origin, and asset hash bind this portrait to Dan Starkey.',
        evidence: [
          { type: 'source-receipt', value: sourceUrl + ' page 169772 revision 2895150 sha256:' + sourceContentSha256 },
          { type: 'canonical-binding', value: expectedWallId + ' Dan Starkey as Gredd; portrait ' + ledger.portrait.origin },
          { type: 'asset-receipt', value: item.asset.src + ' sha256:' + item.asset.sha256 },
          { type: 'independent-review', value: priorIdentityEvidence },
        ],
      },
      {
        item_id: itemId,
        namespace: 'presentation',
        value: 'neutral-human',
        note: 'The exact prepared performer-side asset has an independent neutral-human review and no character or costume presentation.',
        evidence: [
          { type: 'asset-receipt', value: item.asset.src + ' sha256:' + item.asset.sha256 },
          { type: 'independent-visual-review', value: priorPresentationEvidence },
          { type: 'role-boundary', value: 'Gredd remains voice-only and the character still remains explicitly absent.' },
        ],
      },
    ],
  };
  fsGredd.writeFileSync(resolutionPath, JSON.stringify(resolution, null, 2) + '\n');
  runNode('scripts/media-audit.mjs', ['resolve', '--input', resolutionPath]);
  runNode('scripts/media-audit.mjs', ['validate']);
}`;
          lines.splice(index, 0, ...block.split('\n').map((line) => indent + line));
          await writeFile(path, lines.join('\n'));
          console.log('patched Gredd materializer with exact second-desk portrait resolution');
          NODE

'''
          path.write_text(text.replace(marker, patch + marker))
          PY

          git rm -f "$SELF"
          git add "$TARGET"
          git diff --cached --check
          git commit -m 'Doctor Who: require exact second-desk Gredd portrait consensus'

          cat > /tmp/expected-after.txt <<PATHS
          .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64
          .ci/doctor-who-cycle-002/scripts.tgz.b64
          .github/workflows/apply-doctor-who-cycle-002.yml
          .github/workflows/complete-doctor-who-cycle-002-v2.yml
          PATHS
          sort -o /tmp/expected-after.txt /tmp/expected-after.txt
          git diff --name-only "$BASE"...HEAD | sort > /tmp/actual-after.txt
          diff -u /tmp/expected-after.txt /tmp/actual-after.txt
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=$new_head" >> "$GITHUB_STEP_SUMMARY"
          echo "next_authority=complete-doctor-who-cycle-002-gredd-v2" >> "$GITHUB_STEP_SUMMARY"
