name: doctor-who-cycle-008-kreg-terminal-cleanup-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-terminal-cleanup-v1.yml"

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: doctor-who-cycle-008-kreg-terminal-cleanup-v1
  cancel-in-progress: false

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-terminal-cleanup-v1.yml
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-terminal-cleanup-v1
  GUARDIAN_BRANCH: agent/doctor-who-cycle-008-kreg-merge-guardian-v1
  GUARDIAN_WORKFLOW: doctor-who-cycle-008-kreg-merge-guardian-v1.yml
  GUARDIAN_ARTIFACT_PREFIX: doctor-who-cycle-008-kreg-merge-guardian-v1-
  CLEANUP_PATH: .github/workflows/doctor-who-cycle-008-kreg-v2-payload-recovery.yml
  CLEANUP_BLOB: b013c01d7fbe355ca77d0b223d5d3bc3f6a66cc5
  CLEANUP_BRANCH: agent/doctor-who-cycle-008-kreg-terminal-cleanup-product-v1
  CHECKER_PATH: scripts/doctor-who-cycle-008.mjs
  OUT: /tmp/doctor-who-cycle-008-kreg-terminal-cleanup-v1
  ARTIFACT_DIR: /tmp/doctor-who-cycle-008-kreg-merge-artifact
  CLEAN_WORKTREE: /tmp/doctor-who-cycle-008-kreg-terminal-cleanup-worktree
  MAIN_WORKTREE: /tmp/doctor-who-cycle-008-kreg-terminal-main-worktree

jobs:
  cleanup:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-terminal-cleanup-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path terminal cleanup carrier
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$ARTIFACT_DIR" "$CLEAN_WORKTREE" "$MAIN_WORKTREE"
          mkdir -p "$OUT" "$ARTIFACT_DIR"
          test "$GITHUB_HEAD_REF" = "$AUTHORIZED_BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "1"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$BASE_SHA"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          observed_main="$(git rev-parse refs/remotes/origin/main)"
          git merge-base --is-ancestor "$BASE_SHA" "$observed_main"
          git diff --name-only "$BASE_SHA"..."$observed_main" | LC_ALL=C sort > "$OUT/base-to-observed-main-paths.txt"
          if test -s "$OUT/base-to-observed-main-paths.txt"; then
            awk '!/^\.github\/workflows\// { bad=1 } END { exit bad }' "$OUT/base-to-observed-main-paths.txt"
          fi
          printf '%s\n' "$observed_main" > "$OUT/observed-main.txt"
          printf 'head=%s\nbase=%s\nobserved_main=%s\nobserved_tree=%s\n' "$HEAD_SHA" "$BASE_SHA" "$observed_main" "$(git rev-parse "$observed_main^{tree}")" > "$OUT/cleanup-carrier-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Discover successful canonical Kreg merge proof
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=all&head=BigBirdReturns:${GUARDIAN_BRANCH}&base=main&per_page=100" > "$OUT/guardian-prs.json"
          test "$(jq length "$OUT/guardian-prs.json")" -ge 1
          jq 'sort_by(.number) | last' "$OUT/guardian-prs.json" > "$OUT/guardian-pr.json"
          guardian_head="$(jq -r .head.sha "$OUT/guardian-pr.json")"
          test -n "$guardian_head"
          printf '%s\n' "$guardian_head" > "$OUT/guardian-head.txt"

          endpoint="/repos/${GITHUB_REPOSITORY}/actions/workflows/${GUARDIAN_WORKFLOW}/runs?event=pull_request&branch=${GUARDIAN_BRANCH}&per_page=100"
          run_id=''
          for _ in $(seq 1 2700); do
            gh api "$endpoint" > "$OUT/guardian-runs.json"
            run_id="$(jq -r --arg head "$guardian_head" --arg branch "$GUARDIAN_BRANCH" '[.workflow_runs[] | select(.head_sha == $head and .head_branch == $branch and .event == "pull_request")] | sort_by(.id) | last | .id // empty' "$OUT/guardian-runs.json")"
            if test -n "$run_id"; then break; fi
            sleep 10
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$OUT/guardian-run-id.txt"
          for _ in $(seq 1 2700); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$OUT/guardian-run.json"
            status="$(jq -r .status "$OUT/guardian-run.json")"
            if test "$status" = completed; then break; fi
            sleep 10
          done
          jq -e --arg head "$guardian_head" '.status == "completed" and .conclusion == "success" and .head_sha == $head' "$OUT/guardian-run.json" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$OUT/guardian-jobs.json"
          test "$(jq '[.jobs[] | select(.name == "merge")] | length' "$OUT/guardian-jobs.json")" = 1
          jq '.jobs[] | select(.name == "merge")' "$OUT/guardian-jobs.json" > "$OUT/guardian-job.json"
          jq -e '.status == "completed" and .conclusion == "success"' "$OUT/guardian-job.json" >/dev/null
          jq -r .id "$OUT/guardian-job.json" > "$OUT/guardian-job-id.txt"

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$OUT/guardian-artifacts.json"
          expected_name="${GUARDIAN_ARTIFACT_PREFIX}${run_id}"
          test "$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' "$OUT/guardian-artifacts.json")" = 1
          jq --arg name "$expected_name" '.artifacts[] | select(.name == $name and (.expired | not))' "$OUT/guardian-artifacts.json" > "$OUT/guardian-artifact.json"
          artifact_id="$(jq -r .id "$OUT/guardian-artifact.json")"
          printf '%s\n' "$artifact_id" > "$OUT/guardian-artifact-id.txt"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$OUT/guardian-artifact.zip"

      - name: Safely extract and verify canonical merge receipt
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/guardian-artifact.zip" TARGET="$ARTIFACT_DIR" OUT="$OUT" python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,zipfile
          archive=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET'])
          seen=set(); expanded=0
          with zipfile.ZipFile(archive) as zf:
              infos=zf.infolist()
              if not infos or len(infos)>8192: raise SystemExit(f'unsafe artifact denominator: {len(infos)}')
              for info in infos:
                  path=pathlib.PurePosixPath(info.filename); mode=(info.external_attr>>16)&0o170000
                  if path.is_absolute() or '..' in path.parts or info.filename in seen or mode==stat.S_IFLNK:
                      raise SystemExit(f'unsafe artifact member: {info.filename!r}')
                  seen.add(info.filename)
                  if info.is_dir(): continue
                  expanded += info.file_size
                  if expanded>4_000_000_000: raise SystemExit('artifact expansion ceiling exceeded')
                  destination=target.joinpath(*path.parts); destination.parent.mkdir(parents=True,exist_ok=True)
                  with zf.open(info) as src, destination.open('wb') as dst:
                      while True:
                          chunk=src.read(1024*1024)
                          if not chunk: break
                          dst.write(chunk)
          required=['canonical-merge-receipt.json','product-paths.txt','postmerge-complete-gate.log','postmerge-checker.log']
          resolved={}
          for name in required:
              matches=[p for p in target.rglob(name) if p.is_file()]
              if len(matches)!=1: raise SystemExit(f'{name} denominator: {len(matches)}')
              resolved[name]=str(matches[0])
          pathlib.Path(os.environ['OUT']).joinpath('resolved-merge-evidence.json').write_text(json.dumps(resolved,indent=2,sort_keys=True)+'\n')
          pathlib.Path(os.environ['OUT']).joinpath('guardian-artifact-sha256.txt').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'\n')
          PY
          receipt="$(jq -r '.["canonical-merge-receipt.json"]' "$OUT/resolved-merge-evidence.json")"
          RECEIPT="$receipt" OUT="$OUT" python3 - <<'PY'
          import hashlib,json,os,pathlib
          path=pathlib.Path(os.environ['RECEIPT']); data=json.loads(path.read_text()); claimed=data.pop('receipt_sha256')
          actual=hashlib.sha256(json.dumps(data,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert actual==claimed and data['status']=='canonical-product-merged-and-gated'
          assert data['cycle009_lease_issued'] is False and data['outside_human_dependency'] is False
          data['receipt_sha256']=claimed
          pathlib.Path(os.environ['OUT']).joinpath('verified-merge-receipt.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          canonical="$(jq -r .canonical_merge "$OUT/verified-merge-receipt.json")"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$canonical"
          printf '%s\n' "$canonical" > "$OUT/product-main.txt"
          cp "$(jq -r '.["product-paths.txt"]' "$OUT/resolved-merge-evidence.json")" "$OUT/product-paths.txt"

      - name: Build and completely gate one-path recovery-workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          product_main="$(cat "$OUT/product-main.txt")"
          git fetch --no-tags --filter=blob:none origin "+${product_main}:refs/remotes/kreg-cleanup/product-main"
          test "$(git rev-parse "$product_main:$CLEANUP_PATH")" = "$CLEANUP_BLOB"
          git worktree add --detach "$CLEAN_WORKTREE" "$product_main"
          git -C "$CLEAN_WORKTREE" rm "$CLEANUP_PATH"
          git -C "$CLEAN_WORKTREE" diff --cached --check
          test "$(git -C "$CLEAN_WORKTREE" diff --cached --name-only)" = "$CLEANUP_PATH"
          git -C "$CLEAN_WORKTREE" config user.name undercast-cycle-cleanup
          git -C "$CLEAN_WORKTREE" config user.email undercast-cycle-cleanup@users.noreply.github.com
          git -C "$CLEAN_WORKTREE" commit -m 'CI: retire consumed Doctor Who cycle 008 Kreg recovery workflow'
          cleanup_commit="$(git -C "$CLEAN_WORKTREE" rev-parse HEAD)"
          cleanup_tree="$(git -C "$CLEAN_WORKTREE" rev-parse 'HEAD^{tree}')"
          test "$(git -C "$CLEAN_WORKTREE" show -s --format=%P HEAD)" = "$product_main"
          printf '%s\n' "$cleanup_commit" > "$OUT/cleanup-commit.txt"
          printf '%s\n' "$cleanup_tree" > "$OUT/cleanup-tree.txt"
          cd "$CLEAN_WORKTREE"
          node "$CHECKER_PATH" 2>&1 | tee "$OUT/cleanup-checker.log"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/cleanup-complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Publish, qualify, and merge exact one-path cleanup PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          product_main="$(cat "$OUT/product-main.txt")"
          cleanup_commit="$(cat "$OUT/cleanup-commit.txt")"
          cleanup_tree="$(cat "$OUT/cleanup-tree.txt")"
          cleanup_pr=''; pushed=0
          rollback() {
            status=$?
            trap - EXIT
            if (( status != 0 )); then
              if test -n "$cleanup_pr"; then gh pr close "$cleanup_pr" --repo "$GITHUB_REPOSITORY" --comment 'Closed automatically because terminal Kreg cleanup did not complete.' >/dev/null 2>&1 || true; fi
              if (( pushed != 0 )); then git push origin --delete "$CLEANUP_BRANCH" >/dev/null 2>&1 || true; fi
            fi
            exit "$status"
          }
          trap rollback EXIT
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$product_main"
          if git ls-remote --exit-code --heads origin "$CLEANUP_BRANCH" >/dev/null 2>&1; then exit 1; fi
          git -C "$CLEAN_WORKTREE" push origin "HEAD:refs/heads/$CLEANUP_BRANCH"
          pushed=1
          cleanup_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$CLEANUP_BRANCH" --draft --title 'CI: retire consumed Doctor Who cycle 008 Kreg recovery workflow' --body 'One-file product-neutral cleanup after the reviewed Kreg cycle merged and passed its canonical post-merge gate. Removes only the consumed read-only recovery workflow; preserves task, lease, UC-1353, media, queue, journals, receipt, checker, and all prior cycles unchanged.')"
          cleanup_pr="${cleanup_url##*/}"
          printf '%s\n' "$cleanup_pr" > "$OUT/cleanup-pr-number.txt"
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/${cleanup_pr}" > "$OUT/cleanup-pr.json"
          jq -e --arg base "$product_main" --arg head "$cleanup_commit" '.state == "open" and .draft == true and .merged == false and .base.sha == $base and .head.sha == $head and .commits == 1 and .changed_files == 1' "$OUT/cleanup-pr.json" >/dev/null
          gh pr ready "$cleanup_pr" --repo "$GITHUB_REPOSITORY"
          for _ in $(seq 1 180); do
            gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/commits/${cleanup_commit}/check-runs?per_page=100" > "$OUT/cleanup-check-runs.json"
            pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' "$OUT/cleanup-check-runs.json")"
            if test "$pending" = 0; then break; fi
            sleep 10
          done
          test "$(jq '[.check_runs[] | select(.status != "completed")] | length' "$OUT/cleanup-check-runs.json")" = 0
          jq -e '[.check_runs[] | select(.conclusion | IN("failure","cancelled","timed_out","action_required","startup_failure","stale"))] | length == 0' "$OUT/cleanup-check-runs.json" >/dev/null
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)" = "$product_main"
          gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pulls/${cleanup_pr}/merge" -f merge_method=squash -f sha="$cleanup_commit" -f commit_title='CI: retire consumed Doctor Who cycle 008 Kreg recovery workflow' -f commit_message='Remove the consumed read-only Kreg V2 recovery workflow after the reviewed cycle-008 product merged and passed its canonical post-merge gate. Preserve all corpus, queue, media, source, waterline, receipt, checker, and prior-cycle state unchanged.' > "$OUT/cleanup-merge-response.json"
          jq -e '.merged == true and .sha != null' "$OUT/cleanup-merge-response.json" >/dev/null
          cleanup_merge="$(jq -r .sha "$OUT/cleanup-merge-response.json")"
          printf '%s\n' "$cleanup_merge" > "$OUT/cleanup-merge.txt"
          trap - EXIT

      - name: Verify and completely gate cleaned canonical main
        shell: bash
        run: |
          set -euo pipefail
          product_main="$(cat "$OUT/product-main.txt")"
          cleanup_merge="$(cat "$OUT/cleanup-merge.txt")"
          cleanup_tree="$(cat "$OUT/cleanup-tree.txt")"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main" "+${cleanup_merge}:refs/remotes/kreg-cleanup/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$cleanup_merge"
          test "$(git show -s --format=%P "$cleanup_merge")" = "$product_main"
          test "$(git rev-parse "$cleanup_merge^{tree}")" = "$cleanup_tree"
          test "$(git diff --name-only "$product_main"..."$cleanup_merge")" = "$CLEANUP_PATH"
          if git cat-file -e "$cleanup_merge:$CLEANUP_PATH" 2>/dev/null; then exit 1; fi
          git worktree add --detach "$MAIN_WORKTREE" "$cleanup_merge"
          cd "$MAIN_WORKTREE"
          test -z "$(git status --porcelain)"
          node "$CHECKER_PATH" 2>&1 | tee "$OUT/terminal-checker.log"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/terminal-complete-gate.log"
          test -z "$(git status --porcelain)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -iname '*cycle-008*kreg*' -print)"

      - name: Retire surviving cycle-008 Kreg carrier PRs and branches
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_pr="$(cat "$OUT/cleanup-pr-number.txt")"
          gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "$OUT/open-prs-before-cleanup.json"
          jq -r --arg self "$SELF_PR" --arg cleanup "$cleanup_pr" '.[] | select((.head.ref | test("doctor-who-cycle-008.*kreg";"i")) and (.number|tostring) != $self and (.number|tostring) != $cleanup) | [.number,.head.ref] | @tsv' "$OUT/open-prs-before-cleanup.json" > "$OUT/carriers-to-close.tsv"
          : > "$OUT/carriers-closed.tsv"
          while IFS=$'\t' read -r pr branch; do
            test -n "$pr" || continue
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment 'Closed after canonical cycle-008 Kreg merge, terminal recovery-workflow cleanup, and complete current-main proof.' >/dev/null
            printf '%s\t%s\n' "$pr" "$branch" >> "$OUT/carriers-closed.tsv"
          done < "$OUT/carriers-to-close.tsv"

          : > "$OUT/branches-deleted.txt"
          git ls-remote --heads origin 'refs/heads/agent/doctor-who-cycle-008*kreg*' | awk '{sub("refs/heads/", "", $2); print $2}' | LC_ALL=C sort -u > "$OUT/kreg-branches-before.txt"
          while IFS= read -r branch; do
            test -n "$branch" || continue
            if test "$branch" = "$AUTHORIZED_BRANCH"; then continue; fi
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
            printf '%s\n' "$branch" >> "$OUT/branches-deleted.txt"
          done < "$OUT/kreg-branches-before.txt"
          if git ls-remote --exit-code --heads origin "$CLEANUP_BRANCH" >/dev/null 2>&1; then exit 1; fi
          gh api "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > "$OUT/open-prs-after-cleanup.json"
          jq -e --arg self "$SELF_PR" '[.[] | select((.head.ref | test("doctor-who-cycle-008.*kreg";"i")) and (.number|tostring) != $self)] | length == 0' "$OUT/open-prs-after-cleanup.json" >/dev/null

      - name: Seal terminal cycle-008 cleanup receipt
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_MAIN="$(cat "$OUT/product-main.txt")" CLEANUP_MAIN="$(cat "$OUT/cleanup-merge.txt")" CLEANUP_PR="$(cat "$OUT/cleanup-pr-number.txt")" OUT="$OUT" python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT']); merge=json.loads((out/'verified-merge-receipt.json').read_text())
          closed=[line.split('\t',1) for line in (out/'carriers-closed.tsv').read_text().splitlines() if line]
          deleted=(out/'branches-deleted.txt').read_text().splitlines()
          receipt={'schema_version':1,'transaction':'DOCTOR-WHO-CYCLE-008-KREG-TERMINAL-CLEANUP-V1','status':'canonical-main-clean-and-cycle-terminal','merge_guardian_run':int((out/'guardian-run-id.txt').read_text()),'merge_guardian_job':int((out/'guardian-job-id.txt').read_text()),'merge_guardian_artifact':int((out/'guardian-artifact-id.txt').read_text()),'merge_guardian_artifact_sha256':(out/'guardian-artifact-sha256.txt').read_text().strip(),'canonical_merge_receipt_sha256':merge['receipt_sha256'],'product_main':os.environ['PRODUCT_MAIN'],'cleanup_pr':int(os.environ['CLEANUP_PR']),'cleanup_main':os.environ['CLEANUP_MAIN'],'cleanup_path':'.github/workflows/doctor-who-cycle-008-kreg-v2-payload-recovery.yml','cleanup_path_removed':True,'terminal_checker_sha256':hashlib.sha256((out/'terminal-checker.log').read_bytes()).hexdigest(),'terminal_gate_sha256':hashlib.sha256((out/'terminal-complete-gate.log').read_bytes()).hexdigest(),'carrier_prs_closed':len(closed),'carrier_branches_deleted':len(deleted),'remaining_open_kreg_cycle008_prs_excluding_self':0,'remaining_kreg_cycle008_workflows_on_main':0,'queue':{'queued':308,'resolved':8,'in_flight':0},'cycle009_lease_issued':False,'outside_human_dependency':False,'self_cleanup_pending':True}
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'terminal-cleanup-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum "$OUT/terminal-cleanup-receipt.json" "$OUT/terminal-checker.log" "$OUT/terminal-complete-gate.log" > "$OUT/terminal-evidence.sha256"
          test -z "$(git status --porcelain)"

      - name: Upload immutable terminal cleanup packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-terminal-cleanup-v1-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report terminal cleanup boundary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          status='terminal-cleanup-incomplete'; main='unavailable'; cleanup_pr='unavailable'; closed='unavailable'; deleted='unavailable'; receipt='unavailable'
          if test -f "$OUT/terminal-cleanup-receipt.json"; then
            status="$(jq -r .status "$OUT/terminal-cleanup-receipt.json")"
            main="$(jq -r .cleanup_main "$OUT/terminal-cleanup-receipt.json")"
            cleanup_pr="$(jq -r .cleanup_pr "$OUT/terminal-cleanup-receipt.json")"
            closed="$(jq -r .carrier_prs_closed "$OUT/terminal-cleanup-receipt.json")"
            deleted="$(jq -r .carrier_branches_deleted "$OUT/terminal-cleanup-receipt.json")"
            receipt="$(jq -r .receipt_sha256 "$OUT/terminal-cleanup-receipt.json")"
          fi
          gate='terminal gate unavailable'
          if test -f "$OUT/terminal-complete-gate.log"; then gate="$(tail -n 160 "$OUT/terminal-complete-gate.log" | tail -c 18000)"; fi
          body="$RUNNER_TEMP/kreg-terminal-cleanup.md"
          {
            printf 'KREG_TERMINAL_CLEANUP_V1\n\n'
            printf '```text\nstatus:           %s\ncanonical main:   %s\ncleanup PR:       %s\ncarrier PRs:      %s closed\ncarrier branches: %s deleted\nreceipt:          %s\nrun:              %s\n```\n\n' "$status" "$main" "$cleanup_pr" "$closed" "$deleted" "$receipt" "$GITHUB_RUN_ID"
            printf '### Terminal gate tail\n\n```text\n%s\n```\n' "$gate"
          } > "$body"
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --raw-field body="$(cat "$body")" >/dev/null
