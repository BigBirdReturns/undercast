name: star-trek-benbassat-candidate-observer-v1

on:
  push:
    branches:
      - agent/star-trek-benbassat-candidate-observer-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-benbassat-candidate-observer-v1
  cancel-in-progress: false

env:
  TARGET_BRANCH: agent/star-trek-benbassat-candidate-v1
  TARGET_WORKFLOW: star-trek-benbassat-candidate-v1.yml
  RESULT_BRANCH: agent/star-trek-benbassat-candidate-observer-result-v1
  CANDIDATE_RESULT_BRANCH: agent/star-trek-benbassat-candidate-result-v1
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  OUT: /tmp/star-trek-benbassat-candidate-observer-v1

jobs:
  observe:
    name: observe-exact-benbassat-candidate-run
    if: ${{ github.event.head_commit.message == 'Observe Star Trek Benbassat candidate v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for and capture exact candidate run
        id: observe
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          target_sha="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test -n "$target_sha"
          run_id=''
          for _ in $(seq 1 300); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --event push --limit 100 --json databaseId,status,conclusion,headSha,displayTitle,createdAt,updatedAt,url,attempt > "$OUT/run-list.json"
            run_id="$(jq -r --arg sha "$target_sha" '[.[] | select(.headSha==$sha)][0].databaseId // empty' "$OUT/run-list.json")"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          run_status=''
          for _ in $(seq 1 1080); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$OUT/run.json"
            run_status="$(jq -r .status "$OUT/run.json")"
            test "$run_status" = completed && break
            sleep 5
          done
          test "$run_status" = completed
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "$OUT/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$OUT/artifacts.json"
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main.json"
          main_sha="$(jq -r .commit.sha "$OUT/main.json")"
          test "$main_sha" = "$EXPECTED_MAIN"
          conclusion="$(jq -r '.conclusion // ""' "$OUT/run.json")"
          candidate_sha="$(git ls-remote --heads origin "refs/heads/${CANDIDATE_RESULT_BRANCH}" | awk '{print $1}')"
          for job_id in $(jq -r '.jobs[].id' "$OUT/jobs.json"); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "$OUT/job-${job_id}.log" || true
          done
          status='failure'
          if test "$conclusion" = success && test -n "$candidate_sha"; then
            status='success'
          fi
          jq -n \
            --arg status "$status" \
            --argjson run_id "$run_id" \
            --arg conclusion "$conclusion" \
            --arg target_sha "$target_sha" \
            --arg candidate_sha "$candidate_sha" \
            --arg main_sha "$main_sha" \
            '{version:1,transaction:"STAR-TREK-BENBASSAT-CANDIDATE-OBSERVER-V1",status:$status,run_id:$run_id,conclusion:$conclusion,target_sha:$target_sha,candidate_result_branch:"agent/star-trek-benbassat-candidate-result-v1",candidate_sha:$candidate_sha,main_sha:$main_sha,canonical_mutation:false,lease_mutation:false}' \
            > "$OUT/status.json"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Publish immutable observer result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name undercast-benbassat-candidate-observer
          git config user.email undercast-benbassat-candidate-observer@users.noreply.github.com
          git checkout --orphan benbassat-candidate-observer-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-benbassat-candidate-observer-v1
          cp -a "$OUT"/. transport/star-trek-benbassat-candidate-observer-v1/
          git add transport/star-trek-benbassat-candidate-observer-v1
          git commit -m 'Record Star Trek Benbassat candidate observer v1'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"

      - name: Fail closed when candidate did not complete
        if: steps.observe.outputs.status != 'success'
        shell: bash
        run: |
          echo "Benbassat candidate workflow did not publish a successful result" >&2
          exit 1
