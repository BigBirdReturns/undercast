name: star-trek-species-orbit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-SPECIES-ORBIT.json"
      - ".github/workflows/star-trek-species-orbit.yml"
      - "scripts/species-fill.mjs"

permissions:
  contents: write

concurrency:
  group: star-trek-species-orbit
  cancel-in-progress: false

jobs:
  populate:
    if: github.event.pull_request.head.ref == 'agent/site-gold-map-001'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-gold-map-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: File every supported exact credit in the selected species
        run: |
          set -euo pipefail
          control=.github/STAR-TREK-SPECIES-ORBIT.json
          category=$(node -e "console.log(require('./'$control).category)")
          label=$(node -e "console.log(require('./'$control).label)")
          transform=$(node -e "console.log(require('./'$control).transform)")
          max_cycles=$(node -e "console.log(require('./'$control).max_cycles)")
          slug=$(CATEGORY="$category" node -e 'console.log(process.env.CATEGORY.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""))')
          out="/tmp/star-trek-species-orbit/$slug"
          review_root="data/review/species-orbit/$slug"
          rm -rf "$out"
          mkdir -p "$out" "$review_root"
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          : > "$out/cycles.jsonl"
          cycle=0
          while :; do
            set +e
            node scripts/species-fill.mjs next \
              --category "$category" \
              --label "$label" \
              --out "$out/next.json" \
              > "$out/next.log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 3 ]; then
              break
            fi
            if [ "$code" -ne 0 ]; then
              cat "$out/next.log"
              exit "$code"
            fi
            task_id=$(node -e "console.log(require('$out/next.json').task.task_id)")
            performer=$(node -e "console.log(require('$out/next.json').task.performer)")
            character=$(node -e "console.log(require('$out/next.json').task.character)")
            remaining=$(node -e "console.log(require('$out/next.json').remaining_supported)")
            resume=$(node -e "console.log(require('$out/next.json').resume?'yes':'no')")
            cycle=$((cycle+1))
            if [ "$cycle" -gt "$max_cycles" ]; then
              echo "refusing to exceed configured species cycle limit $max_cycles"
              exit 1
            fi
            batch="$review_root/${task_id}-lease.json"
            prompt="$review_root/${task_id}-prompt.md"
            results="$review_root/${task_id}-results.json"
            map="$review_root/${task_id}-wall-map.json"
            review="$review_root/${task_id}-post-merge-review.json"
            cycle_receipt="$review_root/${task_id}-cycle-receipt.json"

            if [ "$resume" = yes ]; then
              test -f "$batch"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              claim_commit=$(git log -1 --format=%H -- "$batch")
              echo "resuming $task_id from committed lease $lease_id" | tee "$out/resume-${cycle}.log"
            else
              node scripts/autopilot.mjs claim \
                --agent luna \
                --scope star-trek \
                --capability-profile text-vision \
                --task-id "$task_id" \
                --limit 1 \
                --lease-minutes 360 \
                --selection-basis "Species orbit for $label: exact source-bound supported-mode credit selected in deterministic priority order; missing media remains explicitly not on file until enrichment." \
                --out "$batch" \
                --prompt "$prompt" \
                > "$out/claim-${cycle}.json"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              git add data/AUTOPILOT.json data/journal/autopilot.jsonl "$batch" "$prompt"
              git diff --cached --check
              git commit -m "Population: lease $label task ${task_id}"
              claim_commit=$(git rev-parse HEAD)
              git push origin HEAD:agent/site-gold-map-001
            fi

            node scripts/species-fill.mjs draft --category "$category" --label "$label" --transform "$transform" --batch "$batch" --out "$results" | tee "$out/draft-${cycle}.log"
            node scripts/autopilot.mjs submit --batch "$batch" --input "$results" | tee "$out/submit-${cycle}.log"
            node scripts/grow.mjs --drafts | tee "$out/grow-${cycle}.log"
            node scripts/sync-sources.mjs | tee "$out/sources-${cycle}.log"
            node scripts/species-fill.mjs mark-absent --batch "$batch" --map "$map" | tee "$out/absence-${cycle}.log"
            node scripts/credits.mjs > "$out/credits-${cycle}.log" 2>&1
            node scripts/shard.mjs > "$out/shard-${cycle}.log" 2>&1
            node scripts/build-contract.mjs > "$out/contract-${cycle}.log" 2>&1
            node scripts/autopilot.mjs sync > "$out/autopilot-sync-${cycle}.log" 2>&1
            node scripts/media-audit.mjs sync > "$out/media-sync-${cycle}.log" 2>&1
            node scripts/species-fill.mjs review --category "$category" --label "$label" --batch "$batch" --map "$map" --out "$review" | tee "$out/review-${cycle}.log"
            node scripts/autopilot.mjs complete --input "$review" | tee "$out/complete-${cycle}.log"
            node scripts/media-audit.mjs gate --scope star-trek > "$out/media-gate-${cycle}.log" 2>&1

            LEASE_ID="$lease_id" TASK_ID="$task_id" PERFORMER="$performer" CHARACTER="$character" LABEL="$label" CLAIM_COMMIT="$claim_commit" RECEIPT="$cycle_receipt" node --input-type=module - <<'NODE'
            import fs from 'node:fs';
            const doc={
              scope_id:'star-trek',lease_id:process.env.LEASE_ID,outcome:'completed',
              note:`Exact-source ${process.env.LABEL} population filed ${process.env.PERFORMER} as ${process.env.CHARACTER}; both media sides remain honestly not on file for later rolling enrichment.`,
              evidence:[
                {type:'workflow-run',value:`GitHub Actions run ${process.env.GITHUB_RUN_ID} — deterministic species orbit for ${process.env.TASK_ID}.`},
                {type:'commit',value:`${process.env.CLAIM_COMMIT} — restart-safe lease committed before drafting or canonical mutation.`},
                {type:'restart-proof',value:`Lease ${process.env.LEASE_ID} was persisted before the task was submitted.`}
              ],
              reviewed_by:'chatgpt-second-desk',reviewed_role:'second-desk',reviewed_at:new Date().toISOString()
            };
            fs.writeFileSync(process.env.RECEIPT,JSON.stringify(doc,null,2)+'\n');
            NODE
            node scripts/waterline.mjs record-cycle --input "$cycle_receipt" | tee "$out/waterline-${cycle}.log"

            wall_id=$(node -e "console.log(require('./$map').records[0].wall_id)")
            node -e "console.log(JSON.stringify({cycle:Number(process.argv[1]),remaining_before:Number(process.argv[2]),task_id:process.argv[3],lease_id:process.argv[4],wall_id:process.argv[5],performer:process.argv[6],character:process.argv[7]}))" "$cycle" "$remaining" "$task_id" "$lease_id" "$wall_id" "$performer" "$character" >> "$out/cycles.jsonl"

            git add -A
            git diff --cached --check
            git commit -m "Population: file $label task ${task_id}"
            git push origin HEAD:agent/site-gold-map-001
          done

          report="data/review/star-trek-five-way-accounting-2026-07-25.json"
          receipt="$review_root/accounting-receipt.json"
          node scripts/species-fill.mjs accounting --category "$category" --label "$label" --report "$report" --receipt "$receipt" | tee "$out/accounting.log"
          node scripts/waterline.mjs record-accounting --input "$receipt" | tee "$out/accounting-record.log"
          node scripts/credits.mjs > "$out/final-credits.log" 2>&1
          node scripts/shard.mjs > "$out/final-shard.log" 2>&1
          node scripts/build-contract.mjs > "$out/final-contract.log" 2>&1
          node scripts/ds9-census.mjs --project-only > "$out/ds9-census.log" 2>&1
          node scripts/ds9-graph.mjs --project-only > "$out/ds9-graph.log" 2>&1
          node scripts/ds9-eligibility-queue.mjs > "$out/ds9-eligibility.log" 2>&1
          node scripts/ds9-maker-queue.mjs > "$out/ds9-maker.log" 2>&1
          node scripts/build-record-pages.mjs > "$out/record-routes.log" 2>&1
          node scripts/autopilot.mjs validate | tee "$out/autopilot-validate.log"
          node scripts/media-audit.mjs validate | tee "$out/media-validate.log"
          node scripts/media-audit.mjs gate --scope star-trek | tee "$out/media-gate.log"
          node scripts/waterline.mjs validate | tee "$out/waterline-validate.log"
          node scripts/species-fixtures.mjs | tee "$out/species-fixtures.log"
          node scripts/site-sweep.mjs | tee "$out/site-sweep.log"
          npm run audit:corpus -- --json | tee "$out/corpus-audit.json"

          CATEGORY="$category" LABEL="$label" OUT="$out" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const norm=value=>String(value||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-zA-Z0-9']+/g,' ').trim().toLowerCase();
          const modeOf=job=>{const modes=job.performance_modes||[];if(modes.some(mode=>mode==='physical-prosthetic'||mode==='physical-and-voice'))return'physical';if(modes.some(mode=>mode==='voice-animation'||mode==='voice-only'||mode==='voice'))return'voice';return'unresolved';};
          const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json','utf8'));
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const media=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const jobs=state.jobs.filter(job=>job.scope==='star-trek'&&(job.categories||[]).some(value=>norm(value)===norm(process.env.CATEGORY)));
          const remainingSupported=jobs.filter(job=>job.status==='queued'&&job.queueable!==false&&modeOf(job)!=='unresolved');
          const active=jobs.filter(job=>['leased','drafted','merged'].includes(job.status));
          if(remainingSupported.length)throw new Error(`${remainingSupported.length} supported ${process.env.LABEL} task(s) remain queued`);
          if(active.length)throw new Error(`${active.length} ${process.env.LABEL} task(s) remain in flight`);
          const taxon=species.taxa.find(row=>norm(row.label)===norm(process.env.LABEL));
          if(!taxon)throw new Error(`species projection lacks ${process.env.LABEL}`);
          const mediaRows=media.items.filter(item=>item.scope==='star-trek');
          const complete=mediaRows.filter(item=>['verified','absent'].includes(item.status)).length;
          if(complete!==mediaRows.length)throw new Error('Star Trek media baseline is not complete');
          const summary={
            version:1,category:process.env.CATEGORY,label:process.env.LABEL,
            task_statuses:Object.fromEntries([...new Set(jobs.map(job=>job.status))].map(status=>[status,jobs.filter(job=>job.status===status).length])),
            unresolved_mode:jobs.filter(job=>job.status==='queued'&&modeOf(job)==='unresolved').length,
            species_counts:taxon.counts,
            star_trek_media:{total:mediaRows.length,complete}
          };
          fs.writeFileSync(`${process.env.OUT}/final-state.json`,JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Population: complete supported $label species orbit"
          fi
      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee /tmp/star-trek-species-orbit/gate.log
          git status --short | tee /tmp/star-trek-species-orbit/status.txt
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated candidate
        run: git push origin HEAD:agent/site-gold-map-001
      - name: Retain exact species-orbit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-species-orbit-${{ github.run_id }}
          path: /tmp/star-trek-species-orbit
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
