name: star-trek-cadmar-media-scout

on:
  push:
    branches:
      - agent/star-trek-cadmar-media-scout-v1

permissions:
  contents: read
  actions: write

jobs:
  media-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 62076ebd77b5834700b7a0b26b2907285c580fe0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 -m pip install --quiet pillow
      - name: Download and render Cadmar media candidates
        run: python3 .github/scripts/star-trek-cadmar-media-scout.py
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-cadmar-media-scout
          path: /tmp/star-trek-cadmar-media-scout/
          if-no-files-found: error
          retention-days: 30
