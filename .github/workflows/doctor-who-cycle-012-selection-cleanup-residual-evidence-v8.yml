name: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      V7_MAIN: 820f21a613884d5a677de4fd099d49194d794198
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
      EVIDENCE_SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8.yml
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v8
      INSTALLER_PR: "916"
      OLD_EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v7
      OLD_EVIDENCE_HEAD: 47645b2fc417d4f228c29511b215f9419708e821
      OLD_EVIDENCE_PR: "915"
      EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
      ORIGINAL_RUN: "31451662156"
      ORIGINAL_JOB: "93657116117"
      ORIGINAL_ARTIFACT: "9086538070"
      ORIGINAL_ARTIFACT_SHA256: daab204abf045d24d8d01672df5533e99c7acd62d88688d7db8b2bcce66e3c1b
      ORIGINAL_IDENTITY: d120358f4b649fa1041a4efdb62ca7d33758722e1613973642d37da5355ee162
      PARTIAL_RUN: "31451723712"
      PARTIAL_JOB: "93657285995"
      PARTIAL_ARTIFACT: "9086612896"
      PARTIAL_ARTIFACT_SHA256: 26abd3eb94a692644b1dbe8e4b40f1a4404bbe9318f68e654eb0f6991a261f54
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
      CARRIER_BLOB: df02fe466b8fb94b3d34816dca5c54cca7df5d5b
      CARRIER_GZIP_BYTES: "3709"
      CARRIER_GZIP_SHA256: edc6a6fdc72e32984c8e02303dc09d3bb3e7b0dea48e35442ced785a0920a9d1
      CARRIER_BYTES: "14813"
      CARRIER_SHA256: 1abd6ec2a6274bbb627b8a2a5ca5f84cf4e46e924efd6130723b767bd8f0b425
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8-loader

    steps:
      - name: Reconstruct and execute exact residual cleanup evidence V8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-residual-cleanup-evidence-v8-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
            /tmp/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
