name: doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery.yml"

permissions:
  contents: read
  issues: read

concurrency:
  group: doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery.yml
  FLOOR_MAIN: ceca35cd4456c9e948de2e0a3c30a78d81a88c7e
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery
  SOURCE_PR: "446"
  SOURCE_HEAD: 81361c63ce79e97108c028a89512850060a80e56
  SOURCE_EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  SOURCE_ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  TRANSPORT_PARTS: "8"
  TRANSPORT_B64_BYTES: "37628"
  TRANSPORT_B64_SHA256: aee64ffc3967ff0cbefe6e5d210c0ab0684ca8cedaca207e37cb7e1db3a1ebf7
  TRANSPORT_SHA256: 5eef5a5629da914a1e7cc09dd81d1a388395db746c3aef76f375fcdfa70bdf8e
  TRANSPORT_MANIFEST_SHA256: 1a63d8eaf5cdf4309389fdbc12ec893787f6a7d702092e83d7fb26af615dac75
  OUT: /tmp/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-path recovery carrier and live main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/parts" "$OUT/extracted"

          test "$HEAD_BRANCH" = "$AUTHORIZED_BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$FLOOR_MAIN"
          test "$(git rev-list --count "$FLOOR_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$FLOOR_MAIN" HEAD)" = "$FLOOR_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$FLOOR_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          test -z "$(git status --porcelain)"

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          printf '%s\n' "$live_main" > "$OUT/initial-live-main.txt"
          if [ "$live_main" != "$FLOOR_MAIN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/compare/${FLOOR_MAIN}...${live_main}" > "$OUT/live-main-compare.json"
            jq -e \
              --arg floor "$FLOOR_MAIN" \
              --arg live "$live_main" \
              '.merge_base_commit.sha == $floor and .head_commit.sha == $live and .status == "ahead" and .behind_by == 0 and (.files | length) > 0 and (.files | all(.filename | startswith(".github/workflows/")))' \
              "$OUT/live-main-compare.json" >/dev/null
            jq -r '.files[].filename' "$OUT/live-main-compare.json" > "$OUT/live-main-descendant-paths.txt"
          else
            printf 'identical\n' > "$OUT/live-main-descendant-paths.txt"
          fi

          printf 'floor_main=%s\ninitial_live_main=%s\ncarrier_head=%s\ncarrier_tree=%s\n' \
            "$FLOOR_MAIN" "$live_main" "$HEAD_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            > "$OUT/carrier-identity.txt"

      - name: Recover and verify all eight sealed V9 fragments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${SOURCE_PR}/comments?per_page=100" > "$OUT/source-pr-comments.json"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const out = process.env.OUT;
          const comments = JSON.parse(fs.readFileSync(`${out}/source-pr-comments.json`, 'utf8'));
          const expected = [
            {part:1, length:4800, sha256:'af9f414056d5aa0a01c7ef78eca5d63e745ddebd4c51ae9a3bbe6f751b91f1b7'},
            {part:2, length:4800, sha256:'d495c8b39169f68e0da43b4c45d2574b7400f6314fa155a40abfe5ebbbce563a'},
            {part:3, length:4800, sha256:'e457dc03860cb0b355829d4077b89279270b5eebd157ff1c749c146fa41563e4'},
            {part:4, length:4800, sha256:'3cbe136bf93cb98be2794f9b8f1659566fed43cd6264df7a1593e539f2ac8804'},
            {part:5, length:4800, sha256:'838f346d14f885c8baab8d19113c562c8652d6cdd993b171397692046b3fb332'},
            {part:6, length:4800, sha256:'b0cb3a9d6357f337c44bc636c8ddd5e8fb431f821a41bc2558da80a77be7e171'},
            {part:7, length:4800, sha256:'620e9a4a3af0b2a447c2fd07779337d77e24cfc1804721fa02e96f05c5ff60bf'},
            {part:8, length:4028, sha256:'a3d059e62032c49238d12d62731c2f16acdff067c325c2debe8bce20127bce33'},
          ];
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const found = new Map();

          for (const comment of comments) {
            const match = String(comment?.body ?? '').match(/^CYCLE007_TRANSPORT_V9_PART (\d{2})\/(\d{2}) SHA256 ([0-9a-f]{64}) LENGTH (\d+)\n([A-Za-z0-9+/=]+)$/);
            if (!match) continue;
            const part = Number(match[1]);
            if (found.has(part)) throw new Error(`duplicate V9 transport part ${part}`);
            found.set(part, {
              total: Number(match[2]),
              declaredSha256: match[3],
              declaredLength: Number(match[4]),
              payload: match[5],
              commentId: comment.id,
              commentUrl: comment.html_url,
            });
          }

          if (found.size !== expected.length) {
            throw new Error(`expected ${expected.length} V9 parts, found ${found.size}`);
          }

          const custody = [];
          let joined = '';
          for (const row of expected) {
            const item = found.get(row.part);
            if (!item) throw new Error(`missing V9 transport part ${row.part}`);
            if (
              item.total !== expected.length ||
              item.declaredLength !== row.length ||
              item.payload.length !== row.length ||
              item.declaredSha256 !== row.sha256 ||
              sha256(item.payload) !== row.sha256
            ) {
              throw new Error(`V9 transport part ${row.part} failed exact length/hash custody`);
            }
            const path = `${out}/parts/part-${String(row.part).padStart(2, '0')}.b64`;
            fs.writeFileSync(path, item.payload);
            joined += item.payload;
            custody.push({
              part: row.part,
              total: expected.length,
              comment_id: item.commentId,
              comment_url: item.commentUrl,
              length: row.length,
              sha256: row.sha256,
            });
          }

          if (joined.length !== Number(process.env.TRANSPORT_B64_BYTES)) {
            throw new Error(`joined V9 Base64 byte denominator drifted: ${joined.length}`);
          }
          if (sha256(joined) !== process.env.TRANSPORT_B64_SHA256) {
            throw new Error('joined V9 Base64 digest drifted');
          }

          fs.writeFileSync(`${out}/transport.b64`, joined);
          fs.writeFileSync(`${out}/transport-comment-custody.json`, `${JSON.stringify(custody, null, 2)}\n`);
          NODE

          test "$(wc -c < "$OUT/transport.b64")" = "$TRANSPORT_B64_BYTES"
          test "$(sha256sum "$OUT/transport.b64" | awk '{print $1}')" = "$TRANSPORT_B64_SHA256"
          base64 --decode "$OUT/transport.b64" > "$OUT/transport.tgz"
          test "$(sha256sum "$OUT/transport.tgz" | awk '{print $1}')" = "$TRANSPORT_SHA256"
          sha256sum "$OUT/parts"/*.b64 "$OUT/transport.b64" "$OUT/transport.tgz" > "$OUT/transport-sha256.txt"

      - name: Safely inspect and independently verify the complete writer archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$OUT/transport.tgz" TARGET="$OUT/extracted" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import tarfile

          archive = pathlib.Path(os.environ['ARCHIVE'])
          target = pathlib.Path(os.environ['TARGET'])
          seen = set()
          expanded = 0
          extracted_rows = []

          with tarfile.open(archive, 'r:gz') as tf:
              members = tf.getmembers()
              if not members or len(members) > 64:
                  raise SystemExit(f'unsafe archive member denominator: {len(members)}')
              for member in members:
                  rel = pathlib.PurePosixPath(member.name)
                  if (
                      rel.is_absolute()
                      or '..' in rel.parts
                      or member.name in seen
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                  ):
                      raise SystemExit(f'unsafe archive member: {member.name!r}')
                  seen.add(member.name)
                  expanded += member.size
                  if expanded > 10_000_000:
                      raise SystemExit('writer archive expands beyond 10 MB')
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable archive member: {member.name!r}')
                  destination = target.joinpath(*rel.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source, destination.open('wb') as sink:
                      shutil.copyfileobj(source, sink)
                  data = destination.read_bytes()
                  if len(data) != member.size:
                      raise SystemExit(f'archive member byte mismatch: {member.name}')
                  extracted_rows.append({
                      'path': rel.as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })

          manifest_path = target / 'transport-manifest.json'
          if not manifest_path.is_file():
              raise SystemExit('transport manifest absent')
          manifest_bytes = manifest_path.read_bytes()
          if hashlib.sha256(manifest_bytes).hexdigest() != os.environ['TRANSPORT_MANIFEST_SHA256']:
              raise SystemExit('transport manifest digest drifted')
          manifest = json.loads(manifest_bytes)
          if (
              manifest.get('version') != 9
              or manifest.get('transaction') != 'DOCTOR-WHO-CYCLE-007-KRAGAR-BUILDER-V9'
              or manifest.get('exact_main') != os.environ['SOURCE_EXACT_MAIN']
              or manifest.get('attested_main') != os.environ['SOURCE_ATTESTED_MAIN']
          ):
              raise SystemExit('transport manifest identity drifted')

          declared = manifest.get('files')
          if not isinstance(declared, list) or not declared:
              raise SystemExit('transport manifest file ledger absent')
          declared_paths = set()
          for row in declared:
              path = row.get('path')
              rel = pathlib.PurePosixPath(path or '')
              if not path or rel.is_absolute() or '..' in rel.parts or path in declared_paths:
                  raise SystemExit(f'invalid manifest member path: {path!r}')
              declared_paths.add(path)
              member = target.joinpath(*rel.parts)
              data = member.read_bytes()
              if len(data) != row.get('bytes'):
                  raise SystemExit(f'manifest byte mismatch: {path}')
              if hashlib.sha256(data).hexdigest() != row.get('sha256'):
                  raise SystemExit(f'manifest hash mismatch: {path}')

          required = {
              'apply-doctor-who-cycle-007.mjs',
              'apply-doctor-who-cycle-finalize-007.mjs',
              'prepare-inputs.mjs',
              'transport-manifest.json',
          }
          actual_paths = {row['path'] for row in extracted_rows}
          missing = sorted(required - actual_paths)
          if missing:
              raise SystemExit(f'required writer members absent: {missing!r}')

          report = {
              'source_pr': 446,
              'source_head': os.environ['SOURCE_HEAD'],
              'archive_bytes': archive.stat().st_size,
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'member_count': len(extracted_rows),
              'expanded_bytes': sum(row['bytes'] for row in extracted_rows),
              'members': sorted(extracted_rows, key=lambda row: row['path']),
              'manifest_declared_members': len(declared),
              'executed': False,
          }
          archive.parent.joinpath('writer-recovery-inspection.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

          find "$OUT/extracted" -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > "$OUT/extracted-sha256.txt"
          cat "$OUT/writer-recovery-inspection.json"

      - name: Rebind unchanged live main and seal the packet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          initial_main="$(cat "$OUT/initial-live-main.txt")"
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          printf '%s\n' "$final_main" > "$OUT/final-live-main.txt"
          test "$final_main" = "$initial_main"
          test -z "$(git status --porcelain)"
          (
            cd "$OUT"
            find . -type f ! -name packet-sha256.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              > packet-sha256.txt
          )

      - name: Upload exact cycle-007 V9 writer recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
