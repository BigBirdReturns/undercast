name: doctor-who-cycle-008-kreg-cycle007-writer-lineage-recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery.yml"

permissions:
  contents: read
  issues: read

concurrency:
  group: doctor-who-cycle-008-kreg-cycle007-writer-lineage-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery.yml
  FLOOR_MAIN: ceca35cd4456c9e948de2e0a3c30a78d81a88c7e
  FIRST_HEAD: 1043c98328d4990a4ef0bfcb1a08557935693b06
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery
  V9_SOURCE_PR: "446"
  V9_SOURCE_HEAD: 81361c63ce79e97108c028a89512850060a80e56
  V8_SOURCE_PR: "445"
  V8_SOURCE_HEAD: 76a224f0f8db154518f91bddc31574fac668bd8f
  SOURCE_EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  SOURCE_ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  QUALIFIER_PAYLOAD_SHA256: f6247288c50da814856ec0cd7b5ed8e877bab85dc19c9407a48d0ca81c9a2c20
  QUALIFIER_MANIFEST_SHA256: 0ba6c5a7853a602eeb437b5adf25b11354b3178f0290b7924fe03bb61f2f996d
  WRITER_TRANSPORT_SHA256: d674b41cd76c393b62373eac8fe827f5ad4da42cc1793e3f86fbd8696c01e06e
  WRITER_MANIFEST_SHA256: 9076a0ca6ec9ef8841f813835d13d0a3717e8744bf6d9e58d030a579dd48c006
  OUT: /tmp/doctor-who-cycle-008-kreg-cycle007-writer-lineage-recovery

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-cycle007-v9-transport-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          filter: blob:none
          persist-credentials: false

      - name: Bind exact two-commit recovery carrier and live main
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/v9-parts" "$OUT/qualifier-parts" "$OUT/qualifier" "$OUT/writer"

          test "$HEAD_BRANCH" = "$AUTHORIZED_BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$FIRST_HEAD"
          test "$(git show -s --format=%P "$FIRST_HEAD")" = "$FLOOR_MAIN"
          test "$(git rev-list --count "$FLOOR_MAIN"..HEAD)" = "2"
          test "$(git merge-base "$FLOOR_MAIN" HEAD)" = "$FLOOR_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$FLOOR_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          test -z "$(git status --porcelain)"

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          printf '%s\n' "$live_main" > "$OUT/initial-live-main.txt"
          if [ "$live_main" != "$FLOOR_MAIN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/compare/${FLOOR_MAIN}...${live_main}" > "$OUT/live-main-compare.json"
            jq -e \
              --arg floor "$FLOOR_MAIN" \
              --arg live "$live_main" \
              '.merge_base_commit.sha == $floor and .head_commit.sha == $live and .status == "ahead" and .behind_by == 0 and (.files | length) > 0 and (.files | all(.filename | startswith(".github/workflows/")))' \
              "$OUT/live-main-compare.json" >/dev/null
            jq -r '.files[].filename' "$OUT/live-main-compare.json" > "$OUT/live-main-descendant-paths.txt"
          else
            printf 'identical\n' > "$OUT/live-main-descendant-paths.txt"
          fi

          printf 'floor_main=%s\ninitial_live_main=%s\nfirst_head=%s\ncarrier_head=%s\ncarrier_tree=%s\n' \
            "$FLOOR_MAIN" "$live_main" "$FIRST_HEAD" "$HEAD_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            > "$OUT/carrier-identity.txt"

      - name: Retain exact three-of-eight V9 comment census
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${V9_SOURCE_PR}/comments?per_page=100" > "$OUT/v9-source-pr-comments.json"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const out = process.env.OUT;
          const comments = JSON.parse(fs.readFileSync(`${out}/v9-source-pr-comments.json`, 'utf8'));
          const expected = [
            {part:1, length:4800, sha256:'af9f414056d5aa0a01c7ef78eca5d63e745ddebd4c51ae9a3bbe6f751b91f1b7'},
            {part:2, length:4800, sha256:'d495c8b39169f68e0da43b4c45d2574b7400f6314fa155a40abfe5ebbbce563a'},
            {part:3, length:4800, sha256:'e457dc03860cb0b355829d4077b89279270b5eebd157ff1c749c146fa41563e4'},
            {part:4, length:4800, sha256:'3cbe136bf93cb98be2794f9b8f1659566fed43cd6264df7a1593e539f2ac8804'},
            {part:5, length:4800, sha256:'838f346d14f885c8baab8d19113c562c8652d6cdd993b171397692046b3fb332'},
            {part:6, length:4800, sha256:'b0cb3a9d6357f337c44bc636c8ddd5e8fb431f821a41bc2558da80a77be7e171'},
            {part:7, length:4800, sha256:'620e9a4a3af0b2a447c2fd07779337d77e24cfc1804721fa02e96f05c5ff60bf'},
            {part:8, length:4028, sha256:'a3d059e62032c49238d12d62731c2f16acdff067c325c2debe8bce20127bce33'},
          ];
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const found = new Map();

          for (const comment of comments) {
            const match = String(comment?.body ?? '').match(/^CYCLE007_TRANSPORT_V9_PART (\d{2})\/(\d{2}) SHA256 ([0-9a-f]{64}) LENGTH (\d+)\n([A-Za-z0-9+/=]+)$/);
            if (!match) continue;
            const part = Number(match[1]);
            if (found.has(part)) throw new Error(`duplicate V9 transport part ${part}`);
            found.set(part, {
              total: Number(match[2]),
              declaredSha256: match[3],
              declaredLength: Number(match[4]),
              payload: match[5],
              commentId: comment.id,
              commentUrl: comment.html_url,
            });
          }

          const present = [...found.keys()].sort((a, b) => a - b);
          if (JSON.stringify(present) !== JSON.stringify([1, 2, 3])) {
            throw new Error(`unexpected surviving V9 part set: ${JSON.stringify(present)}`);
          }

          const rows = [];
          for (const part of present) {
            const row = expected[part - 1];
            const item = found.get(part);
            if (
              item.total !== expected.length ||
              item.declaredLength !== row.length ||
              item.payload.length !== row.length ||
              item.declaredSha256 !== row.sha256 ||
              sha256(item.payload) !== row.sha256
            ) {
              throw new Error(`surviving V9 transport part ${part} drifted`);
            }
            fs.writeFileSync(`${out}/v9-parts/part-${String(part).padStart(2, '0')}.b64`, item.payload);
            rows.push({
              part,
              comment_id: item.commentId,
              comment_url: item.commentUrl,
              length: row.length,
              sha256: row.sha256,
            });
          }

          fs.writeFileSync(`${out}/v9-comment-census.json`, `${JSON.stringify({
            source_pr: Number(process.env.V9_SOURCE_PR),
            source_head: process.env.V9_SOURCE_HEAD,
            expected_parts: expected.length,
            present_parts: present,
            missing_parts: expected.map((row) => row.part).filter((part) => !found.has(part)),
            rows,
            complete: false,
          }, null, 2)}\n`);
          NODE

          sha256sum "$OUT/v9-parts"/*.b64 > "$OUT/v9-surviving-parts-sha256.txt"

      - name: Recover exact predecessor qualifier and nested complete writer transport
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${V8_SOURCE_PR}/comments?per_page=100" > "$OUT/v8-source-pr-comments.json"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const out = process.env.OUT;
          const comments = JSON.parse(fs.readFileSync(`${out}/v8-source-pr-comments.json`, 'utf8'));
          const expected = [
            {part:1, length:8737, sha256:'7ecb6127de9f8492cea1e3a2e439ade1b74747f3d3526c4c97aea6993556af4a'},
            {part:2, length:8737, sha256:'270ade90bd7ed3952f4b6a48e208b36ed23eaadd22760ac135574d58c7cad64d'},
            {part:3, length:8737, sha256:'aa430fdcf92af7abfaa773a483af81987f36c1c72ca86a8658f7756d528e3ff6'},
            {part:4, length:8737, sha256:'1cd911ba70cdc6e6cc41f6a07635a92a8916ee10f11fda4bf200290274643d58'},
            {part:5, length:8736, sha256:'238908e03cc680c4a549798353deab468b27fb1f62af21e0993d5464a0b4397b'},
          ];
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const found = new Map();

          for (const comment of comments) {
            const match = String(comment?.body ?? '').match(/^CYCLE007_V9_QUALIFIER_PAYLOAD_PART (\d{2})\/(\d{2})\n([A-Za-z0-9+/=\r\n]+)$/);
            if (!match) continue;
            const part = Number(match[1]);
            const payload = match[3].replace(/\s/g, '');
            if (found.has(part)) throw new Error(`duplicate qualifier payload part ${part}`);
            found.set(part, {
              total: Number(match[2]),
              payload,
              commentId: comment.id,
              commentUrl: comment.html_url,
            });
          }

          if (found.size !== expected.length) {
            throw new Error(`expected ${expected.length} qualifier parts, found ${found.size}`);
          }

          let joined = '';
          const custody = [];
          for (const row of expected) {
            const item = found.get(row.part);
            if (
              !item ||
              item.total !== expected.length ||
              item.payload.length !== row.length ||
              sha256(item.payload) !== row.sha256 ||
              !/^[A-Za-z0-9+/=]+$/.test(item.payload)
            ) {
              throw new Error(`qualifier payload part ${row.part} failed exact custody`);
            }
            fs.writeFileSync(`${out}/qualifier-parts/part-${String(row.part).padStart(2, '0')}.b64`, item.payload);
            joined += item.payload;
            custody.push({
              part: row.part,
              comment_id: item.commentId,
              comment_url: item.commentUrl,
              length: row.length,
              sha256: row.sha256,
            });
          }

          fs.writeFileSync(`${out}/qualifier-payload.b64`, joined);
          fs.writeFileSync(`${out}/qualifier-comment-custody.json`, `${JSON.stringify(custody, null, 2)}\n`);
          NODE

          test "$(wc -c < "$OUT/qualifier-payload.b64")" = "43684"
          base64 --decode "$OUT/qualifier-payload.b64" > "$OUT/qualifier-payload.tgz"
          test "$(sha256sum "$OUT/qualifier-payload.tgz" | awk '{print $1}')" = "$QUALIFIER_PAYLOAD_SHA256"
          sha256sum "$OUT/qualifier-parts"/*.b64 "$OUT/qualifier-payload.b64" "$OUT/qualifier-payload.tgz" \
            > "$OUT/qualifier-payload-sha256.txt"

      - name: Safely extract and verify the complete writer lineage
        shell: bash
        run: |
          set -euo pipefail
          QUALIFIER_ARCHIVE="$OUT/qualifier-payload.tgz" QUALIFIER_TARGET="$OUT/qualifier" WRITER_TARGET="$OUT/writer" python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import tarfile

          out = pathlib.Path(os.environ['OUT'])
          qualifier_archive = pathlib.Path(os.environ['QUALIFIER_ARCHIVE'])
          qualifier_target = pathlib.Path(os.environ['QUALIFIER_TARGET'])
          writer_target = pathlib.Path(os.environ['WRITER_TARGET'])

          def safe_extract(archive, target, *, expected_names=None, member_limit=64, byte_limit=10_000_000):
              rows = []
              seen = set()
              expanded = 0
              with tarfile.open(archive, 'r:gz') as tf:
                  members = tf.getmembers()
                  names = [member.name for member in members]
                  if expected_names is not None and names != expected_names:
                      raise SystemExit(f'archive member order/set drifted: {names!r}')
                  if not members or len(members) > member_limit:
                      raise SystemExit(f'unsafe archive member denominator: {len(members)}')
                  for member in members:
                      rel = pathlib.PurePosixPath(member.name)
                      if (
                          rel.is_absolute()
                          or '..' in rel.parts
                          or member.name in seen
                          or member.issym()
                          or member.islnk()
                          or not member.isfile()
                      ):
                          raise SystemExit(f'unsafe archive member: {member.name!r}')
                      seen.add(member.name)
                      expanded += member.size
                      if expanded > byte_limit:
                          raise SystemExit(f'archive expands beyond {byte_limit} bytes')
                      source = tf.extractfile(member)
                      if source is None:
                          raise SystemExit(f'unreadable archive member: {member.name!r}')
                      destination = target.joinpath(*rel.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with source, destination.open('wb') as sink:
                          shutil.copyfileobj(source, sink)
                      data = destination.read_bytes()
                      if len(data) != member.size:
                          raise SystemExit(f'archive member byte mismatch: {member.name}')
                      rows.append({
                          'path': rel.as_posix(),
                          'bytes': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                      })
              return rows

          qualifier_expected = [
              'candidate-phase.sh',
              'cycle007-v8-transport.tgz',
              'expected-candidate-paths.txt',
              'expected-final-paths.txt',
              'final-phase.sh',
              'package-product.mjs',
              'payload-manifest.json',
          ]
          qualifier_rows = safe_extract(
              qualifier_archive,
              qualifier_target,
              expected_names=qualifier_expected,
              member_limit=16,
              byte_limit=10_000_000,
          )

          qualifier_manifest_path = qualifier_target / 'payload-manifest.json'
          qualifier_manifest_bytes = qualifier_manifest_path.read_bytes()
          if hashlib.sha256(qualifier_manifest_bytes).hexdigest() != os.environ['QUALIFIER_MANIFEST_SHA256']:
              raise SystemExit('qualifier manifest digest drifted')
          qualifier_manifest = json.loads(qualifier_manifest_bytes)
          if (
              qualifier_manifest.get('version') != 1
              or qualifier_manifest.get('transaction') != 'DOCTOR-WHO-CYCLE-007-QUALIFIER-PAYLOAD-V9'
              or qualifier_manifest.get('exact_main') != os.environ['SOURCE_EXACT_MAIN']
          ):
              raise SystemExit('qualifier manifest identity drifted')

          for row in qualifier_manifest.get('files', []):
              path = row.get('path')
              rel = pathlib.PurePosixPath(path or '')
              if not path or rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit(f'invalid qualifier manifest path: {path!r}')
              data = qualifier_target.joinpath(*rel.parts).read_bytes()
              if len(data) != row.get('bytes') or hashlib.sha256(data).hexdigest() != row.get('sha256'):
                  raise SystemExit(f'qualifier manifest member drifted: {path}')

          writer_archive = qualifier_target / 'cycle007-v8-transport.tgz'
          writer_bytes = writer_archive.read_bytes()
          if hashlib.sha256(writer_bytes).hexdigest() != os.environ['WRITER_TRANSPORT_SHA256']:
              raise SystemExit('nested writer transport digest drifted')
          writer_rows = safe_extract(writer_archive, writer_target, member_limit=64, byte_limit=10_000_000)

          writer_manifest_path = writer_target / 'transport-manifest.json'
          if not writer_manifest_path.is_file():
              raise SystemExit('nested writer transport manifest absent')
          writer_manifest_bytes = writer_manifest_path.read_bytes()
          if hashlib.sha256(writer_manifest_bytes).hexdigest() != os.environ['WRITER_MANIFEST_SHA256']:
              raise SystemExit('nested writer manifest digest drifted')
          writer_manifest = json.loads(writer_manifest_bytes)
          declared = writer_manifest.get('files')
          if not isinstance(declared, list) or not declared:
              raise SystemExit('nested writer file ledger absent')

          declared_paths = set()
          for row in declared:
              path = row.get('path')
              rel = pathlib.PurePosixPath(path or '')
              if not path or rel.is_absolute() or '..' in rel.parts or path in declared_paths:
                  raise SystemExit(f'invalid nested writer manifest path: {path!r}')
              declared_paths.add(path)
              data = writer_target.joinpath(*rel.parts).read_bytes()
              if len(data) != row.get('bytes') or hashlib.sha256(data).hexdigest() != row.get('sha256'):
                  raise SystemExit(f'nested writer member drifted: {path}')

          actual_paths = {row['path'] for row in writer_rows}
          required = {
              'apply-doctor-who-cycle-007.mjs',
              'apply-doctor-who-cycle-finalize-007.mjs',
              'prepare-inputs.mjs',
              'transport-manifest.json',
          }
          missing = sorted(required - actual_paths)
          if missing:
              raise SystemExit(f'required writer members absent: {missing!r}')

          report = {
              'v9_source_pr': int(os.environ['V9_SOURCE_PR']),
              'v9_source_head': os.environ['V9_SOURCE_HEAD'],
              'predecessor_source_pr': int(os.environ['V8_SOURCE_PR']),
              'predecessor_source_head': os.environ['V8_SOURCE_HEAD'],
              'qualifier_archive_bytes': qualifier_archive.stat().st_size,
              'qualifier_archive_sha256': hashlib.sha256(qualifier_archive.read_bytes()).hexdigest(),
              'qualifier_manifest_sha256': hashlib.sha256(qualifier_manifest_bytes).hexdigest(),
              'qualifier_members': qualifier_rows,
              'writer_archive_bytes': writer_archive.stat().st_size,
              'writer_archive_sha256': hashlib.sha256(writer_bytes).hexdigest(),
              'writer_manifest_sha256': hashlib.sha256(writer_manifest_bytes).hexdigest(),
              'writer_manifest_identity': {
                  'version': writer_manifest.get('version'),
                  'transaction': writer_manifest.get('transaction'),
                  'exact_main': writer_manifest.get('exact_main'),
                  'attested_main': writer_manifest.get('attested_main'),
              },
              'writer_member_count': len(writer_rows),
              'writer_expanded_bytes': sum(row['bytes'] for row in writer_rows),
              'writer_members': sorted(writer_rows, key=lambda row: row['path']),
              'executed': False,
          }
          out.joinpath('writer-lineage-recovery-inspection.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY

          sha256sum "$OUT/qualifier"/* > "$OUT/qualifier-extracted-sha256.txt"
          find "$OUT/writer" -type f -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum \
            > "$OUT/writer-extracted-sha256.txt"
          cat "$OUT/writer-lineage-recovery-inspection.json"

      - name: Rebind unchanged live main and seal the packet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          initial_main="$(cat "$OUT/initial-live-main.txt")"
          final_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          printf '%s\n' "$final_main" > "$OUT/final-live-main.txt"
          test "$final_main" = "$initial_main"
          test -z "$(git status --porcelain)"
          (
            cd "$OUT"
            find . -type f ! -name packet-sha256.txt -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              > packet-sha256.txt
          )

      - name: Upload exact cycle-007 writer-lineage recovery packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-cycle007-writer-lineage-recovery-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
