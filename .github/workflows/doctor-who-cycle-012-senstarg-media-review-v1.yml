name: doctor-who-cycle-012-senstarg-media-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-media-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-media-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-media-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: "agent/doctor-who-cycle-012-senstarg-media-review-v1"
      CENSUS_ARTIFACT: "9059303657"
      CENSUS_ARTIFACT_BYTES: "431517"
      CENSUS_ARTIFACT_NAME: "doctor-who-cycle-012-media-census-v10-31379311959-attempt-1"
      CENSUS_ARTIFACT_SHA256: "079914134398cb06d7062c36a4b9c645e54ec620e06016ba51e18e6b9f1ed71d"
      CENSUS_HEAD: "6df4b5ff49100ac6a30577d6b85f25897c1d11f0"
      CENSUS_IDENTITY: "2b08dff44dd90153e12387d3dc3ebcf2550a607aa12b7a00a67907b19abcc1b4"
      CENSUS_JOB: "93425661894"
      CENSUS_MAIN: "019b43139f775b0935afd2be2f6d22c6e2494b94"
      CENSUS_PR: "886"
      CENSUS_RUN: "31379311959"
      CHARACTER_BYTES: "17554"
      CHARACTER_CANDIDATE: "/tmp/doctor-who-cycle-012-senstarg-media-review-v1/review/senstarg-character-candidate.jpg"
      CHARACTER_FIELD: "Senstarg.jpg"
      CHARACTER_HEIGHT: "532"
      CHARACTER_SHA256: "4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713"
      CHARACTER_TITLE: "File:Senstarg.jpg"
      CHARACTER_WIDTH: "730"
      EVIDENCE_CUSTODY_IDENTITY: "6a53e209f7a079d44117895ae9ca5bede50fa32e0fe2f0a6a313e8f629705ccf"
      LIVE_MAIN: "806604f8cf14b6c1cd58ad19f39e60f4898ac759"
      MODE: "unresolved"
      OUT: "/tmp/doctor-who-cycle-012-senstarg-media-review-v1"
      PACKET: "/tmp/doctor-who-cycle-012-senstarg-media-review-v1-census"
      PERFORMER: "Dan Starkey"
      PORTRAIT_CANDIDATE: "/tmp/doctor-who-cycle-012-senstarg-media-review-v1/review/senstarg-performer-portrait-candidate.jpg"
      PRESELECTION_MAIN: "8fcc4a414821fe0f5596dec860cb825d70110c27"
      ROLE: "Senstarg"
      SELF: ".github/workflows/doctor-who-cycle-012-senstarg-media-review-v1.yml"
      SOURCE_CONTENT_SHA256: "84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff"
      SOURCE_FINGERPRINT: "4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2"
      SOURCE_PAGE_ID: "302965"
      SOURCE_PORTRAIT: "images/uc-1356-portrait.jpg"
      SOURCE_PORTRAIT_AUTHOR: "Gage Skidmore"
      SOURCE_PORTRAIT_BYTES: "44412"
      SOURCE_PORTRAIT_LICENSE: "CC BY-SA 2.0"
      SOURCE_PORTRAIT_ORIGIN: "https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg"
      SOURCE_PORTRAIT_SHA256: "42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a"
      SOURCE_REVISION: "3243079"
      SOURCE_URL: "https://tardis.fandom.com/wiki/Senstarg"
      SOURCE_WALL: "UC-1356"
      TASK_ID: "ap_8965086737382df0e88366db"
      V8_FAILURE_IDENTITY: "ca886c0374d5e7d72cd2f22aea940f94088f0dd1859fe1a7dece8ea915d4952e"
      V9_FAILURE_IDENTITY: "ee79e8eab79ef3ca62cff70f2b1d18d077cd98737a004127567a627d30ad661d"
      LOADER: "/tmp/doctor-who-cycle-012-senstarg-media-review-v1-loader"
      CARRIER_CHUNK_01_BLOB: "f443183f6efb2d82e59e494bd1ef99f7ac2027a7"
      CARRIER_CHUNK_01_BYTES: "3504"
      CARRIER_CHUNK_01_SHA256: "78a09fc80944ac62cc2ac4eaad7682a9b5484bc063093a1f2d186ac32712771b"
      CARRIER_CHUNK_02_BLOB: "382f106016827a6910efab0dd63cee0b55527ba0"
      CARRIER_CHUNK_02_BYTES: "3504"
      CARRIER_CHUNK_02_SHA256: "b218f42a8833ee7e00b9e86261b39e3837f220d51cdd2768d2248de073191a83"
      CARRIER_GZIP_BYTES: "7008"
      CARRIER_GZIP_SHA256: "be21342b5966c21c5206a2ca7b31585241c13c337b614b26c9e3bdbca49930a3"
      CARRIER_BYTES: "27736"
      CARRIER_SHA256: "bebf1c4b98b968c4fe3e928629d6a57c403c136cc32a829372fb6f2d670578f0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact independent Senstarg media review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          for index in 01 02; do
            blob_var="CARRIER_CHUNK_${index}_BLOB"
            bytes_var="CARRIER_CHUNK_${index}_BYTES"
            sha_var="CARRIER_CHUNK_${index}_SHA256"
            blob="${!blob_var}"
            expected_bytes="${!bytes_var}"
            expected_sha="${!sha_var}"
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d > "$LOADER/chunk-$index.bin"
            test "$(git hash-object --stdin < "$LOADER/chunk-$index.bin")" = "$blob"
            test "$(wc -c < "$LOADER/chunk-$index.bin" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$LOADER/chunk-$index.bin" | awk '{print $1}')" = "$expected_sha"
          done
          cat "$LOADER/chunk-01.bin" "$LOADER/chunk-02.bin" > "$LOADER/carrier.sh.gz"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" LOADER="$LOADER" python3 - <<'PY'
          import os,re,subprocess,textwrap
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          python_blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(python_blocks)==4, len(python_blocks)
          for index,block in enumerate(python_blocks,1):
              compile(textwrap.dedent(block),f'<cycle-012-senstarg-media-review-v1-python-{index}>','exec')
          node_blocks=re.findall(r"node <<'NODE'\n(.*?)\nNODE",text,re.S)
          assert len(node_blocks)==1, len(node_blocks)
          node=Path(os.environ['LOADER'])/'candidate.js'
          node.write_text(textwrap.dedent(node_blocks[0]))
          subprocess.run(['node','--check',str(node)],check=True)
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-media-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-media-review-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-media-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-media-review-v1
            /tmp/doctor-who-cycle-012-senstarg-media-review-v1-census
            /tmp/doctor-who-cycle-012-senstarg-media-review-v1-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
