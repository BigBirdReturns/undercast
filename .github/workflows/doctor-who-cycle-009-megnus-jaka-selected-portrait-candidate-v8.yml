name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: a3e2c80f4c8826de253e8b10be8a73507b27395e
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v8
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8
      RECOVERY_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v8
      CONTROL: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v8
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v8
      V7_COMMIT: e00cf8c0d66a1a042da6a5d67f35ac3aaeecd77b
      V7_BLOB: a5d35efd8440281b2e237bf10a762d2b63c843c1
      V7_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7.yml
      V7_RECOVERED_RUN_SHA256: cb967c255c04b8552b0eaf2968198929586f250fb179b195418ebef059d1110c
      V8_RECOVERED_RUN_SHA256: 2f548cc1a289d2332be461a3da0c4eef92c6cba0e30c94d0b3daaeded5bfe2f9
      V7_MATERIALIZER_SHA256: d9b76ea08805fef3473cd72e5185d238bdfc1ca46bb44ef56fcc32636c3d71ea
      V7_MATERIALIZER_BYTES: "39288"
      V8_MATERIALIZER_SHA256: 0909632b012f06bc111e631c9e0a3e6923a591d9427da638e0bb6821e9ba7e44
      V8_MATERIALIZER_BYTES: "39387"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact V8 carrier and recover immutable V7 programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$CONTROL" "$OUT" "$RECOVERY_ROOT"
          mkdir -p "$BOOTSTRAP"/{api,receipt}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/files.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY

          gh api "/repos/$GITHUB_REPOSITORY/contents/$V7_PATH?ref=$V7_COMMIT" > "$BOOTSTRAP/api/v7-content.json"
          test "$(jq -r .sha "$BOOTSTRAP/api/v7-content.json")" = "$V7_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V7_BLOB" > "$BOOTSTRAP/api/v7-blob.json"
          jq -r .content "$BOOTSTRAP/api/v7-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source-v7.yml"
          test "$(git hash-object "$BOOTSTRAP/source-v7.yml")" = "$V7_BLOB"

          ruby -ryaml -rjson - "$BOOTSTRAP/source-v7.yml" "$BOOTSTRAP/source-env.json" "$BOOTSTRAP/v7-bind.sh" "$BOOTSTRAP/v7-execute.sh" <<'RB'
          source, env_out, bind_out, execute_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.dig('jobs', 'materialize', 'env')
          steps = doc.dig('jobs', 'materialize', 'steps')
          bind = steps.find { |row| row['name'] == 'Bind exact one-path successor and immutable V6 source' }
          execute = steps.find { |row| row['name'] == 'Execute exact V6 candidate transaction over composability-v3 main' }
          raise 'V7 environment missing' unless env.is_a?(Hash)
          raise 'exact V7 bind program missing' unless bind && bind['run'].is_a?(String)
          raise 'exact V7 execute program missing' unless execute && execute['run'].is_a?(String)
          File.write(env_out, JSON.generate(env))
          File.write(bind_out, bind['run'])
          File.write(execute_out, execute['run'])
          RB
          bash -n "$BOOTSTRAP/v7-bind.sh"
          bash -n "$BOOTSTRAP/v7-execute.sh"

          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          env=json.loads((root/'source-env.json').read_text())
          assert env['EXACT_MAIN']==os.environ['EXACT_MAIN']
          assert env['BRANCH']=='agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v7'
          assert env['SELF']=='.github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v7.yml'
          excluded={'GH_TOKEN','EXACT_MAIN','BRANCH','SELF','OUT','RECOVERY_ROOT','CONTROL','PR_HEAD','PR_NUMBER','PR_BASE_SHA'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          sha256sum "$BOOTSTRAP/source-v7.yml" "$BOOTSTRAP/v7-bind.sh" "$BOOTSTRAP/v7-execute.sh" > "$BOOTSTRAP/receipt/v7-program-sha256.txt"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Recover V7-controlled execution and patch one lease-scoped census
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/v7-bind.sh"
          test -f "$CONTROL/recovered-run.sh"
          test "$(sha256sum "$CONTROL/recovered-run.sh" | cut -d' ' -f1)" = "$V7_RECOVERED_RUN_SHA256"
          RUNNER="$CONTROL/recovered-run.sh" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          path=Path(os.environ['RUNNER'])
          text=path.read_text()
          old='''script="$(cat "$RECOVERY_ROOT/materializer-path.txt")"
          export PORTRAIT_ROOT="$(cat "$RECOVERY_ROOT/portrait-root.txt")"
          bash -n "$script"
          chmod 700 "$script"
          exec "$script"
          '''
          new='''script="$(cat "$RECOVERY_ROOT/materializer-path.txt")"
          export PORTRAIT_ROOT="$(cat "$RECOVERY_ROOT/portrait-root.txt")"
          test "$(wc -c < "$script")" = "$V7_MATERIALIZER_BYTES"
          test "$(sha256sum "$script" | cut -d' ' -f1)" = "$V7_MATERIALIZER_SHA256"
          SCRIPT="$script" python3 - <<'PY_PATCH'
          import hashlib, os
          from pathlib import Path
          path=Path(os.environ['SCRIPT'])
          text=path.read_text()
          old="events = [row for row in journal if row.get('task_id') == os.environ['TASK_ID']]"
          new="lease_id = (root / 'receipt/lease-id.txt').read_text().strip()\\nevents = [row for row in journal if row.get('task_id') == os.environ['TASK_ID'] and row.get('lease_id') == lease_id]"
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          path.write_text(text)
          assert len(path.read_bytes())==int(os.environ['V8_MATERIALIZER_BYTES'])
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['V8_MATERIALIZER_SHA256']
          PY_PATCH
          bash -n "$script"
          chmod 700 "$script"
          "$script"
          mkdir -p "$OUT/source"
          cp "$script" "$OUT/source/materialize-v8.sh"
          sha256sum "$script" > "$OUT/source/materialize-v8.sha256"
          '''
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          path.write_text(text)
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['V8_RECOVERED_RUN_SHA256']
          PY
          bash -n "$CONTROL/recovered-run.sh"
          cp "$CONTROL/recovered-run.sh" "$BOOTSTRAP/receipt/recovered-run-v8.sh"
          sha256sum "$CONTROL/recovered-run.sh" > "$BOOTSTRAP/receipt/recovered-run-v8.sha256"

      - name: Execute exact candidate transaction with lease-scoped journal proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          chmod 700 "$CONTROL/recovered-run.sh"
          exec "$CONTROL/recovered-run.sh"

      - name: Upload exact selected-portrait candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v8
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v8
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v8
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v8
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
