      EVIDENCE_PACKET: /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-evidence
      PRIOR_PACKET: /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-prior
      MATERIALIZER_ROOT: /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-materializer
      LOADER: /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-loader
