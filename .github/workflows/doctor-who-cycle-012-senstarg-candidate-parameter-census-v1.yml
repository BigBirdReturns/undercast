      MATERIALIZER_GZIP_BYTES: "11787"
      MATERIALIZER_GZIP_SHA256: 29ec7e97a642e64f4cd4f5ee2e5ab55c4ebbe6e8cece80df10c5cba701b45b46
      MATERIALIZER_BYTES: "48773"
      MATERIALIZER_SHA256: 578a634d4d8ab95a49197e03451413e8f6bf25a2005bbbe3d74195a0d1ee8b47
      CONTROLLER_BLOB: 2b4e86a8442a86cf1f9c91889dccb4e64901b2a5
      CONTROLLER_GZIP_BYTES: "9059"
      CONTROLLER_GZIP_SHA256: a2dde85fc66d546f2240311ac21905123d418e8f78c5f59a9583c67bd5e99713
      CONTROLLER_BYTES: "33124"
      CONTROLLER_SHA256: 54f80510f07e434d37ede8ecc3b608b6faf2c6ec1425ddcf260a57179dc52fcd

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact read-only Senstarg candidate parameter census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_BLOB" > "$LOADER/controller-blob.json"
          jq -r '.content' "$LOADER/controller-blob.json" | tr -d '\n' | base64 -d > "$LOADER/controller.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/controller.sh.gz")" = "$CONTROLLER_BLOB"
          test "$(wc -c < "$LOADER/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$LOADER/controller.sh.gz" > "$LOADER/controller.sh"
          test "$(wc -c < "$LOADER/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$LOADER/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$LOADER/controller.sh"
          CONTROLLER="$LOADER/controller.sh" python3 - <<'PY'
          import os,re,textwrap
          from pathlib import Path
          text=Path(os.environ['CONTROLLER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==4, len(blocks)
          for index,block in enumerate(blocks,1):
              compile(textwrap.dedent(block),f'<cycle-012-senstarg-parameter-census-{index}>','exec')
          PY
          chmod 700 "$LOADER/controller.sh"
          "$LOADER/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-review
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-evidence
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-prior
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-materializer
            /tmp/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
