name: doctor-who-cycle-012-senstarg-candidate-parameter-census-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-candidate-parameter-census-v1
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1
      SELF: .github/workflows/doctor-who-cycle-012-senstarg-candidate-parameter-census-v1.yml
      LIVE_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
