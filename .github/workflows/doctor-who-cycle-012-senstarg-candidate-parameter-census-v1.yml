      PRIOR_ARTIFACT_SHA256: b5aa012544058c97bdff335146c67d9ad3f5d2db100f10b0ae0ba048205b8a05
      PRIOR_CANDIDATE_IDENTITY: 584f5606fbdc7495f8302108dedd669803c0c95cf139f9f59bd09a33c8a8398d
      PRIOR_REPAIR_IDENTITY: 34720dc333f3c23931a05ca13f60f605dbfdb956fb4da001f7757406cf204291
