name: doctor-who-cycle-011-rastel-candidate-packet-v9

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-packet-v9.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-packet-v9
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-packet-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-packet-v9
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-packet-v9.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-packet-v9
      SOURCE: /tmp/doctor-who-cycle-011-rastel-candidate-packet-v9-source
      V8_PR: "763"
      V8_HEAD: c210d2a08945e946ead3a4e063e2a49ad0658486
      V8_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v8-lease-schema
      V8_WORKFLOW: .github/workflows/doctor-who-cycle-011-rastel-candidate-v8-lease-schema.yml
      V8_WORKFLOW_BLOB: 441b3f5771a79babe37c4171b08ec82c43f36ac7
      V8_WORKFLOW_BYTES: "19597"
      V8_WORKFLOW_SHA256: 85142529c6c70b17a5d092751538e93a54dca58ba0a022513fd352ca2da224f3
      V8_RUN: "31333033689"
      V8_JOB: "93294198254"
      V8_ARTIFACT: "9043529061"
      V8_ARTIFACT_FILES: "403"
      V8_PACKET_FILES: "382"
      V8_CANDIDATE_FILES: "361"
      V8_REPAIR_FILES: "21"
      V8_ZIP_SHA256: fa74de558f0742f120ce5c0dcdd78cf83652e350cd3e7e3bc3455687e7f919fb
      V8_EXPECTED_LEASE: lease_a6fc819786f4296a40bdc540
      ACTUAL_LEASE: lease_85156bdc658de7da9e42ae05
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      PERFORMER: Dan Starkey
      ROLE: Rastel
      MODE: voice
      CANDIDATE_COMMIT: 7c2912752b6f51dee4b06a9393526059e4ff188d
      CANDIDATE_TREE: 6ee8ca1dae3fc7f6a35fb7c50e8a226a184096f1
      CANDIDATE_PATHS: "38"
      CANDIDATE_PATHS_SHA256: ed6a06dee98e62a676235f7b1381a59d460a315526cd2ca8e06f990f9ecc9a9a
      CANDIDATE_RECEIPT_ID: e6e9b7bbc96b98339ff425129102df42d9c40f8015a907f4d5d041d1f0a1afa6
      CANDIDATE_BUNDLE_SHA256: eefd8fc2f56927b9c8be4320fd45ad5116de2135f9e181d121aa1f422ed54b76
      CANDIDATE_PATCH_SHA256: 820019703db8aafb4fbd746e1e929fef9bcc8af26760ef18f329f04e4542e06e
      CANDIDATE_TAR_SHA256: 5c9954b9f0302bd3ac3b2b225df5d0fc2a83fce781b704666ff3b11a21333793
      FILE_MANIFEST_SHA256: d7d1483849e5fed0303c847dca7688ec5fcc81f646fb5ad4fe9b28a0b693f2f0
      DELTA_MANIFEST_SHA256: 68756591458f0df50533c0b4ded7980cbdd7549eb3a76bc1b52a950134a9f369
      PATH_POLICY_SHA256: f29da4fb85d521d518faff40fea84e5da9f430bdb1f401933f90b9b66ac57d29
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      V8_REPAIR_ID: 570fd17bc026d4663c65722b15eaaaaaf35b3c3f0ba8ab68da1c7b10ef71cc37

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact V8 failure packet and extract only sealed candidate custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE" /tmp/rastel-v8-diagnostics.zip
          mkdir -p "$OUT"/{candidate,repair,source,finalization} "$SOURCE"/{api,packet}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$SOURCE/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V8_PR" > "$SOURCE/api/v8-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V8_RUN" > "$SOURCE/api/v8-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V8_RUN/jobs?per_page=100" > "$SOURCE/api/v8-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V8_ARTIFACT" > "$SOURCE/api/v8-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V8_ARTIFACT/zip" > /tmp/rastel-v8-diagnostics.zip
          test "$(sha256sum /tmp/rastel-v8-diagnostics.zip | awk '{print $1}')" = "$V8_ZIP_SHA256"
          git show "$V8_HEAD:$V8_WORKFLOW" > "$SOURCE/v8-workflow.yml"
          test "$(git hash-object "$SOURCE/v8-workflow.yml")" = "$V8_WORKFLOW_BLOB"
          test "$(wc -c < "$SOURCE/v8-workflow.yml" | tr -d ' ')" = "$V8_WORKFLOW_BYTES"
          test "$(sha256sum "$SOURCE/v8-workflow.yml" | awk '{print $1}')" = "$V8_WORKFLOW_SHA256"

          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          source=Path(os.environ['SOURCE']); api=source/'api'; packet=source/'packet'; out=Path(os.environ['OUT'])
          read=lambda name:json.loads((api/name).read_text())
          own=read('carrier.json'); v8=read('v8-pr.json'); run=read('v8-run.json'); jobs=read('v8-jobs.json')['jobs']; artifact=read('v8-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v8['number']==int(os.environ['V8_PR']) and v8['state']=='open' and v8['draft'] is True and v8['merged'] is False
          assert v8['base']['sha']==os.environ['MAIN'] and v8['head']['ref']==os.environ['V8_BRANCH'] and v8['head']['sha']==os.environ['V8_HEAD']
          assert v8['commits']==1 and v8['changed_files']==1
          assert run['id']==int(os.environ['V8_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-v8-lease-schema'
          assert run['head_sha']==os.environ['V8_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['V8_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Authenticate failed V7 launcher and apply exact lease-schema repair']==('completed','success')
          assert steps['Execute exact V7 candidate through repaired lease schema and seal outer packet']==('completed','failure')
          assert artifact['id']==int(os.environ['V8_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['V8_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['V8_RUN']) and artifact['workflow_run']['head_sha']==os.environ['V8_HEAD']

          prefix='doctor-who-cycle-011-rastel-candidate-v8-packet/'
          with zipfile.ZipFile('/tmp/rastel-v8-diagnostics.zip') as archive:
              infos=archive.infolist()
              assert len(infos)==int(os.environ['V8_ARTIFACT_FILES']) and len(infos)==len({row.filename for row in infos})
              selected=[]
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and not info.is_dir()
                  if info.filename.startswith(prefix): selected.append(info)
              assert len(selected)==int(os.environ['V8_PACKET_FILES'])
              assert sum(row.filename.startswith(prefix+'candidate/') for row in selected)==int(os.environ['V8_CANDIDATE_FILES'])
              assert sum(row.filename.startswith(prefix+'repair/') for row in selected)==int(os.environ['V8_REPAIR_FILES'])
              for info in selected:
                  rel=PurePosixPath(info.filename[len(prefix):])
                  target=packet/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(archive.read(info))
          shutil.copytree(packet/'candidate',out/'candidate',dirs_exist_ok=True)
          shutil.copytree(packet/'repair',out/'repair',dirs_exist_ok=True)
          for name in ('v8-pr.json','v8-run.json','v8-jobs.json','v8-artifact.json'):
              shutil.copy2(api/name,out/'source'/name)
          shutil.copy2(source/'v8-workflow.yml',out/'source/v8-workflow.yml')
          PY
          rm -f /tmp/rastel-v8-diagnostics.zip

      - name: Independently verify receipt, nested ledgers, bundle, TAR, Git objects, and exact failure mechanism
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); candidate=out/'candidate'; repair=out/'repair'
          sha=lambda data:hashlib.sha256(data).hexdigest()

          ledgers=list(candidate.rglob('SHA256SUMS.pre'))
          assert ledgers
          original_prefix='/tmp/doctor-who-cycle-011-rastel-candidate-v8-packet/candidate/'
          for ledger in ledgers:
              sealed=ledger.with_name('SHA256SUMS')
              assert sealed.is_file() and sha(ledger.read_bytes())==sealed.read_text().split()[0]
              for raw in ledger.read_text().splitlines():
                  if not raw.strip(): continue
                  digest,name=raw.split(None,1); name=name.lstrip('*')
                  if name.startswith(original_prefix): path=candidate/name[len(original_prefix):]
                  else:
                      assert not PurePosixPath(name).is_absolute()
                      path=ledger.parent/name
                  assert path.is_file() and sha(path.read_bytes())==digest,(ledger,path)

          receipt=json.loads((candidate/'receipt/candidate-receipt.json').read_text()); identity=receipt.pop('identity')
          assert identity==os.environ['CANDIDATE_RECEIPT_ID']
          assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          receipt['identity']=identity
          assert receipt['transaction']=='DOCTOR-WHO-CYCLE-011-RASTEL-CANDIDATE-V7' and receipt['status']=='candidate-complete'
          assert receipt['base_main']==os.environ['MAIN'] and receipt['carrier_pr']==int(os.environ['V8_PR']) and receipt['carrier_head']==os.environ['V8_HEAD']
          task=receipt['task']
          assert task['id']==os.environ['TASK_ID'] and task['lease_id']==os.environ['ACTUAL_LEASE']
          assert re.fullmatch(r'lease_[0-9a-f]{24}',task['lease_id'])
          assert task['wall_id']==os.environ['WALL_ID'] and task['performer']==os.environ['PERFORMER'] and task['role']==os.environ['ROLE'] and task['mode']==os.environ['MODE']
          assert receipt['queue']=={'before':{'total':316,'queued':306,'resolved':10,'in_flight':0},'after':{'total':316,'queued':305,'resolved':11,'in_flight':0}}
          assert receipt['media']['character_still']=='absent' and receipt['media']['performer_portrait']=='verified'
          assert receipt['media']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert receipt['boundary']['candidate_only'] is True
          assert not any(value for key,value in receipt['boundary'].items() if key!='candidate_only')
          product=receipt['candidate']
          expected={'commit':os.environ['CANDIDATE_COMMIT'],'tree':os.environ['CANDIDATE_TREE'],'paths':int(os.environ['CANDIDATE_PATHS']),'paths_sha256':os.environ['CANDIDATE_PATHS_SHA256'],'bundle_sha256':os.environ['CANDIDATE_BUNDLE_SHA256'],'patch_sha256':os.environ['CANDIDATE_PATCH_SHA256'],'product_archive_sha256':os.environ['CANDIDATE_TAR_SHA256'],'file_manifest_sha256':os.environ['FILE_MANIFEST_SHA256'],'delta_manifest_sha256':os.environ['DELTA_MANIFEST_SHA256'],'path_policy_sha256':os.environ['PATH_POLICY_SHA256']}
          for key,value in expected.items(): assert product[key]==value,(key,product[key],value)

          paths=(candidate/'receipt/candidate-paths.txt').read_text()
          assert len(paths.splitlines())==int(os.environ['CANDIDATE_PATHS']) and sha(paths.encode())==os.environ['CANDIDATE_PATHS_SHA256']
          assert not any(path.startswith('.github/') for path in paths.splitlines())
          files=json.loads((candidate/'receipt/candidate-file-manifest.json').read_text())
          delta=json.loads((candidate/'receipt/delta-manifest.json').read_text())
          policy=json.loads((candidate/'receipt/path-policy.json').read_text())
          assert sha((candidate/'receipt/candidate-file-manifest.json').read_bytes())==os.environ['FILE_MANIFEST_SHA256']
          assert sha((candidate/'receipt/delta-manifest.json').read_bytes())==os.environ['DELTA_MANIFEST_SHA256']
          assert sha((candidate/'receipt/path-policy.json').read_bytes())==os.environ['PATH_POLICY_SHA256']
          assert len(files['files'])==len(delta['paths'])==policy['observed_paths']==int(os.environ['CANDIDATE_PATHS'])
          assert [row['path'] for row in files['files']]==paths.splitlines()==[row['path'] for row in delta['paths']]
          assert {row['status'] for row in delta['paths']}=={'M','A'} and sum(row['status']=='A' for row in delta['paths'])==1
          assert next(row for row in delta['paths'] if row['status']=='A')['path']=='images/uc-1356-portrait.jpg'

          bundle=candidate/'product/candidate.bundle'; patch=candidate/'product/candidate.patch'; archive=candidate/'product/candidate-product.tar.gz'
          assert sha(bundle.read_bytes())==os.environ['CANDIDATE_BUNDLE_SHA256']
          assert sha(patch.read_bytes())==os.environ['CANDIDATE_PATCH_SHA256']
          assert sha(archive.read_bytes())==os.environ['CANDIDATE_TAR_SHA256']
          subprocess.run(['git','bundle','verify',str(bundle)],check=True,capture_output=True,text=True)
          heads=subprocess.run(['git','bundle','list-heads',str(bundle)],check=True,capture_output=True,text=True).stdout.splitlines()
          assert heads==[os.environ['CANDIDATE_COMMIT']+' HEAD']
          subprocess.run(['git','fetch',str(bundle),'HEAD:refs/verify/rastel-candidate'],check=True,capture_output=True,text=True)
          assert subprocess.run(['git','rev-parse','refs/verify/rastel-candidate'],check=True,capture_output=True,text=True).stdout.strip()==os.environ['CANDIDATE_COMMIT']
          assert subprocess.run(['git','show','-s','--format=%P',os.environ['CANDIDATE_COMMIT']],check=True,capture_output=True,text=True).stdout.strip()==os.environ['MAIN']
          assert subprocess.run(['git','show','-s','--format=%T',os.environ['CANDIDATE_COMMIT']],check=True,capture_output=True,text=True).stdout.strip()==os.environ['CANDIDATE_TREE']
          actual_paths=subprocess.run(['git','diff','--name-only',os.environ['MAIN'],os.environ['CANDIDATE_COMMIT']],check=True,capture_output=True,text=True).stdout
          assert actual_paths==paths

          with tarfile.open(archive,'r:gz') as tar:
              members=tar.getmembers()
              assert len(members)==int(os.environ['CANDIDATE_PATHS']) and all(row.isfile() for row in members)
              assert [row.name for row in members]==paths.splitlines()
              by_path={row['path']:row for row in files['files']}
              for member in members:
                  row=by_path[member.name]; data=tar.extractfile(member).read()
                  assert member.size==row['bytes'] and sha(data)==row['sha256']
                  assert member.mode==int(row['mode'][-3:],8)
                  git_data=subprocess.run(['git','show',os.environ['CANDIDATE_COMMIT']+':'+member.name],check=True,capture_output=True).stdout
                  assert git_data==data
                  blob=subprocess.run(['git','rev-parse',os.environ['CANDIDATE_COMMIT']+':'+member.name],check=True,capture_output=True,text=True).stdout.strip()
                  assert blob==row['blob']

          v8=json.loads((repair/'v8-repair.json').read_text()); v8id=v8.pop('identity')
          assert v8id==os.environ['V8_REPAIR_ID'] and sha(json.dumps(v8,sort_keys=True,separators=(',',':')).encode())==v8id
          v8['identity']=v8id
          assert v8['repair']['expected_retained_lease']==os.environ['V8_EXPECTED_LEASE']
          assert v8['repair']['expected_retained_lease']!=task['lease_id']
          workflow=(out/'source/v8-workflow.yml').read_text()
          assert workflow.count('EXPECTED_LEASE: '+os.environ['V8_EXPECTED_LEASE'])==1
          assert workflow.count("receipt['task']['lease_id']==os.environ['EXPECTED_LEASE']")==1
          gate=(candidate/'receipt/complete-gate.log').read_text()
          assert 'gate: PASS' in gate and '26 step(s)' in gate

          final={
            'version':1,
            'status':'cycle-011-rastel-candidate-v9-packet-finalized',
            'source':{'pr':int(os.environ['V8_PR']),'head':os.environ['V8_HEAD'],'run':int(os.environ['V8_RUN']),'job':int(os.environ['V8_JOB']),'artifact':int(os.environ['V8_ARTIFACT']),'artifact_sha256':os.environ['V8_ZIP_SHA256'],'candidate_receipt_identity':identity,'v8_repair_identity':v8id},
            'failure_adjudication':{'stage':'outer-packet-postprocessing-after-candidate-seal','stale_expected_lease':os.environ['V8_EXPECTED_LEASE'],'actual_candidate_lease':task['lease_id'],'actual_lease_schema_valid':True,'candidate_lifecycle_complete':True,'complete_rendered_gate_passed':True,'candidate_bundle_sealed':True},
            'candidate':product,
            'task':task,
            'queue':receipt['queue'],
            'media':receipt['media'],
            'gates':{'nested_checksum_ledgers':True,'candidate_receipt':True,'bundle':True,'parent':True,'tree':True,'path_census':True,'tar_members':True,'git_blobs':True,'complete_rendered_gate_log':True},
            'boundary':{'candidate_only':True,'repository_write':False,'product_published':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          final['identity']=sha(json.dumps(final,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (out/'finalization/v9-packet-finalization.json').write_text(json.dumps(final,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

          git diff --binary "$MAIN" "$CANDIDATE_COMMIT" > "$OUT/finalization/reproduced-candidate.patch"
          test "$(sha256sum "$OUT/finalization/reproduced-candidate.patch" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"
          git update-ref -d refs/verify/rastel-candidate
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test -z "$(git status --porcelain)"

      - name: Seal complete V9 artifact without executing another lifecycle
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          assert sha(ledger.read_bytes())==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-packet-v9-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-packet-v9
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-packet-v9-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-packet-v9
            /tmp/doctor-who-cycle-011-rastel-candidate-packet-v9-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
