  EXPECTED_PERFORMER: "Leonard Nimoy"
  EXPECTED_CHARACTER: "Henoch"
  EXPECTED_FINGERPRINT: "53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839"
  STILL_TITLE: "File:Spock inhabited by Henoch.jpg"
  STILL_SOURCE_PAGE: "https://memory-alpha.fandom.com/wiki/File:Spock_inhabited_by_Henoch.jpg"
  PORTRAIT_TITLE: "File:Leonard Nimoy by Gage Skidmore.jpg"
  PORTRAIT_SOURCE_PAGE: "https://commons.wikimedia.org/wiki/File:Leonard_Nimoy_by_Gage_Skidmore.jpg"
  RESULT_BRANCH: "agent/star-trek-henoch-media-result-v1"
  WORK: "/tmp/star-trek-henoch-media-worktree-v1"
  OUT: "/tmp/star-trek-henoch-media-v1"
  PUBLISH: "/tmp/star-trek-henoch-media-publication-v1"
  INDEX: "/tmp/star-trek-henoch-media-publication-v1.index"

jobs:
  prepare:
    name: prepare-source-and-byte-distinct-henoch-media
    if: ${{ github.event.head_commit.message == 'Prepare Star Trek Henoch media v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify reviewed source, claim custody, and canonical boundary
        shell: bash
        run: bash .github/recovery/star-trek-henoch-media-preparation-v1/01-verify.sh
      - name: Download, normalize, and audit exact Henoch media facets
        shell: bash
        run: bash .github/recovery/star-trek-henoch-media-preparation-v1/02-prepare.sh
      - name: Upload Henoch media-preparation evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-media-preparation-v1
          path: /tmp/star-trek-henoch-media-v1/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable Henoch media result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: bash .github/recovery/star-trek-henoch-media-preparation-v1/03-publish.sh
