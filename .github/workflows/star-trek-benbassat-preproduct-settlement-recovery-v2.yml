name: star-trek-benbassat-preproduct-settlement-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-benbassat-preproduct-settlement-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-benbassat-preproduct-settlement-recovery-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  EXPECTED_TREE: 7f9057770c8e622d71ef41b183811fe47fcdd6ed
  TASK_ID: ap_dd7d1c73ed237230cd6e1d0b
  EXPECTED_PERFORMER: Nolan North
  EXPECTED_CHARACTER: Benbassat
  EXPECTED_FINGERPRINT: 78e1384a3a11787064f98516e5759b55b33369d161067804c2d77f2ef6ef8885
  WALL_ID: UC-1397
  SOURCE_REVIEW_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  SOURCE_REVIEW_PATH: transport/star-trek-benbassat-source-review-v1/source-review.json
  CLAIM_BRANCH: agent/star-trek-benbassat-claim-result-v1
  CLAIM_PATH: data/review/adapter-sdk/star-trek-benbassat-claim.json
  MEDIA_BRANCH: agent/star-trek-benbassat-media-result-v1
  MEDIA_PATH: transport/star-trek-benbassat-media-v1/media-receipt.json
  RESULT_BRANCH: agent/star-trek-benbassat-preproduct-settlement-result-v2
  OUT: /tmp/star-trek-benbassat-preproduct-settlement-v2

jobs:
  settle:
    name: settle-corrected-benbassat-preproduct-boundary
    if: ${{ github.event.head_commit.message == 'Settle corrected Star Trek Benbassat preproduct v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed79424013b92460d16c01cad4e590eca01e6bff
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify corrected source, single lease, media absence, and canonical custody
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git fetch --no-tags origin main "$SOURCE_REVIEW_BRANCH" "$CLAIM_BRANCH" "$MEDIA_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"

          source_ref="refs/remotes/origin/${SOURCE_REVIEW_BRANCH}"
          claim_ref="refs/remotes/origin/${CLAIM_BRANCH}"
          media_ref="refs/remotes/origin/${MEDIA_BRANCH}"
          git show "${source_ref}:${SOURCE_REVIEW_PATH}" > "$OUT/source-review.json"
          git show "${claim_ref}:${CLAIM_PATH}" > "$OUT/claim-receipt.json"
          git show "${media_ref}:${MEDIA_PATH}" > "$OUT/media-receipt.json"
          git show -s --format=%H "$source_ref" > "$OUT/source-review-commit.txt"
          git show -s --format=%H "$claim_ref" > "$OUT/claim-commit.txt"
          git show -s --format=%T "$claim_ref" > "$OUT/claim-tree.txt"
          git show -s --format=%H "$media_ref" > "$OUT/media-commit.txt"
          test "$(git show -s --format=%P "$claim_ref")" = "$EXPECTED_MAIN"

          jq -e \
            --arg task "$TASK_ID" --arg performer "$EXPECTED_PERFORMER" --arg character "$EXPECTED_CHARACTER" --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-SOURCE-REVIEW-V1"
             and .verdict == "pass"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.status == "queued"
             and .task.attempts == 0
             and .production_source.series == "Star Trek: Picard"
             and .production_source.title == "Võx"
             and .production_source.year == "2023"
             and .adjudication.adjudicated_kind == "voice"
             and .adjudication.performance_mode == "voice-only"
             and .adjudication.physical_prosthetic_hint_accepted == false
             and .adjudication.physical_performance_attributed == false
             and .adjudication.prosthetic_performance_attributed == false
             and .adjudication.animation_performance_attributed == false
             and .adjudication.maker_attribution == "unresolved"
             and .boundary.off_screen_voiceover == true
             and .boundary.canonical_mutation == false
             and .boundary.lease_taken == false
             and .boundary.product_staged == false' \
            "$OUT/source-review.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" --arg performer "$EXPECTED_PERFORMER" --arg character "$EXPECTED_CHARACTER" --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-CLAIM-V1"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.status == "leased"
             and .task.attempts == 1
             and (.lease.id | type == "string" and length > 0)
             and .source_review.verdict == "pass"
             and .source_review.performance_mode == "voice-only"
             and .source_review.production == "Star Trek: Picard"
             and .source_review.episode == "Võx"
             and .source_review.first_aired == "13 April 2023"
             and .queue.before.in_flight == 0
             and .queue.after.in_flight == 1
             and .boundary.additional_lease_issued == false
             and .boundary.canonical_mutation == false
             and .boundary.product_staged == false
             and .boundary.off_screen_voiceover == true
             and .boundary.physical_performance_attributed == false
             and .boundary.prosthetic_performance_attributed == false
             and .boundary.animation_performance_attributed == false
             and .boundary.maker_attribution == "unresolved"' \
            "$OUT/claim-receipt.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" --arg performer "$EXPECTED_PERFORMER" --arg character "$EXPECTED_CHARACTER" --arg fp "$EXPECTED_FINGERPRINT" --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-MEDIA-V1"
             and .status == "complete"
             and .task.id == $task
             and .task.performer == $performer
             and .task.character == $character
             and .task.source_fingerprint == $fp
             and .task.performance_mode == "voice-only"
             and .task.wall_id_reserved == $wall
             and .facets.still.status == "absent"
             and .facets.portrait.status == "absent"
             and .boundary.source_distinct == true
             and .boundary.byte_distinct == true
             and .boundary.cross_facet_substitution == false
             and .boundary.physical_performance_attributed == false
             and .boundary.prosthetic_performance_attributed == false
             and .boundary.animation_performance_attributed == false
             and .boundary.maker_attribution == "unresolved"
             and .boundary.transformation_measured == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false' \
            "$OUT/media-receipt.json" >/dev/null

          test "$(jq -r .task.lease_id "$OUT/media-receipt.json")" = "$(jq -r .lease.id "$OUT/claim-receipt.json")"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ['OUT'])
          checks=[
              (root/'source-review.json','review_sha256',('artifact',)),
              (root/'claim-receipt.json','receipt_sha256',()),
              (root/'media-receipt.json','receipt_sha256',('artifact',)),
          ]
          def stable(v):
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              if isinstance(v,list): return [stable(x) for x in v]
              return v
          for path,field,extras in checks:
              payload=json.loads(path.read_text()); expected=payload[field]; body=dict(payload); body.pop(field,None)
              for key in extras: body.pop(key,None)
              actual=hashlib.sha256((json.dumps(stable(body),indent=2,ensure_ascii=False)+'\n').encode()).hexdigest()
              if actual!=expected: raise SystemExit(f'{path.name} identity mismatch: {actual} != {expected}')
          PY

          git checkout --detach "$claim_ref"
          npm ci --ignore-scripts
          node scripts/thesis-rails.mjs validate > "$OUT/thesis-validate.log"
          node - <<'NODE'
          const fs=require('fs'); const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json')); const trek=state.jobs.filter(x=>x.scope==='star-trek'); const task=trek.find(x=>x.id===process.env.TASK_ID); const active=trek.filter(x=>['leased','drafted','merged'].includes(x.status));
          const counts={total:trek.length,queued:trek.filter(x=>x.status==='queued').length,resolved:trek.filter(x=>x.status==='resolved').length,blocked:trek.filter(x=>x.status==='blocked').length,rejected:trek.filter(x=>x.status==='rejected').length,in_flight:active.length};
          const expected={total:2228,queued:1797,resolved:428,blocked:0,rejected:2,in_flight:1};
          if(!task||task.status!=='leased'||!task.lease?.id) throw Error('Benbassat durable lease drifted');
          if(task.performer!==process.env.EXPECTED_PERFORMER||task.character!==process.env.EXPECTED_CHARACTER||task.source_fingerprint!==process.env.EXPECTED_FINGERPRINT) throw Error('Benbassat identity drifted');
          if(JSON.stringify(counts)!==JSON.stringify(expected)) throw Error('queue drifted: '+JSON.stringify(counts));
          if(active.length!==1||active[0].id!==process.env.TASK_ID) throw Error('another Star Trek task is active');
          fs.writeFileSync(process.env.OUT+'/durable-state.json',JSON.stringify({task,counts,active},null,2)+'\n');
          NODE
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-readback.json"
          test "$(jq -r .commit.sha "$OUT/main-readback.json")" = "$EXPECTED_MAIN"

      - name: Build and hash corrected pre-product settlement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json, os
          out=Path(os.environ['OUT'])
          source=json.loads((out/'source-review.json').read_text())
          claim=json.loads((out/'claim-receipt.json').read_text())
          media=json.loads((out/'media-receipt.json').read_text())
          durable=json.loads((out/'durable-state.json').read_text())
          settlement={
            'version':2,
            'transaction':'STAR-TREK-BENBASSAT-PREPRODUCT-SETTLEMENT-V2',
            'settled_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'status':'preproduct-ready',
            'canonical':{'commit':os.environ['EXPECTED_MAIN'],'tree':os.environ['EXPECTED_TREE'],'mutated_by_settler':False},
            'layers':{
              'source_review':{'branch':os.environ['SOURCE_REVIEW_BRANCH'],'commit':(out/'source-review-commit.txt').read_text().strip(),'review_sha256':source['review_sha256'],'verdict':source['verdict']},
              'claim':{'branch':os.environ['CLAIM_BRANCH'],'commit':(out/'claim-commit.txt').read_text().strip(),'tree':(out/'claim-tree.txt').read_text().strip(),'receipt_sha256':claim['receipt_sha256'],'lease_id':claim['lease']['id']},
              'media':{'branch':os.environ['MEDIA_BRANCH'],'commit':(out/'media-commit.txt').read_text().strip(),'receipt_sha256':media['receipt_sha256'],'still':media['facets']['still'],'portrait':media['facets']['portrait']},
            },
            'task':{'id':os.environ['TASK_ID'],'lease_id':claim['lease']['id'],'performer':os.environ['EXPECTED_PERFORMER'],'character':os.environ['EXPECTED_CHARACTER'],'source_fingerprint':os.environ['EXPECTED_FINGERPRINT'],'status':durable['task']['status'],'attempts':durable['task'].get('attempts',0),'wall_id_reserved':os.environ['WALL_ID']},
            'queue':durable['counts'],
            'adjudication':{'production':'Star Trek: Picard','episode':'Võx','first_aired':'13 April 2023','adjudicated_kind':'voice','performance_mode':'voice-only','off_screen_voiceover':True,'queued_physical_prosthetic_hint_rejected':True,'physical_performance_attributed':False,'prosthetic_performance_attributed':False,'animation_performance_attributed':False,'maker_attribution':'unresolved','transformation_measured':False},
            'boundary':{'source_frozen':True,'independent_source_reviewed':True,'single_lease_durable':True,'media_facets_complete':True,'honest_media_absence':True,'product_staged':False,'canonical_mutation':False,'lease_mutation':False,'additional_lease_issued':False},
          }
          def stable(v):
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              if isinstance(v,list): return [stable(x) for x in v]
              return v
          body=(json.dumps(stable(settlement),indent=2,ensure_ascii=False)+'\n').encode(); settlement['receipt_sha256']=hashlib.sha256(body).hexdigest()
          (out/'settlement.json').write_text(json.dumps(stable(settlement),indent=2,ensure_ascii=False)+'\n')
          PY
          jq -e \
            --arg task "$TASK_ID" --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-PREPRODUCT-SETTLEMENT-V2"
             and .status == "preproduct-ready"
             and .task.id == $task
             and .task.status == "leased"
             and .task.wall_id_reserved == $wall
             and .queue.in_flight == 1
             and .adjudication.production == "Star Trek: Picard"
             and .adjudication.episode == "Võx"
             and .adjudication.performance_mode == "voice-only"
             and .boundary.source_frozen == true
             and .boundary.independent_source_reviewed == true
             and .boundary.single_lease_durable == true
             and .boundary.media_facets_complete == true
             and .boundary.honest_media_absence == true
             and .boundary.product_staged == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false' \
            "$OUT/settlement.json" >/dev/null
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload corrected pre-product settlement
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-benbassat-preproduct-settlement-v2
          path: /tmp/star-trek-benbassat-preproduct-settlement-v2/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable corrected pre-product settlement
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '.artifact={id:$id,digest:$digest}' "$OUT/settlement.json" > "$OUT/settlement.tmp"
          mv "$OUT/settlement.tmp" "$OUT/settlement.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git config user.name undercast-benbassat-preproduct-settler
          git config user.email undercast-benbassat-preproduct-settler@users.noreply.github.com
          git checkout --orphan benbassat-preproduct-settlement-result-v2
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-benbassat-preproduct-settlement-v2
          cp -a "$OUT"/. transport/star-trek-benbassat-preproduct-settlement-v2/
          git add transport/star-trek-benbassat-preproduct-settlement-v2
          git commit -m 'Record corrected Star Trek Benbassat preproduct settlement v2'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
