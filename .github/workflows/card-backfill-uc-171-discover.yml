name: card-backfill-uc-171-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-171-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-171-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-171-discover.mjs"
      - "scripts/card-backfill-uc-171-discover-repair.py"
      - ".github/workflows/card-backfill-uc-171-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-171-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-036'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-036
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify current UC-171 three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-171-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-171-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-171');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-171');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0463aa68c783b67dbfb3a9bc');
          if(row.version!==1||row.record_id!=='UC-171'||row.kind!=='voice'||row.actor!=='Rob Paulsen'||row.character!=='Yakko Warner, Pinky, Raphael'||row.production!=='Animaniacs / TMNT'||row.years!=='1980s–'||row.side!=='still')throw new Error('UC-171 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-171'||failures.failed_discovery_checkpoints?.length!==3||failures.failed_discovery_checkpoints[0]?.artifact_id!==8714143001||failures.failed_discovery_checkpoints[1]?.artifact_id!==8714257248||failures.failed_discovery_checkpoints[2]?.run_id!==30428026877||failures.failed_discovery_checkpoints[2]?.artifact_id!==8714375534||failures.failed_discovery_checkpoints[2]?.head_sha!=='1ccddd9521f38c7314f6fbbea4d53c302ffa35c6'||failures.failed_discovery_checkpoints[2]?.artifact_digest_sha256!=='bf6b710e659c4944f9a523ce9dc9fea1ad7e701c8380f8a2af26da66ce7804b5')throw new Error('UC-171 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8713888323||row.selector_artifact?.head_sha!=='8196b7230d0fa8b501f3a4a2b7efe265b1b7dd54'||row.selector_artifact?.zip_sha256!=='59360aea7cf1da766400d56f586f4b9e616ab764429e56cc781b60a201d4a752'||row.selector_artifact?.selected_sha256!=='a2e9376fabb519cb7ddcfacf5a0e48a8e177c1cf658dd8a99a133b846e45d74f')throw new Error('UC-171 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8713979812||row.scope_artifact?.head_sha!=='0966b64598f1a573d71c9b6a99001df22910a7ce'||row.scope_artifact?.scope_sha256!=='2b210adfa18f23e806fd08411cf13ea967362079ed3072e38a2ce1e49978795c')throw new Error('UC-171 scope custody drift');
          if(row.actor_role_pages?.length!==4||row.actor_role_pages.filter(page=>page.strict).length!==3||row.actor_role_pages.filter(page=>page.reference_only).length!==1||row.actor_role_pages.find(page=>page.key==='paramount-rise-cast')?.externally_verified!==true||row.roles?.length!==3||row.roles[0]?.key!=='yakko'||row.roles[1]?.key!=='pinky'||row.roles[2]?.key!=='raphael')throw new Error('UC-171 repaired discovery denominator drift');
          const yakko=row.roles.find(role=>role.key==='yakko');
          if(!yakko||!yakko.required_terms.includes('voiced by')||yakko.required_terms.includes('Voice Actor'))throw new Error('UC-171 Yakko raw-schema drift');
          if(row.selection_contract?.exact_three_role_animated_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['yakko','pinky','raphael'])||row.selection_contract?.strict_runtime_actor_role_pages_required!==3||row.selection_contract?.reference_only_actor_role_pages_required!==1||row.selection_contract?.minimum_candidates_per_role!==1||row.selection_contract?.maximum_candidates_per_role!==24||row.selection_contract?.paramount_plus_rendered_1987_episode_guide_required!==true||row.selection_contract?.yakko_raw_revision_voiced_by_schema_required!==true||row.selection_contract?.raphael_1987_original_series_required!==true||row.selection_contract?.later_donatello_and_2012_tmnt_substitute_for_raphael_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-171 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Rob Paulsen'||specimen.character!=='Yakko Warner, Pinky, Raphael'||specimen.production!=='Animaniacs / TMNT'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-171'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-171 audit boundary drift');
          console.log('PASS — UC-171 current three-failure custody, Yakko raw schema, three runtime pages, and one reference-only page authorized');
          NODE
      - name: Build isolated current discoverer
        run: |
          set -euo pipefail
          python3 scripts/card-backfill-uc-171-discover-repair.py
          node --check scripts/.card-backfill-uc-171-discover-run.mjs
      - name: Gather institutional role receipts, raw revisions, and character candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-171-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-171-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-171-discover-run.log"
          rm scripts/.card-backfill-uc-171-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload failure custody, institutional pages, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-171-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-171-discover
            ${{ runner.temp }}/card-backfill-uc-171-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
