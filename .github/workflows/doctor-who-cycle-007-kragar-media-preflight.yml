name: doctor-who-cycle-007-kragar-media-final-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-007-kragar-media-preflight.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-007-kragar-media-final-review
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-007-kragar-media-preflight.yml
  EXACT_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-007-kragar-final-review
  PACKET: /tmp/doctor-who-cycle-007-kragar-final-review/predecessor
  PREDECESSOR_RUN: "31025212632"
  PREDECESSOR_JOB: "92371776438"
  PREDECESSOR_ARTIFACT_ID: "8938314817"
  PREDECESSOR_ARTIFACT: doctor-who-cycle-007-kragar-media-31025212632
  PREDECESSOR_ARTIFACT_SHA256: b68ef2048bb525a38366b415e344eeb14721a84b15062195148eebdd8e1f2a81
  PREDECESSOR_HEAD: 8169bbd69c3783e1ccf8be66a6372f5830be7c31
  SELECTION_RUN: "31023209453"
  SELECTION_ARTIFACT_ID: "8937524867"
  SELECTION_ARTIFACT_SHA256: 18fd72083fbe773aec74e23cbcac1ab82c7bc920fb267b9ef06bc23b6009e2e2
  SELECTION_SHA256: 0028d6deef35430f99bac1ce583bcaffa292b0372b5b768d185d6d20040fbfb9
  TASK_ID: ap_ffea809b980b468b33fa462c
  SOURCE_FINGERPRINT: 8baf724d7501a98347e50b135dbe732586da3f3954908394122d5b31cbd734d1
  SOURCE_CONTENT_SHA256: 6f57112817f92b445ae7f32223f3d4e095c11f2c1702bab84eca4eccc17d8428
  SOURCE_PAGE_ID: "301280"
  SOURCE_REVISION: "3711733"
  SOURCE_IMAGE_TITLE: File:Hologram Kragar.jpg
  SOURCE_IMAGE_PAGE_ID: "301279"
  SOURCE_DELIVERED_SHA256: 904ad4b1493f14b7e7df8413bb95bbc312decf2d5d398b26a285dec122f62e70
  SOURCE_DELIVERED_BYTES: "14418"
  CANDIDATE_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  CANDIDATE_BYTES: "15719"
  CANDIDATE_WIDTH: "502"
  CANDIDATE_HEIGHT: "302"
  GH_TOKEN: ${{ github.token }}

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-kragar-media-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-007-kragar-media-preflight.yml
            data
            schema
            scripts

      - name: Bind one-file carrier and detach to exact Kayste main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PACKET"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            > "$OUT/main-identity.txt"
          test -z "$(git status --porcelain)"

      - name: Verify predecessor artifact authority
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREDECESSOR_ARTIFACT_ID}" > "$OUT/predecessor-artifact-api.json"
          jq -e \
            --argjson id "$PREDECESSOR_ARTIFACT_ID" \
            --arg name "$PREDECESSOR_ARTIFACT" \
            --arg digest "sha256:${PREDECESSOR_ARTIFACT_SHA256}" \
            --argjson run "$PREDECESSOR_RUN" \
            --arg head "$PREDECESSOR_HEAD" '
              .id == $id and
              .name == $name and
              .digest == $digest and
              .workflow_run.id == $run and
              .workflow_run.head_sha == $head and
              .expired == false
            ' "$OUT/predecessor-artifact-api.json" >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREDECESSOR_ARTIFACT }}
          path: ${{ env.PACKET }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.PREDECESSOR_RUN }}

      - name: Install exact image inspector
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Verify exact source, candidate, selection, and visual-review subject
        shell: bash
        run: |
          set -euo pipefail
          source="$PACKET/kragar-source-original"
          candidate="$PACKET/kragar-still-candidate.jpg"
          metadata="$PACKET/kragar-source-metadata.json"
          selected="$PACKET/selected-task.json"
          source_body="$PACKET/source-01.wikitext"

          for path in "$source" "$candidate" "$metadata" "$selected" "$source_body"; do
            test -f "$path"
          done
          test "$(sha256sum "$source" | awk '{print $1}')" = "$SOURCE_DELIVERED_SHA256"
          test "$(wc -c < "$source")" = "$SOURCE_DELIVERED_BYTES"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(wc -c < "$candidate")" = "$CANDIDATE_BYTES"
          test "$(sha256sum "$source_body" | awk '{print $1}')" = "$SOURCE_CONTENT_SHA256"

          jq -e \
            --arg title "$SOURCE_IMAGE_TITLE" \
            --argjson page "$SOURCE_IMAGE_PAGE_ID" \
            --arg source_sha "$SOURCE_DELIVERED_SHA256" '
              .file_title == $title and
              .pageid == $page and
              .source_sha256 == $source_sha and
              .source_width == 502 and
              .source_height == 302 and
              .source_size == 22141 and
              .mime == "image/jpeg" and
              .extmetadata.ObjectName.value == "Hologram Kragar"
            ' "$metadata" >/dev/null

          jq -e \
            --arg exact "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" \
            --argjson page "$SOURCE_PAGE_ID" \
            --argjson revision "$SOURCE_REVISION" \
            --arg source_sha "$SOURCE_CONTENT_SHA256" '
              .exact_main == $exact and
              .lease_issued == false and
              .queue_mutated == false and
              .global_active_count == 0 and
              .queue.total == 316 and
              .queue.queued == 310 and
              .queue.resolved == 6 and
              .queue.in_flight == 0 and
              .counts.compatible == 310 and
              .counts.incompatible == 0 and
              .selected.task_id == $task and
              .selected.performer == "Dan Starkey" and
              .selected.character == "Kragar" and
              .selected.source_fingerprint == $fingerprint and
              .task.status == "queued" and
              .task.source_receipts[0].pageid == $page and
              .task.source_receipts[0].revision == $revision and
              .task.source_receipts[0].content_sha256 == $source_sha
            ' "$selected" >/dev/null

          grep -F '|image       = Hologram Kragar.jpg' "$source_body" >/dev/null
          grep -F '|actor       = Dan Starkey' "$source_body" >/dev/null
          grep -F 'given notably different make-up' "$source_body" >/dev/null

          source_format="$(identify -format '%m' "$source")"
          candidate_format="$(identify -format '%m' "$candidate")"
          width="$(identify -format '%w' "$candidate")"
          height="$(identify -format '%h' "$candidate")"
          test "$source_format" = "WEBP"
          test "$candidate_format" = "JPEG"
          test "$width" = "$CANDIDATE_WIDTH"
          test "$height" = "$CANDIDATE_HEIGHT"
          identify "$source" > "$OUT/source-identify.txt"
          identify "$candidate" > "$OUT/candidate-identify.txt"
          file "$source" "$candidate" > "$OUT/file-types.txt"

          cat > "$OUT/visual-review.txt" <<'TXT'
          Direct inspection of the exact candidate shows a single blue holographic close-up of a prosthetic Sontaran face. The face is legible, character-specific, and consistent with the source file named Hologram Kragar; it is not generic alien imagery, a crowd frame, or performer-only portraiture.
          TXT

      - name: Refuse duplicate canonical media custody and preserve current gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$SOURCE_DELIVERED_SHA256" "$CANDIDATE_SHA256" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const [sourceSha, candidateSha] = process.argv.slice(2);
          const needles = [sourceSha, candidateSha];
          const hits = [];
          const walk = (root) => {
            for (const entry of fs.readdirSync(root, {withFileTypes: true})) {
              const full = path.join(root, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(json|md|txt)$/i.test(entry.name)) {
                const text = fs.readFileSync(full, 'utf8');
                for (const sha of needles) if (text.includes(sha)) hits.push({path: full, sha256: sha});
              }
            }
          };
          walk('data');
          fs.writeFileSync(`${process.env.OUT}/current-media-sha256-matches.json`, `${JSON.stringify(hits, null, 2)}\n`);
          if (hits.length) throw new Error(`Kragar source or candidate SHA already appears in canonical data: ${JSON.stringify(hits)}`);
          NODE
          grep -R -n -F 'Hologram Kragar.jpg' data > "$OUT/current-origin-matches.txt" || true
          git ls-tree -r --name-only "$EXACT_MAIN" images > "$OUT/current-image-paths.txt"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/current-media-gate.log"
          test -z "$(git status --porcelain)"

      - name: Record terminal read-only Kragar review
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg exact "$EXACT_MAIN" \
            --arg task "$TASK_ID" \
            --arg fingerprint "$SOURCE_FINGERPRINT" \
            --arg source_title "$SOURCE_IMAGE_TITLE" \
            --arg source_sha "$SOURCE_DELIVERED_SHA256" \
            --arg candidate_sha "$CANDIDATE_SHA256" \
            --argjson width "$CANDIDATE_WIDTH" \
            --argjson height "$CANDIDATE_HEIGHT" \
            --argjson bytes "$CANDIDATE_BYTES" \
            --argjson predecessor_run "$PREDECESSOR_RUN" \
            --argjson predecessor_job "$PREDECESSOR_JOB" \
            --argjson predecessor_artifact "$PREDECESSOR_ARTIFACT_ID" \
            --arg predecessor_digest "$PREDECESSOR_ARTIFACT_SHA256" '
            {
              version:2,
              exact_main:$exact,
              task_id:$task,
              performer:"Dan Starkey",
              role:"Kragar",
              source_fingerprint:$fingerprint,
              queued_mode:"unresolved",
              reviewed_performance_mode:"physical-prosthetic",
              performance_basis:[
                "frozen source credits Dan Starkey as Kragar",
                "frozen source identifies televised appearances",
                "frozen source states Starkey received notably different Sontaran make-up for Kragar"
              ],
              predecessor:{run_id:$predecessor_run,job_id:$predecessor_job,artifact_id:$predecessor_artifact,artifact_zip_sha256:$predecessor_digest},
              character_still:{
                status:"reviewed-exact-subject-candidate-authorized",
                source_file:$source_title,
                source_delivered_format:"WEBP",
                source_api_mime:"image/jpeg",
                source_sha256:$source_sha,
                candidate_format:"JPEG",
                candidate_sha256:$candidate_sha,
                width:$width,
                height:$height,
                bytes:$bytes,
                kind:"copyright",
                rights_basis:"source metadata exposes no free-license grant; retain copyright classification",
                identity_vote:"exact-subject",
                presentation_vote:"character-specific",
                visual_description:"single blue holographic close-up of a legible prosthetic Sontaran face",
                visual_review_completed:true,
                adoption_authorized_for_cycle_007:true
              },
              performer_portrait:{status:"not-required-and-not-adopted"},
              current_media_gate:"pass",
              duplicate_canonical_sha_matches:0,
              lease_issued:false,
              queue_mutated:false,
              canonical_record_created:false,
              media_adopted:false,
              waterline_event_written:false,
              cycle_receipt_written:false,
              product_published:false,
              next_authority:"cycle-007 execution may adopt only the exact reviewed candidate SHA-256"
            }' > "$OUT/review-boundary.json"
          test -z "$(git status --porcelain)"

      - name: Upload terminal Kragar review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-final-review-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
