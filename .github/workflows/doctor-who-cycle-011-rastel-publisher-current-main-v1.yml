name: doctor-who-cycle-011-rastel-publisher-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-publisher-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-publisher-current-main-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-publisher-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-rastel-publisher-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-publisher-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification
      PACKET: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-review
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-worktree
      REVIEW_BRANCH: agent/doctor-who-cycle-011-rastel-current-main-review-v1
      REVIEW_WORKFLOW: doctor-who-cycle-011-rastel-current-main-review-v1
      REVIEW_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-current-main-review-v1-
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind publisher carrier and exact current-main approval
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,payload,receipt,logs} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          main='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$main"
          test "$(git rev-list --count "$main"..HEAD)" = 1
          test -z "$(git rev-list --merges "$main"..HEAD)"
          test "$(git diff --name-status "$main"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$main"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$REVIEW_BRANCH" -f per_page=100 > "$OUT/api/review-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_MAIN="$main" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'review-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['REVIEW_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_MAIN']
          (api/'review-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'review-head.txt').write_text(source['head']['sha']+'\n')
          (api/'review-number.txt').write_text(str(source['number'])+'\n')
          PY
          review_head="$(cat "$OUT/api/review-head.txt")"
          review_pr="$(cat "$OUT/api/review-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$REVIEW_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/review-runs.json"
            run_id="$(REVIEW_HEAD="$review_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/review-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['REVIEW_HEAD'] and row['name']==os.environ['REVIEW_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/review-run.json"
              if [ "$(jq -r '.status' "$OUT/api/review-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/review-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/review-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/review-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/review-artifacts.json"
          review_job="$(jq -r '.jobs[] | select(.name=="review" and .conclusion=="success") | .id' "$OUT/api/review-jobs.json")"
          test -n "$review_job"
          review_artifact="$(REVIEW_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/review-artifacts.json').read_text())['artifacts']
          expected=os.environ['REVIEW_ARTIFACT_PREFIX']+os.environ['REVIEW_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$review_artifact" > "$OUT/api/review-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$review_artifact/zip" > "$OUT/review.zip"
          review_sha="$(sha256sum "$OUT/review.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/review-artifact.json")" = "sha256:$review_sha"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_MAIN=%s\nREVIEW_PR=%s\nREVIEW_HEAD=%s\nREVIEW_RUN=%s\nREVIEW_JOB=%s\nREVIEW_ARTIFACT=%s\nREVIEW_ZIP_SHA256=%s\n' "$pr" "$head" "$main" "$review_pr" "$review_head" "$run_id" "$review_job" "$review_artifact" "$review_sha" >> "$GITHUB_ENV"

      - name: Authenticate review packet and exact product bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); payload=root/'payload'; sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'review.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          def one_status(status):
              rows=[]
              for path in packet.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows]); return rows[0]
          _,approval=one_status('cycle-011-rastel-current-main-product-independently-approved-v1')
          _,objects=one_status('cycle-011-rastel-current-main-product-object-review-complete-v1')
          _,recomposition=one_status('cycle-011-rastel-current-main-recomposition-qualified-v1')
          for data in (approval,objects,recomposition):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          product=approval['product']
          assert product['parent']==os.environ['CURRENT_MAIN'] and product['task']==os.environ['TASK_ID'] and product['lease']==os.environ['EXPECTED_LEASE'] and product['wall']==os.environ['WALL_ID'] and product['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert approval['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert all(approval['gates'].values()) and approval['boundary']['approved_for_isolated_publication'] is True
          assert product['commit']==objects['product']['commit'] and product['tree']==objects['product']['tree'] and product['paths']==objects['product']['paths']
          handoff_dirs=[]
          for directory in [packet]+[p for p in packet.rglob('*') if p.is_dir()]:
              bundle=directory/'current-product.bundle'
              if bundle.is_file():
                  heads=subprocess.check_output(['git','bundle','list-heads',str(bundle)],text=True)
                  if any(line.startswith(product['commit']+' ') for line in heads.splitlines()):handoff_dirs.append(directory)
          assert len(handoff_dirs)==1,[p.as_posix() for p in handoff_dirs]
          handoff=handoff_dirs[0]
          required=['current-product.bundle','current-product.patch','current-product-paths.txt','current-product-name-status.tsv','product.tar.gz','file-manifest.json']
          for name in required:
              src=handoff/name; assert src.is_file(),name; shutil.copy2(src,payload/name)
          subprocess.run(['git','bundle','verify',str(payload/'current-product.bundle')],check=True,capture_output=True,text=True)
          subprocess.run(['git','fetch','--no-tags',str(payload/'current-product.bundle'),product['commit']+':refs/rastel-publisher/product'],check=True)
          assert subprocess.check_output(['git','show','-s','--format=%P',product['commit']],text=True).strip()==os.environ['CURRENT_MAIN']
          assert subprocess.check_output(['git','show','-s','--format=%T',product['commit']],text=True).strip()==product['tree']
          assert int(subprocess.check_output(['git','rev-list','--count',os.environ['CURRENT_MAIN']+'..'+product['commit']],text=True))==1
          assert subprocess.check_output(['git','rev-list','--merges',os.environ['CURRENT_MAIN']+'..'+product['commit']],text=True).strip()==''
          assert len(subprocess.check_output(['git','diff','--name-only',os.environ['CURRENT_MAIN'],product['commit']],text=True).splitlines())==product['paths']
          assert subprocess.check_output(['git','diff','--binary',os.environ['CURRENT_MAIN'],product['commit']])==(payload/'current-product.patch').read_bytes()
          (payload/'approval.json').write_text(json.dumps(approval,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          authorization={'status':'cycle-011-rastel-current-main-product-publication-authorized-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'base':os.environ['CURRENT_MAIN']},'review':{'pr':int(os.environ['REVIEW_PR']),'head':os.environ['REVIEW_HEAD'],'run':int(os.environ['REVIEW_RUN']),'job':int(os.environ['REVIEW_JOB']),'artifact':int(os.environ['REVIEW_ARTIFACT']),'artifact_sha256':os.environ['REVIEW_ZIP_SHA256'],'approval_identity':approval['identity']},'product':product,'target_branch':os.environ['TARGET_BRANCH'],'files':[], 'boundary':{'publish_exact_product_ref_only':True,'main_mutation':False,'force_update':False,'cycle_012_authorized':False}}
          for path in sorted(p for p in payload.rglob('*') if p.is_file()):authorization['files'].append({'path':path.relative_to(payload).as_posix(),'bytes':path.stat().st_size,'sha256':sha(path.read_bytes())})
          authorization['identity']=sha(json.dumps(authorization,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (payload/'authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-current-main-review-artifact-authenticated-v1','version':1,'source':{'pr':int(os.environ['REVIEW_PR']),'head':os.environ['REVIEW_HEAD'],'run':int(os.environ['REVIEW_RUN']),'job':int(os.environ['REVIEW_JOB']),'artifact':int(os.environ['REVIEW_ARTIFACT']),'artifact_sha256':os.environ['REVIEW_ZIP_SHA256']},'approval_identity':approval['identity'],'object_review_identity':objects['identity'],'recomposition_identity':recomposition['identity'],'ledgers':ledgers,'authorization_identity':authorization['identity']}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/source-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          product="$(jq -r '.product.commit' "$OUT/payload/authorization.json")"
          tree="$(jq -r '.product.tree' "$OUT/payload/authorization.json")"
          paths="$(jq -r '.product.paths' "$OUT/payload/authorization.json")"
          printf 'PRODUCT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\n' "$product" "$tree" "$paths" >> "$GITHUB_ENV"

      - name: Rerun complete approved product gate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_MAIN"

      - name: Seal same-run publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          payload=Path(os.environ['OUT'])/'payload'; auth=json.loads((payload/'authorization.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          auth['files']=[]
          for path in sorted(p for p in payload.rglob('*') if p.is_file() and p.name not in ('authorization.json','SHA256SUMS.pre','SHA256SUMS')):auth['files'].append({'path':path.relative_to(payload).as_posix(),'bytes':path.stat().st_size,'sha256':sha(path.read_bytes())})
          auth.pop('identity',None); auth['identity']=sha(json.dumps(auth,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (payload/'authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          find "$OUT" -path "$OUT/payload" -prune -o -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          for pre,sealed in ((root/'SHA256SUMS.pre',root/'SHA256SUMS'),(root/'payload/SHA256SUMS.pre',root/'payload/SHA256SUMS')):
              assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
              base=pre.parent
              for raw in pre.read_text().splitlines():
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification
            /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  publish:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-publish-input
      OUT: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-publication
      QUALIFICATION_NAME: doctor-who-cycle-011-rastel-publisher-current-main-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Download and authenticate exact same-run payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']
          rows=[row for row in rows if row['name']==os.environ['QUALIFICATION_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/qualification-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/qualification.zip"
          zip_sha="$(sha256sum "$OUT/qualification.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/qualification-artifact.json")" = "sha256:$zip_sha"
          QUALIFICATION_ARTIFACT="$artifact" QUALIFICATION_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'qualification.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert pre.is_file() and sealed.is_file() and sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          auth=json.loads((packet/'authorization.json').read_text()); identity=auth.pop('identity'); assert sha(json.dumps(auth,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; auth['identity']=identity
          assert auth['status']=='cycle-011-rastel-current-main-product-publication-authorized-v1' and auth['target_branch']==os.environ['TARGET_BRANCH']
          assert auth['boundary']=={'publish_exact_product_ref_only':True,'main_mutation':False,'force_update':False,'cycle_012_authorized':False}
          product=auth['product']; assert product['parent']==auth['carrier']['base']
          for row in auth['files']:
              path=packet/row['path']; assert path.is_file() and path.stat().st_size==row['bytes'] and sha(path.read_bytes())==row['sha256']
          subprocess.run(['git','bundle','verify',str(packet/'current-product.bundle')],check=True,capture_output=True,text=True)
          subprocess.run(['git','fetch','--no-tags',str(packet/'current-product.bundle'),product['commit']+':refs/rastel-publication/product'],check=True)
          assert subprocess.check_output(['git','show','-s','--format=%P',product['commit']],text=True).strip()==product['parent']
          assert subprocess.check_output(['git','show','-s','--format=%T',product['commit']],text=True).strip()==product['tree']
          assert len(subprocess.check_output(['git','diff','--name-only',product['parent'],product['commit']],text=True).splitlines())==product['paths']
          (out/'receipt/authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          parent="$(jq -r '.product.parent' "$OUT/receipt/authorization.json")"
          product="$(jq -r '.product.commit' "$OUT/receipt/authorization.json")"
          tree="$(jq -r '.product.tree' "$OUT/receipt/authorization.json")"
          paths="$(jq -r '.product.paths' "$OUT/receipt/authorization.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$parent"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" > "$OUT/api/target-before.json" 2>/dev/null; then
            echo "target branch already exists" >&2
            exit 1
          fi
          printf 'QUALIFICATION_ARTIFACT=%s\nQUALIFICATION_ZIP_SHA256=%s\nPARENT=%s\nPRODUCT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\n' "$artifact" "$zip_sha" "$parent" "$product" "$tree" "$paths" >> "$GITHUB_ENV"

      - name: Push only exact approved product ref without force
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --porcelain origin "$PRODUCT:refs/heads/$TARGET_BRANCH" | tee "$OUT/logs/push.log"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$PRODUCT"
          test "$(git show -s --format=%P "$PRODUCT")" = "$PARENT"
          test "$(git show -s --format=%T "$PRODUCT")" = "$PRODUCT_TREE"
          test "$(git rev-list --count "$PARENT".."$PRODUCT")" = 1
          test -z "$(git rev-list --merges "$PARENT".."$PRODUCT")"
          test "$(git diff --name-only "$PARENT" "$PRODUCT" | wc -l | tr -d ' ')" = "$PRODUCT_PATHS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PARENT"

      - name: Seal exact publication receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); auth=json.loads((root/'receipt/authorization.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt={'status':'cycle-011-rastel-current-main-product-published-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'qualification':{'artifact':int(os.environ['QUALIFICATION_ARTIFACT']),'artifact_sha256':os.environ['QUALIFICATION_ZIP_SHA256'],'authorization_identity':auth['identity']},'product':{'branch':os.environ['TARGET_BRANCH'],'commit':os.environ['PRODUCT'],'tree':os.environ['PRODUCT_TREE'],'parent':os.environ['PARENT'],'paths':int(os.environ['PRODUCT_PATHS'])},'boundary':{'exact_nonforced_branch_creation':True,'main_mutation':False,'force_update':False,'cycle_012_authorized':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/publication.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-current-main-v1-publication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-publisher-current-main-v1-publication-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-publish-input
            /tmp/doctor-who-cycle-011-rastel-publisher-current-main-v1-publication
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
