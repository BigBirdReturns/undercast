name: thesis-rails

"on":
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: thesis-rails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  thesis-throughline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            AGENTS.md
            docs
            scripts
            data
            preservation
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate thesis continuation fixtures
        run: node scripts/thesis-rails-fixtures.mjs

      - name: Validate thesis continuation contract
        run: node scripts/thesis-rails.mjs validate --json

      - name: Enforce bounded cycle workflow topology
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/thesis-rails.mjs check-pr --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH"

      - name: Prove a deterministic next operation on canonical main
        if: ${{ github.event_name == 'push' }}
        run: node scripts/thesis-rails.mjs next --json
