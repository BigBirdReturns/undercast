name: card-backfill-uc-077-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-077.json"
      - "scripts/card-backfill-uc-077-discover.mjs"
      - ".github/workflows/card-backfill-uc-077-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-077-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-017'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-017
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-077 audit and identity boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-077.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_3a0656746243c69d45effb60');
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-077');
          if(control.record_id!=='UC-077'||control.actor!=='Peter Boyle'||control.character!=='The Monster'||control.side!=='still')throw new Error('UC-077 control drift');
          if(control.selector_artifact?.artifact_id!==8642222925||control.selector_artifact?.head_sha!=='a8dbe0d52cc661f090c8ec75c0c2994a52b1bc3a')throw new Error('UC-077 selector custody drift');
          if(!audit||audit.wall_id!=='UC-077'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-077 audit boundary drift');
          if(!specimen||specimen.actor!=='Peter Boyle'||specimen.character!=='The Monster'||specimen.still)throw new Error('UC-077 specimen boundary drift');
          if(control.pages?.filter(row=>row.strict).length!==4)throw new Error('UC-077 strict source denominator drift');
          console.log('PASS — exact UC-077 absent still and Peter Boyle Monster boundary verified');
          NODE
      - name: Gather exact Monster candidates and build review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-077
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-077-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-077-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages, hashes and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-077-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-077
            ${{ runner.temp }}/card-backfill-uc-077-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
