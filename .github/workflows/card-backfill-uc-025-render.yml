name: card-backfill-uc-025-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-025-RENDER.json"
      - "scripts/card-backfill-uc-025-render-from-artifact.mjs"
      - ".github/workflows/card-backfill-uc-025-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-025-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-002'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed source and artifact authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-025-RENDER.json','utf8'));
          if(row.version!==2||row.record_id!=='UC-025'||row.actor!=='Javier Botet'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-025 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8626866743||row.discovery_artifact?.head_sha!=='f3c8ce4e821e090fcd3da6c13a42b8bf53812eb8')throw new Error('UC-025 artifact custody drift');
          if(row.sources?.length!==3||new Set(row.sources.map(source=>source.key)).size!==3)throw new Error('UC-025 render must bind three distinct role sources');
          if(row.sources.some(source=>!/^[0-9a-f]{64}$/.test(source.expected_sha256||'')||!source.artifact_path))throw new Error('UC-025 source authorization incomplete');
          if(row.sources.reduce((sum,source)=>sum+source.band_height,0)+row.composition.divider_height*2!==row.composition.height)throw new Error('UC-025 composition does not close');
          console.log('PASS — exact discovery artifact and three selected role sources authorized');
          NODE
      - name: Retrieve and hash-verify the retained discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-025-source"
          mkdir -p "$root"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8626866743/zip" > "$root/discovery.zip"
          echo "0e1383c5c7d71475548f78de4211783bc47b208bdd8afaae44bc1c669b7e4b55  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/unpacked"
          echo "b0036e7542b69f744ebc10e9f1a90cf6ef4b3f817892bd5ae62dbf7d7634af83  $root/unpacked/card-backfill-uc-025/candidates/mama/06.webp" | sha256sum -c -
          echo "8a8f722a9e51dd6e0bb517d379a242e9a426c1495aac6b338f63df6826fa888d  $root/unpacked/card-backfill-uc-025/candidates/crooked-man/03.jpg" | sha256sum -c -
          echo "35edf51952d53f92d2abee9b3d07889eb58ddd97b5828e9d3aa54cde49476cc7  $root/unpacked/card-backfill-uc-025/candidates/keyface/02.jpg" | sha256sum -c -
      - name: Render the exact candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-025-source/unpacked
          OUT: ${{ runner.temp }}/card-backfill-uc-025-render
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-025-render-from-artifact.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-025-render.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, sources, hashes and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-025-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-025-render
            ${{ runner.temp }}/card-backfill-uc-025-render.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
