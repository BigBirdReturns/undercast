name: materialize-clifford-number-hr-wave-03

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-source-adjudication-wave-02
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-governance-wave-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 03 packet
        shell: bash
        env:
          PARENT_SHA: fdfdeade8b44d0c1af5442735a360761322dc109
          PAYLOAD_SHA256: 716aff39d802f53594796edaee384cfd39ffedb0fa17e2cdfaadae45f00cce9d
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          test "$(git hash-object .cnhr-wave03/fixed-000.txt)" = 859a7f6d0ce46e9a4cd7b817c1dc7b97423dd063
          test "$(git hash-object .cnhr-wave03/fixed-001.txt)" = 1f121fe64e546508e9fef08beeb52e98fee95c25
          test "$(git hash-object .cnhr-wave03/fixed-002.txt)" = 7abc39bfd673e4e374a6ef9890a348d1e12c8bd8
          test "$(git hash-object .cnhr-wave03/fixed-003.txt)" = 4cc2d81bca08052974b95095cc41606cf26d81f2
          test "$(git hash-object .cnhr-wave03/fixed-004.txt)" = 88db4e4102fed663e1c57122fddb462e5dcb5b30
          test "$(git hash-object .cnhr-wave03/fixed-005.txt)" = baea2ed4d3c2fc8c6190d102e2522c019cb34da1
          test "$(git hash-object .cnhr-wave03/fixed-006.txt)" = 4a8c53af961a4ac6b6b0154185c5a4ee2a760a7b
          test "$(git hash-object .cnhr-wave03/fixed-007.txt)" = d6acecb39e297ceef6a80acc55c37ee0d98e4195
          test "$(git hash-object .cnhr-wave03/fixed-008.txt)" = 23c20a8a38660b6825e04244401d6bb4e21f86fe

          cat .cnhr-wave03/fixed-*.txt | tr -d '\n' | base64 --decode > /tmp/cnhr-wave03.tar.gz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave03.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/cnhr-wave03.tar.gz -C .
          rm -rf .cnhr-wave03 .github/workflows/cnhr-wave03-materialize.yml

          node --check scripts/clifford-number-hr-source-adjudication.mjs
          node scripts/clifford-number-hr-source-adjudication.mjs --check
          node test/clifford-number-hr-source-adjudication-fixtures.mjs

          node --check scripts/clifford-number-hr-governance.mjs
          node --check test/clifford-number-hr-governance-fixtures.mjs
          node scripts/clifford-number-hr-governance.mjs --check
          node test/clifford-number-hr-governance-fixtures.mjs
          git diff --check

          git add -A
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = 'fdfdeade8b44d0c1af5442735a360761322dc109'
          manifest_path = Path('data/review/clifford-number/hr-selection/wave-03/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(['git', 'diff', '--cached', '--name-status', parent, '--'], text=True).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (sorted(expected - set(observed)), sorted(set(observed) - expected))
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 21, len(observed)
          print('exact Wave 03 delta: 21 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: govern Clifford Number HR-selection Wave 03'
          git push origin HEAD:"${HEAD_REF}"
