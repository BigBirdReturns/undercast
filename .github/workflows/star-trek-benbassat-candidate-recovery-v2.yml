name: star-trek-benbassat-candidate-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-benbassat-candidate-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-benbassat-candidate-recovery-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  EXPECTED_TREE: 7f9057770c8e622d71ef41b183811fe47fcdd6ed
  ALICE_TASK_ID: ap_c7ff8298a99fe94fc55bbdbc
  ALICE_WALL_ID: UC-1396
  TASK_ID: ap_dd7d1c73ed237230cd6e1d0b
  EXPECTED_PERFORMER: Nolan North
  EXPECTED_CHARACTER: Benbassat
  EXPECTED_FINGERPRINT: 78e1384a3a11787064f98516e5759b55b33369d161067804c2d77f2ef6ef8885
  WALL_ID: UC-1397
  CLAIM_BRANCH: agent/star-trek-benbassat-claim-result-v1
  SOURCE_REVIEW_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  SOURCE_REVIEW_PATH: transport/star-trek-benbassat-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-benbassat-media-result-v1
  MEDIA_PATH: transport/star-trek-benbassat-media-v1/media-receipt.json
  SETTLEMENT_BRANCH: agent/star-trek-benbassat-preproduct-settlement-result-v2
  SETTLEMENT_PATH: transport/star-trek-benbassat-preproduct-settlement-v2/settlement.json
  RESULT_BRANCH: agent/star-trek-benbassat-candidate-result-v2
  OUT: /tmp/star-trek-benbassat-candidate-v2
  REVIEW_ROOT: /tmp/star-trek-benbassat-candidate-v2/source-review
  MEDIA_ROOT: /tmp/star-trek-benbassat-candidate-v2/media-layer
  SETTLEMENT_ROOT: /tmp/star-trek-benbassat-candidate-v2/preproduct-settlement
  BUILDER_SOURCE: .github/recovery/star-trek-benbassat-candidate-recovery-v2/candidate-builder.py
  BUILDER: /tmp/star-trek-benbassat-candidate-builder-v2.py

jobs:
  stage:
    name: stage-corrected-benbassat-candidate
    if: ${{ github.event.head_commit.message == 'Stage corrected Star Trek Benbassat candidate v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze corrected candidate builder
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "$BUILDER_SOURCE" "$BUILDER"
          chmod +x "$BUILDER"
          python3 -m py_compile "$BUILDER"
          sha256sum "$BUILDER" > /tmp/star-trek-benbassat-builder-v2.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify corrected layers and checkout the single durable lease
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$REVIEW_ROOT" "$MEDIA_ROOT" "$SETTLEMENT_ROOT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git fetch --no-tags origin main "$CLAIM_BRANCH" "$SOURCE_REVIEW_BRANCH" "$MEDIA_BRANCH" "$SETTLEMENT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"

          source_ref="refs/remotes/origin/${SOURCE_REVIEW_BRANCH}"
          media_ref="refs/remotes/origin/${MEDIA_BRANCH}"
          settlement_ref="refs/remotes/origin/${SETTLEMENT_BRANCH}"
          claim_ref="refs/remotes/origin/${CLAIM_BRANCH}"
          git show "${source_ref}:${SOURCE_REVIEW_PATH}" > "$REVIEW_ROOT/source-review.json"
          git show "${media_ref}:${MEDIA_PATH}" > "$MEDIA_ROOT/media-receipt.json"
          git show "${settlement_ref}:${SETTLEMENT_PATH}" > "$SETTLEMENT_ROOT/settlement.json"

          jq -e \
            --arg task "$TASK_ID" --arg performer "$EXPECTED_PERFORMER" --arg character "$EXPECTED_CHARACTER" --arg fp "$EXPECTED_FINGERPRINT" \
            '.transaction == "STAR-TREK-BENBASSAT-SOURCE-REVIEW-V1"
             and .verdict == "pass"
             and .task.id == $task and .task.performer == $performer and .task.character == $character and .task.source_fingerprint == $fp
             and .production_source.series == "Star Trek: Picard"
             and .production_source.title == "Võx"
             and .production_source.year == "2023"
             and .adjudication.performance_mode == "voice-only"
             and .adjudication.physical_prosthetic_hint_accepted == false
             and .adjudication.physical_performance_attributed == false
             and .adjudication.prosthetic_performance_attributed == false
             and .adjudication.animation_performance_attributed == false
             and .adjudication.maker_attribution == "unresolved"' \
            "$REVIEW_ROOT/source-review.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-MEDIA-V1"
             and .status == "complete"
             and .task.id == $task
             and .task.performance_mode == "voice-only"
             and .task.wall_id_reserved == $wall
             and .facets.still.status == "absent"
             and .facets.portrait.status == "absent"
             and .boundary.source_distinct == true
             and .boundary.byte_distinct == true
             and .boundary.cross_facet_substitution == false
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false' \
            "$MEDIA_ROOT/media-receipt.json" >/dev/null

          jq -e \
            --arg task "$TASK_ID" --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-PREPRODUCT-SETTLEMENT-V2"
             and .status == "preproduct-ready"
             and .task.id == $task
             and .task.status == "leased"
             and .task.wall_id_reserved == $wall
             and .queue.in_flight == 1
             and .adjudication.production == "Star Trek: Picard"
             and .adjudication.episode == "Võx"
             and .adjudication.performance_mode == "voice-only"
             and .boundary.source_frozen == true
             and .boundary.independent_source_reviewed == true
             and .boundary.single_lease_durable == true
             and .boundary.media_facets_complete == true
             and .boundary.honest_media_absence == true
             and .boundary.product_staged == false
             and .boundary.canonical_mutation == false
             and .boundary.additional_lease_issued == false' \
            "$SETTLEMENT_ROOT/settlement.json" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          checks=[
            (Path(os.environ['REVIEW_ROOT'])/'source-review.json','review_sha256',('artifact',)),
            (Path(os.environ['MEDIA_ROOT'])/'media-receipt.json','receipt_sha256',('artifact',)),
            (Path(os.environ['SETTLEMENT_ROOT'])/'settlement.json','receipt_sha256',('artifact',)),
          ]
          def stable(v):
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              if isinstance(v,list): return [stable(x) for x in v]
              return v
          for path,field,extras in checks:
              payload=json.loads(path.read_text()); expected=payload[field]; body=dict(payload); body.pop(field,None)
              for key in extras: body.pop(key,None)
              actual=hashlib.sha256((json.dumps(stable(body),indent=2,ensure_ascii=False)+'\n').encode()).hexdigest()
              if actual!=expected: raise SystemExit(f'{path.name} identity mismatch: {actual} != {expected}')
          PY

          claim_commit="$(git rev-parse "$claim_ref")"
          test "$(git show -s --format=%P "$claim_ref")" = "$EXPECTED_MAIN"
          echo "CLAIM_COMMIT=$claim_commit" >> "$GITHUB_ENV"
          git checkout --detach "$claim_ref"
          test -f data/review/adapter-sdk/star-trek-benbassat-claim.json
          test "$(jq -r .lease.id data/review/adapter-sdk/star-trek-benbassat-claim.json)" = "$(jq -r .task.lease_id "$SETTLEMENT_ROOT/settlement.json")"
          npm ci --ignore-scripts
          node - <<'NODE'
          const fs=require('fs'); const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json')); const trek=state.jobs.filter(x=>x.scope==='star-trek'); const task=trek.find(x=>x.id===process.env.TASK_ID); const active=trek.filter(x=>['leased','drafted','merged'].includes(x.status));
          const counts={total:trek.length,queued:trek.filter(x=>x.status==='queued').length,resolved:trek.filter(x=>x.status==='resolved').length,blocked:trek.filter(x=>x.status==='blocked').length,rejected:trek.filter(x=>x.status==='rejected').length,in_flight:active.length};
          const expected={total:2228,queued:1797,resolved:428,blocked:0,rejected:2,in_flight:1};
          if(!task||task.status!=='leased'||!task.lease?.id||!task.lease?.readiness_token) throw Error('Benbassat durable claim missing');
          if(active.length!==1||active[0].id!==process.env.TASK_ID) throw Error('another Star Trek task is active');
          if(JSON.stringify(counts)!==JSON.stringify(expected)) throw Error('claim queue drifted: '+JSON.stringify(counts));
          fs.writeFileSync(process.env.OUT+'/claim-state.json',JSON.stringify({task,counts},null,2)+'\n'); fs.writeFileSync(process.env.OUT+'/lease-id.txt',task.lease.id+'\n');
          NODE
          git diff-tree --no-commit-id --name-only -r "$EXPECTED_MAIN" | LC_ALL=C sort > "$OUT/alice-product-paths.txt"
          cp /tmp/star-trek-benbassat-builder-v2.sha256 "$OUT/builder.sha256"
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-before.json"
          test "$(jq -r .commit.sha "$OUT/main-before.json")" = "$EXPECTED_MAIN"

      - name: Build candidate and transition the existing lease
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$BUILDER" prepare
          git config user.name undercast-benbassat-candidate-recovery
          git config user.email undercast-benbassat-candidate-recovery@users.noreply.github.com
          git checkout -b benbassat-candidate-working-v2
          git add -A
          git commit -m 'Temporary corrected Benbassat candidate core'
          core_commit="$(git rev-parse HEAD)"
          lease_id="$(cat "$OUT/lease-id.txt")"

          task_status() { node -e 'const s=require("./data/AUTOPILOT.json"); const t=s.jobs.find(x=>x.id===process.env.TASK_ID); process.stdout.write(t?.status||"")'; }
          task_wall() { node -e 'const s=require("./data/AUTOPILOT.json"); const t=s.jobs.find(x=>x.id===process.env.TASK_ID); process.stdout.write(JSON.stringify(t?.wall_ids||[]))'; }

          submit_commands=(
            "node scripts/autopilot.mjs submit --agent luna --task '$TASK_ID' --lease '$lease_id' --input '$OUT/submission.json'"
            "node scripts/autopilot.mjs submit --agent luna --task-id '$TASK_ID' --lease-id '$lease_id' --input '$OUT/submission.json'"
            "node scripts/autopilot.mjs submit --agent luna --lease '$lease_id' --input '$OUT/submission.json'"
            "node scripts/autopilot.mjs submit --agent luna --lease-id '$lease_id' --input '$OUT/submission.json'"
          )
          submit_ok=''
          for index in "${!submit_commands[@]}"; do
            git reset --hard "$core_commit" >/dev/null
            command="${submit_commands[$index]}"
            set +e; bash -lc "$command" > "$OUT/submit-$index.log" 2>&1; code=$?; set -e
            status="$(task_status)"; printf 'exit=%s status=%s command=%s\n' "$code" "$status" "$command" > "$OUT/submit-$index.status"
            if test "$code" = 0 && [[ "$status" =~ ^(drafted|merged|resolved)$ ]]; then submit_ok="$command"; break; fi
          done
          test -n "$submit_ok" || { echo 'no submit variant succeeded' >&2; exit 1; }
          printf '%s\n' "$submit_ok" > "$OUT/submit-command.txt"

          if test "$(task_status)" = resolved; then
            printf '%s\n' 'submit-resolved-directly' > "$OUT/complete-command.txt"
          else
            git add -A
            git commit -m 'Temporary corrected Benbassat submission'
            submit_commit="$(git rev-parse HEAD)"
            complete_commands=(
              "node scripts/autopilot.mjs complete --agent luna --task '$TASK_ID' --lease '$lease_id' --wall-id '$WALL_ID' --review '$OUT/outcome-review.json'"
              "node scripts/autopilot.mjs complete --agent luna --task-id '$TASK_ID' --lease-id '$lease_id' --wall-id '$WALL_ID' --review '$OUT/outcome-review.json'"
              "node scripts/autopilot.mjs complete --agent luna --lease '$lease_id' --wall-id '$WALL_ID' --review '$OUT/outcome-review.json'"
              "node scripts/autopilot.mjs complete --agent luna --lease '$lease_id' --input '$OUT/outcome-review.json'"
            )
            complete_ok=''
            for index in "${!complete_commands[@]}"; do
              git reset --hard "$submit_commit" >/dev/null
              command="${complete_commands[$index]}"
              set +e; bash -lc "$command" > "$OUT/complete-$index.log" 2>&1; code=$?; set -e
              status="$(task_status)"; wall="$(task_wall)"; printf 'exit=%s status=%s wall=%s command=%s\n' "$code" "$status" "$wall" "$command" > "$OUT/complete-$index.status"
              if test "$code" = 0 && test "$status" = resolved && test "$wall" = '["UC-1397"]'; then complete_ok="$command"; break; fi
            done
            test -n "$complete_ok" || { echo 'no complete variant succeeded' >&2; exit 1; }
            printf '%s\n' "$complete_ok" > "$OUT/complete-command.txt"
          fi

          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/AUTOPILOT.json')); const trek=s.jobs.filter(x=>x.scope==='star-trek'); const task=trek.find(x=>x.id===process.env.TASK_ID); const counts={total:trek.length,queued:trek.filter(x=>x.status==='queued').length,resolved:trek.filter(x=>x.status==='resolved').length,blocked:trek.filter(x=>x.status==='blocked').length,rejected:trek.filter(x=>x.status==='rejected').length,in_flight:trek.filter(x=>['leased','drafted','merged'].includes(x.status)).length}; if(!task||task.status!=='resolved'||JSON.stringify(task.wall_ids)!=='["UC-1397"]') throw Error('Benbassat transition failed'); if(JSON.stringify(counts)!==JSON.stringify({total:2228,queued:1797,resolved:429,blocked:0,rejected:2,in_flight:0})) throw Error('resolved queue drifted: '+JSON.stringify(counts)); fs.writeFileSync(process.env.OUT+'/resolved-task.json',JSON.stringify({task,counts},null,2)+'\n');
          NODE

      - name: Rebuild permanent projections and qualify the candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run credits | tee "$OUT/credits.log"
          npm run sync:sources | tee "$OUT/sources-sync.log"
          npm run media:audit -- sync --scope star-trek | tee "$OUT/media-sync.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate.log"
          node scripts/census.mjs | tee "$OUT/census.log"
          npm run build:ferengi | tee "$OUT/build-ferengi.log"
          npm run build:species | tee "$OUT/build-species.log"
          npm run build:changelings | tee "$OUT/build-changelings.log"
          node scripts/shard.mjs | tee "$OUT/shard.log"
          npm run build:contract | tee "$OUT/build-contract.log"
          npm run build:site | tee "$OUT/build-site.log"
          node scripts/validate.mjs | tee "$OUT/validate-before-receipt.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate.log"
          node scripts/thesis-rails.mjs next --json > "$OUT/thesis-next-after.json" || true
          python3 "$BUILDER" receipt
          npm run adapter:write | tee "$OUT/adapter-write.log"
          node scripts/validate.mjs | tee "$OUT/validate-after-receipt.log"
          npm run media:audit -- gate --scope star-trek | tee "$OUT/media-gate-after.log"
          node scripts/thesis-rails.mjs validate | tee "$OUT/thesis-validate-after.log"
          npm run autopilot:fixtures | tee "$OUT/autopilot-fixtures.log"
          jq -e \
            --arg task "$TASK_ID" --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-BENBASSAT-CANDIDATE-V2"
             and .status == "candidate-ready-for-independent-review"
             and .task.id == $task
             and .task.status == "resolved"
             and .task.wall_ids == [$wall]
             and .queue.resolved == 429
             and .queue.in_flight == 0
             and .source_review.verdict == "pass"
             and .source_review.performance_mode == "voice-only"
             and .boundary.physical_prosthetic_hint_accepted == false
             and .boundary.physical_performance_attributed == false
             and .boundary.prosthetic_performance_attributed == false
             and .boundary.maker_attribution == "unresolved"
             and .boundary.independent_product_review_complete == false
             and .boundary.waterline_cycle_recorded == false
             and .boundary.canonical_mutation == false
             and .boundary.additional_lease_issued == false' \
            "$OUT/candidate-receipt.json" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$EXPECTED_MAIN"
          git diff --check

      - name: Squash and publish corrected candidate branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --soft "$CLAIM_COMMIT"
          git add -A
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/candidate-paths.txt"
          test -s "$OUT/candidate-paths.txt"
          test "$(grep -c '^data/review/adapter-sdk/star-trek-benbassat-candidate.json$' "$OUT/candidate-paths.txt")" = 1
          test "$(grep -c '^images/uc-1397-' "$OUT/candidate-paths.txt" || true)" = 0
          git commit -m 'Star Trek: stage corrected Benbassat candidate'
          candidate_commit="$(git rev-parse HEAD)"; candidate_tree="$(git show -s --format=%T HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$CLAIM_COMMIT"
          jq -n --arg commit "$candidate_commit" --arg tree "$candidate_tree" --arg parent "$CLAIM_COMMIT" --arg task "$TASK_ID" --arg wall "$WALL_ID" \
            '{version:2,transaction:"STAR-TREK-BENBASSAT-CANDIDATE-PUBLICATION-V2",commit:$commit,tree:$tree,parent:$parent,task_id:$task,wall_id:$wall,canonical_mutation:false,independent_review_pending:true,waterline_pending:true}' \
            > "$OUT/candidate-commit.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"

      - name: Upload corrected Benbassat candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-benbassat-candidate-recovery-v2-${{ github.run_id }}
          path: |
            /tmp/star-trek-benbassat-candidate-v2/
            /tmp/star-trek-benbassat-candidate-builder-v2.py
          if-no-files-found: warn
          retention-days: 30
