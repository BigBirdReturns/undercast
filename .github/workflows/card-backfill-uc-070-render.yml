name: card-backfill-uc-070-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-070-RENDER.json"
      - "scripts/card-backfill-uc-070-render.mjs"
      - ".github/workflows/card-backfill-uc-070-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-070-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-013'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-013
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed Davy Jones authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-070-RENDER.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-070'||row.actor!=='Bill Nighy'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-070 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8636699882||row.discovery_artifact?.head_sha!=='892b45b6d78bcbe9476009d1ff01ebc02851210b')throw new Error('UC-070 discovery custody drift');
          if(row.selection?.sha256!=='3d8e34a8b291c88be576dfcfea6bd2649f5d7a2d237d57382ba64cf3639cc0f9'||row.selection?.source_manifest_sha256!=='ec881be759079775536b0b56ec521b4c8a5e9d4f7a9dbb75fb504897db3a7702')throw new Error('UC-070 selected source drift');
          if(row.rejected_visual_duplicates?.length!==4||row.crop?.gravity!=='center'||row.ruling?.crop_ruling!=='pass-center-focus')throw new Error('UC-070 visual-duplicate or crop ruling drift');
          console.log('PASS — exact ILM/Disney Davy Jones source and centered crop authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-070-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8636699882/zip" > "$root/discovery.zip"
          echo "7a05c5b6d778c63219c355567b744c8ec3c39b08a6a4aa2aca88ca336dd4d835  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-070/manifest.json"
          echo "ec881be759079775536b0b56ec521b4c8a5e9d4f7a9dbb75fb504897db3a7702  $root/source/card-backfill-uc-070/manifest.json" | sha256sum -c -
          echo "3d8e34a8b291c88be576dfcfea6bd2649f5d7a2d237d57382ba64cf3639cc0f9  $root/source/card-backfill-uc-070/candidates/06-ilm-animation-history-industrial-light-magic.jpg" | sha256sum -c -
          echo "64ccf82c69b86a093ca977e2a96d3a6d9dee47135ba853333f22368ae5e6fc8f  $root/source/card-backfill-uc-070/pages/ilm-animation-history.png" | sha256sum -c -
      - name: Render exact Davy Jones candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-070-render/source/card-backfill-uc-070
          OUT: ${{ runner.temp }}/card-backfill-uc-070-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-070-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-070-render/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-070-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-070-render/output
            ${{ runner.temp }}/card-backfill-uc-070-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
