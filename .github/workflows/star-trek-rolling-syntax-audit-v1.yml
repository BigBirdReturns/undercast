name: star-trek-rolling-syntax-audit-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-syntax-audit-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RESULT_BRANCH: agent/star-trek-rolling-syntax-audit-result-v1
      ROOT: /tmp/star-trek-rolling-syntax-audit-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Parse and validate every rolling carrier
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          npm ci --ignore-scripts
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const YAML=require('yaml');
          const root='.github/workflows';
          const files=fs.readdirSync(root).filter(name=>name.startsWith('star-trek-rolling')&&/\.ya?ml$/.test(name)).sort();
          if(files.length<8) throw new Error(`rolling workflow inventory is incomplete: ${files.length}`);
          const names=new Map();
          const report=[];
          for(const name of files){
            const full=path.join(root,name); const text=fs.readFileSync(full,'utf8');
            const doc=YAML.parse(text);
            if(!doc||typeof doc!=='object') throw new Error(`${name}: YAML did not produce an object`);
            if(typeof doc.name!=='string'||!doc.name.startsWith('star-trek-rolling')) throw new Error(`${name}: workflow name drifted`);
            if(names.has(doc.name)) throw new Error(`${name}: duplicate workflow name ${doc.name}`);
            names.set(doc.name,name);
            const trigger=doc.on||doc['on'];
            const push=trigger&&trigger.push;
            const branches=push&&push.branches;
            if(!Array.isArray(branches)||branches.length!==1||branches[0]!=='agent/star-trek-rolling-continuation-v1') throw new Error(`${name}: branch trigger drifted`);
            if(text.includes('branches: [main]')||text.includes('- main\n')) throw new Error(`${name}: rolling carrier must not trigger on main`);
            report.push({file:full,name:doc.name,jobs:Object.keys(doc.jobs||{}),bytes:Buffer.byteLength(text)});
          }
          fs.writeFileSync('/tmp/star-trek-rolling-syntax-audit-v1/workflows.json',JSON.stringify(report,null,2)+'\n');
          NODE
          for file in .github/recovery/rolling-*.py; do
            test -f "$file"
            python3 -m py_compile "$file"
            sha256sum "$file"
          done > "$ROOT/recovery-programs.sha256"
          node - <<'NODE'
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('transport/star-trek-rolling-continuation-v1/state.json','utf8'));
          if(state.version!==1||state.transaction!=='STAR-TREK-ROLLING-CONTINUATION-STATE-V1') throw new Error('rolling state schema drifted');
          if(!Number.isInteger(state.iteration)||!Number.isInteger(state.max_iterations)||state.max_iterations<20) throw new Error('rolling state iteration contract drifted');
          fs.writeFileSync('/tmp/star-trek-rolling-syntax-audit-v1/state.json',JSON.stringify(state,null,2)+'\n');
          NODE
          jq -n --argjson version 1 --arg transaction STAR-TREK-ROLLING-SYNTAX-AUDIT-V1 --arg status pass --argjson workflow_run "$GITHUB_RUN_ID" --arg workflow_head "$GITHUB_SHA" --argjson workflow_count "$(jq length "$ROOT/workflows.json")" '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,workflow_count:$workflow_count}' > "$ROOT/audit.json"
          (cd "$ROOT" && find . -maxdepth 1 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256 && sha256sum -c manifest.sha256)

      - name: Publish syntax audit result
        run: |
          set -euo pipefail
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/star-trek-rolling-syntax-audit-v1
          mkdir -p transport/star-trek-rolling-syntax-audit-v1
          cp "$ROOT"/* transport/star-trek-rolling-syntax-audit-v1/
          git config user.name undercast-star-trek-rolling-syntax-auditor
          git config user.email rolling-syntax-auditor@users.noreply.github.com
          git add transport/star-trek-rolling-syntax-audit-v1
          git commit -m 'Star Trek: publish rolling carrier syntax audit'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"

      - name: Upload syntax audit package
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-rolling-syntax-audit-v1
          path: /tmp/star-trek-rolling-syntax-audit-v1/
          if-no-files-found: error
          retention-days: 30
