name: card-backfill-uc-077-targeted

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-077-TARGETED.json"
      - "scripts/card-backfill-uc-077-targeted.mjs"
      - ".github/workflows/card-backfill-uc-077-targeted.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-077-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-017'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-017
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact targeted UC-077 source authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-077-TARGETED.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_3a0656746243c69d45effb60');
          if(row.version!==1||row.record_id!=='UC-077'||row.actor!=='Peter Boyle'||row.character!=='The Monster'||row.side!=='still')throw new Error('UC-077 targeted authorization drift');
          if(row.broad_discovery_artifact?.artifact_id!==8642315578||row.broad_discovery_artifact?.head_sha!=='6a224b49b9cf17111dc8d4877d2fb08c3bb1c136')throw new Error('UC-077 custody drift');
          if(!audit||audit.wall_id!=='UC-077'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-077 audit boundary drift');
          if(row.targets?.length!==3||row.targets.filter(target=>target.strict===true).length!==2||row.targets.some(target=>!target.key||!target.provider||!target.url||!Array.isArray(target.required_terms)||!target.caption_phrase))throw new Error('UC-077 exact-source denominator drift');
          console.log('PASS — exact LA Times, TCM, and IMDb Monster targets authorized');
          NODE
      - name: Gather exact caption-local Peter Boyle Monster candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-077-targeted
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-077-targeted.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-077-targeted-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-077-targeted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-077-targeted
            ${{ runner.temp }}/card-backfill-uc-077-targeted-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
