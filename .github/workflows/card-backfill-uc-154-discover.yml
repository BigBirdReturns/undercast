name: card-backfill-uc-154-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-154-DISCOVER.json"
      - "scripts/card-backfill-uc-154-discover.mjs"
      - ".github/workflows/card-backfill-uc-154-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-154-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-033'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-033
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-154 first-film discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-154-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-154');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-154');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_067190c9e8aa5e6b9b695e62');
          if(row.version!==1||row.record_id!=='UC-154'||row.actor!=='Tyler Mane'||row.character!=='Michael Myers'||row.production!=='Halloween (2007)'||row.years!=='2007–2009'||row.side!=='still')throw new Error('UC-154 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8710537497||row.selector_artifact?.head_sha!=='fbea63b87d6dd0b5ff1cd3d50f0739e045a870e0'||row.selector_artifact?.zip_sha256!=='13876a3f72fb8f6c5cf690e42d070e663febacca73937dd109f14cbb944d2631')throw new Error('UC-154 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8710630547||row.scope_artifact?.head_sha!=='b1b99c2dd28b50fe0d89fbc5022d0336d542fba6'||row.scope_artifact?.scope_sha256!=='6450cc15412afc4f9075aa277ef738896327fa659ed6a15f0bfb955d3063fdbb')throw new Error('UC-154 scope custody drift');
          if(row.actor_role_pages?.length!==2||row.actor_role_pages.some(page=>page.strict!==true)||row.image_pages?.length!==2||row.image_pages.some(page=>page.strict!==true)||row.pinned_candidates?.length!==1||row.pinned_candidates[0]?.url!=='https://halloweenmovies.com/wp-content/uploads/2020/06/690233820.0-1080x720.jpg')throw new Error('UC-154 discovery denominator drift');
          if(row.selection_contract?.exact_completed_michael_myers_character_still_required!==true||row.selection_contract?.tyler_mane_performance_required!==true||row.selection_contract?.halloween_2007_first_film_required!==true||row.selection_contract?.official_franchise_image_custody_required!==true||row.selection_contract?.halloween_ii_2009_substitute_forbidden!==true||row.selection_contract?.actor_role_and_frame_custody_must_be_separate!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-154 selection contract drift');
          if(!specimen||specimen.actor!=='Tyler Mane'||specimen.character!=='Michael Myers'||specimen.production!=='Halloween (2007)'||specimen.years!=='2007–2009'||specimen.still||specimen.portrait?.src!=='images/uc-154-portrait.jpg')throw new Error('UC-154 specimen boundary drift');
          if(source?.still)throw new Error('UC-154 source-ledger still boundary drift');
          if(!audit||audit.wall_id!=='UC-154'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-154 audit boundary drift');
          console.log('PASS — exact UC-154 Tyler Mane Halloween 2007 first-film discovery authorized');
          NODE
      - name: Gather official first-film still candidates and actor-role custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-154-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-154-discover.mjs
          node scripts/card-backfill-uc-154-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-154-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, first-film candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-154-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-154-discover
            ${{ runner.temp }}/card-backfill-uc-154-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
