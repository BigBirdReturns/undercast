name: star-trek-henoch-stage-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-henoch-stage-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-henoch-stage-recovery-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 28ea3efc9f71d6207794d45cc654af765b36c63e
  EXPECTED_TREE: 52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c
  LIVE_MAIN: 28ea3efc9f71d6207794d45cc654af765b36c63e
  LIVE_TREE: 52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c
  LIVE_PARENT: 4a2f98c4dc2039f596857cfdff01e701acbd2e4d
  LIVE_MESSAGE: "Star Trek: publish Risik cycle"
  CLAIM_BRANCH: agent/star-trek-henoch-claim-result-v1
  CLAIM_COMMIT: d1039f1e3cb263d7be47b63cba05eca9f0cf24b8
  CLAIM_TREE: affc7614a284b8b8acfdeb8b14871fdd135a6f46
  CLAIM_RECEIPT_SHA: 3f86f82e287de56e401dd754b846fab4e0d60618931e24e129885e689fc44b05
  SOURCE_REVIEW_BRANCH: agent/star-trek-henoch-source-review-result-v1
  SOURCE_REVIEW_COMMIT: 2cd2eed247100333ade4d57970b101e21a221dd2
  SOURCE_REVIEW_TREE: 9e856251cc3e52d0c46869883f09e2313bdbac71
  SOURCE_REVIEW_SHA: 3439ccbfa7f4bab3ff6b543f935a9e0847033fbf3e789a6a521b2aa62fdf0876
  SOURCE_REVIEW_PATH: transport/star-trek-henoch-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-henoch-media-result-v1
  MEDIA_COMMIT: 9df7b9fd1f037bf371b4dec4fdd078abfbf3fc01
  MEDIA_TREE: 2cc003961a661d79424c5df6efb4878981a4fd30
  MEDIA_PREFIX: transport/star-trek-henoch-media-v1
  MEDIA_RECEIPT_SHA: 9f5700b00cd63355fff4aa0a4575f65f9309b6d7a142c3025af3766e1f3140e2
  MEDIA_REVIEW_BRANCH: agent/star-trek-henoch-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 9cc98185a6ba2696c2cbebb93398b10a67666925
  MEDIA_REVIEW_TREE: 0cf747c8500ea716647979c92c2ccaf70492239c
  MEDIA_REVIEW_SHA: 4fb578a66056a9206a3a24f30f0f45ff60926efe95ac842c6f156537f3683e2f
  MEDIA_REVIEW_PATH: transport/star-trek-henoch-media-review-v1/media-review.json
  TASK_ID: ap_3d10b7a97efdbdd11c50bc2a
  EXPECTED_PERFORMER: Leonard Nimoy
  EXPECTED_CHARACTER: Henoch
  EXPECTED_FINGERPRINT: 53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839
  EXPECTED_LEASE: lease_7495c4d823c439f1ae201c13
  WALL_ID: UC-1400
  EXPECTED_STILL_SHA: edbea99891daa786d65e3953ae591784f84b35593bab9420841addd81f57bbd6
  EXPECTED_PORTRAIT_SHA: 218703a31a24aa234d4a43da44c911b138acf4ca31897a8a6b3a029d7dc7dddf
  STILL_ITEM_ID: ma_eafe8a72e74325fb6632c097
  PORTRAIT_ITEM_ID: ma_afc31673cac70a0a8bb440ca
  CANDIDATE_BRANCH: agent/star-trek-henoch-candidate-v1
  RESULT_BRANCH: agent/star-trek-henoch-stage-result-v2
  PAYLOAD_PATH: .github/recovery/star-trek-henoch-stage-recovery-v2/runtime.tar.gz.b64
  PAYLOAD_SHA256: 05afaebd6d6bbe04e14a8b39fecb9a82ba83f313d7bc3b9bf995eb77d3483217
  PAYLOAD_ROOT: /tmp/star-trek-henoch-stage-v2-runtime
  LIFECYCLE: /tmp/star-trek-henoch-stage-v2.py
  BATCH: /tmp/star-trek-henoch-stage-v2-batch.json
  CENSUS_HELPER: /tmp/star-trek-henoch-stage-v2-census.sh
  STEPS_ROOT: /tmp/star-trek-henoch-stage-v2-steps
  SOURCE_REVIEW_ROOT: /tmp/star-trek-henoch-stage-v2/source-review
  MEDIA_ROOT: /tmp/star-trek-henoch-stage-v2/media
  MEDIA_REVIEW_ROOT: /tmp/star-trek-henoch-stage-v2/media-review
  OUT: /tmp/star-trek-henoch-stage-v2/output
  CENSUS_MAX_ATTEMPTS: 3
  CENSUS_RETRY_DELAY_SECONDS: 12

jobs:
  stage:
    name: stage-reviewed-henoch-candidate-v2
    if: ${{ github.event.head_commit.message == 'Stage reviewed Star Trek Henoch candidate v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify and externalize the recovered runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PAYLOAD_ROOT" "$STEPS_ROOT"
          mkdir -p "$PAYLOAD_ROOT" "$STEPS_ROOT"
          tr -d '\n' < "$PAYLOAD_PATH" | base64 -d > /tmp/star-trek-henoch-stage-v2-runtime.tar.gz
          test "$(sha256sum /tmp/star-trek-henoch-stage-v2-runtime.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/star-trek-henoch-stage-v2-runtime.tar.gz -C "$PAYLOAD_ROOT"
          (cd "$PAYLOAD_ROOT" && sha256sum -c payload-manifest.sha256)
          cp "$PAYLOAD_ROOT/candidate-lifecycle.py" "$LIFECYCLE"
          cp "$PAYLOAD_ROOT/batch.json" "$BATCH"
          cp "$PAYLOAD_ROOT/census-refresh.sh" "$CENSUS_HELPER"
          cp "$PAYLOAD_ROOT/steps"/[0-9][0-9].sh "$STEPS_ROOT"/
          chmod +x "$LIFECYCLE" "$CENSUS_HELPER" "$STEPS_ROOT"/[0-9][0-9].sh
          python3 -m py_compile "$LIFECYCLE"; rm -rf /tmp/__pycache__
          bash -n "$CENSUS_HELPER"; for script in "$STEPS_ROOT"/[0-9][0-9].sh; do bash -n "$script"; done
      - name: Trace immutable inputs and check out the exact claim
        shell: bash
        run: bash "$STEPS_ROOT/01.sh"
      - name: Submit, grow, and bind the reviewed media
        shell: bash
        run: bash "$STEPS_ROOT/02.sh"
      - name: Resolve media, refresh projections, and complete Henoch
        shell: bash
        run: bash "$STEPS_ROOT/03.sh"
      - name: Qualify the exact candidate
        shell: bash
        run: bash "$STEPS_ROOT/04.sh" && bash "$STEPS_ROOT/05.sh"
      - name: Upload Henoch stage evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-stage-recovery-v2
          path: /tmp/star-trek-henoch-stage-v2/
          if-no-files-found: error
          retention-days: 30
      - name: Publish candidate and immutable stage locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          candidate_commit="$(cat "$OUT/candidate-commit.txt")"; candidate_tree="$(cat "$OUT/candidate-tree.txt")"
          test "$(git rev-parse HEAD)" = "$candidate_commit"; test "$(git show -s --format=%T HEAD)" = "$candidate_tree"; test "$(git show -s --format=%P HEAD)" = "$CLAIM_COMMIT"
          test -z "$(git ls-remote --heads origin "refs/heads/${CANDIDATE_BRANCH}")"; test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"; test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIVE_MAIN"
          jq --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '.artifact={id:$id,digest:$digest}' "$OUT/candidate-commit.json" > "$OUT/candidate-commit.tmp"; mv "$OUT/candidate-commit.tmp" "$OUT/candidate-commit.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git push origin "$candidate_commit:refs/heads/${CANDIDATE_BRANCH}"
          publication=/tmp/star-trek-henoch-stage-v2-publication; index=/tmp/star-trek-henoch-stage-v2.index; rm -rf "$publication" "$index"; mkdir -p "$publication/transport/star-trek-henoch-stage-v2"; cp -a "$OUT"/. "$publication/transport/star-trek-henoch-stage-v2/"
          GIT_INDEX_FILE="$index" git read-tree --empty; GIT_INDEX_FILE="$index" git --work-tree="$publication" add -A; result_tree="$(GIT_INDEX_FILE="$index" git write-tree)"; result_commit="$(printf '%s\n' 'Record staged Star Trek Henoch candidate v2' | git -c user.name=undercast-henoch-stage-v2 -c user.email=undercast-henoch-stage-v2@users.noreply.github.com commit-tree "$result_tree")"
          test -z "$(git show -s --format=%P "$result_commit")"; git push origin "$result_commit:refs/heads/${RESULT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')" = "$candidate_commit"; test "$(git ls-remote origin "refs/heads/${RESULT_BRANCH}" | awk '{print $1}')" = "$result_commit"; test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$LIVE_MAIN"
