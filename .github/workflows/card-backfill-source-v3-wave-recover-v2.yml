name: card-backfill-source-v3-wave-recover-v2

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/card-backfill/WAVE-RECOVERY-V2.json'

permissions:
  contents: write
  actions: read
  models: read
  statuses: write

concurrency:
  group: card-backfill-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_run_id: ${{ steps.request.outputs.source_run_id }}
      source_head: ${{ steps.request.outputs.source_head }}
      mutation_head: ${{ steps.head.outputs.mutation_head }}
      matrix: ${{ steps.request.outputs.matrix }}
      wave_sha256: ${{ steps.request.outputs.wave_sha256 }}
      selected_count: ${{ steps.request.outputs.selected_count }}
      wave_batches: ${{ steps.request.outputs.wave_batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - id: head
        name: Bind the recovery mutation head
        run: echo "mutation_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove inherited lessons before artifact reuse
        run: |
          set -euo pipefail
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-source-policy-v2-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate \
            --out "$RUNNER_TEMP/lessons-validation.json"

      - id: request
        name: Download and validate the immutable source-wave plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          request='.github/card-backfill/WAVE-RECOVERY-V2.json'
          source_run_id=$(node -e "const p=require('./${request}');process.stdout.write(String(p.source_run_id))")
          source_head=$(node -e "const p=require('./${request}');process.stdout.write(String(p.source_head))")
          [[ "$source_run_id" =~ ^[0-9]+$ ]]
          [[ "$source_head" =~ ^[0-9a-f]{40}$ ]]
          plan="$RUNNER_TEMP/source-plan"
          mkdir -p "$plan"
          gh run download "$source_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "card-backfill-source-v3-wave-plan-${source_run_id}" \
            --dir "$plan"
          test -f "$plan/wave.json"
          test -f "$plan/assemble-matrix.json"
          node --input-type=module - "$plan/wave.json" "$plan/assemble-matrix.json" "$source_run_id" "$source_head" <<'NODE'
          import fs from 'node:fs';
          const [wavePath,matrixPath,runId,sourceHead]=process.argv.slice(2);
          const wave=JSON.parse(fs.readFileSync(wavePath,'utf8'));
          const matrix=JSON.parse(fs.readFileSync(matrixPath,'utf8'));
          if(wave.wave_batches!==4||wave.selected_count!==160)throw new Error(`expected proven 4x40 wave, got ${wave.wave_batches}x${wave.selected_count}`);
          if(!Array.isArray(matrix.include)||matrix.include.length!==4)throw new Error('recovery matrix cardinality drift');
          if(new Set(matrix.include.map(row=>row.batch_sha256)).size!==4)throw new Error('recovery matrix duplicate batch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `source_run_id=${runId}\nsource_head=${sourceHead}\nmatrix=${JSON.stringify(matrix)}\nwave_sha256=${wave.wave_sha256}\nselected_count=${wave.selected_count}\nwave_batches=${wave.wave_batches}\n`);
          NODE
          cp "$RUNNER_TEMP/lessons-validation.json" "$plan/lessons-recovery-validation.json"
          echo "PASS — recovery source run $source_run_id bound to $source_head"
          echo 'REDISCOVERY — forbidden'

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-wave-recovery-v2-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/source-plan
          if-no-files-found: error
          retention-days: 90

  adjudicate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-wave-recovery-v2-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - name: Reuse the retained packetized batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          BATCH_SHA: ${{ matrix.batch_sha256 }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original-$BATCH_SHA"
          mkdir -p "$original"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "card-backfill-source-v3-wave-result-${BATCH_SHA}-${SOURCE_RUN_ID}" \
            --dir "$original"
          test -f "$original/packets/batch-result.json"
          test -d "$original/packets/packets"
          echo 'PASS — packetized artifact recovered; discovery calls=0'

      - name: Run the independent second desk against retained bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
          BATCH_SHA: ${{ matrix.batch_sha256 }}
          BATCH_INDEX: ${{ matrix.batch_index }}
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/original-$BATCH_SHA"
          final="$RUNNER_TEMP/recovered-$BATCH_SHA"
          mkdir -p "$final"
          cp -a "$original/packets" "$final/packets"
          node scripts/card-backfill-machine-adjudicate.mjs \
            --candidates "$final/packets" \
            --out "$final/machine-decisions.json" \
            --model 'openai/gpt-4.1-mini' \
            --fallback-model 'openai/gpt-4o-mini' \
            --max-parallel 2 \
            --cycle 1 \
            --artifact-name "card-backfill-wave-recovery-v2-${GITHUB_RUN_ID}-${BATCH_SHA}" \
            --head-sha "$SOURCE_HEAD" | tee "$final/machine-adjudicate.log"
          node scripts/card-backfill-cohort-adjudicate.mjs \
            --candidates "$final/packets" \
            --decisions "$final/machine-decisions.json" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$final/adjudicated" \
            --source-run-id "$GITHUB_RUN_ID" | tee "$final/adjudicate.log"
          node --input-type=module - "$final" "$RUNNER_TEMP/planning/wave.json" "$SOURCE_HEAD" "$SOURCE_RUN_ID" "$BATCH_SHA" "$BATCH_INDEX" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const [final,wavePath,sourceHead,sourceRunId,batchSha,batchIndex]=process.argv.slice(2);
          const wave=JSON.parse(fs.readFileSync(wavePath,'utf8'));
          const receipt=JSON.parse(fs.readFileSync(path.join(final,'adjudicated','adjudication-run-receipt.json'),'utf8'));
          if(receipt.batch_sha256!==batchSha)throw new Error('recovered batch digest drift');
          const result={version:1,lane:'card-backfill-source-v3-wave-result',source_head:sourceHead,
            source_workflow_run_id:Number(sourceRunId),recovery_workflow_run_id:Number(process.env.GITHUB_RUN_ID),
            wave_sha256:wave.wave_sha256,batch_sha256:batchSha,batch_index:Number(batchIndex),
            source_policy_id:wave.source_policy_id,source_policy_version:wave.source_policy_version,
            source_policy_revision:wave.source_policy_revision,lessons_contract_sha256:wave.lessons_contract_sha256,
            selected_count:receipt.counts.selected,counts:receipt.counts,adjudicated_path:'adjudicated',
            machine_decisions_path:'machine-decisions.json',artifact_only:true,rediscovery:false,canonical_mutation:false};
          fs.writeFileSync(path.join(final,'wave-result.json'),JSON.stringify(result,null,2)+'\n');
          NODE
          echo 'PASS — retained batch independently adjudicated; rediscovery=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-wave-recovery-v2-result-${{ matrix.batch_sha256 }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovered-${{ matrix.batch_sha256 }}
          if-no-files-found: error
          retention-days: 90

  reduce:
    needs: [plan, adjudicate]
    if: needs.adjudicate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.mutation_head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: card-backfill-wave-recovery-v2-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/planning

      - uses: actions/download-artifact@v4
        with:
          pattern: card-backfill-wave-recovery-v2-result-*-${{ github.run_id }}
          path: ${{ runner.temp }}/results
          merge-multiple: false

      - name: Reduce retained results once and repair future waves
        env:
          SOURCE_HEAD: ${{ needs.plan.outputs.source_head }}
          MUTATION_HEAD: ${{ needs.plan.outputs.mutation_head }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source_run_id }}
        run: |
          set -euo pipefail
          temporary='scripts/.card-backfill-wave-reduce-recovery.mjs'
          cp scripts/card-backfill-wave-reduce.mjs "$temporary"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/.card-backfill-wave-reduce-recovery.mjs')
          text=p.read_text()
          old='  const observedHead = option("--observed-head", sourceHead);'
          new='  const mutationHead = option("--mutation-head", sourceHead);\n  const observedHead = option("--observed-head", mutationHead);'
          if old not in text: raise SystemExit('recovery observed-head seam drift')
          text=text.replace(old,new,1)
          old='  if (observedHead !== sourceHead) throw new Error(`refusing stale wave reduction: source_head ${sourceHead} differs from observed head ${observedHead}`);'
          new='  if (!mutationHead || !/^[0-9a-f]{40}$/i.test(mutationHead)) throw new Error("mutation_head must be a full commit SHA");\n  if (observedHead !== mutationHead) throw new Error(`refusing stale wave reduction: mutation_head ${mutationHead} differs from observed head ${observedHead}`);'
          if old not in text: raise SystemExit('recovery stale-head seam drift')
          p.write_text(text.replace(old,new,1))

          workflow=Path('.github/workflows/card-backfill-source-v2-autonomous.yml')
          text=workflow.read_text()
          dollar='$'
          model="          MODEL: "+dollar+"{{ inputs.model || 'openai/gpt-4.1-mini' }}"
          token="          GITHUB_TOKEN: "+dollar+"{{ secrets.GITHUB_TOKEN }}"
          if token not in text:
              if model not in text: raise SystemExit('future-wave token seam drift')
              workflow.write_text(text.replace(model,token+'\n'+model,1))
          PY
          observed_head=$(git rev-parse HEAD)
          node "$temporary" \
            --wave "$RUNNER_TEMP/planning/wave.json" \
            --results-root "$RUNNER_TEMP/results" \
            --staging-root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --adjudications-root .github/card-backfill/adjudications \
            --wave-receipt-root .github/card-backfill/waves \
            --source-head "$SOURCE_HEAD" \
            --mutation-head "$MUTATION_HEAD" \
            --observed-head "$observed_head" | tee "$RUNNER_TEMP/recovery-reduce.log"
          rm "$temporary"
          node scripts/card-backfill-staging.mjs validate \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill
          mkdir -p .github/card-backfill/recoveries
          node --input-type=module - "$RUNNER_TEMP/planning/wave.json" <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import crypto from 'node:crypto';
          const wave=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const receipt={version:1,lane:'card-backfill-wave-artifact-recovery',source_workflow_run_id:Number(process.env.SOURCE_RUN_ID),
            recovery_workflow_run_id:Number(process.env.GITHUB_RUN_ID),source_head:process.env.SOURCE_HEAD,
            mutation_head:process.env.MUTATION_HEAD,wave_sha256:wave.wave_sha256,selected_count:wave.selected_count,
            wave_batches:wave.wave_batches,rediscovery:false,source_transport_calls:0,
            recovered_from_packetized_artifacts:true,canonical_mutation:false};
          receipt.recovery_sha256=crypto.createHash('sha256').update(JSON.stringify(receipt)).digest('hex');
          fs.writeFileSync(path.join('.github/card-backfill/recoveries',`${wave.wave_sha256}.json`),JSON.stringify(receipt,null,2)+'\n');
          NODE

      - name: Commit one recovery transaction
        env:
          MUTATION_HEAD: ${{ needs.plan.outputs.mutation_head }}
          SELECTED_COUNT: ${{ needs.plan.outputs.selected_count }}
          WAVE_BATCHES: ${{ needs.plan.outputs.wave_batches }}
        run: |
          set -euo pipefail
          git add -A -- \
            .github/workflows/card-backfill-source-v2-autonomous.yml \
            .github/card-backfill/adjudications \
            .github/card-backfill/waves \
            .github/card-backfill/recoveries \
            data/review/card-backfill-staging
          git diff --cached --check
          git config user.name 'undercast-card-backfill-wave-recovery-v2'
          git config user.email 'undercast-card-backfill-wave-recovery-v2@users.noreply.github.com'
          git commit -m "Card backfill: recover ${WAVE_BATCHES} retained batches (${SELECTED_COUNT} obligations)"
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          if [ "$remote_head" != "$MUTATION_HEAD" ]; then
            echo "branch moved from recovery head $MUTATION_HEAD to $remote_head; refusing stale push"
            exit 1
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo 'PASS — 160 obligations reduced through one branch mutation; rediscovery=0'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-wave-recovery-v2-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/planning
            ${{ runner.temp }}/recovery-reduce.log
          if-no-files-found: warn
          retention-days: 90
