name: card-backfill-two-packet-record-breaker

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/card-backfill-publication.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-two-packet-record-breaker
  cancel-in-progress: false

env:
  SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  publish-two:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-041'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install the complete repository-gate runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          command="$1"
          case "$command" in
            identify|montage)
              shift
              exec "$command" "$@"
              ;;
            *)
              exec convert "$@"
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium

      - name: Install the exact two-packet publication policy and restore durable workflows
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/record-breaker-policy"
          mkdir -p "$root"
          cat > "$root/policy.b64" <<'B64'
          [... truncated for brevity ...]
          B64
          printf '%s  %s\n' '40c919ca5987bb7fd718c72d6bda9f6589e742abe66d4e7ffb67ecb129f37d49' "$root/policy.b64" | sha256sum -c -
          base64 --decode "$root/policy.b64" > "$root/policy.tar.gz"
          printf '%s  %s\n' 'c7c7e632ebc6275901c6e142a63d9dc84e221fd387079eae2ebff93ced0aa4af' "$root/policy.tar.gz" | sha256sum -c -
          tar -xzf "$root/policy.tar.gz" -C "$GITHUB_WORKSPACE"
          git show 7c8499c3a147f70c91668f235c2d068ba5f6f077:.github/workflows/card-backfill-cohort.yml > .github/workflows/card-backfill-cohort.yml
          rm -f .github/workflows/apply-card-backfill-staging-reset.yml

      - name: Download the exact candidate artifact and independently adjudicate both accepted packets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          decision=.github/card-backfill/adjudications/30514452128.json
          run_id=30514452128
          artifact_id=8748379478
          artifact_name=card-backfill-cohort-30514452128
          artifact_root="$RUNNER_TEMP/source-artifact"
          adjudicated="$RUNNER_TEMP/adjudicated"
          metadata="$RUNNER_TEMP/artifact.json"
          mkdir -p "$artifact_root"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
          node --input-type=module - "$decision" "$metadata" <<'NODE'
          import fs from 'node:fs';
          const decision=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const artifact=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(artifact.id!==decision.source.artifact_id||artifact.name!==decision.source.artifact_name)throw new Error('artifact identity mismatch');
          if(artifact.expired)throw new Error('source artifact expired');
          if(artifact.workflow_run?.id!==decision.source.workflow_run_id||artifact.workflow_run?.head_sha!==decision.source.head_sha)throw new Error('artifact workflow custody mismatch');
          if(decision.source.artifact_digest&&artifact.digest!==decision.source.artifact_digest)throw new Error('artifact digest mismatch');
          console.log('PASS — exact run, head, name, and digest custody');
          NODE
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$artifact_root"
          node scripts/card-backfill-cohort-adjudicate.mjs \
            --candidates "$artifact_root/final/packets" \
            --decisions "$decision" \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$adjudicated" \
            --source-run-id "$run_id" \
            --now 2026-07-30T07:20:00.000Z
          node scripts/card-backfill-staging.mjs stage \
            --input "$adjudicated" \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --now 2026-07-30T07:20:30.000Z

      - name: Materialize the exact two-packet permanent batch
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/publication-plan"
          node scripts/card-backfill-staging.mjs validate \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill
          node scripts/card-backfill-staging.mjs plan \
            --root data/review/card-backfill-staging \
            --permanent-root data/review/card-backfill \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$plan" \
            --require-ready \
            --now 2026-07-30T07:21:00.000Z
          node scripts/card-backfill-cohort-materialize.mjs \
            --plan "$plan/publication-plan.json" \
            --staging data/review/card-backfill-staging \
            --destination data/review/card-backfill \
            --now 2026-07-30T07:21:00.000Z
          test -f data/review/card-backfill/UC-518/manifest.json
          test -f data/review/card-backfill/UC-526/manifest.json
          test -f data/review/card-backfill/batches/33eb48048725e92583cac97cfd394ba1fef964244f82a5159fe388fd89045ec9.json

      - name: Prove the denominator moved 40 to 42 before the full gate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/post-publication-plan"
          node scripts/card-backfill-cohort.mjs plan \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$out" \
            --limit 40
          grep -qx 'current_completed_evidence_packets=42' "$out/summary.txt"
          grep -qx 'current_open_source_declared_absences=430' "$out/summary.txt"
          grep -qx 'selector_defined_estate=472' "$out/summary.txt"
          echo 'PASS — permanent selector count is 42 completed / 430 open / 472 total'

      - name: Stage the exact transaction and run the complete repository gate once
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          npm run gate 2>&1 | tee "$RUNNER_TEMP/record-breaker-gate.log"

      - name: Refuse any path outside the record-breaking transaction
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          const paths=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const exact=new Set([
            '.github/CARD-BACKFILL-COHORT.json',
            '.github/workflows/apply-card-backfill-staging-reset.yml',
            '.github/workflows/card-backfill-cohort.yml',
            '.github/workflows/card-backfill-publication.yml',
            'docs/CARD-BACKFILL-COHORTS.md',
            'scripts/card-backfill-cohort.mjs',
            'scripts/card-backfill-staging-fixtures.mjs',
            'scripts/lib/card-backfill-staging.mjs',
          ]);
          for(const path of paths){
            if(exact.has(path))continue;
            if(path.startsWith('data/review/card-backfill/UC-518/'))continue;
            if(path.startsWith('data/review/card-backfill/UC-526/'))continue;
            if(path.startsWith('data/review/card-backfill/batches/'))continue;
            if(path.startsWith('data/review/card-backfill-staging/'))continue;
            throw new Error(`record-breaking transaction escaped its evidence/policy boundary: ${path}`);
          }
          if(!paths.some(path=>path.startsWith('data/review/card-backfill/UC-518/'))||!paths.some(path=>path.startsWith('data/review/card-backfill/UC-526/')))throw new Error('both permanent packet directories are required');
          console.log(`PASS — exact ${paths.length}-path evidence/policy transaction`);
          NODE

      - name: Commit and push two permanent evidence packets
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill-publication'
          git config user.email 'undercast-card-backfill-publication@users.noreply.github.com'
          git commit -m 'Card backfill: publish 2 permanent evidence packets'
          remote_head=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')
          test "$remote_head" = "$SOURCE_HEAD"
          git push origin "HEAD:$SOURCE_BRANCH"
