name: card-backfill-uc-118-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-118-APPLY.json"
      - "scripts/card-backfill-uc-118-apply.mjs"
      - ".github/workflows/card-backfill-uc-118-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-118-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-028'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-028
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-118 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-118-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-118');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-118');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0a3724582c82ea7595990893');
          if(row.version!==1||row.record_id!=='UC-118'||row.actor!=='Frank Oz'||row.character!=='Yoda, Miss Piggy & Fozzie'||row.production!=='The Muppets / Star Wars'||row.year!==1976||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-118 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8699653866||row.render_artifact?.head_sha!=='b4bfaff1e2e359d1052768f0c945150556079851'||row.render_artifact?.zip_sha256!=='73e0692f861388e98f6323edc97fdc152b89cf07bfa5ec95d20414aaecbb1b8d')throw new Error('UC-118 render custody drift');
          if(row.expected?.yoda_source?.sha256!=='012fee2874de6332328482180d44a9c036eb8d08c775b95d03ecbd0da2597a14'||row.expected?.miss_piggy_source?.sha256!=='a06f34dadc6603e75df707365d12baf7b71e6fbcd1c6240ee721e96baaf377e4'||row.expected?.fozzie_source?.sha256!=='4ad410148153720798a5007f6f0ba45cb31398944bf22364cc884aaffd1621b9')throw new Error('UC-118 source authorization drift');
          if(row.expected?.exact_role_record?.sha256!=='534c839d4e0500a3aa519c24f85ae91182c0bf5aa7223f4be8c0fffe894ee590'||row.expected?.candidate?.sha256!=='ee2ac06aeefd2543e94b9d774e848d662e9b0f3cfae8d3a3f1740d5e7d48209e'||row.expected?.crop_preview?.sha256!=='2158e4666ff5c8405b6c7e740ace972f046f01037fd74984cb65b43a381bb56b')throw new Error('UC-118 candidate or role authorization drift');
          if(row.expected?.packet_file_count!==16||row.expected?.duplicate_item_count!==5||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==3||row.expected?.discovery_candidate_count!==35)throw new Error('UC-118 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='three-role-character-composite'||row.ruling?.crop_ruling!=='pass-landscape-top-two-panel-bottom-layout'||row.ruling?.chronology_ruling!=='pass-1976-muppet-chronology-separated-from-yoda-performance'||row.ruling?.canonical_mutation!==false)throw new Error('UC-118 ruling drift');
          if(!specimen||specimen.actor!=='Frank Oz'||specimen.character!=='Yoda, Miss Piggy & Fozzie'||specimen.production!=='The Muppets / Star Wars'||specimen.years!=='1976'||specimen.still)throw new Error('UC-118 specimen boundary drift');
          if(source?.still)throw new Error('UC-118 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-118'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-118 audit boundary drift');
          console.log(`PASS — UC-118 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8699653866/zip" > "$root/render.zip"
          echo "73e0692f861388e98f6323edc97fdc152b89cf07bfa5ec95d20414aaecbb1b8d  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-118"
          test -f "$base/manifest.json"
          echo "07c991009eb6f57de9472e88fb8244d21a7743c34b9c76965c3441c30f3011ed  $base/manifest.json" | sha256sum -c -
          echo "29a652b96b669b69211aeae6b55ed365b1ec0c3234c57d8af9d723f3ce1729be  $base/duplicate-scan.json" | sha256sum -c -
          echo "cd09873d78724acb7ce36c0481463b33c1c102ff3b5d2d5f54131eeb8bff4c47  $base/review.json" | sha256sum -c -
          echo "082bc32a740788542821401e296db3fa0c7d9885a5f8ad72e63790f683805ca4  $base/review.md" | sha256sum -c -
          echo "92f08188eafc0e5dcde91bb4de47ff70f49b54d7fffb4fdba7a7a7eac0445c10  $base/SHA256SUMS" | sha256sum -c -
          echo "534c839d4e0500a3aa519c24f85ae91182c0bf5aa7223f4be8c0fffe894ee590  $base/exact-role-record.json" | sha256sum -c -
          echo "012fee2874de6332328482180d44a9c036eb8d08c775b95d03ecbd0da2597a14  $base/yoda-original.jpg" | sha256sum -c -
          echo "a06f34dadc6603e75df707365d12baf7b71e6fbcd1c6240ee721e96baaf377e4  $base/miss-piggy-original.jpg" | sha256sum -c -
          echo "4ad410148153720798a5007f6f0ba45cb31398944bf22364cc884aaffd1621b9  $base/fozzie-original.jpg" | sha256sum -c -
          echo "02012b9364aacb1d683da33d5022bdcc806582fe8a3694ef06952bf97cf7b485  $base/source-page-starwars-frank-oz-yoda.png" | sha256sum -c -
          echo "2695cf7690ddf9ed0280c9b0f62270c8e05c7f7cacd5a28ece153fc4cf75743b  $base/source-page-henson-founders-frank-oz-muppets.png" | sha256sum -c -
          echo "a6cad04288f1ae27e67c53c8bc213900e2a05093f6553b6b27775bf0946df575  $base/source-page-starwars-size-matters-not.png" | sha256sum -c -
          echo "9269a052fb63ee787a757d6ad945aa435dd9838cbdd090c641b62e1e1d31cdaa  $base/source-page-henson-miss-piggy-pool.png" | sha256sum -c -
          echo "cff9a8f9e63732f0cf3c6f8bd11e3e653eb4335077e77646d0e76e171bfac438  $base/source-page-henson-fozzie-behind-camera.png" | sha256sum -c -
          echo "ee2ac06aeefd2543e94b9d774e848d662e9b0f3cfae8d3a3f1740d5e7d48209e  $base/uc-118-still-candidate.jpg" | sha256sum -c -
          echo "2158e4666ff5c8405b6c7e740ace972f046f01037fd74984cb65b43a381bb56b  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30387738650
          artifact_id=8699653866
          artifact_name=card-backfill-uc-118-render-30387738650
          artifact_zip_sha256=73e0692f861388e98f6323edc97fdc152b89cf07bfa5ec95d20414aaecbb1b8d
          artifact_head_sha=b4bfaff1e2e359d1052768f0c945150556079851
          source_manifest_sha256=07c991009eb6f57de9472e88fb8244d21a7743c34b9c76965c3441c30f3011ed
          source_sums_sha256=92f08188eafc0e5dcde91bb4de47ff70f49b54d7fffb4fdba7a7a7eac0445c10
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-118-apply/source/output/UC-118
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-apply"
          node --check scripts/card-backfill-uc-118-apply.mjs
          node scripts/card-backfill-uc-118-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-118-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-118');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-118');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_0a3724582c82ea7595990893');
          if(!specimen||specimen.still)throw new Error('UC-118 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-118 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-118'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-118 audit disposition was canonically mutated');
          console.log('PASS — UC-118 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-118.json \
            .github/CARD-BACKFILL-UC-118-DISCOVER.json \
            .github/CARD-BACKFILL-UC-118-RENDER.json \
            .github/CARD-BACKFILL-UC-118-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-118-scope.yml \
            .github/workflows/card-backfill-uc-118-discover.yml \
            .github/workflows/card-backfill-uc-118-render.yml \
            .github/workflows/card-backfill-uc-118-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-118-scope.mjs \
            scripts/card-backfill-uc-118-discover.mjs \
            scripts/card-backfill-uc-118-render.mjs \
            scripts/card-backfill-uc-118-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-118 Frank Oz three-role still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-027
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-027 HEAD)
          test "${#changed[@]}" -eq 16
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-118/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-028
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-118-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-118-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-118-apply
            data/review/card-backfill/UC-118
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
