name: doctor-who-cycle-010-merx-evidence-v1
"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-010-merx-evidence-v1.yml"]
permissions: {}
concurrency:
  group: doctor-who-cycle-010-merx-evidence-v1
  cancel-in-progress: true
jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-evidence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {contents: read, actions: read, pull-requests: read}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-merx-evidence-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-evidence-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-evidence-v1
      MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      PREFLIGHT_PR: "710"
      PREFLIGHT_HEAD: 27f7ba406d24a755cc28bd5d211336bb9b984df0
      PREFLIGHT_RUN: "31287572617"
      PREFLIGHT_JOB: "93179083191"
      PREFLIGHT_ARTIFACT: "9030358001"
      PREFLIGHT_ZIP_SHA: bb37c586c51d8410304eb4f67689b2de23881dd791dce0f61c47212875bca194
      PREFLIGHT_ID: 107d6990ab5de7abdeb85daa630af979c8b6bb296932448aec23f13f6587500a
      TASK: ap_cab2d7f95d930401627c1b30
      PERFORMER: Dan Starkey
      ROLE: Merx
      SOURCE_URL: https://tardis.fandom.com/wiki/Merx
      SOURCE_PAGEID: "233175"
      SOURCE_REVISION: "3363140"
      SOURCE_TIMESTAMP: "2022-12-01T20:29:51Z"
      SOURCE_SHA: 5fa09f17e86ef5868e36d860119c14867a0766b0b8d6da6cf8a739fb85509e4c
      SOURCE_FP: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      OFFICIAL_RELEASE: https://www.bigfinish.com/releases/v/unit-encounters-1531
      OFFICIAL_BUNDLE: https://bigfinish.com/bundles/start/101/1531
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, filter: blob:none, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - name: Bind exact carrier and sealed cycle-010 preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,preflight,evidence,source,official,media,logs}
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PREFLIGHT_PR" > "$OUT/api/preflight-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" > "$OUT/api/preflight-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/jobs?per_page=100" > "$OUT/api/preflight-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN/artifacts?per_page=100" > "$OUT/api/preflight-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/preflight.zip"
          test "$(sha256sum "$OUT/preflight.zip" | cut -d' ' -f1)" = "$PREFLIGHT_ZIP_SHA"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          carrier=json.loads((r/'api/carrier.json').read_text()); pre_pr=json.loads((r/'api/preflight-pr.json').read_text())
          run=json.loads((r/'api/preflight-run.json').read_text()); jobs=json.loads((r/'api/preflight-jobs.json').read_text())['jobs']; arts=json.loads((r/'api/preflight-artifacts.json').read_text())['artifacts']
          assert carrier['number']==int(os.environ['PR']) and carrier['state']=='open' and carrier['draft'] and not carrier['merged']
          assert carrier['base']['sha']==os.environ['MAIN'] and carrier['head']['ref']==os.environ['BRANCH'] and carrier['head']['sha']==os.environ['HEAD']
          assert carrier['commits']==carrier['changed_files']==1
          assert pre_pr['number']==int(os.environ['PREFLIGHT_PR']) and pre_pr['state']=='closed' and not pre_pr['merged'] and pre_pr['head']['sha']==os.environ['PREFLIGHT_HEAD']
          assert run['id']==int(os.environ['PREFLIGHT_RUN']) and run['head_sha']==os.environ['PREFLIGHT_HEAD'] and run['status']=='completed' and run['conclusion']=='success'
          assert any(x['id']==int(os.environ['PREFLIGHT_JOB']) and x['name']=='preflight' and x['conclusion']=='success' for x in jobs)
          assert any(x['id']==int(os.environ['PREFLIGHT_ARTIFACT']) and not x['expired'] and x['digest']=='sha256:'+os.environ['PREFLIGHT_ZIP_SHA'] for x in arts)
          target=r/'preflight'
          with zipfile.ZipFile(r/'preflight.zip') as z:
            infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
            for info in infos:
              p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
              if not info.is_dir(): q=target/p; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(z.read(info))
          ledger=target/'SHA256SUMS.pre'; assert sha(ledger.read_bytes())==(target/'SHA256SUMS').read_text().split()[0]
          listed=[]
          for raw in ledger.read_text().splitlines():
            d,n=raw.split(None,1); p=target/n.lstrip('*'); assert p.is_file() and sha(p.read_bytes())==d; listed.append(n)
          actual=sorted(str(p.relative_to(target)) for p in target.rglob('*') if p.is_file() and p.name not in {'SHA256SUMS.pre','SHA256SUMS'})
          assert sorted(listed)==actual
          packet=json.loads((target/'receipt/preflight.json').read_text()); ident=packet.pop('identity')
          assert ident==os.environ['PREFLIGHT_ID'] and sha(json.dumps(packet,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==ident
          assert packet['canonical_main']==os.environ['MAIN'] and packet['selected']['task_id']==os.environ['TASK']
          assert packet['selected']['performer']==os.environ['PERFORMER'] and packet['selected']['character']==os.environ['ROLE']
          assert packet['selected']['source_fingerprint']==os.environ['SOURCE_FP'] and packet['lease_issued'] is False and packet['queue_mutated'] is False
          packet['identity']=ident
          (r/'evidence/preflight.bound.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'pr':int(os.environ['PREFLIGHT_PR']),'head':os.environ['PREFLIGHT_HEAD'],'run':int(os.environ['PREFLIGHT_RUN']),'job':int(os.environ['PREFLIGHT_JOB']),'artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'artifact_sha256':os.environ['PREFLIGHT_ZIP_SHA'],'identity':ident}
          (r/'evidence/preflight-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
      - name: Reconfirm current-main custody and repository gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"; test "$(git show -s --format=%T HEAD)" = "$TREE"
          npm ci; npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/evidence/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/evidence/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media.log"
          npm run gate 2>&1 | tee "$OUT/logs/gate.log"; grep -F 'gate: PASS' "$OUT/logs/gate.log" >/dev/null
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/evidence/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/evidence/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
      - name: Recover exact Merx revision and page-image census
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const env=process.env; const out=env.OUT; const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const api=new URL('/api.php',new URL(env.SOURCE_URL).origin);
          api.search=new URLSearchParams({action:'query',prop:'revisions',revids:env.SOURCE_REVISION,rvprop:'ids|timestamp|content',rvslots:'main',format:'json',formatversion:'2',origin:'*'}).toString();
          const response=await fetch(api,{headers:{'user-agent':'Undercast exact Merx evidence recovery/1.0'}});
          if(!response.ok) throw new Error(`revision fetch failed ${response.status}`);
          const raw=Buffer.from(await response.arrayBuffer()); fs.writeFileSync(`${out}/source/revision-response.json`,raw);
          const doc=JSON.parse(raw); const page=doc?.query?.pages?.[0]; const revision=page?.revisions?.[0];
          const content=revision?.slots?.main?.content ?? revision?.slots?.main?.['*'] ?? revision?.['*'];
          if(page?.pageid!==Number(env.SOURCE_PAGEID)||revision?.revid!==Number(env.SOURCE_REVISION)||revision?.timestamp!==env.SOURCE_TIMESTAMP||typeof content!=='string') throw new Error('revision identity drifted');
          const bytes=Buffer.from(content); if(sha(bytes)!==env.SOURCE_SHA) throw new Error('revision content SHA drifted');
          if(!/Dan Starkey/i.test(content)||!/The Sontaran Project/i.test(content)) throw new Error('revision no longer contains expected credit and appearance');
          fs.writeFileSync(`${out}/source/merx-revision.wikitext`,bytes);
          const imageMatch=content.match(/^\|\s*image\s*=\s*(.*)$/im); const fileRefs=[...content.matchAll(/\[\[(?:File|Image):([^\]|]+)/gi)].map(x=>x[1].trim());
          const metaApi=new URL('/api.php',new URL(env.SOURCE_URL).origin);
          metaApi.search=new URLSearchParams({action:'query',prop:'pageimages|images',titles:'Merx',piprop:'original|thumbnail|name',pithumbsize:'1400',imlimit:'max',format:'json',formatversion:'2',origin:'*'}).toString();
          const mres=await fetch(metaApi,{headers:{'user-agent':'Undercast exact Merx evidence recovery/1.0'}}); if(!mres.ok) throw new Error(`image census failed ${mres.status}`);
          const mraw=Buffer.from(await mres.arrayBuffer()); fs.writeFileSync(`${out}/source/page-image-response.json`,mraw); const mdoc=JSON.parse(mraw); const mpage=mdoc?.query?.pages?.[0]||{};
          const summary={source:env.SOURCE_URL,pageid:page.pageid,revision:revision.revid,timestamp:revision.timestamp,content_sha256:sha(bytes),bytes:bytes.length,credit:{performer:env.PERFORMER,role:env.ROLE,production:'The Sontaran Project',performance_mode:'voice'},image_field:imageMatch?imageMatch[1].trim():null,wikitext_file_references:fileRefs,pageimage_name:mpage.pageimage||null,pageimage_original:mpage.original||null,pageimage_thumbnail:mpage.thumbnail||null,api_images:(mpage.images||[]).map(x=>x.title),character_image_disposition:(!mpage.original&&!mpage.thumbnail&&fileRefs.length===0&&!(imageMatch&&imageMatch[1].trim()))?'source-page-image-absent':'candidate-requires-review'};
          fs.writeFileSync(`${out}/source/source-summary.json`,JSON.stringify(summary,null,2)+'\n');
          NODE
      - name: Recover official production page and cover candidate
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (compatible; Undercast evidence recovery/1.0; +https://github.com/BigBirdReturns/undercast)'
          : > "$OUT/official/route-attempts.tsv"
          success=''
          for entry in "release|$OFFICIAL_RELEASE" "bundle|$OFFICIAL_BUNDLE"; do
            name=${entry%%|*}; url=${entry#*|}; body="$OUT/official/$name.html"; headers="$OUT/official/$name.headers"; meta="$OUT/official/$name.meta"
            set +e
            code=$(curl -L --compressed --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A "$ua" -D "$headers" -o "$body" -w '%{http_code}' "$url")
            rc=$?
            set -e
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$url" "$rc" "$code" "$(test -f "$body" && wc -c < "$body" || echo 0)" >> "$OUT/official/route-attempts.tsv"
            printf 'name=%s\nurl=%s\ncurl_exit=%s\nhttp_status=%s\n' "$name" "$url" "$rc" "$code" > "$meta"
            if [ "$rc" -eq 0 ] && [[ "$code" =~ ^2 ]] && grep -qi 'Dan Starkey' "$body" && grep -qi 'Commander Merx' "$body"; then success="$name"; break; fi
          done
          test -n "$success"
          printf 'OFFICIAL_ROUTE=%s\n' "$success" >> "$GITHUB_ENV"
          ROOT="$OUT" ROUTE="$success" python3 - <<'PY'
          import html,json,os,re
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path(os.environ['ROOT']); route=os.environ['ROUTE']; body=(root/f'official/{route}.html').read_text(errors='replace')
          class Meta(HTMLParser):
            def __init__(self): super().__init__(); self.meta=[]; self.links=[]; self.title=''; self._title=False
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='meta': self.meta.append(a)
              if tag=='link': self.links.append(a)
              if tag=='title': self._title=True
            def handle_endtag(self,tag):
              if tag=='title': self._title=False
            def handle_data(self,data):
              if self._title: self.title+=data
          p=Meta(); p.feed(body)
          text=html.unescape(re.sub(r'<[^>]+>',' ',body)); text=' '.join(text.split())
          assert 'Dan Starkey' in text and 'Commander Merx' in text and 'UNIT' in text and 'Encounters' in text
          og=next((x.get('content') for x in p.meta if (x.get('property') or x.get('name','')).lower()=='og:image' and x.get('content')),None)
          canonical=next((x.get('href') for x in p.links if x.get('rel','').lower()=='canonical' and x.get('href')),None)
          assert og and og.startswith('http')
          summary={'route':route,'requested_url':os.environ['OFFICIAL_RELEASE'] if route=='release' else os.environ['OFFICIAL_BUNDLE'],'document_title':p.title.strip(),'canonical_url':canonical,'cover_url':og,'matched_credit':'Dan Starkey (Marshal Skar / Commander Merx / Sontaran Escapee)','production':'UNIT: Encounters','story':'The Sontaran Project','credit_verified':True}
          (root/'official/official-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as fh: fh.write(f'COVER_URL={og}\n')
          PY
          curl -L --compressed --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A "$ua" -D "$OUT/media/cover.headers" -o "$OUT/media/cover.bin" "$COVER_URL"
          test -s "$OUT/media/cover.bin"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          r=Path(os.environ['ROOT']); p=r/'media/cover.bin'; b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          def dims(d):
            if d.startswith(b'\x89PNG\r\n\x1a\n') and len(d)>=24: return struct.unpack('>II',d[16:24])
            if d[:3]==b'GIF' and len(d)>=10: return struct.unpack('<HH',d[6:10])
            if d[:2]==b'\xff\xd8':
              i=2
              while i+9<len(d):
                if d[i]!=0xff: i+=1; continue
                marker=d[i+1]; i+=2
                if marker in (0xd8,0xd9): continue
                if i+2>len(d): break
                n=int.from_bytes(d[i:i+2],'big')
                if marker in {0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf} and i+7<len(d): return (int.from_bytes(d[i+5:i+7],'big'),int.from_bytes(d[i+3:i+5],'big'))
                i+=max(n,2)
            if d[:4]==b'RIFF' and d[8:12]==b'WEBP':
              kind=d[12:16]
              if kind==b'VP8X' and len(d)>=30: return (1+int.from_bytes(d[24:27],'little'),1+int.from_bytes(d[27:30],'little'))
              if kind==b'VP8 ':
                j=d.find(b'\x9d\x01\x2a',20)
                if j>=0 and j+7<=len(d): return (int.from_bytes(d[j+3:j+5],'little')&0x3fff,int.from_bytes(d[j+5:j+7],'little')&0x3fff)
              if kind==b'VP8L' and len(d)>=25:
                bits=int.from_bytes(d[21:25],'little'); return ((bits&0x3fff)+1,((bits>>14)&0x3fff)+1)
            return (None,None)
          w,h=dims(b); mime='application/octet-stream'
          if b.startswith(b'\xff\xd8'): mime='image/jpeg'
          elif b.startswith(b'\x89PNG'): mime='image/png'
          elif b[:4]==b'RIFF' and b[8:12]==b'WEBP': mime='image/webp'
          elif b[:3]==b'GIF': mime='image/gif'
          assert mime.startswith('image/') and w and h
          official=json.loads((r/'official/official-summary.json').read_text())
          meta={'source_url':official['cover_url'],'sha256':sha,'bytes':len(b),'mime':mime,'width':w,'height':h,'classification':'official-publication-cover-candidate','adopted':False,'visual_review_required':True}
          (r/'media/cover-metadata.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n')
          PY
      - name: Inventory existing Dan Starkey portrait custody and seal evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          specimens=json.load(open('data/specimens.json')); sources=json.load(open('data/SOURCES.json')); state=json.load(open('data/AUTOPILOT.json')); journal=[json.loads(x) for x in Path('data/journal/autopilot.jsonl').read_text().splitlines() if x.strip()]
          source_by_id={x['id']:x for x in sources}; portraits=[]
          for card in specimens:
            if card.get('actor')!=os.environ['PERFORMER'] or not card.get('portrait'): continue
            row=card['portrait']; path=Path(row['src']); assert path.is_file(); data=path.read_bytes(); ledger=source_by_id.get(card['id'],{}).get('portrait')
            assert ledger and ledger.get('src')==row.get('src') and ledger.get('origin')==row.get('origin')
            portraits.append({'wall_id':card['id'],'character':card['character'],'src':row['src'],'origin':row.get('origin'),'author':row.get('author'),'license':row.get('license'),'focus':row.get('focus'),'sha256':sha(data),'bytes':len(data)})
          portraits.sort(key=lambda x:x['wall_id'])
          assert portraits and any(x['wall_id']=='UC-1354' and x['sha256']=='997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68' for x in portraits)
          inventory={'performer':os.environ['PERFORMER'],'portrait_records':portraits,'record_count':len(portraits),'unique_origins':len({x['origin'] for x in portraits}),'unique_asset_sha256':len({x['sha256'] for x in portraits}),'reuse_candidates_only':True,'portrait_adopted_for_merx':False}
          (r/'media/portrait-inventory.json').write_text(json.dumps(inventory,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          task=next(x for x in state['jobs'] if x['id']==os.environ['TASK']); assert task['status']=='queued' and task['attempts']==0 and task['performer']==os.environ['PERFORMER'] and task['character']==os.environ['ROLE'] and task['source_fingerprint']==os.environ['SOURCE_FP']
          claims=[x for x in journal if x.get('op')=='lease.claimed' and x.get('scope')=='doctor-who']; assert len(claims)==9 and all(x.get('task_id')!=os.environ['TASK'] for x in claims)
          source=json.loads((r/'source/source-summary.json').read_text()); official=json.loads((r/'official/official-summary.json').read_text()); cover=json.loads((r/'media/cover-metadata.json').read_text()); status=json.loads((r/'evidence/status.json').read_text()); waterline=json.loads((r/'evidence/waterline.json').read_text())
          packet={'version':1,'status':'cycle-010-merx-evidence-recovered','canonical_main':os.environ['MAIN'],'canonical_tree':os.environ['TREE'],'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'preflight':{'pr':int(os.environ['PREFLIGHT_PR']),'run':int(os.environ['PREFLIGHT_RUN']),'artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'identity':os.environ['PREFLIGHT_ID']},'task':{'id':os.environ['TASK'],'performer':os.environ['PERFORMER'],'role':os.environ['ROLE'],'performance_mode':'voice','source':os.environ['SOURCE_URL'],'source_fingerprint':os.environ['SOURCE_FP']},'source_evidence':source,'official_evidence':official,'media_evidence':{'character_page_image_disposition':source['character_image_disposition'],'official_cover_candidate':cover,'performer_portrait_inventory':inventory,'character_still_adopted':False,'performer_portrait_adopted':False,'next_media_gate':'independent cover disposition and portrait-reuse decision'},'queue':{'total':status['total'],'queued':status['statuses']['queued'],'resolved':status['statuses']['resolved'],'in_flight':status['in_flight']},'readiness':{'claim_allowed':waterline['claim_allowed'],'claim_reasons':waterline['claim_reasons'],'media_debt':waterline['media']['debt'],'unreceipted_cycles':waterline['cycles']['unreceipted']},'boundary':{'lease_issued':False,'queue_mutated':False,'canonical_record_created':False,'media_adopted':False,'cycle_receipt_written':False,'repository_write':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          assert packet['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0} and packet['readiness']['claim_allowed'] is True and packet['readiness']['claim_reasons']==[]
          packet['identity']=sha(json.dumps(packet,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (r/'evidence/evidence.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT/evidence" "$OUT/source" "$OUT/official" "$OUT/media" "$OUT/logs" -type f -print0 | LC_ALL=C sort -z | while IFS= read -r -d '' full; do rel=${full#"$OUT/"}; sha256sum "$full" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest(); ledger=r/'SHA256SUMS.pre'
          assert sha(ledger.read_bytes())==(r/'SHA256SUMS').read_text().split()[0]
          listed=[]
          for raw in ledger.read_text().splitlines():
            d,n=raw.split(None,1); p=r/n.lstrip('*'); assert p.is_file() and sha(p.read_bytes())==d; listed.append(n)
          actual=sorted(str(p.relative_to(r)) for d in ['evidence','source','official','media','logs'] for p in (r/d).rglob('*') if p.is_file())
          assert sorted(listed)==actual
          PY
          test -z "$(git status --porcelain)"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
