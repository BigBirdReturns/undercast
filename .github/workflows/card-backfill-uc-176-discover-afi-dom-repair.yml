name: card-backfill-uc-176-discover-source-transport-retry-repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-176-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-176-DISCOVER-FAILURES.json"
      - ".github/CARD-BACKFILL-UC-176.json"
      - "scripts/card-backfill-uc-176-discover.mjs"
      - "scripts/card-backfill-uc-176-discover-repair.py"
      - ".github/workflows/card-backfill-uc-176-discover-afi-dom-repair.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-176-discover-source-transport-retry-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-040'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-040
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify six retained failures and exact bounded transport-retry boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176-DISCOVER-FAILURES.json','utf8'));
          const scope=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(x=>x.id==='UC-176');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(x=>x.id==='UC-176');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(x=>x.id==='ma_214b44ba458987517acdd2b8');
          if(c.version!==1||c.record_id!=='UC-176'||c.actor!=='Fredric March'||c.character!=='Mr. Hyde'||c.production!=='Dr. Jekyll and Mr. Hyde (1931)'||c.years!=='1931'||c.universe!=='Film'||c.side!=='still')throw new Error('UC-176 discovery identity drift');
          if(c.selector_artifact?.artifact_id!==8742861304||c.scope_artifact?.artifact_id!==8742954377||c.scope_artifact?.scope_sha256!=='4eeebbb48fd8676285e368c1c9d56dabef31d034d1cd9328555014d11fbd337a')throw new Error('UC-176 upstream custody drift');
          if(c.source_pages?.length!==4||c.candidate_orbits?.length!==2||c.minimum_width!==500||c.minimum_height!==400||c.maximum_candidates!==40||c.expected_repository_hash_count!==2070)throw new Error('UC-176 discovery denominator drift');
          if(failures.version!==1||failures.record_id!=='UC-176'||failures.failed_discovery_checkpoints?.length!==6)throw new Error('UC-176 failure-ledger shape drift');
          const [first,second,third,fourth,fifth,sixth]=failures.failed_discovery_checkpoints;
          if(first.run_id!==30499938417||first.artifact_id!==8743091746||first.head_sha!=='d322fcd883029c19f8fa9c14f67a27848bcd0cbc'||first.artifact_digest_sha256!=='19e05fc16ce8e707acb1c53a85bef8ccb54c4af86bed833502f042c8d1d28937'||first.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d')throw new Error('UC-176 first AFI failure custody drift');
          if(second.run_id!==30500188160||second.artifact_id!==8743186099||second.head_sha!=='7b830cf590a60dfcb22b99c8af1044efa58a120a'||second.artifact_digest_sha256!=='0fa0f0e56b71068362ef757eb008a15787501ae49885d0fc93fd031064de72b4'||second.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d')throw new Error('UC-176 second AFI failure custody drift');
          if(third.run_id!==30500590677||third.artifact_id!==8743329713||third.head_sha!=='7cf6cdc141277f8d80506e9982a423ecd53b0f4c'||third.artifact_digest_sha256!=='397e2844135990e203d94dad4de00b2dfe10212fb760053e0d99c1e2209bda92'||third.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d'||third.afi_same_page_dom_repair_passed!==true||third.academy_page_validation_passed!==true)throw new Error('UC-176 ASC innerText failure custody drift');
          if(fourth.run_id!==30500790682||fourth.artifact_id!==8743412222||fourth.head_sha!=='9cb73e49ff28ebf9d349a1dd011dca6ed612a473'||fourth.artifact_digest_sha256!=='ffc0d8251d354c1984a2ba3eeec9b9cdf3d81392489a7940278746244cbab310'||fourth.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d'||fourth.afi_same_page_dom_repair_passed!==true||fourth.academy_page_validation_passed!==true)throw new Error('UC-176 ASC browser-shell failure custody drift');
          if(fifth.run_id!==30501042392||fifth.artifact_id!==null||fifth.head_sha!=='69cbd54a28a1c4920a3952cd7015bc29c893ba58'||fifth.artifact_digest_sha256!==null||fifth.workflow_log_only!==true||fifth.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d'||fifth.candidate_download_started!==false)throw new Error('UC-176 materializer failure custody drift');
          if(sixth.run_id!==30501141586||sixth.artifact_id!==8743545373||sixth.head_sha!=='d305ade78fbee5cb274ed35a8037e05b0a8d47cf'||sixth.artifact_digest_sha256!=='c359b5f4d16fbacce9de080370147ac4e5c8f472cf0fbf8a1c742840c9d7f9b2'||sixth.original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d'||sixth.afi_validation_passed!==true||sixth.academy_validation_passed!==true||sixth.asc_exact_article_mirror_validation_passed!==true||sixth.commons_category_page_validation_passed!==true||sixth.candidate_download_started!==true||sixth.complete_candidate_orbit!==false)throw new Error('UC-176 Commons 429 failure custody drift');
          const repair=failures.repair_boundary||{};
          if(repair.afi_page_identity_terms_and_strictness_unchanged!==true||repair.asc_primary_page_identity_terms_and_strictness_unchanged!==true||JSON.stringify(repair.same_page_dom_text_content_validation_keys)!==JSON.stringify(['afi-catalog','asc-history'])||JSON.stringify(repair.asc_exact_same_article_transport_mirrors)!==JSON.stringify(['https://theasc.com/articles/two-faced-treachery-dr-jekyll-and-mr-hyde','https://theasc.com/magazine/mar99/two/pg1.htm','https://theasc.com/magazine/mar99/two/pg4.htm'])||repair.asc_mirror_responses_must_be_written_into_the_text_receipt!==true||repair.asc_primary_page_screenshot_must_remain_retained!==true||repair.repair_must_be_bound_to_original_discoverer_git_blob_sha1!=='dc1aa66be07a609f226da17dc59a16c21cf6028d'||repair.commons_api_url_query_category_and_namespace_unchanged!==true||JSON.stringify(repair.commons_retryable_statuses)!==JSON.stringify([429,503])||repair.commons_maximum_attempts!==5||repair.commons_retry_after_header_must_be_respected!==true||JSON.stringify(repair.commons_fallback_backoff_milliseconds)!==JSON.stringify([2000,4000,8000,16000])||repair.candidate_orbits_seed_urls_source_floor_exclusions_and_duplicate_denominator_unchanged!==true||repair.selected_image_must_not_prove_actor_role!==true||repair.visual_second_desk_required!==true||repair.canonical_mutation!==false)throw new Error('UC-176 bounded transport-retry repair boundary drift');
          if(c.selection_contract?.exact_fredric_march_mr_hyde_1931_still_required!==true||c.selection_contract?.actor_role_evidence_must_be_independent_from_selected_image!==true||c.selection_contract?.visual_second_desk_required!==true||c.selection_contract?.canonical_mutation!==false)throw new Error('UC-176 selection contract drift');
          if(scope.selector_artifact?.artifact_id!==8742861304||scope.scope_contract?.exact_fredric_march_mr_hyde_1931_still_required!==true||scope.scope_contract?.canonical_mutation!==false)throw new Error('UC-176 scope control drift');
          if(!specimen||specimen.actor!=='Fredric March'||specimen.character!=='Mr. Hyde'||specimen.production!=='Dr. Jekyll and Mr. Hyde (1931)'||specimen.years!=='1931'||specimen.designer!=='Wally Westmore'||specimen.transform!==4||specimen.still||specimen.portrait?.src!=='images/uc-176-portrait.jpg')throw new Error('UC-176 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-176-portrait.jpg'||!audit||audit.status!=='absent'||audit.asset)throw new Error('UC-176 canonical absence boundary drift');
          console.log('PASS — six UC-176 failures retained and exact-blob bounded source-transport retry authorized');
          NODE
      - name: Build isolated exact-blob source-transport retry repair
        run: |
          set -euo pipefail
          python3 scripts/card-backfill-uc-176-discover-repair.py
          node --check scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs
      - name: Gather independent receipts and exact visual candidate orbits
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-176-discover-source-transport-retry-repair
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-176-discover-source-transport-retry-repair-run.log"
          rm scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload typed receipts, retry ledger, exact candidate bytes, exclusions, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-176-discover-source-transport-retry-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-176-discover-source-transport-retry-repair
            ${{ runner.temp }}/card-backfill-uc-176-discover-source-transport-retry-repair-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
