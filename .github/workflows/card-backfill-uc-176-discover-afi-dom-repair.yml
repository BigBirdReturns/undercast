name: card-backfill-uc-176-discover-commons-category-html-fallback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-176-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-176-DISCOVER-FAILURES.json"
      - ".github/CARD-BACKFILL-UC-176.json"
      - "scripts/card-backfill-uc-176-discover.mjs"
      - "scripts/card-backfill-uc-176-discover-repair.py"
      - ".github/workflows/card-backfill-uc-176-discover-afi-dom-repair.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-176-discover-commons-category-html-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-040'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-040
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify nine retained failures and exact API-first category-HTML fallback boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176-DISCOVER-FAILURES.json','utf8'));
          const scope=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-176.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(x=>x.id==='UC-176');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(x=>x.id==='UC-176');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(x=>x.id==='ma_214b44ba458987517acdd2b8');
          const blob='dc1aa66be07a609f226da17dc59a16c21cf6028d';
          if(c.version!==1||c.record_id!=='UC-176'||c.actor!=='Fredric March'||c.character!=='Mr. Hyde'||c.production!=='Dr. Jekyll and Mr. Hyde (1931)'||c.years!=='1931'||c.universe!=='Film'||c.side!=='still')throw new Error('UC-176 discovery identity drift');
          if(c.selector_artifact?.artifact_id!==8742861304||c.scope_artifact?.artifact_id!==8742954377||c.scope_artifact?.scope_sha256!=='4eeebbb48fd8676285e368c1c9d56dabef31d034d1cd9328555014d11fbd337a')throw new Error('UC-176 upstream custody drift');
          if(c.source_pages?.length!==4||c.candidate_orbits?.length!==2||c.minimum_width!==500||c.minimum_height!==400||c.maximum_candidates!==40||c.expected_repository_hash_count!==2070)throw new Error('UC-176 discovery denominator drift');
          if(failures.version!==1||failures.record_id!=='UC-176'||failures.failed_discovery_checkpoints?.length!==9)throw new Error('UC-176 failure-ledger shape drift');
          const [a,b,d,e,f,g,h,i,j]=failures.failed_discovery_checkpoints;
          if(a.run_id!==30499938417||a.artifact_id!==8743091746||a.head_sha!=='d322fcd883029c19f8fa9c14f67a27848bcd0cbc'||a.artifact_digest_sha256!=='19e05fc16ce8e707acb1c53a85bef8ccb54c4af86bed833502f042c8d1d28937'||a.original_discoverer_git_blob_sha1!==blob)throw new Error('UC-176 first AFI failure custody drift');
          if(b.run_id!==30500188160||b.artifact_id!==8743186099||b.head_sha!=='7b830cf590a60dfcb22b99c8af1044efa58a120a'||b.artifact_digest_sha256!=='0fa0f0e56b71068362ef757eb008a15787501ae49885d0fc93fd031064de72b4'||b.original_discoverer_git_blob_sha1!==blob)throw new Error('UC-176 second AFI failure custody drift');
          if(d.run_id!==30500590677||d.artifact_id!==8743329713||d.head_sha!=='7cf6cdc141277f8d80506e9982a423ecd53b0f4c'||d.artifact_digest_sha256!=='397e2844135990e203d94dad4de00b2dfe10212fb760053e0d99c1e2209bda92'||d.original_discoverer_git_blob_sha1!==blob||d.afi_same_page_dom_repair_passed!==true||d.academy_page_validation_passed!==true)throw new Error('UC-176 ASC innerText failure custody drift');
          if(e.run_id!==30500790682||e.artifact_id!==8743412222||e.head_sha!=='9cb73e49ff28ebf9d349a1dd011dca6ed612a473'||e.artifact_digest_sha256!=='ffc0d8251d354c1984a2ba3eeec9b9cdf3d81392489a7940278746244cbab310'||e.original_discoverer_git_blob_sha1!==blob||e.afi_same_page_dom_repair_passed!==true||e.academy_page_validation_passed!==true)throw new Error('UC-176 ASC browser-shell failure custody drift');
          if(f.run_id!==30501042392||f.artifact_id!==null||f.head_sha!=='69cbd54a28a1c4920a3952cd7015bc29c893ba58'||f.artifact_digest_sha256!==null||f.workflow_log_only!==true||f.original_discoverer_git_blob_sha1!==blob||f.candidate_download_started!==false)throw new Error('UC-176 materializer delimiter failure custody drift');
          if(g.run_id!==30501141586||g.artifact_id!==8743545373||g.head_sha!=='d305ade78fbee5cb274ed35a8037e05b0a8d47cf'||g.artifact_digest_sha256!=='c359b5f4d16fbacce9de080370147ac4e5c8f472cf0fbf8a1c742840c9d7f9b2'||g.original_discoverer_git_blob_sha1!==blob||g.afi_validation_passed!==true||g.academy_validation_passed!==true||g.asc_exact_article_mirror_validation_passed!==true||g.commons_category_page_validation_passed!==true||g.complete_candidate_orbit!==false)throw new Error('UC-176 Commons 429 failure custody drift');
          if(h.run_id!==30501410963||h.artifact_id!==null||h.head_sha!=='36f9cfe3dbf96ac5be30f726ad5c9a3311ba99a3'||h.artifact_digest_sha256!==null||h.workflow_log_only!==true||h.original_discoverer_git_blob_sha1!==blob||h.candidate_download_started!==false)throw new Error('UC-176 Commons patch-anchor failure custody drift');
          if(i.run_id!==30501715819||i.artifact_id!==8743750441||i.head_sha!=='812e80e2ffe4f97d2a5d21cf5893a17d7ffe61e5'||i.artifact_digest_sha256!=='75cf78f61127554c72c789a375cc565f4250735434b8aa12d384a2f259bb7173'||i.original_discoverer_git_blob_sha1!==blob||i.seven_checkpoint_verifier_passed!==true||i.exact_commons_request_shape_materialization_passed!==true||i.primary_page_surface!=='Cloudflare managed challenge'||i.desktop_same_article_mirror_text_bodies_empty!==true||i.candidate_download_started!==false)throw new Error('UC-176 ASC Cloudflare mirror failure custody drift');
          if(j.run_id!==30502065174||j.artifact_id!==8743908774||j.head_sha!=='575597848df6986e319b68d4d89afd5239f2c255'||j.artifact_digest_sha256!=='5d4a1972d86932b4331fd621b2f41a0815f1e5d271a7b0604484f6edaf21f859'||j.original_discoverer_git_blob_sha1!==blob||j.eight_checkpoint_verifier_passed!==true||j.asc_canonical_same_article_transport_passed!==true||j.asc_canonical_article_html_sha256!=='109029400fb71947203ce0e187e476d47ce1a45d28b53c1d7a9ef1c2ef0ccbbb'||j.asc_canonical_article_text_sha256!=='1f187089888e9969bc9126d6f719738df9b07a4d1d714d14d45d38a5c4e46a22'||j.commons_primary_api_attempt_count!==5||JSON.stringify(j.commons_primary_api_statuses)!==JSON.stringify([429,429,429,429,429])||j.commons_retry_receipt_missing!==true||j.candidate_download_started!==false||j.complete_candidate_orbit!==false)throw new Error('UC-176 five-attempt Commons failure custody drift');
          const repair=failures.repair_boundary||{};
          if(repair.afi_page_identity_terms_and_strictness_unchanged!==true||repair.asc_primary_page_identity_terms_and_strictness_unchanged!==true||JSON.stringify(repair.same_page_dom_text_content_validation_keys)!==JSON.stringify(['afi-catalog','asc-history'])||repair.asc_mirror_raw_html_and_text_receipts_required!==true||repair.asc_mirror_transport_manifest_path!=='pages/asc-history-transport-mirrors.json'||repair.asc_required_terms_may_be_validated_across_same_article_raw_html_and_text!==true||repair.asc_primary_page_screenshot_must_remain_retained!==true||repair.repair_must_be_bound_to_original_discoverer_git_blob_sha1!==blob||repair.commons_api_url_query_category_and_namespace_unchanged!==true||repair.commons_primary_api_first_and_exact!==true||repair.commons_retry_patch_must_bind_to_original_orbit_api_params_json_shape!==true||repair.commons_retry_receipt_path!=='source-api-commons-category-retry.json'||repair.commons_retry_receipt_must_be_written_before_success_assertion!==true||repair.commons_transport_attempts_must_be_retained_on_failure_and_success!==true||JSON.stringify(repair.commons_retryable_statuses)!==JSON.stringify([429,503])||repair.commons_maximum_attempts!==5||repair.commons_retry_after_header_must_be_respected!==true||JSON.stringify(repair.commons_fallback_backoff_milliseconds)!==JSON.stringify([2000,4000,8000,16000])||repair.commons_html_fallback_only_after_five_retryable_primary_failures!==true||repair.commons_html_fallback_exact_category_page!=='https://commons.wikimedia.org/wiki/Category:Dr._Jekyll_and_Mr._Hyde_(1931_film)'||repair.commons_html_fallback_only_namespace_file_links_from_exact_category!==true||repair.commons_html_fallback_each_file_page_html_and_text_receipted!==true||repair.commons_html_fallback_media_transport!=='https://commons.wikimedia.org/wiki/Special:Redirect/file/'||repair.commons_html_fallback_receipt_path!=='source-commons-category-html-fallback.json'||repair.commons_primary_api_or_explicit_fallback_receipt_path!=='source-api-commons-category.json'||repair.candidate_orbits_seed_urls_source_floor_exclusions_and_duplicate_denominator_unchanged!==true||repair.selected_image_must_not_prove_actor_role!==true||repair.visual_second_desk_required!==true||repair.canonical_mutation!==false)throw new Error('UC-176 API-first category-HTML fallback boundary drift');
          if(c.selection_contract?.exact_fredric_march_mr_hyde_1931_still_required!==true||c.selection_contract?.actor_role_evidence_must_be_independent_from_selected_image!==true||c.selection_contract?.visual_second_desk_required!==true||c.selection_contract?.canonical_mutation!==false)throw new Error('UC-176 selection contract drift');
          if(scope.selector_artifact?.artifact_id!==8742861304||scope.scope_contract?.exact_fredric_march_mr_hyde_1931_still_required!==true||scope.scope_contract?.canonical_mutation!==false)throw new Error('UC-176 scope control drift');
          if(!specimen||specimen.actor!=='Fredric March'||specimen.character!=='Mr. Hyde'||specimen.production!=='Dr. Jekyll and Mr. Hyde (1931)'||specimen.years!=='1931'||specimen.designer!=='Wally Westmore'||specimen.transform!==4||specimen.still||specimen.portrait?.src!=='images/uc-176-portrait.jpg')throw new Error('UC-176 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-176-portrait.jpg'||!audit||audit.status!=='absent'||audit.asset)throw new Error('UC-176 canonical absence boundary drift');
          console.log('PASS — nine UC-176 failures retained and exact API-first Commons category-HTML fallback authorized');
          NODE
      - name: Build isolated exact-blob source-transport fallback repair
        run: |
          set -euo pipefail
          python3 scripts/card-backfill-uc-176-discover-repair.py
          node --check scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs
      - name: Gather independent receipts and exact visual candidate orbits
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-176-discover-commons-category-html-fallback
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-176-discover-commons-category-html-fallback-run.log"
          rm scripts/.card-backfill-uc-176-discover-article-mirror-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload typed receipts, API attempts, category/file-page fallback receipts, candidates, exclusions, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-176-discover-commons-category-html-fallback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-176-discover-commons-category-html-fallback
            ${{ runner.temp }}/card-backfill-uc-176-discover-commons-category-html-fallback-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
