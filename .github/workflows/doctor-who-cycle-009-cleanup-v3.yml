name: doctor-who-cycle-009-cleanup-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-cleanup-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-cleanup-v3
  cancel-in-progress: true

jobs:
  halt:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-cleanup-v3'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Stop over-constrained V3 writer
        run: |
          echo 'V3 settlement is valid, but its writer requires checks that are expected to be red for guarded transport carriers.'
          echo 'No cleanup write is authorized by this synchronization.'
