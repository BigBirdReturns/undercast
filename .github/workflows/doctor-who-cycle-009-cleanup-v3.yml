name: doctor-who-cycle-009-cleanup-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-cleanup-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-cleanup-v3
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  CANONICAL_PARENT: 707f2c14c4dc183afceb732c2b56124ed3a37c93
  CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  CANONICAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  BRANCH: agent/doctor-who-cycle-009-cleanup-v3
  SELF: .github/workflows/doctor-who-cycle-009-cleanup-v3.yml
  PROOF_PR: "706"
  PROOF_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-postmerge-v2
  PROOF_HEAD: 4136226d397a12231714f2454c975f8b40253fc7
  PROOF_RUN: "31286873493"
  PROOF_JOB: "93177192558"
  PROOF_ARTIFACT: "9030160281"
  PROOF_DIGEST: sha256:f1a08d336434d4159c18da24c52eae460e25c73ac15e42f818eb1c1b9c5649a8
  TARGET_COUNT: "82"
  TARGET_SHA256: a3622470813613e81fa08d7e0e6b0ce527e06252043ca01f7b13556e10c31d23
  REQUIRED_CHECKS: archive-contract,publisher-custody,publisher-custody-or-guard

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-cleanup-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      OUT: /tmp/doctor-who-cycle-009-cleanup-v3-verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact read-only cleanup carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,proof,settlement}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Bind immutable terminal proof
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > "$OUT/api/proof-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN/jobs?per_page=100" > "$OUT/api/proof-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" > "$OUT/api/proof-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT/zip" > "$OUT/proof.zip"
          test "$(sha256sum "$OUT/proof.zip" | cut -d' ' -f1)" = "${PROOF_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/proof-pr.json').read_text())
          run=json.loads((root/'api/proof-run.json').read_text())
          jobs=json.loads((root/'api/proof-jobs.json').read_text())['jobs']
          artifact=json.loads((root/'api/proof-artifact.json').read_text())
          assert pr['number']==int(os.environ['PROOF_PR'])
          assert pr['state']=='closed' and pr['merged'] is False and pr['draft'] is True
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['PROOF_BRANCH'] and pr['head']['sha']==os.environ['PROOF_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['PROOF_RUN'])
          assert run['name']=='doctor-who-cycle-009-megnus-jaka-postmerge-v2'
          assert run['head_branch']==os.environ['PROOF_BRANCH'] and run['head_sha']==os.environ['PROOF_HEAD']
          assert run['event']=='pull_request' and run['run_attempt']==1
          assert run['status']=='completed' and run['conclusion']=='success'
          assert len(jobs)==1 and jobs[0]['id']==int(os.environ['PROOF_JOB'])
          assert jobs[0]['name']=='prove' and jobs[0]['status']=='completed' and jobs[0]['conclusion']=='success'
          assert artifact['id']==int(os.environ['PROOF_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['PROOF_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['PROOF_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['PROOF_HEAD']
          target=root/'proof'
          with zipfile.ZipFile(root/'proof.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():
                      continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'
          sealed=target/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=target/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          proof=json.loads((target/'postmerge-proof.json').read_text())
          identity=proof.pop('identity')
          assert hashlib.sha256(json.dumps(proof,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          proof['identity']=identity
          assert proof['status']=='cycle-009-megnus-jaka-terminal-postmerge-proved-v1'
          assert proof['proof_run']==int(os.environ['PROOF_RUN']) and proof['proof_attempt']==1
          assert proof['carrier_pr']==int(os.environ['PROOF_PR']) and proof['carrier_head']==os.environ['PROOF_HEAD']
          assert proof['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert proof['canonical_main']==os.environ['CANONICAL_MAIN']
          assert proof['canonical_tree']==os.environ['CANONICAL_TREE']
          assert proof['canonical_path_count']==48
          assert proof['product_pr']==692 and proof['product_pr_state']=='closed' and proof['product_pr_merged'] is True
          assert proof['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert proof['media_debt']==0 and proof['unreceipted_cycles']==[]
          assert proof['next_selector_allowed'] is True and proof['next_selector_reasons']==[]
          assert proof['cycle_010_lease_issued'] is False
          assert proof['cleanup_authorized'] is True and proof['canonical_mutation'] is False
          assert proof['outside_human_dependency'] is False
          assert proof['owner_physical_action_required'] is False
          custody={
              'proof_pr':int(os.environ['PROOF_PR']),
              'proof_head':os.environ['PROOF_HEAD'],
              'proof_run':int(os.environ['PROOF_RUN']),
              'proof_job':int(os.environ['PROOF_JOB']),
              'proof_artifact':int(os.environ['PROOF_ARTIFACT']),
              'proof_digest':os.environ['PROOF_DIGEST'],
              'proof_identity':proof['identity'],
          }
          (root/'settlement/proof-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Freeze exact 82-ref transport denominator
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/settlement/targets.txt" <<'EOF'
          agent/doctor-who-cycle-009-cleanup-v1
          agent/doctor-who-cycle-009-cleanup-v2
          agent/doctor-who-cycle-009-dan-starkey-portrait-census-v1
          agent/doctor-who-cycle-009-dan-starkey-portrait-census-v2
          agent/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1
          agent/doctor-who-cycle-009-dan-starkey-portrait-review-v1
          agent/doctor-who-cycle-009-dan-starkey-portrait-review-v2
          agent/doctor-who-cycle-009-dan-starkey-portrait-review-v3
          agent/doctor-who-cycle-009-eligibility-release-v1
          agent/doctor-who-cycle-009-finalization-template-v1
          agent/doctor-who-cycle-009-megnus-jaka-adjudication-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-materializer-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-publisher-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v2
          agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v3
          agent/doctor-who-cycle-009-megnus-jaka-candidate-review-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-supervisor-v4
          agent/doctor-who-cycle-009-megnus-jaka-candidate-v1
          agent/doctor-who-cycle-009-megnus-jaka-candidate-v2
          agent/doctor-who-cycle-009-megnus-jaka-cover-review-v1
          agent/doctor-who-cycle-009-megnus-jaka-evidence-v2
          agent/doctor-who-cycle-009-megnus-jaka-evidence-v3
          agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v2
          agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v3
          agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v4
          agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v5
          agent/doctor-who-cycle-009-megnus-jaka-final-product-v1
          agent/doctor-who-cycle-009-megnus-jaka-final-publisher-707f-v2
          agent/doctor-who-cycle-009-megnus-jaka-final-publisher-v1
          agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v2
          agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v3
          agent/doctor-who-cycle-009-megnus-jaka-final-review-v1
          agent/doctor-who-cycle-009-megnus-jaka-final-review-v2
          agent/doctor-who-cycle-009-megnus-jaka-final-review-v3
          agent/doctor-who-cycle-009-megnus-jaka-finalizer-inspection-v1
          agent/doctor-who-cycle-009-megnus-jaka-finalizer-v3-source-recovery
          agent/doctor-who-cycle-009-megnus-jaka-merger-v1
          agent/doctor-who-cycle-009-megnus-jaka-merger-v2
          agent/doctor-who-cycle-009-megnus-jaka-merger-v3
          agent/doctor-who-cycle-009-megnus-jaka-merger-v3-materializer
          agent/doctor-who-cycle-009-megnus-jaka-merger-v4
          agent/doctor-who-cycle-009-megnus-jaka-merger-v4-materializer
          agent/doctor-who-cycle-009-megnus-jaka-merger-v5
          agent/doctor-who-cycle-009-megnus-jaka-merger-v5-materializer
          agent/doctor-who-cycle-009-megnus-jaka-merger-v6
          agent/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer
          agent/doctor-who-cycle-009-megnus-jaka-portrait-candidate-a9b1-v1
          agent/doctor-who-cycle-009-megnus-jaka-portrait-candidate-a9b1-v2
          agent/doctor-who-cycle-009-megnus-jaka-portrait-candidate-a9b1-v3
          agent/doctor-who-cycle-009-megnus-jaka-portrait-candidate-v1
          agent/doctor-who-cycle-009-megnus-jaka-postmerge-v1
          agent/doctor-who-cycle-009-megnus-jaka-postmerge-v2
          agent/doctor-who-cycle-009-megnus-jaka-reviewed-product-v1
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v10s
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v10t
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v11
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v12
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v10
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v10r
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v10s
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v7
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v8
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v9
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a9b1-v4
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a9b1-v5
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a9b1-v6
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v2
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v3
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v4
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v5
          agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v6
          agent/doctor-who-cycle-009-megnus-jaka-visual-review-v1
          agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v4
          agent/doctor-who-cycle-009-operational-reliability-diagnostic-707f-v5
          agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v1
          agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v2
          agent/doctor-who-cycle-009-operational-reliability-replacement-707f-v3
          agent/doctor-who-cycle-009-preeligibility-census-v1
          agent/doctor-who-cycle-009-preeligibility-census-v2
          agent/doctor-who-cycle-009-real-preflight-v1
          agent/doctor-who-cycle-009-source-media-preflight-v1
          EOF
          LC_ALL=C sort -u "$OUT/settlement/targets.txt" -o "$OUT/settlement/targets.txt"
          test "$(wc -l < "$OUT/settlement/targets.txt")" = "$TARGET_COUNT"
          test "$(sha256sum "$OUT/settlement/targets.txt" | cut -d' ' -f1)" = "$TARGET_SHA256"
          ! grep -Fxq main "$OUT/settlement/targets.txt"
          ! grep -Fxq "$BRANCH" "$OUT/settlement/targets.txt"
          printf '%s\n' "$BRANCH" > "$OUT/expected-live.txt"
          cat "$OUT/settlement/targets.txt" >> "$OUT/expected-live.txt"
          LC_ALL=C sort -u "$OUT/expected-live.txt" -o "$OUT/expected-live.txt"
          test "$(wc -l < "$OUT/expected-live.txt")" = "$((TARGET_COUNT + 1))"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/agent/doctor-who-cycle-009-" > "$OUT/api/live-refs.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          rows=json.loads((root/'api/live-refs.json').read_text())
          refs={row['ref'].removeprefix('refs/heads/'):row['object']['sha'] for row in rows}
          expected=(root/'expected-live.txt').read_text().splitlines()
          assert sorted(refs)==expected
          targets=(root/'settlement/targets.txt').read_text().splitlines()
          with (root/'settlement/refs-before.jsonl').open('w') as fh:
              for branch in targets:
                  fh.write(json.dumps({'branch':branch,'sha':refs[branch]},sort_keys=True,separators=(',',':'))+'\n')
          denominator={
              'target_count':len(targets),
              'target_sha256':hashlib.sha256((root/'settlement/targets.txt').read_bytes()).hexdigest(),
              'live_count':len(refs),
              'self_branch':os.environ['BRANCH'],
              'self_sha':refs[os.environ['BRANCH']],
              'refs_before_sha256':hashlib.sha256((root/'settlement/refs-before.jsonl').read_bytes()).hexdigest(),
          }
          assert denominator['target_count']==int(os.environ['TARGET_COUNT'])
          assert denominator['target_sha256']==os.environ['TARGET_SHA256']
          assert denominator['live_count']==denominator['target_count']+1
          assert denominator['self_sha']==os.environ['CARRIER_HEAD']
          (root/'settlement/denominator.json').write_text(json.dumps(denominator,indent=2,sort_keys=True)+'\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Recheck terminal canonical state
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T HEAD)" = "$CANONICAL_TREE"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/settlement/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/settlement/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/settlement/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/settlement/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/settlement/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/settlement/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/settlement/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/settlement/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/settlement/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/settlement/waterline-status.json" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal code-free cleanup settlement
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          proof=json.loads((root/'settlement/proof-custody.json').read_text())
          denominator=json.loads((root/'settlement/denominator.json').read_text())
          status=json.loads((root/'settlement/autopilot-status.json').read_text())
          waterline=json.loads((root/'settlement/waterline-status.json').read_text())
          settlement={
              'status':'cycle-009-transport-cleanup-approved-v3',
              'verify_run':int(os.environ['GITHUB_RUN_ID']),
              'verify_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'canonical_parent':os.environ['CANONICAL_PARENT'],
              'canonical_main':os.environ['CANONICAL_MAIN'],
              'canonical_tree':os.environ['CANONICAL_TREE'],
              'proof_pr':proof['proof_pr'],
              'proof_run':proof['proof_run'],
              'proof_artifact':proof['proof_artifact'],
              'proof_digest':proof['proof_digest'],
              'proof_identity':proof['proof_identity'],
              'target_count':denominator['target_count'],
              'target_sha256':denominator['target_sha256'],
              'refs_before_sha256':denominator['refs_before_sha256'],
              'live_count':denominator['live_count'],
              'queue':{
                  'total':status['total'],
                  'queued':status['statuses']['queued'],
                  'resolved':status['statuses']['resolved'],
                  'in_flight':status['in_flight'],
              },
              'next_selector_allowed':waterline['claim_allowed'],
              'next_selector_reasons':waterline['claim_reasons'],
              'media_debt':waterline['media']['debt'],
              'unreceipted_cycles':waterline['cycles']['unreceipted'],
              'cycle_010_lease_issued':False,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          assert settlement['target_count']==int(os.environ['TARGET_COUNT'])
          assert settlement['target_sha256']==os.environ['TARGET_SHA256']
          assert settlement['live_count']==settlement['target_count']+1
          assert settlement['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert settlement['next_selector_allowed'] is True and settlement['next_selector_reasons']==[]
          assert settlement['media_debt']==0 and settlement['unreceipted_cycles']==[]
          settlement['identity']=hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'settlement/settlement.json').write_text(json.dumps(settlement,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/settlement" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/settlement/$rel" | sed "s#  $OUT/settlement/#  #"
          done > "$OUT/settlement/SHA256SUMS.pre"
          sha256sum "$OUT/settlement/SHA256SUMS.pre" | sed "s#  $OUT/settlement/#  #" > "$OUT/settlement/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v3-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v3-verify/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v3-verify-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v3-verify
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  cleanup:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      SETTLEMENT: /tmp/doctor-who-cycle-009-cleanup-v3-settlement
      OUT: /tmp/doctor-who-cycle-009-cleanup-v3-write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v3-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v3-settlement

      - name: Reverify settlement and required custody checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,receipt}
          ROOT="$SETTLEMENT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          ledger=root/'SHA256SUMS.pre'
          sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement.json').read_text())
          identity=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          settlement['identity']=identity
          assert settlement['status']=='cycle-009-transport-cleanup-approved-v3'
          assert settlement['verify_run']==int(os.environ['GITHUB_RUN_ID'])
          assert settlement['verify_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert settlement['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert settlement['canonical_main']==os.environ['CANONICAL_MAIN']
          assert settlement['canonical_tree']==os.environ['CANONICAL_TREE']
          assert settlement['proof_pr']==int(os.environ['PROOF_PR'])
          assert settlement['proof_run']==int(os.environ['PROOF_RUN'])
          assert settlement['proof_artifact']==int(os.environ['PROOF_ARTIFACT'])
          assert settlement['proof_digest']==os.environ['PROOF_DIGEST']
          assert settlement['target_count']==int(os.environ['TARGET_COUNT'])
          assert settlement['target_sha256']==os.environ['TARGET_SHA256']
          assert settlement['live_count']==settlement['target_count']+1
          assert settlement['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert settlement['next_selector_allowed'] is True and settlement['next_selector_reasons']==[]
          assert settlement['media_debt']==0 and settlement['unreceipted_cycles']==[]
          assert settlement['cycle_010_lease_issued'] is False and settlement['canonical_mutation'] is False
          assert hashlib.sha256((root/'targets.txt').read_bytes()).hexdigest()==settlement['target_sha256']
          assert len((root/'targets.txt').read_text().splitlines())==settlement['target_count']
          assert hashlib.sha256((root/'refs-before.jsonl').read_bytes()).hexdigest()==settlement['refs_before_sha256']
          assert len((root/'refs-before.jsonl').read_text().splitlines())==settlement['target_count']
          PY
          settlement_identity="$(jq -r '.identity' "$SETTLEMENT/settlement.json")"
          carrier_head="$(jq -r '.carrier_head' "$SETTLEMENT/settlement.json")"
          carrier_pr="$(jq -r '.carrier_pr' "$SETTLEMENT/settlement.json")"
          test -n "$settlement_identity"
          printf 'SETTLEMENT_IDENTITY=%s\nCARRIER_HEAD=%s\nCARRIER_PR=%s\n' "$settlement_identity" "$carrier_head" "$carrier_pr" >> "$GITHUB_ENV"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          ready=false
          for _ in $(seq 1 80); do
            gh api "/repos/$GITHUB_REPOSITORY/commits/$carrier_head/check-runs?per_page=100" > "$OUT/api/carrier-checks.json"
            if ROOT="$OUT" REQUIRED="$REQUIRED_CHECKS" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/carrier-checks.json').read_text())['check_runs']
          by={row['name']:row for row in rows}
          for name in os.environ['REQUIRED'].split(','):
              if name not in by or by[name]['status']!='completed' or by[name]['conclusion']!='success':
                  sys.exit(1)
          PY
            then
              ready=true
              break
            fi
            sleep 15
          done
          test "$ready" = true

      - name: Rebind exact live refs before mutation
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CARRIER_PR" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" > "$OUT/api/proof-artifact.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/agent/doctor-who-cycle-009-" > "$OUT/api/live-refs.json"
          ROOT="$OUT" SETTLEMENT="$SETTLEMENT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          out=Path(os.environ['ROOT'])
          root=Path(os.environ['SETTLEMENT'])
          settlement=json.loads((root/'settlement.json').read_text())
          pr=json.loads((out/'api/carrier-pr.json').read_text())
          artifact=json.loads((out/'api/proof-artifact.json').read_text())
          rows=json.loads((out/'api/live-refs.json').read_text())
          refs={row['ref'].removeprefix('refs/heads/'):row['object']['sha'] for row in rows}
          targets=(root/'targets.txt').read_text().splitlines()
          expected=sorted(targets+[os.environ['BRANCH']])
          assert sorted(refs)==expected
          assert pr['number']==settlement['carrier_pr']
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==settlement['carrier_head']
          assert pr['commits']==1 and pr['changed_files']==1
          assert refs[os.environ['BRANCH']]==settlement['carrier_head']
          frozen={row['branch']:row['sha'] for row in map(json.loads,(root/'refs-before.jsonl').read_text().splitlines())}
          assert sorted(frozen)==targets
          for branch in targets:
              assert refs[branch]==frozen[branch]
          assert artifact['id']==int(os.environ['PROOF_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['PROOF_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['PROOF_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['PROOF_HEAD']
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Close target pull requests and delete exact frozen refs
        shell: bash
        run: |
          set -euo pipefail
          : > "$OUT/receipt/prs.jsonl"
          : > "$OUT/receipt/deletions.jsonl"
          while IFS= read -r branch; do
            case "$branch" in
              agent/doctor-who-cycle-009-*) ;;
              *) echo "ref outside cleanup namespace: $branch" >&2; exit 1 ;;
            esac
            expected="$(jq -r --arg branch "$branch" 'select(.branch==$branch) | .sha' "$SETTLEMENT/refs-before.jsonl")"
            test -n "$expected"
            actual="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected"
            gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="BigBirdReturns:$branch" -F per_page=100 > "$OUT/api/prs.json"
            ROOT="$OUT" BRANCH_NAME="$branch" python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          branch=os.environ['BRANCH_NAME']
          summaries=json.loads((root/'api/prs.json').read_text())
          for summary in summaries:
              number=summary['number']
              proc=subprocess.run(
                  ['gh','api',f'/repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{number}'],
                  check=True,capture_output=True,text=True)
              pr=json.loads(proc.stdout)
              was_open=pr['state']=='open'
              if was_open:
                  proc=subprocess.run(
                      ['gh','api','--method','PATCH',f'/repos/{os.environ["GITHUB_REPOSITORY"]}/pulls/{number}','--input','-'],
                      input=json.dumps({'state':'closed'}),check=True,capture_output=True,text=True)
                  pr=json.loads(proc.stdout)
              assert pr['state']=='closed'
              row={
                  'branch':branch,
                  'pull_request':number,
                  'was_open':was_open,
                  'state':pr['state'],
                  'merged':pr['merged'],
                  'head_sha':pr['head']['sha'],
                  'base_ref':pr['base']['ref'],
              }
              with (root/'receipt/prs.jsonl').open('a') as fh:
                  fh.write(json.dumps(row,sort_keys=True,separators=(',',':'))+'\n')
          PY
            actual="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            absent=false
            for _ in $(seq 1 60); do
              if ! gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
                absent=true
                break
              fi
              sleep 2
            done
            test "$absent" = true
            jq -cn --arg branch "$branch" --arg prior "$expected" '{branch:$branch,prior_sha:$prior,deleted:true,absence_proved:true}' >> "$OUT/receipt/deletions.jsonl"
            test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          done < "$SETTLEMENT/targets.txt"
          test "$(wc -l < "$OUT/receipt/deletions.jsonl")" = "$TARGET_COUNT"
          jq -e -s --argjson expected "$TARGET_COUNT" 'length==$expected and all(.deleted==true and .absence_proved==true)' "$OUT/receipt/deletions.jsonl" >/dev/null

      - name: Self-retire and seal cleanup receipt
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$CARRIER_PR" --input - > "$OUT/api/self-pr-closed.json" <<'JSON'
          {"state":"closed"}
          JSON
          jq -e '.state=="closed" and .merged==false' "$OUT/api/self-pr-closed.json" >/dev/null
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$CARRIER_HEAD"
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          absent=false
          for _ in $(seq 1 60); do
            if ! gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
              absent=true
              break
            fi
            sleep 2
          done
          test "$absent" = true
          jq -cn --arg branch "$BRANCH" --arg prior "$CARRIER_HEAD" '{branch:$branch,prior_sha:$prior,deleted:true,absence_proved:true}' > "$OUT/receipt/self-deletion.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/agent/doctor-who-cycle-009-" > "$OUT/api/remaining-refs.json"
          test "$(jq 'length' "$OUT/api/remaining-refs.json")" = 0
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          ROOT="$OUT" SETTLEMENT="$SETTLEMENT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path(os.environ['ROOT'])
          root=Path(os.environ['SETTLEMENT'])
          settlement=json.loads((root/'settlement.json').read_text())
          deletions=[json.loads(row) for row in (out/'receipt/deletions.jsonl').read_text().splitlines() if row]
          prs=[json.loads(row) for row in (out/'receipt/prs.jsonl').read_text().splitlines() if row]
          self_deletion=json.loads((out/'receipt/self-deletion.json').read_text())
          receipt={
              'status':'cycle-009-transport-cleanup-complete-v3',
              'cleanup_run':int(os.environ['GITHUB_RUN_ID']),
              'cleanup_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':settlement['carrier_pr'],
              'carrier_head':settlement['carrier_head'],
              'canonical_main':settlement['canonical_main'],
              'canonical_tree':settlement['canonical_tree'],
              'settlement_identity':settlement['identity'],
              'proof_pr':settlement['proof_pr'],
              'proof_run':settlement['proof_run'],
              'proof_artifact':settlement['proof_artifact'],
              'proof_digest':settlement['proof_digest'],
              'proof_identity':settlement['proof_identity'],
              'target_count':settlement['target_count'],
              'target_sha256':settlement['target_sha256'],
              'target_refs_deleted':len(deletions),
              'cleanup_ref_deleted':self_deletion['deleted'],
              'pull_requests_observed':len(prs),
              'pull_requests_closed_by_cleanup':sum(1 for row in prs if row['was_open']),
              'remaining_cycle_009_refs':0,
              'queue':settlement['queue'],
              'next_selector_allowed':settlement['next_selector_allowed'],
              'next_selector_reasons':settlement['next_selector_reasons'],
              'media_debt':settlement['media_debt'],
              'unreceipted_cycles':settlement['unreceipted_cycles'],
              'cycle_010_lease_issued':False,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          assert receipt['target_refs_deleted']==int(os.environ['TARGET_COUNT'])
          assert receipt['cleanup_ref_deleted'] is True
          assert receipt['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          assert receipt['next_selector_allowed'] is True and receipt['next_selector_reasons']==[]
          assert receipt['media_debt']==0 and receipt['unreceipted_cycles']==[]
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'receipt/cleanup.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'receipt/settlement.bound.json').write_bytes((root/'settlement.json').read_bytes())
          (out/'receipt/targets.txt').write_bytes((root/'targets.txt').read_bytes())
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/receipt/$rel" | sed "s#  $OUT/receipt/#  #"
          done > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" | sed "s#  $OUT/receipt/#  #" > "$OUT/receipt/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v3-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v3-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v3-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v3-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
