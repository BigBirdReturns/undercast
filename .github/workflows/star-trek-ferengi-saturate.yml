name: star-trek-ferengi-saturate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-FERENGI-SATURATE.json"
      - ".github/workflows/star-trek-ferengi-saturate.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-ferengi-saturate
  cancel-in-progress: true

jobs:
  saturate:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Preserve the exact Torrot exclusion instead of creating a false card
        run: |
          set -euo pipefail
          out=/tmp/star-trek-ferengi-saturate
          rm -rf "$out"
          mkdir -p "$out" data/review/ferengi-saturation
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const taskId='ap_da38470c315303947703dac1';
          const batchPath=`data/review/ferengi-saturation/${taskId}-lease.json`;
          const resultPath=`data/review/ferengi-saturation/${taskId}-results.json`;
          const state=JSON.parse(fs.readFileSync('data/AUTOPILOT.json','utf8'));
          const exclusionDoc=JSON.parse(fs.readFileSync('data/CENSUS-EXCLUSIONS.json','utf8'));
          const job=state.jobs.find(row=>row.id===taskId);
          const exclusion=(exclusionDoc.records||[]).find(row=>row.character==='Torrot'&&row.performer==='Jeri Ryan');
          if(!job||!exclusion) throw new Error('the source-bound Torrot exclusion is missing');
          if(job.status==='rejected'){
            fs.writeFileSync('/tmp/star-trek-ferengi-saturate/torrot-action.txt','skip\n');
          }else if(job.status==='leased'){
            const batch=JSON.parse(fs.readFileSync(batchPath,'utf8'));
            if(batch.lease_id!==job.lease?.id||batch.tasks?.[0]?.id!==taskId) throw new Error('Torrot lease packet does not match durable state');
            const results={version:1,lease_id:batch.lease_id,agent:batch.agent,results:[{
              task_id:taskId,
              decision:'reject',
              reason:exclusion.reason,
              evidence:[{label:'Maintained exact performer-role exclusion',source:exclusion.source}]
            }]};
            fs.writeFileSync(resultPath,JSON.stringify(results,null,2)+'\n');
            fs.writeFileSync('/tmp/star-trek-ferengi-saturate/torrot-action.txt','reject\n');
          }else{
            throw new Error(`Torrot exclusion expected leased or rejected state, found ${job.status}`);
          }
          NODE
          action=$(tr -d '\n' < "$out/torrot-action.txt")
          if [ "$action" = reject ]; then
            task_id=ap_da38470c315303947703dac1
            batch="data/review/ferengi-saturation/${task_id}-lease.json"
            results="data/review/ferengi-saturation/${task_id}-results.json"
            receipt="data/review/ferengi-saturation/${task_id}-cycle-receipt.json"
            lease_id=$(node -e "console.log(require('./$batch').lease_id)")
            node scripts/autopilot.mjs submit --batch "$batch" --input "$results" | tee "$out/torrot-submit.log"
            node scripts/media-audit.mjs gate --scope star-trek | tee "$out/torrot-media-gate.log"
            LEASE_ID="$lease_id" RECEIPT="$receipt" node -e 'const fs=require("fs");const doc={scope_id:"star-trek",lease_id:process.env.LEASE_ID,outcome:"aborted",note:"The saturation cycle stopped before card creation because the maintained exact exclusion establishes that Torrot is an assimilated personality expressed through Seven of Nine, not a Ferengi designed-face performance by Jeri Ryan.",evidence:[{type:"incident",value:"Eligibility invariant surfaced from data/CENSUS-EXCLUSIONS.json before canonical filing; the cycle was aborted rather than creating a false Ferengi card."},{type:"source",value:"https://memory-alpha.fandom.com/wiki/Torrot"}],reviewed_by:"chatgpt-second-desk",reviewed_role:"second-desk",reviewed_at:new Date().toISOString()};fs.writeFileSync(process.env.RECEIPT,JSON.stringify(doc,null,2)+"\n");'
            node scripts/waterline.mjs record-cycle --input "$receipt" | tee "$out/torrot-cycle.log"
            git add -A
            git diff --cached --check
            git commit -m "Population: preserve the Torrot eligibility exclusion"
            git push origin HEAD:agent/star-trek-population-002
          fi
      - name: File every remaining eligible named Ferengi credit
        run: |
          set -euo pipefail
          out=/tmp/star-trek-ferengi-saturate
          mkdir -p "$out" data/review/ferengi-saturation
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          : > "$out/cycles.jsonl"
          cycle=0
          while :; do
            set +e
            node scripts/ferengi-fill.mjs next --out "$out/next.json" > "$out/next.log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 3 ]; then
              break
            fi
            if [ "$code" -ne 0 ]; then
              cat "$out/next.log"
              exit "$code"
            fi
            task_id=$(node -e "console.log(require('$out/next.json').task.task_id)")
            performer=$(node -e "console.log(require('$out/next.json').task.performer)")
            character=$(node -e "console.log(require('$out/next.json').task.character)")
            remaining=$(node -e "console.log(require('$out/next.json').remaining)")
            resume=$(node -e "console.log(require('$out/next.json').resume?'yes':'no')")
            cycle=$((cycle+1))
            if [ "$cycle" -gt 80 ]; then
              echo "refusing an unbounded Ferengi loop"
              exit 1
            fi
            batch="data/review/ferengi-saturation/${task_id}-lease.json"
            prompt="data/review/ferengi-saturation/${task_id}-prompt.md"
            results="data/review/ferengi-saturation/${task_id}-results.json"
            map="data/review/ferengi-saturation/${task_id}-wall-map.json"
            review="data/review/ferengi-saturation/${task_id}-post-merge-review.json"
            cycle_receipt="data/review/ferengi-saturation/${task_id}-cycle-receipt.json"

            if [ "$resume" = yes ]; then
              test -f "$batch"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              claim_commit=$(git log -1 --format=%H -- "$batch")
              echo "resuming $task_id from committed lease $lease_id" | tee "$out/resume-${cycle}.log"
            else
              node scripts/autopilot.mjs claim \
                --agent luna \
                --scope star-trek \
                --capability-profile text-vision \
                --task-id "$task_id" \
                --limit 1 \
                --lease-minutes 360 \
                --selection-basis "Full Ferengi saturation: exact named source credit selected in deterministic priority order; missing image evidence will remain explicitly not on file rather than blocking the card." \
                --out "$batch" \
                --prompt "$prompt" \
                > "$out/claim-${cycle}.json"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              git add data/AUTOPILOT.json data/journal/autopilot.jsonl "$batch" "$prompt"
              git diff --cached --check
              git commit -m "Population: lease Ferengi task ${task_id}"
              claim_commit=$(git rev-parse HEAD)
              git push origin HEAD:agent/star-trek-population-002
            fi

            node scripts/ferengi-fill.mjs draft --batch "$batch" --out "$results" | tee "$out/draft-${cycle}.log"
            node scripts/autopilot.mjs submit --batch "$batch" --input "$results" | tee "$out/submit-${cycle}.log"
            node scripts/grow.mjs --drafts | tee "$out/grow-${cycle}.log"
            node scripts/sync-sources.mjs | tee "$out/sources-${cycle}.log"
            node scripts/ferengi-fill.mjs mark-absent --batch "$batch" --map "$map" | tee "$out/absence-${cycle}.log"
            node scripts/credits.mjs > "$out/credits-${cycle}.log" 2>&1
            node scripts/shard.mjs > "$out/shard-${cycle}.log" 2>&1
            node scripts/build-contract.mjs > "$out/contract-${cycle}.log" 2>&1
            node scripts/autopilot.mjs sync > "$out/autopilot-sync-${cycle}.log" 2>&1
            node scripts/media-audit.mjs sync > "$out/media-sync-${cycle}.log" 2>&1
            node scripts/ferengi-fill.mjs review --batch "$batch" --map "$map" --out "$review" | tee "$out/review-${cycle}.log"
            node scripts/autopilot.mjs complete --input "$review" | tee "$out/complete-${cycle}.log"
            node scripts/media-audit.mjs gate --scope star-trek > "$out/media-gate-${cycle}.log" 2>&1

            LEASE_ID="$lease_id" TASK_ID="$task_id" PERFORMER="$performer" CHARACTER="$character" CLAIM_COMMIT="$claim_commit" RECEIPT="$cycle_receipt" node -e 'const fs=require("fs");const doc={scope_id:"star-trek",lease_id:process.env.LEASE_ID,outcome:"completed",note:`Exact-source Ferengi saturation filed ${process.env.PERFORMER} as ${process.env.CHARACTER}; both media sides remain honestly not on file for later rolling enrichment.`,evidence:[{type:"workflow-run",value:`GitHub Actions run ${process.env.GITHUB_RUN_ID} — deterministic Ferengi saturation cycle for ${process.env.TASK_ID}.`},{type:"commit",value:`${process.env.CLAIM_COMMIT} — restart-safe lease committed before drafting or canonical mutation.`},{type:"restart-proof",value:`Lease ${process.env.LEASE_ID} was persisted in data/review/ferengi-saturation before the task was submitted.`}],reviewed_by:"chatgpt-second-desk",reviewed_role:"second-desk",reviewed_at:new Date().toISOString()};fs.writeFileSync(process.env.RECEIPT,JSON.stringify(doc,null,2)+"\n");'
            node scripts/waterline.mjs record-cycle --input "$cycle_receipt" | tee "$out/waterline-${cycle}.log"

            wall_id=$(node -e "console.log(require('./$map').records[0].wall_id)")
            node -e "console.log(JSON.stringify({cycle:Number(process.argv[1]),remaining_before:Number(process.argv[2]),task_id:process.argv[3],lease_id:process.argv[4],wall_id:process.argv[5],performer:process.argv[6],character:process.argv[7]}))" "$cycle" "$remaining" "$task_id" "$lease_id" "$wall_id" "$performer" "$character" >> "$out/cycles.jsonl"

            git add -A
            git diff --cached --check
            git commit -m "Population: file Ferengi task ${task_id}"
            git push origin HEAD:agent/star-trek-population-002
          done

          report="data/review/star-trek-five-way-accounting-2026-07-24.json"
          receipt="data/review/ferengi-saturation/accounting-receipt.json"
          node scripts/ferengi-fill.mjs accounting --report "$report" --receipt "$receipt" | tee "$out/accounting.log"
          node scripts/waterline.mjs record-accounting --input "$receipt" | tee "$out/accounting-record.log"
          node scripts/credits.mjs > "$out/final-credits.log" 2>&1
          node scripts/shard.mjs > "$out/final-shard.log" 2>&1
          node scripts/build-contract.mjs > "$out/final-contract.log" 2>&1
          node scripts/ds9-census.mjs --project-only > "$out/ds9-census.log" 2>&1
          node scripts/ds9-graph.mjs --project-only > "$out/ds9-graph.log" 2>&1
          node scripts/ds9-eligibility-queue.mjs > "$out/ds9-eligibility.log" 2>&1
          node scripts/ds9-maker-queue.mjs > "$out/ds9-maker.log" 2>&1
          node scripts/build-record-pages.mjs > "$out/record-routes.log" 2>&1
          node scripts/autopilot.mjs validate | tee "$out/autopilot-validate.log"
          node scripts/media-audit.mjs validate | tee "$out/media-validate.log"
          node scripts/media-audit.mjs gate --scope star-trek | tee "$out/media-gate.log"
          node scripts/waterline.mjs validate | tee "$out/waterline-validate.log"
          node scripts/species-fixtures.mjs | tee "$out/species-fixtures.log"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const media=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const autopilot=JSON.parse(fs.readFileSync('data/AUTOPILOT.json','utf8'));
          const exclusions=JSON.parse(fs.readFileSync('data/CENSUS-EXCLUSIONS.json','utf8'));
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');
          const jobs=autopilot.jobs.filter(job=>job.scope==='star-trek');
          const mediaRows=media.items.filter(item=>item.scope==='star-trek');
          const complete=mediaRows.filter(item=>['verified','absent'].includes(item.status)).length;
          const status=Object.fromEntries([...new Set(jobs.map(job=>job.status))].map(name=>[name,jobs.filter(job=>job.status===name).length]));
          const torrot=taxon.credits.find(row=>row.character==='Torrot'&&row.performer==='Jeri Ryan');
          const torrotExclusion=(exclusions.records||[]).find(row=>row.character==='Torrot'&&row.performer==='Jeri Ryan');
          if(specimens.length!==1286) throw new Error(`expected 1286 canonical records, found ${specimens.length}`);
          if(taxon.counts.named_credits!==70||taxon.counts.primary_card_credits!==53||taxon.counts.primary_card_records!==51||taxon.counts.additional_performance_credits!==16||taxon.counts.unfiled_named_credits!==1) throw new Error(`unexpected final Ferengi counts: ${JSON.stringify(taxon.counts)}`);
          if(!torrot||torrot.status!=='unfiled'||!torrotExclusion) throw new Error('Torrot must remain visibly unfiled with its exact evidence-backed exclusion');
          if(mediaRows.length!==828||complete!==828||mediaRows.some(item=>['review','attention'].includes(item.status))) throw new Error('Star Trek media baseline did not return to complete');
          if(status.resolved!==363||status.blocked!==2||status.rejected!==1||status.queued!==1860||jobs.some(job=>['leased','drafted','merged'].includes(job.status))) throw new Error(`unexpected final task state: ${JSON.stringify(status)}`);
          fs.writeFileSync('/tmp/star-trek-ferengi-saturate/final-state.json',JSON.stringify({records:specimens.length,ferengi:taxon.counts,explicit_exclusion:{character:'Torrot',performer:'Jeri Ryan',reason:torrotExclusion.reason},media:{total:mediaRows.length,complete},tasks:status},null,2)+'\n');
          NODE

          rm -f .github/STAR-TREK-FERENGI-SATURATE.json
          rm -f .github/STAR-TREK-FERENGI-SATURATION-PLAN.json
          rm -f .github/workflows/star-trek-ferengi-saturate.yml
          rm -f .github/workflows/star-trek-ferengi-saturation-plan.yml
          git add -A
          git diff --cached --check
          git commit -m "Population: complete the eligible named Ferengi card catalog"

      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee /tmp/star-trek-ferengi-saturate/gate.log
          git status --short | tee /tmp/star-trek-ferengi-saturate/status.txt
          test -z "$(git status --porcelain)"
      - name: Publish the complete Ferengi catalog
        run: git push origin HEAD:agent/star-trek-population-002
      - name: Retain saturation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-ferengi-saturation-${{ github.run_id }}
          path: /tmp/star-trek-ferengi-saturate
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
