name: repair-doctor-who-preservation-readiness

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-doctor-who-preservation-readiness.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-preservation-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/repair-doctor-who-preservation-readiness.yml
  TARGET: .github/workflows/apply-doctor-who-source-preservation-001.yml

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Bind exact branch and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

      - name: Replace exit-code inference with receipted state checks
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-doctor-who-source-preservation-001.yml')
          text = path.read_text()
          old = """          set +e
          node scripts/autopilot.mjs readiness --scope doctor-who --require-ready > /tmp/doctor-who-readiness.txt 2>&1
          readiness_status=$?
          set -e
          if [ \"$readiness_status\" -eq 0 ]; then
            echo 'paused Doctor Who scope unexpectedly became lease-ready' >&2
            exit 1
          fi
          node scripts/doctor-who-activation-preflight.mjs check
          node scripts/estate-certification-fixtures.mjs
"""
          new = """          node scripts/autopilot.mjs readiness --scope doctor-who > /tmp/doctor-who-readiness.txt 2>&1
          node scripts/doctor-who-activation-preflight.mjs check
          node scripts/estate-certification-fixtures.mjs
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy readiness block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm "$SELF"
          git add "$TARGET"
          git diff --cached --check

      - name: Publish the workflow repair under exact-head lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Preservation: read Doctor Who authority from receipts' \
            -m 'remove the false readiness exit-code inference'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
