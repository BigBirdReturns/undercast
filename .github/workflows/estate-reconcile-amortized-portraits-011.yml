name: estate-reconcile-amortized-portraits-011

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-reconcile-amortized-portraits-011.yml
      - scripts/estate-reconcile-amortized-portraits-011.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-reconcile-amortized-portraits-011
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  SCRIPT: scripts/estate-reconcile-amortized-portraits-011.mjs
  OUT: data/review/estate-debt/COLLECT-011-AMORTIZED-PORTRAIT-RULING.json

jobs:
  reconcile:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconcile retained machine second-desk, crop, and duplicate custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          node --check "$SCRIPT"
          node "$SCRIPT" \
            --head "$AUTHORIZED_HEAD" \
            --out "$OUT" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/COLLECT-011-amortized-portrait-summary.json
          test "$(node -p "require('./$OUT').denominator.residual_portrait_packets_reviewed")" = "4"
          test "$(node -p "require('./$OUT').denominator.authorized")" = "4"
          test "$(node -p "require('./$OUT').denominator.blocked")" = "0"
          test "$(node -p "require('./$OUT').denominator.complete_pair_adoptions")" = "2"
          test "$(node -p "require('./$OUT').denominator.missing_both_reductions")" = "2"
          test "$(node -p "require('./$OUT').denominator.expected_cumulative_after_adoption")" = "54"
          test "$(node -p "require('./$OUT').denominator.expected_remaining_after_adoption")" = "1"
          test "$(node -p "require('./$OUT').quality_effect_if_adopted.complete_pairs")" = "2"
          test "$(node -p "require('./$OUT').quality_effect_if_adopted.missing_portrait")" = "-4"
          test "$(node -p "require('./$OUT').quality_effect_if_adopted.missing_both")" = "-2"
          test "$(node -p "require('./$OUT').correction.evidence_standard_changed")" = "false"
          test "$(node -p "require('./$OUT').boundary.canonical_mutation")" = "false"

      - name: Stage immutable reconciliation and retire script
        run: |
          set -euo pipefail
          git rm "$SCRIPT"
          git add -- "$OUT"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' "$OUT" "$SCRIPT" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-011-amortized-portrait.tree

      - name: Run repository gate without redundant rendered-browser pass
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-011-amortized-portrait.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs
          test "$(node -p "require('./$OUT').authorized_obligations.length")" = "4"
          test "$(node -p "require('./$OUT').blocked_obligations.length")" = "0"

      - name: Publish exact residual portrait ruling under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: reconcile retained amortized portrait reviews' \
            -m 'transaction=COLLECT-011' \
            -m 'reviewed=4' \
            -m 'authorized=4' \
            -m 'blocked=0' \
            -m 'complete_pair_adoptions=2' \
            -m 'missing_both_reductions=2' \
            -m 'expected_cumulative_after_adoption=54' \
            -m 'expected_remaining_after_adoption=1' \
            -m 'evidence_standard_changed=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-011-amortized-portrait.tree)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report residual portrait authorization
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-011 passed and published on workflow run $GITHUB_RUN_ID.

          The four amortized portrait packets already contained accepted independent machine adjudication, deterministic crop receipts, and clean duplicate scans. The prior classifier incorrectly required a human-only top-level flag and incorrectly treated two missing opposite sides as blockers.

          ```text
          ruling head:               ${{ steps.publish.outputs.head }}
          portrait packets reviewed: 4
          authorized:                4
          blocked:                   0
          complete pairs gained:     2
          missing-both reductions:   2
          expected cumulative:      54 / 55
          expected remaining:        1
          canonical mutation:    false
          ```
          EOF_COMMENT

      - name: Report failed reconciliation
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-011 residual portrait reconciliation failed closed on workflow run ${GITHUB_RUN_ID}. No four-object authorization or canonical payment claim is valid."

      - name: Preserve exact reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-011-amortized-portrait-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-011-amortized-portrait-summary.json
            /tmp/COLLECT-011-amortized-portrait.tree
            data/review/estate-debt/COLLECT-011-AMORTIZED-PORTRAIT-RULING.json
          if-no-files-found: warn
          retention-days: 30
