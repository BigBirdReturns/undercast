name: doctor-who-cycle-009-dan-starkey-portrait-derivative-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-derivative-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 2a29ca99a3cd1a455cd20ce6195076162c918edc
      BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1
      SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1.yml
      OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      WALL_ID: UC-1354
      CENSUS_RUN: "31244293433"
      CENSUS_JOB: "93070219637"
      CENSUS_ARTIFACT: "9018028903"
      CENSUS_ARTIFACT_DIGEST: sha256:a81051bf0bbe82db3c81e07dbd2a3d76323f3211ef15b9a68bac822b40149e1f
      CENSUS_RECEIPT_IDENTITY: 6364c7659f295f69c134b7d851e882fdee7ba86ac32f376164956ddf78a8072e
      COMMONS_CENSUS_IDENTITY: 52b0837f3dbf7e4e891980435f1018329eebfe91c5b4481c6416091bf9a4c40f
      SELECTED_INDEX: "6"
      SELECTED_TITLE: File:Dan Starkey (27471533276).jpg
      SELECTED_THUMBNAIL_SHA256: 5284ca8a6a4b353d8be0515c81cbf8b685d5de4a47ec6c3e1ab4cf430c2e3021
      SELECTED_ORIGINAL_SHA1: 6eb18e588e68256cad5ca2cadd58b102665faa94
      SELECTED_FILE_PAGE: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path derivative qualifier and successful census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,census,receipt,work}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CENSUS_RUN" > "$OUT/api/census-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$CENSUS_JOB" > "$OUT/api/census-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CENSUS_ARTIFACT" > "$OUT/api/census-artifact.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          pr = json.loads((root / "api/pr.json").read_text())
          files = json.loads((root / "api/files.json").read_text())
          run = json.loads((root / "api/census-run.json").read_text())
          job = json.loads((root / "api/census-job.json").read_text())
          artifact = json.loads((root / "api/census-artifact.json").read_text())
          assert pr["number"] == int(os.environ["PR"])
          assert pr["state"] == "open" and pr["draft"] is True and pr["merged"] is False
          assert pr["base"]["sha"] == os.environ["EXACT_MAIN"]
          assert pr["head"]["ref"] == os.environ["BRANCH"] and pr["head"]["sha"] == os.environ["HEAD"]
          assert pr["commits"] == 1 and pr["changed_files"] == 1
          assert len(files) == 1 and files[0]["filename"] == os.environ["SELF"] and files[0]["status"] == "added"
          assert run["id"] == int(os.environ["CENSUS_RUN"])
          assert run["head_sha"] == "ac25d30e48232d45708e9799553b26df56e77653"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert job["id"] == int(os.environ["CENSUS_JOB"]) and job["run_id"] == run["id"]
          assert job["status"] == "completed" and job["conclusion"] == "success"
          assert artifact["id"] == int(os.environ["CENSUS_ARTIFACT"])
          assert artifact["expired"] is False and artifact["digest"] == os.environ["CENSUS_ARTIFACT_DIGEST"]
          assert artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == run["head_sha"]
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"

      - name: Rehydrate and independently verify the exact census packet
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CENSUS_ARTIFACT/zip" > "$OUT/census.zip"
          test "$(sha256sum "$OUT/census.zip" | cut -d' ' -f1)" = "${CENSUS_ARTIFACT_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["ROOT"])
          target = root / "census"
          with zipfile.ZipFile(root / "census.zip") as archive:
              names = archive.namelist()
              assert len(names) == len(set(names))
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  if not info.is_dir():
                      destination = target / path
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(archive.read(info))
          prefix = "/tmp/doctor-who-cycle-009-dan-starkey-portrait-census-v2/receipt/"
          ledger = (target / "SHA256SUMS.pre").read_text().splitlines()
          assert len(ledger) == 29
          for line in ledger:
              digest, original = line.split(None, 1)
              original = original.lstrip("*")
              assert original.startswith(prefix)
              path = target / original[len(prefix):]
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == digest
          assert hashlib.sha256((target / "SHA256SUMS.pre").read_bytes()).hexdigest() == (target / "SHA256SUMS").read_text().split()[0]
          receipt = json.loads((target / "census-receipt.json").read_text())
          census = json.loads((target / "commons-census.json").read_text())
          assert receipt["identity"] == os.environ["CENSUS_RECEIPT_IDENTITY"]
          assert census["identity"] == os.environ["COMMONS_CENSUS_IDENTITY"]
          assert receipt["status"] == "dan-starkey-commons-portrait-census-complete"
          assert receipt["category_file_count"] == census["file_count"] == 16
          assert receipt["license_and_origin_compatible_count"] == 12
          selected = [row for row in census["files"] if row["index"] == int(os.environ["SELECTED_INDEX"])]
          assert len(selected) == 1
          row = selected[0]
          assert row["title"] == os.environ["SELECTED_TITLE"]
          assert row["file_page"] == os.environ["SELECTED_FILE_PAGE"]
          assert row["thumbnail_sha256"] == os.environ["SELECTED_THUMBNAIL_SHA256"]
          assert row["original_sha1_base36"] == os.environ["SELECTED_ORIGINAL_SHA1"]
          assert row["original_width"] == 5616 and row["original_height"] == 3744
          assert row["original_mime"] == "image/jpeg"
          assert row["license_short_name"] == "CC BY-SA 2.0"
          assert row["license_url"] == "https://creativecommons.org/licenses/by-sa/2.0"
          assert "Gage Skidmore" in row["artist"]
          assert row["admissible_license_candidate"] is True and row["canonical_origin_match"] is False
          (root / "work/selected.json").write_text(json.dumps(row, indent=2, sort_keys=True) + "\n")
          (root / "receipt/selected-thumbnail.jpg").write_bytes((target / "images" / row["thumbnail_file"]).read_bytes())
          (root / "receipt/census-contact-sheet.jpg").write_bytes((target / "contact-sheet.jpg").read_bytes())
          PY

      - name: Revalidate canonical gates and fetch exact selected original
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/receipt/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/receipt/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/receipt/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/receipt/media-gate.log"
          jq -e '.total==316 and .statuses.queued==308 and .statuses.resolved==8 and .in_flight==0' "$OUT/receipt/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline.json" >/dev/null
          ROOT="$OUT" python3 - <<'PY'
          import email.utils, hashlib, json, os, time
          import urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          selected = json.loads((root / "work/selected.json").read_text())
          headers = {"User-Agent": "Undercast Dan Starkey selected portrait qualifier/1.0 (read-only; paced)"}
          events = []
          def retry_after(error, fallback):
              value = error.headers.get("Retry-After") if getattr(error, "headers", None) else None
              if value:
                  try: return max(float(value), fallback)
                  except ValueError:
                      try: return max(email.utils.parsedate_to_datetime(value).timestamp() - time.time(), fallback)
                      except Exception: pass
              return fallback
          def fetch(url, label):
              for attempt in range(1, 10):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=240) as response:
                          return response.read(), response.headers.get_content_type()
                  except urllib.error.HTTPError as error:
                      if error.code not in {429, 500, 502, 503, 504} or attempt == 9: raise
                      wait = min(120.0, retry_after(error, min(90.0, 4.0 * (2 ** (attempt - 1)))))
                      events.append({"label":label,"attempt":attempt,"status":error.code,"wait_seconds":wait})
                      time.sleep(wait)
                  except OSError as error:
                      if attempt == 9: raise
                      wait = min(90.0, 3.0 * (2 ** (attempt - 1)))
                      events.append({"label":label,"attempt":attempt,"error":type(error).__name__,"wait_seconds":wait})
                      time.sleep(wait)
              raise AssertionError("unreachable")
          data, content_type = fetch(selected["original_url"], "selected-original")
          assert content_type == "image/jpeg" and len(data) > 500000
          assert hashlib.sha1(data).hexdigest() == os.environ["SELECTED_ORIGINAL_SHA1"]
          (root / "work/original.jpg").write_bytes(data)
          (root / "receipt/original-fetch-retries.json").write_text(json.dumps(events, indent=2, sort_keys=True) + "\n")
          PY
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
          convert "$OUT/work/original.jpg" -auto-orient -gravity center -crop '70%x100%+0+0' +repage -resize '420x600^' -gravity center -extent 420x600 -strip -quality 88 -interlace Plane "$OUT/receipt/uc-1354-portrait.jpg"
          identify "$OUT/work/original.jpg" > "$OUT/receipt/original-identify.txt"
          identify "$OUT/receipt/uc-1354-portrait.jpg" > "$OUT/receipt/derivative-identify.txt"

      - name: Prove derivative novelty and seal qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          selected = json.loads((root / "work/selected.json").read_text())
          original = (root / "work/original.jpg").read_bytes()
          derivative = (root / "receipt/uc-1354-portrait.jpg").read_bytes()
          manifest = json.loads(Path("data/media-manifest.json").read_text())
          canonical_hashes = {row.get("sha256") for row in manifest.get("assets", {}).values() if row.get("sha256")}
          inventory = json.loads((root / "census/canonical-inventory.json").read_text())
          derivative_sha = hashlib.sha256(derivative).hexdigest()
          original_sha = hashlib.sha256(original).hexdigest()
          assert derivative_sha not in canonical_hashes
          assert derivative_sha not in set(inventory["verified_portrait_asset_sha256"])
          assert derivative_sha != selected["thumbnail_sha256"] and original_sha != selected["thumbnail_sha256"]
          identify = (root / "receipt/derivative-identify.txt").read_text()
          assert re.search(r"JPEG 420x600(?: |$)", identify)
          receipt = {
              "version": 1,
              "status": "dan-starkey-portrait-derivative-qualified",
              "canonical_main": os.environ["EXACT_MAIN"],
              "run": int(os.environ["GITHUB_RUN_ID"]),
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "carrier_pr": int(os.environ["CARRIER_PR"]),
              "carrier_head": os.environ["CARRIER_HEAD"],
              "census_run": int(os.environ["CENSUS_RUN"]),
              "census_job": int(os.environ["CENSUS_JOB"]),
              "census_artifact": int(os.environ["CENSUS_ARTIFACT"]),
              "census_artifact_digest": os.environ["CENSUS_ARTIFACT_DIGEST"],
              "task_id": os.environ["TASK_ID"],
              "source_fingerprint": os.environ["SOURCE_FINGERPRINT"],
              "wall_id": os.environ["WALL_ID"],
              "performer": "Dan Starkey",
              "selected_index": int(os.environ["SELECTED_INDEX"]),
              "selected_title": selected["title"],
              "selected_file_page": selected["file_page"],
              "selection_basis": "Single-person panel photograph with an unobstructed face and a clean deterministic center crop; subject naming comes from Commons metadata, not facial inference.",
              "license": selected["license_short_name"],
              "license_url": selected["license_url"],
              "author": selected["artist"],
              "original_sha1": hashlib.sha1(original).hexdigest(),
              "original_sha256": original_sha,
              "original_bytes": len(original),
              "derivative_path": "images/uc-1354-portrait.jpg",
              "derivative_sha256": derivative_sha,
              "derivative_bytes": len(derivative),
              "derivative_width": 420,
              "derivative_height": 600,
              "derivative_distinct_from_all_manifest_assets": True,
              "visual_review_pending": True,
              "adopted": False,
              "queue_mutated": False,
              "lease_issued": False,
              "canonical_record_created": False,
              "media_adopted": False,
              "repository_write": False,
              "outside_human_dependency": False,
              "owner_physical_action_required": False,
              "next_gate": "independent exact-derivative visual review, then portrait-bearing candidate rematerialization",
          }
          receipt["identity"] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          (root / "receipt/derivative-qualification.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          (root / "receipt/original.jpg").write_bytes(original)
          (root / "receipt/selected-metadata.json").write_text(json.dumps(selected, indent=2, sort_keys=True) + "\n")
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-derivative-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-derivative-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-derivative-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
