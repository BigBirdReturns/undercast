name: doctor-who-cycle-011-rastel-final-product-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-product-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-product-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      EXACT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v1
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-product-v1-worktree
      FINALWT: /tmp/doctor-who-cycle-011-rastel-final-product-v1-final
      CONTROL: /tmp/doctor-who-cycle-011-rastel-final-product-v1-control
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      CANDIDATE_PR: "764"
      CANDIDATE_HEAD: 5cb7aa31683e93be66cda1e183f952b247660cf1
      CANDIDATE_RUN: "31333047499"
      CANDIDATE_JOB: "93294232952"
      CANDIDATE_ARTIFACT: "9043522453"
      CANDIDATE_ZIP_SHA256: 9ddec6d920d2a443ce0d495b6cfd6d7327d6036c0594757773569b97b032ad49
      CANDIDATE_RECEIPT_ID: 180ad04ea2288e0f3f99b59991d90b35c6fcc8d640c18fd9af33dbb250082626
      CANDIDATE_REPAIR_IDENTITY: 4080051f3dec29207d0b9e99857ca616c00964f3c53e1fc610da139c27748b4d
      CANDIDATE_COMMIT: 244def71baddd9bdf4591384438b041894d868a1
      CANDIDATE_TREE: 237226254d6ab45b796b7dbf427f4ac21d765d92
      CANDIDATE_PATHS_SHA256: ed6a06dee98e62a676235f7b1381a59d460a315526cd2ca8e06f990f9ecc9a9a
      CANDIDATE_BUNDLE_SHA256: 73845e2a6f6267257df53151ebca198c7f75b4ffdc69468cd201f5b0454ae2fd
      CANDIDATE_PATCH_SHA256: 3b91b402786e56ad4efb3d70aa2996bc0d3dbc4a338b66a904d96f192f9f19d7
      CANDIDATE_TAR_SHA256: 4f7848127b48071c32f0ed1fc9786fb3c1200ac6135559bf6dddfb3f30af8059
      CANDIDATE_FILE_MANIFEST_SHA256: ca1f0ac0a7cf3e50ff4309979ecd4c5c9625719726fee6adac9cc1f300164815
      CANDIDATE_DELTA_MANIFEST_SHA256: 68756591458f0df50533c0b4ded7980cbdd7549eb3a76bc1b52a950134a9f369
      CANDIDATE_PATH_POLICY_SHA256: f29da4fb85d521d518faff40fea84e5da9f430bdb1f401933f90b9b66ac57d29

      REVIEW_PR: "769"
      REVIEW_HEAD: adf8c15998a7875d7e0f89dc6fb635f0b279f4bd
      REVIEW_RUN: "31333965266"
      REVIEW_JOB: "93296608849"
      REVIEW_ARTIFACT: "9043779188"
      REVIEW_ZIP_SHA256: 515a3bac54cb6413c5fc4e949b12d3c1ee5ff46fc0188a8a9db8d61d95811385
      REVIEW_IDENTITY: b236fa93c5e5c9b240109644586bbe8115a1c04b807c429766a53559addc48ae

      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      SOURCE_URL: https://tardis.fandom.com/wiki/Rastel
      SOURCE_CONTENT_SHA256: 740bc0ffb8732261d1df15661aa4e193c7a7f8d94aa96f96ac92c02e41ce8776
      SOURCE_FINGERPRINT: 2820ee1220f02ce8499d25e6b4335dba9b28e1bef4fab8e020ca1535679177d7
      PORTRAIT_PATH: images/uc-1356-portrait.jpg
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27229445610).jpg
      REVIEWED_AT: "2026-08-09T20:30:00Z"
      COMMIT_AT: "2026-08-09T20:35:00Z"

      SOURCE_V3_B64_SHA256: 3bd60a97b181fb8c89482a6ddb282fe9fe70163618e7086540d27e2aae174eac
      SOURCE_V3_GZIP_SHA256: 5e4b5aca1cbc246f93218608a29f1e116b72b860d50ea7dc62121c8015ef1d3b
      SOURCE_V3_BYTES: "35695"
      SOURCE_V3_SHA256: 9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507
      SOURCE_V4_BYTES: "35745"
      SOURCE_V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c
      RUNNER_BLOB: 6b7c0e704e98bc8e09fe04370bc651d18f9f1059
      RUNNER_GZIP_SHA256: af9f3750e733014366c500e897f489b5890f84dd4e1df81f37544eb9cad8ec06
      RUNNER_BYTES: "37253"
      RUNNER_SHA256: d3ba480e79f0fd431d612edd968518e2460351076fcbf6554b08b4941c20de9a
      DERIVATION_PATCH_BYTES: "50728"
      DERIVATION_PATCH_SHA256: 77138f74e7e4963c20d5736d80dcbeb9713e16011f4bf87c628b53dca7c1632d

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct exact source and receipt-bearing Rastel finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          : > "$CONTROL/source-v3.sh.gz.b64"
          for blob in b3ed61546b72f43d24295e47564128353a9fe18a 62276da5eb96b0a6b41d1aa723642ad14c2dd961 ae55ce9299b827a4c2ba73160815afed74fd12ce 556aca3fb73c230a0cde77a04c1429e1fb674d60 a5f0e05ae94a59f9e8ce13fb0ed17598a91f5712 24c47d32727787c4919da04bd1c1544b6709f80b 9e5c656dbd2555e6631eef97bf8b74fa49a67cff; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$CONTROL/source-v3.sh.gz.b64"
          done
          test "$(sha256sum "$CONTROL/source-v3.sh.gz.b64" | awk '{print $1}')" = "$SOURCE_V3_B64_SHA256"
          base64 -d "$CONTROL/source-v3.sh.gz.b64" > "$CONTROL/source-v3.sh.gz"
          test "$(sha256sum "$CONTROL/source-v3.sh.gz" | awk '{print $1}')" = "$SOURCE_V3_GZIP_SHA256"
          gzip -dc "$CONTROL/source-v3.sh.gz" > "$CONTROL/source-v3.sh"
          test "$(wc -c < "$CONTROL/source-v3.sh" | tr -d ' ')" = "$SOURCE_V3_BYTES"
          test "$(sha256sum "$CONTROL/source-v3.sh" | awk '{print $1}')" = "$SOURCE_V3_SHA256"
          cp "$CONTROL/source-v3.sh" "$CONTROL/source-v4.sh"
          SOURCE="$CONTROL/source-v4.sh" python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          path=Path(os.environ['SOURCE']); text=path.read_text()
          old='  test "$(git diff --name-only "$CANDIDATE_COMMIT" | sort)" = "$CLOSURE_PATHS"\n'
          new='  test "$({ git diff --name-only "$CANDIDATE_COMMIT"; git ls-files --others --exclude-standard; } | sort -u)" = "$CLOSURE_PATHS"\n'
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          data=path.read_bytes()
          assert len(data)==int(os.environ['SOURCE_V4_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['SOURCE_V4_SHA256']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CONTROL/runner.sh.gz"
          test "$(sha256sum "$CONTROL/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$CONTROL/runner.sh.gz" > "$CONTROL/runner.sh"
          test "$(wc -c < "$CONTROL/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$CONTROL/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          diff -u "$CONTROL/source-v4.sh" "$CONTROL/runner.sh" > "$CONTROL/derivation.patch" || test "$?" = 1
          test "$(wc -c < "$CONTROL/derivation.patch" | tr -d ' ')" = "$DERIVATION_PATCH_BYTES"
          test "$(sha256sum "$CONTROL/derivation.patch" | awk '{print $1}')" = "$DERIVATION_PATCH_SHA256"
          bash -n "$CONTROL/runner.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-final-product-v1-control/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<rastel-finalizer-{index}>','exec')
          assert 'DOCTOR-WHO-CYCLE-011-RASTEL' in text
          assert 'doctor-who-cycle-010-composability-v1.json' in text
          assert 'scripts/doctor-who-cycle-010-historical.mjs' in text
          assert 'cycle_012_authorized' in text and 'twelfth_lease_issued' in text
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['CONTROL'])
          receipt={
            'version':1,
            'status':'cycle-011-rastel-finalizer-derived',
            'source':{'v3_bytes':int(os.environ['SOURCE_V3_BYTES']),'v3_sha256':os.environ['SOURCE_V3_SHA256'],'v4_bytes':int(os.environ['SOURCE_V4_BYTES']),'v4_sha256':os.environ['SOURCE_V4_SHA256']},
            'finalizer':{'blob':os.environ['RUNNER_BLOB'],'gzip_sha256':os.environ['RUNNER_GZIP_SHA256'],'bytes':int(os.environ['RUNNER_BYTES']),'sha256':os.environ['RUNNER_SHA256']},
            'derivation_patch':{'bytes':int(os.environ['DERIVATION_PATCH_BYTES']),'sha256':os.environ['DERIVATION_PATCH_SHA256']},
            'candidate':{'pr':int(os.environ['CANDIDATE_PR']),'commit':os.environ['CANDIDATE_COMMIT'],'tree':os.environ['CANDIDATE_TREE'],'paths':38,'receipt_identity':os.environ['CANDIDATE_RECEIPT_ID']},
            'review':{'pr':int(os.environ['REVIEW_PR']),'identity':os.environ['REVIEW_IDENTITY']},
            'boundary':{'repository_write':False,'product_published':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'derivation.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute exact receipt-bearing Rastel finalizer
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$CONTROL/runner.sh"
          bash "$CONTROL/runner.sh"
          cp "$CONTROL/derivation.json" "$OUT/final/finalizer-derivation.json"
          cp "$CONTROL/derivation.patch" "$OUT/final/finalizer-derivation.patch"
          (
            cd "$OUT/final"
            find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
          )
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v1
            /tmp/doctor-who-cycle-011-rastel-final-product-v1-control
            /tmp/doctor-who-cycle-011-rastel-final-product-v1-worktree
            /tmp/doctor-who-cycle-011-rastel-final-product-v1-final
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
