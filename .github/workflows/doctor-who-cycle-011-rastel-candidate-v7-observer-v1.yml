name: doctor-who-cycle-011-rastel-candidate-v7-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v7-observer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v7-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v7-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v7-observer-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-v7-observer-v1.yml
      REVIEW: /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1-packet
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1-worktree
      V7_PR: "762"
      V7_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v7-current-main
      V7_WORKFLOW: doctor-who-cycle-011-rastel-candidate-v7-current-main
      V7_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-candidate-v7-current-main-
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind observer geometry and wait for exact V7 terminal run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REVIEW" "$PACKET" "$WORKTREE"
          mkdir -p "$REVIEW"/{api,logs,receipt} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$REVIEW/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V7_PR" > "$REVIEW/api/v7-pr.json"
          OBSERVER_PR="$pr" OBSERVER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['REVIEW'])/'api'
          own=json.loads((api/'observer-pr.json').read_text())
          v7=json.loads((api/'v7-pr.json').read_text())
          assert own['number']==int(os.environ['OBSERVER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['OBSERVER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v7['number']==int(os.environ['V7_PR']) and v7['state']=='open' and v7['draft'] is True and v7['merged'] is False
          assert v7['base']['sha']==os.environ['CURRENT_BASE'] and v7['head']['ref']==os.environ['V7_BRANCH']
          (api/'v7-head.txt').write_text(v7['head']['sha']+'\n')
          PY
          v7_head="$(cat "$REVIEW/api/v7-head.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$V7_BRANCH" -f event=pull_request -f per_page=100 > "$REVIEW/api/v7-runs.json"
            run_id="$(V7_HEAD="$v7_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['REVIEW'])/'api/v7-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['V7_HEAD'] and row['name']==os.environ['V7_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$REVIEW/api/v7-run.json"
              status="$(jq -r '.status' "$REVIEW/api/v7-run.json")"
              if [ "$status" = completed ]; then
                break
              fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$REVIEW/api/v7-run.json")" = completed
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$REVIEW/api/v7-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$REVIEW/api/v7-artifacts.json"
          jq -r '.jobs[] | [.id,.name,.status,.conclusion] | @tsv' "$REVIEW/api/v7-jobs.json" > "$REVIEW/logs/v7-jobs.tsv"
          while IFS=$'\t' read -r job_id job_name job_status job_conclusion; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$REVIEW/logs/job-$job_id.log" || true
          done < "$REVIEW/logs/v7-jobs.tsv"
          conclusion="$(jq -r '.conclusion' "$REVIEW/api/v7-run.json")"
          printf 'OBSERVER_PR=%s\nOBSERVER_HEAD=%s\nCURRENT_BASE=%s\nV7_HEAD=%s\nV7_RUN=%s\nV7_CONCLUSION=%s\n' "$pr" "$head" "$base" "$v7_head" "$run_id" "$conclusion" >> "$GITHUB_ENV"
          if [ "$conclusion" != success ]; then
            V7_RUN="$run_id" V7_HEAD="$v7_head" V7_CONCLUSION="$conclusion" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['REVIEW'])
          receipt={
              'status':'cycle-011-rastel-v7-terminal-failure-retained',
              'version':1,
              'v7':{'pr':int(os.environ['V7_PR']),'head':os.environ['V7_HEAD'],'run':int(os.environ['V7_RUN']),'conclusion':os.environ['V7_CONCLUSION']},
              'jobs':(root/'logs/v7-jobs.tsv').read_text().splitlines(),
              'boundary':{'candidate_approved':False,'canonical_mutation':False,'product_publication':False,'cycle_receipt_written':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/terminal.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
            exit 1
          fi

      - name: Download and independently authenticate successful candidate packet
        shell: bash
        run: |
          set -euo pipefail
          V7_ARTIFACT="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['REVIEW'])/'api/v7-artifacts.json').read_text())['artifacts']
          expected=os.environ['V7_ARTIFACT_PREFIX']+os.environ['V7_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1, [(row['id'],row['name']) for row in rows]
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT" > "$REVIEW/api/v7-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V7_ARTIFACT/zip" > "$REVIEW/v7.zip"
          V7_ZIP_SHA256="$(sha256sum "$REVIEW/v7.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$REVIEW/api/v7-artifact.json")" = "sha256:$V7_ZIP_SHA256"
          V7_ARTIFACT="$V7_ARTIFACT" V7_ZIP_SHA256="$V7_ZIP_SHA256" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          review=Path(os.environ['REVIEW']); packet=Path(os.environ['PACKET'])
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(review/'v7.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir(): continue
                  out=packet/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger_results=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file(): continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              root=sealed.parent
              count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip(): continue
                  digest,name=raw.split(None,1); path=root/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest
                  count+=1
              ledger_results.append({'root':root.relative_to(packet).as_posix(),'rows':count,'ledger_sha256':sha(pre.read_bytes())})
          assert ledger_results, 'no complete internal checksum ledger found'
          json_rows=[]
          for path in packet.rglob('*.json'):
              if path.stat().st_size>20_000_000: continue
              try: data=json.loads(path.read_text())
              except Exception: continue
              flat=json.dumps(data,sort_keys=True,ensure_ascii=False)
              score=0
              if os.environ['TASK_ID'] in flat: score+=8
              if os.environ['WALL_ID'] in flat: score+=8
              if 'Rastel' in flat: score+=4
              if 'candidate' in flat.lower(): score+=4
              if '305' in flat and '11' in flat: score+=2
              if score:
                  json_rows.append({'path':path.relative_to(packet).as_posix(),'score':score,'sha256':sha(path.read_bytes()),'bytes':path.stat().st_size})
          json_rows.sort(key=lambda row:(-row['score'],row['path']))
          assert json_rows and json_rows[0]['score']>=20, json_rows[:10]
          files=[p for p in packet.rglob('*') if p.is_file()]
          bundles=[p for p in files if p.suffix=='.bundle']
          assert bundles, 'candidate Git bundle absent'
          census={
              'artifact':{'id':int(os.environ['V7_ARTIFACT']),'sha256':os.environ['V7_ZIP_SHA256'],'files':len(files)},
              'ledgers':ledger_results,
              'candidate_json':json_rows[:25],
              'bundles':[{'path':p.relative_to(packet).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in bundles],
              'archives':[{'path':p.relative_to(packet).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in files if p.name.endswith(('.tar.gz','.tgz'))],
              'patches':[{'path':p.relative_to(packet).as_posix(),'bytes':p.stat().st_size,'sha256':sha(p.read_bytes())} for p in files if p.suffix=='.patch'],
          }
          (review/'receipt/packet-census.json').write_text(json.dumps(census,indent=2,sort_keys=True)+'\n')
          PY
          printf 'V7_ARTIFACT=%s\nV7_ZIP_SHA256=%s\n' "$V7_ARTIFACT" "$V7_ZIP_SHA256" >> "$GITHUB_ENV"

      - name: Import candidate bundle and verify independent semantic state
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' bundles < <(find "$PACKET" -type f -name '*.bundle' -print0)
          test "${#bundles[@]}" -ge 1
          : > "$REVIEW/logs/bundle-heads.tsv"
          for bundle in "${bundles[@]}"; do
            git bundle verify "$bundle" 2>&1 | tee -a "$REVIEW/logs/bundle-verify.log"
            git bundle list-heads "$bundle" | while read -r sha ref; do
              printf '%s\t%s\t%s\n' "$sha" "$ref" "$bundle" >> "$REVIEW/logs/bundle-heads.tsv"
              git fetch --no-tags "$bundle" "$sha:refs/v7-observer/$sha"
            done
          done
          CANDIDATE="$(python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          rows=[]
          for raw in (Path(os.environ['REVIEW'])/'logs/bundle-heads.tsv').read_text().splitlines():
              sha,ref,bundle=raw.split('\t',2)
              if sha in {os.environ['SOURCE_MAIN'],os.environ['CURRENT_BASE']}: continue
              parents=subprocess.check_output(['git','show','-s','--format=%P',sha],text=True).strip().split()
              if len(parents)!=1: continue
              try:
                  grep=subprocess.run(['git','grep','-q',os.environ['TASK_ID'],sha,'--','data','docs','scripts'],check=False)
              except Exception:
                  continue
              if grep.returncode==0:
                  rows.append((sha,ref,bundle,parents[0]))
          unique={row[0]:row for row in rows}
          assert len(unique)==1, rows
          print(next(iter(unique)))
          PY
          )"
          PARENT="$(git show -s --format=%P "$CANDIDATE")"
          test "$(git rev-list --count "$PARENT".."$CANDIDATE")" = 1
          test -z "$(git rev-list --merges "$PARENT".."$CANDIDATE")"
          if [ "$PARENT" = "$SOURCE_MAIN" ]; then
            git merge-base --is-ancestor "$SOURCE_MAIN" "$CURRENT_BASE"
            test -z "$(git diff --name-only "$SOURCE_MAIN...$CURRENT_BASE")"
          else
            test "$PARENT" = "$CURRENT_BASE"
          fi
          git diff --name-status "$PARENT" "$CANDIDATE" > "$REVIEW/logs/candidate-name-status.tsv"
          test -s "$REVIEW/logs/candidate-name-status.tsv"
          test -z "$(awk '$1 ~ /^D/ {print}' "$REVIEW/logs/candidate-name-status.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$REVIEW/logs/candidate-name-status.tsv")"
          path_count="$(wc -l < "$REVIEW/logs/candidate-name-status.tsv" | tr -d ' ')"
          test "$path_count" -ge 25
          test "$path_count" -le 65
          git worktree add --detach "$WORKTREE" "$CANDIDATE"
          cd "$WORKTREE"
          npm ci
          node scripts/autopilot.mjs validate | tee "$REVIEW/logs/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$REVIEW/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$REVIEW/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$REVIEW/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$REVIEW/logs/media-gate.log"
          grep -F '22/22 complete' "$REVIEW/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$REVIEW/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$REVIEW/receipt/waterline-status.json"
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          git grep -q "$TASK_ID" "$CANDIDATE" -- data docs
          test -z "$(git status --porcelain)"
          tree="$(git show -s --format=%T "$CANDIDATE")"
          CANDIDATE="$CANDIDATE" CANDIDATE_PARENT="$PARENT" CANDIDATE_TREE="$tree" PATH_COUNT="$path_count" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['REVIEW'])
          packet=json.loads((root/'receipt/packet-census.json').read_text())
          autopilot=json.loads((root/'receipt/autopilot-status.json').read_text())
          waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          receipt={
              'status':'cycle-011-rastel-v7-candidate-packet-independently-reconstructed-v1',
              'version':1,
              'observer':{'pr':int(os.environ['OBSERVER_PR']),'head':os.environ['OBSERVER_HEAD']},
              'producer':{'pr':int(os.environ['V7_PR']),'head':os.environ['V7_HEAD'],'run':int(os.environ['V7_RUN']),'artifact':int(os.environ['V7_ARTIFACT']),'artifact_sha256':os.environ['V7_ZIP_SHA256']},
              'candidate':{'commit':os.environ['CANDIDATE'],'parent':os.environ['CANDIDATE_PARENT'],'tree':os.environ['CANDIDATE_TREE'],'paths':int(os.environ['PATH_COUNT']),'task':os.environ['TASK_ID'],'wall':os.environ['WALL_ID'],'portrait_sha256':os.environ['PORTRAIT_SHA256']},
              'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},
              'packet_census':packet,
              'gates':{'bundle_verify':True,'one_parent':True,'workflow_free':True,'deletion_free':True,'autopilot':True,'media_22_of_22':True,'waterline_validate':True,'portrait_exact':True,'clean_reconstruction':True},
              'waterline':waterline,
              'boundary':{'candidate_only':True,'canonical_mutation':False,'product_publication':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          (root/'receipt/review.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          printf 'CANDIDATE=%s\nCANDIDATE_PARENT=%s\nCANDIDATE_TREE=%s\nPATH_COUNT=%s\n' "$CANDIDATE" "$PARENT" "$tree" "$path_count" >> "$GITHUB_ENV"

      - name: Seal independent observer packet
        shell: bash
        run: |
          set -euo pipefail
          find "$REVIEW" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$REVIEW/$rel" | sed "s#  $REVIEW/#  #"; done > "$REVIEW/SHA256SUMS.pre"
          sha256sum "$REVIEW/SHA256SUMS.pre" | sed "s#  $REVIEW/#  #" > "$REVIEW/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['REVIEW']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v7-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v7-observer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1
            /tmp/doctor-who-cycle-011-rastel-candidate-v7-observer-v1-packet
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
