name: observe-star-trek-cycle-v4

on:
  push:
    branches:
      - agent/observe-star-trek-cycle-v4

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/star-trek-maryl-cycle-v4
      TARGET_HEAD: 7c0490eae87140abadaa00655865f381f020e746
      TARGET_WORKFLOW: star-trek-maryl-cycle-v4
      RESULT_BRANCH: agent/observe-star-trek-cycle-v4-result
      ROOT: /tmp/observe-star-trek-cycle-v4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observe target run to terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          run=''
          for _ in $(seq 1 300); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=100")"
            run="$(jq -c --arg sha "$TARGET_HEAD" --arg name "$TARGET_WORKFLOW" '.workflow_runs | map(select(.head_sha==$sha and .name==$name)) | sort_by(.created_at) | last // empty' <<<"$runs")"
            if test -n "$run" && test "$(jq -r .status <<<"$run")" = completed; then break; fi
            sleep 10
          done
          test -n "$run"
          test "$(jq -r .status <<<"$run")" = completed
          run_id="$(jq -r .id <<<"$run")"
          printf '%s\n' "$run" | jq . > "$ROOT/run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$ROOT/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$ROOT/artifacts.json"
          gh api "/repos/${GITHUB_REPOSITORY}/commits/main" > "$ROOT/main.json"
          jq -n \
            --arg status found \
            --argjson run_id "$run_id" \
            --arg run_status "$(jq -r .status <<<"$run")" \
            --arg conclusion "$(jq -r .conclusion <<<"$run")" \
            --arg target_head "$TARGET_HEAD" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg main_sha "$(jq -r .sha "$ROOT/main.json")" \
            --arg main_message "$(jq -r .commit.message "$ROOT/main.json")" \
            '{status:$status,run_id:$run_id,run_status:$run_status,conclusion:$conclusion,target_head:$target_head,target_branch:$target_branch,main_sha:$main_sha,main_message:$main_message}' \
            > "$ROOT/status.json"
      - name: Publish observation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name undercast-observer
          git config user.email undercast-observer@users.noreply.github.com
          git checkout --orphan observation
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p transport/observe-star-trek-cycle-v4
          cp "$ROOT"/*.json transport/observe-star-trek-cycle-v4/
          git add transport/observe-star-trek-cycle-v4
          git commit -m 'Observe Star Trek cycle v4 terminal state'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
