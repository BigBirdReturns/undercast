name: cycle012-v10-writer-source-export-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-v10-writer-source-export-v1.yml"

permissions: {}

concurrency:
  group: cycle012-v10-writer-source-export-v1
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-v10-writer-source-export-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1499ce3281d282bd7e135a362ed6a32755c16ee0
      BRANCH: observer/cycle012-v10-writer-source-export-v1
      SELF: .github/workflows/cycle012-v10-writer-source-export-v1.yml
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      BLOB: b8e3d0b65390c620ac166433ac54539ac0ed4085
      GZIP_BYTES: "4074"
      GZIP_SHA256: 0de68be224bcc06aae678c592ae1f765964eba19987764f1d47ae92b9d39f082
      CARRIER_BYTES: "14316"
      CARRIER_SHA256: 78eed51b30347ed6a73e18d59a6c7c44e6e7f7c149578a5b8aa17bbcf23dcfbe
      OUT: /tmp/cycle012-v10-writer-source-export-v1
    steps:
      - name: Authenticate and export installed V10 writer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload}
          repo="/repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "$repo/pulls/$CURRENT_PR" > "$OUT/api/pr.json"
          gh api "$repo/compare/$MAIN...$CURRENT_HEAD" > "$OUT/api/compare.json"
          PR="$OUT/api/pr.json" COMPARE="$OUT/api/compare.json" python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr=json.loads(Path(os.environ['PR']).read_text())
          compare=json.loads(Path(os.environ['COMPARE']).read_text())
          assert pr['number']==int(os.environ['CURRENT_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert len(compare['files'])==1
          assert compare['files'][0]['filename']==os.environ['SELF'] and compare['files'][0]['status']=='added'
          PY
          gh api "$repo/git/blobs/$BLOB" > "$OUT/api/blob.json"
          jq -r '.content' "$OUT/api/blob.json" | tr -d '\n' | base64 -d > "$OUT/payload/carrier.sh.gz"
          test "$(git hash-object --stdin < "$OUT/payload/carrier.sh.gz")" = "$BLOB"
          test "$(wc -c < "$OUT/payload/carrier.sh.gz" | tr -d ' ')" = "$GZIP_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh.gz" | awk '{print $1}')" = "$GZIP_SHA256"
          gzip -dc "$OUT/payload/carrier.sh.gz" > "$OUT/payload/carrier.sh"
          test "$(wc -c < "$OUT/payload/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$OUT/payload/carrier.sh"
          CARRIER="$OUT/payload/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle012-v10-export-{index}>','exec')
          PY
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])/'payload'
          receipt={
              'status':'cycle012-v10-writer-source-export-complete-v1',
              'version':1,
              'carrier':{'pr':int(os.environ['CURRENT_PR']),'branch':os.environ['BRANCH'],'head':os.environ['CURRENT_HEAD'],'base':os.environ['MAIN']},
              'source':{'blob':os.environ['BLOB'],'gzip_bytes':int(os.environ['GZIP_BYTES']),'gzip_sha256':os.environ['GZIP_SHA256'],'carrier_bytes':int(os.environ['CARRIER_BYTES']),'carrier_sha256':os.environ['CARRIER_SHA256'],'python_blocks':5},
              'boundary':{'source_export_only':True,'writer_executed':False,'repository_write':False,'canonical_mutation':False,'lease_issued':False,'queue_mutated':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'source-export.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'SOURCE_EXPORT_COMPLETE').write_text(receipt['identity']+'\n')
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
          )
      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-v10-writer-source-export-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-v10-writer-source-export-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-v10-writer-source-export-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-v10-writer-source-export-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  retire:
    needs: export
    if: >-
      always() &&
      needs.export.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'observer/cycle012-v10-writer-source-export-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: observer/cycle012-v10-writer-source-export-v1
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Close and delete exact source-export transport
        shell: bash
        run: |
          set -euo pipefail
          repo="/repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          test "$(gh api "$repo/pulls/$CURRENT_PR" --jq '.state')" = open
          gh api -X PATCH "$repo/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "$repo/git/refs/heads/$BRANCH"
