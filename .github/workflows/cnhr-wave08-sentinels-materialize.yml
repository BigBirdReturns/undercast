name: materialize-clifford-number-hr-disciplinary-sentinels-wave-08

on:
  push:
    branches:
      - agent/clifford-number-hr-disciplinary-harm-sentinels-wave-08
    paths:
      - '.github/workflows/cnhr-wave08-sentinels-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnhr-wave08-sentinels-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clifford-number-hr-disciplinary-harm-sentinels-wave-08
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize, validate, and publish exact Wave 08 sentinel packet
        shell: bash
        env:
          PARENT_SHA: 63627f609407da7efbc617332fca8d47cad524ab
          PARENT_MANIFEST_SHA256: ce5fc6a608e142b254a405fe1dea779a939c4cada848313c7325bfe28228b5a0
          PAYLOAD_BYTES: '26204'
          PAYLOAD_SHA256: 743d1fd9bce395fbd39b2dcfdfc778c751add09e93236e7f9036948d31bd5536
          HEAD_REF: agent/clifford-number-hr-disciplinary-harm-sentinels-wave-08
        run: |
          set -euo pipefail

          test "$(git rev-parse origin/main)" = "$PARENT_SHA"

          test "$(wc -c < .cnhr-wave08/chunk-000.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-001.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-002.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-003.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-004.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-005.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-006.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-007.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave08/chunk-008.txt)" -eq 2940

          printf '%s  %s\n' \
            fc71b075284bbaf7805be88e6b95c9c06f6dc33323ff9f3ffda38a2612b6dddf .cnhr-wave08/chunk-000.txt \
            1a25b072442f8899dacfbdbb039dedb8ff6b73239fa80a92576189949bdabb98 .cnhr-wave08/chunk-001.txt \
            098a3a93e4a4a1468b817b533794a6393bbe2d50d219346300ab6061ee27b9bf .cnhr-wave08/chunk-002.txt \
            e08bebe07b10615061df8e06aabb22d87f98a997336dfec5f15db8f177053c04 .cnhr-wave08/chunk-003.txt \
            9fe236b156eaf49403bb263b84fc60d4daca9785cd463544b56222ef585171fc .cnhr-wave08/chunk-004.txt \
            468679c69325798c54c9fe5220fb6f6d3f8eb41f00e9e67607213721748a5533 .cnhr-wave08/chunk-005.txt \
            6092961a56abe9c4f6106a25b8d1acf77f6bda38e59f1050c65a16ae72a817b1 .cnhr-wave08/chunk-006.txt \
            cc9f70bc4abfe050bc093a5b2b35950248257f2c160d9c3799c2105e3e453fe9 .cnhr-wave08/chunk-007.txt \
            c4e74875516b24f756c825f2f3bada9a7f456dfdc789eebc2e0489462b4ee06d .cnhr-wave08/chunk-008.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave08/chunk-000.txt)" = 76c031318a5fd81ceea5177f94f4b1a8d4995e60
          test "$(git hash-object .cnhr-wave08/chunk-001.txt)" = cce9d0c3e5c8896ce105aad709f3aa5cb24a9958
          test "$(git hash-object .cnhr-wave08/chunk-002.txt)" = 1d9fa23a5817bc866bf0d961a6ea2de9b4086bde
          test "$(git hash-object .cnhr-wave08/chunk-003.txt)" = d837711502b902a06251f25ded419a0239c0ef34
          test "$(git hash-object .cnhr-wave08/chunk-004.txt)" = 71ae9f865c37a01988a285c4ae331b9f3ce6637f
          test "$(git hash-object .cnhr-wave08/chunk-005.txt)" = 54436087ef1f2176ab3491c7b472f632aabe9ea5
          test "$(git hash-object .cnhr-wave08/chunk-006.txt)" = 8153e743d5c1973973e38af7981a33452a9e878e
          test "$(git hash-object .cnhr-wave08/chunk-007.txt)" = 33d7bed603c38a5c1f2faffb0319e63a31e39b99
          test "$(git hash-object .cnhr-wave08/chunk-008.txt)" = 267a08b53fdb0d1efdb18ee9982248f6174ea8be

          cat .cnhr-wave08/chunk-*.txt | tr -d '\n' | base64 --decode > /tmp/cnhr-wave08.tar.gz
          test "$(wc -c < /tmp/cnhr-wave08.tar.gz)" -eq "$PAYLOAD_BYTES"
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave08.tar.gz | sha256sum --check --strict
          tar -tzf /tmp/cnhr-wave08.tar.gz \
            | python -c 'import sys; p=[x.strip() for x in sys.stdin if x.strip()]; assert p; assert all(not x.startswith("/") and ".." not in x.split("/") for x in p)'

          tar -xzf /tmp/cnhr-wave08.tar.gz -C .
          rm -rf .cnhr-wave08 .github/workflows/cnhr-wave08-sentinels-materialize.yml

          rm -rf /tmp/cnhr-wave07-root /tmp/cnhr-wave08-root
          mkdir -p /tmp/cnhr-wave07-root /tmp/cnhr-wave08-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packets = [
              ('data/review/clifford-number/hr-discipline/wave-07/MANIFEST.json', Path('/tmp/cnhr-wave07-root'), 22),
              ('data/review/clifford-number/hr-discipline/wave-08/MANIFEST.json', Path('/tmp/cnhr-wave08-root'), 22),
          ]
          for manifest_rel, packet_root, expected_count in packets:
              manifest_path = Path(manifest_rel)
              manifest = json.loads(manifest_path.read_text())
              paths = {row['path'] for row in manifest['files']} | {manifest_rel}
              assert len(paths) == expected_count, (manifest_rel, len(paths))
              for rel in sorted(paths):
                  src = source_root / rel
                  dst = packet_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
              print(f'isolated validation root: {manifest_rel} -> {len(paths)} exact files')
          PY

          printf '%s  %s\n' "$PARENT_MANIFEST_SHA256" \
            data/review/clifford-number/hr-discipline/wave-07/MANIFEST.json \
            | sha256sum --check --strict

          (cd /tmp/cnhr-wave07-root && \
            node --check scripts/clifford-number-hr-learning-audit.mjs && \
            node --check test/clifford-number-hr-learning-audit-fixtures.mjs && \
            node scripts/clifford-number-hr-learning-audit.mjs --check --strict-root && \
            node test/clifford-number-hr-learning-audit-fixtures.mjs)

          (cd /tmp/cnhr-wave08-root && \
            node --check scripts/clifford-number-hr-disciplinary-sentinels.mjs && \
            node --check test/clifford-number-hr-disciplinary-sentinels-fixtures.mjs && \
            node scripts/clifford-number-hr-disciplinary-sentinels.mjs --check --strict-root && \
            node test/clifford-number-hr-disciplinary-sentinels-fixtures.mjs)

          git diff --check
          git add -A

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '63627f609407da7efbc617332fca8d47cad524ab'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-08/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          assert not any(path.startswith('.cnhr-wave08/') for path in observed)
          assert '.github/workflows/cnhr-wave08-sentinels-materialize.yml' not in observed
          print('exact Wave 08 sentinel delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number disciplinary-harm sentinels Wave 08'
          git push origin HEAD:"${HEAD_REF}"
