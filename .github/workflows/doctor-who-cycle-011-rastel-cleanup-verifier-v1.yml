name: doctor-who-cycle-011-rastel-cleanup-verifier-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-verifier-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-verifier-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cleanup-verifier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      INSTALLED_MAIN: ee4bfa70f66d1d4ea5b53765497a185b5c072108
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-verifier-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-verifier-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-verifier-v1
      PROOF_PR: "838"
      PROOF_HEAD: c06af243fb3a7bac6ebf7696839e0d6451f6b48c
      PROOF_RUN: "31352609105"
      PROOF_JOB: "93346085338"
      PROOF_ARTIFACT: "9049502889"
      PROOF_ARTIFACT_BYTES: "107647864"
      PROOF_ARTIFACT_DIGEST: "sha256:07b02c031a0d2bea227b644cacab9d56d1627aa5fe0877d250ff1c1606cd2d3f"
      PROOF_IDENTITY: de673e54e1f06fef78e1af97906cf57a23492e02130f0bd70fc79ffea2bc5c59
      PROOF_STATUS: cycle-011-rastel-canonical-publication-terminal-v1
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      CYCLE_ID: cycle_74cdc938b028a932a766d209

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact verifier and two-writer installation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,proof,authorization,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          git merge-base --is-ancestor "$INSTALLED_MAIN" HEAD
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          git merge-base --is-ancestor "$CANONICAL_MAIN" "$INSTALLED_MAIN"
          git diff --name-status "$CANONICAL_MAIN" "$INSTALLED_MAIN" | LC_ALL=C sort > "$OUT/logs/installed.tsv"
          printf 'A\t%s\nA\t%s\n' "$WRITER_V1" "$WRITER_V2" | LC_ALL=C sort > "$OUT/logs/expected-installed.tsv"
          cmp "$OUT/logs/installed.tsv" "$OUT/logs/expected-installed.tsv"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > "$OUT/api/proof-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$PROOF_JOB" > "$OUT/api/proof-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" > "$OUT/api/proof-artifact.json"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          own=load('carrier-pr.json'); proof_pr=load('proof-pr.json'); run=load('proof-run.json'); job=load('proof-job.json'); artifact=load('proof-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['changed_files']==1
          assert proof_pr['number']==int(os.environ['PROOF_PR']) and proof_pr['head']['sha']==os.environ['PROOF_HEAD']
          assert proof_pr['base']['sha']==os.environ['CANONICAL_MAIN'] and proof_pr['draft'] is True and proof_pr['merged'] is False
          assert run['id']==int(os.environ['PROOF_RUN']) and run['head_sha']==os.environ['PROOF_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          assert job['id']==int(os.environ['PROOF_JOB']) and job['run_id']==int(os.environ['PROOF_RUN']) and job['name']=='prove'
          assert job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['PROOF_ARTIFACT']) and artifact['size_in_bytes']==int(os.environ['PROOF_ARTIFACT_BYTES'])
          assert artifact['expired'] is False and artifact['digest']==os.environ['PROOF_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['PROOF_RUN']) and artifact['workflow_run']['head_sha']==os.environ['PROOF_HEAD']
          PY
          printf 'VERIFIER_HEAD=%s\nVERIFIER_PR=%s\n' "$head" "$pr" >> "$GITHUB_ENV"

      - name: Authenticate terminal proof and freeze exact prefix census
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT/zip" > "$OUT/proof.zip"
          test "$(sha256sum "$OUT/proof.zip" | awk '{print $1}')" = "${PROOF_ARTIFACT_DIGEST#sha256:}"
          ZIP="$OUT/proof.zip" TARGET="$OUT/proof" python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          target=Path(os.environ['TARGET']); target.mkdir(parents=True,exist_ok=True); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file() and sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          proof=json.loads((target/'receipt/terminal-proof.json').read_text()); identity=proof.pop('identity')
          assert identity==os.environ['PROOF_IDENTITY'] and sha(json.dumps(proof,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity
          proof['identity']=identity
          assert proof['status']==os.environ['PROOF_STATUS']
          assert proof['canonical']['commit']==os.environ['CANONICAL_MAIN'] and proof['canonical']['tree']==os.environ['CANONICAL_TREE']
          assert proof['canonical']['paths']==49 and proof['canonical']['workflow_paths']==0 and proof['canonical']['product_deletions']==0
          assert proof['cycle']['task']==os.environ['TASK_ID'] and proof['cycle']['lease']==os.environ['LEASE_ID'] and proof['cycle']['id']==os.environ['CYCLE_ID']
          assert proof['cycle']['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0} and proof['cycle']['media']=='22/22 complete'
          assert all(proof['gates'].values()) and not any(proof['boundary'].values())
          (Path(os.environ['OUT'])/'authorization/proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          : > "$OUT/api/all-pulls.jsonl"
          for page in $(seq 1 50); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f sort=created -f direction=desc -f per_page=100 -f page="$page" > "$OUT/api/pulls-$page.json"
            count="$(jq 'length' "$OUT/api/pulls-$page.json")"
            [ "$count" = 0 ] && break
            jq -c '.[]' "$OUT/api/pulls-$page.json" >> "$OUT/api/all-pulls.jsonl"
            [ "$count" -lt 100 ] && break
          done
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/matching-refs.json"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          pulls=[]
          for raw in (root/'api/all-pulls.jsonl').read_text().splitlines():
              row=json.loads(raw); branch=row['head']['ref']
              if not branch.startswith(os.environ['PREFIX']): continue
              merged=row.get('merged_at') is not None
              action='close_without_merge' if row['state']=='open' and not merged else 'none'
              pulls.append({'pr':row['number'],'branch':branch,'head':row['head']['sha'],'state':row['state'],'draft':row['draft'],'merged':merged,'merged_at':row.get('merged_at'),'base_ref':row['base']['ref'],'base_sha':row['base']['sha'],'action':action})
          assert len({row['pr'] for row in pulls})==len(pulls)
          refs=[]
          for row in json.loads((root/'api/matching-refs.json').read_text()):
              ref=row['ref']; assert ref.startswith('refs/heads/')
              branch=ref[len('refs/heads/'):]
              if branch.startswith(os.environ['PREFIX']): refs.append({'branch':branch,'head':row['object']['sha']})
          assert len({row['branch'] for row in refs})==len(refs)
          by_branch={row['branch']:row for row in refs}
          for row in pulls:
              if row['branch'] in by_branch: assert by_branch[row['branch']]['head']==row['head']
          authorization={'status':'cycle-011-rastel-exact-prefix-cleanup-authorized-v3','version':3,'source':{'pr':int(os.environ['VERIFIER_PR']),'head':os.environ['VERIFIER_HEAD'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT'])},'terminal_proof_identity':os.environ['PROOF_IDENTITY'],'canonical_main':os.environ['CANONICAL_MAIN'],'prefix':os.environ['PREFIX'],'installation':{'main':os.environ['INSTALLED_MAIN'],'writer_paths':[os.environ['WRITER_V1'],os.environ['WRITER_V2']]},'pull_requests':sorted(pulls,key=lambda row:row['pr']),'refs':sorted(refs,key=lambda row:row['branch']),'counts':{'pull_requests':len(pulls),'close_without_merge':sum(row['action']=='close_without_merge' for row in pulls),'refs':len(refs)},'boundary':{'cycle_012_lease_issued':False,'cycle_012_product_authority':False,'exact_heads_frozen':True,'force_update':False,'main_mutation':False,'merge':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          authorization['identity']=sha(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode())
          (root/'authorization/authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/authorization" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/authorization/$rel" | sed "s#  $OUT/authorization/#  #"; done > "$OUT/authorization/SHA256SUMS.pre"
          sha256sum "$OUT/authorization/SHA256SUMS.pre" | sed "s#  $OUT/authorization/#  #" > "$OUT/authorization/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-verifier-v1-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-verifier-v1/authorization
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-verifier-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-verifier-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
