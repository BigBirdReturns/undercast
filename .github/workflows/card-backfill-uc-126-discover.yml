name: card-backfill-uc-126-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-126-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-126-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-126-discover.mjs"
      - "scripts/card-backfill-uc-126-discover-repair.py"
      - ".github/workflows/card-backfill-uc-126-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-126-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-031'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-031
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-126 repaired discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-126-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-126-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-126');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-126');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_90375b50fca2bd3603ba9946');
          if(row.version!==1||row.record_id!=='UC-126'||row.actor!=='Tara Strong'||row.character!=='Bubbles, Timmy, Harley & Twilight'||row.production!=='Powerpuff Girls / Fairly OddParents / etc.'||row.year!==1998||row.side!=='still')throw new Error('UC-126 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-126'||failures.failed_discovery_checkpoints?.length!==6||failures.failed_discovery_checkpoints[0]?.artifact_id!==8706731789||failures.failed_discovery_checkpoints[1]?.run_id!==30406725565||failures.failed_discovery_checkpoints[2]?.artifact_id!==8706939535||failures.failed_discovery_checkpoints[3]?.artifact_id!==8707028764||failures.failed_discovery_checkpoints[4]?.artifact_id!==8707103373||failures.failed_discovery_checkpoints[5]?.run_id!==30407678136||failures.failed_discovery_checkpoints[5]?.artifact_id!==null)throw new Error('UC-126 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8706098863||row.selector_artifact?.head_sha!=='151b37ee114f8e262b284a718556355cd542f3d0'||row.selector_artifact?.zip_sha256!=='7e2ca734ac74cb3a4b4f9f7ea87d0e8ea7be34f1eda7936bccf6992966b5bf7c')throw new Error('UC-126 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8706377703||row.scope_artifact?.head_sha!=='e55246b62a2c3a4a4bee232e80521a3629b71226'||row.scope_artifact?.scope_sha256!=='231d0799b8cd0d980fb7d406258eb9bd79b021d0ec9b70fad9d893f0070c35f4')throw new Error('UC-126 scope custody drift');
          if(row.bubbles_probe_artifact?.artifact_id!==8707180738||row.bubbles_probe_artifact?.head_sha!=='99b146eb05512018f76a5c49b60a3cb294b6e104'||row.bubbles_probe_artifact?.zip_sha256!=='a8c7c100e06e3701c3544447c0acd8ab7f74516f346bd4fb1070dae643e9c1f4'||row.bubbles_probe_artifact?.manifest_sha256!=='c72b71005ffc2383254b22ab8a26c53e39d583789cdfcbf93dd25edce5c61716'||row.bubbles_probe_artifact?.summary_sha256!=='7a37a081951ee3204e9b9acdabab49a4cad68427b1fff2b95c982e9c8fc6212e'||row.bubbles_probe_artifact?.usable_count!==6)throw new Error('UC-126 Bubbles probe custody drift');
          if(row.actor_role_pages?.length!==5||row.actor_role_pages.filter(page=>page.strict).length!==2||row.actor_role_pages.filter(page=>page.reference_only).length!==3||row.role_pages?.length!==4||row.role_pages[0]?.direct_assets?.length!==3||row.role_pages[0]?.direct_assets[0]?.expected_sha256!=='3ec550ef07c5a51f8bd5f65c19e933626e5e9a67d1cbbf3c1eacf5b0d411d28e'||row.minimum_candidates_per_role!==1||row.maximum_candidates_per_role!==20)throw new Error('UC-126 repaired discovery denominator drift');
          if(JSON.stringify(row.selection_contract?.required_role_keys)!==JSON.stringify(['bubbles','timmy','harley','twilight'])||row.selection_contract?.exact_four_role_composite_required!==true||row.selection_contract?.bubbles_probe_artifact_required!==true||row.selection_contract?.strict_runtime_actor_role_pages_required!==2||row.selection_contract?.reference_only_actor_role_pages_required!==3||row.selection_contract?.original_1998_bubbles_required!==true||row.selection_contract?.tara_strong_timmy_main_series_required!==true||row.selection_contract?.named_dc_super_hero_girls_harley_continuity_required!==true||row.selection_contract?.friendship_is_magic_twilight_required!==true||row.selection_contract?.canonical_1998_is_bubbles_chronology_only!==true||row.selection_contract?.all_four_panels_required!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-126 selection contract drift');
          if(!specimen||specimen.actor!=='Tara Strong'||specimen.character!=='Bubbles, Timmy, Harley & Twilight'||specimen.production!=='Powerpuff Girls / Fairly OddParents / etc.'||specimen.years!=='1998'||specimen.still)throw new Error('UC-126 specimen boundary drift');
          if(source?.still)throw new Error('UC-126 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-126'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-126 audit boundary drift');
          console.log('PASS — exact UC-126 six-failure custody and hash-pinned Bubbles probe consumption authorized');
          NODE
      - name: Build isolated discovery runner
        run: |
          set -euo pipefail
          python3 scripts/card-backfill-uc-126-discover-repair.py
          node --check scripts/.card-backfill-uc-126-discover-run.mjs
      - name: Gather exact role revisions, image candidates, and actor-role custody
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-126-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-126-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-126-discover-run.log"
          rm scripts/.card-backfill-uc-126-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload actor-role pages, failure custody, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-126-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-126-discover
            ${{ runner.temp }}/card-backfill-uc-126-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
