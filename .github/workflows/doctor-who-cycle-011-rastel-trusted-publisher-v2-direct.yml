name: doctor-who-cycle-011-rastel-trusted-publisher-v2-direct

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-trusted-publisher-v2-direct
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      handoff_id: ${{ steps.upload.outputs.artifact-id }}
      handoff_digest: ${{ steps.upload.outputs.artifact-digest }}
      publication_main: ${{ steps.settle.outputs.publication_main }}
      canonical_commit: ${{ steps.settle.outputs.canonical_commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      INSTALL_PARENT: 39cf752efaba48271b078152235045be948b0d64
      OLD_SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct.yml
      SOURCE_PR: "817"
      SOURCE_RUN: "31346032070"
      SOURCE_ATTEMPT: "1"
      SOURCE_JOB: "93328041911"
      SOURCE_HEAD: 163743c529584cf250f7feb1c5d60ca5b29d460b
      SOURCE_BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v4-direct
      SOURCE_WORKFLOW: doctor-who-cycle-011-rastel-final-review-v4-direct
      SOURCE_ARTIFACT: "9047395261"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-011-rastel-final-review-v4-direct-31346032070-attempt-1
      SOURCE_ARTIFACT_DIGEST: 7bbb4d959718935faa22a851f439cdb2ef0c545ce5469b4d5356e056d5612377
      OUT: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-verify
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      PRODUCT_COMMIT: fb25eb067844c2ca1861b45d381967d4aa89af23
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_BUNDLE_SHA256: 4b566b54595667e12d8b9c6d3edb87036577b086d8387940f013bd02f0527519
      PRODUCT_PATCH_SHA256: 74df5552ea1e5a91d530061b70e93fcdd5a1b5e2932ee03fcea67328dbf7ad17
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      RECEIPT_FILE_SHA256: dc58f8c89777c5a06c4da97469d596e4798e7b07ea791bd7f75e159029c679c0
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct exact retained-review verifier and execute
        id: settle
        shell: bash
        run: |
          set -euo pipefail
          BOOT="/tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-bootstrap-verify"
          rm -rf "$BOOT"
          mkdir -p "$BOOT"
          : > "$BOOT/verify.sh.gz.b64"
          read -r -a blobs <<< "42a46ffb22bc7fa2f7eb57cd3876dbf38185ff2c 9cb47e709a81854dc1d626da1ccda48437f7915f"
          read -r -a sizes <<< "3000 1740"
          read -r -a hashes <<< "26a5fc93426c1c0adf672def45baef41cdf49c29f087d35d7508f570c36f8eb2 249bff73d3b657f09330c040cedf4daa2d1a82279637016499ee3e7a965c5a4f"
          test "${#blobs[@]}" = "2"
          for index in 0 1; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/chunk.$index"
            test "$(wc -c < "$BOOT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$BOOT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$BOOT/chunk.$index" >> "$BOOT/verify.sh.gz.b64"
          done
          test "$(wc -c < "$BOOT/verify.sh.gz.b64" | tr -d ' ')" = "4740"
          test "$(sha256sum "$BOOT/verify.sh.gz.b64" | awk '{print $1}')" = "0584868f0d9e5f358e5e3766d1f98f397858e3d7d0d1c2ba0ec57571f038c479"
          base64 -d "$BOOT/verify.sh.gz.b64" > "$BOOT/verify.sh.gz"
          test "$(wc -c < "$BOOT/verify.sh.gz" | tr -d ' ')" = "3553"
          test "$(sha256sum "$BOOT/verify.sh.gz" | awk '{print $1}')" = "aaa3e5d5bb7554a069ea509d1487acd8dba2f2e9ff9bd7c6364ef98341877107"
          gzip -dc "$BOOT/verify.sh.gz" > "$BOOT/verify.sh"
          test "$(wc -c < "$BOOT/verify.sh" | tr -d ' ')" = "11782"
          test "$(sha256sum "$BOOT/verify.sh" | awk '{print $1}')" = "87718aca7f721bb2f22806b22525be7b3249a2ecc3e556b3e497d22fffe5748b"
          bash -n "$BOOT/verify.sh"
          chmod 700 "$BOOT/verify.sh"
          exec "$BOOT/verify.sh"

      - name: Upload exact canonical write handoff
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-handoff-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-verify/handoff
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  write:
    needs: verify
    if: >-
      needs.verify.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      OLD_SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct.yml
      PUBLICATION_MAIN: ${{ needs.verify.outputs.publication_main }}
      EXPECTED_CANONICAL: ${{ needs.verify.outputs.canonical_commit }}
      HANDOFF_ID: ${{ needs.verify.outputs.handoff_id }}
      HANDOFF_DIGEST: ${{ needs.verify.outputs.handoff_digest }}
      OUT: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-write
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLICATION_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.HANDOFF_ID }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-write/handoff
          merge-multiple: true

      - name: Reconstruct exact terminal writer and execute
        shell: bash
        run: |
          set -euo pipefail
          BOOT="/tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-bootstrap-write"
          rm -rf "$BOOT"
          mkdir -p "$BOOT"
          : > "$BOOT/write.sh.gz.b64"
          read -r -a blobs <<< "c005ff01df710affa005e7a8bb94aaadb756cd17"
          read -r -a sizes <<< "2968"
          read -r -a hashes <<< "b53b296e86cfce89d0748ffe419521fd43f6ad112993ffdfed262ba3a94427bb"
          test "${#blobs[@]}" = "1"
          for index in 0; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/chunk.$index"
            test "$(wc -c < "$BOOT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$BOOT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$BOOT/chunk.$index" >> "$BOOT/write.sh.gz.b64"
          done
          test "$(wc -c < "$BOOT/write.sh.gz.b64" | tr -d ' ')" = "2968"
          test "$(sha256sum "$BOOT/write.sh.gz.b64" | awk '{print $1}')" = "b53b296e86cfce89d0748ffe419521fd43f6ad112993ffdfed262ba3a94427bb"
          base64 -d "$BOOT/write.sh.gz.b64" > "$BOOT/write.sh.gz"
          test "$(wc -c < "$BOOT/write.sh.gz" | tr -d ' ')" = "2224"
          test "$(sha256sum "$BOOT/write.sh.gz" | awk '{print $1}')" = "bfc9e3ab8acee49b2fa676e7b6114e9b910d62a87e7ddd0976db8aeb06abe574"
          gzip -dc "$BOOT/write.sh.gz" > "$BOOT/write.sh"
          test "$(wc -c < "$BOOT/write.sh" | tr -d ' ')" = "6341"
          test "$(sha256sum "$BOOT/write.sh" | awk '{print $1}')" = "c2dcec74d6ae20a978c0f8dcb9b0e5a84c0afe57e4db55f7a06b0246bac399e8"
          bash -n "$BOOT/write.sh"
          chmod 700 "$BOOT/write.sh"
          exec "$BOOT/write.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-trusted-publisher-v2-direct-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
