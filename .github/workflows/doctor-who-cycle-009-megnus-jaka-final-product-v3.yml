name: doctor-who-cycle-009-megnus-jaka-final-product-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-product-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-product-v3
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: "707f2c14c4dc183afceb732c2b56124ed3a37c93"
      BRANCH: "agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v3"
      SELF: ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-product-v3.yml"
      OUT: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3"
      QUAL: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3/qualification"
      CAND: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3/candidate"
      WORKTREE: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3/worktree"
      FINAL: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3/final"
      QUAL_PR: "679"
      QUAL_HEAD: "275a83477f883cc9f57b06b80d26cb01cb9eb1b6"
      QUAL_RUN: "31275590995"
      QUAL_JOB: "93148489417"
      QUAL_ARTIFACT: "9026934021"
      QUAL_ZIP_SHA256: "78e6eecd54112b25f1183f049404edecf7906301fd5fc85e6a6f93a1f8a63db9"
      QUAL_ID: "b5375e3a0e6e018c6383e4b5fd0dd0af941ff0dc3150c5b116986dc371eb8388"
      CANDIDATE_PR: "673"
      CANDIDATE_HEAD: "f6292fb2e93fe5340d039cfca0bfdf25c815c520"
      CANDIDATE_RUN: "31273651684"
      CANDIDATE_JOB: "93143639874"
      CANDIDATE_ARTIFACT: "9026406657"
      CANDIDATE_ZIP_SHA256: "546c566567f88158356767a9a1d8f05728988d0387df99ca3f33a53c3e35cb72"
      CANDIDATE_COMMIT: "35f507417bb4b2efade613b3b643080363a0350f"
      CANDIDATE_TREE: "e59fc81b63c6e512a858d7b3353a58d4e5945796"
      CANDIDATE_RECEIPT_ID: "d2d6988d3ad79489296485431ea098d3410a328a403d9b58f91d0f5e94fc4a92"
      CANDIDATE_PATHS_SHA256: "488a082aa186ab16e28b5c0b9bc7b28867e72126ab0ffa8fdaadc61f82ac5f50"
      CANDIDATE_BUNDLE_SHA256: "78c9feb8b95bc01b70a0130ebbf80cd6808176d64bc9d28175b083c393646ae8"
      CANDIDATE_PATCH_SHA256: "20fdd458de4f3427c64711fdbfef2d0d693b0b330144ee7cbba4dbd39f610777"
      CANDIDATE_ARCHIVE_SHA256: "a464de88653efeeff4dd9929e9a0c62e040ab5829fff7331c403ec33b240c6f8"
      TASK_ID: "ap_45bb5fdcdf4aff65aa7a87c3"
      LEASE_ID: "lease_4ca825307ad0d4510f44c7d9"
      WALL_ID: "UC-1354"
      PERFORMER: "Dan Starkey"
      ROLE: "Megnus Jaka"
      SOURCE_URL: "https://tardis.fandom.com/wiki/Megnus_Jaka"
      SOURCE_FINGERPRINT: "799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35"
      PORTRAIT_PATH: "images/uc-1354-portrait.jpg"
      PORTRAIT_SHA256: "997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68"
      PORTRAIT_ORIGIN: "https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg"
      PORTRAIT_LICENSE: "CC BY-SA 2.0"
      PRIOR_CYCLE_ID: "cycle_89daa03cca72b8522c76725c"
      EXPECTED_CYCLE_ID: "cycle_42b1d086ae8eab34f09827dc"
      PRIOR_RECEIPT_PATH: "data/review/adapter-sdk/doctor-who-cycle-008-kreg.json"
      PRIOR_CHECKER_PATH: "scripts/doctor-who-cycle-008.mjs"
      RECEIPT_PATH: "data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json"
      CHECKER_PATH: "scripts/doctor-who-cycle-009.mjs"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      RUNNER_SHA256: "878acf29393fabc86f3250649a56f2fde01a9058c7674466f656e30419a92a8c"
      RUNNER_GZIP_SHA256: "d07fd349cf8e95571d516074c9c9618050e31242a5e112ca2b6bb78649a1cd19"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute exact commit-bound finalizer
        shell: bash
        run: |
          set -euo pipefail
          message=/tmp/doctor-who-cycle-009-megnus-jaka-finalizer-v3.commit-message
          runner_gz=/tmp/doctor-who-cycle-009-megnus-jaka-finalizer-v3.sh.gz
          runner=/tmp/doctor-who-cycle-009-megnus-jaka-finalizer-v3.sh
          git show -s --format=%B HEAD > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64, os
          from pathlib import Path
          text=Path(os.environ['MESSAGE']).read_text()
          begin='RUNNER_GZIP_BASE64_BEGIN'
          end='RUNNER_GZIP_BASE64_END'
          assert text.count(begin)==1 and text.count(end)==1
          payload=text.split(begin,1)[1].split(end,1)[0]
          payload=''.join(payload.split())
          assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload,validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload exact final-product prototype
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-product-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3/final
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload final-product diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-product-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-product-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
