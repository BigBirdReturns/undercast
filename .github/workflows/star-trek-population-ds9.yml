name: star-trek-population-ds9

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-DS9.json"
      - ".github/workflows/star-trek-population-ds9.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild the exact DS9 projections used by the canonical gate
        run: |
          set -euo pipefail
          node scripts/ds9-census.mjs --project-only
          node scripts/ds9-graph.mjs --project-only
          node scripts/ds9-eligibility-queue.mjs
          node scripts/ds9-maker-queue.mjs
          changed=$(git diff --name-only -- data/ds9)
          test "$changed" = $'data/ds9/coverage.json\ndata/ds9/summary.json'
          rm -f .github/STAR-TREK-POPULATION-DS9.json
          rm -f .github/workflows/star-trek-population-ds9.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add data/ds9/coverage.json data/ds9/summary.json .github/STAR-TREK-POPULATION-DS9.json .github/workflows/star-trek-population-ds9.yml
          git diff --cached --check
          git commit -m "Population: refresh DS9 projections for Zek"
          git push origin HEAD:agent/star-trek-population-001
