name: card-backfill-uc-080-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-080-DISCOVER.json"
      - "scripts/card-backfill-uc-080-discover.mjs"
      - ".github/workflows/card-backfill-uc-080-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-080-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-019'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-019
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-080 Jeriba discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-080-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-080');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_b7a185b181d2292ce7e73ad7');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-080');
          if(row.version!==1||row.record_id!=='UC-080'||row.actor!=='Louis Gossett Jr.'||row.character!=="Jeriba 'Jerry' Shigan"||row.side!=='still')throw new Error('UC-080 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8668928932||row.scope_artifact?.artifact_id!==8669004707)throw new Error('UC-080 discovery custody drift');
          if(row.pages?.length!==8||row.pages.filter(item=>item.strict).length!==3||row.selection_contract?.exact_role_required!==true||row.selection_contract?.reject_generic_drac_without_role_binding!==true)throw new Error('UC-080 source denominator drift');
          if(!specimen||specimen.character!=="Jeriba 'Jerry' Shigan"||specimen.still)throw new Error('UC-080 specimen boundary drift');
          if(source?.still)throw new Error('UC-080 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-080'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-080 audit boundary drift');
          console.log('PASS — exact UC-080 Jeriba source orbit authorized');
          NODE
      - name: Gather exact Jeriba candidates and build review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-080-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-080-discover.mjs
          node scripts/card-backfill-uc-080-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-080-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact pages, candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-080-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-080-discover
            ${{ runner.temp }}/card-backfill-uc-080-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
