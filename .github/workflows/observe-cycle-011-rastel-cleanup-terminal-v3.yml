name: observe-cycle-011-rastel-cleanup-terminal-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/observe-cycle-011-rastel-cleanup-terminal-v3.yml"

permissions: {}

concurrency:
  group: observe-cycle-011-rastel-cleanup-terminal-v3-final
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      INSTALLATION_MAIN: 120a81e988c045695b55089afe5f8e3d82012f8d
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PREFIX: agent/doctor-who-cycle-011-rastel-
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v3.yml
      WRITER_WORKFLOW: doctor-who-cycle-011-rastel-cleanup-writer-v3
      WRITER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-cleanup-writer-v3-
      VERIFIER_PR: "854"
      VERIFIER_HEAD: bbb43013c56789f5abf068dd5132872a10ab3472
      VERIFIER_RUN: "31359480959"
      VERIFIER_JOB: "93365341372"
      AUTH_ARTIFACT: "9051813723"
      AUTH_ARTIFACT_SHA256: 8f9da035a06fe32e0b7099c445466c3c7a9a3ec3e632aa914b543386dda53339
      TERMINAL_PROOF_IDENTITY: de673e54e1f06fef78e1af97906cf57a23492e02130f0bd70fc79ffea2bc5c59
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      ORIGINAL_PATH: .github/workflows/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3.yml
      REPAIR_PATH: .github/workflows/doctor-who-cycle-011-rastel-cleanup-terminal-observer-v3-repair.yml
      SELF: .github/workflows/observe-cycle-011-rastel-cleanup-terminal-v3.yml
      SOURCE_BLOB: d8217ea7741ed0424899e18e6c8e967878b312ce
      BOOTSTRAP: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3-bootstrap
      OUT: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
      WORKTREE: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3-worktree
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover, repair, and execute the exact terminal proof programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,scripts}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r '.content' "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source.yml"
          test "$(git hash-object --stdin < "$BOOTSTRAP/source.yml")" = "$SOURCE_BLOB"

          SOURCE="$BOOTSTRAP/source.yml" TARGET="$BOOTSTRAP/scripts" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE"]).read_text()
          lines = source.splitlines(keepends=True)
          names = [
              "Bind one-path observer and exact canonical cleanup topology",
              "Locate the unique successful writer V3 transaction and receipt artifact",
              "Authenticate terminal cleanup receipt and authority boundary",
              "Independently rerun terminal cycle and complete rendered gates",
              "Seal terminal cleanup proof and lease-free cycle-012 selector authority",
          ]

          def extract(name: str) -> str:
              marker = f"- name: {name}"
              starts = [i for i, line in enumerate(lines) if line.strip() == marker]
              assert len(starts) == 1, (name, starts)
              start = starts[0]
              run_index = next(
                  i for i in range(start + 1, len(lines))
                  if lines[i].strip() == "run: |"
              )
              run_indent = len(lines[run_index]) - len(lines[run_index].lstrip(" "))
              content_indent = run_indent + 2
              out = []
              for line in lines[run_index + 1:]:
                  if line.strip() == "":
                      out.append("\n")
                      continue
                  indent = len(line) - len(line.lstrip(" "))
                  if indent < content_indent:
                      break
                  out.append(line[content_indent:])
              script = "".join(out)
              assert script.startswith("set -euo pipefail\n"), name
              return script

          scripts = [extract(name) for name in names]
          first = scripts[0]
          replacement_block = (
              'git diff --name-status "$CLEANUP_MAIN"...HEAD | LC_ALL=C sort > "$OUT/logs/carrier.tsv"\n'
              'printf \'A\\t%s\\nA\\t%s\\nA\\t%s\\n\' "$ORIGINAL_PATH" "$REPAIR_PATH" "$SELF" | LC_ALL=C sort > "$OUT/logs/expected-carrier.tsv"\n'
              'cmp "$OUT/logs/carrier.tsv" "$OUT/logs/expected-carrier.tsv"'
          )
          replacements = [
              (
                  "head='${{ github.event.pull_request.head.sha }}'",
                  'head="$CURRENT_HEAD"',
              ),
              (
                  "base='${{ github.event.pull_request.base.sha }}'",
                  'base="$CURRENT_BASE"',
              ),
              (
                  "pr='${{ github.event.pull_request.number }}'",
                  'pr="$CURRENT_PR"',
              ),
              (
                  'test "$(git show -s --format=%P HEAD)" = "$CLEANUP_MAIN"',
                  'test "$(git merge-base "$CLEANUP_MAIN" HEAD)" = "$CLEANUP_MAIN"',
              ),
              (
                  'test "$(git rev-list --count "$CLEANUP_MAIN"..HEAD)" = 1',
                  'test "$(git rev-list --count "$CLEANUP_MAIN"..HEAD)" = 4',
              ),
              (
                  'test "$(git diff --name-status "$CLEANUP_MAIN"...HEAD)" = $\'A\\t\'"$SELF"',
                  replacement_block,
              ),
              (
                  "assert own['base']['sha'] == os.environ['CLEANUP_MAIN'] and own['commits'] == 1 and own['changed_files'] == 1",
                  "assert own['base']['sha'] == os.environ['CLEANUP_MAIN'] and own['commits'] == 4 and own['changed_files'] == 3",
              ),
          ]
          census = []
          for old, new in replacements:
              count = first.count(old)
              assert count == 1, (old, count)
              first = first.replace(old, new, 1)
              census.append({
                  "old_sha256": hashlib.sha256(old.encode()).hexdigest(),
                  "new_sha256": hashlib.sha256(new.encode()).hexdigest(),
              })
          scripts[0] = first

          target = Path(os.environ["TARGET"])
          for index, script in enumerate(scripts, 1):
              path = target / f"{index:02d}.sh"
              path.write_text(script)
          receipt = {
              "status": "cycle-011-rastel-terminal-proof-programs-recovered-v1",
              "version": 1,
              "source_blob": os.environ["SOURCE_BLOB"],
              "source_bytes": len(source.encode()),
              "source_sha256": hashlib.sha256(source.encode()).hexdigest(),
              "programs": [
                  {
                      "index": index,
                      "name": name,
                      "bytes": len(script.encode()),
                      "sha256": hashlib.sha256(script.encode()).hexdigest(),
                  }
                  for index, (name, script) in enumerate(zip(names, scripts), 1)
              ],
              "repair_census": census,
              "boundary": {
                  "repository_write": False,
                  "canonical_mutation": False,
                  "cycle_012_lease_issued": False,
                  "cycle_012_product_authority": False,
              },
          }
          receipt["identity"] = hashlib.sha256(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          (target / "recovery.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          PY

          for script in "$BOOTSTRAP"/scripts/[0-9][0-9].sh; do
            bash -n "$script"
          done

          load_github_env() {
            if [ -s "$GITHUB_ENV" ]; then
              while IFS='=' read -r key value; do
                [ -n "$key" ] || continue
                export "$key=$value"
              done < "$GITHUB_ENV"
            fi
          }

          for script in "$BOOTSTRAP"/scripts/[0-9][0-9].sh; do
            bash "$script"
            load_github_env
            if [ "$(basename "$script")" = "01.sh" ]; then
              cp "$BOOTSTRAP/scripts/recovery.json" "$OUT/receipt/program-recovery.json"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-terminal-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-terminal-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
            /tmp/observe-cycle-011-rastel-cleanup-terminal-v3-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
