name: observe-cycle-011-rastel-cleanup-terminal-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/observe-cycle-011-rastel-cleanup-terminal-v3.yml"

permissions: {}

concurrency:
  group: observe-cycle-011-rastel-cleanup-terminal-v3
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      INSTALLATION_MAIN: 120a81e988c045695b55089afe5f8e3d82012f8d
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PREFIX: agent/doctor-who-cycle-011-rastel-
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v3.yml
      WRITER_WORKFLOW: doctor-who-cycle-011-rastel-cleanup-writer-v3
      WRITER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-cleanup-writer-v3-
      VERIFIER_PR: "854"
      VERIFIER_HEAD: bbb43013c56789f5abf068dd5132872a10ab3472
      VERIFIER_RUN: "31359480959"
      VERIFIER_JOB: "93365341372"
      AUTH_ARTIFACT: "9051813723"
      AUTH_ARTIFACT_SHA256: 8f9da035a06fe32e0b7099c445466c3c7a9a3ec3e632aa914b543386dda53339
      TERMINAL_PROOF_IDENTITY: de673e54e1f06fef78e1af97906cf57a23492e02130f0bd70fc79ffea2bc5c59
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      WATERLINE_EVENT: waterline_852a43e7274e57ef2b69f441
      RECEIPT_IDENTITY: 0ff1d64e2889ada02b64fefe47e9b91b9627dd479503f9b2458508e846c61df9
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d
      WALL_ID: UC-1356
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      SELF: .github/workflows/observe-cycle-011-rastel-cleanup-terminal-v3.yml
      OUT: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
      WORKTREE: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3-worktree

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind one-path observer and exact canonical cleanup topology
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$WORKTREE"
          mkdir -p "$OUT"/{api,writer,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$CLEANUP_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CLEANUP_MAIN"
          test "$(git rev-list --count "$CLEANUP_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CLEANUP_MAIN"..HEAD)"
          test "$(git diff --name-status "$CLEANUP_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CLEANUP_MAIN"
          test "$(git show -s --format=%P "$CLEANUP_MAIN")" = "$INSTALLATION_MAIN"
          test "$(git show -s --format=%T "$CLEANUP_MAIN")" = "$PRODUCT_TREE"
          test "$(git show -s --format=%T "$PRODUCT_MAIN")" = "$PRODUCT_TREE"
          test -z "$(git diff --name-status "$PRODUCT_MAIN" "$CLEANUP_MAIN")"
          git diff --name-status "$INSTALLATION_MAIN" "$CLEANUP_MAIN" | LC_ALL=C sort > "$OUT/logs/installation-to-cleanup.tsv"
          printf 'D\t%s\nD\t%s\nD\t%s\n' "$WRITER_V1" "$WRITER_V2" "$WRITER_V3" | LC_ALL=C sort > "$OUT/logs/expected-writer-deletions.tsv"
          cmp "$OUT/logs/installation-to-cleanup.tsv" "$OUT/logs/expected-writer-deletions.tsv"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/prefix-refs.json"
          test "$(jq 'length' "$OUT/api/prefix-refs.json")" = 0
          for path in "$WRITER_V1" "$WRITER_V2" "$WRITER_V3"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$CLEANUP_MAIN" >/dev/null 2>&1; then
              echo "writer survived canonical cleanup tree: $path" >&2
              exit 1
            fi
          done
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$VERIFIER_PR" > "$OUT/api/verifier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/852" > "$OUT/api/installer-pr.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          api = Path(os.environ['OUT']) / 'api'
          own = json.loads((api / 'observer-pr.json').read_text())
          verifier = json.loads((api / 'verifier-pr.json').read_text())
          installer = json.loads((api / 'installer-pr.json').read_text())
          assert own['number'] == int(os.environ['CARRIER_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged_at'] is None
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CARRIER_HEAD']
          assert own['base']['sha'] == os.environ['CLEANUP_MAIN'] and own['commits'] == 1 and own['changed_files'] == 1
          assert verifier['number'] == int(os.environ['VERIFIER_PR'])
          assert verifier['head']['ref'] == 'agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2'
          assert verifier['head']['sha'] == os.environ['VERIFIER_HEAD']
          assert verifier['state'] == 'closed' and verifier['merged_at'] is None
          assert installer['number'] == 852 and installer['merged_at'] is not None
          assert installer['head']['sha'] == os.environ['INSTALLATION_MAIN']
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Locate the unique successful writer V3 transaction and receipt artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_run&per_page=100" > "$OUT/api/writer-runs.json"
          jq -r --arg name "$WRITER_WORKFLOW" --argjson floor "$VERIFIER_RUN" '.workflow_runs[] | select(.name==$name and .id>$floor) | .id' "$OUT/api/writer-runs.json" | while read -r run; do
            [ -n "$run" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$OUT/api/writer-jobs-$run.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/api/writer-artifacts-$run.json"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          runs = json.loads((root / 'api/writer-runs.json').read_text())['workflow_runs']
          candidates = []
          for run in runs:
              if run['name'] != os.environ['WRITER_WORKFLOW'] or run['id'] <= int(os.environ['VERIFIER_RUN']):
                  continue
              jobs_path = root / f"api/writer-jobs-{run['id']}.json"
              artifacts_path = root / f"api/writer-artifacts-{run['id']}.json"
              if not jobs_path.is_file() or not artifacts_path.is_file():
                  continue
              jobs = json.loads(jobs_path.read_text())['jobs']
              artifacts = json.loads(artifacts_path.read_text())['artifacts']
              write = [row for row in jobs if row['name'] == 'write' and row['status'] == 'completed' and row['conclusion'] == 'success']
              expected = os.environ['WRITER_ARTIFACT_PREFIX'] + str(run['id']) + '-attempt-' + str(run['run_attempt'])
              matches = [row for row in artifacts if row['name'] == expected and not row['expired']]
              if len(write) == 1 and len(matches) == 1:
                  candidates.append((run, write[0], matches[0]))
          assert len(candidates) == 1, [(row[0]['id'], row[0]['status'], row[0].get('conclusion')) for row in candidates]
          run, job, artifact = candidates[0]
          assert run['event'] == 'workflow_run' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_branch'] == 'main' and run['head_sha'] == os.environ['INSTALLATION_MAIN']
          steps = {row['name']: row['conclusion'] for row in job.get('steps', [])}
          for name in [
              'Bind exact three-writer installation and successful verifier V2',
              'Authenticate exact V2 cleanup authorization',
              'Apply exact PR and ref cleanup with settled observation',
              'Restore exact canonical product tree and seal terminal cleanup V5',
          ]:
              assert steps.get(name) == 'success', (name, steps.get(name))
          (root / 'api/writer-run-selected.json').write_text(json.dumps(run, indent=2, sort_keys=True) + '\n')
          (root / 'api/writer-job-selected.json').write_text(json.dumps(job, indent=2, sort_keys=True) + '\n')
          (root / 'api/writer-artifact-selected.json').write_text(json.dumps(artifact, indent=2, sort_keys=True) + '\n')
          (root / 'api/writer-run-id.txt').write_text(str(run['id']) + '\n')
          (root / 'api/writer-job-id.txt').write_text(str(job['id']) + '\n')
          (root / 'api/writer-artifact-id.txt').write_text(str(artifact['id']) + '\n')
          (root / 'api/writer-artifact-digest.txt').write_text(artifact['digest'] + '\n')
          PY
          writer_run="$(cat "$OUT/api/writer-run-id.txt")"
          writer_job="$(cat "$OUT/api/writer-job-id.txt")"
          writer_artifact="$(cat "$OUT/api/writer-artifact-id.txt")"
          writer_digest="$(cat "$OUT/api/writer-artifact-digest.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$writer_artifact/zip" > "$OUT/writer.zip"
          test "$(sha256sum "$OUT/writer.zip" | awk '{print $1}')" = "${writer_digest#sha256:}"
          printf 'WRITER_RUN=%s\nWRITER_JOB=%s\nWRITER_ARTIFACT=%s\nWRITER_DIGEST=%s\n' "$writer_run" "$writer_job" "$writer_artifact" "$writer_digest" >> "$GITHUB_ENV"

      - name: Authenticate terminal cleanup receipt and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/writer.zip" TARGET="$OUT/writer" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          rows = []
          for path in target.rglob('*.json'):
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              if data.get('status') == 'cycle-011-rastel-exact-prefix-cleanup-complete-v5':
                  rows.append((path, data))
          assert len(rows) == 1, [path.as_posix() for path, _ in rows]
          path, receipt = rows[0]
          identity = receipt.pop('identity')
          assert sha(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()) == identity
          receipt['identity'] = identity
          assert receipt['version'] == 5
          assert receipt['writer_run'] == int(os.environ['WRITER_RUN']) and receipt['writer_attempt'] == 1
          assert receipt['source'] == {
              'pr': int(os.environ['VERIFIER_PR']),
              'head': os.environ['VERIFIER_HEAD'],
              'run': int(os.environ['VERIFIER_RUN']),
              'attempt': 1,
              'job': int(os.environ['VERIFIER_JOB']),
              'artifact': int(os.environ['AUTH_ARTIFACT']),
              'artifact_sha256': os.environ['AUTH_ARTIFACT_SHA256'],
          }
          assert len(receipt['authorization_identity']) == 64
          assert receipt['canonical'] == {
              'proved_commit': os.environ['PRODUCT_MAIN'],
              'installation_commit': os.environ['INSTALLATION_MAIN'],
              'cleanup_commit': os.environ['CLEANUP_MAIN'],
              'tree': os.environ['PRODUCT_TREE'],
              'writers_absent': True,
          }
          cleanup = receipt['cleanup']
          assert cleanup['authorized_prefix_refs'] == 93
          assert cleanup['deleted_in_this_run'] + cleanup['already_absent_at_rebind'] == 93
          assert cleanup['prefix_refs_remaining'] == 0
          assert cleanup['pull_requests_processed'] == 6
          assert cleanup['auxiliary_refs_processed'] >= 1
          assert receipt['boundary'] == {
              'cycle_012_lease_issued': False,
              'cycle_012_product_authority': False,
              'force_update': False,
              'merge': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
              'product_tree_changed': False,
          }
          (Path(os.environ['OUT']) / 'receipt/cleanup.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (Path(os.environ['OUT']) / 'receipt/cleanup-identity.txt').write_text(identity + '\n')
          PY

      - name: Independently rerun terminal cycle and complete rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$CLEANUP_MAIN"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline.log"
          node scripts/waterline.mjs status | tee "$OUT/logs/waterline-status.log"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain=v1)"

      - name: Seal terminal cleanup proof and lease-free cycle-012 selector authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          cleanup = json.loads((root / 'receipt/cleanup.json').read_text())
          proof = {
              'status': 'cycle-011-rastel-terminal-cleanup-independently-proved-v1',
              'version': 1,
              'observer': {
                  'pr': int(os.environ['CARRIER_PR']),
                  'head': os.environ['CARRIER_HEAD'],
                  'branch': os.environ['BRANCH'],
                  'run': int(os.environ['GITHUB_RUN_ID']),
                  'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              },
              'writer': {
                  'run': int(os.environ['WRITER_RUN']),
                  'job': int(os.environ['WRITER_JOB']),
                  'artifact': int(os.environ['WRITER_ARTIFACT']),
                  'artifact_digest': os.environ['WRITER_DIGEST'],
                  'receipt_identity': cleanup['identity'],
                  'authorization_identity': cleanup['authorization_identity'],
              },
              'canonical': {
                  'main': os.environ['CLEANUP_MAIN'],
                  'parent': os.environ['INSTALLATION_MAIN'],
                  'tree': os.environ['PRODUCT_TREE'],
                  'proved_product_commit': os.environ['PRODUCT_MAIN'],
                  'product_file_delta': 0,
                  'writer_paths_absent': True,
                  'prefix_refs_remaining': 0,
              },
              'cycle': {
                  'id': os.environ['CYCLE_ID'],
                  'waterline_event': os.environ['WATERLINE_EVENT'],
                  'receipt_identity': os.environ['RECEIPT_IDENTITY'],
                  'task': os.environ['TASK_ID'],
                  'lease': os.environ['LEASE_ID'],
                  'wall': os.environ['WALL_ID'],
                  'portrait_sha256': os.environ['PORTRAIT_SHA256'],
              },
              'queue': {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0},
              'media': {'complete': 22, 'total': 22, 'debt': 0},
              'gates': {
                  'cycle_010': True,
                  'cycle_011': True,
                  'autopilot': True,
                  'media_validate': True,
                  'media_22_of_22': True,
                  'waterline_validate': True,
                  'complete_rendered_gate': True,
                  'clean_worktree': True,
              },
              'authority': {
                  'cycle_011_cleanup_complete': True,
                  'cycle_012_selection_authorized': True,
                  'cycle_012_lease_issued': False,
                  'cycle_012_product_authority': False,
                  'repository_mutation': False,
                  'canonical_mutation': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          proof['identity'] = hashlib.sha256(json.dumps(proof, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/terminal-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          (root / 'TERMINAL_CYCLE_011_RASTEL_CLEANUP_COMPLETE').write_text(proof['identity'] + '\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-terminal-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-terminal-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/observe-cycle-011-rastel-cleanup-terminal-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
