name: doctor-who-cycle-009-real-preflight-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-real-preflight-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-real-preflight-v1
  cancel-in-progress: true

jobs:
  preflight:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-real-preflight-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 47ccb38eab6a4b6e2a16ed92b04f1259b95de783
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-009-real-preflight-v1
      SELF: .github/workflows/doctor-who-cycle-009-real-preflight-v1.yml
      OUT: /tmp/doctor-who-cycle-009-real-preflight-v1
      SCOPE_ID: doctor-who
      PROFILE_ID: text-vision
      EXPECTED_TOTAL: "316"
      EXPECTED_QUEUED: "308"
      EXPECTED_RESOLVED: "8"
      EXPECTED_IN_FLIGHT: "0"
      PRIOR_CYCLE_ID: cycle_89daa03cca72b8522c76725c
      PRIOR_RECEIPT: data/review/adapter-sdk/doctor-who-cycle-008-kreg.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-path read-only carrier and canonical cycle 008
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,current,receipt,sources}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/carrier-files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROOT'])
          pr = json.loads((root/'api/carrier-pr.json').read_text())
          files = json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number'] == int(os.environ['PR'])
          assert pr['state'] == 'open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref'] == 'main' and pr['base']['sha'] == os.environ['EXACT_MAIN']
          assert pr['head']['ref'] == os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha'] == os.environ['HEAD']
          assert pr['commits'] == 1 and pr['changed_files'] == 1
          assert len(files) == 1 and files[0]['filename'] == os.environ['SELF'] and files[0]['status'] == 'added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove canonical cycle closure and actual claim gate
        shell: bash
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee "$OUT/receipt/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/receipt/complete-gate.log" >/dev/null
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/receipt/cycle-008.log"
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/receipt/cycle-007.log"
          node scripts/autopilot.mjs validate | tee "$OUT/receipt/autopilot-validate.log"
          node scripts/autopilot.mjs readiness --scope "$SCOPE_ID" --require-active --json > "$OUT/receipt/readiness.json"
          node scripts/autopilot.mjs status --scope "$SCOPE_ID" --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope "$SCOPE_ID" --requested 1 --json > "$OUT/receipt/waterline-status.json"
          node scripts/waterline.mjs gate --scope "$SCOPE_ID" --requested 1 | tee "$OUT/receipt/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope "$SCOPE_ID" | tee "$OUT/receipt/media-gate.log"
          jq -e --argjson total "$EXPECTED_TOTAL" --argjson queued "$EXPECTED_QUEUED" --argjson resolved "$EXPECTED_RESOLVED" --argjson inflight "$EXPECTED_IN_FLIGHT" \
            '.total == $total and .statuses.queued == $queued and .statuses.resolved == $resolved and .in_flight == $inflight' \
            "$OUT/receipt/status.json" >/dev/null
          jq -e '.scope_id == "doctor-who" and .claim_allowed == true and .claim_reasons == [] and .capacity.requested_tasks == 1 and .capacity.max_tasks_per_cycle == 1 and .jobs.in_flight == 0 and .media.debt == 0 and .cycles.unreceipted == []' \
            "$OUT/receipt/waterline-status.json" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Select deterministic cycle 009 obligation without claiming
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs candidates \
            --scope "$SCOPE_ID" \
            --capability-profile "$PROFILE_ID" \
            --limit 200 \
            --json > "$OUT/receipt/candidates.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const env = process.env;
          const parse = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const stable = (value) => {
            if (Array.isArray(value)) return value.map(stable);
            if (!value || typeof value !== 'object') return value;
            return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]));
          };
          const stableJson = (value) => JSON.stringify(stable(value));

          const statePath = 'data/AUTOPILOT.json';
          const stateBytes = fs.readFileSync(statePath);
          const state = JSON.parse(stateBytes);
          const report = parse(`${env.OUT}/receipt/candidates.json`);
          const status = parse(`${env.OUT}/receipt/status.json`);
          const waterline = parse(`${env.OUT}/receipt/waterline-status.json`);
          const readinessDoc = parse(`${env.OUT}/receipt/readiness.json`);
          const readiness = Array.isArray(readinessDoc) ? readinessDoc[0] : readinessDoc;
          const priorBytes = fs.readFileSync(env.PRIOR_RECEIPT);
          const prior = JSON.parse(priorBytes);
          const scoped = state.jobs.filter((job) => job.scope === env.SCOPE_ID);
          const active = state.jobs.filter((job) => ['leased', 'drafted', 'merged'].includes(job.status));

          if (scoped.length !== Number(env.EXPECTED_TOTAL)) throw new Error('Doctor Who task denominator drifted');
          if (status.statuses?.queued !== Number(env.EXPECTED_QUEUED) || status.statuses?.resolved !== Number(env.EXPECTED_RESOLVED) || status.in_flight !== Number(env.EXPECTED_IN_FLIGHT)) throw new Error('Doctor Who queue tuple drifted');
          if (active.length !== 0) throw new Error(`global estate has ${active.length} active jobs`);
          if (waterline.claim_allowed !== true || waterline.claim_reasons.length !== 0) throw new Error('canonical waterline does not authorize one claim');
          if (!readiness || readiness.scope_id !== env.SCOPE_ID || readiness.effective_status !== 'active' || readiness.lease_status !== 'ready' || !readiness.lease_token) throw new Error('Doctor Who readiness is not lease-ready');
          if (prior.transaction !== 'DOCTOR-WHO-CYCLE-008-KREG') throw new Error('cycle-008 receipt identity drifted');
          if (prior.reviewed_cycle?.id !== env.PRIOR_CYCLE_ID) throw new Error('cycle-008 reviewed cycle identity drifted');
          if (prior.boundary?.cycle_009_authorized !== false || prior.boundary?.ninth_lease_issued !== false) throw new Error('cycle-008 historical no-ninth-lease boundary drifted');
          if (report.scope_id !== env.SCOPE_ID || report.profile?.id !== env.PROFILE_ID || report.profile?.status !== 'active') throw new Error('capability selection contract drifted');
          if (report.counts?.compatible !== Number(env.EXPECTED_QUEUED) || report.counts?.incompatible !== 0) throw new Error('capability-filtered queue denominator drifted');
          if (!Array.isArray(report.compatible) || report.compatible.length < 1) throw new Error('compatible queue is empty');

          const selected = report.compatible[0];
          const task = scoped.find((job) => job.id === selected.task_id);
          if (!task || task.status !== 'queued') throw new Error('selected task is not queued');
          if (task.id === prior.task?.id) throw new Error('cycle-008 task was selected again');
          if (task.source_fingerprint !== selected.source_fingerprint) throw new Error('selected source fingerprint drifted');
          if (!Array.isArray(task.source_receipts) || task.source_receipts.length < 1) throw new Error('selected task lacks revision-bound source receipts');

          const orderedIds = report.compatible.map((row) => row.task_id);
          const packet = {
            version: 1,
            status: 'cycle-009-read-only-preflight-complete',
            canonical_main: env.EXACT_MAIN,
            carrier_pr: Number(env.CARRIER_PR),
            carrier_head: env.CARRIER_HEAD,
            prior_cycle: {
              id: env.PRIOR_CYCLE_ID,
              receipt_path: env.PRIOR_RECEIPT,
              receipt_file_sha256: sha(priorBytes),
            },
            canonical_gate: {
              claim_allowed: true,
              claim_reasons: [],
              requested_tasks: 1,
              max_tasks_per_cycle: 1,
              media_debt: waterline.media.debt,
              unreceipted_cycles: waterline.cycles.unreceipted.length,
              global_active_jobs: active.length,
            },
            queue: {
              total: scoped.length,
              queued: status.statuses.queued,
              resolved: status.statuses.resolved,
              in_flight: status.in_flight,
              compatible: report.counts.compatible,
              incompatible: report.counts.incompatible,
              ordered_task_ids_sha256: sha(orderedIds.join('\n') + '\n'),
            },
            selection_strategy: 'canonical-first-compatible-read-only',
            capability_profile: report.profile,
            capability_policy_sha256: report.policy_sha256,
            selected,
            task,
            readiness,
            state_file_sha256: sha(stateBytes),
            lease_issued: false,
            queue_mutated: false,
            canonical_record_created: false,
            media_adopted: false,
            cycle_receipt_written: false,
            repository_write: false,
            outside_human_dependency: false,
            owner_physical_action_required: false,
          };
          packet.identity = sha(stableJson(packet));
          fs.writeFileSync(`${env.OUT}/receipt/selected-task.json`, JSON.stringify(packet, null, 2) + '\n');
          fs.writeFileSync(`${env.OUT}/receipt/selected-task-id.txt`, `${task.id}\n`);
          fs.writeFileSync(`${env.OUT}/receipt/selected-source-fingerprint.txt`, `${task.source_fingerprint}\n`);
          NODE

      - name: Recover every revision-bound source body exactly
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const env = process.env;
          const packet = JSON.parse(fs.readFileSync(`${env.OUT}/receipt/selected-task.json`, 'utf8'));
          const recovered = [];
          for (const [index, receipt] of packet.task.source_receipts.entries()) {
            const source = new URL(receipt.source);
            const endpoint = new URL('/api.php', source.origin);
            endpoint.search = new URLSearchParams({
              action: 'query',
              prop: 'revisions',
              revids: String(receipt.revision),
              rvprop: 'ids|timestamp|content',
              rvslots: 'main',
              format: 'json',
              formatversion: '2',
              origin: '*',
            }).toString();
            const response = await fetch(endpoint, { headers: { 'user-agent': 'Undercast exact-source recovery/1.0' } });
            if (!response.ok) throw new Error(`source fetch failed ${response.status}: ${receipt.source}`);
            const doc = await response.json();
            const page = doc?.query?.pages?.[0];
            const revision = page?.revisions?.[0];
            const content = revision?.slots?.main?.content ?? revision?.slots?.main?.['*'] ?? revision?.['*'];
            if (page?.pageid !== receipt.pageid || revision?.revid !== receipt.revision || revision?.timestamp !== receipt.timestamp) throw new Error(`source identity drifted: ${receipt.source}`);
            if (typeof content !== 'string') throw new Error(`source body missing: ${receipt.source}`);
            const bytes = Buffer.from(content);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== receipt.content_sha256) throw new Error(`source content SHA drifted: ${receipt.source}`);
            const name = `source-${String(index + 1).padStart(2, '0')}.wikitext`;
            fs.writeFileSync(`${env.OUT}/sources/${name}`, bytes);
            recovered.push({ ...receipt, recovered_file: name, recovered_bytes: bytes.length, recovered_sha256: digest });
          }
          fs.writeFileSync(`${env.OUT}/receipt/recovered-sources.json`, JSON.stringify(recovered, null, 2) + '\n');
          NODE
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Seal read-only cycle 009 preflight
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$OUT/current/package.json"
          mkdir -p "$OUT/current/scripts/lib" "$OUT/current/data/review/adapter-sdk"
          cp scripts/autopilot.mjs "$OUT/current/scripts/autopilot.mjs"
          cp scripts/lib/autopilot-capabilities.mjs "$OUT/current/scripts/lib/autopilot-capabilities.mjs"
          cp scripts/lib/waterline.mjs "$OUT/current/scripts/lib/waterline.mjs"
          cp data/WATERLINE.json "$OUT/current/data/WATERLINE.json"
          cp data/AUTOPILOT-CAPABILITIES.json "$OUT/current/data/AUTOPILOT-CAPABILITIES.json"
          cp "$PRIOR_RECEIPT" "$OUT/current/data/review/adapter-sdk/doctor-who-cycle-008-kreg.json"
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" > "$OUT/SHA256SUMS"
          ! grep -Fq "$OUT/SHA256SUMS.pre" "$OUT/SHA256SUMS.pre"
          test -z "$(git status --porcelain)"

      - name: Upload exact cycle 009 preflight
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-real-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-real-preflight-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-real-preflight-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-real-preflight-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
