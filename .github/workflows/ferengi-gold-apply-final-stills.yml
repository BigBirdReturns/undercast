name: ferengi-gold-apply-final-stills

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-GOLD-FINAL-STILLS-APPLY.json"
      - ".github/workflows/ferengi-gold-apply-final-stills.yml"
      - "scripts/ferengi-gold-apply-final-stills.mjs"

permissions:
  contents: write

concurrency:
  group: ferengi-gold-apply-final-stills-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Ensure deterministic composite renderer is available
        run: |
          set -euo pipefail
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          (magick -version 2>/dev/null || convert -version) | head -n 2
      - name: Verify the active Ferengi lock and exact final-still authorization
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-apply-final-stills"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock-before.log"
          node --input-type=module - <<'NODE' | tee "$root/authorization.log"
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-GOLD-FINAL-STILLS-APPLY.json','utf8'));
          if(row.scope!=='star-trek'||row.species!=='ferengi'||row.reviewed_role!=='second-desk')throw new Error('final-still authorization scope or authority drift');
          if(!Array.isArray(row.entries)||row.entries.length!==4)throw new Error('final-still authorization must cover four cards');
          const ids=row.entries.map(entry=>entry.id);
          if(new Set(ids).size!==ids.length)throw new Error('final-still authorization has duplicate ids');
          if(row.entries.find(entry=>entry.id==='UC-298')?.sources?.length!==3)throw new Error('UC-298 must retain exactly three role sources');
          console.log(`PASS — exact final-still authorization covers ${ids.join(', ')}`);
          NODE
      - name: Apply the three exact singles and one reviewed three-role composite
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-apply-final-stills"
          node scripts/ferengi-gold-apply-final-stills.mjs apply 2>&1 | tee "$root/apply.log"
      - name: Rebuild projections and enforce exact-subject rulings
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-apply-final-stills"
          node scripts/credits.mjs | tee "$root/credits-1.log"
          node scripts/shard.mjs | tee "$root/shard-1.log"
          node scripts/build-contract.mjs | tee "$root/contract-1.log"
          node scripts/media-audit.mjs sync | tee "$root/media-sync.log"
          node scripts/ferengi-gold-apply-final-stills.mjs resolution | tee "$root/resolution-build.log"
          node scripts/media-audit.mjs resolve --input data/review/ferengi-gold/final-stills-media-resolution-2026-07-25.json | tee "$root/media-resolve.log"
          node scripts/credits.mjs | tee "$root/credits-2.log"
          node scripts/shard.mjs | tee "$root/shard-2.log"
          node scripts/build-contract.mjs | tee "$root/contract-2.log"
          node scripts/ds9-census.mjs --project-only | tee "$root/ds9-census.log"
          node scripts/ds9-graph.mjs --project-only | tee "$root/ds9-graph.log"
          node scripts/ds9-eligibility-queue.mjs | tee "$root/ds9-eligibility.log"
          node scripts/ds9-maker-queue.mjs | tee "$root/ds9-maker.log"
          node scripts/build-record-pages.mjs | tee "$root/record-pages.log"
          node scripts/ferengi-gold-apply-final-stills.mjs validate | tee "$root/validate-final-stills.log"
          node scripts/media-audit.mjs validate | tee "$root/validate-media.log"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species-lock-after.log"
      - name: Build the permanent candidate and remove this completed still orbit
        run: |
          set -euo pipefail
          git config user.name 'undercast-media-review'
          git config user.email 'undercast-media-review@users.noreply.github.com'
          rm -f \
            .github/FERENGI-GOLD-REMAINING-STILLS.json \
            .github/workflows/ferengi-gold-remaining-stills.yml \
            scripts/ferengi-gold-remaining-stills.mjs \
            .github/FERENGI-GOLD-FINAL-STILLS-APPLY.json \
            .github/workflows/ferengi-gold-apply-final-stills.yml \
            scripts/ferengi-gold-apply-final-stills.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Ferengi gold: close every character-still obligation'
      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-gold-apply-final-stills"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain exact apply, composite, review and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-gold-apply-final-stills-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ferengi-gold-apply-final-stills
            data/review/ferengi-gold/final-stills-applied-2026-07-25.json
            data/review/ferengi-gold/final-stills-media-resolution-2026-07-25.json
            data/review/ferengi-gold/uc-298-triptych-provenance.json
            images/uc-298-still.jpg
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
