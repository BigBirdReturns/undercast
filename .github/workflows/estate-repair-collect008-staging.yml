name: estate-repair-collect008-staging

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect008-staging.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect008-staging
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  WORKFLOW: .github/workflows/estate-adopt-current-null-lane-008.yml
  EXECUTOR: scripts/estate-adopt-current-null-lane-008.mjs
  REARM: data/review/estate-debt/COLLECT-008-STAGING-REARM.json

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Replace brittle porcelain staging with a NUL-safe path census
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/estate-adopt-current-null-lane-008.yml')
          text = path.read_text(encoding='utf-8')

          old_paths = '''      - .github/workflows/estate-adopt-current-null-lane-008.yml
                - scripts/estate-adopt-current-null-lane-008.mjs'''
          new_paths = '''      - .github/workflows/estate-adopt-current-null-lane-008.yml
                - scripts/estate-adopt-current-null-lane-008.mjs
                - data/review/estate-debt/COLLECT-008-STAGING-REARM.json'''

          old_env = '''  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
          '''
          new_env = '''  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            REARM: data/review/estate-debt/COLLECT-008-STAGING-REARM.json
          '''

          old_custody = '''          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
                    test -z "$(git status --porcelain)"'''
          new_custody = '''          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
                    test -z "$(git status --porcelain)"
                    test -e "$REARM"
                    REPAIR_HEAD="$(node -p "require('./$REARM').repair_head")"
                    test "$(node -p "require('./$REARM').transaction")" = "COLLECT-008"
                    test "$(node -p "require('./$REARM').operation")" = "staging-path-census-rearm"
                    git merge-base --is-ancestor "$REPAIR_HEAD" HEAD'''

          old_stage = '''          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
                    test -n "$CHANGED"
                    ACTUAL_IMAGES="$(printf '%s\\n' "$CHANGED" | grep '^images/' | sort || true)"
                    test "$ACTUAL_IMAGES" = "$(cat /tmp/COLLECT-008-expected-images.txt)"
                    while IFS= read -r changed_path; do
                      case "$changed_path" in
                        data/*|records/*) ;;
                        images/*) grep -Fxq "$changed_path" /tmp/COLLECT-008-expected-images.txt ;;
                        *) echo "Unexpected COLLECT-008 candidate path: $changed_path" >&2; exit 1 ;;
                      esac
                    done <<< "$CHANGED"'''
          new_stage = '''          git diff --name-only -z > /tmp/COLLECT-008-tracked-paths.zlist
                    git ls-files --others --exclude-standard -z > /tmp/COLLECT-008-untracked-paths.zlist
                    node --input-type=module - \\
                      /tmp/COLLECT-008-expected-images.txt \\
                      /tmp/COLLECT-008-tracked-paths.zlist \\
                      /tmp/COLLECT-008-untracked-paths.zlist <<'NODE'
                    import fs from 'node:fs';
                    const expectedImages = fs.readFileSync(process.argv[2], 'utf8').split(/\\r?\\n/).filter(Boolean).sort();
                    const readZ = (file) => fs.readFileSync(file).toString('utf8').split('\\0').filter(Boolean);
                    const paths = [...new Set([...readZ(process.argv[3]), ...readZ(process.argv[4])])].sort();
                    if (!paths.length) throw new Error('COLLECT-008 candidate produced no changed paths');
                    const actualImages = paths.filter((file) => file.startsWith('images/')).sort();
                    if (JSON.stringify(actualImages) !== JSON.stringify(expectedImages)) {
                      throw new Error(`COLLECT-008 image path mismatch\\nexpected=${expectedImages.join(',')}\\nactual=${actualImages.join(',')}`);
                    }
                    const unexpected = paths.filter((file) => !file.startsWith('data/') && !file.startsWith('records/') && !expectedImages.includes(file));
                    if (unexpected.length) throw new Error(`COLLECT-008 candidate escaped product boundary: ${unexpected.join(', ')}`);
                    if (!paths.includes('data/specimens.json') || !paths.includes('data/SOURCES.json')) throw new Error('canonical ledgers were not changed');
                    console.log(`PASS — ${paths.length} changed paths include 24 exact images and remain inside data/, records/, and the ruled destination set`);
                    NODE'''

          old_retire = '''          git rm .github/workflows/estate-adopt-current-null-lane-008.yml
                    git add -- "$RECEIPT" "$LEDGER"'''
          new_retire = '''          git rm .github/workflows/estate-adopt-current-null-lane-008.yml "$REARM"
                    git add -- "$RECEIPT" "$LEDGER"'''

          old_expected = '''            '.github/workflows/estate-adopt-current-null-lane-008.yml' \\
                    "$LEDGER" \\
                    "$RECEIPT" | sort)'''
          new_expected = '''            '.github/workflows/estate-adopt-current-null-lane-008.yml' \\
                    "$LEDGER" \\
                    "$REARM" \\
                    "$RECEIPT" | sort)'''

          replacements = [
              (old_paths, new_paths),
              (old_env, new_env),
              (old_custody, new_custody),
              (old_stage, new_stage),
              (old_retire, new_retire),
              (old_expected, new_expected),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact staging repair expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove repaired workflow syntax and exact 24-object denominator
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          node "$EXECUTOR" | tee /tmp/COLLECT-008-staging-repair-preflight.json
          test "$(node -p "require('/tmp/COLLECT-008-staging-repair-preflight.json').authorized")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-staging-repair-preflight.json').pending")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-staging-repair-preflight.json').already_adopted")" = "0"
          grep -Fq 'git diff --name-only -z' "$WORKFLOW"
          grep -Fq 'git ls-files --others --exclude-standard -z' "$WORKFLOW"
          grep -Fq 'COLLECT-008-STAGING-REARM.json' "$WORKFLOW"

      - name: Retire one-shot repair and stage exact source-only change
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect008-staging.yml
          git add -- "$WORKFLOW"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/estate-repair-collect008-staging.yml' "$WORKFLOW" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-008-staging-repair.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-008-staging-repair.tree)" = "$(git write-tree)"

      - name: Publish exact repair under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: make COLLECT-008 staging path census NUL-safe' \
            -m 'substantive_preflight=pass' \
            -m 'quality_precheck=pass' \
            -m 'porcelain_string_comparison=retired' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-008-staging-repair.tree)"
          REPAIR_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$REPAIR_HEAD" >> "$GITHUB_OUTPUT"

      - name: Report repaired staging boundary
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-008 staging boundary repaired and fully gated on workflow run $GITHUB_RUN_ID.

          Repair head: ${{ steps.publish.outputs.head }}.

          The 24-object preflight, application, projection rebuild, and exact +24 complete-pair quality movement had already passed. The remaining failure was the workflow's porcelain-string path comparison. It is replaced by a NUL-safe census of tracked modifications and untracked versioned images with explicit set equality against the 24 ruled destinations. The repaired source-only tree passed the complete repository and rendered-browser gate. No canonical media changed.
          EOF_COMMENT

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-008 staging repair failed closed on workflow run $GITHUB_RUN_ID. No canonical mutation or 24-object payment claim is authorized.
          EOF_COMMENT
