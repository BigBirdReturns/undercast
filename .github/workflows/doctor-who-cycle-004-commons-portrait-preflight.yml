name: doctor-who-cycle-004-commons-portrait-preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/doctor-who-cycle-004-commons-portrait-preflight.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-004-commons-portrait-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-004-commons-portrait-preflight.yml
  EXACT_MAIN: 92d667aaa468b053db2149770085707245da3ef4
  TASK_ID: ap_2dd55dca3530b84be1ad24a0

jobs:
  preflight:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Bind exact current main and two-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=128 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${{ github.event.pull_request.head.ref }}:refs/remotes/origin/${{ github.event.pull_request.head.ref }}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${{ github.event.pull_request.head.ref }})" = "${{ github.event.pull_request.head.sha }}"
          cat > /tmp/expected-paths.txt <<'PATHS'
          .github/workflows/doctor-who-cycle-004-commons-portrait-preflight.yml
          .github/workflows/doctor-who-cycle-004-media-preflight.yml
          PATHS
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test "$(git rev-parse HEAD:data/AUTOPILOT.json)" = "$(git rev-parse "$EXACT_MAIN:data/AUTOPILOT.json")"
          test "$(git rev-parse HEAD:data/MEDIA-AUDIT.json)" = "$(git rev-parse "$EXACT_MAIN:data/MEDIA-AUDIT.json")"
          test "$(git rev-parse HEAD:data/media-manifest.json)" = "$(git rev-parse "$EXACT_MAIN:data/media-manifest.json")"

      - name: Install deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Recover every Dan Starkey Commons-category portrait candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/doctor-who-cycle-004-commons-portrait-preflight/candidates
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path('/tmp/doctor-who-cycle-004-commons-portrait-preflight')
          CANDIDATES = OUT / 'candidates'
          API = 'https://commons.wikimedia.org/w/api.php'
          UA = 'undercast-estate-collector/1.0 (read-only Commons category preflight; sequential requests)'

          def fetch_bytes(url: str, attempts: int = 7) -> bytes:
              last_error: Exception | None = None
              for attempt in range(attempts):
                  request = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': '*/*'})
                  try:
                      with urllib.request.urlopen(request, timeout=120) as response:
                          return response.read()
                  except urllib.error.HTTPError as error:
                      last_error = error
                      if error.code not in {429, 500, 502, 503, 504} or attempt + 1 == attempts:
                          raise
                      retry_after = error.headers.get('Retry-After')
                      delay = float(retry_after) if retry_after and retry_after.isdigit() else min(45.0, 3.0 * (2 ** attempt))
                      print(f'retryable HTTP {error.code}; sleeping {delay:.1f}s before attempt {attempt + 2}/{attempts}', flush=True)
                      time.sleep(delay)
                  except (TimeoutError, urllib.error.URLError) as error:
                      last_error = error
                      if attempt + 1 == attempts:
                          raise
                      delay = min(30.0, 2.0 * (2 ** attempt))
                      print(f'retryable network error {error}; sleeping {delay:.1f}s', flush=True)
                      time.sleep(delay)
              raise RuntimeError(f'fetch exhausted without result: {last_error}')

          def fetch_json(params: dict[str, str]) -> dict:
              return json.loads(fetch_bytes(API + '?' + urllib.parse.urlencode(params)).decode('utf-8'))

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def meta_value(info: dict, key: str) -> str:
              value = ((info.get('extmetadata') or {}).get(key) or {}).get('value') or ''
              value = html.unescape(str(value))
              value = re.sub(r'<[^>]+>', ' ', value)
              return re.sub(r'\s+', ' ', value).strip()

          existing_hashes: set[str] = set()
          for path in Path('images').glob('*'):
              if path.is_file():
                  existing_hashes.add(sha256_file(path))
          manifest = json.loads(Path('data/media-manifest.json').read_text())
          for asset in (manifest.get('assets') or {}).values():
              digest = str(asset.get('sha256') or '').strip()
              if re.fullmatch(r'[0-9a-f]{64}', digest):
                  existing_hashes.add(digest)

          media_audit = json.loads(Path('data/MEDIA-AUDIT.json').read_text())
          existing = []
          for item in media_audit.get('items') or []:
              if item.get('side') == 'portrait' and item.get('actor') == 'Dan Starkey':
                  asset = item.get('asset') or {}
                  existing.append({
                      'wall_id': item.get('wall_id'),
                      'character': item.get('character'),
                      'status': item.get('status'),
                      'src': asset.get('src'),
                      'sha256': asset.get('sha256'),
                      'origin': asset.get('origin'),
                  })
          existing_origins = {str(row.get('origin') or '').strip() for row in existing}

          category = fetch_json({
              'action': 'query',
              'list': 'categorymembers',
              'cmtitle': 'Category:Dan Starkey',
              'cmnamespace': '6',
              'cmtype': 'file',
              'cmlimit': '50',
              'format': 'json',
              'formatversion': '2',
              'origin': '*',
          })
          members = ((category.get('query') or {}).get('categorymembers') or [])
          if len(members) < 3:
              raise SystemExit(f'Dan Starkey Commons category unexpectedly sparse: {len(members)}')

          pageids = '|'.join(str(row['pageid']) for row in members)
          metadata = fetch_json({
              'action': 'query',
              'prop': 'imageinfo',
              'pageids': pageids,
              'iiprop': 'url|size|mime|timestamp|user|sha1|extmetadata',
              'iiurlwidth': '900',
              'format': 'json',
              'formatversion': '2',
              'origin': '*',
          })
          pages_by_id = {int(row['pageid']): row for row in ((metadata.get('query') or {}).get('pages') or []) if row.get('pageid') is not None}

          rows = []
          successful_portraits = []
          for index, member in enumerate(sorted(members, key=lambda row: (row.get('title') or '').casefold()), start=1):
              pageid = int(member['pageid'])
              page = pages_by_id.get(pageid) or {}
              infos = page.get('imageinfo') or []
              if len(infos) != 1:
                  rows.append({'title': member.get('title'), 'pageid': pageid, 'error': 'missing imageinfo'})
                  continue
              info = infos[0]
              mime = info.get('mime')
              if mime not in {'image/jpeg', 'image/png'}:
                  rows.append({'title': member.get('title'), 'pageid': pageid, 'error': f'unsupported mime {mime}'})
                  continue
              origin = str(info.get('descriptionurl') or '').strip()
              download_url = info.get('thumburl') or info.get('url')
              license_name = meta_value(info, 'LicenseShortName') or meta_value(info, 'UsageTerms')
              free_license = bool(re.search(r'CC\s*(?:BY|0)|public domain', license_name, re.I))
              base = {
                  'candidate_index': f'{index:02d}',
                  'title': member.get('title'),
                  'pageid': pageid,
                  'description_url': origin,
                  'original_url': info.get('url'),
                  'download_url': download_url,
                  'mime': mime,
                  'width': info.get('width'),
                  'height': info.get('height'),
                  'timestamp': info.get('timestamp'),
                  'uploader': info.get('user'),
                  'api_sha1': info.get('sha1'),
                  'artist': meta_value(info, 'Artist'),
                  'license': license_name,
                  'credit': meta_value(info, 'Credit'),
                  'description': meta_value(info, 'ImageDescription'),
                  'free_license_candidate': free_license,
                  'already_used_origin': origin in existing_origins,
                  'boundary': {
                      'performer_identity_only': True,
                      'character_evidence': False,
                      'jask_or_generic_sontaran_depiction': False,
                      'adoption_requires_second_desk_review': True,
                  },
              }
              if not free_license or origin in existing_origins:
                  rows.append(base)
                  continue

              safe = base['candidate_index']
              source_path = CANDIDATES / f'{safe}-source'
              portrait_path = CANDIDATES / f'{safe}-portrait.jpg'
              try:
                  source_path.write_bytes(fetch_bytes(download_url))
                  subprocess.run([
                      'convert', str(source_path), '-auto-orient', '-strip',
                      '-resize', '420x600^', '-gravity', 'center', '-extent', '420x600',
                      '-quality', '88', str(portrait_path),
                  ], check=True)
                  portrait_sha = sha256_file(portrait_path)
                  base.update({
                      'source_download_sha256': sha256_file(source_path),
                      'portrait_path': str(portrait_path),
                      'portrait_sha256': portrait_sha,
                      'portrait_dimensions': subprocess.check_output(['identify', '-format', '%w %h', str(portrait_path)], text=True).strip(),
                      'byte_distinct_from_all_existing_media': portrait_sha not in existing_hashes,
                  })
                  successful_portraits.append(str(portrait_path))
              except Exception as error:
                  base['download_or_transform_error'] = f'{type(error).__name__}: {error}'
              rows.append(base)
              time.sleep(2.0)

          eligible = [row for row in rows if row.get('free_license_candidate') and not row.get('already_used_origin') and row.get('byte_distinct_from_all_existing_media')]
          summary = {
              'version': 2,
              'exact_main': os.environ['EXACT_MAIN'],
              'lease_issued': False,
              'task_id': os.environ['TASK_ID'],
              'performer': 'Dan Starkey',
              'role': 'Jask (The Sontaran Ordeal)',
              'category': 'Category:Dan Starkey',
              'category_members': len(members),
              'processed_candidates': len(rows),
              'downloaded_derivatives': len(successful_portraits),
              'eligible_new_portrait_candidates': len(eligible),
              'eligible_candidate_indices': [row['candidate_index'] for row in eligible],
              'candidate_errors': [row for row in rows if row.get('error') or row.get('download_or_transform_error')],
              'existing_dan_starkey_portraits': existing,
              'boundary': {
                  'no_media_adopted': True,
                  'no_queue_or_corpus_mutation': True,
                  'portrait_may_remain_honestly_absent': True,
              },
          }
          (OUT / 'category-api.json').write_text(json.dumps(category, indent=2) + '\n')
          (OUT / 'metadata-api.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (OUT / 'portrait-candidates.json').write_text(json.dumps(rows, indent=2) + '\n')
          (OUT / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

          shopt -s nullglob
          portraits=(/tmp/doctor-who-cycle-004-commons-portrait-preflight/candidates/*-portrait.jpg)
          if [ "${#portraits[@]}" -gt 0 ]; then
            montage "${portraits[@]}" \
              -tile 4x -geometry 210x300+8+8 \
              /tmp/doctor-who-cycle-004-commons-portrait-preflight/contact-sheet.jpg
          else
            convert -size 840x300 xc:white -gravity center \
              -pointsize 28 -annotate 0 'No portrait derivatives recovered' \
              /tmp/doctor-who-cycle-004-commons-portrait-preflight/contact-sheet.jpg
          fi
          find /tmp/doctor-who-cycle-004-commons-portrait-preflight -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/doctor-who-cycle-004-commons-portrait-preflight.sha256
          test -z "$(git status --porcelain)"

      - name: Upload exact Commons portrait preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-004-commons-portrait-preflight-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-004-commons-portrait-preflight
            /tmp/doctor-who-cycle-004-commons-portrait-preflight.sha256
            /tmp/expected-paths.txt
            /tmp/actual-paths.txt
