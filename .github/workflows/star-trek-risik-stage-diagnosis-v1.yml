  MEDIA_REVIEW_ROOT: /tmp/star-trek-risik-stage-v1/media-review

jobs:
  diagnose:
    name: trace-risik-stage-input-boundary
    if: ${{ github.event.head_commit.message == 'Diagnose reviewed Star Trek Risik candidate v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct sealed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNTIME_ROOT" /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          mkdir -p "$RUNTIME_ROOT"
          cat .github/recovery/star-trek-risik-stage-recovery-v1/runtime.tar.gz.b64.* | base64 -d > /tmp/star-trek-risik-stage-runtime-v1.tar.gz
          test "$(sha256sum /tmp/star-trek-risik-stage-runtime-v1.tar.gz | awk '{print $1}')" = "$RUNTIME_ARCHIVE_SHA"
          tar -xzf /tmp/star-trek-risik-stage-runtime-v1.tar.gz -C "$RUNTIME_ROOT"
          chmod +x "$LIFECYCLE" "$CENSUS_HELPER" "$STEP_ROOT"/*.sh
      - name: Trace immutable input step
        shell: bash
        run: bash -x "$STEP_ROOT/01.sh"
