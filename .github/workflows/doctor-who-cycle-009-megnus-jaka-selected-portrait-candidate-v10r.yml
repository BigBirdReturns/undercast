name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v10r'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: a3e2c80f4c8826de253e8b10be8a73507b27395e
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a3e2-v10r
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r
      RECOVERY_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v10r
      CONTROL: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v10r
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v10r
      V9_RUN: "31269113542"
      V9_JOB: "93131980368"
      V9_ARTIFACT: "9025086775"
      V9_HEAD: f5cd417dfbc5467bf04da22c39d97dd205e4e4fe
      V9_ZIP_SHA256: 2630e0edc774ad8e7aaf208f539c0e24a988a00caa8880e7f8d019df6dd33751
      V9_RUNNER_SHA256: 9595b44cb8df851234cb78879fa314ee30158b9c18e4971a8a217eb4c04d2d16
      V9_RUNNER_BYTES: "6845"
      V10_RUNNER_SHA256: ab0b84031df4007c2a4d2dea87e34c6eaff60c2b600d638c8e7f5ba384442bdb
      V10_RUNNER_BYTES: "7847"
      V7_MATERIALIZER_SHA256: d9b76ea08805fef3473cd72e5185d238bdfc1ca46bb44ef56fcc32636c3d71ea
      V7_MATERIALIZER_BYTES: "39288"
      V8_MATERIALIZER_SHA256: 0909632b012f06bc111e631c9e0a3e6923a591d9427da638e0bb6821e9ba7e44
      V8_MATERIALIZER_BYTES: "39387"
      V9_MATERIALIZER_SHA256: 67df1640cec61dc20c9e7d737af42a486cf97bbae6e753f392cf4b0815cdd682
      V9_MATERIALIZER_BYTES: "40147"
      V10_MATERIALIZER_SHA256: 3be914e59f06dfe83d7d0b53589b3cceac979e755262abafbd06bc6e1081b90f
      V10_MATERIALIZER_BYTES: "40571"
      OLD_SEGMENT_B64: 
      NEW_SEGMENT_B64: 
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V9 runner and patch one event-shape assertion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$CONTROL" "$OUT" "$RECOVERY_ROOT"
          mkdir -p "$BOOTSTRAP"/{api,archive,extracted,receipt} "$CONTROL"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V9_RUN" > "$BOOTSTRAP/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$V9_JOB" > "$BOOTSTRAP/api/job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V9_ARTIFACT" > "$BOOTSTRAP/api/artifact.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          run=json.loads((root/'api/run.json').read_text())
          job=json.loads((root/'api/job.json').read_text())
          artifact=json.loads((root/'api/artifact.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          assert run['id']==int(os.environ['V9_RUN']) and run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_sha']==os.environ['V9_HEAD']
          assert job['id']==int(os.environ['V9_JOB']) and job['run_id']==int(os.environ['V9_RUN'])
          assert job['status']=='completed' and job['conclusion']=='failure'
          assert artifact['id']==int(os.environ['V9_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['V9_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['V9_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['V9_HEAD']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V9_ARTIFACT/zip" > "$BOOTSTRAP/archive/v9.zip"
          test "$(sha256sum "$BOOTSTRAP/archive/v9.zip" | cut -d' ' -f1)" = "$V9_ZIP_SHA256"
          ROOT="$BOOTSTRAP" RUNNER="$CONTROL/recovered-run.sh" python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path(os.environ['ROOT'])
          target=root/'extracted'
          with zipfile.ZipFile(root/'archive/v9.zip') as z:
              infos=z.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for row in infos:
                  path=pathlib.PurePosixPath(row.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if row.is_dir(): continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(z.read(row))
          base=target/'doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v9'
          runner=base/'receipt/recovered-run-v9.sh'
          source_env=base/'source-env.json'
          assert runner.is_file() and source_env.is_file()
          data=runner.read_bytes()
          assert len(data)==int(os.environ['V9_RUNNER_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['V9_RUNNER_SHA256']
          pathlib.Path(os.environ['RUNNER']).write_bytes(data)
          env=json.loads(source_env.read_text())
          assert env['EXACT_MAIN']==os.environ['EXACT_MAIN']
          excluded={'GH_TOKEN','EXACT_MAIN','BRANCH','SELF','OUT','RECOVERY_ROOT','CONTROL','PR_HEAD','PR_NUMBER','PR_BASE_SHA'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          RUNNER="$CONTROL/recovered-run.sh" python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          path=Path(os.environ['RUNNER'])
          data=path.read_bytes()
          assert len(data)==int(os.environ['V9_RUNNER_BYTES'])
          assert hashlib.sha256(data).hexdigest()==os.environ['V9_RUNNER_SHA256']
          text=data.decode()
          old=base64.b64decode(os.environ['OLD_SEGMENT_B64']).decode()
          new=base64.b64decode(os.environ['NEW_SEGMENT_B64']).decode()
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          path.write_text(text)
          assert len(path.read_bytes())==int(os.environ['V10_RUNNER_BYTES'])
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['V10_RUNNER_SHA256']
          PY
          bash -n "$CONTROL/recovered-run.sh"
          cp "$CONTROL/recovered-run.sh" "$BOOTSTRAP/receipt/recovered-run-v10.sh"
          sha256sum "$CONTROL/recovered-run.sh" > "$BOOTSTRAP/receipt/recovered-run-v10.sha256"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Execute exact candidate transaction with exact event-shape proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          chmod 700 "$CONTROL/recovered-run.sh"
          exec "$CONTROL/recovered-run.sh"

      - name: Upload exact selected-portrait candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v10r
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v10r
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v10r
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v10r
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
