name: doctor-who-cycle-012-media-census-v7

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v7.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v7
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v7'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SUPERVISOR_BLOBS: "abeb346fd0f9cc1c2fc1eb302cd705155888e40d fa51ebd090b02904c0ffa40ff32354ddd9a84f2e"
      SUPERVISOR_B64_BYTES: "6040"
      SUPERVISOR_B64_SHA256: db7d058d73887cd0d7db55b93aa1b2cbb7f4365ff6762e6c22e28c95a567373d
      SUPERVISOR_GZIP_BYTES: "4529"
      SUPERVISOR_GZIP_SHA256: 013003120c5232c45f2721430e2bcbad216c70147677429fd77595e0cb7d0fed
      SUPERVISOR_BYTES: "12951"
      SUPERVISOR_SHA256: 754a6f8d74a260b58b6973efa51c0f6182072af07909429a12ceebb0ae444e47
      ROOT: /tmp/doctor-who-cycle-012-media-census-v7-supervisor
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact V7 path-specific source repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          : > "$ROOT/supervisor.sh.gz.b64"
          for blob in $SUPERVISOR_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$ROOT/supervisor.sh.gz.b64"
          done
          test "$(wc -c < "$ROOT/supervisor.sh.gz.b64" | tr -d ' ')" = "$SUPERVISOR_B64_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz.b64" | awk '{print $1}')" = "$SUPERVISOR_B64_SHA256"
          base64 -d "$ROOT/supervisor.sh.gz.b64" > "$ROOT/supervisor.sh.gz"
          test "$(wc -c < "$ROOT/supervisor.sh.gz" | tr -d ' ')" = "$SUPERVISOR_GZIP_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh.gz" | awk '{print $1}')" = "$SUPERVISOR_GZIP_SHA256"
          gzip -dc "$ROOT/supervisor.sh.gz" > "$ROOT/supervisor.sh"
          test "$(wc -c < "$ROOT/supervisor.sh" | tr -d ' ')" = "$SUPERVISOR_BYTES"
          test "$(sha256sum "$ROOT/supervisor.sh" | awk '{print $1}')" = "$SUPERVISOR_SHA256"
          bash -n "$ROOT/supervisor.sh"
          SUPERVISOR="$ROOT/supervisor.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['SUPERVISOR']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-012-media-census-v7-supervisor-{index}>','exec')
          PY
          chmod 700 "$ROOT/supervisor.sh"
          "$ROOT/supervisor.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v7-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v7/payload
            /tmp/doctor-who-cycle-012-media-census-v6-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v7-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v7
            /tmp/doctor-who-cycle-012-media-census-v7-loader
            /tmp/doctor-who-cycle-012-media-census-v6-failure
            /tmp/doctor-who-cycle-012-media-census-v7-supervisor
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
