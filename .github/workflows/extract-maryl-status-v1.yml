name: extract-maryl-status-v1
on:
  push:
    branches: [agent/extract-maryl-status-v1]
permissions:
  actions: read
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/extract-maryl-helper-for-queen-v1
      TARGET_WORKFLOW: extract-maryl-helper-for-queen-v1
      RESULT_BRANCH: agent/extract-maryl-status-result-v1
      ROOT: transport/extract-maryl-status-v1
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Capture run state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/extract-maryl-status-v1 && mkdir -p /tmp/extract-maryl-status-v1
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=30")"
          run="$(jq -c --arg name "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last // empty' <<<"$runs")"
          test -n "$run"
          id="$(jq -r .id <<<"$run")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" | jq . > /tmp/extract-maryl-status-v1/run.json
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" | jq . > /tmp/extract-maryl-status-v1/jobs.json
          jq -n --argjson run_id "$id" --arg status "$(jq -r .status /tmp/extract-maryl-status-v1/run.json)" --arg conclusion "$(jq -r '.conclusion // ""' /tmp/extract-maryl-status-v1/run.json)" '{run_id:$run_id,status:$status,conclusion:$conclusion}' > /tmp/extract-maryl-status-v1/status.json
          git config user.name undercast-extract-status
          git config user.email extract-status@users.noreply.github.com
          git switch --orphan status-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT" && cp -a /tmp/extract-maryl-status-v1/. "$ROOT/"
          git add "$ROOT" && git commit -m 'Capture Maryl extraction status'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
