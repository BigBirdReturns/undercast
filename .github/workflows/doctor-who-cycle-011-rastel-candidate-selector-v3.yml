    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact three-candidate selector runner and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_RUNNER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/runner.source.sh.gz"
          test "$(wc -c < "$CARRIER/runner.source.sh.gz" | tr -d ' ')" = "$SOURCE_RUNNER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER/runner.source.sh.gz" | awk '{print $1}')" = "$SOURCE_RUNNER_GZIP_SHA256"
          gzip -dc "$CARRIER/runner.source.sh.gz" > "$CARRIER/runner.source.sh"
          test "$(wc -c < "$CARRIER/runner.source.sh" | tr -d ' ')" = "$SOURCE_RUNNER_BYTES"
          test "$(sha256sum "$CARRIER/runner.source.sh" | awk '{print $1}')" = "$SOURCE_RUNNER_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$PATCH_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/runner.patch"
          test "$(wc -c < "$CARRIER/runner.patch" | tr -d ' ')" = "$PATCH_BYTES"
          test "$(sha256sum "$CARRIER/runner.patch" | awk '{print $1}')" = "$PATCH_SHA256"
          (cd "$CARRIER" && patch --batch --fuzz=0 runner.source.sh < runner.patch)
          mv "$CARRIER/runner.source.sh" "$CARRIER/runner.sh"
          test "$(wc -c < "$CARRIER/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$CARRIER/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$CARRIER/runner.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-carrier/runner.sh').read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1):
              compile(block, f'<rastel-three-candidate-selector-{index}>', 'exec')
          required = {
              '180ad04ea2288e0f3f99b59991d90b35c6fcc8d640c18fd9af33dbb250082626',
              '584f5606fbdc7495f8302108dedd669803c0c95cf139f9f59bd09a33c8a8398d',
              'e6e9b7bbc96b98339ff425129102df42d9c40f8015a907f4d5d041d1f0a1afa6',
              '4080051f3dec29207d0b9e99857ca616c00964f3c53e1fc610da139c27748b4d',
              '34720dc333f3c23931a05ca13f60f605dbfdb956fb4da001f7757406cf204291',
              'a14de14d05d1717fff2f379d53843c3826ceae751946e6f94a4fdc5f39980bfa',
              'd473a0d802c2b0d3eb37942aadefabd34df4e2b426652d65673a449a7b472706',
              '5be9defa923341b5207f8e60864fdc4b8421aafe4dafd189ab94c8720eef7a2e',
              '188cf18f0ae6a651e5541419ee5d7028686de0e3e574ffb6bcbbf1dde5067306',
              '7bad76c5276cbac69082d1438b44ee58820cbdb15fb922027cdded4d00b36e26',
          }
          assert all(value in text for value in required)
          assert "candidate_denominator': 3" in text
          assert "selection['comparison']['candidate_denominator'] == 2" in text
          assert "set(selection['sources']) == {'selected_v10', 'corroborating_v9_packet'}" in text
          assert 'authenticate_failed_v3_attempt1()' in text
          assert "assert len(rows) == 333" in text
          assert "assert len(rows) == 366" in text
          assert "assert terminal_lines[5] == 'assert len(rows)==365'" in text
          assert "alternate_candidate_authority': False" in text
          assert "selection_only': True" in text
          assert "any(step['status'] == 'completed' and step['conclusion'] == 'success' for step in matching_steps)" in text
          PY
          chmod 700 "$CARRIER/runner.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$CARRIER/runner.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-source/api
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-source/v1
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-source/v2
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-carrier
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v3-source/*.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
