name: doctor-who-cycle-011-rastel-candidate-selector-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-selector-v2
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-selector-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-selector-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v2.yml
      SOURCE: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-source
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2
      CARRIER: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-carrier
      REPAIR: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-repair.json
      TRANSPORT: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-transport

      V1_PR: "770"
      V1_HEAD: dd31b070b3a47dd3050722766f1adc984707e0c1
      V1_RUN: "31334240792"
      V1_JOB: "93297343102"
      V1_ARTIFACT: "9043829901"
      V1_ARTIFACT_FILES: "11"
      V1_ARTIFACT_SHA256: d06783422691beaa4a3c0c98a3b8ace35f6a5704a1d51c044a0576cb98350c94
      V1_RUNNER_BYTES: "26464"
      V1_RUNNER_SHA256: fcf65ecced0b79b851cd8e3cecb581cb9243a5095f616ac13dfc0dddd61a30f4
      V1_RUNNER_GZIP_BYTES: "8319"
      V1_RUNNER_GZIP_SHA256: 6bb0616dc9ebd4cb3c2d29fa05a9d6564528b46d4e0b1922f60e84c47b4a0587

      RUNNER_BLOBS: "4dfa24a4c3e9e8159c4ee3bf9bfacd0a0cbf0c8c 8dd7e16a9f641db7da22273df429b13a65581c61 1b7bdc5b86a79b13322781f9d326fe7cc907ab4c 3a0e82227c17f1e91eb78f485d8877753730ad33 321ed178ee99e263e6b83c1e7fcd70af344aa101"
      RUNNER_CHUNK_BYTES: "2400 2400 2400 2400 1508"
      RUNNER_CHUNK_SHA256: "d53ec78550c59988f28c792f4aef936b2fb4e5884ed7f0604c5e0929057b5c10 d60597cc9c5ec611ed7f415c15ef562b1cdcb13eccb4096fd4b5cb9449eba65a 5f15ed1cc7fe3d49bf7607bbd0527abb5bb54f258e6131ebe91b307028bae04e 3e6643a86bf0162a231674356301334932c7c00fa379c347b7b741da741f928d 5aadec82a30a626384b71d862c3907416d5ffcdd2d600d8f29d6c4dde6b8d077"
      RUNNER_B64_BYTES: "11108"
      RUNNER_B64_SHA256: 42823b2cdf94cbacb59a19a6e7d2fce59bd60517d2f577f28a8008626fc3dbf7
      RUNNER_GZIP_BYTES: "8331"
      RUNNER_GZIP_SHA256: c55d9ef654754ab97067d98ff30ae7aa7e512de840e5cf2fb5c4413ba317d7d7
      RUNNER_BYTES: "26528"
      RUNNER_SHA256: 3192ea72620828fd842f75a43a054c1b2647086bff6dd79a4eb822259eb767f8

      V10_PR: "766"
      V10_HEAD: 27b902abdb8e5094e45af7938b58907203e2aa74
      V10_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main
      V10_RUN: "31333461683"
      V10_JOB: "93295270939"
      V10_ARTIFACT: "9043638791"
      V10_ARTIFACT_FILES: "361"
      V10_ARTIFACT_SIZE: "48470438"
      V10_ARTIFACT_SHA256: b5aa012544058c97bdff335146c67d9ad3f5d2db100f10b0ae0ba048205b8a05
      V10_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main-31333461683-attempt-1
      V9_PR: "767"
      V9_HEAD: 83b8b0867b64e56f43955a77390173f05e2924fa
      V9_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-packet-v9
      V9_RUN: "31333660931"
      V9_JOB: "93295812614"
      V9_ARTIFACT: "9043662459"
      V9_ARTIFACT_FILES: "391"
      V9_ARTIFACT_SIZE: "53773564"
      V9_ARTIFACT_SHA256: 4a499d6050f721094b273d638725b29a7f3d5a6fed41ba91e5a0919f69a97673
      V9_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-packet-v9-31333660931-attempt-1

      CONTROLLER_BLOBS: "3291e5b66ce17c4b7a16fbdad1d012bf9b6df3c8 ab219746d800b3145e30f6b7499c10b43be16003 f08f53ba69a05cf6252c4fc2a00a7dc27c82e51a"
      CONTROLLER_CHUNK_BYTES: "2400 2400 48"
      CONTROLLER_CHUNK_SHA256: "da6226f6a3f764492772f369d34bfbe986f0b82731db8084cf9d390c211ef893 074a55da4a1f297826d023bb41b174047c8bdcb26324b60bb5146a63f1556dbd 70f77ad7cc930cb2e76f96d9c8a9afae2900eb07d971c8a9555c5b03bc2b8526"
      CONTROLLER_B64_BYTES: "4848"
      CONTROLLER_B64_SHA256: 2bf5c035f1c497766cb461fe85fa1a409079bab17a98d7eaa9fe561b0b4b80b7
      CONTROLLER_GZIP_BYTES: "3634"
      CONTROLLER_GZIP_SHA256: d41b0dad58edfeec54adfc046ab1891f358f99bca458f1e1ef6c5067fc4d606c
      CONTROLLER_BYTES: "11170"
      CONTROLLER_SHA256: 015c5d089f2d9b0f73992cdd1c4d145c90b32fe59c29d980b9d9b60efaa478e5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct exact V2 selector controller and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRANSPORT"
          mkdir -p "$TRANSPORT"
          : > "$TRANSPORT/controller.sh.gz.b64"
          read -r -a blobs <<< "$CONTROLLER_BLOBS"
          read -r -a sizes <<< "$CONTROLLER_CHUNK_BYTES"
          read -r -a hashes <<< "$CONTROLLER_CHUNK_SHA256"
          test "${#blobs[@]}" = 3
          for index in 0 1 2; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$TRANSPORT/chunk.$index"
            test "$(wc -c < "$TRANSPORT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$TRANSPORT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$TRANSPORT/chunk.$index" >> "$TRANSPORT/controller.sh.gz.b64"
          done
          test "$(wc -c < "$TRANSPORT/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$TRANSPORT/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d "$TRANSPORT/controller.sh.gz.b64" > "$TRANSPORT/controller.sh.gz"
          test "$(wc -c < "$TRANSPORT/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$TRANSPORT/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$TRANSPORT/controller.sh.gz" > "$TRANSPORT/controller.sh"
          test "$(wc -c < "$TRANSPORT/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$TRANSPORT/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$TRANSPORT/controller.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-transport/controller.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<rastel-selector-v2-controller-{index}>','exec')
          PY
          chmod 700 "$TRANSPORT/controller.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$TRANSPORT/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-source/api
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-carrier
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-repair.json
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-transport
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-source/v10.zip
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-source/v9.zip
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v2-carrier/v1.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
