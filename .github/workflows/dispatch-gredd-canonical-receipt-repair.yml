name: dispatch-gredd-canonical-receipt-repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-gredd-canonical-receipt-repair.yml"

permissions:
  contents: write

concurrency:
  group: dispatch-gredd-canonical-receipt-repair
  cancel-in-progress: false

env:
  SELF: .github/workflows/dispatch-gredd-canonical-receipt-repair.yml
  TARGET_BRANCH: agent/doctor-who-gredd-cycle-002-publication
  TARGET_PATCH: .github/workflows/repair-doctor-who-cycle-002-canonical-receipt.yml
  TARGET_WORKFLOW: .github/workflows/complete-doctor-who-cycle-002-v2.yml
  EXPECTED_TARGET_HEAD: 32d7291ac3f7cf8f5fb9480f8d28dac536c126f6

jobs:
  dispatch:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 256

      - name: Apply the exact canonical receipt repair and retire this dispatcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f "$SELF"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com

          dispatcher_head="$(git rev-parse HEAD)"
          git fetch --no-tags --depth=256 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$dispatcher_head"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$EXPECTED_TARGET_HEAD"

          git worktree add --detach /tmp/gredd-target "refs/remotes/origin/${TARGET_BRANCH}"
          cd /tmp/gredd-target
          target_base="$(git merge-base HEAD refs/remotes/origin/main)"
          test -n "$target_base"
          cat > /tmp/expected-before.txt <<PATHS
          .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64
          .ci/doctor-who-cycle-002/scripts.tgz.b64
          .github/workflows/complete-doctor-who-cycle-002-v2.yml
          .github/workflows/repair-doctor-who-cycle-002-canonical-receipt.yml
          PATHS
          sort -o /tmp/expected-before.txt /tmp/expected-before.txt
          git diff --name-only "$target_base"...HEAD | sort > /tmp/actual-before.txt
          diff -u /tmp/expected-before.txt /tmp/actual-before.txt

          sed -n "/^          python3 - <<'PY'$/,/^          PY$/p" "$TARGET_PATCH" \
            | sed '1d;$d;s/^          //' \
            > /tmp/repair-gredd-canonical-receipt.py
          test -s /tmp/repair-gredd-canonical-receipt.py
          python3 /tmp/repair-gredd-canonical-receipt.py

          git rm -f "$TARGET_PATCH"
          git add "$TARGET_WORKFLOW"
          git diff --cached --check
          git commit \
            -m 'Doctor Who: canonicalize Gredd cycle receipt custody' \
            -m 'retire the duplicate v1 writer and recover only the known receipt hash mismatch'

          cat > /tmp/expected-after.txt <<PATHS
          .ci/doctor-who-cycle-002/patch-current.mjs.gz.b64
          .ci/doctor-who-cycle-002/scripts.tgz.b64
          .github/workflows/complete-doctor-who-cycle-002-v2.yml
          PATHS
          sort -o /tmp/expected-after.txt /tmp/expected-after.txt
          git diff --name-only "$target_base"...HEAD | sort > /tmp/actual-after.txt
          diff -u /tmp/expected-after.txt /tmp/actual-after.txt
          target_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET_HEAD}"

          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=8 origin "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$dispatcher_head"
          git rm -f "$SELF"
          git commit -m 'Transport: retire canonical Gredd receipt dispatcher'
          cleanup_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/main" \
            --force-with-lease="refs/heads/main:${dispatcher_head}"

          echo "target_base=$target_base" >> "$GITHUB_STEP_SUMMARY"
          echo "target_head=$target_head" >> "$GITHUB_STEP_SUMMARY"
          echo "cleanup_head=$cleanup_head" >> "$GITHUB_STEP_SUMMARY"
          echo "target_paths=3" >> "$GITHUB_STEP_SUMMARY"
          echo "dispatcher_present=false" >> "$GITHUB_STEP_SUMMARY"
