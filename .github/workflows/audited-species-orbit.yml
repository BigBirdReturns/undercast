name: audited-species-orbit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/AUDITED-SPECIES-ORBIT.json"
      - ".github/workflows/audited-species-orbit.yml"
      - "scripts/audited-species-fill.mjs"
      - "scripts/species-eligibility-audit.mjs"
      - "data/review/species-eligibility/**"

permissions:
  contents: write

concurrency:
  group: audited-species-orbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  populate:
    if: github.event.pull_request.head.ref == 'agent/site-gold-map-002'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-gold-map-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Revalidate the exact approved task set
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          control=.github/AUDITED-SPECIES-ORBIT.json
          category=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).category)')
          label=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).label)')
          approval=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).approval_path)')
          mkdir -p /tmp/audited-species-orbit
          node scripts/audited-species-fill.mjs validate-approval --approval "$approval" --category "$category" --label "$label" | tee /tmp/audited-species-orbit/approval-validation.json
          node scripts/species-eligibility-audit.mjs --category "$category" --label "$label" --out /tmp/audited-species-orbit/live-audit.json | tee /tmp/audited-species-orbit/live-audit.log
          APPROVAL="$approval" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const approval=JSON.parse(fs.readFileSync(process.env.APPROVAL,'utf8'));
          const live=JSON.parse(fs.readFileSync('/tmp/audited-species-orbit/live-audit.json','utf8'));
          const liveById=new Map(live.results.map(row=>[row.task_id,row]));
          for(const row of approval.tasks){
            const current=liveById.get(row.task_id);
            if(!current)throw new Error(`live exact-revision audit omitted ${row.task_id}`);
            if(current.source_fingerprint!==row.source_fingerprint)throw new Error(`live source fingerprint drift for ${row.task_id}`);
            if(current.source?.url!==row.source?.url||Number(current.source?.revision)!==Number(row.source?.revision)||current.source?.content_sha256!==row.source?.content_sha256)throw new Error(`live exact source receipt drift for ${row.task_id}`);
            if(row.decision==='eligible'){
              const manualJankom=row.character==='Jankom Pog'&&row.performer==='Jason Mantzoukas';
              if(current.disposition!=='eligible'&&!(manualJankom&&current.disposition==='review'))throw new Error(`approved task ${row.task_id} no longer passes exact eligibility: ${current.disposition}`);
            }else if(row.decision==='excluded-category'&&current.disposition==='eligible')throw new Error(`category exclusion ${row.task_id} became eligible without reviewed approval update`);
          }
          console.log(`PASS — ${approval.counts.eligible} approved tasks and ${approval.counts.excluded_category} category exclusion revalidated`);
          NODE
      - name: File every approved exact task
        run: |
          set -euo pipefail
          control=.github/AUDITED-SPECIES-ORBIT.json
          category=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).category)')
          label=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).label)')
          approval=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).approval_path)')
          transform=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).transform)')
          max_cycles=$(CONTROL="$control" node -e 'console.log(require("./"+process.env.CONTROL).max_cycles)')
          slug=$(CATEGORY="$category" node -e 'console.log(process.env.CATEGORY.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""))')
          out="/tmp/audited-species-orbit/$slug"
          review_root="data/review/audited-species-orbit/$slug"
          mkdir -p "$out" "$review_root"
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          : > "$out/cycles.jsonl"
          cycle=0
          while :; do
            set +e
            node scripts/audited-species-fill.mjs next --approval "$approval" --category "$category" --label "$label" --out "$out/next.json" 2>&1 | tee "$out/next.log"
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 3 ]; then break; fi
            if [ "$code" -ne 0 ]; then exit "$code"; fi
            task_id=$(node -e "console.log(require('$out/next.json').task.task_id)")
            performer=$(node -e "console.log(require('$out/next.json').task.performer)")
            character=$(node -e "console.log(require('$out/next.json').task.character)")
            remaining=$(node -e "console.log(require('$out/next.json').remaining)")
            resume=$(node -e "console.log(require('$out/next.json').resume?'yes':'no')")
            cycle=$((cycle+1))
            if [ "$cycle" -gt "$max_cycles" ]; then echo "refusing to exceed configured audited cycle limit $max_cycles"; exit 1; fi
            batch="$review_root/${task_id}-lease.json"
            prompt="$review_root/${task_id}-prompt.md"
            results="$review_root/${task_id}-results.json"
            map="$review_root/${task_id}-wall-map.json"
            review="$review_root/${task_id}-post-merge-review.json"
            cycle_receipt="$review_root/${task_id}-cycle-receipt.json"
            if [ "$resume" = yes ]; then
              test -f "$batch"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              claim_commit=$(git log -1 --format=%H -- "$batch")
              echo "resuming $task_id from committed lease $lease_id" | tee "$out/resume-${cycle}.log"
            else
              node scripts/autopilot.mjs claim --agent luna --scope star-trek --capability-profile text-vision --task-id "$task_id" --limit 1 --lease-minutes 360 --selection-basis "Approval-bound $label orbit: exact actor, displayed species, source fingerprint, revision and content hash are retained in $approval." --out "$batch" --prompt "$prompt" | tee "$out/claim-${cycle}.log"
              lease_id=$(node -e "console.log(require('./$batch').lease_id)")
              git add data/AUTOPILOT.json data/journal/autopilot.jsonl "$batch" "$prompt"
              git diff --cached --check
              git commit -m "Population: lease approved $label task ${task_id}"
              claim_commit=$(git rev-parse HEAD)
              git push origin HEAD:agent/site-gold-map-002
            fi
            node scripts/audited-species-fill.mjs draft --approval "$approval" --category "$category" --label "$label" --transform "$transform" --batch "$batch" --out "$results" | tee "$out/draft-${cycle}.log"
            node scripts/autopilot.mjs submit --batch "$batch" --input "$results" | tee "$out/submit-${cycle}.log"
            node scripts/grow.mjs --drafts | tee "$out/grow-${cycle}.log"
            node scripts/sync-sources.mjs | tee "$out/sources-${cycle}.log"
            node scripts/audited-species-fill.mjs mark-absent --approval "$approval" --category "$category" --label "$label" --batch "$batch" --map "$map" | tee "$out/absence-${cycle}.log"
            node scripts/credits.mjs > "$out/credits-${cycle}.log" 2>&1
            node scripts/shard.mjs > "$out/shard-${cycle}.log" 2>&1
            node scripts/build-contract.mjs > "$out/contract-${cycle}.log" 2>&1
            node scripts/autopilot.mjs sync > "$out/autopilot-sync-${cycle}.log" 2>&1
            node scripts/media-audit.mjs sync > "$out/media-sync-${cycle}.log" 2>&1
            node scripts/audited-species-fill.mjs review --approval "$approval" --category "$category" --label "$label" --batch "$batch" --map "$map" --out "$review" | tee "$out/review-${cycle}.log"
            node scripts/autopilot.mjs complete --input "$review" | tee "$out/complete-${cycle}.log"
            node scripts/media-audit.mjs gate --scope star-trek > "$out/media-gate-${cycle}.log" 2>&1
            node scripts/audited-species-fill.mjs cycle-receipt --approval "$approval" --category "$category" --label "$label" --batch "$batch" --claim-commit "$claim_commit" --out "$cycle_receipt" | tee "$out/cycle-receipt-${cycle}.log"
            node scripts/waterline.mjs record-cycle --input "$cycle_receipt" | tee "$out/waterline-${cycle}.log"
            wall_id=$(node -e "console.log(require('./$map').records[0].wall_id)")
            node -e "console.log(JSON.stringify({cycle:Number(process.argv[1]),remaining_before:Number(process.argv[2]),task_id:process.argv[3],lease_id:process.argv[4],wall_id:process.argv[5],performer:process.argv[6],character:process.argv[7]}))" "$cycle" "$remaining" "$task_id" "$lease_id" "$wall_id" "$performer" "$character" >> "$out/cycles.jsonl"
            git add -A
            git diff --cached --check
            git commit -m "Population: file approved $label task ${task_id}"
            git push origin HEAD:agent/site-gold-map-002
          done
          report="data/review/star-trek-five-way-accounting-2026-07-25.json"
          receipt="$review_root/accounting-receipt.json"
          node scripts/audited-species-fill.mjs accounting --approval "$approval" --category "$category" --label "$label" --report "$report" --receipt "$receipt" | tee "$out/accounting.log"
          node scripts/waterline.mjs record-accounting --input "$receipt" | tee "$out/accounting-record.log"
          node scripts/credits.mjs > "$out/final-credits.log" 2>&1
          node scripts/shard.mjs > "$out/final-shard.log" 2>&1
          node scripts/build-contract.mjs > "$out/final-contract.log" 2>&1
          node scripts/ds9-census.mjs --project-only > "$out/ds9-census.log" 2>&1
          node scripts/ds9-graph.mjs --project-only > "$out/ds9-graph.log" 2>&1
          node scripts/ds9-eligibility-queue.mjs > "$out/ds9-eligibility.log" 2>&1
          node scripts/ds9-maker-queue.mjs > "$out/ds9-maker.log" 2>&1
          node scripts/build-record-pages.mjs > "$out/record-routes.log" 2>&1
          node scripts/autopilot.mjs validate | tee "$out/autopilot-validate.log"
          node scripts/media-audit.mjs validate | tee "$out/media-validate.log"
          node scripts/media-audit.mjs gate --scope star-trek | tee "$out/media-gate.log"
          node scripts/waterline.mjs validate | tee "$out/waterline-validate.log"
          node scripts/species-fixtures.mjs | tee "$out/species-fixtures.log"
          node scripts/site-sweep.mjs | tee "$out/site-sweep.log"
          npm run audit:corpus -- --json | tee "$out/corpus-audit.json"
          node scripts/audited-species-fill.mjs final-state --approval "$approval" --category "$category" --label "$label" --out "$out/final-state.json" | tee "$out/final-state.log"
          rm -f .github/AUDITED-SPECIES-ORBIT.json .github/workflows/audited-species-orbit.yml .github/SPECIES-ELIGIBILITY-AUDIT.json .github/workflows/species-eligibility-audit.yml
          git add -A
          git diff --cached --check
          git commit -m "Population: complete approval-bound $label orbit"
      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee /tmp/audited-species-orbit/gate.log
          git status --short | tee /tmp/audited-species-orbit/status.txt
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated candidate
        run: git push origin HEAD:agent/site-gold-map-002
      - name: Retain exact audited-orbit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-species-orbit-${{ github.run_id }}
          path: /tmp/audited-species-orbit
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
