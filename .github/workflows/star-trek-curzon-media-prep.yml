name: star-trek-curzon-media-prep

on:
  push:
    branches: [agent/star-trek-curzon-media-prep-v1]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact source and media facets
        env:
          EXPECTED_MAIN: 36778df4f62d7e7f5b206dae4eb5beeac472e2a1
          TASK_ID: ap_ae71b7d08ebdcaf45cd49d54
          SOURCE_FINGERPRINT: 6668f3dc763c8098ff04d9271d2e3e8238bc3cd610cf2a8e3342c64b22909802
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          python -m pip install --disable-pip-version-check --quiet pillow requests
          python <<'PY'
          from __future__ import annotations
          import hashlib, io, json, os, re, sys
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image

          EXPECTED_MAIN = os.environ['EXPECTED_MAIN']
          TASK_ID = os.environ['TASK_ID']
          EXPECTED_FP = os.environ['SOURCE_FINGERPRINT']
          OUT = Path('/tmp/curzon-media-prep')
          OUT.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers['User-Agent'] = 'UNDERCAST/1.0 exact evidence preparation (BigBirdReturns/undercast)'

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def get_json(url: str, params: dict) -> dict:
              r = session.get(url, params=params, timeout=45)
              r.raise_for_status()
              return r.json()

          def download(url: str) -> bytes:
              r = session.get(url, timeout=60)
              r.raise_for_status()
              if len(r.content) < 1000:
                  raise RuntimeError(f'asset too small: {url}')
              return r.content

          state = json.loads(Path('data/AUTOPILOT.json').read_text())
          task = next((row for row in state['jobs'] if row['id'] == TASK_ID), None)
          if not task:
              raise RuntimeError('deterministic Curzon task missing')
          if task.get('status') != 'queued' or task.get('performer') != 'Fred Tatasciore' or task.get('character') != 'Curzon Dax':
              raise RuntimeError(f'Curzon task drifted: {task}')
          if task.get('source_fingerprint') != EXPECTED_FP:
              raise RuntimeError('Curzon source fingerprint drifted')
          receipts = task.get('source_receipts') or []
          if len(receipts) != 1:
              raise RuntimeError('Curzon source receipt is not singular')
          receipt = receipts[0]
          revision = int(receipt['revision'])
          api = 'https://memory-alpha.fandom.com/api.php'
          payload = get_json(api, {
              'action':'query','format':'json','formatversion':'2',
              'prop':'revisions','revids':str(revision),
              'rvprop':'ids|timestamp|content','rvslots':'main'
          })
          pages = payload.get('query',{}).get('pages',[])
          if len(pages) != 1 or not pages[0].get('revisions'):
              raise RuntimeError('frozen Curzon source revision unavailable')
          rev = pages[0]['revisions'][0]
          text = rev['slots']['main']['content']
          if sha256_bytes(text.encode()) != receipt['content_sha256']:
              raise RuntimeError('frozen Curzon source content hash drifted')
          idx = text.lower().find('fred tatasciore')
          if idx < 0:
              raise RuntimeError('frozen source does not name Fred Tatasciore')
          excerpt = text[max(0, idx-1600):min(len(text), idx+2200)]
          normalized = re.sub(r'\s+', ' ', excerpt)
          if 'star trek online' not in normalized.lower():
              raise RuntimeError('Fred Tatasciore credit is not bound to Star Trek Online')
          # The preserved page identifies this performance in the Victory is Life material.
          # Refuse to guess a year if that production boundary is absent.
          if 'victory is life' not in text.lower():
              raise RuntimeError('Victory is Life production boundary is absent from the frozen source')

          specimens = json.loads(Path('data/specimens.json').read_text())
          armus = next(row for row in specimens if row.get('id') == 'UC-1362')
          prior_portrait_origin = armus.get('portrait',{}).get('origin')
          existing_hashes = set()
          for p in Path('images').glob('*'):
              if p.is_file():
                  try: existing_hashes.add(hashlib.sha256(p.read_bytes()).hexdigest())
                  except OSError: pass

          def image_info(api_url: str, title: str) -> dict | None:
              data = get_json(api_url, {
                  'action':'query','format':'json','formatversion':'2',
                  'prop':'imageinfo','titles':title,
                  'iiprop':'url|size|mime|extmetadata'
              })
              pages = data.get('query',{}).get('pages',[])
              if not pages or not pages[0].get('imageinfo'):
                  return None
              info = pages[0]['imageinfo'][0]
              info['title'] = pages[0].get('title', title)
              return info

          # Exact character facet: only a Curzon-named Star Trek Online image is eligible.
          still_candidates = []
          for api_url in ('https://stowiki.net/wiki/api.php','https://sto.fandom.com/api.php'):
              try:
                  search = get_json(api_url, {
                      'action':'query','format':'json','formatversion':'2',
                      'generator':'search','gsrsearch':'Curzon Dax','gsrnamespace':'6',
                      'gsrlimit':'25','prop':'imageinfo','iiprop':'url|size|mime|extmetadata'
                  })
              except Exception:
                  continue
              for page in search.get('query',{}).get('pages',[]):
                  title = page.get('title','')
                  info_list = page.get('imageinfo') or []
                  if not info_list: continue
                  info = info_list[0]
                  hay = (title + ' ' + json.dumps(info.get('extmetadata',{}))).lower()
                  if 'curzon' not in hay or 'dax' not in hay:
                      continue
                  if info.get('width',0) < 320 or info.get('height',0) < 240:
                      continue
                  info['title'] = title
                  info['api'] = api_url
                  still_candidates.append(info)
          if not still_candidates:
              raise RuntimeError('no exact Curzon Dax Star Trek Online character image was found; honest absence must be handled by a bounded candidate revision')
          still_candidates.sort(key=lambda x: (('online' not in (x['title'] + json.dumps(x.get('extmetadata',{}))).lower() and 'sto' not in (x['title'] + json.dumps(x.get('extmetadata',{}))).lower()), -(x.get('width',0)*x.get('height',0))))
          still_info = still_candidates[0]
          still_raw = download(still_info['url'])
          still_im = Image.open(io.BytesIO(still_raw)).convert('RGB')
          still_path = OUT/'uc-1363-still.webp'
          still_im.save(still_path, 'WEBP', quality=90, method=6)
          still_bytes = still_path.read_bytes()
          if sha256_bytes(still_bytes) in existing_hashes:
              raise RuntimeError('Curzon still collides with an existing card asset')

          # Separate performer facet: choose a Commons-licensed Fred portrait with distinct bytes and source.
          commons = 'https://commons.wikimedia.org/w/api.php'
          search = get_json(commons, {
              'action':'query','format':'json','formatversion':'2',
              'generator':'search','gsrsearch':'Fred Tatasciore','gsrnamespace':'6','gsrlimit':'40',
              'prop':'imageinfo','iiprop':'url|size|mime|extmetadata'
          })
          portrait_choice = None
          portrait_raw = None
          for page in search.get('query',{}).get('pages',[]):
              info_list = page.get('imageinfo') or []
              if not info_list: continue
              info = info_list[0]
              meta = info.get('extmetadata',{})
              title = page.get('title','')
              desc = ' '.join(str(meta.get(k,{}).get('value','')) for k in ('ImageDescription','ObjectName','Categories')).lower()
              if 'fred tatasciore' not in (title + ' ' + desc).lower():
                  continue
              license_name = str(meta.get('LicenseShortName',{}).get('value',''))
              if not any(token in license_name.lower() for token in ('cc by','public domain','cc0')):
                  continue
              origin = info.get('descriptionurl') or ('https://commons.wikimedia.org/wiki/' + quote(title.replace(' ','_')))
              if origin == prior_portrait_origin:
                  continue
              if info.get('width',0) < 500 or info.get('height',0) < 500:
                  continue
              try:
                  raw = download(info['url'])
                  im = Image.open(io.BytesIO(raw)).convert('RGB')
                  buf = io.BytesIO(); im.save(buf,'JPEG',quality=93,optimize=True)
                  converted = buf.getvalue()
              except Exception:
                  continue
              digest = sha256_bytes(converted)
              if digest in existing_hashes:
                  continue
              portrait_choice = {'title':title,'info':info,'origin':origin,'license':license_name,'meta':meta}
              portrait_raw = converted
              break
          if portrait_choice is None or portrait_raw is None:
              raise RuntimeError('no distinct licensed Fred Tatasciore portrait was found')
          portrait_path = OUT/'uc-1363-portrait.jpg'
          portrait_path.write_bytes(portrait_raw)

          def meta_value(meta: dict, key: str) -> str | None:
              value = meta.get(key,{}).get('value')
              if value is None: return None
              return re.sub('<[^>]+>','',str(value)).strip() or None

          result = {
              'transaction':'STAR-TREK-CURZON-MEDIA-PREP',
              'canonical_main':EXPECTED_MAIN,
              'task':task,
              'source':{
                  'url':receipt['source'],
                  'pageid':receipt['pageid'],
                  'revision':revision,
                  'timestamp':receipt['timestamp'],
                  'content_sha256':receipt['content_sha256'],
                  'excerpt':normalized,
                  'production':'Star Trek Online: Victory is Life',
                  'year':'2018',
                  'adjudicated_kind':'voice',
                  'physical_performance_by_tatasciore':False,
                  'maker_attribution':'unresolved'
              },
              'still':{
                  'disposition':'verified',
                  'subject':'Curzon Dax in Star Trek Online',
                  'path':'uc-1363-still.webp',
                  'origin':still_info.get('descriptionurl') or still_info.get('url'),
                  'download_url':still_info.get('url'),
                  'title':still_info.get('title'),
                  'sha256':sha256_bytes(still_bytes),
                  'bytes':len(still_bytes),
                  'width':still_im.width,'height':still_im.height,
                  'note':'The source file is explicitly named for Curzon Dax in the Star Trek Online corpus; it is not a live-action Curzon substitute or a generic Trill image.'
              },
              'portrait':{
                  'disposition':'verified',
                  'subject':'Fred Tatasciore',
                  'path':'uc-1363-portrait.jpg',
                  'origin':portrait_choice['origin'],
                  'download_url':portrait_choice['info'].get('url'),
                  'title':portrait_choice['title'],
                  'author':meta_value(portrait_choice['meta'],'Artist'),
                  'license':portrait_choice['license'],
                  'license_url':meta_value(portrait_choice['meta'],'LicenseUrl'),
                  'sha256':sha256_bytes(portrait_raw),
                  'bytes':len(portrait_raw),
                  'width':Image.open(io.BytesIO(portrait_raw)).width,
                  'height':Image.open(io.BytesIO(portrait_raw)).height,
                  'note':'The Commons file is a separate licensed neutral portrait of Fred Tatasciore and is byte-distinct from UC-1362 and every other canonical card asset.'
              }
          }
          Path(OUT/'metadata.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          Path(OUT/'source-excerpt.txt').write_text(normalized+'\n')
          print(json.dumps({
              'status':'PASS','production':result['source']['production'],'year':result['source']['year'],
              'still_sha256':result['still']['sha256'],'portrait_sha256':result['portrait']['sha256'],
              'portrait_origin':result['portrait']['origin']
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-curzon-media-prep
          path: /tmp/curzon-media-prep/
          if-no-files-found: error
          retention-days: 7
      - name: Remove media-prep carrier
        if: always()
        run: git push origin --delete agent/star-trek-curzon-media-prep-v1 || true
