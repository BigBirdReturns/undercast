name: cycle012-cleanup-writer-v8-source-export-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-cleanup-writer-v8-source-export-v1.yml"

permissions: {}

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-cleanup-writer-v8-source-export-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/cycle012-cleanup-writer-v8-source-export-v1
      CURRENT_MAIN: 31bbd0231ff52dfe5a1c6b3b50f2f77c16c3099e
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: observer/cycle012-cleanup-writer-v8-source-export-v1
      CURRENT_PATH: .github/workflows/cycle012-cleanup-writer-v8-source-export-v1.yml
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
      CARRIER_BLOBS: "24e74dabc435f143e15aeb87c875b2a50a0e6e35 4fda304610bfe8309986db1aefd84c980c45461c 27fc3b60e171327f279d5780122024f513416ead 79d64bff317d2567a982d192781047c03a34189e dff675ac9c24a9fd8cb60b80938634a241cf08c1 d9721058ae4f8060bc4d1352a677b65158886a9e"
      CARRIER_B64_BYTES: "18656"
      CARRIER_B64_SHA256: 28fb631716a41de65c5fd6ff3d0cd290f81025b6e75a94e86326ea47753b6a55
      CARRIER_BYTES: "13992"
      CARRIER_SHA256: b29a285a79537579e6b12b81025cf013ba7e0c35d86e88ea6727c7d6eee9b8a0

    steps:
      - name: Authenticate and export exact V8 workflow and carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload}
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          test "$(jq -r '.object.sha' "$OUT/api/main-ref.json")" = "$CURRENT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR/files?per_page=100" > "$OUT/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$WRITER_PATH?ref=$CURRENT_MAIN" > "$OUT/api/writer-content.json"
          jq -r '.content' "$OUT/api/writer-content.json" | tr -d '\n' | base64 -d > "$OUT/payload/writer-v8.yml"
          : > "$OUT/payload/carrier.sh.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$OUT/payload/carrier.sh.b64"
          done
          test "$(wc -c < "$OUT/payload/carrier.sh.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$OUT/payload/carrier.sh.b64" > "$OUT/payload/carrier.sh"
          test "$(wc -c < "$OUT/payload/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$OUT/payload/carrier.sh"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['CURRENT_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CURRENT_MAIN']
          assert pr['head']['ref']==os.environ['CURRENT_BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert [(row['filename'],row['status']) for row in files]==[(os.environ['CURRENT_PATH'],'added')]
          writer=(root/'payload/writer-v8.yml').read_text()
          assert writer.splitlines()[0]=='name: doctor-who-cycle-012-selection-cleanup-writer-v8'
          assert writer.count("github.event.workflow_run.head_repository.full_name == github.repository")==1
          assert writer.count("doctor-who-cycle-012-selection-cleanup-residual-evidence-v8")==6
          assert writer.count("observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8")==1
          carrier=(root/'payload/carrier.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",carrier,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle012-cleanup-writer-v8-source-{index}>','exec')
          receipt={
            'version':1,
            'status':'cycle-012-cleanup-writer-v8-source-export-complete-v1',
            'canonical_main':os.environ['CURRENT_MAIN'],
            'writer':{
              'path':os.environ['WRITER_PATH'],
              'blob':json.loads((root/'api/writer-content.json').read_text())['sha'],
              'bytes':(root/'payload/writer-v8.yml').stat().st_size,
              'sha256':hashlib.sha256((root/'payload/writer-v8.yml').read_bytes()).hexdigest(),
              'skipping_predicate':'github.event.workflow_run.head_repository.full_name == github.repository',
            },
            'carrier':{
              'blobs':os.environ['CARRIER_BLOBS'].split(),
              'base64_bytes':int(os.environ['CARRIER_B64_BYTES']),
              'base64_sha256':os.environ['CARRIER_B64_SHA256'],
              'bytes':int(os.environ['CARRIER_BYTES']),
              'sha256':os.environ['CARRIER_SHA256'],
              'embedded_python_programs':len(blocks),
            },
            'boundary':{
              'source_export_only':True,'writer_executed':False,'repository_write':False,
              'transport_mutation':False,'canonical_mutation':False,'lease_issued':False,
              'queue_mutated':False,'media_adopted':False,'cycle_receipt_written':False,
              'cycle_012_product_authority':False,
            },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'payload/source-export.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (root/'payload/SOURCE_EXPORT_COMPLETE').write_text(receipt['identity']+'\n')
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v8-source-export-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v8-source-export-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v8-source-export-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v8-source-export-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire:
    needs: export
    if: needs.export.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: observer/cycle012-cleanup-writer-v8-source-export-v1
    steps:
      - name: Retire exact outside-prefix source export
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR")"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.ref' <<<"$pr")" = "$CURRENT_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$CURRENT_HEAD"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CURRENT_BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$CURRENT_BRANCH"
