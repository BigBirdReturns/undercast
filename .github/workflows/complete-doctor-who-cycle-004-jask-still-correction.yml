name: complete-doctor-who-cycle-004-jask-still-correction

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/complete-doctor-who-cycle-004-jask-still-correction.yml"
      - ".ci/doctor-who-cycle-004-still-correction/compact-transport.tgz.b64*"

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-doctor-who-cycle-004-jask-still-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  BASE_MAIN: 39a58f2c5538da1adb7657623ee300dbca54a82d
  SELF: .github/workflows/complete-doctor-who-cycle-004-jask-still-correction.yml
  TRANSPORT: .ci/doctor-who-cycle-004-still-correction/compact-transport.tgz.b64
  TRANSPORT_PARTS: "7"
  TRANSPORT_SHA256: 6f976c27a58bf98cd95f634c31d5ba2e00a91fc6fa1fd5dd771d4b01782c52e3
  CORRECTION_DIR: /tmp/doctor-who-cycle-004-still-correction
  MATERIALIZER: /tmp/doctor-who-cycle-004-still-correction/materialize-correction.mjs
  FINALIZER: /tmp/doctor-who-cycle-004-still-correction/finalize-correction.mjs
  CHECKER_SOURCE: /tmp/doctor-who-cycle-004-still-correction/doctor-who-cycle-004-still-correction.mjs
  VERIFICATION_DIR: /tmp/doctor-who-cycle-004-still-verification
  CORRECTION_CONTEXT: /tmp/doctor-who-cycle-004-still-correction-context.json
  GH_TOKEN: ${{ github.token }}

jobs:
  correct:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 256

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y imagemagick
          identify -version

      - name: Download exact post-merge Jask still verification
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-004-still-verification-30874750390
          path: ${{ env.VERIFICATION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30874750390

      - name: Bind exact main and decode compact correction transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=256 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          parts=( "$TRANSPORT" "$TRANSPORT".part-* )
          test "${#parts[@]}" -eq "$TRANSPORT_PARTS"
          {
            printf '%s\n' "${parts[@]}"
            printf '%s\n' "$SELF"
          } | sort > /tmp/expected-transport-paths.txt
          git diff --name-only "$BASE_MAIN"...HEAD | sort > /tmp/actual-transport-paths.txt
          diff -u /tmp/expected-transport-paths.txt /tmp/actual-transport-paths.txt

          correction_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          test -n "$correction_at"
          echo "CORRECTION_AT=$correction_at" >> "$GITHUB_ENV"

          mkdir -p "$CORRECTION_DIR"
          cat "${parts[@]}" | tr -d '\n\r\t ' | base64 --decode > /tmp/doctor-who-cycle-004-still-correction.tgz
          test "$(sha256sum /tmp/doctor-who-cycle-004-still-correction.tgz | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf /tmp/doctor-who-cycle-004-still-correction.tgz -C "$CORRECTION_DIR"
          node --check "$MATERIALIZER"
          node --check "$FINALIZER"
          node --check "$CHECKER_SOURCE"
          test "$(sha256sum "$VERIFICATION_DIR/jask-still-candidate.jpg" | awk '{print $1}')" = "091d13a9af3beec58e059338435b7aa6aa6ec1f25125fd713d67f32af935b66e"
          test "$(identify -format '%w %h' "$VERIFICATION_DIR/jask-still-candidate.jpg")" = "597 402"
          sha256sum \
            /tmp/doctor-who-cycle-004-still-correction.tgz \
            "$MATERIALIZER" \
            "$FINALIZER" \
            "$CHECKER_SOURCE" \
            "$VERIFICATION_DIR/jask-still-candidate.jpg" \
            > /tmp/doctor-who-cycle-004-still-correction-transport.sha256

      - name: Materialize the exact still correction without reopening corpus work
        shell: bash
        run: |
          set -euo pipefail
          node "$MATERIALIZER" 2>&1 | tee /tmp/doctor-who-cycle-004-still-correction-materialize.log
          test -s "$CORRECTION_CONTEXT"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN"

      - name: Stage and completely gate the workflow-free correction candidate
        shell: bash
        env:
          CYCLE004_STILL_CORRECTION_CANDIDATE: "1"
        run: |
          set -euo pipefail
          parts=( "$TRANSPORT" "$TRANSPORT".part-* )
          test "${#parts[@]}" -eq "$TRANSPORT_PARTS"
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm -f "$SELF" "${parts[@]}"
          git add -A
          git diff --cached --check
          test -z "$(git diff --name-only)"

          cat > /tmp/expected-candidate-paths.txt <<'PATHS'
          data/CENSUS-FERENGI-TEST.json
          data/MEDIA-AUDIT.json
          data/SOURCES.json
          data/archive.json
          data/entities.json
          data/journal/media-audit.jsonl
          data/media-live.json
          data/media-manifest.json
          data/quality.json
          data/search/manifest.json
          data/shard-manifest.json
          data/shards/0001.json
          data/species.json
          data/specimens.json
          images/uc-1349-still.jpg
          package.json
          scripts/doctor-who-cycle-004-still-correction.mjs
          PATHS
          sort -o /tmp/expected-candidate-paths.txt /tmp/expected-candidate-paths.txt
          git diff --cached --name-only "$BASE_MAIN" | sort > /tmp/actual-candidate-paths.txt
          diff -u /tmp/expected-candidate-paths.txt /tmp/actual-candidate-paths.txt
          ! grep -Eq '^\.github/|^\.ci/' /tmp/actual-candidate-paths.txt

          npm run gate 2>&1 | tee /tmp/doctor-who-cycle-004-still-correction-candidate-gate.log
          candidate_gate_sha256="$(sha256sum /tmp/doctor-who-cycle-004-still-correction-candidate-gate.log | awk '{print $1}')"
          echo "$candidate_gate_sha256" > /tmp/doctor-who-cycle-004-still-correction-candidate-gate.sha256
          echo "CANDIDATE_GATE_SHA256=$candidate_gate_sha256" >> "$GITHUB_ENV"

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit candidate and bind workflow job custody
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          GIT_AUTHOR_DATE="$CORRECTION_AT" GIT_COMMITTER_DATE="$CORRECTION_AT" git commit \
            -m 'Doctor Who: verify exact Jask audio still correction candidate' \
            -m 'adopt the revision-bound single-character Jask image without reopening the task' \
            -m 'preserve the original reviewed cycle and zero-lease queue custody'
          candidate_commit="$(git rev-parse HEAD)"
          workflow_job_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name == "correct") | .id' | head -n 1)"
          test "$workflow_job_id" -gt 0
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "workflow_job_id=$workflow_job_id" >> "$GITHUB_OUTPUT"
          echo "candidate_gate_sha256=$CANDIDATE_GATE_SHA256" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$candidate_commit" > /tmp/doctor-who-cycle-004-still-correction-candidate-commit.txt
          printf '%s\n' "$workflow_job_id" > /tmp/doctor-who-cycle-004-still-correction-workflow-job.txt

      - name: Upload exact correction candidate evidence
        id: candidate_artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-004-still-correction-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/doctor-who-cycle-004-still-correction*
            /tmp/expected-transport-paths.txt
            /tmp/actual-transport-paths.txt
            /tmp/expected-candidate-paths.txt
            /tmp/actual-candidate-paths.txt
            ${{ env.VERIFICATION_DIR }}

      - name: Write and validate the permanent correction receipt
        shell: bash
        env:
          BASE_REF: ${{ env.BASE_MAIN }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
          WORKFLOW_JOB_ID: ${{ steps.candidate.outputs.workflow_job_id }}
          CANDIDATE_GATE_SHA256: ${{ steps.candidate.outputs.candidate_gate_sha256 }}
          CANDIDATE_ARTIFACT_NAME: doctor-who-cycle-004-still-correction-candidate-${{ github.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate_artifact.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_SHA256: ${{ steps.candidate_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          node "$FINALIZER" 2>&1 | tee /tmp/doctor-who-cycle-004-still-correction-finalize.log
          npm run doctor-who:cycle-004:check
          git add data/review/adapter-sdk/doctor-who-cycle-004-jask-audio-still-correction.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "data/review/adapter-sdk/doctor-who-cycle-004-jask-audio-still-correction.json"

      - name: Commit, completely gate, and publish the exact final correction
        shell: bash
        run: |
          set -euo pipefail
          GIT_AUTHOR_DATE="$CORRECTION_AT" GIT_COMMITTER_DATE="$CORRECTION_AT" git commit \
            -m 'Doctor Who: receipt exact Jask audio still correction' \
            -m 'preserve immutable cycle-004 absence history while correcting current exact media custody'
          final_commit="$(git rev-parse HEAD)"
          printf '%s\n' "$final_commit" > /tmp/doctor-who-cycle-004-still-correction-final-commit.txt

          npm run gate 2>&1 | tee /tmp/doctor-who-cycle-004-still-correction-final-gate.log
          final_gate_sha256="$(sha256sum /tmp/doctor-who-cycle-004-still-correction-final-gate.log | awk '{print $1}')"
          printf '%s\n' "$final_gate_sha256" > /tmp/doctor-who-cycle-004-still-correction-final-gate.sha256

          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git restore --worktree -- .
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=64 origin "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN"

          cat /tmp/expected-candidate-paths.txt > /tmp/expected-final-paths.txt
          echo 'data/review/adapter-sdk/doctor-who-cycle-004-jask-audio-still-correction.json' >> /tmp/expected-final-paths.txt
          sort -o /tmp/expected-final-paths.txt /tmp/expected-final-paths.txt
          git diff --name-only "$BASE_MAIN"...HEAD | sort > /tmp/actual-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/actual-final-paths.txt
          ! grep -Eq '^\.github/|^\.ci/' /tmp/actual-final-paths.txt
          test "$(git rev-list --count "$BASE_MAIN"..HEAD)" -ge 2
          test "$(git merge-base HEAD "$BASE_MAIN")" = "$BASE_MAIN"

          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "final_commit=$final_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "final_gate_sha256=$final_gate_sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete correction and final-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-004-still-correction-final-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            /tmp/doctor-who-cycle-004-still-correction*
            /tmp/expected-transport-paths.txt
            /tmp/actual-transport-paths.txt
            /tmp/expected-candidate-paths.txt
            /tmp/actual-candidate-paths.txt
            /tmp/expected-final-paths.txt
            /tmp/actual-final-paths.txt
            data/review/adapter-sdk/doctor-who-cycle-004-jask-audio-still-correction.json
            scripts/doctor-who-cycle-004-still-correction.mjs
