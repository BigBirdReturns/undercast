name: ferengi-media-enrichment-001-gather

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-MEDIA-ENRICHMENT-001.json"
      - ".github/workflows/ferengi-media-enrichment-001-gather.yml"

permissions:
  contents: read

concurrency:
  group: ferengi-media-enrichment-001-gather
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/ferengi-media-enrichment-001'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ferengi-media-enrichment-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Gather one exact six-card review batch
        env:
          CONTACT: bigbirdreturns@proton.me
          BATCH_INDEX: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          out="/tmp/ferengi-media-enrichment-001-batch-${BATCH_INDEX}"
          rm -rf "$out"
          mkdir -p "$out"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const index=Number(process.env.BATCH_INDEX);
          const out=`/tmp/ferengi-media-enrichment-001-batch-${index}`;
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');
          if(!taxon) throw new Error('Ferengi taxon missing');
          const byId=new Map(specimens.map(row=>[row.id,row]));
          const rows=taxon.wall_records.map(row=>byId.get(row.id)).filter(Boolean);
          const missing=rows.filter(row=>!row.still||!row.portrait).map(row=>({
            id:row.id,
            character:row.character,
            actor:row.actor,
            missing_still:!row.still,
            missing_portrait:!row.portrait
          }));
          const targets=missing.slice(index*6,index*6+6);
          fs.writeFileSync(path.join(out,'targets.json'),JSON.stringify({
            version:1,
            batch_index:index,
            displayed_ferengi_cards:rows.length,
            total_cards_with_missing_media:missing.length,
            total_missing_still_facets:missing.filter(row=>row.missing_still).length,
            total_missing_portrait_facets:missing.filter(row=>row.missing_portrait).length,
            targets
          },null,2)+'\n');
          if(!targets.length){
            fs.writeFileSync(path.join(out,'EMPTY'),'No targets in this batch.\n');
            process.exit(0);
          }
          const dir=path.join(out,'curate');
          const result=spawnSync(process.execPath,['scripts/curate.mjs','gather',...targets.map(row=>row.id)],{
            cwd:process.cwd(),
            env:{...process.env,CURATE_DIR:dir},
            encoding:'utf8',
            stdio:'pipe',
            maxBuffer:64*1024*1024,
            timeout:75*60*1000
          });
          fs.writeFileSync(path.join(out,'gather.log'),(result.stdout||'')+(result.stderr||''));
          if(result.error) throw result.error;
          if(result.status!==0) throw new Error(`curate gather failed with ${result.status}`);
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));
          fs.writeFileSync(path.join(out,'candidate-summary.json'),JSON.stringify({
            version:1,
            batch_index:index,
            cards:manifest.map(row=>({
              id:row.id,
              character:row.character,
              actor:row.actor,
              still_candidates:row.still.length,
              portrait_candidates:row.portrait.length
            })),
            still_candidates:manifest.reduce((sum,row)=>sum+row.still.length,0),
            portrait_candidates:manifest.reduce((sum,row)=>sum+row.portrait.length,0),
            zero_still_candidates:manifest.filter(row=>row.still.length===0).map(row=>row.id),
            zero_portrait_candidates:manifest.filter(row=>row.portrait.length===0).map(row=>row.id)
          },null,2)+'\n');
          NODE
      - name: Upload exact candidates and review sheet
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-media-enrichment-001-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: /tmp/ferengi-media-enrichment-001-batch-${{ matrix.batch }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
