      BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v6
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v6.yml
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6
      V4_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-v4-evidence
      V5_FAILURE_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-v5-failure
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
