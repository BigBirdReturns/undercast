      WRITER_V6: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml

      INSTALLER_PR: "904"
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v6

      V4_EVIDENCE_RUN: "31411609257"
