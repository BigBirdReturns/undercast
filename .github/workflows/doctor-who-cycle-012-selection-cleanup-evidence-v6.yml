      V5_PATCHED_SHA256: a1eb5adbc77a98d7f169ee608e53a0223a82cd43bfc4fda7d475b2ab03f8d8d5

      V6_CARRIER_BLOB: b97f56e951b322284ba93b9bf5d4a5c5340afd55
      V6_CARRIER_GZIP_BYTES: "5498"
      V6_CARRIER_GZIP_SHA256: 22116331c79c6804f6f626069b2846cb707d42717c6a0dc530ab262d45607e4e
      V6_CARRIER_BYTES: "22584"
      V6_CARRIER_SHA256: 9fb5f5e7b0658b364b0971fc18f54b6979bade2d71ab83047eb5b17f9d87cced

      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      CHARACTER_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      PORTRAIT_SHA256: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e

      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

      API_CARRIER_CHUNK_01_BLOB: d75d7219de601616a99b3a6d2040e76a41d5fc0c
      API_CARRIER_CHUNK_01_BYTES: "1800"
      API_CARRIER_CHUNK_01_SHA256: 8697fe8824d0a5a3c5636a79a5ef29df3f35816d42106fb9c62f833d6d7a17a2
      API_CARRIER_CHUNK_02_BLOB: f459368a612c4f84cae612a9e9a553a8c0ee3fff
      API_CARRIER_CHUNK_02_BYTES: "1800"
      API_CARRIER_CHUNK_02_SHA256: 5e9d1a5d1e8903216fd68097d570f5b8b77971a44cbac0b98c1f4cf9c60b7d28
      API_CARRIER_CHUNK_03_BLOB: acca0d06feb84ab29c873e0e99a8a7cb12a71d5e
      API_CARRIER_CHUNK_03_BYTES: "1565"
      API_CARRIER_CHUNK_03_SHA256: 1b548f4f9adc0dcf4fcc6e7ab86e9f89fc21058c8c6706e3ff93e104d54886c4
      API_CARRIER_GZIP_BYTES: "5165"
      API_CARRIER_GZIP_SHA256: a412ec85a6761d6dba1a869894125633dd0b48af2530b69851366e09adb27efe
      API_CARRIER_BYTES: "19463"
      API_CARRIER_SHA256: 06204da4f798812483e94528dfdabd212c3f082e2493876337eba852c3cee7fe
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-loader

    steps:
      - name: Reconstruct and execute exact API-only cleanup evidence V6 carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.gz"
          for index in 01 02 03; do
            blob_var="API_CARRIER_CHUNK_${index}_BLOB"
            bytes_var="API_CARRIER_CHUNK_${index}_BYTES"
            sha_var="API_CARRIER_CHUNK_${index}_SHA256"
            blob="${!blob_var}"
            expected_bytes="${!bytes_var}"
            expected_sha="${!sha_var}"
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" > "$LOADER/carrier-chunk-${index}.json"
            jq -r '.content' "$LOADER/carrier-chunk-${index}.json" | tr -d '\n' | base64 -d > "$LOADER/carrier-chunk-${index}.bin"
            test "$(git hash-object --stdin < "$LOADER/carrier-chunk-${index}.bin")" = "$blob"
            test "$(wc -c < "$LOADER/carrier-chunk-${index}.bin" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$LOADER/carrier-chunk-${index}.bin" | awk '{print $1}')" = "$expected_sha"
            cat "$LOADER/carrier-chunk-${index}.bin" >> "$LOADER/carrier.sh.gz"
          done
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$API_CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$API_CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$API_CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$API_CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v6-api-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v6-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v6-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-v4-evidence
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-v5-failure
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v6-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
