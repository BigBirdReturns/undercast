name: cycle-012-v11-terminal-proof-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle-012-v11-terminal-proof-v1.yml"

permissions: {}

concurrency:
  group: cycle-012-v11-terminal-proof-v1
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle-012-v11-terminal-proof-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/cycle-012-v11-terminal-proof-v1
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: observer/cycle-012-v11-terminal-proof-v1
      SELF: .github/workflows/cycle-012-v11-terminal-proof-v1.yml
      INSTALLED_MAIN: 5c72d9d1dcd8011449b487cff306a033964cdb24
      CLEANUP_MAIN: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      EVIDENCE_RUN: "31470863520"
      EVIDENCE_HEAD: 0644ff3e16ad62563b43d056cf5f4fed42f269ef
      EVIDENCE_PR: "931"
      EVIDENCE_ARTIFACT: "9093297726"
      EVIDENCE_DIGEST: 47eb8b7f98df03a98bdadda86026ee2f8335ae333e494e22a98db89ba334f285
      EVIDENCE_IDENTITY: 111761ce588ab88c911b70e1fe434b2dc4eac5d560239837547eed75771adfb8
      WRITER_NAME: doctor-who-cycle-012-selection-cleanup-writer-v11
      WRITER_ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-writer-v11-
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      OUTSIDE_PREFIX: observer/cycle012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      CARRIER_BLOBS: "6811d6f159d2ad257e5585e20b1d1ca5ba62457c 5edd1177ff293807ec05450d55985a43800849e6"
      CARRIER_B64_BYTES: "4772"
      CARRIER_B64_SHA256: add24350dce75d4f04431326a453fb7ed7c2216c3c36d0100e13ea78dc311edd
      CARRIER_GZIP_BYTES: "3577"
      CARRIER_GZIP_SHA256: 3ae6b00840d6df33b06a4215964f1893223989151eb77eb438d4f9c60ded5443
      CARRIER_BYTES: "12870"
      CARRIER_SHA256: 0c799230f61f56b778b986fdef7d8aa633b2dcda4a2dccaf7480f53b18dd6822
      LOADER: /tmp/cycle-012-v11-terminal-proof-v1-loader

    steps:
      - name: Reconstruct and execute exact terminal V11 proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.gz.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$LOADER/carrier.sh.gz.b64"
          done
          test "$(wc -c < "$LOADER/carrier.sh.gz.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$LOADER/carrier.sh.gz.b64" > "$LOADER/carrier.sh.gz"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-v11-terminal-proof-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: cycle-012-v11-terminal-proof-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle-012-v11-terminal-proof-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-012-v11-terminal-proof-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/cycle-012-v11-terminal-proof-v1
            /tmp/cycle-012-v11-terminal-proof-v1-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire:
    needs: prove
    if: >-
      always() &&
      needs.prove.result == 'success' &&
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'observer/cycle-012-v11-terminal-proof-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      BRANCH: observer/cycle-012-v11-terminal-proof-v1
    steps:
      - name: Retire exact terminal-proof transport
        shell: bash
        run: |
          set -euo pipefail
          repo="/repos/$GITHUB_REPOSITORY"
          test "$(gh api "$repo/git/ref/heads/$BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          gh api -X PATCH "$repo/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "$repo/git/refs/heads/$BRANCH"
