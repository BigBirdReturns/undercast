name: operational-evidence-second-desk-v2

on:
  pull_request:
    paths:
      - ".github/workflows/operational-evidence-second-desk-v2.yml"
      - ".github/operational-review/second-desk-v2.sh.gz.b64"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: operational-evidence-second-desk-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute checksum-bound second-desk review and composable exact-main sealing
        run: |
          set -euo pipefail
          base64 -d .github/operational-review/second-desk-v2.sh.gz.b64 | gzip -d > /tmp/second-desk-v2.sh
          test "$(sha256sum /tmp/second-desk-v2.sh | awk '{print $1}')" = "fd00340feb33ff1c99f5ec9fa161f30a498004c0fe3b36d6e98a49b8f09f96b6"
          bash -n /tmp/second-desk-v2.sh
          bash /tmp/second-desk-v2.sh

      - uses: actions/upload-artifact@v4
        with:
          name: operational-evidence-second-desk-v2-${{ github.run_id }}
          path: /tmp/undercast-operational-second-desk-v2/output/product
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
