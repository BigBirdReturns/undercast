name: doctor-who-cycle-009-megnus-jaka-candidate-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-candidate-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-candidate-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-v2.yml
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-candidate-v2
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2
      TASK: ap_45bb5fdcdf4aff65aa7a87c3
      PERFORMER: Dan Starkey
      ROLE: Megnus Jaka
      MODE: voice
      SOURCE: https://tardis.fandom.com/wiki/Megnus_Jaka
      SOURCE_PAGEID: "175060"
      SOURCE_REVISION: "3677686"
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      PRODUCTION_URL: https://www.bigfinish.com/releases/v/doctor-who-the-first-sontarans-418
      VISUAL_PR: "635"
      VISUAL_HEAD: e892da898aaa7f68fb22d8bf2ad1e9c4c9a6a913
      VISUAL_RUN: "31239425433"
      VISUAL_JOB: "93057755389"
      VISUAL_ARTIFACT: "9016514735"
      VISUAL_DIGEST: sha256:a14e59873266f870ede7fd51a4e27bce1ad230dd69ace3edaef2c01b2f6721e8
      VISUAL_IDENTITY: d8e5df0f1a3c6ebb8e96f504b609d3c8c8c75937b358788d4c3cde27bf79c81b
      EVIDENCE_IDENTITY: dd59759b825c013869e5c7d75d99cdc12d2f38c4e46262e97a7aacd81bf7192c
      CLAIMED_AT: "2026-08-08T04:35:00.000Z"
      SUBMITTED_AT: "2026-08-08T04:36:00.000Z"
      MERGED_AT: "2026-08-08T04:37:00.000Z"
      MEDIA_SYNC_AT: "2026-08-08T04:38:00.000Z"
      FETCHED_AT: "2026-08-08"
      V1_PR: "639"
      V1_HEAD: 5938289afa1506bdcfbceaae4fe393cedf5bab05
      V1_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-v1.yml
      V1_BLOB: 846ccae66c57f7db82d9a5a56e47156e1ceb6f4a
      V1_RUN: "31240162895"
      V1_JOB: "93059677823"
      V1_DIAGNOSTIC_ARTIFACT: "9016754914"
      V1_DIAGNOSTIC_DIGEST: sha256:5736f0f3806dd8ae619afa4cf1edf36b344d6b26def826b28cc0b4eb82b19192
      V1_RUNNER_RAW_SHA256: 7b5fb01ec90789890428aad7d7f1b12c49cdd2e81f422be3a0e3e4e694b35a9f
      V1_RUNNER_XZ_SHA256: 301041e5bf7627b40a09fa047a067f0ac6cca39f38db7dd7dfdb59d44e58bbfa
      V2_RUNNER_RAW_SHA256: 4645302c5c27240e6e2bae3aa53a1a7d90cdbcc1d802613e7308249ca20c3929

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind failed V1 and derive exact one-token runner repair
        shell: bash
        run: |
          set -euo pipefail
          repair=/tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2-repair
          rm -rf "$repair"
          mkdir -p "$repair"

          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$BASE_SHA" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V1_PR" > "$repair/v1-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" > "$repair/v1-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$V1_JOB" > "$repair/v1-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_DIAGNOSTIC_ARTIFACT" > "$repair/v1-artifact.json"
          jq -e --argjson number "$V1_PR" --arg head "$V1_HEAD" '.number==$number and .state=="closed" and .merged==false and .head.sha==$head and .commits==1 and .changed_files==1' "$repair/v1-pr.json" >/dev/null
          jq -e --argjson id "$V1_RUN" --arg head "$V1_HEAD" '.id==$id and .head_sha==$head and .status=="completed" and .conclusion=="failure"' "$repair/v1-run.json" >/dev/null
          jq -e --argjson id "$V1_JOB" --argjson run "$V1_RUN" '.id==$id and .run_id==$run and .status=="completed" and .conclusion=="failure"' "$repair/v1-job.json" >/dev/null
          jq -e --argjson id "$V1_DIAGNOSTIC_ARTIFACT" --arg digest "$V1_DIAGNOSTIC_DIGEST" --argjson run "$V1_RUN" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' "$repair/v1-artifact.json" >/dev/null

          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V1_BLOB" > "$repair/v1-blob.json"
          jq -e --arg sha "$V1_BLOB" '.sha==$sha and .encoding=="base64"' "$repair/v1-blob.json" >/dev/null
          jq -r '.content' "$repair/v1-blob.json" | tr -d '\n' | base64 --decode > "$repair/v1.yml"
          test "$(git hash-object "$repair/v1.yml")" = "$V1_BLOB"

          ROOT="$repair" python3 - <<'PY'
          import base64, hashlib, lzma, os, re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          text=(root/'v1.yml').read_text()
          pattern=r'''cat > "\$carrier/runner\.xz\.b64" <<'RUNNER_B64'\n(?P<body>.*?)\n\s*RUNNER_B64'''
          match=re.search(pattern,text,re.S)
          assert match, 'V1 embedded runner not found'
          lines=[]
          for line in match.group('body').splitlines():
              assert line.startswith('          ')
              lines.append(line[10:])
          encoded=''.join(lines)
          xz=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(xz).hexdigest()==os.environ['V1_RUNNER_XZ_SHA256']
          raw=lzma.decompress(xz)
          assert hashlib.sha256(raw).hexdigest()==os.environ['V1_RUNNER_RAW_SHA256']
          source=raw.decode()
          old='.status=="merged" and .role_on_wall==true and .wall_ids==[$wall] and .outcome.kind=="draft"'
          new='.status=="merged" and .role_on_wall==true and .wall_ids==[$wall] and .outcome.kind=="merged"'
          assert source.count(old)==1
          patched=source.replace(old,new)
          assert source.count(new)==0 and patched.count(new)==1 and old not in patched
          data=patched.encode()
          assert hashlib.sha256(data).hexdigest()==os.environ['V2_RUNNER_RAW_SHA256']
          (root/'runner-v1.sh').write_bytes(raw)
          (root/'runner-v2.sh').write_bytes(data)
          (root/'repair.patch').write_text('--- V1\n+++ V2\n@@ post-sync assertion @@\n- outcome.kind == draft\n+ outcome.kind == merged\n')
          PY
          bash -n "$repair/runner-v1.sh"
          bash -n "$repair/runner-v2.sh"
          sha256sum "$repair/v1.yml" "$repair/runner-v1.sh" "$repair/runner-v2.sh" "$repair/repair.patch" > "$repair/SHA256SUMS"

      - name: Execute repaired read-only candidate transaction
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2-repair/runner-v2.sh

      - name: Upload qualified text-only candidate
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2/product
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload V2 candidate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-v2-repair
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
