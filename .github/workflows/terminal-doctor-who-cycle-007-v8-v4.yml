name: terminal-doctor-who-cycle-007-v8-v4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/terminal-doctor-who-cycle-007-v8-v4.yml"

permissions:
  contents: write
  actions: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: terminal-doctor-who-cycle-007-v8-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  TERMINAL_BRANCH: agent/doctor-who-cycle-007-v8-terminal-guardian-v4
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-completion-v8-terminal-v4
  SELF: .github/workflows/terminal-doctor-who-cycle-007-v8-v4.yml
  CANDIDATE_BRANCH: agent/doctor-who-cycle-007-v8-materializer
  CANDIDATE_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_COMMIT_EXPECTED: 1bac55a7cd06e64840c79d42924472a0e0c6910e
  CANDIDATE_TREE_EXPECTED: 121ecef1c981e6da2048450902721e336c051138
  CANDIDATE_GATE_EXPECTED: 6499879b6246646228767c38e87d45447082e89fb03fa48e6ef5950005d95dd6
  CANDIDATE_ARTIFACT: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_SHA256: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_SHA256: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  REVIEW_BRANCH: agent/doctor-who-cycle-007-v8-independent-review-v5
  REVIEW_WORKFLOW_NAME: review-doctor-who-cycle-007-v8-v5
  REVIEW_WORKFLOW_PATH: .github/workflows/review-doctor-who-cycle-007-v8-v5.yml
  SOURCE_REVIEW_HEAD: 245bacc9d7e58ceda4ebfd16dc33254b97263f34
  SOURCE_REVIEW_ARCHIVE: tmp/review-doctor-who-cycle-007-v8.mjs.xz.b64
  SOURCE_REVIEW_BLOB: a79b0aaa277a852d91a0670f387d74789d456ea1
  SOURCE_REVIEWER_SHA256: 5053bb53dc96c35b846dd57fe16d8b58d6bd334e03290399ddf98011ad174fe1
  ARCHIVE_PART_01: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-01
  ARCHIVE_PART_02: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-02
  ARCHIVE_PART_03: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-03
  ARCHIVE_PART_04: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-04
  FIX_02: tmp/doctor-who-cycle-007-v8-02-materialize.sh
  FIX_03: tmp/doctor-who-cycle-007-v8-03-candidate.sh
  ARCHIVE_SHA256: 406d599a071b75202e764b391fc2080435aa9f14cb565f8b643e4417620a20ce
  MANIFEST_SHA256: ba59a8c89ed462e29416d398aae6151b375d85b0d415fa23f5b69d32eedb9e54
  FIX_02_SHA256: 4c2c40f1cad46a2d0787f02d6395ae77f9cffcfe5316ae27009ac6f58e104fe6
  FIX_03_SHA256: f454636883f6e1f3fcadf5308866614acb92c83abf83ef5df2ad63775c931910
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  ROOT: /tmp/doctor-who-cycle-007-v8-terminal-v4
  OUT: /tmp/doctor-who-cycle-007-v8-terminal-v4/out
  CARRIER: /tmp/doctor-who-cycle-007-v8-terminal-v4/carrier
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-v8-terminal-v4/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/media-review
  CANDIDATE_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/candidate-artifact
  DIAGNOSTICS_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/candidate-diagnostics
  REVIEW_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/hosted-review
  REPLAY_DIR: /tmp/doctor-who-cycle-007-v8-terminal-v4/replayed-review
  REVIEWER_V2: /tmp/doctor-who-cycle-007-v8-terminal-v4/reviewer-v2.mjs
  REVIEWER: /tmp/doctor-who-cycle-007-v8-terminal-v4/reviewer-v3.mjs
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  converge:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-terminal-guardian-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Bind exact one-path terminal carrier, candidate, and V5 review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$OUT" "$CARRIER" "$CYCLE_ASSET_DIR" "$SELECTION_DIR" "$PREFLIGHT_DIR" "$MEDIA_DIR" "$CANDIDATE_DIR" "$DIAGNOSTICS_DIR" "$REVIEW_DIR" "$REPLAY_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$TERMINAL_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-terminal-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-terminal-paths.txt"
          diff -u "$OUT/expected-terminal-paths.txt" "$OUT/actual-terminal-paths.txt"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}" \
            "+refs/heads/${REVIEW_BRANCH}:refs/remotes/origin/${REVIEW_BRANCH}"
          git fetch --no-tags --depth=2 origin "$SOURCE_REVIEW_HEAD"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "$CANDIDATE_HEAD"
          review_head="$(git rev-parse refs/remotes/origin/${REVIEW_BRANCH})"
          test "$(git show -s --format=%P "$review_head")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$review_head")" = "1"
          test "$(git merge-base "$EXACT_MAIN" "$review_head")" = "$EXACT_MAIN"
          printf '%s\n' "$REVIEW_WORKFLOW_PATH" > "$OUT/expected-review-paths.txt"
          git diff --name-only "$EXACT_MAIN"..."$review_head" | LC_ALL=C sort > "$OUT/actual-review-paths.txt"
          diff -u "$OUT/expected-review-paths.txt" "$OUT/actual-review-paths.txt"
          git show "${review_head}:${REVIEW_WORKFLOW_PATH}" > "$OUT/review-workflow.yml"
          grep -F 'contents: read' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F 'contents: write' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F '04-finalize.sh' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F '05-final-gate.sh' "$OUT/review-workflow.yml" >/dev/null
          ! grep -F 'git push' "$OUT/review-workflow.yml" >/dev/null
          printf '%s\n' "$review_head" > "$OUT/review-head.txt"

      - name: Discover exact green V5 review and immutable artifact
        id: review
        shell: bash
        run: |
          set -euo pipefail
          review_head="$(cat "$OUT/review-head.txt")"
          review_run=''
          for _ in $(seq 1 360); do
            review_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&branch=${REVIEW_BRANCH}&per_page=100" --jq ".workflow_runs[] | select(.name==\"${REVIEW_WORKFLOW_NAME}\" and .head_sha==\"${review_head}\" and .status==\"completed\" and .conclusion==\"success\") | .id" | head -1)"
            test -n "$review_run" && break
            sleep 5
          done
          test -n "$review_run"
          review_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${review_run}/jobs?per_page=100" --jq '.jobs[] | select(.name=="review" and .status=="completed" and .conclusion=="success") | .id' | head -1)"
          test -n "$review_job"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${review_run}/jobs?per_page=100" > "$OUT/review-jobs.json"
          jq -e '.jobs | length == 1 and all(.[]; .status == "completed" and .conclusion == "success" and all(.steps[]; .conclusion == "success" or .conclusion == "skipped"))' "$OUT/review-jobs.json" >/dev/null
          review_artifact_name="doctor-who-cycle-007-v8-independent-review-v5-${review_run}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${review_run}/artifacts?per_page=100" > "$OUT/review-artifacts.json"
          review_artifact_id="$(jq -r --arg name "$review_artifact_name" '.artifacts[] | select(.name==$name and .expired==false) | .id' "$OUT/review-artifacts.json" | head -1)"
          review_artifact_digest="$(jq -r --arg name "$review_artifact_name" '.artifacts[] | select(.name==$name and .expired==false) | .digest' "$OUT/review-artifacts.json" | head -1)"
          test -n "$review_artifact_id" -a -n "$review_artifact_digest"
          printf 'run=%s\njob=%s\nname=%s\nid=%s\ndigest=%s\nhead=%s\n' \
            "$review_run" "$review_job" "$review_artifact_name" "$review_artifact_id" "$review_artifact_digest" "$review_head" >> "$GITHUB_OUTPUT"
          printf 'REVIEW_RUN=%s\nREVIEW_JOB=%s\nREVIEW_ARTIFACT_NAME=%s\nREVIEW_ARTIFACT_ID=%s\nREVIEW_ARTIFACT_DIGEST=%s\nREVIEW_HEAD=%s\n' \
            "$review_run" "$review_job" "$review_artifact_name" "$review_artifact_id" "${review_artifact_digest#sha256:}" "$review_head" >> "$GITHUB_ENV"

      - name: Download immutable V5 review
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.review.outputs.name }}
          path: ${{ env.REVIEW_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ steps.review.outputs.run }}

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ env.CANDIDATE_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Download immutable candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT }}
          path: ${{ env.DIAGNOSTICS_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Replay V5 reviewer and require byte-identical hosted receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}")" = "$SOURCE_REVIEW_BLOB"
          git show "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}" | base64 --decode | xz --decompress > "$REVIEWER_V2"
          test "$(sha256sum "$REVIEWER_V2" | awk '{print $1}')" = "$SOURCE_REVIEWER_SHA256"
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('/tmp/doctor-who-cycle-007-v8-terminal-v4/reviewer-v2.mjs')
          target=Path('/tmp/doctor-who-cycle-007-v8-terminal-v4/reviewer-v3.mjs')
          text=source.read_text(); error='candidate workflow marker missing: ${marker}'
          pos=text.find(error); start=text.rfind('for (const marker of [',0,pos); end=text.find(';',pos)
          if pos<0 or start<0 or end<0: raise SystemExit('candidate workflow marker block boundary not found')
          end+=1
          github_head='$'+'{{ github.event.pull_request.head.sha }}'; checkout_head='$'+'{{ env.HEAD_SHA }}'
          replacement='''for (const marker of [
            "CARRIER_BRANCH: agent/doctor-who-cycle-007-v8-materializer",
            "__GITHUB_HEAD__",
            "__CHECKOUT_HEAD__",
            "github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-materializer'",
            'test "$(git rev-parse HEAD)" = "$HEAD_SHA"',
            'test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"',
            'test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/${CARRIER_BRANCH})" = "$HEAD_SHA"',
          ]) assert(candidateWorkflow.includes(marker), `candidate workflow structural marker missing: ${marker}`);'''
          replacement=replacement.replace('__GITHUB_HEAD__','HEAD_SHA: '+github_head).replace('__CHECKOUT_HEAD__','ref: '+checkout_head)
          text=text[:start]+replacement+text[end:]
          text,revisions=re.subn(r'(reviewer_revision\s*:\s*)2\b',r'\g<1>3',text)
          if revisions<1 or 'candidate workflow marker missing:' in text: raise SystemExit('reviewer V3 derivation failed')
          target.write_text(text)
          PY
          node --check "$REVIEWER"
          reviewer_sha="$(sha256sum "$REVIEWER" | awk '{print $1}')"
          hosted_reviewer_sha="$(find "$REVIEW_DIR" -type f -name reviewer-v3.sha256 -print -quit)"
          test -n "$hosted_reviewer_sha"
          test "$(awk '{print $1}' "$hosted_reviewer_sha")" = "$reviewer_sha"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100" > "$OUT/candidate-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > "$OUT/candidate-jobs.json"
          git show "$CANDIDATE_HEAD:.github/workflows/materialize-doctor-who-cycle-007-v8.yml" > "$OUT/candidate-workflow.yml"
          node "$REVIEWER" "$CANDIDATE_DIR" "$DIAGNOSTICS_DIR" "$OUT/candidate-artifacts.json" "$OUT/candidate-jobs.json" "$OUT/candidate-workflow.yml" "$REPLAY_DIR" | tee "$OUT/replayed-review.log"
          hosted_receipt="$(find "$REVIEW_DIR" -type f -name independent-review-receipt.json -print -quit)"
          hosted_receipt_sha="$(find "$REVIEW_DIR" -type f -name independent-review-receipt.sha256 -print -quit)"
          test -n "$hosted_receipt" -a -n "$hosted_receipt_sha"
          cmp "$REPLAY_DIR/independent-review-receipt.json" "$hosted_receipt"
          cmp "$REPLAY_DIR/independent-review-receipt.sha256" "$hosted_receipt_sha"
          receipt_sha="$(sha256sum "$hosted_receipt" | awk '{print $1}')"
          test "$(cat "$hosted_receipt_sha")" = "$receipt_sha"
          cp "$hosted_receipt" "$OUT/independent-review-receipt.json"
          cp "$hosted_receipt_sha" "$OUT/independent-review-receipt.sha256"
          printf 'REVIEW_RECEIPT=%s\nREVIEW_RECEIPT_SHA256=%s\nINDEPENDENT_REVIEW_RECEIPT=%s\nINDEPENDENT_REVIEW_RECEIPT_SHA256=%s\n' "$OUT/independent-review-receipt.json" "$receipt_sha" "$OUT/independent-review-receipt.json" "$receipt_sha" >> "$GITHUB_ENV"

      - name: Extract and verify exact candidate materializer payload
        shell: bash
        run: |
          set -euo pipefail
          for path in "$ARCHIVE_PART_01" "$ARCHIVE_PART_02" "$ARCHIVE_PART_03" "$ARCHIVE_PART_04" "$FIX_02" "$FIX_03"; do mkdir -p "$CARRIER/$(dirname "$path")"; git show "$CANDIDATE_HEAD:$path" > "$CARRIER/$path"; done
          cat "$CARRIER/$ARCHIVE_PART_01" "$CARRIER/$ARCHIVE_PART_02" "$CARRIER/$ARCHIVE_PART_03" "$CARRIER/$ARCHIVE_PART_04" > "$OUT/payload.b64"
          test "$(wc -c < "$OUT/payload.b64")" = "34576"
          base64 --decode "$OUT/payload.b64" > "$OUT/payload.tar.gz"
          test "$(sha256sum "$OUT/payload.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xzf "$OUT/payload.tar.gz" -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          install -m 0755 "$CARRIER/$FIX_02" "$CYCLE_ASSET_DIR/02-materialize.sh"
          install -m 0755 "$CARRIER/$FIX_03" "$CYCLE_ASSET_DIR/03-candidate.sh"
          test "$(sha256sum "$CYCLE_ASSET_DIR/02-materialize.sh" | awk '{print $1}')" = "$FIX_02_SHA256"
          test "$(sha256sum "$CYCLE_ASSET_DIR/03-candidate.sh" | awk '{print $1}')" = "$FIX_03_SHA256"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          for path in 01-prepare.sh 02-materialize.sh 03-candidate.sh 04-finalize.sh 05-final-gate.sh prepare-inputs.mjs apply-doctor-who-cycle-007.mjs apply-doctor-who-cycle-finalize-007.mjs; do test -x "$CYCLE_ASSET_DIR/$path"; done
          bash -n "$CYCLE_ASSET_DIR/01-prepare.sh"; bash -n "$CYCLE_ASSET_DIR/02-materialize.sh"; bash -n "$CYCLE_ASSET_DIR/03-candidate.sh"; bash -n "$CYCLE_ASSET_DIR/04-finalize.sh"; bash -n "$CYCLE_ASSET_DIR/05-final-gate.sh"
          node --check "$CYCLE_ASSET_DIR/prepare-inputs.mjs"; node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-007.mjs"; node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-007.mjs"

      - name: Checkout exact canonical main and prove bounded successor
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXACT_MAIN"
          git checkout -B "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/chronology-floor.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody-floor.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard-floor.log"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Download exact cycle-007 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-selection-31023209453
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31023209453

      - name: Download exact complete cycle-007 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-preflight-31024339060
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31024339060

      - name: Download exact final Kragar media review
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-31027579331
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31027579331

      - name: Rematerialize and completely regate exact candidate
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.CANDIDATE_HEAD }}
          FINALIZER_AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          bash "$CYCLE_ASSET_DIR/01-prepare.sh"
          bash "$CYCLE_ASSET_DIR/02-materialize.sh"
          bash "$CYCLE_ASSET_DIR/03-candidate.sh"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT_EXPECTED"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE_EXPECTED"
          test "$(cat "$OUT/candidate-commit.txt")" = "$CANDIDATE_COMMIT_EXPECTED"
          test "$(cat "$OUT/candidate-tree.txt")" = "$CANDIDATE_TREE_EXPECTED"
          test "$(cat "$OUT/candidate-gate.sha256")" = "$CANDIDATE_GATE_EXPECTED"

      - name: Bind complete candidate, review, and terminal custody
        shell: bash
        run: |
          set -euo pipefail
          terminal_job="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="converge") | .id' | head -1)"
          test -n "$terminal_job"
          review_receipt_sha="$(cat "$OUT/independent-review-receipt.sha256")"
          cat > "$OUT/candidate-custody.txt" <<EOF
          candidate_commit=$CANDIDATE_COMMIT_EXPECTED
          candidate_tree=$CANDIDATE_TREE_EXPECTED
          candidate_gate_sha256=$CANDIDATE_GATE_EXPECTED
          candidate_artifact_name=$CANDIDATE_ARTIFACT
          candidate_artifact_id=$CANDIDATE_ARTIFACT_ID
          candidate_artifact_sha256=$CANDIDATE_ARTIFACT_SHA256
          candidate_artifact_digest=$CANDIDATE_ARTIFACT_SHA256
          candidate_workflow_run=$CANDIDATE_RUN
          candidate_workflow_job=$CANDIDATE_JOB
          workflow_job=$CANDIDATE_JOB
          EOF
          cat > "$OUT/review-custody.txt" <<EOF
          review_head=$REVIEW_HEAD
          review_run=$REVIEW_RUN
          review_job=$REVIEW_JOB
          review_artifact_name=$REVIEW_ARTIFACT_NAME
          review_artifact_id=$REVIEW_ARTIFACT_ID
          review_artifact_sha256=$REVIEW_ARTIFACT_DIGEST
          review_receipt_sha256=$review_receipt_sha
          EOF
          cp "$OUT/candidate-custody.txt" "$CYCLE_ASSET_DIR/candidate-custody.txt"
          cp "$OUT/review-custody.txt" "$CYCLE_ASSET_DIR/review-custody.txt"
          cp "$OUT/independent-review-receipt.json" "$CYCLE_ASSET_DIR/independent-review-receipt.json"
          cp "$OUT/independent-review-receipt.sha256" "$CYCLE_ASSET_DIR/independent-review-receipt.sha256"
          printf 'CANDIDATE_COMMIT=%s\nCANDIDATE_TREE=%s\nCANDIDATE_GATE_SHA256=%s\nCANDIDATE_ARTIFACT_NAME=%s\nCANDIDATE_ARTIFACT_ID=%s\nCANDIDATE_ARTIFACT_SHA256=%s\nCANDIDATE_ARTIFACT_DIGEST=%s\nCANDIDATE_WORKFLOW_RUN=%s\nCANDIDATE_WORKFLOW_JOB=%s\nREVIEW_WORKFLOW_RUN=%s\nREVIEW_WORKFLOW_JOB=%s\nREVIEW_ARTIFACT_NAME=%s\nREVIEW_ARTIFACT_ID=%s\nREVIEW_ARTIFACT_SHA256=%s\nREVIEW_ARTIFACT_DIGEST=%s\nFINALIZER_WORKFLOW_RUN=%s\nFINALIZER_WORKFLOW_JOB=%s\nWORKFLOW_RUN=%s\nWORKFLOW_JOB=%s\n' "$CANDIDATE_COMMIT_EXPECTED" "$CANDIDATE_TREE_EXPECTED" "$CANDIDATE_GATE_EXPECTED" "$CANDIDATE_ARTIFACT" "$CANDIDATE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_SHA256" "$CANDIDATE_ARTIFACT_SHA256" "$CANDIDATE_RUN" "$CANDIDATE_JOB" "$REVIEW_RUN" "$REVIEW_JOB" "$REVIEW_ARTIFACT_NAME" "$REVIEW_ARTIFACT_ID" "$REVIEW_ARTIFACT_DIGEST" "$REVIEW_ARTIFACT_DIGEST" "$GITHUB_RUN_ID" "$terminal_job" "$GITHUB_RUN_ID" "$terminal_job" >> "$GITHUB_ENV"
          printf '%s\n' "$terminal_job" > "$OUT/terminal-job.txt"

      - name: Execute reviewed receipt finalization and receipt-bearing gate
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.CANDIDATE_HEAD }}
          FINALIZER_AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          export CANDIDATE_COMMIT="$CANDIDATE_COMMIT_EXPECTED" CANDIDATE_TREE="$CANDIDATE_TREE_EXPECTED" CANDIDATE_GATE_SHA256="$CANDIDATE_GATE_EXPECTED"
          export CANDIDATE_ARTIFACT_NAME="$CANDIDATE_ARTIFACT" CANDIDATE_ARTIFACT_ID CANDIDATE_ARTIFACT_SHA256 CANDIDATE_ARTIFACT_DIGEST="$CANDIDATE_ARTIFACT_SHA256"
          export CANDIDATE_WORKFLOW_RUN="$CANDIDATE_RUN" CANDIDATE_WORKFLOW_JOB="$CANDIDATE_JOB"
          export REVIEW_WORKFLOW_RUN="$REVIEW_RUN" REVIEW_WORKFLOW_JOB="$REVIEW_JOB" REVIEW_ARTIFACT_NAME REVIEW_ARTIFACT_ID REVIEW_ARTIFACT_SHA256="$REVIEW_ARTIFACT_DIGEST" REVIEW_ARTIFACT_DIGEST="$REVIEW_ARTIFACT_DIGEST"
          export FINALIZER_WORKFLOW_RUN="$GITHUB_RUN_ID" FINALIZER_WORKFLOW_JOB="$(cat "$OUT/terminal-job.txt")" WORKFLOW_RUN="$GITHUB_RUN_ID" WORKFLOW_JOB="$FINALIZER_WORKFLOW_JOB"
          export REVIEW_RECEIPT="$OUT/independent-review-receipt.json" REVIEW_RECEIPT_SHA256="$(cat "$OUT/independent-review-receipt.sha256")"
          export INDEPENDENT_REVIEW_RECEIPT="$REVIEW_RECEIPT" INDEPENDENT_REVIEW_RECEIPT_SHA256="$REVIEW_RECEIPT_SHA256"
          bash "$CYCLE_ASSET_DIR/04-finalize.sh"
          bash "$CYCLE_ASSET_DIR/05-final-gate.sh"

      - name: Independently rerun complete exact-head product gate and seal product
        shell: bash
        run: |
          set -euo pipefail
          npm run gate | tee "$OUT/terminal-product-gate.log"
          test -z "$(git status --porcelain)"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/product-paths.txt"
          test -s "$OUT/product-paths.txt"
          ! grep -E '^(\.github/workflows/|tmp/)' "$OUT/product-paths.txt" >/dev/null
          git diff --check "$EXACT_MAIN"...HEAD
          product_commit="$(git rev-parse HEAD)"; product_tree="$(git rev-parse HEAD^{tree})"; product_paths="$(wc -l < "$OUT/product-paths.txt")"; gate_sha="$(sha256sum "$OUT/terminal-product-gate.log" | awk '{print $1}')"
          printf 'product_commit=%s\nproduct_tree=%s\nproduct_branch=%s\nproduct_paths=%s\ncomplete_gate_sha256=%s\n' "$product_commit" "$product_tree" "$PRODUCT_BRANCH" "$product_paths" "$gate_sha" > "$OUT/product-custody.txt"
          printf 'PRODUCT_HEAD=%s\nPRODUCT_TREE=%s\nPRODUCT_PATH_COUNT=%s\nPRODUCT_GATE_SHA256=%s\n' "$product_commit" "$product_tree" "$product_paths" "$gate_sha" >> "$GITHUB_ENV"

      - name: Publish, check, and merge only the exact terminal product or accept an identical concurrent canonical tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          live_main="$(git rev-parse refs/remotes/origin/main)"
          if test "$live_main" != "$EXACT_MAIN"; then
            test "$(git rev-parse "${live_main}^{tree}")" = "$PRODUCT_TREE"
            printf '%s\n' "$live_main" > "$OUT/merged-main.txt"
            printf 'mode=accepted-identical-concurrent-canonical-tree\n' > "$OUT/merge-mode.txt"
          else
            git push --force origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
            pulls="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=BigBirdReturns:${PRODUCT_BRANCH}&per_page=100")"
            count="$(jq 'length' <<<"$pulls")"
            if test "$count" = "0"; then
              body='Exact one-commit workflow-free cycle-007 Kragar product. Merge authority is restricted to the terminal guardian exact SHA, tree, path census, review receipt, finalization custody, complete gate, and completed product-head checks.'
              gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls" -f title='Corpus: publish exact Doctor Who cycle 007 Kragar product terminal V4' -f head="$PRODUCT_BRANCH" -f base=main -f body="$body" > "$OUT/product-pr.json"
            elif test "$count" = "1"; then
              jq '.[0]' <<<"$pulls" > "$OUT/product-pr.json"
            else
              echo 'multiple terminal product PRs' >&2; exit 1
            fi
            product_pr="$(jq -r '.number' "$OUT/product-pr.json")"
            jq -e --arg head "$PRODUCT_HEAD" --arg base "$EXACT_MAIN" '.state=="open" and .draft==false and .head.sha==$head and .base.sha==$base' "$OUT/product-pr.json" >/dev/null
            printf 'product_pr=%s\n' "$product_pr" >> "$OUT/product-custody.txt"

            for _ in $(seq 1 360); do
              gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${PRODUCT_HEAD}/check-runs?per_page=100" > "$OUT/product-check-runs.json"
              total="$(jq -r '.total_count' "$OUT/product-check-runs.json")"; pending="$(jq '[.check_runs[]|select(.status!="completed")]|length' "$OUT/product-check-runs.json")"; bad="$(jq '[.check_runs[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' "$OUT/product-check-runs.json")"
              pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${product_pr}")"; mergeable="$(jq -r '.mergeable' <<<"$pr_json")"; state="$(jq -r '.mergeable_state' <<<"$pr_json")"
              if test "$total" -ge "1" -a "$pending" = "0" -a "$bad" = "0" -a "$mergeable" = "true" && test "$state" != "dirty" -a "$state" != "blocked"; then printf '%s\n' "$pr_json" > "$OUT/product-pr-ready.json"; break; fi
              sleep 5
            done
            test -s "$OUT/product-pr-ready.json"
            git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
            live_main="$(git rev-parse refs/remotes/origin/main)"
            if test "$live_main" != "$EXACT_MAIN"; then
              test "$(git rev-parse "${live_main}^{tree}")" = "$PRODUCT_TREE"
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${product_pr}" -f state=closed >/dev/null
              printf '%s\n' "$live_main" > "$OUT/merged-main.txt"
              printf 'mode=accepted-identical-concurrent-canonical-tree\nproduct_pr=%s\n' "$product_pr" > "$OUT/merge-mode.txt"
            else
              test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$PRODUCT_HEAD"
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${product_pr}/merge" -f sha="$PRODUCT_HEAD" -f merge_method=squash -f commit_title='Corpus: publish Doctor Who cycle 007 Kragar product' -f commit_message='Publish the exact independently reviewed, receipt-finalized, workflow-free Kragar cycle product.' > "$OUT/merge-response.json"
              jq -e '.merged==true and (.sha|test("^[0-9a-f]{40}$"))' "$OUT/merge-response.json" >/dev/null
              jq -r '.sha' "$OUT/merge-response.json" > "$OUT/merged-main.txt"
              printf 'mode=terminal-exact-sha-merge\nproduct_pr=%s\n' "$product_pr" > "$OUT/merge-mode.txt"
            fi
          fi

      - name: Verify canonical main tree, paths, cycle semantics, and write terminal receipt
        shell: bash
        run: |
          set -euo pipefail
          merged_main="$(cat "$OUT/merged-main.txt")"
          for _ in $(seq 1 30); do git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"; test "$(git rev-parse refs/remotes/origin/main)" = "$merged_main" && break; sleep 2; done
          test "$(git rev-parse refs/remotes/origin/main)" = "$merged_main"
          test "$(git rev-parse "${merged_main}^{tree}")" = "$PRODUCT_TREE"
          git diff --name-only "$EXACT_MAIN"..."$merged_main" | LC_ALL=C sort > "$OUT/merged-main-paths.txt"
          cmp "$OUT/product-paths.txt" "$OUT/merged-main-paths.txt"
          git show "$merged_main:data/specimens.json" | grep -F 'UC-1352' >/dev/null
          git show "$merged_main:data/specimens.json" | grep -F 'Kragar' >/dev/null
          mode="$(sed -n 's/^mode=//p' "$OUT/merge-mode.txt")"
          product_pr="$(sed -n 's/^product_pr=//p' "$OUT/merge-mode.txt" | head -1)"
          product_pr_json="${product_pr:-null}"
          cat > "$OUT/canonical-merge-receipt.json" <<JSON
          {
            "schema_version": 1,
            "transaction": "DOCTOR-WHO-CYCLE-007-KRAGAR-TERMINAL-CANONICAL-MERGE-V4",
            "previous_main": "$EXACT_MAIN",
            "canonical_main": "$merged_main",
            "canonical_tree": "$PRODUCT_TREE",
            "product_pr": $product_pr_json,
            "product_commit": "$PRODUCT_HEAD",
            "product_paths": $PRODUCT_PATH_COUNT,
            "review_run": $REVIEW_RUN,
            "review_job": $REVIEW_JOB,
            "review_artifact_id": $REVIEW_ARTIFACT_ID,
            "review_artifact_sha256": "$REVIEW_ARTIFACT_DIGEST",
            "independent_review_receipt_sha256": "$(cat "$OUT/independent-review-receipt.sha256")",
            "complete_gate_sha256": "$PRODUCT_GATE_SHA256",
            "merge_mode": "$mode",
            "verdict": "canonical-exact-reviewed-product"
          }
          JSON
          sha256sum "$OUT/canonical-merge-receipt.json" | awk '{print $1}' > "$OUT/canonical-merge-receipt.sha256"

      - name: Comment canonical receipt and close every never-merge carrier
        shell: bash
        run: |
          set -euo pipefail
          product_pr="$(sed -n 's/^product_pr=//p' "$OUT/merge-mode.txt" | head -1)"
          merged_main="$(cat "$OUT/merged-main.txt")"; receipt_sha="$(cat "$OUT/canonical-merge-receipt.sha256")"
          if test -n "$product_pr"; then gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${product_pr}/comments" -f body="Exact cycle-007 Kragar product is canonical at ${merged_main}; tree ${PRODUCT_TREE}; terminal receipt SHA-256 ${receipt_sha}." >/dev/null; fi
          for branch in agent/doctor-who-cycle-007-v8-materializer agent/doctor-who-cycle-007-v8-independent-review-v2 agent/doctor-who-cycle-007-v8-independent-review-v3-probe agent/doctor-who-cycle-007-v8-independent-review-v4-probe agent/doctor-who-cycle-007-v8-independent-review-v5 agent/doctor-who-cycle-007-v8-finalizer-v1 agent/doctor-who-cycle-007-v8-finalizer-v2 agent/doctor-who-cycle-007-v8-finalizer-v3 agent/doctor-who-cycle-007-v8-product-qualifier-v1 agent/doctor-who-cycle-007-v8-product-qualifier-v2 agent/doctor-who-cycle-007-v8-product-qualifier-v3 agent/doctor-who-cycle-007-v8-merge-guardian-v1 agent/doctor-who-cycle-007-v8-merge-guardian-v2 agent/doctor-who-cycle-007-v8-merge-guardian-v3 agent/doctor-who-cycle-007-v8-terminal-guardian-v4; do
            carrier_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=BigBirdReturns:${branch}&per_page=100" --jq '.[0].number // empty')"; test -z "$carrier_pr" || gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${carrier_pr}" -f state=closed >/dev/null
          done

      - name: Upload terminal canonical custody
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-terminal-canonical-v4-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: ${{ env.OUT }}
