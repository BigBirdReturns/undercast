name: doctor-who-cycle-012-selection-cleanup-evidence-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-evidence-v5
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V1_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      V3_MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      INSTALL_PARENT: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      INSTALLED_MAIN: 108ea5f461ceb24d9253f246e7d88fc8ca8d74bb
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      WRITER_V5: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
      BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v5
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v5.yml
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5
      V4_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-v4-evidence
      FAILURE_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-v4-failure
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      V4_EVIDENCE_PR: "891"
      V4_EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v4
      V4_EVIDENCE_HEAD: d8334a284814b1ae36d5a1f0207ff3fd6024caa6
      V4_EVIDENCE_RUN: "31411609257"
      V4_EVIDENCE_ATTEMPT: "1"
      V4_EVIDENCE_JOB: "93530760468"
      V4_EVIDENCE_ARTIFACT: "9071888609"
      V4_EVIDENCE_ARTIFACT_NAME: doctor-who-cycle-012-selection-cleanup-evidence-v4-31411609257-attempt-1
      V4_EVIDENCE_ARTIFACT_BYTES: "784771"
      V4_EVIDENCE_ARTIFACT_SHA256: 36cb13103951de5be321b39f51a73dc0e7cbba25033b1eb649e9f315bd0e9d39
      V4_EVIDENCE_ARTIFACT_FILES: "66"
      V4_EVIDENCE_IDENTITY: 452c643a3d9870d3a5b6509ec38cee52b3fb18cc73694307ecaa5774a1870004

      V4_FAILURE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-writer-v4
      V4_FAILURE_RUN: "31411919301"
      V4_FAILURE_JOB: "93531776025"
      V4_FAILURE_ARTIFACT: "9071900542"
      V4_FAILURE_ARTIFACT_NAME: doctor-who-cycle-012-selection-cleanup-writer-v4-diagnostics-31411919301-attempt-1
      V4_FAILURE_ARTIFACT_BYTES: "75617"
      V4_FAILURE_ARTIFACT_SHA256: cb272591c82bd3b346f2fbd902879db0dad06e0451e986c65fc7daf9502f7d7b
      V4_FAILURE_ARTIFACT_FILES: "9"
      V4_CARRIER_BYTES: "21756"
      V4_CARRIER_SHA256: 672bb074f1e50e272e1a3115882b0acc9bda42a0bab5e8c0b8ecf32c082aac04

      INSTALLER_PR: "896"
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v5

      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      CHARACTER_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      PORTRAIT_SHA256: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e

      V5_CARRIER_BLOB: 23f7b466484ec9195374b20860ea8cdeafba368b
      V5_CARRIER_GZIP_BYTES: "5473"
      V5_CARRIER_GZIP_SHA256: c3e49494f7d5a180fdd9cc689baa30f138903a6e904edfcae3139ea88a754525
      V5_CARRIER_BYTES: "22253"
      V5_CARRIER_SHA256: 8f8ea54d37f9a9103e00593f8e571983bd1eb5311643cd7fd5dc19ac61ad60bb

      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

      API_CARRIER_BLOB: cbd4dd6d17974185293745abf94ab57b2e385e8f
      API_CARRIER_GZIP_BYTES: "5618"
      API_CARRIER_GZIP_SHA256: 9aeb0bcc60409407170297eb5447efdf0583e9a6c1f850cdc26919361ec22631
      API_CARRIER_BYTES: "22146"
      API_CARRIER_SHA256: f7423ae92612863b6f1fec61be4640894a6ba6be39ecf88c65800694843c9c9f
      PATCHED_CARRIER_BYTES: "22156"
      PATCHED_CARRIER_SHA256: a1eb5adbc77a98d7f169ee608e53a0223a82cd43bfc4fda7d475b2ab03f8d8d5
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-api-loader

    steps:
      - name: Reconstruct and execute exact API-only cleanup evidence V5 carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$API_CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$API_CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$API_CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$API_CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.original.sh"
          test "$(wc -c < "$LOADER/carrier.original.sh" | tr -d ' ')" = "$API_CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.original.sh" | awk '{print $1}')" = "$API_CARRIER_SHA256"
          IN="$LOADER/carrier.original.sh" OUTFILE="$LOADER/carrier.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path(os.environ['IN']).read_text()
          old='Reconstruct and execute exact V4 cleanup writer'
          new='Reconstruct and execute exact non-circular cleanup writer'
          assert source.count(old)==1 and source.count(new)==0
          Path(os.environ['OUTFILE']).write_text(source.replace(old,new))
          PY
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$PATCHED_CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$PATCHED_CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v5-api-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-v4-evidence
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-v4-failure
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v5-api-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
