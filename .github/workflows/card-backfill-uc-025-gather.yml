name: card-backfill-uc-025-gather

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-025.json"
      - "scripts/card-backfill-uc-025-gather.mjs"
      - ".github/workflows/card-backfill-uc-025-gather.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-025-gather-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gather:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-002'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
          montage -version | head -n 2
      - name: Verify the exact bounded obligation
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-025.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-025');
          if(control.version!==2||control.record_id!=='UC-025'||control.side!=='still'||control.actor!=='Javier Botet')throw new Error('UC-025 control drift');
          if(!specimen||specimen.still)throw new Error('UC-025 canonical still boundary changed');
          const item=(audit.items||[]).find(row=>row.wall_id==='UC-025'&&row.side==='still');
          if(!item||item.status!=='absent'||item.expected_subject!=='Mama, the Crooked Man & others')throw new Error('UC-025 audit boundary changed');
          if(control.roles?.length!==3)throw new Error('UC-025 discovery must retain three role lanes');
          for(const role of control.roles){
            if(!Array.isArray(role.candidate_pages)||role.candidate_pages.length<2)throw new Error(`${role.key} lacks independent candidate pages`);
            if(!/^https:\/\//.test(role.credit_page)||!/^https:\/\//.test(role.reference_media_page))throw new Error(`${role.key} provenance URLs drifted`);
          }
          console.log('PASS — UC-025 remains an exact source-declared absence with three independently sourced discovery lanes');
          NODE
      - name: Gather role-specific article images and build review sheets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-025
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-025-gather.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-025.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact UC-025 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-025-gather-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-025
            ${{ runner.temp }}/card-backfill-uc-025.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
