name: doctor-who-cycle-010-preflight-v2
"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-010-preflight-v2.yml"]
permissions: {}
concurrency:
  group: doctor-who-cycle-010-preflight-v2
  cancel-in-progress: true
jobs:
  preflight:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-preflight-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions: {contents: read, actions: read, pull-requests: read}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-preflight-v2
      SELF: .github/workflows/doctor-who-cycle-010-preflight-v2.yml
      OUT: /tmp/doctor-who-cycle-010-preflight-v2
      MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      TERMINAL_PR: "706"
      TERMINAL_HEAD: 4136226d397a12231714f2454c975f8b40253fc7
      TERMINAL_RUN: "31286873493"
      TERMINAL_JOB: "93177192558"
      TERMINAL_ARTIFACT: "9030160281"
      TERMINAL_ZIP_SHA: f1a08d336434d4159c18da24c52eae460e25c73ac15e42f818eb1c1b9c5649a8
      TERMINAL_ID: 105a29dd19ca3fff2264a17feae01b9eb227102e56b5d4388beab1847ebc6539
      PRIOR_CYCLE: cycle_42b1d086ae8eab34f09827dc
      PRIOR_TASK: ap_45bb5fdcdf4aff65aa7a87c3
      TASK: ap_cab2d7f95d930401627c1b30
      PERFORMER: Dan Starkey
      ROLE: Merx
      SOURCE: https://tardis.fandom.com/wiki/Merx
      SOURCE_FP: 3cd27f90fa9459a554855c0d98f6d8bdeefcebea115947122703c2a84246e62a
      SOURCE_SHA: 5fa09f17e86ef5868e36d860119c14867a0766b0b8d6da6cf8a739fb85509e4c
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, filter: blob:none, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - name: Bind carrier and terminal proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,terminal,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$TERMINAL_PR" > "$OUT/api/terminal-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN" > "$OUT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN/jobs?per_page=100" > "$OUT/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$TERMINAL_RUN/artifacts?per_page=100" > "$OUT/api/artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$TERMINAL_ARTIFACT/zip" > "$OUT/terminal.zip"
          test "$(sha256sum "$OUT/terminal.zip" | cut -d' ' -f1)" = "$TERMINAL_ZIP_SHA"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          c=json.loads((r/'api/carrier.json').read_text()); p=json.loads((r/'api/terminal-pr.json').read_text())
          run=json.loads((r/'api/run.json').read_text()); jobs=json.loads((r/'api/jobs.json').read_text())['jobs']; arts=json.loads((r/'api/artifacts.json').read_text())['artifacts']
          assert c['number']==int(os.environ['PR']) and c['state']=='open' and c['draft'] and not c['merged'] and c['commits']==c['changed_files']==1
          assert c['base']['sha']==os.environ['MAIN'] and c['head']['ref']==os.environ['BRANCH'] and c['head']['sha']==os.environ['HEAD']
          assert p['state']=='closed' and not p['merged'] and p['head']['sha']==os.environ['TERMINAL_HEAD'] and p['base']['sha']==os.environ['MAIN']
          assert run['id']==int(os.environ['TERMINAL_RUN']) and run['head_sha']==os.environ['TERMINAL_HEAD'] and run['status']=='completed' and run['conclusion']=='success'
          assert any(x['id']==int(os.environ['TERMINAL_JOB']) and x['name']=='prove' and x['conclusion']=='success' for x in jobs)
          assert any(x['id']==int(os.environ['TERMINAL_ARTIFACT']) and not x['expired'] and x['digest']=='sha256:'+os.environ['TERMINAL_ZIP_SHA'] for x in arts)
          t=r/'terminal'
          with zipfile.ZipFile(r/'terminal.zip') as z:
            for i in z.infolist():
              q=PurePosixPath(i.filename); assert not q.is_absolute() and '..' not in q.parts
              if not i.is_dir(): o=t/q; o.parent.mkdir(parents=True,exist_ok=True); o.write_bytes(z.read(i))
          ledger=t/'SHA256SUMS.pre'; assert sha(ledger.read_bytes())==(t/'SHA256SUMS').read_text().split()[0]
          for line in ledger.read_text().splitlines():
            d,n=line.split(None,1); q=t/n.lstrip('*'); assert q.is_file() and sha(q.read_bytes())==d
          proof=json.loads((t/'postmerge-proof.json').read_text()); ident=proof.pop('identity')
          assert ident==os.environ['TERMINAL_ID'] and sha(json.dumps(proof,sort_keys=True,separators=(',',':')).encode())==ident
          assert proof['canonical_main']==os.environ['MAIN'] and proof['canonical_tree']==os.environ['TREE']
          assert proof['queue']=={'total':316,'queued':307,'resolved':9,'in_flight':0} and proof['media_debt']==0 and proof['unreceipted_cycles']==[]
          assert proof['next_selector_allowed'] is True and proof['cycle_010_lease_issued'] is False and proof['cycle_id']==os.environ['PRIOR_CYCLE']
          proof['identity']=ident; (r/'receipt/terminal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
      - name: Run current-main gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"; test "$(git show -s --format=%T HEAD)" = "$TREE"
          npm ci; npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/logs/cycle-007.log"
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/logs/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > "$OUT/receipt/readiness.json"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media.log"
          npm run gate 2>&1 | tee "$OUT/logs/gate.log"; grep -F 'gate: PASS' "$OUT/logs/gate.log" >/dev/null
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/receipt/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline.json" >/dev/null
          test -z "$(git status --porcelain)"; test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
      - name: Select Merx without claiming
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile text-vision --limit 200 --json > "$OUT/receipt/candidates.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          stable=lambda v:[stable(x) for x in v] if isinstance(v,list) else ({k:stable(v[k]) for k in sorted(v)} if isinstance(v,dict) else v)
          sb=Path('data/AUTOPILOT.json').read_bytes(); s=json.loads(sb); rep=json.loads((r/'receipt/candidates.json').read_text()); st=json.loads((r/'receipt/status.json').read_text()); w=json.loads((r/'receipt/waterline.json').read_text()); rd=json.loads((r/'receipt/readiness.json').read_text()); ready=rd[0] if isinstance(rd,list) else rd
          scoped=[x for x in s['jobs'] if x.get('scope')=='doctor-who']; active=[x for x in s['jobs'] if x.get('status') in {'leased','drafted','merged'}]
          assert len(scoped)==316 and st['statuses']=={'queued':307,'resolved':9} and st['in_flight']==0 and not active
          assert w['claim_allowed'] and w['claim_reasons']==[] and ready['effective_status']=='active' and ready['lease_status']=='ready' and ready['lease_token']
          assert rep['profile']['id']=='text-vision' and rep['profile']['status']=='active' and rep['counts']=={'compatible':307,'incompatible':0}
          x=rep['compatible'][0]; assert x['task_id']==os.environ['TASK']; task=next(j for j in scoped if j['id']==x['task_id'])
          assert task['status']=='queued' and task['attempts']==0 and task['priority']==800 and task['performer']==os.environ['PERFORMER'] and task['character']==os.environ['ROLE'] and task['performance_modes']==['voice']
          assert task['sources']==[os.environ['SOURCE']] and task['source_fingerprint']==x['source_fingerprint']==os.environ['SOURCE_FP']
          assert task['source_receipts']==[{'source':os.environ['SOURCE'],'pageid':233175,'revision':3363140,'timestamp':'2022-12-01T20:29:51Z','content_sha256':os.environ['SOURCE_SHA']}]
          journal=[json.loads(z) for z in Path('data/journal/autopilot.jsonl').read_text().splitlines() if z.strip()]; claims=[z for z in journal if z.get('op')=='lease.claimed' and z.get('scope')=='doctor-who']
          cycles=[z for z in json.loads(Path('data/WATERLINE-STATE.json').read_text())['cycles'] if z.get('scope_id')=='doctor-who']
          assert len(claims)==len(cycles)==9 and claims[-1]['task_id']==os.environ['PRIOR_TASK'] and cycles[-1]['id']==os.environ['PRIOR_CYCLE']
          packet={'version':1,'status':'cycle-010-read-only-preflight-complete','canonical_main':os.environ['MAIN'],'canonical_tree':os.environ['TREE'],'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'terminal_proof':{'pr':int(os.environ['TERMINAL_PR']),'run':int(os.environ['TERMINAL_RUN']),'artifact':int(os.environ['TERMINAL_ARTIFACT']),'identity':os.environ['TERMINAL_ID']},'prior_cycle':os.environ['PRIOR_CYCLE'],'queue':{'total':316,'queued':307,'resolved':9,'in_flight':0,'compatible':307,'incompatible':0},'selection_strategy':'priority-desc-scope-performer-character-first-compatible','capability_profile':rep['profile'],'capability_policy_sha256':rep['policy_sha256'],'selected':x,'task':task,'readiness':ready,'state_file_sha256':sha(sb),'lease_issued':False,'queue_mutated':False,'repository_write':False,'cycle_010_authority':'selection-only','outside_human_dependency':False,'owner_physical_action_required':False}
          packet['identity']=sha(json.dumps(stable(packet),separators=(',',':'),ensure_ascii=False).encode()); (r/'receipt/preflight.json').write_text(json.dumps(packet,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT/receipt" "$OUT/logs" -type f -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' f; do
            if [ -f "$OUT/receipt/$f" ]; then p="receipt/$f"; else p="logs/$f"; fi
            sha256sum "$OUT/$p" | sed "s#  $OUT/#  #"
          done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          ledger=r/'SHA256SUMS.pre'; assert sha(ledger.read_bytes())==(r/'SHA256SUMS').read_text().split()[0]
          for raw in ledger.read_text().splitlines():
            d,n=raw.split(None,1); p=r/n.lstrip('*'); assert p.is_file() and sha(p.read_bytes())==d
          assert all(n.startswith(('receipt/','logs/')) for _,n in (raw.split(None,1) for raw in ledger.read_text().splitlines()))
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-preflight-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-preflight-v2/SHA256SUMS
            /tmp/doctor-who-cycle-010-preflight-v2/SHA256SUMS.pre
            /tmp/doctor-who-cycle-010-preflight-v2/receipt
            /tmp/doctor-who-cycle-010-preflight-v2/logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-preflight-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-preflight-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
