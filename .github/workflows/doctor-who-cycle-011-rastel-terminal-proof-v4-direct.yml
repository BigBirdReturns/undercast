name: doctor-who-cycle-011-rastel-terminal-proof-v4-direct

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v4-direct.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-terminal-proof-v4-direct
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-terminal-proof-v4-direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BOOT: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct-bootstrap
      OUT: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct
      SOURCE_PR: "837"
      SOURCE_HEAD: 6298f3cf336ab6478565726cd400e35e279adfd6
      SOURCE_RUN: "31352593805"
      SOURCE_JOB: "93346042648"
      SOURCE_ARTIFACT: "9049465940"
      SOURCE_ARTIFACT_BYTES: "52987960"
      SOURCE_ARTIFACT_DIGEST: "sha256:1c634ebf767cbc1c0ed8a8fab88138514d1500f5d8522caed993b391d9758284"
      SOURCE_WORKFLOW_PATH: .github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v3-direct.yml
      SOURCE_WORKFLOW_BLOB: c5794bdd7a524b02561127637ef75d6be3671535
      SOURCE_SCRIPT_BYTES: "20836"
      SOURCE_SCRIPT_SHA256: 8fb78de98d0c39331d26fffb92e7295a0493a80850ddc9fc3e10fb605d766914
      SOURCE_REPAIR_IDENTITY: b2189b22f4552db173a0d3ea7885581a77e4bac942594896d1e884a92daa4b83
      REPAIRED_SCRIPT_BYTES: "20860"
      REPAIRED_SCRIPT_SHA256: c5a680eb9da9507edfdba67c5d99942a1bd1bf1a7cfc437e57cc740e5c7f44dd
      REPAIR_PATCH_BYTES: "1608"
      REPAIR_PATCH_SHA256: 44b24f5a3a1871c11ef058594fa4e74e6574b3416e080331c01138166a360111

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V3 parent-schema failure and recover proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOT" "$OUT"
          mkdir -p "$BOOT"/{api,source,extracted,repair}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v4-direct.yml'
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$BOOT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$BOOT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$BOOT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > "$BOOT/api/source-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$BOOT/api/source-artifact.json"
          git show "$SOURCE_HEAD:$SOURCE_WORKFLOW_PATH" > "$BOOT/source/source-workflow.yml"
          test "$(git hash-object "$BOOT/source/source-workflow.yml")" = "$SOURCE_WORKFLOW_BLOB"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['BOOT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          own=load('carrier-pr.json'); source=load('source-pr.json'); run=load('source-run.json'); job=load('source-job.json'); artifact=load('source-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']=='agent/doctor-who-cycle-011-rastel-terminal-proof-v4-direct' and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert source['number']==int(os.environ['SOURCE_PR']) and source['head']['sha']==os.environ['SOURCE_HEAD'] and source['head']['ref']=='agent/doctor-who-cycle-011-rastel-terminal-proof-v3-direct'
          assert source['base']['sha']==os.environ['CURRENT_BASE'] and source['draft'] is True and source['merged'] is False
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-011-rastel-terminal-proof-v3-direct' and run['head_sha']==os.environ['SOURCE_HEAD']
          assert run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          assert job['id']==int(os.environ['SOURCE_JOB']) and job['run_id']==int(os.environ['SOURCE_RUN']) and job['name']=='prove' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Apply exact shell-quote repair and execute unchanged proof']==('completed','failure')
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['size_in_bytes']==int(os.environ['SOURCE_ARTIFACT_BYTES']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$BOOT/source/diagnostics.zip"
          test "$(sha256sum "$BOOT/source/diagnostics.zip" | awk '{print $1}')" = "${SOURCE_ARTIFACT_DIGEST#sha256:}"
          python3 - <<'PY'
          import hashlib,json,os,shutil,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['BOOT']); target=root/'extracted'; sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'source/diagnostics.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          candidates=[p for p in target.rglob('proof-v3.sh') if p.is_file() and p.stat().st_size==int(os.environ['SOURCE_SCRIPT_BYTES']) and sha(p.read_bytes())==os.environ['SOURCE_SCRIPT_SHA256']]
          assert len(candidates)==1,[p.as_posix() for p in candidates]
          shutil.copy2(candidates[0],root/'source/proof-v3.sh')
          receipts=[]
          for path in target.rglob('receipt.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              if data.get('status')=='cycle-011-rastel-terminal-proof-v3-shell-quote-repair-qualified': receipts.append((path,data))
          assert len(receipts)==1,[p.as_posix() for p,_ in receipts]
          path,data=receipts[0]; identity=data.pop('identity')
          assert identity==os.environ['SOURCE_REPAIR_IDENTITY'] and sha(json.dumps(data,sort_keys=True,separators=(',',':')).encode())==identity
          data['identity']=identity
          assert data['repaired']['script_bytes']==int(os.environ['SOURCE_SCRIPT_BYTES']) and data['repaired']['script_sha256']==os.environ['SOURCE_SCRIPT_SHA256']
          (root/'source/source-repair.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY

      - name: Repair only parent-object projection and execute terminal proof
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$BOOT/source/proof-v3.sh" TARGET="$BOOT/proof-v4.sh" PATCH="$BOOT/repair/proof-v3-to-v4.patch" python3 - <<'PY'
          import difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          source=Path(os.environ['SOURCE']); target=Path(os.environ['TARGET']); patch_path=Path(os.environ['PATCH'])
          original=source.read_text(); text=original; changes=[]
          def replace_exact(name,old,new,count=1):
              global text
              observed=text.count(old); assert observed==count,(name,observed,count)
              text=text.replace(old,new)
              changes.append({'name':name,'occurrences':observed,'old_sha256':hashlib.sha256(old.encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest()})
          replace_exact('branch-rebind','agent/doctor-who-cycle-011-rastel-terminal-proof-v3-direct','agent/doctor-who-cycle-011-rastel-terminal-proof-v4-direct')
          replace_exact('workflow-path-rebind','.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v3-direct.yml','.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v4-direct.yml')
          replace_exact('output-root-rebind','/tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct','/tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct')
          replace_exact('git-parent-object-projection',"assert commit['parents']==[os.environ['PUBLICATION_PARENT']]","assert [row['sha'] for row in commit['parents']]==[os.environ['PUBLICATION_PARENT']]")
          target.write_text(text)
          patch=''.join(difflib.unified_diff(original.splitlines(True),text.splitlines(True),fromfile='proof-v3.sh',tofile='proof-v4.sh'))
          patch_path.write_text(patch)
          data=target.read_bytes(); patch_data=patch_path.read_bytes()
          assert len(data)==int(os.environ['REPAIRED_SCRIPT_BYTES']) and hashlib.sha256(data).hexdigest()==os.environ['REPAIRED_SCRIPT_SHA256']
          assert len(patch_data)==int(os.environ['REPAIR_PATCH_BYTES']) and hashlib.sha256(patch_data).hexdigest()==os.environ['REPAIR_PATCH_SHA256']
          assert text.count("commit['parents']==") == 0
          assert text.count("[row['sha'] for row in commit['parents']]")==1
          subprocess.run(['bash','-n',str(target)],check=True)
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-011-terminal-proof-v4-{index}>','exec')
          receipt={'status':'cycle-011-rastel-terminal-proof-v4-parent-schema-repair-qualified','version':4,'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'repair_identity':os.environ['SOURCE_REPAIR_IDENTITY'],'script_bytes':int(os.environ['SOURCE_SCRIPT_BYTES']),'script_sha256':os.environ['SOURCE_SCRIPT_SHA256']},'repaired':{'script_bytes':len(data),'script_sha256':hashlib.sha256(data).hexdigest(),'patch_bytes':len(patch_data),'patch_sha256':hashlib.sha256(patch_data).hexdigest(),'changes':changes},'preflight':{'all_retained_non_git_assertions_through_49_row_manifest':True},'boundary':{'proof_predicate_changed':False,'api_schema_projection_changed':True,'product_byte_changed':False,'receipt_authority_changed':False,'gate_changed':False,'repository_write':False,'canonical_mutation':False,'cycle_012_lease_issued':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(os.environ['BOOT'],'repair','receipt-v4.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod 700 "$BOOT/proof-v4.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$BOOT/proof-v4.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-terminal-proof-v4-direct-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-terminal-proof-v4-direct-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct
            /tmp/doctor-who-cycle-011-rastel-terminal-proof-v4-direct-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
