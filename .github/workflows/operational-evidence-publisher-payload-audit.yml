name: operational-evidence-publisher-payload-audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/operational-evidence-publisher-payload-audit.yml"

permissions:
  contents: read

env:
  TARGET_WORKFLOW_BLOB: 04b1e470970ce75709946cb0af7fdd7a0c928f19
  TARGET_WORKFLOW_PATH: .github/workflows/operational-evidence-second-desk-publisher.yml
  EXPECTED_WORKFLOW_SHA256: 50f34bd43145bcda26fe4fbb776c0fe99f18001a73c1abc61b073cd17ddd27b7
  EXPECTED_SCRIPT_SHA256: cc58a0e52cb80c05213caf50c685e50c912395b52b0038eea16fce36ee7696b4
  AUDIT_ROOT: /tmp/undercast-operational-publisher-payload-audit

jobs:
  audit:
    if: github.repository == 'BigBirdReturns/undercast' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover and audit the exact transparent publisher workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$AUDIT_ROOT"
          mkdir -p "$AUDIT_ROOT"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${TARGET_WORKFLOW_BLOB}" \
            > "$AUDIT_ROOT/blob.json"
          python3 - "$AUDIT_ROOT" "$TARGET_WORKFLOW_BLOB" "$EXPECTED_WORKFLOW_SHA256" "$EXPECTED_SCRIPT_SHA256" <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          target_blob, workflow_sha, script_sha = sys.argv[2:]
          document = json.loads((root / 'blob.json').read_text())
          if document.get('sha') != target_blob or document.get('encoding') != 'base64':
              raise SystemExit('workflow blob identity or encoding drifted')
          workflow = base64.b64decode(document['content'])
          (root / 'publisher-workflow.yml').write_bytes(workflow)
          if hashlib.sha256(workflow).hexdigest() != workflow_sha:
              raise SystemExit('workflow SHA-256 drifted')
          git_blob = hashlib.sha1(b'blob ' + str(len(workflow)).encode() + b'\0' + workflow).hexdigest()
          if git_blob != target_blob:
              raise SystemExit('workflow Git-blob identity drifted')
          text = workflow.decode()
          prefix = text.split('\njobs:\n', 1)[0]
          if '\n  push:\n' not in prefix or 'pull_request' in prefix:
              raise SystemExit('publisher trigger is not push-only')
          if 'permissions: {}' not in prefix:
              raise SystemExit('publisher top-level permissions are not empty')
          required = [
              "      actions: read",
              "      contents: write",
              "      pull-requests: write",
              "github.event_name == 'push'",
              "github.ref == 'refs/heads/main'",
              "artifact='8962463936'",
              "source_run='31088470731'",
              "source_job='92573474384'",
              "product_branch='agent/operational-evidence-second-desk-product-20260806'",
              "npm run gate",
              "gh pr create",
              "draft product PR",
              "trap cleanup EXIT",
              "Remove any product left by a failed publication step",
              "gh pr close",
              "git push origin --delete",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing publisher custody token: {token}')
          forbidden = ['gh pr merge', 'git push --force', 'git push -f ', 'roadmap_recompleted\':True', 'outside_human_dependency\':True']
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden publisher token present: {token}')
          marker = "          cat > /tmp/operational-evidence-second-desk-publisher.sh <<'PUBLISHER'\n"
          start = text.index(marker) + len(marker)
          end = text.index('\n          PUBLISHER\n', start)
          embedded = text[start:end].splitlines()
          script = ('\n'.join(line[10:] for line in embedded) + '\n').encode()
          (root / 'publisher.sh').write_bytes(script)
          if hashlib.sha256(script).hexdigest() != script_sha:
              raise SystemExit('embedded publisher script SHA-256 drifted')
          receipt = {
              'status': 'passed',
              'workflow_blob': target_blob,
              'workflow_sha256': workflow_sha,
              'publisher_script_sha256': script_sha,
              'trigger': 'push-main-only',
              'repository_permissions': 'isolated-job-write',
              'script_failure_cleanup': True,
              'post_receipt_failure_cleanup': True,
              'product_merge_authority': False,
              'outside_human_dependency': False,
          }
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          bash -n "$AUDIT_ROOT/publisher.sh"
          sha256sum \
            "$AUDIT_ROOT/blob.json" \
            "$AUDIT_ROOT/publisher-workflow.yml" \
            "$AUDIT_ROOT/publisher.sh" \
            "$AUDIT_ROOT/receipt.json" \
            > "$AUDIT_ROOT/SHA256SUMS"
      - name: Upload the exact decoded workflow and publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-evidence-publisher-payload-audit-${{ github.run_id }}
          path: /tmp/undercast-operational-publisher-payload-audit
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
