name: doctor-who-cycle-012-preflight-v9

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v9.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v9
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      CLEANUP_MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v9
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v9.yml
      OUT: /tmp/doctor-who-cycle-012-preflight-v9
      DIAGNOSTIC_PR: "859"
      DIAGNOSTIC_BRANCH: agent/doctor-who-cycle-012-preflight-v6
      DIAGNOSTIC_HEAD: 81ff351954e3481b870fd6a9873815cf99aa949e
      DIAGNOSTIC_RUN: "31362028270"
      DIAGNOSTIC_JOB: "93372613233"
      DIAGNOSTIC_ARTIFACT: "9052755861"
      DIAGNOSTIC_ARTIFACT_NAME: doctor-who-cycle-012-preflight-v6-repair2-diagnostics-31362028270-attempt-1
      DIAGNOSTIC_ARTIFACT_SHA256: 81774b1929e470254543ce14be0754f4d2fc8f7b60f9309e271bb3c0ab3e4b05
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      PRIOR_CUSTODY_IDENTITY: a999f0cf3c55cf11bb594ea388258700ef010aabb9974b6c6b853c151cdc7275
      COMMAND_IDENTITY: 60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf
      SELECTED_TASK: ap_8965086737382df0e88366db
      SELECTED_PERFORMER: Dan Starkey
      SELECTED_ROLE: Senstarg
      SELECTED_MODE: unresolved
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1","agent/doctor-who-cycle-012-preflight-v4","agent/doctor-who-cycle-012-preflight-v5","agent/doctor-who-cycle-012-preflight-v6","agent/doctor-who-cycle-012-preflight-v7","agent/doctor-who-cycle-012-preflight-v8"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"},{"pr":857,"branch":"agent/doctor-who-cycle-012-preflight-v4"},{"pr":858,"branch":"agent/doctor-who-cycle-012-preflight-v5"},{"pr":859,"branch":"agent/doctor-who-cycle-012-preflight-v6"},{"pr":860,"branch":"agent/doctor-who-cycle-012-preflight-v7"}]'
      OBSERVER_PRS_JSON: '[{"pr":855,"branch":"observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3"},{"pr":856,"branch":"observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4"}]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate paid selector output and freeze current custody
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,diagnostic,payload,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          test "$(git merge-base "$CLEANUP_MAIN" "$MAIN")" = "$CLEANUP_MAIN"
          test "$(git rev-list --count "$CLEANUP_MAIN".."$MAIN")" = 1
          test "$(git show -s --format=%T "$CLEANUP_MAIN")" = "$TREE"
          git diff --name-status "$CLEANUP_MAIN" "$MAIN" | LC_ALL=C sort > "$OUT/logs/cleanup-to-main.tsv"
          printf 'M\tdata/MEDIA-SEARCH-LATEST.json\nM\tdata/journal/media-search.jsonl\n' | LC_ALL=C sort > "$OUT/logs/expected-cleanup-to-main.tsv"
          cmp "$OUT/logs/cleanup-to-main.tsv" "$OUT/logs/expected-cleanup-to-main.tsv"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$DIAGNOSTIC_PR" > "$OUT/api/diagnostic-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN" > "$OUT/api/diagnostic-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAGNOSTIC_RUN/jobs?per_page=100" > "$OUT/api/diagnostic-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTIC_ARTIFACT" > "$OUT/api/diagnostic-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAGNOSTIC_ARTIFACT/zip" > "$OUT/source/diagnostic.zip"
          test "$(sha256sum "$OUT/source/diagnostic.zip" | awk '{print $1}')" = "$DIAGNOSTIC_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/diagnostic-artifact.json")" = "sha256:$DIAGNOSTIC_ARTIFACT_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/cycle12-refs.json"
          for number in 793 794 795 796 797 798 857 858 859 860 855 856; do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number.json"
          done
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3" > "$OUT/api/ref-855.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4" > "$OUT/api/ref-856.json"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['OUT'])
          api = root / 'api'
          sha = lambda data: hashlib.sha256(data).hexdigest()
          load_api = lambda name: json.loads((api / name).read_text())
          write = lambda path, value: path.write_text(json.dumps(value, indent=2, sort_keys=True, ensure_ascii=False) + '\n')

          carrier = load_api('carrier-pr.json')
          source_pr = load_api('diagnostic-pr.json')
          source_run = load_api('diagnostic-run.json')
          source_jobs = load_api('diagnostic-jobs.json')['jobs']
          source_artifact = load_api('diagnostic-artifact.json')
          assert carrier['number'] == int(os.environ['CARRIER_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CARRIER_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert source_pr['number'] == int(os.environ['DIAGNOSTIC_PR'])
          assert source_pr['state'] == 'closed' and source_pr['draft'] is True and source_pr['merged_at'] is None
          assert source_pr['base']['sha'] == os.environ['MAIN']
          assert source_pr['head']['ref'] == os.environ['DIAGNOSTIC_BRANCH'] and source_pr['head']['sha'] == os.environ['DIAGNOSTIC_HEAD']
          assert source_pr['commits'] == 3 and source_pr['changed_files'] == 3
          assert source_run['id'] == int(os.environ['DIAGNOSTIC_RUN'])
          assert source_run['head_sha'] == os.environ['DIAGNOSTIC_HEAD'] and source_run['head_branch'] == os.environ['DIAGNOSTIC_BRANCH']
          assert source_run['event'] == 'pull_request' and source_run['status'] == 'completed' and source_run['conclusion'] == 'failure'
          jobs = [row for row in source_jobs if row['id'] == int(os.environ['DIAGNOSTIC_JOB'])]
          assert len(jobs) == 1 and jobs[0]['name'] == 'select' and jobs[0]['conclusion'] == 'failure'
          assert {row['name']: row['conclusion'] for row in jobs[0].get('steps', [])}['Recover and run lifecycle-neutral V6 selector'] == 'failure'
          assert source_artifact['id'] == int(os.environ['DIAGNOSTIC_ARTIFACT'])
          assert source_artifact['name'] == os.environ['DIAGNOSTIC_ARTIFACT_NAME']
          assert source_artifact['digest'] == 'sha256:' + os.environ['DIAGNOSTIC_ARTIFACT_SHA256'] and source_artifact['expired'] is False

          target = root / 'diagnostic'
          with zipfile.ZipFile(root / 'source/diagnostic.zip') as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          candidates_paths = [path for path in target.rglob('candidates.json') if path.parent.name == 'payload']
          assert len(candidates_paths) == 1
          txn = candidates_paths[0].parent.parent
          expected = {
              'payload/candidates.json': (104773, '1fe91fd261db35ca13ba1f0e3d1a4562e015011045ea35bfc58fc0296bfa98d0'),
              'receipt/autopilot-status.json': (427, '450e44de9ee5700d87e8fa123e5c51132be82b344bb4ec1d5cac088ce26adfd6'),
              'receipt/waterline-status.json': (2966, '515aae2f677e62305580ed45fe5848d5f2a1a9f675c67831231b7f954dc9fdf7'),
              'receipt/transport-custody.json': (5364, '60b5afee23db67ebd07e2a375bdb7ae3b6436c0fbb7a0bdb1cae738b320cb3de'),
              'receipt/terminal-proof.json': (2437, '44f06487171ae3389ade6e3378ff92007e3b05f827bbee69b5997535262ab522'),
              'receipt/selector-command.json': (644, '2d688b177bb51ebb04e35e72e4631c3b29ab3c3942fec38a33d8421e3d80d170'),
              'logs/complete-gate.log': (39744, '961f0bfa6e124a6dbe473ec029914443a64b6c566e3ab1762387cba525d8a1a7'),
              'logs/media-gate.log': (285, '1daabdc1a07f2f867e06efe11f360c989a7175c53428ac1cc9f4a38adf19a8d3'),
              'logs/cleanup-to-current.tsv': (66, 'defda11c3a35305cad2d2402c10b7cf4131e999b5e54dc7dba9a3ad1b41e1a17'),
              'logs/expected-cleanup-to-current.tsv': (66, 'defda11c3a35305cad2d2402c10b7cf4131e999b5e54dc7dba9a3ad1b41e1a17'),
          }
          for rel, (size, digest) in expected.items():
              path = txn / rel
              data = path.read_bytes()
              assert len(data) == size and sha(data) == digest, (rel, len(data), sha(data))
          assert (txn / 'logs/cleanup-to-current.tsv').read_bytes() == (txn / 'logs/expected-cleanup-to-current.tsv').read_bytes()
          assert 'gate: PASS — 26 step(s) in 117s' in (txn / 'logs/complete-gate.log').read_text()
          assert '22/22 complete' in (txn / 'logs/media-gate.log').read_text()

          def verify_identity(path, expected_identity):
              value = json.loads(path.read_text())
              identity = value.pop('identity')
              assert identity == expected_identity
              assert sha(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()) == identity
              value['identity'] = identity
              return value

          proof = verify_identity(txn / 'receipt/terminal-proof.json', os.environ['PROOF_IDENTITY'])
          prior = verify_identity(txn / 'receipt/transport-custody.json', os.environ['PRIOR_CUSTODY_IDENTITY'])
          command = verify_identity(txn / 'receipt/selector-command.json', os.environ['COMMAND_IDENTITY'])
          autopilot = json.loads((txn / 'receipt/autopilot-status.json').read_text())
          waterline = json.loads((txn / 'receipt/waterline-status.json').read_text())
          census = json.loads((txn / 'payload/candidates.json').read_text())
          assert proof['status'] == 'cycle-011-rastel-terminal-cleanup-independently-proved-v1'
          assert proof['canonical']['main'] == os.environ['CLEANUP_MAIN'] and proof['canonical']['tree'] == os.environ['TREE']
          assert proof['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert proof['media'] == {'complete': 22, 'total': 22, 'debt': 0} and all(proof['gates'].values())
          assert proof['authority']['cycle_012_selection_authorized'] is True
          assert proof['authority']['cycle_012_lease_issued'] is False and proof['authority']['cycle_012_product_authority'] is False
          assert prior['status'] == 'cycle-012-preselection-transport-custody-frozen-v3'
          assert prior['canonical_main'] == os.environ['MAIN'] and prior['boundary']['lease_issued'] is False
          assert command['command'] == 'node scripts/autopilot.mjs candidates --scope doctor-who --capability-profile text-vision --limit 200 --json'
          assert autopilot['total'] == 316 and autopilot['statuses'] == {'queued': 305, 'resolved': 11} and autopilot['in_flight'] == 0
          assert waterline['scope_id'] == 'doctor-who' and waterline['claim_allowed'] is True and waterline['claim_reasons'] == []
          assert waterline['media']['complete'] == 22 and waterline['media']['total'] == 22 and waterline['media']['debt'] == 0
          assert waterline['jobs']['statuses'] == {'queued': 305, 'resolved': 11} and waterline['jobs']['in_flight'] == 0
          assert waterline['cycles']['unreceipted'] == []
          assert census['scope_id'] == 'doctor-who' and census['profile']['id'] == 'text-vision' and census['profile']['status'] == 'active'
          assert census['counts'] == {'compatible': 305, 'incompatible': 0}
          assert len(census['compatible']) == 305 and census.get('incompatible', []) == []
          assert len({row['task_id'] for row in census['compatible']}) == 305
          selected = census['compatible'][0]
          assert selected == {
              'task_id': os.environ['SELECTED_TASK'],
              'performer': os.environ['SELECTED_PERFORMER'],
              'character': os.environ['SELECTED_ROLE'],
              'priority': 800,
              'performance_modes': [os.environ['SELECTED_MODE']],
              'required_capabilities': [],
              'missing_capabilities': [],
              'attention': None,
              'reasons': [],
              'sources': ['https://tardis.fandom.com/wiki/Senstarg'],
              'source_fingerprint': '4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2',
          }
          paid = {
              'status': 'cycle-012-selector-paid-denominator-authenticated-v1',
              'version': 1,
              'diagnostic': {'pr': int(os.environ['DIAGNOSTIC_PR']), 'head': os.environ['DIAGNOSTIC_HEAD'], 'run': int(os.environ['DIAGNOSTIC_RUN']), 'job': int(os.environ['DIAGNOSTIC_JOB']), 'artifact': int(os.environ['DIAGNOSTIC_ARTIFACT']), 'artifact_sha256': os.environ['DIAGNOSTIC_ARTIFACT_SHA256']},
              'paid': {'terminal_proof_identity': proof['identity'], 'prior_transport_custody_identity': prior['identity'], 'selector_command_identity': command['identity'], 'complete_rendered_gate': True, 'media_22_of_22': True, 'queue': {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}, 'candidate_count': 305},
              'selected_task': selected,
              'boundary': {'adapter_only': True, 'repository_write': False, 'canonical_mutation': False, 'transport_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False},
          }
          paid['identity'] = sha(json.dumps(paid, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          write(root / 'receipt/paid-denominator.json', paid)
          write(root / 'payload/selected-task.json', selected)

          raw_refs = load_api('cycle12-refs.json')
          refs = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in raw_refs]
          by_branch = {row['branch']: row['head'] for row in refs}
          stale = json.loads(os.environ['STALE_BRANCHES_JSON'])
          expected_branches = set(stale) | {os.environ['BRANCH']}
          assert set(by_branch) == expected_branches, {'extra': sorted(set(by_branch) - expected_branches), 'missing': sorted(expected_branches - set(by_branch))}
          stale_refs = [{'branch': branch, 'head': by_branch[branch], 'kind': 'stale-cycle-012'} for branch in sorted(stale)]
          pulls = []
          for spec in json.loads(os.environ['STALE_PRS_JSON']):
              row = load_api(f"pr-{spec['pr']}.json")
              assert row['head']['ref'] == spec['branch'] and row['head']['sha'] == by_branch[spec['branch']]
              assert row['draft'] is True and row['merged_at'] is None and row['state'] in {'open', 'closed'}
              pulls.append({'pr': row['number'], 'branch': spec['branch'], 'head': row['head']['sha'], 'action': 'close_without_merge' if row['state'] == 'open' else 'none'})
          observer_refs = []
          for spec in json.loads(os.environ['OBSERVER_PRS_JSON']):
              row = load_api(f"pr-{spec['pr']}.json")
              ref = load_api(f"ref-{spec['pr']}.json")
              head = ref['object']['sha']
              assert row['head']['ref'] == spec['branch'] and row['head']['sha'] == head
              assert row['draft'] is True and row['merged_at'] is None and row['state'] in {'open', 'closed'}
              observer_refs.append({'branch': spec['branch'], 'head': head, 'kind': 'terminal-proof-observer'})
              pulls.append({'pr': row['number'], 'branch': spec['branch'], 'head': head, 'action': 'close_without_merge' if row['state'] == 'open' else 'none'})
          assert len(stale_refs) == 13 and len(observer_refs) == 2
          assert len(pulls) == 12 and len({row['pr'] for row in pulls}) == 12
          custody = {
              'status': 'cycle-012-preselection-transport-custody-frozen-v5',
              'version': 5,
              'canonical_main': os.environ['MAIN'],
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'selector': {'pr': int(os.environ['CARRIER_PR']), 'branch': os.environ['BRANCH'], 'head': os.environ['CARRIER_HEAD']},
              'paid_denominator_identity': paid['identity'],
              'refs_to_delete': stale_refs + observer_refs,
              'pull_requests': sorted(pulls, key=lambda row: row['pr']),
              'counts': {'stale_cycle12_refs': 13, 'observer_refs': 2, 'refs_to_delete': 15, 'pull_requests': 12},
              'boundary': {'selection_required_before_write': True, 'exact_heads_frozen': True, 'repository_write': False, 'force_update': False, 'merge': False, 'main_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False},
          }
          custody['identity'] = sha(json.dumps(custody, sort_keys=True, separators=(',', ':')).encode())
          write(root / 'payload/transport-custody.json', custody)
          selection = {
              'status': 'cycle-012-doctor-who-selector-qualified-v9',
              'version': 9,
              'carrier': {'pr': int(os.environ['CARRIER_PR']), 'head': os.environ['CARRIER_HEAD'], 'base': os.environ['MAIN'], 'branch': os.environ['BRANCH']},
              'canonical_main': os.environ['MAIN'],
              'cleanup_main': os.environ['CLEANUP_MAIN'],
              'paid_denominator': {'identity': paid['identity'], 'diagnostic': paid['diagnostic'], 'complete_rendered_gate': True},
              'transport_custody': {'identity': custody['identity'], 'refs_to_delete': 15, 'pull_requests': 12},
              'queue': {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0},
              'selected_task_id': selected['task_id'],
              'selected_task': selected,
              'normalized': {'performer': selected['performer'], 'role': selected['character'], 'mode': selected['performance_modes'][0], 'modes': selected['performance_modes']},
              'boundary': {'selection_only': True, 'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False, 'transport_mutation': False, 'wall_created': False, 'media_adopted': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          selection['identity'] = sha(json.dumps(selection, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode())
          write(root / 'payload/selection.json', selection)
          (root / 'payload/SELECTION_COMPLETE').write_text(selection['identity'] + '\n')
          PY

          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v9-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v9/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v9-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v9
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
