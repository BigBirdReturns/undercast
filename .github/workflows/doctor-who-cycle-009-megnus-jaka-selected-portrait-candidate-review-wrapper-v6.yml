name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v6'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v6
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6.yml
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6
      SOURCE_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v5
      SOURCE_COMMIT: 09038170c006c692e83b02a9e4be94aab080468e
      SOURCE_BLOB: ed4ee08b59a42f0d58054bdb2ec396de99c8ebec
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v5.yml
      SOURCE_SHA256: 4259b08523d82673d5c1bb14472183fdf68480481f9d300f0f6782c660d571c
      SOURCE_BYTES: "29011"
      AUTH_SHA256: 3be99af4e85050741289c5592691f00ec4be415d85bb52e55b1388d6e77f9a9b
      AUTH_BYTES: "4912"
      RECONSTRUCT_SHA256: 228f8bf1999e307a78df75c5de2d122ee24768db4719462ecef6e4a866f0609a
      RECONSTRUCT_BYTES: "7130"
      VALIDATE_SHA256: 856d50a126d035f7e00d52981f7aa7825f15961b5df14976ff8509e8d20d67d2
      VALIDATE_BYTES: "6100"
      SOURCE_SEAL_SHA256: 8c6e175218e9be89bde8f64257b73461d8b405fe4caa7369c63992c61e8095e6
      SOURCE_SEAL_BYTES: "5886"
      PATCHED_SEAL_SHA256: 8798e4cfaf6510e037182e9f1b524f9c1980c2bedb79f2bcab74f10ccbcb2cc2
      PATCHED_SEAL_BYTES: "5921"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact wrapper and recover reachable V5 review programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,receipt}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/carrier-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" > "$BOOTSTRAP/api/source-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-commit.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          source_ref=json.loads((root/'api/source-ref.json').read_text())
          source_commit=json.loads((root/'api/source-commit.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          assert source_ref['object']['sha']==os.environ['SOURCE_COMMIT']
          assert [row['sha'] for row in source_commit['parents']]==[os.environ['EXACT_MAIN']]
          PY

          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-content.json"
          test "$(jq -r .sha "$BOOTSTRAP/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r .content "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source-v5.yml"
          test "$(git hash-object "$BOOTSTRAP/source-v5.yml")" = "$SOURCE_BLOB"
          test "$(wc -c < "$BOOTSTRAP/source-v5.yml")" = "$SOURCE_BYTES"
          test "$(sha256sum "$BOOTSTRAP/source-v5.yml" | cut -d' ' -f1)" = "$SOURCE_SHA256"

          ruby -ryaml -rjson - "$BOOTSTRAP/source-v5.yml" "$BOOTSTRAP/source-env.json" "$BOOTSTRAP/authenticate.sh" "$BOOTSTRAP/reconstruct.sh" "$BOOTSTRAP/validate.sh" "$BOOTSTRAP/seal-v5.sh" <<'RB'
          source, env_out, auth_out, reconstruct_out, validate_out, seal_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.dig('jobs', 'review', 'env')
          steps = doc.dig('jobs', 'review', 'steps')
          names = {
            'Authenticate and extract exact V12 candidate artifact' => auth_out,
            'Independently reconstruct exact candidate commit and tree' => reconstruct_out,
            'Independently validate semantics and complete rendered gate' => validate_out,
            'Seal independently approved candidate packet' => seal_out,
          }
          raise 'reachable V5 environment missing' unless env.is_a?(Hash)
          names.each do |name, out|
            row = steps.find { |step| step['name'] == name }
            raise "reachable V5 step missing: #{name}" unless row && row['run'].is_a?(String)
            File.write(out, row['run'])
          end
          File.write(env_out, JSON.generate(env))
          RB

          test "$(wc -c < "$BOOTSTRAP/authenticate.sh")" = "$AUTH_BYTES"
          test "$(sha256sum "$BOOTSTRAP/authenticate.sh" | cut -d' ' -f1)" = "$AUTH_SHA256"
          test "$(wc -c < "$BOOTSTRAP/reconstruct.sh")" = "$RECONSTRUCT_BYTES"
          test "$(sha256sum "$BOOTSTRAP/reconstruct.sh" | cut -d' ' -f1)" = "$RECONSTRUCT_SHA256"
          test "$(wc -c < "$BOOTSTRAP/validate.sh")" = "$VALIDATE_BYTES"
          test "$(sha256sum "$BOOTSTRAP/validate.sh" | cut -d' ' -f1)" = "$VALIDATE_SHA256"
          test "$(wc -c < "$BOOTSTRAP/seal-v5.sh")" = "$SOURCE_SEAL_BYTES"
          test "$(sha256sum "$BOOTSTRAP/seal-v5.sh" | cut -d' ' -f1)" = "$SOURCE_SEAL_SHA256"

          SCRIPT="$BOOTSTRAP/seal-v5.sh" OUT_SCRIPT="$BOOTSTRAP/seal-v6.sh" python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          source=Path(os.environ['SCRIPT']); target=Path(os.environ['OUT_SCRIPT'])
          text=source.read_text()
          old="          (approved/'SHA256SUMS').write_text(f'{sha(approved/SHA256SUMS.pre)}  SHA256SUMS.pre\\n')"
          new="          ledger_sha=sha(approved/'SHA256SUMS.pre')\n          (approved/'SHA256SUMS').write_text(f'{ledger_sha}  SHA256SUMS.pre\\n')"
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          target.write_text(text)
          assert len(target.read_bytes())==int(os.environ['PATCHED_SEAL_BYTES'])
          assert hashlib.sha256(target.read_bytes()).hexdigest()==os.environ['PATCHED_SEAL_SHA256']
          PY

          for script in "$BOOTSTRAP"/{authenticate,reconstruct,validate,seal-v6}.sh; do bash -n "$script"; done
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          env=json.loads((root/'source-env.json').read_text())
          assert env['EXACT_MAIN']==os.environ['EXACT_MAIN']
          assert env['CANDIDATE_COMMIT']=='35f5074a6f6f5cb25cb3a3b83a2cfa1709d4cd87'
          assert env['CANDIDATE_TREE']=='e59fc815459f10b8c16cd443354a0e8481e5d0eb'
          for name in ['authenticate.sh','reconstruct.sh','validate.sh','seal-v6.sh']:
              text=(root/name).read_text()
              for index,block in enumerate(re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S),1):
                  compile(block,f'{name}:{index}','exec')
          excluded={'GH_TOKEN','EXACT_MAIN','BRANCH','SELF','REVIEW_AT','PR_HEAD','PR_NUMBER','PR_BASE_SHA'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          sha256sum "$BOOTSTRAP/source-v5.yml" "$BOOTSTRAP"/{authenticate,reconstruct,validate,seal-v5,seal-v6}.sh > "$BOOTSTRAP/receipt/source-program-sha256.txt"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nREVIEW_AT=%s\n' \
            "$PR_NUMBER" "$PR_HEAD" "$(jq -r .created_at "$BOOTSTRAP/api/carrier-pr.json")" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Execute authenticated V12 artifact recovery
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/authenticate.sh"

      - name: Execute exact candidate reconstruction
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/reconstruct.sh"

      - name: Execute independent semantics and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/validate.sh"

      - name: Execute one-line-repaired approval packet transaction
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/seal-v6.sh"

      - name: Upload independently approved candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-approved-v6-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v5/approved
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload wrapper diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v6
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v5
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
