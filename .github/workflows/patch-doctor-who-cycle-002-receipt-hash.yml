name: patch-doctor-who-cycle-002-receipt-hash

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-doctor-who-cycle-002-receipt-hash.yml"

permissions:
  contents: write

concurrency:
  group: patch-doctor-who-cycle-002-receipt-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 32

      - name: Align the generated checker with the receipt writer's stable pretty JSON
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: .github/workflows/patch-doctor-who-cycle-002-receipt-hash.yml
          WRITER: .github/workflows/complete-doctor-who-cycle-002-v2.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=32 origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = process.env.WRITER;
          let text = await readFile(path, 'utf8');
          const anchor = `          await writeFile(path, text);\n          console.log('patched date-only source custody, deferred only the premature media gate, and excluded only the shared coverage observation hash from cross-scope semantic custody');`;
          const count = text.split(anchor).length - 1;
          if (count !== 1) throw new Error(`expected one Gredd runtime-patch anchor, found ${count}`);
          const replacement = `          const finalizerPath = process.env.FINALIZER;\n          let finalizerText = await readFile(finalizerPath, 'utf8');\n          const receiptHashBefore = 'if (receipt.receipt_sha256 !== sha(JSON.stringify(stable(receiptBody)) + "\\\\n")) fail("cycle 002 receipt hash drifted");';\n          const receiptHashAfter = 'if (receipt.receipt_sha256 !== sha(JSON.stringify(stable(receiptBody), null, 2) + "\\\\n")) fail("cycle 002 receipt hash drifted");';\n          const receiptHashCount = finalizerText.split(receiptHashBefore).length - 1;\n          if (receiptHashCount !== 1) throw new Error(\`expected one compact receipt hash checker, found \${receiptHashCount}\`);\n          finalizerText = finalizerText.replace(receiptHashBefore, receiptHashAfter);\n\n          await writeFile(path, text);\n          await writeFile(finalizerPath, finalizerText);\n          console.log('patched date-only source custody, review ordering, semantic cross-scope custody, and stable pretty receipt hashing');`;
          await writeFile(path, text.replace(anchor, replacement));
          NODE

          grep -Fq 'JSON.stringify(stable(receiptBody), null, 2)' "$WRITER"
          grep -Fq 'stable pretty receipt hashing' "$WRITER"
          git rm "$SELF"
          git add "$WRITER"
          git diff --cached --check
          git commit -m 'Doctor Who: align Gredd receipt checker with writer serialization' \
            -m 'hash the same stable pretty JSON and trailing newline written into the permanent receipt'
          patched_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "patched_head=$patched_head" >> "$GITHUB_STEP_SUMMARY"
