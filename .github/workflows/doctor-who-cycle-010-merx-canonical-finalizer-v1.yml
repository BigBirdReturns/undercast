name: doctor-who-cycle-010-merx-canonical-finalizer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-canonical-finalizer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-canonical-finalizer-v1
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-canonical-finalizer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_PARENT: 1d50591ce826256e40fc574ebf9aef7993386760
      PRODUCT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_REF: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1
      PRODUCT_PR: "741"
      REVIEW_PR: "739"
      REVIEW_HEAD: 9907e49a5a4d8494497762e1d865baed31de23ca
      REVIEW_RUN: "31297747862"
      REVIEW_JOB: "93205485611"
      REVIEW_ARTIFACT: "9033532971"
      REVIEW_ZIP_SHA256: 0f1bca462e5640a73b3e19a9f30b17f531cb0cf81a93836083709bf98b6e3e8e
      REVIEW_IDENTITY: 7298d761f8abb0f5ec80e0ec1cd5649e470dbbb49954d6d178a1d03312c0354f
      PRODUCT_BUNDLE_SHA256: 0ab9ead02773cd7b2413b8f8a504e28e69a4eb90d8e694885cbd4cd0e60a8864
      PRODUCT_TAR_SHA256: 08d604ba1d503ac0be0ecd079350bd6ad3becaae2b32ff9d65cfe3d0e214c9ec
      PRODUCT_PATCH_SHA256: dc89e52ad024c9efb0cdbcc8fb426b844f2169a8069001e69b9da61c2ee59a97
      FILE_MANIFEST_SHA256: b91d4ed69851b88af1209f584cd695102ff62481a3697455657ccdaf517ed834
      PUBLISHER_PR: "740"
      PUBLISHER_HEAD: c5ee316477938268c248210a6ea95529a3fffb77
      PUBLISHER_RUN: "31297996851"
      PUBLISHER_QUALIFY_JOB: "93206104660"
      PUBLISHER_WRITE_JOB: "93206356745"
      PUBLICATION_ARTIFACT: "9033606215"
      PUBLICATION_ZIP_SHA256: edada4221dc18a7e7433b582e572e284c41afdb83be06b6c4c0e7e7b7346bd5c
      PUBLICATION_IDENTITY: 269f432b7f6a20fda484d040fbaa7129939196345480e82bd7ef568823b3d84b
      AUTHORIZATION_IDENTITY: 3fce251a37b2e80b382c691e7a3090af8b59c1919de98a1958e0ff19889b5a3f
      OUT: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1
      REVIEW: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-review
      PUBLICATION: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-publication

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind carrier and exact product topology
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$REVIEW" "$PUBLICATION"
          mkdir -p "$OUT"/{api,payload,logs} "$REVIEW" "$PUBLICATION"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          self='.github/workflows/doctor-who-cycle-010-merx-canonical-finalizer-v1.yml'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$self"
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$base"
          case "$live" in
            "$OLD_PARENT"|"$PRODUCT") ;;
            *) echo "unsupported live main: $live" >&2; exit 1 ;;
          esac
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PR" > "$OUT/api/review-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PUBLISHER_PR" > "$OUT/api/publisher-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN" > "$OUT/api/review-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN/jobs?per_page=100" > "$OUT/api/review-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT" > "$OUT/api/review-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN" > "$OUT/api/publisher-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT" > "$OUT/api/publication-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$OLD_PARENT...$PRODUCT" > "$OUT/api/product-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_REF" > "$OUT/api/product-ref.json"
          CARRIER_HEAD="$head" CARRIER_PR="$pr" CARRIER_BASE="$base" LIVE_MAIN="$live" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          read=lambda n: json.loads((root/n).read_text())
          own=read('carrier-pr.json'); product=read('product-pr.json')
          review=read('review-pr.json'); publisher=read('publisher-pr.json')
          rr=read('review-run.json'); rj=read('review-jobs.json')['jobs']; ra=read('review-artifact.json')
          prun=read('publisher-run.json'); pj=read('publisher-jobs.json')['jobs']; pa=read('publication-artifact.json')
          compare=read('product-compare.json'); pref=read('product-ref.json')
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['sha']==os.environ['CARRIER_HEAD'] and own['head']['ref']=='agent/doctor-who-cycle-010-merx-canonical-finalizer-v1'
          assert own['commits']==1 and own['changed_files']==1
          assert product['number']==int(os.environ['PRODUCT_PR']) and product['base']['ref']=='main'
          assert product['head']['ref']==os.environ['PRODUCT_REF'] and product['head']['sha']==os.environ['PRODUCT']
          assert product['commits']==1 and product['changed_files']==int(os.environ['PRODUCT_PATHS'])
          assert product['base']['sha']==os.environ['OLD_PARENT']
          assert review['number']==int(os.environ['REVIEW_PR']) and review['head']['sha']==os.environ['REVIEW_HEAD']
          assert publisher['number']==int(os.environ['PUBLISHER_PR']) and publisher['head']['sha']==os.environ['PUBLISHER_HEAD']
          assert rr['id']==int(os.environ['REVIEW_RUN']) and rr['head_sha']==os.environ['REVIEW_HEAD'] and rr['status']=='completed' and rr['conclusion']=='success'
          job=next(x for x in rj if x['id']==int(os.environ['REVIEW_JOB']))
          assert job['status']=='completed' and job['conclusion']=='success'
          assert ra['id']==int(os.environ['REVIEW_ARTIFACT']) and ra['expired'] is False and ra['digest']=='sha256:'+os.environ['REVIEW_ZIP_SHA256']
          assert ra['workflow_run']['id']==int(os.environ['REVIEW_RUN']) and ra['workflow_run']['head_sha']==os.environ['REVIEW_HEAD']
          assert prun['id']==int(os.environ['PUBLISHER_RUN']) and prun['head_sha']==os.environ['PUBLISHER_HEAD'] and prun['status']=='completed' and prun['conclusion']=='success'
          jobs={x['id']:x for x in pj}
          for jid in (int(os.environ['PUBLISHER_QUALIFY_JOB']),int(os.environ['PUBLISHER_WRITE_JOB'])):
              assert jobs[jid]['status']=='completed' and jobs[jid]['conclusion']=='success'
          assert pa['id']==int(os.environ['PUBLICATION_ARTIFACT']) and pa['expired'] is False and pa['digest']=='sha256:'+os.environ['PUBLICATION_ZIP_SHA256']
          assert pa['workflow_run']['id']==int(os.environ['PUBLISHER_RUN']) and pa['workflow_run']['head_sha']==os.environ['PUBLISHER_HEAD']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and len(compare['commits'])==1 and len(compare['files'])==int(os.environ['PRODUCT_PATHS'])
          assert compare['commits'][0]['sha']==os.environ['PRODUCT']
          assert pref['object']['sha']==os.environ['PRODUCT']
          assert os.environ['LIVE_MAIN'] in (os.environ['OLD_PARENT'],os.environ['PRODUCT'])
          PY

      - name: Authenticate retained approvals and exact product bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT/zip" > /tmp/merx-review.zip
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT/zip" > /tmp/merx-publication.zip
          test "$(sha256sum /tmp/merx-review.zip | awk '{print $1}')" = "$REVIEW_ZIP_SHA256"
          test "$(sha256sum /tmp/merx-publication.zip | awk '{print $1}')" = "$PUBLICATION_ZIP_SHA256"
          REVIEW="$REVIEW" PUBLICATION="$PUBLICATION" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          def extract(src,dst):
              with zipfile.ZipFile(src) as z:
                  infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
                  for info in infos:
                      p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
                      if info.is_dir(): continue
                      out=dst/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          review=Path(os.environ['REVIEW']); publication=Path(os.environ['PUBLICATION'])
          extract('/tmp/merx-review.zip',review); extract('/tmp/merx-publication.zip',publication)
          def verify_ledgers(root):
              ledgers=list(root.rglob('SHA256SUMS.pre')); assert ledgers
              for ledger in ledgers:
                  sealed=ledger.with_name('SHA256SUMS'); assert sealed.is_file()
                  assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
                  for raw in ledger.read_text().splitlines():
                      if not raw.strip(): continue
                      digest,name=raw.split(None,1); p=ledger.parent/name.lstrip('*')
                      assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          verify_ledgers(review); verify_ledgers(publication)
          def has_identity(root,identity):
              for p in root.rglob('*.json'):
                  try: obj=json.loads(p.read_text())
                  except Exception: continue
                  stack=[obj]
                  while stack:
                      x=stack.pop()
                      if isinstance(x,dict):
                          if x.get('identity')==identity or x.get('approval_identity')==identity or x.get('publication_identity')==identity or x.get('authorization_identity')==identity:
                              return True
                          stack.extend(x.values())
                      elif isinstance(x,list): stack.extend(x)
              return False
          assert has_identity(review,os.environ['REVIEW_IDENTITY'])
          assert has_identity(publication,os.environ['PUBLICATION_IDENTITY'])
          assert has_identity(publication,os.environ['AUTHORIZATION_IDENTITY'])
          wanted={
            os.environ['PRODUCT_BUNDLE_SHA256']:'product.bundle',
            os.environ['PRODUCT_TAR_SHA256']:'product.tar',
            os.environ['PRODUCT_PATCH_SHA256']:'product.patch',
            os.environ['FILE_MANIFEST_SHA256']:'file-manifest.json',
          }
          found={}
          for p in review.rglob('*'):
              if p.is_file():
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  if digest in wanted and digest not in found: found[digest]=p
          assert set(found)==set(wanted)
          payload=Path(os.environ['OUT'])/'payload'; payload.mkdir(parents=True,exist_ok=True)
          for digest,p in found.items(): (payload/wanted[digest]).write_bytes(p.read_bytes())
          PY
          git bundle verify "$OUT/payload/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch "$OUT/payload/product.bundle" refs/heads/cycle-010-current-main-product:refs/verify/cycle-010-current-main-product
          test "$(git rev-parse refs/verify/cycle-010-current-main-product)" = "$PRODUCT"
          test "$(git show -s --format=%P "$PRODUCT")" = "$OLD_PARENT"
          test "$(git show -s --format=%T "$PRODUCT")" = "$PRODUCT_TREE"
          git diff --name-only "$OLD_PARENT" "$PRODUCT" | sort > "$OUT/payload/changed-paths.txt"
          test "$(wc -l < "$OUT/payload/changed-paths.txt" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(grep '^\.github/' "$OUT/payload/changed-paths.txt" || true)"
          git diff --binary "$OLD_PARENT" "$PRODUCT" > /tmp/merx-finalizer.patch
          cmp /tmp/merx-finalizer.patch "$OUT/payload/product.patch"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT'])/'payload'; commit=os.environ['PRODUCT']
          manifest=json.loads((root/'file-manifest.json').read_text()); rows=manifest['files']
          assert manifest['version']==1 and len(rows)==int(os.environ['PRODUCT_PATHS'])
          expected={r['path']:r for r in rows}; assert len(expected)==len(rows)
          with tarfile.open(root/'product.tar','r:*') as t:
              members=t.getmembers(); assert len(members)==len(rows) and {m.name for m in members}==set(expected)
              for m in members:
                  p=PurePosixPath(m.name); assert not p.is_absolute() and '..' not in p.parts and m.isfile()
                  data=t.extractfile(m).read(); row=expected[m.name]
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
                  assert m.mode==int(row['mode'][-3:],8)
                  git_data=subprocess.run(['git','show',f'{commit}:{m.name}'],check=True,capture_output=True).stdout
                  blob=subprocess.run(['git','rev-parse',f'{commit}:{m.name}'],check=True,capture_output=True,text=True).stdout.strip()
                  mode=subprocess.run(['git','ls-tree',commit,'--',m.name],check=True,capture_output=True,text=True).stdout.split()[0]
                  assert git_data==data and blob==row['blob'] and mode==row['mode']
          PY

      - name: Require terminal product checks
        shell: bash
        run: |
          set -euo pipefail
          required='archive-contract,preservation-export,publisher-custody,estate-canonical-adoption-ledger,operational-reliability-evidence,operational-metrics-evidence'
          deadline=$((SECONDS+3600))
          while :; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PRODUCT&per_page=100" > "$OUT/api/product-runs.json"
            REQUIRED="$required" python3 - <<'PY' && break || rc=$?
          import json,os,sys
          runs=json.loads(open(os.environ['OUT']+'/api/product-runs.json').read())['workflow_runs']
          required=os.environ['REQUIRED'].split(',')
          by={}
          for row in runs:
              by.setdefault(row['name'],[]).append(row)
          missing=[n for n in required if n not in by]
          if missing:
              print('missing workflows:',missing); sys.exit(2)
          pending=[]; failed=[]
          for name in required:
              rows=sorted(by[name],key=lambda x:x['created_at'],reverse=True)
              row=rows[0]
              if row['status']!='completed': pending.append((name,row['status']))
              elif row['conclusion']!='success': failed.append((name,row['conclusion']))
          if failed:
              print('failed workflows:',failed); sys.exit(3)
          if pending:
              print('pending workflows:',pending); sys.exit(4)
          print('required product workflows are terminal success')
          PY
            rc=${rc:-0}
            if [ "$rc" = 3 ]; then exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'timed out waiting for product workflows' >&2; exit 1; fi
            sleep 20
          done

      - name: Seal exact fast-forward authorization
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$base"
          CARRIER_HEAD="$head" CARRIER_PR="$pr" CARRIER_BASE="$base" LIVE_MAIN="$live" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          auth={
            'status':'cycle-010-merx-exact-fast-forward-authorized-v1',
            'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'base':os.environ['CARRIER_BASE']},
            'live_main':os.environ['LIVE_MAIN'],
            'allowed_live_main':[os.environ['OLD_PARENT'],os.environ['PRODUCT']],
            'product':{'commit':os.environ['PRODUCT'],'parent':os.environ['OLD_PARENT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'ref':os.environ['PRODUCT_REF'],'pr':int(os.environ['PRODUCT_PR'])},
            'review':{'pr':int(os.environ['REVIEW_PR']),'run':int(os.environ['REVIEW_RUN']),'job':int(os.environ['REVIEW_JOB']),'artifact':int(os.environ['REVIEW_ARTIFACT']),'identity':os.environ['REVIEW_IDENTITY']},
            'publisher':{'pr':int(os.environ['PUBLISHER_PR']),'run':int(os.environ['PUBLISHER_RUN']),'publication_artifact':int(os.environ['PUBLICATION_ARTIFACT']),'publication_identity':os.environ['PUBLICATION_IDENTITY'],'authorization_identity':os.environ['AUTHORIZATION_IDENTITY']},
            'method':'ordinary-non-forced-fast-forward-or-terminal-noop',
            'boundary':{'force_update':False,'merge_commit':False,'squash':False,'rebase_rewrite':False,'additional_lease':False,'cycle_011_authorized':False,'outside_human_dependency':False,'owner_physical_action':False},
          }
          auth['identity']=hashlib.sha256(json.dumps(auth,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'payload/authorization.json').write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%f\0' | LC_ALL=C sort -z | while IFS= read -r -d '' name; do sha256sum "$OUT/payload/$name" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-canonical-finalizer-v1-payload-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-canonical-finalizer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  advance:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_PARENT: 1d50591ce826256e40fc574ebf9aef7993386760
      PRODUCT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_REF: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1
      PRODUCT_PR: "741"
      OUT: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-canonical-finalizer-v1-payload-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-payload

      - name: Reverify authorization and advance canonical main exactly
        shell: bash
        run: |
          set -euo pipefail
          payload=/tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-payload
          rm -rf "$OUT"; mkdir -p "$OUT"
          test "$(sha256sum "$payload/SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$payload/SHA256SUMS")"
          while read -r digest name; do test "$(sha256sum "$payload/${name#\*}" | awk '{print $1}')" = "$digest"; done < "$payload/SHA256SUMS.pre"
          AUTH="$payload/authorization.json" python3 - <<'PY'
          import hashlib,json,os
          p=os.environ['AUTH']; obj=json.load(open(p)); ident=obj.pop('identity')
          assert hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest()==ident
          assert obj['status']=='cycle-010-merx-exact-fast-forward-authorized-v1'
          assert obj['product']['commit']==os.environ['PRODUCT'] and obj['product']['parent']==os.environ['OLD_PARENT'] and obj['product']['tree']==os.environ['PRODUCT_TREE'] and obj['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert obj['method']=='ordinary-non-forced-fast-forward-or-terminal-noop'
          assert obj['boundary']=={'additional_lease':False,'cycle_011_authorized':False,'force_update':False,'merge_commit':False,'outside_human_dependency':False,'owner_physical_action':False,'rebase_rewrite':False,'squash':False}
          PY
          git bundle verify "$payload/product.bundle"
          git fetch "$payload/product.bundle" refs/heads/cycle-010-current-main-product:refs/write/cycle-010-current-main-product
          test "$(git rev-parse refs/write/cycle-010-current-main-product)" = "$PRODUCT"
          test "$(git show -s --format=%P "$PRODUCT")" = "$OLD_PARENT"
          test "$(git show -s --format=%T "$PRODUCT")" = "$PRODUCT_TREE"
          test "$(git diff --name-only "$OLD_PARENT" "$PRODUCT" | wc -l | tr -d ' ')" = "$PRODUCT_PATHS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_REF" --jq '.object.sha')" = "$PRODUCT"
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          case "$live" in
            "$OLD_PARENT")
              git push origin "$PRODUCT:refs/heads/main"
              method=fast-forward
              ;;
            "$PRODUCT")
              method=terminal-noop
              ;;
            *)
              echo "main moved outside authorization: $live" >&2
              exit 1
              ;;
          esac
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PRODUCT"
          for _ in $(seq 1 18); do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/product-pr.json"
            if python3 - <<'PY'; then break; fi
          import json,os,sys
          p=json.load(open(os.environ['OUT']+'/product-pr.json'))
          sys.exit(0 if p['state']=='closed' and p['merged'] is True and p['head']['sha']==os.environ['PRODUCT'] else 1)
          PY
            sleep 5
          done
          METHOD="$method" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); pr=json.loads((out/'product-pr.json').read_text())
          assert pr['state']=='closed' and pr['merged'] is True and pr['head']['sha']==os.environ['PRODUCT']
          receipt={
            'status':'cycle-010-merx-canonical-v1',
            'canonical_main':os.environ['PRODUCT'],
            'product_tree':os.environ['PRODUCT_TREE'],
            'product_paths':int(os.environ['PRODUCT_PATHS']),
            'product_pr':int(os.environ['PRODUCT_PR']),
            'method':os.environ['METHOD'],
            'force_update':False,
            'merge_commit_created':False,
            'additional_lease_issued':False,
            'cycle_011_authorized':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'canonical-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-canonical-finalizer-v1-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-write
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-canonical-finalizer-v1-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-canonical-finalizer-v1-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
