name: card-backfill-uc-046-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-046-APPLY.json"
      - "scripts/card-backfill-uc-046-apply.mjs"
      - ".github/workflows/card-backfill-uc-046-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-046-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-004'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-046-APPLY.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-046'||row.actor!=='Lon Chaney'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-046 apply authorization drift');
          if(row.gather_artifact?.artifact_id!==8633924238||row.gather_artifact?.head_sha!=='b45f11a9bd4dd85c656e67c68cb6986d0a6161e5')throw new Error('UC-046 gather custody drift');
          if(row.expected?.candidate_sha256!=='3047a7e99a5fbbb293bc67cf4731acfa56434adae90b342d9d100b0a669d8196')throw new Error('UC-046 candidate authorization drift');
          if(row.expected?.crop_preview_sha256!=='528d917f71bf9da56052b7b571e8dd0a575df6663b008b3625e42c1b7d213548')throw new Error('UC-046 crop authorization drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass'||row.ruling?.canonical_mutation!==false)throw new Error('UC-046 exact-subject ruling drift');
          console.log('PASS — exact UC-046 candidate, crop and evidence-only ruling authorized');
          NODE
      - name: Retrieve and verify the exact gather artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-046-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8633924238/zip" > "$root/gather.zip"
          echo "079b86cca204d28ac81dd5636146e014760660850e0950f237f9accb6cff18b7  $root/gather.zip" | sha256sum -c -
          unzip -q "$root/gather.zip" -d "$root/source"
          test -f "$root/source/card-backfill-uc-046/manifest.json"
          echo "3047a7e99a5fbbb293bc67cf4731acfa56434adae90b342d9d100b0a669d8196  $root/source/card-backfill-uc-046/uc-046-still-candidate.jpg" | sha256sum -c -
          echo "528d917f71bf9da56052b7b571e8dd0a575df6663b008b3625e42c1b7d213548  $root/source/card-backfill-uc-046/card-crop-preview.jpg" | sha256sum -c -
          echo "0a194e5ab535ce846781ea96116f1591b3507336ced0f9af230f5b05575fe534  $root/source/card-backfill-uc-046/source-page.png" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-046-apply/source/card-backfill-uc-046
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-046-apply"
          node scripts/card-backfill-uc-046-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-046-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-046');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-046');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_8ae9c8180626eb6cd09d8eae');
          if(!specimen||specimen.still)throw new Error('UC-046 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-046 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-046'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-046 audit disposition was canonically mutated');
          const preserved=fs.existsSync('images/uc-046-still.jpg');
          console.log(`PASS — UC-046 remains canonically absent; preserved historical byte present=${preserved}; only reviewed evidence was added`);
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-046.json \
            .github/CARD-BACKFILL-UC-046-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-046-gather.yml \
            .github/workflows/card-backfill-uc-046-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-046-gather.mjs \
            scripts/card-backfill-uc-046-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-046 Lon Chaney Phantom still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-003...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-046/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-046-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-046-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-004
      - name: Retain materialization, evidence, gate and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-046-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-046-apply
            data/review/card-backfill/UC-046
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
