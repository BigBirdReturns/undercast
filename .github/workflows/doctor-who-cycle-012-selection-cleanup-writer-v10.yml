name: doctor-who-cycle-012-selection-cleanup-writer-v10

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v10
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10' &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      INSTALL_PARENT: d33580cbc73b7bcab734ec3da84a0e977e852ad0
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      OUTSIDE_BRANCHES: "observer/cycle012-cleanup-writer-v8-source-export-v1 observer/cycle012-residual-cleanup-writer-v8-observer-v1"
      CLEANUP_PATHS: |
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      PRESERVED_PATHS: |
        data/MEDIA-SEARCH-LATEST.json
        data/journal/media-search.jsonl
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v10
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_DATE: 2026-08-11T07:00:00Z
      CLEANUP_MESSAGE: Doctor Who cycle 012 current-main transport cleanup V10
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      CARRIER_BLOB: b8e3d0b65390c620ac166433ac54539ac0ed4085
      CARRIER_GZIP_BYTES: "4074"
      CARRIER_GZIP_SHA256: 0de68be224bcc06aae678c592ae1f765964eba19987764f1d47ae92b9d39f082
      CARRIER_BYTES: "14316"
      CARRIER_SHA256: 78eed51b30347ed6a73e18d59a6c7c44e6e7f7c149578a5b8aa17bbcf23dcfbe
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v10-loader

    steps:
      - name: Reconstruct and execute exact current-main cleanup writer V10
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ["CARRIER"]).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f"<cycle-012-current-main-cleanup-writer-v10-{index}>",'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v10-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v10/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v10-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v10
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v10-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
