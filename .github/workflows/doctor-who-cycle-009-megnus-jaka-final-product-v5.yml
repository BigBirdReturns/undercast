name: doctor-who-cycle-009-megnus-jaka-final-product-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-product-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-product-v5
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: "707f2c14c4dc183afceb732c2b56124ed3a37c93"
      BRANCH: "agent/doctor-who-cycle-009-megnus-jaka-final-product-707f-v5"
      SELF: ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-product-v5.yml"
      OUT: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5"
      QUAL: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5/qualification"
      CAND: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5/candidate"
      WORKTREE: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5/worktree"
      FINAL: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5/final"
      BOOTSTRAP: "/tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5-bootstrap"
      V3_COMMIT: "181f821f2348a3cb47ca75c52cd42c9b030ef3ca"
      V3_PATH: ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-product-v3.yml"
      V3_BLOB: "a7b6b3e235e07134fc3ba263e06e840dfc539915"
      V3_RUNNER_SHA256: "878acf29393fabc86f3250649a56f2fde01a9058c7674466f656e30419a92a8c"
      V3_RUNNER_GZIP_SHA256: "d07fd349cf8e95571d516074c9c9618050e31242a5e112ca2b6bb78649a1cd19"
      PATCHED_RUNNER_BYTES: "42354"
      PATCHED_RUNNER_SHA256: "d532c974028f5098655cd7e59e1865c3d331d0b652a0fe8237fb0ac27ba71bc1"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V3 finalizer and patch the eight-path denominator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,receipt,source}

          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          git cat-file -e "$V3_COMMIT^{commit}"
          git show "$V3_COMMIT:$V3_PATH" > "$BOOTSTRAP/source/source-v3.yml"
          test "$(git hash-object "$BOOTSTRAP/source/source-v3.yml")" = "$V3_BLOB"
          git show -s --format=%B "$V3_COMMIT" > "$BOOTSTRAP/source/source-v3.commit-message"

          ruby -ryaml -rjson - "$BOOTSTRAP/source/source-v3.yml" "$BOOTSTRAP/source/source-env.json" <<'RB'
          source, env_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.dig('jobs', 'materialize', 'env')
          raise 'V3 environment missing' unless env.is_a?(Hash)
          File.write(env_out, JSON.generate(env))
          RB

          MESSAGE="$BOOTSTRAP/source/source-v3.commit-message" RUNNER_GZ="$BOOTSTRAP/source/finalizer-v3.sh.gz" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          text = Path(os.environ['MESSAGE']).read_text()
          begin = 'RUNNER_GZIP_BASE64_BEGIN'
          end = 'RUNNER_GZIP_BASE64_END'
          assert text.count(begin) == 1 and text.count(end) == 1
          payload = ''.join(text.split(begin, 1)[1].split(end, 1)[0].split())
          assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload, validate=True))
          PY
          test "$(sha256sum "$BOOTSTRAP/source/finalizer-v3.sh.gz" | awk '{print $1}')" = "$V3_RUNNER_GZIP_SHA256"
          gzip -dc "$BOOTSTRAP/source/finalizer-v3.sh.gz" > "$BOOTSTRAP/source/finalizer-v3.sh"
          test "$(sha256sum "$BOOTSTRAP/source/finalizer-v3.sh" | awk '{print $1}')" = "$V3_RUNNER_SHA256"

          SOURCE="$BOOTSTRAP/source/finalizer-v3.sh" TARGET="$BOOTSTRAP/finalizer-v5.sh" python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source = Path(os.environ['SOURCE'])
          target = Path(os.environ['TARGET'])
          text = source.read_text()
          old = 'test "$(git diff --name-only "$CANDIDATE_COMMIT" | LC_ALL=C sort)" = "$expected"'
          new = '''{
            git diff --name-only "$CANDIDATE_COMMIT"
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u > "$OUT/review/finalization-actual-paths.txt"
          printf '%s\\n' "$expected" > "$OUT/review/finalization-expected-paths.txt"
          cmp "$OUT/review/finalization-actual-paths.txt" "$OUT/review/finalization-expected-paths.txt"'''
          assert text.count(old) == 1
          patched = text.replace(old, new)
          assert text != patched and old not in patched
          target.write_text(patched)
          assert len(target.read_bytes()) == int(os.environ['PATCHED_RUNNER_BYTES'])
          assert hashlib.sha256(target.read_bytes()).hexdigest() == os.environ['PATCHED_RUNNER_SHA256']
          PY
          bash -n "$BOOTSTRAP/finalizer-v5.sh"
          chmod 0755 "$BOOTSTRAP/finalizer-v5.sh"

          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          env = json.loads((root / 'source/source-env.json').read_text())
          excluded = {
              'GH_TOKEN', 'EXACT_MAIN', 'BRANCH', 'SELF', 'OUT', 'QUAL', 'CAND',
              'WORKTREE', 'FINAL', 'PR_HEAD', 'PR_NUMBER', 'PR_BASE_SHA',
              'RUNNER_SHA256', 'RUNNER_GZIP_SHA256'
          }
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              for key in sorted(env):
                  if key in excluded:
                      continue
                  value = str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY

          sha256sum "$BOOTSTRAP/source/source-v3.yml" "$BOOTSTRAP/source/finalizer-v3.sh" "$BOOTSTRAP/finalizer-v5.sh" > "$BOOTSTRAP/receipt/source-sha256.txt"
          printf 'V5_PATCH=tracked-plus-untracked-eight-path-denominator\n' > "$BOOTSTRAP/receipt/patch.txt"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Execute exact V5 final-product transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          bash "$BOOTSTRAP/finalizer-v5.sh"

      - name: Upload exact final-product prototype
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-product-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5/final
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload final-product diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-product-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5
            /tmp/doctor-who-cycle-009-megnus-jaka-final-product-v5-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
