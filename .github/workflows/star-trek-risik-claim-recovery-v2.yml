name: star-trek-risik-claim-recovery-v2

on:
  push:
    branches:
      - agent/star-trek-risik-claim-recovery-v2

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-risik-claim-recovery-v2
  cancel-in-progress: false

jobs:
  claim:
    name: recover-one-repository-selected-risik-lease
    if: ${{ github.event.head_commit.message == 'Recover repository-selected Star Trek Risik claim v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify, repair, and execute the task-bound claim recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          source=.github/recovery/star-trek-risik-claim-recovery-v2/claim.sh
          test "$(sha256sum "$source" | awk '{print $1}')" = "5d339f99d7ad466b7db7659fef27b1842deb9d43a97ebb51e7c07029c62a414b"
          cp "$source" /tmp/star-trek-risik-claim-recovery-v2.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/star-trek-risik-claim-recovery-v2.sh')
          text = path.read_text()
          old = 'git diff --name-only "$MAIN" | LC_ALL=C sort > "$OUT/paths.txt"\n'
          new = '{ git diff --name-only "$MAIN"; git ls-files --others --exclude-standard; } | LC_ALL=C sort -u > "$OUT/paths.txt"\n'
          if text.count(old) != 1:
              raise SystemExit(f'path-audit repair anchor drifted: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          bash -n /tmp/star-trek-risik-claim-recovery-v2.sh
          bash /tmp/star-trek-risik-claim-recovery-v2.sh
