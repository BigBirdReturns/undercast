name: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-verification
      PACKET: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-registration
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-worktree
      REGISTRAR_BRANCH: agent/doctor-who-cycle-011-rastel-product-registrar-v1
      REGISTRAR_WORKFLOW: doctor-who-cycle-011-rastel-product-registrar-v1
      REGISTRATION_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-product-registrar-v1-registration-
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind guardian and exact product registration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,payload,receipt,logs} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          main='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$main"
          test "$(git rev-list --count "$main"..HEAD)" = 1
          test -z "$(git rev-list --merges "$main"..HEAD)"
          test "$(git diff --name-status "$main"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$main"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/guardian-pr.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$REGISTRAR_BRANCH" -f per_page=100 > "$OUT/api/registrar-prs.json"
          GUARDIAN_PR="$pr" GUARDIAN_HEAD="$head" CURRENT_MAIN="$main" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'guardian-pr.json').read_text())
          rows=json.loads((api/'registrar-prs.json').read_text())
          assert own['number']==int(os.environ['GUARDIAN_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['GUARDIAN_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['REGISTRAR_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_MAIN']
          (api/'registrar-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'registrar-head.txt').write_text(source['head']['sha']+'\n')
          (api/'registrar-number.txt').write_text(str(source['number'])+'\n')
          PY
          registrar_head="$(cat "$OUT/api/registrar-head.txt")"
          registrar_pr="$(cat "$OUT/api/registrar-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$REGISTRAR_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/registrar-runs.json"
            run_id="$(REGISTRAR_HEAD="$registrar_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/registrar-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['REGISTRAR_HEAD'] and row['name']==os.environ['REGISTRAR_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/registrar-run.json"
              if [ "$(jq -r '.status' "$OUT/api/registrar-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/registrar-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/registrar-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/registrar-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/registrar-artifacts.json"
          registrar_job="$(jq -r '.jobs[] | select(.name=="register" and .conclusion=="success") | .id' "$OUT/api/registrar-jobs.json")"
          test -n "$registrar_job"
          registration_artifact="$(REGISTRAR_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/registrar-artifacts.json').read_text())['artifacts']
          expected=os.environ['REGISTRATION_ARTIFACT_PREFIX']+os.environ['REGISTRAR_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$registration_artifact" > "$OUT/api/registration-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$registration_artifact/zip" > "$OUT/registration.zip"
          registration_sha="$(sha256sum "$OUT/registration.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/registration-artifact.json")" = "sha256:$registration_sha"
          printf 'GUARDIAN_PR=%s\nGUARDIAN_HEAD=%s\nCURRENT_MAIN=%s\nREGISTRAR_PR=%s\nREGISTRAR_HEAD=%s\nREGISTRAR_RUN=%s\nREGISTRAR_JOB=%s\nREGISTRATION_ARTIFACT=%s\nREGISTRATION_ZIP_SHA256=%s\n' "$pr" "$head" "$main" "$registrar_pr" "$registrar_head" "$run_id" "$registrar_job" "$registration_artifact" "$registration_sha" >> "$GITHUB_ENV"

      - name: Authenticate product PR, product ref, and registration custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'registration.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          def one_status(status):
              rows=[]
              for path in packet.rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows]); return rows[0]
          _,registration=one_status('cycle-011-rastel-product-pr-registered-v1')
          _,authorization=one_status('cycle-011-rastel-product-pr-registration-authorized-v1')
          for data in (registration,authorization):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':')).encode())==identity; data['identity']=identity
          assert registration['qualification']['authorization_identity']==authorization['identity']
          product=authorization['product']; product_pr=int(registration['product']['pr'])
          assert product['branch']==os.environ['TARGET_BRANCH'] and product['parent']==os.environ['CURRENT_MAIN']
          assert registration['product']['commit']==product['commit'] and registration['product']['parent']==product['parent']
          subprocess.run(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{product_pr}"],check=True,stdout=(root/'api/product-pr.json').open('w'))
          pr=json.loads((root/'api/product-pr.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['head']['ref']==os.environ['TARGET_BRANCH'] and pr['head']['sha']==product['commit']
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CURRENT_MAIN']
          ref=subprocess.check_output(['gh','api',f"/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/{os.environ['TARGET_BRANCH']}",'--jq','.object.sha'],text=True).strip()
          assert ref==product['commit']
          assert subprocess.check_output(['git','show','-s','--format=%P',product['commit']],text=True).strip()==os.environ['CURRENT_MAIN']
          assert subprocess.check_output(['git','show','-s','--format=%T',product['commit']],text=True).strip()==product['tree']
          assert int(subprocess.check_output(['git','rev-list','--count',os.environ['CURRENT_MAIN']+'..'+product['commit']],text=True))==1
          assert subprocess.check_output(['git','rev-list','--merges',os.environ['CURRENT_MAIN']+'..'+product['commit']],text=True).strip()==''
          paths=subprocess.check_output(['git','diff','--name-only',os.environ['CURRENT_MAIN'],product['commit']],text=True).splitlines()
          assert len(paths)==product['paths'] and not any(path.startswith('.github/workflows/') for path in paths)
          assert not any(line.startswith('D') for line in subprocess.check_output(['git','diff','--name-status',os.environ['CURRENT_MAIN'],product['commit']],text=True).splitlines())
          assert product['task']==os.environ['TASK_ID'] and product['lease']==os.environ['EXPECTED_LEASE'] and product['wall']==os.environ['WALL_ID'] and product['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          (root/'receipt/registration.json').write_text(json.dumps(registration,indent=2,sort_keys=True)+'\n')
          (root/'receipt/authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          custody={'status':'cycle-011-rastel-canonical-guardian-registration-authenticated-v1','version':1,'registrar':{'pr':int(os.environ['REGISTRAR_PR']),'head':os.environ['REGISTRAR_HEAD'],'run':int(os.environ['REGISTRAR_RUN']),'job':int(os.environ['REGISTRAR_JOB']),'artifact':int(os.environ['REGISTRATION_ARTIFACT']),'artifact_sha256':os.environ['REGISTRATION_ZIP_SHA256'],'registration_identity':registration['identity'],'authorization_identity':authorization['identity']},'product_pr':product_pr,'product':product,'ledgers':ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/registration-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          product_pr="$(jq -r '.product_pr' "$OUT/receipt/registration-custody.json")"
          product="$(jq -r '.product.commit' "$OUT/receipt/registration-custody.json")"
          tree="$(jq -r '.product.tree' "$OUT/receipt/registration-custody.json")"
          paths="$(jq -r '.product.paths' "$OUT/receipt/registration-custody.json")"
          printf 'PRODUCT_PR=%s\nPRODUCT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\n' "$product_pr" "$product" "$tree" "$paths" >> "$GITHUB_ENV"

      - name: Require exact-head product checks and complete product gate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$TARGET_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/product-runs.json"
            if PRODUCT="$PRODUCT" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/product-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['PRODUCT']]
          required={'archive-contract','publisher-custody','publisher-custody-or-guard'}
          by_name={}
          for row in rows:
              current=by_name.get(row['name'])
              if current is None or (row['run_attempt'],row['id'])>(current['run_attempt'],current['id']):by_name[row['name']]=row
          if not required.issubset(by_name):sys.exit(1)
          if any(by_name[name]['status']!='completed' or by_name[name]['conclusion']!='success' for name in required):sys.exit(1)
          (Path(os.environ['OUT'])/'receipt/product-checks.json').write_text(json.dumps({name:{'id':by_name[name]['id'],'head_sha':by_name[name]['head_sha'],'status':by_name[name]['status'],'conclusion':by_name[name]['conclusion']} for name in sorted(required)},indent=2,sort_keys=True)+'\n')
          PY
            then break; fi
            sleep 10
          done
          test -s "$OUT/receipt/product-checks.json"
          git worktree add --detach "$WORKTREE" "$PRODUCT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_MAIN"

      - name: Seal canonical settlement authorization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); custody=json.loads((root/'receipt/registration-custody.json').read_text()); checks=json.loads((root/'receipt/product-checks.json').read_text()); autopilot=json.loads((root/'receipt/autopilot-status.json').read_text()); waterline=json.loads((root/'receipt/waterline-status.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          settlement={'status':'cycle-011-rastel-canonical-fast-forward-authorized-v1','version':1,'guardian':{'pr':int(os.environ['GUARDIAN_PR']),'head':os.environ['GUARDIAN_HEAD'],'base':os.environ['CURRENT_MAIN']},'registrar_identity':custody['identity'],'product_pr':int(os.environ['PRODUCT_PR']),'product':custody['product'],'product_checks':checks,'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'gates':{'registration':True,'product_ref':True,'product_pr':True,'exact_head_checks':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True,'clean_product':True},'boundary':{'advance_main_exact_nonforced_only':True,'carrier_merge':False,'product_byte_mutation':False,'force_update':False,'cycle_012_authorized':False}}
          settlement['identity']=sha(json.dumps(settlement,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'payload/settlement.json').write_text(json.dumps(settlement,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-verification/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-verification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-verification
            /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-registration
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  fast_forward:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge-input
      OUT: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge
      SETTLEMENT_NAME: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate same-run settlement and revalidate mutation lease
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']
          rows=[row for row in rows if row['name']==os.environ['SETTLEMENT_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/settlement-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/settlement.zip"
          zip_sha="$(sha256sum "$OUT/settlement.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/settlement-artifact.json")" = "sha256:$zip_sha"
          SETTLEMENT_ARTIFACT="$artifact" SETTLEMENT_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'settlement.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          settlement=json.loads((packet/'settlement.json').read_text()); identity=settlement.pop('identity'); assert sha(json.dumps(settlement,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; settlement['identity']=identity
          assert settlement['status']=='cycle-011-rastel-canonical-fast-forward-authorized-v1' and all(settlement['gates'].values())
          assert settlement['boundary']=={'advance_main_exact_nonforced_only':True,'carrier_merge':False,'product_byte_mutation':False,'force_update':False,'cycle_012_authorized':False}
          (out/'receipt/settlement.json').write_text(json.dumps(settlement,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          parent="$(jq -r '.product.parent' "$OUT/receipt/settlement.json")"
          product="$(jq -r '.product.commit' "$OUT/receipt/settlement.json")"
          tree="$(jq -r '.product.tree' "$OUT/receipt/settlement.json")"
          paths="$(jq -r '.product.paths' "$OUT/receipt/settlement.json")"
          product_pr="$(jq -r '.product_pr' "$OUT/receipt/settlement.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$parent"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$product"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$product_pr" > "$OUT/api/product-pr-before.json"
          test "$(jq -r '.state' "$OUT/api/product-pr-before.json")" = open
          test "$(jq -r '.merged' "$OUT/api/product-pr-before.json")" = false
          test "$(jq -r '.head.sha' "$OUT/api/product-pr-before.json")" = "$product"
          test "$(jq -r '.base.sha' "$OUT/api/product-pr-before.json")" = "$parent"
          test "$(git show -s --format=%P "$product")" = "$parent"
          test "$(git show -s --format=%T "$product")" = "$tree"
          test "$(git rev-list --count "$parent".."$product")" = 1
          test -z "$(git rev-list --merges "$parent".."$product")"
          test "$(git diff --name-only "$parent" "$product" | wc -l | tr -d ' ')" = "$paths"
          printf 'SETTLEMENT_ARTIFACT=%s\nSETTLEMENT_ZIP_SHA256=%s\nPARENT=%s\nPRODUCT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\nPRODUCT_PR=%s\n' "$artifact" "$zip_sha" "$parent" "$product" "$tree" "$paths" "$product_pr" >> "$GITHUB_ENV"

      - name: Advance main once by exact non-forced fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PARENT"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/heads/main" -f sha="$PRODUCT" -F force=false > "$OUT/api/main-update.json"
          test "$(jq -r '.object.sha' "$OUT/api/main-update.json")" = "$PRODUCT"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PRODUCT"
          for attempt in $(seq 1 30); do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr-after.json"
            if [ "$(jq -r '.merged' "$OUT/api/product-pr-after.json")" = true ]; then break; fi
            sleep 2
          done
          test "$(jq -r '.state' "$OUT/api/product-pr-after.json")" = closed
          test "$(jq -r '.merged' "$OUT/api/product-pr-after.json")" = true
          test "$(jq -r '.merge_commit_sha' "$OUT/api/product-pr-after.json")" = "$PRODUCT"

      - name: Seal canonical fast-forward receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); settlement=json.loads((root/'receipt/settlement.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt={'status':'cycle-011-rastel-canonical-fast-forward-complete-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'settlement':{'artifact':int(os.environ['SETTLEMENT_ARTIFACT']),'artifact_sha256':os.environ['SETTLEMENT_ZIP_SHA256'],'identity':settlement['identity']},'product':{'pr':int(os.environ['PRODUCT_PR']),'branch':os.environ['TARGET_BRANCH'],'parent':os.environ['PARENT'],'commit':os.environ['PRODUCT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS'])},'boundary':{'nonforced_fast_forward':True,'merge_commit_created':False,'squash':False,'rebase':False,'force_update':False,'cycle_012_authorized':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/merge.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge-input
            /tmp/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
