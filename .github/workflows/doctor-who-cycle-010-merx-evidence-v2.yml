name: doctor-who-cycle-010-merx-evidence-v2
"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-010-merx-evidence-v2.yml"]
permissions: {}
concurrency:
  group: doctor-who-cycle-010-merx-evidence-v2
  cancel-in-progress: true
jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {contents: read, actions: read, pull-requests: read}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-merx-evidence-v2
      SELF: .github/workflows/doctor-who-cycle-010-merx-evidence-v2.yml
      OUT: /tmp/doctor-who-cycle-010-merx-evidence-v2
      BOOTSTRAP: /tmp/doctor-who-cycle-010-merx-evidence-v2-bootstrap
      MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      V1_COMMIT: 82b7633a1f878d41441fe4579d2ccbe34a68c503
      V1_PATH: .github/workflows/doctor-who-cycle-010-merx-evidence-v1.yml
      V1_BLOB: f30f11bdadeb5799b2d86fd6523c6412d951922f
      V1_SHA256: 12615e42e3575f998f1149346af2eead1c0f9a1119dd52313864f54d210060c8
      V1_RUN: "31287889777"
      V1_JOB: "93179915952"
      V1_DIAGNOSTICS: "9030453577"
      V1_DIAGNOSTICS_SHA256: cc7bd0fac0deef49c574b5ebe89788aecc3681d19e5161b04a70fe8755151947
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, filter: blob:none, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - name: Recover immutable V1 programs and apply three bounded repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$OUT"
          mkdir -p "$BOOTSTRAP"/{source,scripts,receipt,api}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" > "$BOOTSTRAP/api/v1-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN/jobs?per_page=100" > "$BOOTSTRAP/api/v1-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN/artifacts?per_page=100" > "$BOOTSTRAP/api/v1-artifacts.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ['ROOT'])
          run=json.loads((r/'api/v1-run.json').read_text())
          jobs=json.loads((r/'api/v1-jobs.json').read_text())['jobs']
          arts=json.loads((r/'api/v1-artifacts.json').read_text())['artifacts']
          assert run['id']==int(os.environ['V1_RUN']) and run['head_sha']==os.environ['V1_COMMIT'] and run['status']=='completed' and run['conclusion']=='failure'
          job=next(x for x in jobs if x['id']==int(os.environ['V1_JOB']))
          assert job['name']=='recover' and job['conclusion']=='failure'
          steps={x['name']:(x['status'],x['conclusion']) for x in job['steps']}
          assert steps['Bind exact carrier and sealed cycle-010 preflight']==('completed','success')
          assert steps['Reconfirm current-main custody and repository gates']==('completed','success')
          assert steps['Recover exact Merx revision and page-image census']==('completed','success')
          assert steps['Recover official production page and cover candidate']==('completed','failure')
          assert steps['Inventory existing Dan Starkey portrait custody and seal evidence']==('completed','skipped')
          art=next(x for x in arts if x['id']==int(os.environ['V1_DIAGNOSTICS']))
          assert art['digest']=='sha256:'+os.environ['V1_DIAGNOSTICS_SHA256'] and art['expired'] is False
          PY

          git cat-file -e "$V1_COMMIT^{commit}"
          git show "$V1_COMMIT:$V1_PATH" > "$BOOTSTRAP/source/v1.yml"
          test "$(git hash-object "$BOOTSTRAP/source/v1.yml")" = "$V1_BLOB"
          test "$(sha256sum "$BOOTSTRAP/source/v1.yml" | cut -d' ' -f1)" = "$V1_SHA256"

          SOURCE="$BOOTSTRAP/source/v1.yml" DEST="$BOOTSTRAP" python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=Path(os.environ['SOURCE']); dest=Path(os.environ['DEST'])
          ruby=r'''require 'yaml'; require 'json'
          source, out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          job = doc.fetch('jobs').fetch('recover')
          File.write(File.join(out,'source','v1-env.json'), JSON.generate(job.fetch('env')))
          wanted = {
            'Bind exact carrier and sealed cycle-010 preflight'=>'bind.sh',
            'Reconfirm current-main custody and repository gates'=>'gates.sh',
            'Recover exact Merx revision and page-image census'=>'source.sh',
            'Recover official production page and cover candidate'=>'official.sh',
            'Inventory existing Dan Starkey portrait custody and seal evidence'=>'inventory.sh'
          }
          found = {}
          job.fetch('steps').each do |step|
            name=step['name']; next unless wanted.key?(name)
            raise "duplicate #{name}" if found[name]
            File.write(File.join(out,'scripts',wanted[name]), step.fetch('run'))
            found[name]=true
          end
          raise "missing steps" unless found.keys.sort == wanted.keys.sort
          '''
          subprocess.run(['ruby','-e',ruby,str(source),str(dest)],check=True)
          scripts=dest/'scripts'
          def replace_once(path, old, new, label):
              text=path.read_text()
              assert text.count(old)==1, (label,text.count(old))
              path.write_text(text.replace(old,new))
          bind=scripts/'bind.sh'
          replace_once(bind,"head='${{ github.event.pull_request.head.sha }}'; pr='${{ github.event.pull_request.number }}'",'head="$PR_HEAD"; pr="$PR_NUMBER"','carrier event head and PR')
          replace_once(bind,"test '${{ github.event.pull_request.base.sha }}' = \"$MAIN\"",'test "$PR_BASE_SHA" = "$MAIN"','carrier event base')
          src=scripts/'source.sh'
          replace_once(src,r"const imageMatch=content.match(/^\|\s*image\s*=\s*(.*)$/im);",r"const imageMatch=content.match(/^\|[ \t]*image[ \t]*=[ \t]*(.*)$/im);",'blank image parser')
          old="character_image_disposition:(!mpage.original&&!mpage.thumbnail&&fileRefs.length===0&&!(imageMatch&&imageMatch[1].trim()))?'source-page-image-absent':'candidate-requires-review'"
          new="character_image_disposition:(!mpage.original&&!mpage.thumbnail&&fileRefs.length===0&&!(imageMatch&&imageMatch[1].trim())&&(mpage.images||[]).every(x=>x.title==='File:CharStub.png'))?'source-page-image-absent-template-stub-refused':'candidate-requires-review'"
          replace_once(src,old,new,'template stub disposition')
          official=scripts/'official.sh'
          curl='curl -L --compressed --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 -A "$ua" -D "$OUT/media/cover.headers" -o "$OUT/media/cover.bin" "$COVER_URL"'
          assignment='COVER_URL=$(jq -r .cover_url "$OUT/official/official-summary.json")\ntest -n "$COVER_URL" && test "$COVER_URL" != null\n'+curl
          replace_once(official,curl,assignment,'same-step cover URL')
          for p in scripts.glob('*.sh'):
              subprocess.run(['bash','-n',str(p)],check=True)
          env=json.loads((dest/'source/v1-env.json').read_text())
          excluded={'GH_TOKEN','BRANCH','SELF','OUT'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          hashes={p.name:{'bytes':len(p.read_bytes()),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(scripts.glob('*.sh'))}
          receipt={'version':1,'status':'v1-programs-recovered-and-bounded-repairs-applied','source':{'commit':os.environ['V1_COMMIT'],'path':os.environ['V1_PATH'],'git_blob':os.environ['V1_BLOB'],'sha256':os.environ['V1_SHA256'],'failed_run':int(os.environ['V1_RUN']),'failed_job':int(os.environ['V1_JOB']),'diagnostics_artifact':int(os.environ['V1_DIAGNOSTICS']),'diagnostics_sha256':os.environ['V1_DIAGNOSTICS_SHA256']},'repairs':['runtime-carrier-event-bindings','horizontal-whitespace-only-blank-image-parser-and-template-stub-refusal','same-shell-step-cover-url-assignment'],'programs':hashes}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (dest/'receipt/recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod 0755 "$BOOTSTRAP/scripts"/*.sh
      - name: Execute recovered V1 preflight binding
        shell: bash
        run: bash "$BOOTSTRAP/scripts/bind.sh"
      - name: Record immutable recovery and repair custody
        shell: bash
        run: |
          set -euo pipefail
          cp "$BOOTSTRAP/receipt/recovery.json" "$OUT/evidence/recovery-wrapper.json"
          cp "$BOOTSTRAP/source/v1-env.json" "$OUT/evidence/recovered-v1-env.json"
      - name: Execute recovered current-main gate
        shell: bash
        run: bash "$BOOTSTRAP/scripts/gates.sh"
      - name: Execute repaired exact Merx source census
        shell: bash
        run: bash "$BOOTSTRAP/scripts/source.sh"
      - name: Execute repaired official-page and cover recovery
        shell: bash
        run: bash "$BOOTSTRAP/scripts/official.sh"
      - name: Execute canonical Dan Starkey portrait inventory and evidence seal
        shell: bash
        run: bash "$BOOTSTRAP/scripts/inventory.sh"
      - name: Verify exact artifact denominator
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          r=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          ledger=r/'SHA256SUMS.pre'; seal=r/'SHA256SUMS'
          assert ledger.is_file() and seal.is_file() and sha(ledger.read_bytes())==seal.read_text().split()[0]
          listed=[]
          for raw in ledger.read_text().splitlines():
              d,n=raw.split(None,1); n=n.lstrip('*'); p=r/n
              assert p.is_file() and sha(p.read_bytes())==d; listed.append(n)
          actual=sorted(str(p.relative_to(r)) for d in ['evidence','source','official','media','logs'] for p in (r/d).rglob('*') if p.is_file())
          assert sorted(listed)==actual and len(listed)==len(set(listed))
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-evidence-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-evidence-v2/SHA256SUMS
            /tmp/doctor-who-cycle-010-merx-evidence-v2/SHA256SUMS.pre
            /tmp/doctor-who-cycle-010-merx-evidence-v2/evidence
            /tmp/doctor-who-cycle-010-merx-evidence-v2/source
            /tmp/doctor-who-cycle-010-merx-evidence-v2/official
            /tmp/doctor-who-cycle-010-merx-evidence-v2/media
            /tmp/doctor-who-cycle-010-merx-evidence-v2/logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-evidence-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-evidence-v2
            /tmp/doctor-who-cycle-010-merx-evidence-v2-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
