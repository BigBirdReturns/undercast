name: card-backfill-uc-071-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-071.json"
      - "scripts/card-backfill-uc-071-discover.mjs"
      - ".github/workflows/card-backfill-uc-071-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-071-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-014'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-071 composite and checkpoint boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-071.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-071'||row.actor!=='Warwick Davis'||row.side!=='still')throw new Error('UC-071 discovery boundary drift');
          if(row.selector_artifact?.artifact_id!==8640283768||row.inspection_artifact?.artifact_id!==8640325983)throw new Error('UC-071 checkpoint custody drift');
          if(row.roles?.map(x=>x.key).join(',')!=='wicket,flitwick,griphook')throw new Error('UC-071 role denominator drift');
          console.log('PASS — exact three-role Warwick Davis composite discovery authorized');
          NODE
      - name: Gather exact official role candidates and build review sheets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-071
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-071-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-071.log"
          test -z "$(git status --porcelain)"
      - name: Upload official role candidates and online checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-071-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-071
            ${{ runner.temp }}/card-backfill-uc-071.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
