name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      INSTALLED_MAIN: f5a110909ed42a52917bd25e511610f73f5610f2
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      INSTALL_PR: "849"
      INSTALL_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-writer-resume-install-v1
      BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1.yml
      PREFIX: agent/doctor-who-cycle-011-rastel-
      ORIGINAL_AUTH_RUN: "31357281200"
      ORIGINAL_AUTH_JOB: "93359227236"
      ORIGINAL_AUTH_ARTIFACT: "9051083591"
      ORIGINAL_AUTH_DIGEST: "sha256:f93b35b7dcfd43e63b87f9f88d631145ddf0672a13b5be032a4cb5c2620ddd2d"
      ORIGINAL_AUTH_IDENTITY: 81cb9518ac62350471e852b2c1f708cda9a8992485e5e992df96200c5ceda30f
      TERMINAL_PROOF_IDENTITY: de673e54e1f06fef78e1af97906cf57a23492e02130f0bd70fc79ffea2bc5c59
      FAILED_WRITER_RUN: "31357317890"
      FAILED_WRITER_JOB: "93359335747"
      FAILED_WRITER_ARTIFACT: "9051111333"
      FAILED_WRITER_DIGEST: "sha256:db40487835e4a8356b2f16902cb2a01d304cda7bf6880c16d3f739c3f565729c"
      OBSERVER_PR: "847"
      OBSERVER_BRANCH: agent/doctor-who-cycle-011-cleanup-resume-observer-v1
      OBSERVER_HEAD: 12039a5be5823c46731089cc89c9c45666d614b4
      OBSERVER_RUN: "31357656114"
      OBSERVER_JOB: "93360268234"
      OBSERVER_ARTIFACT: "9051206420"
      OBSERVER_DIGEST: "sha256:d510c4f58747aa8e081720039e70288207cc4d7a871c4f58043035b86b80675c"
      OBSERVATION_IDENTITY: 06532bc284c115fce84649f964e21183848a3853435f59202c14edf604b51ef9
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact resume carrier and installed writer geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,zips,source,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          git diff --name-status "$CANONICAL_MAIN" "$INSTALLED_MAIN" | LC_ALL=C sort > "$OUT/logs/installed.tsv"
          printf 'A\t%s\nA\t%s\n' "$WRITER_V1" "$WRITER_V2" | LC_ALL=C sort > "$OUT/logs/expected.tsv"
          cmp "$OUT/logs/installed.tsv" "$OUT/logs/expected.tsv"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$INSTALL_PR" > "$OUT/api/install-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$OBSERVER_PR" > "$OUT/api/observer-pr.json"
          CURRENT_HEAD="$head" CURRENT_BASE="$base" CURRENT_PR="$pr" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          own = load('own-pr.json')
          install = load('install-pr.json')
          observer = load('observer-pr.json')
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha'] == os.environ['CURRENT_BASE']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1
          assert install['number'] == int(os.environ['INSTALL_PR'])
          assert install['state'] == 'closed' and install['merged'] is True
          assert install['head']['ref'] == os.environ['INSTALL_BRANCH'] and install['head']['sha'] == os.environ['INSTALLED_MAIN']
          assert observer['number'] == int(os.environ['OBSERVER_PR'])
          assert observer['state'] == 'open' and observer['draft'] is True and observer['merged'] is False
          assert observer['head']['ref'] == os.environ['OBSERVER_BRANCH'] and observer['head']['sha'] == os.environ['OBSERVER_HEAD']
          PY
          printf 'RESUME_PR=%s\nRESUME_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Authenticate immutable source runs, jobs, and artifacts
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "original:$ORIGINAL_AUTH_RUN:$ORIGINAL_AUTH_JOB:$ORIGINAL_AUTH_ARTIFACT:$ORIGINAL_AUTH_DIGEST" \
            "failed:$FAILED_WRITER_RUN:$FAILED_WRITER_JOB:$FAILED_WRITER_ARTIFACT:$FAILED_WRITER_DIGEST" \
            "observer:$OBSERVER_RUN:$OBSERVER_JOB:$OBSERVER_ARTIFACT:$OBSERVER_DIGEST"; do
            IFS=: read -r name run job artifact digest <<< "$spec"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run" > "$OUT/api/$name-run.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job" > "$OUT/api/$name-job.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/$name-artifact.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/zips/$name.zip"
            test "$(sha256sum "$OUT/zips/$name.zip" | awk '{print $1}')" = "${digest#sha256:}"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          original_run, original_job, original_artifact = load('original-run.json'), load('original-job.json'), load('original-artifact.json')
          failed_run, failed_job, failed_artifact = load('failed-run.json'), load('failed-job.json'), load('failed-artifact.json')
          observer_run, observer_job, observer_artifact = load('observer-run.json'), load('observer-job.json'), load('observer-artifact.json')
          assert original_run['id'] == int(os.environ['ORIGINAL_AUTH_RUN']) and original_run['status'] == 'completed' and original_run['conclusion'] == 'success'
          assert original_job['id'] == int(os.environ['ORIGINAL_AUTH_JOB']) and original_job['run_id'] == int(os.environ['ORIGINAL_AUTH_RUN']) and original_job['name'] == 'verify' and original_job['conclusion'] == 'success'
          assert original_artifact['id'] == int(os.environ['ORIGINAL_AUTH_ARTIFACT']) and original_artifact['digest'] == os.environ['ORIGINAL_AUTH_DIGEST'] and original_artifact['expired'] is False
          assert failed_run['id'] == int(os.environ['FAILED_WRITER_RUN']) and failed_run['status'] == 'completed' and failed_run['conclusion'] == 'failure'
          assert failed_job['id'] == int(os.environ['FAILED_WRITER_JOB']) and failed_job['run_id'] == int(os.environ['FAILED_WRITER_RUN']) and failed_job['name'] == 'write' and failed_job['conclusion'] == 'failure'
          assert failed_artifact['id'] == int(os.environ['FAILED_WRITER_ARTIFACT']) and failed_artifact['digest'] == os.environ['FAILED_WRITER_DIGEST'] and failed_artifact['expired'] is False
          assert observer_run['id'] == int(os.environ['OBSERVER_RUN']) and observer_run['status'] == 'completed' and observer_run['conclusion'] == 'success'
          assert observer_job['id'] == int(os.environ['OBSERVER_JOB']) and observer_job['run_id'] == int(os.environ['OBSERVER_RUN']) and observer_job['name'] == 'observe' and observer_job['conclusion'] == 'success'
          assert observer_artifact['id'] == int(os.environ['OBSERVER_ARTIFACT']) and observer_artifact['digest'] == os.environ['OBSERVER_DIGEST'] and observer_artifact['expired'] is False
          PY

      - name: Reconcile the exact partial cleanup and freeze the live remainder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          def extract(name):
              target = root / 'source' / name
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(root / 'zips' / f'{name}.zip') as archive:
                  infos = archive.infolist()
                  assert infos and len(infos) == len({row.filename for row in infos})
                  for info in infos:
                      path = PurePosixPath(info.filename)
                      assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                      mode = (info.external_attr >> 16) & 0xffff
                      assert not stat.S_ISLNK(mode)
                      if info.is_dir():
                          continue
                      out = target / path
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_bytes(archive.read(info))
              return target
          def verify_ledger(target):
              pre, sealed = target / 'SHA256SUMS.pre', target / 'SHA256SUMS'
              assert pre.is_file() and sealed.is_file()
              assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
              for raw in pre.read_text().splitlines():
                  if not raw.strip():
                      continue
                  digest, name = raw.split(None, 1)
                  path = target / name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes()) == digest
          original = extract('original')
          failed = extract('failed')
          observer = extract('observer')
          verify_ledger(original)
          verify_ledger(failed / 'authorization')
          verify_ledger(observer)
          auth = json.loads((original / 'authorization.json').read_text())
          aid = auth.pop('identity')
          assert aid == os.environ['ORIGINAL_AUTH_IDENTITY']
          assert sha(json.dumps(auth, sort_keys=True, separators=(',', ':')).encode()) == aid
          auth['identity'] = aid
          embedded = json.loads((failed / 'authorization' / 'authorization.json').read_text())
          eid = embedded.pop('identity')
          assert eid == aid and sha(json.dumps(embedded, sort_keys=True, separators=(',', ':')).encode()) == eid
          embedded['identity'] = eid
          assert embedded == auth
          assert sha((failed / 'authorization.zip').read_bytes()) == os.environ['ORIGINAL_AUTH_DIGEST'].removeprefix('sha256:')
          observation = json.loads((observer / 'receipt' / 'observation.json').read_text())
          oid = observation.pop('identity')
          assert oid == os.environ['OBSERVATION_IDENTITY']
          assert sha(json.dumps(observation, sort_keys=True, separators=(',', ':')).encode()) == oid
          observation['identity'] = oid
          assert auth['status'] == 'cycle-011-rastel-exact-prefix-cleanup-authorized-v3'
          assert auth['identity'] == os.environ['ORIGINAL_AUTH_IDENTITY']
          assert auth['terminal_proof_identity'] == os.environ['TERMINAL_PROOF_IDENTITY']
          assert auth['canonical_main'] == os.environ['CANONICAL_MAIN'] and auth['installation']['main'] == observation['main']['installed']
          assert auth['counts']['refs'] == 99 and len(auth['refs']) == 99
          logged = []
          for raw in (failed / 'logs' / 'ref-actions.tsv').read_text().splitlines():
              if raw.strip():
                  branch, head = raw.split('\t')
                  logged.append((branch, head))
          original_refs = [(row['branch'], row['head']) for row in auth['refs']]
          observed_refs = [(row['ref'].removeprefix('refs/heads/'), row['sha']) for row in observation['prefix_refs']]
          assert len(logged) == 10 and logged == original_refs[:10]
          assert original_refs[10] == ('agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v5', '7c2a6377798557b75cd9e468657a8d244f5b77ed')
          assert len(observed_refs) == 88 and observed_refs == original_refs[11:]
          assert observation['main'] == {'canonical': os.environ['CANONICAL_MAIN'], 'installed': 'ee4bfa70f66d1d4ea5b53765497a185b5c072108', 'live': 'ee4bfa70f66d1d4ea5b53765497a185b5c072108', 'tree': os.environ['CANONICAL_TREE']}
          assert observation['boundary'] == {'canonical_mutation': False, 'cycle_012_lease_issued': False, 'cycle_012_product_authority': False, 'outside_human_dependency': False, 'owner_physical_action_required': False, 'repository_write': False}
          (root / 'receipt' / 'source-reconciliation.json').write_text(json.dumps({'authorization': auth, 'observation': observation, 'logged_deleted_refs': [{'branch': b, 'head': h} for b, h in logged], 'eventually_absent_ref': {'branch': original_refs[10][0], 'head': original_refs[10][1]}}, indent=2, sort_keys=True) + '\n')
          PY
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/live-prefix-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$OBSERVER_BRANCH" > "$OUT/api/observer-ref.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          source = json.loads((root / 'receipt/source-reconciliation.json').read_text())
          observation = source['observation']
          live_rows = json.loads((root / 'api/live-prefix-refs.json').read_text())
          live = [(row['ref'].removeprefix('refs/heads/'), row['object']['sha']) for row in live_rows]
          observed = [(row['ref'].removeprefix('refs/heads/'), row['sha']) for row in observation['prefix_refs']]
          observed_set = set(observed)
          live_set = set(live)
          assert observed_set <= live_set
          extras = live_set - observed_set
          expected_extras = {(os.environ['INSTALL_BRANCH'], os.environ['INSTALLED_MAIN']), (os.environ['BRANCH'], os.environ['RESUME_HEAD'])}
          assert extras == expected_extras, {'extras': sorted(extras), 'expected': sorted(expected_extras)}
          assert len(live) == 90 and len(live_set) == 90
          observer_ref = json.loads((root / 'api/observer-ref.json').read_text())
          assert observer_ref['ref'] == 'refs/heads/' + os.environ['OBSERVER_BRANCH'] and observer_ref['object']['sha'] == os.environ['OBSERVER_HEAD']
          close_actions = []
          for number, branch, head in [
              (int(os.environ['RESUME_PR']), os.environ['BRANCH'], os.environ['RESUME_HEAD']),
              (int(os.environ['OBSERVER_PR']), os.environ['OBSERVER_BRANCH'], os.environ['OBSERVER_HEAD']),
          ]:
              close_actions.append({'pr': number, 'branch': branch, 'head': head, 'action': 'close_without_merge'})
          authorization = {
              'status': 'cycle-011-rastel-cleanup-resume-authorized-v1',
              'version': 1,
              'source': {'pr': int(os.environ['RESUME_PR']), 'head': os.environ['RESUME_HEAD'], 'run': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': 0},
              'canonical': {'proved_commit': os.environ['CANONICAL_MAIN'], 'tree': os.environ['CANONICAL_TREE'], 'installed_main': os.environ['INSTALLED_MAIN'], 'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V2']]},
              'prior': {
                  'terminal_proof_identity': os.environ['TERMINAL_PROOF_IDENTITY'],
                  'authorization_identity': os.environ['ORIGINAL_AUTH_IDENTITY'],
                  'observation_identity': os.environ['OBSERVATION_IDENTITY'],
                  'failed_writer': {'run': int(os.environ['FAILED_WRITER_RUN']), 'job': int(os.environ['FAILED_WRITER_JOB']), 'artifact': int(os.environ['FAILED_WRITER_ARTIFACT']), 'deleted_refs': 11, 'remaining_refs_observed': 88},
              },
              'prefix': os.environ['PREFIX'],
              'refs': [{'branch': branch, 'head': head} for branch, head in live],
              'pull_requests': close_actions,
              'auxiliary_refs': [{'branch': os.environ['OBSERVER_BRANCH'], 'head': os.environ['OBSERVER_HEAD']}],
              'counts': {'original_frozen_refs': 99, 'previously_deleted_refs': 11, 'observed_remaining_refs': 88, 'new_transport_refs': 2, 'current_prefix_refs': len(live), 'pull_requests_to_close': len(close_actions), 'auxiliary_refs': 1},
              'boundary': {'cycle_012_lease_issued': False, 'cycle_012_product_authority': False, 'exact_heads_frozen': True, 'force_update': False, 'main_mutation': False, 'merge': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          authorization['identity'] = hashlib.sha256(json.dumps(authorization, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'authorization.json').write_text(json.dumps(authorization, indent=2, sort_keys=True) + '\n')
          PY
          current_job="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name=="verify") | .id')"
          test -n "$current_job"
          CURRENT_JOB="$current_job" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          path = Path(os.environ['OUT']) / 'authorization.json'
          data = json.loads(path.read_text())
          data.pop('identity')
          data['source']['job'] = int(os.environ['CURRENT_JOB'])
          data['identity'] = hashlib.sha256(json.dumps(data, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          packet="$OUT/packet"
          rm -rf "$packet"
          mkdir -p "$packet"
          cp "$OUT/authorization.json" "$packet/authorization.json"
          find "$packet" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$packet/$rel" | sed "s#  $packet/#  #"; done > "$packet/SHA256SUMS.pre"
          sha256sum "$packet/SHA256SUMS.pre" | sed "s#  $packet/#  #" > "$packet/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1/packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
