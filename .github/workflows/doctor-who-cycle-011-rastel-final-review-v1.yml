name: doctor-who-cycle-011-rastel-final-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      SOURCE_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-final-review-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-review-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-final-review-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-final-review-v1-source
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-review-v1-worktree
      PRODUCER_BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v3
      PRODUCER_WORKFLOW: doctor-who-cycle-011-rastel-final-product-v3
      PRODUCER_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-final-product-v3-
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind review carrier and wait for exact V3 terminal run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,logs,receipt,objects,handoff,failure-artifacts} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$base")" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$SOURCE_MAIN" "$base"
          test -z "$(git diff --name-only "$SOURCE_MAIN...$base")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/reviewer-pr.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$PRODUCER_BRANCH" -f per_page=100 > "$OUT/api/producer-prs.json"
          REVIEWER_PR="$pr" REVIEWER_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'reviewer-pr.json').read_text())
          rows=json.loads((api/'producer-prs.json').read_text())
          assert own['number']==int(os.environ['REVIEWER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['REVIEWER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['PRODUCER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          producer=rows[0]
          assert producer['state']=='open' and producer['draft'] is True and producer['base']['ref']=='main'
          producer_base=producer['base']['sha']
          subprocess.run(['git','merge-base','--is-ancestor',os.environ['SOURCE_MAIN'],producer_base],check=True)
          assert subprocess.check_output(['git','diff','--name-only',os.environ['SOURCE_MAIN']+'...'+producer_base],text=True).strip()==''
          assert subprocess.check_output(['git','show','-s','--format=%T',producer_base],text=True).strip()==os.environ['SOURCE_TREE']
          (api/'producer-pr.json').write_text(json.dumps(producer,indent=2,sort_keys=True)+'\n')
          (api/'producer-head.txt').write_text(producer['head']['sha']+'\n')
          (api/'producer-number.txt').write_text(str(producer['number'])+'\n')
          PY
          producer_head="$(cat "$OUT/api/producer-head.txt")"
          producer_pr="$(cat "$OUT/api/producer-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$PRODUCER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/producer-runs.json"
            run_id="$(PRODUCER_HEAD="$producer_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/producer-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['PRODUCER_HEAD'] and row['name']==os.environ['PRODUCER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/producer-run.json"
              if [ "$(jq -r '.status' "$OUT/api/producer-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/producer-run.json")" = completed
          conclusion="$(jq -r '.conclusion' "$OUT/api/producer-run.json")"
          attempt="$(jq -r '.run_attempt' "$OUT/api/producer-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/producer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/producer-artifacts.json"
          jq -r '.jobs[] | [.id,.name,.status,.conclusion] | @tsv' "$OUT/api/producer-jobs.json" > "$OUT/logs/producer-jobs.tsv"
          while IFS=$'\t' read -r job_id job_name job_status job_conclusion; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$OUT/logs/job-$job_id.log" || true
          done < "$OUT/logs/producer-jobs.tsv"
          printf 'REVIEWER_PR=%s\nREVIEWER_HEAD=%s\nCURRENT_BASE=%s\nPRODUCER_PR=%s\nPRODUCER_HEAD=%s\nPRODUCER_RUN=%s\nPRODUCER_ATTEMPT=%s\nPRODUCER_CONCLUSION=%s\n' "$pr" "$head" "$base" "$producer_pr" "$producer_head" "$run_id" "$attempt" "$conclusion" >> "$GITHUB_ENV"
          if [ "$conclusion" != success ]; then
            python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); rows=json.loads((root/'api/producer-artifacts.json').read_text())['artifacts']
          receipt={'status':'cycle-011-rastel-final-product-v3-terminal-failure-retained','version':1,'producer':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'attempt':int(os.environ['PRODUCER_ATTEMPT']),'conclusion':os.environ['PRODUCER_CONCLUSION']},'artifacts':[{'id':row['id'],'name':row['name'],'digest':row.get('digest'),'expired':row['expired']} for row in rows],'jobs':(root/'logs/producer-jobs.tsv').read_text().splitlines(),'boundary':{'candidate_or_product_approved':False,'repository_write':False,'canonical_mutation':False,'cycle_012_authorized':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/terminal-failure.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
            while IFS=$'\t' read -r artifact_id artifact_name artifact_digest; do
              [ -z "$artifact_id" ] && continue
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/failure-artifacts/$artifact_id.zip" || true
              if [ -s "$OUT/failure-artifacts/$artifact_id.zip" ] && [ -n "$artifact_digest" ] && [ "$artifact_digest" != null ]; then
                test "sha256:$(sha256sum "$OUT/failure-artifacts/$artifact_id.zip" | awk '{print $1}')" = "$artifact_digest"
              fi
            done < <(jq -r '.artifacts[] | [.id,.name,.digest] | @tsv' "$OUT/api/producer-artifacts.json")
            exit 1
          fi

      - name: Download and authenticate exact successful final-product packet
        shell: bash
        run: |
          set -euo pipefail
          product_artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/producer-artifacts.json').read_text())['artifacts']
          expected=os.environ['PRODUCER_ARTIFACT_PREFIX']+os.environ['PRODUCER_RUN']+'-attempt-'+os.environ['PRODUCER_ATTEMPT']
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$product_artifact" > "$OUT/api/product-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$product_artifact/zip" > "$OUT/product.zip"
          product_sha="$(sha256sum "$OUT/product.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/product-artifact.json")" = "sha256:$product_sha"
          PRODUCT_ARTIFACT="$product_artifact" PRODUCT_ZIP_SHA256="$product_sha" python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'product.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          receipts=[]
          for path in packet.rglob('*.json'):
              if path.stat().st_size>20_000_000:continue
              try:data=json.loads(path.read_text())
              except Exception:continue
              status=data.get('status','')
              if status.startswith('cycle-011-rastel-final-product-locally-qualified-v'):
                  receipts.append((path,data))
          assert len(receipts)==1,[p.as_posix() for p,_ in receipts]
          path,receipt=receipts[0]
          identity=receipt.pop('identity'); assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; receipt['identity']=identity
          assert receipt['product']['task']==os.environ['TASK_ID'] and receipt['product']['lease']==os.environ['EXPECTED_LEASE'] and receipt['product']['wall']==os.environ['WALL_ID']
          assert receipt['product']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert receipt['queue']=={'total':316,'queued':305,'resolved':11,'in_flight':0}
          assert all(receipt['gates'].values()) and receipt['boundary']['local_product_only'] is True and receipt['boundary']['repository_product_ref_created'] is False and receipt['boundary']['canonical_mutation'] is False
          artifact_rows=receipt['artifacts']; assert artifact_rows
          candidates=[]
          directories=[packet]+[p for p in packet.rglob('*') if p.is_dir()]
          for directory in directories:
              if all((directory/row['path']).is_file() and (directory/row['path']).stat().st_size==row['bytes'] and sha((directory/row['path']).read_bytes())==row['sha256'] for row in artifact_rows):
                  candidates.append(directory)
          candidates=sorted(set(candidates),key=lambda p:len(p.parts),reverse=True)
          assert len(candidates)==1,[p.as_posix() for p in candidates]
          product_root=candidates[0]
          handoff=root/'handoff'
          for row in artifact_rows:
              src=product_root/row['path']; dst=handoff/row['path']; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          (root/'receipt/source-final-product.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-final-product-v3-artifact-authenticated','version':1,'source':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'attempt':int(os.environ['PRODUCER_ATTEMPT']),'artifact':int(os.environ['PRODUCT_ARTIFACT']),'artifact_sha256':os.environ['PRODUCT_ZIP_SHA256'],'receipt_identity':identity},'ledgers':ledgers,'product_root':product_root.relative_to(packet).as_posix(),'artifact_rows':artifact_rows}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/source-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          printf 'PRODUCT_ARTIFACT=%s\nPRODUCT_ZIP_SHA256=%s\n' "$product_artifact" "$product_sha" >> "$GITHUB_ENV"

      - name: Independently import bundle and verify every product byte and mode
        shell: bash
        run: |
          set -euo pipefail
          product="$(jq -r '.product.commit' "$OUT/receipt/source-final-product.json")"
          product_tree="$(jq -r '.product.tree' "$OUT/receipt/source-final-product.json")"
          product_paths="$(jq -r '.product.paths' "$OUT/receipt/source-final-product.json")"
          mapfile -d '' bundles < <(find "$OUT/handoff" -type f -name '*.bundle' -print0)
          test "${#bundles[@]}" -ge 1
          bundle_matches=0
          : > "$OUT/logs/bundle-heads.tsv"
          for bundle in "${bundles[@]}"; do
            git bundle verify "$bundle" 2>&1 | tee -a "$OUT/logs/bundle-verify.log"
            git bundle list-heads "$bundle" | sed "s#^#$bundle\t#" >> "$OUT/logs/bundle-heads.tsv"
            if git bundle list-heads "$bundle" | grep -q "^$product "; then
              git fetch --no-tags "$bundle" "$product:refs/rastel-final-review/$product"
              bundle_matches=$((bundle_matches+1))
            fi
          done
          test "$bundle_matches" = 1
          test "$(git show -s --format=%P "$product")" = "$SOURCE_MAIN"
          test "$(git show -s --format=%T "$product")" = "$product_tree"
          test "$(git rev-list --count "$SOURCE_MAIN".."$product")" = 1
          test -z "$(git rev-list --merges "$SOURCE_MAIN".."$product")"
          git diff --name-only "$SOURCE_MAIN" "$product" | LC_ALL=C sort > "$OUT/logs/actual-paths.txt"
          git diff --name-status "$SOURCE_MAIN" "$product" > "$OUT/logs/actual-name-status.tsv"
          test "$(wc -l < "$OUT/logs/actual-paths.txt" | tr -d ' ')" = "$product_paths"
          test -z "$(awk '$1 ~ /^D/ {print}' "$OUT/logs/actual-name-status.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/actual-name-status.tsv")"
          PRODUCT="$product" PRODUCT_TREE="$product_tree" PRODUCT_PATHS="$product_paths" python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); handoff=root/'handoff'; sha=lambda data:hashlib.sha256(data).hexdigest()
          expected=set((root/'logs/actual-paths.txt').read_text().splitlines())
          def collect(value,rows):
              if isinstance(value,dict):
                  if isinstance(value.get('path'),str) and any(key in value for key in ('sha256','digest','file_sha256')):
                      rows.append(value)
                  for item in value.values():collect(item,rows)
              elif isinstance(value,list):
                  for item in value:collect(item,rows)
          manifest_candidates=[]
          for path in handoff.rglob('*.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              rows=[]; collect(data,rows)
              normalized={}
              for row in rows:
                  name=row.get('path')
                  if name not in expected:continue
                  digest=row.get('sha256') or row.get('file_sha256') or row.get('digest','').removeprefix('sha256:')
                  size=row.get('bytes',row.get('byte_count',row.get('size')))
                  mode=row.get('mode',row.get('git_mode'))
                  blob=row.get('blob',row.get('git_blob',row.get('blob_id')))
                  if name in normalized:
                      assert normalized[name]=={'sha256':digest,'bytes':size,'mode':str(mode) if mode is not None else None,'blob':blob}
                  normalized[name]={'sha256':digest,'bytes':size,'mode':str(mode) if mode is not None else None,'blob':blob}
              if set(normalized)==expected and all(row['sha256'] and row['bytes'] is not None and row['mode'] and row['blob'] for row in normalized.values()):
                  manifest_candidates.append((path,normalized))
          assert len(manifest_candidates)==1,[(path.as_posix(),len(rows)) for path,rows in manifest_candidates]
          manifest_path,manifest=manifest_candidates[0]
          archives=[]
          for path in handoff.rglob('*'):
              if not path.is_file() or not path.name.endswith(('.tar.gz','.tgz')):continue
              try:
                  with tarfile.open(path,'r:*') as archive:
                      infos=[info for info in archive.getmembers() if info.isfile()]
                      names=[PurePosixPath(info.name).as_posix() for info in infos]
                      if len(names)==len(set(names)) and set(names)==expected:
                          archives.append((path,infos))
              except tarfile.TarError:continue
          assert len(archives)==1,[path.as_posix() for path,_ in archives]
          archive_path,_=archives[0]
          with tarfile.open(archive_path,'r:*') as archive:
              for info in archive.getmembers():
                  if not info.isfile():continue
                  name=PurePosixPath(info.name).as_posix(); row=manifest[name]; data=archive.extractfile(info).read()
                  assert len(data)==int(row['bytes']) and sha(data)==row['sha256']
                  git_bytes=subprocess.check_output(['git','show',os.environ['PRODUCT']+':'+name])
                  assert git_bytes==data
                  tree_line=subprocess.check_output(['git','ls-tree',os.environ['PRODUCT'],'--',name],text=True).strip()
                  git_mode,kind,git_blob,git_path=tree_line.split(None,3)
                  assert kind=='blob' and git_path==name and git_blob==row['blob']
                  assert git_mode==row['mode']
                  assert info.mode==int(git_mode[-3:],8)
          actual_patch=subprocess.check_output(['git','diff','--binary',os.environ['SOURCE_MAIN'],os.environ['PRODUCT']])
          patch_matches=[path for path in handoff.rglob('*.patch') if path.read_bytes()==actual_patch]
          assert len(patch_matches)==1,[path.as_posix() for path in patch_matches]
          path_ledgers=[]
          for path in handoff.rglob('*paths*.txt'):
              rows=sorted(line.strip() for line in path.read_text().splitlines() if line.strip())
              if rows==sorted(expected):path_ledgers.append(path)
          if list(handoff.rglob('*paths*.txt')):assert len(path_ledgers)==1
          name_status_matches=[]
          actual=(root/'logs/actual-name-status.tsv').read_text()
          for path in handoff.rglob('*name-status*.tsv'):
              if path.read_text()==actual:name_status_matches.append(path)
          if list(handoff.rglob('*name-status*.tsv')):assert len(name_status_matches)==1
          verification={'status':'cycle-011-rastel-final-product-object-verification-complete','version':1,'product':{'commit':os.environ['PRODUCT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS'])},'manifest':{'path':manifest_path.relative_to(handoff).as_posix(),'bytes':manifest_path.stat().st_size,'sha256':sha(manifest_path.read_bytes()),'rows':len(manifest)},'archive':{'path':archive_path.relative_to(handoff).as_posix(),'bytes':archive_path.stat().st_size,'sha256':sha(archive_path.read_bytes())},'patch':{'path':patch_matches[0].relative_to(handoff).as_posix(),'bytes':len(actual_patch),'sha256':sha(actual_patch)},'path_ledger':path_ledgers[0].relative_to(handoff).as_posix() if path_ledgers else None,'name_status':name_status_matches[0].relative_to(handoff).as_posix() if name_status_matches else None,'checks':{'bundle':True,'parent':True,'tree':True,'paths':True,'deletion_free':True,'workflow_free':True,'manifest_complete':True,'tar_members':True,'tar_modes':True,'git_modes':True,'git_blobs':True,'committed_bytes':True,'binary_patch':True}}
          verification['identity']=sha(json.dumps(verification,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/object-verification.json').write_text(json.dumps(verification,indent=2,sort_keys=True)+'\n')
          PY
          printf 'PRODUCT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\n' "$product" "$product_tree" "$product_paths" >> "$GITHUB_ENV"

      - name: Rerun complete permanent and rendered product gate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CURRENT_BASE"

      - name: Seal independent approval and publication handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          source=json.loads((root/'receipt/source-final-product.json').read_text()); custody=json.loads((root/'receipt/source-custody.json').read_text()); objects=json.loads((root/'receipt/object-verification.json').read_text()); autopilot=json.loads((root/'receipt/autopilot-status.json').read_text()); waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          approval={'status':'cycle-011-rastel-final-product-independently-approved-v1','version':1,'reviewer':{'pr':int(os.environ['REVIEWER_PR']),'head':os.environ['REVIEWER_HEAD']},'producer':{'pr':int(os.environ['PRODUCER_PR']),'head':os.environ['PRODUCER_HEAD'],'run':int(os.environ['PRODUCER_RUN']),'attempt':int(os.environ['PRODUCER_ATTEMPT']),'artifact':int(os.environ['PRODUCT_ARTIFACT']),'artifact_sha256':os.environ['PRODUCT_ZIP_SHA256'],'receipt_identity':source['identity']},'product':source['product'],'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'source_custody_identity':custody['identity'],'object_verification_identity':objects['identity'],'gates':{'source_artifact':True,'checksum_ledgers':True,'bundle':True,'tar_manifest_modes_blobs_bytes':True,'binary_patch':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline':True,'complete_rendered_gate':True,'clean_reconstruction':True},'boundary':{'approved_for_isolated_publication':True,'repository_product_ref_created':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          approval['identity']=sha(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/approval.json').write_text(json.dumps(approval,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT']); pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-review-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-review-v1
            /tmp/doctor-who-cycle-011-rastel-final-review-v1-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
