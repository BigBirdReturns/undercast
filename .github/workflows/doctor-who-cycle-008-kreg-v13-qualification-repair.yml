name: doctor-who-cycle-008-kreg-v13-qualification-repair

"on":
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-v13-qualification-repair.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-v13-qualification-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 588 &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-trusted-publisher-v13-qualify' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: 8c9dbd341585f4c823ae99223df0b1017383fe83
      OLD_HEAD: a982cc15402523f8ff11e1a35b563316926da856
      BRANCH: agent/doctor-who-cycle-008-kreg-trusted-publisher-v13-qualify
      TARGET: .github/workflows/doctor-who-cycle-008-kreg-trusted-publisher-v13.yml
      SELF: .github/workflows/doctor-who-cycle-008-kreg-v13-qualification-repair.yml
      OUT: /tmp/doctor-who-cycle-008-kreg-v13-qualification-repair
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - name: Bind exact two-commit temporary repair carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git show -s --format=%P HEAD)" = "$OLD_HEAD"
          test "$(git show -s --format=%P "$OLD_HEAD")" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 2
          printf '%s\n' "$TARGET" > "$OUT/expected-old-paths.txt"
          git diff --name-only "$BASE"..."$OLD_HEAD" | LC_ALL=C sort > "$OUT/actual-old-paths.txt"
          diff -u "$OUT/expected-old-paths.txt" "$OUT/actual-old-paths.txt"
          printf '%s\n' "$SELF" > "$OUT/expected-helper-paths.txt"
          git diff --name-only "$OLD_HEAD"...HEAD | LC_ALL=C sort > "$OUT/actual-helper-paths.txt"
          diff -u "$OUT/expected-helper-paths.txt" "$OUT/actual-helper-paths.txt"
          test -z "$(git status --porcelain)"

      - name: Apply the unique handoff-directory repair and self-squash
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$TARGET" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['TARGET'])
          text=p.read_text()
          old='          mkdir -p "$OUT"/{api,handoff,receipt,diagnostics}\n'
          new='          mkdir -p "$OUT"/{api,receipt,diagnostics}\n'
          assert text.count(old)==1
          assert text.count(new)==0
          p.write_text(text.replace(old,new))
          PY
          rm "$SELF"
          git config user.name undercast-cycle-008-publisher-repair
          git config user.email cycle-008-publisher-repair@users.noreply.github.com
          git add -A
          git reset --soft "$BASE"
          git commit -m 'CI: repair exact V13 publisher handoff extraction' >/dev/null
          repaired="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = 1
          printf '%s\n' "$TARGET" > "$OUT/expected-repaired-paths.txt"
          git diff --name-only "$BASE"...HEAD | LC_ALL=C sort > "$OUT/actual-repaired-paths.txt"
          diff -u "$OUT/expected-repaired-paths.txt" "$OUT/actual-repaired-paths.txt"
          test ! -e "$SELF"
          TARGET="$TARGET" python3 - <<'PY'
          import os
          from pathlib import Path
          text=Path(os.environ['TARGET']).read_text()
          assert text.count('          mkdir -p "$OUT"/{api,handoff,receipt,diagnostics}\n')==0
          assert text.count('          mkdir -p "$OUT"/{api,receipt,diagnostics}\n')==1
          assert text.count("target.mkdir()") == 2
          PY
          test -z "$(git status --porcelain)"
          printf '%s\n' "$repaired" > "$OUT/repaired-head.txt"
          git push origin "HEAD:refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:${{ github.event.pull_request.head.sha }}"

      - name: Upload qualification-repair receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-v13-qualification-repair-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-v13-qualification-repair
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
