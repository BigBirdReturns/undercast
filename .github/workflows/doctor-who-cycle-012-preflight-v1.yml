name: doctor-who-cycle-012-preflight-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v1
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-012-preflight-v1
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v1.yml
      OUT: /tmp/doctor-who-cycle-012-preflight-v1
      CLEANUP_PACKET: /tmp/doctor-who-cycle-012-preflight-v1-cleanup
      CLEANUP_BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v1
      CLEANUP_WORKFLOW: doctor-who-cycle-011-rastel-transport-cleanup-v1
      CLEANUP_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-transport-cleanup-v1-
      PRIOR_SELECTOR_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PRIOR_SELECTOR_PATH: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      PRIOR_SELECTOR_BLOB: 49e902869ea04409d40690dff73e7ad10f8cc5c1
      ACTIVE_PROFILE: text-vision

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind selector carrier and exact cleanup result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$CLEANUP_PACKET"
          mkdir -p "$OUT"/{api,receipt,logs,source,payload} "$CLEANUP_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$CARRIER_BASE"
          test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CARRIER_BASE"..HEAD)"
          test "$(git diff --name-status "$CARRIER_BASE"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$CLEANUP_BRANCH" -f per_page=100 > "$OUT/api/cleanup-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'cleanup-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['CLEANUP_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True
          (api/'cleanup-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'cleanup-head.txt').write_text(source['head']['sha']+'\n')
          (api/'cleanup-number.txt').write_text(str(source['number'])+'\n')
          PY
          cleanup_head="$(cat "$OUT/api/cleanup-head.txt")"
          cleanup_pr="$(cat "$OUT/api/cleanup-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$CLEANUP_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/cleanup-runs.json"
            run_id="$(CLEANUP_HEAD="$cleanup_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/cleanup-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['CLEANUP_HEAD'] and row['name']==os.environ['CLEANUP_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/cleanup-run.json"
              if [ "$(jq -r '.status' "$OUT/api/cleanup-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/cleanup-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/cleanup-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/cleanup-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/cleanup-artifacts.json"
          cleanup_job="$(jq -r '.jobs[] | select(.name=="cleanup" and .conclusion=="success") | .id' "$OUT/api/cleanup-jobs.json")"
          test -n "$cleanup_job"
          cleanup_artifact="$(CLEANUP_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/cleanup-artifacts.json').read_text())['artifacts']
          expected=os.environ['CLEANUP_ARTIFACT_PREFIX']+os.environ['CLEANUP_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$cleanup_artifact" > "$OUT/api/cleanup-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$cleanup_artifact/zip" > "$OUT/cleanup.zip"
          cleanup_sha="$(sha256sum "$OUT/cleanup.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/cleanup-artifact.json")" = "sha256:$cleanup_sha"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCLEANUP_PR=%s\nCLEANUP_HEAD=%s\nCLEANUP_RUN=%s\nCLEANUP_JOB=%s\nCLEANUP_ARTIFACT=%s\nCLEANUP_ZIP_SHA256=%s\n' "$pr" "$head" "$cleanup_pr" "$cleanup_head" "$run_id" "$cleanup_job" "$cleanup_artifact" "$cleanup_sha" >> "$GITHUB_ENV"

      - name: Authenticate cleanup and terminal canonical boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['CLEANUP_PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'cleanup.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          rows=[]
          for path in packet.rglob('*.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              if data.get('status')=='cycle-011-rastel-transport-cleanup-complete-v1':rows.append((path,data))
          assert len(rows)==1,[p.as_posix() for p,_ in rows]
          path,cleanup=rows[0]
          identity=cleanup.pop('identity'); assert sha(json.dumps(cleanup,sort_keys=True,separators=(',',':')).encode())==identity; cleanup['identity']=identity
          assert cleanup['boundary']=={'all_authorized_unmerged_prs_closed':True,'all_authorized_refs_absent':True,'cleanup_carrier_retained':True,'main_mutation':False,'force_update':False,'merge':False,'cycle_012_lease_issued':False}
          assert cleanup['retained_carrier']['pr']==int(os.environ['CLEANUP_PR']) and cleanup['retained_carrier']['head']==os.environ['CLEANUP_HEAD'] and cleanup['retained_carrier']['branch']==os.environ['CLEANUP_BRANCH']
          assert all(row['state_after']=='closed' or row['merged'] is True for row in cleanup['pull_requests'])
          assert all(row['state_after']=='absent' for row in cleanup['refs'])
          (root/'receipt/cleanup.json').write_text(json.dumps(cleanup,indent=2,sort_keys=True)+'\n')
          custody={'status':'cycle-012-selector-cleanup-custody-authenticated-v1','version':1,'cleanup':{'pr':int(os.environ['CLEANUP_PR']),'head':os.environ['CLEANUP_HEAD'],'run':int(os.environ['CLEANUP_RUN']),'job':int(os.environ['CLEANUP_JOB']),'artifact':int(os.environ['CLEANUP_ARTIFACT']),'artifact_sha256':os.environ['CLEANUP_ZIP_SHA256'],'identity':identity},'canonical_main':cleanup['canonical_main'],'ledgers':ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/cleanup-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          canonical="$(jq -r '.canonical_main' "$OUT/receipt/cleanup.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CLEANUP_BRANCH" --jq '.object.sha')" = "$CLEANUP_HEAD"
          printf 'CANONICAL_MAIN=%s\n' "$canonical" >> "$GITHUB_ENV"

      - name: Rehydrate canonical main and rerun complete terminal gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Recover and execute exact repository-native selector command
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/contents/$PRIOR_SELECTOR_PATH?ref=$PRIOR_SELECTOR_HEAD" > "$OUT/api/prior-selector-source.json"
          test "$(jq -r '.sha' "$OUT/api/prior-selector-source.json")" = "$PRIOR_SELECTOR_BLOB"
          jq -r '.content' "$OUT/api/prior-selector-source.json" | tr -d '\n' | base64 -d > "$OUT/source/prior-selector.yml"
          python3 - <<'PY'
          import hashlib,json,os,re,shlex
          from pathlib import Path
          root=Path(os.environ['OUT']); text=(root/'source/prior-selector.yml').read_text(); blocks=[]
          lines=text.splitlines(); i=0
          while i<len(lines):
              if re.match(r'^\s+run:\s*\|\s*$',lines[i]):
                  indent=len(lines[i])-len(lines[i].lstrip()); i+=1; body=[]
                  while i<len(lines):
                      current=lines[i]; current_indent=len(current)-len(current.lstrip())
                      if current.strip() and current_indent<=indent:break
                      body.append(current[indent+2:] if len(current)>=indent+2 else '')
                      i+=1
                  blocks.append('\n'.join(body)); continue
              i+=1
          candidates=[]
          for block in blocks:
              logical=[]; pending=''
              for raw in block.splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#'):continue
                  pending=(pending+' '+line).strip()
                  if pending.endswith('\\'):
                      pending=pending[:-1].strip(); continue
                  logical.append(pending); pending=''
              if pending:logical.append(pending)
              for line in logical:
                  lower=line.lower()
                  if 'scripts/autopilot.mjs' not in line:continue
                  if 'candidate' not in lower and ' next ' not in ' '+lower+' ':continue
                  if any(token in lower for token in (' claim ',' submit ',' --write',' record-cycle')):continue
                  command=re.split(r'\s+(?:>|\|\s*tee\b)',line,maxsplit=1)[0].strip()
                  if '--scope' in command and 'doctor-who' in command:candidates.append(command)
          candidates=list(dict.fromkeys(candidates))
          assert len(candidates)==1,candidates
          command=candidates[0]
          assert os.environ['ACTIVE_PROFILE'] in command and '--json' in command
          (root/'source/selector-command.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n'+command+'\n')
          receipt={'status':'cycle-012-selector-command-recovered-v1','version':1,'source':{'commit':os.environ['PRIOR_SELECTOR_HEAD'],'path':os.environ['PRIOR_SELECTOR_PATH'],'git_blob':os.environ['PRIOR_SELECTOR_BLOB'],'bytes':len(text.encode()),'sha256':hashlib.sha256(text.encode()).hexdigest()},'command':command,'active_profile':os.environ['ACTIVE_PROFILE'],'run_blocks':len(blocks)}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/'receipt/selector-command.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod 700 "$OUT/source/selector-command.sh"
          bash "$OUT/source/selector-command.sh" > "$OUT/payload/candidates.json"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          root=Path(os.environ['OUT']); data=json.loads((root/'payload/candidates.json').read_text()); sha=lambda value:hashlib.sha256(value).hexdigest()
          selected=None
          if isinstance(data,list) and data:selected=data[0]
          elif isinstance(data,dict):
              for key in ('selected_task','selected','candidate','next'):
                  if isinstance(data.get(key),dict):selected=data[key]; break
              if selected is None:
                  for key in ('candidates','tasks','items','results'):
                      if isinstance(data.get(key),list) and data[key]:selected=data[key][0]; break
          assert isinstance(selected,dict),(type(data).__name__,data if isinstance(data,dict) else len(data))
          def first(*keys):
              for key in keys:
                  value=selected.get(key)
                  if value not in (None,''):return value
          task_id=first('id','task_id','taskId')
          if not (isinstance(task_id,str) and task_id.startswith('ap_')):
              task=selected.get('task') if isinstance(selected.get('task'),dict) else {}
              task_id=task.get('id') or task.get('task_id')
          assert isinstance(task_id,str) and task_id.startswith('ap_'),selected
          state=first('status','state','current_status')
          if state is not None:assert state=='queued',state
          performer=first('performer','actor','performer_name')
          role=first('role','character','character_name')
          mode=first('mode','performance_mode')
          cleanup=json.loads((root/'receipt/cleanup.json').read_text()); command=json.loads((root/'receipt/selector-command.json').read_text()); autopilot=json.loads((root/'receipt/autopilot-status.json').read_text()); waterline=json.loads((root/'receipt/waterline-status.json').read_text())
          receipt={'status':'cycle-012-doctor-who-selector-qualified-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'carrier_base':os.environ['CARRIER_BASE']},'canonical_main':os.environ['CANONICAL_MAIN'],'cleanup':{'pr':int(os.environ['CLEANUP_PR']),'head':os.environ['CLEANUP_HEAD'],'run':int(os.environ['CLEANUP_RUN']),'job':int(os.environ['CLEANUP_JOB']),'artifact':int(os.environ['CLEANUP_ARTIFACT']),'artifact_sha256':os.environ['CLEANUP_ZIP_SHA256'],'identity':cleanup['identity']},'command':{'identity':command['identity'],'text':command['command'],'source':command['source'],'active_profile':command['active_profile']},'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'selected_task_id':task_id,'selected_task':selected,'normalized':{'performer':performer,'role':role,'mode':mode},'boundary':{'selection_only':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'wall_created':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'payload/selection.json').write_text(json.dumps(receipt,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v1
            /tmp/doctor-who-cycle-012-preflight-v1-cleanup
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire_cleanup:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PACKET: /tmp/doctor-who-cycle-012-preflight-v1-retire-input
      OUT: /tmp/doctor-who-cycle-012-preflight-v1-retire-result
      SELECTION_NAME: doctor-who-cycle-012-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      CLEANUP_BRANCH: agent/doctor-who-cycle-011-rastel-transport-cleanup-v1
      SELECTOR_BRANCH: agent/doctor-who-cycle-012-preflight-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate selection and retire consumed cleanup carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']
          rows=[row for row in rows if row['name']==os.environ['SELECTION_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/selection-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/selection.zip"
          zip_sha="$(sha256sum "$OUT/selection.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/selection-artifact.json")" = "sha256:$zip_sha"
          SELECTION_ARTIFACT="$artifact" SELECTION_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'selection.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          selection=json.loads((packet/'selection.json').read_text()); identity=selection.pop('identity'); assert sha(json.dumps(selection,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; selection['identity']=identity
          assert selection['status']=='cycle-012-doctor-who-selector-qualified-v1'
          assert selection['boundary']=={'selection_only':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'wall_created':False,'media_adopted':False,'cycle_receipt_written':False,'cycle_012_product_authority':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          assert selection['cleanup']['pr'] and selection['cleanup']['head'] and selection['canonical_main']
          (out/'receipt/selection.json').write_text(json.dumps(selection,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          cleanup_pr="$(jq -r '.cleanup.pr' "$OUT/receipt/selection.json")"
          cleanup_head="$(jq -r '.cleanup.head' "$OUT/receipt/selection.json")"
          canonical="$(jq -r '.canonical_main' "$OUT/receipt/selection.json")"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$cleanup_pr" > "$OUT/api/cleanup-pr-before.json"
          test "$(jq -r '.state' "$OUT/api/cleanup-pr-before.json")" = open
          test "$(jq -r '.merged' "$OUT/api/cleanup-pr-before.json")" = false
          test "$(jq -r '.head.ref' "$OUT/api/cleanup-pr-before.json")" = "$CLEANUP_BRANCH"
          test "$(jq -r '.head.sha' "$OUT/api/cleanup-pr-before.json")" = "$cleanup_head"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CLEANUP_BRANCH" --jq '.object.sha')" = "$cleanup_head"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$cleanup_pr" -f state=closed > "$OUT/api/cleanup-pr-close.json"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CLEANUP_BRANCH" --jq '.object.sha')" = "$cleanup_head"
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$CLEANUP_BRANCH"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CLEANUP_BRANCH" > /dev/null 2>&1; then exit 1; fi
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$cleanup_pr" > "$OUT/api/cleanup-pr-after.json"
          test "$(jq -r '.state' "$OUT/api/cleanup-pr-after.json")" = closed
          test "$(jq -r '.merged' "$OUT/api/cleanup-pr-after.json")" = false
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$canonical"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$SELECTOR_BRANCH" --jq '.object.sha')" = "${{ github.event.pull_request.head.sha }}"
          printf 'SELECTION_ARTIFACT=%s\nSELECTION_ZIP_SHA256=%s\nCLEANUP_PR=%s\nCLEANUP_HEAD=%s\nCANONICAL_MAIN=%s\n' "$artifact" "$zip_sha" "$cleanup_pr" "$cleanup_head" "$canonical" >> "$GITHUB_ENV"

      - name: Seal cleanup-carrier retirement receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); selection=json.loads((root/'receipt/selection.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt={'status':'cycle-011-cleanup-carrier-retired-after-cycle-012-selection-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'selection':{'artifact':int(os.environ['SELECTION_ARTIFACT']),'artifact_sha256':os.environ['SELECTION_ZIP_SHA256'],'identity':selection['identity'],'selected_task_id':selection['selected_task_id']},'cleanup':{'pr':int(os.environ['CLEANUP_PR']),'head':os.environ['CLEANUP_HEAD'],'branch':os.environ['CLEANUP_BRANCH'],'state':'closed','ref':'absent'},'canonical_main':os.environ['CANONICAL_MAIN'],'retained_selector_branch':os.environ['SELECTOR_BRANCH'],'boundary':{'cleanup_carrier_retired':True,'selector_carrier_retained':True,'lease_issued':False,'queue_mutated':False,'canonical_mutated':False,'cycle_012_product_authority':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/retirement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v1-retirement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v1-retire-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v1-retirement-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v1-retire-input
            /tmp/doctor-who-cycle-012-preflight-v1-retire-result
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
