name: star-trek-population-media-candidates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-MEDIA-CANDIDATES.json"
      - ".github/workflows/star-trek-population-media-candidates.yml"

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Capture revision-bound Zek and Wallace Shawn image candidates
        env:
          CONTACT: bigbirdreturns@proton.me
        run: |
          set -euo pipefail
          out=/tmp/zek-media-candidates
          rm -rf "$out"
          mkdir -p "$out/stills" "$out/portrait"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const out='/tmp/zek-media-candidates';
          const UA=`undercast/0.1 (+https://github.com/BigBirdReturns/undercast; ${process.env.CONTACT})`;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function request(url,tries=0){
            const response=await fetch(url,{headers:{'User-Agent':UA,Accept:'application/json,*/*'}});
            if(([429,502,503,504].includes(response.status))&&tries<4){await sleep((tries+1)*2500);return request(url,tries+1);}
            if(!response.ok) throw new Error(`${url} -> ${response.status}`);
            return response;
          }
          async function mw(base,params){
            const url=base+'?'+new URLSearchParams({format:'json',origin:'*',formatversion:'2',...params});
            return request(url).then(r=>r.json());
          }
          const safe=value=>String(value).replace(/^File:/,'').replace(/[^A-Za-z0-9._-]+/g,'_').slice(0,180);
          async function download(url,target){
            const bytes=Buffer.from(await request(url).then(r=>r.arrayBuffer()));
            fs.writeFileSync(target,bytes);
            return {bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex')};
          }
          const fandom='https://memory-alpha.fandom.com/api.php';
          const page=await mw(fandom,{action:'query',prop:'pageimages|images|revisions',piprop:'name',imlimit:'max',rvprop:'ids|timestamp',titles:'Zek'});
          const zek=page.query?.pages?.[0];
          if(!zek||zek.missing) throw new Error('Memory Alpha Zek page missing');
          const names=[...new Set([zek.pageimage,...(zek.images||[]).map(row=>row.title)].filter(Boolean).map(name=>name.startsWith('File:')?name:`File:${name}`))];
          const stills=[];
          for(const title of names){
            if(!/\.(?:jpe?g|png|webp)$/i.test(title)) continue;
            const infoDoc=await mw(fandom,{action:'query',prop:'imageinfo|revisions',iiprop:'url|size|sha1|mime|extmetadata',iiurlwidth:'1000',rvprop:'ids|timestamp',titles:title});
            const filePage=infoDoc.query?.pages?.[0];
            const info=filePage?.imageinfo?.[0];
            if(!info?.thumburl) continue;
            const filename=safe(title).replace(/\.(jpe?g|png|webp)$/i,'')+'.jpg';
            const target=path.join(out,'stills',filename);
            const receipt=await download(info.thumburl,target);
            const metadata=info.extmetadata||{};
            stills.push({
              title,
              pageid:filePage.pageid,
              revision:filePage.revisions?.[0]?.revid||null,
              revision_timestamp:filePage.revisions?.[0]?.timestamp||null,
              description_url:info.descriptionurl||null,
              original_url:info.url||null,
              thumb_url:info.thumburl,
              source_width:info.width||null,
              source_height:info.height||null,
              source_sha1:info.sha1||null,
              mime:info.mime||null,
              description:String(metadata.ImageDescription?.value||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(),
              categories:String(metadata.Categories?.value||''),
              local_file:`stills/${filename}`,
              ...receipt
            });
            await sleep(400);
          }
          const commons='https://commons.wikimedia.org/w/api.php';
          const portraitTitle='File:Wallace Shawn 2014 (cropped).jpg';
          const portraitDoc=await mw(commons,{action:'query',prop:'imageinfo|revisions',iiprop:'url|size|sha1|mime|extmetadata',iiurlwidth:'1000',rvprop:'ids|timestamp',titles:portraitTitle});
          const portraitPage=portraitDoc.query?.pages?.[0];
          const portraitInfo=portraitPage?.imageinfo?.[0];
          if(!portraitInfo?.thumburl) throw new Error('Commons Wallace Shawn portrait unavailable');
          const portraitTarget=path.join(out,'portrait','wallace-shawn-2014-cropped.jpg');
          const portraitReceipt=await download(portraitInfo.thumburl,portraitTarget);
          const pm=portraitInfo.extmetadata||{};
          const portrait={
            title:portraitTitle,
            pageid:portraitPage.pageid,
            revision:portraitPage.revisions?.[0]?.revid||null,
            revision_timestamp:portraitPage.revisions?.[0]?.timestamp||null,
            description_url:portraitInfo.descriptionurl,
            original_url:portraitInfo.url,
            thumb_url:portraitInfo.thumburl,
            source_width:portraitInfo.width,
            source_height:portraitInfo.height,
            source_sha1:portraitInfo.sha1,
            mime:portraitInfo.mime,
            author:String(pm.Artist?.value||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim(),
            license:String(pm.LicenseShortName?.value||pm.License?.value||'').trim(),
            date:String(pm.DateTimeOriginal?.value||pm.DateTime?.value||'').replace(/<[^>]*>/g,' ').trim(),
            local_file:'portrait/wallace-shawn-2014-cropped.jpg',
            ...portraitReceipt
          };
          const manifest={
            version:1,
            captured_at:new Date().toISOString(),
            character_page:{title:zek.title,pageid:zek.pageid,revision:zek.revisions?.[0]?.revid||null,revision_timestamp:zek.revisions?.[0]?.timestamp||null,pageimage:zek.pageimage||null},
            still_candidates:stills,
            portrait_candidate:portrait
          };
          fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify({character_page:manifest.character_page,still_candidates:stills.map(row=>({title:row.title,description:row.description,bytes:row.bytes,sha256:row.sha256,local_file:row.local_file})),portrait},null,2));
          NODE
          (cd "$out" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact source candidates
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-zek-media-candidates-${{ github.run_id }}
          path: /tmp/zek-media-candidates
          if-no-files-found: error
          retention-days: 30
