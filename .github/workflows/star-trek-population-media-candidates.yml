name: star-trek-population-media-candidates

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-MEDIA-CANDIDATES.json"
      - ".github/workflows/star-trek-population-media-candidates.yml"

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
      - name: Download exact source-file candidates without thumbnail APIs
        run: |
          set -euo pipefail
          out=/tmp/zek-media-candidates
          rm -rf "$out"
          mkdir -p "$out/stills" "$out/portrait" "$out/headers"
          ua='Mozilla/5.0 UNDERCAST/0.1 (+https://github.com/BigBirdReturns/undercast; bigbirdreturns@proton.me)'
          fetch_one(){
            label="$1"; url="$2"; target="$3"
            set +e
            curl --location --fail --silent --show-error --retry 4 --retry-all-errors \
              --connect-timeout 20 --max-time 120 \
              -A "$ua" -e 'https://memory-alpha.fandom.com/' \
              -D "$out/headers/${label}.headers" -o "$target" "$url"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              rm -f "$target"
              printf '%s\tFAIL\t%s\n' "$label" "$code" >> "$out/results.tsv"
              return 0
            fi
            mime=$(file -b --mime-type "$target")
            bytes=$(wc -c < "$target" | tr -d ' ')
            sha=$(sha256sum "$target" | cut -d' ' -f1)
            if [[ "$mime" != image/* ]] || [ "$bytes" -lt 10000 ]; then
              printf '%s\tINVALID\t%s\t%s\t%s\n' "$label" "$mime" "$bytes" "$sha" >> "$out/results.tsv"
              rm -f "$target"
              return 0
            fi
            printf '%s\tOK\t%s\t%s\t%s\t%s\n' "$label" "$mime" "$bytes" "$sha" "$url" >> "$out/results.tsv"
          }
          : > "$out/results.tsv"
          fetch_one zek-2369 \
            'https://memory-alpha.fandom.com/wiki/Special:Redirect/file/Zek%2C_2369.jpg?width=1200' \
            "$out/stills/zek-2369.jpg"
          fetch_one zek-2370 \
            'https://memory-alpha.fandom.com/wiki/Special:Redirect/file/Zek%2C_2370.jpg?width=1200' \
            "$out/stills/zek-2370.jpg"
          fetch_one ishka-and-zek \
            'https://memory-alpha.fandom.com/wiki/Special:Redirect/file/Ishka_and_Zek.jpg?width=1200' \
            "$out/stills/ishka-and-zek.jpg"
          fetch_one zek-in-closet \
            'https://memory-alpha.fandom.com/wiki/Special:Redirect/file/Zek_in_closet.jpg?width=1200' \
            "$out/stills/zek-in-closet.jpg"
          fetch_one zek-saves-quark \
            'https://memory-alpha.fandom.com/wiki/Special:Redirect/file/Zek_saves_Quark.jpg?width=1200' \
            "$out/stills/zek-saves-quark.jpg"
          fetch_one wallace-shawn-2014 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Wallace_Shawn_2014_%28cropped%29.jpg?width=1000' \
            "$out/portrait/wallace-shawn-2014-cropped.jpg"
          cat "$out/results.tsv"
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const rows=fs.readFileSync('/tmp/zek-media-candidates/results.tsv','utf8').trim().split(/\n/).filter(Boolean).map(line=>{
            const [label,status,mime,bytes,sha256,url]=line.split('\t');
            return {label,status,mime:mime||null,bytes:bytes?Number(bytes):null,sha256:sha256||null,url:url||null};
          });
          const files=[];
          for(const dir of ['stills','portrait']) for(const name of fs.readdirSync(`/tmp/zek-media-candidates/${dir}`)) files.push(`${dir}/${name}`);
          const manifest={
            version:1,
            captured_at:new Date().toISOString(),
            source_pages:{
              zek_2369:'https://memory-alpha.fandom.com/wiki/File:Zek,_2369.jpg',
              zek_2370:'https://memory-alpha.fandom.com/wiki/File:Zek,_2370.jpg',
              ishka_and_zek:'https://memory-alpha.fandom.com/wiki/File:Ishka_and_Zek.jpg',
              zek_in_closet:'https://memory-alpha.fandom.com/wiki/File:Zek_in_closet.jpg',
              zek_saves_quark:'https://memory-alpha.fandom.com/wiki/File:Zek_saves_Quark.jpg',
              wallace_shawn_2014:'https://commons.wikimedia.org/wiki/File:Wallace_Shawn_2014_(cropped).jpg'
            },
            results:rows,
            files
          };
          fs.writeFileSync('/tmp/zek-media-candidates/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          if(!rows.some(row=>row.label==='zek-2369'&&row.status==='OK')&&!rows.some(row=>row.label==='zek-2370'&&row.status==='OK')) process.exitCode=2;
          NODE
          (cd "$out" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload exact source candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-zek-media-candidates-${{ github.run_id }}
          path: /tmp/zek-media-candidates
          if-no-files-found: error
          retention-days: 30
