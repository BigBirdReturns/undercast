    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Authenticate preserved candidate execution and run exact Senstarg materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/api "$BOOTSTRAP"/diagnostics
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAG_RUN" > "$BOOTSTRAP/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$DIAG_RUN/jobs?per_page=100" > "$BOOTSTRAP/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAG_ARTIFACT" > "$BOOTSTRAP/api/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$DIAG_ARTIFACT/zip" > "$BOOTSTRAP/diagnostics.zip"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import hashlib, json, os, re, stat, subprocess, textwrap, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          run=json.loads((root/'api/run.json').read_text())
          jobs=json.loads((root/'api/jobs.json').read_text())['jobs']
          artifact=json.loads((root/'api/artifact.json').read_text())
          assert run['id']==int(os.environ['DIAG_RUN']) and run['head_sha']==os.environ['DIAG_HEAD']
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert len([x for x in jobs if x['id']==int(os.environ['DIAG_JOB']) and x['name']=='candidate' and x['conclusion']=='failure'])==1
          assert artifact['id']==int(os.environ['DIAG_ARTIFACT']) and not artifact['expired']
          assert artifact['digest']=='sha256:'+os.environ['DIAG_ZIP_SHA256']
          assert sha((root/'diagnostics.zip').read_bytes())==os.environ['DIAG_ZIP_SHA256']
          with zipfile.ZipFile(root/'diagnostics.zip') as z:
              infos=z.infolist(); assert infos and len(infos)==len({x.filename for x in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); mode=(info.external_attr>>16)&0xffff
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename and not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=root/'diagnostics'/Path(*p.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          scripts=list((root/'diagnostics').rglob('derivation/target/materializer.senstarg-v1.sh'))
          assert len(scripts)==1
          target=scripts[0]; text=target.read_text()
          assert target.stat().st_size==int(os.environ['OLD_EXEC_BYTES']) and sha(target.read_bytes())==os.environ['OLD_EXEC_SHA256']
          reviews=list((root/'diagnostics').rglob('review/review.json')); assert len(reviews)==1
          review=json.loads(reviews[0].read_text()); body=dict(review); identity=body.pop('identity')
          assert identity==os.environ['REVIEW_IDENTITY']==sha(json.dumps(body,sort_keys=True,separators=(',',':')).encode())
          assert review['source']['derivation_identity']==os.environ['DERIVATION_IDENTITY']
          assert review['target']['sha256']==os.environ['TARGET_MATERIALIZER_SHA256']
          assert review['task']['id']==os.environ['TASK_ID'] and review['task']['wall_id']==os.environ['EXPECTED_WALL_ID']
          assert review['task']['maker_attribution']=='unresolved'
          reviewed=list((root/'diagnostics').rglob('review/materializer.senstarg-v1.sh')); assert len(reviewed)==1
          assert sha(reviewed[0].read_bytes())==os.environ['TARGET_MATERIALIZER_SHA256']
          replacements=[
            ("path.write_text(json.dumps(row,indent=2,ensure_ascii=False)+'\\n')\nPY\nset +e", "path.write_text(json.dumps(row,indent=2,ensure_ascii=False)+'\\n')\nPY\ngit add -- package.json\nset +e"),
            ('cp "$OUT/work/package.json.before-complete-gate" package.json\ngit diff --quiet', 'cp "$OUT/work/package.json.before-complete-gate" package.json\ngit add -- package.json\ngit diff --quiet'),
          ]
          for old,new in replacements:
              assert text.count(old)==1,old
              text=text.replace(old,new)
          output=root/'materializer.senstarg-v1.sh'; output.write_text(text)
          assert output.stat().st_size==int(os.environ['EXECUTION_MATERIALIZER_BYTES'])
          assert sha(output.read_bytes())==os.environ['EXECUTION_MATERIALIZER_SHA256']
          subprocess.run(['bash','-n',str(output)],check=True)
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); assert len(blocks)==11
          for i,block in enumerate(blocks,1): compile(textwrap.dedent(block),f'<execution-{i}>','exec')
          PY
          chmod 700 "$BOOTSTRAP/materializer.senstarg-v1.sh"
          "$BOOTSTRAP/materializer.senstarg-v1.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-candidate-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-candidate-v1
            /tmp/doctor-who-cycle-012-senstarg-candidate-v1-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
