name: doctor-who-cycle-012-senstarg-candidate-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-012-senstarg-candidate-v1.yml"]

permissions: {}
concurrency:
  group: doctor-who-cycle-012-senstarg-candidate-v1
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-candidate-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
