name: doctor-who-cycle-011-rastel-candidate-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-v2
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL: /tmp/doctor-who-cycle-011-rastel-candidate-v2-bootstrap
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-v2
      CONTROLLER_BLOB: c4ec920c570b2233b78d0248126a1c8b321b326c
      CONTROLLER_B64_BYTES: "6956"
      CONTROLLER_B64_SHA256: a49d94712092ad7b87e9430a66cda110a0786940c067c668b3e303941f5ea48c
      CONTROLLER_GZIP_BYTES: "5215"
      CONTROLLER_GZIP_SHA256: 38f2f0ef66a05dcd252dc31e0d6381f61b346beac28367aae9e2297e94d7b3fc
      CONTROLLER_BYTES: "13891"
      CONTROLLER_SHA256: b1c070f68fea47d8a19cd1565e3e590a3aea0307fdcbb28a58fda07619f6f034

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate failed candidate and execute exact V2 materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL"
          mkdir -p "$CONTROL"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CONTROL/controller.sh.gz.b64"
          test "$(wc -c < "$CONTROL/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$CONTROL/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          python3 - <<'PY'
          import base64,gzip,hashlib,os
          from pathlib import Path
          root=Path(os.environ['CONTROL'])
          packed=base64.b64decode((root/'controller.sh.gz.b64').read_text())
          assert len(packed)==int(os.environ['CONTROLLER_GZIP_BYTES'])
          assert hashlib.sha256(packed).hexdigest()==os.environ['CONTROLLER_GZIP_SHA256']
          source=gzip.decompress(packed)
          assert len(source)==int(os.environ['CONTROLLER_BYTES'])
          assert hashlib.sha256(source).hexdigest()==os.environ['CONTROLLER_SHA256']
          (root/'controller.sh').write_bytes(source)
          PY
          chmod 700 "$CONTROL/controller.sh"
          bash -n "$CONTROL/controller.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
            exec "$CONTROL/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-v2
            /tmp/doctor-who-cycle-011-rastel-candidate-v2-control
            /tmp/doctor-who-cycle-011-rastel-candidate-v2-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
