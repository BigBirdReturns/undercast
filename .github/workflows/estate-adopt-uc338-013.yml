name: estate-adopt-uc338-013

# Sole canonical-mutation authority for the final imported packet after the
# duplicate COLLECT-012 workflow, executor, and runner were retired.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-uc338-013.yml
      - scripts/estate-adopt-uc338-013.py.gz.b64
      - scripts/estate-run-collect013.sh
      - data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json
      - data/review/card-backfill/UC-338-season17-replacement/**

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-uc338-013
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect013.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Execute final imported-packet payment
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-013-uc338-final-payment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-013-preflight.json
            /tmp/COLLECT-013-quality-before.json
            /tmp/COLLECT-013-apply.json
            /tmp/COLLECT-013-validation.json
            /tmp/COLLECT-013-tracked-paths.zlist
            /tmp/COLLECT-013-untracked-paths.zlist
            /tmp/COLLECT-013-candidate.patch
            /tmp/COLLECT-013-candidate.tree
            /tmp/COLLECT-013-promotion.json
            /tmp/COLLECT-013-ledger-validation.json
            /tmp/COLLECT-013-adoption.patch
            /tmp/COLLECT-013-adoption.tree
            /tmp/COLLECT-013-reconciliation.json
            /tmp/COLLECT-013-final-ledger-validation.json
            /tmp/COLLECT-013-publication.patch
            /tmp/COLLECT-013-publication.tree
            data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json
            data/review/estate-debt/COLLECT-013-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-013-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
