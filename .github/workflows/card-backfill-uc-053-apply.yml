name: card-backfill-uc-053-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-053-APPLY.json"
      - "scripts/card-backfill-uc-053-apply.mjs"
      - ".github/workflows/card-backfill-uc-053-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-053-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-007'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-007
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed candidate authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-053-APPLY.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-053'||row.actor!=='Gary Oldman'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-053 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8634693014||row.render_artifact?.head_sha!=='d83760c76ea7abadc03a0cec1737a829033300ed')throw new Error('UC-053 render custody drift');
          if(row.expected?.candidate_sha256!=='eac0892b10bb01bbd263b66f5945e4c8ac997edeb47f19c98aa373db96cadacb')throw new Error('UC-053 candidate authorization drift');
          if(row.expected?.crop_preview_sha256!=='9035e9bf4986276b0d7145450e7969eb54dd6e3cbe22125260da5016b0c415ce')throw new Error('UC-053 crop authorization drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass'||row.ruling?.canonical_mutation!==false)throw new Error('UC-053 exact-subject ruling drift');
          console.log('PASS — exact UC-053 candidate, crop and evidence-only ruling authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-053-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8634693014/zip" > "$root/render.zip"
          echo "02cb24f5038bef7975ca7698c90d7c3b0e9b0b41edabce0774e2541aebc6b2f9  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          test -f "$root/source/output/manifest.json"
          echo "eac0892b10bb01bbd263b66f5945e4c8ac997edeb47f19c98aa373db96cadacb  $root/source/output/uc-053-still-candidate.jpg" | sha256sum -c -
          echo "9035e9bf4986276b0d7145450e7969eb54dd6e3cbe22125260da5016b0c415ce  $root/source/output/card-crop-preview.jpg" | sha256sum -c -
          echo "27ab0c6cc95e769b3bcdbbb0259c91e48c307b3eace73c3431f57be7117a0474  $root/source/output/source-page.png" | sha256sum -c -
          echo "b48db73b3bab431ef2eb2670880ea46041647e9a1216108ecc0717365b2a19e8  $root/source/output/manifest.json" | sha256sum -c -
          echo "1f37b6aff1897f7ef94353387bd347626cd78d5858dcee3307da0af18d898976  $root/source/output/duplicate-scan.json" | sha256sum -c -
          echo "e70a640970db4eb23d3899d4501cb0018e16ae7f569036e68965a32694575258  $root/source/output/review.json" | sha256sum -c -
          echo "0d7626416912c2a17baff9be9d46bc97c1b7e4a7dd9278e64fe1595b55625a00  $root/source/output/review.md" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-053-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-053-apply"
          node scripts/card-backfill-uc-053-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-053-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-053');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-053');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_9b741f7fe89dac87a1cfd255');
          if(!specimen||specimen.still)throw new Error('UC-053 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-053 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-053'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-053 audit disposition was canonically mutated');
          const preserved=fs.existsSync('images/uc-053-still.jpg');
          console.log(`PASS — UC-053 remains canonically absent; preserved historical byte present=${preserved}; only reviewed evidence was added`);
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-053.json \
            .github/CARD-BACKFILL-UC-053-RENDER.json \
            .github/CARD-BACKFILL-UC-053-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-053-discover.yml \
            .github/workflows/card-backfill-uc-053-render.yml \
            .github/workflows/card-backfill-uc-053-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-053-discover.mjs \
            scripts/card-backfill-uc-053-render.mjs \
            scripts/card-backfill-uc-053-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-053 old Count still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-006...HEAD)
          test "${#changed[@]}" -eq 8
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-053/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-053-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-053-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-007
      - name: Retain materialization, evidence, gate and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-053-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-053-apply
            data/review/card-backfill/UC-053
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
