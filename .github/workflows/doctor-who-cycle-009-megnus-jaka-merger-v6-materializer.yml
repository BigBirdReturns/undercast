name: doctor-who-cycle-009-megnus-jaka-merger-v6-materializer

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-merger-v6-materializer
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer.yml
      TARGET_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-merger-v6
      SOURCE_BLOB: 71b3f8670bf49ca401e93c5f73a437e017c82c34
      SOURCE_SHA256: 94164a53da48cb7b036d61e9aadb4c251aca7d656b7135b2f81e70d2e12b75f2
      PATCHER_CHUNKS: bc8af24be55ca9035190ccd822146cf25654037b,60ff8fe384b72618df7b617e587085d432e02b57,20ac8d91ecc236787e68894fa23099636002c49c,57e56a3a101ae341a426aa26306c223146e48d61,5f52b75cee19f17efed61e20912979dbf8b17697,661c2a3ac901864d0fdd2d0cba76913c14e50d86,11b61e2bca0f23537f1b4070668d10f344724603,d1ca5c9323c86e041fa1dbbaf50c526b70f861e7,1e9453a95589534e82f8ccec8dec58b5b33ae81b
      PATCHER_B64_SHA256: 023e279c83a08790703b378451eaf69b60fad9f309eba8bc578f5f5c80729e6c
      PATCHER_GZIP_SHA256: 03fcaaa58d56ddaaecc32b429349ce520b546f2a64d0a70ec29754ff7f4cd029
      PATCHER_SHA256: e12d55cd2dffbc504a07f243fe55c03d00851fbd31ee924bfe13bab562cdc801
      TARGET_SHA256: fa8df18e4548b940997feda55dd0589e5623eb2da11b71c43a151751a66f52e2
      TARGET_BLOB: 900bfab3834ff03752fa36de8b34bc52356be66d
      RUNNER_CHUNKS: 2cf376c0f0eb9b02ea04a915e9fcc3c55af8a86d,ca434b9ce5bded2972d925591973b54e551a20f5,abda159f42ab09ae67b3cbc0c2f3013d4b74ca8f,7be3b0f4da1b3630b9dd67c7158059ab233408d8,57d724e9ea32b260b3051646fe82870c659ed7cb,0813a4ba4e0f9ae36f8fd492cabba96123489f02,0a7ed1e54343192cdf25deebcaa9d2e8a18422ae
      RUNNER_B64_SHA256: 35b9c3bf6edf476ffce7750a24c15cbb198d89dc06297de1ac963453f8bd5431
      RUNNER_GZIP_SHA256: e0e6559cb4d94195caf32ffea8e01e7fb976f07f2c710fea5c28ba0401cc1848
      RUNNER_SHA256: e8454e9fc4b04509c82404ae0b14f62645459efc53d50085e711c5e1f81137fe
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and execute sealed materializer
        shell: bash
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT/bootstrap"
          IFS=, read -ra chunks <<< "$RUNNER_CHUNKS"
          test "${#chunks[@]}" = 7
          for i in "${!chunks[@]}"; do gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${chunks[$i]}" > "$OUT/bootstrap/$i.json"; done
          ROOT="$OUT" python3 - <<'PY'
          import base64,gzip,hashlib,json,os,re
          from pathlib import Path
          r=Path(os.environ['ROOT']); expected=os.environ['RUNNER_CHUNKS'].split(','); parts=[]
          for i,sha in enumerate(expected):
              row=json.load(open(r/f'bootstrap/{i}.json')); assert row['sha']==sha and row['encoding']=='base64'
              part=base64.b64decode(row['content']).decode('ascii'); assert re.fullmatch(r'[A-Za-z0-9+/=]+',part); parts.append(part)
          assert [len(x) for x in parts]==[512]*6+[120]
          encoded=''.join(parts).encode(); assert hashlib.sha256(encoded).hexdigest()==os.environ['RUNNER_B64_SHA256']
          compressed=base64.b64decode(encoded); assert hashlib.sha256(compressed).hexdigest()==os.environ['RUNNER_GZIP_SHA256']
          program=gzip.decompress(compressed); assert hashlib.sha256(program).hexdigest()==os.environ['RUNNER_SHA256']
          (r/'runner.py.gz.b64').write_bytes(encoded); (r/'runner.py.gz').write_bytes(compressed); (r/'runner.py').write_bytes(program); compile(program,'runner.py','exec')
          PY
          python3 "$OUT/runner.py"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v6-materializer-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-merger-v6-materializer-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-merger-v6-materializer
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
