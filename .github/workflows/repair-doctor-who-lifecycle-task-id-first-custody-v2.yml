name: repair-doctor-who-lifecycle-task-id-first-custody-v2

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-lifecycle-task-id-first-custody-v2
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'agent/doctor-who-lifecycle-task-id-first-custody'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/doctor-who-lifecycle-task-id-first-custody
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute compact-hash carrier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          carrier_path = Path('.github/workflows/repair-doctor-who-lifecycle-task-id-first-custody.yml')
          carrier = carrier_path.read_text()
          marker = '        run: |\n'
          if carrier.count(marker) != 1:
              raise SystemExit(f'carrier run block count={carrier.count(marker)}')
          script = dedent(carrier.split(marker, 1)[1])
          old = "stable_json = json.dumps(stable(hash_document), ensure_ascii=False, indent=2) + '\\n'"
          new = "stable_json = json.dumps(stable(hash_document), ensure_ascii=False, separators=(',', ':')) + '\\n'"
          if script.count(old) != 1:
              raise SystemExit(f'receipt hash anchor count={script.count(old)}')
          Path('/tmp/task-id-first-carrier.sh').write_text(script.replace(old, new, 1))
          PY
          bash /tmp/task-id-first-carrier.sh
