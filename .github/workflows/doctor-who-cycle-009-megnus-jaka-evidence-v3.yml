name: doctor-who-cycle-009-megnus-jaka-evidence-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-evidence-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-evidence-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v3.yml
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-evidence-v2
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3
      PREFLIGHT_RUN: "31237323043"
      PREFLIGHT_JOB: "93052146087"
      PREFLIGHT_ARTIFACT: "9015893321"
      PREFLIGHT_DIGEST: sha256:1a8ec1e3c248d93fccebe342b44eb1d4d2e4b8b069785309180c85d5343adf7c
      PREFLIGHT_HEAD: 2f52b1e546631ac74a227cabf6f0431c8a1470d2
      PREFLIGHT_IDENTITY: e530d17bac039c63278f5ae53c73d071b991e606a9eb4b3b74957f8ead1734b4
      TASK: ap_45bb5fdcdf4aff65aa7a87c3
      PERFORMER: Dan Starkey
      ROLE: Megnus Jaka
      MODE: voice
      SOURCE: https://tardis.fandom.com/wiki/Megnus_Jaka
      PAGEID: "175060"
      REVISION: "3677686"
      SOURCE_TIMESTAMP: "2023-12-19T13:57:50Z"
      SOURCE_BYTES: "721"
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      TARDIS_API: https://tardis.fandom.com/api.php
      PRODUCT: https://www.bigfinish.com/releases/v/doctor-who-the-first-sontarans-418
      NEWS: https://www.bigfinish.com/news/v/doctor-who-the-first-sontarans
      PRODUCT_IMAGE: https://admin.bigfinish.com/storage/images/optimised/fd995076-e237-4ca0-94da-91467049f48f__600x600.webp
      NEWS_IMAGE: https://www.bigfinish.com/image/news/184/large.jpg
      USER_AGENT: Undercast-cycle-009-evidence/3.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-parent one-path carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,routes,evidence,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); pr=json.loads((root/'api/pr.json').read_text()); files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['MAIN'] and pr['head']['sha']==os.environ['HEAD'] and pr['head']['ref']==os.environ['BRANCH']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$MAIN"
          test -z "$(git status --porcelain)"

      - name: Verify current canonical gates and exact preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/evidence/cycle-008.log"
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/evidence/cycle-007.log"
          node scripts/autopilot.mjs validate | tee "$OUT/evidence/autopilot.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/evidence/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/evidence/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/evidence/media-gate.log"
          node scripts/publisher-custody.mjs check-workflows > "$OUT/evidence/publisher-custody.json"
          node scripts/publisher-condition-custody.mjs check-workflows > "$OUT/evidence/publisher-condition-custody.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/evidence/waterline.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN" > "$OUT/api/preflight-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$PREFLIGHT_JOB" > "$OUT/api/preflight-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT" > "$OUT/api/preflight-artifact.json"
          jq -e --argjson id "$PREFLIGHT_RUN" --arg head "$PREFLIGHT_HEAD" '.id==$id and .head_sha==$head and .status=="completed" and .conclusion=="success"' "$OUT/api/preflight-run.json" >/dev/null
          jq -e --argjson id "$PREFLIGHT_JOB" --argjson run "$PREFLIGHT_RUN" '.id==$id and .run_id==$run and .conclusion=="success"' "$OUT/api/preflight-job.json" >/dev/null
          jq -e --argjson id "$PREFLIGHT_ARTIFACT" --arg digest "$PREFLIGHT_DIGEST" '.id==$id and .expired==false and .digest==$digest' "$OUT/api/preflight-artifact.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/preflight.zip"
          test "$(sha256sum "$OUT/preflight.zip"|awk '{print $1}')" = "${PREFLIGHT_DIGEST#sha256:}"
          ZIP="$OUT/preflight.zip" TARGET="$OUT/preflight" python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); t=pathlib.Path(os.environ['TARGET']); t.mkdir(exist_ok=True)
          with zipfile.ZipFile(z) as f:
            names=f.namelist(); assert len(names)==len(set(names))
            for i in f.infolist():
              p=pathlib.PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
              out=t/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(f.read(i))
          PY
          ROOT="$OUT/preflight" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); prefix='/tmp/doctor-who-cycle-009-real-preflight-v1/'
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
            d,o=line.split(None,1); assert o.startswith(prefix); p=root/o[len(prefix):]; assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==d
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          p=json.loads((root/'receipt/selected-task.json').read_text()); identity=p.pop('identity')
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          assert identity==hashlib.sha256(json.dumps(stable(p),separators=(',',':')).encode()).hexdigest()==os.environ['PREFLIGHT_IDENTITY']
          assert p['canonical_gate']['claim_allowed'] is True and p['canonical_gate']['claim_reasons']==[]
          assert p['selected']=={'task_id':os.environ['TASK'],'performer':os.environ['PERFORMER'],'character':os.environ['ROLE'],'performance_modes':[os.environ['MODE']],'priority':800,'source_fingerprint':os.environ['SOURCE_FINGERPRINT']}
          task=p['task']; assert task['id']==os.environ['TASK'] and task['status']=='queued' and not task.get('lease')
          assert task['source_receipts']==[{'source':os.environ['SOURCE'],'pageid':int(os.environ['PAGEID']),'revision':int(os.environ['REVISION']),'timestamp':os.environ['SOURCE_TIMESTAMP'],'content_sha256':os.environ['SOURCE_SHA256']}]
          source=(root/'sources/source-01.wikitext').read_bytes(); assert len(source)==int(os.environ['SOURCE_BYTES']) and hashlib.sha256(source).hexdigest()==os.environ['SOURCE_SHA256']
          assert p['lease_issued'] is False and p['queue_mutated'] is False and p['repository_write'] is False
          (Path(os.environ['OUT'])/'evidence/preflight.json').write_text(json.dumps({**p,'identity':identity},indent=2,sort_keys=True)+'\n')
          (Path(os.environ['OUT'])/'evidence/revision-bound-source.wikitext').write_bytes(source)
          PY

      - name: Recover bounded public production and media evidence
        shell: bash
        run: |
          set -euo pipefail
          fetch(){ n="$1"; shift; set +e; s="$(curl --location --silent --show-error --user-agent "$USER_AGENT" --connect-timeout 20 --max-time 90 --retry 1 --retry-all-errors -D "$OUT/routes/$n.headers" -o "$OUT/routes/$n.body" -w '%{http_code}' "$@")"; r=$?; set -e; printf '%s\n' "$r" > "$OUT/routes/$n.exit"; printf '%s\n' "${s:-000}" > "$OUT/routes/$n.status"; }
          fetch source-page "$SOURCE"
          fetch exact-revision --get "$TARDIS_API" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode prop=revisions --data-urlencode revids="$REVISION" --data-urlencode 'rvprop=ids|timestamp|content' --data-urlencode rvslots=main
          fetch parsed-revision --get "$TARDIS_API" --data-urlencode action=parse --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode oldid="$REVISION" --data-urlencode 'prop=images|externallinks|wikitext'
          fetch product "$PRODUCT"
          fetch news "$NEWS"
          fetch product-image "$PRODUCT_IMAGE"
          fetch news-image "$NEWS_IMAGE"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,html,json,os,re
          from pathlib import Path
          root=Path(os.environ['ROOT']); routes=root/'routes'; names=['source-page','exact-revision','parsed-revision','product','news','product-image','news-image']; rows=[]
          for n in names:
            b=(routes/f'{n}.body').read_bytes(); status=(routes/f'{n}.status').read_text().strip(); rc=int((routes/f'{n}.exit').read_text()); rows.append({'route':n,'curl_exit':rc,'http_status':status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'successful':rc==0 and status.startswith('2')})
          assert all(x['successful'] for x in rows)
          q=json.loads((routes/'exact-revision.body').read_text()); page=q['query']['pages'][0]; rev=page['revisions'][0]; content=rev['slots']['main']['content']
          assert page['pageid']==int(os.environ['PAGEID']) and rev['revid']==int(os.environ['REVISION']) and rev['timestamp']==os.environ['SOURCE_TIMESTAMP']
          assert len(content.encode())==int(os.environ['SOURCE_BYTES']) and hashlib.sha256(content.encode()).hexdigest()==os.environ['SOURCE_SHA256']
          assert content==(root/'evidence/revision-bound-source.wikitext').read_text()
          m=re.search(r'(?mi)^\|image\s*=\s*(.*)$',content); assert m and m.group(1).strip()==''
          parsed=json.loads((routes/'parsed-revision.body').read_text()); images=sorted(dict.fromkeys(parsed.get('parse',{}).get('images',[])))
          def plain(n): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',(routes/f'{n}.body').read_text(errors='replace')))).strip()
          product=plain('product'); news=plain('news')
          for needle in ('Doctor Who: The First Sontarans','Released July 2012','Dan Starkey'): assert needle.casefold() in product.casefold(),needle
          assert re.search(r'Dan Starkey.{0,180}(?:the Sontaran )?Jaka|Jaka.{0,180}Dan Starkey',news,re.I)
          assets=[]
          for n,url,kind in [('product-image',os.environ['PRODUCT_IMAGE'],'official-product-cover'),('news-image',os.environ['NEWS_IMAGE'],'official-news-image')]:
            row=next(x for x in rows if x['route']==n); assets.append({'kind':kind,'url':url,'bytes':row['bytes'],'sha256':row['sha256'],'visual_disposition':'candidate-requires-independent-review','adopted':False,'character_identity_claimed':False,'performer_identity_claimed':False})
          state=json.loads(Path('data/AUTOPILOT.json').read_text()); task=next(x for x in state['jobs'] if x['id']==os.environ['TASK']); assert task['status']=='queued' and not task.get('lease')
          specimens=json.loads(Path('data/specimens.json').read_text()); cards=[x for x in specimens if x.get('actor')==os.environ['PERFORMER']]
          audit=json.loads(Path('data/MEDIA-AUDIT.json').read_text()); facets=[x for x in audit.get('items',[]) if x.get('actor')==os.environ['PERFORMER']]; portraits=[x for x in facets if x.get('side')=='portrait']
          evidence={'source':{'url':os.environ['SOURCE'],'pageid':page['pageid'],'revision':rev['revid'],'timestamp':rev['timestamp'],'bytes':len(content.encode()),'sha256':hashlib.sha256(content.encode()).hexdigest(),'infobox_image_declared':False,'referenced_images':images},'production':{'title':'Doctor Who: The First Sontarans','released':'July 2012','product_url':os.environ['PRODUCT'],'news_url':os.environ['NEWS'],'product_names_dan_starkey':True,'news_names_dan_starkey_as_jaka':True},'assets':assets,'existing_dan_starkey_cards':len(cards),'existing_dan_starkey_portrait_facets':len(portraits),'duplicate_performer_portrait_adoption_forbidden':True,'routes':rows}
          (root/'evidence/public-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          for n in ('product-image','news-image'): (root/f'evidence/{n}.bin').write_bytes((routes/f'{n}.body').read_bytes())
          receipt={'status':'cycle-009-megnus-jaka-evidence-recovered','run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'canonical_main':os.environ['MAIN'],'preflight_run':int(os.environ['PREFLIGHT_RUN']),'preflight_artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'preflight_artifact_digest':os.environ['PREFLIGHT_DIGEST'],'preflight_identity':os.environ['PREFLIGHT_IDENTITY'],'task_id':os.environ['TASK'],'performer':os.environ['PERFORMER'],'role':os.environ['ROLE'],'performance_mode':os.environ['MODE'],'source_pageid':page['pageid'],'source_revision':rev['revid'],'source_sha256':os.environ['SOURCE_SHA256'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],'source_infobox_image_declared':False,'production':'The First Sontarans','official_product_names_dan_starkey':True,'official_news_names_dan_starkey_as_jaka':True,'candidate_asset_count':len(assets),'media_adopted':False,'lease_issued':False,'queue_mutated':False,'canonical_record_created':False,'cycle_receipt_written':False,'repository_write':False,'cycle_009_product_authorized':False,'login_attempts':0,'api_keys_used':0,'captcha_or_waf_bypass_attempts':0,'outside_human_dependency':False,'owner_physical_action_required':False,'next_gate':'independent visual disposition and exact lease/candidate materialization'}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/'receipt/evidence-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          cp "$OUT/evidence/public-evidence.json" "$OUT/receipt/"
          cp "$OUT/evidence/revision-bound-source.wikitext" "$OUT/receipt/"
          cp "$OUT/evidence/product-image.bin" "$OUT/receipt/"
          cp "$OUT/evidence/news-image.bin" "$OUT/receipt/"
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          test -z "$(git status --porcelain)"

      - name: Upload immutable evidence packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
