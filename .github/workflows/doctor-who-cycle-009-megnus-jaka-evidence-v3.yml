name: doctor-who-cycle-009-megnus-jaka-evidence-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-evidence-v3
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-evidence-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 759589336a140487ebf3baad8c3f95fd9943b16b
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-evidence-v3.yml
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-evidence-v3
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3
      PREFLIGHT_RUN: "31237323043"
      PREFLIGHT_ARTIFACT: "9015893321"
      PREFLIGHT_ZIP_SHA256: 1a8ec1e3c248d93fccebe342b44eb1d4d2e4b8b069785309180c85d5343adf7c
      PREFLIGHT_IDENTITY: e530d17bac039c63278f5ae53c73d071b991e606a9eb4b3b74957f8ead1734b4
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      SOURCE_URL: https://tardis.fandom.com/wiki/Megnus_Jaka
      SOURCE_PAGEID: "175060"
      SOURCE_REVISION: "3677686"
      SOURCE_TIMESTAMP: 2023-12-19T13:57:50Z
      SOURCE_SHA256: 6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4
      SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
      PRODUCT_URL: https://www.bigfinish.com/releases/v/doctor-who-the-first-sontarans-418
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact one-commit carrier and current composable main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,evidence,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" > "$OUT/api/files.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          assert pr['number']==int(os.environ['PR']) and pr['state']=='open' and pr['draft'] is True
          assert pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"

      - name: Verify composability, live gates, and immutable preflight
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/evidence/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/evidence/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/evidence/status.json"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/evidence/waterline.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/evidence/waterline-gate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/evidence/media-gate.log"
          jq -e '.total==316 and .statuses.queued==308 and .statuses.resolved==8 and .in_flight==0' "$OUT/evidence/status.json" >/dev/null
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/evidence/waterline.json" >/dev/null
          python3 - <<'PY'
          import json
          row=json.load(open('data/review/adapter-sdk/doctor-who-cycle-008-composability.json'))
          assert row['transaction']=='DOCTOR-WHO-CYCLE-008-COMPOSABILITY-001'
          assert row['boundary']['later_cycles_allowed'] is True
          assert row['boundary']['maximum_unreceipted_tasks']==1
          assert row['boundary']['cycle_009_lease_issued'] is False
          assert row['boundary']['queue_changed'] is False and row['boundary']['corpus_changed'] is False
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PREFLIGHT_ARTIFACT/zip" > "$OUT/preflight.zip"
          test "$(sha256sum "$OUT/preflight.zip" | cut -d' ' -f1)" = "$PREFLIGHT_ZIP_SHA256"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); dst=root/'preflight'
          with zipfile.ZipFile(root/'preflight.zip') as z:
              for i in z.infolist():
                  p=PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts
                  if not i.is_dir():
                      out=dst/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(i))
          packet=json.loads((dst/'receipt/selected-task.json').read_text())
          identity=packet.pop('identity')
          def stable(v):
              if isinstance(v,list): return [stable(x) for x in v]
              if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
              return v
          assert identity==os.environ['PREFLIGHT_IDENTITY']==hashlib.sha256(json.dumps(stable(packet),separators=(',',':')).encode()).hexdigest()
          assert packet['canonical_gate']['claim_allowed'] is True
          assert packet['task']['id']==os.environ['TASK_ID']
          assert packet['task']['source_fingerprint']==os.environ['SOURCE_FINGERPRINT']
          assert packet['lease_issued'] is False and packet['queue_mutated'] is False
          PY

      - name: Recover revision, official product, cover, and performer custody
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const env=process.env, out=env.OUT;
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const api=new URL('/api.php',new URL(env.SOURCE_URL).origin);
          api.search=new URLSearchParams({action:'query',prop:'revisions|pageimages|images',revids:env.SOURCE_REVISION,rvprop:'ids|timestamp|content',rvslots:'main',piprop:'original|thumbnail|name',imlimit:'max',format:'json',formatversion:'2',origin:'*'});
          const mw=await fetch(api,{headers:{'user-agent':'Undercast cycle-009 evidence/3.0'}});
          if(!mw.ok) throw new Error(`MediaWiki ${mw.status}`);
          const doc=await mw.json(), page=doc.query.pages[0], rev=page.revisions[0];
          const content=rev.slots.main.content;
          if(page.pageid!==Number(env.SOURCE_PAGEID)||rev.revid!==Number(env.SOURCE_REVISION)||rev.timestamp!==env.SOURCE_TIMESTAMP) throw new Error('revision identity drift');
          if(sha(Buffer.from(content))!==env.SOURCE_SHA256) throw new Error('revision digest drift');
          if(!/^\|image\s*=\s*$/m.test(content)||!/^\|voice actor\s*=\s*Dan Starkey\s*$/mi.test(content)||!/^\|only\s*=\s*The First Sontarans \(audio story\)\s*$/mi.test(content)) throw new Error('source semantics drift');
          if(page.original||page.thumbnail||page.pageimage) throw new Error('unexpected lead image');
          fs.writeFileSync(`${out}/evidence/source.wikitext`,content);
          fs.writeFileSync(`${out}/evidence/mediawiki.json`,JSON.stringify({pageid:page.pageid,revision:rev.revid,timestamp:rev.timestamp,bytes:Buffer.byteLength(content),sha256:sha(Buffer.from(content)),lead_image:null,referenced_images:(page.images||[]).map(x=>x.title).sort()},null,2)+'\n');

          const product=await fetch(env.PRODUCT_URL,{headers:{'user-agent':'Undercast cycle-009 evidence/3.0'}});
          if(!product.ok) throw new Error(`Big Finish ${product.status}`);
          const html=await product.text(), plain=html.replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');
          for(const needle of ['Doctor Who: The First Sontarans','Released July 2012','Dan Starkey']) if(!plain.includes(needle)) throw new Error(`product evidence missing ${needle}`);
          let m=html.match(/<meta[^>]+(?:property|name)=["']og:image["'][^>]+content=["']([^"']+)["']/i)||html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:image["']/i);
          if(!m) throw new Error('cover metadata missing');
          const coverUrl=new URL(m[1].replace(/&amp;/g,'&'),env.PRODUCT_URL).href;
          const cover=await fetch(coverUrl,{headers:{'user-agent':'Undercast cycle-009 evidence/3.0'}});
          if(!cover.ok) throw new Error(`cover ${cover.status}`);
          const coverBytes=Buffer.from(await cover.arrayBuffer());
          fs.writeFileSync(`${out}/evidence/product.html`,html);
          fs.writeFileSync(`${out}/evidence/cover.bin`,coverBytes);

          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const cards=specimens.filter(x=>x.actor==='Dan Starkey').map(x=>x.id).sort();
          const portraits=(audit.items||[]).filter(x=>x.actor==='Dan Starkey'&&x.side==='portrait').map(x=>({wall_id:x.wall_id,status:x.status,sha256:x.asset?.sha256||null})).sort((a,b)=>a.wall_id.localeCompare(b.wall_id));
          if(!cards.length||!portraits.length) throw new Error('Dan Starkey custody missing');
          fs.writeFileSync(`${out}/evidence/production-media.json`,JSON.stringify({product_url:env.PRODUCT_URL,production:'The First Sontarans',release:'July 2012',performer:'Dan Starkey',role:'Megnus Jaka',cover:{url:coverUrl,bytes:coverBytes.length,sha256:sha(coverBytes),content_type:cover.headers.get('content-type'),adopted:false,visual_disposition:'pending-independent-review'},existing_cards:cards,portrait_facets:portraits,duplicate_portrait_adoption_forbidden:true},null,2)+'\n');
          NODE

      - name: Seal and upload evidence receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); mw=json.loads((root/'evidence/mediawiki.json').read_text()); pm=json.loads((root/'evidence/production-media.json').read_text())
          r={'status':'cycle-009-megnus-jaka-evidence-recovered','canonical_main':os.environ['EXACT_MAIN'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'carrier_pr':int(os.environ['CARRIER_PR']),'carrier_head':os.environ['CARRIER_HEAD'],'preflight_run':int(os.environ['PREFLIGHT_RUN']),'preflight_artifact':int(os.environ['PREFLIGHT_ARTIFACT']),'preflight_identity':os.environ['PREFLIGHT_IDENTITY'],'task_id':os.environ['TASK_ID'],'performer':'Dan Starkey','role':'Megnus Jaka','performance_mode':'voice','source_url':os.environ['SOURCE_URL'],'source_pageid':mw['pageid'],'source_revision':mw['revision'],'source_content_sha256':mw['sha256'],'source_fingerprint':os.environ['SOURCE_FINGERPRINT'],'source_lead_image':None,'source_referenced_image_count':len(mw['referenced_images']),'production':pm['production'],'release':pm['release'],'official_product_url':pm['product_url'],'official_cover':pm['cover'],'existing_dan_starkey_card_count':len(pm['existing_cards']),'existing_dan_starkey_portrait_facet_count':len(pm['portrait_facets']),'provisional_character_still':'absent-pending-cover-review','provisional_performer_portrait':'absent-no-duplicate-adoption','lease_issued':False,'queue_mutated':False,'canonical_record_created':False,'media_adopted':False,'cycle_receipt_written':False,'repository_write':False,'outside_human_dependency':False,'owner_physical_action_required':False,'next_gate':'independent visual disposition then exact lease/candidate materialization'}
          r['identity']=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/evidence.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          for p in root.joinpath('evidence').iterdir():
              if p.is_file(): root.joinpath('receipt',p.name).write_bytes(p.read_bytes())
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-evidence-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-evidence-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
