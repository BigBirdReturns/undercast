name: star-trek-kzinti-controller-text-export-v1

on:
  push:
    branches:
      - agent/star-trek-kzinti-controller-text-export-v1

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 640754cdeb5a7679790682ab6c28070c28ca9fae
      ARTIFACT_ID: '9427791580'
      ARTIFACT_SHA: 87ec11085fb33abfdb2aeb81128cb487e856812ddd410ea1c627df73e083c402
      RESULT_BRANCH: agent/star-trek-kzinti-controller-text-result-v1
      ROOT: /tmp/kzinti-controller-text-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract exact controller text
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/kzinti-controller-text-v1.zip
          mkdir -p "$ROOT/extracted"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r .expired <<<"$meta")" = false
          test "$(jq -r .name <<<"$meta")" = star-trek-kzinti-flyer-controller-execution-registry-repair-v1
          test "$(jq -r .digest <<<"$meta")" = "sha256:${ARTIFACT_SHA}"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/kzinti-controller-text-v1.zip
          echo "$ARTIFACT_SHA  /tmp/kzinti-controller-text-v1.zip" | sha256sum -c -
          unzip -q /tmp/kzinti-controller-text-v1.zip -d "$ROOT/extracted"
          programs="$(dirname "$(find "$ROOT/extracted" -type f -name unitkzintiflyer-controller.sh -print -quit)")"
          test -n "$programs"
          mkdir -p "$ROOT/programs"
          cp "$programs"/unitkzintiflyer-* "$ROOT/programs/"
          for file in "$ROOT/programs"/*.mjs; do node --check "$file"; done
          bash -n "$ROOT/programs/unitkzintiflyer-controller.sh"
          find "$ROOT/programs" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/manifest.sha256"
      - name: Publish exact text snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/kzinti-controller-text-v1
          mkdir -p transport/kzinti-controller-text-v1
          cp -a "$ROOT/programs" transport/kzinti-controller-text-v1/
          cp "$ROOT/manifest.sha256" transport/kzinti-controller-text-v1/
          jq -n --argjson version 1 --arg transaction STAR-TREK-KZINTI-CONTROLLER-TEXT-EXPORT-V1 --arg status success --argjson workflow_run "$GITHUB_RUN_ID" --arg workflow_head "$GITHUB_SHA" --arg canonical_parent "$EXPECTED_MAIN" --argjson artifact_id "$ARTIFACT_ID" --arg artifact_sha256 "$ARTIFACT_SHA" '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,canonical_parent:$canonical_parent,source_artifact:{id:$artifact_id,sha256:$artifact_sha256},canonical_mutation:false,lease_taken:false}' > transport/kzinti-controller-text-v1/receipt.json
          git config user.name undercast-kzinti-controller-text
          git config user.email kzinti-controller-text@users.noreply.github.com
          git add -- transport/kzinti-controller-text-v1
          git commit -m 'Kzinti Flyer: publish controller text snapshot'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
