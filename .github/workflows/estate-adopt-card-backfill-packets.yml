name: estate-adopt-card-backfill-packets-retired

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-adopt-card-backfill-packets-retired
  cancel-in-progress: true

jobs:
  verify-paid-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify COLLECT-003 remains paid and cumulatively accounted
        run: |
          set -euo pipefail
          test -f data/review/estate-debt/COLLECT-003-CANONICAL-ADOPTION.json
          test "$(node -p "require('./data/review/estate-debt/COLLECT-003-CANONICAL-ADOPTION.json').status")" = paid
          test "$(node -p "require('./data/review/estate-debt/COLLECT-003-CANONICAL-ADOPTION.json').counts.canonical_adoptions")" = 5
          node scripts/estate-canonical-adoption-ledger.mjs
          echo 'PASS — COLLECT-003 mutation authority is retired; future batches require a new bounded plan and receipt.'
