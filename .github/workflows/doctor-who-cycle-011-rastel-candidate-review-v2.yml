name: doctor-who-cycle-011-rastel-candidate-review-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-review-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-review-v2
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-review-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-review-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-review-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-review-v2
      SRC: /tmp/doctor-who-cycle-011-rastel-candidate-review-v2-source
      WORK: /tmp/doctor-who-cycle-011-rastel-candidate-review-v2-worktree
      TRANSPORT: /tmp/doctor-who-cycle-011-rastel-candidate-review-v2-transport

      V1_PR: "768"
      V1_HEAD: 0a433eec5b33ce328e9509b5b3daf5789465538e
      V1_RUN: "31333748184"
      V1_JOB: "93296031386"
      V1_ARTIFACT: "9043686562"
      V1_ARTIFACT_DIGEST: sha256:f1e4bfa115af1ac38ce1dc986d75526b3e21d97c722acad05ff7620f67115508
      V1_ARTIFACT_FILES: "12"

      SOURCE_PR: "764"
      SOURCE_HEAD: 5cb7aa31683e93be66cda1e183f952b247660cf1
      SOURCE_RUN: "31333047499"
      SOURCE_JOB: "93294232952"
      SOURCE_ARTIFACT: "9043522453"
      SOURCE_ZIP_SHA256: 9ddec6d920d2a443ce0d495b6cfd6d7327d6036c0594757773569b97b032ad49
      SOURCE_FILES: "362"
      LEDGER_ENTRIES: "54"

      CANDIDATE_IDENTITY: 180ad04ea2288e0f3f99b59991d90b35c6fcc8d640c18fd9af33dbb250082626
      CANDIDATE_COMMIT: 244def71baddd9bdf4591384438b041894d868a1
      CANDIDATE_TREE: 237226254d6ab45b796b7dbf427f4ac21d765d92
      CANDIDATE_PATHS: "38"
      LEASE_ID: lease_cc1c8a2f720f9e11f07f9c2d

      PATHS_SHA256: ed6a06dee98e62a676235f7b1381a59d460a315526cd2ca8e06f990f9ecc9a9a
      PATH_POLICY_SHA256: f29da4fb85d521d518faff40fea84e5da9f430bdb1f401933f90b9b66ac57d29
      FILE_MANIFEST_SHA256: ca1f0ac0a7cf3e50ff4309979ecd4c5c9625719726fee6adac9cc1f300164815
      DELTA_MANIFEST_SHA256: 68756591458f0df50533c0b4ded7980cbdd7549eb3a76bc1b52a950134a9f369
      PATCH_SHA256: 3b91b402786e56ad4efb3d70aa2996bc0d3dbc4a338b66a904d96f192f9f19d7
      BUNDLE_SHA256: 73845e2a6f6267257df53151ebca198c7f75b4ffdc69468cd201f5b0454ae2fd
      TAR_SHA256: 4f7848127b48071c32f0ed1fc9786fb3c1200ac6135559bf6dddfb3f30af8059
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

      V2_IDENTITY: 7f6a131ac6e04aec0696b82cbb6a4637d4e0024ecf0e452c66a18f7ac6c68dd9
      V6_IDENTITY: 3329fabe553b759fb2249c972496354bcd8badb489e9b319d093d914e375585a
      V7_IDENTITY: f0e16fbabf33263ab718a40f765f6a0de927559c8155222ca5176551d6bee6ce
      V8_IDENTITY: 4080051f3dec29207d0b9e99857ca616c00964f3c53e1fc610da139c27748b4d

      CYCLE009_SHA256: ad86e82591ebbeb6fd24e72dba87aba9ac062104bd23904d073ee88d8aa1f021
      CYCLE010_SHA256: 52318d988bef4d03a46afa0dad6c0a6e487e96afc32cbe59e800a0c1c028280f

      REVIEWER_BLOBS: "458dbc4ac9512f343f634af0ebf2771a7ec14f19 a22cb4d75d7bc2bf07a99a636d4bc0747a66efae 26360dcec222667d8abae12f7a29843859c91d21"
      REVIEWER_CHUNK_BYTES: "3000 3000 2880"
      REVIEWER_CHUNK_SHA256: "bb0c0986aeb4591ea8449b128f1a1a809ac02b57319adc41b17df730d2dd9f4e 04925ff28a1fbc2ff09d80f999f84ac3202548d240549452261c3a6bba3c5421 2c22c1c5216607c44cc7d7cdaff2aed0d0ff5afb9f3a6069f4f13bbd4f91a319"
      REVIEWER_B64_BYTES: "8880"
      REVIEWER_B64_SHA256: e97089dbf1fde79bc9f88a0395fa32c1d8af5c06aa7bf7ab8db9ec53a7e63229
      REVIEWER_GZIP_BYTES: "6658"
      REVIEWER_GZIP_SHA256: 66498bc08afe533810e4bc94de90ac2a8b16d4d33b57665f61f348d8d595d009
      REVIEWER_BYTES: "25399"
      REVIEWER_SHA256: b04ac3f4368d87a5146b134e2dea3446a1b782c91a0f3b64d46d68ff823d8fde

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V1 outer-file denominator failure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TRANSPORT"
          mkdir -p "$TRANSPORT"/api
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$TRANSPORT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V1_PR" > "$TRANSPORT/api/v1-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" > "$TRANSPORT/api/v1-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN/jobs?per_page=100" > "$TRANSPORT/api/v1-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT" > "$TRANSPORT/api/v1-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT/zip" > "$TRANSPORT/v1.zip"
          test "$(sha256sum "$TRANSPORT/v1.zip" | awk '{print $1}')" = "${V1_ARTIFACT_DIGEST#sha256:}"
          ROOT="$TRANSPORT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import hashlib,io,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); api=root/'api'; sha=lambda b:hashlib.sha256(b).hexdigest()
          load=lambda n:json.loads((api/n).read_text())
          own=load('carrier.json'); v1=load('v1-pr.json'); run=load('v1-run.json'); jobs=load('v1-jobs.json')['jobs']; artifact=load('v1-artifact.json')
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['sha']==os.environ['HEAD'] and own['head']['ref']==os.environ['BRANCH']
          assert own['commits']==1 and own['changed_files']==1
          assert v1['number']==int(os.environ['V1_PR']) and v1['state']=='open' and v1['draft'] is True and v1['merged'] is False
          assert v1['base']['sha']==os.environ['MAIN'] and v1['head']['sha']==os.environ['V1_HEAD'] and v1['head']['ref']=='agent/doctor-who-cycle-011-rastel-candidate-review-v1'
          assert run['id']==int(os.environ['V1_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-review-v1'
          assert run['head_sha']==os.environ['V1_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['V1_JOB']))
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Reconstruct exact independent reviewer']==('completed','success')
          assert steps['Execute exact independent candidate reconstruction and gate']==('completed','failure')
          assert artifact['id']==int(os.environ['V1_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['V1_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['V1_RUN']) and artifact['workflow_run']['head_sha']==os.environ['V1_HEAD']
          with zipfile.ZipFile(root/'v1.zip') as outer:
              files=[row for row in outer.infolist() if not row.is_dir()]
              assert len(files)==int(os.environ['V1_ARTIFACT_FILES']) and len(files)==len({row.filename for row in files})
              for row in files:
                  p=PurePosixPath(row.filename); assert not p.is_absolute() and '..' not in p.parts
              source_rows=[row for row in files if row.filename.endswith('/source.zip')]
              reviewer_rows=[row for row in files if row.filename.endswith('/reviewer.sh')]
              assert len(source_rows)==1 and len(reviewer_rows)==1
              source_bytes=outer.read(source_rows[0]); reviewer_bytes=outer.read(reviewer_rows[0])
          assert sha(source_bytes)==os.environ['SOURCE_ZIP_SHA256']
          assert len(reviewer_bytes)==int(os.environ['REVIEWER_BYTES']) and sha(reviewer_bytes)==os.environ['REVIEWER_SHA256']
          with zipfile.ZipFile(io.BytesIO(source_bytes)) as source:
              source_files=[row for row in source.infolist() if not row.is_dir()]
              assert len(source_files)==362 and len(source_files)==len({row.filename for row in source_files})
          repair={
            'version':1,'status':'cycle-011-rastel-candidate-review-v2-outer-file-denominator-repair',
            'carrier':{'pr':int(os.environ['PR']),'head':os.environ['HEAD'],'base':os.environ['MAIN']},
            'failed_v1':{'pr':int(os.environ['V1_PR']),'head':os.environ['V1_HEAD'],'run':int(os.environ['V1_RUN']),'job':int(os.environ['V1_JOB']),'artifact':int(os.environ['V1_ARTIFACT']),'artifact_digest':os.environ['V1_ARTIFACT_DIGEST'],'artifact_files':len(files),'reviewer_sha256':sha(reviewer_bytes)},
            'repair':{'old_source_file_denominator':363,'new_source_file_denominator':len(source_files),'source_zip_sha256':sha(source_bytes),'other_reviewer_bytes_changed':False},
            'boundary':{'review_only':True,'repository_write':False,'product_published':False,'canonical_mutation':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          repair['identity']=sha(json.dumps(repair,sort_keys=True,separators=(',',':')).encode())
          (root/'v2-denominator-repair.json').write_text(json.dumps(repair,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CURRENT_HEAD=%s\nCURRENT_PR=%s\nCURRENT_BASE=%s\n' "$head" "$pr" "$base" >> "$GITHUB_ENV"

      - name: Reconstruct exact independent reviewer
        shell: bash
        run: |
          set -euo pipefail
          : > "$TRANSPORT/reviewer.sh.gz.b64"
          read -r -a blobs <<< "$REVIEWER_BLOBS"
          read -r -a sizes <<< "$REVIEWER_CHUNK_BYTES"
          read -r -a hashes <<< "$REVIEWER_CHUNK_SHA256"
          test "${#blobs[@]}" = 3
          for index in 0 1 2; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$TRANSPORT/chunk.$index"
            test "$(wc -c < "$TRANSPORT/chunk.$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$TRANSPORT/chunk.$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$TRANSPORT/chunk.$index" >> "$TRANSPORT/reviewer.sh.gz.b64"
          done
          test "$(wc -c < "$TRANSPORT/reviewer.sh.gz.b64" | tr -d ' ')" = "$REVIEWER_B64_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh.gz.b64" | awk '{print $1}')" = "$REVIEWER_B64_SHA256"
          base64 -d "$TRANSPORT/reviewer.sh.gz.b64" > "$TRANSPORT/reviewer.sh.gz"
          test "$(wc -c < "$TRANSPORT/reviewer.sh.gz" | tr -d ' ')" = "$REVIEWER_GZIP_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh.gz" | awk '{print $1}')" = "$REVIEWER_GZIP_SHA256"
          gzip -dc "$TRANSPORT/reviewer.sh.gz" > "$TRANSPORT/reviewer.sh"
          test "$(wc -c < "$TRANSPORT/reviewer.sh" | tr -d ' ')" = "$REVIEWER_BYTES"
          test "$(sha256sum "$TRANSPORT/reviewer.sh" | awk '{print $1}')" = "$REVIEWER_SHA256"
          bash -n "$TRANSPORT/reviewer.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-review-v2-transport/reviewer.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<rastel-independent-review-v2-{index}>','exec')
          PY

      - name: Execute exact independent candidate reconstruction and gate
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$TRANSPORT/reviewer.sh"
          CURRENT_HEAD="$CURRENT_HEAD" CURRENT_PR="$CURRENT_PR" CURRENT_BASE="$CURRENT_BASE" "$TRANSPORT/reviewer.sh"
          mkdir -p "$OUT/transport"
          cp "$TRANSPORT/v2-denominator-repair.json" "$OUT/transport/v2-denominator-repair.json"
          ROOT="$OUT" REPAIR="$TRANSPORT/v2-denominator-repair.json" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); repair=json.loads(Path(os.environ['REPAIR']).read_text()); approval_path=root/'review/approval.json'
          approval=json.loads(approval_path.read_text()); approval.pop('identity')
          approval['transport_repair']={'status':repair['status'],'identity':repair['identity'],'old_source_file_denominator':363,'new_source_file_denominator':362}
          approval['identity']=hashlib.sha256(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          approval_path.write_text(json.dumps(approval,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          for name in ('SHA256SUMS.pre','SHA256SUMS'):
              p=root/name
              if p.exists(): p.unlink()
          PY
          cd "$OUT"
          find . -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$rel"; done > SHA256SUMS.pre
          sha256sum SHA256SUMS.pre > SHA256SUMS
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          for raw in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest,name=raw.split(None,1); p=root/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          approval=json.loads((root/'review/approval.json').read_text()); identity=approval.pop('identity')
          assert hashlib.sha256(json.dumps(approval,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==identity
          assert approval['transport_repair']['new_source_file_denominator']==362
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-review-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-review-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-review-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v2
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v2-source
            /tmp/doctor-who-cycle-011-rastel-candidate-review-v2-transport
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
