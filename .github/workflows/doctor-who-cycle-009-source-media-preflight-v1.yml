name: doctor-who-cycle-009-source-media-preflight-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-source-media-preflight-v1.yml"
  workflow_run:
    workflows: ["doctor-who-cycle-009-eligibility-release-v1"]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-009-source-media-preflight-v1-${{ github.event_name }}
  cancel-in-progress: false

env:
  FLOOR_MAIN: 47ccb38eab6a4b6e2a16ed92b04f1259b95de783
  INSTALL_MAIN: db43ab7eb7323337ad843ea92317e91466478733
  RELEASE_PATH: .github/workflows/doctor-who-cycle-009-eligibility-release-v1.yml
  RELEASE_BLOB: 60a4ce24a0d4c56e96e97303a0f7cb603d48f200
  SELF: .github/workflows/doctor-who-cycle-009-source-media-preflight-v1.yml
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-009-source-media-preflight-v1
  RELEASE_WORKFLOW: doctor-who-cycle-009-eligibility-release-v1
  ELIGIBLE_AT: "2026-08-08T20:42:01.000Z"

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-source-media-preflight-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      OUT: /tmp/doctor-who-cycle-009-source-media-preflight-v1-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bind exact one-path workflow-only successor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT/receipt"
          head='${{ github.event.pull_request.head.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$INSTALL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALL_MAIN"
          test "$(git rev-list --count "$INSTALL_MAIN"..HEAD)" = 1
          test "$(git diff --name-only "$INSTALL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$INSTALL_MAIN"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$INSTALL_MAIN"
          test "$(git rev-parse "$INSTALL_MAIN:$RELEASE_PATH")" = "$RELEASE_BLOB"
          test -z "$(git status --porcelain)"
      - name: Qualify read-only custody and permanent controls
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs validate
          node scripts/publisher-custody.mjs check-workflows
          node scripts/publisher-condition-custody.mjs check-workflows
          node scripts/gate-fixtures.mjs
          SELF="$SELF" python3 - <<'PY'
          import os,yaml
          doc=yaml.safe_load(open(os.environ['SELF']))
          assert doc['permissions']=={}
          assert set(doc['jobs'])=={'qualify','preflight'}
          assert doc['jobs']['preflight']['permissions']=={'contents':'read','actions':'read'}
          text=open(os.environ['SELF']).read()
          for forbidden in ('git push','git update-ref','/git/refs','pulls --method POST','contents: write','pull-requests: write'):
            assert forbidden not in text,forbidden
          PY
          test -z "$(git status --porcelain)"
      - name: Seal installation qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" HEAD='${{ github.event.pull_request.head.sha }}' PR='${{ github.event.pull_request.number }}' python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          r={'status':'qualified-post-boundary-source-media-preflight','carrier_pr':int(os.environ['PR']),'carrier_head':os.environ['HEAD'],'parent_main':os.environ['INSTALL_MAIN'],'workflow_path':os.environ['SELF'],'release_workflow':os.environ['RELEASE_WORKFLOW'],'eligible_at':os.environ['ELIGIBLE_AT'],'candidate_identity_embedded':False,'repository_write':False,'queue_mutated':False,'lease_issued':False,'cycle_009_lease_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          r['identity']=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          p=Path(os.environ['ROOT'])/'receipt'; (p/'installation-qualification.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
      - name: Upload installation qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-source-media-preflight-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-source-media-preflight-v1-qualification/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  preflight:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'doctor-who-cycle-009-eligibility-release-v1' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
      OUT: /tmp/doctor-who-cycle-009-source-media-preflight-v1
      API: https://tardis.fandom.com/api.php
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Bind exact successful release and code-free artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,release,routes,receipt,diagnostics}
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse "$SOURCE_HEAD:$RELEASE_PATH")" = "$RELEASE_BLOB"
          test "$(git rev-parse "$SOURCE_HEAD:$SELF")" = "$(git hash-object "$SELF")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          jq -e --argjson id "$SOURCE_RUN" --argjson attempt "$SOURCE_ATTEMPT" --arg head "$SOURCE_HEAD" --arg name "$RELEASE_WORKFLOW" '.id==$id and .run_attempt==$attempt and .head_sha==$head and .head_branch=="main" and .name==$name and .event=="schedule" and .status=="completed" and .conclusion=="success"' "$OUT/api/source-run.json" >/dev/null
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$OUT/api/artifacts.json"
          artifact="$(jq -c --arg name "doctor-who-cycle-009-selection-release-v1-$SOURCE_RUN-attempt-$SOURCE_ATTEMPT" '[.artifacts[]|select(.name==$name and .expired==false)]|if length==1 then .[0] else empty end' "$OUT/api/artifacts.json")"
          test -n "$artifact"
          id="$(jq -r .id <<<"$artifact")"; digest="$(jq -r .digest <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$OUT/release.zip"
          test "$(sha256sum "$OUT/release.zip"|awk '{print $1}')" = "${digest#sha256:}"
          ZIP="$OUT/release.zip" TARGET="$OUT/release" python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); t=pathlib.Path(os.environ['TARGET'])
          with zipfile.ZipFile(z) as f:
            names=f.namelist(); assert len(names)==len(set(names))
            for i in f.infolist():
              p=pathlib.PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
              out=t/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(f.read(i))
          PY
          ROOT="$OUT/release" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['ROOT'])
          for line in (p/'SHA256SUMS.pre').read_text().splitlines():
            d,o=line.split(None,1); q=p/Path(o).name; assert q.is_file() and hashlib.sha256(q.read_bytes()).hexdigest()==d
          assert hashlib.sha256((p/'SHA256SUMS.pre').read_bytes()).hexdigest()==(p/'SHA256SUMS').read_text().split()[0]
          r=json.loads((p/'cycle-009-selection-release.json').read_text()); i=r.pop('identity')
          def stable(v):
            if isinstance(v,list): return [stable(x) for x in v]
            if isinstance(v,dict): return {k:stable(v[k]) for k in sorted(v)}
            return v
          assert hashlib.sha256(json.dumps(stable(r),separators=(',',':')).encode()).hexdigest()==i
          assert r['status']=='cycle-009-selection-released-for-read-only-preflight' and r['release_run']==int(os.environ['SOURCE_RUN']) and r['release_main']==os.environ['SOURCE_HEAD']
          assert r['eligible_at']==os.environ['ELIGIBLE_AT'] and r['candidate_identity_disclosed'] is True and r['cycle_009_preflight_authorized'] is True
          assert r['cycle_009_lease_authorized'] is False and r['lease_issued'] is False and r['queue_mutated'] is False and r['repository_write'] is False
          assert r['task_id'] and r['candidate']['task_id']==r['task_id'] and r['lease_id'] is None and r['wall_id'] is None
          (p/'verified-release.json').write_text(json.dumps({**r,'identity':i},indent=2,sort_keys=True)+'\n')
          PY
          printf 'SOURCE_ARTIFACT=%s\nSOURCE_ARTIFACT_DIGEST=%s\n' "$id" "$digest" >> "$GITHUB_ENV"
      - name: Rebind queued task and recover registered source receipt
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs validate
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); release=json.loads((root/'release/verified-release.json').read_text()); state=json.loads(Path('data/AUTOPILOT.json').read_text())
          job=next(x for x in state['jobs'] if x['id']==release['task_id'])
          assert job['scope']=='doctor-who' and job['status']=='queued' and not job.get('lease')
          assert job['performer']==release['candidate']['performer'] and job['character']==release['candidate']['character']
          assert sorted(job.get('performance_modes',[]))==sorted(release['candidate'].get('performance_modes',[]))
          receipts=job.get('source_receipts',[]); assert len(receipts)==1
          sr=receipts[0]; assert sr.get('source') and sr.get('pageid') and sr.get('revision') and sr.get('content_sha256') and job.get('source_fingerprint')
          registered={'task_id':job['id'],'performer':job['performer'],'character':job['character'],'performance_modes':job.get('performance_modes',[]),'source_fingerprint':job['source_fingerprint'],**sr}
          (root/'receipt/registered-source.json').write_text(json.dumps(registered,indent=2,sort_keys=True)+'\n')
          PY
      - name: Execute bounded anonymous source and media route census
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(jq -r .source "$OUT/receipt/registered-source.json")"
          pageid="$(jq -r .pageid "$OUT/receipt/registered-source.json")"
          revision="$(jq -r .revision "$OUT/receipt/registered-source.json")"
          fetch() {
            name="$1"; shift
            set +e
            code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 90 --retry 1 --retry-all-errors -D "$OUT/routes/$name.headers" -o "$OUT/routes/$name.body" -w '%{http_code}' "$@")"
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/routes/$name.curl-exit"
            printf '%s\n' "${code:-000}" > "$OUT/routes/$name.http-status"
          }
          fetch source-page "$source_url"
          fetch exact-revision --get "$API" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode prop=revisions --data-urlencode pageids="$pageid" --data-urlencode rvstartid="$revision" --data-urlencode rvendid="$revision" --data-urlencode rvprop=ids\|timestamp\|content --data-urlencode rvslots=main
          fetch page-images --get "$API" --data-urlencode action=query --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode prop=images\|pageimages --data-urlencode pageids="$pageid" --data-urlencode imlimit=max --data-urlencode piprop=name\|original
          fetch parsed-revision --get "$API" --data-urlencode action=parse --data-urlencode format=json --data-urlencode formatversion=2 --data-urlencode oldid="$revision" --data-urlencode prop=images\|externallinks\|wikitext
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); routes=root/'routes'; registered=json.loads((root/'receipt/registered-source.json').read_text())
          def load(name):
            body=(routes/f'{name}.body').read_bytes(); status=(routes/f'{name}.http-status').read_text().strip(); ex=int((routes/f'{name}.curl-exit').read_text())
            return {'name':name,'curl_exit':ex,'http_status':status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest(),'successful':ex==0 and status.startswith('2')}
          rows=[load(n) for n in ('source-page','exact-revision','page-images','parsed-revision')]
          observed=None; titles=[]; errors=[]
          try:
            q=json.loads((routes/'exact-revision.body').read_text()); rev=q['query']['pages'][0]['revisions'][0]; content=rev['slots']['main']['content']; observed={'pageid':q['query']['pages'][0]['pageid'],'revision':rev['revid'],'timestamp':rev['timestamp'],'content_sha256':hashlib.sha256(content.encode()).hexdigest(),'registered_content_sha256':registered['content_sha256']}; observed['content_matches_registered']=observed['content_sha256']==registered['content_sha256']
          except Exception as e: errors.append(f'exact-revision:{type(e).__name__}')
          for name in ('page-images','parsed-revision'):
            try:
              q=json.loads((routes/f'{name}.body').read_text())
              if name=='page-images': titles += [x['title'] for x in q.get('query',{}).get('pages',[{}])[0].get('images',[])]
              else: titles += [f"File:{x}" if not str(x).startswith('File:') else str(x) for x in q.get('parse',{}).get('images',[])]
            except Exception as e: errors.append(f'{name}:{type(e).__name__}')
          titles=sorted(dict.fromkeys(titles))[:100]
          (root/'receipt/route-receipts.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          (root/'receipt/exact-revision-observation.json').write_text(json.dumps({'observation':observed,'errors':errors},indent=2,sort_keys=True)+'\n')
          (root/'receipt/image-titles.json').write_text(json.dumps(titles,indent=2)+'\n')
          if titles:
            import urllib.parse
            params={'action':'query','format':'json','formatversion':'2','prop':'imageinfo','iiprop':'url|size|sha1|mime','titles':'|'.join(titles)}
            (root/'imageinfo-url.txt').write_text(os.environ['API']+'?'+urllib.parse.urlencode(params))
          PY
          if [ -s "$OUT/imageinfo-url.txt" ]; then fetch imageinfo "$(cat "$OUT/imageinfo-url.txt")"; fi
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); routes=root/'routes'; candidates=[]; error=None
          if (routes/'imageinfo.body').is_file():
            try:
              q=json.loads((routes/'imageinfo.body').read_text())
              for p in q.get('query',{}).get('pages',[]):
                info=(p.get('imageinfo') or [{}])[0]
                candidates.append({'title':p.get('title'),'url':info.get('url'),'description_url':info.get('descriptionurl'),'bytes':info.get('size'),'width':info.get('width'),'height':info.get('height'),'sha1':info.get('sha1'),'mime':info.get('mime')})
            except Exception as e: error=type(e).__name__
          (root/'receipt/media-candidates.json').write_text(json.dumps({'candidates':candidates,'parse_error':error,'adopted':False},indent=2,sort_keys=True)+'\n')
          PY
      - name: Seal terminal preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); release=json.loads((root/'release/verified-release.json').read_text()); source=json.loads((root/'receipt/registered-source.json').read_text()); routes=json.loads((root/'receipt/route-receipts.json').read_text()); obs=json.loads((root/'receipt/exact-revision-observation.json').read_text()); media=json.loads((root/'receipt/media-candidates.json').read_text())
          r={'status':'cycle-009-source-media-preflight-terminal','preflight_run':int(os.environ['GITHUB_RUN_ID']),'preflight_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'release_run':int(os.environ['SOURCE_RUN']),'release_artifact':int(os.environ['SOURCE_ARTIFACT']),'release_artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'release_main':os.environ['SOURCE_HEAD'],'eligible_at':os.environ['ELIGIBLE_AT'],'selection_id':release['selection_id'],'task_id':source['task_id'],'performer':source['performer'],'role':source['character'],'performance_modes':source['performance_modes'],'source':source['source'],'source_pageid':source['pageid'],'source_revision':source['revision'],'source_registered_content_sha256':source['content_sha256'],'source_fingerprint':source['source_fingerprint'],'route_count':len(routes),'successful_routes':sum(x['successful'] for x in routes),'exact_revision_observed':obs['observation'] is not None,'registered_content_digest_reproduced':bool(obs['observation'] and obs['observation']['content_matches_registered']),'media_candidate_count':len(media['candidates']),'media_adopted':False,'repository_write':False,'queue_mutated':False,'lease_issued':False,'cycle_009_lease_authorized':False,'cycle_009_product_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False,'login_attempts':0,'api_keys_used':0,'captcha_or_waf_bypass_attempts':0}
          r['identity']=hashlib.sha256(json.dumps(r,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/source-media-preflight.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/receipt" -type f ! -name 'SHA256SUMS.pre' ! -name 'SHA256SUMS' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" > "$OUT/receipt/SHA256SUMS"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload source and media preflight
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-source-media-preflight-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-source-media-preflight-v1/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-source-media-preflight-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-source-media-preflight-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
