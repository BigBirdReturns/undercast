name: star-trek-kaz-cycle-terminal

on:
  push:
    branches: [agent/star-trek-kaz-terminal-v1]

permissions:
  contents: write
  actions: write

concurrency:
  group: star-trek-kaz-cycle-terminal
  cancel-in-progress: false

jobs:
  kaz-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 88f766533ddd60952c962f958c09dc3c6bf0f48b
      CANDIDATE_BRANCH: agent/star-trek-kaz-candidate-v1
      CARRIER_BRANCH: agent/star-trek-kaz-terminal-v1
      MEDIA_PREP_RUN: 31727250492
      MEDIA_PREP_JOB: 94538595875
      MEDIA_PREP_ARTIFACT: 9191755772
      MEDIA_PREP_ARTIFACT_SHA: 8b73c6d719df1d13f2c40c7ff9dea1498273506b07fffaaade7376ac82b3b131
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact bounded Kaz controller
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(scripts/.kaz-controller-*)
          test "${#chunks[@]}" -gt 0
          cat "${chunks[@]}" | base64 -d | xz -dc > /tmp/kaz-controller.sh
          chmod +x /tmp/kaz-controller.sh
          bash -n /tmp/kaz-controller.sh
          sha256sum /tmp/kaz-controller.sh

      - name: Materialize exact Kaz candidate
        run: /tmp/kaz-controller.sh stage

      - uses: actions/upload-artifact@v4
        with:
          name: kaz-candidate-product
          path: /tmp/kaz-candidate-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Review exact Kaz candidate independently
        run: /tmp/kaz-controller.sh review

      - uses: actions/upload-artifact@v4
        with:
          name: kaz-independent-review
          path: /tmp/kaz-review-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Finalize, qualify, publish, and deploy exact Kaz product
        run: /tmp/kaz-controller.sh publish

      - uses: actions/upload-artifact@v4
        with:
          name: star-trek-kaz-final-product-receipt
          path: /tmp/kaz-final-product-receipt/
          if-no-files-found: error
          retention-days: 14

      - name: Remove every temporary Kaz ref
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$CANDIDATE_BRANCH" "$CARRIER_BRANCH"; do
            if git ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              git push origin --delete "$ref"
            fi
          done

      - name: Publication summary
        if: success()
        shell: bash
        run: |
          cat /tmp/kaz-final-product-receipt/publication.txt
          cat /tmp/kaz-final-product-receipt/thesis-next.json

      - name: Preserve failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/kaz-failure
          cp /tmp/kaz-stage.log /tmp/kaz-failure/ 2>/dev/null || true
          cp /tmp/kaz-independent-review.log /tmp/kaz-failure/ 2>/dev/null || true
          cp /tmp/kaz-finalize.log /tmp/kaz-failure/ 2>/dev/null || true
          cp /tmp/kaz-stage.json /tmp/kaz-failure/ 2>/dev/null || true
          cp /tmp/kaz-independent-review.json /tmp/kaz-failure/ 2>/dev/null || true
          cp /tmp/kaz-finalize.json /tmp/kaz-failure/ 2>/dev/null || true
          git status --short --branch > /tmp/kaz-failure/git-status.txt 2>&1 || true
          git log -5 --oneline --decorate > /tmp/kaz-failure/git-log.txt 2>&1 || true
          git ls-remote origin refs/heads/main "refs/heads/${CANDIDATE_BRANCH}" "refs/heads/${CARRIER_BRANCH}" > /tmp/kaz-failure/remote-refs.txt 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: star-trek-kaz-failure-diagnostics
          path: /tmp/kaz-failure/
          if-no-files-found: warn
          retention-days: 7
