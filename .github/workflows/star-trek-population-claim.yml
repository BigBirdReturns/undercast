name: star-trek-population-claim

on:
  push:
    branches: [agent/star-trek-population-001]
    paths:
      - ".github/STAR-TREK-POPULATION-CLAIM.json"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-POPULATION-CLAIM.json"
      - ".github/workflows/star-trek-population-claim.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-population-001-claim
  cancel-in-progress: false

jobs:
  claim:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/star-trek-population-001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify exact task identity and readiness
        run: |
          set -euo pipefail
          mkdir -p /tmp/star-trek-population-claim
          node scripts/corpus-ops.mjs status --json | tee /tmp/star-trek-population-claim/corpus-before.json
          node scripts/waterline.mjs status --scope star-trek --json | tee /tmp/star-trek-population-claim/waterline-before.json
          node scripts/autopilot.mjs readiness --scope star-trek --require-active --json > /tmp/star-trek-population-claim/readiness.json
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const bytes=fs.readFileSync('data/AUTOPILOT.json');
          const state=JSON.parse(bytes);
          const id='ap_d3afc683a39f7fa108090790';
          const row=(state.jobs||[]).find(item=>item.id===id);
          if(!row) throw new Error(`selected task ${id} is absent from durable state`);
          if(row.scope!=='star-trek'||row.performer!=='Wallace Shawn'||row.character!=='Zek') throw new Error('selected task identity drifted');
          if(row.status!=='queued'||row.queueable!==true) throw new Error(`selected task is not queueable: ${row.status}`);
          if(!(row.performance_modes||[]).some(mode=>['physical-prosthetic','physical-and-voice'].includes(mode))) throw new Error('selected task is not a physical performance');
          if(!(row.source_receipts||[]).some(receipt=>receipt.revision&&receipt.content_sha256)) throw new Error('selected task lacks an exact source-revision receipt');
          const selected={
            task_id:row.id,
            scope:row.scope,
            performer:row.performer,
            character:row.character,
            categories:row.categories,
            performance_modes:row.performance_modes,
            source_fingerprint:row.source_fingerprint,
            source_receipts:row.source_receipts,
            autopilot_sha256:crypto.createHash('sha256').update(bytes).digest('hex')
          };
          fs.writeFileSync('/tmp/star-trek-population-claim/selected.json',JSON.stringify(selected,null,2)+'\n');
          NODE
      - name: Persist one exact restart-safe lease
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs claim \
            --agent luna \
            --scope star-trek \
            --capability-profile text-vision \
            --task-id ap_d3afc683a39f7fa108090790 \
            --limit 1 \
            --lease-minutes 360 \
            --selection-basis "Owner-directed first visible population cycle: iconic exact-source physical Ferengi role, existing performer presence, and strong still/portrait feasibility." \
            --out data/review/trek-population-001-zek-lease.json \
            --prompt data/review/trek-population-001-zek-prompt.md \
            | tee /tmp/star-trek-population-claim/claim.json
          node scripts/autopilot.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/star-trek-population-claim/waterline-after.json
      - name: Commit the durable lease before processing
        run: |
          set -euo pipefail
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          rm -f .github/STAR-TREK-POPULATION-CLAIM.json
          rm -f .github/workflows/star-trek-population-plan.yml
          rm -f .github/workflows/star-trek-population-claim.yml
          git add data/AUTOPILOT.json data/journal/autopilot.jsonl \
            data/review/trek-population-001-zek-lease.json \
            data/review/trek-population-001-zek-prompt.md \
            .github/STAR-TREK-POPULATION-CLAIM.json \
            .github/workflows/star-trek-population-plan.yml \
            .github/workflows/star-trek-population-claim.yml
          git diff --cached --check
          git commit -m "Population: lease Grand Nagus Zek"
          git push origin HEAD:agent/star-trek-population-001
      - name: Retain claim receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-claim-${{ github.run_id }}
          path: /tmp/star-trek-population-claim
          if-no-files-found: warn
          retention-days: 30
