name: card-backfill-uc-080-scope

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-080.json"
      - "scripts/card-backfill-uc-080-scope.mjs"
      - ".github/workflows/card-backfill-uc-080-scope.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-080-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-019'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-019
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Extract exact UC-080 specimen, audit, and source-ledger scope
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-080-scope
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-080-scope.mjs
          node scripts/card-backfill-uc-080-scope.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-080-scope-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact canonical scope packet
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-080-scope-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-080-scope
            ${{ runner.temp }}/card-backfill-uc-080-scope-run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
