name: patch-tosk-sitemap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: patch-tosk-sitemap
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.number == 78
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-gold-completion
          fetch-depth: 1
      - name: Update the exact sitemap regression and remove this one-shot workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/rendered/site.spec.mjs')
          text=path.read_text()
          old='expect(urls).toHaveLength(1252); // 1247 record pages + 5 top-level pages'
          new='expect(urls).toHaveLength(1253); // 1248 record pages + 5 top-level pages'
          if text.count(old)!=1:
              raise SystemExit(f'sitemap assertion count {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/patch-tosk-sitemap.yml
          git config user.name 'undercast-cycle-operator'
          git config user.email 'undercast-cycle-operator@users.noreply.github.com'
          git add tests/rendered/site.spec.mjs .github/workflows/patch-tosk-sitemap.yml
          git diff --cached --check
          git commit -m 'Cycle 2: update sitemap regression for Tosk'
          git push origin HEAD:agent/star-trek-gold-completion
