name: estate-adopt-uc338-season17-012

# Sole COLLECT-012 canonical-mutation authority for the final imported packet.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-uc338-season17-012.yml
      - scripts/estate-adopt-uc338-season17-012.mjs
      - scripts/estate-run-collect012.sh
      - data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json
      - data/review/card-backfill/UC-338-season17-replacement/**

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-uc338-season17-012
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect012.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Execute final imported-packet payment
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-012-final-uc338-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-012-preflight.json
            /tmp/COLLECT-012-quality-before.json
            /tmp/COLLECT-012-apply.json
            /tmp/COLLECT-012-validation.json
            /tmp/COLLECT-012-expected-images.txt
            /tmp/COLLECT-012-tracked-paths.zlist
            /tmp/COLLECT-012-untracked-paths.zlist
            /tmp/COLLECT-012-candidate.patch
            /tmp/COLLECT-012-candidate.tree
            /tmp/COLLECT-012-promotion.json
            /tmp/COLLECT-012-ledger-validation.json
            /tmp/COLLECT-012-adoption.patch
            /tmp/COLLECT-012-adoption.tree
            /tmp/COLLECT-012-reconciliation.json
            /tmp/COLLECT-012-final-ledger-validation.json
            /tmp/COLLECT-012-publication.patch
            /tmp/COLLECT-012-publication.tree
            data/review/estate-debt/COLLECT-012-UC338-SEASON17-PACKET-PUBLICATION.json
            data/review/estate-debt/COLLECT-012-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-012-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
