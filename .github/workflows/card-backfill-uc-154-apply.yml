name: card-backfill-uc-154-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-154-APPLY.json"
      - "scripts/card-backfill-uc-154-apply.part-00.mjs"
      - "scripts/card-backfill-uc-154-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-154-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-154-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-033'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-033
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-154 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-154-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-154');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-154');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_067190c9e8aa5e6b9b695e62');
          if(row.version!==1||row.record_id!=='UC-154'||row.actor!=='Tyler Mane'||row.character!=='Michael Myers'||row.production!=='Halloween (2007)'||row.years!=='2007–2009'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-154 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8711230585||row.render_artifact?.head_sha!=='4f277f3e36682351dab95e2372d86f17c6282d6b'||row.render_artifact?.zip_sha256!=='2b13535c985294f2bf6e6aa8e5c424155f883a41b04ef375e0ae99ca5d1cfb2e')throw new Error('UC-154 render custody drift');
          if(row.expected?.selected_source?.sha256!=='a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28'||row.expected?.selected_source?.width!==1080||row.expected?.selected_source?.height!==720)throw new Error('UC-154 selected source authorization drift');
          if(row.expected?.exact_still_record?.sha256!=='0662fc5826e708047731ae3ba1cf3acad9dd8dbba5f0e16f3bb2fdf4ba778c83'||row.expected?.candidate?.sha256!=='d2e1f935d17c3c32fae5ec80594f02247cbf41e54fbaf3f9c5bc3d0001f435cd'||row.expected?.crop_preview?.sha256!=='e9de5c81750de9f1934b0cd257bd66c70c44726f6f73a40711cfa8842ab70ecd')throw new Error('UC-154 candidate or exact-still authorization drift');
          if(row.expected?.packet_file_count!==13||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.targeted_candidate_count!==1||row.expected?.failed_discovery_checkpoint_count!==1||row.expected?.source_page_count!==4)throw new Error('UC-154 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='completed-2007-michael-myers-character-still'||row.ruling?.crop_ruling!=='pass-east-anchored-mask-body-action-crop'||row.ruling?.chronology_ruling!=='pass-2007-first-film-separated-from-2009-sequel'||row.ruling?.mixed_gallery_ruling!=='pass-rejected-mixed-gallery-denominator'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-154 ruling drift');
          if(!specimen||specimen.actor!=='Tyler Mane'||specimen.character!=='Michael Myers'||specimen.production!=='Halloween (2007)'||specimen.years!=='2007–2009'||specimen.still||specimen.portrait?.src!=='images/uc-154-portrait.jpg')throw new Error('UC-154 specimen boundary drift');
          if(source?.still)throw new Error('UC-154 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-154'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-154 audit boundary drift');
          console.log(`PASS — UC-154 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8711230585/zip" > "$root/render.zip"
          echo "2b13535c985294f2bf6e6aa8e5c424155f883a41b04ef375e0ae99ca5d1cfb2e  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-154"
          test -f "$base/manifest.json"
          echo "af3b5ac6657b716e356aebee1e503543f7e4700769c0775e977fb1ce631d5021  $base/manifest.json" | sha256sum -c -
          echo "c6ce5ec91382d16de894fee2198e69fd65ed126668a9c8ec2227c4e26f58e2d9  $base/duplicate-scan.json" | sha256sum -c -
          echo "76a48d9dc69a492b0a613bd47fa7c3b6e98b58143565c8c7a88cc402c4e77628  $base/review.json" | sha256sum -c -
          echo "605d50421be18ed31f58865e187212921570359ff32cdd382c3fa95c9681d49f  $base/review.md" | sha256sum -c -
          echo "9710283e7613ed32e4880caf2b97c5eb9ef5ace231c98615c5fc4c400c8ef05d  $base/SHA256SUMS" | sha256sum -c -
          echo "0662fc5826e708047731ae3ba1cf3acad9dd8dbba5f0e16f3bb2fdf4ba778c83  $base/exact-still-record.json" | sha256sum -c -
          echo "a40a077d146d698d699b9cbc5e10d1c41be6be4f25202638b82cb64daeaada28  $base/michael-myers-2007-original.jpg" | sha256sum -c -
          echo "bc162b5772b43d4df3b2a47582d10ed1467611f1bb3c2ad8a46ad94b8089ed87  $base/source-page-afi-halloween-2007.png" | sha256sum -c -
          echo "1399ea6a666a43dbb85feffdf71c1ba28c4ef86972f1e7f938f9c8c97933405a  $base/source-page-tyler-mane-official-halloween-interview.png" | sha256sum -c -
          echo "c5f2a1b0151c2f4a7158473ec007ae4565b85496f846703e61cf24807673b302  $base/source-page-halloweenmovies-kristina-klebe.png" | sha256sum -c -
          echo "bb802ee99864abf8d6b92420eb4eb3eec2e1c46d86aa00b94d5b18308adff0eb  $base/source-page-halloweenmovies-2007-trailer.png" | sha256sum -c -
          echo "d2e1f935d17c3c32fae5ec80594f02247cbf41e54fbaf3f9c5bc3d0001f435cd  $base/uc-154-still-candidate.jpg" | sha256sum -c -
          echo "e9de5c81750de9f1934b0cd257bd66c70c44726f6f73a40711cfa8842ab70ecd  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30419076028
          artifact_id=8711230585
          artifact_name=card-backfill-uc-154-render-30419076028
          artifact_zip_sha256=2b13535c985294f2bf6e6aa8e5c424155f883a41b04ef375e0ae99ca5d1cfb2e
          artifact_head_sha=4f277f3e36682351dab95e2372d86f17c6282d6b
          source_manifest_sha256=af3b5ac6657b716e356aebee1e503543f7e4700769c0775e977fb1ce631d5021
          source_sums_sha256=9710283e7613ed32e4880caf2b97c5eb9ef5ace231c98615c5fc4c400c8ef05d
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-154-apply/source/output/UC-154
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-apply"
          cat scripts/card-backfill-uc-154-apply.part-00.mjs scripts/card-backfill-uc-154-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-154');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-154');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_067190c9e8aa5e6b9b695e62');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-154-portrait.jpg')throw new Error('UC-154 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-154 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-154'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-154 audit disposition was canonically mutated');
          console.log('PASS — UC-154 still remains canonically absent; existing Tyler Mane portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-154.json \
            .github/CARD-BACKFILL-UC-154-DISCOVER.json \
            .github/CARD-BACKFILL-UC-154-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-154-TARGETED.json \
            .github/CARD-BACKFILL-UC-154-RENDER.json \
            .github/CARD-BACKFILL-UC-154-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-154-scope.yml \
            .github/workflows/card-backfill-uc-154-discover.yml \
            .github/workflows/card-backfill-uc-154-targeted.yml \
            .github/workflows/card-backfill-uc-154-render.yml \
            .github/workflows/card-backfill-uc-154-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-154-scope.mjs \
            scripts/card-backfill-uc-154-discover.mjs \
            scripts/card-backfill-uc-154-targeted.mjs \
            scripts/card-backfill-uc-154-render.part-00.mjs \
            scripts/card-backfill-uc-154-render.part-01.mjs \
            scripts/card-backfill-uc-154-apply.part-00.mjs \
            scripts/card-backfill-uc-154-apply.part-01.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-154 Tyler Mane Michael Myers still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-032
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-032 HEAD)
          test "${#changed[@]}" -eq 13
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-154/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-154-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-033
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-154-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-154-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-154-apply
            data/review/card-backfill/UC-154
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
