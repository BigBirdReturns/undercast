name: verify-doctor-who-legacy-ref-neutralization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/verify-doctor-who-legacy-ref-neutralization.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: verify-doctor-who-legacy-ref-neutralization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/verify-doctor-who-legacy-ref-neutralization
  SELF: .github/workflows/verify-doctor-who-legacy-ref-neutralization.yml
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-legacy-ref-neutralization
  GH_TOKEN: ${{ github.token }}

jobs:
  verify:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/verify-doctor-who-legacy-ref-neutralization'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact one-path read-only carrier and terminal main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$CARRIER_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Prove the exact 69-ref cycle-007 estate is neutralized
        shell: bash
        run: |
          set -euo pipefail
          cat <<'REFS' > "$OUT/expected-refs.txt"
          refs/heads/agent/doctor-who-cycle-007-current-main-source-export
          refs/heads/agent/doctor-who-cycle-007-current-main-source-export-v2
          refs/heads/agent/doctor-who-cycle-007-current-main-source-export-v2-lean
          refs/heads/agent/doctor-who-cycle-007-current-main-source-export-v3
          refs/heads/agent/doctor-who-cycle-007-current-main-source-snapshot-v2
          refs/heads/agent/doctor-who-cycle-007-kragar-media-preflight
          refs/heads/agent/doctor-who-cycle-007-kragar-media-prepublish
          refs/heads/agent/doctor-who-cycle-007-kragar-media-prepublish-v2
          refs/heads/agent/doctor-who-cycle-007-kragar-media-review-final
          refs/heads/agent/doctor-who-cycle-007-kragar-media-review-v2
          refs/heads/agent/doctor-who-cycle-007-kragar-media-review-v3
          refs/heads/agent/doctor-who-cycle-007-kragar-media-terminal
          refs/heads/agent/doctor-who-cycle-007-kragar-product-v14
          refs/heads/agent/doctor-who-cycle-007-post-composability-source-snapshot
          refs/heads/agent/doctor-who-cycle-007-post-merge-proof-v1
          refs/heads/agent/doctor-who-cycle-007-post-merge-proof-v2
          refs/heads/agent/doctor-who-cycle-007-post-merge-proof-v3
          refs/heads/agent/doctor-who-cycle-007-preflight
          refs/heads/agent/doctor-who-cycle-007-qualifier-v10
          refs/heads/agent/doctor-who-cycle-007-qualifier-v10r
          refs/heads/agent/doctor-who-cycle-007-qualifier-v8
          refs/heads/agent/doctor-who-cycle-007-qualifier-v9
          refs/heads/agent/doctor-who-cycle-007-selection
          refs/heads/agent/doctor-who-cycle-007-source-snapshot
          refs/heads/agent/doctor-who-cycle-007-source-snapshot-v2
          refs/heads/agent/doctor-who-cycle-007-terminal-current-main-proof-v4
          refs/heads/agent/doctor-who-cycle-007-transport-comment-census
          refs/heads/agent/doctor-who-cycle-007-trusted-publisher-v10-denominator-repair
          refs/heads/agent/doctor-who-cycle-007-trusted-publisher-v10-installer
          refs/heads/agent/doctor-who-cycle-007-trusted-publisher-v10-installer-008f
          refs/heads/agent/doctor-who-cycle-007-v11-finalization
          refs/heads/agent/doctor-who-cycle-007-v12-finalization
          refs/heads/agent/doctor-who-cycle-007-v13-finalization
          refs/heads/agent/doctor-who-cycle-007-v14-finalization
          refs/heads/agent/doctor-who-cycle-007-v14-finalization-copy-do-not-use
          refs/heads/agent/doctor-who-cycle-007-v14-publisher
          refs/heads/agent/doctor-who-cycle-007-v14-publisher-observer
          refs/heads/agent/doctor-who-cycle-007-v15-product-qualification
          refs/heads/agent/doctor-who-cycle-007-v15-product-qualification-v2
          refs/heads/agent/doctor-who-cycle-007-v8-finalizer-v1
          refs/heads/agent/doctor-who-cycle-007-v8-finalizer-v1-repair
          refs/heads/agent/doctor-who-cycle-007-v8-finalizer-v2
          refs/heads/agent/doctor-who-cycle-007-v8-finalizer-v3
          refs/heads/agent/doctor-who-cycle-007-v8-independent-review
          refs/heads/agent/doctor-who-cycle-007-v8-independent-review-v2
          refs/heads/agent/doctor-who-cycle-007-v8-independent-review-v3-probe
          refs/heads/agent/doctor-who-cycle-007-v8-independent-review-v4-probe
          refs/heads/agent/doctor-who-cycle-007-v8-independent-review-v5
          refs/heads/agent/doctor-who-cycle-007-v8-materializer
          refs/heads/agent/doctor-who-cycle-007-v8-merge-guardian-v1
          refs/heads/agent/doctor-who-cycle-007-v8-merge-guardian-v2
          refs/heads/agent/doctor-who-cycle-007-v8-merge-guardian-v3
          refs/heads/agent/doctor-who-cycle-007-v8-product-qualifier-v1
          refs/heads/agent/doctor-who-cycle-007-v8-product-qualifier-v2
          refs/heads/agent/doctor-who-cycle-007-v8-product-qualifier-v3
          refs/heads/agent/doctor-who-cycle-007-v8-terminal-guardian-v4
          refs/heads/agent/doctor-who-cycle-007-writer-builder-squash-temp
          refs/heads/agent/doctor-who-cycle-007-writer-builder-squash-temp-v2
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v1
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v2
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v3
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v4-squash-temp
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v4-squash-temp-v2
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v6-rebuild
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v7
          refs/heads/agent/doctor-who-cycle-007-writer-builder-v9
          refs/heads/agent/retire-doctor-who-cycle-007-v10-payloads
          refs/heads/agent/retire-doctor-who-cycle-007-v10-publisher
          refs/heads/agent/retire-doctor-who-cycle-007-v14-publisher
          REFS
          LC_ALL=C sort -o "$OUT/expected-refs.txt" "$OUT/expected-refs.txt"
          test "$(wc -l < "$OUT/expected-refs.txt")" = "69"

          {
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/doctor-who-cycle-007" --jq '.[] | [.object.sha, .ref] | @tsv'
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/agent/retire-doctor-who-cycle-007" --jq '.[] | [.object.sha, .ref] | @tsv'
          } | LC_ALL=C sort -u > "$OUT/actual-refs.tsv"
          cut -f2 "$OUT/actual-refs.tsv" > "$OUT/actual-refs.txt"
          diff -u "$OUT/expected-refs.txt" "$OUT/actual-refs.txt"
          test "$(wc -l < "$OUT/actual-refs.tsv")" = "69"
          awk -F '\t' -v expected="$EXACT_MAIN" '$1 != expected { print > "/dev/stderr"; bad=1 } END { exit bad }' "$OUT/actual-refs.tsv"

          git checkout --detach "$EXACT_MAIN"
          git ls-tree -r --name-only "$EXACT_MAIN" .github | LC_ALL=C sort > "$OUT/github-paths.txt"
          if grep -F 'doctor-who-cycle-007' "$OUT/github-paths.txt" > "$OUT/forbidden-github-paths.txt"; then
            cat "$OUT/forbidden-github-paths.txt" >&2
            exit 1
          fi

      - name: Seal exact ref-neutralization receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="verify") | .id' | head -1)"
          test -n "$job_id"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-007-REF-NEUTRALIZATION-V1" \
            --arg main "$EXACT_MAIN" \
            --arg carrier "$HEAD_SHA" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            '{
              schema_version: 1,
              transaction: $transaction,
              terminal_main: $main,
              carrier_head: $carrier,
              ref_count: 69,
              run_id: $run,
              job_id: $job,
              checks: {
                exact_ref_name_set: true,
                every_ref_equals_terminal_main: true,
                zero_cycle_007_paths_under_github: true,
                live_main_rebound: true
              },
              boundary: {
                repository_written: false,
                refs_mutated: false,
                product_mutated: false,
                cycle_008_lease_issued: false,
                outside_human_dependency: false
              }
            }' > "$OUT/ref-neutralization.json"
          sha256sum "$OUT/ref-neutralization.json" | awk '{print $1}' > "$OUT/ref-neutralization.sha256"
          test "$(sha256sum "$OUT/ref-neutralization.json" | awk '{print $1}')" = "$(cat "$OUT/ref-neutralization.sha256")"

      - name: Upload immutable ref-neutralization receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-ref-neutralization-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
