name: estate-repair-current-null-adjudication-007

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-current-null-adjudication-007.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-current-null-adjudication-007
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  OUT: data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Recompute the complete lane with canonical nullish semantics
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';

          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const gitBlob = (bytes) => crypto.createHash('sha1').update(Buffer.from(`blob ${bytes.length}\0`, 'utf8')).update(bytes).digest('hex');
          const doc = (file) => {
            const bytes = fs.readFileSync(file);
            return { file, bytes, sha256: sha256(bytes), git_blob: gitBlob(bytes), value: JSON.parse(bytes.toString('utf8')) };
          };
          const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
          const parseChecksums = (text, label) => {
            const map = new Map();
            for (const [index, raw] of String(text).split(/\r?\n/).entries()) {
              if (!raw.trim()) continue;
              const match = raw.match(/^([0-9a-f]{64})\s+\*?(.+)$/i);
              if (!match) throw new Error(`${label}:${index + 1} is not a SHA-256 row`);
              const name = match[2].trim().replace(/^\.\//, '');
              if (!name || name.includes('/') || map.has(name)) throw new Error(`${label}:${index + 1} repeats or nests ${name}`);
              map.set(name, match[1].toLowerCase());
            }
            return map;
          };

          const priorDoc = doc(process.env.OUT);
          const prior = priorDoc.value;
          if (prior.transaction !== 'COLLECT-007' || prior.denominator?.authorized !== 6 || prior.denominator?.blocked !== 18) throw new Error('expected the exact strict-null checkpoint');
          for (const blocked of prior.blocked_obligations || []) {
            if (JSON.stringify(blocked.reasons) !== JSON.stringify(['current-binding-not-null'])) throw new Error(`${blocked.decision_id} has a non-nullish blocker`);
          }
          for (const decision of prior.decisions || []) {
            if (decision.status === 'blocked-current-null' && (decision.current?.specimen_binding !== null || decision.current?.source_binding !== null)) throw new Error(`${decision.decision_id} checkpoint does not expose null bindings`);
          }

          const censusDoc = doc('data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json');
          const ledgerDoc = doc('data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json');
          const specimens = doc('data/specimens.json').value;
          const sources = doc('data/SOURCES.json').value;
          const census = censusDoc.value;
          const ledger = ledgerDoc.value;
          if (ledger.cumulative?.canonical_adoptions !== 15 || ledger.cumulative?.remaining_for_canonical_review !== 40) throw new Error('ledger left the COLLECT-006 paid boundary');

          const adopted = new Set((ledger.adopted_obligations || []).map((row) => row.obligation_id));
          const laneRows = (census.packets || [])
            .filter((row) => row.lane === 'null-binding-without-prior-state' && !adopted.has(row.obligation_id))
            .sort((a, b) => a.obligation_id.localeCompare(b.obligation_id));
          if (laneRows.length !== 24) throw new Error(`expected 24 remaining lane objects, found ${laneRows.length}`);
          const specimenById = new Map(specimens.map((row) => [row.id, row]));
          const sourceById = new Map(sources.map((row) => [row.id, row]));
          const decisions = [];

          for (const row of laneRows) {
            const specimen = specimenById.get(row.record_id);
            const source = sourceById.get(row.record_id);
            const reasons = [];
            if (!specimen || !source) reasons.push('canonical-record-missing');
            const specimenCurrent = specimen?.[row.side] ?? null;
            const sourceCurrent = source?.[row.side] ?? null;
            const otherSide = row.side === 'still' ? 'portrait' : 'still';
            if (specimen && source) {
              if (specimen.actor !== row.actor || source.actor !== row.actor) reasons.push('actor-drift');
              if (specimen.character !== row.character || source.character !== row.character) reasons.push('character-drift');
              if (!same(specimenCurrent, sourceCurrent)) reasons.push('canonical-row-disagreement');
              if (specimenCurrent !== null || sourceCurrent !== null) reasons.push('current-binding-not-null');
              if (!(specimen[otherSide]?.src && source[otherSide]?.src && same(specimen[otherSide], source[otherSide]))) reasons.push('opposite-side-incomplete');
            }
            const custody = row.custody || {};
            for (const field of ['candidate_hash_pass', 'manifest_checksum_bound', 'candidate_checksum_bound', 'independent_review_ready', 'duplicate_screen_pass', 'packet_ready']) {
              if (custody[field] !== true) reasons.push(`custody-${field}-failed`);
            }

            const manifestBytes = fs.readFileSync(row.manifest_path);
            const candidateBytes = fs.readFileSync(row.candidate_path);
            const checksums = parseChecksums(fs.readFileSync(row.checksum_path, 'utf8'), row.checksum_path);
            const manifestHash = sha256(manifestBytes);
            const candidateHash = sha256(candidateBytes);
            const manifestBound = checksums.get(path.posix.basename(row.manifest_path)) === row.manifest_sha256;
            const candidateBound = checksums.get(path.posix.basename(row.candidate_path)) === row.candidate_sha256;
            if (manifestHash !== row.manifest_sha256) reasons.push('manifest-hash-drift');
            if (candidateHash !== row.candidate_sha256) reasons.push('candidate-hash-drift');
            if (!manifestBound) reasons.push('manifest-not-checksum-bound');
            if (!candidateBound) reasons.push('candidate-not-checksum-bound');
            const destinationExists = fs.existsSync(row.suggested_destination_path);
            if (destinationExists) reasons.push('versioned-destination-exists');

            const authorized = reasons.length === 0;
            decisions.push({
              decision_id: row.obligation_id,
              record_id: row.record_id,
              side: row.side,
              actor: row.actor,
              character: row.character,
              production: row.production ?? null,
              packet_generation: row.packet_generation,
              status: authorized ? 'authorized-current-null' : 'blocked-current-null',
              reasons,
              packet: {
                root: row.packet_root,
                manifest_path: row.manifest_path,
                manifest_sha256: row.manifest_sha256,
                manifest_hash_pass: manifestHash === row.manifest_sha256,
                manifest_checksum_bound: manifestBound,
                candidate_path: row.candidate_path,
                candidate_sha256: row.candidate_sha256,
                candidate_hash_pass: candidateHash === row.candidate_sha256,
                candidate_checksum_bound: candidateBound,
                candidate_mime: row.candidate_mime,
                independent_review_ready: custody.independent_review_ready === true,
                duplicate_screen_pass: custody.duplicate_screen_pass === true,
                packet_ready: custody.packet_ready === true
              },
              current: {
                specimen_binding: specimenCurrent,
                source_binding: sourceCurrent,
                canonical_rows_agree: same(specimenCurrent, sourceCurrent),
                nullish_representation: {
                  specimen_property_present: specimen ? Object.hasOwn(specimen, row.side) : false,
                  source_property_present: source ? Object.hasOwn(source, row.side) : false,
                  absent_property_and_explicit_null_are_equivalent_unbound_states: true
                },
                other_side: otherSide,
                other_side_present: Boolean(specimen?.[otherSide]?.src && source?.[otherSide]?.src && same(specimen[otherSide], source[otherSide])),
                destination_path: row.suggested_destination_path,
                destination_exists: destinationExists
              },
              proposed_binding: authorized ? {
                src: row.suggested_destination_path,
                kind: row.side,
                origin: row.suggested_origin,
                pin: true,
                focus: row.suggested_focus
              } : null,
              quality_effect: row.side === 'still'
                ? { complete_pairs: 1, missing_still: -1, missing_portrait: 0, missing_both: 0 }
                : { complete_pairs: 1, missing_still: 0, missing_portrait: -1, missing_both: 0 }
            });
          }

          const authorized = decisions.filter((row) => row.status === 'authorized-current-null');
          const blocked = decisions.filter((row) => row.status === 'blocked-current-null');
          if (authorized.length !== 24 || blocked.length !== 0) throw new Error(`corrected lane expected 24 authorized / 0 blocked, found ${authorized.length} / ${blocked.length}: ${JSON.stringify(blocked.map((row) => [row.decision_id, row.reasons]))}`);
          const quality = authorized.reduce((sum, row) => ({
            complete_pairs: sum.complete_pairs + row.quality_effect.complete_pairs,
            missing_still: sum.missing_still + row.quality_effect.missing_still,
            missing_portrait: sum.missing_portrait + row.quality_effect.missing_portrait,
            missing_both: sum.missing_both + row.quality_effect.missing_both
          }), { complete_pairs: 0, missing_still: 0, missing_portrait: 0, missing_both: 0 });

          const repaired = {
            version: 2,
            transaction: 'COLLECT-007',
            operation: 'exact-current-null-whole-lane-adjudication',
            status: 'authorized',
            recorded_at: new Date().toISOString(),
            repair: {
              prior_checkpoint_path: process.env.OUT,
              prior_checkpoint_sha256: priorDoc.sha256,
              prior_checkpoint_git_blob: priorDoc.git_blob,
              prior_counts: prior.denominator,
              defect: 'strict comparison treated an absent media property (undefined) as a bound value even though canonical readers normalize absent and explicit null to the same unbound state',
              correction: 'normalize specimen and source media values with nullish coalescing before exact-null comparison',
              evidence_standard_changed: false,
              canonical_mutation: false
            },
            source: {
              current_head: process.env.AUTHORIZED_HEAD,
              census_path: censusDoc.file,
              census_sha256: censusDoc.sha256,
              census_git_blob: censusDoc.git_blob,
              ledger_path: ledgerDoc.file,
              ledger_sha256: ledgerDoc.sha256,
              ledger_git_blob: ledgerDoc.git_blob,
              canonical_adoptions_before: 15,
              remaining_packet_review_before: 40
            },
            denominator: {
              original_current_null_lane: 27,
              already_paid_from_lane: 3,
              remaining_lane: 24,
              reviewed: 24,
              authorized: 24,
              blocked: 0
            },
            quality_effect_if_all_authorized_are_adopted: quality,
            authorized_obligations: authorized.map((row) => row.decision_id),
            blocked_obligations: [],
            decisions,
            boundary: {
              canonical_mutation: false,
              discovery_performed: false,
              packet_evidence_rewritten: false,
              arbitrary_batch_size_used: false,
              complete_remaining_lane_reviewed: true,
              current_null_lane_exhausted_by_ruling: true,
              next_authorized_work: 'adopt all 24 authorized objects as one evidence-sized tranche'
            }
          };
          fs.writeFileSync(process.env.OUT, `${JSON.stringify(repaired, null, 2)}\n`);
          console.log(JSON.stringify({ transaction: repaired.transaction, repaired: true, denominator: repaired.denominator, quality_effect: quality, authorized_obligations: repaired.authorized_obligations }, null, 2));
          NODE

      - name: Validate repaired ruling and stage only durable correction
        run: |
          set -euo pipefail
          node scripts/estate-canonical-adoption-ledger.mjs
          node --input-type=module - "$OUT" <<'NODE'
          import fs from 'node:fs';
          const ruling = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (ruling.version !== 2 || ruling.denominator?.authorized !== 24 || ruling.denominator?.blocked !== 0) throw new Error('COLLECT-007 repaired denominator drifted');
          if (ruling.repair?.evidence_standard_changed !== false || ruling.boundary?.canonical_mutation !== false) throw new Error('COLLECT-007 repair escaped audit boundary');
          NODE
          git rm .github/workflows/estate-repair-current-null-adjudication-007.yml
          git add -- "$OUT"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/estate-repair-current-null-adjudication-007.yml' "$OUT" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-007-repaired-adjudication.tree

      - name: Run repository gate without redundant rendered-browser pass
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-007-repaired-adjudication.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish repaired complete-lane ruling under lease
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adjudication: normalize nullish state and authorize full lane' \
            -m 'transaction=COLLECT-007' \
            -m 'reviewed=24' \
            -m 'authorized=24' \
            -m 'blocked=0' \
            -m 'evidence_standard_changed=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-007-repaired-adjudication.tree)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report repaired whole-lane ruling
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-007 nullish-state repair passed on workflow run ${GITHUB_RUN_ID}. All 24 remaining current-null packets are now terminally authorized; zero are blocked. No media changed and the evidence standard did not change. The next product transaction is one 24-object adoption tranche."

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-007 nullish-state repair failed closed on workflow run ${GITHUB_RUN_ID}. The prior 6/18 checkpoint remains non-authoritative for adoption until repaired."

      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-007-nullish-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/review/estate-debt/COLLECT-007-CURRENT-NULL-WHOLE-LANE-ADJUDICATION.json
            /tmp/COLLECT-007-repaired-adjudication.tree
          if-no-files-found: warn
          retention-days: 30
