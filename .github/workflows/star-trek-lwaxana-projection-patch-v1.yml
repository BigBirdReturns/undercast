name: star-trek-lwaxana-projection-patch-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-lwaxana-projection-patch-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch the generated historical-product projection wrapper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/star-trek-rolling-bootstrap-lwaxana-v1.yml')
          text=path.read_text()
          old_log="          const log=run(['log','--all','--format=%H','--',checker]);\n"
          new_log="          const log=run(['log','--first-parent','HEAD','--format=%H','--',checker]);\n"
          if old_log not in text: raise SystemExit('projection history-selection pattern drifted')
          text=text.replace(old_log,new_log,1)
          old_select="            const message=run(['show','-s','--format=%s',commit]);\n            if(message.status===0&&/^Star Trek: publish /.test(message.stdout.trim())){product=commit;break;}\n"
          new_select="            product=commit; break;\n"
          if old_select not in text: raise SystemExit('projection product-selection pattern drifted')
          text=text.replace(old_select,new_select,1)
          old_temp="          const temp=fs.mkdtempSync(path.join(os.tmpdir(),'undercast-product-check-'));\n          const add=run(['worktree','add','--detach',temp,product]);\n"
          new_temp="          const temp=fs.mkdtempSync(path.join(os.tmpdir(),'undercast-product-check-'));\n          fs.rmSync(temp,{recursive:true,force:true});\n          const add=run(['worktree','add','--detach',temp,product]);\n"
          if old_temp not in text: raise SystemExit('projection worktree path pattern drifted')
          path.write_text(text.replace(old_temp,new_temp,1))
          PY
          git diff --check
          git config user.name undercast-lwaxana-projection-patcher
          git config user.email lwaxana-projection-patcher@users.noreply.github.com
          git add -- .github/workflows/star-trek-rolling-bootstrap-lwaxana-v1.yml
          git commit -m 'Star Trek: patch historical product projection worktree'
          git push origin HEAD:agent/star-trek-rolling-continuation-v1
