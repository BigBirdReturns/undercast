name: star-trek-population-plan

on:
  push:
    branches: [agent/star-trek-population-001]
    paths:
      - ".github/workflows/star-trek-population-plan.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rank executable Star Trek card gaps
        run: |
          set -euo pipefail
          mkdir -p /tmp/star-trek-population-plan
          node scripts/corpus-ops.mjs status --json > /tmp/star-trek-population-plan/corpus-status.json
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/star-trek-population-plan/waterline-status.json
          node scripts/autopilot.mjs status --scope star-trek --json > /tmp/star-trek-population-plan/autopilot-status.json
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const autopilotBytes = fs.readFileSync('data/AUTOPILOT.json');
          const auditBytes = fs.readFileSync('data/MEDIA-AUDIT.json');
          const roadmapBytes = fs.readFileSync('data/ROADMAP-STATE.json');
          const autopilot = JSON.parse(autopilotBytes);
          const audit = JSON.parse(auditBytes);
          const roadmap = JSON.parse(roadmapBytes);
          const jobs = (autopilot.jobs || []).filter(job => job.scope === 'star-trek');
          const inFlight = jobs.filter(job => ['leased','drafted','merged'].includes(job.status));
          const debt = (audit.items || []).filter(item => item.scope === 'star-trek' && ['review','attention'].includes(item.status));
          const preferred = new Map([
            ['wallace shawn|zek', 1000],
            ['dan shor|arridor', 980],
            ['tracey walter|berik', 960],
            ['henry gibson|nilva', 940],
            ['doug warhit|kazago', 920],
            ['clint howard|muk', 900],
            ['william bastiani|omag', 880],
            ['david jeffries|stol', 860],
            ['frank corsentino|bok', 840],
            ['peter slutsker|birta', 820]
          ]);
          const normalized = value => String(value || '').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
          const rows = jobs.filter(job => job.status === 'queued' && job.queueable === true)
            .filter(job => (job.performance_modes || []).some(mode => ['physical-prosthetic','physical-and-voice'].includes(mode)))
            .map(job => {
              const key = `${normalized(job.performer)}|${normalized(job.character)}`;
              const ferengi = (job.categories || []).some(value => /ferengi/i.test(value));
              const exactReceipts = (job.source_receipts || []).filter(row => row.revision && row.content_sha256).length;
              const score = (ferengi ? 100000 : 0)
                + (preferred.get(key) || 0)
                + exactReceipts * 100
                + (job.performer_on_wall ? 25 : 50)
                + Number(job.priority || 0) / 100;
              return {
                score,
                task_id: job.id,
                performer: job.performer,
                character: job.character,
                categories: job.categories,
                performance_modes: job.performance_modes,
                performer_on_wall: job.performer_on_wall,
                role_on_wall: job.role_on_wall,
                priority: job.priority,
                sources: job.sources,
                source_receipts: job.source_receipts,
                source_fingerprint: job.source_fingerprint,
                attempts: job.attempts,
                ferengi
              };
            })
            .sort((a,b) => b.score-a.score || String(a.task_id).localeCompare(String(b.task_id)));
          const completedMilestones = new Set((roadmap.completed || []).map(row => row.milestone));
          const report = {
            version: 1,
            generated_at: new Date().toISOString(),
            head: process.env.GITHUB_SHA,
            source: {
              autopilot_sha256: sha(autopilotBytes),
              media_audit_sha256: sha(auditBytes),
              roadmap_sha256: sha(roadmapBytes)
            },
            readiness: {
              star_trek_jobs: jobs.length,
              queued: jobs.filter(job => job.status === 'queued').length,
              in_flight: inFlight.map(job => ({task_id:job.id,status:job.status,performer:job.performer,character:job.character})),
              media_debt: debt.map(item => ({id:item.id,status:item.status,wall_id:item.wall_id,side:item.side})),
              gold_receipt_present: completedMilestones.has('star-trek-gold-shard')
            },
            strategy: [
              'First clear any in-flight task or media debt.',
              'Then prefer exact-source physical Ferengi gaps because the live species view exposes them directly.',
              'Within that set, prefer strong exact-revision receipts and roles likely to support a dedicated illustrated card.',
              'After the Ferengi front is visibly fuller, continue by source quality and media feasibility across the Star Trek queue.'
            ],
            top_candidates: rows.slice(0, 50)
          };
          fs.writeFileSync('/tmp/star-trek-population-plan/report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (inFlight.length || debt.length) process.exitCode = 2;
          NODE
      - name: Upload exact population plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-population-plan-${{ github.run_id }}
          path: /tmp/star-trek-population-plan
          if-no-files-found: error
          retention-days: 30
