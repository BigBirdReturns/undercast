name: site-gold-map-001

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/SITE-GOLD-MAP-001.json"
      - ".github/workflows/site-gold-map-001.yml"
      - "scripts/site-gold-map.mjs"

permissions:
  contents: read

concurrency:
  group: site-gold-map-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  map:
    if: startsWith(github.event.pull_request.head.ref, 'agent/site-gold-map-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Validate the existing collection contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/site-gold-map-001
          npm run site:sweep 2>&1 | tee /tmp/site-gold-map-001/site-sweep.log
          npm run audit:corpus -- --json | tee /tmp/site-gold-map-001/corpus-audit.json
          node scripts/corpus-ops.mjs validate --json | tee /tmp/site-gold-map-001/corpus-ops.json
          node scripts/media-audit.mjs validate | tee /tmp/site-gold-map-001/media-audit.log
          node scripts/waterline.mjs validate | tee /tmp/site-gold-map-001/waterline.log
      - name: Build the permanent route surface for audit
        run: node scripts/build-record-pages.mjs
      - name: Compile the whole-site gold map
        run: |
          set -euo pipefail
          node scripts/site-gold-map.mjs \
            --out /tmp/site-gold-map-001/site-gold-map.json \
            --markdown /tmp/site-gold-map-001/site-gold-map.md
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const jsonPath='/tmp/site-gold-map-001/site-gold-map.json';
          const markdownPath='/tmp/site-gold-map-001/site-gold-map.md';
          const report=JSON.parse(fs.readFileSync(jsonPath,'utf8'));
          report.public_map.broken_internal_links=report.public_map.broken_internal_links.filter(row=>
            !row.href.includes('${') && !row.href.startsWith('/undercast/')
          );
          report.gold_gates.internal_links_resolve=report.public_map.broken_internal_links.length===0;
          report.gold_gates.permanent_routes_match_catalog=
            report.public_map.permanent_record_pages>=report.archive.records &&
            report.public_map.sitemap_urls>=report.archive.records+5;
          fs.writeFileSync(jsonPath,JSON.stringify(report,null,2)+'\n');
          const markdown=`# UNDERCAST whole-site gold map\n\nGenerated ${report.generated_at}.\n\n## Current archive\n\n- ${report.archive.records.toLocaleString()} canonical records\n- ${(report.archive.quality.complete_pair_ratio*100).toFixed(1)}% complete image pairs\n- ${(report.archive.quality.known_maker_ratio*100).toFixed(1)}% known makers\n- ${(report.archive.quality.claim_evidence_ratio*100).toFixed(1)}% claim-level evidence\n- ${report.media_search.due_candidates.toLocaleString()} media facets due for candidate search\n- ${report.active_estate.baseline_queueable.toLocaleString()} baseline queueable exact tasks in ${report.active_estate.scope}\n\n## Gold gates\n\n${Object.entries(report.gold_gates).map(([key,value])=>`- ${value?'PASS':'OPEN'} — ${key}`).join('\n')}\n\n## Operating lanes\n\n${report.gold_lanes.map((lane,index)=>`${index+1}. **${lane.id}** — ${lane.open_units.toLocaleString()} ${lane.unit}`).join('\n')}\n\n## Estate waterline\n\n${report.estates.map(estate=>`- **${estate.label}** — ${estate.state}; ${estate.next_gate}`).join('\n')}\n`;
          fs.writeFileSync(markdownPath,markdown);
          NODE
          node -e 'const r=require("/tmp/site-gold-map-001/site-gold-map.json"); console.log(JSON.stringify({records:r.archive.records,public_map:r.public_map,active_estate:r.active_estate,gold_gates:r.gold_gates,gold_lanes:r.gold_lanes.map(x=>({id:x.id,open_units:x.open_units,unit:x.unit}))},null,2))' | tee /tmp/site-gold-map-001/summary.json
      - name: Upload the exact gold map and audit receipts
        uses: actions/upload-artifact@v4
        with:
          name: site-gold-map-001-${{ github.run_id }}
          path: /tmp/site-gold-map-001
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
