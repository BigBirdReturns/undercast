name: card-backfill-uc-124-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-124-RENDER.json"
      - "scripts/card-backfill-uc-124-render.part-00.mjs"
      - "scripts/card-backfill-uc-124-render.part-01.mjs"
      - "scripts/card-backfill-uc-124-render.part-02.mjs"
      - "scripts/card-backfill-uc-124-render.part-03.mjs"
      - ".github/workflows/card-backfill-uc-124-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-124-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-029'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-029
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-124 two-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-124-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-124');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-124');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_4885717de938b33c412d571d');
          if(row.version!==1||row.record_id!=='UC-124'||row.actor!=='James Earl Jones'||row.character!=='Mufasa (and Darth Vader)'||row.production!=='The Lion King / Star Wars'||row.year!==1994||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-124 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8701028244||row.discovery_artifact?.head_sha!=='ff6abc352fd56a14c02758a487c643f3ec97d802'||row.discovery_artifact?.zip_sha256!=='f77ad83376ca908563a0cff46b3f23e439319755941f23a82c51e9c4c177ae09'||row.discovery_artifact?.candidate_count!==2)throw new Error('UC-124 discovery custody drift');
          if(row.roles?.length!==2||row.roles[0]?.key!=='mufasa'||row.roles[1]?.key!=='vader'||row.roles[0]?.sha256!=='2b75544a317d0ff344dc2e3af005d00e9b6cc37abbb0f4c76cdcce303043049e'||row.roles[1]?.sha256!=='199a80bba0490bd2327409d90ae78fadbbcc1fed80782cdac1d8e6b9bb2d3921')throw new Error('UC-124 selected source drift');
          if(row.actor_role_custody?.length!==3||row.shared_role_page?.sha256!=='aa941b85b1f6f76489200c734ef9ccd4cde695082a5393d085c28d0a9ea4e8f6'||row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==624||row.render?.panel_height!==1000||row.render?.divider_width!==12||row.render?.face_height!==572||row.render?.internal_rule_height!==8||row.render?.context_height!==420||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-124 render geometry drift');
          if(!specimen||specimen.actor!=='James Earl Jones'||specimen.character!=='Mufasa (and Darth Vader)'||specimen.production!=='The Lion King / Star Wars'||specimen.years!=='1994'||specimen.still)throw new Error('UC-124 specimen boundary drift');
          if(source?.still)throw new Error('UC-124 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-124'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-124 audit boundary drift');
          console.log('PASS — exact UC-124 James Earl Jones two-role voice composite render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8701028244/zip" > "$root/discovery.zip"
          echo "f77ad83376ca908563a0cff46b3f23e439319755941f23a82c51e9c4c177ae09  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-124-discover"
          echo "8fd8ad5f24a053f80bc189332ea80439d05dbdae69d94ceb9608351b2dfeccbf  $source/manifest.json" | sha256sum -c -
          echo "75f121bdf427fc0b3075defd1cd38255fa254cf916f6ace2e8bfbc7cccd548b0  $source/summary.json" | sha256sum -c -
          echo "0c2b3a55eba3ddeb20e4ae85f3329a0e66d7a3cb11b7770505de884c8e32775f  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "d3d24bc26fa0ae5477578b6b5407ae1b157e969ce540740221f9ddecbb3377dc  $source/contact-sheet-mufasa.jpg" | sha256sum -c -
          echo "b39e74c2ed3e3c8124fdaa6fcde852b68ffa327054a1e7f5d09aed5232cb865a  $source/contact-sheet-vader.jpg" | sha256sum -c -
          echo "c65aba98879486a020146a588db1af9aa830017160484253254d2bc18b83e6c6  $source/pages/disney-remembering-james-earl-jones.png" | sha256sum -c -
          echo "0a7a2d06cb2e256506436d3d5d9f1cd18d7972909a7b9c7d1310a47e92f92581  $source/pages/starwars-james-earl-jones-vader.png" | sha256sum -c -
          echo "7e18062613423b566cee9363dec3004d327714c832b4ee417398d49ff9059492  $source/pages/d23-lion-king-1994-film.png" | sha256sum -c -
          echo "aa941b85b1f6f76489200c734ef9ccd4cde695082a5393d085c28d0a9ea4e8f6  $source/pages/d23-remembering-mufasa.png" | sha256sum -c -
          echo "aa941b85b1f6f76489200c734ef9ccd4cde695082a5393d085c28d0a9ea4e8f6  $source/pages/d23-remembering-vader.png" | sha256sum -c -
          echo "2b75544a317d0ff344dc2e3af005d00e9b6cc37abbb0f4c76cdcce303043049e  $source/candidates/mufasa/001-d23-caption-local-1994-animated-mufasa-and-simba-still.jpg" | sha256sum -c -
          echo "199a80bba0490bd2327409d90ae78fadbbcc1fed80782cdac1d8e6b9bb2d3921  $source/candidates/vader/001-d23-caption-local-empire-strikes-back-darth-vader-still.jpg" | sha256sum -c -
      - name: Render exact two-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-124-render/discovery/card-backfill-uc-124-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-124-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-124-render"
          cat scripts/card-backfill-uc-124-render.part-00.mjs scripts/card-backfill-uc-124-render.part-01.mjs scripts/card-backfill-uc-124-render.part-02.mjs scripts/card-backfill-uc-124-render.part-03.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-124-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-124-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-124-render/output
            ${{ runner.temp }}/card-backfill-uc-124-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
