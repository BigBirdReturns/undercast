name: collection-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  collection-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce collection-only product freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/corpus-ops.mjs check-pr --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH" --json

      - name: Package four qualified DEC-0016 source files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/ux-02a-qualified-sources.tgz" \
            assets/site-navigation.js \
            assets/site-shell.css \
            scripts/site-seams.mjs \
            tests/rendered/ux-journeys.spec.mjs

      - name: Upload qualified DEC-0016 source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-qualified-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-qualified-sources.tgz
          if-no-files-found: error
          retention-days: 1
