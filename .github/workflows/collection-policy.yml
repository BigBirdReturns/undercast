name: collection-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  collection-mode:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce collection-only product freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/corpus-ops.mjs check-pr --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH" --json

  dec0016-navigation-transaction:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/collection-only-operations' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: /tmp/ux-02a-dec0016-evidence
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Record DEC-0016 transaction start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          printf 'status=started\nrun=%s\nevent_base=%s\nevent_head=%s\n' \
            "$GITHUB_RUN_ID" "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" \
            > "$EVIDENCE/start.txt"
          jq -n --arg body "UX-02A DEC-0016 target run ${GITHUB_RUN_ID} started on carrier ${EVENT_HEAD_SHA} against base ${EVENT_BASE_SHA}." '{body:$body}' > /tmp/ux02a-start.json
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/ux02a-start.json \
            "https://api.github.com/repos/BigBirdReturns/undercast/issues/255/comments" \
            >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: agent/collection-only-operations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Materialize, qualify, and publish DEC-0016
        shell: bash
        run: |
          cp tmp/ux02a-materialize.sh /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          bash /tmp/ux02a-materialize.sh

      - name: Record failed DEC-0016 transaction
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          stage="$(awk -F= '$1=="stage"{print $2}' "$EVIDENCE/status.txt" 2>/dev/null || true)"
          stage="${stage:-unknown}"
          jq -n --arg body "UX-02A DEC-0016 target run ${GITHUB_RUN_ID} failed at stage ${stage} on carrier ${EVENT_HEAD_SHA}; no product authority was published." '{body:$body}' > /tmp/ux02a-failure.json
          curl --silent --show-error --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/ux02a-failure.json \
            "https://api.github.com/repos/BigBirdReturns/undercast/issues/255/comments" \
            >/dev/null || true

      - name: Upload DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-final-${{ github.run_id }}
          path: /tmp/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
