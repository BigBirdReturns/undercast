name: collection-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  collection-mode:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce collection-only product freeze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/corpus-ops.mjs check-pr --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH" --json

  dec0016-navigation-transaction:
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/collection-only-operations' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-dec0016-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collection-only-operations
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Materialize, qualify, and publish DEC-0016
        shell: bash
        run: |
          cp tmp/ux02a-materialize.sh /tmp/ux02a-materialize.sh
          chmod +x /tmp/ux02a-materialize.sh
          bash /tmp/ux02a-materialize.sh

      - name: Upload DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-final-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
