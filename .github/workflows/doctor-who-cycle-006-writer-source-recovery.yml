name: doctor-who-cycle-006-writer-source-recovery

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/doctor-who-cycle-006-writer-source-recovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-006-writer-source-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-006-writer-source-recovery.yml
  EXACT_MAIN: c340dc710e423a86b2ad3afa3fcf38a2751e8eb7
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  SOURCE_COMMIT: 87894051e3c0c3b177579f5c59c5fa122e1c4d8a
  SOURCE_TRANSPORT_SHA256: b0d0ca739415ff4224f88b98422ed7891bca3e4c1b48f41cee77dcbd3ba240a1
  OUT: /tmp/doctor-who-cycle-006-writer-source-recovery

jobs:
  recover:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none

      - name: Bind exact current main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" > /tmp/expected-paths.txt
          git diff --name-only "$EXACT_MAIN"...HEAD | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          test -z "$(git status --porcelain)"

      - name: Recover exact cycle-005 transport and sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/source" "$OUT/extracted"
          for path in \
            .ci/doctor-who-cycle-005/scripts.tgz.b64 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-002 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-003 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-004 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-005 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-006 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-007 \
            .ci/doctor-who-cycle-005/scripts.tgz.b64.part-008 \
            .github/workflows/complete-doctor-who-cycle-005-kaarsh.yml; do
            mkdir -p "$OUT/source/$(dirname "$path")"
            git show "$SOURCE_COMMIT:$path" > "$OUT/source/$path"
          done
          cat \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-002" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-003" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-004" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-005" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-006" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-007" \
            "$OUT/source/.ci/doctor-who-cycle-005/scripts.tgz.b64.part-008" \
            | tr -d '\n\r\t ' | base64 --decode > "$OUT/cycle-005-transport.tgz"
          test "$(sha256sum "$OUT/cycle-005-transport.tgz" | awk '{print $1}')" = "$SOURCE_TRANSPORT_SHA256"
          tar -xzf "$OUT/cycle-005-transport.tgz" -C "$OUT/extracted"
          find "$OUT/extracted" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/extracted.sha256"
          node --check "$OUT/extracted/apply-doctor-who-cycle-005.mjs"
          node --check "$OUT/extracted/apply-doctor-who-cycle-finalize-005.mjs"
          bash -n "$OUT/extracted/01-bind-decode.sh"
          bash -n "$OUT/extracted/02-materialize.sh"
          bash -n "$OUT/extracted/03-candidate-gate.sh"
          bash -n "$OUT/extracted/04-candidate-commit.sh"
          bash -n "$OUT/extracted/05-finalize.sh"
          bash -n "$OUT/extracted/06-final-gate-publish.sh"
          printf '%s\n' "$EXACT_MAIN" > "$OUT/exact-main.txt"
          printf '%s\n' "$HEAD_SHA" > "$OUT/carrier-head.txt"
          cp /tmp/expected-paths.txt "$OUT/"
          cp /tmp/actual-paths.txt "$OUT/"
          test -z "$(git status --porcelain)"

      - name: Recover exact cycle-006 evidence packets
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-preflight-30950611825
          path: ${{ env.OUT }}/cycle-006-selection
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30950611825

      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-kayste-media-preflight-30951744686
          path: ${{ env.OUT }}/cycle-006-media
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30951744686

      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-006-current-main-rebind-30953767874
          path: ${{ env.OUT }}/cycle-006-current-main-rebind
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 30953767874

      - name: Verify recovered cycle-006 packet identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$OUT/cycle-006-selection/selected-task.json" | awk '{print $1}')" = "$(sha256sum "$OUT/cycle-006-current-main-rebind/selection/selected-task.json" | awk '{print $1}')"
          test "$(sha256sum "$OUT/cycle-006-media/dan-starkey-candidate-420x600.jpg" | awk '{print $1}')" = "0c08fa4fa7f597ee55589e884e8a9d60f3e4e79500a714ff69891ad7f13d9368"
          test "$(sha256sum "$OUT/cycle-006-current-main-rebind/kayste-performer-portrait-candidate.jpg" | awk '{print $1}')" = "0c08fa4fa7f597ee55589e884e8a9d60f3e4e79500a714ff69891ad7f13d9368"
          test "$(cat "$OUT/cycle-006-current-main-rebind/current-main-rebind.sha256" | tr -d '\n')" = "ff94801281b28df3dd4f6ccbf1872228bb057f897fd1b978ad009032977e3447"
          test -z "$(git status --porcelain)"

      - name: Upload exact recovered writer sources
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-006-writer-source-recovery-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: ${{ env.OUT }}
