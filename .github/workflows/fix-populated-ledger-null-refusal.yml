name: fix-populated-ledger-null-refusal

on:
  push:
    branches:
      - agent/operational-metric-ledger-custody
    paths:
      - .github/workflows/fix-populated-ledger-null-refusal.yml

permissions:
  contents: write

concurrency:
  group: fix-populated-ledger-null-refusal
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-metric-ledger-custody
  AUTHORIZED_CLEAN_HEAD: 8e938d9fcb6c41ad5d3fde4f5af888a4b3ea8502
  SELF: .github/workflows/fix-populated-ledger-null-refusal.yml
  PATCHER: scripts/apply-populated-ledger-null-refusal.py
  RECEIPT: data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact null-refusal denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$AUTHORIZED_CLEAN_HEAD" HEAD

          printf '%s\n' "$SELF" "$PATCHER" | sort > /tmp/expected-start-paths.txt
          git diff --name-only "$AUTHORIZED_CLEAN_HEAD...HEAD" | sort > /tmp/actual-start-paths.txt
          diff -u /tmp/expected-start-paths.txt /tmp/actual-start-paths.txt

      - name: Apply populated-ledger null refusal and focused proof
        run: |
          set -euo pipefail
          python "$PATCHER"
          node --check scripts/lib/waterline.mjs
          node --check scripts/metric-readiness-fixtures.mjs
          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/current-status.json

      - name: Author null-refusal receipt extension and run candidate gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const { createHash } = require('crypto');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.reviewed_by = 'chatgpt-second-desk';
          receipt.reviewed_role = 'second-desk';
          receipt.authorization.review_threads = [...new Set([
            ...(receipt.authorization.review_threads || []),
            3699900579,
          ])].sort((a, b) => a - b);
          receipt.authorization.populated_ledger_null_refusal_workflow_head = process.env.GITHUB_SHA;
          receipt.authorization.populated_ledger_null_refusal_workflow_run = Number(process.env.GITHUB_RUN_ID);
          receipt.corrections.null_receipt_against_populated_ledger_refused = true;
          receipt.corrections.populated_ledger_requires_exact_derived_numeric_value = true;
          receipt.evidence.current_readiness = JSON.parse(fs.readFileSync('/tmp/current-status.json', 'utf8')).evidence_readiness;
          receipt.evidence.files ||= {};
          for (const path of [
            'scripts/lib/waterline.mjs',
            'scripts/metric-readiness-fixtures.mjs',
            'docs/OPERATIONAL-METRICS.md',
          ]) {
            receipt.evidence.files[path] = createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          }
          receipt.evidence.populated_ledger_null_refusal_fixture = 'PASS';
          receipt.populated_ledger_null_refusal_extension = {
            status: 'candidate',
            current_null_plus_populated_snapshot_refused: true,
            numeric_to_null_migration_path_unchanged: true,
            exact_numeric_binding_required: true,
            candidate_complete_gate_required: true,
            final_complete_gate_required: true,
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          git add \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            docs/OPERATIONAL-METRICS.md \
            "$RECEIPT"
          git diff --cached --check
          npm run gate 2>&1 | tee /tmp/populated-null-candidate-gate.log

      - name: Retire temporary authority, promote receipt, and gate final tree
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          node - <<'NODE'
          const fs = require('fs');
          const receiptPath = process.env.RECEIPT;
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          receipt.reviewed_at = new Date().toISOString();
          receipt.populated_ledger_null_refusal_extension.status = 'smoke-passed';
          receipt.populated_ledger_null_refusal_extension.candidate_complete_gate_passed = true;
          receipt.populated_ledger_null_refusal_extension.candidate_rendered_browser_included = true;
          receipt.populated_ledger_null_refusal_extension.final_complete_gate_passed = true;
          receipt.populated_ledger_null_refusal_extension.final_rendered_browser_included = true;
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          git add "$RECEIPT"
          git rm "$SELF" "$PATCHER"
          git diff --cached --check

          node scripts/metric-readiness-fixtures.mjs
          npm run waterline:fixtures
          node scripts/waterline.mjs validate
          npm run gate 2>&1 | tee /tmp/populated-null-final-gate.log

      - name: Publish exact clean null-refusal custody under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"

          printf '%s\n' \
            data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json \
            docs/OPERATIONAL-METRICS.md \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            | sort > /tmp/expected-extension-paths.txt
          git diff --cached --name-only "$AUTHORIZED_CLEAN_HEAD" | sort > /tmp/actual-extension-paths.txt
          diff -u /tmp/expected-extension-paths.txt /tmp/actual-extension-paths.txt

          base="$(git merge-base refs/remotes/origin/main "$AUTHORIZED_CLEAN_HEAD")"
          printf '%s\n' \
            data/review/operational-reliability/metric-ledger-custody-hotfix-2026-08-02.json \
            docs/OPERATIONAL-METRICS.md \
            scripts/lib/metric-readiness.mjs \
            scripts/lib/waterline.mjs \
            scripts/metric-readiness-fixtures.mjs \
            scripts/waterline.mjs \
            | sort > /tmp/expected-final-paths.txt
          git diff --cached --name-only "$base" | sort > /tmp/actual-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/actual-final-paths.txt

          git config user.name undercast-operational-reliability
          git config user.email undercast-operational-reliability@users.noreply.github.com
          git commit \
            -m 'Operations: reject null receipts against populated ledgers' \
            -m 'require exact ledger-derived numeric custody after the first observation'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"

      - name: Upload null-refusal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: populated-ledger-null-refusal-${{ github.run_id }}
          path: |
            /tmp/current-status.json
            /tmp/populated-null-candidate-gate.log
            /tmp/populated-null-final-gate.log
            /tmp/expected-start-paths.txt
            /tmp/actual-start-paths.txt
            /tmp/expected-extension-paths.txt
            /tmp/actual-extension-paths.txt
            /tmp/expected-final-paths.txt
            /tmp/actual-final-paths.txt
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
