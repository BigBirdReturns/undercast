name: patch-doctor-who-cycle-002-checker-indent

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-doctor-who-cycle-002-checker-indent.yml"

permissions:
  contents: write

concurrency:
  group: patch-doctor-who-cycle-002-checker-indent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 64

      - name: Restore exact heredoc indentation without changing checker semantics
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
          SELF: .github/workflows/patch-doctor-who-cycle-002-checker-indent.yml
          WRITER: .github/workflows/complete-doctor-who-cycle-002-v2.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git fetch --no-tags --depth=64 origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if 'const receiptHashLines =' in line]
          ends = [i for i, line in enumerate(lines) if 'finalizerText = finalizerText.replace(receiptHashBefore, receiptHashAfter);' in line]
          if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
              raise SystemExit(f'expected one marker patch block, starts={starts}, ends={ends}')
          for i in range(starts[0], ends[0] + 1):
              lines[i] = '          ' + lines[i].lstrip()
          updated = '\n'.join(lines) + '\n'
          block = lines[starts[0]:ends[0] + 1]
          if len(block) != 5 or any(not line.startswith('          ') for line in block):
              raise SystemExit(f'checker patch indentation invalid: {block!r}')
          if updated.count("line.includes('cycle 002 receipt hash drifted')") != 1:
              raise SystemExit('marker-based checker replacement missing')
          if updated.count('JSON.stringify(stable(receiptBody), null, 2)') != 1:
              raise SystemExit('pretty stable receipt hash replacement missing')
          path.write_text(updated)
          PY

          sed -n '/const receiptHashLines =/,/finalizerText = finalizerText.replace/p' "$WRITER" | tee /tmp/checker-block.txt
          test "$(wc -l < /tmp/checker-block.txt)" -eq 5
          test "$(grep -c '^          ' /tmp/checker-block.txt)" -eq 5
          git rm "$SELF"
          git add "$WRITER"
          git diff --cached --check
          git commit \
            -m 'Doctor Who: restore Gredd checker-patch heredoc indentation' \
            -m 'retain marker-based pretty-JSON hashing while restoring a valid workflow block'
          patched_head="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "patched_head=$patched_head" >> "$GITHUB_STEP_SUMMARY"
