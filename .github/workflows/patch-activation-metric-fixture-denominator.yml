name: patch-activation-metric-fixture-denominator

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/patch-activation-metric-fixture-denominator.yml"

permissions:
  contents: write

concurrency:
  group: patch-activation-metric-fixture-denominator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/patch-activation-metric-fixture-denominator.yml
  PRIMARY: .github/workflows/apply-doctor-who-activation-001.yml

jobs:
  patch:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Extend the exact durable denominator by the metric readiness fixture
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-doctor-who-activation-001.yml')
          text = path.read_text()

          add_old = '''            scripts/corpus-ops-fixtures.mjs \\
            scripts/doctor-who-activation.mjs \\
'''
          add_new = '''            scripts/corpus-ops-fixtures.mjs \\
            scripts/doctor-who-activation.mjs \\
            scripts/metric-readiness-fixtures.mjs \\
'''
          if text.count(add_old) != 1:
              raise SystemExit(f'git-add denominator: expected one match, found {text.count(add_old)}')
          text = text.replace(add_old, add_new)

          paths_old = '''          scripts/lib/waterline.mjs
          scripts/waterline-fixtures.mjs
'''
          paths_new = '''          scripts/lib/waterline.mjs
          scripts/metric-readiness-fixtures.mjs
          scripts/waterline-fixtures.mjs
'''
          if text.count(paths_old) != 1:
              raise SystemExit(f'final-path denominator: expected one match, found {text.count(paths_old)}')
          path.write_text(text.replace(paths_old, paths_new))
          PY

          git add "$PRIMARY"
          git rm "$SELF"
          git diff --cached --check
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Activation: bind global-cycle metric fixture custody' \
            -m 'stage and receipt the synthetic readiness config updated by the activation contract'

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
