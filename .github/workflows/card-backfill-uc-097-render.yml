name: card-backfill-uc-097-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-097-RENDER.json"
      - "scripts/card-backfill-uc-097-render.mjs"
      - ".github/workflows/card-backfill-uc-097-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-097-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-022'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-022
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-097 render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-097-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-097');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-097');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_fcd930a024862c1c231e65a9');
          if(row.version!==1||row.record_id!=='UC-097'||row.actor!=='Dan Stevens'||row.character!=='The Beast'||row.production!=='Beauty and the Beast'||row.year!==2017||row.side!=='still')throw new Error('UC-097 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8672632130||row.discovery_artifact?.head_sha!=='a7187b21025111fa726c91d91e4026d58368ac6e'||row.discovery_artifact?.candidate_count!==6||row.discovery_artifact?.represented_asset_count!==2)throw new Error('UC-097 discovery custody drift');
          if(row.selected_source?.sha256!=='35d665bf92d29fb1eb1d84556769eced61e354a8b2969f2cd1f823b82816edae'||row.selected_source?.width!==1200||row.selected_source?.height!==560)throw new Error('UC-097 source identity drift');
          if(row.role_custody?.release_and_cast?.sha256!=='5faba6091822edbe4a706ea9b26dd6a25578f306bae00cfdc3160e8ddb1f37c7'||row.role_custody?.digital_costume?.sha256!=='5d75987585525a220fd0ba54dd92829c42b5a78c061e9845dcc672c4d9825cb3')throw new Error('UC-097 role custody drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.candidate_gravity!=='center'||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-097 render denominator drift');
          if(!specimen||specimen.character!=='The Beast'||specimen.production!=='Beauty and the Beast'||specimen.years!=='2017'||specimen.still)throw new Error('UC-097 specimen boundary drift');
          if(source?.still)throw new Error('UC-097 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-097'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-097 audit boundary drift');
          console.log(`PASS — UC-097 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-097-render"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8672632130/zip" > "$root/discovery.zip"
          echo "aae2a85e0f7caead6a8c880d04312b317e64eb31166208d95e078280e2bb9f38  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-097-discover"
          test -f "$base/manifest.json"
          echo "736ea6f1aaaeb4fee02d8a9faa37a1aee88f8bf0fc31844cc81e222214a4abc9  $base/manifest.json" | sha256sum -c -
          echo "f680fe240ffc1c070db180b6970aae48ba9d47880d28fa3be3a0aeb72abc2c2a  $base/summary.json" | sha256sum -c -
          echo "0fcefe5832b0ec65f9299279a73ce76fc25377157a8f268bdb8cc38fd9f2c141  $base/contact-sheet-final.jpg" | sha256sum -c -
          echo "35d665bf92d29fb1eb1d84556769eced61e354a8b2969f2cd1f823b82816edae  $base/candidates/001-library-map-scene-declared-delivery.jpg" | sha256sum -c -
          echo "2ca34fc0ecfc75817179e33506f6dd1ca879f691a0b55199d692696090e8d226  $base/pages/disney-movies-2017.png" | sha256sum -c -
          echo "5faba6091822edbe4a706ea9b26dd6a25578f306bae00cfdc3160e8ddb1f37c7  $base/pages/disney-company-announcement.png" | sha256sum -c -
          echo "5d75987585525a220fd0ba54dd92829c42b5a78c061e9845dcc672c4d9825cb3  $base/pages/d23-beast-costume.png" | sha256sum -c -
      - name: Render exact candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-097-render/source/card-backfill-uc-097-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-097-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-097-render.mjs
          node scripts/card-backfill-uc-097-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-097-render-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-097-render"
          rm -rf "$root/source" "$root/discovery.zip"
      - name: Upload exact source, custody, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-097-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-097-render/output
            ${{ runner.temp }}/card-backfill-uc-097-render-run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
