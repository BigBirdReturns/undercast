name: doctor-who-cycle-012-preflight-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v4
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-preflight-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      TREE: dc82d03d761fd39291d792b170488fc242a0d322
      BRANCH: agent/doctor-who-cycle-012-preflight-v4
      SELF: .github/workflows/doctor-who-cycle-012-preflight-v4.yml
      OUT: /tmp/doctor-who-cycle-012-preflight-v4
      PROOF_PACKET: /tmp/doctor-who-cycle-012-preflight-v4-proof
      PROOF_PR: "856"
      PROOF_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4
      PROOF_HEAD: f47f0845de78496f20f3ce4446921ce1d9637afd
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-terminal-observer-v4-31360254095-attempt-1
      PROOF_ARTIFACT_SHA256: 3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d
      PROOF_IDENTITY: 9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      SUPERSEDED_OBSERVER_HEAD: 9b216166013f4db703e62642bc5bcf63871d7616
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      STALE_BRANCHES_JSON: '["agent/doctor-who-cycle-012-candidate-parameter-census-v1","agent/doctor-who-cycle-012-candidate-source-inspection-v1","agent/doctor-who-cycle-012-evidence-preflight-v1","agent/doctor-who-cycle-012-evidence-preflight-v2","agent/doctor-who-cycle-012-media-census-v1","agent/doctor-who-cycle-012-media-census-v2","agent/doctor-who-cycle-012-media-review-v1","agent/doctor-who-cycle-012-preflight-v1"]'
      STALE_PRS_JSON: '[{"pr":793,"branch":"agent/doctor-who-cycle-012-preflight-v1"},{"pr":794,"branch":"agent/doctor-who-cycle-012-evidence-preflight-v2"},{"pr":795,"branch":"agent/doctor-who-cycle-012-media-census-v2"},{"pr":796,"branch":"agent/doctor-who-cycle-012-media-review-v1"},{"pr":797,"branch":"agent/doctor-who-cycle-012-candidate-source-inspection-v1"},{"pr":798,"branch":"agent/doctor-who-cycle-012-candidate-parameter-census-v1"}]'
      PRIOR_SELECTOR_HEAD: 2ac91f593375cc114bb16ed11873d09acec40af5
      PRIOR_SELECTOR_PATH: .github/workflows/doctor-who-cycle-011-preflight-v1.yml
      PRIOR_SELECTOR_BLOB: 49e902869ea04409d40690dff73e7ad10f8cc5c1
      ACTIVE_PROFILE: text-vision

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind one-commit selector and terminal proof source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PROOF_PACKET"
          mkdir -p "$OUT"/{api,receipt,logs,source,payload} "$PROOF_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$MAIN"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN" > "$OUT/api/proof-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROOF_RUN/jobs?per_page=100" > "$OUT/api/proof-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT" > "$OUT/api/proof-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT/zip" > "$OUT/proof.zip"
          test "$(sha256sum "$OUT/proof.zip" | awk '{print $1}')" = "$PROOF_ARTIFACT_SHA256"
          test "$(jq -r '.digest' "$OUT/api/proof-artifact.json")" = "sha256:$PROOF_ARTIFACT_SHA256"

          CARRIER_PR="$pr" CARRIER_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          api = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((api / name).read_text())
          carrier = load('carrier-pr.json')
          proof_pr = load('proof-pr.json')
          proof_run = load('proof-run.json')
          proof_jobs = load('proof-jobs.json')['jobs']
          proof_artifact = load('proof-artifact.json')
          assert carrier['number'] == int(os.environ['CARRIER_PR'])
          assert carrier['state'] == 'open' and carrier['draft'] is True and carrier['merged_at'] is None
          assert carrier['base']['sha'] == os.environ['MAIN']
          assert carrier['head']['ref'] == os.environ['BRANCH'] and carrier['head']['sha'] == os.environ['CARRIER_HEAD']
          assert carrier['commits'] == 1 and carrier['changed_files'] == 1
          assert proof_pr['number'] == int(os.environ['PROOF_PR'])
          assert proof_pr['state'] == 'open' and proof_pr['draft'] is True and proof_pr['merged_at'] is None
          assert proof_pr['base']['sha'] == os.environ['MAIN']
          assert proof_pr['head']['ref'] == os.environ['PROOF_BRANCH'] and proof_pr['head']['sha'] == os.environ['PROOF_HEAD']
          assert proof_pr['commits'] == 1 and proof_pr['changed_files'] == 1
          assert proof_run['id'] == int(os.environ['PROOF_RUN'])
          assert proof_run['head_sha'] == os.environ['PROOF_HEAD'] and proof_run['head_branch'] == os.environ['PROOF_BRANCH']
          assert proof_run['event'] == 'pull_request' and proof_run['status'] == 'completed' and proof_run['conclusion'] == 'success'
          rows = [row for row in proof_jobs if row['id'] == int(os.environ['PROOF_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'prove' and rows[0]['conclusion'] == 'success'
          assert proof_artifact['id'] == int(os.environ['PROOF_ARTIFACT'])
          assert proof_artifact['name'] == os.environ['PROOF_ARTIFACT_NAME']
          assert proof_artifact['digest'] == 'sha256:' + os.environ['PROOF_ARTIFACT_SHA256'] and proof_artifact['expired'] is False
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Authenticate terminal proof and freeze exact stale transports
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$OUT/proof.zip" TARGET="$PROOF_PACKET" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = Path(os.environ['TARGET'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledgers = []
          for sealed in target.rglob('SHA256SUMS'):
              pre = sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():
                  continue
              assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
              count = 0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():
                      continue
                  digest, name = raw.split(None, 1)
                  path = sealed.parent / name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes()) == digest
                  count += 1
              ledgers.append({'root': sealed.parent.relative_to(target).as_posix(), 'rows': count, 'sha256': sha(pre.read_bytes())})
          assert ledgers
          rows = []
          for path in target.rglob('terminal-proof.json'):
              data = json.loads(path.read_text())
              if data.get('status') == 'cycle-011-rastel-terminal-cleanup-independently-proved-v1':
                  rows.append((path, data))
          assert len(rows) == 1
          _, proof = rows[0]
          identity = proof.pop('identity')
          assert identity == os.environ['PROOF_IDENTITY']
          assert sha(json.dumps(proof, sort_keys=True, separators=(',', ':')).encode()) == identity
          proof['identity'] = identity
          assert proof['observer'] == {
              'pr': int(os.environ['PROOF_PR']),
              'head': os.environ['PROOF_HEAD'],
              'branch': os.environ['PROOF_BRANCH'],
              'run': int(os.environ['PROOF_RUN']),
              'attempt': 1,
          }
          assert proof['canonical'] == {
              'main': os.environ['MAIN'],
              'parent': '120a81e988c045695b55089afe5f8e3d82012f8d',
              'tree': os.environ['TREE'],
              'proved_product_commit': '276e3a737318bd2487c0c641f038a71e0543cf55',
              'product_file_delta': 0,
              'writer_paths_absent': True,
              'prefix_refs_remaining': 0,
          }
          assert proof['queue'] == {'total': 316, 'queued': 305, 'resolved': 11, 'in_flight': 0}
          assert proof['media'] == {'complete': 22, 'total': 22, 'debt': 0}
          assert proof['cleanup'] == {'authorized_prefix_refs': 93, 'auxiliary_refs': 2, 'pull_requests': 6, 'remaining_prefix_refs': 0, 'writers_remaining': 0}
          assert all(proof['gates'].values())
          assert proof['authority'] == {
              'cycle_011_cleanup_complete': True,
              'cycle_012_selection_authorized': True,
              'cycle_012_lease_issued': False,
              'cycle_012_product_authority': False,
              'repository_mutation': False,
              'canonical_mutation': False,
              'outside_human_dependency': False,
              'owner_physical_action_required': False,
          }
          markers = list(target.rglob('TERMINAL_PROOF_COMPLETE'))
          assert len(markers) == 1 and markers[0].read_text().strip() == identity
          root = Path(os.environ['OUT'])
          (root / 'receipt/terminal-proof.json').write_text(json.dumps(proof, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/proof-ledgers.json').write_text(json.dumps(ledgers, indent=2, sort_keys=True) + '\n')
          PY

          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/cycle12-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PROOF_BRANCH" > "$OUT/api/proof-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$SUPERSEDED_OBSERVER_BRANCH" > "$OUT/api/superseded-observer-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PROOF_PR" > "$OUT/api/proof-pr-live.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SUPERSEDED_OBSERVER_PR" > "$OUT/api/superseded-observer-pr.json"
          for number in 793 794 795 796 797 798; do
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/stale-pr-$number.json"
          done
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          stale = json.loads(os.environ['STALE_BRANCHES_JSON'])
          expected_prs = json.loads(os.environ['STALE_PRS_JSON'])
          raw_refs = json.loads((api / 'cycle12-refs.json').read_text())
          refs = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in raw_refs]
          observed = {row['branch'] for row in refs}
          expected = set(stale) | {os.environ['BRANCH']}
          assert observed == expected, {'extra': sorted(observed - expected), 'missing': sorted(expected - observed)}
          by_branch = {row['branch']: row['head'] for row in refs}
          stale_refs = [{'branch': branch, 'head': by_branch[branch], 'kind': 'stale-cycle-012'} for branch in sorted(stale)]
          stale_prs = []
          mapped = {row['branch']: row['pr'] for row in expected_prs}
          for branch, number in mapped.items():
              pr = json.loads((api / f'stale-pr-{number}.json').read_text())
              assert pr['number'] == number
              assert pr['head']['ref'] == branch and pr['head']['sha'] == by_branch[branch]
              assert pr['merged_at'] is None and pr['draft'] is True
              assert pr['state'] in {'open', 'closed'}
              stale_prs.append({'pr': number, 'branch': branch, 'head': by_branch[branch], 'action': 'close_without_merge' if pr['state'] == 'open' else 'none'})
          for branch in sorted(set(stale) - set(mapped)):
              rows = json.loads(subprocess.check_output([
                  'gh', 'api', '--method', 'GET', f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls",
                  '-f', 'state=all', '-f', f"head={os.environ['GITHUB_REPOSITORY_OWNER']}:{branch}", '-f', 'per_page=100'
              ], text=True))
              assert rows == [], (branch, [(row['number'], row['state']) for row in rows])
          proof_ref = json.loads((api / 'proof-ref.json').read_text())
          superseded_ref = json.loads((api / 'superseded-observer-ref.json').read_text())
          proof_pr = json.loads((api / 'proof-pr-live.json').read_text())
          superseded_pr = json.loads((api / 'superseded-observer-pr.json').read_text())
          assert proof_ref['object']['sha'] == os.environ['PROOF_HEAD']
          assert superseded_ref['object']['sha'] == os.environ['SUPERSEDED_OBSERVER_HEAD']
          assert proof_pr['number'] == int(os.environ['PROOF_PR']) and proof_pr['state'] == 'open' and proof_pr['merged_at'] is None
          assert proof_pr['head']['ref'] == os.environ['PROOF_BRANCH'] and proof_pr['head']['sha'] == os.environ['PROOF_HEAD']
          assert superseded_pr['number'] == int(os.environ['SUPERSEDED_OBSERVER_PR']) and superseded_pr['state'] == 'closed' and superseded_pr['merged_at'] is None
          assert superseded_pr['head']['ref'] == os.environ['SUPERSEDED_OBSERVER_BRANCH'] and superseded_pr['head']['sha'] == os.environ['SUPERSEDED_OBSERVER_HEAD']
          observer_refs = [
              {'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'kind': 'consumed-terminal-proof'},
              {'branch': os.environ['SUPERSEDED_OBSERVER_BRANCH'], 'head': os.environ['SUPERSEDED_OBSERVER_HEAD'], 'kind': 'superseded-terminal-proof'},
          ]
          observer_prs = [
              {'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'action': 'close_without_merge'},
              {'pr': int(os.environ['SUPERSEDED_OBSERVER_PR']), 'branch': os.environ['SUPERSEDED_OBSERVER_BRANCH'], 'head': os.environ['SUPERSEDED_OBSERVER_HEAD'], 'action': 'none'},
          ]
          custody = {
              'status': 'cycle-012-preselection-transport-custody-frozen-v1',
              'version': 1,
              'canonical_main': os.environ['MAIN'],
              'selector': {'branch': os.environ['BRANCH'], 'head': os.environ['CARRIER_HEAD'], 'pr': int(os.environ['CARRIER_PR'])},
              'proof': {'pr': int(os.environ['PROOF_PR']), 'branch': os.environ['PROOF_BRANCH'], 'head': os.environ['PROOF_HEAD'], 'run': int(os.environ['PROOF_RUN']), 'job': int(os.environ['PROOF_JOB']), 'artifact': int(os.environ['PROOF_ARTIFACT']), 'artifact_sha256': os.environ['PROOF_ARTIFACT_SHA256'], 'identity': os.environ['PROOF_IDENTITY']},
              'refs_to_delete': stale_refs + observer_refs,
              'pull_requests': sorted(stale_prs + observer_prs, key=lambda row: row['pr']),
              'counts': {'stale_cycle12_refs': len(stale_refs), 'observer_refs': len(observer_refs), 'refs_to_delete': len(stale_refs) + len(observer_refs), 'pull_requests': len(stale_prs) + len(observer_prs)},
              'boundary': {'selection_required_before_write': True, 'exact_heads_frozen': True, 'force_update': False, 'merge': False, 'main_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False},
          }
          custody['identity'] = hashlib.sha256(json.dumps(custody, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/transport-custody.json').write_text(json.dumps(custody, indent=2, sort_keys=True) + '\n')
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Rehydrate terminal main and rerun complete selector gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$MAIN"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Recover and execute the exact repository-native selector command
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/contents/$PRIOR_SELECTOR_PATH?ref=$PRIOR_SELECTOR_HEAD" > "$OUT/api/prior-selector-source.json"
          test "$(jq -r '.sha' "$OUT/api/prior-selector-source.json")" = "$PRIOR_SELECTOR_BLOB"
          jq -r '.content' "$OUT/api/prior-selector-source.json" | tr -d '\n' | base64 -d > "$OUT/source/prior-selector.yml"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['OUT'])
          text = (root / 'source/prior-selector.yml').read_text()
          blocks = []
          lines = text.splitlines()
          index = 0
          while index < len(lines):
              if re.match(r'^\s+run:\s*\|\s*$', lines[index]):
                  indent = len(lines[index]) - len(lines[index].lstrip())
                  index += 1
                  body = []
                  while index < len(lines):
                      current = lines[index]
                      current_indent = len(current) - len(current.lstrip())
                      if current.strip() and current_indent <= indent:
                          break
                      body.append(current[indent + 2:] if len(current) >= indent + 2 else '')
                      index += 1
                  blocks.append('\n'.join(body))
                  continue
              index += 1
          candidates = []
          for block in blocks:
              logical = []
              pending = ''
              for raw in block.splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  pending = (pending + ' ' + line).strip()
                  if pending.endswith('\\'):
                      pending = pending[:-1].strip()
                      continue
                  logical.append(pending)
                  pending = ''
              if pending:
                  logical.append(pending)
              for line in logical:
                  lower = line.lower()
                  if 'scripts/autopilot.mjs' not in line:
                      continue
                  if 'candidate' not in lower and ' next ' not in ' ' + lower + ' ':
                      continue
                  if any(token in lower for token in (' claim ', ' submit ', ' --write', ' record-cycle')):
                      continue
                  command = re.split(r'\s+(?:>|\|\s*tee\b)', line, maxsplit=1)[0].strip()
                  if '--scope' in command and 'doctor-who' in command:
                      candidates.append(command)
          candidates = list(dict.fromkeys(candidates))
          assert len(candidates) == 1, candidates
          command = candidates[0]
          assert os.environ['ACTIVE_PROFILE'] in command and '--json' in command
          (root / 'source/selector-command.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + command + '\n')
          receipt = {'status': 'cycle-012-selector-command-recovered-v1', 'version': 1, 'source': {'commit': os.environ['PRIOR_SELECTOR_HEAD'], 'path': os.environ['PRIOR_SELECTOR_PATH'], 'git_blob': os.environ['PRIOR_SELECTOR_BLOB'], 'bytes': len(text.encode()), 'sha256': hashlib.sha256(text.encode()).hexdigest()}, 'command': command, 'active_profile': os.environ['ACTIVE_PROFILE'], 'run_blocks': len(blocks)}
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/selector-command.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          chmod 700 "$OUT/source/selector-command.sh"
          bash "$OUT/source/selector-command.sh" > "$OUT/payload/candidates.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          data = json.loads((root / 'payload/candidates.json').read_text())
          selected = None
          if isinstance(data, list) and data:
              selected = data[0]
          elif isinstance(data, dict):
              for key in ('selected_task', 'selected', 'candidate', 'next'):
                  if isinstance(data.get(key), dict):
                      selected = data[key]
                      break
              if selected is None:
                  for key in ('candidates', 'tasks', 'items', 'results'):
                      if isinstance(data.get(key), list) and data[key]:
                          selected = data[key][0]
                          break
          assert isinstance(selected, dict), (type(data).__name__, data if isinstance(data, dict) else len(data))
          def first(*keys):
              for key in keys:
                  value = selected.get(key)
                  if value not in (None, ''):
                      return value
          task_id = first('id', 'task_id', 'taskId')
          if not (isinstance(task_id, str) and task_id.startswith('ap_')):
              task = selected.get('task') if isinstance(selected.get('task'), dict) else {}
              task_id = task.get('id') or task.get('task_id')
          assert isinstance(task_id, str) and task_id.startswith('ap_'), selected
          state = first('status', 'state', 'current_status')
          if state is not None:
              assert state == 'queued', state
          performer = first('performer', 'actor', 'performer_name')
          role = first('role', 'character', 'character_name')
          mode = first('mode', 'performance_mode')
          proof = json.loads((root / 'receipt/terminal-proof.json').read_text())
          transport = json.loads((root / 'receipt/transport-custody.json').read_text())
          command = json.loads((root / 'receipt/selector-command.json').read_text())
          autopilot = json.loads((root / 'receipt/autopilot-status.json').read_text())
          waterline = json.loads((root / 'receipt/waterline-status.json').read_text())
          receipt = {
              'status': 'cycle-012-doctor-who-selector-qualified-v1',
              'version': 1,
              'carrier': {'pr': int(os.environ['CARRIER_PR']), 'head': os.environ['CARRIER_HEAD'], 'base': os.environ['MAIN'], 'branch': os.environ['BRANCH']},
              'canonical_main': os.environ['MAIN'],
              'terminal_proof': {'pr': int(os.environ['PROOF_PR']), 'head': os.environ['PROOF_HEAD'], 'run': int(os.environ['PROOF_RUN']), 'job': int(os.environ['PROOF_JOB']), 'artifact': int(os.environ['PROOF_ARTIFACT']), 'artifact_sha256': os.environ['PROOF_ARTIFACT_SHA256'], 'identity': proof['identity']},
              'transport_custody': {'identity': transport['identity'], 'refs_to_delete': transport['counts']['refs_to_delete'], 'pull_requests': transport['counts']['pull_requests']},
              'command': {'identity': command['identity'], 'text': command['command'], 'source': command['source'], 'active_profile': command['active_profile']},
              'queue': {'total': autopilot['total'], 'queued': autopilot['statuses']['queued'], 'resolved': autopilot['statuses']['resolved'], 'in_flight': autopilot['in_flight']},
              'waterline': waterline,
              'selected_task_id': task_id,
              'selected_task': selected,
              'normalized': {'performer': performer, 'role': role, 'mode': mode},
              'boundary': {'selection_only': True, 'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False, 'wall_created': False, 'media_adopted': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()
          (root / 'payload/selection.json').write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (root / 'payload/transport-custody.json').write_text(json.dumps(transport, indent=2, sort_keys=True) + '\n')
          PY
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v4/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v4
            /tmp/doctor-who-cycle-012-preflight-v4-proof
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire_transports:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 8598a79c396b06e4350dfb439f0d952cc7c89439
      SELECTOR_BRANCH: agent/doctor-who-cycle-012-preflight-v4
      CYCLE12_PREFIX: agent/doctor-who-cycle-012-
      PROOF_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4
      SUPERSEDED_OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3
      SELECTION_NAME: doctor-who-cycle-012-preflight-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      PACKET: /tmp/doctor-who-cycle-012-preflight-v4-retire-input
      OUT: /tmp/doctor-who-cycle-012-preflight-v4-retire-result

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate selection and retire only exact frozen transports
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 90); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads((Path(os.environ['OUT']) / 'api/run-artifacts.json').read_text())['artifacts']
          rows = [row for row in rows if row['name'] == os.environ['SELECTION_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows) == 1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/selection-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/selection.zip"
          zip_sha="$(sha256sum "$OUT/selection.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/selection-artifact.json")" = "sha256:$zip_sha"
          SELECTION_ARTIFACT="$artifact" SELECTION_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          out = Path(os.environ['OUT'])
          packet = Path(os.environ['PACKET'])
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out / 'selection.zip') as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  target = packet / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))
          pre = packet / 'SHA256SUMS.pre'
          sealed = packet / 'SHA256SUMS'
          assert sha(pre.read_bytes()) == sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest, name = raw.split(None, 1)
              path = packet / name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes()) == digest
          selection = json.loads((packet / 'selection.json').read_text())
          transport = json.loads((packet / 'transport-custody.json').read_text())
          selection_identity = selection.pop('identity')
          transport_identity = transport.pop('identity')
          assert sha(json.dumps(selection, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()) == selection_identity
          assert sha(json.dumps(transport, sort_keys=True, separators=(',', ':')).encode()) == transport_identity
          selection['identity'] = selection_identity
          transport['identity'] = transport_identity
          assert selection['status'] == 'cycle-012-doctor-who-selector-qualified-v1'
          assert selection['canonical_main'] == os.environ['MAIN']
          assert selection['transport_custody']['identity'] == transport_identity
          assert selection['boundary'] == {'selection_only': True, 'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False, 'wall_created': False, 'media_adopted': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False, 'outside_human_dependency': False, 'owner_physical_action_required': False}
          assert transport['status'] == 'cycle-012-preselection-transport-custody-frozen-v1'
          assert transport['selector']['branch'] == os.environ['SELECTOR_BRANCH']
          assert transport['counts'] == {'stale_cycle12_refs': 8, 'observer_refs': 2, 'refs_to_delete': 10, 'pull_requests': 8}
          assert transport['boundary'] == {'selection_required_before_write': True, 'exact_heads_frozen': True, 'force_update': False, 'merge': False, 'main_mutation': False, 'lease_issued': False, 'cycle_012_product_authority': False}
          (out / 'receipt/selection.json').write_text(json.dumps(selection, indent=2, sort_keys=True, ensure_ascii=False) + '\n')
          (out / 'receipt/transport-custody.json').write_text(json.dumps(transport, indent=2, sort_keys=True) + '\n')
          PY
          printf 'SELECTION_ARTIFACT=%s\nSELECTION_ZIP_SHA256=%s\n' "$artifact" "$zip_sha" >> "$GITHUB_ENV"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          auth="$OUT/receipt/transport-custody.json"
          : > "$OUT/logs/pr-actions.tsv"
          while IFS=$'\t' read -r number branch head action; do
            [ -n "$number" ] || continue
            gh api "/repos/$GITHUB_REPOSITORY/pulls/$number" > "$OUT/api/pr-$number-before.json"
            NUMBER="$number" BRANCH_NAME="$branch" HEAD_SHA="$head" ACTION="$action" python3 - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads((Path(os.environ['OUT']) / f"api/pr-{os.environ['NUMBER']}-before.json").read_text())
          assert row['number'] == int(os.environ['NUMBER'])
          assert row['head']['ref'] == os.environ['BRANCH_NAME'] and row['head']['sha'] == os.environ['HEAD_SHA']
          assert row['merged_at'] is None
          if os.environ['ACTION'] == 'close_without_merge':
              assert row['state'] in {'open', 'closed'}
          else:
              assert os.environ['ACTION'] == 'none' and row['state'] == 'closed'
          PY
            if [ "$action" = close_without_merge ]; then
              if [ "$(jq -r '.state' "$OUT/api/pr-$number-before.json")" = open ]; then
                gh api --method PATCH "/repos/$GITHUB_REPOSITORY/pulls/$number" -f state=closed > "$OUT/api/pr-$number-after.json"
              else
                cp "$OUT/api/pr-$number-before.json" "$OUT/api/pr-$number-after.json"
              fi
              jq -e --arg head "$head" '.state=="closed" and .merged_at==null and .head.sha==$head' "$OUT/api/pr-$number-after.json" >/dev/null
            fi
            printf '%s\t%s\t%s\t%s\n' "$number" "$branch" "$head" "$action" >> "$OUT/logs/pr-actions.tsv"
          done < <(jq -r '.pull_requests[] | [.pr,.branch,.head,.action] | @tsv' "$auth")

          : > "$OUT/logs/ref-actions.tsv"
          while IFS=$'\t' read -r branch head kind; do
            [ -n "$branch" ] || continue
            current="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$head"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            absent=false
            for attempt in $(seq 1 45); do
              if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
                sleep 2
              else
                absent=true
                break
              fi
            done
            test "$absent" = true
            printf '%s\t%s\t%s\n' "$branch" "$head" "$kind" >> "$OUT/logs/ref-actions.tsv"
          done < <(jq -r '.refs_to_delete[] | [.branch,.head,.kind] | @tsv' "$auth")

          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$CYCLE12_PREFIX" > "$OUT/api/final-cycle12-refs.json"
          SELECTOR_HEAD='${{ github.event.pull_request.head.sha }}' python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads((Path(os.environ['OUT']) / 'api/final-cycle12-refs.json').read_text())
          observed = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in rows]
          assert observed == [{'branch': os.environ['SELECTOR_BRANCH'], 'head': os.environ['SELECTOR_HEAD']}], observed
          PY
          for branch in "$PROOF_BRANCH" "$SUPERSEDED_OBSERVER_BRANCH"; do
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "observer ref survived: $branch" >&2
              exit 1
            fi
          done
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$SELECTOR_BRANCH" --jq '.object.sha')" = '${{ github.event.pull_request.head.sha }}'
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal exact transport-retirement receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          selection = json.loads((root / 'receipt/selection.json').read_text())
          transport = json.loads((root / 'receipt/transport-custody.json').read_text())
          receipt = {
              'status': 'cycle-012-stale-transports-retired-after-selection-v1',
              'version': 1,
              'run': int(os.environ['GITHUB_RUN_ID']),
              'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'selection': {'artifact': int(os.environ['SELECTION_ARTIFACT']), 'artifact_sha256': os.environ['SELECTION_ZIP_SHA256'], 'identity': selection['identity'], 'selected_task_id': selection['selected_task_id']},
              'transport_custody_identity': transport['identity'],
              'retired': {'refs': transport['counts']['refs_to_delete'], 'stale_cycle12_refs': transport['counts']['stale_cycle12_refs'], 'observer_refs': transport['counts']['observer_refs'], 'pull_requests': transport['counts']['pull_requests']},
              'canonical_main': os.environ['MAIN'],
              'retained_selector': {'branch': os.environ['SELECTOR_BRANCH'], 'head': '${{ github.event.pull_request.head.sha }}', 'pr': selection['carrier']['pr']},
              'boundary': {'selection_retained': True, 'lease_issued': False, 'queue_mutated': False, 'canonical_mutated': False, 'cycle_012_product_authority': False, 'force_update': False, 'merge': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/retirement.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/RETIREMENT_COMPLETE').write_text(receipt['identity'] + '\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v4-retirement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v4-retire-result
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v4-retirement-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v4-retire-input
            /tmp/doctor-who-cycle-012-preflight-v4-retire-result
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
