name: star-trek-ferengi-terminal-v2

on:
  workflow_dispatch:
  push:
    branches: [agent/star-trek-ferengi-gold]
    paths: [.github/workflows/star-trek-ferengi-terminal-v2.yml]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  issues: write

concurrency:
  group: star-trek-ferengi-terminal-v2
  cancel-in-progress: false

jobs:
  terminal:
    if: github.ref_name == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Quiesce every competing branch writer and reset to the newest durable head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2"
          mkdir -p "$root"
          current="$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=agent/star-trek-ferengi-gold&per_page=100" > "$root/runs-before.json"
          jq -r --arg current "$current" '.workflow_runs[]|select((.status=="queued" or .status=="in_progress" or .status=="pending") and (.id|tostring)!=$current)|.id' "$root/runs-before.json" | while read -r id; do
            [ -n "$id" ] || continue
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >"$root/cancel-$id.log" 2>&1 || true
          done
          sleep 20
          git fetch origin agent/star-trek-ferengi-gold
          git reset --hard origin/agent/star-trek-ferengi-gold
          git clean -fd
      - name: Determine or close the exact ten-card portrait residual
        env:
          GH_TOKEN: ${{ github.token }}
          FERENGI_ORBIT_ROOT: ${{ runner.temp }}/star-trek-ferengi-terminal-v2/orbit
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2"
          count=$(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const plan=JSON.parse(fs.readFileSync('data/STAR-TREK-GOLD.json','utf8'));
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const media=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const active=plan.sequence.filter(row=>row.state==='active'||row.state==='candidate-gold');
          if(active.length!==1||active[0].id!=='ferengi')throw new Error('Ferengi is not the sole active species');
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');
          const ids=[...new Set(taxon.wall_records.map(row=>row.id))];
          const byId=new Map(specimens.map(row=>[row.id,row]));const audit=new Map(media.items.map(row=>[`${row.wall_id}|${row.side}`,row]));
          const still=ids.filter(id=>!byId.get(id)?.still?.src||audit.get(`${id}|still`)?.status!=='verified');
          const portraits=ids.filter(id=>!byId.get(id)?.portrait?.src||audit.get(`${id}|portrait`)?.status!=='verified').sort();
          if(still.length)throw new Error(`character-still regression: ${still.join(', ')}`);
          const expected=['UC-1295','UC-1296','UC-1297','UC-1298','UC-1304','UC-1305','UC-1306','UC-1310','UC-1311','UC-1313'];
          if(portraits.length!==0&&JSON.stringify(portraits)!==JSON.stringify(expected))throw new Error(`unexpected portrait residual: ${portraits.join(', ')}`);
          console.log(portraits.length);
          NODE
          )
          echo "portrait residual: $count" | tee "$root/residual.log"
          if [ "$count" = 10 ]; then
            test -s .github/FERENGI-GOLD-FINAL-PORTRAITS.json
            test -s scripts/ferengi-gold-final-portraits.mjs
            orbit="$FERENGI_ORBIT_ROOT"
            mkdir -p "$orbit"
            run_id=$(jq -r .source_workflow_run .github/FERENGI-GOLD-FINAL-PORTRAITS.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$root/orbit-artifacts.json"
            test "$(jq '.artifacts|length' "$root/orbit-artifacts.json")" -ge 8
            jq -r '.artifacts[]|[.id,.name]|@tsv' "$root/orbit-artifacts.json" | while IFS=$'\t' read -r id name; do
              mkdir -p "$orbit/$name"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$root/$name.zip"
              unzip -q -o "$root/$name.zip" -d "$orbit/$name"
            done
            node scripts/ferengi-gold-final-portraits.mjs select | tee "$root/select.log"
            node scripts/ferengi-gold-final-portraits.mjs apply | tee "$root/apply.log"
            ids=(UC-1295 UC-1296 UC-1297 UC-1298 UC-1304 UC-1305 UC-1306 UC-1310 UC-1311 UC-1313)
            node scripts/media-stage.mjs --ids "${ids[@]}" | tee "$root/media-stage.log"
            node scripts/credits.mjs | tee "$root/credits-1.log"
            node scripts/shard.mjs | tee "$root/shard-1.log"
            node scripts/build-contract.mjs | tee "$root/contract-1.log"
            node scripts/media-audit.mjs sync | tee "$root/media-sync.log"
            node scripts/ferengi-gold-final-portraits.mjs resolution | tee "$root/resolution-build.log"
            node scripts/media-audit.mjs resolve --input data/review/ferengi-gold/final-portraits-media-resolution-2026-07-25.json | tee "$root/media-resolve.log"
          elif [ "$count" != 0 ]; then
            echo "invalid portrait residual $count" >&2; exit 2
          fi
      - name: Rebuild and prove exact Ferengi candidate gold
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2"
          node scripts/credits.mjs | tee "$root/credits-final.log"
          node scripts/shard.mjs | tee "$root/shard-final.log"
          node scripts/build-contract.mjs | tee "$root/contract-final.log"
          node scripts/ds9-census.mjs --project-only | tee "$root/ds9-census.log"
          node scripts/ds9-graph.mjs --project-only | tee "$root/ds9-graph.log"
          node scripts/ds9-eligibility-queue.mjs | tee "$root/ds9-eligibility.log"
          node scripts/ds9-maker-queue.mjs | tee "$root/ds9-maker.log"
          node scripts/build-record-pages.mjs | tee "$root/record-pages.log"
          node scripts/media-audit.mjs validate | tee "$root/media-validate.log"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species.log"
          node --input-type=module - <<'NODE' | tee "$root/ferengi-gold-ready.log"
          import fs from 'node:fs';
          const plan=JSON.parse(fs.readFileSync('data/STAR-TREK-GOLD.json','utf8'));
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const media=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');const entry=plan.sequence.find(row=>row.id==='ferengi');
          const ids=[...new Set(taxon.wall_records.map(row=>row.id))];const byId=new Map(specimens.map(row=>[row.id,row]));const audit=new Map(media.items.map(row=>[`${row.wall_id}|${row.side}`,row]));
          const bad=[];for(const id of ids)for(const side of ['still','portrait'])if(!byId.get(id)?.[side]?.src||audit.get(`${id}|${side}`)?.status!=='verified')bad.push(`${id}:${side}`);
          const eligible=Math.max(0,Number(taxon.counts.unfiled_named_credits||0)-Number(entry.reviewed_category_exclusions||0));
          if(bad.length||eligible)throw new Error(`not gold-ready: eligible=${eligible}; media=${bad.join(',')}`);
          if(!fs.existsSync('data/review/ferengi-gold/final-portraits-applied-2026-07-25.json'))throw new Error('final portrait application receipt missing');
          console.log(`PASS — Ferengi ${ids.length} primary cards / ${ids.length*2} verified facets / zero eligible unfiled credits`);
          NODE
      - name: Seal one permanent Ferengi PR head
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2"
          git config user.name 'undercast-species-gold'
          git config user.email 'undercast-species-gold@users.noreply.github.com'
          rm -f \
            tmp-test.txt tmp-upload-test.txt \
            .github/FERENGI-GOLD-DISPATCH-NUDGE.txt \
            .github/FERENGI-GOLD-FINAL-PORTRAITS.json \
            .github/FERENGI-GOLD-PORTRAIT-DEEP-001.json \
            .github/FERENGI-GOLD-RESIDUAL-PORTRAIT-ORBIT-005.json \
            .github/FERENGI-GOLD-GATHER.json \
            .github/FERENGI-GOLD-TARGETED-STILLS.json \
            .github/workflows/ferengi-gold-final-portraits.yml \
            .github/workflows/ferengi-gold-final-controller.yml \
            .github/workflows/ferengi-gold-merge-and-handoff.yml \
            .github/workflows/jem-hadar-activation-controller.yml \
            .github/workflows/ferengi-status-beacon.yml \
            .github/workflows/ferengi-clean-strays.yml \
            .github/workflows/star-trek-ferengi-terminal-v2.yml \
            .github/workflows/ferengi-gold-residual-portrait-orbit-005.yml \
            .github/workflows/ferengi-gold-gather.yml \
            .github/workflows/ferengi-gold-targeted-stills.yml \
            .github/workflows/ferengi-gold-integrity-audit.yml \
            scripts/ferengi-gold-final-portraits.mjs \
            scripts/ferengi-gold-residual-portrait-orbit-005.mjs \
            scripts/ferengi-gold-portrait-gather.mjs \
            scripts/direct-media-candidates.mjs \
            scripts/ferengi-gold-integrity-audit.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Star Trek species gold: seal Ferengi candidate'
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$root/ferengi-permanent-gate.log"
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/star-trek-ferengi-gold
          git rev-parse HEAD | tee "$root/ferengi-head.txt"
      - name: Qualify permanent checks and merge PR 86 under exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2";repo="$GITHUB_REPOSITORY";head=$(cat "$root/ferengi-head.txt")
          deadline=$((SECONDS+3600))
          while (( SECONDS < deadline )); do
            runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100");echo "$runs">"$root/ferengi-runs.json"
            echo "$runs"|jq -r '.workflow_runs[]|select(.conclusion=="action_required")|.id'|while read -r id;do [ -n "$id" ]||continue;gh api --method POST "repos/$repo/actions/runs/$id/approve" >/dev/null 2>&1||gh api --method POST "repos/$repo/actions/runs/$id/rerun" >/dev/null 2>&1||true;done
            all=1;for wanted in archive-contract collection-policy preservation-export;do c=$(echo "$runs"|jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion//"missing"');[ "$c" = success ]||all=0;[[ "$c" =~ ^(failure|cancelled|timed_out|startup_failure)$ ]]&&exit 20;done
            [ "$all" = 1 ]&&break;sleep 20
          done
          runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100");for wanted in archive-contract collection-policy preservation-export;do test "$(echo "$runs"|jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion')" = success;done
          gh issue edit 86 --repo "$repo" --add-label correctness-hotfix || true
          gh pr ready 86 --repo "$repo" || true
          result=$(gh api --method PUT "repos/$repo/pulls/86/merge" -f merge_method=merge -f sha="$head");echo "$result">"$root/ferengi-merge.json";test "$(echo "$result"|jq -r .merged)" = true;echo "$result"|jq -r .sha>"$root/ferengi-merge-sha.txt"
      - name: Verify exact merged main and live Ferengi deployment
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2";merge_sha=$(cat "$root/ferengi-merge-sha.txt")
          git fetch origin main;test "$(git rev-parse origin/main)" = "$merge_sha";git checkout --detach "$merge_sha"
          npm run gate 2>&1|tee "$root/ferengi-merged-gate.log"
          local_sha=$(sha256sum data/archive.json|awk '{print $1}');deadline=$((SECONDS+2400));while ((SECONDS<deadline));do curl -fsSL --retry 2 "https://bigbirdreturns.github.io/undercast/data/archive.json?v=$(date +%s)" -o "$root/ferengi-live-archive.json"||{ sleep 20;continue;};[ "$(sha256sum "$root/ferengi-live-archive.json"|awk '{print $1}')" = "$local_sha" ]&&break;sleep 20;done;test "$(sha256sum "$root/ferengi-live-archive.json"|awk '{print $1}')" = "$local_sha";echo "$local_sha">"$root/ferengi-live-sha.txt";date -u +%Y-%m-%dT%H:%M:%SZ>"$root/ferengi-live-at.txt"
      - name: Create exact Jem'Hadar activation from the verified Ferengi merge
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2";merge_sha=$(cat "$root/ferengi-merge-sha.txt");live_sha=$(cat "$root/ferengi-live-sha.txt");live_at=$(cat "$root/ferengi-live-at.txt")
          git switch -c agent/star-trek-jem-hadar-gold "$merge_sha"
          python - "$merge_sha" "$live_sha" "$live_at" <<'PY'
          import json,sys
          from pathlib import Path
          merge_sha,live_sha,live_at=sys.argv[1:];p=Path('data/STAR-TREK-GOLD.json');d=json.loads(p.read_text());fer=next(x for x in d['sequence'] if x['id']=='ferengi');jem=next(x for x in d['sequence'] if x['id']=='jem-hadar')
          if fer['state']!='active' or jem['state']!='prepopulated-waiting':raise SystemExit('handoff state drift')
          fer['state']='gold';fer['receipt']={'merged_main_sha':merge_sha,'live_verified_at':live_at,'live_archive_sha256':live_sha};fer['note']='Gold: all reviewed-eligible credits filed, every primary still and portrait exact-subject verified, merged main gated, and live Pages matched the merged archive.'
          jem['state']='active';jem['note']='Activated only after the merged-main and live-deployment Ferengi gold receipt; Jem’Hadar is the sole active Star Trek species.'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n');out=Path('data/review/star-trek-species-gold');out.mkdir(parents=True,exist_ok=True);(out/'ferengi-gold-live-receipt-2026-07-25.json').write_text(json.dumps({'version':1,'species':'ferengi','merged_main_sha':merge_sha,'live_verified_at':live_at,'live_archive_sha256':live_sha},indent=2)+'\n')
          PY
          node scripts/star-trek-species-gold.mjs validate|tee "$root/jem-species.log";node scripts/credits.mjs;node scripts/shard.mjs;node scripts/build-contract.mjs;node scripts/build-record-pages.mjs;npm run gate 2>&1|tee "$root/jem-candidate-gate.log"
          git add -A;git diff --cached --check;git commit -m "Star Trek species gold: record Ferengi and activate Jem'Hadar";npm run gate 2>&1|tee "$root/jem-permanent-gate.log";git push -u origin agent/star-trek-jem-hadar-gold;git rev-parse HEAD>"$root/jem-head.txt"
      - name: Open, qualify and merge the Jem'Hadar activation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2";repo="$GITHUB_REPOSITORY";head=$(cat "$root/jem-head.txt")
          gh pr create --repo "$repo" --head agent/star-trek-jem-hadar-gold --base main --title "Star Trek species gold 002: activate Jem'Hadar after Ferengi" --body "Ferengi is gold from exact merged-main and live Pages receipts. This activates exactly one next species: Jem'Hadar. No Tellarite or later species is active." >"$root/jem-pr-url.txt"||true
          pr=$(gh pr list --repo "$repo" --head agent/star-trek-jem-hadar-gold --base main --state open --json number --jq '.[0].number');gh issue edit "$pr" --repo "$repo" --add-label correctness-hotfix||true
          deadline=$((SECONDS+3600));while ((SECONDS<deadline));do runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100");echo "$runs">"$root/jem-runs.json";echo "$runs"|jq -r '.workflow_runs[]|select(.conclusion=="action_required")|.id'|while read -r id;do [ -n "$id" ]||continue;gh api --method POST "repos/$repo/actions/runs/$id/approve" >/dev/null 2>&1||gh api --method POST "repos/$repo/actions/runs/$id/rerun" >/dev/null 2>&1||true;done;all=1;for wanted in archive-contract collection-policy preservation-export;do c=$(echo "$runs"|jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion//"missing"');[ "$c" = success ]||all=0;[[ "$c" =~ ^(failure|cancelled|timed_out|startup_failure)$ ]]&&exit 30;done;[ "$all" = 1 ]&&break;sleep 20;done
          runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100");for wanted in archive-contract collection-policy preservation-export;do test "$(echo "$runs"|jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion')" = success;done
          result=$(gh api --method PUT "repos/$repo/pulls/$pr/merge" -f merge_method=merge -f sha="$head");echo "$result">"$root/jem-merge.json";test "$(echo "$result"|jq -r .merged)" = true;echo "$result"|jq -r .sha>"$root/jem-merge-sha.txt"
      - name: Verify merged main and live Jem'Hadar activation
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/star-trek-ferengi-terminal-v2";merge_sha=$(cat "$root/jem-merge-sha.txt");git fetch origin main;test "$(git rev-parse origin/main)" = "$merge_sha";git checkout --detach "$merge_sha";npm run gate 2>&1|tee "$root/jem-merged-gate.log"
          node --input-type=module - <<'NODE'|tee "$root/jem-merged-state.log"
          import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('data/STAR-TREK-GOLD.json','utf8'));const fer=d.sequence.find(x=>x.id==='ferengi'),jem=d.sequence.find(x=>x.id==='jem-hadar'),active=d.sequence.filter(x=>x.state==='active'||x.state==='candidate-gold');if(fer?.state!=='gold'||jem?.state!=='active'||active.length!==1||active[0].id!=='jem-hadar')throw new Error('merged state is not Ferengi gold / Jem’Hadar sole active');console.log('PASS — Ferengi gold; Jem’Hadar sole active on merged main');
          NODE
          local_sha=$(sha256sum data/archive.json|awk '{print $1}');deadline=$((SECONDS+2400));while ((SECONDS<deadline));do curl -fsSL --retry 2 "https://bigbirdreturns.github.io/undercast/data/archive.json?v=$(date +%s)" -o "$root/jem-live-archive.json"||{ sleep 20;continue;};[ "$(sha256sum "$root/jem-live-archive.json"|awk '{print $1}')" = "$local_sha" ]&&break;sleep 20;done;test "$(sha256sum "$root/jem-live-archive.json"|awk '{print $1}')" = "$local_sha";echo "$local_sha">"$root/jem-live-sha.txt";date -u +%Y-%m-%dT%H:%M:%SZ>"$root/jem-live-at.txt"
      - name: Retain complete terminal receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-ferengi-terminal-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/star-trek-ferengi-terminal-v2
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
