name: doctor-who-cycle-011-rastel-cleanup-live-observer-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-live-observer-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-live-observer-v2
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-011-rastel-cleanup-resume-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: f5a110909ed42a52917bd25e511610f73f5610f2
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      SOURCE_PR: "850"
      SOURCE_HEAD: 17ff69dbd777a59838842b952230624abe6fecb4
      SOURCE_RUN: "31358473435"
      SOURCE_JOB: "93362493544"
      SOURCE_ARTIFACT: "9051464025"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1-authorization-31358473435-attempt-1
      SOURCE_ARTIFACT_DIGEST: sha256:3fd203856202cc4cab4df9781728b9c0bb86b1345b6b6e41979b89a7aebe9d58
      SOURCE_WORKFLOW: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1
      WRITER_FILE: doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_NAME: doctor-who-cycle-011-rastel-cleanup-writer-v2
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-resume-v2
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-live-observer-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-live-observer-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind isolated observer and successful resume authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$OUT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/authorization.zip"
          test "$(sha256sum "$OUT/source/authorization.zip" | awk '{print $1}')" = "${SOURCE_ARTIFACT_DIGEST#sha256:}"
          CURRENT_PR="$pr" CURRENT_HEAD="$head" CURRENT_BASE="$base" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          own = load('own-pr.json')
          source_pr = load('source-pr.json')
          run = load('source-run.json')
          jobs = load('source-jobs.json')['jobs']
          artifact = load('source-artifact.json')
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['base']['sha'] == os.environ['CURRENT_BASE']
          assert own['commits'] == 1 and own['changed_files'] == 1
          assert source_pr['number'] == int(os.environ['SOURCE_PR'])
          assert source_pr['head']['sha'] == os.environ['SOURCE_HEAD'] and source_pr['merged'] is False
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_sha'] == os.environ['SOURCE_HEAD'] and run['head_branch'] == 'agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v1'
          assert run['name'] == os.environ['SOURCE_WORKFLOW']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          matched = [row for row in jobs if row['id'] == int(os.environ['SOURCE_JOB'])]
          assert len(matched) == 1 and matched[0]['name'] == 'verify' and matched[0]['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name'] == os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST'] and artifact['expired'] is False
          PY

      - name: Observe the exact default-branch writer transaction
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$WRITER_FILE" > "$OUT/api/writer-workflow.json"
          workflow_id="$(jq -r '.id' "$OUT/api/writer-workflow.json")"
          test -n "$workflow_id"
          writer_run=''
          for attempt in $(seq 1 120); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" -f per_page=100 > "$OUT/api/writer-runs.json"
            if SOURCE_RUN="$SOURCE_RUN" python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          source = json.loads((root / 'source-run.json').read_text())
          runs = json.loads((root / 'writer-runs.json').read_text())['workflow_runs']
          floor = datetime.fromisoformat(source['updated_at'].replace('Z', '+00:00')) - timedelta(minutes=1)
          rows = []
          for row in runs:
              created = datetime.fromisoformat(row['created_at'].replace('Z', '+00:00'))
              if row['event'] != 'workflow_run' or row['name'] != os.environ['WRITER_NAME'] or created < floor:
                  continue
              rows.append(row)
          rows.sort(key=lambda row: (row['created_at'], row['id']))
          if not rows:
              raise SystemExit(1)
          chosen = rows[-1]
          (root / 'writer-run-id.txt').write_text(str(chosen['id']) + '\n')
          (root / 'writer-run-selected.json').write_text(json.dumps(chosen, indent=2, sort_keys=True) + '\n')
          PY
            then
              writer_run="$(cat "$OUT/api/writer-run-id.txt")"
              break
            fi
            sleep 5
          done
          if [ -n "$writer_run" ]; then
            for attempt in $(seq 1 240); do
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run" > "$OUT/api/writer-run-live.json"
              status="$(jq -r '.status' "$OUT/api/writer-run-live.json")"
              [ "$status" = completed ] && break
              sleep 5
            done
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$writer_run/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          else
            printf '{"workflow_runs":[]}' > "$OUT/api/writer-run-live.json"
            printf '{"jobs":[]}' > "$OUT/api/writer-jobs.json"
            printf '{"artifacts":[]}' > "$OUT/api/writer-artifacts.json"
          fi
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/prefix-refs.json"
          printf '%s\n' "$writer_run" > "$OUT/api/writer-run-id-final.txt"

      - name: Seal exact live observation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          api = root / 'api'
          run_id_text = (api / 'writer-run-id-final.txt').read_text().strip()
          live_main = json.loads((api / 'main-ref.json').read_text())['object']['sha']
          refs = json.loads((api / 'prefix-refs.json').read_text())
          jobs = json.loads((api / 'writer-jobs.json').read_text()).get('jobs', [])
          artifacts = json.loads((api / 'writer-artifacts.json').read_text()).get('artifacts', [])
          run = None
          status = 'cycle-011-rastel-cleanup-resume-writer-not-observed-v2'
          if run_id_text:
              run = json.loads((api / 'writer-run-live.json').read_text())
              if run['status'] == 'completed' and run['conclusion'] == 'success':
                  status = 'cycle-011-rastel-cleanup-resume-writer-success-observed-v2'
              elif run['status'] == 'completed':
                  status = 'cycle-011-rastel-cleanup-resume-writer-failure-observed-v2'
              else:
                  status = 'cycle-011-rastel-cleanup-resume-writer-in-progress-v2'
          receipt = {
              'status': status,
              'version': 2,
              'source': {
                  'pr': int(os.environ['SOURCE_PR']),
                  'head': os.environ['SOURCE_HEAD'],
                  'run': int(os.environ['SOURCE_RUN']),
                  'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              },
              'writer': None if run is None else {
                  'run': run['id'],
                  'run_number': run['run_number'],
                  'run_attempt': run['run_attempt'],
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'event': run['event'],
                  'head_sha': run['head_sha'],
                  'head_branch': run['head_branch'],
                  'created_at': run['created_at'],
                  'updated_at': run['updated_at'],
                  'jobs': [{
                      'id': row['id'],
                      'name': row['name'],
                      'status': row['status'],
                      'conclusion': row['conclusion'],
                      'steps': [{
                          'name': step['name'],
                          'status': step['status'],
                          'conclusion': step['conclusion'],
                          'number': step['number'],
                      } for step in row.get('steps', [])],
                  } for row in jobs],
                  'artifacts': [{
                      'id': row['id'],
                      'name': row['name'],
                      'size_in_bytes': row['size_in_bytes'],
                      'digest': row['digest'],
                      'expired': row['expired'],
                  } for row in artifacts],
              },
              'live': {
                  'main': live_main,
                  'installed_main': os.environ['INSTALLED_MAIN'],
                  'canonical_main': os.environ['CANONICAL_MAIN'],
                  'canonical_tree': os.environ['CANONICAL_TREE'],
                  'prefix_refs': [{'ref': row['ref'], 'sha': row['object']['sha']} for row in refs],
                  'prefix_ref_count': len(refs),
              },
              'boundary': {
                  'repository_write': False,
                  'canonical_mutation': False,
                  'cycle_012_lease_issued': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/observation.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/OBSERVATION_COMPLETE').write_text(receipt['identity'] + '\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-live-observer-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-live-observer-v2
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
