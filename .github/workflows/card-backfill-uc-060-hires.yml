name: card-backfill-uc-060-hires

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-060-HIRES.json"
      - "scripts/card-backfill-uc-060-hires.mjs"
      - ".github/workflows/card-backfill-uc-060-hires.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-060-hires-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-009'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-009
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact official-hero custody
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-060-HIRES.json','utf8'));
          if(c.version!==1||c.record_id!=='UC-060'||c.actor!=='Ray Park'||c.review_authority!=='candidate-only-hires-second-desk')throw new Error('UC-060 hires control drift');
          if(c.official_hero_artifact?.artifact_id!==8635127830||c.official_hero_artifact?.head_sha!=='18f06ddae4e190531fa5e11bb452557b47c78b4f')throw new Error('UC-060 official hero custody drift');
          if(c.candidates?.length!==3)throw new Error('UC-060 original probe set drift');
          console.log('PASS — exact official hero artifact and original source stems authorized');
          NODE
      - name: Retrieve and verify official hero artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-060-hires"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8635127830/zip" > "$root/heroes.zip"
          echo "e7a26f0b0f5cae3a897c5a4e2e9a21271d02d6569ffdae91bac4ec679e891f01  $root/heroes.zip" | sha256sum -c -
          unzip -q "$root/heroes.zip" -d "$root/source"
          echo "e2b25113a9d1978c144a4f158f2be6bb84382ecdf9951cac2855adb05c146362  $root/source/output/manifest.json" | sha256sum -c -
      - name: Probe exact original-resolution Lucasfilm assets
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-060-hires/source/output
          OUT: ${{ runner.temp }}/card-backfill-uc-060-hires/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-060-hires.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-060-hires/run.log"
          test -z "$(git status --porcelain)"
      - name: Upload original-resolution candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-060-hires-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-060-hires/output
            ${{ runner.temp }}/card-backfill-uc-060-hires/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
