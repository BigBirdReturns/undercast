name: doctor-who-cycle-008-kreg-finalization-prototype-v10

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-finalization-prototype-v10.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-finalization-prototype-v10-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prototype:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-finalization-prototype-v10'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-finalization-prototype-v10.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-finalization-prototype-v10
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      V9_BRANCH: agent/doctor-who-cycle-008-kreg-finalization-census-v9
      V9_WORKFLOW: doctor-who-cycle-008-kreg-finalization-census-v9
      OUT: /tmp/doctor-who-cycle-008-kreg-finalization-prototype-v10
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      SOURCE_URL: https://tardis.fandom.com/wiki/Kreg
      SOURCE_PAGE_ID: "300765"
      SOURCE_REVISION: "3851642"
      SOURCE_TIMESTAMP: 2026-07-28T09:20:48Z
      SOURCE_BYTES: "840"
      SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
      SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
      MEDIA_BYTES: "67113"
      MEDIA_ASSET_ID: "504051495"
      OLD_TASK_ID: ap_ffea809b980b468b33fa462c
      OLD_WALL_ID: UC-1352
      OLD_CYCLE_ID: cycle_540222fb1378fa680a43d080
      OLD_MEDIA_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
      EXPECTED_CANDIDATE_PATHS: "40"
      EXPECTED_FINAL_PATHS: "48"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-file prototype and live main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,prototype,diagnostics,work}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          base="$1"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test "$(git diff --name-only "$base"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" BASE="$base" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); pr=json.loads((root/'api/pr.json').read_text()); files=json.loads((root/'api/pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH'] and pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf '%s\n' "$base" > "$OUT/prototype-main.txt"
          printf 'PROTOTYPE_MAIN=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Retain exact terminal V9 census
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$V9_BRANCH&event=pull_request&per_page=100" > "$OUT/api/v9-runs.json"
            row="$(jq -c --arg name "$V9_WORKFLOW" --arg branch "$V9_BRANCH" '[.workflow_runs[] | select(.name==$name and .head_branch==$branch)] | sort_by(.created_at) | last // empty' "$OUT/api/v9-runs.json")"
            if [ -n "$row" ] && [ "$(jq -r '.status' <<<"$row")" = completed ]; then
              printf '%s\n' "$row" > "$OUT/source/v9-run.json"
              break
            fi
            sleep 20
          done
          test -s "$OUT/source/v9-run.json"
          run="$(jq -r '.id' "$OUT/source/v9-run.json")"
          attempt="$(jq -r '.run_attempt' "$OUT/source/v9-run.json")"
          conclusion="$(jq -r '.conclusion' "$OUT/source/v9-run.json")"
          head="$(jq -r '.head_sha' "$OUT/source/v9-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$OUT/source/v9-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/source/v9-artifacts.json"
          artifact="$(jq -c --arg name "doctor-who-cycle-008-kreg-finalization-census-v9-$run-attempt-$attempt" '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0] else empty end' "$OUT/source/v9-artifacts.json")"
          test -n "$artifact"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/source/v9.zip"
          ZIP="$OUT/source/v9.zip" TARGET="$OUT/source/v9" python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  data=f.read(i); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          printf 'V9_RUN=%s\nV9_ATTEMPT=%s\nV9_CONCLUSION=%s\nV9_HEAD=%s\nV9_ARTIFACT=%s\nV9_ARTIFACT_DIGEST=%s\n' \
            "$run" "$attempt" "$conclusion" "$head" "$artifact_id" "$artifact_digest" >> "$GITHUB_ENV"
          test "$conclusion" = success

      - name: Verify V9 schema authority and locate nested reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          census="$OUT/source/v9/analysis/finalization-census-receipt.json"
          review="$OUT/source/v9/source/v8/review/review-receipt.json"
          candidate_archive="$OUT/source/v9/source/v8/source/v7/packet/candidate-product.tar.gz"
          candidate_files="$OUT/source/v9/source/v8/source/v7/packet/candidate-files.json"
          candidate_paths="$OUT/source/v9/source/v8/review/candidate-paths.txt"
          for p in "$census" "$review" "$candidate_archive" "$candidate_files" "$candidate_paths"; do test -f "$p"; done
          CENSUS="$census" REVIEW="$review" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          for key in ('CENSUS','REVIEW'):
              p=Path(os.environ[key]); obj=json.loads(p.read_text()); identity=obj.pop('identity')
              assert hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
              if key=='CENSUS':
                  assert obj['status']=='finalization-schema-recovered' and obj['known_finalization_paths']==8 and obj['cycle007_product_paths']==49
              else:
                  assert obj['status']=='approved-for-finalization' and obj['path_count']==40 and obj['independent_gate']=='pass'
              assert obj['task']==os.environ['TASK_ID'] and obj['lease']==os.environ['LEASE_ID'] and obj['wall_id']==os.environ['WALL_ID']
          PY
          test "$(wc -l < "$candidate_paths")" = "$EXPECTED_CANDIDATE_PATHS"
          printf 'CANDIDATE_ARCHIVE=%s\nCANDIDATE_FILES=%s\nCANDIDATE_PATHS=%s\n' \
            "$candidate_archive" "$candidate_files" "$candidate_paths" >> "$GITHUB_ENV"
          jq -r '.review_main' "$review" > "$OUT/source/review-main.txt"
          jq -r '.identity' "$review" > "$OUT/source/review-identity.txt"
          jq -r '.v8_run' "$census" > "$OUT/source/v8-run-id.txt"

      - name: Recompose exact forty-path reviewed candidate over prototype main
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          review_main="$(cat "$OUT/source/review-main.txt")"
          git merge-base --is-ancestor "$review_main" "$PROTOTYPE_MAIN"
          git diff --name-only "$review_main".."$PROTOTYPE_MAIN" | LC_ALL=C sort > "$OUT/prototype/review-to-prototype-main-paths.txt"
          comm -12 "$CANDIDATE_PATHS" "$OUT/prototype/review-to-prototype-main-paths.txt" > "$OUT/prototype/main-candidate-overlap.txt"
          test ! -s "$OUT/prototype/main-candidate-overlap.txt"
          work="$OUT/work/final"
          git worktree add --detach "$work" "$PROTOTYPE_MAIN"
          tar -xzf "$CANDIDATE_ARCHIVE" -C "$work"
          git -C "$work" add --pathspec-from-file="$CANDIDATE_PATHS"
          git -C "$work" config user.name undercast-cycle-008-finalizer
          git -C "$work" config user.email cycle-008-finalizer@users.noreply.github.com
          git -C "$work" commit -m 'Doctor Who: compose reviewed cycle 008 Kreg candidate' >/dev/null
          candidate="$(git -C "$work" rev-parse HEAD)"
          test "$(git -C "$work" show -s --format=%P HEAD)" = "$PROTOTYPE_MAIN"
          git -C "$work" diff --name-only "$PROTOTYPE_MAIN"..HEAD | LC_ALL=C sort > "$OUT/prototype/candidate-paths.txt"
          diff -u "$CANDIDATE_PATHS" "$OUT/prototype/candidate-paths.txt"
          printf 'candidate_commit=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Derive deterministic cycle-008 finalization from exact cycle-007 templates
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/final"
          candidate='${{ steps.compose.outputs.candidate_commit }}'
          templates="$OUT/source/v9/templates"
          analysis="$OUT/source/v9/analysis"
          test "$(git -C "$work" rev-parse HEAD)" = "$candidate"
          REVIEW_IDENTITY="$(cat "$OUT/source/review-identity.txt")" V8_RUN="$(cat "$OUT/source/v8-run-id.txt")" \
          WORK="$work" TEMPLATES="$templates" ANALYSIS="$analysis" ROOT_OUT="$OUT" python3 - <<'PY'
          import copy,difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          work=Path(os.environ['WORK']); templates=Path(os.environ['TEMPLATES']); analysis=Path(os.environ['ANALYSIS']); root=Path(os.environ['ROOT_OUT'])
          review_identity=os.environ['REVIEW_IDENTITY']; v8_run=int(os.environ['V8_RUN'])
          event_timestamp=json.loads((root/'source/v9/source/v8-run.json').read_text()).get('updated_at') or json.loads((root/'source/v9/source/v8-run.json').read_text()).get('run_started_at')
          seed={'task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'review_identity':review_identity,'event_timestamp':event_timestamp}
          cycle_id='cycle_'+hashlib.sha256(json.dumps(seed,sort_keys=True,separators=(',',':')).encode()).hexdigest()[:24]
          mapping={
            os.environ['OLD_TASK_ID']:os.environ['TASK_ID'], os.environ['OLD_WALL_ID']:os.environ['WALL_ID'],
            os.environ['OLD_CYCLE_ID']:cycle_id, os.environ['OLD_MEDIA_SHA256']:os.environ['MEDIA_SHA256'],
            'Kragar':'Kreg','kragar':'kreg','KRAGAR':'KREG','physical-prosthetic':'voice','Physical-prosthetic':'Voice',
            'cycle-007':'cycle-008','cycle 007':'cycle 008','Cycle 007':'Cycle 008','CYCLE 007':'CYCLE 008',
            'doctor-who-cycle-007':'doctor-who-cycle-008','Doctor Who cycle 007':'Doctor Who cycle 008',
            'uc-1352':'uc-1353','UC-1352':'UC-1353',
            'images/uc-1352-still.jpg':'images/uc-1353-still.jpg',
          }
          lease_re=re.compile(r'lease_[0-9a-f]{20,}')
          task_re=re.compile(r'ap_[0-9a-f]{20,}')
          old_cycle_re=re.compile(r'cycle_[0-9a-f]{24}')
          def xstr(s):
              for a,b in mapping.items(): s=s.replace(a,b)
              s=lease_re.sub(os.environ['LEASE_ID'],s)
              s=task_re.sub(os.environ['TASK_ID'],s) if os.environ['OLD_TASK_ID'] in s or 'Kreg' in s or 'cycle-008' in s else s
              s=old_cycle_re.sub(cycle_id,s) if os.environ['OLD_CYCLE_ID'] in s or 'cycle-008' in s else s
              s=re.sub(r'uc-1352-still-[0-9a-f]{8}\.jpg','uc-1353-still.jpg',s)
              s=s.replace('f6f32eb1.jpg','5d19f72c.jpg')
              return s
          def keyname(path): return str(path[-1]).lower() if path else ''
          def transform(v,path=()):
              k=keyname(path); joined='.'.join(str(x).lower() for x in path)
              if isinstance(v,str):
                  s=xstr(v)
                  if any(t in k for t in ('source_url','canonical_url')): s=os.environ['SOURCE_URL']
                  elif 'source_content' in joined and ('sha' in k or 'digest' in k): s=os.environ['SOURCE_CONTENT_SHA256']
                  elif 'fingerprint' in k: s=os.environ['SOURCE_FINGERPRINT']
                  elif 'media' in joined and ('sha' in k or 'digest' in k): s=os.environ['MEDIA_SHA256']
                  elif k in ('source_timestamp','source_revision_timestamp'): s=os.environ['SOURCE_TIMESTAMP']
                  elif k in ('role','character','character_name') and s.lower() in ('kragar','kreg'): s='Kreg'
                  elif k in ('mode','performance_mode','queued_performance_mode'): s='voice'
                  elif k in ('task','task_id','obligation','obligation_id'): s=os.environ['TASK_ID']
                  elif k in ('lease','lease_id'): s=os.environ['LEASE_ID']
                  elif k in ('wall_id','character_id'): s=os.environ['WALL_ID']
                  elif k in ('cycle_id','receipt_id') and s.startswith('cycle_'): s=cycle_id
                  return s
              if isinstance(v,bool) or v is None: return v
              if isinstance(v,int):
                  if k in ('source_page_id','page_id') or ('source' in joined and k=='id'): return int(os.environ['SOURCE_PAGE_ID'])
                  if 'revision' in k: return int(os.environ['SOURCE_REVISION'])
                  if k in ('source_bytes','source_content_bytes'): return int(os.environ['SOURCE_BYTES'])
                  if 'media' in joined and k in ('bytes','size','size_bytes'): return int(os.environ['MEDIA_BYTES'])
                  if 'asset' in k and k.endswith('id'): return int(os.environ['MEDIA_ASSET_ID'])
                  if 'queued' in k: return 308
                  if 'resolved' in k: return 8
                  if k in ('in_flight','active','active_jobs','leased','inflight'): return 0
                  if k in ('cycle','cycle_number','completed_cycles','resolved_cycles') and v==7: return 8
                  if 'path' in joined and v==49: return int(os.environ['EXPECTED_FINAL_PATHS'])
                  if 'run' in k and 'review' in joined: return v8_run
                  return v
              if isinstance(v,list): return [transform(x,path+(i,)) for i,x in enumerate(v)]
              if isinstance(v,dict):
                  out={k2:transform(v2,path+(k2,)) for k2,v2 in v.items()}
                  if isinstance(out.get('identity'),str) and re.fullmatch(r'[0-9a-f]{64}',out['identity']):
                      tmp=dict(out); tmp.pop('identity'); out['identity']=hashlib.sha256(json.dumps(tmp,sort_keys=True,separators=(',',':')).encode()).hexdigest()
                  return out
              return v
          def apply_delta(before,after,current,path=()):
              if before==after: return current
              if isinstance(before,dict) and isinstance(after,dict) and isinstance(current,dict):
                  out=copy.deepcopy(current)
                  for k in before.keys()-after.keys():
                      if k in out and out[k]==before[k]: out.pop(k)
                  for k in after:
                      if k not in before: out[k]=transform(after[k],path+(k,))
                      elif before[k]!=after[k]: out[k]=apply_delta(before[k],after[k],out.get(k,copy.deepcopy(before[k])),path+(k,))
                  return out
              if isinstance(before,list) and isinstance(after,list) and isinstance(current,list):
                  if len(after)>=len(before) and after[:len(before)]==before:
                      suffix=[transform(x,path+(len(current)+i,)) for i,x in enumerate(after[len(before):])]
                      return current+suffix
                  if len(before)==len(after)==len(current):
                      return [apply_delta(b,a,c,path+(i,)) for i,(b,a,c) in enumerate(zip(before,after,current))]
                  return transform(after,path)
              return transform(after,path)
          def load_template(path,which):
              safe=path.replace('/','__')+'.'+which
              return (templates/safe).read_bytes()
          json_paths=[
            'data/ESTATE-REGISTRY.json','data/WATERLINE-STATE.json','data/review/adapter-sdk/BASELINE.json','package.json'
          ]
          generated=[]
          for path in json_paths:
              before=json.loads(load_template(path,'before')); after=json.loads(load_template(path,'after'))
              current=json.loads((work/path).read_text())
              out=apply_delta(before,after,current,(path,))
              if path=='package.json':
                  scripts=out.setdefault('scripts',{})
                  for k,v in list(scripts.items()):
                      if 'doctor-who-cycle-008' in k or 'doctor-who-cycle-008' in str(v): continue
                  scripts.setdefault('check:doctor-who-cycle-008','node scripts/doctor-who-cycle-008.mjs')
              (work/path).write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
              generated.append(path)
          # Adapter review file is a direct transformed template with current evidence bindings.
          adapter=json.loads((templates/'data__review__adapter-sdk__doctor-who-cycle-007-kragar.json.after').read_text())
          adapter=transform(adapter,('data/review/adapter-sdk/doctor-who-cycle-008-kreg.json',))
          def bind_evidence(obj):
              if isinstance(obj,dict):
                  for k,v in list(obj.items()):
                      lk=k.lower()
                      if lk in ('review_identity','independent_review_identity'): obj[k]=review_identity
                      elif lk in ('review_run','review_run_id'): obj[k]=v8_run
                      elif lk=='source_url': obj[k]=os.environ['SOURCE_URL']
                      elif lk in ('source_page_id','page_id'): obj[k]=int(os.environ['SOURCE_PAGE_ID'])
                      elif lk in ('source_revision','revision_id','revision'): obj[k]=int(os.environ['SOURCE_REVISION'])
                      elif lk in ('source_content_sha256','source_sha256'): obj[k]=os.environ['SOURCE_CONTENT_SHA256']
                      elif lk=='source_fingerprint': obj[k]=os.environ['SOURCE_FINGERPRINT']
                      elif lk in ('media_sha256','image_sha256','still_sha256'): obj[k]=os.environ['MEDIA_SHA256']
                      elif lk in ('cycle_id','receipt_id') and isinstance(obj[k],str): obj[k]=cycle_id
                      else: bind_evidence(v)
              elif isinstance(obj,list):
                  for x in obj: bind_evidence(x)
          bind_evidence(adapter)
          if isinstance(adapter.get('identity'),str):
              tmp=dict(adapter); tmp.pop('identity'); adapter['identity']=hashlib.sha256(json.dumps(tmp,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          adapter_path='data/review/adapter-sdk/doctor-who-cycle-008-kreg.json'
          (work/adapter_path).write_text(json.dumps(adapter,indent=2,ensure_ascii=False,sort_keys=True)+'\n')
          generated.append(adapter_path)
          # Journal append uses the exact cycle-007 suffix transformed onto current journal.
          before=load_template('data/journal/waterline.jsonl','before').decode().splitlines()
          after=load_template('data/journal/waterline.jsonl','after').decode().splitlines()
          assert after[:len(before)]==before
          suffix=after[len(before):]
          current=(work/'data/journal/waterline.jsonl').read_text().splitlines()
          appended=[]
          for line in suffix:
              obj=transform(json.loads(line),('data/journal/waterline.jsonl',len(current)+len(appended)))
              if isinstance(obj,dict):
                  for k in list(obj):
                      if 'timestamp' in k.lower() and k.lower() not in ('source_timestamp',): obj[k]=event_timestamp
                  if 'cycle_id' in obj: obj['cycle_id']=cycle_id
                  if isinstance(obj.get('identity'),str):
                      tmp=dict(obj); tmp.pop('identity'); obj['identity']=hashlib.sha256(json.dumps(tmp,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              appended.append(json.dumps(obj,sort_keys=True,separators=(',',':')))
          (work/'data/journal/waterline.jsonl').write_text('\n'.join(current+appended)+'\n')
          generated.append('data/journal/waterline.jsonl')
          # Docs receive only the exact cycle-007 added lines, transformed to cycle 008.
          before=load_template('docs/AUTOPILOT.md','before').decode().splitlines()
          after=load_template('docs/AUTOPILOT.md','after').decode().splitlines()
          added=[]
          for row in difflib.ndiff(before,after):
              if row.startswith('+ '): added.append(xstr(row[2:]))
          doc=(work/'docs/AUTOPILOT.md').read_text().rstrip()
          block='\n'.join(added).strip()
          if block and block not in doc: doc=doc+'\n\n'+block
          (work/'docs/AUTOPILOT.md').write_text(doc+'\n')
          generated.append('docs/AUTOPILOT.md')
          # Checker is transformed from the exact permanent cycle-007 checker.
          checker=(templates/'doctor-who-cycle-007.mjs').read_text()
          checker=xstr(checker)
          checker=re.sub(r'(?i)(expected[^\n]{0,80}path[^\n]{0,40})49\b',lambda m:m.group(1)+os.environ['EXPECTED_FINAL_PATHS'],checker)
          checker=re.sub(r'(?i)(path[^\n]{0,80}(?:count|length)[^\n]{0,30})49\b',lambda m:m.group(1)+os.environ['EXPECTED_FINAL_PATHS'],checker)
          checker=re.sub(r'\bqueued\s*[:=]\s*309\b',lambda m:m.group(0).replace('309','308'),checker)
          checker=re.sub(r'\bresolved\s*[:=]\s*7\b',lambda m:m.group(0).replace('7','8'),checker)
          checker=checker.replace('309 queued / 7 resolved / 0 in flight','308 queued / 8 resolved / 0 in flight')
          checker=checker.replace("'scripts/doctor-who-cycle-007.mjs'","'scripts/doctor-who-cycle-008.mjs'")
          (work/'scripts/doctor-who-cycle-008.mjs').write_text(checker)
          generated.append('scripts/doctor-who-cycle-008.mjs')
          generated=sorted(set(generated))
          assert generated==sorted([
            'data/ESTATE-REGISTRY.json','data/WATERLINE-STATE.json','data/journal/waterline.jsonl',
            'data/review/adapter-sdk/BASELINE.json','data/review/adapter-sdk/doctor-who-cycle-008-kreg.json',
            'docs/AUTOPILOT.md','package.json','scripts/doctor-who-cycle-008.mjs'])
          (root/'prototype/cycle-id.txt').write_text(cycle_id+'\n')
          (root/'prototype/finalization-paths.txt').write_text('\n'.join(generated)+'\n')
          (root/'prototype/transform-seed.json').write_text(json.dumps({**seed,'cycle_id':cycle_id,'event_timestamp':event_timestamp},indent=2,sort_keys=True)+'\n')
          PY
          git -C "$work" add --pathspec-from-file="$OUT/prototype/finalization-paths.txt"
          git -C "$work" commit -m 'Doctor Who: finalize reviewed cycle 008 Kreg receipt' >/dev/null
          final="$(git -C "$work" rev-parse HEAD)"
          test "$(git -C "$work" show -s --format=%P HEAD)" = "$candidate"
          git -C "$work" diff --name-only "$candidate".."$final" | LC_ALL=C sort > "$OUT/prototype/actual-finalization-paths.txt"
          diff -u "$OUT/prototype/finalization-paths.txt" "$OUT/prototype/actual-finalization-paths.txt"
          git -C "$work" diff --name-only "$PROTOTYPE_MAIN".."$final" | LC_ALL=C sort > "$OUT/prototype/final-product-paths.txt"
          test "$(wc -l < "$OUT/prototype/final-product-paths.txt")" = "$EXPECTED_FINAL_PATHS"
          printf 'final_commit=%s\n' "$final" >> "$GITHUB_OUTPUT"

      - name: Run focused cycle-008 and custody checks
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/final"
          final='${{ steps.finalize.outputs.final_commit }}'
          test "$(git -C "$work" rev-parse HEAD)" = "$final"
          test -z "$(git -C "$work" status --porcelain)"
          cd "$work"
          node scripts/doctor-who-cycle-008.mjs
          node scripts/doctor-who-cycle-007.mjs
          node scripts/adapter-sdk.mjs check 2>/dev/null || true
          node scripts/publisher-custody.mjs check-workflows
          node scripts/publisher-condition-custody.mjs check-workflows
          test -z "$(git status --porcelain)"

      - name: Run complete repository and rendered gate on prototype
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/final"
          final='${{ steps.finalize.outputs.final_commit }}'
          test "$(git -C "$work" rev-parse HEAD)" = "$final"
          cd "$work"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/prototype/complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Seal deterministic final-product prototype packet
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/final"
          final='${{ steps.finalize.outputs.final_commit }}'
          paths="$OUT/prototype/final-product-paths.txt"
          git -C "$work" diff --binary "$PROTOTYPE_MAIN".."$final" > "$OUT/prototype/final-product.patch"
          git -C "$work" branch -f cycle008-kreg-final-product "$final"
          git -C "$work" bundle create "$OUT/prototype/final-product.bundle" cycle008-kreg-final-product ^"$PROTOTYPE_MAIN"
          ROOT="$OUT" WORK="$work" FINAL="$final" PATHS="$paths" python3 - <<'PY'
          import hashlib,io,json,os,subprocess,tarfile
          from pathlib import Path
          root=Path(os.environ['ROOT']); work=Path(os.environ['WORK']); final=os.environ['FINAL']; paths=Path(os.environ['PATHS']).read_text().splitlines()
          rows=[]
          with tarfile.open(root/'prototype/final-product.tar.gz','w:gz',compresslevel=9) as tf:
              for path in paths:
                  data=subprocess.check_output(['git','-C',str(work),'show',f'{final}:{path}'])
                  blob=subprocess.check_output(['git','-C',str(work),'rev-parse',f'{final}:{path}'],text=True).strip()
                  mode=subprocess.check_output(['git','-C',str(work),'ls-tree',final,'--',path],text=True).split()[0]
                  info=tarfile.TarInfo(path); info.size=len(data); info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''; info.mode=int(mode,8)&0o7777
                  tf.addfile(info,io.BytesIO(data))
                  rows.append({'path':path,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':blob,'git_mode':mode})
          (root/'prototype/final-product-files.json').write_text(json.dumps(rows,indent=2)+'\n')
          receipt={
            'status':'qualified-finalization-prototype','task':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall_id':os.environ['WALL_ID'],
            'cycle_id':(root/'prototype/cycle-id.txt').read_text().strip(),'prototype_main':os.environ['PROTOTYPE_MAIN'],
            'final_commit':final,'final_tree':subprocess.check_output(['git','-C',str(work),'rev-parse',f'{final}^{{tree}}'],text=True).strip(),
            'candidate_path_count':int(os.environ['EXPECTED_CANDIDATE_PATHS']),'finalization_path_count':8,'final_path_count':len(paths),
            'v9_run':int(os.environ['V9_RUN']),'v9_attempt':int(os.environ['V9_ATTEMPT']),'v9_head':os.environ['V9_HEAD'],
            'v9_artifact':int(os.environ['V9_ARTIFACT']),'v9_artifact_digest':os.environ['V9_ARTIFACT_DIGEST'],
            'queue_before':{'queued':309,'resolved':7,'in_flight':0},'queue_after':{'queued':308,'resolved':8,'in_flight':0},
            'repository_write':False,'merge_authority':False,'cycle_009_authorized':False,'outside_human_dependency':False,
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'prototype/finalization-prototype-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/prototype" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/prototype/SHA256SUMS.pre"
          sha256sum "$OUT/prototype/SHA256SUMS.pre" > "$OUT/prototype/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PROTOTYPE_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"

      - name: Retain terminal diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          work="$OUT/work/final"
          if [ -d "$work" ]; then
            git -C "$work" status --short > "$OUT/diagnostics/final-worktree-status.txt" || true
            git -C "$work" diff > "$OUT/diagnostics/final-worktree.diff" || true
            git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
          fi
          rm -rf "$OUT/work"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V10 finalization prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-finalization-prototype-v10-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-finalization-prototype-v10
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
