name: ferengi-media-enrichment-001-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-MEDIA-ENRICHMENT-001-APPLY.json"
      - ".github/workflows/ferengi-media-enrichment-001-apply.yml"

permissions:
  contents: write

concurrency:
  group: ferengi-media-enrichment-001-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ferengi-media-enrichment-001'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ferengi-media-enrichment-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Build the exact reviewed curation packet
        run: |
          set -euo pipefail
          out=/tmp/ferengi-media-enrichment-001-apply
          rm -rf "$out"
          mkdir -p "$out/curate"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const command=JSON.parse(fs.readFileSync('.github/FERENGI-MEDIA-ENRICHMENT-001-APPLY.json','utf8'));
          const selectionDir='data/review/ferengi-media-enrichment-001';
          const files=fs.readdirSync(selectionDir).filter(name=>/^selection-batch-\d+\.json$/.test(name)).sort();
          if(files.length!==7) throw new Error(`expected seven reviewed selection batches, found ${files.length}`);
          const docs=files.map(name=>JSON.parse(fs.readFileSync(path.join(selectionDir,name),'utf8')));
          const cards=docs.flatMap(doc=>doc.cards||[]);
          const facets=cards.reduce((sum,card)=>sum+Number(Boolean(card.still))+Number(Boolean(card.portrait)),0);
          const stills=cards.filter(card=>card.still).length;
          const portraits=cards.filter(card=>card.portrait).length;
          if(cards.length!==command.expected_cards||facets!==command.expected_facets||stills!==command.expected_stills||portraits!==command.expected_portraits){
            throw new Error(`selection denominator drift: cards=${cards.length} facets=${facets} stills=${stills} portraits=${portraits}`);
          }
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const byId=new Map(specimens.map(record=>[record.id,record]));
          const seen=new Set();
          const manifest=[];
          const picks=[];
          for(const card of cards){
            const record=byId.get(card.id);
            if(!record||record.character!==card.character||record.actor!==card.actor) throw new Error(`selection identity drift for ${card.id}`);
            const entry={id:card.id,character:card.character,actor:card.actor,still:[],portrait:[]};
            const pick={id:card.id,still:'',portrait:''};
            for(const side of ['still','portrait']){
              const selected=card[side];
              if(!selected) continue;
              const key=`${card.id}|${side}`;
              if(seen.has(key)) throw new Error(`duplicate reviewed facet ${key}`);
              seen.add(key);
              if(record[side]) throw new Error(`${key} is no longer absent; refuse to overwrite without a new review`);
              const label=side==='still'?'m1':'f1';
              entry[side].push({...selected,label});
              pick[side]=label;
            }
            manifest.push(entry);
            picks.push(pick);
          }
          fs.writeFileSync('/tmp/ferengi-media-enrichment-001-apply/curate/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          fs.writeFileSync('/tmp/ferengi-media-enrichment-001-apply/curate/picks.json',JSON.stringify(picks,null,2)+'\n');
          fs.writeFileSync('/tmp/ferengi-media-enrichment-001-apply/selection-summary.json',JSON.stringify({cards:cards.length,facets,stills,portraits,files},null,2)+'\n');
          NODE
      - name: Download and pin all reviewed online media
        env:
          CONTACT: bigbirdreturns@proton.me
          CURATE_DIR: /tmp/ferengi-media-enrichment-001-apply/curate
        run: |
          set -euo pipefail
          node scripts/curate.mjs apply | tee /tmp/ferengi-media-enrichment-001-apply/curate-apply.log
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='data/specimens.json';
          const specimens=JSON.parse(fs.readFileSync(path,'utf8'));
          const grey=specimens.find(row=>row.id==='UC-1285');
          if(!grey||grey.actor!=='Grey Griffin') throw new Error('Grey Griffin card identity drifted');
          grey.aliases=[...new Set([...(grey.aliases||[]),'Grey DeLisle'])];
          fs.writeFileSync(path,JSON.stringify(specimens,null,2)+'\n');
          NODE
          node scripts/sync-sources.mjs | tee /tmp/ferengi-media-enrichment-001-apply/sync-sources.log
      - name: Retain hash-bound applied-asset receipts
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const selectionDir='data/review/ferengi-media-enrichment-001';
          const cards=fs.readdirSync(selectionDir).filter(name=>/^selection-batch-\d+\.json$/.test(name)).sort().flatMap(name=>JSON.parse(fs.readFileSync(path.join(selectionDir,name),'utf8')).cards||[]);
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const byId=new Map(specimens.map(record=>[record.id,record]));
          const assets=[];
          for(const card of cards){
            const record=byId.get(card.id);
            for(const side of ['still','portrait']){
              if(!card[side]) continue;
              const asset=record?.[side];
              if(!asset?.src||asset.origin!==card[side].origin) throw new Error(`${card.id} ${side} did not retain the reviewed source`);
              const bytes=fs.readFileSync(asset.src);
              assets.push({
                wall_id:card.id,
                side,
                actor:card.actor,
                character:card.character,
                src:asset.src,
                bytes:bytes.length,
                sha256:crypto.createHash('sha256').update(bytes).digest('hex'),
                kind:asset.kind,
                origin:asset.origin,
                author:asset.author||'',
                license:asset.license||'',
                selected_file:card[side].file,
                review_note:card[side].review_note
              });
            }
          }
          if(assets.length!==42) throw new Error(`expected 42 applied facets, found ${assets.length}`);
          fs.writeFileSync('data/review/ferengi-media-enrichment-001/applied-assets.json',JSON.stringify({version:1,scope:'star-trek',category:'Ferengi',applied_at:new Date().toISOString(),assets},null,2)+'\n');
          fs.writeFileSync('/tmp/ferengi-media-enrichment-001-apply/applied-assets.json',JSON.stringify({version:1,assets},null,2)+'\n');
          NODE
      - name: Rebuild projections and close every reviewed media facet
        run: |
          set -euo pipefail
          out=/tmp/ferengi-media-enrichment-001-apply
          node scripts/credits.mjs | tee "$out/credits.log"
          node scripts/shard.mjs | tee "$out/shard.log"
          node scripts/build-contract.mjs | tee "$out/build-contract.log"
          node scripts/media-audit.mjs sync | tee "$out/media-sync.log"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const selectionDir='data/review/ferengi-media-enrichment-001';
          const docs=fs.readdirSync(selectionDir).filter(name=>/^selection-batch-\d+\.json$/.test(name)).sort().map(name=>JSON.parse(fs.readFileSync(path.join(selectionDir,name),'utf8')));
          const cards=docs.flatMap(doc=>doc.cards||[]);
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const votes=[];
          for(const card of cards){
            for(const side of ['still','portrait']){
              const selected=card[side];
              if(!selected) continue;
              const item=audit.items.find(row=>row.scope==='star-trek'&&row.wall_id===card.id&&row.side===side);
              if(!item?.asset) throw new Error(`${card.id} ${side} lacks a current media-audit asset`);
              const evidence=[{type:'source-page',value:selected.origin},{type:'selected-file',value:selected.file}];
              votes.push({item_id:item.id,namespace:'identity',value:'expected',note:selected.review_note,evidence,enforced:true});
              votes.push({item_id:item.id,namespace:'presentation',value:side==='still'?'character-depiction':'neutral-human',note:side==='still'?'The selected frame is a clear in-character performance depiction suitable for the card front.':'The selected image is a clear unmasked human portrait suitable for the performer side.',evidence,enforced:true});
            }
          }
          const reviewedAt=new Date().toISOString();
          fs.writeFileSync('data/review/ferengi-media-enrichment-001/media-resolution.json',JSON.stringify({version:2,reviewed_by:'chatgpt-second-desk',reviewed_role:'second-desk',reviewed_at:reviewedAt,votes},null,2)+'\n');
          NODE
          node scripts/media-audit.mjs resolve --input data/review/ferengi-media-enrichment-001/media-resolution.json | tee "$out/media-resolve.log"
          node scripts/media-audit.mjs validate | tee "$out/media-validate.log"
          node scripts/media-audit.mjs gate --scope star-trek | tee "$out/media-gate.log"
          node scripts/waterline.mjs validate | tee "$out/waterline-validate.log"
      - name: Refresh every permanent derived surface
        run: |
          set -euo pipefail
          out=/tmp/ferengi-media-enrichment-001-apply
          node scripts/ds9-census.mjs --project-only > "$out/ds9-census.log" 2>&1
          node scripts/ds9-graph.mjs --project-only > "$out/ds9-graph.log" 2>&1
          node scripts/ds9-eligibility-queue.mjs > "$out/ds9-eligibility.log" 2>&1
          node scripts/ds9-maker-queue.mjs > "$out/ds9-maker.log" 2>&1
          node scripts/build-record-pages.mjs > "$out/record-routes.log" 2>&1
          node scripts/build-contract.mjs > "$out/final-contract.log" 2>&1
      - name: Prove the improved baseline and retain the residual queue
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const command=JSON.parse(fs.readFileSync('.github/FERENGI-MEDIA-ENRICHMENT-001-APPLY.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const species=JSON.parse(fs.readFileSync('data/species.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const taxon=species.taxa.find(row=>row.key==='species:star-trek:ferengi');
          if(!taxon) throw new Error('Ferengi taxon missing after rebuild');
          const byId=new Map(specimens.map(row=>[row.id,row]));
          const wall=taxon.wall_records.map(row=>byId.get(row.id)).filter(Boolean);
          const residual=wall.filter(row=>!row.still||!row.portrait).map(row=>({id:row.id,character:row.character,actor:row.actor,missing_still:!row.still,missing_portrait:!row.portrait}));
          const media=audit.items.filter(item=>item.scope==='star-trek');
          const counts={total:media.length,verified:media.filter(item=>item.status==='verified').length,absent:media.filter(item=>item.status==='absent').length,review:media.filter(item=>item.status==='review').length,attention:media.filter(item=>item.status==='attention').length};
          for(const [key,value] of Object.entries(command.expected_post_apply_media)) if(counts[key]!==value) throw new Error(`post-apply media ${key}: expected ${value}, found ${counts[key]}`);
          if(residual.filter(row=>row.missing_still).length!==10||residual.filter(row=>row.missing_portrait).length!==22) throw new Error(`unexpected residual facets: ${JSON.stringify(residual)}`);
          const applied=JSON.parse(fs.readFileSync('data/review/ferengi-media-enrichment-001/applied-assets.json','utf8'));
          for(const asset of applied.assets){
            const item=media.find(row=>row.wall_id===asset.wall_id&&row.side===asset.side);
            if(item?.status!=='verified'||item.asset?.sha256!==asset.sha256) throw new Error(`${asset.wall_id} ${asset.side} is not verified against the applied bytes`);
          }
          const report={version:1,generated_at:new Date().toISOString(),displayed_ferengi_cards:wall.length,applied_facets:applied.assets.length,post_apply_media:counts,residual_cards:residual.length,residual_missing_stills:residual.filter(row=>row.missing_still).length,residual_missing_portraits:residual.filter(row=>row.missing_portrait).length,residual};
          fs.writeFileSync('data/review/ferengi-media-enrichment-001/residual-media.json',JSON.stringify(report,null,2)+'\n');
          fs.writeFileSync('/tmp/ferengi-media-enrichment-001-apply/final-state.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Build the permanent candidate and remove temporary operators
        run: |
          set -euo pipefail
          git config user.name "undercast-media"
          git config user.email "undercast-media@users.noreply.github.com"
          rm -f .github/FERENGI-MEDIA-ENRICHMENT-001.json
          rm -f .github/FERENGI-MEDIA-ENRICHMENT-001-APPLY.json
          rm -f .github/workflows/ferengi-media-enrichment-001-gather.yml
          rm -f .github/workflows/ferengi-media-enrichment-001-apply.yml
          git add -A
          git diff --cached --check
          git commit -m "Media: replace avoidable Ferengi absence"
          git show --stat --oneline HEAD > /tmp/ferengi-media-enrichment-001-apply/commit.txt
      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee /tmp/ferengi-media-enrichment-001-apply/gate.log
          git status --short | tee /tmp/ferengi-media-enrichment-001-apply/status.txt
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated candidate
        run: git push origin HEAD:agent/ferengi-media-enrichment-001
      - name: Retain exact enrichment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-media-enrichment-001-apply-${{ github.run_id }}
          path: /tmp/ferengi-media-enrichment-001-apply
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
