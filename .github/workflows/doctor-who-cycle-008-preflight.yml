name: doctor-who-cycle-008-preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-preflight.yml"

permissions:
  contents: read

concurrency:
  group: doctor-who-cycle-008-preflight
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-preflight.yml
  EXACT_MAIN: 801d6129ab901e730ca8ec6333cebe0dd0d5574e
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-preflight

jobs:
  preflight:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-preflight'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind the one-file carrier and cleaned cycle-007 main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/current"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

          if test "$(git rev-parse --is-shallow-repository)" = "true"; then
            git fetch --no-tags --filter=blob:none --unshallow origin \
              "+refs/heads/main:refs/remotes/origin/main"
          else
            git fetch --no-tags --filter=blob:none origin \
              "+refs/heads/main:refs/remotes/origin/main"
          fi
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          git fetch --filter=blob:none origin "+refs/tags/*:refs/tags/*"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"

          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git ls-tree -r --name-only "$EXACT_MAIN" | LC_ALL=C sort > "$OUT/exact-main-paths.txt"
          grep -E '(^\.github/workflows/doctor-who-cycle-007|^\.ci/doctor-who-cycle-007|^tmp/.*doctor-who-cycle-007|^tmp/.*cycle-007.*\.trigger$)' \
            "$OUT/exact-main-paths.txt" > "$OUT/stale-cycle-007-paths.txt" || true
          test ! -s "$OUT/stale-cycle-007-paths.txt"
          grep -E '(^\.ci/doctor-who-cycle-008|^tmp/.*doctor-who-cycle-008|^tmp/.*cycle-008.*\.trigger$|^\.github/workflows/complete-doctor-who-cycle-008)' \
            "$OUT/exact-main-paths.txt" > "$OUT/preexisting-cycle-008-transport.txt" || true
          test ! -s "$OUT/preexisting-cycle-008-transport.txt"

          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            > "$OUT/main-identity.txt"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Prove the live cycle-007 floor and complete gate
        shell: bash
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee "$OUT/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/complete-gate.log" >/dev/null
          grep -F '23 passed' "$OUT/complete-gate.log" >/dev/null
          grep -F '15 passed' "$OUT/complete-gate.log" >/dev/null
          grep -F '9 passed' "$OUT/complete-gate.log" >/dev/null

          node scripts/autopilot.mjs validate | tee "$OUT/autopilot-validate.log"
          node scripts/autopilot.mjs readiness --scope doctor-who --require-active --json > "$OUT/readiness.json"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/status.json"
          node scripts/waterline.mjs validate --scope doctor-who | tee "$OUT/waterline.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/media-gate.log"
          node scripts/doctor-who-cycle-007.mjs | tee "$OUT/cycle-007.log"
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/cycle-006-chronology-composable.log"
          node scripts/star-trek-enwright-cycle.mjs | tee "$OUT/enwright.log"

          jq -e '.in_flight == 0 and .statuses.queued == 309 and .statuses.resolved == 7' "$OUT/status.json" >/dev/null
          test -z "$(git status --porcelain)"
          sha256sum "$OUT/complete-gate.log" > "$OUT/complete-gate.sha256"

      - name: Select deterministic cycle-008 task without claiming it
        shell: bash
        run: |
          set -euo pipefail
          node scripts/autopilot.mjs candidates \
            --scope doctor-who \
            --capability-profile text-vision \
            --limit 400 \
            --json > "$OUT/candidates.json"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const out = process.env.OUT;
          const report = JSON.parse(fs.readFileSync(`${out}/candidates.json`, 'utf8'));
          const state = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const readinessDoc = JSON.parse(fs.readFileSync(`${out}/readiness.json`, 'utf8'));
          const status = JSON.parse(fs.readFileSync(`${out}/status.json`, 'utf8'));
          const priorPath = 'data/review/adapter-sdk/doctor-who-cycle-007-kragar.json';
          const priorBytes = fs.readFileSync(priorPath);
          const prior = JSON.parse(priorBytes);
          const activeStatuses = new Set(['leased', 'drafted', 'merged']);
          const allActive = state.jobs.filter((job) => activeStatuses.has(job.status));
          const jobs = state.jobs.filter((job) => job.scope === 'doctor-who');
          const readiness = Array.isArray(readinessDoc) ? readinessDoc[0] : readinessDoc;

          if (report.scope_id !== 'doctor-who') throw new Error('candidate scope drifted');
          if (report.profile?.id !== 'text-vision') throw new Error('candidate profile drifted');
          if (!Array.isArray(report.compatible) || report.compatible.length < 1) throw new Error('no compatible Doctor Who task exists');
          if (allActive.length !== 0) throw new Error(`global estate has ${allActive.length} active job(s)`);
          if (status.in_flight !== 0 || status.statuses?.queued !== 309 || status.statuses?.resolved !== 7) throw new Error('Doctor Who queue denominator drifted');
          if (!readiness || readiness.scope_id !== 'doctor-who' || readiness.effective_status !== 'active' || readiness.lease_status !== 'ready' || !readiness.lease_token) throw new Error('Doctor Who is not lease-ready');
          if (jobs.length !== 316) throw new Error(`Doctor Who denominator drifted to ${jobs.length}`);
          if (prior?.transaction !== 'DOCTOR-WHO-CYCLE-007-KRAGAR') throw new Error('cycle-007 receipt identity drifted');
          if (prior?.reviewed_cycle?.id !== 'cycle_540222fb1378fa680a43d080') throw new Error('cycle-007 receipt id drifted');
          if (prior?.boundary?.eighth_lease_issued !== false) throw new Error('cycle-007 eighth-lease boundary drifted');

          const selected = report.compatible[0];
          const task = jobs.find((job) => job.id === selected.task_id);
          if (!task || task.status !== 'queued') throw new Error('selected durable task is not queued');
          if (task.id === 'ap_ffea809b980b468b33fa462c') throw new Error('cycle-007 task was selected again');
          if (task.source_fingerprint !== selected.source_fingerprint) throw new Error('selected source fingerprint drifted');
          if (!Array.isArray(task.source_receipts) || task.source_receipts.length < 1) throw new Error('selected task lacks source receipts');

          const queue = jobs.reduce((acc, job) => {
            acc[job.status] = (acc[job.status] || 0) + 1;
            return acc;
          }, {});
          const packet = {
            version: 8,
            exact_main: process.env.EXACT_MAIN,
            prior_reviewed_cycle: {
              id: 'cycle_540222fb1378fa680a43d080',
              receipt_path: priorPath,
              receipt_sha256: crypto.createHash('sha256').update(priorBytes).digest('hex'),
            },
            lease_issued: false,
            claim_authorized: true,
            selection_strategy: 'deterministic-first-compatible-read-only',
            profile: report.profile,
            policy_sha256: report.policy_sha256,
            counts: report.counts,
            queue,
            global_active_count: allActive.length,
            selected,
            task,
            readiness,
          };
          const canonical = JSON.stringify(packet);
          fs.writeFileSync(`${out}/global-active-jobs.json`, `${JSON.stringify(allActive, null, 2)}\n`);
          fs.writeFileSync(`${out}/selected-task.json`, `${JSON.stringify(packet, null, 2)}\n`);
          fs.writeFileSync(`${out}/selected-task-id.txt`, `${task.id}\n`);
          fs.writeFileSync(`${out}/selected-source-fingerprint.txt`, `${task.source_fingerprint}\n`);
          fs.writeFileSync(`${out}/selection-sha256.txt`, `${crypto.createHash('sha256').update(canonical).digest('hex')}\n`);
          NODE

      - name: Recover every revision-bound source body
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const out = process.env.OUT;
          const packet = JSON.parse(fs.readFileSync(`${out}/selected-task.json`, 'utf8'));
          const recovered = [];
          for (const [index, receipt] of packet.task.source_receipts.entries()) {
            const source = new URL(receipt.source);
            const endpoint = new URL('/api.php', source.origin);
            endpoint.search = new URLSearchParams({
              action: 'query',
              prop: 'revisions',
              revids: String(receipt.revision),
              rvprop: 'ids|timestamp|content',
              rvslots: 'main',
              format: 'json',
              formatversion: '2',
              origin: '*',
            }).toString();
            const response = await fetch(endpoint, {headers: {'user-agent': 'Undercast exact-source recovery/1.0'}});
            if (!response.ok) throw new Error(`source fetch failed ${response.status}: ${receipt.source}`);
            const doc = await response.json();
            const page = doc?.query?.pages?.[0];
            const revision = page?.revisions?.[0];
            const content = revision?.slots?.main?.content ?? revision?.slots?.main?.['*'] ?? revision?.['*'];
            if (page?.pageid !== receipt.pageid || revision?.revid !== receipt.revision || revision?.timestamp !== receipt.timestamp) throw new Error(`source identity drifted: ${receipt.source}`);
            if (typeof content !== 'string') throw new Error(`source body missing: ${receipt.source}`);
            const bytes = Buffer.from(content);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (digest !== receipt.content_sha256) throw new Error(`source content SHA drifted: ${receipt.source}`);
            const recoveredPath = `${out}/source-${String(index + 1).padStart(2, '0')}.wikitext`;
            fs.writeFileSync(recoveredPath, bytes);
            recovered.push({...receipt, recovered_path: recoveredPath, recovered_bytes: bytes.length, recovered_sha256: digest});
          }
          fs.writeFileSync(`${out}/recovered-sources.json`, `${JSON.stringify(recovered, null, 2)}\n`);
          NODE
          test -z "$(git status --porcelain)"

      - name: Export exact controls and no-write boundary
        shell: bash
        run: |
          set -euo pipefail
          root="$OUT/current"
          for file in \
            package.json \
            scripts/autopilot.mjs \
            scripts/lib/autopilot.mjs \
            scripts/media-audit.mjs \
            scripts/waterline.mjs \
            scripts/doctor-who-cycle-007.mjs \
            scripts/doctor-who-cycle-006-chronology-composable.mjs \
            scripts/star-trek-enwright-cycle.mjs \
            .github/workflows/validate.yml \
            data/AUTOPILOT-CAPABILITIES.json \
            data/AUTOPILOT-CERTIFICATIONS.json \
            data/AUTOPILOT-SCOPES.json \
            data/AUTOPILOT.json \
            data/CENSUS-COVERAGE.json \
            data/CENSUS-MANIFEST.json \
            data/ESTATE-REGISTRY.json \
            data/MEDIA-AUDIT.json \
            data/WATERLINE-STATE.json \
            data/review/adapter-sdk/doctor-who-cycle-007-kragar.json; do
            test -f "$file"
            mkdir -p "$root/$(dirname "$file")"
            cp "$file" "$root/$file"
          done

          git ls-tree -r --full-tree "$EXACT_MAIN" > "$OUT/exact-tree.txt"
          find "$root" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/current-surfaces.sha256"
          jq -n \
            --arg exact "$EXACT_MAIN" \
            --arg head "$HEAD_SHA" \
            '{
              version:1,
              exact_main:$exact,
              carrier_head:$head,
              complete_gate_passed:true,
              cycle_007_checker_passed:true,
              stale_cycle_007_transport:0,
              lease_issued:false,
              queue_mutated:false,
              canonical_record_created:false,
              media_adopted:false,
              waterline_event_written:false,
              cycle_receipt_written:false,
              product_published:false
            }' > "$OUT/boundary.json"
          test -z "$(git status --porcelain)"

      - name: Upload exact read-only cycle-008 preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-preflight-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: ${{ env.OUT }}
