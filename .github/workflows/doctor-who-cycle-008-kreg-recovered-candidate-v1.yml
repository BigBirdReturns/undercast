name: doctor-who-cycle-008-kreg-recovered-candidate-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-recovered-candidate-v1.yml"
      - ".github/doctor-who-cycle-008/kreg-recovered-candidate-v1/delta.tar.xz.b64"
      - ".github/doctor-who-cycle-008/kreg-recovered-candidate-v1/runner.sh"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: doctor-who-cycle-008-kreg-recovered-candidate-v1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-recovered-candidate-v1
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_BASE: 7ae6f5fde95b78caea03e1aafea618d3f05dfe32
  SELF: .github/workflows/doctor-who-cycle-008-kreg-recovered-candidate-v1.yml
  PAYLOAD_PATH: .github/doctor-who-cycle-008/kreg-recovered-candidate-v1/delta.tar.xz.b64
  RUNNER_PATH: .github/doctor-who-cycle-008/kreg-recovered-candidate-v1/runner.sh
  OUT: /tmp/doctor-who-cycle-008-kreg-recovered-candidate-v1
  FRAGMENT_TEXT_CHARS: "19999"
  FRAGMENT_TEXT_SHA256: 1d4819e1fe91bae83c10e6915a1ddfa3e98b66270e5672ab25c2e026806c7f3d
  RUNNER_SHA256: deff8b56e4d8829f527c3cf7ae1bde93772c5092a424f5bb3ae5a18154b81970
  SOURCE_RUN: "31205865241"
  SOURCE_JOB: "92956630831"
  SOURCE_HEAD: 42b891782481065319e663e80db392a74519bad2
  SOURCE_ARTIFACT: "9004919905"
  SOURCE_ARTIFACT_NAME: doctor-who-cycle-008-kreg-recovered-candidate-v1-failure-31205865241-attempt-1
  SOURCE_ARTIFACT_DIGEST: ce62a09be29452383a8d15598b7e78a730e8b06a9c72159946c24d9503e65336
  CANDIDATE_COMMIT: 7a6b85521c45ec45546ccab1ef2c0a28fff93687
  CANDIDATE_TREE: 6a0a3e7043faf511974597b5670ccb8c688994f5
  CANDIDATE_MANIFEST_SHA256: 644e33c8d745b2d868daef7e5e941422280b3a8b3a26b89760a4d059d6d124e7
  CANDIDATE_PATHS_SHA256: 936c96600265d2b2a82443ee98e603ac24e9b01b8184a8f82e3e0082b23a7786
  CANDIDATE_ARCHIVE_SHA256: 4362820691034a4dbfcc79ec3b06e9b1f7f94da9f0630f4d60794d7abf3e862e
  CANDIDATE_PATCH_SHA256: 374c1832ed8729d41ce19b9f5cce2a9074e12b9bf88c92acee33da6862dc17de
  CANDIDATE_BUNDLE_SHA256: b1efa8d3c27e06325af78e6edc8968213e093d1d35ff5e33f717b80dac4e8811
  COMPLETE_GATE_LOG_SHA256: aa8a86d92e9f0bb2a9731fd03b69be822700d852896c0068c81f918fa8713adf
  CANDIDATE_RECEIPT_FILE_SHA256: 2dda9bf95228c1edaabee91e4242a198422ab738ef9ed0622e07737af3eab14f
  CANDIDATE_RECEIPT_IDENTITY: 73f3ede52a0fa96f72fe46283c08095d1f7dd7f627b2d5a321477263c99b80c2
  TASK_ID: ap_469d79ea29fd7f877395d20f
  LEASE_ID: lease_e65f837070361eacbb1abd46
  WALL_ID: UC-1353
  STILL_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-recovered-candidate-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact repair carrier and successful substantive source boundary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostics,source}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test "$(git show -s --format=%P HEAD | wc -w | tr -d '[:space:]')" = 1
          test "$(git rev-parse HEAD^)" = "$EXACT_BASE"
          test "$(git rev-list --count "$EXACT_BASE"..HEAD)" = 1
          printf '%s\n%s\n%s\n' "$PAYLOAD_PATH" "$RUNNER_PATH" "$SELF" | LC_ALL=C sort > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_BASE"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          test "$(wc -c < "$PAYLOAD_PATH")" = "$FRAGMENT_TEXT_CHARS"
          test "$(sha256sum "$PAYLOAD_PATH" | awk '{print $1}')" = "$FRAGMENT_TEXT_SHA256"
          test "$(sha256sum "$RUNNER_PATH" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$RUNNER_PATH"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" > "$OUT/api/pr-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/api/source-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"

          ROOT="$OUT/api" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'pr.json').read_text())
          files=json.loads((root/'pr-files.json').read_text())
          run=json.loads((root/'source-run.json').read_text())
          jobs=json.loads((root/'source-jobs.json').read_text())
          artifact=json.loads((root/'source-artifact.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_BASE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH']
          assert pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==3
          expected={os.environ['SELF'],os.environ['PAYLOAD_PATH'],os.environ['RUNNER_PATH']}
          assert {row['filename'] for row in files}==expected
          assert all(row['status']=='added' for row in files)
          assert run['id']==int(os.environ['SOURCE_RUN'])
          assert run['head_sha']==os.environ['SOURCE_HEAD']
          assert run['head_branch']==os.environ['AUTHORIZED_BRANCH']
          assert run['event']=='pull_request' and run['status']=='completed' and run['conclusion']=='failure'
          matches=[job for job in jobs['jobs'] if job['id']==int(os.environ['SOURCE_JOB']) and job['name']=='qualify']
          assert len(matches)==1
          job=matches[0]
          assert job['status']=='completed' and job['conclusion']=='failure'
          observed={step['name']:(step['status'],step['conclusion']) for step in job['steps']}
          assert observed['Reconstruct exact code-free payload from immutable V4 census']==('completed','success')
          assert observed['Execute exact recovered candidate qualification']==('completed','success')
          assert observed['Seal exact V7b compatibility packet for independent review']==('completed','failure')
          assert observed['Retain failure diagnostics']==('completed','success')
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT'])
          assert artifact['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert artifact['digest']=='sha256:'+os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          PY

          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_BASE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Recover and independently verify the qualified forty-path candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$OUT/source/source.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip"
          test "$(sha256sum "$OUT/source/source.zip" | awk '{print $1}')" = "$SOURCE_ARTIFACT_DIGEST"

          ZIP="$OUT/source/source.zip" TARGET="$OUT/source/extracted" python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive=pathlib.Path(os.environ['ZIP'])
          target=pathlib.Path(os.environ['TARGET'])
          target.mkdir()
          with zipfile.ZipFile(archive) as zf:
              infos=zf.infolist()
              assert 1 <= len(infos) <= 300
              assert sum(info.file_size for info in infos) < 400_000_000
              seen=set()
              for info in infos:
                  path=pathlib.PurePosixPath(info.filename)
                  kind=(info.external_attr>>16)&0o170000
                  if path.is_absolute() or '..' in path.parts or info.filename in seen or kind==stat.S_IFLNK:
                      raise SystemExit(f'unsafe artifact member: {info.filename!r}')
                  seen.add(info.filename)
                  if info.is_dir():
                      continue
                  data=zf.read(info)
                  out=target.joinpath(*path.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          PY

          root="$OUT/source/extracted"
          for member in candidate-receipt.json candidate-file-manifest.json candidate-paths.txt expected-product-paths.txt candidate-product.tar.gz candidate.patch candidate.bundle complete-gate.log SHA256SUMS.pre SHA256SUMS; do
            test -f "$root/$member"
          done
          test "$(sha256sum "$root/candidate-receipt.json" | awk '{print $1}')" = "$CANDIDATE_RECEIPT_FILE_SHA256"
          test "$(sha256sum "$root/candidate-file-manifest.json" | awk '{print $1}')" = "$CANDIDATE_MANIFEST_SHA256"
          test "$(sha256sum "$root/candidate-paths.txt" | awk '{print $1}')" = "$CANDIDATE_PATHS_SHA256"
          test "$(sha256sum "$root/expected-product-paths.txt" | awk '{print $1}')" = "$CANDIDATE_PATHS_SHA256"
          test "$(sha256sum "$root/candidate-product.tar.gz" | awk '{print $1}')" = "$CANDIDATE_ARCHIVE_SHA256"
          test "$(sha256sum "$root/candidate.patch" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"
          test "$(sha256sum "$root/candidate.bundle" | awk '{print $1}')" = "$CANDIDATE_BUNDLE_SHA256"
          test "$(sha256sum "$root/complete-gate.log" | awk '{print $1}')" = "$COMPLETE_GATE_LOG_SHA256"
          test "$(sha256sum "$root/SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$root/SHA256SUMS")"

          git bundle verify "$root/candidate.bundle" > "$OUT/diagnostics/native-bundle-verify.txt"
          test "$(git bundle list-heads "$root/candidate.bundle" | awk '{print $1}')" = "$CANDIDATE_COMMIT"
          test "$(git bundle list-heads "$root/candidate.bundle" | awk '{print $2}')" = refs/heads/cycle008-kreg-recovered-candidate
          git update-ref -d refs/heads/cycle008-kreg-native >/dev/null 2>&1 || true
          git fetch "$root/candidate.bundle" cycle008-kreg-recovered-candidate:refs/heads/cycle008-kreg-native
          test "$(git rev-parse refs/heads/cycle008-kreg-native)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse "$CANDIDATE_COMMIT^")" = "$EXACT_BASE"
          test "$(git rev-parse "$CANDIDATE_COMMIT^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-list --count "$EXACT_BASE".."$CANDIDATE_COMMIT")" = 1
          git diff --name-only "$EXACT_BASE".."$CANDIDATE_COMMIT" | LC_ALL=C sort > "$OUT/diagnostics/candidate-diff-paths.txt"
          diff -u "$root/expected-product-paths.txt" "$OUT/diagnostics/candidate-diff-paths.txt"
          awk '/^\.github\/workflows\// { exit 1 }' "$root/expected-product-paths.txt"

          ROOT="$root" PACKET="$OUT/packet" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root=pathlib.Path(os.environ['ROOT'])
          packet=pathlib.Path(os.environ['PACKET'])
          packet.mkdir()
          receipt=json.loads((root/'candidate-receipt.json').read_text())
          identity=receipt.pop('identity')
          assert identity==os.environ['CANDIDATE_RECEIPT_IDENTITY']
          assert hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          assert receipt['base_main']==os.environ['EXACT_BASE']
          assert receipt['carrier_head']==os.environ['SOURCE_HEAD']
          assert receipt['candidate']=={
              'bundle_sha256':os.environ['CANDIDATE_BUNDLE_SHA256'],
              'commit':os.environ['CANDIDATE_COMMIT'],
              'delta_manifest_sha256':'0048626847dbb1f4770f83de487c05e6b36c9aff2d1eb54465d4aa61b5f58c3b',
              'expected_paths_sha256':os.environ['CANDIDATE_PATHS_SHA256'],
              'file_manifest_sha256':os.environ['CANDIDATE_MANIFEST_SHA256'],
              'patch_sha256':os.environ['CANDIDATE_PATCH_SHA256'],
              'paths':40,
              'product_archive_sha256':os.environ['CANDIDATE_ARCHIVE_SHA256'],
              'tree':os.environ['CANDIDATE_TREE'],
          }
          assert receipt['task']['id']==os.environ['TASK_ID']
          assert receipt['task']['lease_id']==os.environ['LEASE_ID']
          assert receipt['task']['wall_id']==os.environ['WALL_ID']
          assert receipt['media']['sha256']==os.environ['STILL_SHA256'] and receipt['media']['bytes']==67113
          assert receipt['queue']['after']=={'queued':308,'resolved':8,'in_flight':0}
          assert receipt['boundary']=={
              'candidate_only':True,
              'cycle_receipt_written':False,
              'ninth_lease_authorized':False,
              'outside_human_dependency':False,
              'product_merged':False,
              'product_published':False,
              'repository_ref_created':False,
              'waterline_event_written':False,
          }

          manifest=json.loads((root/'candidate-file-manifest.json').read_text())
          rows=manifest['files']
          paths=(root/'expected-product-paths.txt').read_text().splitlines()
          assert manifest['count']==len(rows)==len(paths)==40
          assert paths==sorted(paths) and len(set(paths))==40
          assert [row['path'] for row in rows]==paths
          assert all(set(row)=={'path','bytes','sha256','git_blob'} for row in rows)

          raw=subprocess.check_output(['git','ls-tree','-rz','--full-tree',os.environ['CANDIDATE_COMMIT']])
          tree={}
          for record in raw.split(b'\0'):
              if not record:
                  continue
              meta,name=record.split(b'\t',1)
              mode,kind,obj=meta.decode().split()
              path=name.decode()
              if path in paths:
                  assert kind=='blob'
                  tree[path]=(mode,obj)
          assert set(tree)==set(paths)
          enriched=[]
          for row in rows:
              mode,obj=tree[row['path']]
              assert obj==row['git_blob']
              enriched.append({**row,'git_mode':mode})

          with tarfile.open(root/'candidate-product.tar.gz','r:gz') as tf:
              members=tf.getmembers()
              assert [member.name for member in members]==paths
              for member,row in zip(members,enriched):
                  path=pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert member.isfile() and not member.issym() and not member.islnk()
                  data=tf.extractfile(member).read()
                  assert len(data)==row['bytes']
                  assert hashlib.sha256(data).hexdigest()==row['sha256']
                  assert (member.mode&0o7777)==(int(row['git_mode'],8)&0o7777)
          assert any(row['path']=='images/uc-1353-still.jpg' and row['bytes']==67113 and row['sha256']==os.environ['STILL_SHA256'] for row in enriched)

          for name in ('candidate.patch','candidate-product.tar.gz','expected-product-paths.txt'):
              target='candidate-paths.txt' if name=='expected-product-paths.txt' else name
              (packet/target).write_bytes((root/name).read_bytes())
          (packet/'candidate-files.json').write_text(json.dumps(enriched,indent=2,sort_keys=True)+'\n')
          compatibility={
              'status':'qualified-candidate',
              'base_main':os.environ['EXACT_BASE'],
              'candidate_commit':os.environ['CANDIDATE_COMMIT'],
              'candidate_tree':os.environ['CANDIDATE_TREE'],
              'path_count':40,
              'task':os.environ['TASK_ID'],
              'lease':os.environ['LEASE_ID'],
              'wall_id':os.environ['WALL_ID'],
              'performer':'Dan Starkey',
              'role':'Kreg',
              'performance_mode':'voice',
              'source_transaction':'DOCTOR-WHO-CYCLE-008-KREG-RECOVERED-CANDIDATE-V1',
              'source_receipt_identity':os.environ['CANDIDATE_RECEIPT_IDENTITY'],
              'source_run':int(os.environ['SOURCE_RUN']),
              'source_job':int(os.environ['SOURCE_JOB']),
              'source_artifact':int(os.environ['SOURCE_ARTIFACT']),
              'source_artifact_digest':'sha256:'+os.environ['SOURCE_ARTIFACT_DIGEST'],
              'repository_write':False,
              'merge_authority':False,
              'cycle_009_authorized':False,
              'outside_human_dependency':False,
          }
          canonical=json.dumps(compatibility,sort_keys=True,separators=(',',':')).encode()
          compatibility['identity']=hashlib.sha256(canonical).hexdigest()
          (packet/'qualification-receipt.json').write_text(json.dumps(compatibility,indent=2,sort_keys=True)+'\n')
          PY

      - name: Seal exact V7b bundle and checksum contract
        shell: bash
        run: |
          set -euo pipefail
          packet="$OUT/packet"
          compat_ref=refs/heads/cycle008-kreg-candidate-v7b
          git update-ref -d "$compat_ref" >/dev/null 2>&1 || true
          git update-ref "$compat_ref" "$CANDIDATE_COMMIT"
          git bundle create "$packet/candidate.bundle" "$compat_ref" ^"$EXACT_BASE"
          git bundle verify "$packet/candidate.bundle" > "$OUT/diagnostics/compatibility-bundle-verify.txt"
          test "$(git bundle list-heads "$packet/candidate.bundle" | awk '{print $1}')" = "$CANDIDATE_COMMIT"
          test "$(git bundle list-heads "$packet/candidate.bundle" | awk '{print $2}')" = "$compat_ref"
          git update-ref -d "$compat_ref"
          git update-ref -d refs/heads/cycle008-kreg-native

          find "$packet" -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$packet/SHA256SUMS.pre"
          sha256sum "$packet/SHA256SUMS.pre" > "$packet/SHA256SUMS"
          PACKET="$packet" python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path
          root=Path(os.environ['PACKET'])
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest,original=line.split(None,1)
              rel=original.split('/packet/',1)[-1]
              path=root/rel
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          assert hashlib.sha256((root/'SHA256SUMS.pre').read_bytes()).hexdigest()==(root/'SHA256SUMS').read_text().split()[0]
          receipt=json.loads((root/'qualification-receipt.json').read_text())
          identity=receipt.pop('identity')
          assert hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          rows=json.loads((root/'candidate-files.json').read_text())
          paths=(root/'candidate-paths.txt').read_text().splitlines()
          assert [row['path'] for row in rows]==paths and len(rows)==40
          with tarfile.open(root/'candidate-product.tar.gz','r:gz') as tf:
              members=tf.getmembers()
              assert [member.name for member in members]==paths
              for member,row in zip(members,rows):
                  data=tf.extractfile(member).read()
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
                  assert (member.mode&0o7777)==(int(row['git_mode'],8)&0o7777)
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_BASE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          rm -rf "$OUT/source"

      - name: Upload immutable recovered Kreg candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-recovered-candidate-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-recovered-candidate-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain sealing diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-recovered-candidate-v1-seal-failure-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-recovered-candidate-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
