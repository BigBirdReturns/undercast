name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      INSTALLED_MAIN: 120a81e988c045695b55089afe5f8e3d82012f8d
      PREFIX: agent/doctor-who-cycle-011-rastel-
      WRITER_V1: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-011-rastel-cleanup-writer-v3.yml
      ORIGINAL_SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2.yml
      SELF: .github/workflows/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair.yml
      BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2
      INSTALLER_PR: "852"
      INSTALLER_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-writer-v3-install-v1
      INSTALLER_HEAD: 120a81e988c045695b55089afe5f8e3d82012f8d
      SCHEMA_FIX_PR: "853"
      SCHEMA_FIX_BRANCH: agent/doctor-who-cycle-011-rastel-cleanup-writer-list-schema-fix-v1
      SCHEMA_FIX_HEAD: b818d712077a55e2db605f26d3ae51995d54cc53
      FIRST_VERIFIER_RUN: "31359341972"
      FIRST_VERIFIER_JOB: "93364952265"
      FIRST_VERIFIER_ARTIFACT: "9051764282"
      FIRST_VERIFIER_SHA256: 5a2d8489486c954840327e9f9d8b9fe6c69b2a051571bcf08e7c4c57a9d6ba69
      PRIOR_AUTH_ARTIFACT: "9051464025"
      PRIOR_AUTH_SHA256: 3fd203856202cc4cab4df9781728b9c0bb86b1345b6b6e41979b89a7aebe9d58
      PRIOR_AUTH_IDENTITY: 2d75c2bd70c17bc2444cc64b092766655bd9121d8ca1f6226cb28e087e067ba8
      FAILED_WRITER_RUN: "31358495084"
      FAILED_WRITER_JOB: "93362553005"
      FAILED_WRITER_ARTIFACT: "9051469595"
      FAILED_WRITER_SHA256: cf670d236e6186453c5fc64383ded700271354960216663d8a8a5a9a1ad8d0bb
      OBSERVER_PR: "851"
      OBSERVER_BRANCH: observer/doctor-who-cycle-011-rastel-cleanup-resume-v2
      OBSERVER_HEAD: 497c9edaf17363eac78e2875169baa436fbdb83f
      OBSERVER_RUN: "31358795145"
      OBSERVER_JOB: "93363387594"
      OBSERVER_ARTIFACT: "9051573930"
      OBSERVER_SHA256: f53da84fa2275de5329f07a4c851aa7a203481b6d954ee132915070e6fcfa374
      OBSERVER_IDENTITY: ed5eb2d2d516f48f74f12dff2e1446006ff1ca41ddeca449b0195991c017f706
      OUT: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact two-commit repaired verifier carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,receipt,logs}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$base" = "$INSTALLED_MAIN"
          test "$(git merge-base "$INSTALLED_MAIN" HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 2
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          git diff --name-status "$INSTALLED_MAIN"...HEAD | LC_ALL=C sort > "$OUT/logs/carrier.tsv"
          printf 'A\t%s\nA\t%s\n' "$ORIGINAL_SELF" "$SELF" | LC_ALL=C sort > "$OUT/logs/expected-carrier.tsv"
          cmp "$OUT/logs/carrier.tsv" "$OUT/logs/expected-carrier.tsv"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$OUT/api/own-jobs.json"
          CURRENT_PR="$pr" CURRENT_HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          own = json.loads((root / 'own-pr.json').read_text())
          jobs = json.loads((root / 'own-jobs.json').read_text())['jobs']
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged_at'] is None
          assert own['base']['sha'] == os.environ['INSTALLED_MAIN']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 2 and own['changed_files'] == 2
          matches = [row for row in jobs if row['name'] == 'verify']
          assert len(matches) == 1
          (root / 'own-job.txt').write_text(str(matches[0]['id']) + '\n')
          PY
          printf 'CURRENT_PR=%s\nCURRENT_HEAD=%s\nCURRENT_JOB=%s\n' "$pr" "$head" "$(cat "$OUT/api/own-job.txt")" >> "$GITHUB_ENV"

      - name: Authenticate the failed first verifier and its paid evidence chain
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FIRST_VERIFIER_RUN" > "$OUT/api/first-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FIRST_VERIFIER_RUN/jobs?per_page=100" > "$OUT/api/first-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FIRST_VERIFIER_ARTIFACT" > "$OUT/api/first-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FIRST_VERIFIER_ARTIFACT/zip" > "$OUT/source/first.zip"
          test "$(sha256sum "$OUT/source/first.zip" | awk '{print $1}')" = "$FIRST_VERIFIER_SHA256"
          test "$(jq -r '.digest' "$OUT/api/first-artifact.json")" = "sha256:$FIRST_VERIFIER_SHA256"
          ZIP="$OUT/source/first.zip" TARGET="$OUT/source/extracted" python3 - <<'PY'
          import hashlib, json, os, stat, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['OUT'])
          api = root / 'api'
          target = Path(os.environ['TARGET'])
          target.mkdir(parents=True, exist_ok=True)
          sha = lambda data: hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(os.environ['ZIP']) as archive:
              infos = archive.infolist()
              assert infos and len(infos) == len({row.filename for row in infos})
              for info in infos:
                  path = PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode)
                  if info.is_dir():
                      continue
                  out = target / path
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          run = json.loads((api / 'first-run.json').read_text())
          jobs = json.loads((api / 'first-jobs.json').read_text())['jobs']
          artifact = json.loads((api / 'first-artifact.json').read_text())
          assert run['id'] == int(os.environ['FIRST_VERIFIER_RUN'])
          assert run['head_branch'] == os.environ['BRANCH']
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          rows = [row for row in jobs if row['id'] == int(os.environ['FIRST_VERIFIER_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'verify' and rows[0]['conclusion'] == 'failure'
          steps = {row['name']: row['conclusion'] for row in rows[0].get('steps', [])}
          assert steps['Bind exact verifier carrier and installed three-writer topology'] == 'success'
          assert steps['Authenticate prior authorization, failed V2 writer, and independent observation'] == 'success'
          assert steps['Freeze exact live ref and pull-request denominator'] == 'failure'
          assert artifact['id'] == int(os.environ['FIRST_VERIFIER_ARTIFACT'])
          assert artifact['digest'] == 'sha256:' + os.environ['FIRST_VERIFIER_SHA256']
          prior = json.loads((target / 'receipt/prior-authorization.json').read_text())
          prior_identity = prior.pop('identity')
          assert prior_identity == os.environ['PRIOR_AUTH_IDENTITY']
          assert sha(json.dumps(prior, sort_keys=True, separators=(',', ':')).encode()) == prior_identity
          prior['identity'] = prior_identity
          assert prior['status'] == 'cycle-011-rastel-cleanup-resume-authorized-v1'
          assert prior['counts']['current_prefix_refs'] == 90 and len(prior['refs']) == 90
          observation = json.loads((target / 'receipt/observation.json').read_text())
          observation_identity = observation.pop('identity')
          assert observation_identity == os.environ['OBSERVER_IDENTITY']
          assert sha(json.dumps(observation, sort_keys=True, separators=(',', ':')).encode()) == observation_identity
          observation['identity'] = observation_identity
          assert observation['status'] == 'cycle-011-rastel-cleanup-resume-writer-failure-observed-v2'
          assert observation['live']['prefix_ref_count'] == 90
          failed_run = json.loads((target / 'api/failed-run.json').read_text())
          failed_jobs = json.loads((target / 'api/failed-jobs.json').read_text())['jobs']
          failed_artifact = json.loads((target / 'api/failed-artifact.json').read_text())
          assert failed_run['id'] == int(os.environ['FAILED_WRITER_RUN']) and failed_run['conclusion'] == 'failure'
          rows = [row for row in failed_jobs if row['id'] == int(os.environ['FAILED_WRITER_JOB'])]
          assert len(rows) == 1 and rows[0]['conclusion'] == 'failure'
          assert failed_artifact['id'] == int(os.environ['FAILED_WRITER_ARTIFACT'])
          assert failed_artifact['digest'] == 'sha256:' + os.environ['FAILED_WRITER_SHA256']
          assert "KeyError: 'merged'" in (target / 'failed/writer.log').read_text(errors='replace')
          (root / 'receipt/prior-authorization.json').write_text(json.dumps(prior, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/observation.json').write_text(json.dumps(observation, indent=2, sort_keys=True) + '\n')
          PY

      - name: Freeze exact 93-ref live denominator and six pull requests
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/current-prefix-refs.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$OBSERVER_BRANCH" > "$OUT/api/observer-ref.json"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['OUT'])
          prior = json.loads((root / 'receipt/prior-authorization.json').read_text())
          current_raw = json.loads((root / 'api/current-prefix-refs.json').read_text())
          current = [{'branch': row['ref'].removeprefix('refs/heads/'), 'head': row['object']['sha']} for row in current_raw]
          expected = {(row['branch'], row['head']) for row in prior['refs']}
          expected.add((os.environ['INSTALLER_BRANCH'], os.environ['INSTALLER_HEAD']))
          expected.add((os.environ['SCHEMA_FIX_BRANCH'], os.environ['SCHEMA_FIX_HEAD']))
          expected.add((os.environ['BRANCH'], os.environ['CURRENT_HEAD']))
          observed = {(row['branch'], row['head']) for row in current}
          assert observed == expected, {'extra': sorted(observed - expected), 'missing': sorted(expected - observed)}
          assert len(current) == 93
          def api_json(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          pull_rows = []
          for frozen in prior['pull_requests']:
              row = api_json(f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{frozen['pr']}")
              assert row['head']['ref'] == frozen['branch'] and row['head']['sha'] == frozen['head']
              assert row['merged_at'] is None
              pull_rows.append(dict(frozen))
          for number, branch, head in [
              (int(os.environ['INSTALLER_PR']), os.environ['INSTALLER_BRANCH'], os.environ['INSTALLER_HEAD']),
              (int(os.environ['SCHEMA_FIX_PR']), os.environ['SCHEMA_FIX_BRANCH'], os.environ['SCHEMA_FIX_HEAD']),
              (int(os.environ['CURRENT_PR']), os.environ['BRANCH'], os.environ['CURRENT_HEAD']),
              (int(os.environ['OBSERVER_PR']), os.environ['OBSERVER_BRANCH'], os.environ['OBSERVER_HEAD']),
          ]:
              row = api_json(f"/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{number}")
              assert row['head']['ref'] == branch and row['head']['sha'] == head
              action = 'close_without_merge' if row['state'] == 'open' and row['merged_at'] is None else 'none'
              pull_rows.append({'pr': number, 'branch': branch, 'head': head, 'action': action})
          assert len(pull_rows) == 6 and len({row['pr'] for row in pull_rows}) == 6
          observer_ref = json.loads((root / 'api/observer-ref.json').read_text())
          assert observer_ref['object']['sha'] == os.environ['OBSERVER_HEAD']
          auxiliary = list(prior['auxiliary_refs']) + [{'branch': os.environ['OBSERVER_BRANCH'], 'head': os.environ['OBSERVER_HEAD']}]
          authorization = {
              'status': 'cycle-011-rastel-cleanup-resume-authorized-v2',
              'version': 2,
              'source': {'pr': int(os.environ['CURRENT_PR']), 'head': os.environ['CURRENT_HEAD'], 'run': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'job': int(os.environ['CURRENT_JOB'])},
              'canonical': {'proved_commit': os.environ['CANONICAL_MAIN'], 'tree': os.environ['CANONICAL_TREE'], 'installed_main': os.environ['INSTALLED_MAIN'], 'writer_paths': [os.environ['WRITER_V1'], os.environ['WRITER_V2'], os.environ['WRITER_V3']]},
              'evidence': {
                  'prior_authorization': {'artifact': int(os.environ['PRIOR_AUTH_ARTIFACT']), 'artifact_sha256': os.environ['PRIOR_AUTH_SHA256'], 'identity': os.environ['PRIOR_AUTH_IDENTITY']},
                  'failed_writer': {'run': int(os.environ['FAILED_WRITER_RUN']), 'job': int(os.environ['FAILED_WRITER_JOB']), 'artifact': int(os.environ['FAILED_WRITER_ARTIFACT']), 'artifact_sha256': os.environ['FAILED_WRITER_SHA256'], 'failure': "KeyError: 'merged'", 'mutation_started': False},
                  'observer': {'pr': int(os.environ['OBSERVER_PR']), 'head': os.environ['OBSERVER_HEAD'], 'run': int(os.environ['OBSERVER_RUN']), 'job': int(os.environ['OBSERVER_JOB']), 'artifact': int(os.environ['OBSERVER_ARTIFACT']), 'artifact_sha256': os.environ['OBSERVER_SHA256'], 'identity': os.environ['OBSERVER_IDENTITY'], 'status': 'cycle-011-rastel-cleanup-resume-writer-failure-observed-v2'},
              },
              'prefix': os.environ['PREFIX'],
              'refs': sorted(current, key=lambda row: row['branch']),
              'auxiliary_refs': sorted(auxiliary, key=lambda row: row['branch']),
              'pull_requests': sorted(pull_rows, key=lambda row: row['pr']),
              'counts': {'current_prefix_refs': len(current), 'auxiliary_refs': len(auxiliary), 'pull_requests_total': len(pull_rows), 'pull_requests_to_close': sum(row['action'] == 'close_without_merge' for row in pull_rows)},
              'boundary': {'cycle_012_lease_issued': False, 'cycle_012_product_authority': False, 'exact_heads_frozen': True, 'force_update': False, 'main_mutation': False, 'merge': False, 'outside_human_dependency': False, 'owner_physical_action_required': False},
          }
          authorization['identity'] = hashlib.sha256(json.dumps(authorization, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/authorization.json').write_text(json.dumps(authorization, indent=2, sort_keys=True) + '\n')
          (root / 'receipt/AUTHORIZATION_COMPLETE').write_text(authorization['identity'] + '\n')
          PY
          find "$OUT/receipt" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/receipt/$rel" | sed "s#  $OUT/receipt/#  #"; done > "$OUT/receipt/SHA256SUMS.pre"
          sha256sum "$OUT/receipt/SHA256SUMS.pre" | sed "s#  $OUT/receipt/#  #" > "$OUT/receipt/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-authorization-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-cleanup-resume-verifier-v2-repair
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
