name: qualify-clifford-number-hr-indemnity-cost-transfer-wave-13

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cnhr-wave13-focused-qualification
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-indemnity-cost-transfer-wave-13'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clifford-number-hr-indemnity-cost-transfer-wave-13
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/review/clifford-number/hr-discipline/wave-13
            docs/research/clifford-number/hr-discipline/WAVE-13.md
            schema/clifford-number-hr-cost-transfer-lane.schema.json
            scripts/clifford-number-hr-cost-transfer.mjs
            test/clifford-number-hr-cost-transfer-fixtures.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact Wave 13 packet
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/cnhr-wave13-root
          rm -rf "$root"
          mkdir -p "$root"

          python - <<'PY'
          import json, shutil
          from pathlib import Path

          manifest_rel = 'data/review/clifford-number/hr-discipline/wave-13/MANIFEST.json'
          packet_root = Path('/tmp/cnhr-wave13-root')
          manifest = json.loads(Path(manifest_rel).read_text())
          paths = {row['path'] for row in manifest['files']} | {manifest_rel}
          assert len(paths) == 22, len(paths)
          for rel in sorted(paths):
              src = Path(rel)
              assert src.is_file(), rel
              dst = packet_root / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
          print('isolated exact packet: 22 files')
          PY

          cd "$root"
          node --check scripts/clifford-number-hr-cost-transfer.mjs
          node --check test/clifford-number-hr-cost-transfer-fixtures.mjs
          node scripts/clifford-number-hr-cost-transfer.mjs --check --strict-root
          node test/clifford-number-hr-cost-transfer-fixtures.mjs
