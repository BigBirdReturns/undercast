name: queen-helper-recover-v2

on:
  push:
    branches:
      - agent/queen-helper-recover-v2

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RESULT_BRANCH: agent/queen-helper-recover-result-v2
      ROOT: transport/queen-helper-recover-v2
      EXPECTED_SHA: 2bd41195123bfe860f01b1201cbf52a349e6f40231f97047c481e7fddcc36f65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and inspect emitted helper bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/queen-helper-recover-v2
          mkdir -p /tmp/queen-helper-recover-v2
          git fetch --filter=blob:none --no-tags origin agent/star-trek-queen-hearts-cycle-v1
          git show origin/agent/star-trek-queen-hearts-cycle-v1:.github/recovery/star-trek-queen-hearts-cycle-v1/cycle.mjs.gz.b64 > /tmp/queen-old.b64
          base64 -d /tmp/queen-old.b64 > /tmp/queen-old.gz
          set +e
          gzip -dc /tmp/queen-old.gz > /tmp/queen-old.mjs 2> /tmp/queen-helper-recover-v2/gzip.stderr.log
          gzip_code=$?
          set -e
          sha="$(sha256sum /tmp/queen-old.mjs | cut -d' ' -f1)"
          set +e
          node --check /tmp/queen-old.mjs > /tmp/queen-helper-recover-v2/node.stdout.log 2> /tmp/queen-helper-recover-v2/node.stderr.log
          node_code=$?
          set -e
          grep -F 'ap_a2fc2c7b0d3dec8a244ef048' /tmp/queen-old.mjs > /tmp/queen-helper-recover-v2/task-lines.txt || true
          grep -F 'STAR-TREK-QUEEN-OF-HEARTS' /tmp/queen-old.mjs > /tmp/queen-helper-recover-v2/transaction-lines.txt || true
          cp /tmp/queen-old.mjs /tmp/queen-helper-recover-v2/recovered-helper.mjs
          jq -n \
            --arg sha "$sha" \
            --arg expected "$EXPECTED_SHA" \
            --argjson gzip_exit "$gzip_code" \
            --argjson node_exit "$node_code" \
            --argjson compressed_bytes "$(stat -c %s /tmp/queen-old.gz)" \
            --argjson emitted_bytes "$(stat -c %s /tmp/queen-old.mjs)" \
            --argjson task_lines "$(wc -l < /tmp/queen-helper-recover-v2/task-lines.txt | tr -d ' ')" \
            --argjson transaction_lines "$(wc -l < /tmp/queen-helper-recover-v2/transaction-lines.txt | tr -d ' ')" \
            '{version:2,transaction:"QUEEN-HELPER-RECOVER-V2",sha256:$sha,expected_sha256:$expected,byte_identical:($sha==$expected),gzip_exit:$gzip_exit,node_exit:$node_exit,syntax_valid:($node_exit==0),compressed_bytes:$compressed_bytes,emitted_bytes:$emitted_bytes,task_lines:$task_lines,transaction_lines:$transaction_lines}' \
            > /tmp/queen-helper-recover-v2/result.json
          git config user.name undercast-queen-helper-recover
          git config user.email queen-helper-recover@users.noreply.github.com
          git switch --orphan recovery-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/queen-helper-recover-v2/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'Recover Queen of Hearts helper output'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
