name: card-backfill-align-local-desk-law

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-align-local-desk-law.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  align-prove-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      MUTATION_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Align every active constitutional surface to the local production lane
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-align-local-desk-law.mjs
          node --check scripts/card-backfill-local-desk-law-fixtures.mjs
          node scripts/card-backfill-align-local-desk-law.mjs

      - name: Prove active law, inherited rigor, and the plan-safe runtime boundary
        run: |
          set -euo pipefail
          node scripts/card-backfill-local-desk-law-fixtures.mjs
          node scripts/card-backfill-amortization-fixtures.mjs
          node scripts/card-backfill-lessons-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate --out "$RUNNER_TEMP/local-desk-law-lessons.json"
          git diff --check
          echo 'PASS — active law names one supervisor, one local desk, and one amortized reducer before source transport'

      - name: Retire the temporary aligner and commit one exact law transaction
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/card-backfill-align-local-desk-law.yml \
            scripts/card-backfill-align-local-desk-law.mjs
          git add -- \
            .github/CARD-BACKFILL-LESSONS.json \
            .github/CARD-BACKFILL-COHORT.json \
            .github/CARD-BACKFILL-AMORTIZATION.json \
            .github/workflows/card-backfill-amortized-wave.yml \
            docs/CARD-BACKFILL-AMORTIZATION.md \
            docs/CARD-BACKFILL-AUTONOMOUS.md \
            docs/CARD-BACKFILL-COHORTS.md \
            package.json \
            scripts/card-backfill-amortization-fixtures.mjs \
            scripts/card-backfill-local-desk-law-fixtures.mjs
          git diff --cached --check
          git config user.name 'undercast-card-backfill-law-aligner'
          git config user.email 'undercast-card-backfill-law-aligner@users.noreply.github.com'
          git commit -m 'Card backfill: align local desk law and active workflow'
          remote_head=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          if [ "$remote_head" != "$MUTATION_HEAD" ]; then
            echo "branch moved from law-alignment head $MUTATION_HEAD to $remote_head; refusing stale push"
            exit 1
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Yield the aligned branch to the sole supervisor
        run: |
          set -euo pipefail
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f reason=local-desk-law-aligned
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_HEAD}" \
            -f state=success \
            -f context='card-backfill/local-desk-law-alignment' \
            -f description='active law, runtime, reducer, docs, and supervisor aligned' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-local-desk-law-alignment-${{ github.run_id }}
          path: ${{ runner.temp }}/local-desk-law-lessons.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish observable alignment failure
        if: failure()
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${MUTATION_HEAD}" \
            -f state=failure \
            -f context='card-backfill/local-desk-law-alignment' \
            -f description="run ${GITHUB_RUN_ID}: active-law alignment failed before successor transport" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
