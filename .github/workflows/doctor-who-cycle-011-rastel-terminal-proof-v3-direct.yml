name: doctor-who-cycle-011-rastel-terminal-proof-v3-direct

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v3-direct.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-terminal-proof-v3-direct
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-terminal-proof-v3-direct'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BOOT: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct-bootstrap
      OUT: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct
      SOURCE_PR: "833"
      SOURCE_HEAD: 0f338f6df2de2aa1c5cd76969d276f7b6c7460fc
      SOURCE_RUN: "31352201198"
      SOURCE_JOB: "93344994608"
      SOURCE_ARTIFACT: "9049337165"
      SOURCE_ARTIFACT_DIGEST: "sha256:52abb07a70e253d42048a91e0a50a1458630c2cca2fa196a4471b7d8d919c40f"
      SOURCE_WORKFLOW_PATH: .github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v2-direct.yml
      SOURCE_WORKFLOW_BLOB: 884459ce8b3f4478c4e219aac1aad19853233382
      SCRIPT_BLOBS: af13b777271e7615d022d4c09aeaf86bb51e03e2 9404f0b050b60b19c85e2df877088cc4958afd7a ae070f426f006983f94a6fe5a23332188b60f008
      CHUNK_BYTES: "3000 3000 2748"
      CHUNK_SHA256: 1dbf384ab3580ea2f068b2567f3f7d546fa456ed7ddda2df0ddf3702202c20c7 999f0fb8ce31c107968901e8d922a2bbe8b7861e2dd9fb42e183fa273eec9974 4d407559bc455e6a75e78c23b5ac36dcff37e2aabb287751b57ddce85cfda0e7
      SOURCE_B64_BYTES: "8748"
      SOURCE_B64_SHA256: 861d12cf1066646be2499a0566197a4aa636815a9915c0f70a2c3929675ce23b
      SOURCE_GZIP_BYTES: "6560"
      SOURCE_GZIP_SHA256: 5b53b27c6b064241e2dac4a9a1b09e378b3c8e5b940aa8745e18e7e6a63cebb8
      SOURCE_SCRIPT_BYTES: "20842"
      SOURCE_SCRIPT_SHA256: 9d9326a4d30e4c762811557b2c77edaa054f49f06022052f7f667cbcb766f517
      REPAIRED_SCRIPT_BYTES: "20836"
      REPAIRED_SCRIPT_SHA256: 8fb78de98d0c39331d26fffb92e7295a0493a80850ddc9fc3e10fb605d766914
      REPAIR_PATCH_BYTES: "2608"
      REPAIR_PATCH_SHA256: 77c34a04787f64868fa364c7b392f5186a6dc13d4536209836f212d07547bb67

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V2 quote failure and reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOT" "$OUT"
          mkdir -p "$BOOT"/{api,chunks,repair}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test -z "$(git rev-list --merges "$base"..HEAD)"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v3-direct.yml'
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$BOOT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > "$BOOT/api/source-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$BOOT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > "$BOOT/api/source-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$BOOT/api/source-artifact.json"
          git show "$SOURCE_HEAD:$SOURCE_WORKFLOW_PATH" > "$BOOT/source-workflow.yml"
          test "$(git hash-object "$BOOT/source-workflow.yml")" = "$SOURCE_WORKFLOW_BLOB"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['BOOT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          own=load('carrier-pr.json'); source=load('source-pr.json'); run=load('source-run.json'); job=load('source-job.json'); artifact=load('source-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_BASE'] and own['head']['ref']=='agent/doctor-who-cycle-011-rastel-terminal-proof-v3-direct' and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert source['number']==int(os.environ['SOURCE_PR']) and source['head']['sha']==os.environ['SOURCE_HEAD'] and source['head']['ref']=='agent/doctor-who-cycle-011-rastel-terminal-proof-v2-direct'
          assert source['base']['sha']==os.environ['CURRENT_BASE'] and source['draft'] is True and source['merged'] is False
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-011-rastel-terminal-proof-v2-direct' and run['head_sha']==os.environ['SOURCE_HEAD']
          assert run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          assert job['id']==int(os.environ['SOURCE_JOB']) and job['run_id']==int(os.environ['SOURCE_RUN']) and job['name']=='prove' and job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Reconstruct exact terminal-proof program and execute']==('completed','failure')
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          PY
          : > "$BOOT/proof-v2.sh.gz.b64"
          read -r -a blobs <<< "$SCRIPT_BLOBS"
          read -r -a sizes <<< "$CHUNK_BYTES"
          read -r -a hashes <<< "$CHUNK_SHA256"
          test "${#blobs[@]}" = 3
          test "${#sizes[@]}" = 3
          test "${#hashes[@]}" = 3
          test "$(printf '%s\n' "${blobs[@]}" | sort -u | wc -l | tr -d ' ')" = 3
          for index in 0 1 2; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/${blobs[$index]}" --jq '.content' | tr -d '\n' | base64 -d > "$BOOT/chunks/$index"
            test "$(wc -c < "$BOOT/chunks/$index" | tr -d ' ')" = "${sizes[$index]}"
            test "$(sha256sum "$BOOT/chunks/$index" | awk '{print $1}')" = "${hashes[$index]}"
            cat "$BOOT/chunks/$index" >> "$BOOT/proof-v2.sh.gz.b64"
          done
          test "$(wc -c < "$BOOT/proof-v2.sh.gz.b64" | tr -d ' ')" = "$SOURCE_B64_BYTES"
          test "$(sha256sum "$BOOT/proof-v2.sh.gz.b64" | awk '{print $1}')" = "$SOURCE_B64_SHA256"
          base64 -d "$BOOT/proof-v2.sh.gz.b64" > "$BOOT/proof-v2.sh.gz"
          test "$(wc -c < "$BOOT/proof-v2.sh.gz" | tr -d ' ')" = "$SOURCE_GZIP_BYTES"
          test "$(sha256sum "$BOOT/proof-v2.sh.gz" | awk '{print $1}')" = "$SOURCE_GZIP_SHA256"
          gzip -dc "$BOOT/proof-v2.sh.gz" > "$BOOT/proof-v2.sh"
          test "$(wc -c < "$BOOT/proof-v2.sh" | tr -d ' ')" = "$SOURCE_SCRIPT_BYTES"
          test "$(sha256sum "$BOOT/proof-v2.sh" | awk '{print $1}')" = "$SOURCE_SCRIPT_SHA256"

      - name: Apply exact shell-quote repair and execute unchanged proof
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$BOOT/proof-v2.sh" TARGET="$BOOT/proof-v3.sh" PATCH="$BOOT/repair/proof-v2-to-v3.patch" python3 - <<'PY'
          import difflib,hashlib,json,os,re,subprocess
          from pathlib import Path
          source=Path(os.environ['SOURCE']); target=Path(os.environ['TARGET']); patch_path=Path(os.environ['PATCH'])
          original=source.read_text(); text=original; rows=[]
          def replace_exact(name,old,new,count):
              global text
              observed=text.count(old)
              assert observed==count,(name,observed,count)
              text=text.replace(old,new)
              rows.append({'name':name,'occurrences':observed,'old_sha256':hashlib.sha256(old.encode()).hexdigest(),'new_sha256':hashlib.sha256(new.encode()).hexdigest()})
          replace_exact('branch-rebind','agent/doctor-who-cycle-011-rastel-terminal-proof-v2-direct','agent/doctor-who-cycle-011-rastel-terminal-proof-v3-direct',1)
          replace_exact('workflow-path-rebind','.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v2-direct.yml','.github/workflows/doctor-who-cycle-011-rastel-terminal-proof-v3-direct.yml',1)
          replace_exact('output-root-rebind','/tmp/doctor-who-cycle-011-rastel-terminal-proof-v2-direct','/tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct',1)
          replace_exact('awk-literal-quote-repair','\\"D\\"','"D"',3)
          target.write_text(text)
          patch=''.join(difflib.unified_diff(original.splitlines(True),text.splitlines(True),fromfile='proof-v2.sh',tofile='proof-v3.sh'))
          patch_path.write_text(patch)
          data=target.read_bytes(); patch_data=patch_path.read_bytes()
          assert len(data)==int(os.environ['REPAIRED_SCRIPT_BYTES']) and hashlib.sha256(data).hexdigest()==os.environ['REPAIRED_SCRIPT_SHA256']
          assert len(patch_data)==int(os.environ['REPAIR_PATCH_BYTES']) and hashlib.sha256(patch_data).hexdigest()==os.environ['REPAIR_PATCH_SHA256']
          assert text.count('\\"D\\"')==0 and text.count('$1=="D"')==3
          subprocess.run(['bash','-n',str(target)],check=True)
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-011-terminal-proof-v3-{index}>','exec')
          receipt={'status':'cycle-011-rastel-terminal-proof-v3-shell-quote-repair-qualified','version':3,'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'script_bytes':int(os.environ['SOURCE_SCRIPT_BYTES']),'script_sha256':os.environ['SOURCE_SCRIPT_SHA256']},'repaired':{'script_bytes':len(data),'script_sha256':hashlib.sha256(data).hexdigest(),'patch_bytes':len(patch_data),'patch_sha256':hashlib.sha256(patch_data).hexdigest(),'changes':rows},'boundary':{'proof_predicate_changed':False,'product_byte_changed':False,'receipt_authority_changed':False,'gate_changed':False,'repository_write':False,'canonical_mutation':False,'cycle_012_lease_issued':False}}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(os.environ['BOOT'],'repair','receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod 700 "$BOOT/proof-v3.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$BOOT/proof-v3.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-terminal-proof-v3-direct-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-terminal-proof-v3-direct-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct
            /tmp/doctor-who-cycle-011-rastel-terminal-proof-v3-direct-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
