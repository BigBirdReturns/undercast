name: card-backfill-uc-088-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-088-APPLY.json"
      - "scripts/card-backfill-uc-088-apply.mjs"
      - ".github/workflows/card-backfill-uc-088-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-088-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-021'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-021
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Thing packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-088-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-088');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-088');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0203aa7a6b845505e9c2c887');
          if(row.version!==1||row.record_id!=='UC-088'||row.actor!=='Michael Chiklis'||row.character!=='The Thing'||row.production!=='Fantastic Four'||row.year!==2005||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-088 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8672213650||row.render_artifact?.head_sha!=='4e54f469cff6a13987dfe7fe4793bd06798f2cf7')throw new Error('UC-088 render custody drift');
          if(row.expected?.selected_source_sha256!=='3c11e621220621aecc6b515e31b78384300270ed58593f837ae06559f8901bd4'||row.expected?.exact_role_record_sha256!=='bb7b86bf549e0d1090fb5deb7ab79daa8d04b4b5be1f5e45c8bb2b5138870e47')throw new Error('UC-088 source authorization drift');
          if(row.expected?.candidate_sha256!=='f08b8b1e759cd1e052272ea6c18e2965698f91d3262d111c0dff40e4b3b2aa81'||row.expected?.crop_preview_sha256!=='312560ca1e040c63d202fb000bcdf38d38c49d68c1a017e44da76f55012832d5')throw new Error('UC-088 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==13||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-088 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-single-role-center-crop'||row.ruling?.canonical_mutation!==false)throw new Error('UC-088 ruling drift');
          if(!specimen||specimen.character!=='The Thing'||specimen.production!=='Fantastic Four'||specimen.years!=='2005'||specimen.still)throw new Error('UC-088 specimen boundary drift');
          if(source?.still)throw new Error('UC-088 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-088'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-088 audit boundary drift');
          console.log(`PASS — UC-088 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-088-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8672213650/zip" > "$root/render.zip"
          echo "8ec2c80b48a7e6ad9f1a173f4cfc95f6fc5cff26a4ecaf36a0ed5d12341a27ca  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/card-backfill-uc-088-render/output/UC-088"
          test -f "$base/manifest.json"
          echo "d21cbe053b840bce6c24afd52adc9eb3fd981c05ccde2281bb493fd031c8e116  $base/manifest.json" | sha256sum -c -
          echo "5972b08e4d65ff9a34b56693bd12eb0ae4994f9e357421a2f9e883330437f3d9  $base/duplicate-scan.json" | sha256sum -c -
          echo "f12cf9fc1523401a0b342e43fe3eed0494c45da78ff545beeef1090097c9c7d1  $base/review.json" | sha256sum -c -
          echo "a3207431032172e92e182186688de4708ac2ad21e7de2b0b0c56dc2d0501fbc8  $base/review.md" | sha256sum -c -
          echo "14c136be0c2dee681092702ff4e486bd7cf39d908ab74105307bd67e1a923950  $base/SHA256SUMS" | sha256sum -c -
          echo "bb7b86bf549e0d1090fb5deb7ab79daa8d04b4b5be1f5e45c8bb2b5138870e47  $base/exact-role-record.json" | sha256sum -c -
          echo "3c11e621220621aecc6b515e31b78384300270ed58593f837ae06559f8901bd4  $base/thing-original.jpg" | sha256sum -c -
          echo "1d9c1d1bb084617d9fe2750d3a8b46b20a39e0c16c0a87c3f25238b53ada41b9  $base/source-page-movieinsider-659.png" | sha256sum -c -
          echo "f01b3ec941dbbb194ef879859342ab022b18bf6830cadb32d79b391288557f41  $base/source-page-afi-production-cast.png" | sha256sum -c -
          echo "e3e8fe1875e12a0765fb52032b911deb594a1431bc8338c3a42c0e5fb277d992  $base/source-page-superherohype-full-costume.png" | sha256sum -c -
          echo "ba0e9042f29722b0b2c63245c4a6cd81a15a8527dc8fd2368531b57a4238582b  $base/source-page-superherohype-pigeon.png" | sha256sum -c -
          echo "f08b8b1e759cd1e052272ea6c18e2965698f91d3262d111c0dff40e4b3b2aa81  $base/uc-088-still-candidate.jpg" | sha256sum -c -
          echo "312560ca1e040c63d202fb000bcdf38d38c49d68c1a017e44da76f55012832d5  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30316121507
          artifact_id=8672213650
          artifact_name=card-backfill-uc-088-render-30316121507
          artifact_zip_sha256=8ec2c80b48a7e6ad9f1a173f4cfc95f6fc5cff26a4ecaf36a0ed5d12341a27ca
          artifact_head_sha=4e54f469cff6a13987dfe7fe4793bd06798f2cf7
          source_manifest_sha256=d21cbe053b840bce6c24afd52adc9eb3fd981c05ccde2281bb493fd031c8e116
          source_sums_sha256=14c136be0c2dee681092702ff4e486bd7cf39d908ab74105307bd67e1a923950
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-088-apply/source/card-backfill-uc-088-render/output/UC-088
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-088-apply"
          node --check scripts/card-backfill-uc-088-apply.mjs
          node scripts/card-backfill-uc-088-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-088-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-088');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-088');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_0203aa7a6b845505e9c2c887');
          if(!specimen||specimen.still)throw new Error('UC-088 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-088 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-088'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-088 audit disposition was canonically mutated');
          console.log('PASS — UC-088 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-088-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-088.json \
            .github/CARD-BACKFILL-UC-088-DISCOVER.json \
            .github/CARD-BACKFILL-UC-088-TARGETED.json \
            .github/CARD-BACKFILL-UC-088-RENDER.json \
            .github/CARD-BACKFILL-UC-088-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-088-scope.yml \
            .github/workflows/card-backfill-uc-088-discover.yml \
            .github/workflows/card-backfill-uc-088-targeted.yml \
            .github/workflows/card-backfill-uc-088-render.yml \
            .github/workflows/card-backfill-uc-088-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-088-scope.mjs \
            scripts/card-backfill-uc-088-discover.mjs \
            scripts/card-backfill-uc-088-targeted.mjs \
            scripts/card-backfill-uc-088-render.mjs \
            scripts/card-backfill-uc-088-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-088 Michael Chiklis Thing still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-020
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-020 HEAD)
          test "${#changed[@]}" -eq 13
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-088/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-088-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-021
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-088-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-088-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-088-apply
            data/review/card-backfill/UC-088
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
