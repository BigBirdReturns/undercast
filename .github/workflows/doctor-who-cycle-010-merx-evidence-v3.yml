name: doctor-who-cycle-010-merx-evidence-v3
"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [".github/workflows/doctor-who-cycle-010-merx-evidence-v3.yml"]
permissions: {}
concurrency:
  group: doctor-who-cycle-010-merx-evidence-v3
  cancel-in-progress: true
jobs:
  recover:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-evidence-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions: {contents: read, actions: read, pull-requests: read}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-merx-evidence-v3
      SELF: .github/workflows/doctor-who-cycle-010-merx-evidence-v3.yml
      OUT: /tmp/doctor-who-cycle-010-merx-evidence-v3
      BOOTSTRAP: /tmp/doctor-who-cycle-010-merx-evidence-v3-bootstrap
      CONTROL: /tmp/doctor-who-cycle-010-merx-evidence-v3-control
      MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      V2_COMMIT: 1da172f6390424eedd518804558e98dadd72417e
      V2_PATH: .github/workflows/doctor-who-cycle-010-merx-evidence-v2.yml
      V2_BLOB: f05ed95d13dc41121f40be6a0bdad52f0f0af4c2
      V2_SHA256: 63120c8f7fa37899da58f4df868fad36617a0a411da87115e6c62904ed326923
      V2_RUN: "31288385312"
      V2_JOB: "93181222863"
      V2_DIAGNOSTICS: "9030576067"
      V2_DIAGNOSTICS_SHA256: 943229923eba9cfbed4ed2624ced644d94873401e5b4f5896e6eda09fbeb2c5d
      V1_DIAGNOSTICS_SHA256: 0be7293c8e3d079a82af1af15ba487942c15eeb17bea48f96b553ab62464f8d9
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, filter: blob:none, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - name: Recover exact V2 program chain and correct one metadata binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CONTROL" "$BOOTSTRAP" "$OUT"
          mkdir -p "$CONTROL"/{source,scripts,receipt,api}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V2_RUN" > "$CONTROL/api/v2-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V2_RUN/jobs?per_page=100" > "$CONTROL/api/v2-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V2_RUN/artifacts?per_page=100" > "$CONTROL/api/v2-artifacts.json"
          ROOT="$CONTROL" python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=Path(os.environ['ROOT'])
          run=json.loads((r/'api/v2-run.json').read_text())
          jobs=json.loads((r/'api/v2-jobs.json').read_text())['jobs']
          arts=json.loads((r/'api/v2-artifacts.json').read_text())['artifacts']
          assert run['id']==int(os.environ['V2_RUN']) and run['head_sha']==os.environ['V2_COMMIT'] and run['status']=='completed' and run['conclusion']=='failure'
          job=next(x for x in jobs if x['id']==int(os.environ['V2_JOB']))
          assert job['name']=='recover' and job['conclusion']=='failure'
          steps={x['name']:(x['status'],x['conclusion']) for x in job['steps']}
          assert steps['Recover immutable V1 programs and apply three bounded repairs']==('completed','failure')
          assert steps['Execute recovered V1 preflight binding']==('completed','skipped')
          art=next(x for x in arts if x['id']==int(os.environ['V2_DIAGNOSTICS']))
          assert art['digest']=='sha256:'+os.environ['V2_DIAGNOSTICS_SHA256'] and art['expired'] is False
          PY

          git cat-file -e "$V2_COMMIT^{commit}"
          git show "$V2_COMMIT:$V2_PATH" > "$CONTROL/source/v2.yml"
          test "$(git hash-object "$CONTROL/source/v2.yml")" = "$V2_BLOB"
          test "$(sha256sum "$CONTROL/source/v2.yml" | cut -d' ' -f1)" = "$V2_SHA256"

          SOURCE="$CONTROL/source/v2.yml" DEST="$CONTROL" python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=Path(os.environ['SOURCE']); dest=Path(os.environ['DEST'])
          ruby=r'''require 'yaml'; require 'json'
          source, out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          job = doc.fetch('jobs').fetch('recover')
          File.write(File.join(out,'source','v2-env.json'), JSON.generate(job.fetch('env')))
          wanted = {
            'Recover immutable V1 programs and apply three bounded repairs'=>'recover-v1.sh',
            'Execute recovered V1 preflight binding'=>'bind.sh',
            'Record immutable recovery and repair custody'=>'record.sh',
            'Execute recovered current-main gate'=>'gates.sh',
            'Execute repaired exact Merx source census'=>'source.sh',
            'Execute repaired official-page and cover recovery'=>'official.sh',
            'Execute canonical Dan Starkey portrait inventory and evidence seal'=>'inventory.sh',
            'Verify exact artifact denominator'=>'verify.sh'
          }
          found = {}
          job.fetch('steps').each do |step|
            name=step['name']; next unless wanted.key?(name)
            raise "duplicate #{name}" if found[name]
            File.write(File.join(out,'scripts',wanted[name]), step.fetch('run'))
            found[name]=true
          end
          raise "missing steps" unless found.keys.sort == wanted.keys.sort
          '''
          subprocess.run(['ruby','-e',ruby,str(source),str(dest)],check=True)
          scripts=dest/'scripts'
          for p in scripts.glob('*.sh'):
              subprocess.run(['bash','-n',str(p)],check=True)
          env=json.loads((dest/'source/v2-env.json').read_text())
          excluded={'GH_TOKEN','BRANCH','SELF','OUT','BOOTSTRAP','PR_HEAD','PR_NUMBER','PR_BASE_SHA','V1_DIAGNOSTICS_SHA256'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          hashes={p.name:{'bytes':len(p.read_bytes()),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(scripts.glob('*.sh'))}
          receipt={'version':1,'status':'exact-v2-program-chain-recovered','source':{'commit':os.environ['V2_COMMIT'],'path':os.environ['V2_PATH'],'git_blob':os.environ['V2_BLOB'],'sha256':os.environ['V2_SHA256'],'failed_run':int(os.environ['V2_RUN']),'failed_job':int(os.environ['V2_JOB']),'diagnostics_artifact':int(os.environ['V2_DIAGNOSTICS']),'diagnostics_sha256':os.environ['V2_DIAGNOSTICS_SHA256']},'single_override':{'field':'V1_DIAGNOSTICS_SHA256','old_transport_checksum':'cc7bd0fac0deef49c574b5ebe89788aecc3681d19e5161b04a70fe8755151947','actions_artifact_digest':os.environ['V1_DIAGNOSTICS_SHA256']},'programs':hashes}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (dest/'receipt/v3-wrapper.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          chmod 0755 "$CONTROL/scripts"/*.sh
      - name: Execute exact recovered V2 repair bootstrap
        shell: bash
        run: bash "$CONTROL/scripts/recover-v1.sh"
      - name: Execute recovered V1 preflight binding
        shell: bash
        run: bash "$CONTROL/scripts/bind.sh"
      - name: Record V1 and V2 recovery custody
        shell: bash
        run: bash "$CONTROL/scripts/record.sh"
      - name: Record V3 wrapper custody
        shell: bash
        run: cp "$CONTROL/receipt/v3-wrapper.json" "$OUT/evidence/v3-wrapper.json"
      - name: Execute recovered current-main gate
        shell: bash
        run: bash "$CONTROL/scripts/gates.sh"
      - name: Execute repaired exact Merx source census
        shell: bash
        run: bash "$CONTROL/scripts/source.sh"
      - name: Execute repaired official-page and cover recovery
        shell: bash
        run: bash "$CONTROL/scripts/official.sh"
      - name: Execute canonical Dan Starkey portrait inventory and evidence seal
        shell: bash
        run: bash "$CONTROL/scripts/inventory.sh"
      - name: Verify exact artifact denominator
        shell: bash
        run: bash "$CONTROL/scripts/verify.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-evidence-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-evidence-v3/SHA256SUMS
            /tmp/doctor-who-cycle-010-merx-evidence-v3/SHA256SUMS.pre
            /tmp/doctor-who-cycle-010-merx-evidence-v3/evidence
            /tmp/doctor-who-cycle-010-merx-evidence-v3/source
            /tmp/doctor-who-cycle-010-merx-evidence-v3/official
            /tmp/doctor-who-cycle-010-merx-evidence-v3/media
            /tmp/doctor-who-cycle-010-merx-evidence-v3/logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-evidence-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-evidence-v3
            /tmp/doctor-who-cycle-010-merx-evidence-v3-bootstrap
            /tmp/doctor-who-cycle-010-merx-evidence-v3-control
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
