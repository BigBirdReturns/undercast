name: doctor-who-cycle-009-megnus-jaka-candidate-review-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-review-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-candidate-review-v3
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v3
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-review-v3.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3
      PACKET: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/source-packet
      WORKTREE: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/worktree
      TARROOT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/tar-product
      SOURCE: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3-source
      V1_SOURCE_BLOB: ba1e5f00a0304858ae578f9300bcd665d6e236a6
      V1_SOURCE_SHA256: 4a16aa62822f2179b764180b13b13c2223cca27458f9e162f2f52a540aa1495b
      V1_AUTH_SHA256: 3a7b653bfb107caeec9afcc79328e64324e6876de1dec465c4e20ed9c4e1e31a
      V1_RECONSTRUCT_SHA256: b6fd65c5f4c836188dfa21cb2735be72bd0c50ade1f8d78745f0fca6fe71d082
      V1_SEAL_SHA256: 75f78dd480bd4a15caacb5d64fd7a73b3682e73caecfe0aef4b5a0b9c2d8e04f
      V3_RECONSTRUCT_SHA256: 18d5515ac6c62cb2db423e3b0c7ba124fe55ea350f1fb2be8212098e8e00ff4d
      V3_SEAL_SHA256: 4cb67da9cbd573728c30510732cfaad7b3d5e6c3be022ee4a6072102621976b9
      CANDIDATE_PR: "673"
      CANDIDATE_RUN: "31273651684"
      CANDIDATE_JOB: "93143639874"
      CANDIDATE_ARTIFACT: "9026406657"
      CANDIDATE_HEAD: f6292fb2e93fe5340d039cfca0bfdf25c815c520
      CANDIDATE_ZIP_SHA256: 546c566567f88158356767a9a1d8f05728988d0387df99ca3f33a53c3e35cb72
      CANDIDATE_COMMIT: 35f507417bb4b2efade613b3b643080363a0350f
      CANDIDATE_TREE: e59fc81b63c6e512a858d7b3353a58d4e5945796
      CANDIDATE_RECEIPT_ID: d2d6988d3ad79489296485431ea098d3410a328a403d9b58f91d0f5e94fc4a92
      CANDIDATE_PATHS_SHA256: 488a082aa186ab16e28b5c0b9bc7b28867e72126ab0ffa8fdaadc61f82ac5f50
      CANDIDATE_BUNDLE_SHA256: 78c9feb8b95bc01b70a0130ebbf80cd6808176d64bc9d28175b083c393646ae8
      CANDIDATE_PATCH_SHA256: 20fdd458de4f3427c64711fdbfef2d0d693b0b330144ee7cbba4dbd39f610777
      CANDIDATE_ARCHIVE_SHA256: a464de88653efeeff4dd9929e9a0c62e040ab5829fff7331c403ec33b240c6f8
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_4ca825307ad0d4510f44c7d9
      WALL_ID: UC-1354
      PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V1 reviewer and authenticate candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SOURCE"
          mkdir -p "$SOURCE"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V1_SOURCE_BLOB" --jq '.content' \
            | tr -d '\n' | base64 --decode > "$SOURCE/reviewer-v1.yml"
          test "$(sha256sum "$SOURCE/reviewer-v1.yml" | awk '{print $1}')" = "$V1_SOURCE_SHA256"
          test "$(git hash-object "$SOURCE/reviewer-v1.yml")" = "$V1_SOURCE_BLOB"

          SOURCE_FILE="$SOURCE/reviewer-v1.yml" DEST_DIR="$SOURCE" python3 - <<'PY'
          import os
          from pathlib import Path
          lines=Path(os.environ['SOURCE_FILE']).read_text().splitlines()
          targets={
              'Authenticate exact V12 candidate packet and carrier geometry':'authenticate-v1.sh',
              'Reconstruct exact candidate and execute independent gates':'reconstruct-v1.sh',
              'Seal independent candidate qualification':'seal-v1.sh',
          }
          for name, filename in targets.items():
              marker=f'      - name: {name}'
              assert lines.count(marker)==1
              i=lines.index(marker)
              while i<len(lines) and lines[i] != '        run: |':
                  i+=1
              assert i<len(lines)
              block=[]
              for line in lines[i+1:]:
                  if line.startswith('          '):
                      block.append(line[10:])
                  elif line=='':
                      block.append('')
                  else:
                      break
              Path(os.environ['DEST_DIR'],filename).write_text('\n'.join(block).rstrip()+'\n')
          PY

          test "$(sha256sum "$SOURCE/authenticate-v1.sh" | awk '{print $1}')" = "$V1_AUTH_SHA256"
          test "$(sha256sum "$SOURCE/reconstruct-v1.sh" | awk '{print $1}')" = "$V1_RECONSTRUCT_SHA256"
          test "$(sha256sum "$SOURCE/seal-v1.sh" | awk '{print $1}')" = "$V1_SEAL_SHA256"
          bash -n "$SOURCE/authenticate-v1.sh"
          bash -n "$SOURCE/reconstruct-v1.sh"
          bash -n "$SOURCE/seal-v1.sh"
          bash "$SOURCE/authenticate-v1.sh"

      - name: Execute exact reviewer with bounded Chromium repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE/reconstruct-v1.sh" | awk '{print $1}')" = "$V1_RECONSTRUCT_SHA256"
          SRC="$SOURCE/reconstruct-v1.sh" DEST="$SOURCE/reconstruct-v3.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['SRC']).read_text()
          needle='npm ci\nnode scripts/doctor-who-cycle-008.mjs'
          assert src.count(needle)==1
          Path(os.environ['DEST']).write_text(src.replace(
              needle,
              'npm ci\nnpx playwright install --with-deps chromium\nnode scripts/doctor-who-cycle-008.mjs'))
          PY
          test "$(sha256sum "$SOURCE/reconstruct-v3.sh" | awk '{print $1}')" = "$V3_RECONSTRUCT_SHA256"
          test "$(grep -Fc 'npx playwright install --with-deps chromium' "$SOURCE/reconstruct-v3.sh")" = 1
          bash -n "$SOURCE/reconstruct-v3.sh"
          bash "$SOURCE/reconstruct-v3.sh"

      - name: Seal V3 qualification and source custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$SOURCE/seal-v1.sh" | awk '{print $1}')" = "$V1_SEAL_SHA256"
          SRC="$SOURCE/seal-v1.sh" DEST="$SOURCE/seal-v3.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['SRC']).read_text()
          old='DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-CANDIDATE-QUALIFICATION-V1'
          assert src.count(old)==1
          Path(os.environ['DEST']).write_text(src.replace(
              old,
              'DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-CANDIDATE-QUALIFICATION-V3'))
          PY
          test "$(sha256sum "$SOURCE/seal-v3.sh" | awk '{print $1}')" = "$V3_SEAL_SHA256"
          bash -n "$SOURCE/seal-v3.sh"

          ROOT="$OUT" SOURCE="$SOURCE" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); source=Path(os.environ['SOURCE'])
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={
              'version':1,
              'operation':'bounded-reviewer-environment-repair',
              'source_workflow':{'git_blob':os.environ['V1_SOURCE_BLOB'],'sha256':sha(source/'reviewer-v1.yml')},
              'source_scripts':{
                  'authenticate_v1_sha256':sha(source/'authenticate-v1.sh'),
                  'reconstruct_v1_sha256':sha(source/'reconstruct-v1.sh'),
                  'seal_v1_sha256':sha(source/'seal-v1.sh'),
              },
              'successor_scripts':{
                  'reconstruct_v3_sha256':sha(source/'reconstruct-v3.sh'),
                  'seal_v3_sha256':sha(source/'seal-v3.sh'),
              },
              'repair':{
                  'exact_insertions':1,
                  'command':'npx playwright install --with-deps chromium',
                  'candidate_logic_changed':False,
                  'semantic_assertions_changed':False,
                  'publication_authority_changed':False,
              },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'review/reviewer-source.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

          bash "$SOURCE/seal-v3.sh"
          find "$SOURCE" -maxdepth 1 -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$SOURCE/SHA256SUMS.pre"
          sha256sum "$SOURCE/SHA256SUMS.pre" > "$SOURCE/SHA256SUMS"
          test "$(sha256sum "$SOURCE/SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$SOURCE/SHA256SUMS")"

      - name: Upload independent candidate qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-review-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/ALL-SHA256SUMS
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/ALL-SHA256SUMS.pre
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/api
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/review
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3-source
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload independent review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-review-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/api
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3/review
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v3-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
