name: doctor-who-cycle-010-merx-postmerge-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-postmerge-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-postmerge-v1
  cancel-in-progress: true

jobs:
  prove:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-postmerge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-merx-postmerge-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-postmerge-v1.yml
      CANONICAL_PARENT: 1d50591ce826256e40fc574ebf9aef7993386760
      CANONICAL_MAIN: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      CANONICAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      CANONICAL_PATH_COUNT: "50"
      PRODUCT_PR: "741"
      GUARDIAN_PR: "742"
      GUARDIAN_BRANCH: agent/doctor-who-cycle-010-merx-merger-current-main-v1
      GUARDIAN_HEAD: 4c3e127209ffb5f2e001d4b0dd843f439bdf3231
      GUARDIAN_RUN: "31298320558"
      GUARDIAN_VERIFY_JOB: "93206873382"
      GUARDIAN_WRITE_JOB: "93207148345"
      SETTLEMENT_ARTIFACT: "9033697962"
      SETTLEMENT_DIGEST: sha256:d3d6f5c848962133b27abf56846c5bdbe0cdee0075e07de472e4aaf68f46e850
      SETTLEMENT_IDENTITY: 50d3be508aa2a58e270f84f010dbd660249b2e15afb957c11becc2824dedc9f7
      MERGE_ARTIFACT: "9033701093"
      MERGE_DIGEST: sha256:0958591d3c4ef9185a2a81516178f32b4332c1e69036491a73922cd6bff6d0ab
      MERGE_IDENTITY: e0639a0487f5fb1647057342625fb19df18d3bbacda4f516d10363430fa03706
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      OUT: /tmp/doctor-who-cycle-010-merx-postmerge-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact postmerge observer and canonical main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,settlement,merge,proof,logs}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$CANONICAL_MAIN" > "$OUT/api/canonical-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$CANONICAL_PARENT...$CANONICAL_MAIN" > "$OUT/api/canonical-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          HEAD="$head" PR="$pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          own=json.loads((root/'carrier-pr.json').read_text())
          commit=json.loads((root/'canonical-commit.json').read_text())
          compare=json.loads((root/'canonical-compare.json').read_text())
          product=json.loads((root/'product-pr.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['ref']=='main' and own['base']['sha']==os.environ['CANONICAL_MAIN']
          assert own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert [row['sha'] for row in commit['parents']]==[os.environ['CANONICAL_PARENT']]
          assert commit['tree']['sha']==os.environ['CANONICAL_TREE']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          paths=sorted(row['filename'] for row in compare['files'])
          assert len(paths)==int(os.environ['CANONICAL_PATH_COUNT'])
          assert not any(path.startswith('.github/') for path in paths)
          assert product['number']==int(os.environ['PRODUCT_PR'])
          assert product['state']=='closed' and product['merged'] is True
          assert product['base']['sha']==os.environ['CANONICAL_PARENT'] and product['head']['sha']==os.environ['CANONICAL_MAIN']
          assert product['commits']==1 and product['changed_files']==int(os.environ['CANONICAL_PATH_COUNT'])
          (Path(os.environ['OUT'])/'proof/canonical-paths.txt').write_text(''.join(path+'\n' for path in paths))
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rehydrate exact guardian settlement and merge receipts
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$GUARDIAN_PR" > "$OUT/api/guardian-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN" > "$OUT/api/guardian-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN/jobs?per_page=100" > "$OUT/api/guardian-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GUARDIAN_RUN/artifacts?per_page=100" > "$OUT/api/guardian-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SETTLEMENT_ARTIFACT/zip" > "$OUT/settlement.zip"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$MERGE_ARTIFACT/zip" > "$OUT/merge.zip"
          test "$(sha256sum "$OUT/settlement.zip" | awk '{print $1}')" = "${SETTLEMENT_DIGEST#sha256:}"
          test "$(sha256sum "$OUT/merge.zip" | awk '{print $1}')" = "${MERGE_DIGEST#sha256:}"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); api=root/'api'
          pr=json.loads((api/'guardian-pr.json').read_text())
          run=json.loads((api/'guardian-run.json').read_text())
          jobs=json.loads((api/'guardian-jobs.json').read_text())['jobs']
          artifacts=json.loads((api/'guardian-artifacts.json').read_text())['artifacts']
          assert pr['number']==int(os.environ['GUARDIAN_PR'])
          assert pr['state']=='closed' and pr['merged'] is False and pr['draft'] is True
          assert pr['base']['sha']==os.environ['CANONICAL_PARENT']
          assert pr['head']['ref']==os.environ['GUARDIAN_BRANCH'] and pr['head']['sha']==os.environ['GUARDIAN_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['GUARDIAN_RUN'])
          assert run['name']=='doctor-who-cycle-010-merx-merger-current-main-v1'
          assert run['head_branch']==os.environ['GUARDIAN_BRANCH'] and run['head_sha']==os.environ['GUARDIAN_HEAD']
          assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          by={row['name']:row for row in jobs}
          assert set(by)=={'verify','fast_forward'}
          assert by['verify']['id']==int(os.environ['GUARDIAN_VERIFY_JOB']) and by['verify']['conclusion']=='success'
          assert by['fast_forward']['id']==int(os.environ['GUARDIAN_WRITE_JOB']) and by['fast_forward']['conclusion']=='success'
          art={row['id']:row for row in artifacts}
          expected={
              int(os.environ['SETTLEMENT_ARTIFACT']):os.environ['SETTLEMENT_DIGEST'],
              int(os.environ['MERGE_ARTIFACT']):os.environ['MERGE_DIGEST'],
          }
          assert set(expected)<=set(art)
          for ident,digest in expected.items():
              row=art[ident]
              assert row['expired'] is False and row['digest']==digest
              assert row['workflow_run']['id']==int(os.environ['GUARDIAN_RUN'])
              assert row['workflow_run']['head_sha']==os.environ['GUARDIAN_HEAD']
          for name in ('settlement','merge'):
              target=root/name
              with zipfile.ZipFile(root/f'{name}.zip') as archive:
                  infos=archive.infolist()
                  assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename)
                      assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir(): continue
                      out=target/path
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(archive.read(info))
              ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
              assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
              for raw in ledger.read_text().splitlines():
                  if not raw.strip(): continue
                  digest,file=raw.split(None,1); path=target/file.lstrip('*')
                  assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement/settlement.json').read_text())
          sid=settlement.pop('identity')
          assert sid==os.environ['SETTLEMENT_IDENTITY']
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==sid
          settlement['identity']=sid
          merge=json.loads((root/'merge/merge.json').read_text())
          mid=merge.pop('identity')
          assert mid==os.environ['MERGE_IDENTITY']
          assert hashlib.sha256(json.dumps(merge,sort_keys=True,separators=(',',':')).encode()).hexdigest()==mid
          merge['identity']=mid
          assert settlement['status']=='cycle-010-merx-exact-fast-forward-approved-v1'
          assert settlement['verify_run']==int(os.environ['GUARDIAN_RUN']) and settlement['verify_attempt']==1
          assert settlement['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert settlement['product_pr']==int(os.environ['PRODUCT_PR'])
          assert settlement['product_commit']==os.environ['CANONICAL_MAIN']
          assert settlement['product_tree']==os.environ['CANONICAL_TREE']
          assert settlement['product_path_count']==int(os.environ['CANONICAL_PATH_COUNT'])
          assert settlement['task_id']==os.environ['TASK_ID']
          assert settlement['lease_id']==os.environ['LEASE_ID']
          assert settlement['wall_id']==os.environ['WALL_ID']
          assert settlement['cycle_id']==os.environ['CYCLE_ID']
          assert settlement['force_update'] is False and settlement['main_mutated'] is False
          assert settlement['cycle_011_authorized'] is False and settlement['eleventh_lease_issued'] is False
          assert merge['status']=='cycle-010-merx-canonically-fast-forwarded-v1'
          assert merge['merge_run']==int(os.environ['GUARDIAN_RUN']) and merge['merge_attempt']==1
          assert merge['canonical_parent']==os.environ['CANONICAL_PARENT']
          assert merge['canonical_main']==os.environ['CANONICAL_MAIN']
          assert merge['canonical_tree']==os.environ['CANONICAL_TREE']
          assert merge['canonical_path_count']==int(os.environ['CANONICAL_PATH_COUNT'])
          assert merge['product_pr']==int(os.environ['PRODUCT_PR'])
          assert merge['settlement_identity']==settlement['identity']
          assert merge['force_update'] is False and merge['cycle_011_authorized'] is False and merge['eleventh_lease_issued'] is False
          assert (root/'merge/settlement.bound.json').read_bytes()==(root/'settlement/settlement.json').read_bytes()
          custody={
              'guardian':{'pr':pr['number'],'head':pr['head']['sha'],'run':run['id'],'verify_job':by['verify']['id'],'fast_forward_job':by['fast_forward']['id']},
              'settlement':{'artifact':int(os.environ['SETTLEMENT_ARTIFACT']),'digest':os.environ['SETTLEMENT_DIGEST'],'identity':settlement['identity']},
              'merge':{'artifact':int(os.environ['MERGE_ARTIFACT']),'digest':os.environ['MERGE_DIGEST'],'identity':merge['identity']},
          }
          (root/'proof/guardian-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY

      - name: Rerun canonical permanent and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T HEAD)" = "$CANONICAL_TREE"
          test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/proof/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/proof/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          state=json.loads(Path('data/AUTOPILOT.json').read_text())
          doctor=[row for row in state['jobs'] if row.get('scope')=='doctor-who']
          task=next(row for row in doctor if row['id']==os.environ['TASK_ID'])
          assert len(doctor)==316
          assert task['status']=='resolved' and task['performer']=='Dan Starkey' and task['character']=='Merx'
          assert task['wall_ids']==[os.environ['WALL_ID']]
          assert sum(row['status']=='queued' for row in doctor)==306
          assert sum(row['status']=='resolved' for row in doctor)==10
          assert not [row for row in doctor if row['status'] in {'leased','drafted','merged'}]
          card=next(row for row in json.loads(Path('data/specimens.json').read_text()) if row['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Merx' and card['kind']=='voice' and 'still' not in card
          assert hashlib.sha256(Path(card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.loads(Path('data/review/adapter-sdk/doctor-who-cycle-010-merx.json').read_text())
          assert receipt['task']['id']==os.environ['TASK_ID']
          assert receipt['lease']['id']==os.environ['LEASE_ID']
          assert receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID']
          assert receipt['reviewed_cycle']['event_id']==os.environ['EVENT_ID']
          assert receipt['queue']['after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert receipt['boundary']['cycle_011_authorized'] is False
          assert receipt['boundary']['eleventh_lease_issued'] is False
          status=json.loads((out/'proof/autopilot-status.json').read_text())
          water=json.loads((out/'proof/waterline-status.json').read_text())
          assert status['total']==316 and status['statuses']=={'queued':306,'resolved':10} and status['in_flight']==0
          assert water['claim_allowed'] is True and water['claim_reasons']==[]
          assert water['jobs']['in_flight']==0 and water['media']['debt']==0 and water['cycles']['unreceipted']==[]
          PY
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Seal terminal canonical proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT'])
          water=json.loads((out/'proof/waterline-status.json').read_text())
          receipt={
              'status':'cycle-010-merx-terminal-postmerge-proved-v1',
              'version':1,
              'proof_run':int(os.environ['GITHUB_RUN_ID']),
              'proof_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':int(os.environ['CARRIER_PR']),
              'carrier_head':os.environ['CARRIER_HEAD'],
              'canonical_parent':os.environ['CANONICAL_PARENT'],
              'canonical_main':os.environ['CANONICAL_MAIN'],
              'canonical_tree':os.environ['CANONICAL_TREE'],
              'canonical_path_count':int(os.environ['CANONICAL_PATH_COUNT']),
              'product_pr':int(os.environ['PRODUCT_PR']),
              'product_pr_state':'closed',
              'product_pr_merged':True,
              'guardian_run':int(os.environ['GUARDIAN_RUN']),
              'settlement_artifact':int(os.environ['SETTLEMENT_ARTIFACT']),
              'settlement_artifact_digest':os.environ['SETTLEMENT_DIGEST'],
              'settlement_identity':os.environ['SETTLEMENT_IDENTITY'],
              'merge_artifact':int(os.environ['MERGE_ARTIFACT']),
              'merge_artifact_digest':os.environ['MERGE_DIGEST'],
              'merge_identity':os.environ['MERGE_IDENTITY'],
              'task_id':os.environ['TASK_ID'],
              'lease_id':os.environ['LEASE_ID'],
              'wall_id':os.environ['WALL_ID'],
              'cycle_id':os.environ['CYCLE_ID'],
              'event_id':os.environ['EVENT_ID'],
              'queue':{'total':316,'queued':306,'resolved':10,'in_flight':0},
              'media':{'performer_portrait':'verified','portrait_sha256':os.environ['PORTRAIT_SHA256'],'character_still':'absent','debt':0},
              'unreceipted_cycles':[],
              'next_selector_allowed':water['claim_allowed'],
              'next_selector_reasons':water['claim_reasons'],
              'cycle_011_lease_issued':False,
              'cleanup_authorized':True,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
              'gates':{'canonical_ancestry':True,'artifact_custody':True,'historical_checker_bytes':True,'cycle_009_composability':True,'cycle_010':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'proof/postmerge-proof.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-postmerge-v1-proof-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-postmerge-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-postmerge-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-postmerge-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
