name: star-trek-kukulkan-terminalize-pr-v1

on:
  pull_request:
    branches:
      - agent/star-trek-kukulkan-probe-base-v1
    types: [synchronize]

concurrency:
  group: star-trek-kukulkan-terminalization
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  terminalize:
    if: github.event.pull_request.head.ref == 'agent/star-trek-kukulkan-probe-v1'
    name: unitkukulkan-terminalize
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN: 47296e8a7947384b04275962b8f6a125e5306680
      EXPECTED_TREE: 8594a496bbbeeabc73c883c2c2052949574f5316
      EXPECTED_PARENT: af8c0891b38275889bc90ca76af763ce6dd9b59c
      PUBLICATION_RUN: 32320408106
      PUBLICATION_JOB: 96281315695
      PROBE_RUN: 32319707151
      PROBE_JOB: 96279260416
      PAGES_RUN: 32320701427
      ARTIFACT_ROOT: /tmp/kukulkan-terminal-artifacts
      OUTPUT_ROOT: /tmp/kukulkan-terminal-execution
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preserve terminal validator and drain prior Kukulkan carriers
        run: |
          set -euo pipefail
          cp .github/recovery/kukulkan-terminalize-v1.py /tmp/kukulkan-terminalize-v1.py
          python3 -m py_compile /tmp/kukulkan-terminalize-v1.py

          active=''
          for attempt in $(seq 1 360); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"
            active="$(jq -c --argjson self "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self and .status != "completed" and (.head_branch // "" | test("^agent/star-trek-kukulkan")))] | sort_by(.id)' <<<"$runs")"
            if test "$(jq length <<<"$active")" = 0; then
              break
            fi
            sleep 5
          done
          if test "$(jq length <<<"$active")" != 0; then
            echo "$active" | jq .
            echo 'Kukulkan terminalization exclusivity gate remained occupied' >&2
            exit 1
          fi

      - name: Verify exact live product and repository-native gates
        run: |
          set -euo pipefail
          live="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main")"
          test "$(jq -r .sha <<<"$live")" = "$EXPECTED_MAIN"
          test "$(jq -r .commit.tree.sha <<<"$live")" = "$EXPECTED_TREE"
          test "$(jq -r '.parents | length' <<<"$live")" = 1
          test "$(jq -r .parents[0].sha <<<"$live")" = "$EXPECTED_PARENT"
          test "$(jq -r .commit.message <<<"$live")" = 'Star Trek: publish Kukulkan cycle'

          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN"
          git checkout --detach "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PARENT"

          node scripts/star-trek-kukulkan-cycle.mjs
          node scripts/star-trek-kol-tai-cycle.mjs
          node scripts/thesis-rails.mjs validate
          node scripts/media-audit.mjs gate --scope star-trek
          node scripts/waterline.mjs validate
          node scripts/corpus-ops.mjs validate

          rm -rf "$ARTIFACT_ROOT" "$OUTPUT_ROOT"
          mkdir -p "$ARTIFACT_ROOT/metadata" "$ARTIFACT_ROOT/zips"
          node scripts/thesis-rails.mjs next --json > "$ARTIFACT_ROOT/metadata/thesis-next-live.json"

      - name: Download and bind every exact Kukulkan artifact
        run: |
          set -euo pipefail
          download_exact() {
            key="$1"
            id="$2"
            expected_name="$3"
            expected_run="$4"
            expected_sha="$5"
            meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}")"
            printf '%s\n' "$meta" | jq . > "$ARTIFACT_ROOT/metadata/${key}.json"
            test "$(jq -r .id <<<"$meta")" = "$id"
            test "$(jq -r .name <<<"$meta")" = "$expected_name"
            test "$(jq -r .expired <<<"$meta")" = false
            test "$(jq -r .workflow_run.id <<<"$meta")" = "$expected_run"
            test "$(jq -r .digest <<<"$meta")" = "sha256:${expected_sha}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$ARTIFACT_ROOT/zips/${key}.zip"
            echo "${expected_sha}  $ARTIFACT_ROOT/zips/${key}.zip" | sha256sum -c -
            mkdir -p "$ARTIFACT_ROOT/${key}"
            unzip -q "$ARTIFACT_ROOT/zips/${key}.zip" -d "$ARTIFACT_ROOT/${key}"
          }

          download_exact probe_receipt 9389338360 star-trek-kukulkan-probe-v6 "$PROBE_RUN" c709e51abea1ee40abee0c372ae07120d952eae6cbea8738ab24ca5e3c2905f4
          download_exact media_preparation 9389336811 star-trek-kukulkan-media-v6 "$PROBE_RUN" f3451597601f150334c405b0cf5f336e46b6f796097c9e1711fe2703975ed100
          download_exact sealed_controller 9389337488 star-trek-kukulkan-controller-source-v6 "$PROBE_RUN" 78d21efa06301f3bd8a47f976d7a25f0f5d4816a5cbca2dcc3dd650cdb7f73b6
          download_exact execution_controller 9389559695 star-trek-kukulkan-controller-execution-v1 "$PUBLICATION_RUN" 549b8d37c3fc780ed59d0fa94e185341f306f3c95c8148f78c61681326766e67
          download_exact candidate 9389573196 unitkukulkan-candidate-product "$PUBLICATION_RUN" 6de03cbecbd3a0ad9865961b29855172820ccf65d05763defe99619b21c3bff4
          download_exact independent_review 9389575246 unitkukulkan-independent-review "$PUBLICATION_RUN" 5fe1c187467e8c54a6586c5050334543f17a6a6ea7675e0ba0e5c81629f9f693
          download_exact final_product_receipt 9389667915 star-trek-kukulkan-final-product-receipt-v1 "$PUBLICATION_RUN" 6cef592cb9f059910c26c9696de38a7f9bda88c942834ceec07012031ecb8938

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLICATION_RUN}" > "$ARTIFACT_ROOT/metadata/publication-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PUBLICATION_RUN}/jobs?per_page=100" > "$ARTIFACT_ROOT/metadata/publication-jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN}" > "$ARTIFACT_ROOT/metadata/pages-run.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PAGES_RUN}/jobs?per_page=100" > "$ARTIFACT_ROOT/metadata/pages-jobs.json"
          gh run view "$PAGES_RUN" --log > "$ARTIFACT_ROOT/metadata/pages.log"

      - name: Replace false tree-equality gate with exact finalization-delta audit
        run: |
          set -euo pipefail
          REPO_ROOT="$PWD" ARTIFACT_ROOT="$ARTIFACT_ROOT" OUTPUT_ROOT="$OUTPUT_ROOT" \
            python3 /tmp/kukulkan-terminalize-v1.py
          jq -e --arg commit "$EXPECTED_MAIN" --arg tree "$EXPECTED_TREE" '.status == "success" and .canonical_product.commit == $commit and .canonical_product.tree == $tree and .candidate_to_product_delta.candidate_path_count == 43 and .candidate_to_product_delta.product_path_count == 50 and (.candidate_to_product_delta.product_only_paths | length) == 7 and .canonical_mutation_performed_by_terminalizer == false and .additional_lease_taken == false' "$OUTPUT_ROOT/execution.json" >/dev/null

      - name: Upload sealed Kukulkan terminal execution
        id: terminal_execution_artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kukulkan-terminal-execution-v1
          path: /tmp/kukulkan-terminal-execution/
          if-no-files-found: error
          retention-days: 30

      - name: Close probe PR and retire every Kukulkan ref
        env:
          TERMINAL_EXECUTION_ARTIFACT: ${{ steps.terminal_execution_artifact.outputs.artifact-id }}
          TERMINAL_EXECUTION_DIGEST: ${{ steps.terminal_execution_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          terminal_meta="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TERMINAL_EXECUTION_ARTIFACT}")"
          test "$(jq -r .expired <<<"$terminal_meta")" = false
          test "$(jq -r .name <<<"$terminal_meta")" = star-trek-kukulkan-terminal-execution-v1
          test "$(jq -r .workflow_run.id <<<"$terminal_meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .digest <<<"$terminal_meta")" = "sha256:${TERMINAL_EXECUTION_DIGEST#sha256:}"

          active=''
          for attempt in $(seq 1 360); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100")"
            active="$(jq -c --argjson self "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self and .status != "completed" and (.head_branch // "" | test("^agent/star-trek-kukulkan")))] | sort_by(.id)' <<<"$runs")"
            if test "$(jq length <<<"$active")" = 0; then break; fi
            sleep 5
          done
          if test "$(jq length <<<"$active")" != 0; then
            echo "$active" | jq .
            echo 'Kukulkan cleanup exclusivity gate remained occupied' >&2
            exit 1
          fi

          rm -rf /tmp/kukulkan-terminal-cleanup
          mkdir -p /tmp/kukulkan-terminal-cleanup
          gh api -X PATCH "/repos/${GITHUB_REPOSITORY}/pulls/952" -f state=closed > /tmp/kukulkan-terminal-cleanup/pr-close.json
          test "$(jq -r .state /tmp/kukulkan-terminal-cleanup/pr-close.json)" = closed

          git ls-remote --heads origin 'refs/heads/agent/star-trek-kukulkan*' \
            | cut -f2 \
            | sed 's#^refs/heads/##' \
            | LC_ALL=C sort -u \
            > /tmp/kukulkan-terminal-cleanup/deleted-refs.txt
          test -s /tmp/kukulkan-terminal-cleanup/deleted-refs.txt
          while IFS= read -r branch; do
            test -n "$branch" || continue
            git push origin --delete "$branch"
          done < /tmp/kukulkan-terminal-cleanup/deleted-refs.txt

          git ls-remote --heads origin 'refs/heads/agent/star-trek-kukulkan*' \
            | cut -f2 \
            | sed 's#^refs/heads/##' \
            | LC_ALL=C sort -u \
            > /tmp/kukulkan-terminal-cleanup/remaining-refs.txt
          test ! -s /tmp/kukulkan-terminal-cleanup/remaining-refs.txt
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_MAIN"
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/952" --jq .state)" = closed

          deleted_count="$(grep -c . /tmp/kukulkan-terminal-cleanup/deleted-refs.txt || true)"
          jq -n \
            --argjson version 1 \
            --arg transaction STAR-TREK-KUKULKAN-TERMINAL-CLEANUP-V1 \
            --arg status success \
            --arg product_commit "$EXPECTED_MAIN" \
            --arg product_tree "$EXPECTED_TREE" \
            --argjson workflow_run "$GITHUB_RUN_ID" \
            --argjson terminal_execution_artifact "$TERMINAL_EXECUTION_ARTIFACT" \
            --arg terminal_execution_sha256 "${TERMINAL_EXECUTION_DIGEST#sha256:}" \
            --argjson deleted_ref_count "$deleted_count" \
            --argjson pr_number 952 \
            '{version:$version,transaction:$transaction,status:$status,product:{commit:$product_commit,tree:$product_tree},workflow_run:$workflow_run,terminal_execution_artifact:$terminal_execution_artifact,terminal_execution_sha256:$terminal_execution_sha256,deleted_ref_count:$deleted_ref_count,remaining_ref_count:0,probe_pr:{number:$pr_number,state:"closed"},additional_lease_taken:false}' \
            > /tmp/kukulkan-terminal-cleanup/cleanup.json
          sha256sum /tmp/kukulkan-terminal-cleanup/* > /tmp/kukulkan-terminal-cleanup/manifest.sha256

      - name: Upload Kukulkan terminal cleanup receipt
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-kukulkan-terminal-cleanup-v1
          path: /tmp/kukulkan-terminal-cleanup/
          if-no-files-found: error
          retention-days: 30
