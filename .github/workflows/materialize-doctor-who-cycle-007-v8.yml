name: materialize-doctor-who-cycle-007-v8

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/materialize-doctor-who-cycle-007-v8.yml"
      - "tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-01"
      - "tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-02"
      - "tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-03"
      - "tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-04"
      - "tmp/doctor-who-cycle-007-v8-02-materialize.sh"
      - "tmp/doctor-who-cycle-007-v8-03-candidate.sh"

permissions:
  contents: write
  actions: read

concurrency:
  group: doctor-who-cycle-007-v8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  CARRIER_BRANCH: agent/doctor-who-cycle-007-v8-materializer
  SELF: .github/workflows/materialize-doctor-who-cycle-007-v8.yml
  FIX_02: tmp/doctor-who-cycle-007-v8-02-materialize.sh
  FIX_03: tmp/doctor-who-cycle-007-v8-03-candidate.sh
  ARCHIVE_PART_01: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-01
  ARCHIVE_PART_02: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-02
  ARCHIVE_PART_03: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-03
  ARCHIVE_PART_04: tmp/doctor-who-cycle-007-v8.tar.gz.b64.part-04
  ARCHIVE_SHA256: 406d599a071b75202e764b391fc2080435aa9f14cb565f8b643e4417620a20ce
  MANIFEST_SHA256: ba59a8c89ed462e29416d398aae6151b375d85b0d415fa23f5b69d32eedb9e54
  OUT: /tmp/doctor-who-cycle-007-v8
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-v8/payload
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-v8/context.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-v8/selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-v8/preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-v8/media-review
  CYCLE_AT: 2026-08-05T20:55:00.000Z
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-materializer'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Bind exact seven-path carrier and corrected executable payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$CYCLE_ASSET_DIR" "$SELECTION_DIR" "$PREFLIGHT_DIR" "$MEDIA_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CARRIER_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$SELF" "$FIX_02" "$FIX_03" \
            "$ARCHIVE_PART_01" "$ARCHIVE_PART_02" "$ARCHIVE_PART_03" "$ARCHIVE_PART_04" \
            | LC_ALL=C sort > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          cat "$ARCHIVE_PART_01" "$ARCHIVE_PART_02" "$ARCHIVE_PART_03" "$ARCHIVE_PART_04" > "$OUT/payload.b64"
          test "$(wc -c < "$OUT/payload.b64")" = "34576"
          base64 --decode "$OUT/payload.b64" > "$OUT/payload.tar.gz"
          test "$(sha256sum "$OUT/payload.tar.gz" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          tar -xzf "$OUT/payload.tar.gz" -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$MANIFEST_SHA256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.CYCLE_ASSET_DIR;
          const manifest = JSON.parse(fs.readFileSync(`${root}/transport-manifest.json`, 'utf8'));
          if (manifest.version !== 8 || manifest.transaction !== 'DOCTOR-WHO-CYCLE-007-KRAGAR-MATERIALIZER-V8' || manifest.exact_main !== process.env.EXACT_MAIN || manifest.attested_main !== process.env.ATTESTED_MAIN) throw new Error('V8 manifest identity drifted');
          for (const row of manifest.files) {
            const bytes = fs.readFileSync(`${root}/${row.path}`);
            if (bytes.length !== row.bytes || crypto.createHash('sha256').update(bytes).digest('hex') !== row.sha256 || row.mode !== '100755') throw new Error(`V8 member drifted: ${row.path}`);
          }
          NODE
          install -m 0755 "$FIX_02" "$CYCLE_ASSET_DIR/02-materialize.sh"
          install -m 0755 "$FIX_03" "$CYCLE_ASSET_DIR/03-candidate.sh"
          test "$(sha256sum "$CYCLE_ASSET_DIR/02-materialize.sh" | awk '{print $1}')" = "4c2c40f1cad46a2d0787f02d6395ae77f9cffcfe5316ae27009ac6f58e104fe6"
          test "$(sha256sum "$CYCLE_ASSET_DIR/03-candidate.sh" | awk '{print $1}')" = "f454636883f6e1f3fcadf5308866614acb92c83abf83ef5df2ad63775c931910"
          bash -n "$CYCLE_ASSET_DIR/02-materialize.sh"
          bash -n "$CYCLE_ASSET_DIR/03-candidate.sh"
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          node --check "$CYCLE_ASSET_DIR/prepare-inputs.mjs"
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-007.mjs"
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-007.mjs"

      - name: Checkout exact current main and prove the bounded successor
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXACT_MAIN"
          git checkout -B agent/doctor-who-cycle-007-kragar-candidate-v8
          printf '%s\n' \
            .github/workflows/apply-collection-mode.yml .github/workflows/autopilot.yml \
            .github/workflows/preserve.yml .github/workflows/publisher-custody-or-guard.yml \
            .github/workflows/publisher-custody.yml .github/workflows/ux-02a-script-runner.yml \
            PROJECT_ESTATE.json data/journal/candidates.jsonl \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology.json \
            data/review/ci-publisher-custody-baseline.json data/review/ci-publisher-custody-or-guard.json \
            docs/PUBLISHER-CUSTODY.md package.json \
            scripts/doctor-who-cycle-006-chronology-composable.mjs scripts/doctor-who-cycle-006-chronology.mjs \
            scripts/gate-fixtures.mjs scripts/publisher-custody-or-guard.mjs scripts/publisher-custody.mjs \
            test/publisher-custody-fixtures.mjs | LC_ALL=C sort > "$OUT/expected-main-drift-paths.txt"
          git diff --name-only "$ATTESTED_MAIN"..."$EXACT_MAIN" | LC_ALL=C sort > "$OUT/actual-main-drift-paths.txt"
          diff -u "$OUT/expected-main-drift-paths.txt" "$OUT/actual-main-drift-paths.txt"
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/chronology-floor.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody-floor.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard-floor.log"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Download exact cycle-007 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-selection-31023209453
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31023209453

      - name: Download exact complete cycle-007 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-preflight-31024339060
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31024339060

      - name: Download exact final Kragar media review
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-31027579331
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31027579331

      - name: Bind exact evidence and normalized inputs
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: bash "$CYCLE_ASSET_DIR/01-prepare.sh"

      - name: Materialize exact workflow-free Kragar candidate
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Run complete candidate gate and seal candidate commit
        shell: bash
        env:
          AUTHORIZED_HEAD: ${{ env.HEAD_SHA }}
        run: bash "$CYCLE_ASSET_DIR/03-candidate.sh"

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.OUT }}/candidate-*
            ${{ env.OUT }}/materialize.log
            ${{ env.OUT }}/prepared-inputs.sha256
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg

      - name: Upload candidate-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-candidate-only-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            ${{ env.OUT }}
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.CYCLE_ASSET_DIR }}/transport-manifest.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg
