name: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
  cancel-in-progress: true

jobs:
  export:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9bee98eaaddfb91f71c9a9044e40292fc30cf6b1
      BRANCH: agent/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
      SELF: .github/workflows/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1.yml
      BLOB: b97f56e951b322284ba93b9bf5d4a5c5340afd55
      GZIP_BYTES: "5498"
      GZIP_SHA256: 22116331c79c6804f6f626069b2846cb707d42717c6a0dc530ab262d45607e4e
      CARRIER_BYTES: "22584"
      CARRIER_SHA256: 9fb5f5e7b0658b364b0971fc18f54b6979bade2d71ab83047eb5b17f9d87cced
      OUT: /tmp/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Authenticate and export exact installed V6 writer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload}
          test "$CURRENT_BASE" = "$MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$MAIN...$CURRENT_HEAD" > "$OUT/api/compare.json"
          PR="$OUT/api/pr.json" COMPARE="$OUT/api/compare.json" python3 - <<'PY'
          import json,os
          from pathlib import Path
          pr=json.loads(Path(os.environ['PR']).read_text())
          compare=json.loads(Path(os.environ['COMPARE']).read_text())
          assert pr['number']==int(os.environ['CURRENT_PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CURRENT_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert len(compare['files'])==1
          assert compare['files'][0]['filename']==os.environ['SELF'] and compare['files'][0]['status']=='added'
          PY
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$BLOB" > "$OUT/api/blob.json"
          jq -r '.content' "$OUT/api/blob.json" | tr -d '\n' | base64 -d > "$OUT/payload/carrier.sh.gz"
          test "$(git hash-object --stdin < "$OUT/payload/carrier.sh.gz")" = "$BLOB"
          test "$(wc -c < "$OUT/payload/carrier.sh.gz" | tr -d ' ')" = "$GZIP_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh.gz" | awk '{print $1}')" = "$GZIP_SHA256"
          gzip -dc "$OUT/payload/carrier.sh.gz" > "$OUT/payload/carrier.sh"
          test "$(wc -c < "$OUT/payload/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$OUT/payload/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$OUT/payload/carrier.sh"
          CARRIER="$OUT/payload/carrier.sh" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          carrier=Path(os.environ['CARRIER'])
          text=carrier.read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==6
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-writer-v6-export-{index}>','exec')
          receipt={
              'status':'cycle-012-cleanup-writer-v6-source-export-complete-v1',
              'version':1,
              'carrier':{
                  'pr':int(os.environ['CURRENT_PR']),
                  'branch':os.environ['BRANCH'],
                  'head':os.environ['CURRENT_HEAD'],
                  'base':os.environ['MAIN'],
              },
              'source':{
                  'blob':os.environ['BLOB'],
                  'gzip_bytes':int(os.environ['GZIP_BYTES']),
                  'gzip_sha256':os.environ['GZIP_SHA256'],
                  'carrier_bytes':int(os.environ['CARRIER_BYTES']),
                  'carrier_sha256':os.environ['CARRIER_SHA256'],
                  'python_blocks':len(blocks),
              },
              'boundary':{
                  'source_export_only':True,
                  'writer_executed':False,
                  'repository_write':False,
                  'transport_mutation':False,
                  'canonical_mutation':False,
                  'lease_issued':False,
                  'queue_mutated':False,
                  'media_adopted':False,
                  'cycle_receipt_written':False,
                  'cycle_012_product_authority':False,
              },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          out=carrier.parent
          (out/'source-export.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'SOURCE_EXPORT_COMPLETE').write_text(receipt['identity']+'\n')
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
            test "$(cat SOURCE_EXPORT_COMPLETE)" = "$(jq -r '.identity' source-export.json)"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-cleanup-writer-v6-source-export-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-cleanup-writer-v6-source-export-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
