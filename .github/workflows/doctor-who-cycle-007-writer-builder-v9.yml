name: doctor-who-cycle-007-writer-builder-v9

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-007-writer-builder-v9.yml"

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: doctor-who-cycle-007-writer-builder-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKFLOW_PATH: .github/workflows/doctor-who-cycle-007-writer-builder-v9.yml
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  ATTESTED_MAIN: 45fc33aa8de8c01f03f006c5c01765dd1929385f
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  OUT: /tmp/doctor-who-cycle-007-writer-v9
  CYCLE_ASSET_DIR: /tmp/doctor-who-cycle-007-writer-v9/assets
  CYCLE_CONTEXT: /tmp/doctor-who-cycle-007-context-v9.json
  SELECTION_DIR: /tmp/doctor-who-cycle-007-selection
  PREFLIGHT_DIR: /tmp/doctor-who-cycle-007-preflight
  MEDIA_DIR: /tmp/doctor-who-cycle-007-media-review
  MEDIA_PREPUBLISH_DIR: /tmp/doctor-who-cycle-007-media-prepublish-verification
  CYCLE_AT: 2026-08-06T00:20:00.000Z
  TRANSPORT_B64_PAYLOAD_SHA256: aee64ffc3967ff0cbefe6e5d210c0ab0684ca8cedaca207e37cb7e1db3a1ebf7
  TRANSPORT_PARTS: "8"
  TRANSPORT_SHA256: 5eef5a5629da914a1e7cc09dd81d1a388395db746c3aef76f375fcdfa70bdf8e
  TRANSPORT_MANIFEST_SHA256: 1a63d8eaf5cdf4309389fdbc12ec893787f6a7d702092e83d7fb26af615dac75
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-writer-builder-v9'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          filter: blob:none

      - name: Bind exact current main and one-file read-only carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$CYCLE_ASSET_DIR" "$SELECTION_DIR" "$PREFLIGHT_DIR" "$MEDIA_DIR" "$MEDIA_PREPUBLISH_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          printf '%s\n' "$WORKFLOW_PATH" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test ! -e "$WORKFLOW_PATH"
          test -z "$(git status --porcelain)"
          printf 'exact_main=%s\ncarrier_head=%s\nmain_tree=%s\n' \
            "$EXACT_MAIN" "$HEAD_SHA" "$(git rev-parse "$EXACT_MAIN^{tree}")" \
            > "$OUT/main-identity.txt"

      - name: Prove current chronology and publisher custody before reconstruction
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum scripts/doctor-who-cycle-006-chronology.mjs | awk '{print $1}')" = 6f3001a95a5079cd009a731377eee72c824e1daeadcbe3f8f8d083c06833788c
          test "$(sha256sum scripts/doctor-who-cycle-006-chronology-composable.mjs | awk '{print $1}')" = d0dc13f8da17e3a531c979d7287d26d5a0d711f8ec0e95f1903ed3e815b08275
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/chronology-composable.log"
          test "$(git hash-object data/review/ci-publisher-custody-baseline.json)" = 8d233f79472fc4ec406b9d0faf1b5e13dcae2b29
          test "$(git hash-object scripts/publisher-custody.mjs)" = 619d72941fc357de74c2d6c2d9d3b6baa7b31383
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody.log"
          test "$(sha256sum data/review/ci-publisher-custody-or-guard.json | awk '{print $1}')" = 0dbc84289c4e533d80d7df0881cc211872debd850fe6c3975637b078d1be7244
          test "$(sha256sum scripts/publisher-custody-or-guard.mjs | awk '{print $1}')" = be6723ee2fc943174cb2eb5470a12beb3b83cbd64c43a5ab19592be2f0339eb3
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard.log"
          test -z "$(git status --porcelain)"

      - name: Recover, decode, and bind exact V9 writer transport
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > "$OUT/pr-comments.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const comments = JSON.parse(fs.readFileSync(`${process.env.OUT}/pr-comments.json`, 'utf8'));
          const expected = [
            {part:1, length:4800, sha256:'af9f414056d5aa0a01c7ef78eca5d63e745ddebd4c51ae9a3bbe6f751b91f1b7'},
            {part:2, length:4800, sha256:'d495c8b39169f68e0da43b4c45d2574b7400f6314fa155a40abfe5ebbbce563a'},
            {part:3, length:4800, sha256:'e457dc03860cb0b355829d4077b89279270b5eebd157ff1c749c146fa41563e4'},
            {part:4, length:4800, sha256:'3cbe136bf93cb98be2794f9b8f1659566fed43cd6264df7a1593e539f2ac8804'},
            {part:5, length:4800, sha256:'838f346d14f885c8baab8d19113c562c8652d6cdd993b171397692046b3fb332'},
            {part:6, length:4800, sha256:'b0cb3a9d6357f337c44bc636c8ddd5e8fb431f821a41bc2558da80a77be7e171'},
            {part:7, length:4800, sha256:'620e9a4a3af0b2a447c2fd07779337d77e24cfc1804721fa02e96f05c5ff60bf'},
            {part:8, length:4028, sha256:'a3d059e62032c49238d12d62731c2f16acdff067c325c2debe8bce20127bce33'},
          ];
          const found = new Map();
          for (const comment of comments) {
            const match = String(comment?.body ?? '').match(/^CYCLE007_TRANSPORT_V9_PART (\d{2})\/(\d{2}) SHA256 ([0-9a-f]{64}) LENGTH (\d+)\n([A-Za-z0-9+/=]+)$/);
            if (!match) continue;
            const part = Number(match[1]);
            if (found.has(part)) throw new Error(`duplicate V9 transport part ${part}`);
            found.set(part, {total:Number(match[2]), declaredSha:match[3], declaredLength:Number(match[4]), payload:match[5], commentId:comment.id});
          }
          if (found.size !== expected.length) throw new Error(`expected ${expected.length} V9 parts, found ${found.size}`);
          const sha = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const rows = [];
          let payload = '';
          for (const row of expected) {
            const item = found.get(row.part);
            if (!item || item.total !== expected.length || item.declaredLength !== row.length || item.payload.length !== row.length || item.declaredSha !== row.sha256 || sha(item.payload) !== row.sha256) {
              throw new Error(`V9 transport part ${row.part} failed exact length/hash custody`);
            }
            payload += item.payload;
            rows.push({part:row.part, comment_id:item.commentId, length:row.length, sha256:row.sha256});
          }
          if (sha(payload) !== process.env.TRANSPORT_B64_PAYLOAD_SHA256) throw new Error('joined V9 Base64 payload drifted');
          fs.writeFileSync(`${process.env.OUT}/transport.b64`, payload);
          fs.writeFileSync(`${process.env.OUT}/transport-comment-custody.json`, `${JSON.stringify(rows, null, 2)}\n`);
          NODE
          test "$(wc -c < "$OUT/transport.b64")" = "37628"
          base64 --decode "$OUT/transport.b64" > "$OUT/transport.tgz"
          test "$(sha256sum "$OUT/transport.tgz" | awk '{print $1}')" = "$TRANSPORT_SHA256"
          tar -xzf "$OUT/transport.tgz" -C "$CYCLE_ASSET_DIR"
          test "$(sha256sum "$CYCLE_ASSET_DIR/transport-manifest.json" | awk '{print $1}')" = "$TRANSPORT_MANIFEST_SHA256"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root = process.env.CYCLE_ASSET_DIR;
          const manifest = JSON.parse(fs.readFileSync(`${root}/transport-manifest.json`, 'utf8'));
          if (
            manifest.version !== 9 ||
            manifest.transaction !== 'DOCTOR-WHO-CYCLE-007-KRAGAR-BUILDER-V9' ||
            manifest.exact_main !== process.env.EXACT_MAIN ||
            manifest.attested_main !== process.env.ATTESTED_MAIN
          ) throw new Error('V9 transport manifest identity drifted');
          const expectedMedia = {
            run: 31057338737,
            job: 92477594681,
            artifact_id: 8950753247,
            artifact_sha256: '474449ce76e1c1a7be527d7ed4dd7bd05c450b26d7f1b6689967820514e6a11c',
            receipt_file_sha256: '10f9356a3bbf15e33ecbef6abe777429d9fa5432f6d32cbf6afb244d0237dea6',
            receipt_sha256: '053a4ec73dee0db803dfd19b38d1e403cbe14ab6a85325e54ddc0d031d19f70e',
            publication_run: 31057320555,
            publication_job: 92477536991,
            publication_artifact_id: 8950747614,
            publication_artifact_digest: 'sha256:8af2dd3a1f2162e9cf838d67534ae4a9988f56c76fb78698f31970fd6e9e0f63',
            release_id: 357150531,
            asset_id: 503222703,
            asset_name: 'uc-1352-still-f6f32eb1.jpg',
            asset_sha256: 'f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409',
          };
          if (JSON.stringify(manifest.media_prepublish_verification) !== JSON.stringify(expectedMedia)) {
            throw new Error('V9 media prepublication custody drifted');
          }
          for (const row of manifest.files) {
            const bytes = fs.readFileSync(`${root}/${row.path}`);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== row.bytes || digest !== row.sha256) throw new Error(`V9 member drifted: ${row.path}`);
          }
          NODE
          chmod +x "$CYCLE_ASSET_DIR"/*.sh "$CYCLE_ASSET_DIR"/*.mjs
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-007.mjs"
          node --check "$CYCLE_ASSET_DIR/apply-doctor-who-cycle-finalize-007.mjs"
          node --check "$CYCLE_ASSET_DIR/prepare-inputs.mjs"
          for script in "$CYCLE_ASSET_DIR"/*.sh; do bash -n "$script"; done

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies, rendered runtime, and deterministic image tooling
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Download exact cycle-007 selection packet
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-selection-31023209453
          path: ${{ env.SELECTION_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31023209453

      - name: Download exact complete cycle-007 preflight
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-preflight-31024339060
          path: ${{ env.PREFLIGHT_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31024339060

      - name: Download exact final Kragar media review
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-review-v3-31027579331
          path: ${{ env.MEDIA_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31027579331

      - name: Download exact Kragar release prepublication verification
        uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-007-kragar-media-prepublish-verification-31057338737
          path: ${{ env.MEDIA_PREPUBLISH_DIR }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: 31057338737

      - name: Bind recovered evidence and prepare normalized writer inputs
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/01-prepare.sh"

      - name: Materialize exact workflow-free Kragar candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/02-materialize.sh"

      - name: Commit and completely gate exact local candidate
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/03-candidate.sh"

      - name: Upload exact local candidate evidence
        id: candidate-upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-candidate-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.OUT }}/candidate-*
            ${{ env.OUT }}/materialize.log
            ${{ env.OUT }}/prepared-inputs.sha256
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg

      - name: Bind candidate artifact and workflow job custody
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.candidate-upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="qualify") | .id' | head -1)"
          test -n "$job_id"
          digest="${ARTIFACT_DIGEST#sha256:}"
          candidate="$(cat "$OUT/candidate-commit.txt")"
          candidate_gate="$(cat "$OUT/candidate-gate.sha256")"
          artifact_name="doctor-who-cycle-007-candidate-${GITHUB_RUN_ID}"
          test -n "$ARTIFACT_ID" -a -n "$digest" -a -n "$candidate" -a -n "$candidate_gate"
          printf 'CANDIDATE_COMMIT=%s\n' "$candidate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_GATE_SHA256=%s\n' "$candidate_gate" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_NAME=%s\n' "$artifact_name" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_SHA256=%s\n' "$digest" >> "$GITHUB_ENV"
          printf 'WORKFLOW_JOB=%s\n' "$job_id" >> "$GITHUB_ENV"
          printf 'workflow_job=%s\ncandidate_artifact_id=%s\ncandidate_artifact_sha256=%s\n' \
            "$job_id" "$ARTIFACT_ID" "$digest" > "$OUT/candidate-custody.txt"

      - name: Write reviewed cycle receipt and permanent checker
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/04-finalize.sh"

      - name: Commit and completely gate exact local final product
        shell: bash
        run: bash "$CYCLE_ASSET_DIR/05-final-gate.sh"

      - name: Upload complete cycle-007 writer qualification V9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-writer-builder-v9-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
          path: |
            ${{ env.OUT }}
            ${{ env.CYCLE_CONTEXT }}
            ${{ env.CYCLE_ASSET_DIR }}/transport-manifest.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-normalized-verification.json
            ${{ env.CYCLE_ASSET_DIR }}/kragar-still-candidate.jpg
            data/review/adapter-sdk/doctor-who-cycle-007-kragar.json
            scripts/doctor-who-cycle-007.mjs
