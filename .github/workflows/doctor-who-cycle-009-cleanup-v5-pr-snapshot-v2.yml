name: doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  BRANCH: agent/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2
  SELF: .github/workflows/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2.yml
  PREFIX: agent/doctor-who-cycle-009-
  MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
  TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
  GUARD_WORKFLOW: publisher-custody-or-guard
  SOURCE_COMMIT: d131c49fc04f26e026e1190f0108b492c55bec1a
  SOURCE_PATH: .github/workflows/doctor-who-cycle-009-cleanup-v4-guard-only.yml
  SOURCE_BLOB: 0646cc9d30f539a766ce09af5b54628abebe21a8
  SOURCE_SHA256: 686120e880f152a29e459afe8f4279d5caf329f2080bea9600544e7abe5c4029
  SOURCE_RUN: "31287552877"
  SOURCE_VERIFY_JOB: "93179029640"
  SOURCE_HEAD: 9d329e26baeb855055989a6eecf7c497a4399154
  SOURCE_ARTIFACT: "9030324989"
  SOURCE_DIGEST: 2a1998c1f2170b74cff855348cc04a9763d7774d1f970008f811447e382152aa
  SOURCE_IDENTITY: 68095b5d9928390443ec26bdbfaffdbf857609708a575193fe37d1e7110fbf43
  PROOF_IDENTITY: 105a29dd19ca3fff2264a17feae01b9eb227102e56b5d4388beab1847ebc6539

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      OUT: /tmp/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2-verify
      EVENT_PR: ${{ github.event.pull_request.number }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EVENT_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover and patch exact guarded verifier
        shell: bash
        run: |
          set -euo pipefail
          source_file=/tmp/doctor-who-cycle-009-cleanup-v5-source.yml
          verifier=/tmp/doctor-who-cycle-009-cleanup-v5-verifier.sh
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git show "$SOURCE_COMMIT:$SOURCE_PATH" > "$source_file"
          test "$(git hash-object "$source_file")" = "$SOURCE_BLOB"
          test "$(sha256sum "$source_file" | cut -d' ' -f1)" = "$SOURCE_SHA256"
          SOURCE_FILE="$source_file" DEST="$verifier" python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path(os.environ['SOURCE_FILE']).read_text()
          marker="      - name: Bind guarded carrier and successful read-only V3 settlement\n        shell: bash\n        run: |\n"
          assert source.count(marker)==1
          start=source.index(marker)+len(marker)
          end=source.find("\n      - ",start)
          assert end>start
          lines=[]
          for line in source[start:end].splitlines():
              if not line:
                  lines.append('')
              else:
                  assert line.startswith('          ')
                  lines.append(line[10:])
          script='\n'.join(lines)+'\n'
          open_token='$'+'{{'
          close_token='}}'
          replacements={
              f"export CARRIER_PR='{open_token} github.event.pull_request.number {close_token}'":"export CARRIER_PR=\"$EVENT_PR\"",
              f"export CARRIER_HEAD='{open_token} github.event.pull_request.head.sha {close_token}'":"export CARRIER_HEAD=\"$EVENT_HEAD\"",
              f"export CARRIER_BASE='{open_token} github.event.pull_request.base.sha {close_token}'":"export CARRIER_BASE=\"$EVENT_BASE\"",
              "        assert item['head']['ref']==target['branch'] and item['head']['sha']==target['sha']":"        assert item['head']['ref']==target['branch']",
          }
          for old,new in replacements.items():
              assert script.count(old)==1,old
              script=script.replace(old,new,1)
          Path(os.environ['DEST']).write_text(script)
          PY
          bash -n "$verifier"
          chmod 700 "$verifier"
          exec "$verifier"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v5-snapshot-v2-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2-verify/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v5-snapshot-v2-verify-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v5-pr-snapshot-v2-verify
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  cleanup:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      SETTLEMENT: /tmp/doctor-who-cycle-009-cleanup-v5-snapshot-v2-settlement
      OUT: /tmp/doctor-who-cycle-009-cleanup-v5-snapshot-v2-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v5-snapshot-v2-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v5-snapshot-v2-settlement

      - name: Recover and patch exact isolated writer
        shell: bash
        run: |
          set -euo pipefail
          source_file=/tmp/doctor-who-cycle-009-cleanup-v5-source.yml
          writer=/tmp/doctor-who-cycle-009-cleanup-v5-writer.sh
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git show "$SOURCE_COMMIT:$SOURCE_PATH" > "$source_file"
          test "$(git hash-object "$source_file")" = "$SOURCE_BLOB"
          test "$(sha256sum "$source_file" | cut -d' ' -f1)" = "$SOURCE_SHA256"
          SOURCE_FILE="$source_file" DEST="$writer" python3 - <<'PY'
          import os
          from pathlib import Path
          source=Path(os.environ['SOURCE_FILE']).read_text()
          marker="      - name: Reverify same-run settlement and retire frozen refs\n        shell: bash\n        run: |\n"
          assert source.count(marker)==1
          start=source.index(marker)+len(marker)
          end=source.find("\n      - ",start)
          assert end>start
          lines=[]
          for line in source[start:end].splitlines():
              if not line:
                  lines.append('')
              else:
                  assert line.startswith('          ')
                  lines.append(line[10:])
          script='\n'.join(lines)+'\n'
          old="""frozen_by={}
          for row in frozen_prs: frozen_by.setdefault(row['branch'],[]).append(row['pull_request'])"""
          new="""frozen_by={}
          frozen_pr_by_number={}
          for row in frozen_prs:
              frozen_by.setdefault(row['branch'],[]).append(row['pull_request'])
              assert row['pull_request'] not in frozen_pr_by_number
              frozen_pr_by_number[row['pull_request']]=row"""
          assert script.count(old)==1
          script=script.replace(old,new,1)
          old="pr=api(f'/repos/{repo}/pulls/{summary[\"number\"]}'); assert pr['head']['sha']==expected; before=pr['state']"
          new="pr=api(f'/repos/{repo}/pulls/{summary[\"number\"]}'); frozen_pr=frozen_pr_by_number[pr['number']]; assert pr['head']['ref']==name and pr['head']['sha']==frozen_pr['head_sha'] and pr['merged']==frozen_pr['merged']; before=pr['state']"
          assert script.count(old)==1
          script=script.replace(old,new,1)
          Path(os.environ['DEST']).write_text(script)
          PY
          bash -n "$writer"
          chmod 700 "$writer"
          exec "$writer"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v5-snapshot-v2-receipt-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v5-snapshot-v2-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-cleanup-v5-snapshot-v2-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-cleanup-v5-snapshot-v2-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
