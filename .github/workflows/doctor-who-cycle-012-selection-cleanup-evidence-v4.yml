name: doctor-who-cycle-012-selection-cleanup-evidence-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-evidence-v4
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-evidence-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      V1_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      INSTALL_PARENT: 019b43139f775b0935afd2be2f6d22c6e2494b94
      INSTALLED_MAIN: 806604f8cf14b6c1cd58ad19f39e60f4898ac759
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      WRITER_V1: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
      WRITER_V3: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
      WRITER_V4: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_OBSERVER_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      BRANCH: observer/doctor-who-cycle-012-selection-cleanup-evidence-v4
      SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-evidence-v4.yml
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4
      SOURCE_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-source
      REVIEW_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-review
      EXPORT_PACKET: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-export
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

      SOURCE_PR: "871"
      SOURCE_BRANCH: agent/doctor-who-cycle-012-senstarg-evidence-v2
      SOURCE_HEAD: 61e1acdcb13966087374de518e85dc2db9eb1ee8
      SOURCE_RUN: "31370980255"
      SOURCE_ATTEMPT: "1"
      SOURCE_JOB: "93399665207"
      SOURCE_ARTIFACT: "9056104797"
      SOURCE_ARTIFACT_NAME: doctor-who-cycle-012-senstarg-evidence-v2-31370980255-attempt-1
      SOURCE_ARTIFACT_BYTES: "229088"
      SOURCE_ARTIFACT_SHA256: 0109348293dcd1dd9ca1b1e89cf16d073ce1fa026aa8d63b1f06dcdef5651b4e
      SOURCE_ARTIFACT_FILES: "32"

      REVIEW_PR: "889"
      REVIEW_BRANCH: agent/doctor-who-cycle-012-media-review-v3
      REVIEW_HEAD: bbda688e119c551690752e8fbfa0ba3de9891140
      REVIEW_RUN: "31409488546"
      REVIEW_ATTEMPT: "1"
      REVIEW_JOB: "93523833666"
      REVIEW_ARTIFACT: "9071079520"
      REVIEW_ARTIFACT_NAME: doctor-who-cycle-012-media-review-v3-31409488546-attempt-1
      REVIEW_ARTIFACT_BYTES: "495328"
      REVIEW_ARTIFACT_SHA256: a9dd8b5c71de228e52ba69a7f7fc34d832783d1282a6df73608d5d005127d9fb
      REVIEW_ARTIFACT_FILES: "24"

      EXPORT_PR: "890"
      EXPORT_BRANCH: agent/doctor-who-cycle-012-cleanup-writer-v4-source-export-v1
      EXPORT_HEAD: 0dedafbac41551e639106ce7145f621869ac3ca0
      EXPORT_RUN: "31410379096"
      EXPORT_ATTEMPT: "1"
      EXPORT_JOB: "93526726877"
      EXPORT_ARTIFACT: "9071314383"
      EXPORT_ARTIFACT_NAME: doctor-who-cycle-012-cleanup-writer-v4-source-export-v1-31410379096-attempt-1
      EXPORT_ARTIFACT_BYTES: "29384"
      EXPORT_ARTIFACT_SHA256: d399d7e3e368c20f5049ac0ede4fd74610b73749f780452fc20c5e96af38dc7a
      EXPORT_ARTIFACT_FILES: "6"

      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      MEDIA_REVIEW_FAILURE_IDENTITY: 3b9b397ae5a3e80ecadc7bc557bb50943fbea97156abbf4beaf6e64ff1733fd4
      EXPORT_IDENTITY: 109f1c6c1beca5a4c54bbb962623af4859e63b2607041223aaa9522b2f0f6552
      TASK_ID: ap_8965086737382df0e88366db
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      CHARACTER_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      PORTRAIT_SHA256: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e
      WRITER_CARRIER_BLOB: d102afad855240ecfea45ae0b9e6f534e10ad01a

      CARRIER_BLOBS: "f10992a811d5dddf59b39b53a569bd8c795d20b3 f3a23e8de50b1537e648bd9daadc7a729a484730 efc2c6aa45bf2c02758a0b895123172b5be0d407"
      CARRIER_B64_BYTES: "8004"
      CARRIER_B64_SHA256: 54d54a2d754da7016384feeb4c28f14ec0cdd38b9fa1bdfb039f8875c6d02ee5
      CARRIER_GZIP_BYTES: "6003"
      CARRIER_GZIP_SHA256: 65467023c8d64932bed44484ef80c6ca145118c87d78f561f210f963f8b547ff
      CARRIER_BYTES: "21970"
      CARRIER_SHA256: 6dab0316f2fdb1e11efd4202f0614d3bfb7ecf618449e2ccda5a99ecc30bbc20
      CARRIER_ROOT: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-carrier

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and execute exact cleanup evidence V4 carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER_ROOT"
          mkdir -p "$CARRIER_ROOT"
          : > "$CARRIER_ROOT/carrier.sh.gz.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$CARRIER_ROOT/carrier.sh.gz.b64"
          done
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh.gz.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh.gz.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$CARRIER_ROOT/carrier.sh.gz.b64" > "$CARRIER_ROOT/carrier.sh.gz"
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$CARRIER_ROOT/carrier.sh.gz" > "$CARRIER_ROOT/carrier.sh"
          test "$(wc -c < "$CARRIER_ROOT/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$CARRIER_ROOT/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$CARRIER_ROOT/carrier.sh"
          CARRIER="$CARRIER_ROOT/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==4
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-cleanup-evidence-v4-{index}>','exec')
          PY
          chmod 700 "$CARRIER_ROOT/carrier.sh"
          "$CARRIER_ROOT/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-evidence-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-source
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-review
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-export
            /tmp/doctor-who-cycle-012-selection-cleanup-evidence-v4-carrier
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
