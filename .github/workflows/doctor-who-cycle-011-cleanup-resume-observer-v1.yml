name: doctor-who-cycle-011-cleanup-resume-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-cleanup-resume-observer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-cleanup-resume-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-cleanup-resume-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLED_MAIN: ee4bfa70f66d1d4ea5b53765497a185b5c072108
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      SOURCE_RUN: "31357281200"
      SOURCE_JOB: "93359227236"
      SOURCE_ARTIFACT: "9051083591"
      SOURCE_ARTIFACT_DIGEST: "sha256:f93b35b7dcfd43e63b87f9f88d631145ddf0672a13b5be032a4cb5c2620ddd2d"
      WRITER_V1_FILE: doctor-who-cycle-011-rastel-cleanup-writer-v1.yml
      WRITER_V2_FILE: doctor-who-cycle-011-rastel-cleanup-writer-v2.yml
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/doctor-who-cycle-011-cleanup-resume-observer-v1
      SELF: .github/workflows/doctor-who-cycle-011-cleanup-resume-observer-v1.yml
      OUT: /tmp/doctor-who-cycle-011-cleanup-resume-observer-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind observer and enumerate exact writer transactions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,jobs,artifacts,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLED_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLED_MAIN"
          test "$(git rev-list --count "$INSTALLED_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLED_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLED_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$CANONICAL_MAIN")" = "$CANONICAL_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_JOB" > "$OUT/api/source-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          CURRENT_HEAD="$head" CURRENT_BASE="$base" CURRENT_PR="$pr" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          load = lambda name: json.loads((root / name).read_text())
          own = load('observer-pr.json')
          run = load('source-run.json')
          job = load('source-job.json')
          artifact = load('source-artifact.json')
          assert own['number'] == int(os.environ['CURRENT_PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha'] == os.environ['CURRENT_BASE']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['head']['sha'] == os.environ['CURRENT_HEAD']
          assert own['commits'] == 1 and own['changed_files'] == 1
          assert run['id'] == int(os.environ['SOURCE_RUN'])
          assert run['head_branch'] == os.environ['PREFIX'] + 'cleanup-verifier-v1'
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert job['id'] == int(os.environ['SOURCE_JOB']) and job['run_id'] == int(os.environ['SOURCE_RUN'])
          assert job['name'] == 'verify' and job['status'] == 'completed' and job['conclusion'] == 'success'
          assert artifact['id'] == int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest'] == os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id'] == int(os.environ['SOURCE_RUN'])
          PY
          for file in "$WRITER_V1_FILE" "$WRITER_V2_FILE"; do
            stem="${file%.yml}"
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$file" > "$OUT/api/$stem-workflow.json"
            workflow_id="$(jq -r '.id' "$OUT/api/$stem-workflow.json")"
            test -n "$workflow_id"
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" -f per_page=100 > "$OUT/api/$stem-runs.json"
          done
          SOURCE_RUN="$SOURCE_RUN" python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          root = Path(os.environ['OUT']) / 'api'
          source = json.loads((root / 'source-run.json').read_text())
          floor = datetime.fromisoformat(source['updated_at'].replace('Z', '+00:00')) - timedelta(minutes=2)
          rows = []
          for file in [os.environ['WRITER_V1_FILE'], os.environ['WRITER_V2_FILE']]:
              stem = file[:-4]
              workflow = json.loads((root / f'{stem}-workflow.json').read_text())
              runs = json.loads((root / f'{stem}-runs.json').read_text())['workflow_runs']
              for row in runs:
                  created = datetime.fromisoformat(row['created_at'].replace('Z', '+00:00'))
                  if row['event'] != 'workflow_run' or created < floor:
                      continue
                  rows.append({
                      'writer_file': file,
                      'workflow_id': workflow['id'],
                      'workflow_path': workflow['path'],
                      'run_id': row['id'],
                      'run_number': row['run_number'],
                      'run_attempt': row['run_attempt'],
                      'status': row['status'],
                      'conclusion': row['conclusion'],
                      'head_sha': row['head_sha'],
                      'head_branch': row['head_branch'],
                      'event': row['event'],
                      'created_at': row['created_at'],
                      'updated_at': row['updated_at'],
                  })
          rows.sort(key=lambda row: (row['created_at'], row['run_id']))
          assert rows, 'no writer workflow_run transactions found after verifier success'
          (Path(os.environ['OUT']) / 'writer-runs.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          PY
          while read -r run_id; do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/jobs/$run_id.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/artifacts/$run_id.json"
          done < <(jq -r '.[].run_id' "$OUT/writer-runs.json")
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/prefix-refs.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['OUT'])
          runs = json.loads((root / 'writer-runs.json').read_text())
          enriched = []
          for run in runs:
              jobs = json.loads((root / 'jobs' / f"{run['run_id']}.json").read_text())['jobs']
              artifacts = json.loads((root / 'artifacts' / f"{run['run_id']}.json").read_text())['artifacts']
              run['jobs'] = [{
                  'id': job['id'],
                  'name': job['name'],
                  'status': job['status'],
                  'conclusion': job['conclusion'],
                  'steps': [{
                      'name': step['name'],
                      'status': step['status'],
                      'conclusion': step['conclusion'],
                      'number': step['number'],
                  } for step in job.get('steps', [])],
              } for job in jobs]
              run['artifacts'] = [{
                  'id': row['id'],
                  'name': row['name'],
                  'size_in_bytes': row['size_in_bytes'],
                  'digest': row['digest'],
                  'expired': row['expired'],
              } for row in artifacts]
              enriched.append(run)
          main = json.loads((root / 'api/main-ref.json').read_text())['object']['sha']
          refs = json.loads((root / 'api/prefix-refs.json').read_text())
          receipt = {
              'status': 'cycle-011-rastel-cleanup-writer-postfailure-observed-v1',
              'version': 1,
              'source': {
                  'run': int(os.environ['SOURCE_RUN']),
                  'job': int(os.environ['SOURCE_JOB']),
                  'artifact': int(os.environ['SOURCE_ARTIFACT']),
                  'artifact_digest': os.environ['SOURCE_ARTIFACT_DIGEST'],
              },
              'main': {
                  'live': main,
                  'installed': os.environ['INSTALLED_MAIN'],
                  'canonical': os.environ['CANONICAL_MAIN'],
                  'tree': os.environ['CANONICAL_TREE'],
              },
              'writer_runs': enriched,
              'prefix_refs': [{
                  'ref': row['ref'],
                  'sha': row['object']['sha'],
              } for row in refs],
              'boundary': {
                  'repository_write': False,
                  'canonical_mutation': False,
                  'cycle_012_lease_issued': False,
                  'cycle_012_product_authority': False,
                  'outside_human_dependency': False,
                  'owner_physical_action_required': False,
              },
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'receipt/observation.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLED_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-cleanup-resume-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-cleanup-resume-observer-v1
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
