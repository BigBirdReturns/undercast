name: doctor-who-cycle-009-dan-starkey-portrait-review-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v3.yml"

permissions: {}
concurrency:
  group: doctor-who-cycle-009-dan-starkey-portrait-review-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 2a29ca99a3cd1a455cd20ce6195076162c918edc
  BRANCH: agent/doctor-who-cycle-009-dan-starkey-portrait-review-v3
  SELF: .github/workflows/doctor-who-cycle-009-dan-starkey-portrait-review-v3.yml
  OUT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v3
  SCRIPT_ROOT: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v3-scripts
  SOURCE_WORKFLOW_BLOB: f578335476e263882ec14481118eb6d8c7838deb
  EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
  EVENT_PR: ${{ github.event.pull_request.number }}
  EVENT_BASE: ${{ github.event.pull_request.base.sha }}
  TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
  SOURCE_FINGERPRINT: 799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35
  TITLE: "File:Dan Starkey (27406944162).jpg"
  FILE_PAGE: "https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27406944162).jpg"
  THUMB_SHA256: 27d858e0f92bf1fca6515ad8f4ade64853f963ecc3f53ca9890f3825c9404149
  V1_RUN: "31241343025"
  V1_ARTIFACT: "9017107246"
  V1_DIGEST: 125ea89f15a2aedab7d2c05310171379be008a5583c71181d88389606edfdf72
  V1_HEAD: 5ccc905f50a35ff885d07efa73524b24b6b5dcc9
  FAILED_RUN: "31244204181"
  FAILED_JOB: "93069994787"
  FAILED_ARTIFACT: "9017968319"
  FAILED_ARTIFACT_DIGEST: sha256:19891e5de14cb376e6b9155d9e9947a088c47df28f9a39dff3bc4d5daec2c84e

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-dan-starkey-portrait-review-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover immutable V2 review and pay idempotent-directory defect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT" "$OUT"
          mkdir -p "$SCRIPT_ROOT"/{api,run} "$OUT"/repair
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_WORKFLOW_BLOB" > "$SCRIPT_ROOT/api/source.json"
          jq -e --arg sha "$SOURCE_WORKFLOW_BLOB" '.sha==$sha and .encoding=="base64"' "$SCRIPT_ROOT/api/source.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/api/source.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/source.yml"
          test "$(git hash-object "$SCRIPT_ROOT/source.yml")" = "$SOURCE_WORKFLOW_BLOB"

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > "$SCRIPT_ROOT/api/failed-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$FAILED_JOB" > "$SCRIPT_ROOT/api/failed-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$FAILED_ARTIFACT" > "$SCRIPT_ROOT/api/failed-artifact.json"
          jq -e --argjson run "$FAILED_RUN" '.id==$run and .status=="completed" and .conclusion=="failure"' "$SCRIPT_ROOT/api/failed-run.json" >/dev/null
          jq -e --argjson job "$FAILED_JOB" --argjson run "$FAILED_RUN" '.id==$job and .run_id==$run and .status=="completed" and .conclusion=="failure"' "$SCRIPT_ROOT/api/failed-job.json" >/dev/null
          jq -e --argjson id "$FAILED_ARTIFACT" --arg digest "$FAILED_ARTIFACT_DIGEST" --argjson run "$FAILED_RUN" '.id==$id and .expired==false and .digest==$digest and .workflow_run.id==$run' "$SCRIPT_ROOT/api/failed-artifact.json" >/dev/null

          SOURCE="$SCRIPT_ROOT/source.yml" TARGET="$SCRIPT_ROOT/run" ruby <<'RUBY'
          require 'yaml'
          doc=YAML.safe_load(File.read(ENV.fetch('SOURCE')), aliases: true)
          expected=[
            'Bind exact read-only carrier and current boundary',
            'Verify V1 packet and recover exact licensed original',
            'Create and seal reviewed portrait derivative',
          ]
          rows=doc.fetch('jobs').fetch('review').fetch('steps').select{|step| expected.include?(step['name'])}
          abort 'unexpected immutable V2 review program' unless rows.map{|step| step['name']}==expected && rows.all?{|step| step['run'].is_a?(String)}
          rows.each_with_index do |row,index|
            file=File.join(ENV.fetch('TARGET'),format('%02d.sh',index+1))
            File.write(file,row.fetch('run'))
            File.chmod(0755,file)
          end
          RUBY

          SCRIPT="$SCRIPT_ROOT/run/01.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['SCRIPT']); lines=path.read_text().splitlines()
          specs=[
            (lambda s: s.startswith("head='$") and 'pull_request.head.sha' in s and 'pull_request.number' in s, 'head="$EVENT_HEAD"; pr="$EVENT_PR"'),
            (lambda s: s.startswith("test '$") and 'pull_request.base.sha' in s and s.endswith(" = \"$EXACT_MAIN\""), 'test "$EVENT_BASE" = "$EXACT_MAIN"'),
          ]
          for predicate,replacement in specs:
            hits=[i for i,line in enumerate(lines) if predicate(line.strip())]
            assert len(hits)==1 and hits[0]<30,(replacement,hits)
            indent=lines[hits[0]][:len(lines[hits[0]])-len(lines[hits[0]].lstrip())]
            lines[hits[0]]=indent+replacement
          path.write_text('\n'.join(lines)+'\n')
          PY

          SCRIPT="$SCRIPT_ROOT/run/02.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['SCRIPT']); text=path.read_text()
          old="root=pathlib.Path(os.environ['ROOT']); target=root/'diagnostic'; target.mkdir()"
          new="root=pathlib.Path(os.environ['ROOT']); target=root/'diagnostic'; target.mkdir(exist_ok=True)"
          assert text.count(old)==1,text.count(old)
          path.write_text(text.replace(old,new))
          PY

          for script in "$SCRIPT_ROOT"/run/*.sh; do bash -n "$script"; done
          grep -F 'target.mkdir(exist_ok=True)' "$SCRIPT_ROOT/run/02.sh" >/dev/null
          grep -F 'head="$EVENT_HEAD"; pr="$EVENT_PR"' "$SCRIPT_ROOT/run/01.sh" >/dev/null
          sha256sum "$SCRIPT_ROOT"/run/*.sh > "$OUT/repair/recovered-programs.sha256"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          receipt={'version':1,'status':'portrait-review-idempotent-directory-repaired','canonical_main':os.environ['EXACT_MAIN'],'source_workflow_blob':os.environ['SOURCE_WORKFLOW_BLOB'],'failed_run':int(os.environ['FAILED_RUN']),'failed_job':int(os.environ['FAILED_JOB']),'failed_artifact':int(os.environ['FAILED_ARTIFACT']),'failed_artifact_digest':os.environ['FAILED_ARTIFACT_DIGEST'],'defect':'precreated diagnostic directory reopened without exist_ok','replacement':'target.mkdir(exist_ok=True)','queue_mutated':False,'lease_issued':False,'media_adopted':False,'repository_write':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'repair/repair-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Bind exact V3 carrier and current boundary
        shell: bash
        run: bash "$SCRIPT_ROOT/run/01.sh"

      - name: Recover exact licensed original
        shell: bash
        run: bash "$SCRIPT_ROOT/run/02.sh"

      - name: Create and seal reviewed portrait derivative
        shell: bash
        run: bash "$SCRIPT_ROOT/run/03.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v3/packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-dan-starkey-portrait-review-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v3
            /tmp/doctor-who-cycle-009-dan-starkey-portrait-review-v3-scripts
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
