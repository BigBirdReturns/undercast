name: doctor-who-cycle-012-senstarg-modality-adjudication-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-modality-adjudication-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-modality-adjudication-v2
  cancel-in-progress: true

jobs:
  adjudicate:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-modality-adjudication-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_BLOB: 663122393fceb34b19c0f986992e4989a442d939
      CONTROLLER_GZIP_BYTES: "6461"
      CONTROLLER_GZIP_SHA256: 035a372d0aff2ba93ee4c208c2320d75fd4010303821c95dd7a6e4600adce636
      CONTROLLER_BYTES: "21625"
      CONTROLLER_SHA256: 8c6bc2b4eceefdfd43fd1afa4c0a8d5b5392adacd3c49bcf07a328881060f6bd
      ROOT: /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2-controller
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute current-main Senstarg modality adjudication
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CONTROLLER_BLOB" --jq '.content' |
            tr -d '\n' |
            base64 -d > "$ROOT/controller.sh.gz"
          test "$(wc -c < "$ROOT/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$ROOT/controller.sh.gz" > "$ROOT/controller.sh"
          test "$(wc -c < "$ROOT/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$ROOT/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$ROOT/controller.sh"

          CONTROLLER="$ROOT/controller.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CONTROLLER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==2
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-senstarg-modality-adjudication-v2-{index}>','exec')
          PY

          chmod 700 "$ROOT/controller.sh"
          "$ROOT/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-modality-adjudication-v2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-modality-adjudication-v2-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2-blueprint
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2-review
            /tmp/doctor-who-cycle-012-senstarg-modality-adjudication-v2-controller
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
