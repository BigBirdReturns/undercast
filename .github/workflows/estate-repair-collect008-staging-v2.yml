name: estate-repair-collect008-staging-v2

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect008-staging-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect008-staging-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ADOPTION_WORKFLOW: .github/workflows/estate-adopt-current-null-lane-008.yml
  FAILED_REPAIR: .github/workflows/estate-repair-collect008-staging.yml
  EXECUTOR: scripts/estate-adopt-current-null-lane-008.mjs

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$FAILED_REPAIR"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Replace only the brittle staging path comparison
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/estate-adopt-current-null-lane-008.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
                    test -n "$CHANGED"
                    ACTUAL_IMAGES="$(printf '%s\\n' "$CHANGED" | grep '^images/' | sort || true)"
                    test "$ACTUAL_IMAGES" = "$(cat /tmp/COLLECT-008-expected-images.txt)"
                    while IFS= read -r changed_path; do
                      case "$changed_path" in
                        data/*|records/*) ;;
                        images/*) grep -Fxq "$changed_path" /tmp/COLLECT-008-expected-images.txt ;;
                        *) echo "Unexpected COLLECT-008 candidate path: $changed_path" >&2; exit 1 ;;
                      esac
                    done <<< "$CHANGED"'''
          new = '''          git diff --name-only -z > /tmp/COLLECT-008-tracked-paths.zlist
                    git ls-files --others --exclude-standard -z > /tmp/COLLECT-008-untracked-paths.zlist
                    node --input-type=module - \\
                      /tmp/COLLECT-008-expected-images.txt \\
                      /tmp/COLLECT-008-tracked-paths.zlist \\
                      /tmp/COLLECT-008-untracked-paths.zlist <<'NODE'
                    import fs from 'node:fs';
                    const expectedImages = fs.readFileSync(process.argv[2], 'utf8').split(/\\r?\\n/).filter(Boolean).sort();
                    const readZ = (file) => fs.readFileSync(file).toString('utf8').split('\\0').filter(Boolean);
                    const paths = [...new Set([...readZ(process.argv[3]), ...readZ(process.argv[4])])].sort();
                    if (!paths.length) throw new Error('COLLECT-008 candidate produced no changed paths');
                    const actualImages = paths.filter((file) => file.startsWith('images/')).sort();
                    if (JSON.stringify(actualImages) !== JSON.stringify(expectedImages)) {
                      throw new Error(`COLLECT-008 image path mismatch\\nexpected=${expectedImages.join(',')}\\nactual=${actualImages.join(',')}`);
                    }
                    const unexpected = paths.filter((file) => !file.startsWith('data/') && !file.startsWith('records/') && !expectedImages.includes(file));
                    if (unexpected.length) throw new Error(`COLLECT-008 candidate escaped product boundary: ${unexpected.join(', ')}`);
                    if (!paths.includes('data/specimens.json') || !paths.includes('data/SOURCES.json')) throw new Error('canonical ledgers were not changed');
                    console.log(`PASS — ${paths.length} changed paths include 24 exact images and remain inside data/, records/, and the ruled destination set`);
                    NODE'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'focused staging repair expected one match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prove focused repair and complete 24-object denominator
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          node scripts/estate-canonical-adoption-ledger.mjs
          node "$EXECUTOR" | tee /tmp/COLLECT-008-staging-v2-preflight.json
          test "$(node -p "require('/tmp/COLLECT-008-staging-v2-preflight.json').authorized")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-staging-v2-preflight.json').pending")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-staging-v2-preflight.json').already_adopted")" = "0"
          grep -Fq 'git diff --name-only -z' "$ADOPTION_WORKFLOW"
          grep -Fq 'git ls-files --others --exclude-standard -z' "$ADOPTION_WORKFLOW"
          grep -Fq 'source.fetched_at = String(now).slice(0, 10);' "$EXECUTOR"

      - name: Retire both repair surfaces and stage exact workflow change
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect008-staging-v2.yml "$FAILED_REPAIR"
          git add -- "$ADOPTION_WORKFLOW"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' \
            '.github/workflows/estate-repair-collect008-staging-v2.yml' \
            "$FAILED_REPAIR" \
            "$ADOPTION_WORKFLOW" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-008-staging-v2-repair.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-008-staging-v2-repair.tree)" = "$(git write-tree)"
          node "$EXECUTOR" > /tmp/COLLECT-008-staging-v2-postgate.json
          test "$(node -p "require('/tmp/COLLECT-008-staging-v2-postgate.json').pending")" = "24"

      - name: Publish exact repaired workflow under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: make COLLECT-008 staging path census NUL-safe' \
            -m 'transaction=COLLECT-008' \
            -m 'porcelain_string_comparison=retired' \
            -m 'source_freshness_repair=retained' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "repair_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-008-staging-v2-repair.tree)"
          REPAIR_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$REPAIR_HEAD" >> "$GITHUB_OUTPUT"

      - name: Report focused staging repair
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-008 focused staging repair passed every gate on workflow run ${GITHUB_RUN_ID}. Repair head: ${{ steps.publish.outputs.head }}. The failed broad repair was retired; only the porcelain path census changed. No canonical media changed."

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-008 focused staging repair failed closed on workflow run ${GITHUB_RUN_ID}. No canonical payment claim is authorized."

      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-008-staging-v2-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-008-staging-v2-preflight.json
            /tmp/COLLECT-008-staging-v2-postgate.json
            /tmp/COLLECT-008-staging-v2-repair.tree
          if-no-files-found: warn
          retention-days: 30
