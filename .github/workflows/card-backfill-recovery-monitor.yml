name: card-backfill-recovery-monitor

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/card-backfill/RECOVERY-MONITOR.json'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Expose the latest artifact-recovery run without branch mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rows=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow card-backfill-source-v3-wave-recover-v2.yml \
            --branch "$GITHUB_REF_NAME" \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,createdAt,event,displayTitle)
          echo "$rows" | jq .
          count=$(jq 'length' <<<"$rows")
          if [ "$count" -eq 0 ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context='card-backfill/recovery-monitor' \
              -f description='no artifact-recovery workflow run found'
            exit 1
          fi
          run_id=$(jq -r '.[0].databaseId' <<<"$rows")
          status=$(jq -r '.[0].status' <<<"$rows")
          conclusion=$(jq -r '.[0].conclusion // ""' <<<"$rows")
          head=$(jq -r '.[0].headSha' <<<"$rows")
          state=pending
          if [ "$status" = completed ]; then
            if [ "$conclusion" = success ]; then state=success; else state=failure; fi
          fi
          description="recovery run ${run_id}: ${status}${conclusion:+/${conclusion}}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='card-backfill/recovery-monitor' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          echo "RECOVERY_RUN_ID=$run_id"
          echo "RECOVERY_STATUS=$status"
          echo "RECOVERY_CONCLUSION=$conclusion"
          echo "RECOVERY_HEAD=$head"
          echo 'canonical_mutation=false'
