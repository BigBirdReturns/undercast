name: card-backfill-activate-source-policy-v4

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-activate-source-policy-v4.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-source-policy-v4-activation-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      ACTIVATION_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind the one-shot activation head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACTIVATION_HEAD"
          echo "PASS — source-policy-v4 activation bound to $ACTIVATION_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/card-backfill-runtime
        with:
          profile: local-desk

      - name: Install complete rendered-gate runtime
        run: npx playwright install --with-deps chromium

      - name: Construct policy v4 without source transport
        run: |
          set -euo pipefail
          node scripts/card-backfill-activate-source-policy-v4.mjs
          rm scripts/card-backfill-activate-source-policy-v4.mjs
          rm .github/workflows/card-backfill-activate-source-policy-v4.yml
          echo 'PASS — one-shot activation machinery retired before publication'

      - name: Stage and prove the exact policy transaction
        run: |
          set -euo pipefail
          git add -A -- \
            .github/CARD-BACKFILL-AMORTIZATION-ACTIVE.json \
            .github/CARD-BACKFILL-COHORT.json \
            .github/CARD-BACKFILL-LESSONS.json \
            .github/CARD-BACKFILL-SOURCE-POLICY-V4.json \
            .github/workflows/card-backfill-activate-source-policy-v4.yml \
            .github/workflows/card-backfill-amortized-wave.yml \
            docs/CARD-BACKFILL-SOURCE-POLICY-V4.md \
            package.json \
            scripts/card-backfill-activate-source-policy-v4.mjs \
            scripts/card-backfill-amortization-fixtures.mjs \
            scripts/card-backfill-local-adjudicate-fixtures.mjs \
            scripts/card-backfill-local-adjudicate.mjs \
            scripts/card-backfill-source-policy-v2-fixtures.mjs \
            scripts/card-backfill-source-policy-v4-fixtures.mjs \
            scripts/card-backfill-source-v2.mjs \
            scripts/card-backfill-source-v3-wave-plan.mjs \
            scripts/lib/card-backfill-source-policy-v2.mjs \
            scripts/lib/card-backfill-source-policy-v3-preserved.mjs \
            scripts/lib/card-backfill-source-policy-v3.mjs
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-policy-v4-paths.txt"
          cat > "$RUNNER_TEMP/expected-policy-v4-paths.txt" <<'PATHS'
          .github/CARD-BACKFILL-AMORTIZATION-ACTIVE.json
          .github/CARD-BACKFILL-COHORT.json
          .github/CARD-BACKFILL-LESSONS.json
          .github/CARD-BACKFILL-SOURCE-POLICY-V4.json
          .github/workflows/card-backfill-activate-source-policy-v4.yml
          .github/workflows/card-backfill-amortized-wave.yml
          docs/CARD-BACKFILL-SOURCE-POLICY-V4.md
          package.json
          scripts/card-backfill-activate-source-policy-v4.mjs
          scripts/card-backfill-amortization-fixtures.mjs
          scripts/card-backfill-local-adjudicate-fixtures.mjs
          scripts/card-backfill-local-adjudicate.mjs
          scripts/card-backfill-source-policy-v2-fixtures.mjs
          scripts/card-backfill-source-policy-v4-fixtures.mjs
          scripts/card-backfill-source-v2.mjs
          scripts/card-backfill-source-v3-wave-plan.mjs
          scripts/lib/card-backfill-source-policy-v2.mjs
          scripts/lib/card-backfill-source-policy-v3-preserved.mjs
          scripts/lib/card-backfill-source-policy-v3.mjs
          PATHS
          diff -u "$RUNNER_TEMP/expected-policy-v4-paths.txt" "$RUNNER_TEMP/actual-policy-v4-paths.txt"
          echo 'PASS — policy-v4 transaction path denominator is exact'

      - name: Prove inherited law, v4 binding, replay suppression, and independent judgment
        run: |
          set -euo pipefail
          node --check scripts/lib/card-backfill-source-policy-v2.mjs
          node --check scripts/lib/card-backfill-source-policy-v3.mjs
          node --check scripts/card-backfill-source-v2.mjs
          node --check scripts/card-backfill-local-adjudicate.mjs
          node --check scripts/card-backfill-source-v3-wave-plan.mjs
          node scripts/card-backfill-source-policy-v2-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-fixtures.mjs
          node scripts/card-backfill-source-policy-v4-fixtures.mjs
          node scripts/card-backfill-source-policy-v3-live-regressions.mjs
          node scripts/card-backfill-local-adjudicate-fixtures.mjs
          node scripts/card-backfill-attempt-index-fixtures.mjs
          node scripts/card-backfill-wave-fixtures.mjs
          node scripts/card-backfill-amortization-fixtures.mjs
          node scripts/card-backfill-lessons.mjs validate --out "$RUNNER_TEMP/source-policy-v4-lessons.json"

      - name: Prove the first v4 wave exists before spending transport
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/source-policy-v4-plan"
          node scripts/card-backfill-source-v3-wave-plan.mjs \
            --control .github/CARD-BACKFILL-COHORT.json \
            --out "$out" \
            --batch-limit 40 \
            --wave-batches 4 \
            --workers-per-batch 4
          node --input-type=module - "$out/wave.json" "$out/estate.json" <<'NODE'
          import fs from 'node:fs';
          const [wavePath, estatePath] = process.argv.slice(2);
          const wave = JSON.parse(fs.readFileSync(wavePath, 'utf8'));
          const estate = JSON.parse(fs.readFileSync(estatePath, 'utf8'));
          if (wave.source_policy_id !== 'card-backfill-policy-v4-exact-pageimage-1') throw new Error('v4 policy id drift');
          if (wave.source_policy_version !== 4 || wave.source_policy_revision !== 0) throw new Error('v4 version drift');
          if (wave.selected_count < 1 || wave.selected_count > 160) throw new Error(`invalid first v4 wave size ${wave.selected_count}`);
          if (new Set(wave.disjoint_obligation_ids).size !== wave.selected_count) throw new Error('v4 wave is not disjoint');
          if (estate.counts.ready < wave.selected_count) throw new Error('v4 estate/wave cardinality drift');
          if (wave.canonical_mutation !== false || wave.artifact_only !== true) throw new Error('v4 mutation boundary drift');
          console.log(`PASS — first v4 wave is ready: selected=${wave.selected_count}; eligible=${estate.counts.ready}; batches=${wave.wave_batches}`);
          NODE

      - name: Run the complete repository gate against the staged transaction
        run: |
          set -euo pipefail
          npm run gate 2>&1 | tee "$RUNNER_TEMP/source-policy-v4-gate.log"

      - name: Commit, push, and rearm the unattended supervisor
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill-policy-v4'
          git config user.email 'undercast-card-backfill-policy-v4@users.noreply.github.com'
          git commit -m 'Card backfill: activate exact lead page-image source policy v4'
          remote_head=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          if [ "$remote_head" != "$ACTIVATION_HEAD" ]; then
            echo "branch moved from activation head $ACTIVATION_HEAD to $remote_head; refusing stale policy push" >&2
            exit 1
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          final_head=$(git rev-parse HEAD)
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f reason=source-policy-v4-activated
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${final_head}" \
            -f state=success \
            -f context='card-backfill/source-policy-v4' \
            -f description='v4 exact lead page-image policy activated; first disjoint wave rearmed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-backfill-source-policy-v4-activation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/actual-policy-v4-paths.txt
            ${{ runner.temp }}/expected-policy-v4-paths.txt
            ${{ runner.temp }}/source-policy-v4-lessons.json
            ${{ runner.temp }}/source-policy-v4-plan
            ${{ runner.temp }}/source-policy-v4-gate.log
          if-no-files-found: warn
          retention-days: 90

      - name: Publish observable activation failure
        if: failure()
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${ACTIVATION_HEAD}" \
            -f state=failure \
            -f context='card-backfill/source-policy-v4' \
            -f description="run ${GITHUB_RUN_ID}: activation failed before a policy-v4 production commit" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
