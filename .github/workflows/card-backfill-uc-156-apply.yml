name: card-backfill-uc-156-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-156-APPLY.json"
      - "scripts/card-backfill-uc-156-apply.part-00.mjs"
      - "scripts/card-backfill-uc-156-apply.part-01.mjs"
      - ".github/workflows/card-backfill-uc-156-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-156-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-034'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-034
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed UC-156 packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-156-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-156');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-156');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ef9fd830f381c8876701a0ba');
          if(row.version!==1||row.record_id!=='UC-156'||row.kind!=='voice'||row.actor!=='Nicholas Briggs'||row.character!=='The voice of the Daleks & Cybermen'||row.production!=='Doctor Who (2005– )'||row.years!=='2005–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-156 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8712085173||row.render_artifact?.head_sha!=='9f27c7a57bc64e6e9e6ff7a306022c7435f995da'||row.render_artifact?.zip_sha256!=='cc71d9ff0e786eb85f1777e3961e93ecf33a86894fc6c7e23f89816d396b29e6')throw new Error('UC-156 render custody drift');
          if(row.expected?.dalek_source?.sha256!=='518ed11a1e9a881517fa30ac07b8d18157c92bf099552b6b5308621e3919ab9f'||row.expected?.cyberman_source?.sha256!=='413c79e2825bc588efb3341625976da9cb9045ff319850bdcc434b595d4c4ec4')throw new Error('UC-156 role source authorization drift');
          if(row.expected?.exact_voice_record?.sha256!=='9196d5a96051ce32f74daf5fc5f3d5883eef691bde1c4b554293d2cf9e89f707'||row.expected?.candidate?.sha256!=='26be7407fe5abde27ca191d729f6a56baead42f4d0d5b80b90f102530eb39216'||row.expected?.crop_preview?.sha256!=='f696b66b302d5c02d77733ddd50c3b6999da9107c27af983fecfcfdb8dbfeae4')throw new Error('UC-156 candidate or exact-voice authorization drift');
          if(row.expected?.packet_file_count!==14||row.expected?.duplicate_item_count!==4||row.expected?.duplicate_repository_hash_count!==2070||row.expected?.selected_asset_count!==2||row.expected?.discovery_candidate_count!==2||row.expected?.failed_discovery_checkpoint_count!==1||row.expected?.focused_page_receipt_count!==4)throw new Error('UC-156 packet denominator drift');
          if(row.ruling?.identity!=='expected-subjects'||row.ruling?.presentation!=='two-role-dalek-cyberman-voice-composite'||row.ruling?.crop_ruling!=='pass-two-panel-centered-contain-layout'||row.ruling?.chronology_ruling!=='pass-2005-dalek-start-and-2006-cyberman-credit'||row.ruling?.operator_separation_ruling!=='pass-voice-credit-separated-from-visible-operators-and-suit-performers'||row.ruling?.screenshot_repair_ruling!=='pass-four-distinct-term-focused-page-receipts'||row.ruling?.portrait_separation_ruling!=='pass-existing-performer-portrait-unchanged'||row.ruling?.canonical_mutation!==false)throw new Error('UC-156 ruling drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Nicholas Briggs'||specimen.character!=='The voice of the Daleks & Cybermen'||specimen.production!=='Doctor Who (2005– )'||specimen.years!=='2005–'||specimen.still||specimen.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-156'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-156 audit boundary drift');
          console.log(`PASS — UC-156 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8712085173/zip" > "$root/render.zip"
          echo "cc71d9ff0e786eb85f1777e3961e93ecf33a86894fc6c7e23f89816d396b29e6  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-156"
          test -f "$base/manifest.json"
          echo "007fff32f33d1cf8acf180a00db09d49c7cde9075fc49053055cf8b081e94ea3  $base/manifest.json" | sha256sum -c -
          echo "21f53c688d7785b37b748f545faa5c364f30cef09a8c2619c09abeacf8161a46  $base/duplicate-scan.json" | sha256sum -c -
          echo "289ed2e3c0b64ad4bd91e79d92a59c6ad95606d3dfb02015f097f49e5accb689  $base/review.json" | sha256sum -c -
          echo "958031e832a1161d7c8b44f0905562b6eaa708648295268e41e23c5a92b43288  $base/review.md" | sha256sum -c -
          echo "cb66117d850d7ca6d2694d7ac8dc1cc84b62f8b8295b4b358cd4ba04554a9b1e  $base/SHA256SUMS" | sha256sum -c -
          echo "9196d5a96051ce32f74daf5fc5f3d5883eef691bde1c4b554293d2cf9e89f707  $base/exact-voice-record.json" | sha256sum -c -
          echo "518ed11a1e9a881517fa30ac07b8d18157c92bf099552b6b5308621e3919ab9f  $base/dalek-original.jpg" | sha256sum -c -
          echo "413c79e2825bc588efb3341625976da9cb9045ff319850bdcc434b595d4c4ec4  $base/cyberman-original.jpg" | sha256sum -c -
          echo "6e585732af0f120f3e739546dca9d8efd47d7fff471c47733bd29ed4cb807fe8  $base/source-page-doctorwho-dalek-2005.png" | sha256sum -c -
          echo "1564f1df9d4f02517cb72204863d7322dd01cd8059424504a07410cd82dd3ceb  $base/source-page-doctorwho-army-of-ghosts-2006.png" | sha256sum -c -
          echo "56f830aa2fe0f445164e0cd3cf8e1c6ddbdf3f3e80a2b0470fadf95a1ed78252  $base/source-page-doctorwho-daleks-character.png" | sha256sum -c -
          echo "aa28227db8ea81bfb1367ddde9ba09c02c32e5037a04d1cc487d368454aee742  $base/source-page-doctorwho-cybermen-character.png" | sha256sum -c -
          echo "26be7407fe5abde27ca191d729f6a56baead42f4d0d5b80b90f102530eb39216  $base/uc-156-still-candidate.jpg" | sha256sum -c -
          echo "f696b66b302d5c02d77733ddd50c3b6999da9107c27af983fecfcfdb8dbfeae4  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30421516688
          artifact_id=8712085173
          artifact_name=card-backfill-uc-156-render-30421516688
          artifact_zip_sha256=cc71d9ff0e786eb85f1777e3961e93ecf33a86894fc6c7e23f89816d396b29e6
          artifact_head_sha=9f27c7a57bc64e6e9e6ff7a306022c7435f995da
          source_manifest_sha256=007fff32f33d1cf8acf180a00db09d49c7cde9075fc49053055cf8b081e94ea3
          source_sums_sha256=cb66117d850d7ca6d2694d7ac8dc1cc84b62f8b8295b4b358cd4ba04554a9b1e
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-156-apply/source/output/UC-156
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-apply"
          cat scripts/card-backfill-uc-156-apply.part-00.mjs scripts/card-backfill-uc-156-apply.part-01.mjs > "$root/apply.mjs"
          echo "validator $(sha256sum "$root/apply.mjs" | cut -d" " -f1)"
          node --check "$root/apply.mjs"
          node "$root/apply.mjs" materialize 2>&1 | tee "$root/materialize.log"
          node "$root/apply.mjs" validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-156');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-156');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_ef9fd830f381c8876701a0ba');
          if(!specimen||specimen.still||specimen.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 specimen was canonically mutated');
          if(source?.still||source?.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-156'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-156 audit disposition was canonically mutated');
          console.log('PASS — UC-156 still remains canonically absent; existing Nicholas Briggs portrait remains unchanged; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-156.json \
            .github/CARD-BACKFILL-UC-156-DISCOVER.json \
            .github/CARD-BACKFILL-UC-156-DISCOVER-FAILURES.json \
            .github/CARD-BACKFILL-UC-156-RENDER.json \
            .github/CARD-BACKFILL-UC-156-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-156-scope.yml \
            .github/workflows/card-backfill-uc-156-discover.yml \
            .github/workflows/card-backfill-uc-156-render.yml \
            .github/workflows/card-backfill-uc-156-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-156-scope.mjs \
            scripts/card-backfill-uc-156-discover.mjs \
            scripts/card-backfill-uc-156-discover-repair.py \
            scripts/card-backfill-uc-156-render.part-00.mjs \
            scripts/card-backfill-uc-156-render.part-01.mjs \
            scripts/card-backfill-uc-156-apply.part-00.mjs \
            scripts/card-backfill-uc-156-apply.part-01.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-156 Nicholas Briggs Dalek and Cyberman still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-033
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-033 HEAD)
          test "${#changed[@]}" -eq 14
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-156/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-156-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-034
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-156-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip" "$root/apply.mjs"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-156-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-156-apply
            data/review/card-backfill/UC-156
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
