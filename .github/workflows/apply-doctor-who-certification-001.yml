name: apply-doctor-who-certification-001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-doctor-who-certification-001.yml"

permissions:
  contents: write

concurrency:
  group: apply-doctor-who-certification-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  SELF: .github/workflows/apply-doctor-who-certification-001.yml
  CERTIFICATIONS: data/AUTOPILOT-CERTIFICATIONS.json
  JOURNAL: data/journal/autopilot.jsonl

jobs:
  certify:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch and freeze non-activation authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

          sha256sum \
            data/AUTOPILOT-SCOPES.json \
            data/ESTATE-REGISTRY.json \
            data/CENSUS-ADAPTERS.json \
            data/CENSUS-COVERAGE.json \
            data/CENSUS-MANIFEST.json \
            > /tmp/doctor-who-certification-frozen.sha256

          node - <<'NODE'
          const fs = require('fs');
          const scopes = JSON.parse(fs.readFileSync('data/AUTOPILOT-SCOPES.json', 'utf8'));
          const rows = Array.isArray(scopes) ? scopes : scopes.scopes;
          const doctor = rows.find((row) => row.id === 'doctor-who');
          if (!doctor) throw new Error('Doctor Who scope is missing');
          if (doctor.status !== 'paused') throw new Error(`Doctor Who must enter certification paused, found ${doctor.status}`);
          const state = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const inFlight = (state.jobs || []).filter((job) => job.scope === 'doctor-who' && ['leased', 'drafted', 'merged'].includes(job.status));
          if (inFlight.length) throw new Error(`Doctor Who has ${inFlight.length} in-flight job(s)`);
          NODE

      - name: Prove the exact producer and issue a paused certificate
        run: |
          set -euo pipefail
          node scripts/census-doctor-who-fixtures.mjs
          node scripts/census-adapter.mjs check
          node scripts/autopilot.mjs certify \
            --scope doctor-who \
            --reviewed-by chatgpt-second-desk
          node scripts/autopilot.mjs validate
          node scripts/autopilot.mjs readiness --scope doctor-who --json > /tmp/doctor-who-readiness.json

          sha256sum -c /tmp/doctor-who-certification-frozen.sha256

          node - <<'NODE'
          const fs = require('fs');
          const scopes = JSON.parse(fs.readFileSync('data/AUTOPILOT-SCOPES.json', 'utf8'));
          const rows = Array.isArray(scopes) ? scopes : scopes.scopes;
          const doctor = rows.find((row) => row.id === 'doctor-who');
          if (doctor?.status !== 'paused') throw new Error('certification changed Doctor Who activation state');

          const certs = JSON.parse(fs.readFileSync('data/AUTOPILOT-CERTIFICATIONS.json', 'utf8'));
          const text = JSON.stringify(certs);
          if (!text.includes('doctor-who')) throw new Error('Doctor Who certificate was not written');
          if (!text.includes('chatgpt-second-desk')) throw new Error('second-desk custody was not written');

          const readiness = JSON.parse(fs.readFileSync('/tmp/doctor-who-readiness.json', 'utf8'));
          const candidates = Array.isArray(readiness) ? readiness : readiness.readiness || readiness.scopes || [];
          const row = candidates.find?.((item) => item.scope_id === 'doctor-who' || item.id === 'doctor-who');
          if (row && (row.effective_status === 'active' || row.lease_token)) {
            throw new Error('paused certification acquired active lease authority');
          }
          NODE

      - name: Smoke the complete paused-certification candidate
        run: |
          set -euo pipefail
          git rm "$SELF"
          git add "$CERTIFICATIONS" "$JOURNAL"
          git diff --cached --check

          git diff --cached --name-only | sort > /tmp/staged-paths.txt
          printf '%s\n' "$SELF" "$CERTIFICATIONS" "$JOURNAL" | sort > /tmp/expected-staged-paths.txt
          diff -u /tmp/expected-staged-paths.txt /tmp/staged-paths.txt

          npm run gate 2>&1 | tee /tmp/doctor-who-certification-gate.log

      - name: Publish the workflow-free certificate under exact-head lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          diff -u /tmp/expected-staged-paths.txt <(git diff --cached --name-only | sort)

          node scripts/autopilot.mjs validate
          node scripts/census-adapter.mjs check
          sha256sum -c /tmp/doctor-who-certification-frozen.sha256

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-doctor-who-certification
          git config user.email undercast-doctor-who-certification@users.noreply.github.com
          git commit \
            -m 'Adapter SDK: certify Doctor Who while paused' \
            -m 'bind the source-specific producer and current source snapshot' \
            -m 'retain activation and leasing as separate authority'
          new_head="$(git rev-parse HEAD)"

          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/final-paths.txt
          printf '%s\n' "$CERTIFICATIONS" "$JOURNAL" | sort > /tmp/expected-final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"
          echo "published_head=${new_head}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification, readiness, path, and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-certification-001-${{ github.run_id }}
          path: |
            /tmp/doctor-who-readiness.json
            /tmp/doctor-who-certification-frozen.sha256
            /tmp/staged-paths.txt
            /tmp/final-paths.txt
            /tmp/doctor-who-certification-gate.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
