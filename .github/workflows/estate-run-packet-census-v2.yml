name: estate-run-packet-census-v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-run-packet-census-v2.yml
      - scripts/estate-packet-adoption-census-v2.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-run-packet-census-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CENSUS: data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json

jobs:
  census:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head census custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Normalize packet adapters and classify all 55 imported objects
        run: |
          set -euo pipefail
          node scripts/estate-packet-adoption-census-v2.mjs \
            --write \
            --materialize \
            --out "$CENSUS" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            | tee /tmp/COLLECT-005-census.log
          node --input-type=module - "$CENSUS" <<'NODE'
          import fs from 'node:fs';
          const census = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (census.counts.imported_packets !== 55) throw new Error(`expected 55 imported packets, found ${census.counts.imported_packets}`);
          if (census.counts.already_paid !== 10) throw new Error(`expected 10 paid packets, found ${census.counts.already_paid}`);
          if (census.counts.open_packets !== 45) throw new Error(`expected 45 open packets, found ${census.counts.open_packets}`);
          if (census.counts.already_paid + census.counts.open_packets !== census.counts.imported_packets) throw new Error('census denominator drift');
          if (census.boundary.canonical_mutation !== false || census.boundary.discovery_performed !== false) throw new Error('census escaped read-only boundary');
          console.log(`PASS — all 45 unpaid packet objects classified; safe_direct=${census.counts.safe_direct_adoptions}`);
          NODE

      - name: Publish census and retire temporary adapter surfaces
        run: |
          set -euo pipefail
          rm -f .github/workflows/estate-packet-adoption-census.yml
          rm -f .github/workflows/estate-repair-packet-census-schema.yml
          rm .github/workflows/estate-run-packet-census-v2.yml
          rm scripts/estate-packet-adoption-census-v2.mjs
          git add -A
          git diff --cached --check
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: publish normalized all-packet adoption census' \
            -m 'canonical_mutation=false' \
            -m 'discovery_performed=false' \
            -m 'imported_packets=55' \
            -m 'paid_packets=10' \
            -m 'open_packets=45' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "audit_run=${GITHUB_RUN_ID}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report census result
        if: success()
        run: |
          SAFE="$(node -p "require('./$CENSUS').counts.safe_direct_adoptions")"
          CORRECTION="$(node -p "require('./$CENSUS').counts.correction_null_adoptions")"
          ABSENCE="$(node -p "require('./$CENSUS').counts.clean_absence_adoptions")"
          UNSTATED="$(node -p "require('./$CENSUS').counts.null_without_prior_state")"
          ACTIVE="$(node -p "require('./$CENSUS').counts.active_binding_comparisons")"
          UNPAID="$(node -p "require('./$CENSUS').counts.candidate_bytes_already_canonical_unpaid")"
          INCOMPATIBLE="$(node -p "require('./$CENSUS').counts.packet_review_incompatible")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 normalized all-packet census passed on workflow run $GITHUB_RUN_ID.

          ```text
          safe direct adoptions:          $SAFE
          correction-null:                $CORRECTION
          clean absence:                  $ABSENCE
          null without prior state:       $UNSTATED
          active binding comparisons:     $ACTIVE
          candidate bytes already unpaid: $UNPAID
          incompatible packet review:     $INCOMPATIBLE
          ```

          The exact 55-object census is retained at `$CENSUS`. No discovery or canonical mutation occurred. Temporary adapter and runner files deleted themselves; `scripts/estate-packet-adoption-census.mjs` now contains the durable normalized adapters.
          EOF_COMMENT

      - name: Report census failure
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-005 normalized all-packet census failed closed on workflow run $GITHUB_RUN_ID.

          No canonical mutation or adoption claim is authorized. The exact first unrecognized packet or state transition remains visible in the job log.
          EOF_COMMENT

      - name: Preserve census output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-005-normalized-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-005-census.log
            data/review/estate-debt/COLLECT-005-ADOPTION-CENSUS.json
          if-no-files-found: warn
          retention-days: 30
