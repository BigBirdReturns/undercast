name: star-trek-risik-source-review-v2-repair

on:
  push:
    branches:
      - agent/star-trek-risik-source-review-recovery-v2

permissions:
  contents: write

concurrency:
  group: star-trek-risik-source-review-v2-repair
  cancel-in-progress: false

jobs:
  review:
    name: repair-and-review-risik-source-v2
    if: ${{ github.event.head_commit.message == 'Repair remote-frozen Star Trek Risik source v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      SCRIPT: /tmp/star-trek-risik-source-review-v2-repair.sh
      OUT: /tmp/star-trek-risik-source-review-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run corrected source review
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/recovery/star-trek-risik-source-review-v2/repair.sh.b64.* | base64 -d > "$SCRIPT"
          test "$(sha256sum "$SCRIPT" | awk '{print $1}')" = 3d5a7d0970711194de681ed5e714835f6e31236437008f8ce5550292e5a2fc92
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["SCRIPT"])
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'for marker in ("The Inner Fight", "Star Trek: Lower Decks", "Risik"): ',
                  'for marker in ("The Inner Fight", "Star Trek: Lower Decks"): ',
              ),
              (
                  '18fea2817e0d7ba710739552795ea5f340cba30fe2f9a7804672fbbbf0dbf553',
                  'cc6f682a2cb54fa55dc7d49f234f8ea976fbf4b852d4fde26de5eb68cd4ce519',
              ),
          ]
          replacements[0] = tuple(value.rstrip() for value in replacements[0])
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Risik repair anchor drifted: {old[:40]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          test "$(sha256sum "$SCRIPT" | awk '{print $1}')" = c358b25b0e3bb99ec9eacf236dc5fc8e6ae07721333cbad2a0cdfb403d06a516
          chmod +x "$SCRIPT"
          "$SCRIPT" prepare
      - name: Upload corrected Risik source review
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-source-review-v2
          path: /tmp/star-trek-risik-source-review-v2/
          if-no-files-found: error
          retention-days: 30
      - name: Publish corrected Risik source review
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: "$SCRIPT publish"
