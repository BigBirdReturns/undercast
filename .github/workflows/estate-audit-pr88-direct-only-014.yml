name: estate-audit-pr88-direct-only-014

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-audit-pr88-direct-only-014.yml
      - scripts/estate-audit-pr88-direct-only-014.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-audit-pr88-direct-only-014
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_HEAD: 766b9b6002cfba9710f6dce5f56c4816607bc696
  SCRIPT: scripts/estate-audit-pr88-direct-only-014.py
  REPORT: data/review/estate-debt/COLLECT-014-PR88-DIRECT-ONLY-AUDIT.json
  ROOT: data/review/pr88-direct-only

jobs:
  audit:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reconcile complete nine-object direct-only denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git cat-file -e "${SOURCE_HEAD}^{commit}"
          test -z "$(git status --porcelain)"
          test -e "$SCRIPT"
          test ! -e "$REPORT"
          test ! -e "$ROOT"
          python3 -m py_compile "$SCRIPT"
          python3 "$SCRIPT" \
            --head "$AUTHORIZED_HEAD" \
            --source-head "$SOURCE_HEAD" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --report "$REPORT" \
            --output-root "$ROOT" | tee /tmp/COLLECT-014-summary.json
          rm -rf scripts/__pycache__
          test "$(node -p "require('./$REPORT').denominator.direct_only_objects")" = "9"
          test "$(node -p "require('./$REPORT').denominator.reviewed")" = "9"
          test "$(node -p "require('./$REPORT').denominator.authorized")" = "9"
          test "$(node -p "require('./$REPORT').denominator.blocked")" = "0"
          test "$(node -p "require('./$REPORT').denominator.stills")" = "7"
          test "$(node -p "require('./$REPORT').denominator.portraits")" = "2"
          test "$(node -p "require('./$REPORT').quality_effect_if_authorized_set_is_adopted.complete_pairs")" = "9"
          test "$(node -p "require('./$REPORT').quality_effect_if_authorized_set_is_adopted.missing_still")" = "-7"
          test "$(node -p "require('./$REPORT').quality_effect_if_authorized_set_is_adopted.missing_portrait")" = "-2"
          test "$(node -p "require('./$REPORT').quality_effect_if_authorized_set_is_adopted.missing_both")" = "0"
          test "$(node -p "require('./$REPORT').boundary.canonical_mutation")" = "false"
          test "$(node -p "require('./$REPORT').boundary.source_branch_merge_authorized")" = "false"
          test "$(node -p "require('./$ROOT/MANIFEST.json').counts.obligation_packets")" = "9"

      - name: Stage immutable evidence and retire classifier
        run: |
          set -euo pipefail
          git rm "$SCRIPT"
          git add -- "$REPORT" "$ROOT"
          PATHS="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$PATHS" | grep -Fxq "$SCRIPT"
          printf '%s\n' "$PATHS" | grep -Fxq "$REPORT"
          printf '%s\n' "$PATHS" | grep -Fxq "$ROOT/MANIFEST.json"
          UNEXPECTED="$(printf '%s\n' "$PATHS" | grep -v -E "^($(printf '%s' "$SCRIPT" | sed 's/[.[\*^$()+?{|]/\\&/g')|$(printf '%s' "$REPORT" | sed 's/[.[\*^$()+?{|]/\\&/g')|$(printf '%s' "$ROOT" | sed 's/[.[\*^$()+?{|]/\\&/g')/)" || true)"
          test -z "$UNEXPECTED"
          test "$(find "$ROOT" -type f | wc -l | tr -d ' ')" -ge 28
          git diff --cached --check
          git write-tree > /tmp/COLLECT-014-audit.tree

      - name: Gate exact evidence-only custody tree
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-014-audit.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs
          test "$(node -p "require('./$REPORT').denominator.reviewed")" = "9"
          test "$(node -p "require('./$REPORT').authorized_obligations.length + require('./$REPORT').blocked_obligations.length")" = "9"

      - name: Publish exact current-head reconciliation under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          AUTHORIZED="$(node -p "require('./$REPORT').denominator.authorized")"
          BLOCKED="$(node -p "require('./$REPORT').denominator.blocked")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate audit: reconcile nine PR88 direct-only media objects' \
            -m 'transaction=COLLECT-014' \
            -m 'reviewed=9' \
            -m "authorized=${AUTHORIZED}" \
            -m "blocked=${BLOCKED}" \
            -m 'source_branch_merge_authorized=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "source_head=${SOURCE_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-014-audit.tree)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report exact denominator
        if: success()
        run: |
          AUTHORIZED="$(node -p "require('./$REPORT').denominator.authorized")"
          BLOCKED="$(node -p "require('./$REPORT').denominator.blocked")"
          EFFECT="$(node -p "JSON.stringify(require('./$REPORT').quality_effect_if_authorized_set_is_adopted)")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-014 reconciled the complete nine-object PR #88 direct-only denominator on workflow run $GITHUB_RUN_ID.

          ```text
          ruling head:    ${{ steps.publish.outputs.head }}
          source head:    $SOURCE_HEAD
          reviewed:       9
          authorized:     $AUTHORIZED
          blocked:        $BLOCKED
          quality effect: $EFFECT
          canonical mutation: false
          source branch merge authorized: false
          ```

          Exact candidate bytes, shared provenance, enforced second-desk votes, current canonical state, proposed versioned bindings, duplicate checks, and per-object checksums are now retained on the consolidation branch. The stale PR #88 branch remains evidence-only and must not merge.
          EOF_COMMENT

      - name: Report failed reconciliation
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-014 PR #88 direct-only reconciliation failed closed on workflow run ${GITHUB_RUN_ID}. No direct-only adoption or merge claim is authorized."

      - name: Preserve exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-014-pr88-direct-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-014-summary.json
            /tmp/COLLECT-014-audit.tree
            data/review/estate-debt/COLLECT-014-PR88-DIRECT-ONLY-AUDIT.json
            data/review/pr88-direct-only
          if-no-files-found: warn
          retention-days: 30
