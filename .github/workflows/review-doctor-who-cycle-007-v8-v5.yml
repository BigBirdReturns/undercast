name: review-doctor-who-cycle-007-v8-v5

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/review-doctor-who-cycle-007-v8-v5.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: review-doctor-who-cycle-007-v8-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: 014dbd3a4d9d4e82c0832d4c14f08cfff5138a58
  REVIEW_BRANCH: agent/doctor-who-cycle-007-v8-independent-review-v5
  SOURCE_REVIEW_HEAD: 245bacc9d7e58ceda4ebfd16dc33254b97263f34
  SOURCE_REVIEW_ARCHIVE: tmp/review-doctor-who-cycle-007-v8.mjs.xz.b64
  SOURCE_REVIEW_BLOB: a79b0aaa277a852d91a0670f387d74789d456ea1
  SOURCE_REVIEWER_SHA256: 5053bb53dc96c35b846dd57fe16d8b58d6bd334e03290399ddf98011ad174fe1
  CANDIDATE_BRANCH: agent/doctor-who-cycle-007-v8-materializer
  CANDIDATE_HEAD: 0b0adcf29b87142cd12e06471124edd52fe7c99a
  CANDIDATE_RUN: "31059092270"
  CANDIDATE_JOB: "92482853201"
  CANDIDATE_ARTIFACT: doctor-who-cycle-007-candidate-31059092270
  CANDIDATE_ARTIFACT_ID: "8951443904"
  CANDIDATE_ARTIFACT_DIGEST: e908611c8cc2e4864eafd2a3802f2e17f33bb05816ed33a4b43b90eca8cdedce
  DIAGNOSTICS_ARTIFACT: doctor-who-cycle-007-v8-candidate-only-31059092270
  DIAGNOSTICS_ARTIFACT_ID: "8951444559"
  DIAGNOSTICS_ARTIFACT_DIGEST: fcf288f72efd4738304c1fbd35a67b7141f864874329c71a63619f7218d38e80
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/review-doctor-who-cycle-007-v8-v5.yml
  ROOT: /tmp/doctor-who-cycle-007-v8-independent-review-v5
  REVIEWER_ARCHIVE: /tmp/doctor-who-cycle-007-v8-independent-review-v5/reviewer.mjs.xz.b64
  REVIEWER_V2: /tmp/doctor-who-cycle-007-v8-independent-review-v5/reviewer-v2.mjs
  REVIEWER: /tmp/doctor-who-cycle-007-v8-independent-review-v5/reviewer-v3.mjs
  CANDIDATE: /tmp/doctor-who-cycle-007-v8-independent-review-v5/candidate
  DIAGNOSTICS: /tmp/doctor-who-cycle-007-v8-independent-review-v5/diagnostics
  OUT: /tmp/doctor-who-cycle-007-v8-independent-review-v5/out
  GH_TOKEN: ${{ github.token }}

jobs:
  review:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-independent-review-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind exact one-path V5 carrier and immutable candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$CANDIDATE" "$DIAGNOSTICS" "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$REVIEW_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git fetch --no-tags --depth=2 origin "$SOURCE_REVIEW_HEAD"
          git fetch --no-tags --depth=2 origin "$CANDIDATE_HEAD"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "$CANDIDATE_HEAD"
          test "$(git rev-parse "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}")" = "$SOURCE_REVIEW_BLOB"
          git show "${SOURCE_REVIEW_HEAD}:${SOURCE_REVIEW_ARCHIVE}" > "$REVIEWER_ARCHIVE"
          base64 --decode "$REVIEWER_ARCHIVE" | xz --decompress > "$REVIEWER_V2"
          test "$(sha256sum "$REVIEWER_V2" | awk '{print $1}')" = "$SOURCE_REVIEWER_SHA256"
          git show "$CANDIDATE_HEAD:.github/workflows/materialize-doctor-who-cycle-007-v8.yml" > "$OUT/candidate-workflow.yml"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100" > "$OUT/candidate-artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/jobs?per_page=100" > "$OUT/candidate-jobs.json"
          jq -e \
            --argjson run "$CANDIDATE_RUN" \
            --arg head "$CANDIDATE_HEAD" \
            --argjson candidate_id "$CANDIDATE_ARTIFACT_ID" \
            --arg candidate_digest "sha256:${CANDIDATE_ARTIFACT_DIGEST}" \
            --argjson diagnostics_id "$DIAGNOSTICS_ARTIFACT_ID" \
            --arg diagnostics_digest "sha256:${DIAGNOSTICS_ARTIFACT_DIGEST}" '
              .total_count == 2 and
              any(.artifacts[];
                .id == $candidate_id and
                .name == "doctor-who-cycle-007-candidate-31059092270" and
                .digest == $candidate_digest and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $head and
                .expired == false
              ) and
              any(.artifacts[];
                .id == $diagnostics_id and
                .name == "doctor-who-cycle-007-v8-candidate-only-31059092270" and
                .digest == $diagnostics_digest and
                .workflow_run.id == $run and
                .workflow_run.head_sha == $head and
                .expired == false
              )
            ' "$OUT/candidate-artifacts.json" >/dev/null
          jq -e \
            --argjson run "$CANDIDATE_RUN" \
            --argjson job "$CANDIDATE_JOB" '
              any(.jobs[];
                .id == $job and
                .run_id == $run and
                .name == "materialize" and
                .status == "completed" and
                .conclusion == "success" and
                all(.steps[]; .conclusion == "success" or .conclusion == "skipped")
              )
            ' "$OUT/candidate-jobs.json" >/dev/null

      - name: Derive reviewer V3 with runtime-safe workflow-expression markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/doctor-who-cycle-007-v8-independent-review-v5/reviewer-v2.mjs')
          target = Path('/tmp/doctor-who-cycle-007-v8-independent-review-v5/reviewer-v3.mjs')
          text = source.read_text()
          error = 'candidate workflow marker missing: ${marker}'
          pos = text.find(error)
          start = text.rfind('for (const marker of [', 0, pos)
          end = text.find(';', pos)
          if pos < 0 or start < 0 or end < 0:
              raise SystemExit('candidate workflow marker block boundary not found')
          end += 1

          github_head = '$' + '{{ github.event.pull_request.head.sha }}'
          checkout_head = '$' + '{{ env.HEAD_SHA }}'
          replacement = '''for (const marker of [
            "CARRIER_BRANCH: agent/doctor-who-cycle-007-v8-materializer",
            "__GITHUB_HEAD__",
            "__CHECKOUT_HEAD__",
            "github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v8-materializer'",
            'test "$(git rev-parse HEAD)" = "$HEAD_SHA"',
            'test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"',
            'test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"',
            'test "$(git rev-parse refs/remotes/origin/${CARRIER_BRANCH})" = "$HEAD_SHA"',
          ]) assert(candidateWorkflow.includes(marker), `candidate workflow structural marker missing: ${marker}`);'''
          replacement = replacement.replace('__GITHUB_HEAD__', 'HEAD_SHA: ' + github_head)
          replacement = replacement.replace('__CHECKOUT_HEAD__', 'ref: ' + checkout_head)
          text = text[:start] + replacement + text[end:]
          text, revisions = re.subn(r'(reviewer_revision\s*:\s*)2\b', r'\g<1>3', text)
          if revisions < 1:
              raise SystemExit('reviewer revision marker not found')
          if 'candidate workflow marker missing:' in text:
              raise SystemExit('invalid literal-SHA assertion remains')
          target.write_text(text)
          PY
          node --check "$REVIEWER"
          reviewer_sha="$(sha256sum "$REVIEWER" | awk '{print $1}')"
          printf '%s\n' "$reviewer_sha" > "$OUT/reviewer-v3.sha256"
          dollar='$'
          github_head_pattern="HEAD_SHA: ${dollar}{{ github.event.pull_request.head.sha }}"
          checkout_head_pattern="ref: ${dollar}{{ env.HEAD_SHA }}"
          grep -F "$github_head_pattern" "$REVIEWER" >/dev/null
          grep -F "$checkout_head_pattern" "$REVIEWER" >/dev/null
          grep -F 'candidate workflow structural marker missing:' "$REVIEWER" >/dev/null
          grep -F 'reviewer_revision: 3' "$REVIEWER" >/dev/null

      - name: Download immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ env.CANDIDATE }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Download immutable candidate diagnostics
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTICS_ARTIFACT }}
          path: ${{ env.DIAGNOSTICS }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.CANDIDATE_RUN }}

      - name: Perform independent structural candidate review V3
        shell: bash
        run: |
          set -euo pipefail
          node "$REVIEWER" \
            "$CANDIDATE" \
            "$DIAGNOSTICS" \
            "$OUT/candidate-artifacts.json" \
            "$OUT/candidate-jobs.json" \
            "$OUT/candidate-workflow.yml" \
            "$OUT" \
            | tee "$OUT/review.log"
          test -s "$OUT/independent-review-receipt.json"
          receipt_sha="$(sha256sum "$OUT/independent-review-receipt.json" | awk '{print $1}')"
          test "$(cat "$OUT/independent-review-receipt.sha256")" = "$receipt_sha"
          printf '%s\n' "$receipt_sha" > "$OUT/hosted-receipt.sha256"
          grep -F 'approved-for-separate-finalization' "$OUT/independent-review-receipt.json" >/dev/null
          test -z "$(git status --porcelain)"

      - name: Upload immutable V5 independent review receipt
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-v8-independent-review-v5-${{ github.run_id }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: ${{ env.OUT }}
