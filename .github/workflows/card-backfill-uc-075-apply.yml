name: card-backfill-uc-075-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-075-APPLY.json"
      - "scripts/card-backfill-uc-075-apply.mjs"
      - ".github/workflows/card-backfill-uc-075-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-075-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-015'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-015
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-075-APPLY.json','utf8'));
          if(row.version!==1||row.record_id!=='UC-075'||row.actor!=='Lou Ferrigno'||row.character!=='The Hulk'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-075 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8641041628||row.render_artifact?.head_sha!=='16a3b81080852f579872be8fcdb57d941191d9f4')throw new Error('UC-075 render custody drift');
          if(row.render_artifact?.zip_sha256!=='bcf3709cd83bb3a81329f1673fae42287fa280213f0a7866e7bb22f6b9bf8eaf')throw new Error('UC-075 render ZIP drift');
          if(row.expected?.['uc-075-still-candidate.jpg']?.sha256!=='af6a3288778bf437351b68400948bb81b0e743cc1d049d2b2ac095888ea6e577')throw new Error('UC-075 candidate drift');
          if(row.expected?.['card-crop-preview.jpg']?.sha256!=='cf8dc66079616ff8fef0e4b03f55422a2fd9a0e47d9456b5134bd1a384c2ad6e')throw new Error('UC-075 crop drift');
          if(row.expected?.['rejected-banner-hulk.jpg']?.sha256!=='39f57834aa3471631308f3442bf40fd7b54dbf4146850e9c2a90e0b3e0fa3b7e')throw new Error('UC-075 alternative drift');
          console.log('PASS — exact UC-075 Hulk evidence packet authorized');
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-075-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8641041628/zip" > "$root/render.zip"
          echo "bcf3709cd83bb3a81329f1673fae42287fa280213f0a7866e7bb22f6b9bf8eaf  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          source="$root/source/output"
          echo "af6a3288778bf437351b68400948bb81b0e743cc1d049d2b2ac095888ea6e577  $source/uc-075-still-candidate.jpg" | sha256sum -c -
          echo "cf8dc66079616ff8fef0e4b03f55422a2fd9a0e47d9456b5134bd1a384c2ad6e  $source/card-crop-preview.jpg" | sha256sum -c -
          echo "39f57834aa3471631308f3442bf40fd7b54dbf4146850e9c2a90e0b3e0fa3b7e  $source/rejected-banner-hulk.jpg" | sha256sum -c -
          echo "9bb05c84d10990c3533173d00580484eeb1d73074600fe50dd152e868bb8bed3  $source/manifest.json" | sha256sum -c -
          echo "4ea4cfe31b8544ae6ed78df014d78934a606c1b764c5cbca8f3d6cc7b62f4c65  $source/duplicate-scan.json" | sha256sum -c -
          echo "8a9aaae822f07f06e1101f6117e5cea4eeafee9e82273b103420c8a12396222d  $source/review.json" | sha256sum -c -
          echo "3344f3e9e491e0a61dbdc31c866a6b1e81eee1a1e3acabf62d3fb051d26d63c6  $source/review.md" | sha256sum -c -
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-075-apply/source/output
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-075-apply"
          node scripts/card-backfill-uc-075-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-075-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-075');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-075');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_e6615ff5f2f210c3f241e45c');
          if(!specimen||specimen.still)throw new Error('UC-075 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-075 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-075'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-075 audit disposition was canonically mutated');
          console.log('PASS — UC-075 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-075.json \
            .github/CARD-BACKFILL-UC-075-RENDER.json \
            .github/CARD-BACKFILL-UC-075-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-075-discover.yml \
            .github/workflows/card-backfill-uc-075-render.yml \
            .github/workflows/card-backfill-uc-075-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-075-discover.mjs \
            scripts/card-backfill-uc-075-render.mjs \
            scripts/card-backfill-uc-075-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-075 Lou Ferrigno Hulk still'
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-014...HEAD)
          test "${#changed[@]}" -eq 11
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-075/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$RUNNER_TEMP/card-backfill-uc-075-apply/permanent-paths.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-075-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-015
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-075-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-075-apply
            data/review/card-backfill/UC-075
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
