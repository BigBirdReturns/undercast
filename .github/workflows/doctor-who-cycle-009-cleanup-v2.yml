name: doctor-who-cycle-009-cleanup-v2

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-cleanup-v2.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-cleanup-v2
  cancel-in-progress: true

jobs:
  halt:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-cleanup-v2'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Stop superseded direct-write cleanup
        run: |
          echo 'V2 is superseded because publisher-custody requires a read-only verifier and isolated writer.'
          echo 'No branch deletion is authorized by this synchronization.'
