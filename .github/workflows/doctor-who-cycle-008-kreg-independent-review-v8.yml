name: doctor-who-cycle-008-kreg-independent-review-v8

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-independent-review-v8.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-independent-review-v8-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-independent-review-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-independent-review-v8.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-independent-review-v8
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      V7_BRANCH: agent/doctor-who-cycle-008-kreg-bootstrap-v7
      V7_WORKFLOW: doctor-who-cycle-008-kreg-bootstrap-v7
      OUT: /tmp/doctor-who-cycle-008-kreg-independent-review-v8
      TASK_ID: ap_469d79ea29fd7f877395d20f
      LEASE_ID: lease_e65f837070361eacbb1abd46
      WALL_ID: UC-1353
      MEDIA_BYTES: "67113"
      MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact one-file review desk and live main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,diagnostics,source,review,work}
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          parents="$(git show -s --format=%P HEAD)"
          set -- $parents
          test "$#" = 1
          base="$1"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          test "$(git diff --name-only "$base"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$base"...HEAD)" = $'A\t'"$SELF"
          git fetch --no-tags --filter=blob:none origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$base"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR" > "$OUT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$AUTHORIZED_PR/files?per_page=100" > "$OUT/api/pr-files.json"
          ROOT="$OUT" BASE="$base" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/pr-files.json').read_text())
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE']
          assert pr['head']['ref']==os.environ['AUTHORIZED_BRANCH']
          assert pr['head']['sha']==os.environ['AUTHORIZED_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY
          printf '%s\n' "$base" > "$OUT/review-main.txt"
          printf 'REVIEW_MAIN=%s\n' "$base" >> "$GITHUB_ENV"

      - name: Discover and retain exact terminal V7 packet
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?branch=$V7_BRANCH&event=pull_request&per_page=100" > "$OUT/api/v7-runs.json"
            row="$(jq -c --arg name "$V7_WORKFLOW" --arg branch "$V7_BRANCH" '[.workflow_runs[] | select(.name==$name and .head_branch==$branch)] | sort_by(.created_at) | last // empty' "$OUT/api/v7-runs.json")"
            if [ -n "$row" ] && [ "$(jq -r '.status' <<<"$row")" = completed ]; then
              printf '%s\n' "$row" > "$OUT/source/v7-run.json"
              break
            fi
            sleep 20
          done
          test -s "$OUT/source/v7-run.json"
          run="$(jq -r '.id' "$OUT/source/v7-run.json")"
          attempt="$(jq -r '.run_attempt' "$OUT/source/v7-run.json")"
          conclusion="$(jq -r '.conclusion' "$OUT/source/v7-run.json")"
          head="$(jq -r '.head_sha' "$OUT/source/v7-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$OUT/source/v7-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/source/v7-artifacts.json"
          artifact="$(jq -c --arg name "doctor-who-cycle-008-kreg-bootstrap-v7-$run-attempt-$attempt" '[.artifacts[] | select(.name==$name and .expired==false)] | if length==1 then .[0] else empty end' "$OUT/source/v7-artifacts.json")"
          test -n "$artifact"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$OUT/source/v7.zip"
          ZIP="$OUT/source/v7.zip" TARGET="$OUT/source/v7" python3 - <<'PY'
          import os, pathlib, zipfile
          z=pathlib.Path(os.environ['ZIP']); target=pathlib.Path(os.environ['TARGET']); target.mkdir()
          with zipfile.ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not i.is_dir()
                  data=f.read(i); out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          printf 'V7_RUN=%s\nV7_ATTEMPT=%s\nV7_CONCLUSION=%s\nV7_HEAD=%s\nV7_ARTIFACT=%s\nV7_ARTIFACT_DIGEST=%s\n' \
            "$run" "$attempt" "$conclusion" "$head" "$artifact_id" "$artifact_digest" >> "$GITHUB_ENV"
          test "$conclusion" = success

      - name: Verify V7 packet checksums and qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          packet="$OUT/source/v7/packet"
          test -f "$packet/qualification-receipt.json"
          test -f "$packet/candidate.bundle"
          test -f "$packet/candidate.patch"
          test -f "$packet/candidate-product.tar.gz"
          test -f "$packet/candidate-files.json"
          test -f "$packet/SHA256SUMS.pre"
          test -f "$packet/SHA256SUMS"
          PACKET="$packet" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          packet=Path(os.environ['PACKET'])
          for line in (packet/'SHA256SUMS.pre').read_text().splitlines():
              digest, original=line.split(None,1); rel=original.split('/packet/',1)[-1]; p=packet/rel
              assert p.is_file(), rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, rel
          outer=(packet/'SHA256SUMS').read_text().strip().split()[0]
          assert hashlib.sha256((packet/'SHA256SUMS.pre').read_bytes()).hexdigest()==outer
          receipt=json.loads((packet/'qualification-receipt.json').read_text())
          identity=receipt.pop('identity')
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(canonical).hexdigest()==identity
          assert receipt['status']=='qualified-candidate'
          assert receipt['task']==os.environ['TASK_ID']
          assert receipt['lease']==os.environ['LEASE_ID']
          assert receipt['wall_id']==os.environ['WALL_ID']
          assert receipt['path_count']==40
          assert receipt['repository_write'] is False and receipt['merge_authority'] is False and receipt['cycle_009_authorized'] is False
          assert receipt['v6_run'] > 0 and receipt['v6_artifact'] > 0
          (packet/'qualification-receipt.verified.json').write_text(json.dumps({**receipt,'identity':identity},indent=2,sort_keys=True)+'\n')
          PY
          cp "$packet/qualification-receipt.verified.json" "$OUT/review/v7-qualification-receipt.json"
          jq -r '.base_main' "$packet/qualification-receipt.json" > "$OUT/source/v7-base-main.txt"
          jq -r '.candidate_commit' "$packet/qualification-receipt.json" > "$OUT/source/v7-candidate-commit.txt"
          jq -r '.candidate_tree' "$packet/qualification-receipt.json" > "$OUT/source/v7-candidate-tree.txt"

      - name: Reconstruct and verify exact candidate Git object
        shell: bash
        run: |
          set -euo pipefail
          source_root="$OUT/source/v7"
          packet="$source_root/packet"
          base="$(cat "$OUT/source/v7-base-main.txt")"
          candidate="$(cat "$OUT/source/v7-candidate-commit.txt")"
          tree="$(cat "$OUT/source/v7-candidate-tree.txt")"
          git fetch --no-tags --filter=blob:none origin "$base"
          git worktree add --detach "$OUT/work/original" "$base"
          git -C "$OUT/work/original" bundle verify "$packet/candidate.bundle" > "$OUT/diagnostics/bundle-verify.txt"
          git -C "$OUT/work/original" fetch "$packet/candidate.bundle" cycle008-kreg-candidate:refs/heads/v8-reviewed-candidate
          test "$(git -C "$OUT/work/original" rev-parse refs/heads/v8-reviewed-candidate)" = "$candidate"
          test "$(git -C "$OUT/work/original" show -s --format=%P "$candidate")" = "$base"
          test "$(git -C "$OUT/work/original" rev-parse "$candidate^{tree}")" = "$tree"
          git -C "$OUT/work/original" diff --name-only "$base".."$candidate" | LC_ALL=C sort > "$OUT/review/candidate-paths.txt"
          test "$(wc -l < "$OUT/review/candidate-paths.txt")" = 40
          diff -u "$source_root/candidate-paths.txt" "$OUT/review/candidate-paths.txt"
          ROOT="$OUT" REPO="$OUT/work/original" CANDIDATE="$candidate" python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile,tempfile
          from pathlib import Path
          root=Path(os.environ['ROOT']); repo=Path(os.environ['REPO']); candidate=os.environ['CANDIDATE']
          packet=root/'source/v7/packet'; rows=json.loads((packet/'candidate-files.json').read_text())
          paths=(root/'review/candidate-paths.txt').read_text().splitlines()
          assert [r['path'] for r in rows]==paths
          for r in rows:
              data=subprocess.check_output(['git','-C',str(repo),'show',f'{candidate}:{r["path"]}'])
              blob=subprocess.check_output(['git','-C',str(repo),'rev-parse',f'{candidate}:{r["path"]}'],text=True).strip()
              assert len(data)==r['bytes'] and hashlib.sha256(data).hexdigest()==r['sha256'] and blob==r['git_blob']
          extract=root/'work/archive'; extract.mkdir()
          with tarfile.open(packet/'candidate-product.tar.gz','r:gz') as tf:
              members=tf.getmembers(); names=[m.name for m in members]
              assert sorted(names)==paths and len(names)==len(set(names))
              for m in members:
                  p=Path(m.name)
                  assert not p.is_absolute() and '..' not in p.parts and m.isfile() and not m.issym() and not m.islnk()
                  data=tf.extractfile(m).read()
                  expected=subprocess.check_output(['git','-C',str(repo),'show',f'{candidate}:{m.name}'])
                  assert data==expected, m.name
          PY
          git worktree add --detach "$OUT/work/patch" "$base"
          git -C "$OUT/work/patch" apply --check "$packet/candidate.patch"
          git -C "$OUT/work/patch" apply --index "$packet/candidate.patch"
          test "$(git -C "$OUT/work/patch" write-tree)" = "$tree"

      - name: Recompose exact forty files over review main
        id: compose
        shell: bash
        run: |
          set -euo pipefail
          packet="$OUT/source/v7/packet"
          source_base="$(cat "$OUT/source/v7-base-main.txt")"
          git merge-base --is-ancestor "$source_base" "$REVIEW_MAIN"
          git diff --name-only "$source_base".."$REVIEW_MAIN" | LC_ALL=C sort > "$OUT/review/main-delta-paths.txt"
          comm -12 "$OUT/review/candidate-paths.txt" "$OUT/review/main-delta-paths.txt" > "$OUT/review/main-product-overlap.txt"
          test ! -s "$OUT/review/main-product-overlap.txt"
          git worktree add --detach "$OUT/work/composed" "$REVIEW_MAIN"
          tar -xzf "$packet/candidate-product.tar.gz" -C "$OUT/work/composed"
          git -C "$OUT/work/composed" add --pathspec-from-file="$OUT/review/candidate-paths.txt"
          git -C "$OUT/work/composed" config user.name undercast-cycle-008-reviewer
          git -C "$OUT/work/composed" config user.email cycle-008-reviewer@users.noreply.github.com
          git -C "$OUT/work/composed" commit -m 'Doctor Who: independently compose cycle 008 Kreg candidate' >/dev/null
          composed="$(git -C "$OUT/work/composed" rev-parse HEAD)"
          test "$(git -C "$OUT/work/composed" show -s --format=%P HEAD)" = "$REVIEW_MAIN"
          git -C "$OUT/work/composed" diff --name-only "$REVIEW_MAIN"..HEAD | LC_ALL=C sort > "$OUT/review/composed-paths.txt"
          diff -u "$OUT/review/candidate-paths.txt" "$OUT/review/composed-paths.txt"
          printf '%s\n' "$composed" > "$OUT/review/composed-commit.txt"
          printf 'composed_commit=%s\n' "$composed" >> "$GITHUB_OUTPUT"

      - name: Independently verify Kreg semantics and media
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/composed"
          commit='${{ steps.compose.outputs.composed_commit }}'
          test "$(git -C "$repo" show "$commit:images/uc-1353-still.jpg" | wc -c)" = "$MEDIA_BYTES"
          test "$(git -C "$repo" show "$commit:images/uc-1353-still.jpg" | sha256sum | awk '{print $1}')" = "$MEDIA_SHA256"
          ! git -C "$repo" ls-tree -r --name-only "$commit" | grep -E '^images/uc-1353-(portrait|performer)\.'
          REPO="$repo" COMMIT="$commit" python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['REPO']; commit=os.environ['COMMIT']
          raw=subprocess.check_output(['git','-C',repo,'show',f'{commit}:data/characters/uc-1353.json'])
          data=json.loads(raw); text=json.dumps(data,sort_keys=True).lower()
          for required in ('uc-1353','kreg','dan starkey','voice','the great sontaran war'):
              assert required in text, required
          assert os.environ['TASK_ID'].lower() in text
          assert os.environ['LEASE_ID'].lower() in text
          assert 'images/uc-1353-still.jpg' in text
          assert 'performer' in text and ('absent' in text or 'null' in text or 'unavailable' in text)
          PY
          git -C "$repo" grep -q "$TASK_ID" "$commit" -- data
          git -C "$repo" grep -q "$LEASE_ID" "$commit" -- data
          git -C "$repo" grep -q "$WALL_ID" "$commit" -- data

      - name: Run independent complete repository and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/composed"
          commit='${{ steps.compose.outputs.composed_commit }}'
          test "$(git -C "$repo" rev-parse HEAD)" = "$commit"
          test -z "$(git -C "$repo" status --porcelain)"
          cd "$repo"
          npm ci
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$OUT/review/independent-complete-gate.log"
          test -z "$(git status --porcelain)"

      - name: Seal approved-for-finalization review receipt
        shell: bash
        run: |
          set -euo pipefail
          repo="$OUT/work/composed"
          composed='${{ steps.compose.outputs.composed_commit }}'
          original="$(cat "$OUT/source/v7-candidate-commit.txt")"
          ROOT="$OUT" REPO="$repo" COMPOSED="$composed" ORIGINAL="$original" python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT']); repo=os.environ['REPO']
          receipt={
            'status':'approved-for-finalization', 'task':os.environ['TASK_ID'], 'lease':os.environ['LEASE_ID'], 'wall_id':os.environ['WALL_ID'],
            'review_main':os.environ['REVIEW_MAIN'], 'original_candidate_commit':os.environ['ORIGINAL'],
            'composed_candidate_commit':os.environ['COMPOSED'],
            'composed_candidate_tree':subprocess.check_output(['git','-C',repo,'rev-parse',f'{os.environ["COMPOSED"]}^{{tree}}'],text=True).strip(),
            'path_count':40, 'v7_run':int(os.environ['V7_RUN']), 'v7_attempt':int(os.environ['V7_ATTEMPT']),
            'v7_head':os.environ['V7_HEAD'], 'v7_artifact':int(os.environ['V7_ARTIFACT']), 'v7_artifact_digest':os.environ['V7_ARTIFACT_DIGEST'],
            'independent_gate':'pass', 'media_sha256':os.environ['MEDIA_SHA256'],
            'queue_before':{'queued':309,'resolved':7,'in_flight':0}, 'queue_after':{'queued':308,'resolved':8,'in_flight':0},
            'repository_write':False, 'merge_authority':False, 'cycle_009_authorized':False, 'outside_human_dependency':False,
          }
          canonical=json.dumps(receipt,sort_keys=True,separators=(',',':')).encode(); receipt['identity']=hashlib.sha256(canonical).hexdigest()
          (root/'review/review-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/review" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/review/SHA256SUMS.pre"
          sha256sum "$OUT/review/SHA256SUMS.pre" > "$OUT/review/SHA256SUMS"
          live="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$live" = "$REVIEW_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$AUTHORIZED_BRANCH" --jq '.object.sha')" = "$AUTHORIZED_HEAD"

      - name: Retain terminal evidence and remove worktrees
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for name in original patch composed; do
            work="$OUT/work/$name"
            if [ -d "$work" ]; then
              git -C "$work" status --short > "$OUT/diagnostics/$name-final-status.txt" || true
              git worktree remove --force "$work" >/dev/null 2>&1 || rm -rf "$work"
            fi
          done
          rm -rf "$OUT/work"
          find "$OUT" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"

      - name: Upload immutable V8 independent-review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-independent-review-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-independent-review-v8
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
