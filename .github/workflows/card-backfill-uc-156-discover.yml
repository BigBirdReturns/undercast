name: card-backfill-uc-156-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-156-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-156-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-156-discover.mjs"
      - "scripts/card-backfill-uc-156-discover-repair.py"
      - ".github/workflows/card-backfill-uc-156-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-156-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-034'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-034
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify repaired UC-156 two-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-156-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-156-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-156');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-156');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ef9fd830f381c8876701a0ba');
          if(row.version!==1||row.record_id!=='UC-156'||row.kind!=='voice'||row.actor!=='Nicholas Briggs'||row.character!=='The voice of the Daleks & Cybermen'||row.production!=='Doctor Who (2005– )'||row.years!=='2005–'||row.side!=='still')throw new Error('UC-156 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-156'||failures.failed_discovery_checkpoints?.length!==1||failures.failed_discovery_checkpoints[0]?.run_id!==30420832538||failures.failed_discovery_checkpoints[0]?.artifact_id!==8711851622||failures.failed_discovery_checkpoints[0]?.head_sha!=='e72b3244233b758f1405a650d43c7c770b27aadd'||failures.failed_discovery_checkpoints[0]?.artifact_digest_sha256!=='4c1f72f37164a8c1c225d2fd8c5abe9f3356ece5d9f0eeaaed5c32c8a511146c')throw new Error('UC-156 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8711475187||row.selector_artifact?.head_sha!=='921fb6feee828717efd09bf0bea90f39bdd76cb1'||row.selector_artifact?.zip_sha256!=='dd46266690822023319eb4526cf69b9ea27b1d9f12968ab6563c35329205fa5b')throw new Error('UC-156 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8711713144||row.scope_artifact?.head_sha!=='41e19bc4aa648a0da83c1c442193158291844001'||row.scope_artifact?.scope_sha256!=='8137be7e415847645be645c0b468f4605c1bda3a3108d51a76a93ba89fc4a20b')throw new Error('UC-156 scope custody drift');
          if(row.actor_role_pages?.length!==2||row.actor_role_pages.some(page=>page.strict!==true)||row.character_pages?.length!==2||row.character_pages.some(page=>page.strict!==true)||row.roles?.length!==2||row.roles[0]?.key!=='dalek'||row.roles[1]?.key!=='cyberman')throw new Error('UC-156 discovery denominator drift');
          if(row.selection_contract?.exact_two_role_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['dalek','cyberman'])||row.selection_contract?.required_candidate_count_per_role!==1||row.selection_contract?.nicholas_briggs_voice_performance_required_for_both_roles!==true||row.selection_contract?.dalek_voice_start_2005_required!==true||row.selection_contract?.cyberman_voice_credit_2006_or_later_required!==true||row.selection_contract?.visible_operator_and_suit_performer_separation_required!==true||row.selection_contract?.official_doctorwho_character_asset_required!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-156 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Nicholas Briggs'||specimen.character!=='The voice of the Daleks & Cybermen'||specimen.production!=='Doctor Who (2005– )'||specimen.years!=='2005–'||specimen.still||specimen.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-156-portrait.jpg')throw new Error('UC-156 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-156'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-156 audit boundary drift');
          console.log('PASS — exact UC-156 failure custody and focused page receipts authorized');
          NODE
      - name: Build isolated focused discoverer
        run: |
          set -euo pipefail
          python3 scripts/card-backfill-uc-156-discover-repair.py
          node --check scripts/.card-backfill-uc-156-discover-run.mjs
      - name: Gather official role pages and character assets
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-156-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-156-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-156-discover-run.log"
          rm scripts/.card-backfill-uc-156-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload focused page receipts, failure custody, role assets, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-156-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-156-discover
            ${{ runner.temp }}/card-backfill-uc-156-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
