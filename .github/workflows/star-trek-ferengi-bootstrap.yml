name: star-trek-ferengi-bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/STAR-TREK-FERENGI-BOOTSTRAP.json"
      - ".github/workflows/star-trek-ferengi-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: star-trek-ferengi-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/star-trek-population-002'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-population-002
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Teach growth to trust exact committed Autopilot source receipts
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='scripts/grow.mjs';
          let text=fs.readFileSync(path,'utf8');
          const replace=(from,to,label)=>{
            if(!text.includes(from)) throw new Error(`grow patch missing ${label}`);
            text=text.replace(from,to);
          };
          replace(
            ' *   2. Wikipedia confirms the person is real (else discard).',
            ' *   2. Wikipedia or an exact committed Autopilot source receipt confirms the performer identity (else discard).',
            'pipeline identity comment'
          );
          replace(
            'const DRAFTS  = "data/drafts.json";     // specimens a coding-session model drafted (keyless path)\n',
            'const DRAFTS  = "data/drafts.json";     // specimens a coding-session model drafted (keyless path)\nconst AUTOPILOT = "data/AUTOPILOT.json"; // exact source-bound task receipts for keyless Autopilot drafts\n',
            'AUTOPILOT constant'
          );
          replace(
            'const identityLabel = (card) => `${card.actor} — ${card.character} (${card.production})`;\n',
            `const identityLabel = (card) => \`${'${card.actor}'} — ${'${card.character}'} (${'${card.production}'})\`;\nconst sourceKey = (value) => {\n  try { const url = new URL(value); url.hash = ""; return url.toString().replace(/\\/$/, ""); }\n  catch { return String(value || "").trim(); }\n};\nfunction autopilotReceiptFor(card, state) {\n  const meta = card?._autopilot;\n  if (!meta?.task_id || !meta.lease_id || !meta.readiness_token || !meta.source_fingerprint) return null;\n  const job = (state.jobs || []).find((row) => row.id === meta.task_id);\n  if (!job || job.status !== "drafted" || norm(job.performer) !== norm(card.actor) || norm(job.character) !== norm(card.character)) return null;\n  const outcome = job.outcome || {};\n  if (outcome.kind !== "draft" || outcome.lease_id !== meta.lease_id || outcome.readiness_token !== meta.readiness_token || outcome.source_fingerprint !== meta.source_fingerprint || job.source_fingerprint !== meta.source_fingerprint) return null;\n  const references = new Set((card.references || []).map((row) => sourceKey(row?.source)).filter(Boolean));\n  const source = (job.sources || []).find((value) => references.has(sourceKey(value)));\n  return source ? { task_id: job.id, source } : null;\n}\n`,
            'Autopilot receipt helper'
          );
          replace(
            '  const specimens = JSON.parse(await readFile(DATA, "utf8"));\n  const have = new Set(specimens.map(identity));',
            '  const specimens = JSON.parse(await readFile(DATA, "utf8"));\n  let autopilot = { jobs: [] };\n  try { autopilot = JSON.parse(await readFile(AUTOPILOT, "utf8")); } catch {}\n  const have = new Set(specimens.map(identity));',
            'Autopilot state load'
          );
          replace(
            `    const title = await verify({ wiki: c.wiki, actor: c.actor }).catch(() => null);\n    await sleep(700);\n    if (!title) {\n      dropped.push([c.actor, "unverified on Wikipedia"]);\n      await journal("rejections.jsonl", { op: "draft.reject", reason: "unverified on Wikipedia", actor_name: c.actor, character: c.character || "", wiki: c.wiki || "" });\n      continue;\n    }`,
            `    const receipt = autopilotReceiptFor(c, autopilot);\n    const title = receipt ? c.actor : await verify({ wiki: c.wiki, actor: c.actor }).catch(() => null);\n    if (!receipt) await sleep(700);\n    if (!title) {\n      dropped.push([c.actor, "unverified by Wikipedia or an exact Autopilot source receipt"]);\n      await journal("rejections.jsonl", { op: "draft.reject", reason: "unverified by Wikipedia or exact Autopilot source receipt", actor_name: c.actor, character: c.character || "", wiki: c.wiki || "" });\n      continue;\n    }`,
            'verification block'
          );
          replace(
            '      link: c.wiki || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(String(title).replace(/ /g, "_"))),',
            '      link: c.wiki || receipt?.source || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(String(title).replace(/ /g, "_"))),',
            'source-backed link'
          );
          replace(
            '    await journal("candidates.jsonl", { op: "draft.accept", specimen: row.id, actor_name: row.actor, character: row.character, universe: row.universe, production: row.production || "", link: row.link });',
            '    await journal("candidates.jsonl", { op: "draft.accept", specimen: row.id, actor_name: row.actor, character: row.character, universe: row.universe, production: row.production || "", link: row.link, verification: receipt ? "autopilot-source-receipt" : "wikipedia" });',
            'verification journal'
          );
          fs.writeFileSync(path,text);
          NODE
      - name: Make rendered Ferengi assertions derive from the exact generated catalog
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const path='tests/rendered/site.spec.mjs';
          let text=fs.readFileSync(path,'utf8');
          const before=`test("Ferengi URL preserves the makers anchor and shows only exact displayed roles plus the complete source ledger",async({page})=>{\n  await open(page,"index.html?shelf=Star+Trek&species=Ferengi#makers");\n  await waitForWall(page);\n  await expect(page).toHaveURL(/shelf=Star\\+Trek&species=Ferengi#makers$/);\n  await expect(page.getByRole("button",{name:"Star Trek",exact:true})).toHaveAttribute("aria-pressed","true");\n  await expect(page.getByRole("button",{name:"Ferengi",exact:true})).toHaveAttribute("aria-pressed","true");\n  await expect(page.locator("#result-status")).toHaveText("15 specimens match; 15 shown.");\n  const names=await page.locator(".charname").allTextContents();\n  expect(names).toEqual(["Quark","Rom","Nog","Quark (mirror)","Brunt (mirror)","Nog (mirror)","Ishka","Zek","Bok / Gral / Prak","Krax","DaiMon Lurin","Grimp","Leck","Pel","Berik"]);\n  expect(names).not.toContain("Weyoun");\n  expect(names).not.toContain("Neelix");\n  await expect(page.locator("#speciesContext")).toContainText("70 captured named credits");\n  await expect(page.locator("#speciesContext")).toContainText("16 additional performances on file");\n  await expect(page.locator("#speciesLedger > li")).toHaveCount(70);\n  await expect(page.locator("#makers")).toBeInViewport();\n});`;
          const after=`test("Ferengi URL preserves the makers anchor and shows only exact displayed roles plus the complete source ledger",async({page})=>{\n  await open(page,"index.html?shelf=Star+Trek&species=Ferengi#makers");\n  await waitForWall(page);\n  await expect(page).toHaveURL(/shelf=Star\\+Trek&species=Ferengi#makers$/);\n  await expect(page.getByRole("button",{name:"Star Trek",exact:true})).toHaveAttribute("aria-pressed","true");\n  await expect(page.getByRole("button",{name:"Ferengi",exact:true})).toHaveAttribute("aria-pressed","true");\n  const expected=await page.evaluate(async()=>{\n    const [species,specimens]=await Promise.all([fetch("./data/species.json").then(response=>response.json()),fetch("./data/specimens.json").then(response=>response.json())]);\n    const taxon=species.taxa.find(row=>row.key==="species:star-trek:ferengi");\n    const byId=new Map(specimens.map(row=>[row.id,row]));\n    return {counts:taxon.counts,names:taxon.wall_records.map(row=>byId.get(row.id).character)};\n  });\n  await expect(page.locator("#result-status")).toHaveText(\`${'${expected.counts.primary_card_records}'} specimens match; ${'${expected.counts.primary_card_records}'} shown.\`);\n  const names=await page.locator(".charname").allTextContents();\n  expect(names).toEqual(expected.names);\n  expect(names).toContain("Zek");\n  expect(names).toContain("Arridor");\n  expect(names).not.toContain("Weyoun");\n  expect(names).not.toContain("Neelix");\n  await expect(page.locator("#speciesContext")).toContainText(\`${'${expected.counts.named_credits}'} captured named credits\`);\n  await expect(page.locator("#speciesContext")).toContainText(\`${'${expected.counts.additional_performance_credits}'} additional performances on file\`);\n  await expect(page.locator("#speciesLedger > li")).toHaveCount(expected.counts.named_credits);\n  await expect(page.locator("#makers")).toBeInViewport();\n});`;
          if(!text.includes(before)) throw new Error('rendered Ferengi fixture block drifted');
          fs.writeFileSync(path,text.replace(before,after));
          NODE
      - name: Align capability documentation with source-credit filing
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          {
            const path='docs/AUTOPILOT-CAPABILITIES.md';
            let text=fs.readFileSync(path,'utf8');
            text=text.replace(
              'Active. The pool can research text evidence and inspect images, but cannot hear audio. It may lease capability-compatible physical tasks. Voice-mode tasks and exact reviewed voice overrides are skipped.',
              'Active. The pool can research exact text evidence and inspect images, but cannot hear audio. It may file an exact source-credited voice role at the conservative baseline without claiming an independently measured vocal distance. Exact task overrides still require audio when the performance itself cannot be established from the source record.'
            );
            text=text.replace(
              'The Sargon task is source-reviewed as a disembodied James Doohan voice even though its current census mode hint says `physical-prosthetic`. The exact task override therefore requires `audio-listening` and is pinned to its current source fingerprint. The policy also conservatively requires audio for `voice-animation` and `physical-and-voice` mode hints.',
              'The Sargon task is source-reviewed as a disembodied James Doohan voice even though its current census mode hint says `physical-prosthetic`. The exact task override therefore requires `audio-listening` and is pinned to its current source fingerprint. Ordinary exact source-credited voice roles may be filed at transform 2 without claiming a measured voice-distance score.'
            );
            fs.writeFileSync(path,text);
          }
          {
            const path='LUNA.md';
            let text=fs.readFileSync(path,'utf8');
            text=text.replace(
              '`text-vision` deliberately skips source-reviewed voice\nwork. `audio-vision` remains paused until three genuinely audio-capable independent\nblind reviewers are available through a reviewed policy change.',
              '`text-vision` may file an exact source-credited voice role at the conservative baseline without claiming a measured voice-distance score. `audio-vision` remains paused until three genuinely audio-capable independent blind reviewers are available through a reviewed policy change; exact task overrides may still require it.'
            );
            fs.writeFileSync(path,text);
          }
          {
            const path='GROW.md';
            let text=fs.readFileSync(path,'utf8');
            text=text.replace(
              'Merge them (keyless — verifies each on Wikipedia, dedups, assigns the next',
              'Merge them (keyless — verifies each through Wikipedia or an exact committed Autopilot source receipt, dedups, assigns the next'
            );
            fs.writeFileSync(path,text);
          }
          NODE
      - name: Resolve the exact Arridor media and task cycle
        run: |
          set -euo pipefail
          out=/tmp/star-trek-ferengi-bootstrap
          rm -rf "$out"
          mkdir -p "$out"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const context=JSON.parse(fs.readFileSync('data/review/trek-population-002-arridor-context.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const bySide=Object.fromEntries(audit.items.filter(item=>item.wall_id==='UC-1282').map(item=>[item.side,item]));
          if(context.wall_id!=='UC-1282'||context.task_id!=='ap_06b3c87ad3a1485e80ba650c'||context.lease_id!=='lease_346c1c420a89d489181c7267') throw new Error('Arridor context identity drifted');
          if(bySide.still?.asset?.sha256!=='e72b897a78188a0c2fcf081dba989d3e625083419ca1eb5226d49f5b62743000'||bySide.portrait?.asset?.sha256!=='28954b95726424e04741ac1ae500a8c565269e0ea8e9fab4dad51efa66fc7b5f') throw new Error('Arridor media hashes drifted');
          const at=new Date().toISOString();
          const resolution={
            version:2,reviewed_by:'chatgpt-second-desk',reviewed_role:'second-desk',reviewed_at:at,
            votes:[
              {item_id:bySide.still.id,namespace:'identity',value:'expected',enforced:true,note:'The exact Memory Alpha Arridor source and hash-bound image receipt identify the selected filmed Ferengi character as Arridor.',evidence:[{type:'performance-source',value:'https://memory-alpha.fandom.com/wiki/Arridor identifies Dan Shor as Arridor.'},{type:'asset-receipt',value:`${bySide.still.asset.sha256} ${bySide.still.asset.bytes} bytes from ${bySide.still.asset.origin}`}]},
              {item_id:bySide.still.id,namespace:'presentation',value:'character-depiction',enforced:true,note:'The exact bytes show a live-action Ferengi performance in complete prosthetic makeup, not artwork, a prop, or production material.',evidence:[{type:'second-desk-review',value:'Visual review of the exact hash-bound still confirms a filmed character depiction.'}]},
              {item_id:bySide.portrait.id,namespace:'identity',value:'expected',enforced:true,note:'The Wikimedia Commons file page names Dan Shor and binds the exact freely licensed portrait bytes.',evidence:[{type:'source-file-page',value:'https://commons.wikimedia.org/wiki/File:Dan_Shor_in_2004.jpg identifies Dan Shor.'},{type:'asset-receipt',value:`${bySide.portrait.asset.sha256} ${bySide.portrait.asset.bytes} bytes`}]},
              {item_id:bySide.portrait.id,namespace:'presentation',value:'neutral-human',enforced:true,note:'The exact bytes show a clear solo human portrait with the face visible, not a role depiction, group shot, or non-person image.',evidence:[{type:'second-desk-review',value:'Visual review of the exact hash-bound portrait confirms a neutral human depiction.'}]}
            ]
          };
          fs.writeFileSync('data/review/trek-population-002-arridor-media-resolution.json',JSON.stringify(resolution,null,2)+'\n');
          const source=context.source;
          const review={version:1,reviewed_by:'chatgpt-second-desk',lease_id:context.lease_id,reviews:[{task_id:context.task_id,records:[{
            wall_id:context.wall_id,
            still:{disposition:'verified',subject:'Arridor',source:source.still.origin,note:'The enforced hash-bound media ruling verifies this live-action Ferengi frame as Arridor.'},
            portrait:{disposition:'verified',subject:'Dan Shor',source:source.portrait.origin,note:'The enforced Commons file receipt verifies this neutral portrait as Dan Shor.'}
          }]}]};
          fs.writeFileSync('data/review/trek-population-002-arridor-post-merge-review.json',JSON.stringify(review,null,2)+'\n');
          NODE
          node scripts/media-audit.mjs resolve --input data/review/trek-population-002-arridor-media-resolution.json | tee "$out/media-resolution.log"
          node scripts/autopilot.mjs complete --input data/review/trek-population-002-arridor-post-merge-review.json | tee "$out/autopilot-complete.log"
          node scripts/media-audit.mjs gate --scope star-trek | tee "$out/media-gate.log"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const receipt={
            scope_id:'star-trek',lease_id:'lease_346c1c420a89d489181c7267',outcome:'completed',
            note:'The second visible population cycle filed Dan Shor as Arridor with exact source-bound still and portrait receipts, resolved the task, and returned the Star Trek media baseline to zero debt.',
            evidence:[
              {type:'workflow-run',value:`GitHub Actions run ${process.env.GITHUB_RUN_ID} — Arridor media resolution, task closure, and Ferengi saturation bootstrap.`},
              {type:'commit',value:'5c2a7aa5daea6c05d58db5072d91c517917a9f0a — restart-safe Arridor lease committed before processing.'},
              {type:'restart-proof',value:'Lease lease_346c1c420a89d489181c7267 remained durable through the failed first processing attempt and resumed without changing task identity or source fingerprint.'}
            ],
            reviewed_by:'chatgpt-second-desk',reviewed_role:'second-desk',reviewed_at:new Date().toISOString()
          };
          fs.writeFileSync('data/review/trek-population-002-arridor-cycle-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          node scripts/waterline.mjs record-cycle --input data/review/trek-population-002-arridor-cycle-receipt.json | tee "$out/cycle.log"
          node scripts/ferengi-fill.mjs accounting --report data/review/star-trek-five-way-accounting-2026-07-24.json --receipt data/review/trek-population-002-arridor-accounting-receipt.json | tee "$out/accounting.log"
          node scripts/waterline.mjs record-accounting --input data/review/trek-population-002-arridor-accounting-receipt.json | tee "$out/accounting-record.log"
      - name: Rebuild, validate, and arm the complete saturation pass
        run: |
          set -euo pipefail
          out=/tmp/star-trek-ferengi-bootstrap
          node scripts/credits.mjs > "$out/credits.log"
          node scripts/shard.mjs > "$out/shard.log"
          node scripts/build-contract.mjs > "$out/contract.log"
          node scripts/validate.mjs | tee "$out/validate.log"
          node scripts/autopilot.mjs validate | tee "$out/autopilot.log"
          node scripts/media-audit.mjs validate | tee "$out/media.log"
          node scripts/waterline.mjs validate | tee "$out/waterline.log"
          node scripts/species-fixtures.mjs | tee "$out/species.log"
          cat > .github/STAR-TREK-FERENGI-SATURATE.json <<'JSON'
          {
            "version": 1,
            "scope": "star-trek",
            "category": "Ferengi",
            "expected_remaining_named_credits": 36,
            "media_policy": "file exact source-backed cards now; absent stills and portraits render as canonical not-on-file evidence states",
            "operation": "drain-all-remaining-named-ferengi-credits"
          }
          JSON
          rm -f .github/STAR-TREK-FERENGI-BOOTSTRAP.json
          rm -f .github/workflows/star-trek-ferengi-bootstrap.yml
          git config user.name "undercast-population"
          git config user.email "undercast-population@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Population: close Arridor and arm full Ferengi saturation"
          git push origin HEAD:agent/star-trek-population-002
      - name: Retain bootstrap receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-ferengi-bootstrap-${{ github.run_id }}
          path: /tmp/star-trek-ferengi-bootstrap
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
