name: doctor-who-cycle-011-rastel-product-registrar-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-product-registrar-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-product-registrar-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-product-registrar-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-011-rastel-product-registrar-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-product-registrar-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-qualification
      PACKET: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-publication
      PUBLISHER_BRANCH: agent/doctor-who-cycle-011-rastel-publisher-current-main-v1
      PUBLISHER_WORKFLOW: doctor-who-cycle-011-rastel-publisher-current-main-v1
      PUBLICATION_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-publisher-current-main-v1-publication-
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      PRODUCT_TITLE: Doctor Who: complete reviewed cycle 011 for Rastel
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind registrar carrier and successful publisher
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$PACKET"
          mkdir -p "$OUT"/{api,payload,receipt,logs} "$PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          main='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$main"
          test "$(git rev-list --count "$main"..HEAD)" = 1
          test -z "$(git rev-list --merges "$main"..HEAD)"
          test "$(git diff --name-status "$main"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$main"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$PUBLISHER_BRANCH" -f per_page=100 > "$OUT/api/publisher-prs.json"
          CARRIER_PR="$pr" CARRIER_HEAD="$head" CURRENT_MAIN="$main" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'carrier.json').read_text())
          rows=json.loads((api/'publisher-prs.json').read_text())
          assert own['number']==int(os.environ['CARRIER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CURRENT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CARRIER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['PUBLISHER_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True and source['base']['sha']==os.environ['CURRENT_MAIN']
          (api/'publisher-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'publisher-head.txt').write_text(source['head']['sha']+'\n')
          (api/'publisher-number.txt').write_text(str(source['number'])+'\n')
          PY
          source_head="$(cat "$OUT/api/publisher-head.txt")"
          source_pr="$(cat "$OUT/api/publisher-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$PUBLISHER_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/publisher-runs.json"
            run_id="$(PUBLISHER_HEAD="$source_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/publisher-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['PUBLISHER_HEAD'] and row['name']==os.environ['PUBLISHER_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/publisher-run.json"
              if [ "$(jq -r '.status' "$OUT/api/publisher-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/publisher-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/publisher-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/publisher-artifacts.json"
          publish_job="$(jq -r '.jobs[] | select(.name=="publish" and .conclusion=="success") | .id' "$OUT/api/publisher-jobs.json")"
          test -n "$publish_job"
          publication_artifact="$(PUBLISHER_RUN="$run_id" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/publisher-artifacts.json').read_text())['artifacts']
          expected=os.environ['PUBLICATION_ARTIFACT_PREFIX']+os.environ['PUBLISHER_RUN']+'-attempt-1'
          rows=[row for row in rows if row['name']==expected and not row['expired']]
          assert len(rows)==1,(expected,[(row['id'],row['name']) for row in rows])
          print(rows[0]['id'])
          PY
          )"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$publication_artifact" > "$OUT/api/publication-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$publication_artifact/zip" > "$OUT/publication.zip"
          publication_sha="$(sha256sum "$OUT/publication.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/publication-artifact.json")" = "sha256:$publication_sha"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\nCURRENT_MAIN=%s\nPUBLISHER_PR=%s\nPUBLISHER_HEAD=%s\nPUBLISHER_RUN=%s\nPUBLISHER_JOB=%s\nPUBLICATION_ARTIFACT=%s\nPUBLICATION_ZIP_SHA256=%s\n' "$pr" "$head" "$main" "$source_pr" "$source_head" "$run_id" "$publish_job" "$publication_artifact" "$publication_sha" >> "$GITHUB_ENV"

      - name: Authenticate publication and freeze product PR payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); payload=root/'payload'; sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(root/'publication.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  out=packet/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledgers=[]
          for sealed in packet.rglob('SHA256SUMS'):
              pre=sealed.with_name('SHA256SUMS.pre')
              if not pre.is_file():continue
              assert sha(pre.read_bytes())==sealed.read_text().split()[0]
              base=sealed.parent; count=0
              for raw in pre.read_text().splitlines():
                  if not raw.strip():continue
                  digest,name=raw.split(None,1); path=base/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; count+=1
              ledgers.append({'root':base.relative_to(packet).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
          assert ledgers
          rows=[]
          for path in packet.rglob('*.json'):
              try:data=json.loads(path.read_text())
              except Exception:continue
              if data.get('status')=='cycle-011-rastel-current-main-product-published-v1':rows.append((path,data))
          assert len(rows)==1,[p.as_posix() for p,_ in rows]
          path,publication=rows[0]
          identity=publication.pop('identity'); assert sha(json.dumps(publication,sort_keys=True,separators=(',',':')).encode())==identity; publication['identity']=identity
          product=publication['product']
          assert product['branch']==os.environ['TARGET_BRANCH'] and product['parent']==os.environ['CURRENT_MAIN']
          assert publication['boundary']=={'exact_nonforced_branch_creation':True,'main_mutation':False,'force_update':False,'cycle_012_authorized':False}
          assert os.popen(f"gh api '/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/{os.environ['TARGET_BRANCH']}' --jq '.object.sha'").read().strip()==product['commit']
          import subprocess
          assert subprocess.check_output(['git','show','-s','--format=%P',product['commit']],text=True).strip()==product['parent']
          assert subprocess.check_output(['git','show','-s','--format=%T',product['commit']],text=True).strip()==product['tree']
          assert len(subprocess.check_output(['git','diff','--name-only',product['parent'],product['commit']],text=True).splitlines())==product['paths']
          body=f'''## Exact workflow-free cycle-011 product\n\nThis pull request contains the independently reviewed and non-forcedly published Doctor Who cycle-011 Rastel product. Its head is exactly one commit over canonical `main`, contains {product['paths']} permanent workflow-free paths, and may be integrated only by advancing `main` to the exact head commit without merge, squash, rebase, or force.\n\n```text\ncanonical parent:\n{product['parent']}\n\nproduct commit:\n{product['commit']}\n\nproduct tree:\n{product['tree']}\n\ncommits / paths:\n1 / {product['paths']}\n```\n\nThe product resolves the exact preserved obligation:\n\n```text\ntask:\n{os.environ['TASK_ID']}\n\nlease:\n{os.environ['EXPECTED_LEASE']}\n\nwall:\n{os.environ['WALL_ID']}\n\nperformer / role / mode:\nDan Starkey / Rastel / voice\n\nqueue:\n306 queued / 10 resolved / 0 in flight\n->\n305 queued / 11 resolved / 0 in flight\n\nportrait SHA-256:\n{os.environ['PORTRAIT_SHA256']}\n\ncharacter still:\nhonestly absent\n\nmedia debt:\n0\n\ncycle 012:\nunauthorized\n```\n\nExact publication custody:\n\n```text\npublisher PR / head:\n#{os.environ['PUBLISHER_PR']} / {os.environ['PUBLISHER_HEAD']}\n\nrun / job / artifact:\n{os.environ['PUBLISHER_RUN']} / {os.environ['PUBLISHER_JOB']} / {os.environ['PUBLICATION_ARTIFACT']}\n\nartifact SHA-256:\n{os.environ['PUBLICATION_ZIP_SHA256']}\n\npublication identity:\n{identity}\n```\n\nCanonical advancement remains a separate guarded transaction. Does the exact product remain one workflow-free child of `{product['parent'][:12]}…`, preserve the independently approved Rastel state, and support only a non-forced canonical fast-forward?\n'''
          payload.mkdir(parents=True,exist_ok=True)
          (payload/'body.md').write_text(body)
          registration={'status':'cycle-011-rastel-product-pr-registration-authorized-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'base':os.environ['CURRENT_MAIN']},'publisher':{'pr':int(os.environ['PUBLISHER_PR']),'head':os.environ['PUBLISHER_HEAD'],'run':int(os.environ['PUBLISHER_RUN']),'job':int(os.environ['PUBLISHER_JOB']),'artifact':int(os.environ['PUBLICATION_ARTIFACT']),'artifact_sha256':os.environ['PUBLICATION_ZIP_SHA256'],'publication_identity':identity},'product':product,'title':os.environ['PRODUCT_TITLE'],'body_sha256':sha(body.encode()),'target_branch':os.environ['TARGET_BRANCH'],'ledgers':ledgers,'boundary':{'create_or_verify_exact_draft_pr_only':True,'product_ref_mutation':False,'main_mutation':False,'merge':False,'cycle_012_authorized':False}}
          registration['identity']=sha(json.dumps(registration,sort_keys=True,separators=(',',':')).encode())
          (payload/'registration.json').write_text(json.dumps(registration,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-product-registrar-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-qualification/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-product-registrar-v1-qualification-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-qualification
            /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-publication
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  register:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      PACKET: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-register-input
      OUT: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-registration
      QUALIFICATION_NAME: doctor-who-cycle-011-rastel-product-registrar-v1-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate same-run registration authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PACKET" "$OUT"
          mkdir -p "$PACKET" "$OUT"/{api,receipt,logs}
          artifact=''
          for attempt in $(seq 1 60); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$OUT/api/run-artifacts.json"
            artifact="$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/run-artifacts.json').read_text())['artifacts']
          rows=[row for row in rows if row['name']==os.environ['QUALIFICATION_NAME'] and not row['expired']]
          print(rows[0]['id'] if len(rows)==1 else '')
          PY
          )"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/qualification-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/qualification.zip"
          zip_sha="$(sha256sum "$OUT/qualification.zip" | awk '{print $1}')"
          test "$(jq -r '.digest' "$OUT/api/qualification-artifact.json")" = "sha256:$zip_sha"
          QUALIFICATION_ARTIFACT="$artifact" QUALIFICATION_ZIP_SHA256="$zip_sha" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(os.environ['OUT']); packet=Path(os.environ['PACKET']); sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(out/'qualification.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():continue
                  target=packet/path; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          pre=packet/'SHA256SUMS.pre'; sealed=packet/'SHA256SUMS'; assert sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=packet/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          registration=json.loads((packet/'registration.json').read_text()); identity=registration.pop('identity'); assert sha(json.dumps(registration,sort_keys=True,separators=(',',':')).encode())==identity; registration['identity']=identity
          assert registration['status']=='cycle-011-rastel-product-pr-registration-authorized-v1' and registration['target_branch']==os.environ['TARGET_BRANCH']
          assert registration['boundary']=={'create_or_verify_exact_draft_pr_only':True,'product_ref_mutation':False,'main_mutation':False,'merge':False,'cycle_012_authorized':False}
          assert sha((packet/'body.md').read_bytes())==registration['body_sha256']
          (out/'receipt/authorization.json').write_text(json.dumps(registration,indent=2,sort_keys=True)+'\n')
          PY
          product="$(jq -r '.product.commit' "$OUT/receipt/authorization.json")"
          parent="$(jq -r '.product.parent' "$OUT/receipt/authorization.json")"
          title="$(jq -r '.title' "$OUT/receipt/authorization.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$product"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$parent"
          printf 'QUALIFICATION_ARTIFACT=%s\nQUALIFICATION_ZIP_SHA256=%s\nPRODUCT=%s\nPARENT=%s\nPRODUCT_TITLE=%s\n' "$artifact" "$zip_sha" "$product" "$parent" "$title" >> "$GITHUB_ENV"

      - name: Create or verify exact draft product pull request
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$TARGET_BRANCH" -f per_page=100 > "$OUT/api/product-prs-before.json"
          product_pr="$(python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/product-prs-before.json').read_text())
          rows=[row for row in rows if row['head']['ref']==os.environ['TARGET_BRANCH']]
          open_rows=[row for row in rows if row['state']=='open' and not row['merged']]
          merged=[row for row in rows if row['merged']]
          assert not merged,[(row['number'],row['merge_commit_sha']) for row in merged]
          if open_rows:
              assert len(open_rows)==1
              row=open_rows[0]
              assert row['head']['sha']==os.environ['PRODUCT'] and row['base']['ref']=='main' and row['base']['sha']==os.environ['PARENT'] and row['draft'] is True
              print(row['number'])
          else:
              url=subprocess.check_output(['gh','pr','create','--repo',os.environ['GITHUB_REPOSITORY'],'--base','main','--head',os.environ['TARGET_BRANCH'],'--draft','--title',os.environ['PRODUCT_TITLE'],'--body-file',str(Path(os.environ['PACKET'])/'body.md')],text=True).strip()
              print(url.rstrip('/').split('/')[-1])
          PY
          )"
          test -n "$product_pr"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$product_pr" > "$OUT/api/product-pr.json"
          test "$(jq -r '.state' "$OUT/api/product-pr.json")" = open
          test "$(jq -r '.draft' "$OUT/api/product-pr.json")" = true
          test "$(jq -r '.merged' "$OUT/api/product-pr.json")" = false
          test "$(jq -r '.head.ref' "$OUT/api/product-pr.json")" = "$TARGET_BRANCH"
          test "$(jq -r '.head.sha' "$OUT/api/product-pr.json")" = "$PRODUCT"
          test "$(jq -r '.base.ref' "$OUT/api/product-pr.json")" = main
          test "$(jq -r '.base.sha' "$OUT/api/product-pr.json")" = "$PARENT"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PARENT"
          printf 'PRODUCT_PR=%s\n' "$product_pr" >> "$GITHUB_ENV"

      - name: Seal exact registration receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); auth=json.loads((root/'receipt/authorization.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt={'status':'cycle-011-rastel-product-pr-registered-v1','version':1,'run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'qualification':{'artifact':int(os.environ['QUALIFICATION_ARTIFACT']),'artifact_sha256':os.environ['QUALIFICATION_ZIP_SHA256'],'authorization_identity':auth['identity']},'product':{'pr':int(os.environ['PRODUCT_PR']),'branch':os.environ['TARGET_BRANCH'],'commit':os.environ['PRODUCT'],'parent':os.environ['PARENT']},'boundary':{'draft_pr_registered':True,'product_ref_mutation':False,'main_mutation':False,'merge':False,'cycle_012_authorized':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/registration.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-product-registrar-v1-registration-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-registration
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-product-registrar-v1-registration-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-register-input
            /tmp/doctor-who-cycle-011-rastel-product-registrar-v1-registration
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
