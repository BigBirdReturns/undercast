name: card-backfill-install-reducer-yield

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-install-reducer-yield.yml'

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: card-backfill-install-reducer-yield-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      INSTALL_HEAD: ${{ github.sha }}
    steps:
      - name: Publish observable installation heartbeat
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${INSTALL_HEAD}" \
            -f state=pending \
            -f context='card-backfill/reducer-yield-install' \
            -f description="run ${GITHUB_RUN_ID}: installing exact reducer-to-supervisor handoff" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind the one-shot installation head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INSTALL_HEAD"
          echo "PASS — reducer-yield installation bound to $INSTALL_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Construct and stage the exact permanent transaction
        run: |
          set -euo pipefail
          node scripts/card-backfill-install-reducer-yield.mjs
          rm \
            scripts/card-backfill-install-reducer-yield.mjs \
            .github/workflows/card-backfill-install-reducer-yield.yml
          git add -A -- \
            .github/workflows/card-backfill-amortized-wave.yml \
            .github/workflows/card-backfill-install-reducer-yield.yml \
            scripts/card-backfill-amortization-fixtures.mjs \
            scripts/card-backfill-install-reducer-yield.mjs
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'PATHS'
          .github/workflows/card-backfill-amortized-wave.yml
          .github/workflows/card-backfill-install-reducer-yield.yml
          scripts/card-backfill-amortization-fixtures.mjs
          scripts/card-backfill-install-reducer-yield.mjs
          PATHS
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test -z "$(git diff --name-only)"
          echo 'PASS — exact transaction staged; one-shot machinery retired before validation'

      - uses: ./.github/actions/card-backfill-runtime
        with:
          profile: local-desk

      - name: Install complete rendered-gate runtime
        run: npx playwright install --with-deps chromium

      - name: Prove focused routing and amortization contracts
        run: |
          set -euo pipefail
          node scripts/card-backfill-amortization-fixtures.mjs
          node scripts/card-backfill-route-next-fixtures.mjs

      - name: Run the complete repository gate
        run: npm run gate

      - name: Commit the exact permanent handoff and fan out
        run: |
          set -euo pipefail
          git diff --cached --check
          test -z "$(git diff --name-only)"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-final.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual-final.txt"
          git config user.name 'undercast-card-backfill-supervisor-wiring'
          git config user.email 'undercast-card-backfill-supervisor-wiring@users.noreply.github.com'
          git commit -m 'Card backfill: yield reducers directly to supervisor'
          remote_head=$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')
          if [ "$remote_head" != "$INSTALL_HEAD" ]; then
            echo "branch moved from installation head $INSTALL_HEAD to $remote_head; refusing stale handoff push" >&2
            exit 1
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
          final_head=$(git rev-parse HEAD)
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f reason=reducer-yield-installed
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${final_head}" \
            -f state=success \
            -f context='card-backfill/reducer-yield-install' \
            -f description='durable reducer yield installed; supervisor dispatched; manual_continue_required=false' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'

      - name: Publish observable installation failure
        if: failure()
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${INSTALL_HEAD}" \
            -f state=failure \
            -f context='card-backfill/reducer-yield-install' \
            -f description="run ${GITHUB_RUN_ID}: reducer-yield installation failed before permanent push" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
