name: card-backfill-uc-077-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-077-RENDER.json"
      - "scripts/card-backfill-uc-077-render.mjs"
      - ".github/workflows/card-backfill-uc-077-render.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-077-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-017'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-017
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-077 render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-077-RENDER.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_3a0656746243c69d45effb60');
          if(row.version!==1||row.record_id!=='UC-077'||row.actor!=='Peter Boyle'||row.character!=='The Monster'||row.side!=='still')throw new Error('UC-077 render authorization drift');
          if(row.targeted_artifact?.artifact_id!==8642853136||row.targeted_artifact?.head_sha!=='00bba40e71a212e66aa940a975c26a0375b6df03')throw new Error('UC-077 targeted custody drift');
          if(row.source?.sha256!=='3e8e920111381dbb6281de245a69513e3e8739d9f19fcb6510053c455658762f'||row.source?.width!==1200||row.source?.height!==798)throw new Error('UC-077 source identity drift');
          if(!audit||audit.wall_id!=='UC-077'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-077 audit boundary drift');
          console.log(`PASS — UC-077 render control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Render exact candidate and evidence packet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-077-render
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-077-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-077-render-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact source, render, crop, reviews, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-077-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-077-render
            ${{ runner.temp }}/card-backfill-uc-077-render-run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
