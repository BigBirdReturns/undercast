name: card-backfill-uc-118-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-118-RENDER.json"
      - "scripts/card-backfill-uc-118-render.mjs"
      - ".github/workflows/card-backfill-uc-118-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-118-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-028'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-028
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-118 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-118-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-118');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-118');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0a3724582c82ea7595990893');
          if(row.version!==1||row.record_id!=='UC-118'||row.actor!=='Frank Oz'||row.character!=='Yoda, Miss Piggy & Fozzie'||row.production!=='The Muppets / Star Wars'||row.year!==1976||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-118 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8699303205||row.discovery_artifact?.head_sha!=='2a1edb5871757ae5d0d990b4bc1d397943074673'||row.discovery_artifact?.candidate_count!==35)throw new Error('UC-118 discovery custody drift');
          if(row.roles?.length!==3||row.roles[0]?.key!=='yoda'||row.roles[1]?.key!=='miss-piggy'||row.roles[2]?.key!=='fozzie')throw new Error('UC-118 role denominator drift');
          if(row.roles[0]?.sha256!=='012fee2874de6332328482180d44a9c036eb8d08c775b95d03ecbd0da2597a14'||row.roles[1]?.sha256!=='a06f34dadc6603e75df707365d12baf7b71e6fbcd1c6240ee721e96baaf377e4'||row.roles[2]?.sha256!=='4ad410148153720798a5007f6f0ba45cb31398944bf22364cc884aaffd1621b9')throw new Error('UC-118 selected source drift');
          if(row.actor_role_custody?.length!==2||row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.top_height!==490||row.render?.bottom_width!==624||row.render?.bottom_height!==498||row.render?.horizontal_gap!==12||row.render?.vertical_gap!==12||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-118 render geometry drift');
          if(!specimen||specimen.actor!=='Frank Oz'||specimen.character!=='Yoda, Miss Piggy & Fozzie'||specimen.production!=='The Muppets / Star Wars'||specimen.years!=='1976'||specimen.still)throw new Error('UC-118 specimen boundary drift');
          if(source?.still)throw new Error('UC-118 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-118'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-118 audit boundary drift');
          console.log('PASS — exact UC-118 Frank Oz three-role landscape render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8699303205/zip" > "$root/discovery.zip"
          echo "9abe0f6a24a6e55185495d1c306dbfc619d55a15796de1cf9fd9b72e941546c4  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-118-discover"
          echo "c62c4c69088b31bb0d2dd4ec3e99cb3d4f21271cee1b3285877351d252739214  $source/manifest.json" | sha256sum -c -
          echo "887db5680d4b6cdd62761a0489072a1812776dd51564129527bb1cccb9cfb621  $source/summary.json" | sha256sum -c -
          echo "e32234d336609d620ec5cfbc0b690532cdd83fb8342e962dcd74ba6d6ccca0d6  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "7820139d80cd2d3540be99fcc3f532d37d40c49f65f05b8955566ef8ae5b76bd  $source/contact-sheet-yoda.jpg" | sha256sum -c -
          echo "271eaac8b4ed78fde18d8bdfc281a89a94876a9d6e54b55ea3694d7c5fcdb06e  $source/contact-sheet-miss-piggy.jpg" | sha256sum -c -
          echo "3bc9c32653fe515e9459faecff9fe1b7d4c558fccc3bc977dab8dbe02c9a658c  $source/contact-sheet-fozzie.jpg" | sha256sum -c -
          echo "02012b9364aacb1d683da33d5022bdcc806582fe8a3694ef06952bf97cf7b485  $source/pages/starwars-frank-oz-yoda.png" | sha256sum -c -
          echo "2695cf7690ddf9ed0280c9b0f62270c8e05c7f7cacd5a28ece153fc4cf75743b  $source/pages/henson-founders-frank-oz-muppets.png" | sha256sum -c -
          echo "a6cad04288f1ae27e67c53c8bc213900e2a05093f6553b6b27775bf0946df575  $source/pages/starwars-size-matters-not.png" | sha256sum -c -
          echo "9269a052fb63ee787a757d6ad945aa435dd9838cbdd090c641b62e1e1d31cdaa  $source/pages/henson-miss-piggy-pool.png" | sha256sum -c -
          echo "cff9a8f9e63732f0cf3c6f8bd11e3e653eb4335077e77646d0e76e171bfac438  $source/pages/henson-fozzie-behind-camera.png" | sha256sum -c -
          echo "012fee2874de6332328482180d44a9c036eb8d08c775b95d03ecbd0da2597a14  $source/candidates/yoda/023-og-image.jpg" | sha256sum -c -
          echo "a06f34dadc6603e75df707365d12baf7b71e6fbcd1c6240ee721e96baaf377e4  $source/candidates/miss-piggy/002-gmc-808-piggyswimstill.jpg" | sha256sum -c -
          echo "4ad410148153720798a5007f6f0ba45cb31398944bf22364cc884aaffd1621b9  $source/candidates/fozzie/002-mm-23753-rowlffozzie.jpg" | sha256sum -c -
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-118-render/discovery/card-backfill-uc-118-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-118-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-118-render"
          node --check scripts/card-backfill-uc-118-render.mjs
          node scripts/card-backfill-uc-118-render.mjs 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-118-render"
          rm -rf "$root/discovery" "$root/discovery.zip"
      - name: Upload exact sources, role receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-118-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-118-render/output
            ${{ runner.temp }}/card-backfill-uc-118-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
