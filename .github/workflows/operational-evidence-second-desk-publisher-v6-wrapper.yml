name: operational-evidence-second-desk-publisher-v9-wrapper

"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/operational-evidence-second-desk-publisher-v6-wrapper.yml"

permissions: {}

concurrency:
  group: operational-evidence-second-desk-publisher-v9-wrapper
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/undercast' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLER_MAIN: ${{ github.sha }}
      REVIEW_BASE: 37d681f419db5ef874b2cc41df1c631c047218d8
      V3_WORKFLOW_BLOB: c28876fda070c0da6df9acde7bf49a4e98d1bda7
      IGNITER_WORKFLOW_BLOB: cb1d999205d927120d7a7a4251621b47a67b31b7
      V9_WRAPPER_BLOB: f1607d686d6d7d8871de7dd68ec0aa12c40ad336
      WRAPPER_PATH: .github/workflows/operational-evidence-second-desk-publisher-v6-wrapper.yml
      PRODUCT_BRANCH: agent/operational-evidence-second-desk-product-v9-20260806
      PRODUCT_TITLE: "Operations: refresh reviewed exact-main reliability evidence (V9)"
      PUBLISH_ROOT: /tmp/undercast-operational-second-desk-publisher-v9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind descendant-safe trusted-main wrapper
        shell: bash
        run: |
          set -euo pipefail
          root="$PUBLISH_ROOT"
          rm -rf "$root"
          mkdir -p "$root"/{diagnostics,receipt}
          test "$GITHUB_REPOSITORY" = 'BigBirdReturns/undercast'
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$INSTALLER_MAIN"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 1
          installer_parent="$(git rev-parse HEAD^)"
          git merge-base --is-ancestor "$REVIEW_BASE" "$installer_parent"
          test "$(git diff --name-only "$installer_parent..$INSTALLER_MAIN")" = "$WRAPPER_PATH"
          test "$(git hash-object .github/workflows/operational-evidence-second-desk-publisher.yml)" = "$V3_WORKFLOW_BLOB"
          test "$(git hash-object .github/workflows/operational-evidence-second-desk-workflow-run.yml)" = "$IGNITER_WORKFLOW_BLOB"
          test "$(git rev-parse "$installer_parent:$WRAPPER_PATH")" = "$V9_WRAPPER_BLOB"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLER_MAIN"
          printf 'INSTALLER_PARENT=%s\n' "$installer_parent" >> "$GITHUB_ENV"

      - name: Recover and execute reviewed V3 publisher as V9
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import YAML from 'yaml';

          const workflow = YAML.parse(
            readFileSync('.github/workflows/operational-evidence-second-desk-publisher.yml', 'utf8'),
            { schema: 'core', uniqueKeys: true, maxAliasCount: 100 },
          );
          const step = workflow.jobs?.publish?.steps?.find(
            (row) => row?.name === 'Publish the exact reviewed 27-path product',
          );
          if (!step || typeof step.run !== 'string') throw new Error('V3 publisher shell block is missing');
          if (!/^[0-9a-f]{40}$/.test(process.env.INSTALLER_PARENT || '')) throw new Error('installer parent is missing');
          let source = step.run;
          const replaceOnce = (oldValue, newValue, label) => {
            const count = source.split(oldValue).length - 1;
            if (count !== 1) throw new Error(`${label} replacement count ${count}`);
            source = source.replace(oldValue, newValue);
          };
          replaceOnce(
            "expected_parent='3228efd6ede786586352b1b990a94d16ab02d5f9'",
            `expected_parent='${process.env.INSTALLER_PARENT}'`,
            'runtime wrapper parent',
          );
          replaceOnce(
            "workflow_path='.github/workflows/operational-evidence-second-desk-publisher.yml'",
            "workflow_path='.github/workflows/operational-evidence-second-desk-publisher-v6-wrapper.yml'",
            'wrapper path',
          );
          const oldBoundary = [
            "assert settlement['boundary'] == {",
            "    'cost_observation_invented': False,",
            "    'external_contact_or_review': False,",
            "    'live_publication_changed': False,",
            "    'outside_human_dependency': False,",
            "    'rights_observation_invented': False,",
            "    'roadmap_recompleted': False,",
            "}",
          ].join('\n');
          const reviewedBoundary = [
            "assert settlement['boundary'] == {",
            "    'canonical_corpus_changed': False,",
            "    'cost_observation_invented': False,",
            "    'external_contact_or_review': False,",
            "    'live_publication_changed': False,",
            "    'operational_reliability_completed_again': False,",
            "    'outside_human_dependency': False,",
            "    'owner_physical_action': False,",
            "    'rights_observation_invented': False,",
            "    'roadmap_state_changed': False,",
            "    'roadmap_state_sha256': 'c010ca3dd05f3b826417d39b3306d76b662c0ba6caf0eb73dfc2440599dac77a',",
            "    'source_graph_changed': False,",
            "}",
          ].join('\n');
          replaceOnce(oldBoundary, reviewedBoundary, 'review boundary schema');
          const oldBlobCustody = [
            "assert hashlib.sha256(data).hexdigest() == row['sha256']",
            "        target = payload / member.name",
          ].join('\n');
          const reviewedBlobCustody = [
            "assert hashlib.sha256(data).hexdigest() == row['sha256']",
            "        git_blob = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\\0' + data).hexdigest()",
            "        assert git_blob == row['git_blob']",
            "        target = payload / member.name",
          ].join('\n');
          replaceOnce(oldBlobCustody, reviewedBlobCustody, 'manifest Git-blob custody');
          replaceOnce(
            "assert stat.S_IMODE(member.mode) == int(row['mode'], 8)",
            "assert stat.S_IMODE(member.mode) == (int(row['mode'], 8) & 0o7777)",
            'Git-mode versus TAR-permission custody',
          );
          replaceOnce(
            'git worktree add --detach "$root/review-worktree" "$review_base"',
            [
              'git diff --name-only "$review_base..$expected_parent" | LC_ALL=C sort -u > "$root/diagnostics/parent-delta-paths"',
              'comm -12 "$root/diagnostics/parent-delta-paths" "$root/paths" > "$root/diagnostics/parent-product-overlap"',
              "[[ ! -s \"$root/diagnostics/parent-product-overlap\" ]] || fail 'parent delta overlaps reviewed product paths'",
              'git worktree add --detach "$root/review-worktree" "$review_base"',
            ].join('\n'),
            'reviewed-path overlap guard',
          );
          const flowStart = `[[ "$(main_sha)" == "$INSTALLER_MAIN" ]] || fail 'main advanced during artifact review'`;
          const flowEnd = `[[ "$(main_sha)" == "$INSTALLER_MAIN" ]] || fail 'main advanced before branch publication'`;
          const startIndex = source.indexOf(flowStart);
          const endIndex = source.indexOf(flowEnd, startIndex);
          if (startIndex < 0 || endIndex < 0 || source.indexOf(flowStart, startIndex + 1) >= 0) {
            throw new Error('candidate publication flow markers drifted');
          }
          const committedGateFlow = String.raw`[[ "$(main_sha)" == "$INSTALLER_MAIN" ]] || fail 'main advanced during artifact review'
          while IFS= read -r path; do
            mkdir -p "$(dirname "$path")"
            cp "$root/payload/$path" "$path"
            cmp -s "$root/payload/$path" "$path" || fail "candidate byte drift: $path"
          done < "$root/paths"

          git add --pathspec-from-file="$root/paths"
          git diff --cached --name-only | LC_ALL=C sort > "$root/staged-paths"
          diff -u "$root/paths" "$root/staged-paths"
          staged_count="$(git diff --cached --name-only | wc -l | tr -d '[:space:]')"
          status_count="$(git status --porcelain=v1 --untracked-files=all | wc -l | tr -d '[:space:]')"
          [[ "$staged_count" == 27 && "$status_count" == 27 ]] || fail 'product worktree denominator drifted'
          git diff --cached --check

          ROOT="$root" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          manifest = json.loads((root / "artifact" / "manifest.json").read_text())
          for row in manifest["files"]:
              blob = subprocess.check_output(["git", "hash-object", row["path"]], text=True).strip()
              assert blob == row["git_blob"], f"candidate custody blob drifted for {row['path']}"
          PY

          git config user.name undercast-operations
          git config user.email undercast-operations@users.noreply.github.com
          git commit -m 'Operations: refresh reviewed exact-main reliability evidence'
          product_commit="$(git rev-parse HEAD)"
          product_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$(git rev-parse HEAD^)" == "$INSTALLER_MAIN" ]] || fail 'product parent drifted'
          [[ "$(git rev-list --count "$INSTALLER_MAIN..HEAD")" == 1 ]] || fail 'product commit count drifted'
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || fail 'product commit worktree is dirty'

          ROOT="$root" PRODUCT_COMMIT="$product_commit" python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          commit = os.environ["PRODUCT_COMMIT"]
          manifest = json.loads((root / "artifact" / "manifest.json").read_text())
          for row in manifest["files"]:
              blob = subprocess.check_output(["git", "rev-parse", f"{commit}:{row['path']}"], text=True).strip()
              assert blob == row["git_blob"], f"product commit custody blob drifted for {row['path']}"
          PY

          npm ci
          npx playwright install --with-deps chromium
          set -o pipefail
          npm run gate 2>&1 | tee "$root/diagnostics/complete-gate.log"
          [[ "$(git rev-parse HEAD)" == "$product_commit" ]] || fail 'gate moved product head'
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || fail 'gate left product worktree dirty'

          `;
          source = source.slice(0, startIndex) + committedGateFlow + source.slice(endIndex);
          source = source.replaceAll('V3', 'V9');
          writeFileSync('/tmp/operational-evidence-second-desk-publisher-v9.sh', `#!/usr/bin/env bash\n${source}`);
          NODE
          bash -n /tmp/operational-evidence-second-desk-publisher-v9.sh
          sha256sum /tmp/operational-evidence-second-desk-publisher-v9.sh | tee "$PUBLISH_ROOT/diagnostics/executed-script.sha256"
          bash /tmp/operational-evidence-second-desk-publisher-v9.sh

      - name: Upload exact V9 publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: operational-evidence-second-desk-publication-v9-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/undercast-operational-second-desk-publisher-v9/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove partial V9 publication after any later failure
        if: failure()
        shell: bash
        run: |
          set +e
          root="$PUBLISH_ROOT"
          pr=""
          if [ -f "$root/product-pr.txt" ]; then
            pr="$(cat "$root/product-pr.txt")"
          fi
          if [ -z "$pr" ]; then
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PRODUCT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          [ -z "$pr" ] || gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment 'Closed automatically because V9 publication did not reach terminal success.'
          gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$PRODUCT_BRANCH" >/dev/null 2>&1 || true

      - name: Upload V9 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: operational-evidence-second-desk-publication-v9-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/undercast-operational-second-desk-publisher-v9
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
