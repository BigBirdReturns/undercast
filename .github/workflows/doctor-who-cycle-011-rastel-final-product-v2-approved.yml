name: doctor-who-cycle-011-rastel-final-product-v2-approved

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-final-product-v2-approved.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-final-product-v2-approved
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-final-product-v2-approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      EXACT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-final-product-v2-approved
      SELF: .github/workflows/doctor-who-cycle-011-rastel-final-product-v2-approved.yml
      SOURCE_HEAD: 9c8bb845dd4a3641137856cea81c6968b24abcd4
      SOURCE_PATH: .github/workflows/doctor-who-cycle-011-rastel-final-product-v1.yml
      SOURCE_BLOB: 22536af17767e5fe9c1effbf7fadeefd3ab9888c
      SOURCE_STEM: doctor-who-cycle-011-rastel-final-product-v1
      TARGET_STEM: doctor-who-cycle-011-rastel-final-product-v2-approved
      OUT: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-worktree
      FINALWT: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-final
      CONTROL: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-control
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-bootstrap
      V1_PACKET: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-v1
      V1_PR: "774"
      V1_HEAD: 9c8bb845dd4a3641137856cea81c6968b24abcd4
      V1_RUN: "31335038659"
      V1_JOB: "93299398478"
      V1_ARTIFACT: "9044061664"
      V1_ARTIFACT_DIGEST: "sha256:a93163c993c56b4c1a2df402f84b75e2cc3bd0e4c74c7c4e99ec5ba926a4aa6c"
      V1_ARTIFACT_FILES: "7"
      V1_DERIVATION_PATCH_BYTES: "50907"
      V1_DERIVATION_PATCH_SHA256: 956f641fc20a511657f4260747b789440c107489a6146119308ad00f00257c2e
      DETERMINISTIC_PATCH_BYTES: "50719"
      DETERMINISTIC_PATCH_SHA256: 4f1f72862f88a939e4d221093d90d61da86a9dce1c2d0e586b63c3b6704c5905

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V1 receipt-derivation failure and recover exact programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$V1_PACKET"
          mkdir -p "$BOOTSTRAP"/{api,scripts} "$V1_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$EXACT_MAIN")" = "$EXACT_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$BOOTSTRAP/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V1_PR" > "$BOOTSTRAP/api/v1-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN" > "$BOOTSTRAP/api/v1-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V1_RUN/jobs?per_page=100" > "$BOOTSTRAP/api/v1-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT" > "$BOOTSTRAP/api/v1-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V1_ARTIFACT/zip" > "$BOOTSTRAP/v1.zip"
          test "$(sha256sum "$BOOTSTRAP/v1.zip" | awk '{print $1}')" = "${V1_ARTIFACT_DIGEST#sha256:}"
          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_HEAD" > "$BOOTSTRAP/api/source.json"
          CURRENT_HEAD="$head" CURRENT_PR="$pr" CURRENT_BASE="$base" python3 - <<'PY'
          import base64,hashlib,json,os,re,shlex,subprocess,textwrap,zipfile,yaml
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['BOOTSTRAP']); api=root/'api'; packet=Path(os.environ['V1_PACKET'])
          sha=lambda data:hashlib.sha256(data).hexdigest()
          load=lambda name:json.loads((api/name).read_text())
          own=load('carrier.json'); v1=load('v1-pr.json'); run=load('v1-run.json')
          jobs=load('v1-jobs.json')['jobs']; artifact=load('v1-artifact.json')
          assert own['number']==int(os.environ['CURRENT_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['EXACT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['CURRENT_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert v1['number']==int(os.environ['V1_PR']) and v1['state']=='open' and v1['draft'] is True and v1['merged'] is False
          assert v1['base']['sha']==os.environ['EXACT_MAIN'] and v1['head']['sha']==os.environ['V1_HEAD'] and v1['head']['ref']=='agent/doctor-who-cycle-011-rastel-final-product-v1'
          assert v1['commits']==1 and v1['changed_files']==1
          assert run['id']==int(os.environ['V1_RUN']) and run['name']=='doctor-who-cycle-011-rastel-final-product-v1'
          assert run['head_sha']==os.environ['V1_HEAD'] and run['status']=='completed' and run['conclusion']=='failure' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['V1_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='failure'
          assert any(row['name']=='Reconstruct exact source and receipt-bearing Rastel finalizer' and row['status']=='completed' and row['conclusion']=='failure' for row in job['steps'])
          assert any(row['name']=='Execute exact receipt-bearing Rastel finalizer' and row['status']=='completed' and row['conclusion']=='skipped' for row in job['steps'])
          assert artifact['id']==int(os.environ['V1_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']==os.environ['V1_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['V1_RUN']) and artifact['workflow_run']['head_sha']==os.environ['V1_HEAD']
          with zipfile.ZipFile(root/'v1.zip') as z:
              infos=z.infolist(); files=[row for row in infos if not row.is_dir()]
              assert len(files)==int(os.environ['V1_ARTIFACT_FILES']) and len(files)==len({row.filename for row in files})
              for info in files:
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  out=packet/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(z.read(info))
          def one(suffix):
              rows=[p for p in packet.rglob('*') if p.is_file() and p.as_posix().endswith(suffix)]
              assert len(rows)==1,(suffix,[p.as_posix() for p in rows]); return rows[0]
          expected={
            'source-v3.sh.gz.b64':(12968,'3bd60a97b181fb8c89482a6ddb282fe9fe70163618e7086540d27e2aae174eac'),
            'source-v3.sh.gz':(9726,'5e4b5aca1cbc246f93218608a29f1e116b72b860d50ea7dc62121c8015ef1d3b'),
            'source-v3.sh':(35695,'9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507'),
            'source-v4.sh':(35745,'7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c'),
            'runner.sh.gz':(9945,'af9f3750e733014366c500e897f489b5890f84dd4e1df81f37544eb9cad8ec06'),
            'runner.sh':(37253,'d3ba480e79f0fd431d612edd968518e2460351076fcbf6554b08b4941c20de9a'),
            'derivation.patch':(int(os.environ['V1_DERIVATION_PATCH_BYTES']),os.environ['V1_DERIVATION_PATCH_SHA256']),
          }
          for suffix,(size,digest) in expected.items():
              p=one(suffix); assert p.stat().st_size==size and sha(p.read_bytes())==digest
          assert not any(p.name=='derivation.json' for p in packet.rglob('*') if p.is_file())
          source_payload=load('source.json'); raw=base64.b64decode(source_payload['content'])
          assert source_payload['sha']==os.environ['SOURCE_BLOB']
          source_path=root/'source-v1.yml'; source_path.write_bytes(raw)
          assert subprocess.check_output(['git','hash-object',str(source_path)],text=True).strip()==os.environ['SOURCE_BLOB']
          doc=yaml.safe_load(raw.decode('utf-8')); jobdef=doc['jobs']['materialize']
          env={key:str(value) for key,value in jobdef['env'].items() if key!='GH_TOKEN'}
          env['BRANCH']=os.environ['BRANCH']; env['SELF']=os.environ['SELF']
          env['OUT']=os.environ['OUT']; env['WORKTREE']=os.environ['WORKTREE']; env['FINALWT']=os.environ['FINALWT']; env['CONTROL']=os.environ['CONTROL']
          env['PR_HEAD']=os.environ['CURRENT_HEAD']; env['PR_NUMBER']=os.environ['CURRENT_PR']; env['PR_BASE_SHA']=os.environ['CURRENT_BASE']
          env['DERIVATION_PATCH_BYTES']=os.environ['DETERMINISTIC_PATCH_BYTES']
          env['DERIVATION_PATCH_SHA256']=os.environ['DETERMINISTIC_PATCH_SHA256']
          (root/'env.sh').write_text(''.join(f'export {key}={shlex.quote(value.replace(os.environ["SOURCE_STEM"],os.environ["TARGET_STEM"]))}\n' for key,value in env.items()))
          runs=[step['run'] for step in jobdef['steps'] if 'run' in step]
          assert len(runs)==2
          old='diff -u "$CONTROL/source-v4.sh" "$CONTROL/runner.sh" > "$CONTROL/derivation.patch" || test "$?" = 1'
          new='diff -u --label source-v4.sh --label runner.sh "$CONTROL/source-v4.sh" "$CONTROL/runner.sh" > "$CONTROL/derivation.patch" || test "$?" = 1'
          assert sum(script.count(old) for script in runs)==1
          rows=[]
          for index,script in enumerate(runs,1):
              script=script.replace(os.environ['SOURCE_STEM'],os.environ['TARGET_STEM'])
              script=script.replace(old,new)
              path=root/'scripts'/f'{index:02d}.sh'; path.write_text(script)
              subprocess.run(['bash','-n',str(path)],check=True)
              blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",script,re.S)
              for n,block in enumerate(blocks,1): compile(textwrap.dedent(block),f'<final-product-v2-script-{index}-python-{n}>','exec')
              rows.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':sha(path.read_bytes()),'embedded_python':len(blocks)})
          receipt={
            'version':2,
            'status':'cycle-011-rastel-final-product-v2-source-recovered',
            'source':{'head':os.environ['SOURCE_HEAD'],'path':os.environ['SOURCE_PATH'],'git_blob':os.environ['SOURCE_BLOB'],'bytes':len(raw),'sha256':sha(raw)},
            'v1_failure':{'pr':int(os.environ['V1_PR']),'run':int(os.environ['V1_RUN']),'job':int(os.environ['V1_JOB']),'artifact':int(os.environ['V1_ARTIFACT']),'artifact_digest':os.environ['V1_ARTIFACT_DIGEST'],'files':int(os.environ['V1_ARTIFACT_FILES']),'nondeterministic_patch':{'bytes':int(os.environ['V1_DERIVATION_PATCH_BYTES']),'sha256':os.environ['V1_DERIVATION_PATCH_SHA256']}},
            'repair':{'command':'diff -u --label source-v4.sh --label runner.sh','bytes':int(os.environ['DETERMINISTIC_PATCH_BYTES']),'sha256':os.environ['DETERMINISTIC_PATCH_SHA256'],'finalizer_bytes_changed':False},
            'programs':rows,
            'boundary':{'repository_write':False,'product_published':False,'canonical_mutation':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'source-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Execute unchanged receipt-bearing finalizer with deterministic derivation receipt
        shell: bash
        run: |
          set -euo pipefail
          source "$BOOTSTRAP/env.sh"
          bash "$BOOTSTRAP/scripts/01.sh"
          test "$(wc -c < "$CONTROL/derivation.patch" | tr -d ' ')" = "$DETERMINISTIC_PATCH_BYTES"
          test "$(sha256sum "$CONTROL/derivation.patch" | awk '{print $1}')" = "$DETERMINISTIC_PATCH_SHA256"
          bash "$BOOTSTRAP/scripts/02.sh"
          test -d "$OUT/final"
          cp "$BOOTSTRAP/source-recovery.json" "$OUT/final/final-product-v2-source-recovery.json"
          (
            cd "$OUT/final"
            rm -f SHA256SUMS.pre SHA256SUMS
            find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
          )
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v2-approved-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-final-product-v2-approved-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-control
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-worktree
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-final
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-bootstrap
            /tmp/doctor-who-cycle-011-rastel-final-product-v2-approved-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
