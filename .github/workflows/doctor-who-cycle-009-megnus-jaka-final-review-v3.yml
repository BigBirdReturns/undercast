name: doctor-who-cycle-009-megnus-jaka-final-review-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-final-review-v3
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-final-review-707f-v3
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v3.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3
      WORKTREE: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/worktree
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3-bootstrap
      SOURCE_COMMIT: b228f98a7f88d0aa9887b6812069964873d520c1
      SOURCE_BLOB: 899fde0c5946519f495ee3e54fcbe13ea511cf04
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-final-review-v2.yml
      BIND_SHA256: b60cbb3f7225fe048ba4a6160dcf9201034cc43398073a1d056cc75c3cd84267
      VERIFY_SHA256: 699933d9d69384b228ee327123be5aa3ae96a2f4c9d4498832367b29b59e2feb
      RECONSTRUCT_SHA256: 12a3db910cb2f9baed720b2136e99543b93f65138731bb16e8c8bf019f637ae2
      SEMANTIC_SHA256: 4ac8574f2a4c14c762c21ed51688b6a7a14da020c199323abebabf2a109ca7ad
      GATE_SHA256: 31dd63015633a56b84bb0c8b007ef5410a662360d7ba963514450ad32073a529
      SOURCE_SEAL_SHA256: 419f1e0aaded3e9903b4b55d6060e779c92a4b0bce88345273591579a979d2c7
      PATCHED_SEAL_SHA256: 1a89a70a40ceadd0b279fe00a107563fc22cea39f2fe49b1abbc0db8b0ad4754
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V2 review programs and patch artifact closure
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,programs,receipt}

          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$BASE_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$BASE_MAIN"
          test "$(git rev-list --count "$BASE_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$BASE_MAIN"..HEAD)"
          test "$(git diff --name-only "$BASE_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$BASE_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/carrier-files.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['BASE_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY

          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-content.json"
          test "$(jq -r .sha "$BOOTSTRAP/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r .content "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source-v2.yml"
          test "$(git hash-object "$BOOTSTRAP/source-v2.yml")" = "$SOURCE_BLOB"

          ruby -ryaml -rjson - "$BOOTSTRAP/source-v2.yml" "$BOOTSTRAP/source-env.json" "$BOOTSTRAP/programs" <<'RB'
          source, env_out, programs = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.dig('jobs', 'review', 'env')
          steps = doc.dig('jobs', 'review', 'steps')
          names = {
            'bind.sh' => 'Bind exact review carrier and V5 source authority',
            'verify.sh' => 'Verify exact 48-path artifact and qualification seal',
            'reconstruct.sh' => 'Reconstruct exact reviewed commit and every Git object',
            'semantic.sh' => 'Independently prove Megnus Jaka semantics',
            'gate.sh' => 'Run independent permanent and complete rendered gates',
            'seal.sh' => 'Seal code-free independent publication handoff',
          }
          raise 'source environment missing' unless env.is_a?(Hash)
          File.write(env_out, JSON.generate(env))
          names.each do |file, name|
            step = steps.find { |row| row['name'] == name }
            raise "missing source step #{name}" unless step && step['run'].is_a?(String)
            File.write(File.join(programs, file), step['run'])
          end
          RB

          test "$(sha256sum "$BOOTSTRAP/programs/bind.sh" | awk '{print $1}')" = "$BIND_SHA256"
          test "$(sha256sum "$BOOTSTRAP/programs/verify.sh" | awk '{print $1}')" = "$VERIFY_SHA256"
          test "$(sha256sum "$BOOTSTRAP/programs/reconstruct.sh" | awk '{print $1}')" = "$RECONSTRUCT_SHA256"
          test "$(sha256sum "$BOOTSTRAP/programs/semantic.sh" | awk '{print $1}')" = "$SEMANTIC_SHA256"
          test "$(sha256sum "$BOOTSTRAP/programs/gate.sh" | awk '{print $1}')" = "$GATE_SHA256"
          test "$(sha256sum "$BOOTSTRAP/programs/seal.sh" | awk '{print $1}')" = "$SOURCE_SEAL_SHA256"

          SCRIPT="$BOOTSTRAP/programs/seal.sh" python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          path=Path(os.environ['SCRIPT'])
          text=path.read_text()
          old='find "$OUT" -type f ! -path "$OUT/source/*" ! -path "$OUT/api/*" ! -name source.zip ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf \'%P\\0\''
          new='find "$OUT" -type f ! -path "$OUT/source/*" ! -path "$OUT/api/*" ! -path "$OUT/worktree/*" ! -name source.zip ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf \'%P\\0\''
          assert text.count(old)==1
          path.write_text(text.replace(old,new))
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['PATCHED_SEAL_SHA256']
          PY

          for script in "$BOOTSTRAP"/programs/*.sh; do bash -n "$script"; chmod 700 "$script"; done

          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          env=json.loads((root/'source-env.json').read_text())
          excluded={'GH_TOKEN','BASE_MAIN','BRANCH','SELF','OUT','WORKTREE','PR_HEAD','PR_BASE_SHA','PR_NUMBER'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY

          sha256sum "$BOOTSTRAP/source-v2.yml" "$BOOTSTRAP"/programs/*.sh > "$BOOTSTRAP/receipt/source-sha256.txt"
          printf 'patch=exclude-disposable-worktree-from-uploaded-checksum-denominator\n' > "$BOOTSTRAP/receipt/patch.txt"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - name: Execute exact repaired independent review
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/programs/bind.sh"
          bash "$BOOTSTRAP/programs/verify.sh"
          bash "$BOOTSTRAP/programs/reconstruct.sh"
          (cd "$WORKTREE" && bash "$BOOTSTRAP/programs/semantic.sh")
          (cd "$WORKTREE" && bash "$BOOTSTRAP/programs/gate.sh")
          bash "$BOOTSTRAP/programs/seal.sh"

          ROOT="$OUT" python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          ledger=root/'SHA256SUMS.pre'
          seal=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==seal.read_text().split()[0]
          names=[]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1)
              name=name.lstrip('*')
              names.append(name)
              path=root/name
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          assert not any(name.startswith(('source/','api/','worktree/')) or name=='source.zip' for name in names)
          allowed=('logs/','product/','review/')
          assert all(name in {'SHA256SUMS.pre'} or name.startswith(allowed) for name in names)
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$BASE_MAIN"

      - name: Upload self-contained approved product handoff
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/SHA256SUMS
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/SHA256SUMS.pre
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/product
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/review
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload independent-review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3
            /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3-bootstrap
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
