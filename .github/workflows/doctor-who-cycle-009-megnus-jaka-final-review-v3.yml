jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-final-review-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Execute exact commit-bound independent reviewer
        shell: bash
        run: |
          set -euo pipefail
          message=/tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3.commit-message
          runner_gz=/tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3.sh.gz
          runner=/tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3.sh
          git show -s --format=%B HEAD > "$message"
          MESSAGE="$message" RUNNER_GZ="$runner_gz" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          text = Path(os.environ['MESSAGE']).read_text()
          begin = 'RUNNER_GZIP_BASE64_BEGIN'
          end = 'RUNNER_GZIP_BASE64_END'
          assert text.count(begin) == 1 and text.count(end) == 1
          payload = ''.join(text.split(begin, 1)[1].split(end, 1)[0].split())
          assert payload
          Path(os.environ['RUNNER_GZ']).write_bytes(base64.b64decode(payload, validate=True))
          PY
          test "$(sha256sum "$runner_gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$runner_gz" > "$runner"
          test "$(sha256sum "$runner" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 0755 "$runner"
          bash -n "$runner"
          bash "$runner"

      - name: Upload independent final-product review
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload reviewer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-final-review-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-final-review-v3
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
