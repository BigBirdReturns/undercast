name: estate-import-card-backfill-packets

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-import-card-backfill-packets.yml
      - scripts/estate-import-card-backfill-packets.mjs
      - scripts/estate-import-card-backfill-packets-fixtures.mjs
      - scripts/estate-validate-card-backfill-packet-import.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-import-card-backfill-packets
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SOURCE_PR: 129
  SOURCE_SHA: 5c7ebeb8802a7d90850c72869d29413625f41ce2
  EXPECTED_PACKETS: 55
  AUTHORIZED_PARENT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  import:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Announce exact packet candidate smoke
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 candidate packet smoke started on workflow run $GITHUB_RUN_ID.

          Source custody is frozen at PR #$SOURCE_PR head $SOURCE_SHA. This run may materialize only the 55 source-declared packet directories, source-declared publication batch receipts, and one provisional import receipt held outside the candidate smoke tree. No permanent custody or integration claim exists unless the complete smoke gate, post-smoke validation, exact-head lease, commit, and push all pass. Canonical media, specimens, sources, media audit, staging, workflows, caches, and production execution state are excluded.
          EOF

      - uses: actions/checkout@v4
        with:
          ref: agent/estate-consolidation-001
          fetch-depth: 0

      - name: Verify exact target head custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_PARENT"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Fetch exact frozen source snapshot
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove packet import fixtures
        run: node scripts/estate-import-card-backfill-packets-fixtures.mjs

      - name: Capture canonical-state fingerprints
        run: |
          set -euo pipefail
          sha256sum \
            data/specimens.json \
            data/SOURCES.json \
            data/MEDIA-AUDIT.json \
            data/media-live.json \
            data/media-manifest.json \
            data/archive.json \
            data/entities.json \
            data/quality.json \
            data/quality-baseline.json \
            > /tmp/COLLECT-002-canonical-before.sha256

      - name: Prove exact 55-packet source snapshot
        run: |
          set -euo pipefail
          node scripts/estate-import-card-backfill-packets.mjs \
            --source-sha "$SOURCE_SHA" \
            --source-pr "$SOURCE_PR" \
            --target-parent "$AUTHORIZED_PARENT" \
            --expected-packets "$EXPECTED_PACKETS" \
            | tee /tmp/COLLECT-002-preflight.json

      - name: Materialize exact evidence-only packet candidate
        run: |
          set -euo pipefail
          trap 'git reset --hard "$AUTHORIZED_PARENT"; git clean -fd' ERR
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/estate-import-card-backfill-packets.mjs \
            --source-sha "$SOURCE_SHA" \
            --source-pr "$SOURCE_PR" \
            --target-parent "$AUTHORIZED_PARENT" \
            --expected-packets "$EXPECTED_PACKETS" \
            --now "$NOW" \
            --write
          node scripts/estate-validate-card-backfill-packet-import.mjs --require | tee /tmp/COLLECT-002-validation.json
          RECEIPT=data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json
          mv "$RECEIPT" /tmp/COLLECT-002-promotion-receipt.json
          test ! -e "$RECEIPT"

      - name: Refuse canonical mutation
        run: |
          set -euo pipefail
          sha256sum -c /tmp/COLLECT-002-canonical-before.sha256
          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              data/review/card-backfill/UC-[0-9]*/*) ;;
              data/review/card-backfill/batches/*.json) ;;
              *) echo "Forbidden packet-import path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Snapshot exact candidate tree for smoke
        id: staged
        run: |
          set -euo pipefail
          git add -A
          # Packet captures preserve source bytes. Trailing whitespace in captured HTML,
          # wikitext, and text is evidence, not a structural publication failure.
          git diff --cached --name-status
          git diff --cached --binary > /tmp/COLLECT-002-card-backfill-candidate.patch
          git write-tree > /tmp/COLLECT-002-card-backfill-candidate.tree
          git diff --cached --quiet && { echo 'Packet candidate produced no staged estate.' >&2; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run complete canonical smoke on packet candidate
        run: npm run gate

      - name: Promote custody only after smoke passes
        run: |
          set -euo pipefail
          RECEIPT=data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json
          CANDIDATE_TREE="$(cat /tmp/COLLECT-002-card-backfill-candidate.tree)"
          test -f /tmp/COLLECT-002-promotion-receipt.json
          if git ls-tree -r --name-only "$CANDIDATE_TREE" | grep -Fxq "$RECEIPT"; then
            echo "Permanent receipt entered the candidate smoke tree." >&2
            exit 1
          fi
          install -D -m 0644 /tmp/COLLECT-002-promotion-receipt.json "$RECEIPT"
          node scripts/estate-validate-card-backfill-packet-import.mjs --require
          sha256sum -c /tmp/COLLECT-002-canonical-before.sha256
          git add -- "$RECEIPT"
          git diff --exit-code
          PROMOTION_PATHS="$(git diff --cached --name-only "$CANDIDATE_TREE")"
          test "$PROMOTION_PATHS" = "$RECEIPT"
          git diff --cached --binary > /tmp/COLLECT-002-card-backfill-packets.patch
          git write-tree > /tmp/COLLECT-002-card-backfill-packets.tree

      - name: Refuse stale target publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/estate-consolidation-001
          REMOTE_HEAD="$(git rev-parse origin/agent/estate-consolidation-001)"
          test "$REMOTE_HEAD" = "$AUTHORIZED_PARENT"

      - name: Commit and publish exact smoke-passed packet estate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE_SHA="$(cat /tmp/COLLECT-002-card-backfill-packets.tree)"
          SNAPSHOT_SHA="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').source.snapshot_sha256")"
          git commit -m "Estate collection: promote 55 smoke-passed evidence packets" -m "source_pr=${SOURCE_PR}" -m "source_head=${SOURCE_SHA}" -m "source_snapshot=${SNAPSHOT_SHA}" -m "canonical_mutation=false" -m "authorized_parent=${AUTHORIZED_PARENT}" -m "workflow_run=${GITHUB_RUN_ID}" -m "gated_tree=${TREE_SHA}"
          git push --force-with-lease=refs/heads/agent/estate-consolidation-001:${AUTHORIZED_PARENT} origin HEAD:agent/estate-consolidation-001

      - name: Report successful packet payment
        if: success()
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(cat /tmp/COLLECT-002-card-backfill-packets.tree)"
          PACKETS="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.packets")"
          FILES="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.files")"
          BYTES="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.bytes")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 candidate passed smoke and was promoted on workflow run $GITHUB_RUN_ID.

          Source PR: #$SOURCE_PR.
          Frozen source head: $SOURCE_SHA.
          Promoted packets: $PACKETS.
          Promoted packet and batch files: $FILES.
          Promoted bytes: $BYTES.
          Published commit: $HEAD_SHA.
          Gated tree: $TREE_SHA.

          Canonical media and all canonical data fingerprints remained byte-identical. Source captures were retained byte-for-byte, including immaterial whitespace. Staging, workflow, cache, and source-branch execution state were excluded. Permanent custody began only after the complete canonical smoke, post-smoke packet validation, and exact-head publication lease passed.
          EOF

      - name: Report failed packet smoke
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 candidate packet smoke failed closed on workflow run $GITHUB_RUN_ID.

          No permanent packet custody or integration claim is authorized. The source head remains frozen at $SOURCE_SHA. Cosmetic whitespace in source captures is not a blocker; inspect only checksum, manifest, batch, canonical-isolation, smoke, or exact-head lease failures before changing the source snapshot or import allowlist.
          EOF

      - name: Preserve exact packet smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-002-card-backfill-packets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-002-preflight.json
            /tmp/COLLECT-002-validation.json
            /tmp/COLLECT-002-canonical-before.sha256
            /tmp/COLLECT-002-card-backfill-candidate.patch
            /tmp/COLLECT-002-card-backfill-candidate.tree
            /tmp/COLLECT-002-card-backfill-packets.patch
            /tmp/COLLECT-002-card-backfill-packets.tree
            /tmp/COLLECT-002-promotion-receipt.json
            data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json
          if-no-files-found: warn
          retention-days: 30
