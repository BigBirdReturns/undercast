name: estate-import-card-backfill-packets

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-import-card-backfill-packets.yml
      - scripts/estate-import-card-backfill-packets.mjs
      - scripts/estate-import-card-backfill-packets-fixtures.mjs
      - scripts/estate-validate-card-backfill-packet-import.mjs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-import-card-backfill-packets
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SOURCE_PR: 129
  SOURCE_SHA: 5c7ebeb8802a7d90850c72869d29413625f41ce2
  EXPECTED_PACKETS: 55
  AUTHORIZED_PARENT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  import:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Announce exact packet import
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 permanent packet import started on workflow run $GITHUB_RUN_ID.

          Source custody is frozen at PR #$SOURCE_PR head $SOURCE_SHA. The transaction permits only 55 permanent packet directories, permanent publication batch receipts, and one import receipt. Canonical media, specimens, sources, media audit, staging, workflows, caches, and production execution state are excluded.
          EOF

      - uses: actions/checkout@v4
        with:
          ref: agent/estate-consolidation-001
          fetch-depth: 0

      - name: Verify exact target head custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_PARENT"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Fetch exact frozen source snapshot
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{commit}")" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove packet import fixtures
        run: node scripts/estate-import-card-backfill-packets-fixtures.mjs

      - name: Capture canonical-state fingerprints
        run: |
          set -euo pipefail
          sha256sum \
            data/specimens.json \
            data/SOURCES.json \
            data/MEDIA-AUDIT.json \
            data/media-live.json \
            data/media-manifest.json \
            data/archive.json \
            data/entities.json \
            data/quality.json \
            data/quality-baseline.json \
            > /tmp/COLLECT-002-canonical-before.sha256

      - name: Prove exact 55-packet source snapshot
        run: |
          set -euo pipefail
          node scripts/estate-import-card-backfill-packets.mjs \
            --source-sha "$SOURCE_SHA" \
            --source-pr "$SOURCE_PR" \
            --target-parent "$AUTHORIZED_PARENT" \
            --expected-packets "$EXPECTED_PACKETS" \
            | tee /tmp/COLLECT-002-preflight.json

      - name: Import exact evidence-only packet estate
        run: |
          set -euo pipefail
          trap 'git reset --hard "$AUTHORIZED_PARENT"; git clean -fd' ERR
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/estate-import-card-backfill-packets.mjs \
            --source-sha "$SOURCE_SHA" \
            --source-pr "$SOURCE_PR" \
            --target-parent "$AUTHORIZED_PARENT" \
            --expected-packets "$EXPECTED_PACKETS" \
            --now "$NOW" \
            --write
          node scripts/estate-validate-card-backfill-packet-import.mjs --require | tee /tmp/COLLECT-002-validation.json

      - name: Refuse canonical mutation
        run: |
          set -euo pipefail
          sha256sum -c /tmp/COLLECT-002-canonical-before.sha256
          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              data/review/card-backfill/UC-[0-9]*/*) ;;
              data/review/card-backfill/batches/*.json) ;;
              data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json) ;;
              *) echo "Forbidden packet-import path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Stage exact intended tree
        id: staged
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          git diff --cached --binary > /tmp/COLLECT-002-card-backfill-packets.patch
          git write-tree > /tmp/COLLECT-002-card-backfill-packets.tree
          git diff --cached --quiet && { echo 'Packet import produced no staged estate.' >&2; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run complete canonical gate on packet estate
        run: npm run gate

      - name: Revalidate packet custody after complete gate
        run: |
          set -euo pipefail
          node scripts/estate-validate-card-backfill-packet-import.mjs --require
          sha256sum -c /tmp/COLLECT-002-canonical-before.sha256
          git diff --exit-code
          git diff --cached --check
          PRE_TREE="$(cat /tmp/COLLECT-002-card-backfill-packets.tree)"
          POST_TREE="$(git write-tree)"
          test "$PRE_TREE" = "$POST_TREE"

      - name: Refuse stale target publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin agent/estate-consolidation-001
          REMOTE_HEAD="$(git rev-parse origin/agent/estate-consolidation-001)"
          test "$REMOTE_HEAD" = "$AUTHORIZED_PARENT"

      - name: Commit and publish exact gated packet estate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TREE_SHA="$(cat /tmp/COLLECT-002-card-backfill-packets.tree)"
          SNAPSHOT_SHA="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').source.snapshot_sha256")"
          git commit -m "Estate collection: import 55 permanent evidence packets" -m "source_pr=${SOURCE_PR}" -m "source_head=${SOURCE_SHA}" -m "source_snapshot=${SNAPSHOT_SHA}" -m "canonical_mutation=false" -m "authorized_parent=${AUTHORIZED_PARENT}" -m "workflow_run=${GITHUB_RUN_ID}" -m "gated_tree=${TREE_SHA}"
          git push --force-with-lease=refs/heads/agent/estate-consolidation-001:${AUTHORIZED_PARENT} origin HEAD:agent/estate-consolidation-001

      - name: Report successful packet payment
        if: success()
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(cat /tmp/COLLECT-002-card-backfill-packets.tree)"
          PACKETS="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.packets")"
          FILES="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.files")"
          BYTES="$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.bytes")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 permanent packet import passed on workflow run $GITHUB_RUN_ID.

          Source PR: #$SOURCE_PR.
          Frozen source head: $SOURCE_SHA.
          Imported packets: $PACKETS.
          Imported packet and batch files: $FILES.
          Imported bytes: $BYTES.
          Published commit: $HEAD_SHA.
          Gated tree: $TREE_SHA.

          Canonical media and all canonical data fingerprints remained byte-identical. Staging, workflow, cache, and source-branch execution state were excluded. The complete canonical gate and post-gate packet validation passed under exact-head publication custody.
          EOF

      - name: Report failed packet payment
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF
          COLLECT-002 permanent packet import failed closed on workflow run $GITHUB_RUN_ID.

          No packet-custody or integration claim is authorized. The source head remains frozen at $SOURCE_SHA. Inspect the failed checksum, manifest, batch, canonical-isolation, gate, or lease boundary before changing the source snapshot or import allowlist.
          EOF

      - name: Preserve exact packet import artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-002-card-backfill-packets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-002-preflight.json
            /tmp/COLLECT-002-validation.json
            /tmp/COLLECT-002-canonical-before.sha256
            /tmp/COLLECT-002-card-backfill-packets.patch
            /tmp/COLLECT-002-card-backfill-packets.tree
            data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json
          if-no-files-found: warn
          retention-days: 30
