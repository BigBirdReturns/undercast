name: estate-import-card-backfill-packets-retired

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-import-card-backfill-packets-retired
  cancel-in-progress: true

jobs:
  verify-paid-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify COLLECT-002 retained packet custody
        run: |
          set -euo pipefail
          node scripts/estate-validate-card-backfill-packet-import.mjs --require
          test "$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').counts.packets")" = 55
          test "$(node -p "require('./data/review/estate-debt/COLLECT-002-CARD-BACKFILL-PACKET-IMPORT.json').boundaries.canonical_mutation")" = false
          echo 'PASS — COLLECT-002 import authority is retired; the 55-packet source snapshot is immutable retained evidence.'
