name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
  cancel-in-progress: true

jobs:
  retain:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      BASE_PRODUCT: 8fcc4a414821fe0f5596dec860cb825d70110c27
      INSTALL_PARENT: d33580cbc73b7bcab734ec3da84a0e977e852ad0
      WRITER_SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      EVIDENCE_SELF: .github/workflows/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10.yml
      INSTALLER_BRANCH: agent/doctor-who-cycle-012-selection-cleanup-writer-v10
      INSTALLER_PR: "922"
      EVIDENCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
      V8_EVIDENCE_RUN: "31455511413"
      V8_EVIDENCE_JOB: "93668338891"
      V8_EVIDENCE_ARTIFACT: "9087974374"
      V8_EVIDENCE_ARTIFACT_SHA256: 92e36f72a277fd308994a06b9b8e6b88450afc4b1f402f757d81e5d01cdc57c2
      V8_EVIDENCE_IDENTITY: fca2a8d0d33e4217de6a86d5745c4fcc5a31e7161dd36b83c8532bc5670396ff
      V8_EVIDENCE_HEAD: f68b4286d1fcde8b7c7893544efa5b4388311acc
      V8_WRITER_RUN: "31455852791"
      V8_WRITER_JOB: "93669336270"
      V8_WRITER_ARTIFACT: "9087987322"
      V8_WRITER_ARTIFACT_SHA256: f67587c49616702b401d6b6e57a435140128e1dd703c8d36ae57a8419bfa6468
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      CLEANUP_PATHS: |
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v1.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v3.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v4.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v5.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v6.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v7.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v9.yml
        .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v10.yml
      PRESERVED_PATHS: |
        data/MEDIA-SEARCH-LATEST.json
        data/journal/media-search.jsonl
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
      CARRIER_BLOB: 3cd6d0d11ef31378ca4110405ecdbb1718b12c37
      CARRIER_GZIP_BYTES: "3146"
      CARRIER_GZIP_SHA256: 2125f7fd7030fac86c225bc19ea3539d34066edbce5e9c939bf32a539d08c7ec
      CARRIER_BYTES: "11028"
      CARRIER_SHA256: ac61c162bff13618a364680704e5ff6a68e3a0c9951f057aec8abbde22c16d77
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10-loader

    steps:
      - name: Reconstruct and execute exact current-main cleanup evidence V10
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$CARRIER_BLOB" > "$LOADER/carrier-blob.json"
          jq -r '.content' "$LOADER/carrier-blob.json" | tr -d '\n' | base64 -d > "$LOADER/carrier.sh.gz"
          test "$(git hash-object --stdin < "$LOADER/carrier.sh.gz")" = "$CARRIER_BLOB"
          test "$(wc -c < "$LOADER/carrier.sh.gz" | tr -d ' ')" = "$CARRIER_GZIP_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.gz" | awk '{print $1}')" = "$CARRIER_GZIP_SHA256"
          gzip -dc "$LOADER/carrier.sh.gz" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ["CARRIER"]).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f"<cycle-012-current-main-cleanup-evidence-v10-{index}>",'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10
            /tmp/doctor-who-cycle-012-selection-cleanup-current-main-evidence-v10-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
