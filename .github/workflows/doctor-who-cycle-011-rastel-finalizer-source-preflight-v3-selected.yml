      NORMALIZED_REVIEW_STATUS: cycle-011-rastel-v10-candidate-uniquely-selected-and-independently-reconstructed-v1
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      RUNNER_BLOB: cef44d5eab38e7d0e53d37001c0d7e737f65ad85
      RUNNER_GZIP_BYTES: "5288"
      RUNNER_GZIP_SHA256: 14a0562c021c4b134966cb4b776e21c652d8aefa2fa2575581566ba817687e35
      RUNNER_BYTES: "23829"
      RUNNER_SHA256: 5c4c64341876ccc93abee0938490c9b303f33357ea04a81b32c3066786818568

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact normalized-handoff runner and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rastel-preflight-v3-runner
          mkdir -p /tmp/rastel-preflight-v3-runner
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > /tmp/rastel-preflight-v3-runner/runner.sh.gz
          test "$(wc -c < /tmp/rastel-preflight-v3-runner/runner.sh.gz | tr -d ' ')" = "$RUNNER_GZIP_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v3-runner/runner.sh.gz | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc /tmp/rastel-preflight-v3-runner/runner.sh.gz > /tmp/rastel-preflight-v3-runner/runner.sh
          test "$(wc -c < /tmp/rastel-preflight-v3-runner/runner.sh | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum /tmp/rastel-preflight-v3-runner/runner.sh | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n /tmp/rastel-preflight-v3-runner/runner.sh
          chmod 700 /tmp/rastel-preflight-v3-runner/runner.sh
          exec /tmp/rastel-preflight-v3-runner/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v3-selected-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v3-selected
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-preflight-v3-selected-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-finalizer-source-preflight-v3-selected
            /tmp/rastel-preflight-v3-runner
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
