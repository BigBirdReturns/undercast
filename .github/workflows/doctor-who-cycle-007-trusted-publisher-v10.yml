name: doctor-who-cycle-007-trusted-publisher-v10
on:
  workflow_run:
    workflows: [doctor-who-cycle-007-qualifier-v10]
    types: [completed]
    branches: [agent/doctor-who-cycle-007-qualifier-v10]
permissions: {}
concurrency: {group: doctor-who-cycle-007-trusted-publisher-v10, cancel-in-progress: false}
env:
  QUALIFIED_MAIN: 008f4bd0c89b888042f07c2ab31ceb643bb6c1eb
  QUALIFIED_MAIN_TREE: 71daf085da73fc587988da3df3103665b2b1361d
  PUBLISHER_MAIN: ${{ github.workflow_sha }}
  PUBLISHER_WORKFLOW_PATH: .github/workflows/doctor-who-cycle-007-trusted-publisher-v10.yml
  QUALIFIER_BRANCH: agent/doctor-who-cycle-007-qualifier-v10
  QUALIFIER_WORKFLOW_PATH: .github/workflows/doctor-who-cycle-007-qualifier-v10.yml
  QUALIFIER_WORKFLOW_SHA256: bfdcfb238bee1bb5f433500cbd8922a3621326fe67ad62affd9b8148aa43acb3
  QUALIFIER_WORKFLOW_GIT_BLOB: a66a76f850d02b39cb61759a0f731ec469a86eff
  QUALIFICATION_ARTIFACT_PREFIX: doctor-who-cycle-007-trusted-qualification-v10
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-product-v10
  PRODUCT_PR_TITLE: 'Doctor Who: complete reviewed cycle 007 for Kragar'
  RELEASE_TAG: media-0003
  RELEASE_ID: '222061616'
  RELEASE_ASSET_ID: '357626872'
  RELEASE_ASSET_NAME: uc-1352-still-f6f32eb1.jpg
  RELEASE_ASSET_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  RELEASE_ASSET_BYTES: '15719'
  PUBLISH_ROOT: /tmp/doctor-who-cycle-007-trusted-publisher-v10
  CODE_DIR: /tmp/doctor-who-cycle-007-trusted-code-v10
  CODE_ARCHIVE_SHA256: a9ba252542ad7b951138360fa7acecbf145f223b163e018b25e0869173c7297c
  GH_TOKEN: ${{ github.token }}
jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'agent/doctor-who-cycle-007-qualifier-v10' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions: {actions: read, contents: read, pull-requests: read}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      aid: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
      name: ${{ steps.run.outputs.settlement_name }}
      source_run_id: ${{ steps.run.outputs.source_run_id }}
      source_run_attempt: ${{ steps.run.outputs.source_run_attempt }}
      source_head_sha: ${{ steps.run.outputs.source_head_sha }}
      source_pr_number: ${{ steps.run.outputs.source_pr_number }}
      publisher_main_tree: ${{ steps.run.outputs.publisher_main_tree }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PUBLISHER_MAIN }}', fetch-depth: 2, filter: 'blob:none', persist-credentials: false}
      - id: run
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          rm -rf "$CODE_DIR"; mkdir -p "$CODE_DIR"
          set -- .github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-*; test "$#" = 4
          cat "$@" > "$CODE_DIR/scripts.tgz"
          test "$(sha256sum "$CODE_DIR/scripts.tgz" | awk '{print $1}')" = "$CODE_ARCHIVE_SHA256"
          tar -xzf "$CODE_DIR/scripts.tgz" -C "$CODE_DIR"; chmod +x "$CODE_DIR"/*.sh
          bash "$CODE_DIR/v.sh"
      - id: upload
        uses: actions/upload-artifact@v4
        with: {name: '${{ steps.run.outputs.settlement_name }}', path: '${{ env.PUBLISH_ROOT }}/settlement', if-no-files-found: error, retention-days: 30, compression-level: 0}
  publish:
    needs: verify
    if: ${{ needs.verify.result == 'success' }}
    permissions: {actions: read, contents: write, pull-requests: write}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: ${{ needs.verify.outputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ needs.verify.outputs.source_run_attempt }}
      SOURCE_HEAD_SHA: ${{ needs.verify.outputs.source_head_sha }}
      SOURCE_PR_NUMBER: ${{ needs.verify.outputs.source_pr_number }}
      SETTLEMENT_ARTIFACT_ID: ${{ needs.verify.outputs.aid }}
      SETTLEMENT_ARTIFACT_DIGEST: ${{ needs.verify.outputs.digest }}
      SETTLEMENT_ARTIFACT_NAME: ${{ needs.verify.outputs.name }}
      PUBLISHER_MAIN_TREE: ${{ needs.verify.outputs.publisher_main_tree }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ env.PUBLISHER_MAIN }}', fetch-depth: 1, filter: 'blob:none', persist-credentials: false}
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CODE_DIR"; mkdir -p "$CODE_DIR"
          set -- .github/trusted-publisher-payloads/doctor-who-cycle-007-v10/scripts.tgz.part-*; test "$#" = 4
          cat "$@" > "$CODE_DIR/scripts.tgz"
          test "$(sha256sum "$CODE_DIR/scripts.tgz" | awk '{print $1}')" = "$CODE_ARCHIVE_SHA256"
          tar -xzf "$CODE_DIR/scripts.tgz" -C "$CODE_DIR"; chmod +x "$CODE_DIR"/*.sh
          bash "$CODE_DIR/p.sh"
      - uses: actions/upload-artifact@v4
        with: {name: 'doctor-who-cycle-007-trusted-publication-v10-${{ github.run_id }}', path: '${{ env.PUBLISH_ROOT }}/receipt', if-no-files-found: error, retention-days: 30, compression-level: 0}
