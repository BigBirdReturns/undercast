name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-707f-v3
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3.yml
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3
      SOURCE_COMMIT: d82e380a1949c4c48720de36c50b3f8a010c6f99
      SOURCE_BLOB: 03ef907bf6ecb497876ec2467dff78dcb185c42a
      SOURCE_PATH: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2.yml
      SOURCE_SHA256: 1e1c80c9bfe2649b5bb96a74a09beed6de5aab8f014bb745de8f36857b79661d
      SOURCE_BYTES: "28765"
      REVIEW_AT: ${{ github.event.pull_request.created_at }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact wrapper and recover sealed V2 review programs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP"
          mkdir -p "$BOOTSTRAP"/{api,receipt}
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/carrier-files.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/carrier-pr.json').read_text())
          files=json.loads((root/'api/carrier-files.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          PY

          gh api "/repos/$GITHUB_REPOSITORY/contents/$SOURCE_PATH?ref=$SOURCE_COMMIT" > "$BOOTSTRAP/api/source-content.json"
          test "$(jq -r .sha "$BOOTSTRAP/api/source-content.json")" = "$SOURCE_BLOB"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_BLOB" > "$BOOTSTRAP/api/source-blob.json"
          jq -r .content "$BOOTSTRAP/api/source-blob.json" | tr -d '\n' | base64 -d > "$BOOTSTRAP/source-v2.yml"
          test "$(git hash-object "$BOOTSTRAP/source-v2.yml")" = "$SOURCE_BLOB"
          test "$(wc -c < "$BOOTSTRAP/source-v2.yml")" = "$SOURCE_BYTES"
          test "$(sha256sum "$BOOTSTRAP/source-v2.yml" | cut -d' ' -f1)" = "$SOURCE_SHA256"

          ruby -ryaml -rjson - "$BOOTSTRAP/source-v2.yml" "$BOOTSTRAP/source-env.json" "$BOOTSTRAP/authenticate.sh" "$BOOTSTRAP/reconstruct.sh" "$BOOTSTRAP/validate.sh" "$BOOTSTRAP/seal.sh" <<'RB'
          source, env_out, auth_out, reconstruct_out, validate_out, seal_out = ARGV
          doc = YAML.safe_load(File.read(source), permitted_classes: [], aliases: true)
          env = doc.dig('jobs', 'review', 'env')
          steps = doc.dig('jobs', 'review', 'steps')
          names = {
            'Authenticate and extract exact V12 candidate artifact' => auth_out,
            'Independently reconstruct exact candidate commit and tree' => reconstruct_out,
            'Independently validate semantics and complete rendered gate' => validate_out,
            'Seal independently approved candidate packet' => seal_out,
          }
          raise 'sealed V2 environment missing' unless env.is_a?(Hash)
          names.each do |name, out|
            row = steps.find { |step| step['name'] == name }
            raise "sealed V2 step missing: #{name}" unless row && row['run'].is_a?(String)
            File.write(out, row['run'])
          end
          File.write(env_out, JSON.generate(env))
          RB
          for script in "$BOOTSTRAP"/{authenticate,reconstruct,validate,seal}.sh; do bash -n "$script"; done

          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); env=json.loads((root/'source-env.json').read_text())
          assert env['EXACT_MAIN']==os.environ['EXACT_MAIN']
          assert env['CANDIDATE_COMMIT']=='35f5074a6f6f5cb25cb3a3b83a2cfa1709d4cd87'
          assert env['CANDIDATE_TREE']=='e59fc815459f10b8c16cd443354a0e8481e5d0eb'
          excluded={'GH_TOKEN','EXACT_MAIN','BRANCH','SELF','REVIEW_AT','PR_HEAD','PR_NUMBER','PR_BASE_SHA'}
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(env):
                  if key in excluded: continue
                  value=str(env[key]); assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          sha256sum "$BOOTSTRAP/source-v2.yml" "$BOOTSTRAP"/{authenticate,reconstruct,validate,seal}.sh > "$BOOTSTRAP/receipt/source-program-sha256.txt"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"
          git checkout --detach "$EXACT_MAIN"
          test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

      - name: Execute sealed artifact authentication
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/authenticate.sh"

      - name: Execute sealed exact candidate reconstruction
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/reconstruct.sh"

      - name: Execute sealed independent semantics and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/validate.sh"

      - name: Execute sealed approval packet transaction
        shell: bash
        run: |
          set -euo pipefail
          bash "$BOOTSTRAP/seal.sh"

      - name: Upload independently approved candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-approved-v3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2/approved
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload wrapper diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-wrapper-v3
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-review-v2
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
