name: doctor-who-cycle-010-merx-final-product-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-final-product-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-final-product-current-main-v1
  cancel-in-progress: true

jobs:
  recompose:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-final-product-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      SOURCE_MAIN: c52164a914aa69f4b1071b4f32c3a6ccd2ab283e
      BRANCH: agent/doctor-who-cycle-010-merx-final-product-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-final-product-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1
      SOURCE: /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1-source
      WORKTREE: /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1-worktree
      SOURCE_PR: "733"
      SOURCE_HEAD: 881d842c726806f504d127f55c076e3cac1c2a48
      SOURCE_RUN: "31296497918"
      SOURCE_JOB: "93202315133"
      SOURCE_ARTIFACT: "9033129375"
      SOURCE_ZIP_SHA256: 68b856c3798005b3ac14c64b51259086ed8aff3723b6fa1e3b555de5012972c2
      SOURCE_QUALIFICATION_ID: a5128c75241f5ebb1ad7741c259d54d38d5df28d528be485bce886a6518a2e2f
      SOURCE_PRODUCT_COMMIT: 3e0af3953c4950047944608ae71bb5992c7dedfb
      SOURCE_PRODUCT_TREE: d00688b092cf91de09bc14505a92f0178aafae0c
      SOURCE_PRODUCT_PATHS: "50"
      SOURCE_PRODUCT_TAR_SHA256: 08d604ba1d503ac0be0ecd079350bd6ad3becaae2b32ff9d65cfe3d0e214c9ec
      SOURCE_FILE_MANIFEST_SHA256: b91d4ed69851b88af1209f584cd695102ff62481a3697455657ccdaf517ed834
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      COMMIT_AT: "2026-08-09T05:55:00Z"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact source product and disjoint current-main advance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE" "$WORKTREE" /tmp/merx-current-main-api
          mkdir -p "$OUT"/{logs,product,receipt} "$SOURCE" /tmp/merx-current-main-api
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          test "$(git merge-base "$SOURCE_MAIN" "$EXACT_MAIN")" = "$SOURCE_MAIN"
          test "$(git rev-list --count "$SOURCE_MAIN".."$EXACT_MAIN")" = 1
          test -z "$(git rev-list --merges "$SOURCE_MAIN".."$EXACT_MAIN")"
          git diff --name-status "$SOURCE_MAIN" "$EXACT_MAIN" > "$OUT/receipt/current-main-name-status.txt"
          printf '%s\n' \
            $'M\tdata/MEDIA-SEARCH-LATEST.json' \
            $'M\tdata/journal/media-search.jsonl' > "$OUT/receipt/expected-current-main-name-status.txt"
          cmp "$OUT/receipt/current-main-name-status.txt" "$OUT/receipt/expected-current-main-name-status.txt"
          cut -f2- "$OUT/receipt/current-main-name-status.txt" | LC_ALL=C sort > "$OUT/receipt/current-main-paths.txt"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > /tmp/merx-current-main-api/carrier.json
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SOURCE_PR" > /tmp/merx-current-main-api/source-pr.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > /tmp/merx-current-main-api/source-run.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > /tmp/merx-current-main-api/source-jobs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > /tmp/merx-current-main-api/source-artifact.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > /tmp/merx-current-main-source.zip
          test "$(sha256sum /tmp/merx-current-main-source.zip | awk '{print $1}')" = "$SOURCE_ZIP_SHA256"
          HEAD="$head" PR="$pr" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          api=Path('/tmp/merx-current-main-api'); source=Path(os.environ['SOURCE']); out=Path(os.environ['OUT'])
          own=json.loads((api/'carrier.json').read_text()); pr=json.loads((api/'source-pr.json').read_text())
          run=json.loads((api/'source-run.json').read_text()); jobs=json.loads((api/'source-jobs.json').read_text())['jobs']; art=json.loads((api/'source-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['EXACT_MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert pr['number']==int(os.environ['SOURCE_PR']) and pr['merged'] is False
          assert pr['base']['sha']==os.environ['SOURCE_MAIN'] and pr['head']['sha']==os.environ['SOURCE_HEAD'] and pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-010-merx-final-product-v4'
          assert run['head_sha']==os.environ['SOURCE_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['SOURCE_JOB']))
          assert job['name']=='materialize' and job['status']=='completed' and job['conclusion']=='success'
          assert art['id']==int(os.environ['SOURCE_ARTIFACT']) and art['expired'] is False and art['digest']=='sha256:'+os.environ['SOURCE_ZIP_SHA256']
          assert art['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and art['workflow_run']['head_sha']==os.environ['SOURCE_HEAD']
          with zipfile.ZipFile('/tmp/merx-current-main-source.zip') as z:
              infos=z.infolist(); assert infos and len(infos)==len({r.filename for r in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  target=source/p; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(z.read(info))
          ledger=source/'SHA256SUMS.pre'; sealed=source/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=source/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          q=json.loads((source/'qualification.json').read_text()); identity=q.pop('identity')
          assert identity==os.environ['SOURCE_QUALIFICATION_ID']
          assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          q['identity']=identity
          assert q['status']=='cycle-010-merx-receipt-bearing-product-qualified'
          assert q['canonical_parent']==os.environ['SOURCE_MAIN']
          assert q['product']['commit']==os.environ['SOURCE_PRODUCT_COMMIT'] and q['product']['tree']==os.environ['SOURCE_PRODUCT_TREE'] and q['product']['paths']==int(os.environ['SOURCE_PRODUCT_PATHS'])
          assert q['product']['tar_sha256']==os.environ['SOURCE_PRODUCT_TAR_SHA256'] and q['product']['file_manifest_sha256']==os.environ['SOURCE_FILE_MANIFEST_SHA256']
          assert q['queue_after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert q['boundary']['repository_write'] is False and q['boundary']['product_published'] is False and q['boundary']['cycle_011_authorized'] is False
          source_paths=(source/'changed-paths.txt').read_text().splitlines(); current=(out/'receipt/current-main-paths.txt').read_text().splitlines()
          assert len(source_paths)==int(os.environ['SOURCE_PRODUCT_PATHS']) and source_paths==sorted(source_paths)
          assert not set(source_paths)&set(current)
          (out/'receipt/source-qualification.bound.json').write_text(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Recompose the exact fifty product bytes over current main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$EXACT_MAIN"
          (
            cd "$WORKTREE"
            test "$(git rev-parse HEAD)" = "$EXACT_MAIN"
            git apply --index --binary "$SOURCE/product.patch"
            git diff --cached --name-only | LC_ALL=C sort > "$OUT/receipt/recomposed-paths.txt"
            cmp "$OUT/receipt/recomposed-paths.txt" "$SOURCE/changed-paths.txt"
            git diff --cached --name-status > "$OUT/receipt/recomposed-name-status.txt"
            cmp "$OUT/receipt/recomposed-name-status.txt" "$SOURCE/changed-paths-status.txt"
            test -z "$(comm -12 "$OUT/receipt/current-main-paths.txt" "$OUT/receipt/recomposed-paths.txt")"
            python3 - <<'PY'
          import hashlib,json,os,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          source=Path(os.environ['SOURCE']); manifest=json.loads((source/'file-manifest.json').read_text()); rows=manifest['files']
          assert manifest['version']==1 and len(rows)==int(os.environ['SOURCE_PRODUCT_PATHS'])
          expected={row['path']:row for row in rows}; assert len(expected)==len(rows)
          with tarfile.open(source/'product.tar','r:*') as archive:
              members=archive.getmembers(); assert len(members)==len(rows) and {m.name for m in members}==set(expected)
              for member in members:
                  p=PurePosixPath(member.name); assert not p.is_absolute() and '..' not in p.parts and member.isfile()
                  data=archive.extractfile(member).read(); row=expected[member.name]
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']
                  staged=subprocess.run(['git','show',f':{member.name}'],check=True,capture_output=True).stdout
                  mode=subprocess.run(['git','ls-files','-s','--',member.name],check=True,capture_output=True,text=True).stdout.split()[0]
                  blob=subprocess.run(['git','hash-object','--stdin'],input=staged,check=True,capture_output=True).stdout.decode().strip()
                  assert staged==data and mode==row['mode'] and blob==row['blob']
          PY
            export GIT_AUTHOR_NAME='UNDERCAST Cycle Finalizer'
            export GIT_AUTHOR_EMAIL='cycle-finalizer@undercast.invalid'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE="$COMMIT_AT"
            export GIT_COMMITTER_DATE="$COMMIT_AT"
            git commit --no-gpg-sign -m 'Doctor Who: finalize cycle 010 Merx on current main'
            product="$(git rev-parse HEAD)"
            tree="$(git show -s --format=%T HEAD)"
            test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
            test "$(git diff --name-only "$EXACT_MAIN" HEAD | wc -l | tr -d ' ')" = "$SOURCE_PRODUCT_PATHS"
            git diff --name-only "$EXACT_MAIN" HEAD | LC_ALL=C sort > "$OUT/product/changed-paths.txt"
            cmp "$OUT/product/changed-paths.txt" "$SOURCE/changed-paths.txt"
            git diff --name-status "$EXACT_MAIN" HEAD > "$OUT/product/changed-paths-status.txt"
            cmp "$OUT/product/changed-paths-status.txt" "$SOURCE/changed-paths-status.txt"
            git diff --binary "$EXACT_MAIN" HEAD > "$OUT/product/product.patch"
            git branch -f cycle-010-current-main-product HEAD
            git bundle create "$OUT/product/product.bundle" refs/heads/cycle-010-current-main-product ^"$EXACT_MAIN"
            git bundle verify "$OUT/product/product.bundle" | tee "$OUT/logs/bundle-verify.log"
            printf '%s\n' "$product" > "$OUT/product/product-commit.txt"
            printf '%s\n' "$tree" > "$OUT/product/product-tree.txt"
          )
          cp "$SOURCE/product.tar" "$SOURCE/file-manifest.json" "$OUT/product/"
          test "$(sha256sum "$OUT/product/product.tar" | awk '{print $1}')" = "$SOURCE_PRODUCT_TAR_SHA256"
          test "$(sha256sum "$OUT/product/file-manifest.json" | awk '{print $1}')" = "$SOURCE_FILE_MANIFEST_SHA256"
          for path in data/MEDIA-SEARCH-LATEST.json data/journal/media-search.jsonl; do
            test "$(git -C "$WORKTREE" rev-parse "$EXACT_MAIN:$path")" = "$(git -C "$WORKTREE" rev-parse "HEAD:$path")"
          done

      - name: Rerun composable permanent and rendered gates
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$WORKTREE"
            test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
            npm ci
            npx playwright install --with-deps chromium
            node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
            node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
            node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
            node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
            node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
            node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
            node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
            node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
            node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
            npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
            grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
            test -z "$(git status --porcelain)"
          )
          ROOT="$WORKTREE" OUTROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); out=Path(os.environ['OUTROOT'])
          state=json.loads((root/'data/AUTOPILOT.json').read_text()); doctor=[x for x in state['jobs'] if x.get('scope')=='doctor-who']
          task=next(x for x in doctor if x['id']==os.environ['TASK_ID'])
          assert len(doctor)==316 and task['status']=='resolved' and task['performer']=='Dan Starkey' and task['character']=='Merx' and task['wall_ids']==[os.environ['WALL_ID']]
          assert sum(x['status']=='queued' for x in doctor)==306 and sum(x['status']=='resolved' for x in doctor)==10
          card=next(x for x in json.loads((root/'data/specimens.json').read_text()) if x['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Merx' and card['kind']=='voice' and 'still' not in card
          assert hashlib.sha256((root/card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.loads((root/'data/review/adapter-sdk/doctor-who-cycle-010-merx.json').read_text())
          assert receipt['task']['id']==os.environ['TASK_ID'] and receipt['lease']['id']==os.environ['LEASE_ID']
          assert receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID'] and receipt['reviewed_cycle']['event_id']==os.environ['EVENT_ID']
          assert receipt['queue']['after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert receipt['boundary']['cycle_011_authorized'] is False and receipt['boundary']['eleventh_lease_issued'] is False
          status=json.loads((out/'receipt/autopilot-status.json').read_text()); water=json.loads((out/'receipt/waterline-status.json').read_text())
          assert status['total']==316 and status['statuses']=={'queued':306,'resolved':10} and status['in_flight']==0
          assert water['claim_allowed'] is True and water['claim_reasons']==[] and water['jobs']['in_flight']==0 and water['media']['debt']==0 and water['cycles']['unreceipted']==[]
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Seal current-main product qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ['OUT']); source=json.loads((out/'receipt/source-qualification.bound.json').read_text())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          product_commit=(out/'product/product-commit.txt').read_text().strip(); product_tree=(out/'product/product-tree.txt').read_text().strip()
          receipt={
            'status':'cycle-010-merx-current-main-product-qualified-v1',
            'version':1,
            'qualification_run':int(os.environ['GITHUB_RUN_ID']),
            'qualification_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'canonical_parent':os.environ['EXACT_MAIN'],
            'canonical_parent_tree':os.popen(f"git -C {os.environ['WORKTREE']} show -s --format=%T {os.environ['EXACT_MAIN']}").read().strip(),
            'source_parent':os.environ['SOURCE_MAIN'],
            'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ZIP_SHA256'],'qualification_identity':source['identity'],'product_commit':os.environ['SOURCE_PRODUCT_COMMIT'],'product_tree':os.environ['SOURCE_PRODUCT_TREE']},
            'intervening':{'commits':1,'paths':['data/MEDIA-SEARCH-LATEST.json','data/journal/media-search.jsonl'],'overlap':[]},
            'product':{'commit':product_commit,'tree':product_tree,'paths':int(os.environ['SOURCE_PRODUCT_PATHS']),'bundle_sha256':sha(out/'product/product.bundle'),'tar_sha256':sha(out/'product/product.tar'),'patch_sha256':sha(out/'product/product.patch'),'file_manifest_sha256':sha(out/'product/file-manifest.json'),'changed_paths_sha256':sha(out/'product/changed-paths.txt')},
            'task':{'id':os.environ['TASK_ID'],'lease':os.environ['LEASE_ID'],'wall':os.environ['WALL_ID'],'performer':'Dan Starkey','role':'Merx','mode':'voice'},
            'cycle':{'id':os.environ['CYCLE_ID'],'event_id':os.environ['EVENT_ID']},
            'queue_after':{'total':316,'queued':306,'resolved':10,'in_flight':0},
            'media':{'performer_portrait':'verified','portrait_sha256':os.environ['PORTRAIT_SHA256'],'character_still':'absent'},
            'gates':{'historical_checker_bytes':True,'cycle_009_composability':True,'cycle_010':True,'autopilot':True,'media':True,'waterline':True,'complete_rendered_gate':True},
            'boundary':{'repository_write':False,'product_published':False,'canonical_mutation':False,'cycle_011_authorized':False,'eleventh_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'receipt/qualification.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-current-main-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-final-product-current-main-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1
            /tmp/doctor-who-cycle-010-merx-final-product-current-main-v1-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
