name: repair-doctor-who-cycle-002-v2-carrier

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/repair-doctor-who-cycle-002-v2.yml"

permissions:
  contents: write

concurrency:
  group: repair-doctor-who-cycle-002-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/repair-doctor-who-cycle-002-v2.yml
  TARGET: .github/workflows/complete-doctor-who-cycle-002-v2.yml
  TARGET_BLOB: 0c61ca5ddcab969a33fc9038ed4a39d0115f6b93

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 64

      - name: Repair only the exact malformed Gredd v2 carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "HEAD:$TARGET")" = "$TARGET_BLOB"
          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          sha256sum "$TARGET" > /tmp/gredd-v2-before.sha256

          python3 - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml')
          data = target.read_bytes()

          typo = b'GITHUB_STEP_SUMARY'
          if data.count(typo) != 2:
              raise SystemExit(f'expected two step-summary typos, found {data.count(typo)}')
          data = data.replace(typo, b'GITHUB_STEP_SUMMARY')

          dirty_before = b'          test -r "$(git diff --name-only)"\n'
          dirty_after = b'          test -z "$(git diff --name-only)"\n'
          if data.count(dirty_before) != 1:
              raise SystemExit(f'expected one reverted clean-tree assertion, found {data.count(dirty_before)}')
          data = data.replace(dirty_before, dirty_after)

          lines = data.splitlines(keepends=True)
          start_marker = b'git diff --cached --name-only "$EXACT_MAIN" | sort > /tmp/doctor-who-cycle-002-candidate-paths.txt'
          end_marker = b"mapfile -t image_paths < <(grep '^images/' /tmp/doctor-who-cycle-002-candidate-paths.txt"
          starts = [i for i, line in enumerate(lines) if start_marker in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one candidate path marker, found {len(starts)}')
          start = starts[0]
          ends = [i for i in range(start + 1, len(lines)) if end_marker in lines[i]]
          if len(ends) != 1:
              raise SystemExit(f'expected one candidate image marker after path marker, found {len(ends)}')
          end = ends[0]
          malformed = [i for i in range(start + 1, end) if lines[i].lstrip().startswith(b'! grep -Eq')]
          if len(malformed) != 1:
              raise SystemExit(f'expected one malformed candidate transport guard, found {len(malformed)}')
          bad = malformed[0]
          indent = lines[bad][:len(lines[bad]) - len(lines[bad].lstrip())]
          lines[bad] = indent + b"! grep -Eq '^\\.github/|^\\.ci/' /tmp/doctor-who-cycle-002-candidate-paths.txt\n"
          data = b''.join(lines)

          if typo in data or dirty_before in data:
              raise SystemExit('known malformed tokens survived repair')
          guard = b"! grep -Eq '^\\.github/|^\\.ci/' /tmp/doctor-who-cycle-002-candidate-paths.txt"
          if data.count(guard) != 1:
              raise SystemExit('candidate transport guard was not restored exactly once')

          # The invalid byte was confined to the replaced guard. Refuse any other
          # non-UTF-8 corruption before making the carrier authoritative again.
          data.decode('utf-8')
          target.write_bytes(data)
          PY

          sha256sum "$TARGET" > /tmp/gredd-v2-after.sha256
          grep -Fq 'adapter baseline refresh, and terminal waterline synchronization' "$TARGET"
          ! grep -Fq 'GITHUB_STEP_SUMARY' "$TARGET"
          ! grep -Fq 'test -r "$(git diff --name-only)"' "$TARGET"
          grep -Fq "! grep -Eq '^\\.github/|^\\.ci/' /tmp/doctor-who-cycle-002-candidate-paths.txt" "$TARGET"
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/complete-doctor-who-cycle-002-v2.yml').read_text(encoding='utf-8')
          print('valid utf-8')
          PY

          git rm -f "$SELF"
          git add -- "$TARGET"
          git diff --cached --check
          printf '%s\n' "$SELF" "$TARGET" | sort > /tmp/expected-repair-paths.txt
          git diff --cached --name-only | sort > /tmp/actual-repair-paths.txt
          diff -u /tmp/expected-repair-paths.txt /tmp/actual-repair-paths.txt

          git commit \
            -m 'Doctor Who: repair the bounded Gredd v2 carrier' \
            -m 'remove the invalid byte and restore exact clean-tree, transport, and step-summary guards' \
            -m 'self-delete the repair carrier without issuing a lease'

          git fetch --no-tags --depth=64 origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"

      - name: Upload exact repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-002-v2-repair-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/gredd-v2-before.sha256
            /tmp/gredd-v2-after.sha256
            /tmp/expected-repair-paths.txt
            /tmp/actual-repair-paths.txt
