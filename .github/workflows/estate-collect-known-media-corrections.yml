name: estate-collect-known-media-corrections-retired

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: estate-collect-known-media-corrections-retired
  cancel-in-progress: true

jobs:
  verify-paid-transaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify COLLECT-001 corrected state remains durable
        run: |
          set -euo pipefail
          test "$(node -p "require('./data/review/estate-debt/COLLECT-001-PAYMENT-BOUNDARY.json').status")" = paid
          test "$(node -p "require('./data/review/estate-debt/COLLECT-001-PAYMENT-BOUNDARY.json').denominator.active_current_main_nullifications")" = 61
          test "$(node -p "require('./data/review/estate-debt/COLLECT-001-PAYMENT-BOUNDARY.json').denominator.never_landed_pr86_rejections")" = 10
          test "$(node -p "require('./data/quality-baseline.json').version")" = 2
          node scripts/estate-collect-known-media-corrections.mjs > /tmp/COLLECT-001-retired-preflight.json
          test "$(node -p "require('/tmp/COLLECT-001-retired-preflight.json').estate_denominator.active_current_main_result.collected")" = 0
          echo 'PASS — COLLECT-001 mutation authority is retired; all known invalid bindings remain collected under the paid receipt.'
