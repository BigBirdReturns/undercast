name: materialize-clifford-number-hr-counterpower-effects-wave-06

on:
  pull_request:
    branches:
      - agent/clifford-number-hr-counterpower-intervention-wave-05
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cnhr-wave06-effects-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/clifford-number-hr-counterpower-effects-wave-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Materialize, validate, and publish exact Wave 06 counterpower-effects packet
        shell: bash
        env:
          PARENT_BRANCH: agent/clifford-number-hr-counterpower-intervention-wave-05
          PARENT_SHA: 05125b9684a9a0923a8996e662cc633c47c72fbd
          PARENT_MANIFEST_SHA256: 1ab48de710d482eaa8cbed78cf6ff7f0568acbcd463b79525e67f4a394a31e6b
          PAYLOAD_SHA256: 6599109c3bad0490dd00bf4ebf9ffdc86ec48088c1ed6cc5a8b43bd027d4e6cf
          WAVE06_MANIFEST_SHA256: 44814d0f693cae4c2be4f47ab82de931c191c9e8b7a15c51b910bfda52d006ca
          WAVE06_SUMMARY_SHA256: 7e27932d3c7ff8cbb58890bf6699f8909bc670291606266854abe3173a357251
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          actual_parent="$(git rev-parse "origin/${PARENT_BRANCH}")"
          printf 'parent lease: %s\n' "$actual_parent"
          test "$actual_parent" = "$PARENT_SHA"

          test "$(wc -c < .cnhr-wave06/chunk-000.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-001.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-002.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-003.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-004.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-005.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-006.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-007.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-008.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-009.txt)" -eq 4000
          test "$(wc -c < .cnhr-wave06/chunk-010.txt)" -eq 2032

          printf '%s  %s\n' \
            451bfe67afa6f87fea81cc9a32c966d4d41483fba28440cda4600ff601429c1c .cnhr-wave06/chunk-000.txt \
            9790a914ca3ca0fe3bdfdaed221aedb4d71862872717aa8afe30399f63e6daae .cnhr-wave06/chunk-001.txt \
            8d19f8374033bd1b6244a0d8c803dd421e32f2a06a3b078406981be3f472ca77 .cnhr-wave06/chunk-002.txt \
            1f24752d0b48e495872b00d662c8689ce82c4c8a12702330bac375e9f667d112 .cnhr-wave06/chunk-003.txt \
            2a202d79d1a6e5323bcd01e312733f5ab227472e10954b6f703a05a9dd876ca0 .cnhr-wave06/chunk-004.txt \
            207cf25631614f315ef943166269d1e8dc1da23898895e13e64c18a0dec448f0 .cnhr-wave06/chunk-005.txt \
            db9504da3801f8be38ba27b67af6185f44c096d3ec269611065d88a19d230d99 .cnhr-wave06/chunk-006.txt \
            0690936c47929f898d9eb9f1d655d646661d5d54c88ad3b503ea8e8ceeb14965 .cnhr-wave06/chunk-007.txt \
            fc8385c678bea920111c68253b9b5cfdd57e207a82a9e6cff944d15a528b4263 .cnhr-wave06/chunk-008.txt \
            2b294c992ac3a3079efe1d6b422a377ced80158c16bad997e826b07f0480b877 .cnhr-wave06/chunk-009.txt \
            eb0dbc61c42be85b9b6446ec2b60ec30808e0a801e5d5ee8b708345ce19c0a4b .cnhr-wave06/chunk-010.txt \
            | sha256sum --check --strict

          test "$(git hash-object .cnhr-wave06/chunk-000.txt)" = 58ff83a88ac8eb6d52a1bac5fa094d1742178b33
          test "$(git hash-object .cnhr-wave06/chunk-001.txt)" = b18f0a78a1350e7deef34d9d6720bc307a7a7a32
          test "$(git hash-object .cnhr-wave06/chunk-002.txt)" = 9f21a66d7559d93894d4021302305c7b53497b28
          test "$(git hash-object .cnhr-wave06/chunk-003.txt)" = e0ffac5479d049d2f079f82ca62022eb47ec1424
          test "$(git hash-object .cnhr-wave06/chunk-004.txt)" = fea7148c07fa4e00201a49b1fb20ce68c5319a72
          test "$(git hash-object .cnhr-wave06/chunk-005.txt)" = 63716dd2cfdbb71fe5506d62924818dfe09a48b0
          test "$(git hash-object .cnhr-wave06/chunk-006.txt)" = 191748c5c9dec1b0e41f2144404bc68e6fcfdf6f
          test "$(git hash-object .cnhr-wave06/chunk-007.txt)" = aec1ce6bd4d94c8cef141011bf35641839d74266
          test "$(git hash-object .cnhr-wave06/chunk-008.txt)" = 18f9871bb1c0ce40a2188ec7b83c845c699cce75
          test "$(git hash-object .cnhr-wave06/chunk-009.txt)" = f0d7a51ffe0db1af03c6f61e637abb8ea7193243
          test "$(git hash-object .cnhr-wave06/chunk-010.txt)" = 7fad00f89d996cbf19ce2a0bbd3335c102d32897

          cat .cnhr-wave06/chunk-*.txt \
            | tr -d '\n' \
            | base64 --decode > /tmp/cnhr-wave06.tar.gz
          test "$(wc -c < /tmp/cnhr-wave06.tar.gz)" -eq 31523
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/cnhr-wave06.tar.gz \
            | sha256sum --check --strict

          tar -tzf /tmp/cnhr-wave06.tar.gz \
            | python -c 'import sys; paths=[line.strip() for line in sys.stdin if line.strip()]; assert paths; assert all(not p.startswith("/") and ".." not in p.split("/") for p in paths)'
          tar -xzf /tmp/cnhr-wave06.tar.gz -C .
          rm -rf .cnhr-wave06 .github/workflows/cnhr-wave06-effects-materialize.yml

          rm -rf /tmp/cnhr-wave05-root /tmp/cnhr-wave06-root
          mkdir -p /tmp/cnhr-wave05-root /tmp/cnhr-wave06-root
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source_root = Path('.')
          packets = [
              ('data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json', Path('/tmp/cnhr-wave05-root'), 22),
              ('data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json', Path('/tmp/cnhr-wave06-root'), 22),
          ]
          for manifest_rel, packet_root, expected_count in packets:
              manifest_path = Path(manifest_rel)
              manifest = json.loads(manifest_path.read_text())
              paths = {row['path'] for row in manifest['files']} | {manifest_rel}
              assert len(paths) == expected_count, (manifest_rel, len(paths))
              for rel in sorted(paths):
                  src = source_root / rel
                  dst = packet_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
              print(f'isolated validation root: {manifest_rel} -> {len(paths)} exact files')
          PY

          (cd /tmp/cnhr-wave05-root && \
            node --check scripts/clifford-number-hr-counterpower-interventions.mjs && \
            node --check test/clifford-number-hr-counterpower-interventions-fixtures.mjs && \
            node scripts/clifford-number-hr-counterpower-interventions.mjs --check --strict-root && \
            node test/clifford-number-hr-counterpower-interventions-fixtures.mjs)

          (cd /tmp/cnhr-wave06-root && \
            node --check scripts/clifford-number-hr-counterpower-effects.mjs && \
            node --check test/clifford-number-hr-counterpower-effects-fixtures.mjs && \
            node scripts/clifford-number-hr-counterpower-effects.mjs --check --strict-root && \
            node test/clifford-number-hr-counterpower-effects-fixtures.mjs)

          printf '%s  %s\n' "$PARENT_MANIFEST_SHA256" \
            data/review/clifford-number/hr-discipline/wave-05/MANIFEST.json \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            "$WAVE06_MANIFEST_SHA256" data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json \
            "$WAVE06_SUMMARY_SHA256" data/review/clifford-number/hr-discipline/wave-06/WAVE-06-SUMMARY.json \
            | sha256sum --check --strict

          git diff --check
          git add -A
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          parent = '05125b9684a9a0923a8996e662cc633c47c72fbd'
          manifest_path = Path('data/review/clifford-number/hr-discipline/wave-06/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text())
          expected = {row['path'] for row in manifest['files']} | {str(manifest_path)}
          lines = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status', parent, '--'],
              text=True,
          ).splitlines()
          observed = {}
          for line in lines:
              status, path = line.split('\t', 1)
              observed[path] = status
          assert set(observed) == expected, (
              sorted(expected - set(observed)),
              sorted(set(observed) - expected),
          )
          assert all(status == 'A' for status in observed.values()), observed
          assert len(observed) == 22, len(observed)
          assert not any(path.startswith('.cnhr-wave06/') for path in observed)
          assert '.github/workflows/cnhr-wave06-effects-materialize.yml' not in observed
          print('exact Wave 06 counterpower-effects delta: 22 added, 0 modified, 0 deleted')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: add Clifford Number counterpower-effects Wave 06'
          git push origin HEAD:"${HEAD_REF}"
