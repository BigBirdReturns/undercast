name: doctor-who-cycle-008-kreg-final-product-v9d

"on":
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-final-product-v9d.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-008-kreg-final-product-v9d-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_WORKFLOW_BLOB: ebf348c4fc17a9ae1f420b113d661f0611c490ec
  OLD_WORKFLOW_BLOB: 1fb8af74baef0f1a92bafcdc316df371038dfc4d
  V8B_BRANCH: agent/doctor-who-cycle-008-kreg-independent-review-v8b
  V8B_WORKFLOW: doctor-who-cycle-008-kreg-independent-review-v8b
  CYCLE007_MERGE: e00b03436e354f3543cf4ed67a0c5b9f6ba4f97b
  TASK_ID: ap_469d79ea29fd7f877395d20f
  LEASE_ID: lease_e65f837070361eacbb1abd46
  WALL_ID: UC-1353
  SOURCE_URL: https://tardis.fandom.com/wiki/Kreg
  SOURCE_PAGE_ID: "300765"
  SOURCE_REVISION: "3851642"
  SOURCE_TIMESTAMP: "2026-07-28T09:20:48Z"
  SOURCE_BYTES: "840"
  SOURCE_CONTENT_SHA256: c1333a4eb91b2989d380cdcffee9d22da968a82aef43ba39a2541fb52f8bc0a9
  SOURCE_FINGERPRINT: e9d2d5a601e8ca061ac0bf3ffb9148537772e92ef267f23e703a9250b1d9fda4
  MEDIA_SHA256: 5d19f72cbe08648568c84469287dfcd14a9c0789156cd3d740edf4c1c5bb0622
  MEDIA_BYTES: "67113"
  MEDIA_WIDTH: "1053"
  MEDIA_HEIGHT: "805"
  MEDIA_ASSET_ID: "504051495"
  OLD_TASK_ID: ap_ffea809b980b468b33fa462c
  OLD_WALL_ID: UC-1352
  OLD_CYCLE_ID: cycle_540222fb1378fa680a43d080
  OLD_MEDIA_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  OLD_SOURCE_PAGE_ID: "301280"
  OLD_SOURCE_REVISION: "3711733"
  OLD_SOURCE_CONTENT_SHA256: 6f57112817f92b445ae7f32223f3d4e095c11f2c1702bab84eca4eccc17d8428
  OLD_SOURCE_FINGERPRINT: 8baf724d7501a98347e
  EXPECTED_CANDIDATE_PATHS: "40"
  EXPECTED_FINALIZATION_PATHS: "8"
  EXPECTED_FINAL_PATHS: "48"

jobs:
  finalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-final-product-v9d'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      finalization_main: ${{ steps.seal.outputs.finalization_main }}
    env:
      GH_TOKEN: ${{ github.token }}
      SELF: .github/workflows/doctor-who-cycle-008-kreg-final-product-v9d.yml
      AUTHORIZED_BRANCH: agent/doctor-who-cycle-008-kreg-final-product-v9d
      AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
      AUTHORIZED_PR: ${{ github.event.pull_request.number }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-finalize
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover current V9b finalizer scripts and pay baseline binding defect
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT"
          mkdir -p "$SCRIPT_ROOT"/{api,bootstrap,finalize}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_WORKFLOW_BLOB" > "$SCRIPT_ROOT/api/source-workflow.json"
          jq -e --arg sha "$SOURCE_WORKFLOW_BLOB" '.sha==$sha and .encoding=="base64"' "$SCRIPT_ROOT/api/source-workflow.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/api/source-workflow.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/source-v9b.yml"
          test "$(git hash-object "$SCRIPT_ROOT/source-v9b.yml")" = "$SOURCE_WORKFLOW_BLOB"
          SOURCE="$SCRIPT_ROOT/source-v9b.yml" TARGET="$SCRIPT_ROOT/bootstrap/recover-finalizer.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          doc=yaml.safe_load(Path(os.environ['SOURCE']).read_text())
          rows=[s for s in doc['jobs']['finalize']['steps'] if s.get('name')=='Recover and patch immutable finalizer scripts']
          assert len(rows)==1 and isinstance(rows[0].get('run'),str)
          Path(os.environ['TARGET']).write_text(rows[0]['run'])
          PY
          bash -n "$SCRIPT_ROOT/bootstrap/recover-finalizer.sh"
          bash "$SCRIPT_ROOT/bootstrap/recover-finalizer.sh"
          SCRIPT="$SCRIPT_ROOT/finalize/06.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['SCRIPT'])
          text=path.read_text()
          marker="old_adapter='data/review/adapter-sdk/doctor-who-cycle-007-kragar.json'; new_adapter='data/review/adapter-sdk/doctor-who-cycle-008-kreg.json'"
          assert text.count(marker)==1
          patch='\n'.join([
              "estate_path=work/'data/ESTATE-REGISTRY.json'",
              "baseline_path=work/'data/review/adapter-sdk/BASELINE.json'",
              "baseline=json.loads(baseline_path.read_text())",
              "estate_sha=hashlib.sha256(estate_path.read_bytes()).hexdigest()",
              "assert baseline['inputs']['estate_registry']['path']=='data/ESTATE-REGISTRY.json'",
              "baseline['inputs']['estate_registry']['sha256']=estate_sha",
              "baseline_path.write_text(json.dumps(baseline,indent=2,ensure_ascii=False)+'\\n')",
              "assert json.loads(baseline_path.read_text())['inputs']['estate_registry']['sha256']==estate_sha",
          ])+'\n'
          text=text.replace(marker,patch+marker)
          stage='git -C "$work" add --pathspec-from-file="$OUT/product/finalization-paths.txt"'
          assert text.count(stage)==1
          audit='\n'.join([
              "estate_sha=\"$(sha256sum \"$work/data/ESTATE-REGISTRY.json\" | awk '{print $1}')\"",
              "test \"$(jq -r '.inputs.estate_registry.sha256' \"$work/data/review/adapter-sdk/BASELINE.json\")\" = \"$estate_sha\"",
          ])+'\n'
          text=text.replace(stage,audit+stage)
          lines=text.splitlines()
          candidates=[i for i,line in enumerate(lines) if line.startswith('candidate=')]
          assert len(candidates)==2, candidates
          assert lines[candidates[0]]=='candidate="$CANDIDATE_COMMIT"'
          lines[candidates[1]]='candidate="$CANDIDATE_COMMIT"'
          text='\n'.join(lines)+'\n'
          path.write_text(text)
          PY
          bash -n "$SCRIPT_ROOT/finalize/06.sh"
          grep -F "baseline['inputs']['estate_registry']['sha256']=estate_sha" "$SCRIPT_ROOT/finalize/06.sh" >/dev/null
          grep -F "jq -r '.inputs.estate_registry.sha256'" "$SCRIPT_ROOT/finalize/06.sh" >/dev/null
          sha256sum "$SCRIPT_ROOT/finalize"/*.sh > "$SCRIPT_ROOT/finalize-scripts-v9d.sha256"

      - name: Bind exact one-file finalizer and observed live main
        run: bash "$SCRIPT_ROOT/finalize/01.sh"

      - name: Retain exact successful V8b review packet
        run: bash "$SCRIPT_ROOT/finalize/02.sh"

      - name: Verify approved V8b authority and candidate bytes
        run: bash "$SCRIPT_ROOT/finalize/03.sh"

      - name: Recompose exact candidate over finalization main
        id: candidate
        run: bash "$SCRIPT_ROOT/finalize/04.sh"

      - name: Recover exact cycle-007 finalization templates
        run: bash "$SCRIPT_ROOT/finalize/05.sh"

      - name: Derive deterministic eight-path cycle-008 finalization
        id: finalize_product
        env:
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.candidate_commit }}
        run: bash "$SCRIPT_ROOT/finalize/06.sh"

      - name: Run permanent checkers and complete rendered gate
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/07.sh"

      - name: Seal code-free forty-eight-path prototype packet
        id: seal
        env:
          FINAL_COMMIT: ${{ steps.finalize_product.outputs.final_commit }}
        run: bash "$SCRIPT_ROOT/finalize/08.sh"

      - name: Upload V9d final-product prototype
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9d-prototype-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-finalize/product
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain finalize diagnostics and remove worktree
        if: always()
        shell: bash
        run: |
          if [ -f "$SCRIPT_ROOT/finalize/09.sh" ]; then
            bash "$SCRIPT_ROOT/finalize/09.sh"
          fi

      - name: Upload V9d finalizer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9d-finalize-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-finalize
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  review:
    needs: finalize
    if: needs.finalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-review
      SCRIPT_ROOT: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-review-scripts
      PROTOTYPE_ID: ${{ needs.finalize.outputs.artifact_id }}
      PROTOTYPE_DIGEST: ${{ needs.finalize.outputs.artifact_digest }}
      SOURCE_FINALIZATION_MAIN: ${{ needs.finalize.outputs.finalization_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Recover current V9b independent review scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SCRIPT_ROOT"
          mkdir -p "$SCRIPT_ROOT"/{api,bootstrap,review}
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$SOURCE_WORKFLOW_BLOB" > "$SCRIPT_ROOT/api/source-workflow.json"
          jq -e --arg sha "$SOURCE_WORKFLOW_BLOB" '.sha==$sha and .encoding=="base64"' "$SCRIPT_ROOT/api/source-workflow.json" >/dev/null
          jq -r '.content' "$SCRIPT_ROOT/api/source-workflow.json" | tr -d '\n' | base64 --decode > "$SCRIPT_ROOT/source-v9b.yml"
          test "$(git hash-object "$SCRIPT_ROOT/source-v9b.yml")" = "$SOURCE_WORKFLOW_BLOB"
          SOURCE="$SCRIPT_ROOT/source-v9b.yml" TARGET="$SCRIPT_ROOT/bootstrap/recover-review.sh" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          doc=yaml.safe_load(Path(os.environ['SOURCE']).read_text())
          rows=[s for s in doc['jobs']['review']['steps'] if s.get('name')=='Recover and patch immutable review scripts']
          assert len(rows)==1 and isinstance(rows[0].get('run'),str)
          Path(os.environ['TARGET']).write_text(rows[0]['run'])
          PY
          bash -n "$SCRIPT_ROOT/bootstrap/recover-review.sh"
          bash "$SCRIPT_ROOT/bootstrap/recover-review.sh"
          sha256sum "$SCRIPT_ROOT/review"/*.sh > "$SCRIPT_ROOT/review-scripts-v9d.sha256"

      - name: Bind exact same-run prototype artifact and live review main
        run: bash "$SCRIPT_ROOT/review/01.sh"

      - name: Verify prototype checksums, receipt, archive, bundle, and patch
        run: bash "$SCRIPT_ROOT/review/02.sh"

      - name: Independently recompose exact forty-eight paths and run complete gate
        id: review_product
        run: bash "$SCRIPT_ROOT/review/03.sh"

      - name: Seal approved-for-publication product packet
        env:
          REVIEWED_COMMIT: ${{ steps.review_product.outputs.reviewed_commit }}
        run: bash "$SCRIPT_ROOT/review/04.sh"

      - name: Upload approved V9d final-product packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9d-approved-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-review/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Retain review diagnostics and remove worktrees
        if: always()
        run: bash "$SCRIPT_ROOT/review/05.sh"

      - name: Upload V9d review failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-final-product-v9d-review-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-008-kreg-final-product-v9d-review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
