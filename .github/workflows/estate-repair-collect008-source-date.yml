name: estate-repair-collect008-source-date

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect008-source-date.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect008-source-date
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-current-null-lane-008.mjs

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head repair custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Bind canonical source freshness to the adoption transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/estate-adopt-current-null-lane-008.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    specimenById.get(context.recordId)[context.side] = context.intended;
              sourceById.get(context.recordId)[context.side] = context.intended;'''
          new = '''    specimenById.get(context.recordId)[context.side] = context.intended;
              const source = sourceById.get(context.recordId);
              source[context.side] = context.intended;
              source.fetched_at = String(now).slice(0, 10);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact source-date patch expected one match, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Prove the repaired whole-lane executor
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          node scripts/estate-canonical-adoption-ledger.mjs
          node "$EXECUTOR" | tee /tmp/COLLECT-008-source-date-preflight.json
          test "$(node -p "require('/tmp/COLLECT-008-source-date-preflight.json').authorized")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-source-date-preflight.json').pending")" = "24"
          test "$(node -p "require('/tmp/COLLECT-008-source-date-preflight.json').already_adopted")" = "0"
          grep -Fq 'source.fetched_at = String(now).slice(0, 10);' "$EXECUTOR"

      - name: Retire one-shot repair authority and stage exact source change
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-repair-collect008-source-date.yml
          git add -- "$EXECUTOR"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n' '.github/workflows/estate-repair-collect008-source-date.yml' "$EXECUTOR" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-008-source-date-repair.tree

      - name: Run complete repository and rendered-browser gate
        run: npm run gate

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-008-source-date-repair.tree)" = "$(git write-tree)"
          node "$EXECUTOR" > /tmp/COLLECT-008-source-date-postgate.json
          test "$(node -p "require('/tmp/COLLECT-008-source-date-postgate.json').pending")" = "24"

      - name: Publish exact repaired executor under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: bind COLLECT-008 source freshness' \
            -m 'transaction=COLLECT-008' \
            -m 'source_fetched_at=adoption_date' \
            -m 'canonical_mutation=false' \
            -m 'evidence_standard=unchanged' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "repair_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-008-source-date-repair.tree)"
          REPAIR_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$REPAIR_HEAD" >> "$GITHUB_OUTPUT"

      - name: Report repaired executor
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-008 source-date repair passed every gate on workflow run ${GITHUB_RUN_ID}. Repair head: ${{ steps.publish.outputs.head }}. The schema-aware executor now advances each changed SOURCES row to the adoption date while preserving all packet and ruling custody. No canonical media changed, and the one-shot repair workflow deleted itself."

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-008 source-date repair failed closed on workflow run ${GITHUB_RUN_ID}. No 24-object canonical payment claim is authorized."

      - name: Preserve repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-008-source-date-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-008-source-date-preflight.json
            /tmp/COLLECT-008-source-date-postgate.json
            /tmp/COLLECT-008-source-date-repair.tree
          if-no-files-found: warn
          retention-days: 30
