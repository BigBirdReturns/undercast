name: card-backfill-production-lock-reset

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-production-lock-reset.yml'

permissions:
  contents: read

concurrency:
  group: card-backfill-publication-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pre-wave production transactions
        run: |
          echo 'Stale source-wave and publication runs from superseded branch heads were cancelled.'
          echo 'No repository mutation occurs in this reset.'
          echo 'canonical_mutation=false'
