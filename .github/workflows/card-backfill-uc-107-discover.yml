name: card-backfill-uc-107-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-107-DISCOVER.json"
      - "scripts/card-backfill-uc-107-discover.mjs"
      - ".github/workflows/card-backfill-uc-107-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-107-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-023'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-107 official discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-107-DISCOVER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-107');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-107');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1b74425768d476b9f0339c17');
          if(row.version!==1||row.record_id!=='UC-107'||row.actor!=='Pedro Pascal'||row.character!=='The Mandalorian'||row.production!=='The Mandalorian'||row.year!==2019||row.side!=='still')throw new Error('UC-107 discovery authorization drift');
          if(row.selector_artifact?.artifact_id!==8672920095||row.scope_artifact?.artifact_id!==8672971563||row.scope_artifact?.scope_sha256!=='25db480d25d658880d93c0feec43afbf9a0ce48f7986a13d97386d02adde55e2')throw new Error('UC-107 discovery custody drift');
          if(row.pages?.length!==3||row.pages.filter(page=>page.strict).length!==3||row.pages[0]?.final_assets?.length!==2||row.minimum_final_candidates!==2)throw new Error('UC-107 source denominator drift');
          if(row.selection_contract?.official_lucasfilm_or_disney_final_frame_required!==true||row.selection_contract?.exact_2019_titular_mandalorian_required!==true||row.selection_contract?.frame_specific_body_occupant_claim_forbidden!==true||row.selection_contract?.actor_role_custody_separate_from_character_frame!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-107 selection contract drift');
          if(!specimen||specimen.character!=='The Mandalorian'||specimen.production!=='The Mandalorian'||specimen.years!=='2019'||specimen.still)throw new Error('UC-107 specimen boundary drift');
          if(source?.still)throw new Error('UC-107 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-107'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-107 audit boundary drift');
          console.log('PASS — exact UC-107 official 2019 source orbit authorized');
          NODE
      - name: Gather official Mandalorian candidates and custody receipts
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-107-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node --check scripts/card-backfill-uc-107-discover.mjs
          node scripts/card-backfill-uc-107-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-107-discover-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload official pages, final candidates, hashes, and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-107-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-107-discover
            ${{ runner.temp }}/card-backfill-uc-107-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
