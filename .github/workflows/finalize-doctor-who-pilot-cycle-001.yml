name: finalize-doctor-who-pilot-cycle-001

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-doctor-who-pilot-cycle-001.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-doctor-who-pilot-cycle-001-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  GH_TOKEN: ${{ github.token }}
  SELF: .github/workflows/finalize-doctor-who-pilot-cycle-001.yml
  PRIMARY_WORKFLOW: .github/workflows/apply-doctor-who-pilot-cycle-001.yml
  MATERIALIZER: scripts/apply-doctor-who-pilot-cycle-001.mjs
  RECEIPT: data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
  CHECKER: scripts/doctor-who-pilot-cycle.mjs

jobs:
  finalize:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch and current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"

      - name: Resume or verify the exact Doctor Who cycle
        run: |
          set -euo pipefail
          if [ -f "$RECEIPT" ] && [ -f "$CHECKER" ]; then
            npm run doctor-who:pilot-cycle:check
          else
            test -f "$MATERIALIZER"
            python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-doctor-who-pilot-cycle-001.mjs')
          s = p.read_text()
          old = "const abs = (p) => path.join(ROOT, p);"
          new = "const abs = (p) => path.isAbsolute(p) ? p : path.join(ROOT, p);"
          if old in s:
              p.write_text(s.replace(old, new))
          elif new not in s:
              raise SystemExit('materializer path helper drifted')
          PY
            node --check "$MATERIALIZER"
            cycle_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
            export CYCLE_AT="$cycle_at"
            echo "CYCLE_AT=$cycle_at" >> "$GITHUB_ENV"
            node "$MATERIALIZER" 2>&1 | tee /tmp/doctor-who-pilot-cycle-finalizer-materialization.log
          fi

          test -f "$RECEIPT"
          test -f "$CHECKER"
          npm run doctor-who:pilot-cycle:check
          npm run gate 2>&1 | tee /tmp/doctor-who-pilot-cycle-finalizer-gate.log

      - name: Publish the workflow-free exact product
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift data/_curate
          git rm -f --ignore-unmatch "$SELF" "$PRIMARY_WORKFLOW" "$MATERIALIZER"
          git add -A
          git diff --cached --check
          test -z "$(git ls-files --others --exclude-standard)"

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"

          git config user.name undercast-estate-collector
          git config user.email undercast-estate-collector@users.noreply.github.com
          git commit \
            -m 'Pilot: finalize the first Doctor Who corpus cycle' \
            -m 'retain one resolved source-bound voice record and two honest media absences' \
            -m 'seal the reviewed cycle receipt and remove all transport'
          published_head="$(git rev-parse HEAD)"
          echo "PUBLISHED_HEAD=$published_head" >> "$GITHUB_ENV"

          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/doctor-who-pilot-cycle-final-paths.txt
          if grep -Eq '^\.github/|^scripts/apply-doctor-who-pilot-cycle-001\.mjs$|^records/|^test-results/|^playwright-report/' /tmp/doctor-who-pilot-cycle-final-paths.txt; then
            echo 'transport or generated runtime survived the product diff' >&2
            cat /tmp/doctor-who-pilot-cycle-final-paths.txt >&2
            exit 1
          fi
          git diff --stat refs/remotes/origin/main...HEAD > /tmp/doctor-who-pilot-cycle-final-stat.txt

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}"

      - name: Publish final PR receipt and merge the exact tree
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/doctor-who-pilot-cycle-pr-body.md
          const fs = require('fs');
          const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT, 'utf8'));
          const paths = fs.readFileSync('/tmp/doctor-who-pilot-cycle-final-paths.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean);
          console.log(`## Completed first Doctor Who operating cycle\n`);
          console.log(`This transaction converts the one activated Doctor Who lease into one canonical, source-bound voice record and closes the cycle through honest media absence and second-desk receipt custody. The actors are the preserved Tardis Wiki source, Autopilot, the keyless growth path, the Doctor Who media scope, the rolling waterline, and the reviewed cycle controller.\n`);
          console.log('## Exact result\n');
          console.log('```text');
          console.log(`base main:            ${receipt.base_sha}`);
          console.log(`published product:    ${process.env.PUBLISHED_HEAD}`);
          console.log(`task:                 ${receipt.task.id}`);
          console.log(`lease:                ${receipt.lease.id}`);
          console.log(`canonical wall id:    ${receipt.canonical.wall_id}`);
          console.log(`Doctor Who queued:    ${receipt.queue.queued}`);
          console.log(`Doctor Who resolved:  ${receipt.queue.resolved}`);
          console.log(`Doctor Who in flight: ${receipt.queue.in_flight}`);
          console.log(`still:                ${receipt.media.dispositions.still}`);
          console.log(`portrait:             ${receipt.media.dispositions.portrait}`);
          console.log(`cycle outcome:        ${receipt.reviewed_cycle.outcome}`);
          console.log(`receipt SHA-256:      ${receipt.receipt_sha256}`);
          console.log(`durable paths:        ${paths.length}`);
          console.log('```\n');
          console.log('The canonical record identifies Dan Starkey as Commander in *The Sontarans*, files the audio-only role at the conservative text-and-vision transform baseline, and introduces the `Doctor Who` universe as the durable media namespace for this active estate. Both media facets remain null. No generic Sontaran image was substituted, no existing Dan Starkey portrait bytes were copied, and no second lease was issued.\n');
          console.log('## Qualification\n');
          console.log(`The exact product passed the complete repository and rendered-browser gate after the permanent receipt was sealed. The machine-checkable receipt is \`${process.env.RECEIPT}\`; \`npm run doctor-who:pilot-cycle:check\` independently binds the task, wall record, null media, 316-task denominator, terminal queue, completed cycle receipt, and no-second-lease boundary.\n`);
          console.log('## Control question\n');
          console.log('Does main now contain exactly one resolved Doctor Who pilot, two honest media absences, one reviewed cycle receipt, zero in-flight Doctor Who tasks, and no transport or authority for a second lease?');
          NODE

          gh pr edit "$PR_NUMBER" --body-file /tmp/doctor-who-pilot-cycle-pr-body.md
          gh pr ready "$PR_NUMBER" || true
          gh pr merge "$PR_NUMBER" --squash \
            --subject 'Pilot: complete the first Doctor Who corpus cycle' \
            --body 'Resolve the exact Dan Starkey Commander voice lease, retain honest null media, seal the reviewed cycle receipt, and issue no second lease.'

          sleep 3
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          git diff --exit-code "$PUBLISHED_HEAD" refs/remotes/origin/main
          echo "merged_main=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_STEP_SUMMARY"
          echo "published_product=${PUBLISHED_HEAD}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final cycle, gate, receipt, and path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-pilot-cycle-finalizer-${{ github.run_id }}
          path: |
            /tmp/doctor-who-pilot-cycle-finalizer-materialization.log
            /tmp/doctor-who-pilot-cycle-finalizer-gate.log
            /tmp/doctor-who-pre-cycle-gate.log
            /tmp/doctor-who-product-gate-1.log
            /tmp/doctor-who-product-gate-final.log
            /tmp/doctor-who-pilot-cycle-final-paths.txt
            /tmp/doctor-who-pilot-cycle-final-stat.txt
            /tmp/doctor-who-pilot-cycle-pr-body.md
            data/review/adapter-sdk/doctor-who-pilot-cycle-001.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
