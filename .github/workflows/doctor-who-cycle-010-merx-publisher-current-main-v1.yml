name: doctor-who-cycle-010-merx-publisher-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-publisher-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-publisher-current-main-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-publisher-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      BRANCH: agent/doctor-who-cycle-010-merx-publisher-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-publisher-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1
      SOURCE: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-source
      WORKTREE: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-worktree
      REVIEW_PR: "739"
      REVIEW_HEAD: 9907e49a5a4d8494497762e1d865baed31de23ca
      REVIEW_RUN: "31297747862"
      REVIEW_JOB: "93205485611"
      REVIEW_ARTIFACT: "9033532971"
      REVIEW_ZIP_SHA256: 0f1bca462e5640a73b3e19a9f30b17f531cb0cf81a93836083709bf98b6e3e8e
      APPROVAL_IDENTITY: 7298d761f8abb0f5ec80e0ec1cd5649e470dbbb49954d6d178a1d03312c0354f
      PRODUCT_COMMIT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_BUNDLE_SHA256: 0ab9ead02773cd7b2413b8f8a504e28e69a4eb90d8e694885cbd4cd0e60a8864
      PRODUCT_TAR_SHA256: 08d604ba1d503ac0be0ecd079350bd6ad3becaae2b32ff9d65cfe3d0e214c9ec
      PRODUCT_PATCH_SHA256: dc89e52ad024c9efb0cdbcc8fb426b844f2169a8069001e69b9da61c2ee59a97
      FILE_MANIFEST_SHA256: b91d4ed69851b88af1209f584cd695102ff62481a3697455657ccdaf517ed834
      CHANGED_PATHS_SHA256: fab9395f4ba0fd05593546030c9376f48e37a7076ebe54b5d02524a89acd5c01
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687
      TARGET_BRANCH: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate independent approval and exact product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SOURCE" "$WORKTREE" /tmp/merx-publisher-api
          mkdir -p "$OUT"/{logs,payload} "$SOURCE" /tmp/merx-publisher-api
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > /tmp/merx-publisher-api/carrier.json
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$REVIEW_PR" > /tmp/merx-publisher-api/review-pr.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN" > /tmp/merx-publisher-api/review-run.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$REVIEW_RUN/jobs?per_page=100" > /tmp/merx-publisher-api/review-jobs.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT" > /tmp/merx-publisher-api/review-artifact.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$REVIEW_ARTIFACT/zip" > /tmp/merx-publisher-review.zip
          test "$(sha256sum /tmp/merx-publisher-review.zip | awk '{print $1}')" = "$REVIEW_ZIP_SHA256"
          HEAD="$head" PR="$pr" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          api=Path('/tmp/merx-publisher-api'); source=Path(os.environ['SOURCE']); out=Path(os.environ['OUT'])
          own=json.loads((api/'carrier.json').read_text()); pr=json.loads((api/'review-pr.json').read_text())
          run=json.loads((api/'review-run.json').read_text()); jobs=json.loads((api/'review-jobs.json').read_text())['jobs']; artifact=json.loads((api/'review-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert pr['number']==int(os.environ['REVIEW_PR']) and pr['merged'] is False and pr['base']['sha']==os.environ['MAIN'] and pr['head']['sha']==os.environ['REVIEW_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['REVIEW_RUN']) and run['name']=='doctor-who-cycle-010-merx-final-review-current-main-v1'
          assert run['head_sha']==os.environ['REVIEW_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          job=next(row for row in jobs if row['id']==int(os.environ['REVIEW_JOB']))
          assert job['name']=='review' and job['status']=='completed' and job['conclusion']=='success'
          assert artifact['id']==int(os.environ['REVIEW_ARTIFACT']) and artifact['expired'] is False and artifact['digest']=='sha256:'+os.environ['REVIEW_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['REVIEW_RUN']) and artifact['workflow_run']['head_sha']==os.environ['REVIEW_HEAD']
          with zipfile.ZipFile('/tmp/merx-publisher-review.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({r.filename for r in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  target=source/p; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          ledger=source/'SHA256SUMS.pre'; sealed=source/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=source/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          approval=json.loads((source/'review/approval.json').read_text()); identity=approval.pop('identity')
          assert identity==os.environ['APPROVAL_IDENTITY']
          assert hashlib.sha256(json.dumps(approval,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          approval['identity']=identity
          assert approval['status']=='cycle-010-merx-current-main-product-independently-approved-v1'
          assert approval['canonical_parent']==os.environ['MAIN']
          assert approval['product']['commit']==os.environ['PRODUCT_COMMIT'] and approval['product']['tree']==os.environ['PRODUCT_TREE'] and approval['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert approval['product']['bundle_sha256']==os.environ['PRODUCT_BUNDLE_SHA256'] and approval['product']['tar_sha256']==os.environ['PRODUCT_TAR_SHA256']
          assert approval['product']['patch_sha256']==os.environ['PRODUCT_PATCH_SHA256'] and approval['product']['file_manifest_sha256']==os.environ['FILE_MANIFEST_SHA256']
          assert approval['product']['changed_paths_sha256']==os.environ['CHANGED_PATHS_SHA256']
          assert approval['queue']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert all(approval['gates'].values()) and not any(approval['boundary'].values())
          (out/'payload/approval.bound.json').write_text(json.dumps(approval,indent=2,sort_keys=True)+'\n')
          PY
          test "$(sha256sum "$SOURCE/product/product.bundle" | awk '{print $1}')" = "$PRODUCT_BUNDLE_SHA256"
          test "$(sha256sum "$SOURCE/product/product.tar" | awk '{print $1}')" = "$PRODUCT_TAR_SHA256"
          test "$(sha256sum "$SOURCE/product/product.patch" | awk '{print $1}')" = "$PRODUCT_PATCH_SHA256"
          test "$(sha256sum "$SOURCE/product/file-manifest.json" | awk '{print $1}')" = "$FILE_MANIFEST_SHA256"
          test "$(sha256sum "$SOURCE/product/changed-paths.txt" | awk '{print $1}')" = "$CHANGED_PATHS_SHA256"
          git bundle verify "$SOURCE/product/product.bundle" | tee "$OUT/logs/bundle-verify.log"
          git fetch "$SOURCE/product/product.bundle" refs/heads/cycle-010-current-main-product:refs/qualify/cycle-010-product
          test "$(git rev-parse refs/qualify/cycle-010-product)" = "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          git diff --name-only "$MAIN" "$PRODUCT_COMMIT" | LC_ALL=C sort > "$OUT/payload/changed-paths.txt"
          cmp "$OUT/payload/changed-paths.txt" "$SOURCE/product/changed-paths.txt"
          test "$(wc -l < "$OUT/payload/changed-paths.txt" | tr -d ' ')" = "$PRODUCT_PATHS"
          cp "$SOURCE/product/product.bundle" "$OUT/payload/product.bundle"
          cp "$SOURCE/product/file-manifest.json" "$OUT/payload/file-manifest.json"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Rerun exact product gates for publication
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT_COMMIT"
          (
            cd "$WORKTREE"
            test "$(git show -s --format=%P HEAD)" = "$MAIN"
            test "$(git show -s --format=%T HEAD)" = "$PRODUCT_TREE"
            test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
            npm ci
            npx playwright install --with-deps chromium
            node scripts/doctor-who-cycle-009.mjs | tee "$OUT/logs/cycle-009.log"
            node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
            node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
            node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
            node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
            node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
            node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/payload/waterline-status.json"
            node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/logs/waterline-gate.log"
            npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
            grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
            test -z "$(git status --porcelain)"
          )
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/payload/waterline-status.json" >/dev/null
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal code-free publication payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          payload=Path(os.environ['OUT'])/'payload'; approval=json.loads((payload/'approval.bound.json').read_text())
          receipt={
            'status':'cycle-010-merx-exact-product-approved-for-publication-v1',
            'version':1,
            'qualify_run':int(os.environ['GITHUB_RUN_ID']),
            'qualify_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'canonical_parent':os.environ['MAIN'],
            'review':{'pr':int(os.environ['REVIEW_PR']),'head':os.environ['REVIEW_HEAD'],'run':int(os.environ['REVIEW_RUN']),'job':int(os.environ['REVIEW_JOB']),'artifact':int(os.environ['REVIEW_ARTIFACT']),'artifact_sha256':os.environ['REVIEW_ZIP_SHA256'],'approval_identity':approval['identity']},
            'product':{'commit':os.environ['PRODUCT_COMMIT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'bundle_sha256':os.environ['PRODUCT_BUNDLE_SHA256'],'tar_sha256':os.environ['PRODUCT_TAR_SHA256'],'patch_sha256':os.environ['PRODUCT_PATCH_SHA256'],'file_manifest_sha256':os.environ['FILE_MANIFEST_SHA256'],'changed_paths_sha256':os.environ['CHANGED_PATHS_SHA256']},
            'target_branch':os.environ['TARGET_BRANCH'],
            'queue':{'total':316,'queued':306,'resolved':10,'in_flight':0},
            'boundary':{'repository_write':False,'main_mutated':False,'product_published':False,'force_update':False,'cycle_011_authorized':False,'eleventh_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (payload/'authorization.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"; done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-publisher-current-main-v1-payload-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-publisher-current-main-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1
            /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  publish:
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      PRODUCT_COMMIT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_BUNDLE_SHA256: 0ab9ead02773cd7b2413b8f8a504e28e69a4eb90d8e694885cbd4cd0e60a8864
      TARGET_BRANCH: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1
      PAYLOAD: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-payload
      OUT: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-publication

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1d50591ce826256e40fc574ebf9aef7993386760
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-publisher-current-main-v1-payload-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-payload

      - name: Reverify payload and publish one exact product ref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['PAYLOAD'])
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=root/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          auth=json.loads((root/'authorization.json').read_text()); identity=auth.pop('identity')
          assert hashlib.sha256(json.dumps(auth,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          auth['identity']=identity
          assert auth['status']=='cycle-010-merx-exact-product-approved-for-publication-v1'
          assert auth['qualify_run']==int(os.environ['GITHUB_RUN_ID']) and auth['qualify_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert auth['canonical_parent']==os.environ['MAIN'] and auth['target_branch']==os.environ['TARGET_BRANCH']
          assert auth['product']['commit']==os.environ['PRODUCT_COMMIT'] and auth['product']['tree']==os.environ['PRODUCT_TREE'] and auth['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert auth['product']['bundle_sha256']==os.environ['PRODUCT_BUNDLE_SHA256']
          assert not any(auth['boundary'].values())
          (Path(os.environ['OUT'])/'authorization.bound.json').write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n')
          PY
          test "$(sha256sum "$PAYLOAD/product.bundle" | awk '{print $1}')" = "$PRODUCT_BUNDLE_SHA256"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi
          git fetch "$PAYLOAD/product.bundle" refs/heads/cycle-010-current-main-product:refs/publish/cycle-010-product
          test "$(git rev-parse refs/publish/cycle-010-product)" = "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P "$PRODUCT_COMMIT")" = "$MAIN"
          test "$(git show -s --format=%T "$PRODUCT_COMMIT")" = "$PRODUCT_TREE"
          git diff --name-only "$MAIN" "$PRODUCT_COMMIT" | LC_ALL=C sort > /tmp/merx-publish-paths.txt
          cmp /tmp/merx-publish-paths.txt "$PAYLOAD/changed-paths.txt"
          test "$(wc -l < /tmp/merx-publish-paths.txt | tr -d ' ')" = "$PRODUCT_PATHS"
          git push origin "$PRODUCT_COMMIT:refs/heads/$TARGET_BRANCH"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')" = "$PRODUCT_COMMIT"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          auth=json.loads((Path(os.environ['OUT'])/'authorization.bound.json').read_text())
          receipt={
            'status':'cycle-010-merx-exact-product-published-v1',
            'version':1,
            'publication_run':int(os.environ['GITHUB_RUN_ID']),
            'publication_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'canonical_parent':os.environ['MAIN'],
            'authorization_identity':auth['identity'],
            'product':auth['product'],
            'product_ref':'refs/heads/'+os.environ['TARGET_BRANCH'],
            'product_ref_sha':os.environ['PRODUCT_COMMIT'],
            'product_published':True,
            'force_update':False,
            'main_mutated':False,
            'cycle_011_authorized':False,
            'eleventh_lease_issued':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (Path(os.environ['OUT'])/'publication.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-publisher-current-main-v1-publication-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-publication
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-publisher-current-main-v1-publication-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-publisher-current-main-v1-publication
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
