name: snapshot-cycle-v5-live

on:
  push:
    branches:
      - agent/snapshot-cycle-v5

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/star-trek-maryl-cycle-v5
      TARGET_WORKFLOW: star-trek-maryl-cycle-v5
      RESULT_BRANCH: agent/snapshot-cycle-v5-live-result
      ROOT: transport/snapshot-cycle-v5-live
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest run without waiting
        shell: bash
        run: |
          set -Eeuo pipefail
          run=''
          for _ in $(seq 1 60); do
            runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=50")"
            run="$(jq -c --arg name "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            test -n "$run" && break
            sleep 2
          done
          test -n "$run"
          run_id="$(jq -r .id <<<"$run")"
          jobs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          rm -rf /tmp/snapshot-cycle-v5-live
          mkdir -p /tmp/snapshot-cycle-v5-live
          printf '%s\n' "$run" | jq . > /tmp/snapshot-cycle-v5-live/run.json
          printf '%s\n' "$jobs" | jq . > /tmp/snapshot-cycle-v5-live/jobs.json
          jq -n --argjson run_id "$run_id" --arg status "$(jq -r .status <<<"$run")" --arg conclusion "$(jq -r '.conclusion // ""' <<<"$run")" --arg head_sha "$(jq -r .head_sha <<<"$run")" '{version:1,run_id:$run_id,status:$status,conclusion:$conclusion,head_sha:$head_sha}' > /tmp/snapshot-cycle-v5-live/status.json
          git config user.name undercast-cycle-live-snapshot
          git config user.email cycle-live-snapshot@users.noreply.github.com
          git switch --orphan live-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/snapshot-cycle-v5-live/. "$ROOT/"
          git add "$ROOT"
          git commit -m "Snapshot live Maryl cycle v5 run ${run_id}"
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
