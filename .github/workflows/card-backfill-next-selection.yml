name: card-backfill-next-selection

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/card-backfill-next-selection.mjs"
      - ".github/workflows/card-backfill-next-selection.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-next-selection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-040'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-040
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Select the next exact sitewide absence
        env:
          OUT: ${{ runner.temp }}/card-backfill-next-selection
        run: |
          set -euo pipefail
          node scripts/card-backfill-next-selection.mjs | tee "$RUNNER_TEMP/card-backfill-next-selection-run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact selection queue
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-next-selection-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-next-selection
            ${{ runner.temp }}/card-backfill-next-selection-run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
