name: complete-operational-reliability

on:
  push:
    branches:
      - agent/operational-reliability-no-golden-cage
    paths:
      - .github/workflows/complete-operational-reliability.yml

permissions:
  contents: write

concurrency:
  group: complete-operational-reliability
  cancel-in-progress: true

env:
  TARGET_BRANCH: agent/operational-reliability-no-golden-cage
  AUTHORIZED_MAIN: 2d4a760730d72c06002f810ff603aa57db3598be
  AUTHORIZED_POLICY_HEAD: 07b4d8f29f5a2c60241ed776a9a1283ba6b05412
  SELF: .github/workflows/complete-operational-reliability.yml
  FINALIZER: scripts/complete-operational-reliability.mjs
  RECEIPT: data/review/operational-reliability/operational-reliability-completion-2026-08-02.json

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies and rendered runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Bind exact branch, main, and temporary-authority denominator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          git merge-base --is-ancestor "$AUTHORIZED_POLICY_HEAD" HEAD

          git diff --name-only "$AUTHORIZED_POLICY_HEAD...HEAD" | sort > /tmp/temp-paths.txt
          printf '%s\n' "$SELF" "$FINALIZER" | sort > /tmp/expected-temp-paths.txt
          diff -u /tmp/expected-temp-paths.txt /tmp/temp-paths.txt

      - name: Reconfirm the smoke-passed policy boundary
        run: |
          set -euo pipefail
          node scripts/waterline.mjs status --scope star-trek --json > /tmp/operational-status.json
          node "$FINALIZER" preflight

      - name: Author and gate the reviewed completion candidate
        run: |
          set -euo pipefail
          node "$FINALIZER" author
          git add data/ROADMAP-STATE.json "$RECEIPT"
          git diff --cached --check

          node scripts/roadmap.mjs validate
          node scripts/roadmap.mjs status --json > /tmp/roadmap-status.json
          node scripts/roadmap.mjs next --limit 5 --json > /tmp/roadmap-next.json
          node - <<'NODE'
          const fs = require('fs');
          const status = JSON.parse(fs.readFileSync('/tmp/roadmap-status.json', 'utf8'));
          const operational = status.milestones.find((row) => row.id === 'operational-reliability');
          if (operational?.state !== 'complete') throw new Error(`operational milestone is ${operational?.state || 'missing'}`);
          const next = JSON.parse(fs.readFileSync('/tmp/roadmap-next.json', 'utf8')).map((row) => row.id);
          const expected = ['adapter-sdk-and-second-gold-shard', 'public-trust-and-corrections'];
          if (JSON.stringify(next) !== JSON.stringify(expected)) throw new Error(`unexpected successors: ${JSON.stringify(next)}`);
          NODE
          npm run gate 2>&1 | tee /tmp/oprel-candidate-gate.log

      - name: Remove temporary authority, promote receipt, and gate the final tree
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

          node "$FINALIZER" promote
          git add "$RECEIPT"
          git rm "$SELF" "$FINALIZER"
          git diff --cached --check

          node scripts/roadmap.mjs validate
          node scripts/roadmap.mjs status --json > /tmp/final-roadmap-status.json
          node scripts/roadmap.mjs next --limit 5 --json > /tmp/final-roadmap-next.json
          npm run gate 2>&1 | tee /tmp/oprel-final-gate.log

      - name: Publish the exact final custody under lease
        run: |
          set -euo pipefail
          rm -rf records test-results playwright-report .ci/projection-drift
          git restore --worktree -- .
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$AUTHORIZED_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$GITHUB_SHA"

          cat > /tmp/expected-final-paths.txt <<'PATHS'
          data/ROADMAP-STATE.json
          data/WATERLINE.json
          data/review/operational-reliability/no-golden-cage-readiness-2026-08-02.json
          data/review/operational-reliability/operational-reliability-completion-2026-08-02.json
          docs/OPERATIONAL-METRICS.md
          docs/ROADMAP-PLAYBOOKS.md
          package.json
          scripts/lib/metric-readiness.mjs
          scripts/metric-readiness-fixtures.mjs
          scripts/waterline.mjs
          PATHS
          sort -u /tmp/expected-final-paths.txt -o /tmp/expected-final-paths.txt
          git diff --cached --name-only refs/remotes/origin/main | sort > /tmp/final-paths.txt
          diff -u /tmp/expected-final-paths.txt /tmp/final-paths.txt

          git config user.name undercast-operational-reliability
          git config user.email undercast-operational-reliability@users.noreply.github.com
          git commit \
            -m 'Operations: complete operational reliability without golden cages' \
            -m 'reviewed restore and rollback drills retained' \
            -m 'build and source freshness measured' \
            -m 'cost and rights remain null until observed' \
            -m 'first observations automatically reopen measurement'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}"

      - name: Upload completion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-reliability-completion-${{ github.run_id }}
          path: |
            /tmp/operational-status.json
            /tmp/roadmap-status.json
            /tmp/roadmap-next.json
            /tmp/final-roadmap-status.json
            /tmp/final-roadmap-next.json
            /tmp/oprel-candidate-gate.log
            /tmp/oprel-final-gate.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
