name: doctor-who-cycle-011-rastel-candidate-source-inspection-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-source-inspection-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-source-inspection-v4
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-source-inspection-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4
      RUNNER_B64_SHA256: 68f41b9507610202efdf24e172ede533f7f0efbdc0df3ec0f500ed732c2b997e
      RUNNER_GZIP_SHA256: b2c34d677a7a27320e9adb7287181814dc2e73e741678c87d36907de790282fe
      RUNNER_SHA256: 11a94699015384fcacaa0b4d2b0721dcb465c90b3f49e5c26b87958b93556fab
      RUNNER_BYTES: "16400"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Reconstruct and compile exact source-inspection runner V4
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4-runner
          rm -rf "$root"
          mkdir -p "$root"
          : > "$root/runner.gz.b64"
          for blob in 55d8d3339fe2ff27997ebf21a74af25e0c000634; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$root/runner.gz.b64"
          done
          test "$(sha256sum "$root/runner.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$root/runner.gz.b64" > "$root/runner.sh.gz"
          test "$(sha256sum "$root/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$root/runner.sh.gz" > "$root/runner.sh"
          test "$(wc -c < "$root/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$root/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$root/runner.sh"
          python3 - <<'PY'
          import re,textwrap
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4-runner/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY(?:\n|$)",text,re.S)
          assert len(blocks)==4
          for i,block in enumerate(blocks): compile(textwrap.dedent(block),f'<embedded-{i}>','exec')
          PY

      - name: Execute exact read-only source inspection V4
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4-runner/runner.sh
          exec /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4-runner/runner.sh

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-source-inspection-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4
            /tmp/doctor-who-cycle-011-rastel-candidate-source-inspection-v4-runner
            /tmp/rastel-source-v4-reconstruction
            /tmp/merx-materializer-v4
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
