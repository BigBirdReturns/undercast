name: card-backfill-uc-066-face

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-066-FACE.json"
      - "scripts/card-backfill-uc-066-face.mjs"
      - ".github/workflows/card-backfill-uc-066-face.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-066-face-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-011'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-011
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact UC-066 face-orbit and prior checkpoint custody
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-066-FACE.json','utf8'));
          const specimens=JSON.parse(fs.readFileSync('data/specimens.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8'));
          const record=specimens.find(row=>row.id==='UC-066');
          const item=(audit.items||[]).find(row=>row.id==='ma_f4ec146914e9c8486a5b8b21');
          if(control.version!==1||control.record_id!=='UC-066'||control.actor!=='John Hurt'||control.side!=='still')throw new Error('UC-066 face control drift');
          if(control.criterion_artifact?.artifact_id!==8635966287||control.criterion_artifact?.head_sha!=='272aa5592fc166046d46b308510426aca4cf1627')throw new Error('UC-066 Criterion checkpoint custody drift');
          if(!record||record.actor!=='John Hurt'||record.character!=='John Merrick'||record.still)throw new Error('UC-066 canonical still boundary changed');
          if(!item||item.wall_id!=='UC-066'||item.side!=='still'||item.status!=='absent'||item.expected_subject!=='John Merrick'||item.asset)throw new Error('UC-066 audit boundary changed');
          if(control.sources?.length!==8)throw new Error('UC-066 face orbit source-set drift');
          console.log('PASS — UC-066 exact-face orbit is bound to the preserved Criterion rejection checkpoint');
          NODE
      - name: Gather exact face-visible candidates and build review sheet
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-066-face
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-066-face.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-066-face.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact-face candidates and online checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-066-face-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-066-face
            ${{ runner.temp }}/card-backfill-uc-066-face.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
