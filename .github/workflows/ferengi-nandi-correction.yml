name: ferengi-nandi-correction

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/FERENGI-NANDI-CORRECTION.json"
      - ".github/workflows/ferengi-nandi-correction.yml"
      - "scripts/ferengi-nandi-correction.mjs"

permissions:
  contents: write

concurrency:
  group: ferengi-nandi-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'agent/star-trek-ferengi-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-ferengi-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify the exact correction authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/FERENGI-NANDI-CORRECTION.json','utf8'));
          const expected={record_id:'UC-1317',task_id:'ap_bf7d8f79aca6834cb250ca88',source:'https://memory-alpha.fandom.com/wiki/Nandi',revision:3484697,content_sha256:'64d66289f3d6ed5ad78e94004557a0de6d5b7fbc7e4c1477892868c419c10744'};
          for(const [key,value] of Object.entries(expected))if(row[key]!==value)throw new Error(`correction authorization drift at ${key}`);
          console.log('PASS — exact withdrawn Nandi credit correction authorized');
          NODE
      - name: Apply the correction and public exclusion disposition
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-nandi-correction"
          mkdir -p "$root"
          node scripts/ferengi-nandi-correction.mjs apply | tee "$root/apply.log"
      - name: Rebuild every canonical and source-derived surface
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-nandi-correction"
          node scripts/census.mjs --project-only | tee "$root/census.log"
          node scripts/credits.mjs | tee "$root/credits-1.log"
          node scripts/shard.mjs | tee "$root/shard-1.log"
          node scripts/build-contract.mjs | tee "$root/contract-1.log"
          node scripts/autopilot.mjs sync | tee "$root/autopilot-sync.log"
          node scripts/media-audit.mjs sync | tee "$root/media-sync.log"
          node scripts/ferengi-nandi-correction.mjs accounting | tee "$root/accounting.log"
          node scripts/waterline.mjs record-accounting --input data/review/ferengi-gold/accounting-after-nandi-correction.json | tee "$root/accounting-receipt.log"
          node scripts/credits.mjs | tee "$root/credits-2.log"
          node scripts/shard.mjs | tee "$root/shard-2.log"
          node scripts/build-contract.mjs | tee "$root/contract-2.log"
          node scripts/ds9-census.mjs --project-only | tee "$root/ds9-census.log"
          node scripts/ds9-graph.mjs --project-only | tee "$root/ds9-graph.log"
          node scripts/ds9-eligibility-queue.mjs | tee "$root/ds9-eligibility.log"
          node scripts/ds9-maker-queue.mjs | tee "$root/ds9-maker.log"
          node scripts/build-record-pages.mjs | tee "$root/record-pages.log"
          node scripts/ferengi-nandi-correction.mjs validate | tee "$root/validate-correction.log"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/validate-gold-sequence.log"
      - name: Build the permanent candidate and remove the one-shot operator
        run: |
          set -euo pipefail
          git config user.name 'undercast-corrections'
          git config user.email 'undercast-corrections@users.noreply.github.com'
          rm -f .github/FERENGI-NANDI-CORRECTION.json .github/workflows/ferengi-nandi-correction.yml scripts/ferengi-nandi-correction.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Correction: retire withdrawn Nandi credit'
      - name: Install Chromium for the permanent-head gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete permanent-head gate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ferengi-nandi-correction"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated candidate
        run: git push origin HEAD:agent/star-trek-ferengi-gold
      - name: Retain the correction and gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferengi-nandi-correction-${{ github.run_id }}
          path: ${{ runner.temp }}/ferengi-nandi-correction
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
