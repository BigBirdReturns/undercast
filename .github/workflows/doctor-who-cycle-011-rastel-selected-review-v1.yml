name: doctor-who-cycle-011-rastel-selected-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-selected-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-selected-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-selected-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-selected-review-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-selected-review-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-selected-review-v1
      SRC: /tmp/doctor-who-cycle-011-rastel-selected-review-v1-source
      WORK: /tmp/doctor-who-cycle-011-rastel-selected-review-v1-worktree
      BOOT: /tmp/doctor-who-cycle-011-rastel-selected-review-v1-bootstrap
      RECOVERY: /tmp/doctor-who-cycle-011-rastel-selected-review-v1-recovery
      SELECTION: /tmp/doctor-who-cycle-011-rastel-selected-review-v1-selection

      RECOVERY_PR: "808"
      RECOVERY_HEAD: 5c0b4a34f7183fef7c3273166f5f8792ae9b051a
      RECOVERY_RUN: "31344692013"
      RECOVERY_JOB: "93324349690"
      RECOVERY_ARTIFACT: "9046921060"
      RECOVERY_ZIP_SHA256: ad340c6fb94d287ff4240054a8a85dd1c7db82b12d5e86e1acea8d01f71a759f
      RECOVERY_FILES: "11"
      RECOVERY_IDENTITY: 2516e2cca85135d571202199868a3d15e9abd5d26f11403fadd5dbb788fe557b
      SOURCE_REVIEWER_BYTES: "25399"
      SOURCE_REVIEWER_SHA256: b04ac3f4368d87a5146b134e2dea3446a1b782c91a0f3b64d46d68ff823d8fde
      DERIVED_REVIEWER_BYTES: "25912"
      DERIVED_REVIEWER_SHA256: 4652990ad9c6d65d8b9b6b37ecd26d8b190d4be2bb60226d7c04c0056126e736

      SELECTOR_PR: "804"
      SELECTOR_HEAD: c9bf777d8ac1b15e952f9ea8cec9db1725f99423
      SELECTOR_RUN: "31344212870"
      SELECTOR_JOB: "93323010935"
      SELECTOR_ARTIFACT: "9046762041"
      SELECTOR_ZIP_SHA256: 1c13b0247c7092284accfd8a2709851317b2987c1448766de6bd9e6185565e1f
      SELECTOR_FILES: "368"
      SELECTOR_LEDGER_ENTRIES: "366"
      SELECTION_IDENTITY: 7bad76c5276cbac69082d1438b44ee58820cbdb15fb922027cdded4d00b36e26
      COMPARISON_IDENTITY: 188cf18f0ae6a651e5541419ee5d7028686de0e3e574ffb6bcbbf1dde5067306

      SOURCE_PR: "766"
      SOURCE_HEAD: 27b902abdb8e5094e45af7938b58907203e2aa74
      SOURCE_RUN: "31333461683"
      SOURCE_JOB: "93295270939"
      SOURCE_ARTIFACT: "9043638791"
      SOURCE_ZIP_SHA256: b5aa012544058c97bdff335146c67d9ad3f5d2db100f10b0ae0ba048205b8a05
      SOURCE_FILES: "361"
      LEDGER_ENTRIES: "54"

      CANDIDATE_IDENTITY: 584f5606fbdc7495f8302108dedd669803c0c95cf139f9f59bd09a33c8a8398d
      CANDIDATE_COMMIT: f26f264dae78acb485ef05e5ab62bd1aad4201b0
      CANDIDATE_TREE: 77a0dbf40c5054e34d2a7924b0f50297913b0a98
      CANDIDATE_PATHS: "38"
      LEASE_ID: lease_ea3b5c191a6958024d4f1d9f
      RETAINED_LEASE_ID: lease_a6fc819786f4296a40bdc540
      PATHS_SHA256: ed6a06dee98e62a676235f7b1381a59d460a315526cd2ca8e06f990f9ecc9a9a
      PATH_POLICY_SHA256: f29da4fb85d521d518faff40fea84e5da9f430bdb1f401933f90b9b66ac57d29
      FILE_MANIFEST_SHA256: 3dcf0efed67343511a5ef1d9df16b057a5595dffcfa787579b44e2e460428287
      DELTA_MANIFEST_SHA256: 68756591458f0df50533c0b4ded7980cbdd7549eb3a76bc1b52a950134a9f369
      PATCH_SHA256: 04f9a5f6c5a0f7bbd467b10fbbcbb15cee421b557e9c4bfdcdb9bdc439abc83d
      BUNDLE_SHA256: ed37329e0245ae2b9e78382c361e26a28cdfefd0bbf42b6cd3c2e1a726e7ccb8
      TAR_SHA256: 517e500462a3d151ec91ced8a1e9207d929c58084ac287dc93cb36d845398fc3
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a
      V2_IDENTITY: 7f6a131ac6e04aec0696b82cbb6a4637d4e0024ecf0e452c66a18f7ac6c68dd9
      V6_IDENTITY: 3329fabe553b759fb2249c972496354bcd8badb489e9b319d093d914e375585a
      V7_IDENTITY: 34720dc333f3c23931a05ca13f60f605dbfdb956fb4da001f7757406cf204291
      SELECTED_REPAIR_IDENTITY: 34720dc333f3c23931a05ca13f60f605dbfdb956fb4da001f7757406cf204291
      CYCLE009_SHA256: ad86e82591ebbeb6fd24e72dba87aba9ac062104bd23904d073ee88d8aa1f021
      CYCLE010_SHA256: 52318d988bef4d03a46afa0dad6c0a6e487e96afc32cbe59e800a0c1c028280f

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate selector and source-recovery packets; derive exact reviewer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOT" "$RECOVERY" "$SELECTION"
          mkdir -p "$BOOT"/api "$RECOVERY" "$SELECTION"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$BOOT/api/carrier.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$RECOVERY_PR" > "$BOOT/api/recovery-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN" > "$BOOT/api/recovery-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN/jobs?per_page=100" > "$BOOT/api/recovery-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT" > "$BOOT/api/recovery-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT/zip" > "$BOOT/recovery.zip"
          test "$(sha256sum "$BOOT/recovery.zip" | awk '{print $1}')" = "$RECOVERY_ZIP_SHA256"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$SELECTOR_PR" > "$BOOT/api/selector-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN" > "$BOOT/api/selector-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SELECTOR_RUN/jobs?per_page=100" > "$BOOT/api/selector-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT" > "$BOOT/api/selector-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELECTOR_ARTIFACT/zip" > "$BOOT/selector.zip"
          test "$(sha256sum "$BOOT/selector.zip" | awk '{print $1}')" = "$SELECTOR_ZIP_SHA256"

          ROOT="$BOOT" RECOVERY_ROOT="$RECOVERY" SELECTION_ROOT="$SELECTION" HEAD="$head" PR="$pr" BASE="$base" python3 - <<'PY'
          from __future__ import annotations
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path,PurePosixPath

          root=Path(os.environ['ROOT']); recovery=Path(os.environ['RECOVERY_ROOT']); selection=Path(os.environ['SELECTION_ROOT']); api=root/'api'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          load=lambda name:json.loads((api/name).read_text())
          def extract(src:Path,dst:Path,expected:int):
              with zipfile.ZipFile(src) as archive:
                  infos=archive.infolist(); files=[row for row in infos if not row.is_dir()]
                  assert len(files)==expected and len(files)==len({row.filename for row in files})
                  for row in infos:
                      p=PurePosixPath(row.filename); assert not p.is_absolute() and '..' not in p.parts
                      if row.is_dir(): continue
                      out=dst/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(row))
          def verify_ledger(dst:Path,expected:int|None=None):
              ledger=dst/'SHA256SUMS.pre'; sealed=dst/'SHA256SUMS'
              assert ledger.is_file() and sealed.is_file() and sha(ledger.read_bytes())==sealed.read_text().split()[0]
              rows=[]
              for raw in ledger.read_text().splitlines():
                  if not raw.strip(): continue
                  digest,name=raw.split(None,1); path=dst/name.lstrip('*')
                  assert path.is_file() and sha(path.read_bytes())==digest; rows.append(name.lstrip('*'))
              if expected is not None: assert len(rows)==expected
              return rows
          def identity(path:Path):
              obj=json.loads(path.read_text()); ident=obj.pop('identity')
              assert sha(json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==ident
              obj['identity']=ident; return obj

          own=load('carrier.json'); rpr=load('recovery-pr.json'); rrun=load('recovery-run.json'); rjobs=load('recovery-jobs.json')['jobs']; ra=load('recovery-artifact.json')
          spr=load('selector-pr.json'); srun=load('selector-run.json'); sjobs=load('selector-jobs.json')['jobs']; sa=load('selector-artifact.json')
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['sha']==os.environ['HEAD'] and own['head']['ref']==os.environ['BRANCH']
          assert own['commits']==1 and own['changed_files']==1

          assert rpr['number']==int(os.environ['RECOVERY_PR']) and rpr['merged'] is False
          assert rpr['base']['sha']==os.environ['MAIN'] and rpr['head']['sha']==os.environ['RECOVERY_HEAD']
          assert rrun['id']==int(os.environ['RECOVERY_RUN']) and rrun['head_sha']==os.environ['RECOVERY_HEAD'] and rrun['status']=='completed' and rrun['conclusion']=='success'
          rjob=next(row for row in rjobs if row['id']==int(os.environ['RECOVERY_JOB']))
          assert rjob['name']=='inspect' and rjob['status']=='completed' and rjob['conclusion']=='success'
          rsteps={row['name']:(row['status'],row['conclusion']) for row in rjob['steps']}
          assert rsteps['Reconstruct and census exact independent reviewer without execution']==('completed','success')
          assert rsteps['Seal source packet']==('completed','success')
          assert ra['id']==int(os.environ['RECOVERY_ARTIFACT']) and ra['expired'] is False and ra['digest']=='sha256:'+os.environ['RECOVERY_ZIP_SHA256']
          extract(root/'recovery.zip',recovery,int(os.environ['RECOVERY_FILES'])); verify_ledger(recovery)
          recovered=identity(recovery/'receipt/reviewer-source.json')
          assert recovered['identity']==os.environ['RECOVERY_IDENTITY'] and recovered['reviewer']=={'bytes':int(os.environ['SOURCE_REVIEWER_BYTES']),'embedded_python_programs':5,'executed':False,'sha256':os.environ['SOURCE_REVIEWER_SHA256']}
          assert (recovery/'receipt/SOURCE_RECOVERY_COMPLETE').read_text().strip()==recovered['identity']

          assert spr['number']==int(os.environ['SELECTOR_PR']) and spr['merged'] is False
          assert spr['base']['sha']==os.environ['MAIN'] and spr['head']['sha']==os.environ['SELECTOR_HEAD']
          assert spr['commits']==1 and spr['changed_files']==1
          assert srun['id']==int(os.environ['SELECTOR_RUN']) and srun['head_sha']==os.environ['SELECTOR_HEAD'] and srun['status']=='completed' and srun['conclusion']=='success'
          sjob=next(row for row in sjobs if row['id']==int(os.environ['SELECTOR_JOB']))
          assert sjob['name']=='select' and sjob['status']=='completed' and sjob['conclusion']=='success'
          ssteps={row['name']:(row['status'],row['conclusion']) for row in sjob['steps']}
          assert ssteps['Bind exact V4 digest failure and recover unchanged selector runner']==('completed','success')
          assert ssteps['Execute unchanged complete three-candidate selector']==('completed','success')
          assert sa['id']==int(os.environ['SELECTOR_ARTIFACT']) and sa['expired'] is False and sa['digest']=='sha256:'+os.environ['SELECTOR_ZIP_SHA256']
          extract(root/'selector.zip',selection,int(os.environ['SELECTOR_FILES'])); verify_ledger(selection,int(os.environ['SELECTOR_LEDGER_ENTRIES']))
          selected=identity(selection/'selection/selection.json'); comparison=identity(selection/'selection/comparison.json')
          assert selected['identity']==os.environ['SELECTION_IDENTITY'] and comparison['identity']==os.environ['COMPARISON_IDENTITY']
          assert (selection/'selection/SELECTION_COMPLETE').read_text().strip()==selected['identity']
          assert selected['status']=='cycle-011-rastel-candidate-uniquely-selected-v3' and selected['boundary']['selection_only'] is True and selected['boundary']['candidate_only'] is True
          assert selected['selection']=={
            'alternate_candidate_authority':False,
            'candidate_commit':os.environ['CANDIDATE_COMMIT'],
            'candidate_receipt_identity':os.environ['CANDIDATE_IDENTITY'],
            'candidate_tree':os.environ['CANDIDATE_TREE'],
            'lease_id':os.environ['LEASE_ID'],
            'reason':'direct terminal-success producer with exact retained-predecessor lease equality and a complete packet emitted by the same successful transaction',
            'rejected_candidates':2,
          }
          selected_source=selected['sources']['selected_v10_exact_input']
          assert selected_source['pr']==int(os.environ['SOURCE_PR']) and selected_source['head']==os.environ['SOURCE_HEAD'] and selected_source['run']==int(os.environ['SOURCE_RUN']) and selected_source['job']==int(os.environ['SOURCE_JOB']) and selected_source['artifact']==int(os.environ['SOURCE_ARTIFACT'])
          assert selected_source['artifact_sha256']==os.environ['SOURCE_ZIP_SHA256'] and selected_source['exact_predecessor_lease_bound']==os.environ['RETAINED_LEASE_ID'] and selected_source['repair_identity']==os.environ['SELECTED_REPAIR_IDENTITY']
          assert comparison['candidate_denominator']==3 and comparison['all_pairs_byte_identical_paths']==36 and comparison['all_pairs_differing_paths']==['data/AUTOPILOT.json','data/journal/autopilot.jsonl']

          source_path=recovery/'source/reviewer.sh'; text=source_path.read_text(); changes=[]
          def replace_once(old,new,label):
              nonlocal_text[0]=nonlocal_text[0].replace(old,new) if nonlocal_text[0].count(old)==1 else (_ for _ in ()).throw(AssertionError((label,nonlocal_text[0].count(old))))
              changes.append({'label':label,'old_sha256':sha(old.encode()),'new_sha256':sha(new.encode())})
          nonlocal_text=[text]
          replace_once("assert spr['number']==int(os.environ['SOURCE_PR']) and spr['state']=='open' and spr['draft'] is True and spr['merged'] is False","assert spr['number']==int(os.environ['SOURCE_PR']) and spr['state']=='closed' and spr['draft'] is True and spr['merged'] is False",'source-pr-state')
          replace_once("assert spr['base']['sha']==os.environ['MAIN'] and spr['head']['sha']==os.environ['SOURCE_HEAD'] and spr['head']['ref']=='agent/doctor-who-cycle-011-rastel-candidate-v8-current-main'","assert spr['base']['sha']==os.environ['MAIN'] and spr['head']['sha']==os.environ['SOURCE_HEAD'] and spr['head']['ref']=='agent/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main'",'source-branch')
          replace_once("assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-v8-current-main'","assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']=='doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main'",'source-run-name')
          replace_once("assert steps['Authenticate exact V7 launcher failure']==('completed','success')\nassert steps['Reconstruct corrected V8 launcher and execute exact candidate']==('completed','success')","assert steps['Authenticate one-blob V10 controller transport and execute']==('completed','success')",'source-steps')
          replace_once("prefix='/tmp/doctor-who-cycle-011-rastel-candidate-v8/'","prefix='/tmp/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport/'",'source-ledger-prefix')
          replace_once("v8=identity('transport/v8-launcher-repair.json')","selected_repair=v7",'selected-repair-alias')
          replace_once("assert v8['identity']==os.environ['V8_IDENTITY'] and v8['repair']['contract']=={'prefix':'lease_','hex_characters':24,'total_characters':30}\nassert v8['failed_v7']['candidate_executed'] is False and v8['failed_v7']['materializer_reconstructed'] is False","assert selected_repair['identity']==os.environ['SELECTED_REPAIR_IDENTITY']\nassert selected_repair['bootstrap_v10']['repair']['exact_lease_id']==os.environ['RETAINED_LEASE_ID']\nassert selected_repair['bootstrap_v10']['failed_v9']['candidate_executed'] is False\nassert selected_repair['carrier']=={'base':os.environ['MAIN'],'head':os.environ['SOURCE_HEAD'],'pr':int(os.environ['SOURCE_PR'])}",'selected-repair-contract')
          replace_once("'receipt/candidate-v7-repair.json','transport/v8-launcher-repair.json'","'receipt/candidate-v7-repair.json'",'payload-list')
          replace_once("'lease_id':candidate['task']['lease_id'],'v8_repair_identity':v8['identity']","'lease_id':candidate['task']['lease_id'],'selected_repair_identity':selected_repair['identity'],'selection_identity':os.environ['SELECTION_IDENTITY']",'source-verification')
          replace_once("'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ZIP_SHA256'],'candidate_identity':os.environ['CANDIDATE_IDENTITY'],'v8_repair_identity':os.environ['V8_IDENTITY']},","'source':{'pr':int(os.environ['SOURCE_PR']),'head':os.environ['SOURCE_HEAD'],'run':int(os.environ['SOURCE_RUN']),'job':int(os.environ['SOURCE_JOB']),'artifact':int(os.environ['SOURCE_ARTIFACT']),'artifact_sha256':os.environ['SOURCE_ZIP_SHA256'],'candidate_identity':os.environ['CANDIDATE_IDENTITY'],'selected_repair_identity':os.environ['SELECTED_REPAIR_IDENTITY']},\n 'selection':{'pr':int(os.environ['SELECTOR_PR']),'head':os.environ['SELECTOR_HEAD'],'run':int(os.environ['SELECTOR_RUN']),'job':int(os.environ['SELECTOR_JOB']),'artifact':int(os.environ['SELECTOR_ARTIFACT']),'artifact_sha256':os.environ['SELECTOR_ZIP_SHA256'],'identity':os.environ['SELECTION_IDENTITY'],'comparison_identity':os.environ['COMPARISON_IDENTITY']},",'approval-selection')
          derived=nonlocal_text[0].encode(); assert len(derived)==int(os.environ['DERIVED_REVIEWER_BYTES']) and sha(derived)==os.environ['DERIVED_REVIEWER_SHA256']
          reviewer=root/'reviewer.sh'; reviewer.write_bytes(derived); subprocess.run(['bash','-n',str(reviewer)],check=True)
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",derived.decode(),re.S); assert len(blocks)==5
          for index,block in enumerate(blocks,1): compile(block,f'<selected-rastel-reviewer-{index}>','exec')
          receipt={
            'version':1,'status':'cycle-011-rastel-selected-reviewer-derived-v1',
            'carrier':{'pr':int(os.environ['PR']),'head':os.environ['HEAD'],'base':os.environ['BASE']},
            'source_recovery':{'pr':int(os.environ['RECOVERY_PR']),'head':os.environ['RECOVERY_HEAD'],'run':int(os.environ['RECOVERY_RUN']),'job':int(os.environ['RECOVERY_JOB']),'artifact':int(os.environ['RECOVERY_ARTIFACT']),'artifact_sha256':os.environ['RECOVERY_ZIP_SHA256'],'identity':recovered['identity'],'reviewer_sha256':os.environ['SOURCE_REVIEWER_SHA256']},
            'selection':{'pr':int(os.environ['SELECTOR_PR']),'head':os.environ['SELECTOR_HEAD'],'run':int(os.environ['SELECTOR_RUN']),'job':int(os.environ['SELECTOR_JOB']),'artifact':int(os.environ['SELECTOR_ARTIFACT']),'artifact_sha256':os.environ['SELECTOR_ZIP_SHA256'],'identity':selected['identity'],'comparison_identity':comparison['identity']},
            'derived_reviewer':{'bytes':len(derived),'sha256':sha(derived),'embedded_python_programs':len(blocks),'exact_replacements':changes},
            'boundary':{'review_executed':False,'candidate_approved':False,'repository_write':False,'product_published':False,'canonical_mutation':False,'cycle_receipt_written':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'reviewer-derivation.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          selector_proof={'status':'selected-candidate-authority-independently-reverified','selection_identity':selected['identity'],'comparison_identity':comparison['identity'],'candidate_commit':os.environ['CANDIDATE_COMMIT'],'candidate_tree':os.environ['CANDIDATE_TREE'],'candidate_identity':os.environ['CANDIDATE_IDENTITY'],'lease_id':os.environ['LEASE_ID'],'source_artifact':int(os.environ['SOURCE_ARTIFACT']),'source_artifact_sha256':os.environ['SOURCE_ZIP_SHA256']}
          selector_proof['identity']=sha(json.dumps(selector_proof,sort_keys=True,separators=(',',':')).encode())
          (root/'selection-verification.json').write_text(json.dumps(selector_proof,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CURRENT_HEAD=%s\nCURRENT_PR=%s\nCURRENT_BASE=%s\n' "$head" "$pr" "$base" >> "$GITHUB_ENV"

      - name: Execute exact selected-candidate reconstruction and complete gate
        shell: bash
        run: |
          set -euo pipefail
          chmod 700 "$BOOT/reviewer.sh"
          CURRENT_HEAD="$CURRENT_HEAD" CURRENT_PR="$CURRENT_PR" CURRENT_BASE="$CURRENT_BASE" "$BOOT/reviewer.sh"
          cp "$BOOT/reviewer-derivation.json" "$OUT/review/reviewer-derivation.json"
          cp "$BOOT/selection-verification.json" "$OUT/review/selection-verification.json"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
