name: estate-adopt-normalized-review-010

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/estate-run-collect010.sh

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-normalized-review-010
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNNER: scripts/estate-run-collect010.sh

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Execute normalized-review product payment
        run: bash "$RUNNER"

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-010-normalized-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-010-preflight.json
            /tmp/COLLECT-010-quality-before.json
            /tmp/COLLECT-010-apply.json
            /tmp/COLLECT-010-validation.json
            /tmp/COLLECT-010-expected-images.txt
            /tmp/COLLECT-010-tracked-paths.zlist
            /tmp/COLLECT-010-untracked-paths.zlist
            /tmp/COLLECT-010-candidate.patch
            /tmp/COLLECT-010-candidate.tree
            /tmp/COLLECT-010-promotion.json
            /tmp/COLLECT-010-ledger-validation.json
            /tmp/COLLECT-010-adoption.patch
            /tmp/COLLECT-010-adoption.tree
            /tmp/COLLECT-010-reconciliation.json
            /tmp/COLLECT-010-final-ledger-validation.json
            /tmp/COLLECT-010-publication.patch
            /tmp/COLLECT-010-publication.tree
            data/review/estate-debt/COLLECT-009-PACKET-REVIEW-INCOMPATIBLE-AUDIT.json
            data/review/estate-debt/COLLECT-010-NORMALIZED-REVIEW-VOCABULARY-RULING.json
            data/review/estate-debt/COLLECT-010-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-010-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
