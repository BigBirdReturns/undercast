name: queen-cycle-status-snapshot-v1

on:
  push:
    branches:
      - agent/queen-cycle-status-snapshot-v1

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/star-trek-queen-of-hearts-cycle-v1
      TARGET_WORKFLOW: star-trek-queen-of-hearts-cycle-v1
      RESULT_BRANCH: agent/queen-cycle-status-snapshot-result-v1
      ROOT: transport/queen-cycle-status-snapshot-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest Queen cycle state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/queen-cycle-status-snapshot-v1
          mkdir -p /tmp/queen-cycle-status-snapshot-v1
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&per_page=30")"
          run="$(jq -c --arg name "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.name==$name)] | sort_by(.created_at) | last // empty' <<<"$runs")"
          if test -n "$run"; then
            run_id="$(jq -r .id <<<"$run")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" | jq . > /tmp/queen-cycle-status-snapshot-v1/run.json
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq . > /tmp/queen-cycle-status-snapshot-v1/jobs.json
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq . > /tmp/queen-cycle-status-snapshot-v1/artifacts.json
            jq -n \
              --argjson run_id "$run_id" \
              --arg status "$(jq -r .status /tmp/queen-cycle-status-snapshot-v1/run.json)" \
              --arg conclusion "$(jq -r '.conclusion // ""' /tmp/queen-cycle-status-snapshot-v1/run.json)" \
              --arg head_sha "$(jq -r .head_sha /tmp/queen-cycle-status-snapshot-v1/run.json)" \
              --arg branch "$TARGET_BRANCH" \
              '{version:1,transaction:"QUEEN-CYCLE-STATUS-SNAPSHOT-V1",found:true,run_id:$run_id,status:$status,conclusion:$conclusion,head_sha:$head_sha,target_branch:$branch}' \
              > /tmp/queen-cycle-status-snapshot-v1/status.json
          else
            printf '%s\n' '{"total_count":0,"workflow_runs":[]}' > /tmp/queen-cycle-status-snapshot-v1/run.json
            printf '%s\n' '{"total_count":0,"jobs":[]}' > /tmp/queen-cycle-status-snapshot-v1/jobs.json
            printf '%s\n' '{"total_count":0,"artifacts":[]}' > /tmp/queen-cycle-status-snapshot-v1/artifacts.json
            jq -n --arg branch "$TARGET_BRANCH" '{version:1,transaction:"QUEEN-CYCLE-STATUS-SNAPSHOT-V1",found:false,target_branch:$branch}' > /tmp/queen-cycle-status-snapshot-v1/status.json
          fi
          git config user.name undercast-queen-status
          git config user.email queen-status@users.noreply.github.com
          git switch --orphan status-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/queen-cycle-status-snapshot-v1/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'Capture Queen of Hearts cycle status'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
