name: star-trek-rolling-config-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-config-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Raise the sealed voice-only continuation ceiling once
        run: |
          set -euo pipefail
          state=transport/star-trek-rolling-continuation-v1/state.json
          test -f "$state"
          iteration="$(jq -r .iteration "$state")"
          max="$(jq -r .max_iterations "$state")"
          if test "$iteration" = 0 && test "$max" -lt 100; then
            tmp="$(mktemp)"
            jq '.max_iterations=100 | .configuration={voice_only_iteration_ceiling:100,configured_by:"star-trek-rolling-config-v1",canonical_mutation:false,lease_taken:false}' "$state" > "$tmp"
            mv "$tmp" "$state"
            git config user.name undercast-star-trek-rolling-config
            git config user.email rolling-config@users.noreply.github.com
            git add "$state"
            git commit -m 'Star Trek rolling continuation: raise sealed voice-only ceiling'
            git push origin HEAD:agent/star-trek-rolling-continuation-v1
          fi
