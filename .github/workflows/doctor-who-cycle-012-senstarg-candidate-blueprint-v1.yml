name: doctor-who-cycle-012-senstarg-candidate-blueprint-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-candidate-blueprint-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-senstarg-candidate-blueprint-v1
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-candidate-blueprint-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROLLER_BLOBS: "d21bda0c058221552cd2b58afab7d984a8e398bb 71715bc82bc170696916fdd329802cac7c3f2f4d dd9c077418734dcf41ebae57ed14258afe74b476"
      CONTROLLER_B64_BYTES: "13192"
      CONTROLLER_B64_SHA256: 26ebfe743551bdbf3eb8dc16ba8e7399acb2ae74f1c710a515bff62976cc7e6b
      CONTROLLER_GZIP_BYTES: "9892"
      CONTROLLER_GZIP_SHA256: 2dfcd714641452c3686f89f6da5e442e0a29114ce2c14a54862b6739e73c6977
      CONTROLLER_BYTES: "33897"
      CONTROLLER_SHA256: e05236e80fa1f4cfa63ffa66804169d3b858d6e17f005ee22311d3123e8ac43d
      ROOT: /tmp/doctor-who-cycle-012-senstarg-candidate-blueprint-v1-controller
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Reconstruct and execute exact Senstarg candidate blueprint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          : > "$ROOT/controller.sh.gz.b64"
          for blob in $CONTROLLER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$ROOT/controller.sh.gz.b64"
          done

          test "$(wc -c < "$ROOT/controller.sh.gz.b64" | tr -d ' ')" = "$CONTROLLER_B64_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz.b64" | awk '{print $1}')" = "$CONTROLLER_B64_SHA256"
          base64 -d "$ROOT/controller.sh.gz.b64" > "$ROOT/controller.sh.gz"
          test "$(wc -c < "$ROOT/controller.sh.gz" | tr -d ' ')" = "$CONTROLLER_GZIP_BYTES"
          test "$(sha256sum "$ROOT/controller.sh.gz" | awk '{print $1}')" = "$CONTROLLER_GZIP_SHA256"
          gzip -dc "$ROOT/controller.sh.gz" > "$ROOT/controller.sh"
          test "$(wc -c < "$ROOT/controller.sh" | tr -d ' ')" = "$CONTROLLER_BYTES"
          test "$(sha256sum "$ROOT/controller.sh" | awk '{print $1}')" = "$CONTROLLER_SHA256"
          bash -n "$ROOT/controller.sh"

          CONTROLLER="$ROOT/controller.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CONTROLLER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==4
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-senstarg-candidate-blueprint-v1-{index}>','exec')
          PY

          chmod 700 "$ROOT/controller.sh"
          "$ROOT/controller.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-blueprint-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-candidate-blueprint-v1/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-candidate-blueprint-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-candidate-blueprint-v1
            /tmp/doctor-who-cycle-012-senstarg-candidate-blueprint-v1-controller
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
