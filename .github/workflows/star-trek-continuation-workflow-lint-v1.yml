name: star-trek-continuation-workflow-lint-v1

on:
  push:
    branches:
      - agent/star-trek-continuation-workflow-lint-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-continuation-workflow-lint-v1
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_BRANCH: agent/star-trek-continuation-workflow-lint-result-v1
      ROOT: /tmp/star-trek-continuation-workflow-lint-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parse every continuation workflow and compile every controller
        run: |
          set -euo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT/files"
          npm install --no-save --ignore-scripts yaml@2.9.0 >/dev/null
          branches=(
            agent/star-trek-lwaxana-rejection-v4
            agent/star-trek-lwaxana-rejection-v4-monitor
            agent/star-trek-lwaxana-rejection-recovery-v1
            agent/star-trek-lwaxana-rejection-recovery-v2
            agent/star-trek-lwaxana-rejection-terminal-v1
            agent/star-trek-lwaxana-rejection-terminal-v2
            agent/star-trek-kzinti-flyer-probe-v1
            agent/star-trek-post-lwaxana-rejection-continuation-v1
            agent/star-trek-kzinti-flyer-controller-v1
            agent/star-trek-kzinti-flyer-candidate-v1
            agent/star-trek-kzinti-flyer-publisher-v1
            agent/star-trek-kzinti-flyer-terminal-v1
            agent/star-trek-kzinti-flyer-pipeline-monitor-v1
            agent/star-trek-post-kzinti-doohan-probe-v1
            agent/star-trek-post-kzinti-continuation-v1
            agent/star-trek-continuation-terminal-v2
            agent/star-trek-continuation-terminal-v3
          )
          jq -n '[]' > "$ROOT/inventory.json"
          jq -n '[]' > "$ROOT/failures.json"
          for branch in "${branches[@]}"; do
            ref="$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha 2>/dev/null || true)"
            if test -z "$ref"; then
              jq --arg branch "$branch" '.+[{branch:$branch,type:"branch",error:"missing"}]' "$ROOT/failures.json" > "$ROOT/failures.tmp" && mv "$ROOT/failures.tmp" "$ROOT/failures.json"
              continue
            fi
            tree="$(gh api "/repos/${GITHUB_REPOSITORY}/git/trees/${ref}?recursive=1")"
            while IFS=$'\t' read -r path type; do
              test "$type" = blob || continue
              case "$path" in
                .github/workflows/star-trek-*.yml|.github/workflows/star-trek-*.yaml|.github/recovery/star-trek-*.py) ;;
                *) continue;;
              esac
              safe="$(printf '%s--%s' "$branch" "$path" | tr '/:' '__')"
              encoded="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${branch}" --jq .content)"
              printf '%s' "$encoded" | tr -d '\n' | base64 -d > "$ROOT/files/${safe}"
              digest="$(sha256sum "$ROOT/files/${safe}" | cut -d' ' -f1)"
              bytes="$(wc -c < "$ROOT/files/${safe}" | tr -d ' ')"
              status=pass
              error=''
              if [[ "$path" == *.py ]]; then
                if ! output="$(python3 -m py_compile "$ROOT/files/${safe}" 2>&1)"; then status=failure; error="$output"; fi
              else
                if ! output="$(node - "$ROOT/files/${safe}" <<'NODE' 2>&1
                const fs=require('fs');
                const YAML=require('yaml');
                const path=process.argv[2];
                const text=fs.readFileSync(path,'utf8');
                const doc=YAML.parse(text);
                if(!doc || typeof doc!=='object') throw new Error('workflow is not a mapping');
                if(!doc.name) throw new Error('workflow name missing');
                if(!doc.on) throw new Error('workflow trigger missing');
                if(!doc.jobs || typeof doc.jobs!=='object' || !Object.keys(doc.jobs).length) throw new Error('workflow jobs missing');
                console.log(JSON.stringify({name:doc.name,jobs:Object.keys(doc.jobs)}));
NODE
                )"; then status=failure; error="$output"; fi
              fi
              jq --arg branch "$branch" --arg ref "$ref" --arg path "$path" --arg type "$type" --arg status "$status" --arg sha256 "$digest" --argjson bytes "$bytes" --arg error "$error" '.+[{branch:$branch,ref:$ref,path:$path,type:$type,status:$status,sha256:$sha256,bytes:$bytes,error:($error|select(length>0))}]' "$ROOT/inventory.json" > "$ROOT/inventory.tmp" && mv "$ROOT/inventory.tmp" "$ROOT/inventory.json"
              if test "$status" = failure; then
                jq --arg branch "$branch" --arg ref "$ref" --arg path "$path" --arg error "$error" '.+[{branch:$branch,ref:$ref,path:$path,error:$error}]' "$ROOT/failures.json" > "$ROOT/failures.tmp" && mv "$ROOT/failures.tmp" "$ROOT/failures.json"
              fi
            done < <(jq -r '.tree[]|[.path,.type]|@tsv' <<<"$tree")
          done
          total="$(jq 'length' "$ROOT/inventory.json")"
          failed="$(jq 'length' "$ROOT/failures.json")"
          status=pass
          test "$failed" = 0 || status=failure
          jq -n --argjson version 1 --arg transaction STAR-TREK-CONTINUATION-WORKFLOW-LINT-V1 --arg status "$status" --argjson workflow_run "$GITHUB_RUN_ID" --arg workflow_head "$GITHUB_SHA" --argjson total_files "$total" --argjson failed_files "$failed" --slurpfile failures "$ROOT/failures.json" '{version:$version,transaction:$transaction,status:$status,workflow_run:$workflow_run,workflow_head:$workflow_head,total_files:$total_files,failed_files:$failed_files,failures:$failures[0]}' > "$ROOT/result.json"
          (cd "$ROOT" && find . -maxdepth 1 -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256 && sha256sum -c manifest.sha256)

          git fetch --filter=blob:none --no-tags origin main
          git checkout --detach FETCH_HEAD
          git checkout -B "$RESULT_BRANCH"
          rm -rf transport/star-trek-continuation-workflow-lint-v1
          mkdir -p transport/star-trek-continuation-workflow-lint-v1
          cp "$ROOT/result.json" transport/star-trek-continuation-workflow-lint-v1/
          cp "$ROOT/inventory.json" transport/star-trek-continuation-workflow-lint-v1/
          cp "$ROOT/failures.json" transport/star-trek-continuation-workflow-lint-v1/
          git config user.name undercast-star-trek-continuation-lint
          git config user.email star-trek-continuation-lint@users.noreply.github.com
          git add transport/star-trek-continuation-workflow-lint-v1
          git commit -m "Star Trek: publish continuation workflow lint ${status}"
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
          test "$failed" = 0
      - name: Upload workflow lint package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-continuation-workflow-lint-v1-${{ github.run_id }}
          path: /tmp/star-trek-continuation-workflow-lint-v1/
          if-no-files-found: warn
          retention-days: 30
