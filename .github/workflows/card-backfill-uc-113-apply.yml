name: card-backfill-uc-113-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-113-APPLY.json"
      - "scripts/card-backfill-uc-113-apply.mjs"
      - ".github/workflows/card-backfill-uc-113-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-113-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-025'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-025
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Korg packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-113-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-113');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-113');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1d34489d543c01ca6616d57a');
          if(row.version!==1||row.record_id!=='UC-113'||row.actor!=='Taika Waititi'||row.character!=='Korg'||row.production!=='Thor: Ragnarok'||row.year!==2017||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-113 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8677352880||row.render_artifact?.head_sha!=='92806714ec235ca4d682bd5eec8a74906eda3b73')throw new Error('UC-113 render custody drift');
          if(row.expected?.selected_source_sha256!=='bf640376328e03e9e7930d83182dc1e3b82746f1533bec15feb9ee17419880eb'||row.expected?.exact_role_record_sha256!=='5c764019972d0a201aecbbf2819fd1d434b4cab15c3cb3fb0c9002b9c9d04a31')throw new Error('UC-113 source authorization drift');
          if(row.expected?.candidate_sha256!=='0b2cc3d16c3d215d216b8352a5493c0c294ff082c8ae76f0ba3e9091f72d62c2'||row.expected?.crop_preview_sha256!=='67dd2b3aa9c604b3b51c6555f6078bf15eeb474cca664962999503c1fe98ae58')throw new Error('UC-113 candidate or crop authorization drift');
          if(row.expected?.rejected_thumbnail_sha256!=='c53983eb193bae23bb37d440224fe2e6e38a5cefea23a820d58794c2b3acbc16'||row.expected?.packet_file_count!==14||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-113 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-dual-view-offset-crop'||row.ruling?.source_ruling!=='official-marvel-raw-video-frame-browser-controls-excluded'||row.ruling?.canonical_mutation!==false)throw new Error('UC-113 ruling drift');
          if(!specimen||specimen.character!=='Korg'||specimen.production!=='Thor: Ragnarok'||specimen.still)throw new Error('UC-113 specimen boundary drift');
          if(source?.still)throw new Error('UC-113 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-113'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-113 audit boundary drift');
          console.log(`PASS — UC-113 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8677352880/zip" > "$root/render.zip"
          echo "9d36d523652b204256fb40b8bbb16093f82eac99a0d99433e42f65fb7dd4585c  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-113"
          test -f "$base/manifest.json"
          echo "3b8341d63def63a9f6a6739cf799c6f8700d8439ef7a3fc92597192a24beadf5  $base/manifest.json" | sha256sum -c -
          echo "792702ba7f17c28b0625a16e09a5d406643d91f9453ca5c09c8a0650524a6654  $base/duplicate-scan.json" | sha256sum -c -
          echo "9ad7e31f48ef1d5851c34119111acae70add235ef4f81522a1115cee1ee04d6f  $base/review.json" | sha256sum -c -
          echo "bfe44c01b354d1a98484d81d269e1b38ec3e79f9991d0aebcc1190774bd4c42f  $base/review.md" | sha256sum -c -
          echo "884db3e02a6ef44e27cef5162a14747b90322c100a14924f3abb86a8c624b176  $base/SHA256SUMS" | sha256sum -c -
          echo "5c764019972d0a201aecbbf2819fd1d434b4cab15c3cb3fb0c9002b9c9d04a31  $base/exact-role-record.json" | sha256sum -c -
          echo "bf640376328e03e9e7930d83182dc1e3b82746f1533bec15feb9ee17419880eb  $base/korg-original.png" | sha256sum -c -
          echo "8facccba89fb4403e9c3fe798e1602cac9b7ea62a0932d950f0ada7a930e7eb9  $base/source-page-marvel-finding-korg.png" | sha256sum -c -
          echo "74e104696d9c58274171f745340afd38c3499e9d69aeb0861baefee30ec3b42d  $base/selected-video-frame-reference.png" | sha256sum -c -
          echo "8c862f436f29de7ed9b5e9fdaddb4028b228f67cfe9a543e403b8a46219818ce  $base/source-page-marvel-ragnarok-film.png" | sha256sum -c -
          echo "f4cd2a12ccf55f7151a54ba4f291bc019abc236fe066e33ea9cb163e21755877  $base/source-page-marvel-waititi-korg-performance.png" | sha256sum -c -
          echo "21de1bb4536699285c31c71e9c9a223f671a462cf2b01dee8420e66a56870bca  $base/source-page-marvel-finding-korg-design.png" | sha256sum -c -
          echo "0b2cc3d16c3d215d216b8352a5493c0c294ff082c8ae76f0ba3e9091f72d62c2  $base/uc-113-still-candidate.jpg" | sha256sum -c -
          echo "67dd2b3aa9c604b3b51c6555f6078bf15eeb474cca664962999503c1fe98ae58  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30330896254
          artifact_id=8677352880
          artifact_name=card-backfill-uc-113-render-30330896254
          artifact_zip_sha256=9d36d523652b204256fb40b8bbb16093f82eac99a0d99433e42f65fb7dd4585c
          artifact_head_sha=92806714ec235ca4d682bd5eec8a74906eda3b73
          source_manifest_sha256=3b8341d63def63a9f6a6739cf799c6f8700d8439ef7a3fc92597192a24beadf5
          source_sums_sha256=884db3e02a6ef44e27cef5162a14747b90322c100a14924f3abb86a8c624b176
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-113-apply/source/output/UC-113
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-apply"
          node --check scripts/card-backfill-uc-113-apply.mjs
          node scripts/card-backfill-uc-113-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-113-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-113');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-113');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_1d34489d543c01ca6616d57a');
          if(!specimen||specimen.still)throw new Error('UC-113 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-113 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-113'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-113 audit disposition was canonically mutated');
          console.log('PASS — UC-113 remains canonically absent; only reviewed evidence was added');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-113.json \
            .github/CARD-BACKFILL-UC-113-DISCOVER.json \
            .github/CARD-BACKFILL-UC-113-VIDEO-ORBIT.json \
            .github/CARD-BACKFILL-UC-113-FRAME.json \
            .github/CARD-BACKFILL-UC-113-RENDER.json \
            .github/CARD-BACKFILL-UC-113-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-113-scope.yml \
            .github/workflows/card-backfill-uc-113-discover.yml \
            .github/workflows/card-backfill-uc-113-video-orbit.yml \
            .github/workflows/card-backfill-uc-113-frame.yml \
            .github/workflows/card-backfill-uc-113-render.yml \
            .github/workflows/card-backfill-uc-113-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-113-scope.mjs \
            scripts/card-backfill-uc-113-discover.mjs \
            scripts/card-backfill-uc-113-video-orbit.mjs \
            scripts/card-backfill-uc-113-frame.mjs \
            scripts/card-backfill-uc-113-render.mjs \
            scripts/card-backfill-uc-113-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-113 Taika Waititi Korg still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-024
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-024 HEAD)
          test "${#changed[@]}" -eq 14
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-113/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-113-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-025
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-113-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-113-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-113-apply
            data/review/card-backfill/UC-113
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
