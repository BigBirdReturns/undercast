name: estate-release-finalize-001

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-release-finalize-001.yml
      - scripts/estate-release-finalize-001.sh

permissions:
  contents: read

# A stricter self-retiring finalizer is already running from main at
# fc6da3b408d9763ed34c84640c91fd747fcd4bf9. This synchronization exists only
# to cancel the duplicate in-progress run and leave this PR inert.
concurrency:
  group: estate-release-finalize-001
  cancel-in-progress: true

jobs:
  stand-down:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "authoritative finalizer is running from main"
