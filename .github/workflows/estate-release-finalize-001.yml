name: estate-release-finalize-001

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-release-finalize-001.yml
      - scripts/estate-release-finalize-001.sh

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: estate-release-finalize-001
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  FINALIZER_PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  finalize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.ref == 'agent/estate-release-finalize-001' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Finalize Pages, live verification, and preservation custody
        run: |
          set -euo pipefail
          chmod +x scripts/estate-release-finalize-001.sh
          bash scripts/estate-release-finalize-001.sh

      - name: Preserve finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RELEASE-001-estate-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/RELEASE-001-adoption-ledger.json
            /tmp/RELEASE-001-live-base.json
            /tmp/RELEASE-001-live-receipt.json
            /tmp/RELEASE-001-SNAPSHOTS.json
            /tmp/RELEASE-001-preservation.json
            /tmp/RELEASE-001-live-preserved.json
            /tmp/RELEASE-001-final.json
            /tmp/RELEASE-001-final.txt
            /tmp/release-*-run.json
            /tmp/release-*-runs.json
          if-no-files-found: warn
          retention-days: 30
