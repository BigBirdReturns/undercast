name: card-backfill-uc-088-targeted

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-088-TARGETED.json"
      - "scripts/card-backfill-uc-088-targeted.mjs"
      - ".github/workflows/card-backfill-uc-088-targeted.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-088-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  targeted:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-021'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-021
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-088 photo-page identity authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-088-TARGETED.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-088');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-088');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0203aa7a6b845505e9c2c887');
          if(row.version!==1||row.record_id!=='UC-088'||row.actor!=='Michael Chiklis'||row.character!=='The Thing'||row.production!=='Fantastic Four'||row.year!==2005||row.side!=='still')throw new Error('UC-088 targeted authorization drift');
          if(row.selector_artifact?.artifact_id!==8671229850||row.scope_artifact?.artifact_id!==8671280407||row.failed_broad_discovery?.artifact_id!==8671483959)throw new Error('UC-088 targeted custody drift');
          if(row.failed_targeted_runs?.length!==4||row.failed_targeted_runs[0]?.artifact_id!==8671646537||row.failed_targeted_runs[1]?.artifact_id!==8671722048||row.failed_targeted_runs[2]?.artifact_id!==8671822136||row.failed_targeted_runs[3]?.artifact_id!==8671911207)throw new Error('UC-088 targeted failure custody drift');
          if(row.role_pages?.length!==3||row.photo_pages?.length!==14||row.page_contract?.required_terms?.length!==2||row.page_contract?.title_pattern!=='Fantastic Four'||row.page_contract?.minimum_valid_pages!==12||row.page_contract?.minimum_unique_candidates!==10||row.page_contract?.cast_and_role_custody_is_external_to_photo_page!==true)throw new Error('UC-088 targeted denominator drift');
          if(row.selection_contract?.visual_second_desk_required!==true||row.selection_contract?.exact_2005_live_action_thing_required!==true||row.selection_contract?.reject_2007_sequel_substitution!==true||row.selection_contract?.reject_2015_thing_substitution!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-088 targeted selection contract drift');
          if(!specimen||specimen.character!=='The Thing'||specimen.production!=='Fantastic Four'||specimen.years!=='2005'||specimen.still)throw new Error('UC-088 specimen boundary drift');
          if(source?.still)throw new Error('UC-088 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-088'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-088 audit boundary drift');
          console.log('PASS — exact UC-088 photo-page identity repair authorized');
          NODE
      - name: Repair page-local classifier in repository-scoped working copy
        run: |
          set -euo pipefail
          cp scripts/card-backfill-uc-088-targeted.mjs scripts/.card-backfill-uc-088-targeted-repair.mjs
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/.card-backfill-uc-088-targeted-repair.mjs')
          text=path.read_text()
          replacements={
              "assert(control.role_pages?.length === 3 && control.photo_pages?.length === 15, 'UC-088 targeted denominator drift');": "assert(control.role_pages?.length === 3 && control.photo_pages?.length === 14, 'UC-088 targeted denominator drift');",
              "assert(control.page_contract?.minimum_valid_pages === 10 && control.page_contract?.minimum_unique_candidates === 8 && control.selection_contract?.visual_second_desk_required === true && control.selection_contract?.canonical_mutation === false, 'UC-088 targeted contract drift');": "assert(control.page_contract?.minimum_valid_pages === 12 && control.page_contract?.minimum_unique_candidates === 10 && control.selection_contract?.visual_second_desk_required === true && control.selection_contract?.canonical_mutation === false, 'UC-088 targeted contract drift');",
              """    const pageHay = norm([evidence.title, evidence.description, evidence.body_text].join(' '));
              const wrongType = /(poster|dvd cover|soundtrack cover)/.test(pageHay);
              const valid = evidence.status === 'loaded' && evidence.http_status >= 200 && evidence.http_status < 400 && evidence.required_terms_missing.length === 0 && !wrongType && /movie still/.test(pageHay);""": """    const pageHay = norm([evidence.title, evidence.description, evidence.body_text].join(' '));
              const valid = evidence.status === 'loaded' && evidence.http_status >= 200 && evidence.http_status < 400 && evidence.required_terms_missing.length === 0 && /fantastic four/.test(pageHay) && /movie still/.test(pageHay);"""
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'UC-088 repair anchor missing: {old[:80]}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          node --check scripts/.card-backfill-uc-088-targeted-repair.mjs
      - name: Gather repaired page-addressed movie stills and role receipts
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-088-targeted
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-088-targeted-repair.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-088-targeted-run.log"
          rm scripts/.card-backfill-uc-088-targeted-repair.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact role pages, still pages, candidates, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-088-targeted-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-088-targeted
            ${{ runner.temp }}/card-backfill-uc-088-targeted-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
