name: doctor-who-cycle-009-megnus-jaka-candidate-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-review-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-candidate-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-candidate-review-707f-v1
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-candidate-review-v1.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1
      PACKET: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/source-packet
      WORKTREE: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/worktree
      TARROOT: /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/tar-product
      CANDIDATE_PR: "673"
      CANDIDATE_RUN: "31273651684"
      CANDIDATE_JOB: "93143639874"
      CANDIDATE_ARTIFACT: "9026406657"
      CANDIDATE_HEAD: f6292fb2e93fe5340d039cfca0bfdf25c815c520
      CANDIDATE_ZIP_SHA256: 546c566567f88158356767a9a1d8f05728988d0387df99ca3f33a53c3e35cb72
      CANDIDATE_COMMIT: 35f507417bb4b2efade613b3b643080363a0350f
      CANDIDATE_TREE: e59fc81b63c6e512a858d7b3353a58d4e5945796
      CANDIDATE_RECEIPT_ID: d2d6988d3ad79489296485431ea098d3410a328a403d9b58f91d0f5e94fc4a92
      CANDIDATE_PATHS_SHA256: 488a082aa186ab16e28b5c0b9bc7b28867e72126ab0ffa8fdaadc61f82ac5f50
      CANDIDATE_BUNDLE_SHA256: 78c9feb8b95bc01b70a0130ebbf80cd6808176d64bc9d28175b083c393646ae8
      CANDIDATE_PATCH_SHA256: 20fdd458de4f3427c64711fdbfef2d0d693b0b330144ee7cbba4dbd39f610777
      CANDIDATE_ARCHIVE_SHA256: a464de88653efeeff4dd9929e9a0c62e040ab5829fff7331c403ec33b240c6f8
      TASK_ID: ap_45bb5fdcdf4aff65aa7a87c3
      LEASE_ID: lease_4ca825307ad0d4510f44c7d9
      WALL_ID: UC-1354
      PORTRAIT_SHA256: 997a5b4ea0f849f78f7169b9de050c72ae7537339c77b1c61d52199fabe74d68
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate exact V12 candidate packet and carrier geometry
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,archive,review} "$PACKET"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$OUT/api/review-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$OUT/api/review-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE_PR" > "$OUT/api/candidate-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE_PR/files?per_page=100" > "$OUT/api/candidate-files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$OUT/api/candidate-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$CANDIDATE_JOB" > "$OUT/api/candidate-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$OUT/api/candidate-artifact.json"

          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          review_pr=json.loads((root/'api/review-pr.json').read_text())
          review_files=json.loads((root/'api/review-files.json').read_text())
          candidate_pr=json.loads((root/'api/candidate-pr.json').read_text())
          candidate_files=json.loads((root/'api/candidate-files.json').read_text())
          run=json.loads((root/'api/candidate-run.json').read_text())
          job=json.loads((root/'api/candidate-job.json').read_text())
          artifact=json.loads((root/'api/candidate-artifact.json').read_text())
          assert review_pr['number']==int(os.environ['PR_NUMBER'])
          assert review_pr['state']=='open' and review_pr['draft'] is True and review_pr['merged'] is False
          assert review_pr['base']['ref']=='main' and review_pr['base']['sha']==os.environ['EXACT_MAIN']
          assert review_pr['head']['ref']==os.environ['BRANCH'] and review_pr['head']['sha']==os.environ['PR_HEAD']
          assert review_pr['commits']==1 and review_pr['changed_files']==1
          assert len(review_files)==1 and review_files[0]['filename']==os.environ['SELF'] and review_files[0]['status']=='added'

          assert candidate_pr['number']==int(os.environ['CANDIDATE_PR'])
          assert candidate_pr['state']=='open' and candidate_pr['draft'] is True and candidate_pr['merged'] is False
          assert candidate_pr['base']['ref']=='main' and candidate_pr['base']['sha']==os.environ['EXACT_MAIN']
          assert candidate_pr['head']['sha']==os.environ['CANDIDATE_HEAD']
          assert candidate_pr['commits']==1 and candidate_pr['changed_files']==1
          assert len(candidate_files)==1
          assert candidate_files[0]['filename']=='.github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12.yml'
          assert candidate_files[0]['status']=='added'

          assert run['id']==int(os.environ['CANDIDATE_RUN'])
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==os.environ['CANDIDATE_HEAD']
          assert job['id']==int(os.environ['CANDIDATE_JOB']) and job['run_id']==int(os.environ['CANDIDATE_RUN'])
          assert job['status']=='completed' and job['conclusion']=='success'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Recover exact V11 failure and repair exact candidate path proof']==('completed','success')
          assert steps['Execute exact candidate transaction with exact 40-path proof']==('completed','success')
          assert steps['Upload exact selected-portrait candidate packet']==('completed','success')
          assert steps['Upload candidate diagnostics'][1]=='skipped'

          assert artifact['id']==int(os.environ['CANDIDATE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['CANDIDATE_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['CANDIDATE_HEAD']
          PY

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip" > "$OUT/archive/candidate.zip"
          test "$(sha256sum "$OUT/archive/candidate.zip" | awk '{print $1}')" = "$CANDIDATE_ZIP_SHA256"

          ZIP="$OUT/archive/candidate.zip" DEST="$PACKET" python3 - <<'PY'
          import os, zipfile
          from pathlib import Path, PurePosixPath
          zpath=Path(os.environ['ZIP']); dest=Path(os.environ['DEST'])
          with zipfile.ZipFile(zpath) as z:
              infos=z.infolist()
              names=[row.filename for row in infos]
              assert infos and len(names)==len(set(names))
              for row in infos:
                  p=PurePosixPath(row.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(dest)
          PY

          ROOT="$PACKET" python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT'])
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()

          final=(root/'SHA256SUMS').read_text().strip().split()
          assert len(final)==2 and final[0]==sha(root/'SHA256SUMS.pre')
          bad=[]
          marker='/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v12/'
          for line in (root/'SHA256SUMS.pre').read_text().splitlines():
              digest, raw=line.split(None,1)
              raw=raw.strip()
              assert marker in raw
              path=root/raw.split(marker,1)[1]
              if not path.is_file() or sha(path)!=digest:
                  bad.append(raw)
          assert not bad

          receipt=json.loads((root/'receipt/candidate-receipt.json').read_text())
          identity=receipt.pop('identity')
          assert identity==os.environ['CANDIDATE_RECEIPT_ID']
          assert identity==hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          receipt['identity']=identity
          assert receipt['version']==1 and receipt['transaction']=='DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-CANDIDATE-V1'
          assert receipt['status']=='candidate-complete'
          assert receipt['workflow_run']==int(os.environ['CANDIDATE_RUN']) and receipt['workflow_attempt']==1
          assert receipt['carrier_pr']==int(os.environ['CANDIDATE_PR']) and receipt['carrier_head']==os.environ['CANDIDATE_HEAD']
          assert receipt['base_main']==os.environ['EXACT_MAIN']
          c=receipt['candidate']
          assert c['commit']==os.environ['CANDIDATE_COMMIT'] and c['tree']==os.environ['CANDIDATE_TREE']
          assert c['paths']==40 and c['paths_sha256']==os.environ['CANDIDATE_PATHS_SHA256']
          assert c['bundle_sha256']==os.environ['CANDIDATE_BUNDLE_SHA256']
          assert c['patch_sha256']==os.environ['CANDIDATE_PATCH_SHA256']
          assert c['product_archive_sha256']==os.environ['CANDIDATE_ARCHIVE_SHA256']
          assert sha(root/'product/candidate.bundle')==c['bundle_sha256']
          assert sha(root/'product/candidate.patch')==c['patch_sha256']
          assert sha(root/'product/candidate-product.tar.gz')==c['product_archive_sha256']
          assert sha(root/'receipt/candidate-file-manifest.json')==c['file_manifest_sha256']
          assert sha(root/'receipt/delta-manifest.json')==c['delta_manifest_sha256']

          task=receipt['task']
          assert task=={
              'id':os.environ['TASK_ID'],
              'lease_id':os.environ['LEASE_ID'],
              'performer':'Dan Starkey',
              'role':'Megnus Jaka',
              'mode':'voice',
              'production':'The First Sontarans',
              'wall_id':os.environ['WALL_ID'],
              'source_url':'https://tardis.fandom.com/wiki/Megnus_Jaka',
              'source_pageid':175060,
              'source_revision':3677686,
              'source_content_sha256':'6c4efd51f4972e4d754b2cd762386c8888098eed78fce8902838ed561f74fec4',
              'source_fingerprint':'799004715f79b976ef967f63bfd4a085be22683047d87fcdf1dbc73968e50b35',
          }
          assert receipt['queue']['before']=={'total':316,'queued':308,'resolved':8,'in_flight':0}
          assert receipt['queue']['after']=={'total':316,'queued':307,'resolved':9,'in_flight':0}
          times=[receipt['chronology'][k] for k in ['claimed_at','submitted_at','accepted_at','merged_at','media_reviewed_at','candidate_committed_at']]
          assert times==[
              '2026-08-08T07:20:00.000Z','2026-08-08T07:21:00.000Z','2026-08-08T07:22:00.000Z',
              '2026-08-08T07:23:00.000Z','2026-08-08T07:24:00.000Z','2026-08-08T07:25:00.000Z']
          media=receipt['media']
          assert media['character_still']=='absent' and media['performer_portrait']=='verified'
          assert media['portrait_path']=='images/uc-1354-portrait.jpg'
          assert media['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert media['portrait_origin']=='https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg'
          assert media['portrait_license']=='CC BY-SA 2.0'
          assert media['cover_adopted'] is False and media['generic_sontaran_substitution'] is False
          assert media['duplicate_portrait_adoption'] is False
          assert receipt['boundary']=={
              'candidate_only':True,
              'repository_ref_created':False,
              'repository_write':False,
              'product_published':False,
              'product_merged':False,
              'cycle_receipt_written':False,
              'waterline_event_written':False,
              'additional_lease_authorized':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }

          paths=(root/'receipt/candidate-paths.txt').read_text().splitlines()
          allowed=(root/'receipt/allowed-paths.txt').read_text().splitlines()
          assert paths==allowed and len(paths)==40 and paths==sorted(paths)
          assert sha(root/'receipt/candidate-paths.txt')==os.environ['CANDIDATE_PATHS_SHA256']
          assert (root/'receipt/unexpected-paths.txt').stat().st_size==0
          assert (root/'receipt/missing-paths.txt').stat().st_size==0
          assert not any(p.startswith('.github/') or p.startswith('.tmp/') or p.startswith('workflows/') for p in paths)
          assert (root/'source/materialize-v12.sh').stat().st_size==40817
          assert sha(root/'source/materialize-v12.sh')=='a0149cde367222687ca44ed5a25017a40db04e44f127a4317d9220e5f0a84db3'

          manifest=json.loads((root/'receipt/candidate-file-manifest.json').read_text())['files']
          by_path={row['path']:row for row in manifest}
          assert sorted(by_path)==paths and len(by_path)==40
          with tarfile.open(root/'product/candidate-product.tar.gz','r:gz') as tar:
              members=tar.getmembers()
              names=[row.name for row in members]
              assert names==paths and len(names)==len(set(names))
              for member in members:
                  p=PurePosixPath(member.name)
                  assert not p.is_absolute() and '..' not in p.parts and member.isfile()
                  data=tar.extractfile(member).read()
                  row=by_path[member.name]
                  assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256']

          evidence=receipt['evidence']
          assert sha(root/'evidence/preflight.zip')==evidence['preflight_artifact_sha256']
          assert sha(root/'evidence/evidence.zip')==evidence['evidence_artifact_sha256']
          assert sha(root/'evidence/review.zip')==evidence['visual_review_artifact_sha256']
          PY

          cp "$PACKET/receipt/candidate-receipt.json" "$OUT/review/candidate-receipt.json"
          cp "$PACKET/receipt/candidate-paths.txt" "$OUT/review/candidate-paths.txt"
          cp "$PACKET/receipt/candidate-file-manifest.json" "$OUT/review/candidate-file-manifest.json"
          cp "$PACKET/receipt/delta-manifest.json" "$OUT/review/delta-manifest.json"
          printf 'REVIEW_PR=%s\nREVIEW_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Reconstruct exact candidate and execute independent gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          git worktree add --detach "$WORKTREE" "$EXACT_MAIN"
          git -C "$WORKTREE" bundle verify "$PACKET/product/candidate.bundle" | tee "$OUT/review/bundle-verify.log"
          git -C "$WORKTREE" fetch --no-tags "$PACKET/product/candidate.bundle" HEAD
          git -C "$WORKTREE" checkout --detach "$CANDIDATE_COMMIT"

          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git -C "$WORKTREE" show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git -C "$WORKTREE" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C "$WORKTREE" rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git -C "$WORKTREE" rev-list --merges "$EXACT_MAIN"..HEAD)"
          git -C "$WORKTREE" diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/review/reconstructed-paths.txt"
          cmp "$OUT/review/reconstructed-paths.txt" "$PACKET/receipt/candidate-paths.txt"
          test "$(sha256sum "$OUT/review/reconstructed-paths.txt" | awk '{print $1}')" = "$CANDIDATE_PATHS_SHA256"
          git -C "$WORKTREE" diff --name-status "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/review/reconstructed-name-status.txt"
          cmp "$OUT/review/reconstructed-name-status.txt" "$PACKET/receipt/candidate-name-status.txt"
          git -C "$WORKTREE" diff --binary "$EXACT_MAIN" HEAD > "$OUT/review/reconstructed.patch"
          test "$(sha256sum "$OUT/review/reconstructed.patch" | awk '{print $1}')" = "$CANDIDATE_PATCH_SHA256"
          test -z "$(grep -E '(^|/)(\.github/workflows|\.tmp|workflows?)(/|$)' "$OUT/review/reconstructed-paths.txt" || true)"
          test "$(git -C "$WORKTREE" show -s --format=%s HEAD)" = 'Doctor Who: materialize cycle 009 Megnus Jaka candidate'
          test "$(git -C "$WORKTREE" show -s --format=%an HEAD)" = 'Undercast Candidate Builder'
          test "$(git -C "$WORKTREE" show -s --format=%ae HEAD)" = 'candidate@undercast.invalid'

          rm -rf "$TARROOT"
          mkdir -p "$TARROOT"
          tar -xzf "$PACKET/product/candidate-product.tar.gz" -C "$TARROOT"
          ROOT="$PACKET" TREE="$WORKTREE" TARROOT="$TARROOT" python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['ROOT']); tree=Path(os.environ['TREE']); tarroot=Path(os.environ['TARROOT'])
          manifest=json.loads((root/'receipt/candidate-file-manifest.json').read_text())['files']
          for row in manifest:
              path=row['path']
              a=(tree/path).read_bytes(); b=(tarroot/path).read_bytes()
              assert a==b
              assert len(a)==row['bytes']
              assert hashlib.sha256(a).hexdigest()==row['sha256']
              ls=subprocess.check_output(['git','-C',str(tree),'ls-tree','HEAD','--',path],text=True).strip().split()
              assert ls[0]==row['mode'] and ls[1]==row['type'] and ls[2]==row['blob']
          PY

          cd "$WORKTREE"
          npm ci
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/review/cycle-008.log"
          node scripts/autopilot.mjs validate | tee "$OUT/review/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/review/status.json"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/review/media-gate.log"
          npm run gate 2>&1 | tee "$OUT/review/complete-gate.log"
          grep -F 'gate: PASS — 26 step(s)' "$OUT/review/complete-gate.log" >/dev/null

          ROOT="$OUT" TREE="$WORKTREE" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT']); tree=Path(os.environ['TREE'])
          status=json.loads((root/'review/status.json').read_text())
          assert status['total']==316 and status['claimable']==307 and status['in_flight']==0
          assert status['statuses']=={'queued':307,'resolved':9}
          assert status['scopes']['doctor-who']['statuses']=={'queued':307,'resolved':9}

          state=json.loads((tree/'data/AUTOPILOT.json').read_text())
          task=next(row for row in state['jobs'] if row['id']==os.environ['TASK_ID'])
          assert task['status']=='resolved' and task['role_on_wall'] is True and task['wall_ids']==[os.environ['WALL_ID']]
          assert task['performer']=='Dan Starkey' and task['character']=='Megnus Jaka'
          assert task['performance_modes']==['voice'] and task['attempts']==1
          outcome=task['outcome']
          assert outcome['kind']=='audited-wall' and outcome['resolved_at']=='2026-08-08T07:24:00.000Z'
          assert outcome['media_review']['lease_id']==os.environ['LEASE_ID']
          assert outcome['media_review']['reviewed_by']=='chatgpt-second-desk'
          assert len(outcome['media_review']['records'])==1
          record=outcome['media_review']['records'][0]
          assert record['wall_id']==os.environ['WALL_ID']
          assert record['still']['disposition']=='absent'
          assert record['portrait']['disposition']=='verified' and record['portrait']['subject']=='Dan Starkey'

          specimens=json.loads((tree/'data/specimens.json').read_text())
          card=next(row for row in specimens if row['id']==os.environ['WALL_ID'])
          assert card['actor']=='Dan Starkey' and card['character']=='Megnus Jaka'
          assert card['kind']=='voice' and card['transform']==2 and 'still' not in card
          assert card['portrait']['src']=='images/uc-1354-portrait.jpg'
          assert card['portrait']['origin']=='https://commons.wikimedia.org/wiki/File:Dan_Starkey_(27471533276).jpg'
          assert card['portrait']['license']=='CC BY-SA 2.0' and card['portrait']['pin'] is True
          portrait=(tree/card['portrait']['src']).read_bytes()
          assert hashlib.sha256(portrait).hexdigest()==os.environ['PORTRAIT_SHA256']

          sources=json.loads((tree/'data/SOURCES.json').read_text())
          source=next(row for row in sources if row['id']==os.environ['WALL_ID'])
          assert source['still'] is None and source['portrait']==card['portrait']

          audit=json.loads((tree/'data/MEDIA-AUDIT.json').read_text())
          facets=[row for row in audit['items'] if row['wall_id']==os.environ['WALL_ID']]
          assert len(facets)==2
          still=next(row for row in facets if row['side']=='still')
          portrait_facet=next(row for row in facets if row['side']=='portrait')
          assert still['status']=='absent' and still['asset'] is None
          assert portrait_facet['status']=='verified'
          assert portrait_facet['asset']['sha256']==os.environ['PORTRAIT_SHA256']
          assert portrait_facet['claims']['identity']['value']=='expected'
          assert portrait_facet['claims']['presentation']['value']=='neutral-human'

          journal=[json.loads(line) for line in (tree/'data/journal/autopilot.jsonl').read_text().splitlines() if line]
          events=[row for row in journal if row.get('task_id')==os.environ['TASK_ID']]
          ops=[row['op'] for row in events]
          for op in ['lease.claimed','task.drafted','task.merged','task.media-verified']:
              assert ops.count(op)==1
          claimed=next(row for row in events if row['op']=='lease.claimed')
          drafted=next(row for row in events if row['op']=='task.drafted')
          merged=next(row for row in events if row['op']=='task.merged')
          reviewed=next(row for row in events if row['op']=='task.media-verified')
          assert [claimed['at'],drafted['at'],merged['at'],reviewed['at']]==[
              '2026-08-08T07:20:00.000Z','2026-08-08T07:21:00.000Z',
              '2026-08-08T07:23:00.000Z','2026-08-08T07:24:00.000Z']
          assert merged['wall_ids']==[os.environ['WALL_ID']]
          assert reviewed['lease_id']==os.environ['LEASE_ID'] and reviewed['wall_ids']==[os.environ['WALL_ID']]
          assert reviewed['reviewed_by']=='chatgpt-second-desk'
          assert reviewed['review_sha256']==outcome['review_sha256']

          waterline=json.loads((tree/'data/WATERLINE-STATE.json').read_text())
          assert not any(row.get('lease_id')==os.environ['LEASE_ID'] for row in waterline.get('cycles',[]))
          assert not (tree/'data/review/adapter-sdk/doctor-who-cycle-009-megnus-jaka.json').exists()
          assert not (tree/'scripts/doctor-who-cycle-009.mjs').exists()

          semantic={
              'version':1,
              'candidate_commit':os.environ['CANDIDATE_COMMIT'],
              'candidate_tree':os.environ['CANDIDATE_TREE'],
              'task_id':os.environ['TASK_ID'],
              'lease_id':os.environ['LEASE_ID'],
              'wall_id':os.environ['WALL_ID'],
              'queue':{'total':316,'queued':307,'resolved':9,'in_flight':0},
              'media':{'still':'absent','portrait':'verified','portrait_sha256':os.environ['PORTRAIT_SHA256']},
              'cycle_receipt_present':False,
              'cycle_010_authorized':False,
          }
          (root/'review/semantic.json').write_text(json.dumps(semantic,indent=2,sort_keys=True)+'\n')
          PY

          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Seal independent candidate qualification
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={
              'version':1,
              'transaction':'DOCTOR-WHO-CYCLE-009-MEGNUS-JAKA-CANDIDATE-QUALIFICATION-V1',
              'status':'qualified',
              'workflow_run':int(os.environ['GITHUB_RUN_ID']),
              'workflow_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'carrier_pr':int(os.environ['REVIEW_PR']),
              'carrier_head':os.environ['REVIEW_HEAD'],
              'base_main':os.environ['EXACT_MAIN'],
              'source_candidate':{
                  'pr':int(os.environ['CANDIDATE_PR']),
                  'run':int(os.environ['CANDIDATE_RUN']),
                  'job':int(os.environ['CANDIDATE_JOB']),
                  'artifact':int(os.environ['CANDIDATE_ARTIFACT']),
                  'artifact_sha256':os.environ['CANDIDATE_ZIP_SHA256'],
                  'receipt_identity':os.environ['CANDIDATE_RECEIPT_ID'],
              },
              'candidate':{
                  'commit':os.environ['CANDIDATE_COMMIT'],
                  'tree':os.environ['CANDIDATE_TREE'],
                  'paths':40,
                  'paths_sha256':os.environ['CANDIDATE_PATHS_SHA256'],
                  'bundle_sha256':os.environ['CANDIDATE_BUNDLE_SHA256'],
                  'patch_sha256':os.environ['CANDIDATE_PATCH_SHA256'],
                  'product_archive_sha256':os.environ['CANDIDATE_ARCHIVE_SHA256'],
              },
              'task':{
                  'id':os.environ['TASK_ID'],
                  'lease_id':os.environ['LEASE_ID'],
                  'wall_id':os.environ['WALL_ID'],
                  'performer':'Dan Starkey',
                  'role':'Megnus Jaka',
                  'mode':'voice',
              },
              'queue':{'before':{'total':316,'queued':308,'resolved':8,'in_flight':0},
                       'after':{'total':316,'queued':307,'resolved':9,'in_flight':0}},
              'gates':{
                  'cycle_008_sha256':sha(root/'review/cycle-008.log'),
                  'autopilot_sha256':sha(root/'review/autopilot.log'),
                  'media_gate_sha256':sha(root/'review/media-gate.log'),
                  'complete_gate_sha256':sha(root/'review/complete-gate.log'),
                  'complete_gate_stages':26,
              },
              'boundary':{
                  'candidate_only':True,
                  'repository_write':False,
                  'product_published':False,
                  'product_merged':False,
                  'cycle_receipt_written':False,
                  'waterline_event_written':False,
                  'additional_lease_authorized':False,
                  'cycle_010_authorized':False,
                  'outside_human_dependency':False,
                  'owner_physical_action_required':False,
              },
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'review/qualification.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

          review="$OUT/review"
          find "$review" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$review/SHA256SUMS.pre"
          sha256sum "$review/SHA256SUMS.pre" > "$review/SHA256SUMS"
          ! grep -Fq "$review/SHA256SUMS.pre" "$review/SHA256SUMS.pre"
          test "$(sha256sum "$review/SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$review/SHA256SUMS")"

          find "$OUT/api" "$OUT/review" -type f ! -name ALL-SHA256SUMS.pre ! -name ALL-SHA256SUMS -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/ALL-SHA256SUMS.pre"
          sha256sum "$OUT/ALL-SHA256SUMS.pre" > "$OUT/ALL-SHA256SUMS"
          ! grep -Fq "$OUT/ALL-SHA256SUMS.pre" "$OUT/ALL-SHA256SUMS.pre"
          test "$(sha256sum "$OUT/ALL-SHA256SUMS.pre" | awk '{print $1}')" = "$(awk '{print $1}' "$OUT/ALL-SHA256SUMS")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Upload independent candidate qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/ALL-SHA256SUMS
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/ALL-SHA256SUMS.pre
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/api
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/review
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload independent review diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-candidate-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/api
            /tmp/doctor-who-cycle-009-megnus-jaka-candidate-review-v1/review
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
