name: star-trek-alice-qualification-v2

on:
  push:
    branches:
      - agent/star-trek-alice-qualification-v2

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-alice-qualification-v2
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 91254f17fa1ebb6e8502c6201e9bc8651ef4d4ac
  EXPECTED_TREE: e395cda3bc90838dea94a51550d886388ebd914a
  EXPECTED_TASK: ap_c7ff8298a99fe94fc55bbdbc
  EXPECTED_PERFORMER: Nichelle Nichols
  EXPECTED_CHARACTER: Alice (character)
  EXPECTED_FINGERPRINT: 9caf9645daf70d67203bd0056980531a7190659c5209e15b3899cf6bac016297
  RESULT_BRANCH: agent/star-trek-alice-qualification-result-v2
  RESULT_ROOT: /tmp/star-trek-alice-qualification-v2
  WORK_ROOT: /tmp/star-trek-alice-main-v2

jobs:
  qualify:
    name: requalify-exact-alice-successor-without-leasing
    if: ${{ github.event.head_commit.message == 'Requalify Star Trek Alice successor v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact main and build compact qualification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RESULT_ROOT" "$WORK_ROOT"
          mkdir -p "$RESULT_ROOT/logs"

          git fetch --no-tags origin main
          start_commit="$(git rev-parse refs/remotes/origin/main)"
          start_tree="$(git show -s --format=%T refs/remotes/origin/main)"
          start_parents="$(git show -s --format=%P refs/remotes/origin/main)"
          start_message="$(git show -s --format=%s refs/remotes/origin/main)"
          test "$start_commit" = "$EXPECTED_MAIN"
          test "$start_tree" = "$EXPECTED_TREE"
          test "$(wc -w <<<"$start_parents" | tr -d ' ')" = 1

          git worktree add --detach "$WORK_ROOT" "$EXPECTED_MAIN"
          test "$(git -C "$WORK_ROOT" rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C "$WORK_ROOT" show -s --format=%T HEAD)" = "$EXPECTED_TREE"

          printf '%s\n' "$start_commit" > "$RESULT_ROOT/main-start.sha"
          printf '%s\n' "$start_tree" > "$RESULT_ROOT/main-start.tree"
          printf '%s\n' "$start_parents" > "$RESULT_ROOT/main-start.parents"
          printf '%s\n' "$start_message" > "$RESULT_ROOT/main-start.message"

          before_autopilot="$(sha256sum "$WORK_ROOT/data/AUTOPILOT.json" | awk '{print $1}')"
          printf '%s\n' "$before_autopilot" > "$RESULT_ROOT/autopilot-before.sha256"

          capture() {
            local name="$1"
            shift
            set +e
            (cd "$WORK_ROOT" && "$@") >"$RESULT_ROOT/logs/${name}.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"$RESULT_ROOT/logs/${name}.exit-code"
          }

          capture npm-ci npm ci --ignore-scripts
          capture thesis-validate node scripts/thesis-rails.mjs validate
          capture thesis-next node scripts/thesis-rails.mjs next --json
          cp "$RESULT_ROOT/logs/thesis-next.log" "$RESULT_ROOT/rail.json"
          capture autopilot-validate node scripts/autopilot.mjs validate
          capture media-gate node scripts/media-audit.mjs gate --scope star-trek
          capture media-status node scripts/media-audit.mjs status --scope star-trek
          capture waterline-validate node scripts/waterline.mjs validate
          capture waterline-status node scripts/waterline.mjs status --scope star-trek

          git ls-remote --heads origin 'refs/heads/*alice*' > "$RESULT_ROOT/alice-heads.txt" || true

          ROOT="$WORK_ROOT" OUT="$RESULT_ROOT" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const repo = process.env.ROOT;
          const out = process.env.OUT;
          const expected = {
            main: process.env.EXPECTED_MAIN,
            tree: process.env.EXPECTED_TREE,
            task_id: process.env.EXPECTED_TASK,
            performer: process.env.EXPECTED_PERFORMER,
            character: process.env.EXPECTED_CHARACTER,
            source_fingerprint: process.env.EXPECTED_FINGERPRINT,
          };
          const read = (p) => fs.readFileSync(p, 'utf8');
          const readRepo = (p) => read(path.join(repo, p));
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const maybeJson = (p) => { try { return JSON.parse(read(p)); } catch { return null; } };
          const exitCode = (name) => Number(read(path.join(out, 'logs', `${name}.exit-code`)).trim());
          const errors = [];
          const notes = [];

          const rail = maybeJson(path.join(out, 'rail.json'));
          const railCandidate = rail?.candidate || null;
          if (exitCode('npm-ci') !== 0) errors.push('npm-ci-failed');
          if (exitCode('thesis-validate') !== 0) errors.push('thesis-validate-failed');
          if (exitCode('thesis-next') !== 0 || !rail) errors.push('thesis-next-failed');
          if (exitCode('autopilot-validate') !== 0) errors.push('autopilot-validate-failed');
          if (exitCode('media-gate') !== 0) errors.push('media-gate-failed');
          if (exitCode('waterline-validate') !== 0) errors.push('waterline-validate-failed');
          if (rail?.phase !== 'ready-for-one-cycle') errors.push(`rail-phase:${rail?.phase ?? 'missing'}`);
          if (rail?.scope_id !== 'star-trek') errors.push(`rail-scope:${rail?.scope_id ?? 'missing'}`);
          for (const key of ['task_id', 'performer', 'character', 'source_fingerprint']) {
            if (railCandidate?.[key] !== expected[key]) errors.push(`rail-${key}:${railCandidate?.[key] ?? 'missing'}`);
          }
          if (Number(railCandidate?.priority) !== 1330) errors.push(`rail-priority:${railCandidate?.priority ?? 'missing'}`);

          const autopilot = JSON.parse(readRepo('data/AUTOPILOT.json'));
          const matches = [];
          const visit = (value, trail = '$') => {
            if (!value || typeof value !== 'object') return;
            if (!Array.isArray(value)) {
              const values = Object.values(value);
              if (value.id === expected.task_id || value.task_id === expected.task_id || values.includes(expected.task_id)) {
                matches.push({ path: trail, value });
              }
            }
            if (Array.isArray(value)) value.forEach((v, i) => visit(v, `${trail}[${i}]`));
            else Object.entries(value).forEach(([k, v]) => visit(v, `${trail}.${k}`));
          };
          visit(autopilot);
          const score = ({ value: v }) =>
            (v.id === expected.task_id ? 20 : 0)
            + (v.task_id === expected.task_id ? 15 : 0)
            + (v.performer === expected.performer ? 5 : 0)
            + (v.character === expected.character ? 5 : 0)
            + (v.source_fingerprint === expected.source_fingerprint ? 5 : 0)
            + (v.status ? 1 : 0);
          matches.sort((a, b) => score(b) - score(a));
          const task = matches[0]?.value || null;
          if (!task) errors.push('task-record-missing');
          if (task?.id !== expected.task_id && task?.task_id !== expected.task_id) errors.push('task-id-mismatch');
          if (task?.performer !== expected.performer) errors.push(`task-performer:${task?.performer ?? 'missing'}`);
          if (task?.character !== expected.character) errors.push(`task-character:${task?.character ?? 'missing'}`);
          if (task?.source_fingerprint !== expected.source_fingerprint) errors.push(`task-fingerprint:${task?.source_fingerprint ?? 'missing'}`);
          if (task?.status !== 'queued') errors.push(`task-status:${task?.status ?? 'missing'}`);
          if (Number(task?.attempts ?? 0) !== 0) errors.push(`task-attempts:${task?.attempts ?? 'missing'}`);

          const taskSources = [...new Set([
            ...(Array.isArray(task?.sources) ? task.sources : []),
            ...(typeof task?.source === 'string' ? [task.source] : []),
          ])];
          const sourceReceipts = task?.source_receipts ?? task?.source_receipt ?? null;
          if (!taskSources.length) errors.push('task-source-list-missing');
          if (!sourceReceipts) errors.push('task-source-receipt-missing');

          const jsonFiles = [];
          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const absolute = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(absolute);
              else if (entry.isFile() && absolute.endsWith('.json')) jsonFiles.push(absolute);
            }
          };
          walk(path.join(repo, 'data'));

          const interesting = new Set([
            expected.performer,
            expected.character,
            expected.task_id,
          ]);
          const objectMatches = [];
          const imageStrings = new Set();
          const collectImages = (value) => {
            if (typeof value === 'string' && /^(?:\.\/)?images\//.test(value)) imageStrings.add(value.replace(/^\.\//, ''));
            else if (Array.isArray(value)) value.forEach(collectImages);
            else if (value && typeof value === 'object') Object.values(value).forEach(collectImages);
          };
          const summarize = (value) => {
            const keys = [
              'id','wall_id','record_id','task_id','lease_id','performer','character','title','name','status',
              'source','sources','source_fingerprint','source_receipt','source_receipts','performance_modes','categories',
              'portrait','still','image','images','media','origin','year','kind','src','role','franchise','production'
            ];
            const summary = {};
            for (const key of keys) if (Object.prototype.hasOwnProperty.call(value, key)) summary[key] = value[key];
            collectImages(value);
            return summary;
          };
          const collectObjects = (value, file, trail = '$') => {
            if (!value || typeof value !== 'object' || objectMatches.length >= 300) return;
            if (!Array.isArray(value)) {
              const values = Object.values(value);
              if ([...interesting].some((needle) => values.includes(needle))) {
                objectMatches.push({ file, path: trail, summary: summarize(value) });
              }
            }
            if (Array.isArray(value)) value.forEach((v, i) => collectObjects(v, file, `${trail}[${i}]`));
            else Object.entries(value).forEach(([k, v]) => collectObjects(v, file, `${trail}.${k}`));
          };

          for (const absolute of jsonFiles) {
            let text;
            try { text = read(absolute); } catch { continue; }
            if (![...interesting].some((needle) => text.includes(needle))) continue;
            try {
              collectObjects(JSON.parse(text), path.relative(repo, absolute));
            } catch {
              notes.push(`unparsed-json:${path.relative(repo, absolute)}`);
            }
          }
          if (task) collectImages(task);

          const assets = [...imageStrings].sort().map((relative) => {
            const absolute = path.join(repo, relative);
            if (!fs.existsSync(absolute) || !fs.statSync(absolute).isFile()) return { path: relative, exists: false };
            const bytes = fs.readFileSync(absolute);
            return { path: relative, exists: true, size: bytes.length, sha256: sha256(bytes) };
          });
          const duplicateAssetHashes = Object.values(assets.reduce((groups, asset) => {
            if (!asset.sha256) return groups;
            (groups[asset.sha256] ||= []).push(asset.path);
            return groups;
          }, {})).filter((paths) => paths.length > 1);

          const heads = read(path.join(out, 'alice-heads.txt')).split(/\r?\n/).filter(Boolean);
          const allowed = [
            'refs/heads/agent/star-trek-alice-qualification-v1',
            'refs/heads/agent/star-trek-alice-qualification-result-v1',
            'refs/heads/agent/star-trek-alice-qualification-v2',
            'refs/heads/agent/star-trek-alice-qualification-result-v2',
          ];
          const disallowedHeads = heads.filter((line) => !allowed.some((ref) => line.endsWith(`\t${ref}`)));
          if (disallowedHeads.length) errors.push(`existing-alice-product-heads:${disallowedHeads.length}`);

          const taskDoc = {
            version: 1,
            task_path: matches[0]?.path || null,
            task_match_count: matches.length,
            task,
          };
          const sourceBoundary = {
            version: 1,
            task_id: expected.task_id,
            performer: expected.performer,
            character: expected.character,
            queued_mode_hints: task?.performance_modes ?? railCandidate?.performance_modes ?? [],
            categories: task?.categories ?? [],
            sources: taskSources,
            source_receipts: sourceReceipts,
            source_fingerprint: task?.source_fingerprint ?? null,
            exact_performance_adjudication: 'unresolved-pending-source-review',
            physical_performance: 'unresolved',
            voice_performance: 'unresolved',
            animation_labor: 'unresolved',
            vocal_processing: 'unresolved',
            direction: 'unresolved',
            sound: 'unresolved',
            other_maker_functions: 'unresolved',
          };
          const mediaInventory = {
            version: 1,
            performer: expected.performer,
            character: expected.character,
            matching_object_count: objectMatches.length,
            matching_objects: objectMatches,
            image_assets: assets,
            image_asset_count: assets.length,
            duplicate_asset_hash_groups: duplicateAssetHashes,
            exact_character_still: 'unresolved-pending-source-review',
            neutral_performer_portrait: 'unresolved-pending-source-review',
            honest_absence_allowed: true,
          };

          fs.writeFileSync(path.join(out, 'task.json'), JSON.stringify(taskDoc, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'source-boundary.json'), JSON.stringify(sourceBoundary, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'media-inventory.json'), JSON.stringify(mediaInventory, null, 2) + '\n');

          const qualification = {
            version: 2,
            transaction: 'STAR-TREK-ALICE-QUALIFICATION-V2',
            generated_at: new Date().toISOString(),
            status: errors.length ? 'blocked-read-only' : 'qualified-read-only',
            lease_taken: false,
            canonical_mutation: false,
            expected,
            canonical_start: {
              commit: read(path.join(out, 'main-start.sha')).trim(),
              tree: read(path.join(out, 'main-start.tree')).trim(),
              parents: read(path.join(out, 'main-start.parents')).trim().split(/\s+/).filter(Boolean),
              message: read(path.join(out, 'main-start.message')).trim(),
            },
            gates: {
              npm_ci: exitCode('npm-ci'),
              thesis_validate: exitCode('thesis-validate'),
              thesis_next: exitCode('thesis-next'),
              autopilot_validate: exitCode('autopilot-validate'),
              media_gate: exitCode('media-gate'),
              waterline_validate: exitCode('waterline-validate'),
            },
            rail,
            task_summary: {
              path: matches[0]?.path || null,
              match_count: matches.length,
              status: task?.status ?? null,
              attempts: task?.attempts ?? null,
              priority: task?.priority ?? railCandidate?.priority ?? null,
            },
            source_summary: {
              source_count: taskSources.length,
              has_source_receipts: Boolean(sourceReceipts),
            },
            media_summary: {
              matching_object_count: objectMatches.length,
              image_asset_count: assets.length,
              duplicate_asset_hash_group_count: duplicateAssetHashes.length,
            },
            remote_alice_heads: heads,
            disallowed_remote_alice_heads: disallowedHeads,
            errors,
            notes,
          };
          fs.writeFileSync(path.join(out, 'qualification.json'), JSON.stringify(qualification, null, 2) + '\n');
          NODE

          after_autopilot="$(sha256sum "$WORK_ROOT/data/AUTOPILOT.json" | awk '{print $1}')"
          printf '%s\n' "$after_autopilot" > "$RESULT_ROOT/autopilot-after.sha256"
          test "$before_autopilot" = "$after_autopilot"

          git fetch --no-tags origin main
          end_commit="$(git rev-parse refs/remotes/origin/main)"
          end_tree="$(git show -s --format=%T refs/remotes/origin/main)"
          printf '%s\n' "$end_commit" > "$RESULT_ROOT/main-end.sha"
          printf '%s\n' "$end_tree" > "$RESULT_ROOT/main-end.tree"

          OUT="$RESULT_ROOT" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = process.env.OUT;
          const file = path.join(out, 'qualification.json');
          const q = JSON.parse(fs.readFileSync(file, 'utf8'));
          q.autopilot_sha256 = {
            before: fs.readFileSync(path.join(out, 'autopilot-before.sha256'), 'utf8').trim(),
            after: fs.readFileSync(path.join(out, 'autopilot-after.sha256'), 'utf8').trim(),
          };
          q.canonical_end = {
            commit: fs.readFileSync(path.join(out, 'main-end.sha'), 'utf8').trim(),
            tree: fs.readFileSync(path.join(out, 'main-end.tree'), 'utf8').trim(),
          };
          if (q.canonical_end.commit !== q.expected.main || q.canonical_end.tree !== q.expected.tree) {
            q.errors.push(`main-moved:${q.canonical_end.commit}:${q.canonical_end.tree}`);
            q.status = 'stale-main';
          }
          if (q.autopilot_sha256.before !== q.autopilot_sha256.after) {
            q.errors.push('autopilot-mutated');
            q.status = 'invalid-mutation';
          }
          fs.writeFileSync(file, JSON.stringify(q, null, 2) + '\n');
          const lines = [
            '# Star Trek Alice read-only qualification v2',
            '',
            `Status: \`${q.status}\``,
            '',
            `Canonical main: \`${q.canonical_end.commit}\``,
            `Canonical tree: \`${q.canonical_end.tree}\``,
            `Task: \`${q.expected.task_id}\``,
            `Performer: ${q.expected.performer}`,
            `Character: ${q.expected.character}`,
            `Fingerprint: \`${q.expected.source_fingerprint}\``,
            `Rail phase: \`${q.rail?.phase ?? 'missing'}\``,
            `Task status: \`${q.task_summary.status ?? 'missing'}\``,
            `Attempts: \`${q.task_summary.attempts ?? 'missing'}\``,
            `Source receipts present: \`${q.source_summary.has_source_receipts}\``,
            `Matching repository objects: \`${q.media_summary.matching_object_count}\``,
            `Existing image assets: \`${q.media_summary.image_asset_count}\``,
            `Lease taken: \`${q.lease_taken}\``,
            '',
            'Errors:',
            ...(q.errors.length ? q.errors.map((e) => `- ${e}`) : ['- none']),
            '',
            'Notes:',
            ...(q.notes.length ? q.notes.map((e) => `- ${e}`) : ['- none']),
          ];
          fs.writeFileSync(path.join(out, 'qualification.md'), lines.join('\n') + '\n');
          NODE

          status="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).status)' "$RESULT_ROOT/qualification.json")"
          git worktree remove --force "$WORK_ROOT"

          git config user.name undercast-alice-qualification
          git config user.email undercast-alice-qualification@users.noreply.github.com
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git checkout --orphan alice-qualification-result-v2
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-alice-qualification-v2
          cp -a "$RESULT_ROOT"/. transport/star-trek-alice-qualification-v2/
          git add transport/star-trek-alice-qualification-v2
          git commit -m 'Record read-only Star Trek Alice qualification v2'
          git push origin HEAD:"refs/heads/${RESULT_BRANCH}"
          test "$status" = qualified-read-only
