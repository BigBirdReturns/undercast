name: card-backfill-uc-107-apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-107-APPLY.json"
      - "scripts/card-backfill-uc-107-apply.mjs"
      - ".github/workflows/card-backfill-uc-107-apply.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: card-backfill-uc-107-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-023'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-023
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify exact reviewed Mandalorian packet authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const path='.github/CARD-BACKFILL-UC-107-APPLY.json';
          const bytes=fs.readFileSync(path);
          const row=JSON.parse(bytes);
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-107');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-107');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_1b74425768d476b9f0339c17');
          if(row.version!==1||row.record_id!=='UC-107'||row.actor!=='Pedro Pascal'||row.character!=='The Mandalorian'||row.production!=='The Mandalorian'||row.year!==2019||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-107 apply authorization drift');
          if(row.render_artifact?.artifact_id!==8675463564||row.render_artifact?.head_sha!=='5e3225a76c04efa179119afb18bfdc21d862b86b'||row.render_artifact?.zip_sha256!=='6fa9d56fe2fd4611fcedb8d953b3689df8c4fb5302f0f7c85d690297e79b80b8')throw new Error('UC-107 render custody drift');
          if(row.expected?.selected_source_sha256!=='0305588c69ada14b52dde327ec4ea71cc7ab8c97d3b88a97f7dbd9a8db9f6bfd'||row.expected?.exact_role_record_sha256!=='78ce412bf5697671a3ce6cd5d4520d47504af7fa583c378f29168b3a70ba19b8')throw new Error('UC-107 source authorization drift');
          if(row.expected?.candidate_sha256!=='f5b1625369eb0aa2c19ec55e8c8654d7c3dceec6932342382609c1deef0519e9'||row.expected?.crop_preview_sha256!=='fcce8e544b51bd4390b6c9c478bd45f55b401d2a1f9bc31736528ec332477a56')throw new Error('UC-107 candidate or crop authorization drift');
          if(row.expected?.packet_file_count!==12||row.expected?.duplicate_item_count!==3||row.expected?.duplicate_repository_hash_count!==2070)throw new Error('UC-107 packet denominator drift');
          if(row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.crop_ruling!=='pass-single-role-east-crop'||row.ruling?.embodiment_ruling!=='actor-role-bound-frame-occupant-not-asserted'||row.ruling?.canonical_mutation!==false)throw new Error('UC-107 ruling drift');
          if(!specimen||specimen.character!=='The Mandalorian'||specimen.production!=='The Mandalorian'||specimen.years!=='2019'||specimen.still)throw new Error('UC-107 specimen boundary drift');
          if(source?.still)throw new Error('UC-107 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-107'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-107 audit boundary drift');
          console.log(`PASS — UC-107 apply control ${crypto.createHash('sha256').update(bytes).digest('hex')}`);
          NODE
      - name: Retrieve and verify the exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-apply"
          mkdir -p "$root/source"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8675463564/zip" > "$root/render.zip"
          echo "6fa9d56fe2fd4611fcedb8d953b3689df8c4fb5302f0f7c85d690297e79b80b8  $root/render.zip" | sha256sum -c -
          unzip -q "$root/render.zip" -d "$root/source"
          base="$root/source/output/UC-107"
          test -f "$base/manifest.json"
          echo "ca082b233f2ab202267ca3774f165f8055ad4f1d9f36b08fd14c43a8bb08ca50  $base/manifest.json" | sha256sum -c -
          echo "f6fdfd44d49885f811945ff5aaabec6d704bd68c28a7d0d383e3d7f392788307  $base/duplicate-scan.json" | sha256sum -c -
          echo "8789c4d74709fa260d64ca1087cb99ae841b58236dbec0e554a0264eb994ae5d  $base/review.json" | sha256sum -c -
          echo "404b61f807b6e5e96a9bb3396ee161180570d889ccd55fc90c0b5a36f9cb9a91  $base/review.md" | sha256sum -c -
          echo "6caa0b934169c083f5447da180bf62563c7d858c8b7876fe413c380f0b035c66  $base/SHA256SUMS" | sha256sum -c -
          echo "78ce412bf5697671a3ce6cd5d4520d47504af7fa583c378f29168b3a70ba19b8  $base/exact-role-record.json" | sha256sum -c -
          echo "0305588c69ada14b52dde327ec4ea71cc7ab8c97d3b88a97f7dbd9a8db9f6bfd  $base/mandalorian-original.jpg" | sha256sum -c -
          echo "6b1760cb9a666ef8d8b50949bca5350f8de5f5834e22f94e97f3d6eeda1cb1de  $base/source-page-disney-plus-first-look.png" | sha256sum -c -
          echo "5401faf3438960bc163b51e6e258ff987a368097685abfa4d932a5eecf6d5629  $base/source-page-lucasfilm-cast-announcement.png" | sha256sum -c -
          echo "e9c9402b548e13b0b0c2db86f2b38cffbabf7823518e27f8721423c458e3f95b  $base/source-page-star-wars-celebration-2019.png" | sha256sum -c -
          echo "f5b1625369eb0aa2c19ec55e8c8654d7c3dceec6932342382609c1deef0519e9  $base/uc-107-still-candidate.jpg" | sha256sum -c -
          echo "fcce8e544b51bd4390b6c9c478bd45f55b401d2a1f9bc31736528ec332477a56  $base/card-crop-preview.jpg" | sha256sum -c -
          (cd "$base" && sha256sum -c SHA256SUMS)
          cat > "$root/render-artifact-receipt.txt" <<'EOF'
          run_id=30325374684
          artifact_id=8675463564
          artifact_name=card-backfill-uc-107-render-30325374684
          artifact_zip_sha256=6fa9d56fe2fd4611fcedb8d953b3689df8c4fb5302f0f7c85d690297e79b80b8
          artifact_head_sha=5e3225a76c04efa179119afb18bfdc21d862b86b
          source_manifest_sha256=ca082b233f2ab202267ca3774f165f8055ad4f1d9f36b08fd14c43a8bb08ca50
          source_sums_sha256=6caa0b934169c083f5447da180bf62563c7d858c8b7876fe413c380f0b035c66
          EOF
      - name: Materialize and independently validate the evidence-only packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-107-apply/source/output/UC-107
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-apply"
          node --check scripts/card-backfill-uc-107-apply.mjs
          node scripts/card-backfill-uc-107-apply.mjs materialize 2>&1 | tee "$root/materialize.log"
          node scripts/card-backfill-uc-107-apply.mjs validate 2>&1 | tee "$root/validate.log"
          node --input-type=module - <<'NODE' | tee "$root/no-canonical-mutation.log"
          import fs from 'node:fs';
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(row=>row.id==='UC-107');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(row=>row.id==='UC-107');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(row=>row.id==='ma_1b74425768d476b9f0339c17');
          const role=JSON.parse(fs.readFileSync('data/review/card-backfill/UC-107/exact-role-record.json','utf8'));
          if(!specimen||specimen.still)throw new Error('UC-107 specimen was canonically mutated');
          if(source?.still)throw new Error('UC-107 source ledger was canonically mutated');
          if(!audit||audit.wall_id!=='UC-107'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-107 audit disposition was canonically mutated');
          if(role.embodiment_boundary?.frame_specific_physical_occupant!=='not asserted')throw new Error('UC-107 frame embodiment boundary was weakened');
          console.log('PASS — UC-107 remains canonically absent; only reviewed evidence was added; frame occupant not asserted');
          NODE
      - name: Build the permanent evidence commit and retire every temporary operator
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-apply"
          git config user.name 'undercast-card-backfill'
          git config user.email 'undercast-card-backfill@users.noreply.github.com'
          rm -f \
            .github/CARD-BACKFILL-UC-107.json \
            .github/CARD-BACKFILL-UC-107-DISCOVER.json \
            .github/CARD-BACKFILL-UC-107-RENDER.json \
            .github/CARD-BACKFILL-UC-107-APPLY.json \
            .github/workflows/card-backfill-next-selection.yml \
            .github/workflows/card-backfill-uc-107-scope.yml \
            .github/workflows/card-backfill-uc-107-discover.yml \
            .github/workflows/card-backfill-uc-107-render.yml \
            .github/workflows/card-backfill-uc-107-apply.yml \
            scripts/card-backfill-next-selection.mjs \
            scripts/card-backfill-uc-107-scope.mjs \
            scripts/card-backfill-uc-107-discover.mjs \
            scripts/card-backfill-uc-107-render.mjs \
            scripts/card-backfill-uc-107-apply.mjs
          git add -A
          git diff --cached --check
          git commit -m 'Card backfill: retain UC-107 Pedro Pascal Mandalorian still'
          git fetch --no-tags --depth=1 origin agent/card-backfill-next-022
          mapfile -t changed < <(git diff --name-only origin/agent/card-backfill-next-022 HEAD)
          test "${#changed[@]}" -eq 12
          for path in "${changed[@]}"; do
            case "$path" in
              data/review/card-backfill/UC-107/*) ;;
              *) echo "unexpected permanent card-lane path: $path" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee "$root/permanent-paths.txt"
          git rev-parse HEAD | tee "$root/permanent-head.txt"
      - name: Install Chromium for the permanent-head rendered gate
        run: npx playwright install --with-deps chromium
      - name: Run the complete canonical gate on the exact permanent candidate
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-107-apply"
          npm run gate 2>&1 | tee "$root/gate.log"
          git status --short | tee "$root/status.txt"
          test -z "$(git status --porcelain)"
      - name: Publish the exact gated evidence candidate
        run: git push origin HEAD:agent/card-backfill-next-023
      - name: Compact retained apply receipts
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-107-apply"
          if [ -d "$root" ]; then
            git status --short > "$root/final-status.txt" 2>&1 || true
            git rev-parse HEAD > "$root/final-head.txt" 2>&1 || true
            rm -rf "$root/source" "$root/render.zip"
          fi
      - name: Retain materialization, evidence, gate, and publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-107-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-107-apply
            data/review/card-backfill/UC-107
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
