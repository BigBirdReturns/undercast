name: card-backfill-control-loop-snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-control-loop-snapshot.yml'

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Package the exact control-loop surface
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/control-loop-snapshot"
          mkdir -p "$root/.github/workflows" "$root/.github" "$root/scripts"
          cp .github/workflows/card-backfill-stage.yml "$root/.github/workflows/"
          cp .github/workflows/card-backfill-publication.yml "$root/.github/workflows/"
          cp .github/workflows/card-backfill-amortized-wave.yml "$root/.github/workflows/"
          cp .github/workflows/card-backfill-amortized-resume-after-staging.yml "$root/.github/workflows/"
          cp .github/workflows/card-backfill-source-v2-resume.yml "$root/.github/workflows/"
          cp .github/CARD-BACKFILL-AMORTIZATION-ACTIVE.json "$root/.github/"
          cp .github/CARD-BACKFILL-AMORTIZATION.json "$root/.github/"
          cp scripts/gate.mjs "$root/scripts/"
          printf '%s\n' "$(git rev-parse HEAD)" > "$root/SOURCE_HEAD"

      - uses: actions/upload-artifact@v4
        with:
          name: card-backfill-control-loop-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/control-loop-snapshot
          if-no-files-found: error
          retention-days: 7

      - name: Publish the snapshot run identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${head}" \
            -f state=success \
            -f context='card-backfill/control-loop-snapshot' \
            -f description="snapshot run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
