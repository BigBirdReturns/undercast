name: enwright-media-candidate-probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/enwright-media-candidate-probe.yml"

permissions:
  contents: read

concurrency:
  group: enwright-media-candidate-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha }}
  EXACT_MAIN: ${{ github.event.pull_request.base.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SELF: .github/workflows/enwright-media-candidate-probe.yml

jobs:
  probe:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Bind exact main and read-only transport
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          git fetch --no-tags --depth=4 origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$AUTHORIZED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXACT_MAIN"
          test "$(git merge-base HEAD refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          probe_at="$(git show -s --format=%cI "$AUTHORIZED_HEAD")"
          echo "PROBE_AT=$probe_at" >> "$GITHUB_ENV"
          echo "exact_main=$EXACT_MAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "probe_at=$probe_at" >> "$GITHUB_STEP_SUMMARY"

      - name: Reconstruct the exact lease and submit the evidence-backed voice draft in isolation
        run: |
          set -euo pipefail
          mkdir -p /tmp/luna
          cat > /tmp/luna/batch.json <<'JSON'
          {
            "version": 1,
            "lease_id": "lease_e6c0541e10146179ad56a867",
            "agent": "luna",
            "claimed_at": "2026-08-03T02:58:28-07:00",
            "expires_at": "2026-08-04T09:58:28.000Z",
            "readiness": {
              "scope_id": "star-trek",
              "lease_token": "c4caadf9d95dc19ed9a29795bb288fce68ac8580fda6da8eb8847fa5829bcbee",
              "producer_sha256": "f72e3dedb00e8f4487da2b02af02780c73b359fd887c99f350fcaf78dc9db59a",
              "contract_sha256": "95c0ec569361cdebf296035268341dc74669692b9b7ceec77afaac5c48bb6da7",
              "coverage_sha256": "771d393fc293f15da8487a61d4008f5408f99f652219f7dfc4b35f45dae556b5",
              "manifest_sha256": "e5ea03a77e4d7ab62e108e6a9816d421dcf48268323e2fbba0324f5ff18867cf"
            },
            "selection": {
              "strategy": "priority-compatible",
              "profile_id": "text-vision",
              "policy_sha256": "07fcbefca2326ec964a2a8ca3bdb29924976bbe4c906d6ef5cc019a1b1889c19",
              "profile_capabilities": [],
              "requested_task_id": null,
              "basis": "Highest-priority queued tasks compatible with the reviewed capability profile."
            },
            "tasks": [
              {
                "id": "ap_fddff4a188eb5eb9fbefd86f",
                "scope": "star-trek",
                "franchise": "Star Trek",
                "category": ["Individuals"],
                "character": "Enwright",
                "performer": "James Doohan",
                "performance_modes": ["physical-prosthetic"],
                "required_capabilities": [],
                "capability_reasons": [],
                "sources": ["https://memory-alpha.fandom.com/wiki/Enwright"],
                "source_receipts": [
                  {
                    "source": "https://memory-alpha.fandom.com/wiki/Enwright",
                    "pageid": 9185,
                    "revision": 3163894,
                    "timestamp": "2024-05-31T19:56:03Z",
                    "content_sha256": "221c1c1103f158aadb5617bd990461fc1f33502f49c9d4b5ee0c8fc3f08b4bc5"
                  }
                ],
                "source_fingerprint": "38b7babe85514b981b80e98ea4858c220d7d365a40fe8f858560308b02474cd7",
                "performer_on_wall": true,
                "priority": 1380,
                "attempt": 2
              }
            ]
          }
          JSON
          cat > /tmp/luna/results.json <<'JSON'
          {
            "version": 1,
            "lease_id": "lease_e6c0541e10146179ad56a867",
            "agent": "luna",
            "results": [
              {
                "task_id": "ap_fddff4a188eb5eb9fbefd86f",
                "decision": "draft",
                "draft": {
                  "character": "Enwright",
                  "actor": "James Doohan",
                  "production": "Star Trek: The Original Series",
                  "universe": "Star Trek",
                  "years": "1968",
                  "designer": "—",
                  "transform": 2,
                  "kind": "voice",
                  "knownFor": "Best known as Montgomery ‘Scotty’ Scott, the Enterprise’s engineer and one of Star Trek’s defining original performers.",
                  "reveal": "Commodore Enwright is never seen: James Doohan supplied the officer’s off-screen voice in ‘The Ultimate Computer.’ It was one of several additional voices Doohan performed around his far more recognizable role as Scotty.",
                  "references": [
                    {
                      "claim": "performance",
                      "label": "James Doohan provided the off-screen voice of Commodore Enwright",
                      "source": "https://memory-alpha.fandom.com/wiki/Enwright",
                      "publisher": "Memory Alpha"
                    },
                    {
                      "claim": "production",
                      "label": "Enwright appears in Star Trek: The Original Series episode The Ultimate Computer",
                      "source": "https://memory-alpha.fandom.com/wiki/The_Ultimate_Computer_(episode)",
                      "publisher": "Memory Alpha"
                    }
                  ],
                  "wiki": "https://en.wikipedia.org/wiki/James_Doohan"
                }
              }
            ]
          }
          JSON

          node scripts/autopilot.mjs validate
          node scripts/autopilot.mjs submit \
            --batch /tmp/luna/batch.json \
            --input /tmp/luna/results.json \
            --now "$PROBE_AT" \
            2>&1 | tee /tmp/enwright-submit.log
          node scripts/grow.mjs --drafts 2>&1 | tee /tmp/enwright-grow.log

          node - <<'NODE'
          const fs = require('fs');
          const specimens = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const rows = specimens.filter((row) => row.actor === 'James Doohan' && row.character === 'Enwright');
          if (rows.length !== 1 || rows[0].id !== 'UC-1346' || rows[0].kind !== 'voice' || rows[0].transform !== 2) {
            throw new Error(`unexpected Enwright canonical draft ${JSON.stringify(rows)}`);
          }
          if (rows[0].still || rows[0].portrait) throw new Error('grow attached media before targeted retrieval');
          NODE

      - name: Run one targeted retrieval and preserve every candidate for visual adjudication
        env:
          CONTACT: bigbirdreturns@proton.me
          RETRIEVE_ONLY: UC-1346
          RETRIEVE_MAX: "1"
          IMAGE_MODE: loose
          CRAWL_DELAY_MS: "1200"
        run: |
          set -euo pipefail
          node scripts/retrieve.mjs 2>&1 | tee /tmp/enwright-retrieve.log
          node scripts/sync-sources.mjs 2>&1 | tee /tmp/enwright-sync-sources.log
          node scripts/autopilot.mjs sync --scope star-trek --json \
            > /tmp/enwright-autopilot-sync.json

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const specimens = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const sources = JSON.parse(fs.readFileSync('data/SOURCES.json', 'utf8'));
          const autopilot = JSON.parse(fs.readFileSync('data/AUTOPILOT.json', 'utf8'));
          const specimen = specimens.find((row) => row.id === 'UC-1346');
          const source = sources.find((row) => row.id === 'UC-1346');
          const task = autopilot.jobs.find((row) => row.id === 'ap_fddff4a188eb5eb9fbefd86f');
          if (!specimen || !source || !task) throw new Error('candidate state is incomplete');
          if (task.status !== 'merged' || !task.wall_ids?.includes('UC-1346')) {
            throw new Error(`Autopilot did not reconcile Enwright to merged: ${JSON.stringify(task)}`);
          }
          const candidates = [];
          for (const side of ['still', 'portrait']) {
            const media = specimen[side] || null;
            if (!media?.src) {
              candidates.push({ side, status: 'absent', media: null, duplicate_paths: [] });
              continue;
            }
            const bytes = fs.readFileSync(media.src);
            const digest = sha(bytes);
            const duplicates = [];
            for (const file of fs.readdirSync('images')) {
              const candidatePath = path.join('images', file);
              if (candidatePath === media.src || !fs.statSync(candidatePath).isFile()) continue;
              try {
                if (sha(fs.readFileSync(candidatePath)) === digest) duplicates.push(candidatePath);
              } catch {}
            }
            candidates.push({
              side,
              status: 'retrieved',
              media,
              bytes: bytes.length,
              sha256: digest,
              duplicate_paths: duplicates.sort(),
            });
          }
          const summary = {
            version: 1,
            exact_main: process.env.EXACT_MAIN,
            probe_at: process.env.PROBE_AT,
            lease_id: 'lease_e6c0541e10146179ad56a867',
            task_id: 'ap_fddff4a188eb5eb9fbefd86f',
            wall_id: 'UC-1346',
            specimen,
            source,
            task_status: task.status,
            task_wall_ids: task.wall_ids,
            candidates,
            adjudication_boundary: {
              character_is_unseen_offscreen_voice: true,
              generic_character_still_permitted: false,
              cross_card_duplicate_permitted: false,
              canonical_mutation_published: false
            }
          };
          fs.writeFileSync('/tmp/enwright-media-candidate-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload exact candidate bytes and isolated state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enwright-media-candidate-${{ github.run_id }}
          path: |
            /tmp/luna/batch.json
            /tmp/luna/results.json
            /tmp/enwright-submit.log
            /tmp/enwright-grow.log
            /tmp/enwright-retrieve.log
            /tmp/enwright-sync-sources.log
            /tmp/enwright-autopilot-sync.json
            /tmp/enwright-media-candidate-summary.json
            data/specimens.json
            data/SOURCES.json
            data/AUTOPILOT.json
            data/journal/autopilot.jsonl
            data/journal/candidates.jsonl
            data/drafts.json
            data/GAPS.json
            images/uc-1346-*
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
