name: export-current-main-v1

on:
  push:
    branches:
      - agent/export-current-main-v1

permissions:
  contents: read

env:
  EXPECTED_MAIN: 6e9aa87be07411fdb42bc4e55b6e480135826d35
  EXPECTED_TREE: 521d688da380123c76a129b618439a4889f2232f

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact canonical source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --filter=blob:none --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse "${EXPECTED_MAIN}^{tree}")" = "$EXPECTED_TREE"
          git checkout --detach "$EXPECTED_MAIN"
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/undercast-current-main-v1
          git archive --format=tar.gz --prefix=undercast-current-main-v1/ "$EXPECTED_MAIN" > /tmp/undercast-current-main-v1/undercast-current-main-v1.tar.gz
          sha256sum /tmp/undercast-current-main-v1/undercast-current-main-v1.tar.gz > /tmp/undercast-current-main-v1/undercast-current-main-v1.tar.gz.sha256
          git show -s --format='%H%n%T%n%P%n%s' "$EXPECTED_MAIN" > /tmp/undercast-current-main-v1/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: undercast-current-main-v1
          path: /tmp/undercast-current-main-v1/
          if-no-files-found: error
          retention-days: 7
