name: card-backfill-uc-063-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-063.json"
      - "scripts/card-backfill-uc-063-discover.mjs"
      - ".github/workflows/card-backfill-uc-063-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-063-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-010'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then shift; exec identify "$@"; fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-063 audit and discovery boundary
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-063.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(r=>r.id==='UC-063');
          const a=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(r=>r.id==='ma_97a8ad449acea930428c9665');
          if(c.version!==1||c.record_id!=='UC-063'||c.actor!=='Jim Carrey'||c.side!=='still')throw new Error('UC-063 control drift');
          if(!s||s.actor!=='Jim Carrey'||s.character!=='The Grinch'||s.still)throw new Error('UC-063 canonical boundary changed');
          if(!a||a.wall_id!=='UC-063'||a.side!=='still'||a.status!=='absent'||a.expected_subject!=='The Grinch'||a.asset)throw new Error('UC-063 audit boundary changed');
          if(c.sources?.length!==10)throw new Error('UC-063 source set drift');
          console.log('PASS — UC-063 remains a Jim Carrey Grinch still absence');
          NODE
      - name: Gather and hash exact Grinch candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-063
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-063-discover.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-063.log"
          test -z "$(git status --porcelain)"
      - name: Upload exact candidates, pages and contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-063-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-063
            ${{ runner.temp }}/card-backfill-uc-063.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
