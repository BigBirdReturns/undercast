name: star-trek-henoch-media-review-v1

on:
  push:
    branches:
      - agent/star-trek-henoch-media-review-recovery-v1

permissions:
  contents: write

concurrency:
  group: star-trek-henoch-media-review-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: "28ea3efc9f71d6207794d45cc654af765b36c63e"
  EXPECTED_TREE: "52fd54b4f8e5e42977b23cbccb75fb0e05f11a6c"
  EXPECTED_PARENT: "4a2f98c4dc2039f596857cfdff01e701acbd2e4d"
  EXPECTED_MESSAGE: "Star Trek: publish Risik cycle"
  TRIGGER_MESSAGE: "Review exact Star Trek Henoch media v1"
  MEDIA_BRANCH: "agent/star-trek-henoch-media-result-v1"
  MEDIA_COMMIT: "9df7b9fd1f037bf371b4dec4fdd078abfbf3fc01"
  MEDIA_TREE: "2cc003961a661d79424c5df6efb4878981a4fd30"
  MEDIA_MESSAGE: "Record Star Trek Henoch media preparation v1"
  MEDIA_PREFIX: "transport/star-trek-henoch-media-v1"
  MEDIA_RECEIPT_SHA: "9f5700b00cd63355fff4aa0a4575f65f9309b6d7a142c3025af3766e1f3140e2"
  MEDIA_ARTIFACT_ID: "9678505487"
  MEDIA_ARTIFACT_DIGEST: "b6b34dc53afd095ff5c9eecc6b2647a98462d0d3cc7595b070def57187da37d4"
  TASK_ID: "ap_3d10b7a97efdbdd11c50bc2a"
  EXPECTED_LEASE: "lease_7495c4d823c439f1ae201c13"
  EXPECTED_PERFORMER: "Leonard Nimoy"
  EXPECTED_CHARACTER: "Henoch"
  EXPECTED_FINGERPRINT: "53b562ce31db6635c5398b4dbcd9c391aacf8e1997a49e2ac103854afb18e839"
  WALL_ID: "UC-1400"
  EXPECTED_STILL_SHA: "edbea99891daa786d65e3953ae591784f84b35593bab9420841addd81f57bbd6"
  EXPECTED_PORTRAIT_SHA: "218703a31a24aa234d4a43da44c911b138acf4ca31897a8a6b3a029d7dc7dddf"
  STILL_ITEM_ID: "ma_eafe8a72e74325fb6632c097"
  PORTRAIT_ITEM_ID: "ma_afc31673cac70a0a8bb440ca"
  RESULT_BRANCH: "agent/star-trek-henoch-media-review-result-v1"
  OUT: "/tmp/star-trek-henoch-media-review-v1"
  PUBLISH: "/tmp/star-trek-henoch-media-review-publication-v1"
  INDEX: "/tmp/star-trek-henoch-media-review-publication-v1.index"

jobs:
  review:
    name: independently-review-exact-henoch-media
    if: ${{ github.event.head_commit.message == 'Review exact Star Trek Henoch media v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - name: Verify exact media result and canonical boundary
        shell: bash
        run: bash .github/recovery/star-trek-henoch-media-review-v1/01-verify.sh
      - name: Replay both encodings and issue four asset-bound votes
        shell: bash
        run: bash .github/recovery/star-trek-henoch-media-review-v1/02-review.sh
      - name: Upload Henoch independent media-review evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-henoch-media-review-v1
          path: /tmp/star-trek-henoch-media-review-v1/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable Henoch media-review result
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: bash .github/recovery/star-trek-henoch-media-review-v1/03-publish.sh
