      WATERLINE_STATUS_SHA256: "515aae2f677e62305580ed45fe5848d5f2a1a9f675c67831231b7f954dc9fdf7"
      SOURCE_GATE_LOG_SHA256: "961f0bfa6e124a6dbe473ec029914443a64b6c566e3ab1762387cba525d8a1a7"
      PROGRAM_RECOVERY_IDENTITY: "c09c5692102eabddf910b635155f64057e983bf70ea16e3ae19797cca4dc003e"
      COMMAND_IDENTITY: "60228be232980b039acd1e98f50f48baaf70d365845d4d7388676ed56edeeecf"
      SOURCE_TRANSPORT_IDENTITY: "a999f0cf3c55cf11bb594ea388258700ef010aabb9974b6c6b853c151cdc7275"
      PROOF_PR: "856"
      PROOF_BRANCH: "observer/doctor-who-cycle-011-rastel-cleanup-terminal-v4"
      PROOF_HEAD: "f47f0845de78496f20f3ce4446921ce1d9637afd"
      PROOF_RUN: "31360254095"
      PROOF_JOB: "93367591127"
      PROOF_ARTIFACT: "9052149064"
      PROOF_ARTIFACT_SHA256: "3fe31e2490f7d039fbadde7ba04d74ba931212ee34c906abe998c1b45e26201d"
      PROOF_IDENTITY: "9045933ce30295c274a5061d493209291b8b0827c4d7c24253b8de0a14b8c835"
      SUPERSEDED_OBSERVER_PR: "855"
      SUPERSEDED_OBSERVER_BRANCH: "observer/doctor-who-cycle-011-rastel-cleanup-terminal-v3"
      CYCLE12_PREFIX: "agent/doctor-who-cycle-012-"
      REQUIRED_STALE_JSON: "[\"agent/doctor-who-cycle-012-candidate-parameter-census-v1\",\"agent/doctor-who-cycle-012-candidate-source-inspection-v1\",\"agent/doctor-who-cycle-012-evidence-preflight-v1\",\"agent/doctor-who-cycle-012-evidence-preflight-v2\",\"agent/doctor-who-cycle-012-media-census-v1\",\"agent/doctor-who-cycle-012-media-census-v2\",\"agent/doctor-who-cycle-012-media-review-v1\",\"agent/doctor-who-cycle-012-preflight-v1\",\"agent/doctor-who-cycle-012-preflight-v4\",\"agent/doctor-who-cycle-012-preflight-v5\",\"agent/doctor-who-cycle-012-preflight-v6\",\"agent/doctor-who-cycle-012-preflight-v7\",\"agent/doctor-who-cycle-012-preflight-v8\",\"agent/doctor-who-cycle-012-preflight-v9\"]"
      SELECTED_TASK: "ap_8965086737382df0e88366db"
      SELECTED_PERFORMER: "Dan Starkey"
      SELECTED_ROLE: "Senstarg"
      SELECTED_MODE: "unresolved"
      SELECTED_SOURCE: "https://tardis.fandom.com/wiki/Senstarg"
      SELECTED_SOURCE_FINGERPRINT: "4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2"
      ACTIVE_PROFILE: "text-vision"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate failed V9 and execute checksum-bound V10 selector
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$V9_FAILURE_ROOT"
          mkdir -p "$V9_FAILURE_ROOT/api"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V9_PR" > "$V9_FAILURE_ROOT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V9_RUN" > "$V9_FAILURE_ROOT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V9_RUN/jobs?per_page=100" > "$V9_FAILURE_ROOT/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V9_ARTIFACT" > "$V9_FAILURE_ROOT/api/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V9_ARTIFACT/zip" > "$V9_FAILURE_ROOT/diagnostics.zip"
          test "$(sha256sum "$V9_FAILURE_ROOT/diagnostics.zip" | awk '{print $1}')" = "$V9_ARTIFACT_SHA256"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['V9_FAILURE_ROOT'])
          load = lambda name: json.loads((root / 'api' / name).read_text())
          pr = load('pr.json'); run = load('run.json'); jobs = load('jobs.json')['jobs']; artifact = load('artifact.json')
          assert pr['number'] == int(os.environ['V9_PR'])
          assert pr['state'] in {'open', 'closed'} and pr['draft'] is True and pr['merged_at'] is None
          assert pr['base']['sha'] == os.environ['MAIN']
          assert pr['head']['ref'] == os.environ['V9_BRANCH'] and pr['head']['sha'] == os.environ['V9_HEAD']
          assert pr['commits'] == 1 and pr['changed_files'] == 1
          assert run['id'] == int(os.environ['V9_RUN'])
          assert run['head_sha'] == os.environ['V9_HEAD'] and run['head_branch'] == os.environ['V9_BRANCH']
          assert run['event'] == 'pull_request' and run['status'] == 'completed' and run['conclusion'] == 'failure'
          rows = [row for row in jobs if row['id'] == int(os.environ['V9_JOB'])]
          assert len(rows) == 1 and rows[0]['name'] == 'select' and rows[0]['conclusion'] == 'failure'
          steps = rows[0]['steps']
          target = [row for row in steps if row['name'] == 'Authenticate paid selector output and freeze current custody']
          assert len(target) == 1 and target[0]['status'] == 'completed' and target[0]['conclusion'] == 'failure'
          uploads = [(row['status'], row['conclusion']) for row in steps if row['name'] == 'Run actions/upload-artifact@v4']
          assert uploads == [('completed', 'skipped'), ('completed', 'success')], uploads
          assert artifact['id'] == int(os.environ['V9_ARTIFACT'])
          assert artifact['name'] == os.environ['V9_ARTIFACT_NAME']
          assert artifact['digest'] == 'sha256:' + os.environ['V9_ARTIFACT_SHA256'] and artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['V9_RUN'])
          assert artifact['workflow_run']['head_sha'] == os.environ['V9_HEAD']
          receipt = {
              'status': 'cycle-012-selector-v9-same-step-environment-failure-bound-v1',
              'version': 1,
              'source': {'pr': int(os.environ['V9_PR']), 'head': os.environ['V9_HEAD'], 'run': int(os.environ['V9_RUN']), 'job': int(os.environ['V9_JOB']), 'artifact': int(os.environ['V9_ARTIFACT']), 'artifact_sha256': os.environ['V9_ARTIFACT_SHA256']},
              'failure': {'stage': 'carrier-authentication', 'mechanism': 'CARRIER_PR and CARRIER_HEAD were written to GITHUB_ENV and consumed in the same step', 'paid_denominator_reached': False, 'selection_emitted': False},
              'repair': {'carrier_bindings_supplied_in_job_environment': True, 'source_step_name_repaired': True, 'total_compatible_separated_from_returned_limit': True},
              'boundary': {'repository_write': False, 'canonical_mutation': False, 'transport_mutation': False, 'lease_issued': False, 'queue_mutated': False, 'cycle_receipt_written': False, 'cycle_012_product_authority': False},
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (root / 'v9-failure.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY
          rm -rf "$RUNNER_ROOT"
          mkdir -p "$RUNNER_ROOT"
          : > "$RUNNER_ROOT/runner.sh.gz.b64"
          for blob in $RUNNER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$RUNNER_ROOT/runner.sh.gz.b64"
          done
          test "$(wc -c < "$RUNNER_ROOT/runner.sh.gz.b64" | tr -d ' ')" = "$RUNNER_B64_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh.gz.b64" | awk '{print $1}')" = "$RUNNER_B64_SHA256"
          base64 -d "$RUNNER_ROOT/runner.sh.gz.b64" > "$RUNNER_ROOT/runner.sh.gz"
          test "$(wc -c < "$RUNNER_ROOT/runner.sh.gz" | tr -d ' ')" = "$RUNNER_GZIP_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$RUNNER_ROOT/runner.sh.gz" > "$RUNNER_ROOT/runner.sh"
          test "$(wc -c < "$RUNNER_ROOT/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$RUNNER_ROOT/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$RUNNER_ROOT/runner.sh"
          RUNNER="$RUNNER_ROOT/runner.sh" python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER']).read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 2
          for index, block in enumerate(blocks, 1):
              compile(block, f'<cycle-012-v10-{index}>', 'exec')
          PY
          chmod 700 "$RUNNER_ROOT/runner.sh"
          "$RUNNER_ROOT/runner.sh"
          cp "$V9_FAILURE_ROOT/v9-failure.json" "$OUT/payload/v9-failure.json"
          rm -f "$OUT/payload/SHA256SUMS" "$OUT/payload/SHA256SUMS.pre"
          find "$OUT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' rel; do
              sha256sum "$OUT/payload/$rel" | sed "s#  $OUT/payload/#  #"
            done > "$OUT/payload/SHA256SUMS.pre"
          sha256sum "$OUT/payload/SHA256SUMS.pre" | sed "s#  $OUT/payload/#  #" > "$OUT/payload/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v10-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-preflight-v10/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-preflight-v10-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-preflight-v10
            /tmp/doctor-who-cycle-012-preflight-v10-source
            /tmp/doctor-who-cycle-012-preflight-v10-runner
            /tmp/doctor-who-cycle-012-preflight-v10-v9-failure
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
