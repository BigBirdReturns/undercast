name: doctor-who-cycle-012-preflight-v10

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-preflight-v10.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-preflight-v10
  cancel-in-progress: true

