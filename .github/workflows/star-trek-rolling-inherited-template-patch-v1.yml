name: star-trek-rolling-inherited-template-patch-v1

on:
  push:
    branches:
      - agent/star-trek-rolling-continuation-v1

concurrency:
  group: star-trek-rolling-inherited-template-patch-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Synchronize inherited bounded template repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=[]
          kz=Path('.github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py')
          post=Path('.github/recovery/post-kzinti-cycle-controller-rebind-v1.py')
          post_workflow=Path('.github/workflows/star-trek-post-kzinti-cycle-v1.yml')
          if kz.is_file():
              text=kz.read_text()
              pattern='    text = re.sub(r"data/review/adapter-sdk/star-trek-[a-z0-9-]+-cycle\\.json", prior_receipt_rel, text)\n'
              if pattern in text:
                  kz.write_text(text.replace(pattern,'',1)); changed.append(str(kz))
          if post.is_file():
              text=post.read_text()
              receipt='    text = re.sub(r"data/review/adapter-sdk/star-trek-[a-z0-9-]+-cycle\\.json", prior_receipt_rel, text)\n'
              checker='    text = re.sub(r"scripts/star-trek-kzinti-flyer[^\\\"\']*\\.mjs", prior_checker_rel, text)\n'
              if receipt in text: text=text.replace(receipt,'',1)
              if checker in text: text=text.replace(checker,'',1)
              anchor='    text = text.replace("__PRIOR_TARGET_UP__", slug.upper().replace("-", "_"))\n'
              if anchor in text and 'star-trek-post-kzinti-media-v1", text)' not in text:
                  text=text.replace(anchor,anchor+'    text = re.sub(r"star-trek-[a-z0-9-]+-media-v1", "star-trek-post-kzinti-media-v1", text)\n',1)
              if text!=post.read_text(): post.write_text(text); changed.append(str(post))
          if post_workflow.is_file():
              text=post_workflow.read_text()
              old='.status == "applied" and .canonical_parent == $parent and .task_id == $task and .source_fingerprint == $fp and .prior.checker_path | length > 0'
              if old in text:
                  post_workflow.write_text(text.replace(old,'.status == "applied" and .canonical_parent == $parent and .task_id == $task and .source_fingerprint == $fp and (.prior.checker_path | length > 0)',1)); changed.append(str(post_workflow))
          for path in Path('.github/workflows').glob('star-trek-*.yml'):
              text=path.read_text(); updated=text.replace('node scripts/star-trek-kukulkan-cycle.mjs','npm run star-trek:kukulkan-cycle:check')
              if updated!=text:
                  path.write_text(updated); changed.append(str(path))
          Path('/tmp/inherited-patch-paths.txt').write_text('\n'.join(sorted(set(changed)))+'\n')
          PY
          python3 -m py_compile .github/recovery/kzinti-flyer-cycle-controller-rebind-v1.py
          python3 -m py_compile .github/recovery/post-kzinti-cycle-controller-rebind-v1.py
          git diff --check
          test -s /tmp/inherited-patch-paths.txt || exit 0
          git config user.name undercast-star-trek-inherited-template-patcher
          git config user.email inherited-template-patcher@users.noreply.github.com
          while IFS= read -r path; do test -z "$path" || git add -- "$path"; done < /tmp/inherited-patch-paths.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Star Trek rolling continuation: synchronize bounded template repairs'
          git push origin HEAD:agent/star-trek-rolling-continuation-v1
