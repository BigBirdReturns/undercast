name: card-backfill-uc-172-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-172-RENDER.json"
      - "scripts/card-backfill-uc-172-render.part-00.mjs"
      - "scripts/card-backfill-uc-172-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-172-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-172-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-037'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-037
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-172 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-172-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-172');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-172');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_ab0bdc7a6add0fd55b7b1f66');
          if(row.version!==1||row.record_id!=='UC-172'||row.kind!=='voice'||row.actor!=='Jim Cummings'||row.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||row.production!=='Disney'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-172 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8731043623||row.discovery_artifact?.head_sha!=='e02bb4a6e21fce4b4d1d4ccd861ce95d603aafe6'||row.discovery_artifact?.candidate_count!==25||JSON.stringify(row.discovery_artifact?.role_counts)!==JSON.stringify({pooh:10,tigger:8,darkwing:7}))throw new Error('UC-172 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==0||row.identity_custody?.length!==3||row.roles?.length!==3)throw new Error('UC-172 render denominator drift');
          if(row.roles[0]?.sha256!=='09791a6423565dc6aab43b4ac298c4665b66ccf5394c0f8cae510625abf78875'||row.roles[1]?.sha256!=='064f1c031920489c8255eaac00a7e388d059219ef2ed27ee4d63e48ac9572de8'||row.roles[2]?.sha256!=='cc1829664ec9ac3bb0affbfd1e855d45d9a879064961ec7e3e32c39ad4792533')throw new Error('UC-172 selected source drift');
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.panel_height!==1000||row.render?.divider_width!==12||row.render?.face_height!==560||row.render?.internal_rule_height!==8||row.render?.body_height!==432||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-172 render geometry drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Jim Cummings'||specimen.character!=='Winnie the Pooh, Tigger, Darkwing Duck'||specimen.production!=='Disney'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-172-portrait.jpg')throw new Error('UC-172 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-172'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-172 audit boundary drift');
          console.log('PASS — exact UC-172 Jim Cummings three-role render authorized');
          NODE
      - name: Retrieve and verify exact internal discovery packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8731043623/zip" > "$root/discovery.zip"
          sha256sum "$root/discovery.zip" | tee "$root/download-transport-sha256.txt"
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-172-discover"
          echo "4dd1d4c8302eee08076cdf792a0f6cf5f44888a9ad2ce872938ed48d73c23099  $source/manifest.json" | sha256sum -c -
          echo "9323426fc041ddf67b2a5122f74765ab3074a11476388cdf2bedf73a780241fb  $source/summary.json" | sha256sum -c -
          echo "f570ca9e1f245c0a4923fe08e210e4456ac7733960b83b6e6fc52937e7c13c47  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "09791a6423565dc6aab43b4ac298c4665b66ccf5394c0f8cae510625abf78875  $source/candidates/pooh/008-file-profile-winnie-the-pooh-png.webp" | sha256sum -c -
          echo "064f1c031920489c8255eaac00a7e388d059219ef2ed27ee4d63e48ac9572de8  $source/candidates/tigger/007-file-profile-tigger-png.webp" | sha256sum -c -
          echo "cc1829664ec9ac3bb0affbfd1e855d45d9a879064961ec7e3e32c39ad4792533  $source/candidates/darkwing/003-file-darkwing-duck-keyart-png.webp" | sha256sum -c -
          echo "f2d7932dd5891d6bc4d48855ffa9b60196744b11e4e135e3c0704b9a08bef559  $source/raw/pooh.wikitext" | sha256sum -c -
          echo "95ed91ff10d406ce11fbea9948eaed1d2f286926425327b7dde34667469c9c92  $source/raw/tigger.wikitext" | sha256sum -c -
          echo "a27d7f61f5e0888e33a951476a4af5d5f3ec564da21e72bb0e9773711117bc0a  $source/raw/darkwing.wikitext" | sha256sum -c -
          echo "fa02e2486a379093d304a208e2b73009cde89da00ac70e77ccb9dd25dc0c825f  $source/pages/d23-character-voices-2022.png" | sha256sum -c -
          echo "77f3dce2365d8e1c898ebef06f79f21a2acf21ed29e357b82a5cb908e75f454a  $source/pages/d23-piglets-big-movie.png" | sha256sum -c -
          echo "f1f4e22da3c9acb78ce4f7c63c7b15b08e443704bc8861bcbd7d45f4783e52ad  $source/pages/d23-darkwing-duck-television.png" | sha256sum -c -
          cat > "$root/discovery-artifact-receipt.txt" <<'EOF'
          run_id=30469468658
          artifact_id=8731043623
          artifact_name=card-backfill-uc-172-discover-30469468658
          artifact_upload_digest_sha256=13f0d0cf21ec7206ac4a06010ce9b4a8342ae2ccda1d2c2c1fb8c2ae6d5cc8be
          artifact_head_sha=e02bb4a6e21fce4b4d1d4ccd861ce95d603aafe6
          internal_manifest_sha256=4dd1d4c8302eee08076cdf792a0f6cf5f44888a9ad2ce872938ed48d73c23099
          internal_summary_sha256=9323426fc041ddf67b2a5122f74765ab3074a11476388cdf2bedf73a780241fb
          transport_semantics=downloaded ZIP container recorded; internal file hashes are authoritative
          EOF
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-172-render/discovery/card-backfill-uc-172-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-172-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-172-render"
          cat scripts/card-backfill-uc-172-render.part-00.mjs scripts/card-backfill-uc-172-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d' ' -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-172-render"
          rm -rf "$root/discovery" "$root/discovery.zip" "$root/render.mjs"
      - name: Upload exact role assets, page receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-172-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-172-render/output
            ${{ runner.temp }}/card-backfill-uc-172-render/run.log
            ${{ runner.temp }}/card-backfill-uc-172-render/download-transport-sha256.txt
            ${{ runner.temp }}/card-backfill-uc-172-render/discovery-artifact-receipt.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
