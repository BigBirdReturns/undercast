name: estate-repair-collect010-free-origin-v2

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-repair-collect010-free-origin-v2.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-repair-collect010-free-origin-v2
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-normalized-review-010.mjs
  REPAIR: data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json
  FAILED_WORKFLOW: .github/workflows/estate-repair-collect010-free-origin.yml
  THIS_WORKFLOW: .github/workflows/estate-repair-collect010-free-origin-v2.yml
  COMMONS_FILE_PAGE: https://commons.wikimedia.org/wiki/File:Tim_Rose_by_Gage_Skidmore.jpg

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply exact single-token origin custody repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          test -e "$EXECUTOR"
          test -e "$REPAIR"
          test -e "$FAILED_WORKFLOW"
          test -e "$THIS_WORKFLOW"

          python3 - <<'PY'
          import json
          from pathlib import Path

          commons = 'https://commons.wikimedia.org/wiki/File:Tim_Rose_by_Gage_Skidmore.jpg'
          repair_path = Path('data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json')
          repair = json.loads(repair_path.read_text(encoding='utf-8'))
          if repair.get('transaction') != 'COLLECT-010' or repair.get('operation') != 'portrait-provenance-kind-schema-repair':
              raise SystemExit('portrait repair identity drifted')
          row = repair.get('correction', {}).get('UC-146/portrait')
          if not isinstance(row, dict) or row.get('kind') != 'free' or row.get('author') != 'Gage Skidmore' or row.get('license') != 'CC BY-SA 3.0' or row.get('year') != 2016:
              raise SystemExit('UC-146 retained free-provenance fields drifted')
          row['origin'] = commons
          row['basis'] = 'The retained Wikimedia Commons packet identifies the exact File:Tim Rose by Gage Skidmore.jpg page, author Gage Skidmore, license CC BY-SA 3.0, and 2016 photograph year.'
          repair['recorded_at'] = '2026-08-01T16:15:00Z'
          repair['defect'] = 'The portrait-kind repair correctly classified UC-146 as free, but the generated binding retained the imported packet custody URL instead of the exact Wikimedia Commons File page required for free-image provenance.'
          repair.setdefault('boundary', {})['origin_custody_corrected'] = True
          for field in ['candidate_bytes_changed', 'packet_evidence_rewritten', 'identity_ruling_changed', 'presentation_ruling_changed', 'crop_ruling_changed', 'duplicate_ruling_changed', 'canonical_mutation', 'evidence_standard_changed']:
              repair['boundary'][field] = False
          repair_path.write_text(json.dumps(repair, indent=2) + '\n', encoding='utf-8')

          executor_path = Path('scripts/estate-adopt-normalized-review-010.mjs')
          text = executor_path.read_text(encoding='utf-8')
          old_token = 'kind: provenanceRepair.kind, ...(provenanceRepair.author ?'
          new_token = 'kind: provenanceRepair.kind, ...(provenanceRepair.origin ? { origin: provenanceRepair.origin } : {}), ...(provenanceRepair.author ?'
          if text.count(old_token) != 1:
              raise SystemExit(f'exact intended-binding token expected one match, found {text.count(old_token)}')
          text = text.replace(old_token, new_token)

          old_line = '    assert(intended.origin === row.suggested_origin && sameJson(intended.focus, row.suggested_focus), `${key} binding origin or focus differs from census`);'
          new_lines = '''    const expectedOrigin = provenanceRepair?.origin || row.suggested_origin;
              assert(intended.origin === expectedOrigin && sameJson(intended.focus, row.suggested_focus), `${key} binding origin or focus differs from authorized custody`);
              if (key === "UC-146/portrait") assert(intended.origin === "https://commons.wikimedia.org/wiki/File:Tim_Rose_by_Gage_Skidmore.jpg", `${key} free image does not cite the exact Commons File page`);'''
          if text.count(old_line) != 1:
              raise SystemExit(f'exact origin assertion expected one match, found {text.count(old_line)}')
          text = text.replace(old_line, new_lines)
          executor_path.write_text(text, encoding='utf-8')
          PY

          node --check "$EXECUTOR"
          node "$EXECUTOR" | tee /tmp/COLLECT-010-free-origin-v2-preflight.json
          test "$(node -p "require('/tmp/COLLECT-010-free-origin-v2-preflight.json').authorized")" = "12"
          test "$(node -p "require('/tmp/COLLECT-010-free-origin-v2-preflight.json').pending")" = "12"
          test "$(node -p "require('./$REPAIR').correction['UC-146/portrait'].origin")" = "$COMMONS_FILE_PAGE"
          grep -Fq 'const expectedOrigin = provenanceRepair?.origin || row.suggested_origin;' "$EXECUTOR"
          grep -Fq 'provenanceRepair.origin ? { origin: provenanceRepair.origin }' "$EXECUTOR"

      - name: Stage exact correction and retire both patchers
        run: |
          set -euo pipefail
          git rm "$FAILED_WORKFLOW" "$THIS_WORKFLOW"
          git add -- "$EXECUTOR" "$REPAIR"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n%s\n' \
            "$EXECUTOR" \
            "$FAILED_WORKFLOW" \
            "$REPAIR" \
            "$THIS_WORKFLOW" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git write-tree > /tmp/COLLECT-010-free-origin-v2.tree

      - name: Run repository gate without rendered-browser duplication
        run: npm run gate -- --skip-rendered

      - name: Refuse post-gate drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-010-free-origin-v2.tree)" = "$(git write-tree)"
          node "$EXECUTOR" > /tmp/COLLECT-010-free-origin-v2-postgate.json
          test "$(node -p "require('/tmp/COLLECT-010-free-origin-v2-postgate.json').pending")" = "12"
          test "$(node -p "require('./$REPAIR').boundary.origin_custody_corrected")" = "true"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish exact Commons origin correction under lease
        id: publish
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate adoption: bind UC-146 to exact Commons File origin' \
            -m 'transaction=COLLECT-010' \
            -m 'record=UC-146/portrait' \
            -m 'origin=commons-file-page' \
            -m 'candidate_bytes_changed=false' \
            -m 'packet_evidence_rewritten=false' \
            -m 'evidence_standard_changed=false' \
            -m 'canonical_mutation=false' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_tree=$(cat /tmp/COLLECT-010-free-origin-v2.tree)"
          HEAD_SHA="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Report corrected free-image origin
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-010 exact free-origin repair passed every gate on workflow run ${GITHUB_RUN_ID}. Repair head: ${{ steps.publish.outputs.head }}. UC-146 now cites the retained Wikimedia Commons File page exactly; candidate bytes and every identity, presentation, crop, duplicate, and licensing judgment remain unchanged."

      - name: Report failed repair
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "COLLECT-010 free-origin V2 repair failed closed on workflow run ${GITHUB_RUN_ID}. No twelve-object payment claim is authorized."

      - name: Preserve exact origin repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-010-free-origin-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-010-free-origin-v2-preflight.json
            /tmp/COLLECT-010-free-origin-v2-postgate.json
            /tmp/COLLECT-010-free-origin-v2.tree
            data/review/estate-debt/COLLECT-010-PORTRAIT-PROVENANCE-KIND-REPAIR.json
          if-no-files-found: warn
          retention-days: 30
