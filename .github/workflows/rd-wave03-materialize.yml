name: RD Wave-03 temporary branch materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: rd-wave03-temporary-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/ssc-rd-wave03-carrier'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE: ${{ runner.temp }}/rd-wave03-materialization
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Materialize six lease-checked non-workflow product branches
        run: bash tmp/rd-wave03-materialize.sh

      - name: Upload bounded materialization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd-wave03-materialization-${{ github.run_id }}
          path: ${{ runner.temp }}/rd-wave03-materialization
          if-no-files-found: warn
          retention-days: 30
