name: doctor-who-cycle-012-senstarg-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-review-v1.yml"
      - ".github/review/doctor-who-cycle-012-senstarg-review-v1.part-*"

permissions: {}
concurrency:
  group: doctor-who-cycle-012-senstarg-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CURRENT_MAIN: 95fcd0d535c33c9c9a7ef0b299c8d15ed97b3134
      CURRENT_TREE: c9665b9c951780b179431c228ea5d09e1e05a39d
      REVIEW_PARENT: 6b0ea2bd189632ddc251f6a231fac90887f83e93
      REVIEW_GRANDPARENT: a0909cca7718b6804e58d54b9218b56497ace1fc
      REVIEW_GREATGRANDPARENT: 7c1ecf573fe334419a933559b50508a9a9a0bfb8
      REVIEW_GREATGREATGRANDPARENT: d8f59fb8a0e16fe790a8702e9197ab006cf30e02
      CANDIDATE_BASE: 40ae7ff0bdc96c8ccb3c9c96d1358c7de91979c2
      BRANCH: agent/doctor-who-cycle-012-senstarg-review-v1
      OUT: /tmp/doctor-who-cycle-012-senstarg-review-v1
      SOURCE: /tmp/doctor-who-cycle-012-senstarg-review-v1-source
      BASEWT: /tmp/doctor-who-cycle-012-senstarg-review-v1-main
      WORK: /tmp/doctor-who-cycle-012-senstarg-review-v1-worktree

      CANDIDATE_PR: "943"
      CANDIDATE_HEAD: 183459c3e4956bd7bbd8788f18a782b707ff571a
      CANDIDATE_RUN: "31517397491"
      CANDIDATE_JOB: "93865867660"
      CANDIDATE_ARTIFACT: "9111727123"
      CANDIDATE_ZIP_SHA256: c9d195d52a1fd6760f0ba33a57b57345c32b07376e42feb19930b4c393029777
      CANDIDATE_RECEIPT_ID: b0eb5d20f5a5c2e84ef738e3be34e4590259ef695224fea09988619596e2228c
      CANDIDATE_COMMIT: a594903e9d9a61b65600fd626075117d6815fb0d
      CANDIDATE_TREE: df201873e6481f2de123fc5f2fb066a37efd5c8e
      CANDIDATE_PATHS_SHA256: 924ce7818030c783e7b89bca5fbd190098693114d249086fa8e617354b295ad6
      CANDIDATE_BUNDLE_SHA256: e41f0237b07ac2f6b2a73b7f581cc0033038fbf43b245f06fa8ff65d68ea5f64
      CANDIDATE_PATCH_SHA256: fecdcc8c1d9aadc5605cbc748fa56d6b9d6c733aadf4eecf7256e2a1a96a737a
      CANDIDATE_TAR_SHA256: 69f0925ddd313c7a497368914c3ce9752a7791391520a95d8a56d36d9f6038cc
      CANDIDATE_FILE_MANIFEST_SHA256: 0146f0c44a8b30cb6f4bd166fc8264dd1de9c70b1c9b90fc93afaabe2e54415f
      CANDIDATE_DELTA_MANIFEST_SHA256: e9c8df4bcf1720792e618157eed809c8a3035adb55946ce747ca593e7f8e2d11
      CANDIDATE_PATH_POLICY_SHA256: 37535b36071d6b6ced80a25248d18f24f23263ae7b90e98baa17c70c1f86e4f2

      TASK_ID: ap_8965086737382df0e88366db
      LEASE_ID: lease_91feba4df199b92d8b266081
      WALL_ID: UC-1357
      SOURCE_URL: https://tardis.fandom.com/wiki/Senstarg
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb8178b2f817592c3f6c2
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      STILL_PATH: images/uc-1357-still.webp
      STILL_SHA256: 4a1b51dc58d599b1a881ff67ac78c925f21cf0bfb2b1e55590c6723ab2798713
      STILL_ORIGIN: https://static.wikia.nocookie.net/tardis/images/a/a1/Senstarg.jpg/revision/latest?cb=20140802021356
      PORTRAIT_PATH: images/uc-1357-portrait.jpg
      PORTRAIT_SHA256: 5aa0c1bf49bc492fdd93163dc99ccbf749201b579be6df8aabb299dad851358e
      PORTRAIT_ORIGIN: https://commons.wikimedia.org/wiki/File:Dan_Starkey_by_Gage_Skidmore.jpg

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Independently reconstruct, rebase, and review exact Senstarg candidate
        shell: bash
        run: |
          test "$(find .github/review -maxdepth 1 -type f -name 'doctor-who-cycle-012-senstarg-review-v1.part-*' | wc -l | tr -d ' ')" = "6"
          read -r -a expected_sizes <<< "2000 2000 2000 2000 2000 774"
          read -r -a expected_hashes <<< "577a0f49df0cd0a9903eae0ffe96dc6eeacbdff163ea5ebc1308d3351ff5acc4 4f6c91d58d92ba16af4ce3f41bb0fa743d80a70459687114fcab06cda0cee9b7 5c87ad07ff2158dec7a7285bee6633565992b1a22c0e9bf9036e3feca18a6b2c e71763826b996af24c11336bd13dd6544f3c8f5a85b4343b2eb5c7aef1da3833 d8e6db85603f0814d5acab2b3e3c3a3efbb0284d16d334d486803a9c1e3790a5 12b1607a835b21dc9f6baa066af6886094e4d3b85cca8cddf3f68e86f60c63d9"
          for index in 1 2 3 4 5 6; do
            part=$(printf '.github/review/doctor-who-cycle-012-senstarg-review-v1.part-%02d' "$index")
            offset=$((index-1))
            test "$(wc -c < "$part" | tr -d ' ')" = "${expected_sizes[$offset]}"
            test "$(sha256sum "$part" | awk '{print $1}')" = "${expected_hashes[$offset]}"
          done
          cat .github/review/doctor-who-cycle-012-senstarg-review-v1.part-* > /tmp/senstarg-review-v1.payload.hex
          test "$(wc -c < /tmp/senstarg-review-v1.payload.hex | tr -d ' ')" = "10774"
          test "$(sha256sum /tmp/senstarg-review-v1.payload.hex | awk '{print $1}')" = "a3d66cec40561611c5374043881de42e0f19b148e9fbcccc6003496b61ecbed5"
          python3 - <<'PYHEX'
          from pathlib import Path
          src=Path('/tmp/senstarg-review-v1.payload.hex')
          Path('/tmp/senstarg-review-v1.sh.gz').write_bytes(bytes.fromhex(src.read_text()))
          PYHEX
          test "$(wc -c < /tmp/senstarg-review-v1.sh.gz | tr -d ' ')" = "5387"
          test "$(sha256sum /tmp/senstarg-review-v1.sh.gz | awk '{print $1}')" = "d2c33b40a4bce60ec6d3cf8af394d426fce2c60cc8e338854bcbeb4d2cf1ff21"
          gzip -dc /tmp/senstarg-review-v1.sh.gz > /tmp/senstarg-review-v1.sh
          test "$(wc -c < /tmp/senstarg-review-v1.sh | tr -d ' ')" = "18947"
          test "$(sha256sum /tmp/senstarg-review-v1.sh | awk '{print $1}')" = "d91bd5db4b42551445b6efff93f4b8f468f27e7a25c62290397622678cf6ca1e"
          bash -n /tmp/senstarg-review-v1.sh
          bash /tmp/senstarg-review-v1.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-review-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-senstarg-review-v1
            /tmp/doctor-who-cycle-012-senstarg-review-v1-source
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
