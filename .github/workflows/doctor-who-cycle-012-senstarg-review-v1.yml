name: doctor-who-cycle-012-senstarg-review-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-senstarg-review-v1.yml"
      - ".github/review/doctor-who-cycle-012-senstarg-review-v1.payload.hex"

permissions: {}
concurrency:
  group: doctor-who-cycle-012-senstarg-review-v1
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-senstarg-review-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OUT: /tmp/doctor-who-cycle-012-senstarg-review-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Execute exact independent Senstarg candidate review
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT" /tmp/doctor-who-cycle-012-senstarg-review-v1-source
          cat .github/review/doctor-who-cycle-012-senstarg-review-v1.payload.hex > /tmp/senstarg-review-v1.sh.gz.hex
          test "$(wc -c < /tmp/senstarg-review-v1.sh.gz.hex | tr -d ' ')" = "13470"
          test "$(sha256sum /tmp/senstarg-review-v1.sh.gz.hex | awk '{print $1}')" = "e398c390dcfdfe48fe187e34cb24d6c26e706be68e0ecb7f8368321381f7fe65"
          python3 - <<'PYHEX'
          from pathlib import Path
          Path('/tmp/senstarg-review-v1.sh.gz').write_bytes(bytes.fromhex(Path('/tmp/senstarg-review-v1.sh.gz.hex').read_text()))
          PYHEX
          test "$(wc -c < /tmp/senstarg-review-v1.sh.gz | tr -d ' ')" = "6735"
          test "$(sha256sum /tmp/senstarg-review-v1.sh.gz | awk '{print $1}')" = "2c81cd483221fd0c7968f33e6b4f41436da6520c5dac195a8eb2f4a32e4c2888"
          gzip -dc /tmp/senstarg-review-v1.sh.gz > /tmp/senstarg-review-v1.sh
          test "$(wc -c < /tmp/senstarg-review-v1.sh | tr -d ' ')" = "21993"
          test "$(sha256sum /tmp/senstarg-review-v1.sh | awk '{print $1}')" = "0b2afcd7346b33cf53ca9c1f7690ea83e477b676800ce2994024a76360a168b1"
          cp /tmp/senstarg-review-v1.sh "$OUT/reviewer.sh"
          bash -n /tmp/senstarg-review-v1.sh
          bash -x /tmp/senstarg-review-v1.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-review-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-review-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-senstarg-review-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-senstarg-review-v1
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
