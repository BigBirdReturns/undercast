jobs:
  review:
    name: independently-review-remote-frozen-risik-source-v2
    if: ${{ github.event.head_commit.message == 'Review remote-frozen Star Trek Risik source v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify sealed reviewer and immutable source inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          trigger=.github/recovery/star-trek-risik-source-review-v2/run.trigger
          test "$(sha256sum "$trigger" | awk '{print $1}')" = "e6dd9006a88b2b6297976e44b18ffcb35f2122b2cc2187c1760a6d00d108653f"
          cat .github/recovery/star-trek-risik-source-review-v2/reviewer.py.b64.* | base64 -d > "$REVIEWER"
          test "$(sha256sum "$REVIEWER" | awk '{print $1}')" = "ef19a68cf3297273c2787c0c688d22048d745666a3cecf34416f878e6ea03d0f"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["REVIEWER"])
          text = path.read_text(encoding="utf-8")
          old = '        "rvlimit": "1",\n'
          if text.count(old) != 1:
              raise SystemExit("Risik support-query repair anchor drifted")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          test "$(sha256sum "$REVIE]" | awk '{print $1}')" = "c9e674cecb7b2b49d3d21b380e998f9c1da0e9622e0448a3b24feb8910c40e7f"
          chmod +x "$REVIEWER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["REVIEWER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          rm -rf "$OUT"
          mkdir -p "$OUT/source"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin             "+refs/heads/main:refs/remotes/origin/main"             "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}"             "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"
          test "$(git show -s --format=%s "$EXPECTED_MAIN")" = "$EXPECTED_MESSAGE"
          test "$(git rev-parse "refs/remotes/origin/${CLAIM_BRANCH}")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%T "$CLAIM_COMMIT")" = "$CLAIM_TREE"
          test "$(git show -s --format=%P "$CLAIM_COMMIT")" = "$EXPECTED_MAIN"
          test "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")" = "$SOURCE_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_COMMIT")" = "$SOURCE_TREE"
          test -z "$(git show -s --format=%P "$SOURCE_COMMIT")"

          git archive "refs/remotes/origin/${SOURCE_BRANCH}" "$SOURCE_PREFIX" | tar -x -C "$OUT"
