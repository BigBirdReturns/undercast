name: extract-maryl-helper-by-sha-v2

on:
  push:
    branches:
      - agent/extract-maryl-helper-by-sha-v2

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: 9aa1db3742bd55158bb1def200ca58f0938f6bff
      RESULT_BRANCH: agent/extract-maryl-helper-by-sha-result-v2
      ROOT: transport/extract-maryl-helper-by-sha-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and verify immutable Maryl controller
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/extract-maryl-helper-by-sha-v2
          mkdir -p /tmp/extract-maryl-helper-by-sha-v2
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          : > /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs
          for part in 00 01 02 03 04 05 06 07; do
            git show "${SOURCE_COMMIT}:.github/recovery/star-trek-maryl-cycle-v1/part-${part}.mjs" >> /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs
          done
          node --check /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs
          sha256sum /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs > /tmp/extract-maryl-helper-by-sha-v2/controller.sha256
          grep -nE '^function |^async function |^const cmd|switch \(cmd\)|if \(cmd' /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs > /tmp/extract-maryl-helper-by-sha-v2/function-index.txt || true
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg sha "$(cut -d' ' -f1 /tmp/extract-maryl-helper-by-sha-v2/controller.sha256)" \
            --argjson bytes "$(stat -c %s /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs)" \
            --argjson lines "$(wc -l < /tmp/extract-maryl-helper-by-sha-v2/maryl-controller.mjs | tr -d ' ')" \
            '{version:2,transaction:"EXTRACT-MARYL-HELPER-BY-SHA-V2",source_commit:$source_commit,sha256:$sha,bytes:$bytes,lines:$lines,node_check:"pass"}' \
            > /tmp/extract-maryl-helper-by-sha-v2/result.json
          git config user.name undercast-maryl-controller-extract
          git config user.email maryl-controller-extract@users.noreply.github.com
          git switch --orphan extract-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$ROOT"
          cp -a /tmp/extract-maryl-helper-by-sha-v2/. "$ROOT/"
          git add "$ROOT"
          git commit -m 'Extract immutable Maryl controller by SHA'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
