name: extract-maryl-helper-by-sha-v2

on:
  push:
    branches:
      - agent/extract-maryl-helper-by-sha-v2

permissions:
  contents: write

env:
  SOURCE_COMMIT: 9aa1db3742bd55158bb1def200ca58f0938f6bff
  RESULT_BRANCH: agent/extract-maryl-helper-by-sha-result-v2
  ROOT: /tmp/extract-maryl-helper-by-sha-v2

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract and verify immutable Maryl controller
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          : > "$ROOT/maryl-controller.mjs"
          for part in 00 01 02 03 04 05 06 07; do
            git show "${SOURCE_COMMIT}:.github/recovery/star-trek-maryl-cycle-v1/part-${part}.mjs" >> "$ROOT/maryl-controller.mjs"
          done
          node --check "$ROOT/maryl-controller.mjs"
          sha256sum "$ROOT/maryl-controller.mjs" > "$ROOT/controller.sha256"
          grep -nE '^function |^async function |^const cmd|switch \(cmd\)|if \(cmd' "$ROOT/maryl-controller.mjs" > "$ROOT/function-index.txt" || true
          jq -n \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg sha "$(cut -d' ' -f1 "$ROOT/controller.sha256")" \
            --argjson bytes "$(stat -c %s "$ROOT/maryl-controller.mjs")" \
            --argjson lines "$(wc -l < "$ROOT/maryl-controller.mjs" | tr -d ' ')" \
            '{version:3,transaction:"EXTRACT-MARYL-HELPER-BY-SHA-V2",source_commit:$source_commit,sha256:$sha,bytes:$bytes,lines:$lines,node_check:"pass"}' \
            > "$ROOT/result.json"
      - id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: maryl-controller-exact-v1
          path: /tmp/extract-maryl-helper-by-sha-v2/
          if-no-files-found: error
          retention-days: 7
      - name: Publish controller locator
        shell: bash
        run: |
          set -Eeuo pipefail
          jq \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson artifact_id "${{ steps.artifact.outputs.artifact-id }}" \
            --arg artifact_digest "${{ steps.artifact.outputs.artifact-digest }}" \
            '. + {run_id:$run_id,artifact:{id:$artifact_id,digest:$artifact_digest}}' \
            "$ROOT/result.json" > "$ROOT/result.next.json"
          mv "$ROOT/result.next.json" "$ROOT/result.json"
          (cd "$ROOT" && find . -maxdepth 1 -type f ! -name manifest.sha256 -printf '%P\n' | LC_ALL=C sort | while read -r file; do sha256sum "$file"; done > manifest.sha256 && sha256sum -c manifest.sha256)
          git config user.name undercast-maryl-controller-extract
          git config user.email maryl-controller-extract@users.noreply.github.com
          git switch --orphan extract-result
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p transport/extract-maryl-helper-by-sha-v2
          cp -a "$ROOT"/. transport/extract-maryl-helper-by-sha-v2/
          git add transport/extract-maryl-helper-by-sha-v2
          git commit -m 'Extract immutable Maryl controller by SHA with artifact locator'
          git push --force origin "HEAD:refs/heads/${RESULT_BRANCH}"
