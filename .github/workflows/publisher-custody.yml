name: publisher-custody

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-condition-custody.mjs"
      - "scripts/publisher-handoff-files.mjs"
      - "scripts/publisher-artifact-attempt.mjs"
      - "scripts/publisher-artifact-attempt-fixtures.mjs"
      - "scripts/operational-reliability-ledger.mjs"
      - "scripts/operational-reliability-execute.mjs"
      - "scripts/operational-reliability.mjs"
      - "scripts/operational-workflow-fixtures.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "test/publisher-condition-custody-fixtures.mjs"
      - "test/publisher-handoff-files-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate.mjs"
      - "scripts/gate-fixtures.mjs"
      - "scripts/publication-release.mjs"
      - "scripts/publication.mjs"
      - "scripts/publication-routes.mjs"
      - "scripts/lib/preservation.mjs"
      - "scripts/lib/media-rejections.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-condition-custody.mjs"
      - "scripts/publisher-handoff-files.mjs"
      - "scripts/publisher-artifact-attempt.mjs"
      - "scripts/publisher-artifact-attempt-fixtures.mjs"
      - "scripts/operational-reliability-ledger.mjs"
      - "scripts/operational-reliability-execute.mjs"
      - "scripts/operational-reliability.mjs"
      - "scripts/operational-workflow-fixtures.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "test/publisher-condition-custody-fixtures.mjs"
      - "test/publisher-handoff-files-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate.mjs"
      - "scripts/gate-fixtures.mjs"
      - "scripts/publication-release.mjs"
      - "scripts/publication.mjs"
      - "scripts/publication-routes.mjs"
      - "scripts/lib/preservation.mjs"
      - "scripts/lib/media-rejections.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: publisher-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            package.json
            package-lock.json
            scripts/gate.mjs
            scripts/gate-fixtures.mjs
            scripts/publication-release.mjs
            scripts/publication.mjs
            scripts/publication-routes.mjs
            scripts/lib/preservation.mjs
            scripts/lib/media-rejections.mjs
            scripts/publisher-custody.mjs
            scripts/publisher-condition-custody.mjs
            scripts/publisher-handoff-files.mjs
            scripts/publisher-artifact-attempt.mjs
            scripts/publisher-artifact-attempt-fixtures.mjs
            scripts/operational-reliability-ledger.mjs
            scripts/operational-reliability-execute.mjs
            scripts/operational-reliability.mjs
            scripts/operational-workflow-fixtures.mjs
            test/publisher-custody-fixtures.mjs
            test/publisher-condition-custody-fixtures.mjs
            test/publisher-handoff-files-fixtures.mjs
            data/review/ci-publisher-custody-baseline.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install exact custody parser dependencies
        run: npm ci
      - name: Verify canonical gate import closure under publisher sparse checkout
        run: node --input-type=module -e "await import('./scripts/gate.mjs')"
      - name: Verify reliability ledger import closure under publisher sparse checkout
        run: node --input-type=module -e "await import('./scripts/operational-reliability-ledger.mjs')"
      - name: Run canonical gate fixtures with publisher custody
        run: node scripts/gate-fixtures.mjs
      - name: Verify trusted operational publisher workflow split
        run: node scripts/operational-workflow-fixtures.mjs
