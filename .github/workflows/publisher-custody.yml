name: publisher-custody

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate-fixtures.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate-fixtures.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate publisher custody fixtures
        run: node test/publisher-custody-fixtures.mjs
      - name: Refuse PR-head write authority and legacy drift
        run: node scripts/publisher-custody.mjs check-workflows
