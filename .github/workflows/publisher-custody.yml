name: publisher-custody

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-condition-custody.mjs"
      - "scripts/publisher-handoff-files.mjs"
      - "scripts/operational-workflow-fixtures.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "test/publisher-condition-custody-fixtures.mjs"
      - "test/publisher-handoff-files-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate-fixtures.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/publisher-custody.mjs"
      - "scripts/publisher-condition-custody.mjs"
      - "scripts/publisher-handoff-files.mjs"
      - "scripts/operational-workflow-fixtures.mjs"
      - "test/publisher-custody-fixtures.mjs"
      - "test/publisher-condition-custody-fixtures.mjs"
      - "test/publisher-handoff-files-fixtures.mjs"
      - "data/review/ci-publisher-custody-baseline.json"
      - "docs/PUBLISHER-CUSTODY.md"
      - "scripts/gate-fixtures.mjs"

permissions:
  contents: read

concurrency:
  group: publisher-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            scripts/gate.mjs
            scripts/gate-fixtures.mjs
            scripts/publisher-custody.mjs
            scripts/publisher-condition-custody.mjs
            scripts/publisher-handoff-files.mjs
            scripts/operational-workflow-fixtures.mjs
            test/publisher-custody-fixtures.mjs
            test/publisher-condition-custody-fixtures.mjs
            test/publisher-handoff-files-fixtures.mjs
            data/review/ci-publisher-custody-baseline.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run canonical gate fixtures with publisher custody
        run: node scripts/gate-fixtures.mjs
      - name: Verify trusted operational publisher workflow split
        run: node scripts/operational-workflow-fixtures.mjs
