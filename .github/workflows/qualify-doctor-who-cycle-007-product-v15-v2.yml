name: qualify-doctor-who-cycle-007-product-v15-v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qualify-doctor-who-cycle-007-product-v15-v2.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: qualify-doctor-who-cycle-007-product-v15-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXACT_MAIN: c57a1f28b3f1998349fb2f87f847f6d240a43a3d
  QUALIFIER_BRANCH: agent/doctor-who-cycle-007-v15-product-qualification-v2
  PRODUCT_BRANCH: agent/doctor-who-cycle-007-kragar-product-v14
  PRODUCT_PR: "492"
  PRODUCT_HEAD: aa6138e707fed8562e69a747bfabc2a64dccefb2
  PRODUCT_TREE: 516cc43dea4eaf5635e779b92d70cc0613aa393d
  ORIGINAL_PRODUCT_HEAD: 266b924a604889524368bba4598bdae0e562fbf1
  ORIGINAL_PRODUCT_TREE: 671c09f8edc8552d9a3d552f42eb6a05211fbe33
  FINALIZER_RUN: "31072356959"
  FINALIZER_JOB: "92522724079"
  FINALIZER_ARTIFACT_ID: "8956210712"
  FINALIZER_ARTIFACT_NAME: doctor-who-cycle-007-finalization-v14-31072356959
  FINALIZER_ARTIFACT_SHA256: 5aff21a35899ff35f0ee18dfeaaad74d51a4e4addcd0f70b53d74c0fefd23879
  FINALIZER_HANDOFF_SHA256: 18e1c3352bad9b881d879cbb9c2d900479dceff50e58e1461ceccc3bea490c04
  MEDIA_ASSET_SHA256: f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409
  BASE_MEDIA_SEARCH_BLOB: 39c70aad4ae090b4a500c7dbfd525fe8a25930e8
  BASE_MEDIA_SEARCH_JOURNAL_BLOB: 17677703d71fe0f054887da6e2c8d9328dbab717
  SELF: .github/workflows/qualify-doctor-who-cycle-007-product-v15-v2.yml
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  ROOT: /tmp/doctor-who-cycle-007-product-v15-v2
  OUT: /tmp/doctor-who-cycle-007-product-v15-v2/out
  FINALIZATION: /tmp/doctor-who-cycle-007-product-v15-v2/finalization
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/undercast' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/doctor-who-cycle-007-v15-product-qualification-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind one-path read-only carrier and exact current-main product
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT" "$OUT" "$FINALIZATION"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$HEAD_BRANCH" = "$QUALIFIER_BRANCH"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$SELF" > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$PRODUCT_HEAD"
          test "$(git show -s --format=%P "$PRODUCT_HEAD")" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN".."$PRODUCT_HEAD")" = "1"
          test "$(git merge-base "$EXACT_MAIN" "$PRODUCT_HEAD")" = "$EXACT_MAIN"
          test "$(git rev-parse "${PRODUCT_HEAD}^{tree}")" = "$PRODUCT_TREE"

          cat <<'PATHS' | LC_ALL=C sort > "$OUT/expected-product-paths.txt"
          CREDITS.md
          data/AUTOPILOT.json
          data/CENSUS-COVERAGE.json
          data/CENSUS-FERENGI-TEST.json
          data/CENSUS-GAPS.json
          data/CENSUS-SUMMARY.json
          data/ESTATE-REGISTRY.json
          data/MEDIA-AUDIT.json
          data/SOURCES.json
          data/WATERLINE-STATE.json
          data/archive.json
          data/entities.json
          data/index.json
          data/journal/autopilot.jsonl
          data/journal/candidates.jsonl
          data/journal/media-audit.jsonl
          data/journal/waterline.jsonl
          data/media-live.json
          data/media-manifest.json
          data/quality.json
          data/review/adapter-sdk/BASELINE.json
          data/review/adapter-sdk/doctor-who-cycle-007-kragar.json
          data/search/2.json
          data/search/a.json
          data/search/b.json
          data/search/c.json
          data/search/d.json
          data/search/e.json
          data/search/h.json
          data/search/i.json
          data/search/j.json
          data/search/k.json
          data/search/manifest.json
          data/search/n.json
          data/search/p.json
          data/search/r.json
          data/search/s.json
          data/search/t.json
          data/search/w.json
          data/shard-manifest.json
          data/shards/0001.json
          data/species.json
          data/specimens.json
          docs/AUTOPILOT.md
          images/uc-1352-still.jpg
          package.json
          scripts/doctor-who-cycle-007.mjs
          sitemap.xml
          tests/rendered/site.spec.mjs
          PATHS
          git diff --name-only "$EXACT_MAIN"..."$PRODUCT_HEAD" | LC_ALL=C sort > "$OUT/actual-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/actual-product-paths.txt"
          test "$(wc -l < "$OUT/actual-product-paths.txt")" = "49"
          ! grep -E '^(\.github/workflows/|tmp/)' "$OUT/actual-product-paths.txt" >/dev/null

          test "$(git rev-parse "${EXACT_MAIN}:data/MEDIA-SEARCH-LATEST.json")" = "$BASE_MEDIA_SEARCH_BLOB"
          test "$(git rev-parse "${PRODUCT_HEAD}:data/MEDIA-SEARCH-LATEST.json")" = "$BASE_MEDIA_SEARCH_BLOB"
          test "$(git rev-parse "${EXACT_MAIN}:data/journal/media-search.jsonl")" = "$BASE_MEDIA_SEARCH_JOURNAL_BLOB"
          test "$(git rev-parse "${PRODUCT_HEAD}:data/journal/media-search.jsonl")" = "$BASE_MEDIA_SEARCH_JOURNAL_BLOB"

          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" > "$OUT/product-pr.json"
          jq -e --arg head "$PRODUCT_HEAD" --arg base "$EXACT_MAIN" --arg branch "$PRODUCT_BRANCH" \
            '.state=="open" and .merged==false and .draft==true and .head.sha==$head and .head.ref==$branch and .base.ref=="main" and .base.sha==$base' \
            "$OUT/product-pr.json" >/dev/null

      - name: Bind successful V14 finalizer run, job, and artifact
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FINALIZER_RUN}" > "$OUT/finalizer-run.json"
          jq -e --arg head "5164bfc686a098c479a5fe578dda2ed75271e274" \
            '.status=="completed" and .conclusion=="success" and .head_sha==$head and .event=="pull_request"' \
            "$OUT/finalizer-run.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FINALIZER_RUN}/jobs?per_page=100" > "$OUT/finalizer-jobs.json"
          jq -e --argjson job "$FINALIZER_JOB" \
            '.jobs | length==1 and .[0].id==$job and .[0].name=="finalize" and .[0].status=="completed" and .[0].conclusion=="success" and all(.[0].steps[]; .conclusion=="success" or .conclusion=="skipped")' \
            "$OUT/finalizer-jobs.json" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FINALIZER_RUN}/artifacts?per_page=100" > "$OUT/finalizer-artifacts.json"
          jq -e --argjson id "$FINALIZER_ARTIFACT_ID" --arg name "$FINALIZER_ARTIFACT_NAME" --arg digest "sha256:${FINALIZER_ARTIFACT_SHA256}" \
            '.artifacts | length==1 and .[0].id==$id and .[0].name==$name and .[0].digest==$digest and .[0].expired==false' \
            "$OUT/finalizer-artifacts.json" >/dev/null

      - name: Download immutable V14 finalization custody
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FINALIZER_ARTIFACT_NAME }}
          path: ${{ env.FINALIZATION }}
          github-token: ${{ github.token }}
          repository: BigBirdReturns/undercast
          run-id: ${{ env.FINALIZER_RUN }}

      - name: Rehash finalizer custody and every live product member
        shell: bash
        run: |
          set -euo pipefail
          handoff="$(find "$FINALIZATION" -type f -name publisher-handoff.json -print -quit)"
          final_paths="$(find "$FINALIZATION" -type f -name expected-final-paths.txt -print -quit)"
          final_gate="$(find "$FINALIZATION" -type f -name final-gate.log -print -quit)"
          final_gate_sha="$(find "$FINALIZATION" -type f -name final-gate.sha256 -print -quit)"
          test -n "$handoff" -a -n "$final_paths" -a -n "$final_gate" -a -n "$final_gate_sha"
          test "$(jq -r '.receipt_sha256' "$handoff")" = "$FINALIZER_HANDOFF_SHA256"
          test "$(jq '.files | length' "$handoff")" = "49"
          test "$(sha256sum "$final_gate" | awk '{print $1}')" = "$(cat "$final_gate_sha")"
          cmp "$OUT/expected-product-paths.txt" "$final_paths"
          cp "$handoff" "$OUT/publisher-handoff.json"
          cp "$final_gate_sha" "$OUT/finalizer-gate.sha256"

          git checkout --detach "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"

          HANDOFF="$handoff" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const handoff = JSON.parse(fs.readFileSync(process.env.HANDOFF, 'utf8'));
          for (const [path, expected] of Object.entries(handoff.files)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
            if (actual !== expected) throw new Error(`product member drifted: ${path}`);
          }
          NODE
          test "$(sha256sum images/uc-1352-still.jpg | awk '{print $1}')" = "$MEDIA_ASSET_SHA256"
          git diff --check "$EXACT_MAIN"..."$PRODUCT_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install exact qualification runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          identify -version | head -1 | tee "$OUT/imagemagick-version.txt"

      - name: Verify structured Kragar task, lease, wall, media, and chronology custody
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const records = JSON.parse(fs.readFileSync('data/specimens.json', 'utf8'));
          const row = records.find((item) => item.id === 'UC-1352');
          assert.ok(row, 'UC-1352 missing');
          assert.equal(row.actor, 'Dan Starkey');
          assert.equal(row.character, 'Kragar');
          assert.equal(row.universe, 'Doctor Who');
          assert.equal(row.kind, 'face');
          assert.equal(row.still?.src, 'images/uc-1352-still.jpg');
          assert.equal(row.portrait, null);

          const receipt = JSON.parse(fs.readFileSync('data/review/adapter-sdk/doctor-who-cycle-007-kragar.json', 'utf8'));
          assert.equal(receipt.task?.id, 'ap_ffea809b980b468b33fa462c');
          assert.equal(receipt.task?.performer, 'Dan Starkey');
          assert.equal(receipt.task?.character, 'Kragar');
          assert.equal(receipt.task?.adjudicated_kind, 'face');
          assert.equal(receipt.task?.adjudicated_performance_mode, 'physical-prosthetic');
          assert.equal(receipt.lease?.id, 'lease_acb2309e7fb477769749751c');
          assert.equal(receipt.lease?.outcome, 'completed');
          assert.equal(receipt.canonical?.wall_id, 'UC-1352');
          assert.equal(receipt.media?.statuses?.portrait, 'absent');
          assert.equal(receipt.media?.statuses?.still, 'verified');
          assert.equal(receipt.boundary?.still_sha256, 'f6f32eb1c51445838ba27ae449548d9bb581b04bb2b321a5789f7f285872d409');
          assert.equal(receipt.boundary?.generic_sontaran_image_used, false);
          assert.equal(receipt.boundary?.existing_dan_starkey_portrait_duplicated, false);

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.ok(packageJson.scripts?.['doctor-who:cycle-007:check'], 'cycle-007 package gate missing');
          NODE

          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/cycle-006-chronology.log"
          npm run doctor-who:cycle-007:check | tee "$OUT/cycle-007.log"
          node scripts/publisher-custody.mjs check-workflows | tee "$OUT/publisher-custody.log"
          node scripts/publisher-custody-or-guard.mjs --self-test | tee "$OUT/publisher-or-guard-self-test.log"
          node scripts/publisher-custody-or-guard.mjs | tee "$OUT/publisher-or-guard.log"

      - name: Run complete exact-head repository and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git status --porcelain)"
          sha256sum "$OUT/complete-gate.log" | awk '{print $1}' > "$OUT/complete-gate.sha256"

      - name: Rebind live main, product ref, and product PR after the gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/${PRODUCT_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${PRODUCT_BRANCH})" = "$PRODUCT_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PRODUCT_PR}" > "$OUT/product-pr-after-gate.json"
          jq -e --arg head "$PRODUCT_HEAD" --arg base "$EXACT_MAIN" \
            '.state=="open" and .merged==false and .draft==true and .head.sha==$head and .base.sha==$base' \
            "$OUT/product-pr-after-gate.json" >/dev/null

      - name: Seal self-hashed V15 V2 qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name=="qualify") | .id' | head -1)"
          test -n "$job_id"
          gate_sha="$(cat "$OUT/complete-gate.sha256")"
          jq -n \
            --arg transaction "DOCTOR-WHO-CYCLE-007-KRAGAR-CURRENT-MAIN-QUALIFICATION-V15-V2" \
            --arg verdict "approved-for-merge-after-unchanged-head-and-green-checks" \
            --arg main "$EXACT_MAIN" \
            --arg qualifier "$HEAD_SHA" \
            --arg product "$PRODUCT_HEAD" \
            --arg tree "$PRODUCT_TREE" \
            --arg original_product "$ORIGINAL_PRODUCT_HEAD" \
            --arg original_tree "$ORIGINAL_PRODUCT_TREE" \
            --argjson product_pr "$PRODUCT_PR" \
            --argjson run "$GITHUB_RUN_ID" \
            --argjson job "$job_id" \
            --argjson finalizer_run "$FINALIZER_RUN" \
            --argjson finalizer_job "$FINALIZER_JOB" \
            --argjson finalizer_artifact "$FINALIZER_ARTIFACT_ID" \
            --arg finalizer_artifact_sha256 "$FINALIZER_ARTIFACT_SHA256" \
            --arg finalizer_handoff_sha256 "$FINALIZER_HANDOFF_SHA256" \
            --arg gate_sha256 "$gate_sha" \
            --arg media_sha256 "$MEDIA_ASSET_SHA256" \
            '{
              schema_version: 1,
              transaction: $transaction,
              verdict: $verdict,
              exact_main: $main,
              qualifier_head: $qualifier,
              product_pr: $product_pr,
              product_head: $product,
              product_tree: $tree,
              original_published_head: $original_product,
              original_published_tree: $original_tree,
              product_paths: 49,
              workflow_paths: 0,
              transport_paths: 0,
              run_id: $run,
              job_id: $job,
              finalizer: {
                run_id: $finalizer_run,
                job_id: $finalizer_job,
                artifact_id: $finalizer_artifact,
                artifact_sha256: $finalizer_artifact_sha256,
                handoff_sha256: $finalizer_handoff_sha256
              },
              complete_gate_sha256: $gate_sha256,
              media_asset_sha256: $media_sha256,
              checks: {
                finalizer_custody_rehashed: true,
                all_product_members_rehashed: true,
                current_main_observation_blobs_preserved: true,
                structured_task_modality_custody_passed: true,
                cycle_006_chronology_passed: true,
                cycle_007_checker_passed: true,
                publisher_custody_passed: true,
                complete_repository_and_rendered_gate_passed: true,
                live_refs_rebound_after_gate: true
              },
              boundary: {
                repository_written: false,
                product_mutated: false,
                merge_performed: false,
                eighth_lease_issued: false,
                outside_human_dependency: false
              }
            }' > "$OUT/product-qualification.json"
          sha256sum "$OUT/product-qualification.json" | awk '{print $1}' > "$OUT/product-qualification.sha256"
          test "$(sha256sum "$OUT/product-qualification.json" | awk '{print $1}')" = "$(cat "$OUT/product-qualification.sha256")"

      - name: Upload immutable V15 V2 product qualification
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-007-product-v15-v2-qualification-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
