name: doctor-who-cycle-011-rastel-exact-local-writer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-exact-local-writer-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-exact-local-writer-v1
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-exact-local-writer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      canonical_commit: ${{ steps.construct.outputs.canonical_commit }}
      carrier_head: ${{ steps.bind.outputs.carrier_head }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      ORIGINAL_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-exact-local-writer-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-exact-local-writer-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1
      SOURCE_RUN: "31351009242"
      SOURCE_VERIFY_JOB: "93341697741"
      SOURCE_WRITE_JOB: "93342073975"
      SOURCE_ARTIFACT: "9048990139"
      SOURCE_ARTIFACT_DIGEST: "sha256:34a27c1823dbcea8745115ed7d873f9b1bafec99c7dc74247204020468c68c9d"
      SOURCE_WORKFLOW: doctor-who-cycle-011-rastel-trusted-publisher-v2
      PUBLICATION_IDENTITY: fb292e861040e665d778434c27b657c65e80c7b31d886d48f4b7ce26b9ee4a10
      API_ORPHAN_COMMIT: 276e3a737318bd2487c0c641f038a71e0543cf55
      EXPECTED_CANONICAL: 1c92734e501ed4667ac86c4203a6dbac282392ee
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      PRODUCT_TAR_SHA256: fab2ca6b479e6bd62596c9cc73ed75f18a21f91b0d3287a6fcf6a4a059c1f475
      MANIFEST_SHA256: a22f75f17cf1ad448f0e0160c5899fb2204b1c8156102ce6e880fafab45e7ece
      APPROVAL_IDENTITY: 44423827f8a95fed286ae381cfc570575ba1067daa00c312efeebd8bb1f68933
      HANDOFF_IDENTITY: fc7f596318c9753bff53406b718620574214835b3c1ccea892e43fd01bdd66d7
      CYCLE_ID: cycle_74cdc938b028a932a766d209
      OLD_SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      OLD_SELF_V2: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      COMMIT_MESSAGE: "Doctor Who: finalize cycle 011 Rastel"
      COMMIT_NAME: undercast-cycle-011-publisher
      COMMIT_EMAIL: cycle-011-publisher@users.noreply.github.com
      COMMIT_DATE: 2026-08-10T01:10:00Z

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact carrier and successful V2 handoff
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,packet,files,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$ORIGINAL_MAIN")" = "$ORIGINAL_TREE"
          git diff --name-status "$ORIGINAL_MAIN" "$EXACT_MAIN" | LC_ALL=C sort > "$OUT/logs/installed-paths.tsv"
          printf 'A\t%s\nA\t%s\n' "$OLD_SELF" "$OLD_SELF_V2" | LC_ALL=C sort > "$OUT/logs/expected-installed-paths.tsv"
          cmp "$OUT/logs/installed-paths.tsv" "$OUT/logs/expected-installed-paths.tsv"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/api/source-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_VERIFY_JOB" > "$OUT/api/source-verify-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$SOURCE_WRITE_JOB" > "$OUT/api/source-write-job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > "$OUT/api/source-artifact.json"
          CARRIER_HEAD="$head" CARRIER_PR="$pr" python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'; load=lambda name:json.loads((root/name).read_text())
          pr=load('carrier-pr.json'); run=load('source-run.json'); verify=load('source-verify-job.json'); write=load('source-write-job.json'); artifact=load('source-artifact.json')
          assert pr['number']==int(os.environ['CARRIER_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['EXACT_MAIN'] and pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['CARRIER_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['name']==os.environ['SOURCE_WORKFLOW'] and run['event']=='workflow_run'
          assert run['head_sha']==os.environ['EXACT_MAIN'] and run['status']=='completed' and run['conclusion']=='failure'
          assert verify['id']==int(os.environ['SOURCE_VERIFY_JOB']) and verify['run_id']==int(os.environ['SOURCE_RUN']) and verify['name']=='verify' and verify['status']=='completed' and verify['conclusion']=='success'
          assert write['id']==int(os.environ['SOURCE_WRITE_JOB']) and write['run_id']==int(os.environ['SOURCE_RUN']) and write['name']=='write' and write['status']=='completed' and write['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in write['steps']}
          assert steps['Rebind exact same-run handoff and construct remote Git objects']==('completed','failure')
          assert steps['Non-forced canonical update and terminal write receipt']==('completed','skipped')
          assert artifact['id']==int(os.environ['SOURCE_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['SOURCE_ARTIFACT_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and artifact['workflow_run']['head_sha']==os.environ['EXACT_MAIN']
          PY
          echo "carrier_head=$head" >> "$GITHUB_OUTPUT"
          printf 'CARRIER_HEAD=%s\nCARRIER_PR=%s\n' "$head" "$pr" >> "$GITHUB_ENV"

      - name: Authenticate exact canonical handoff
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" > "$OUT/source/handoff.zip"
          test "$(sha256sum "$OUT/source/handoff.zip" | awk '{print $1}')" = "${SOURCE_ARTIFACT_DIGEST#sha256:}"
          ZIP="$OUT/source/handoff.zip" TARGET="$OUT/source/handoff" python3 - <<'PY'
          import hashlib,json,os,stat,tarfile,zipfile
          from pathlib import Path,PurePosixPath
          z=Path(os.environ['ZIP']); target=Path(os.environ['TARGET']); target.mkdir(parents=True,exist_ok=True)
          sha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(z) as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts and '\\' not in info.filename
                  mode=(info.external_attr >> 16) & 0xFFFF; assert stat.S_IFMT(mode) != stat.S_IFLNK
                  if info.is_dir(): continue
                  out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file() and sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          publication=json.loads((target/'publication.json').read_text()); identity=publication.pop('identity')
          assert identity==os.environ['PUBLICATION_IDENTITY'] and sha(json.dumps(publication,sort_keys=True,separators=(',',':')).encode())==identity
          publication['identity']=identity
          assert publication['status']=='cycle-011-rastel-canonical-publication-authorized-v2'
          assert publication['main']=={'canonical':os.environ['EXPECTED_CANONICAL'],'installed':os.environ['EXACT_MAIN'],'original':os.environ['ORIGINAL_MAIN']}
          assert publication['product']['tree']==os.environ['PRODUCT_TREE'] and publication['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert publication['product']['tar_sha256']==os.environ['PRODUCT_TAR_SHA256'] and publication['product']['manifest_sha256']==os.environ['MANIFEST_SHA256']
          assert publication['source']['approval_identity']==os.environ['APPROVAL_IDENTITY'] and publication['source']['handoff_identity']==os.environ['HANDOFF_IDENTITY']
          assert publication['cycle']['id']==os.environ['CYCLE_ID'] and all(publication['gates'].values()) and not any(publication['boundary'].values())
          assert publication['transport']['deleted']==[os.environ['OLD_SELF'],os.environ['OLD_SELF_V2']]
          assert sha((target/'canonical-product.tar').read_bytes())==os.environ['PRODUCT_TAR_SHA256']
          assert sha((target/'canonical-file-manifest.json').read_bytes())==os.environ['MANIFEST_SHA256']
          manifest=json.loads((target/'canonical-file-manifest.json').read_text()); rows=manifest['files']
          assert manifest['version']==1 and len(rows)==int(os.environ['PRODUCT_PATHS']) and len({row['path'] for row in rows})==len(rows)
          with tarfile.open(target/'canonical-product.tar','r:') as archive:
              infos=[row for row in archive.getmembers() if row.isfile()]
              names={PurePosixPath(row.name).as_posix() for row in infos}
              assert len(infos)==len(rows) and names=={row['path'] for row in rows}
          (Path(os.environ['OUT'])/'receipt/source-publication.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n')
          PY

      - name: Construct and bundle exact local canonical commit
        id: construct
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$OUT/exact.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXACT_MAIN"
          ROOT="$OUT" HANDOFF="$OUT/source/handoff" python3 - <<'PY'
          import hashlib,json,os,stat,subprocess,tarfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['ROOT']); handoff=Path(os.environ['HANDOFF']); sha=lambda data:hashlib.sha256(data).hexdigest()
          manifest=json.loads((handoff/'canonical-file-manifest.json').read_text()); rows=manifest['files']
          with tarfile.open(handoff/'canonical-product.tar','r:') as archive:
              infos={PurePosixPath(info.name).as_posix():info for info in archive.getmembers() if info.isfile()}
              for row in rows:
                  path=row['path']; info=infos[path]; data=archive.extractfile(info).read()
                  assert len(data)==int(row['bytes']) and sha(data)==row['sha256']
                  assert (info.mode & 0o777)==(int(str(row['mode']),8) & 0o777)
                  out=root/'files'/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                  blob=subprocess.check_output(['git','hash-object','-w','--stdin'],input=data).decode().strip()
                  assert blob==row['blob']
                  subprocess.run(['git','update-index','--add','--cacheinfo',f"{row['mode']},{blob},{path}"],check=True)
          subprocess.run(['git','update-index','--force-remove','--',os.environ['OLD_SELF'],os.environ['OLD_SELF_V2']],check=True)
          PY
          tree="$(git write-tree)"
          test "$tree" = "$PRODUCT_TREE"
          export GIT_AUTHOR_NAME="$COMMIT_NAME" GIT_AUTHOR_EMAIL="$COMMIT_EMAIL" GIT_AUTHOR_DATE="$COMMIT_DATE"
          export GIT_COMMITTER_NAME="$COMMIT_NAME" GIT_COMMITTER_EMAIL="$COMMIT_EMAIL" GIT_COMMITTER_DATE="$COMMIT_DATE"
          canonical="$(printf '%s\n' "$COMMIT_MESSAGE" | git commit-tree "$tree" -p "$EXACT_MAIN")"
          test "$canonical" = "$EXPECTED_CANONICAL"
          test "$(git show -s --format=%P "$canonical")" = "$EXACT_MAIN"
          test "$(git show -s --format=%T "$canonical")" = "$PRODUCT_TREE"
          git cat-file -p "$canonical" > "$OUT/packet/canonical-commit.txt"
          git diff --name-status "$EXACT_MAIN" "$canonical" > "$OUT/logs/installed-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/installed-to-canonical.tsv" | tr -d ' ')" = 51
          test "$(awk -v a="$OLD_SELF" -v b="$OLD_SELF_V2" '$1=="D" && ($2==a || $2==b) {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 2
          test "$(awk '$1=="D" {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 2
          git diff --name-status "$ORIGINAL_MAIN" "$canonical" > "$OUT/logs/original-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/original-to-canonical.tsv" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(awk '$1=="D" {print}' "$OUT/logs/original-to-canonical.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/original-to-canonical.tsv")"
          git update-ref refs/qualify/cycle-011-rastel-canonical "$canonical"
          git bundle create "$OUT/packet/canonical.bundle" refs/qualify/cycle-011-rastel-canonical ^"$EXACT_MAIN"
          git bundle verify "$OUT/packet/canonical.bundle" | tee "$OUT/logs/bundle-verify.log"
          git bundle list-heads "$OUT/packet/canonical.bundle" | tee "$OUT/logs/bundle-heads.txt"
          grep -F "$EXPECTED_CANONICAL refs/qualify/cycle-011-rastel-canonical" "$OUT/logs/bundle-heads.txt" >/dev/null
          git diff --binary "$EXACT_MAIN" "$canonical" > "$OUT/packet/canonical.patch"
          cp "$OUT/source/handoff/canonical-file-manifest.json" "$OUT/packet/canonical-file-manifest.json"
          cp "$OUT/receipt/source-publication.json" "$OUT/packet/source-publication.json"
          CANONICAL="$canonical" TREE="$tree" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt={'status':'cycle-011-rastel-exact-local-canonical-commit-qualified-v1','version':1,'carrier':{'pr':int(os.environ['CARRIER_PR']),'head':os.environ['CARRIER_HEAD'],'base':os.environ['EXACT_MAIN']},'source':{'publisher_run':int(os.environ['SOURCE_RUN']),'verify_job':int(os.environ['SOURCE_VERIFY_JOB']),'failed_api_writer_job':int(os.environ['SOURCE_WRITE_JOB']),'handoff_artifact':int(os.environ['SOURCE_ARTIFACT']),'handoff_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],'publication_identity':os.environ['PUBLICATION_IDENTITY'],'api_orphan_commit':os.environ['API_ORPHAN_COMMIT']},'canonical':{'parent':os.environ['EXACT_MAIN'],'commit':os.environ['CANONICAL'],'tree':os.environ['TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'message':os.environ['COMMIT_MESSAGE'],'name':os.environ['COMMIT_NAME'],'email':os.environ['COMMIT_EMAIL'],'date':os.environ['COMMIT_DATE']},'cycle':{'id':os.environ['CYCLE_ID']},'artifacts':{'bundle_sha256':sha((root/'packet/canonical.bundle').read_bytes()),'patch_sha256':sha((root/'packet/canonical.patch').read_bytes()),'manifest_sha256':sha((root/'packet/canonical-file-manifest.json').read_bytes()),'commit_text_sha256':sha((root/'packet/canonical-commit.txt').read_bytes())},'gates':{'source_verify_success':True,'source_api_writer_failed_before_ref_update':True,'handoff_authenticated':True,'publication_identity':True,'product_tree':True,'exact_local_commit':True,'installed_diff_51':True,'publisher_deletions_2':True,'permanent_diff_49':True,'workflow_free_product':True,'thin_bundle_verified':True},'boundary':{'repository_write':False,'canonical_mutation':False,'force_update':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'packet/qualification.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          echo "canonical_commit=$canonical" >> "$GITHUB_OUTPUT"
          printf 'CANONICAL_COMMIT=%s\n' "$canonical" >> "$GITHUB_ENV"

      - name: Seal exact local-write packet
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT/packet" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/packet/$rel" | sed "s#  $OUT/packet/#  #"; done > "$OUT/packet/SHA256SUMS.pre"
          sha256sum "$OUT/packet/SHA256SUMS.pre" | sed "s#  $OUT/packet/#  #" > "$OUT/packet/SHA256SUMS"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'packet'; pre=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(pre.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              digest,name=raw.split(None,1); path=root/name.lstrip('*')
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==digest
          PY
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-exact-local-writer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1/packet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-exact-local-writer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  write:
    needs: qualify
    if: needs.qualify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: fbeb6646b555a13b3620b6efa0e1b5d084174e4a
      ORIGINAL_MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      EXPECTED_CANONICAL: ${{ needs.qualify.outputs.canonical_commit }}
      CARRIER_HEAD: ${{ needs.qualify.outputs.carrier_head }}
      ARTIFACT_ID: ${{ needs.qualify.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.qualify.outputs.artifact_digest }}
      PRODUCT_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      PRODUCT_PATHS: "49"
      OLD_SELF: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v1.yml
      OLD_SELF_V2: .github/workflows/doctor-who-cycle-011-rastel-trusted-publisher-v2.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1-write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_MAIN }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.ARTIFACT_ID }}
          path: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1-write/packet
          merge-multiple: true

      - name: Reauthenticate exact local commit bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"/{api,receipt,logs}
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$OUT/api/artifact.json"
          expected_digest="$ARTIFACT_DIGEST"
          case "$expected_digest" in sha256:*) ;; *) expected_digest="sha256:$expected_digest" ;; esac
          jq -e --arg digest "$expected_digest" --arg head "$CARRIER_HEAD" '.id==(env.ARTIFACT_ID|tonumber) and .expired==false and .digest==$digest and .workflow_run.id==(env.GITHUB_RUN_ID|tonumber) and .workflow_run.head_sha==$head' "$OUT/api/artifact.json" >/dev/null
          root="$OUT/packet"; pre="$root/SHA256SUMS.pre"; sealed="$root/SHA256SUMS"
          test "$(sha256sum "$pre" | awk '{print $1}')" = "$(awk '{print $1}' "$sealed")"
          while read -r digest name; do test "$(sha256sum "$root/${name#\*}" | awk '{print $1}')" = "$digest"; done < "$pre"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'packet'; sha=lambda data:hashlib.sha256(data).hexdigest()
          receipt=json.loads((root/'qualification.json').read_text()); identity=receipt.pop('identity')
          assert sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())==identity
          receipt['identity']=identity
          assert receipt['status']=='cycle-011-rastel-exact-local-canonical-commit-qualified-v1'
          assert receipt['carrier']['head']==os.environ['CARRIER_HEAD'] and receipt['carrier']['base']==os.environ['EXACT_MAIN']
          assert receipt['canonical']['commit']==os.environ['EXPECTED_CANONICAL'] and receipt['canonical']['parent']==os.environ['EXACT_MAIN'] and receipt['canonical']['tree']==os.environ['PRODUCT_TREE'] and receipt['canonical']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert all(receipt['gates'].values()) and not any(receipt['boundary'].values())
          assert sha((root/'canonical.bundle').read_bytes())==receipt['artifacts']['bundle_sha256']
          PY
          git bundle verify "$OUT/packet/canonical.bundle" | tee "$OUT/logs/bundle-verify.log"
          git bundle list-heads "$OUT/packet/canonical.bundle" | tee "$OUT/logs/bundle-heads.txt"
          grep -F "$EXPECTED_CANONICAL refs/qualify/cycle-011-rastel-canonical" "$OUT/logs/bundle-heads.txt" >/dev/null
          git fetch --no-tags "$OUT/packet/canonical.bundle" refs/qualify/cycle-011-rastel-canonical:refs/exact/cycle-011-rastel-canonical
          test "$(git rev-parse refs/exact/cycle-011-rastel-canonical)" = "$EXPECTED_CANONICAL"
          test "$(git show -s --format=%P "$EXPECTED_CANONICAL")" = "$EXACT_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_CANONICAL")" = "$PRODUCT_TREE"
          git diff --name-status "$EXACT_MAIN" "$EXPECTED_CANONICAL" > "$OUT/logs/installed-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/installed-to-canonical.tsv" | tr -d ' ')" = 51
          test "$(awk -v a="$OLD_SELF" -v b="$OLD_SELF_V2" '$1=="D" && ($2==a || $2==b) {n++} END {print n+0}' "$OUT/logs/installed-to-canonical.tsv")" = 2
          git diff --name-status "$ORIGINAL_MAIN" "$EXPECTED_CANONICAL" > "$OUT/logs/original-to-canonical.tsv"
          test "$(wc -l < "$OUT/logs/original-to-canonical.tsv" | tr -d ' ')" = "$PRODUCT_PATHS"
          test -z "$(awk '$1=="D" {print}' "$OUT/logs/original-to-canonical.tsv")"
          test -z "$(awk '$2 ~ /^\.github\/workflows\// {print}' "$OUT/logs/original-to-canonical.tsv")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"

      - name: Ordinary non-forced push of exact canonical commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P "$EXPECTED_CANONICAL")" = "$EXACT_MAIN"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          git remote add exact-publisher "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --no-verify exact-publisher "$EXPECTED_CANONICAL:refs/heads/main" 2>&1 | tee "$OUT/logs/push.log"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_CANONICAL"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_CANONICAL" --jq '.tree.sha')" = "$PRODUCT_TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_CANONICAL" --jq '.parents | length')" = 1
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_CANONICAL" --jq '.parents[0].sha')" = "$EXACT_MAIN"
          for path in "$OLD_SELF" "$OLD_SELF_V2"; do
            if gh api "/repos/$GITHUB_REPOSITORY/contents/$path?ref=$EXPECTED_CANONICAL" >/dev/null 2>&1; then
              echo "publisher transport survived canonical tree: $path" >&2
              exit 1
            fi
          done
          gh api "/repos/$GITHUB_REPOSITORY/contents/scripts/doctor-who-cycle-011.mjs?ref=$EXPECTED_CANONICAL" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          receipt={'status':'cycle-011-rastel-exact-local-canonical-fast-forward-complete-v1','version':1,'writer_run':int(os.environ['GITHUB_RUN_ID']),'writer_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'qualification_artifact':int(os.environ['ARTIFACT_ID']),'qualification_digest':os.environ['ARTIFACT_DIGEST'],'previous_main':os.environ['EXACT_MAIN'],'canonical_main':os.environ['EXPECTED_CANONICAL'],'canonical_tree':os.environ['PRODUCT_TREE'],'product_paths':int(os.environ['PRODUCT_PATHS']),'publisher_paths_deleted':[os.environ['OLD_SELF'],os.environ['OLD_SELF_V2']],'transport':'ordinary-git-push','force_update':False,'cycle_012_authorized':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'receipt/canonical-write.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-exact-local-writer-v1-write-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1-write/receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-exact-local-writer-v1-write-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-exact-local-writer-v1-write
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
