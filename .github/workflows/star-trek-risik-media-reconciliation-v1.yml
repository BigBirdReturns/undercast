name: star-trek-risik-media-reconciliation-v1

on:
  push:
    branches:
      - agent/star-trek-risik-media-reconciliation-v1

permissions:
  contents: write

concurrency:
  group: star-trek-risik-media-reconciliation-v1
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 129e6f9c389fe61bb8027f4e046bea7de510cb84
  EXPECTED_TREE: 6d32c386636296e76bcab61baa387cb629967ac3
  EXPECTED_MESSAGE: "Star Trek: publish Morgo cycle"
  CLAIM_BRANCH: agent/star-trek-risik-claim-result-v2
  CLAIM_COMMIT: eff3da84c7718d0894afda1fbc4e790bc88265da
  CLAIM_TREE: 289b2393496d1146e69e0219784564623b844863
  CLAIM_RECEIPT_SHA: c83b365b93019b0fe0dfd579cabec2cbd7c8dd4b679fcce547a6e59b5980089d
  SOURCE_REVIEW_BRANCH: agent/star-trek-risik-source-review-result-v2
  SOURCE_REVIEW_COMMIT: c4841daaed48105eaa7eec4b39443ac1f49d930b
  SOURCE_REVIEW_TREE: 814c734bf02378e2481e2d600f566342c3f997c8
  SOURCE_REVIEW_SHA: 9205d21aa691550f1da1ae3b6351e4869e574ee14b446d1026d3ca7153300ee6
  MEDIA_BRANCH: agent/star-trek-risik-media-result-v1
  MEDIA_COMMIT: 86b6fcd580f9439b97f96a20bcace2bfcbcc102d
  MEDIA_TREE: 933fee84fa5b034f3d753d6a225f6196398fe69f
  MEDIA_RECEIPT_SHA: 9ccbd09cd8d94751071d65cc327dd04babce8db05f59fc8e47db1832e2547b7c
  MEDIA_REVIEW_BRANCH: agent/star-trek-risik-media-review-result-v1
  MEDIA_REVIEW_COMMIT: 1361fe7b0250f59a88255c8f4649bed389c05890
  MEDIA_REVIEW_TREE: 076ec25f5ee0b2be7eafc6ae15efd13925fc3194
  MEDIA_REVIEW_SHA: 3fe266654351e5df2cabcbce6045ab3fc13e575b2ce049c245e5aee500d87598
  OLD_SOURCE_REVIEW_COMMIT: d769b3eb261d86db3da41d2033ba7c9d6f402db8
  OLD_SOURCE_REVIEW_SHA: cb61b9be745d629a35a57d827711bd29105d3c2d53dac48ce5d26c74a6c82b6a
  TASK_ID: ap_096624f177ae0c9f2e91836c
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Risik
  EXPECTED_FINGERPRINT: 6a66df1f109bbe6f0cd679ab95e29d0090dc3f3139219a99daae82b3001f2cc6
  EXPECTED_LEASE: lease_5d07d02fd67ea40a4950b1dd
  WALL_ID: UC-1399
  STILL_SHA: 3e79fb94f8745963493334d49674efca2d801ca03d4aa05cd5f49f08cf4ffcb9
  PORTRAIT_SHA: e38d8c94d6ae0d64f41c2c24a4957b576e9cc2ac815a8824d4ee625519de9b42
  STILL_ITEM: ma_4c177d5d20dfebfb937e6de7
  PORTRAIT_ITEM: ma_de751c877d2d3f6945d4e140
  RESULT_BRANCH: agent/star-trek-risik-media-reconciliation-result-v1
  RECONCILER_SOURCE: .github/recovery/star-trek-risik-media-reconciliation-v1/reconcile.py
  RECONCILER: /tmp/star-trek-risik-media-reconciliation-v1.py
  OUT: /tmp/star-trek-risik-media-reconciliation-v1

jobs:
  reconcile:
    name: reconcile-corrected-source-with-reviewed-risik-media
    if: ${{ github.event.head_commit.message == 'Reconcile corrected Star Trek Risik media v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify sealed reconciler and exact inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          trigger=.github/recovery/star-trek-risik-media-reconciliation-v1/run.trigger
          test "$(sha256sum "$trigger" | awk '{print $1}')" = 89c66def183cce7ccd3ffd9dc7a7abbaf816b0d84f0e8b1a2fb349e251cc3a9b
          test "$(sha256sum "$RECONCILER_SOURCE" | awk '{print $1}')" = e315c29969ff4033d2dc1f96853e5096893ee02af0fc25d7a53032d0a225ab31
          cp "$RECONCILER_SOURCE" "$RECONCILER"
          chmod +x "$RECONCILER"
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path(os.environ["RECONCILER"])
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY

          rm -rf "$OUT"
          mkdir -p "$OUT"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"

          git fetch --no-tags --depth=2 origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CLAIM_BRANCH}:refs/remotes/origin/${CLAIM_BRANCH}" \
            "+refs/heads/${SOURCE_REVIEW_BRANCH}:refs/remotes/origin/${SOURCE_REVIEW_BRANCH}" \
            "+refs/heads/${MEDIA_BRANCH}:refs/remotes/origin/${MEDIA_BRANCH}" \
            "+refs/heads/${MEDIA_REVIEW_BRANCH}:refs/remotes/origin/${MEDIA_REVIEW_BRANCH}"

          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN"
          test "$(git show -s --format=%T "$EXPECTED_MAIN")" = "$EXPECTED_TREE"
          test "$(git show -s --format=%s "$EXPECTED_MAIN")" = "$EXPECTED_MESSAGE"

          test "$(git rev-parse "refs/remotes/origin/${CLAIM_BRANCH}")" = "$CLAIM_COMMIT"
          test "$(git show -s --format=%T "$CLAIM_COMMIT")" = "$CLAIM_TREE"
          test "$(git show -s --format=%P "$CLAIM_COMMIT")" = "$EXPECTED_MAIN"

          test "$(git rev-parse "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}")" = "$SOURCE_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$SOURCE_REVIEW_COMMIT")" = "$SOURCE_REVIEW_TREE"
          test -z "$(git show -s --format=%P "$SOURCE_REVIEW_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${MEDIA_BRANCH}")" = "$MEDIA_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_COMMIT")" = "$MEDIA_TREE"
          test -z "$(git show -s --format=%P "$MEDIA_COMMIT")"

          test "$(git rev-parse "refs/remotes/origin/${MEDIA_REVIEW_BRANCH}")" = "$MEDIA_REVIEW_COMMIT"
          test "$(git show -s --format=%T "$MEDIA_REVIEW_COMMIT")" = "$MEDIA_REVIEW_TREE"
          test -z "$(git show -s --format=%P "$MEDIA_REVIEW_COMMIT")"

          git show "refs/remotes/origin/${CLAIM_BRANCH}:data/review/adapter-sdk/star-trek-risik-claim.json" > "$OUT/claim-receipt.json"
          git show "refs/remotes/origin/${SOURCE_REVIEW_BRANCH}:transport/star-trek-risik-source-review-v2/source-review.json" > "$OUT/source-review-v2.json"
          git show "refs/remotes/origin/${MEDIA_BRANCH}:transport/star-trek-risik-media-v1/media-receipt.json" > "$OUT/media-receipt.json"
          git show "refs/remotes/origin/${MEDIA_REVIEW_BRANCH}:transport/star-trek-risik-media-review-v1/media-review.json" > "$OUT/media-review.json"

      - name: Reconcile corrected adjudication and exact media evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RECONCILER"
          jq -e \
            --arg task "$TASK_ID" \
            --arg lease "$EXPECTED_LEASE" \
            --arg wall "$WALL_ID" \
            '.transaction == "STAR-TREK-RISIK-MEDIA-RECONCILIATION-V1"
             and .verdict == "pass"
             and .task.id == $task
             and .task.lease_id == $lease
             and .task.wall_id_reserved == $wall
             and .adjudication.primary_production == "Something Borrowed, Something Green"
             and (.adjudication.confirmed_voiced_episodes | length) == 3
             and .media.still.sha256 == env.STILL_SHA
             and .media.portrait.sha256 == env.PORTRAIT_SHA
             and .media_review.all_four_media_claims_enforced == true
             and .media_review.normalization_replay_exact == true
             and .supersession.media_bytes_retained == true
             and .supersession.media_facet_votes_retained == true
             and .candidate_staging_admissible == true
             and .boundary.canonical_mutation == false
             and .boundary.lease_mutation == false
             and .boundary.additional_lease_issued == false
             and .boundary.product_staged == false
             and .boundary.task_resolved == false
             and .boundary.waterline_cycle_recorded == false
             and .boundary.pages_deployed == false' \
            "$OUT/media-reconciliation.json" >/dev/null
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main-after.json"
          test "$(jq -r .commit.sha "$OUT/main-after.json")" = "$EXPECTED_MAIN"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

      - name: Upload Risik media reconciliation evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-risik-media-reconciliation-v1
          path: /tmp/star-trek-risik-media-reconciliation-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable Risik media reconciliation
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq \
            --argjson id "$ARTIFACT_ID" \
            --arg digest "$ARTIFACT_DIGEST" \
            '.artifact={id:$id,digest:$digest}' \
            "$OUT/media-reconciliation.json" > "$OUT/reconciliation.tmp"
          mv "$OUT/reconciliation.tmp" "$OUT/media-reconciliation.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"

          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-risik-media-reconciliation-v1
          git config user.email undercast-risik-media-reconciliation-v1@users.noreply.github.com
          git checkout --orphan risik-media-reconciliation-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-risik-media-reconciliation-v1
          cp -a "$OUT"/. transport/star-trek-risik-media-reconciliation-v1/
          git add transport/star-trek-risik-media-reconciliation-v1
          git commit -m "Record Star Trek Risik media reconciliation v1"
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
