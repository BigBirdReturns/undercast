name: doctor-who-cycle-011-rastel-finalizer-source-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-finalizer-source-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-finalizer-source-v1
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-finalizer-source-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-finalizer-source-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-finalizer-source-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v1
      SOURCE_B64_SHA256: 3bd60a97b181fb8c89482a6ddb282fe9fe70163618e7086540d27e2aae174eac
      SOURCE_GZIP_SHA256: 5e4b5aca1cbc246f93218608a29f1e116b72b860d50ea7dc62121c8015ef1d3b
      SOURCE_BYTES: "35695"
      SOURCE_SHA256: 9e91ad925a882ed16fdbe21e165fd885aaee96755ba7d3bd9a8248cb07a86507
      V4_BYTES: "35745"
      V4_SHA256: 7a02a1837806a6b5d8d062b6299191ab1ff767f80bc72ef74fa9fe44ee23534c

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind carrier and reconstruct exact Merx V4 finalizer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,source,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier.json"
          : > "$OUT/source/runner-v3.sh.gz.b64"
          for blob in b3ed61546b72f43d24295e47564128353a9fe18a 62276da5eb96b0a6b41d1aa723642ad14c2dd961 ae55ce9299b827a4c2ba73160815afed74fd12ce 556aca3fb73c230a0cde77a04c1429e1fb674d60 a5f0e05ae94a59f9e8ce13fb0ed17598a91f5712 24c47d32727787c4919da04bd1c1544b6709f80b 9e5c656dbd2555e6631eef97bf8b74fa49a67cff; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$OUT/source/runner-v3.sh.gz.b64"
          done
          test "$(sha256sum "$OUT/source/runner-v3.sh.gz.b64" | awk '{print $1}')" = "$SOURCE_B64_SHA256"
          base64 -d "$OUT/source/runner-v3.sh.gz.b64" > "$OUT/source/runner-v3.sh.gz"
          test "$(sha256sum "$OUT/source/runner-v3.sh.gz" | awk '{print $1}')" = "$SOURCE_GZIP_SHA256"
          gzip -dc "$OUT/source/runner-v3.sh.gz" > "$OUT/source/runner-v3.sh"
          test "$(wc -c < "$OUT/source/runner-v3.sh" | tr -d ' ')" = "$SOURCE_BYTES"
          test "$(sha256sum "$OUT/source/runner-v3.sh" | awk '{print $1}')" = "$SOURCE_SHA256"
          cp "$OUT/source/runner-v3.sh" "$OUT/source/runner-v4.sh"
          RUNNER="$OUT/source/runner-v4.sh" python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          path=Path(os.environ['RUNNER']); text=path.read_text()
          old='  test "$(git diff --name-only "$CANDIDATE_COMMIT" | sort)" = "$CLOSURE_PATHS"\n'
          new='  test "$({ git diff --name-only "$CANDIDATE_COMMIT"; git ls-files --others --exclude-standard; } | sort -u)" = "$CLOSURE_PATHS"\n'
          assert text.count(old)==1
          text=text.replace(old,new)
          path.write_text(text)
          data=path.read_bytes()
          assert len(data)==int(os.environ['V4_BYTES']) and hashlib.sha256(data).hexdigest()==os.environ['V4_SHA256']
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1): compile(block,f'<merx-finalizer-v4-{index}>','exec')
          exports=[]
          for line in text.splitlines():
              if line.startswith('export ') or re.match(r'^[A-Z][A-Z0-9_]*=',line): exports.append(line)
          report={
            'version':1,'status':'cycle-010-merx-finalizer-v4-source-recovered',
            'carrier':{'pr':int(os.environ['PR']),'head':os.environ['HEAD'],'base':os.environ['MAIN']},
            'source':{'v3_bytes':int(os.environ['SOURCE_BYTES']),'v3_sha256':os.environ['SOURCE_SHA256'],'v4_bytes':len(data),'v4_sha256':hashlib.sha256(data).hexdigest(),'embedded_python_programs':len(blocks)},
            'census':{'merx_occurrences':text.count('Merx'),'cycle_010_occurrences':text.count('cycle-010'),'cycle_009_occurrences':text.count('cycle-009'),'closure_paths_literal_present':'CLOSURE_PATHS' in text,'record_cycle_occurrences':text.count('record-cycle'),'exports':exports},
            'executed':False,'repository_write':False,'cycle_receipt_written':False,'product_published':False,
          }
          report['identity']=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          Path(os.environ['OUT'],'receipt/source-inspection.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          bash -n "$OUT/source/runner-v4.sh"
          printf 'CURRENT_HEAD=%s\nCURRENT_PR=%s\nCURRENT_BASE=%s\n' "$head" "$pr" "$base" >> "$GITHUB_ENV"

      - name: Seal exact source packet without execution
        shell: bash
        run: |
          set -euo pipefail
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-finalizer-source-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-finalizer-source-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
