name: card-backfill-uc-071-inspect

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/card-backfill-uc-071-inspect.mjs"
      - ".github/workflows/card-backfill-uc-071-inspect.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-071-inspect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-014'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect exact UC-071 specimen, source, and audit contract
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-071-inspect
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-071-inspect.mjs | tee "$RUNNER_TEMP/card-backfill-uc-071-inspect.log"
          test -z "$(git status --porcelain)"
      - name: Upload exact composite-contract checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-071-inspect-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-071-inspect
            ${{ runner.temp }}/card-backfill-uc-071-inspect.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
