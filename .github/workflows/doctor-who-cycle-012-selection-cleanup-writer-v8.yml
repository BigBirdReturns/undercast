name: doctor-who-cycle-012-selection-cleanup-writer-v8

"on":
  workflow_run:
    workflows: [doctor-who-cycle-012-selection-cleanup-residual-evidence-v8]
    types: [completed]

permissions: {}

concurrency:
  group: doctor-who-cycle-012-selection-cleanup-writer-v8
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.name == 'doctor-who-cycle-012-selection-cleanup-residual-evidence-v8' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      V7_MAIN: 820f21a613884d5a677de4fd099d49194d794198
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
      SOURCE_WORKFLOW: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
      SOURCE_BRANCH: observer/doctor-who-cycle-012-selection-cleanup-residual-evidence-v8
      ARTIFACT_PREFIX: doctor-who-cycle-012-selection-cleanup-residual-evidence-v8-
      SELECTION_IDENTITY: d17b0bab43d334dab46ef472f765d8d7a70f67fe807902a3c930dc66edcb383a
      SENSTARG_EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_RECEIPT_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      MEDIA_REVIEW_IDENTITY: eaaef07637617f51f145dadab705321f63ae6376e570b8010f896b7d5c0da587
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-
      OUT: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v8
      CLEANUP_NAME: BigBirdReturns
      CLEANUP_EMAIL: bigbirdreturns@proton.me
      CLEANUP_DATE: 2026-08-11T03:00:00Z
      CLEANUP_MESSAGE: Doctor Who cycle 012 residual preselection transport cleanup V8
      SOURCE_RUN_CONTEXT: ${{ github.event.workflow_run.id }}
      SOURCE_HEAD_CONTEXT: ${{ github.event.workflow_run.head_sha }}
      SOURCE_ATTEMPT_CONTEXT: ${{ github.event.workflow_run.run_attempt }}
      LOADER: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v8-loader
      CARRIER_BLOBS: "24e74dabc435f143e15aeb87c875b2a50a0e6e35 4fda304610bfe8309986db1aefd84c980c45461c 27fc3b60e171327f279d5780122024f513416ead 79d64bff317d2567a982d192781047c03a34189e dff675ac9c24a9fd8cb60b80938634a241cf08c1 d9721058ae4f8060bc4d1352a677b65158886a9e"
      CARRIER_B64_BYTES: "18656"
      CARRIER_B64_SHA256: 28fb631716a41de65c5fd6ff3d0cd290f81025b6e75a94e86326ea47753b6a55
      CARRIER_BYTES: "13992"
      CARRIER_SHA256: b29a285a79537579e6b12b81025cf013ba7e0c35d86e88ea6727c7d6eee9b8a0

    steps:
      - name: Reconstruct and execute exact residual cleanup writer V8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER"
          mkdir -p "$LOADER"
          : > "$LOADER/carrier.sh.b64"
          for blob in $CARRIER_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' |
              tr -d '\n' |
              base64 -d >> "$LOADER/carrier.sh.b64"
          done
          test "$(wc -c < "$LOADER/carrier.sh.b64" | tr -d ' ')" = "$CARRIER_B64_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh.b64" | awk '{print $1}')" = "$CARRIER_B64_SHA256"
          base64 -d "$LOADER/carrier.sh.b64" > "$LOADER/carrier.sh"
          test "$(wc -c < "$LOADER/carrier.sh" | tr -d ' ')" = "$CARRIER_BYTES"
          test "$(sha256sum "$LOADER/carrier.sh" | awk '{print $1}')" = "$CARRIER_SHA256"
          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==5
          for index,block in enumerate(blocks,1):
              compile(block,f'<cycle-012-residual-cleanup-writer-v8-{index}>', 'exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v8-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-012-selection-cleanup-writer-v8/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-selection-cleanup-writer-v8-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v8
            /tmp/doctor-who-cycle-012-selection-cleanup-writer-v8-loader
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
