# validation-rearm: 2
name: card-backfill-validate-headless-runtime

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/card-backfill-optimize-local-desk-runtime-v3.yml'

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: card-backfill-validate-headless-runtime-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-and-rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_BRANCH: ${{ github.ref_name }}
      VALIDATION_HEAD: ${{ github.sha }}
    steps:
      - name: Publish observable validation heartbeat
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATION_HEAD}" \
            -f state=pending \
            -f context='card-backfill/local-desk-runtime' \
            -f description="run ${GITHUB_RUN_ID}: validating package-free discovery, pinned local desk, and complete gate" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Bind the exact validation head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_HEAD"
          echo "PASS — runtime validation bound to $VALIDATION_HEAD"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Prove discovery exits before every package manager
        run: |
          set -euo pipefail
          started=$(date +%s)
          REQUESTED_PROFILE=discovery GITHUB_JOB=discover RUNNER_TEMP="$RUNNER_TEMP" GITHUB_PATH="$GITHUB_PATH" \
            bash --noprofile --norc -e -o pipefail < <(python3 - <<'PY'
          import pathlib, yaml
          value=yaml.safe_load(pathlib.Path('.github/actions/card-backfill-runtime/action.yml').read_text())
          print(value['runs']['steps'][0]['run'])
          PY
            )
          elapsed=$(( $(date +%s) - started ))
          test "$elapsed" -le 5
          echo "PASS — package-free discovery runtime ready in ${elapsed}s"

      - name: Measure the permanent local-desk runtime
        run: echo "runtime_started_at=$(date +%s)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/card-backfill-runtime
        with:
          profile: local-desk

      - name: Record runtime setup duration
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - runtime_started_at ))
          echo "PASS — pinned local-desk runtime ready in ${elapsed}s"
          echo "runtime_elapsed_seconds=${elapsed}" >> "$GITHUB_ENV"

      - name: Install complete rendered-gate runtime
        run: npx playwright install --with-deps chromium

      - name: Prove the focused amortization contract
        run: node scripts/card-backfill-amortization-fixtures.mjs

      - name: Run the complete repository gate
        run: npm run gate

      - name: Rearm the exact-current-head supervisor
        run: |
          set -euo pipefail
          remote_head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_BRANCH}" --jq .object.sha)
          if [ "$remote_head" != "$VALIDATION_HEAD" ]; then
            echo "branch moved from validation head $VALIDATION_HEAD to $remote_head; refusing stale rearm" >&2
            exit 1
          fi
          gh workflow run card-backfill-supervisor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" \
            -f reason=package-free-discovery-full-gate-pass
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATION_HEAD}" \
            -f state=success \
            -f context='card-backfill/local-desk-runtime' \
            -f description="package-free discovery and ${runtime_elapsed_seconds}s local desk; full gate passed; supervisor rearmed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo 'manual_continue_required=false'

      - name: Publish observable validation failure
        if: failure()
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATION_HEAD}" \
            -f state=failure \
            -f context='card-backfill/local-desk-runtime' \
            -f description="run ${GITHUB_RUN_ID}: package-free discovery, headless runtime, or complete gate failed" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
