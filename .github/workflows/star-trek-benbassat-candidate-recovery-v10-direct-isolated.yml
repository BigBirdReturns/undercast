name: star-trek-benbassat-candidate-recovery-v10-direct-isolated
on:
  push:
    branches:
      - agent/star-trek-benbassat-candidate-recovery-v10
permissions:
  contents: write
concurrency:
  group: star-trek-benbassat-candidate-recovery-v10-direct-isolated
  cancel-in-progress: true
env:
  EXPECTED_MAIN: ed79424013b92460d16c01cad4e590eca01e6bff
  EXPECTED_TREE: 7f9057770c8e622d71ef41b183811fe47fcdd6ed
  LIVE_MAIN: 29b9ab279dac90fad82aac48633ef83d5ac81b39
  LIVE_TREE: 7c2ad054ceb3b3cbd1f0c00c838cfc3d014ff169
  LIVE_MESSAGE: "Media search: record rolling candidate attempt (2026-08-25)"
  EXPECTED_CLAIM_COMMIT: 0a7e2ed0c1fa7d97b1feb9c0b7e3ef78fd4e5ca2
  EXPECTED_CLAIM_TREE: 63802f7e11f19f7f5ffc5e8093c9866e0429813c
  EXPECTED_SETTLEMENT_SHA: 1ce1896b186cd3c7a6ec5540cfb79367aa7b8e95525a30a4a40dca0a925122f8
  EXPECTED_SOURCE_REVIEW_SHA: 4568d3e5a64d671e83b6f4f37049131b7000943ce3521986495b88916857cfc5
  EXPECTED_MEDIA_RECEIPT_SHA: cb2db2f214ac4ecbd10cca1e26a71b80c9fe09ba08127617ceaadf586d9a4af0
  EXPECTED_CLAIM_RECEIPT_SHA: 25def3142f4c196f45c1a1d2e99e7d4852ba05d859f11d15ba22aace3cdc883b
  TASK_ID: ap_dd7d1c73ed237230cd6e1d0b
  EXPECTED_PERFORMER: Nolan North
  EXPECTED_CHARACTER: Benbassat
  EXPECTED_FINGERPRINT: 78e1384a3a11787064f98516e5759b55b33369d161067804c2d77f2ef6ef8885
  EXPECTED_LEASE: lease_151ba8f5efac7d922ea2f8c2
  WALL_ID: UC-1397
  ALICE_WALL_ID: UC-1396
  CLAIM_BRANCH: agent/star-trek-benbassat-claim-result-v1
  SOURCE_REVIEW_BRANCH: agent/star-trek-benbassat-source-review-result-v1
  SOURCE_REVIEW_PATH: transport/star-trek-benbassat-source-review-v1/source-review.json
  MEDIA_BRANCH: agent/star-trek-benbassat-media-result-v1
  MEDIA_PATH: transport/star-trek-benbassat-media-v1/media-receipt.json
  SETTLEMENT_BRANCH: agent/star-trek-benbassat-preproduct-settlement-result-v2
  SETTLEMENT_PATH: transport/star-trek-benbassat-preproduct-settlement-v2/settlement.json
  SOURCE_RUNTIME_BRANCH: agent/star-trek-benbassat-candidate-recovery-v9
  SOURCE_RUNTIME_ROOT: .github/recovery/star-trek-benbassat-candidate-recovery-v7
  RESULT_BRANCH: agent/star-trek-benbassat-candidate-result-v4
  PATCH_SOURCE: .github/recovery/star-trek-benbassat-candidate-recovery-v10/direct-patch.py
  CENSUS_HELPER_SOURCE: .github/recovery/star-trek-benbassat-candidate-recovery-v10/census-refresh.sh
  OUT: /tmp/star-trek-benbassat-candidate-v10-direct-isolated
  REVIEW_ROOT: /tmp/star-trek-benbassat-candidate-v10-direct-isolated/source-review
  MEDIA_ROOT: /tmp/star-trek-benbassat-candidate-v10-direct-isolated/media-layer
  SETTLEMENT_ROOT: /tmp/star-trek-benbassat-candidate-v10-direct-isolated/preproduct-settlement
  STEPS_ROOT: /tmp/star-trek-benbassat-candidate-v10-direct-isolated-steps
  LIFECYCLE: /tmp/star-trek-benbassat-candidate-lifecycle-v10-direct-isolated.py
  BATCH: /tmp/star-trek-benbassat-batch-v10-direct-isolated.json
  CENSUS_HELPER: /tmp/star-trek-benbassat-census-refresh-v10-direct-isolated.sh
  PATCHER: /tmp/star-trek-benbassat-candidate-v10-direct-isolated-patch.py
  CENSUS_MAX_ATTEMPTS: 3
  CENSUS_RETRY_DELAY_SECONDS: 12
jobs:
  stage:
    name: stage-one-corrected-benbassat-candidate-direct-isolated
    if: ${{ github.event.head_commit.message == 'Run Star Trek Benbassat candidate recovery v10 direct isolated' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Externalize proven v9 runtime and apply the source-resilient patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$PATCH_SOURCE"
          test -f "$CENSUS_HELPER_SOURCE"
          sha256sum "$PATCH_SOURCE" "$CENSUS_HELPER_SOURCE" | tee /tmp/star-trek-benbassat-candidate-v10-direct-isolated-bootstrap.sha256
          rm -rf "$STEPS_ROOT"
          mkdir -p "$STEPS_ROOT"
          cp "$PATCH_SOURCE" "$PATCHER"
          cp "$CENSUS_HELPER_SOURCE" "$CENSUS_HELPER"
          git fetch --no-tags origin "$SOURCE_RUNTIME_BRANCH"
          runtime_ref="refs/remotes/origin/${SOURCE_RUNTIME_BRANCH}"
          git show "${runtime_ref}:${SOURCE_RUNTIME_ROOT}/candidate-lifecycle.py" > "$LIFECYCLE"
          git show "${runtime_ref}:${SOURCE_RUNTIME_ROOT}/batch.json" > "$BATCH"
          for number in 01 02 03 04 05; do
            git show "${runtime_ref}:${SOURCE_RUNTIME_ROOT}/steps/${number}.sh" > "$STEPS_ROOT/${number}.sh"
          done
          python3 "$PATCHER"
          chmod +x "$LIFECYCLE" "$CENSUS_HELPER" "$STEPS_ROOT"/[0-9][0-9].sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          path=Path(os.environ['LIFECYCLE'])
          compile(path.read_text(),str(path),'exec')
          PY
          for script in "$STEPS_ROOT"/[0-9][0-9].sh "$CENSUS_HELPER"; do bash -n "$script"; done
          sha256sum "$LIFECYCLE" "$BATCH" "$CENSUS_HELPER" "$PATCHER" "$STEPS_ROOT"/[0-9][0-9].sh > /tmp/star-trek-benbassat-candidate-v10-direct-isolated-runtime.sha256
      - name: Verify immutable corrected layers
        shell: bash
        run: bash "$STEPS_ROOT/01.sh"
      - name: Submit, grow, and reconcile the exact leased object
        shell: bash
        run: bash "$STEPS_ROOT/02.sh"
      - name: Rebuild projections and resolve the media review
        shell: bash
        run: bash "$STEPS_ROOT/03.sh"
      - name: Rebuild terminal projections and qualify the candidate
        shell: bash
        run: bash "$STEPS_ROOT/04.sh"
      - name: Squash and publish the corrected candidate result
        shell: bash
        run: bash "$STEPS_ROOT/05.sh"
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-benbassat-candidate-recovery-v10-direct-isolated-${{ github.run_id }}
          path: |
            /tmp/star-trek-benbassat-candidate-v10-direct-isolated/
            /tmp/star-trek-benbassat-candidate-v10-direct-isolated-steps/
            /tmp/star-trek-benbassat-candidate-v10-direct-isolated-bootstrap.sha256
            /tmp/star-trek-benbassat-candidate-v10-direct-isolated-runtime.sha256
            /tmp/star-trek-benbassat-candidate-lifecycle-v10-direct-isolated.py
            /tmp/star-trek-benbassat-batch-v10-direct-isolated.json
            /tmp/star-trek-benbassat-census-refresh-v10-direct-isolated.sh
            /tmp/star-trek-benbassat-candidate-v10-direct-isolated-patch.py
          if-no-files-found: warn
          retention-days: 30
