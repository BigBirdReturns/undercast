name: star-trek-alice-pages-terminalizer-observer-v1

on:
  push:
    branches:
      - agent/star-trek-alice-pages-terminalizer-observer-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: star-trek-alice-pages-terminalizer-observer-v1
  cancel-in-progress: false

env:
  TARGET_WORKFLOW: star-trek-alice-pages-terminalizer-v2.yml
  TARGET_BRANCH: agent/star-trek-alice-pages-terminalizer-v1
  TARGET_SHA: d66f2c7bf8efab6fb645ed938f6450f38f2c5886
  PRODUCT_COMMIT: ed79424013b92460d16c01cad4e590eca01e6bff
  TERMINAL_BRANCH: agent/star-trek-alice-finalizer-result-v1
  RESULT_BRANCH: agent/star-trek-alice-pages-terminalizer-observer-result-v1
  OUT: /tmp/star-trek-alice-pages-terminalizer-observer-v1

jobs:
  observe:
    name: observe-exact-alice-pages-terminalizer-v2
    if: ${{ github.event.head_commit.message == 'Observe Star Trek Alice Pages terminalizer v2' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and observe the exact terminalizer run
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          run_id=''
          for _ in $(seq 1 180); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --branch "$TARGET_BRANCH" --event push --limit 50 --json databaseId,status,conclusion,headSha,displayTitle,createdAt,updatedAt,url,attempt > "$OUT/run-list.json"
            run_id="$(jq -r --arg sha "$TARGET_SHA" '[.[] | select(.headSha==$sha)][0].databaseId // empty' "$OUT/run-list.json")"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          printf '%s\n' "$run_id" > "$OUT/run-id.txt"

          status=''
          for _ in $(seq 1 1080); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "$OUT/run.json"
            status="$(jq -r .status "$OUT/run.json")"
            test "$status" = completed && break
            sleep 5
          done
          test "$status" = completed
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "$OUT/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$OUT/artifacts.json"
          gh api "/repos/${GITHUB_REPOSITORY}/branches/main" > "$OUT/main.json"
          conclusion="$(jq -r .conclusion "$OUT/run.json")"
          if test "$conclusion" != success; then
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > "$OUT/failed.log" 2>&1 || true
          fi

          terminal_sha="$(git ls-remote --heads origin "refs/heads/${TERMINAL_BRANCH}" | awk '{print $1}')"
          if test -n "$terminal_sha"; then
            git fetch --no-tags origin "$TERMINAL_BRANCH"
            git show "FETCH_HEAD:transport/star-trek-alice-terminal-v1/publication.json" > "$OUT/publication.json"
            git show "FETCH_HEAD:transport/star-trek-alice-terminal-v1/verdict.txt" > "$OUT/verdict.txt"
            git show "FETCH_HEAD:transport/star-trek-alice-terminal-v1/manifest.sha256" > "$OUT/terminal-manifest.sha256"
          fi

          jq -n \
            --argjson run_id "$run_id" \
            --arg status "$status" \
            --arg conclusion "$conclusion" \
            --arg target_sha "$TARGET_SHA" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg workflow "$TARGET_WORKFLOW" \
            --arg product_commit "$PRODUCT_COMMIT" \
            --arg main_sha "$(jq -r .commit.sha "$OUT/main.json")" \
            --arg terminal_branch "$TERMINAL_BRANCH" \
            --arg terminal_sha "$terminal_sha" \
            '{version:1,transaction:"STAR-TREK-ALICE-PAGES-TERMINALIZER-OBSERVER-V1",run_id:$run_id,status:$status,conclusion:$conclusion,target_sha:$target_sha,target_branch:$target_branch,workflow:$workflow,product_commit:$product_commit,main_sha:$main_sha,terminal_branch:$terminal_branch,terminal_sha:$terminal_sha,canonical_mutation_by_observer:false,lease_mutation_by_observer:false}' > "$OUT/status.json"

      - name: Publish observer result
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          git config user.name undercast-alice-pages-terminalizer-observer
          git config user.email undercast-alice-pages-terminalizer-observer@users.noreply.github.com
          git checkout --orphan alice-pages-terminalizer-observer-result-v1
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-alice-pages-terminalizer-observer-v1
          cp -a "$OUT"/. transport/star-trek-alice-pages-terminalizer-observer-v1/
          git add transport/star-trek-alice-pages-terminalizer-observer-v1
          git commit -m 'Record Star Trek Alice Pages terminalizer observation v1'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
