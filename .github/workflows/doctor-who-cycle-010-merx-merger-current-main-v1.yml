name: doctor-who-cycle-010-merx-merger-current-main-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-merx-merger-current-main-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-merx-merger-current-main-v1
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-merx-merger-current-main-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      BRANCH: agent/doctor-who-cycle-010-merx-merger-current-main-v1
      SELF: .github/workflows/doctor-who-cycle-010-merx-merger-current-main-v1.yml
      OUT: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1
      PRODUCT_PR: "741"
      PRODUCT_BRANCH: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1
      PRODUCT_COMMIT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PUBLISHER_PR: "740"
      PUBLISHER_HEAD: c5ee316477938268c248210a6ea95529a3fffb77
      PUBLISHER_RUN: "31297996851"
      PUBLISHER_QUALIFY_JOB: "93206104660"
      PUBLISHER_WRITE_JOB: "93206356745"
      PUBLICATION_ARTIFACT: "9033606215"
      PUBLICATION_DIGEST: sha256:edada4221dc18a7e7433b582e572e284c41afdb83be06b6c4c0e7e7b7346bd5c
      PUBLICATION_IDENTITY: 269f432b7f6a20fda484d040fbaa7129939196345480e82bd7ef568823b3d84b
      AUTHORIZATION_IDENTITY: 3fce251a37b2e80b382c691e7a3090af8b59c1919de98a1958e0ff19889b5a3f
      PRODUCT_ARCHIVE_WORKFLOW: archive-contract
      PRODUCT_CUSTODY_WORKFLOW: publisher-custody
      GUARD_WORKFLOW: publisher-custody-or-guard
      HISTORICAL_CHECKER_SHA256: 56c3da9c4fb7aee9d1f19f4f9d64b9f07b3ec0be5f3c13a3005962a4c71c10f2
      TASK_ID: ap_cab2d7f95d930401627c1b30
      LEASE_ID: lease_b8955992c5af735f9e40b242
      WALL_ID: UC-1355
      CYCLE_ID: cycle_fb68b31d510d9fe9f05ff4a1
      EVENT_ID: waterline_590777c2db84b1c606170f49
      PORTRAIT_SHA256: 7ac5c8e460c2e02254aa92313b300d4ae04531aafbb79b161ce0e71b36046687

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind guardian geometry and publication receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"/{api,publication,settlement}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PUBLISHER_PR" > "$OUT/api/publisher-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN" > "$OUT/api/publisher-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHER_RUN/jobs?per_page=100" > "$OUT/api/publisher-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT" > "$OUT/api/publication-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$PUBLICATION_ARTIFACT/zip" > "$OUT/publication.zip"
          test "$(sha256sum "$OUT/publication.zip" | awk '{print $1}')" = "${PUBLICATION_DIGEST#sha256:}"
          HEAD="$head" PR="$pr" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); api=root/'api'
          own=json.loads((api/'carrier-pr.json').read_text()); publisher=json.loads((api/'publisher-pr.json').read_text())
          run=json.loads((api/'publisher-run.json').read_text()); jobs=json.loads((api/'publisher-jobs.json').read_text())['jobs']; artifact=json.loads((api/'publication-artifact.json').read_text())
          assert own['number']==int(os.environ['PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['MAIN'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['HEAD']
          assert own['commits']==1 and own['changed_files']==1
          assert publisher['number']==int(os.environ['PUBLISHER_PR']) and publisher['merged'] is False
          assert publisher['base']['sha']==os.environ['MAIN'] and publisher['head']['sha']==os.environ['PUBLISHER_HEAD']
          assert run['id']==int(os.environ['PUBLISHER_RUN']) and run['name']=='doctor-who-cycle-010-merx-publisher-current-main-v1'
          assert run['head_sha']==os.environ['PUBLISHER_HEAD'] and run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
          by={row['name']:row for row in jobs}
          assert set(by)=={'qualify','publish'}
          assert by['qualify']['id']==int(os.environ['PUBLISHER_QUALIFY_JOB']) and by['qualify']['conclusion']=='success'
          assert by['publish']['id']==int(os.environ['PUBLISHER_WRITE_JOB']) and by['publish']['conclusion']=='success'
          assert artifact['id']==int(os.environ['PUBLICATION_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['PUBLICATION_DIGEST']
          assert artifact['workflow_run']['id']==int(os.environ['PUBLISHER_RUN']) and artifact['workflow_run']['head_sha']==os.environ['PUBLISHER_HEAD']
          target=root/'publication'
          with zipfile.ZipFile(root/'publication.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({r.filename for r in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts
                  if info.is_dir(): continue
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=target/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          publication=json.loads((target/'publication.json').read_text()); identity=publication.pop('identity')
          assert identity==os.environ['PUBLICATION_IDENTITY']
          assert hashlib.sha256(json.dumps(publication,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          publication['identity']=identity
          assert publication['status']=='cycle-010-merx-exact-product-published-v1'
          assert publication['authorization_identity']==os.environ['AUTHORIZATION_IDENTITY'] and publication['canonical_parent']==os.environ['MAIN']
          assert publication['product']['commit']==os.environ['PRODUCT_COMMIT'] and publication['product']['tree']==os.environ['PRODUCT_TREE'] and publication['product']['paths']==int(os.environ['PRODUCT_PATHS'])
          assert publication['product_ref']=='refs/heads/'+os.environ['PRODUCT_BRANCH'] and publication['product_ref_sha']==os.environ['PRODUCT_COMMIT']
          assert publication['product_published'] is True and publication['force_update'] is False and publication['main_mutated'] is False and publication['cycle_011_authorized'] is False
          (root/'settlement/publication.bound.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n')
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Bind same-head guard and exact product checks
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for _ in $(seq 1 100); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$CARRIER_HEAD&event=pull_request&per_page=100" > "$OUT/api/carrier-runs.json"
            if ROOT="$OUT" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/carrier-runs.json').read_text())['workflow_runs']
          matches=[row for row in rows if row['name']==os.environ['GUARD_WORKFLOW'] and row['head_sha']==os.environ['CARRIER_HEAD'] and row['event']=='pull_request']
          if len(matches)!=1: sys.exit(1)
          row=matches[0]
          if row['status']!='completed' or row['conclusion']!='success' or row['run_attempt']!=1: sys.exit(1)
          (Path(os.environ['ROOT'])/'api/guard-run-id.txt').write_text(str(row['id'])+'\n')
          PY
            then found=true; break; fi
            sleep 12
          done
          test "$found" = true
          guard_run="$(cat "$OUT/api/guard-run-id.txt")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$guard_run" > "$OUT/api/guard-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$guard_run/jobs?per_page=100" > "$OUT/api/guard-jobs.json"
          ready=false
          for _ in $(seq 1 100); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PRODUCT_COMMIT&event=pull_request&per_page=100" > "$OUT/api/product-runs.json"
            if ROOT="$OUT" python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/product-runs.json').read_text())['workflow_runs']
          result={}
          for name in (os.environ['PRODUCT_ARCHIVE_WORKFLOW'],os.environ['PRODUCT_CUSTODY_WORKFLOW']):
              matches=[r for r in rows if r['name']==name and r['head_sha']==os.environ['PRODUCT_COMMIT'] and r['event']=='pull_request']
              if not matches: sys.exit(1)
              row=sorted(matches,key=lambda x:x['id'])[-1]
              if row['status']!='completed' or row['conclusion']!='success': sys.exit(1)
              result[name]=row['id']
          (Path(os.environ['ROOT'])/'api/product-run-ids.json').write_text(json.dumps(result,sort_keys=True)+'\n')
          PY
            then ready=true; break; fi
            sleep 12
          done
          test "$ready" = true
          archive_run="$(jq -r --arg n "$PRODUCT_ARCHIVE_WORKFLOW" '.[$n]' "$OUT/api/product-run-ids.json")"
          custody_run="$(jq -r --arg n "$PRODUCT_CUSTODY_WORKFLOW" '.[$n]' "$OUT/api/product-run-ids.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$archive_run" > "$OUT/api/archive-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$archive_run/jobs?per_page=100" > "$OUT/api/archive-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$custody_run" > "$OUT/api/custody-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$custody_run/jobs?per_page=100" > "$OUT/api/custody-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PRODUCT_PR" > "$OUT/api/product-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$PRODUCT_BRANCH" > "$OUT/api/product-ref.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$PRODUCT_COMMIT" > "$OUT/api/product-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$MAIN...$PRODUCT_COMMIT" > "$OUT/api/product-compare.json"
          ROOT="$OUT" GUARD_RUN="$guard_run" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); api=root/'api'
          guard=json.loads((api/'guard-run.json').read_text()); guard_jobs=json.loads((api/'guard-jobs.json').read_text())['jobs']
          assert guard['id']==int(os.environ['GUARD_RUN']) and guard['name']==os.environ['GUARD_WORKFLOW'] and guard['head_sha']==os.environ['CARRIER_HEAD']
          assert guard['status']=='completed' and guard['conclusion']=='success' and guard['run_attempt']==1
          assert len(guard_jobs)==1 and guard_jobs[0]['name']=='verify' and guard_jobs[0]['status']=='completed' and guard_jobs[0]['conclusion']=='success'
          guard_receipt={'workflow_name':guard['name'],'workflow_run_id':guard['id'],'run_attempt':guard['run_attempt'],'head_sha':guard['head_sha'],'job_name':guard_jobs[0]['name'],'job_id':guard_jobs[0]['id'],'run_status':guard['status'],'run_conclusion':guard['conclusion'],'job_status':guard_jobs[0]['status'],'job_conclusion':guard_jobs[0]['conclusion']}
          (root/'settlement/carrier-guard.json').write_text(json.dumps(guard_receipt,indent=2,sort_keys=True)+'\n')
          specs=[('archive',os.environ['PRODUCT_ARCHIVE_WORKFLOW'],'validate'),('custody',os.environ['PRODUCT_CUSTODY_WORKFLOW'],'verify')]
          checks={}
          for prefix,name,job_name in specs:
              run=json.loads((api/f'{prefix}-run.json').read_text()); jobs=json.loads((api/f'{prefix}-jobs.json').read_text())['jobs']
              assert run['name']==name and run['head_sha']==os.environ['PRODUCT_COMMIT'] and run['event']=='pull_request'
              assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==1
              assert len(jobs)==1 and jobs[0]['name']==job_name and jobs[0]['status']=='completed' and jobs[0]['conclusion']=='success'
              checks[name]={'workflow_name':name,'workflow_run_id':run['id'],'run_attempt':run['run_attempt'],'head_sha':run['head_sha'],'job_name':jobs[0]['name'],'job_id':jobs[0]['id'],'run_status':run['status'],'run_conclusion':run['conclusion'],'job_status':jobs[0]['status'],'job_conclusion':jobs[0]['conclusion']}
          (root/'settlement/product-checks.json').write_text(json.dumps(checks,indent=2,sort_keys=True)+'\n')
          pr=json.loads((api/'product-pr.json').read_text()); ref=json.loads((api/'product-ref.json').read_text()); commit=json.loads((api/'product-commit.json').read_text()); compare=json.loads((api/'product-compare.json').read_text())
          assert pr['number']==int(os.environ['PRODUCT_PR']) and pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['sha']==os.environ['MAIN'] and pr['head']['ref']==os.environ['PRODUCT_BRANCH'] and pr['head']['sha']==os.environ['PRODUCT_COMMIT']
          assert pr['commits']==1 and pr['changed_files']==int(os.environ['PRODUCT_PATHS'])
          assert ref['object']['sha']==os.environ['PRODUCT_COMMIT']
          assert [p['sha'] for p in commit['parents']]==[os.environ['MAIN']] and commit['tree']['sha']==os.environ['PRODUCT_TREE']
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          paths=sorted(row['filename'] for row in compare['files'])
          assert len(paths)==int(os.environ['PRODUCT_PATHS']) and not any(p.startswith('.github/') for p in paths)
          (root/'settlement/product-paths.txt').write_text(''.join(p+'\n' for p in paths))
          (root/'settlement/product-paths.sha256').write_text(hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest()+'\n')
          PY

      - name: Rerun permanent and rendered product gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$PRODUCT_BRANCH)" = "$PRODUCT_COMMIT"
          git checkout --detach "$PRODUCT_COMMIT"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git show -s --format=%T HEAD)" = "$PRODUCT_TREE"
          test "$(sha256sum scripts/doctor-who-cycle-009-historical.mjs | awk '{print $1}')" = "$HISTORICAL_CHECKER_SHA256"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/settlement/cycle-009.log"
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/settlement/cycle-010.log"
          node scripts/autopilot.mjs validate | tee "$OUT/settlement/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/settlement/autopilot-status.json"
          node scripts/media-audit.mjs validate | tee "$OUT/settlement/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/settlement/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/settlement/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/settlement/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/settlement/waterline-gate.log"
          npm run gate 2>&1 | tee "$OUT/settlement/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/settlement/complete-gate.log" >/dev/null
          ROOT="$OUT" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT']); state=json.loads(Path('data/AUTOPILOT.json').read_text()); doctor=[x for x in state['jobs'] if x.get('scope')=='doctor-who']
          task=next(x for x in doctor if x['id']==os.environ['TASK_ID'])
          assert len(doctor)==316 and task['status']=='resolved' and task['wall_ids']==[os.environ['WALL_ID']] and task['performer']=='Dan Starkey' and task['character']=='Merx'
          assert sum(x['status']=='queued' for x in doctor)==306 and sum(x['status']=='resolved' for x in doctor)==10
          card=next(x for x in json.loads(Path('data/specimens.json').read_text()) if x['id']==os.environ['WALL_ID'])
          assert card['kind']=='voice' and 'still' not in card and hashlib.sha256(Path(card['portrait']['src']).read_bytes()).hexdigest()==os.environ['PORTRAIT_SHA256']
          receipt=json.loads(Path('data/review/adapter-sdk/doctor-who-cycle-010-merx.json').read_text())
          assert receipt['task']['id']==os.environ['TASK_ID'] and receipt['lease']['id']==os.environ['LEASE_ID'] and receipt['reviewed_cycle']['id']==os.environ['CYCLE_ID'] and receipt['reviewed_cycle']['event_id']==os.environ['EVENT_ID']
          assert receipt['queue']['after']=={'total':316,'queued':306,'resolved':10,'in_flight':0}
          assert receipt['boundary']['cycle_011_authorized'] is False and receipt['boundary']['eleventh_lease_issued'] is False
          status=json.loads((root/'settlement/autopilot-status.json').read_text()); water=json.loads((root/'settlement/waterline-status.json').read_text())
          assert status['total']==316 and status['statuses']=={'queued':306,'resolved':10} and status['in_flight']==0
          assert water['claim_allowed'] is True and water['claim_reasons']==[] and water['jobs']['in_flight']==0 and water['media']['debt']==0 and water['cycles']['unreceipted']==[]
          PY
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - name: Seal exact fast-forward settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); publication=json.loads((root/'settlement/publication.bound.json').read_text()); guard=json.loads((root/'settlement/carrier-guard.json').read_text()); checks=json.loads((root/'settlement/product-checks.json').read_text())
          receipt={
            'status':'cycle-010-merx-exact-fast-forward-approved-v1',
            'version':1,
            'verify_run':int(os.environ['GITHUB_RUN_ID']),
            'verify_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'carrier_pr':int(os.environ['CARRIER_PR']),
            'carrier_head':os.environ['CARRIER_HEAD'],
            'carrier_guard':guard,
            'canonical_parent':os.environ['MAIN'],
            'product_pr':int(os.environ['PRODUCT_PR']),
            'product_branch':os.environ['PRODUCT_BRANCH'],
            'product_commit':os.environ['PRODUCT_COMMIT'],
            'product_tree':os.environ['PRODUCT_TREE'],
            'product_path_count':int(os.environ['PRODUCT_PATHS']),
            'product_paths_sha256':hashlib.sha256((root/'settlement/product-paths.txt').read_bytes()).hexdigest(),
            'product_checks':checks,
            'publisher_run':int(os.environ['PUBLISHER_RUN']),
            'publication_artifact':int(os.environ['PUBLICATION_ARTIFACT']),
            'publication_artifact_digest':os.environ['PUBLICATION_DIGEST'],
            'publication_identity':publication['identity'],
            'authorization_identity':publication['authorization_identity'],
            'task_id':os.environ['TASK_ID'],
            'lease_id':os.environ['LEASE_ID'],
            'wall_id':os.environ['WALL_ID'],
            'cycle_id':os.environ['CYCLE_ID'],
            'force_update':False,
            'main_mutated':False,
            'cycle_011_authorized':False,
            'eleventh_lease_issued':False,
            'outside_human_dependency':False,
            'owner_physical_action_required':False,
          }
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'settlement/settlement.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/settlement" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/settlement/$rel" | sed "s#  $OUT/settlement/#  #"; done > "$OUT/settlement/SHA256SUMS.pre"
          sha256sum "$OUT/settlement/SHA256SUMS.pre" | sed "s#  $OUT/settlement/#  #" > "$OUT/settlement/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-merger-current-main-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1/settlement
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-merger-current-main-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  fast_forward:
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 1d50591ce826256e40fc574ebf9aef7993386760
      PRODUCT_COMMIT: 96abbacf2f033ff9bceef0205ea477cd17e45fcd
      PRODUCT_TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      PRODUCT_PATHS: "50"
      PRODUCT_BRANCH: agent/doctor-who-cycle-010-merx-reviewed-product-current-main-v1
      GUARD_WORKFLOW: publisher-custody-or-guard
      SETTLEMENT: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1-settlement
      OUT: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1-merge

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-merger-current-main-v1-settlement-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1-settlement

      - name: Reverify settlement and non-forcedly fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          root=Path(os.environ['SETTLEMENT']); out=Path(os.environ['OUT']); repo=os.environ['GITHUB_REPOSITORY']
          def gh(method,path,payload=None):
              cmd=['gh','api']
              if method!='GET': cmd+=['--method',method]
              cmd.append(path)
              if payload is None: p=subprocess.run(cmd,check=True,capture_output=True,text=True)
              else: p=subprocess.run(cmd+['--input','-'],input=json.dumps(payload),check=True,capture_output=True,text=True)
              return json.loads(p.stdout) if p.stdout.strip() else None
          ledger=root/'SHA256SUMS.pre'; sealed=root/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); p=root/name.lstrip('*')
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==digest
          settlement=json.loads((root/'settlement.json').read_text()); identity=settlement.pop('identity')
          assert hashlib.sha256(json.dumps(settlement,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          settlement['identity']=identity
          assert settlement['status']=='cycle-010-merx-exact-fast-forward-approved-v1'
          assert settlement['verify_run']==int(os.environ['GITHUB_RUN_ID']) and settlement['verify_attempt']==int(os.environ['GITHUB_RUN_ATTEMPT'])
          assert settlement['canonical_parent']==os.environ['MAIN'] and settlement['product_commit']==os.environ['PRODUCT_COMMIT'] and settlement['product_tree']==os.environ['PRODUCT_TREE'] and settlement['product_path_count']==int(os.environ['PRODUCT_PATHS'])
          assert settlement['force_update'] is False and settlement['main_mutated'] is False and settlement['cycle_011_authorized'] is False
          guard=settlement['carrier_guard']
          run=gh('GET',f'/repos/{repo}/actions/runs/{guard["workflow_run_id"]}')
          assert run['name']==os.environ['GUARD_WORKFLOW'] and run['head_sha']==settlement['carrier_head'] and run['status']=='completed' and run['conclusion']=='success'
          jobs=gh('GET',f'/repos/{repo}/actions/runs/{guard["workflow_run_id"]}/jobs?per_page=100')['jobs']
          job=next(x for x in jobs if x['id']==guard['job_id'])
          assert job['name']=='verify' and job['status']=='completed' and job['conclusion']=='success'
          for name,bound in settlement['product_checks'].items():
              run=gh('GET',f'/repos/{repo}/actions/runs/{bound["workflow_run_id"]}')
              assert run['name']==name and run['head_sha']==os.environ['PRODUCT_COMMIT'] and run['status']=='completed' and run['conclusion']=='success'
              jobs=gh('GET',f'/repos/{repo}/actions/runs/{bound["workflow_run_id"]}/jobs?per_page=100')['jobs']
              job=next(x for x in jobs if x['id']==bound['job_id'])
              assert job['name']==bound['job_name'] and job['status']=='completed' and job['conclusion']=='success'
          main=gh('GET',f'/repos/{repo}/git/ref/heads/main'); assert main['object']['sha']==os.environ['MAIN']
          product_ref=gh('GET',f'/repos/{repo}/git/ref/heads/{os.environ["PRODUCT_BRANCH"]}'); assert product_ref['object']['sha']==os.environ['PRODUCT_COMMIT']
          commit=gh('GET',f'/repos/{repo}/git/commits/{os.environ["PRODUCT_COMMIT"]}')
          assert [p['sha'] for p in commit['parents']]==[os.environ['MAIN']] and commit['tree']['sha']==os.environ['PRODUCT_TREE']
          compare=gh('GET',f'/repos/{repo}/compare/{os.environ["MAIN"]}...{os.environ["PRODUCT_COMMIT"]}')
          assert compare['status']=='ahead' and compare['ahead_by']==1 and compare['behind_by']==0 and compare['total_commits']==1
          assert sorted(x['filename'] for x in compare['files'])==(root/'product-paths.txt').read_text().splitlines()
          pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False and pr['base']['sha']==os.environ['MAIN'] and pr['head']['sha']==os.environ['PRODUCT_COMMIT']
          gh('PATCH',f'/repos/{repo}/git/refs/heads/main',{'sha':os.environ['PRODUCT_COMMIT'],'force':False})
          for _ in range(60):
              main=gh('GET',f'/repos/{repo}/git/ref/heads/main')
              if main['object']['sha']==os.environ['PRODUCT_COMMIT']: break
              time.sleep(2)
          assert main['object']['sha']==os.environ['PRODUCT_COMMIT']
          after=gh('GET',f'/repos/{repo}/compare/{os.environ["MAIN"]}...main')
          assert after['status']=='ahead' and after['ahead_by']==1 and after['behind_by']==0 and after['total_commits']==1
          assert sorted(x['filename'] for x in after['files'])==(root/'product-paths.txt').read_text().splitlines()
          for _ in range(30):
              pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
              if pr['state']=='closed': break
              time.sleep(2)
          if pr['state']!='closed':
              gh('PATCH',f'/repos/{repo}/pulls/{settlement["product_pr"]}',{'state':'closed'})
              pr=gh('GET',f'/repos/{repo}/pulls/{settlement["product_pr"]}')
          assert pr['state']=='closed'
          receipt={'status':'cycle-010-merx-canonically-fast-forwarded-v1','version':1,'merge_run':int(os.environ['GITHUB_RUN_ID']),'merge_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'canonical_parent':os.environ['MAIN'],'canonical_main':os.environ['PRODUCT_COMMIT'],'canonical_tree':os.environ['PRODUCT_TREE'],'canonical_path_count':int(os.environ['PRODUCT_PATHS']),'product_pr':settlement['product_pr'],'product_pr_state':pr['state'],'product_pr_merged':pr['merged'],'settlement_identity':settlement['identity'],'force_update':False,'cycle_011_authorized':False,'eleventh_lease_issued':False,'outside_human_dependency':False,'owner_physical_action_required':False}
          receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (out/'merge.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          (out/'settlement.bound.json').write_bytes((root/'settlement.json').read_bytes())
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-merger-current-main-v1-merge-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1-merge
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-merx-merger-current-main-v1-merge-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-merx-merger-current-main-v1-merge
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
