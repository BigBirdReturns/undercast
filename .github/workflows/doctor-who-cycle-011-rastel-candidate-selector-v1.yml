name: doctor-who-cycle-011-rastel-candidate-selector-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-selector-v1
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-selector-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-selector-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v1.yml
      SOURCE: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-source
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1
      CARRIER: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-carrier
      RUNNER_BLOB: 6af413439ad24f52a85159e7d9948985d57492ad
      RUNNER_GZIP_BYTES: "8319"
      RUNNER_GZIP_SHA256: 6bb0616dc9ebd4cb3c2d29fa05a9d6564528b46d4e0b1922f60e84c47b4a0587
      RUNNER_BYTES: "26464"
      RUNNER_SHA256: fcf65ecced0b79b851cd8e3cecb581cb9243a5095f616ac13dfc0dddd61a30f4
      V10_PR: "766"
      V10_HEAD: 27b902abdb8e5094e45af7938b58907203e2aa74
      V10_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main
      V10_RUN: "31333461683"
      V10_JOB: "93295270939"
      V10_ARTIFACT: "9043638791"
      V10_ARTIFACT_FILES: "361"
      V10_ARTIFACT_SIZE: "48470438"
      V10_ARTIFACT_SHA256: b5aa012544058c97bdff335146c67d9ad3f5d2db100f10b0ae0ba048205b8a05
      V10_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-v10-exact-lease-transport-current-main-31333461683-attempt-1
      V9_PR: "767"
      V9_HEAD: 83b8b0867b64e56f43955a77390173f05e2924fa
      V9_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-packet-v9
      V9_RUN: "31333660931"
      V9_JOB: "93295812614"
      V9_ARTIFACT: "9043662459"
      V9_ARTIFACT_FILES: "391"
      V9_ARTIFACT_SIZE: "53773564"
      V9_ARTIFACT_SHA256: 4a499d6050f721094b273d638725b29a7f3d5a6fed41ba91e5a0919f69a97673
      V9_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-packet-v9-31333660931-attempt-1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Authenticate exact selector runner and execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$CARRIER"
          mkdir -p "$CARRIER"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/runner.sh.gz"
          test "$(wc -c < "$CARRIER/runner.sh.gz" | tr -d ' ')" = "$RUNNER_GZIP_BYTES"
          test "$(sha256sum "$CARRIER/runner.sh.gz" | awk '{print $1}')" = "$RUNNER_GZIP_SHA256"
          gzip -dc "$CARRIER/runner.sh.gz" > "$CARRIER/runner.sh"
          test "$(wc -c < "$CARRIER/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$CARRIER/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          bash -n "$CARRIER/runner.sh"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('/tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-carrier/runner.sh').read_text()
          blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S)
          assert len(blocks)==3
          for index,block in enumerate(blocks,1):
              compile(block,f'<rastel-selector-runner-{index}>','exec')
          required={
              'f26f264dae78acb485ef05e5ab62bd1aad4201b0',
              '77a0dbf40c5054e34d2a7924b0f50297913b0a98',
              '584f5606fbdc7495f8302108dedd669803c0c95cf139f9f59bd09a33c8a8398d',
              '7c2912752b6f51dee4b06a9393526059e4ff188d',
              '6ee8ca1dae3fc7f6a35fb7c50e8a226a184096f1',
              'e6e9b7bbc96b98339ff425129102df42d9c40f8015a907f4d5d041d1f0a1afa6',
              'd7f718a9c65eb586e2a7a4bc88a87c2e5c70981307815262237c3631871d0f49',
          }
          assert all(value in text for value in required)
          assert "'alternate_candidate_authority': False" in text
          assert "'selection_only': True" in text
          PY
          chmod 700 "$CARRIER/runner.sh"
          CURRENT_HEAD='${{ github.event.pull_request.head.sha }}' \
          CURRENT_PR='${{ github.event.pull_request.number }}' \
          CURRENT_BASE='${{ github.event.pull_request.base.sha }}' \
          exec "$CARRIER/runner.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-source/api
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-carrier
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-source/v10.zip
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v1-source/v9.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
