name: card-backfill-uc-063-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-063-RENDER.json"
      - "scripts/card-backfill-uc-063-render.mjs"
      - ".github/workflows/card-backfill-uc-063-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-063-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-010'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-010
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic image renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/magick" -version | head -n 2
      - name: Verify exact reviewed official Grinch authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-063-RENDER.json','utf8'));
          if(row.version!==1||row.lane!=='card-backfill'||row.record_id!=='UC-063'||row.actor!=='Jim Carrey'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-063 render authorization drift');
          if(row.official_artifact?.artifact_id!==8635715002||row.official_artifact?.head_sha!=='8a5fc596fa064ed5d9c048f068cf5e193c749f4b')throw new Error('UC-063 official artifact custody drift');
          if(row.selection?.sha256!=='7e60e807bf132ea1cf66a1faa38afce9f7b2e706a845524054bc61b8fe203848'||row.selection?.source_manifest_sha256!=='5cdf85e9c9093f5508feebede3e16da8a816920b0ca12911e5971e5baa2f0429')throw new Error('UC-063 official candidate drift');
          if(row.crop?.gravity!=='east'||row.ruling?.identity!=='expected-subject'||row.ruling?.presentation!=='character-depiction'||row.ruling?.canonical_mutation!==false)throw new Error('UC-063 crop or ruling drift');
          console.log('PASS — exact official Universal Grinch source and east-focused crop authorized');
          NODE
      - name: Retrieve and verify exact official-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-063-render"
          mkdir -p "$root/official"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8635715002/zip" > "$root/official.zip"
          echo "a4365cea6a1538d70bfb98219b8e243004b7b9eeec03ffa348f40b6920f2f7e4  $root/official.zip" | sha256sum -c -
          unzip -q "$root/official.zip" -d "$root/official"
          test -f "$root/official/output/manifest.json"
          echo "5cdf85e9c9093f5508feebede3e16da8a816920b0ca12911e5971e5baa2f0429  $root/official/output/manifest.json" | sha256sum -c -
          echo "7e60e807bf132ea1cf66a1faa38afce9f7b2e706a845524054bc61b8fe203848  $root/official/output/candidates/001-pinned-official.jpg" | sha256sum -c -
          echo "2685a5c6ba2edda2e40fba4ba277c2638cf2b89ea2821f2999f48775b3e3d1ca  $root/official/output/source-page.png" | sha256sum -c -
      - name: Render exact official Grinch candidate and enforce duplicate boundary
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-063-render/official/output
          OUT: ${{ runner.temp }}/card-backfill-uc-063-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/card-backfill-uc-063-render.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-063-render/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload exact candidate, source page, review and crop preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-063-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-063-render/output
            ${{ runner.temp }}/card-backfill-uc-063-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
