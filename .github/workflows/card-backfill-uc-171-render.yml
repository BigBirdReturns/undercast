name: card-backfill-uc-171-render

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-171-RENDER.json"
      - "scripts/card-backfill-uc-171-render.part-00.mjs"
      - "scripts/card-backfill-uc-171-render.part-01.mjs"
      - ".github/workflows/card-backfill-uc-171-render.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: card-backfill-uc-171-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-036'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-036
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Install deterministic renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify exact UC-171 three-role render authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-171-RENDER.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-171');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-171');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_0463aa68c783b67dbfb3a9bc');
          if(row.version!==1||row.record_id!=='UC-171'||row.kind!=='voice'||row.actor!=='Rob Paulsen'||row.character!=='Yakko Warner, Pinky, Raphael'||row.production!=='Animaniacs / TMNT'||row.years!=='1980s–'||row.side!=='still'||row.reviewed_role!=='second-desk')throw new Error('UC-171 render authorization drift');
          if(row.discovery_artifact?.artifact_id!==8714560470||row.discovery_artifact?.head_sha!=='413bf4567a7e6a55ceaccb9026c8ec7cfaff9f81'||row.discovery_artifact?.zip_sha256!=='61210294de3274fefe3c163215a998500dffdd2971685187a44cc4fcabb2a51a'||row.discovery_artifact?.candidate_count!==10||JSON.stringify(row.discovery_artifact?.role_counts)!==JSON.stringify({yakko:4,pinky:5,raphael:1}))throw new Error('UC-171 discovery custody drift');
          if(row.failed_discovery_checkpoints?.length!==3||row.identity_custody?.length!==4||row.identity_custody.filter(item=>item.reference_only).length!==1||row.roles?.length!==3)throw new Error('UC-171 render denominator drift');
          const expected={yakko:'415bff7eb92b32484ee3336b8ab765f9d1ec1b90847f65886857eb93d3e2564f',pinky:'bbfc955b597ab1d7a2ce2e69b3bcecd15840032ca5c11d9eae38e1bccd346ecd',raphael:'4bc08f7e677b193b9d662d54cc2366a412aec7ede827d578f8736e54c0c16324'};
          for(const role of row.roles){if(role.sha256!==expected[role.key]||role.pageimage_source!==true)throw new Error(`${role.key} selected source drift`)}
          if(row.render?.candidate_width!==1260||row.render?.candidate_height!==1000||row.render?.panel_width!==412||row.render?.divider_width!==12||row.render?.face_height!==560||row.render?.internal_rule_height!==8||row.render?.body_height!==432||row.render?.wall_width!==1246||row.render?.wall_height!==1000)throw new Error('UC-171 render geometry drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='Rob Paulsen'||specimen.character!=='Yakko Warner, Pinky, Raphael'||specimen.production!=='Animaniacs / TMNT'||specimen.years!=='1980s–'||specimen.still||specimen.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 specimen boundary drift');
          if(source?.still||source?.portrait?.src!=='images/uc-171-portrait.jpg')throw new Error('UC-171 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-171'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-171 audit boundary drift');
          console.log('PASS — exact UC-171 Yakko, Pinky, and 1987 Raphael render authorized');
          NODE
      - name: Retrieve and verify exact discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-render"
          mkdir -p "$root/discovery"
          gh api "/repos/BigBirdReturns/undercast/actions/artifacts/8714560470/zip" > "$root/discovery.zip"
          echo "61210294de3274fefe3c163215a998500dffdd2971685187a44cc4fcabb2a51a  $root/discovery.zip" | sha256sum -c -
          unzip -q "$root/discovery.zip" -d "$root/discovery"
          source="$root/discovery/card-backfill-uc-171-discover"
          echo "2ab816785a218c11db8b02ee767dbf600946ae04978d265db134c9638278024f  $source/manifest.json" | sha256sum -c -
          echo "ea86ddc7f91f73a1b8f62c6b90c0e07942e1232f517711c50807a2ef7193676c  $source/summary.json" | sha256sum -c -
          echo "d38d94b3b1edd28be8fc20b1a259390b9f575aaa96f19e9c326cf18fe8f20ef6  $source/contact-sheet-all-roles.jpg" | sha256sum -c -
          echo "415bff7eb92b32484ee3336b8ab765f9d1ec1b90847f65886857eb93d3e2564f  $source/candidates/yakko/002-file-yakko-main-model-png.webp" | sha256sum -c -
          echo "bbfc955b597ab1d7a2ce2e69b3bcecd15840032ca5c11d9eae38e1bccd346ecd  $source/candidates/pinky/001-file-pinky-official-art-png.webp" | sha256sum -c -
          echo "4bc08f7e677b193b9d662d54cc2366a412aec7ede827d578f8736e54c0c16324  $source/candidates/raphael/001-file-1987-raph-01-jpg.webp" | sha256sum -c -
          echo "a434b8bb6bc29a6fd97203f7b1c6d39d006e205bcfdb7e6baf0d740c2abca5e4  $source/raw/yakko.wikitext" | sha256sum -c -
          echo "96634af0979f01b738e49ab30426d33830e01068a89a5142f80c33ee86202fe3  $source/raw/pinky.wikitext" | sha256sum -c -
          echo "e732c9312279d49cdf7c4eb5e77e8753fa050c4b3a9b033909730edd8013d27b  $source/raw/raphael.wikitext" | sha256sum -c -
          echo "866f24cc366147361e0fdb8919a5cbfe659bce20ed7046b2b83af5d484a5142b  $source/pages/hulu-animaniacs.png" | sha256sum -c -
          echo "ef258063314b11064db28245a27125b439165013c0bde3e6e0abd4a8ae5dab47  $source/pages/television-academy-sounds-familiar.png" | sha256sum -c -
          echo "74ccf5c85c1d066b9fe46c519b94e428f1254d04a9554462700fc84905779f21  $source/pages/paramount-plus-tmnt-1987.png" | sha256sum -c -
      - name: Render exact three-role candidate and evidence packet
        env:
          SOURCE_ROOT: ${{ runner.temp }}/card-backfill-uc-171-render/discovery/card-backfill-uc-171-discover
          OUT: ${{ runner.temp }}/card-backfill-uc-171-render/output
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/card-backfill-uc-171-render"
          cat scripts/card-backfill-uc-171-render.part-00.mjs scripts/card-backfill-uc-171-render.part-01.mjs > "$root/render.mjs"
          echo "renderer $(sha256sum "$root/render.mjs" | cut -d" " -f1)"
          node --check "$root/render.mjs"
          node "$root/render.mjs" 2>&1 | tee "$root/run.log"
          git status --short
          test -z "$(git status --porcelain)"
      - name: Compact transport staging
        if: always()
        run: |
          root="$RUNNER_TEMP/card-backfill-uc-171-render"
          rm -rf "$root/discovery" "$root/discovery.zip" "$root/work"
      - name: Upload exact sources, receipts, render, crop, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-171-render-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-171-render/output
            ${{ runner.temp }}/card-backfill-uc-171-render/run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
