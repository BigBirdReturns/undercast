name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v11'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      EXACT_MAIN: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      BRANCH: agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-707f-v11
      SELF: .github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11.yml
      OUT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11
      RECOVERY_ROOT: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v11
      CONTROL: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v11
      BOOTSTRAP: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v11
      V10S_RUN: "31272392948"
      V10S_JOB: "93140435524"
      V10S_ARTIFACT: "9026033901"
      V10S_HEAD: 69ba7d0bfe7e88a64ac6008330cfbb0adaf46b68
      V10S_ZIP_SHA256: 452f17a07e8363f2a40e2c2f562967c3eae06e6f938e7a4697d8fff4056a8a60
      V10_RUNNER_SHA256: ab0b84031df4007c2a4d2dea87e34c6eaff60c2b600d638c8e7f5ba384442bdb
      V10_RUNNER_BYTES: "7847"
      V11_RUNNER_SHA256: 54ee590e82011482efc5c7ee0b5f2ee100b4571915136324c94893f910571e39
      V11_RUNNER_BYTES: "8972"
      V6_ENV_SHA256: 136969de3aec603a2a890e10ace4f5a6ae40598d09c838fe56f293c1c83de137
      V6_ENV_BYTES: "3250"
      V7_MATERIALIZER_SHA256: d9b76ea08805fef3473cd72e5185d238bdfc1ca46bb44ef56fcc32636c3d71ea
      V7_MATERIALIZER_BYTES: "39288"
      V8_MATERIALIZER_SHA256: 0909632b012f06bc111e631c9e0a3e6923a591d9427da638e0bb6821e9ba7e44
      V8_MATERIALIZER_BYTES: "39387"
      V9_MATERIALIZER_SHA256: 67df1640cec61dc20c9e7d737af42a486cf97bbae6e753f392cf4b0815cdd682
      V9_MATERIALIZER_BYTES: "40147"
      V10_MATERIALIZER_SHA256: 3be914e59f06dfe83d7d0b53589b3cceac979e755262abafbd06bc6e1081b90f
      V10_MATERIALIZER_BYTES: "40571"
      V11_MATERIALIZER_SHA256: a2132e14877d845ea4d5c1d454b71f45e5b6ea58e6b036c73d0336f658c78844
      V11_MATERIALIZER_BYTES: "40605"
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Recover exact V10S failure and patch mandatory journal envelope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$CONTROL" "$OUT" "$RECOVERY_ROOT"
          mkdir -p "$BOOTSTRAP"/{api,archive,receipt} "$CONTROL"
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          test "$PR_BASE_SHA" = "$EXACT_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$EXACT_MAIN"..HEAD)"
          test "$(git diff --name-only "$EXACT_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$EXACT_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$BOOTSTRAP/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$BOOTSTRAP/api/files.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V10S_RUN" > "$BOOTSTRAP/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$V10S_JOB" > "$BOOTSTRAP/api/job.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V10S_ARTIFACT" > "$BOOTSTRAP/api/artifact.json"
          ROOT="$BOOTSTRAP" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          pr=json.loads((root/'api/pr.json').read_text())
          files=json.loads((root/'api/files.json').read_text())
          run=json.loads((root/'api/run.json').read_text())
          job=json.loads((root/'api/job.json').read_text())
          artifact=json.loads((root/'api/artifact.json').read_text())
          assert pr['number']==int(os.environ['PR_NUMBER'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['EXACT_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['PR_HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          assert len(files)==1 and files[0]['filename']==os.environ['SELF'] and files[0]['status']=='added'
          assert run['id']==int(os.environ['V10S_RUN']) and run['status']=='completed' and run['conclusion']=='failure'
          assert run['head_sha']==os.environ['V10S_HEAD']
          assert job['id']==int(os.environ['V10S_JOB']) and job['run_id']==int(os.environ['V10S_RUN'])
          assert job['status']=='completed' and job['conclusion']=='failure'
          steps={row['name']:(row['status'],row['conclusion']) for row in job['steps']}
          assert steps['Recover exact V10 runner and exact V6 transaction environment']==('completed','success')
          assert steps['Execute exact candidate transaction with restored transaction environment']==('completed','failure')
          assert artifact['id']==int(os.environ['V10S_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['V10S_ZIP_SHA256']
          assert artifact['workflow_run']['id']==int(os.environ['V10S_RUN'])
          assert artifact['workflow_run']['head_sha']==os.environ['V10S_HEAD']
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V10S_ARTIFACT/zip" > "$BOOTSTRAP/archive/v10s.zip"
          test "$(sha256sum "$BOOTSTRAP/archive/v10s.zip" | cut -d' ' -f1)" = "$V10S_ZIP_SHA256"
          ROOT="$BOOTSTRAP" RUNNER="$CONTROL/recovered-run.sh" python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root=pathlib.Path(os.environ['ROOT'])
          runner_name='doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v10s/recovered-run.sh'
          env_name='doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v10s/receipt/v6-source-env.json'
          with zipfile.ZipFile(root/'archive/v10s.zip') as z:
              infos=z.infolist()
              names=[row.filename for row in infos]
              assert infos and len(names)==len(set(names))
              for row in infos:
                  path=pathlib.PurePosixPath(row.filename)
                  assert not path.is_absolute() and '..' not in path.parts
              assert names.count(runner_name)==1 and names.count(env_name)==1
              runner_data=z.read(runner_name)
              env_data=z.read(env_name)
          assert len(runner_data)==int(os.environ['V10_RUNNER_BYTES'])
          assert hashlib.sha256(runner_data).hexdigest()==os.environ['V10_RUNNER_SHA256']
          assert len(env_data)==int(os.environ['V6_ENV_BYTES'])
          assert hashlib.sha256(env_data).hexdigest()==os.environ['V6_ENV_SHA256']
          text=runner_data.decode()
          old='''bash -n "$script"
          chmod 700 "$script"
          "$script"
          mkdir -p "$OUT/source"
          cp "$script" "$OUT/source/materialize-v10.sh"
          sha256sum "$script" > "$OUT/source/materialize-v10.sha256"'''
          new='''SCRIPT="$script" python3 - <<'PY_V11'
          import hashlib, os, re
          from pathlib import Path
          path=Path(os.environ['SCRIPT'])
          text=path.read_text()
          old="""assert set(merged[1]) == {'op', 'task_id', 'at', 'scope', 'performer', 'character', 'wall_ids'}
          assert set(reviewed[1]) == {'op', 'task_id', 'at', 'scope', 'performer', 'character', 'lease_id', 'reviewed_by', 'wall_ids', 'review_sha256'}"""
          new="""assert set(merged[1]) == {'id', 'version', 'op', 'task_id', 'at', 'scope', 'performer', 'character', 'wall_ids'}
          assert set(reviewed[1]) == {'id', 'version', 'op', 'task_id', 'at', 'scope', 'performer', 'character', 'lease_id', 'reviewed_by', 'wall_ids', 'review_sha256'}"""
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          path.write_text(text)
          assert len(path.read_bytes())==int(os.environ['V11_MATERIALIZER_BYTES'])
          assert hashlib.sha256(path.read_bytes()).hexdigest()==os.environ['V11_MATERIALIZER_SHA256']
          blocks=re.findall(r"python3 - <<'PY'\\n(.*?)\\nPY", text, re.S)
          assert len(blocks)==10
          for index, block in enumerate(blocks, 1):
              compile(block, f'embedded-python-{index}', 'exec')
          PY_V11
          bash -n "$script"
          chmod 700 "$script"
          "$script"
          mkdir -p "$OUT/source"
          cp "$script" "$OUT/source/materialize-v11.sh"
          sha256sum "$script" > "$OUT/source/materialize-v11.sha256"'''
          assert text.count(old)==1
          text=text.replace(old,new)
          assert text.count(old)==0
          patched=text.encode()
          assert len(patched)==int(os.environ['V11_RUNNER_BYTES'])
          assert hashlib.sha256(patched).hexdigest()==os.environ['V11_RUNNER_SHA256']
          pathlib.Path(os.environ['RUNNER']).write_bytes(patched)
          (root/'receipt/recovered-run-v10.sh').write_bytes(runner_data)
          (root/'receipt/recovered-run-v11.sh').write_bytes(patched)
          (root/'receipt/v6-source-env.json').write_bytes(env_data)
          env=json.loads(env_data)
          assert sorted(env)==['ACCEPT_AT', 'AUDIT_AT', 'BRANCH', 'CLAIM_AT', 'COMMIT_AT', 'EVIDENCE_ARTIFACT', 'EVIDENCE_IDENTITY', 'EVIDENCE_RUN', 'EVIDENCE_ZIP_SHA256', 'EXACT_MAIN', 'EXPECTED_WALL_ID', 'FETCHED_AT', 'MERGE_AT', 'OUT', 'PATCHED_MATERIALIZER_SHA256', 'PORTRAIT_ARTIFACT', 'PORTRAIT_BYTES', 'PORTRAIT_JOB', 'PORTRAIT_METADATA_SHA256', 'PORTRAIT_ORIGIN', 'PORTRAIT_PRODUCER_IDENTITY', 'PORTRAIT_REVIEW_IDENTITY', 'PORTRAIT_RUN', 'PORTRAIT_SHA256', 'PORTRAIT_ZIP_SHA256', 'PREFLIGHT_ARTIFACT', 'PREFLIGHT_IDENTITY', 'PREFLIGHT_RUN', 'PREFLIGHT_ZIP_SHA256', 'PRODUCT_URL', 'RECOVERY_ARTIFACT', 'RECOVERY_HEAD', 'RECOVERY_JOB', 'RECOVERY_ROOT', 'RECOVERY_RUN', 'RECOVERY_ZIP_SHA256', 'REVIEW_ARTIFACT', 'REVIEW_AT', 'REVIEW_IDENTITY', 'REVIEW_RUN', 'REVIEW_ZIP_SHA256', 'SELECTION_BASIS', 'SELF', 'SOURCE_FINGERPRINT', 'SOURCE_MATERIALIZER_SHA256', 'SOURCE_PAGEID', 'SOURCE_REVISION', 'SOURCE_SHA256', 'SOURCE_TIMESTAMP', 'SOURCE_URL', 'SUBMIT_AT', 'TASK_ID']
          assert env['EXACT_MAIN']=='a9b1a29098e36f03340ff6678b3edd06f1d1d3e2'
          assert env['BRANCH']=='agent/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-a9b1-v6'
          assert env['SELF']=='.github/workflows/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v6.yml'
          assert env['RECOVERY_RUN']=='31248178316'
          assert env['RECOVERY_JOB']=='93080131128'
          assert env['RECOVERY_ARTIFACT']=='9019166030'
          assert env['RECOVERY_HEAD']=='3094a35d2c19069164c0867b0644f425255eac59'
          assert env['RECOVERY_ZIP_SHA256']=='3729c73d01e8cdc57631005c6440819019c214fde88939513a3a146307727f13'
          assert env['TASK_ID']=='ap_45bb5fdcdf4aff65aa7a87c3'
          assert env['EXPECTED_WALL_ID']=='UC-1354'
          excluded={'EXACT_MAIN','BRANCH','SELF','OUT','RECOVERY_ROOT'}
          imported=set(env)-excluded
          required={'RECOVERY_RUN','RECOVERY_JOB','RECOVERY_ARTIFACT','RECOVERY_HEAD','RECOVERY_ZIP_SHA256','TASK_ID','EXPECTED_WALL_ID','CLAIM_AT','SUBMIT_AT','MERGE_AT','REVIEW_AT','SOURCE_MATERIALIZER_SHA256','PATCHED_MATERIALIZER_SHA256'}
          assert required <= imported
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              for key in sorted(imported):
                  value=str(env[key])
                  assert '\n' not in value and '\r' not in value
                  fh.write(f'{key}={value}\n')
          PY
          bash -n "$CONTROL/recovered-run.sh"
          sha256sum "$BOOTSTRAP/receipt/recovered-run-v10.sh" > "$BOOTSTRAP/receipt/recovered-run-v10.sha256"
          sha256sum "$CONTROL/recovered-run.sh" > "$BOOTSTRAP/receipt/recovered-run-v11.sha256"
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$PR_NUMBER" "$PR_HEAD" >> "$GITHUB_ENV"

      - name: Execute exact candidate transaction with mandatory journal envelope
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$EXACT_MAIN"
          chmod 700 "$CONTROL/recovered-run.sh"
          exec "$CONTROL/recovered-run.sh"

      - name: Upload exact selected-portrait candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-candidate-v11
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-recovery-v11
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-control-v11
            /tmp/doctor-who-cycle-009-megnus-jaka-selected-portrait-bootstrap-v11
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
