name: jem-hadar-activation-controller

on:
  workflow_dispatch:
  push:
    branches: [agent/star-trek-jem-hadar-gold]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: jem-hadar-activation-controller
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref_name == 'agent/star-trek-jem-hadar-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/star-trek-jem-hadar-gold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical runtime
        run: npm ci
      - name: Verify predecessor receipt and exact single-species activation
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jem-hadar-activation"
          mkdir -p "$root"
          node scripts/star-trek-species-gold.mjs validate | tee "$root/species.log"
          node --input-type=module - <<'NODE' | tee "$root/activation-contract.log"
          import fs from 'node:fs';
          const plan=JSON.parse(fs.readFileSync('data/STAR-TREK-GOLD.json','utf8'));
          const fer=plan.sequence.find(row=>row.id==='ferengi');
          const jem=plan.sequence.find(row=>row.id==='jem-hadar');
          const active=plan.sequence.filter(row=>row.state==='active'||row.state==='candidate-gold');
          if(fer?.state!=='gold'||!fer.receipt?.merged_main_sha||!fer.receipt?.live_verified_at)throw new Error('Ferengi lacks merged-main/live gold receipt');
          if(jem?.state!=='active'||active.length!==1||active[0].id!=='jem-hadar')throw new Error('Jem’Hadar is not the sole active species');
          console.log(`PASS — Ferengi receipt ${fer.receipt.merged_main_sha}; Jem’Hadar sole active`);
          NODE
          npx playwright install --with-deps chromium
          npm run gate 2>&1 | tee "$root/gate-candidate.log"
      - name: Remove activation controller and publish permanent handoff head
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jem-hadar-activation"
          git config user.name 'undercast-species-gold'
          git config user.email 'undercast-species-gold@users.noreply.github.com'
          rm -f .github/workflows/jem-hadar-activation-controller.yml
          git add -A
          git diff --cached --check
          git commit -m "Star Trek species gold: seal Jem'Hadar activation"
          npm run gate 2>&1 | tee "$root/gate-permanent-head.log"
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/star-trek-jem-hadar-gold
          git rev-parse HEAD | tee "$root/head.txt"
      - name: Find or create the handoff PR and qualify exact-head checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jem-hadar-activation"
          repo="$GITHUB_REPOSITORY"
          head=$(cat "$root/head.txt")
          pr=""
          deadline=$((SECONDS+600))
          while (( SECONDS < deadline )); do
            pr=$(gh pr list --repo "$repo" --head agent/star-trek-jem-hadar-gold --base main --state open --json number --jq '.[0].number // empty')
            [ -n "$pr" ] && break
            sleep 10
          done
          if [ -z "$pr" ]; then
            gh pr create --repo "$repo" --head agent/star-trek-jem-hadar-gold --base main --draft --title "Star Trek species gold 002: activate Jem'Hadar after Ferengi" --body "Ferengi is gold from exact merged-main and live Pages receipts. This activates exactly one next species: Jem'Hadar. No Tellarite or later species is active." > "$root/pr-url.txt"
            pr=$(gh pr list --repo "$repo" --head agent/star-trek-jem-hadar-gold --base main --state open --json number --jq '.[0].number')
          fi
          echo "$pr" > "$root/pr-number.txt"
          workflows=$(gh api "repos/$repo/actions/workflows")
          for wanted in archive-contract collection-policy preservation-export; do
            id=$(echo "$workflows" | jq -r --arg n "$wanted" '.workflows[]|select(.name==$n)|.id' | head -n1)
            if [ -n "$id" ]; then gh api --method POST "repos/$repo/actions/workflows/$id/dispatches" -f ref=agent/star-trek-jem-hadar-gold >"$root/dispatch-$wanted.log" 2>&1 || true; fi
          done
          deadline=$((SECONDS+2700))
          while (( SECONDS < deadline )); do
            runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100")
            echo "$runs" > "$root/exact-head-runs.json"
            echo "$runs" | jq -r '.workflow_runs[]|select(.conclusion=="action_required")|.id' | while read -r id; do
              [ -n "$id" ] || continue
              gh api --method POST "repos/$repo/actions/runs/$id/approve" >"$root/approve-$id.log" 2>&1 || gh api --method POST "repos/$repo/actions/runs/$id/rerun" >"$root/rerun-$id.log" 2>&1 || true
            done
            all=1
            for wanted in archive-contract collection-policy preservation-export; do
              conclusion=$(echo "$runs" | jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion // "missing"')
              [ "$conclusion" = success ] || all=0
              if [[ "$conclusion" =~ ^(failure|cancelled|timed_out|startup_failure)$ ]]; then echo "$wanted failed: $conclusion" >&2; exit 20; fi
            done
            [ "$all" = 1 ] && break
            sleep 20
          done
          runs=$(gh api "repos/$repo/actions/runs?head_sha=$head&per_page=100")
          for wanted in archive-contract collection-policy preservation-export; do test "$(echo "$runs" | jq -r --arg n "$wanted" '[.workflow_runs[]|select(.name==$n)]|sort_by(.created_at)|last|.conclusion')" = success; done
          gh pr ready "$pr" --repo "$repo" || true
          result=$(gh api --method PUT "repos/$repo/pulls/$pr/merge" -f merge_method=merge -f sha="$head")
          echo "$result" > "$root/merge.json"
          test "$(echo "$result" | jq -r .merged)" = true
          echo "$result" | jq -r .sha > "$root/merge-sha.txt"
      - name: Verify merged main and live Pages activation
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/jem-hadar-activation"
          merge_sha=$(cat "$root/merge-sha.txt")
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$merge_sha"
          git checkout --detach "$merge_sha"
          npm run gate 2>&1 | tee "$root/gate-merged-main.log"
          node --input-type=module - <<'NODE' | tee "$root/merged-activation.log"
          import fs from 'node:fs';
          const plan=JSON.parse(fs.readFileSync('data/STAR-TREK-GOLD.json','utf8'));
          const fer=plan.sequence.find(row=>row.id==='ferengi');const jem=plan.sequence.find(row=>row.id==='jem-hadar');
          const active=plan.sequence.filter(row=>row.state==='active'||row.state==='candidate-gold');
          if(fer?.state!=='gold'||jem?.state!=='active'||active.length!==1||active[0].id!=='jem-hadar')throw new Error('merged species state is not Ferengi gold / Jem’Hadar sole active');
          console.log('PASS — merged main has Ferengi gold and Jem’Hadar sole active');
          NODE
          local_sha=$(sha256sum data/archive.json | awk '{print $1}')
          deadline=$((SECONDS+1800))
          while (( SECONDS < deadline )); do
            q=$(date +%s)
            curl -fsSL --retry 2 "https://bigbirdreturns.github.io/undercast/data/archive.json?v=$q" -o "$root/live-archive.json" || { sleep 20; continue; }
            [ "$(sha256sum "$root/live-archive.json" | awk '{print $1}')" = "$local_sha" ] && break
            sleep 20
          done
          test "$(sha256sum "$root/live-archive.json" | awk '{print $1}')" = "$local_sha"
          echo "$local_sha" > "$root/live-archive-sha.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$root/live-verified-at.txt"
      - name: Retain activation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jem-hadar-activation-${{ github.run_id }}
          path: ${{ runner.temp }}/jem-hadar-activation
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
