  DEFAULT_WEBP_BYTES: "32034"
  DEFAULT_WEBP_SHA1: 686cc98189739cf6770b4e1cca62ba73783872bc
  DEFAULT_WEBP_SHA256: ef994c5df9b22e1982c20e944e4fe3cef1368e49163dd51751ca635f60dcb983
  GH_TOKEN: ${{ github.token }}

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 3
          filter: blob:none
          sparse-checkout-cone-mode: false
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census.yml
            .github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64
            data
            images
            scripts

      - name: Bind the paid V6 ancestry failure and exact unchanged payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" /tmp/kreg-v7-census
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "2"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test "$(git rev-parse HEAD^)" = "$PAYLOAD_COMMIT"
          test "$(git show -s --format=%P "$PAYLOAD_COMMIT")" = "$EXACT_MAIN"
          test "$(git rev-parse "$PAYLOAD_COMMIT:$PAYLOAD")" = "$PAYLOAD_BLOB"
          test "$(sha256sum "$PAYLOAD" | awk '{print $1}')" = "$PAYLOAD_B64_SHA256"

          git fetch --no-tags --filter=blob:none origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}" \
            "+refs/heads/${V6_BRANCH}:refs/remotes/origin/${V6_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${HEAD_BRANCH})" = "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/${V6_BRANCH})" = "$V6_HEAD"
          test "$(git show -s --format=%P "$V6_HEAD")" = "$PAYLOAD_COMMIT"
          test "$(git rev-parse "$V6_HEAD:$V6_PATH")" = "$V6_BLOB"
          git show "$V6_HEAD:$V6_PATH" > "$OUT/v6-wrapper.yml"
          git hash-object "$OUT/v6-wrapper.yml" | grep -Fx "$V6_BLOB"
          grep -F 'fetch-depth: 2' "$OUT/v6-wrapper.yml" >/dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V6_RUN}" > "$OUT/v6-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V6_RUN}/jobs?per_page=100" > "$OUT/v6-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${V6_RUN}/artifacts?per_page=100" > "$OUT/v6-artifacts.json"
          jq -e --argjson run "$V6_RUN" --arg head "$V6_HEAD" --arg branch "$V6_BRANCH" '
            .id==$run and .head_sha==$head and .head_branch==$branch and
            .status=="completed" and .conclusion=="failure" and .event=="pull_request"
          ' "$OUT/v6-run.json" >/dev/null
          jq -e --argjson job "$V6_JOB" '
            any(.jobs[];
              .id==$job and .name=="census" and .status=="completed" and .conclusion=="failure" and
              any(.steps[]; .name=="Run actions/checkout@v4" and .conclusion=="success") and
              any(.steps[]; .name=="Verify and execute checksum-bound read-only census payload" and .conclusion=="failure") and
              any(.steps[]; .name=="Upload exact Kreg bounded route-census packet" and .conclusion=="failure")
            )
          ' "$OUT/v6-jobs.json" >/dev/null
          jq -e '.total_count==0 and (.artifacts|length)==0' "$OUT/v6-artifacts.json" >/dev/null

          base64 -d "$PAYLOAD" > /tmp/kreg-v7-census/census.sh.gz
          test "$(sha256sum /tmp/kreg-v7-census/census.sh.gz | awk '{print $1}')" = "$PAYLOAD_GZIP_SHA256"
          gzip -dc /tmp/kreg-v7-census/census.sh.gz > /tmp/kreg-v7-census/census.sh
          test "$(sha256sum /tmp/kreg-v7-census/census.sh | awk '{print $1}')" = "$PAYLOAD_SCRIPT_SHA256"
          chmod 0555 /tmp/kreg-v7-census/census.sh

      - name: Execute the unchanged checksum-bound structural census program
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/kreg-v7-census/census.sh

      - name: Seal a self-hashed V7 envelope over the exact V6 program receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/recovery-receipt.json"
          test -f "$OUT/route-census-summary.json"
          test -f "$OUT/kreg-media-recovery-metadata.json"
          test -f "$OUT/boundary.json"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const sha = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === 'object'
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const pretty = (value) => `${JSON.stringify(stable(value), null, 2)}\n`;
          const readBytes = (name) => fs.readFileSync(`${out}/${name}`);
          const child = JSON.parse(readBytes('recovery-receipt.json'));
          const summary = JSON.parse(readBytes('route-census-summary.json'));
          const boundary = JSON.parse(readBytes('boundary.json'));
          if (child.transaction !== 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V6-CENSUS') throw new Error('child program transaction drifted');
          if (child.exact_main !== process.env.EXACT_MAIN || child.carrier_head !== process.env.HEAD_SHA) throw new Error('child program binding drifted');
          if (child.run_id !== Number(process.env.GITHUB_RUN_ID) || child.task_id !== process.env.TASK_ID) throw new Error('child run or task drifted');
          if (summary.route_count !== 18 || summary.attempt_count !== 54) throw new Error('route matrix denominator drifted');
          if (!boundary.public_original_representation_recovered || boundary.visual_review_completed) throw new Error('boundary drifted');
          const envelope = {
            schema_version: 1,
            transaction: 'DOCTOR-WHO-CYCLE-008-KREG-MEDIA-RECOVERY-V7-CENSUS',
            verdict: summary.verdict,
            exact_main: process.env.EXACT_MAIN,
            carrier_head: process.env.HEAD_SHA,
            payload_commit: process.env.PAYLOAD_COMMIT,
            payload_path: process.env.PAYLOAD,
            payload_blob: process.env.PAYLOAD_BLOB,
            payload_base64_sha256: process.env.PAYLOAD_B64_SHA256,
            payload_gzip_sha256: process.env.PAYLOAD_GZIP_SHA256,
            payload_script_sha256: process.env.PAYLOAD_SCRIPT_SHA256,
            run_id: Number(process.env.GITHUB_RUN_ID),
            job_id: child.job_id,
            task_id: process.env.TASK_ID,
            route_count: summary.route_count,
            header_profiles: 3,
            attempt_count: summary.attempt_count,
            successful_attempts: summary.successful_attempts,
            exact_upload_identity_recovered: summary.exact_upload_identity_recovered,
            public_original_sha256: process.env.PUBLIC_JPEG_SHA256,
            replayed_program: {
              transaction: child.transaction,
              receipt_file_sha256: sha(readBytes('recovery-receipt.json')),
              route_summary_sha256: sha(readBytes('route-census-summary.json')),
              metadata_sha256: sha(readBytes('kreg-media-recovery-metadata.json')),
              boundary_sha256: sha(readBytes('boundary.json'))
            },
            paid_v6: {
              run_id: Number(process.env.V6_RUN),
              job_id: Number(process.env.V6_JOB),
              head: process.env.V6_HEAD,
              workflow_path: process.env.V6_PATH,
              workflow_blob: process.env.V6_BLOB,
              artifact_count: 0,
              reason: 'fetch-depth 2 supplied the wrapper and payload commits but omitted their exact main parent, so the ancestry proof failed before any route request or evidence file'
            },
            checks: {
              exact_two_commit_carrier: true,
              exact_v6_payload_reused: true,
              three_commit_checkout_depth: true,
              v6_zero_artifact_failure_bound: true,
              bounded_route_header_matrix_completed: true,
              public_original_representation_converged: true,
              default_webp_derivative_reproduced: true,
              duplicate_adoption_refused: true,
              live_main_rebound: true
            },
            boundary: {
              repository_written: false,
              visual_adjudication_completed: false,
              lease_issued: false,
              queue_mutated: false,
              canonical_record_created: false,
              media_adopted: false,
              waterline_event_written: false,
              cycle_receipt_written: false,
              product_published: false,
              outside_human_dependency: false
            }
          };
          const body = pretty(envelope);
          envelope.receipt_sha256 = sha(Buffer.from(body));
          const finalBytes = Buffer.from(pretty(envelope));
          fs.writeFileSync(`${out}/v7-recovery-receipt.json`, finalBytes);
          fs.writeFileSync(`${out}/v7-recovery-receipt.file.sha256`, `${sha(finalBytes)}  v7-recovery-receipt.json\n`);
          const verify = JSON.parse(finalBytes);
          const expected = verify.receipt_sha256;
          delete verify.receipt_sha256;
          if (sha(Buffer.from(pretty(verify))) !== expected) throw new Error('V7 receipt self-hash drifted');
          NODE
          test -z "$(git status --porcelain)"

      - name: Upload exact Kreg V7 bounded route-census packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-008-kreg-media-recovery-v7-structural-census-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
