name: doctor-who-cycle-008-kreg-media-recovery-v7-structural-census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census.yml"
      - ".github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64"

permissions:
  contents: read
  actions: read

concurrency:
  group: doctor-who-cycle-008-kreg-media-recovery-v7-structural-census-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SELF: .github/workflows/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census.yml
  PAYLOAD: .github/doctor-who-cycle-008/kreg-media-recovery-v6-structural-census.sh.gz.b64
