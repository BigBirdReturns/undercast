  PAYLOAD_B64_SHA256: 352c7d7931b4a685daa0a9b66115e6f7d3fc97268c785f9a6ab3ec0d0103d52f
  PAYLOAD_GZIP_SHA256: b13f60d33e14a815f9f2726eb36ed0f4f84e5845afc5a57722ab3b2a3f7e307c
  PAYLOAD_SCRIPT_SHA256: 3bf24df1df2ee04bb7542a69fe0cab3c61f5dec4b443107b92f0e6e825a0e890
  EXACT_MAIN: 37d681f419db5ef874b2cc41df1c631c047218d8
  CARRIER_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  OUT: /tmp/doctor-who-cycle-008-kreg-media-recovery-v7-structural-census

  V6_BRANCH: agent/doctor-who-cycle-008-kreg-media-recovery-v6-structural-census
  V6_HEAD: a60e54595788f50a4ea446e2de02219a4cf10172
