name: materialize-cycle006-chronology-composability

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/materialize-cycle006-chronology-composability.yml"
      - "tmp/doctor-who-cycle-006-chronology-composable.mjs"
      - "tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs"

permissions:
  contents: write
  actions: read

concurrency:
  group: materialize-cycle006-chronology-composability
  cancel-in-progress: false

env:
  EXACT_MAIN: f5e6919cfcb0491e2a62c64935a6d689b66b27c1
  CARRIER_BRANCH: agent/doctor-who-cycle-006-chronology-composability-materializer
  PRODUCT_BRANCH: agent/doctor-who-cycle-006-chronology-composability
  SELF: .github/workflows/materialize-cycle006-chronology-composability.yml
  CHECKER: tmp/doctor-who-cycle-006-chronology-composable.mjs
  MATERIALIZER: tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs
  CHECKER_BLOB: 2bd8889c4e35cb710691e5341ed1c36be21f05f9
  CHECKER_SHA256: 250c819c85121658ab903418f1ee9e89315f112581442ad02ef1ba1aee1b67d1
  MATERIALIZER_BLOB: 36f35cd5ad3588c476ce9ffbcb5cb17e65720f5d
  MATERIALIZER_SHA256: 405876dc45fdd16fd7eba3794817fb8049971ac2005c7941f6b14c16cde28fe9
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  OUT: /tmp/cycle006-chronology-composability

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-006-chronology-composability-materializer'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact chronology floor and three-path carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          test "$(git merge-base "$EXACT_MAIN" HEAD)" = "$EXACT_MAIN"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CARRIER_BRANCH}:refs/remotes/origin/${CARRIER_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CARRIER_BRANCH})" = "$HEAD_SHA"

          printf '%s\n' "$SELF" "$CHECKER" "$MATERIALIZER" | LC_ALL=C sort > "$OUT/expected-carrier-paths.txt"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/actual-carrier-paths.txt"
          diff -u "$OUT/expected-carrier-paths.txt" "$OUT/actual-carrier-paths.txt"
          test "$(git rev-parse "HEAD:$CHECKER")" = "$CHECKER_BLOB"
          test "$(git rev-parse "HEAD:$MATERIALIZER")" = "$MATERIALIZER_BLOB"
          git show "HEAD:$CHECKER" > /tmp/doctor-who-cycle-006-chronology-composable.mjs
          git show "HEAD:$MATERIALIZER" > /tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs
          test "$(sha256sum /tmp/doctor-who-cycle-006-chronology-composable.mjs | cut -d' ' -f1)" = "$CHECKER_SHA256"
          test "$(sha256sum /tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs | cut -d' ' -f1)" = "$MATERIALIZER_SHA256"
          node --check /tmp/doctor-who-cycle-006-chronology-composable.mjs
          node --check /tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs

      - name: Materialize and stage exact three-path composability product
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXACT_MAIN"
          git checkout -B "$PRODUCT_BRANCH"
          CHECKER_PAYLOAD=/tmp/doctor-who-cycle-006-chronology-composable.mjs \
            node /tmp/materialize-doctor-who-cycle-006-chronology-composability.mjs
          printf '%s\n' \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json \
            package.json \
            scripts/doctor-who-cycle-006-chronology-composable.mjs \
            | LC_ALL=C sort > "$OUT/expected-product-paths.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } | LC_ALL=C sort > "$OUT/actual-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/actual-product-paths.txt"
          git add \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json \
            package.json \
            scripts/doctor-who-cycle-006-chronology-composable.mjs
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/staged-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/staged-product-paths.txt"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          node scripts/doctor-who-cycle-006-chronology-composable.mjs | tee "$OUT/composability-check.log"
          node scripts/doctor-who-cycle-006.mjs | tee "$OUT/cycle-006-check.log"
          sha256sum \
            data/review/adapter-sdk/doctor-who-cycle-006-candidate-chronology-composability.json \
            package.json \
            scripts/doctor-who-cycle-006-chronology-composable.mjs \
            > "$OUT/product-paths.sha256"

      - name: Run complete repository and rendered gate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run gate | tee "$OUT/complete-gate.log"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | LC_ALL=C sort > "$OUT/post-gate-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/post-gate-product-paths.txt"

      - name: Publish one-commit workflow-free product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXACT_MAIN"
          git config user.name "undercast-chronology-composability"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Doctor Who: make cycle 006 chronology future-composable"
          product_commit="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$EXACT_MAIN"
          test "$(git rev-list --count "$EXACT_MAIN"..HEAD)" = "1"
          git diff --name-only "$EXACT_MAIN"...HEAD | LC_ALL=C sort > "$OUT/committed-product-paths.txt"
          diff -u "$OUT/expected-product-paths.txt" "$OUT/committed-product-paths.txt"
          test -z "$(git status --porcelain)"
          printf 'product_commit=%s\nproduct_tree=%s\n' \
            "$product_commit" "$(git rev-parse 'HEAD^{tree}')" > "$OUT/product-identity.txt"
          git push --force-with-lease origin "HEAD:refs/heads/${PRODUCT_BRANCH}"

      - name: Upload exact composability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle006-chronology-composability-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
