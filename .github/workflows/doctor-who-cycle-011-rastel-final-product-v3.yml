          receipt={'status':'cycle-011-rastel-final-product-v3-outer-source-recovered','job':job,'source_commit':source_commit,'source_blob':source_blob,'source_sha256':hashlib.sha256(raw).hexdigest(),'scripts':rows,'bootstrap_outside_transaction_roots':True}; receipt['identity']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest(); (root/f'{job}-recovery.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
