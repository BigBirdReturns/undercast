name: observe-gredd-cycle-002-final-evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/observe-gredd-cycle-002-final-evidence.yml"

permissions:
  actions: read
  contents: read

env:
  ARCHIVE_WORKFLOW_ID: 311898827
  EXACT_MERGE: 2dc76b41c92af6326be15102ee0f38e2a4493526
  GH_TOKEN: ${{ github.token }}

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/undercast'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture exact post-merge archive-contract run
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${ARCHIVE_WORKFLOW_ID}/runs?branch=main&event=push&per_page=20" \
            --jq ".workflow_runs[] | select(.head_sha == \"${EXACT_MERGE}\") | .id" \
            | head -n 1)"
          test -n "$run_id"
          test "$run_id" -gt 0
          echo "POST_MERGE_ARCHIVE_RUN_ID=$run_id"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
            --jq '{id,name,event,status,conclusion,run_number,run_attempt,head_branch,head_sha,created_at,updated_at,run_started_at,html_url}'
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
            --jq '{jobs:[.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{number,name,status,conclusion}]}]}'
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '{artifacts:[.artifacts[]|{id,name,size_in_bytes,expired,created_at,expires_at,digest}]}'
