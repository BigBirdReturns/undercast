name: estate-adopt-exact-null-batch-006

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/estate-adopt-exact-null-batch-006.yml
      - scripts/estate-adopt-exact-null-batch.mjs
      - data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION-PLAN.json
      - data/review/estate-debt/COLLECT-006-NULL-BINDING-ADJUDICATION.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: estate-adopt-exact-null-batch-006
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.pull_request.number || 132 }}
  TARGET_BRANCH: agent/estate-consolidation-001
  AUTHORIZED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTOR: scripts/estate-adopt-exact-null-batch.mjs
  PLAN: data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION-PLAN.json
  RECEIPT: data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION.json
  PUBLICATION: data/review/estate-debt/COLLECT-006-PUBLICATION.json
  LEDGER: data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json

jobs:
  adopt:
    if: github.repository == 'BigBirdReturns/undercast' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.AUTHORIZED_HEAD }}
          fetch-depth: 0

      - name: Establish exact-head custody
        id: custody
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          test -z "$(git status --porcelain)"
          echo "head=$AUTHORIZED_HEAD" >> "$GITHUB_OUTPUT"

      - name: Announce terminally adjudicated product payment
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-006 exact-current-null adoption started on workflow run $GITHUB_RUN_ID.

          Authorized head: ${{ steps.custody.outputs.head }}.
          Terminally adjudicated obligations: UC-047/still, UC-051/still, and UC-060/still.

          Each current specimen and source row must still agree on null, the portrait side must remain complete, the versioned destination must remain absent, and the packet must retain exact independent review, checksum, duplicate, and crop custody. The complete visitor-facing candidate tree will be smoke-gated before any acceptance receipt exists.
          EOF_COMMENT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install rendered-browser dependency
        run: npx playwright install --with-deps chromium

      - name: Prove reducer semantics and prior cumulative custody
        run: |
          set -euo pipefail
          node --check "$EXECUTOR"
          node "$EXECUTOR" --fixtures
          node scripts/estate-canonical-adoption-ledger.mjs
          cp data/quality.json /tmp/COLLECT-006-quality-before.json

      - name: Prove exact current-null denominator and packet custody
        run: |
          set -euo pipefail
          node "$EXECUTOR" --plan "$PLAN" | tee /tmp/COLLECT-006-preflight.json
          test "$(node -p "require('/tmp/COLLECT-006-preflight.json').authorized")" = "3"
          test "$(node -p "require('/tmp/COLLECT-006-preflight.json').pending")" = "3"
          test "$(node -p "require('/tmp/COLLECT-006-preflight.json').already_adopted")" = "0"

      - name: Apply exact planned media without acceptance receipt
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node "$EXECUTOR" \
            --plan "$PLAN" \
            --now "$NOW" \
            --report /tmp/COLLECT-006-apply.json \
            --write
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"

      - name: Rebuild audit, serving projections, and permanent records
        run: |
          set -euo pipefail
          npm run media:audit -- sync
          node scripts/shard.mjs
          node scripts/build-record-pages.mjs

      - name: Validate exact quality payment before smoke
        run: |
          set -euo pipefail
          node "$EXECUTOR" \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-006-quality-before.json \
            --validate | tee /tmp/COLLECT-006-validation.json
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"

      - name: Stage only the visitor-facing candidate tree
        id: candidate
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | sed -E 's/^.. //' | sort -u)"
          test -n "$CHANGED"
          while IFS= read -r changed_path; do
            case "$changed_path" in
              data/*|records/*|images/uc-047-still-c751a3c4115c.jpg|images/uc-051-still-a6e23837c93a.jpg|images/uc-060-still-1322a48f78fc.jpg) ;;
              *) echo "Unexpected COLLECT-006 candidate path: $changed_path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"
          git add -A
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-006-candidate.patch
          git write-tree > /tmp/COLLECT-006-candidate.tree
          git diff --cached --quiet && { echo 'COLLECT-006 produced no candidate tree.' >&2; exit 1; }
          echo "tree=$(cat /tmp/COLLECT-006-candidate.tree)" >> "$GITHUB_OUTPUT"

      - name: Smoke-gate exact candidate tree
        run: npm run gate

      - name: Refuse post-smoke drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-006-candidate.tree)" = "$(git write-tree)"
          test ! -e "$RECEIPT"
          test ! -e "$PUBLICATION"
          node "$EXECUTOR" \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-006-quality-before.json \
            --validate

      - name: Promote acceptance receipt and cumulative ledger after smoke
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CANDIDATE_TREE="$(cat /tmp/COLLECT-006-candidate.tree)"
          node "$EXECUTOR" \
            --plan "$PLAN" \
            --before-quality /tmp/COLLECT-006-quality-before.json \
            --receipt "$RECEIPT" \
            --ledger "$LEDGER" \
            --authorized-parent "$AUTHORIZED_HEAD" \
            --gated-tree "$CANDIDATE_TREE" \
            --workflow-run "$GITHUB_RUN_ID" \
            --now "$NOW" \
            --promote | tee /tmp/COLLECT-006-promotion.json
          node scripts/estate-canonical-adoption-ledger.mjs | tee /tmp/COLLECT-006-ledger-validation.json
          git add -- "$RECEIPT" "$LEDGER"
          git diff --exit-code

      - name: Retire mutation workflow and stage adoption commit
        run: |
          set -euo pipefail
          git rm .github/workflows/estate-adopt-exact-null-batch-006.yml
          git add -- "$RECEIPT" "$LEDGER"
          PROMOTION_PATHS="$(git diff --cached --name-only "$(cat /tmp/COLLECT-006-candidate.tree)" | sort)"
          EXPECTED_PATHS="$(printf '%s\n%s\n%s\n' \
            '.github/workflows/estate-adopt-exact-null-batch-006.yml' \
            "$LEDGER" \
            "$RECEIPT" | sort)"
          test "$PROMOTION_PATHS" = "$EXPECTED_PATHS"
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-006-adoption.patch
          git write-tree > /tmp/COLLECT-006-adoption.tree

      - name: Publish smoke-passed adoption under exact-head lease
        id: adoption
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$AUTHORIZED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate collection: adopt three exact-current-null packet winners' \
            -m 'transaction=COLLECT-006' \
            -m 'batch_adoptions=3' \
            -m 'cumulative_adoptions=15' \
            -m 'remaining_packet_review=40' \
            -m 'complete_pairs_delta=3' \
            -m 'missing_still_delta=-3' \
            -m "authorized_parent=${AUTHORIZED_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_candidate_tree=$(cat /tmp/COLLECT-006-candidate.tree)" \
            -m "published_tree=$(cat /tmp/COLLECT-006-adoption.tree)"
          ADOPTION_HEAD="$(git rev-parse HEAD)"
          ADOPTION_TREE="$(git rev-parse HEAD^{tree})"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${AUTHORIZED_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$ADOPTION_HEAD" >> "$GITHUB_OUTPUT"
          echo "tree=$ADOPTION_TREE" >> "$GITHUB_OUTPUT"

      - name: Reconcile published adoption and retire executor
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node "$EXECUTOR" \
            --receipt "$RECEIPT" \
            --publication "$PUBLICATION" \
            --ledger "$LEDGER" \
            --adoption-head "${{ steps.adoption.outputs.head }}" \
            --adoption-tree "${{ steps.adoption.outputs.tree }}" \
            --current-parent "${{ steps.adoption.outputs.head }}" \
            --now "$NOW" \
            --reconcile-publication | tee /tmp/COLLECT-006-publication.json
          node scripts/estate-canonical-adoption-ledger.mjs | tee /tmp/COLLECT-006-publication-ledger-validation.json
          git rm "$EXECUTOR"
          git add -- "$LEDGER" "$PUBLICATION"
          PATHS="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n%s\n%s\n' "$EXECUTOR" "$LEDGER" "$PUBLICATION" | sort)"
          test "$PATHS" = "$EXPECTED"
          git diff --cached --check
          git diff --cached --binary > /tmp/COLLECT-006-publication.patch
          git write-tree > /tmp/COLLECT-006-publication.tree

      - name: Gate final published-custody tree
        run: npm run gate

      - name: Refuse final-tree drift
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(cat /tmp/COLLECT-006-publication.tree)" = "$(git write-tree)"
          node scripts/estate-canonical-adoption-ledger.mjs

      - name: Publish final custody under adoption-head lease
        id: final
        run: |
          set -euo pipefail
          ADOPTION_HEAD="${{ steps.adoption.outputs.head }}"
          git fetch origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$ADOPTION_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Estate custody: reconcile COLLECT-006 publication and retire executor' \
            -m "adoption_head=${ADOPTION_HEAD}" \
            -m "adoption_tree=${{ steps.adoption.outputs.tree }}" \
            -m "authorized_parent=${ADOPTION_HEAD}" \
            -m "workflow_run=${GITHUB_RUN_ID}" \
            -m "gated_publication_tree=$(cat /tmp/COLLECT-006-publication.tree)"
          FINAL_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${ADOPTION_HEAD}" origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Report complete product payment
        if: success()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-006 passed every gate and published on workflow run $GITHUB_RUN_ID.

          ```text
          adoption head:       ${{ steps.adoption.outputs.head }}
          final custody head:  ${{ steps.final.outputs.head }}
          candidate tree:      $(cat /tmp/COLLECT-006-candidate.tree)
          adoption tree:       ${{ steps.adoption.outputs.tree }}
          final custody tree:  $(cat /tmp/COLLECT-006-publication.tree)
          adopted:             UC-047/still, UC-051/still, UC-060/still
          cumulative:          15 / 55
          remaining review:    40
          complete pairs:      690 → 693
          missing stills:      376 → 373
          missing both:        109 → 109
          ```

          The three prior-state gaps were resolved by exact current-head data rather than used as a golden cage. The candidate tree passed the complete repository gate and rendered-browser checks before the acceptance receipt existed. The published-custody tree passed the complete gate again, then the executor retired itself.
          EOF_COMMENT

      - name: Report failed transaction
        if: failure()
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<EOF_COMMENT
          COLLECT-006 failed closed on workflow run $GITHUB_RUN_ID.

          No new canonical payment claim is authorized unless the smoke-passed adoption commit and the final published-custody commit are both present on the exact branch. Inspect the failed packet, quality, gate, or lease boundary without rewriting retained evidence or substituting a missing human rescue gate.
          EOF_COMMENT

      - name: Preserve exact transaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COLLECT-006-exact-null-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/COLLECT-006-preflight.json
            /tmp/COLLECT-006-apply.json
            /tmp/COLLECT-006-validation.json
            /tmp/COLLECT-006-quality-before.json
            /tmp/COLLECT-006-candidate.patch
            /tmp/COLLECT-006-candidate.tree
            /tmp/COLLECT-006-promotion.json
            /tmp/COLLECT-006-ledger-validation.json
            /tmp/COLLECT-006-adoption.patch
            /tmp/COLLECT-006-adoption.tree
            /tmp/COLLECT-006-publication.json
            /tmp/COLLECT-006-publication-ledger-validation.json
            /tmp/COLLECT-006-publication.patch
            /tmp/COLLECT-006-publication.tree
            data/review/estate-debt/COLLECT-006-NULL-BINDING-ADJUDICATION.json
            data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION-PLAN.json
            data/review/estate-debt/COLLECT-006-CANONICAL-ADOPTION.json
            data/review/estate-debt/COLLECT-006-PUBLICATION.json
            data/review/estate-debt/CANONICAL-ADOPTION-LEDGER.json
            data/quality.json
          if-no-files-found: warn
          retention-days: 30
