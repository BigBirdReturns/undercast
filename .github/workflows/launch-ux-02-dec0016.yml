name: launch-ux-02-navigation-dec0016

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: launch-ux-02-navigation-dec0016
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ runner.temp }}/ux-02a-dec0016-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Materialize DEC-0016 on exact live main
        shell: bash
        run: bash tmp/materialize-ux-02-dec0016.sh

      - name: Upload DEC-0016 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-02a-dec0016-${{ github.run_id }}
          path: ${{ runner.temp }}/ux-02a-dec0016-evidence
          if-no-files-found: warn
          retention-days: 30
