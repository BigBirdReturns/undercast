name: card-backfill-uc-174-discover

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/CARD-BACKFILL-UC-174-DISCOVER.json"
      - ".github/CARD-BACKFILL-UC-174-DISCOVER-FAILURES.json"
      - "scripts/card-backfill-uc-174-discover-build.py"
      - ".github/workflows/card-backfill-uc-174-discover.yml"

permissions:
  contents: read

concurrency:
  group: card-backfill-uc-174-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event.pull_request.head.ref == 'agent/card-backfill-next-038'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/card-backfill-next-038
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install canonical and browser runtime
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install deterministic review renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/magick" <<'SH'
          #!/bin/sh
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$RUNNER_TEMP/bin/magick"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify repaired UC-174 three-role discovery authorization
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const row=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-174-DISCOVER.json','utf8'));
          const failures=JSON.parse(fs.readFileSync('.github/CARD-BACKFILL-UC-174-DISCOVER-FAILURES.json','utf8'));
          const specimen=JSON.parse(fs.readFileSync('data/specimens.json','utf8')).find(item=>item.id==='UC-174');
          const source=JSON.parse(fs.readFileSync('data/SOURCES.json','utf8')).find(item=>item.id==='UC-174');
          const audit=JSON.parse(fs.readFileSync('data/MEDIA-AUDIT.json','utf8')).items.find(item=>item.id==='ma_21dca9535e54bec8e0e15391');
          if(row.version!==1||row.record_id!=='UC-174'||row.kind!=='voice'||row.actor!=='John DiMaggio'||row.character!=='Bender, Jake the Dog, Marcus Fenix'||row.production!=='Futurama / Adventure Time / Gears of War'||row.years!=='1990s–'||row.side!=='still')throw new Error('UC-174 discovery authorization drift');
          if(failures.version!==1||failures.record_id!=='UC-174'||failures.failed_discovery_checkpoints?.length!==1||failures.failed_discovery_checkpoints[0]?.run_id!==30476509028||failures.failed_discovery_checkpoints[0]?.artifact_id!==8733847623||failures.failed_discovery_checkpoints[0]?.head_sha!=='1c02db8ceef0af383e65e96be561f6a566d46cd8'||failures.failed_discovery_checkpoints[0]?.artifact_digest_sha256!=='3b5a1a53a3a322fb0690eb071421d097d17fdcf64f3d62a7264812c87d4643f0')throw new Error('UC-174 failed discovery custody drift');
          if(row.selector_artifact?.artifact_id!==8733385683||row.selector_artifact?.head_sha!=='d9b696a3675d9fe0237ad0c765b4a215976ec87d'||row.selector_artifact?.zip_sha256!=='68156b05032defc61cfe90d7f9afdc933bdb7de64c26a4782f2f13ad1ee957e9'||row.selector_artifact?.selected_sha256!=='60724bc142396093a60ffbd7e2e954c63f4b40b2b61ebc27d3d95b7f50c8151b')throw new Error('UC-174 selector custody drift');
          if(row.scope_artifact?.artifact_id!==8733521198||row.scope_artifact?.head_sha!=='5dc1b9f03d78cc02afd3d32f332d9fed0503b023'||row.scope_artifact?.zip_sha256!=='bc17dec899b8be0007c6aa87184bdfb5cf8326550282cde0b120a64b80b2e414'||row.scope_artifact?.scope_sha256!=='21e8c533c0498dc2ec83e345a25c1a082a20d003be601a01bc209918e814985f')throw new Error('UC-174 scope custody drift');
          if(row.actor_role_pages?.length!==4||row.actor_role_pages.some(page=>page.strict!==true)||row.actor_role_pages[0]?.required_terms?.[3]!=='boozing robot Bender'||row.roles?.length!==3||row.roles[0]?.key!=='bender'||row.roles[1]?.key!=='jake'||row.roles[2]?.key!=='marcus')throw new Error('UC-174 repaired discovery denominator drift');
          if(row.selection_contract?.exact_three_role_cross_medium_character_composite_required!==true||JSON.stringify(row.selection_contract?.required_roles)!==JSON.stringify(['bender','jake','marcus'])||row.selection_contract?.minimum_candidates_per_role!==1||row.selection_contract?.maximum_candidates_per_role!==24||row.selection_contract?.strict_runtime_actor_role_pages_required!==4||row.selection_contract?.john_dimaggio_performance_required_for_all_three_roles!==true||row.selection_contract?.role_specific_production_medium_and_chronology_required!==true||row.selection_contract?.canonical_1990s_plus_is_broad_career_envelope_only!==true||row.selection_contract?.raw_revision_and_image_metadata_required_for_each_role!==true||row.selection_contract?.bender_futurama_character_required!==true||row.selection_contract?.jake_adventure_time_character_required!==true||row.selection_contract?.marcus_gears_game_character_required!==true||row.selection_contract?.single_role_or_two_role_candidate_forbidden!==true||row.selection_contract?.existing_performer_portrait_must_remain_unchanged!==true||row.selection_contract?.canonical_mutation!==false)throw new Error('UC-174 selection contract drift');
          if(!specimen||specimen.kind!=='voice'||specimen.actor!=='John DiMaggio'||specimen.character!=='Bender, Jake the Dog, Marcus Fenix'||specimen.production!=='Futurama / Adventure Time / Gears of War'||specimen.years!=='1990s–'||specimen.still||specimen.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 specimen boundary drift');
          if(!source||source.still||source.portrait?.src!=='images/uc-174-portrait.jpg')throw new Error('UC-174 source-ledger boundary drift');
          if(!audit||audit.wall_id!=='UC-174'||audit.side!=='still'||audit.status!=='absent'||audit.asset)throw new Error('UC-174 audit boundary drift');
          console.log('PASS — exact UC-174 retained failure and repaired Disney+ source term authorized');
          NODE
      - name: Build isolated discoverer from pinned gate-proven implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/BigBirdReturns/undercast/contents/scripts/card-backfill-uc-171-discover.mjs?ref=2bd6a22c521ba365e60367e1e39a7066d92699e1" --jq .content | tr -d '\n' | base64 -d > scripts/.card-backfill-uc-171-discover-source.mjs
          test "$(git hash-object scripts/.card-backfill-uc-171-discover-source.mjs)" = "3c5f75e8117407a60044f4078445b502aef9dfae"
          python3 scripts/card-backfill-uc-174-discover-build.py
          node --check scripts/.card-backfill-uc-174-discover-run.mjs
          echo "generated $(sha256sum scripts/.card-backfill-uc-174-discover-run.mjs | cut -d' ' -f1)"
      - name: Gather official role receipts, raw revisions, and cross-medium character candidates
        env:
          OUT: ${{ runner.temp }}/card-backfill-uc-174-discover
          MAGICK_CMD: magick
        run: |
          set -euo pipefail
          node scripts/.card-backfill-uc-174-discover-run.mjs 2>&1 | tee "$RUNNER_TEMP/card-backfill-uc-174-discover-run.log"
          rm scripts/.card-backfill-uc-171-discover-source.mjs scripts/.card-backfill-uc-174-discover-run.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Upload failure custody, official pages, raw revisions, candidates, hashes, and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-backfill-uc-174-discover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/card-backfill-uc-174-discover
            ${{ runner.temp }}/card-backfill-uc-174-discover-run.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
