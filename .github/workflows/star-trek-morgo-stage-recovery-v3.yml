name: star-trek-morgo-stage-recovery-v3

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: star-trek-morgo-stage-recovery-v3
  cancel-in-progress: false

env:
  EXPECTED_MAIN: 5afac948405d67c94090f2da55a510689e5eb583
  EXPECTED_TREE: 639b57c87ca23e895ec730099c0ce937eb1b88da
