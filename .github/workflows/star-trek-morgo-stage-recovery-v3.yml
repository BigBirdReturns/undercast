  MEDIA_REVIEW_SHA: f6f4ef76e5fa82554109621910242bb630e7aa18aee6321cca53552782113ecb
  MEDIA_REVIEW_PATH: transport/star-trek-morgo-media-review-v1/media-review.json
  CANDIDATE_BRANCH: agent/star-trek-morgo-candidate-v1
  CLAIM_BRANCH: agent/star-trek-morgo-claim-result-v1
  RESULT_BRANCH: agent/star-trek-morgo-stage-result-v3
  TASK_ID: ap_a7fb29c5cce85c86708ea0e6
  EXPECTED_PERFORMER: Fred Tatasciore
  EXPECTED_CHARACTER: Morgo
  EXPECTED_FINGERPRINT: 279c816ebd1b83899f5b257f7880df5734bb855f4206c2fc92c5278c9370ff46
  EXPECTED_LEASE: lease_578930730585295673ca706d
  WALL_ID: UC-1398
  EXPECTED_STILL_SHA: d9e6600f5b4c56540329bddd824b6d8392193f9c19cafebb6187d2872c21f548
  EXPECTED_PORTRAIT_SHA: ae19bcd09869d848fd74202fcc3c59ac41dbef153f7a33844c278b91b8d4ea5f
  STILL_ITEM_ID: ma_4cf320b41ba67ad4dbe2f5dd
  PORTRAIT_ITEM_ID: ma_8254f59b1cc6004f0fa5f1a2
  EXPECTED_BATCH_SHA: fc73ab0fc7226d123a718b7970c7213ad6dee8c4bc0e6fbcc8d9d34c8a950111
  PAYLOAD_PATH: .github/recovery/star-trek-morgo-stage-recovery-v3/payload.base64
  PAYLOAD_SHA256: 2d211a225534d7354d5a040138a97a280fdc82a17a32124cef336c8411ffb477
  PAYLOAD_ROOT: /tmp/star-trek-morgo-stage-recovery-v3-payload
  LIFECYCLE_SOURCE: /tmp/star-trek-morgo-stage-recovery-v3-payload/candidate-lifecycle.py
  BATCH_SOURCE: /tmp/star-trek-morgo-stage-recovery-v3-payload/batch.json
  CENSUS_HELPER_SOURCE: /tmp/star-trek-morgo-stage-recovery-v3-payload/census-refresh.sh
  STEPS_SOURCE: /tmp/star-trek-morgo-stage-recovery-v3-payload/steps
  LIFECYCLE: /tmp/star-trek-morgo-stage-recovery-v3.py
  BATCH: /tmp/star-trek-morgo-stage-recovery-v3-batch.json
  CENSUS_HELPER: /tmp/star-trek-morgo-stage-recovery-v3-census.sh
  STEPS_ROOT: /tmp/star-trek-morgo-stage-recovery-v3-steps
  SOURCE_REVIEW_ROOT: /tmp/star-trek-morgo-stage-recovery-v3/source-review
  MEDIA_ROOT: /tmp/star-trek-morgo-stage-recovery-v3/media
  MEDIA_REVIEW_ROOT: /tmp/star-trek-morgo-stage-recovery-v3/media-review
  OUT: /tmp/star-trek-morgo-stage-recovery-v3/output
  CENSUS_MAX_ATTEMPTS: 3
  CENSUS_RETRY_DELAY_SECONDS: 12

jobs:
  stage:
    name: stage-one-reviewed-morgo-candidate-v3
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/star-trek-morgo-stage-recovery-v3' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Materialize and verify the sealed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$PAYLOAD_ROOT" "$STEPS_ROOT" "$OUT" "$SOURCE_REVIEW_ROOT" "$MEDIA_ROOT" "$MEDIA_REVIEW_ROOT"
          mkdir -p "$PAYLOAD_ROOT" "$STEPS_ROOT" "$OUT" "$SOURCE_REVIEW_ROOT" "$MEDIA_ROOT" "$MEDIA_REVIEW_ROOT"
          tr -d '\n' < "$PAYLOAD_PATH" | base64 -d > /tmp/star-trek-morgo-stage-recovery-v3-runtime.tar.gz
          test "$(sha256sum /tmp/star-trek-morgo-stage-recovery-v3-runtime.tar.gz | awk '{print $1}')" = "$PAYLOAD_SHA256"
          tar -xzf /tmp/star-trek-morgo-stage-recovery-v3-runtime.tar.gz -C "$PAYLOAD_ROOT"
          (cd "$PAYLOAD_ROOT" && sha256sum -c manifest.sha256)
          cp "$STEPS_SOURCE"/[0-9][0-9].sh "$STEPS_ROOT"/
          chmod +x "$STEPS_ROOT"/[0-9][0-9].sh
          for script in "$STEPS_ROOT"/[0-9][0-9].sh; do bash -n "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['LIFECYCLE_SOURCE']);compile(p.read_text(encoding='utf-8'),str(p),'exec')
          PY
          bash -n "$CENSUS_HELPER_SOURCE"
      - name: Verify exact inputs and prepare bounded draft
        shell: bash
        run: bash "$STEPS_ROOT/01.sh"
      - name: Submit, grow, patch, and bind media review
        shell: bash
        run: bash "$STEPS_ROOT/02.sh"
      - name: Complete the exact reviewed task
        shell: bash
        run: bash "$STEPS_ROOT/03.sh"
      - name: Qualify and publish the immutable candidate
        shell: bash
        run: bash "$STEPS_ROOT/04.sh" && bash "$STEPS_ROOT/05.sh"
      - name: Upload Morgo stage evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-trek-morgo-stage-recovery-v3
          path: /tmp/star-trek-morgo-stage-recovery-v3/output/
          if-no-files-found: error
          retention-days: 30
      - name: Publish staged Morgo candidate locator
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          jq --argjson id "$ARTIFACT_ID" --arg digest "$ARTIFACT_DIGEST" '.artifact={id:$id,digest:$digest}' "$OUT/candidate-commit.json" > "$OUT/candidate-commit.tmp"
          mv "$OUT/candidate-commit.tmp" "$OUT/candidate-commit.json"
          find "$OUT" -type f ! -name manifest.sha256 -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$OUT/manifest.sha256"
          test -z "$(git ls-remote --heads origin "refs/heads/${RESULT_BRANCH}")"
          git config user.name undercast-morgo-stage-recovery-v3
          git config user.email undercast-morgo-stage-recovery-v3@users.noreply.github.com
          git checkout --orphan morgo-stage-result-v3
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p transport/star-trek-morgo-stage-recovery-v3
          cp -a "$OUT"/. transport/star-trek-morgo-stage-recovery-v3/
          git add transport/star-trek-morgo-stage-recovery-v3
          git commit -m 'Record staged Star Trek Morgo candidate recovery v3'
          git push origin "HEAD:refs/heads/${RESULT_BRANCH}"
