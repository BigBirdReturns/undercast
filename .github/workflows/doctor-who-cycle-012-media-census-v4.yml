name: doctor-who-cycle-012-media-census-v4

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-012-media-census-v4.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-012-media-census-v4
  cancel-in-progress: true

jobs:
  inspect:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-012-media-census-v4'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BLOBS: "bd29483411ccca1e1c33fb42c459ab604002e49e 73a699b70db3dc8585c7d4042a862fc32d06fd93 b1848706cd7358a18e74d295f840bf069cd38907"
      SOURCE_B64_BYTES: "8124"
      SOURCE_B64_SHA256: 0349416903c8d375b0e5b6b680c7b3ce2ba19f0c9d406dc73fbceee7dbed6060
      SOURCE_GZIP_BYTES: "6091"
      SOURCE_GZIP_SHA256: 0f3bc52d1accd82c6db373d1180ac12c89479f823de3845eb060330942a6bf64
      SOURCE_BYTES: "20766"
      SOURCE_SHA256: 662f2defb885d6e001cfe7eb0f1d12fcd47028115550f0df36c851f64f0d2e84
      TARGET_BYTES: "20878"
      TARGET_SHA256: 7a92fa4523b88153025db88403293517c54eb086e4853027b052329dbac1e107
      TRANSFORM_B64: 
      LOADER: /tmp/doctor-who-cycle-012-media-census-v4-loader
      FAILURE_ROOT: /tmp/doctor-who-cycle-012-media-census-v3-failure
      CURRENT_BASE: ${{ github.event.pull_request.base.sha }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      MAIN: 019b43139f775b0935afd2be2f6d22c6e2494b94
      EVIDENCE_MAIN: 96a0f2286f23045dae4d752c90d2892344d9cc9d
      PRESELECTION_MAIN: 8fcc4a414821fe0f5596dec860cb825d70110c27
      BRANCH: agent/doctor-who-cycle-012-media-census-v4
      SELF: .github/workflows/doctor-who-cycle-012-media-census-v4.yml
      OUT: /tmp/doctor-who-cycle-012-media-census-v4
      EVIDENCE_PR: "871"
      EVIDENCE_HEAD: 61e1acdcb13966087374de518e85dc2db9eb1ee8
      EVIDENCE_RUN: "31370980255"
      EVIDENCE_JOB: "93399665207"
      EVIDENCE_ARTIFACT: "9056104797"
      EVIDENCE_ARTIFACT_NAME: doctor-who-cycle-012-senstarg-evidence-v2-31370980255-attempt-1
      EVIDENCE_ARTIFACT_SHA256: 0109348293dcd1dd9ca1b1e89cf16d073ce1fa026aa8d63b1f06dcdef5651b4e
      EVIDENCE_IDENTITY: ae95233f0b4dfd377d58d2e33b477d38311d90edd9fd34892ce82edb0bcc3c1f
      SOURCE_IDENTITY: 1c5b81f66b842580d1bf4f503af9758c8cacccde611051b61499ee12981b958a
      TASK_ID: ap_8965086737382df0e88366db
      PERFORMER: Dan Starkey
      ROLE: Senstarg
      MODE: unresolved
      SOURCE_FINGERPRINT: 4609666db39bb0c101d714022bc5440fa29ce754abffb817592c3f6c2
      SOURCE_PAGE_ID: "302965"
      SOURCE_REVISION: "3243079"
      SOURCE_CONTENT_SHA256: 84d98d7da3fa2c3442a41ec4afcdc2ad419fe7a1e37df08e5d2af606af2e1cff
      SOURCE_ORIGIN: https://tardis.fandom.com
      V3_PR: "877"
      V3_HEAD: 74d944af7e83e8429630bb40e16bd6b9cc4da533
      V3_BASE: 019b43139f775b0935afd2be2f6d22c6e2494b94
      V3_RUN: "31372807641"
      V3_JOB: "93405338080"
      V3_ARTIFACT: "9056739083"
      V3_ARTIFACT_NAME: doctor-who-cycle-012-media-census-v3-diagnostics-31372807641-attempt-1
      V3_ARTIFACT_BYTES: "35629"
      V3_ARTIFACT_SHA256: 12d03ac7d4d6cfad3ccd34565256f371c06545b2d0d56d042e93ac58c6637c5a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Authenticate V3 base-drift failure and derive exact V4 carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$LOADER" "$FAILURE_ROOT"
          mkdir -p "$LOADER" "$FAILURE_ROOT"/api "$FAILURE_ROOT"/diagnostics "$FAILURE_ROOT"/payload
          test "$CURRENT_BASE" = "$MAIN"
          test "$CURRENT_HEAD" = "$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V3_PR" > "$FAILURE_ROOT/api/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN" > "$FAILURE_ROOT/api/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN/jobs?per_page=100" > "$FAILURE_ROOT/api/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3_ARTIFACT" > "$FAILURE_ROOT/api/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3_ARTIFACT/zip" > "$FAILURE_ROOT/diagnostics/v3.zip"
          test "$(wc -c < "$FAILURE_ROOT/diagnostics/v3.zip" | tr -d ' ')" = "$V3_ARTIFACT_BYTES"
          test "$(sha256sum "$FAILURE_ROOT/diagnostics/v3.zip" | awk '{print $1}')" = "$V3_ARTIFACT_SHA256"

          : > "$LOADER/source.sh.gz.b64"
          for blob in $SOURCE_BLOBS; do
            gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq '.content' | tr -d '\n' | base64 -d >> "$LOADER/source.sh.gz.b64"
          done
          test "$(wc -c < "$LOADER/source.sh.gz.b64" | tr -d ' ')" = "$SOURCE_B64_BYTES"
          test "$(sha256sum "$LOADER/source.sh.gz.b64" | awk '{print $1}')" = "$SOURCE_B64_SHA256"
          base64 -d "$LOADER/source.sh.gz.b64" > "$LOADER/source.sh.gz"
          test "$(wc -c < "$LOADER/source.sh.gz" | tr -d ' ')" = "$SOURCE_GZIP_BYTES"
          test "$(sha256sum "$LOADER/source.sh.gz" | awk '{print $1}')" = "$SOURCE_GZIP_SHA256"
          gzip -dc "$LOADER/source.sh.gz" > "$LOADER/source.sh"
          test "$(wc -c < "$LOADER/source.sh" | tr -d ' ')" = "$SOURCE_BYTES"
          test "$(sha256sum "$LOADER/source.sh" | awk '{print $1}')" = "$SOURCE_SHA256"
          printf '%s' "$TRANSFORM_B64" | base64 -d > "$LOADER/transform.json"

          python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          loader=Path(os.environ['LOADER']); failure=Path(os.environ['FAILURE_ROOT']); sha=lambda b:hashlib.sha256(b).hexdigest()
          pr=json.loads((failure/'api/pr.json').read_text()); run=json.loads((failure/'api/run.json').read_text()); jobs=json.loads((failure/'api/jobs.json').read_text())['jobs']; artifact=json.loads((failure/'api/artifact.json').read_text())
          assert pr['number']==int(os.environ['V3_PR']) and pr['head']['sha']==os.environ['V3_HEAD'] and pr['base']['sha']==os.environ['V3_BASE'] and pr['state']=='closed' and pr['merged'] is False
          assert run['id']==int(os.environ['V3_RUN']) and run['head_sha']==os.environ['V3_HEAD'] and run['status']=='completed' and run['conclusion']=='failure'
          matched=[job for job in jobs if job['id']==int(os.environ['V3_JOB'])]; assert len(matched)==1 and matched[0]['name']=='inspect' and matched[0]['conclusion']=='failure'
          assert artifact['id']==int(os.environ['V3_ARTIFACT']) and artifact['name']==os.environ['V3_ARTIFACT_NAME'] and artifact['digest']=='sha256:'+os.environ['V3_ARTIFACT_SHA256'] and artifact['expired'] is False
          extracted=failure/'diagnostics/extracted'; extracted.mkdir()
          with zipfile.ZipFile(failure/'diagnostics/v3.zip') as archive:
              infos=archive.infolist(); assert len(infos)==3 and len(infos)==len({info.filename for info in infos})
              for info in infos:
                  pure=PurePosixPath(info.filename); assert not pure.is_absolute() and '..' not in pure.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  target=extracted.joinpath(*pure.parts); target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(archive.read(info))
          files=[path for path in extracted.rglob('*') if path.is_file()]; assert len(files)==3
          expected={'carrier.sh':(int(os.environ['SOURCE_BYTES']),os.environ['SOURCE_SHA256']),'carrier.sh.gz':(int(os.environ['SOURCE_GZIP_BYTES']),os.environ['SOURCE_GZIP_SHA256']),'carrier.sh.gz.b64':(int(os.environ['SOURCE_B64_BYTES']),os.environ['SOURCE_B64_SHA256'])}
          for name,(size,digest) in expected.items():
              rows=[path for path in files if path.name==name]; assert len(rows)==1 and rows[0].stat().st_size==size and sha(rows[0].read_bytes())==digest
          assert (loader/'source.sh').read_bytes()==next(path for path in files if path.name=='carrier.sh').read_bytes()
          transform=json.loads((loader/'transform.json').read_text()); source=(loader/'source.sh').read_text(); target=source
          assert transform['source_sha256']==os.environ['SOURCE_SHA256'] and transform['target_sha256']==os.environ['TARGET_SHA256']
          for row in transform['replacements']:
              assert target.count(row['old'])==row['count']==1
              target=target.replace(row['old'],row['new'])
          (loader/'carrier.sh').write_text(target)
          assert (loader/'carrier.sh').stat().st_size==int(os.environ['TARGET_BYTES']) and sha((loader/'carrier.sh').read_bytes())==os.environ['TARGET_SHA256']
          receipt={'status':'cycle-012-media-census-v3-base-drift-classified-v1','version':1,'failed':{'pr':int(os.environ['V3_PR']),'head':os.environ['V3_HEAD'],'base':os.environ['V3_BASE'],'run':int(os.environ['V3_RUN']),'job':int(os.environ['V3_JOB']),'artifact':int(os.environ['V3_ARTIFACT']),'artifact_sha256':os.environ['V3_ARTIFACT_SHA256']},'source_carrier':{'bytes':int(os.environ['SOURCE_BYTES']),'sha256':os.environ['SOURCE_SHA256']},'target_carrier':{'bytes':int(os.environ['TARGET_BYTES']),'sha256':os.environ['TARGET_SHA256'],'replacement_count':len(transform['replacements'])},'failure_boundary':{'outer_reconstruction_complete':True,'bash_syntax_passed':True,'embedded_python_compiled':6,'evidence_artifact_requested':False,'media_census_requested':False,'repository_write':False,'lease_issued':False,'media_adopted':False,'cycle_012_product_authority':False}}
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()); (failure/'payload/v3-failure.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); (failure/'payload/V3_FAILURE_CLASSIFIED').write_text(receipt['identity']+'\n')
          PY

          bash -n "$LOADER/carrier.sh"
          CARRIER="$LOADER/carrier.sh" python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path(os.environ['CARRIER']).read_text(); blocks=re.findall(r"python3 - <<'PY'\n(.*?)\nPY",text,re.S); assert len(blocks)==6
          for index,block in enumerate(blocks,1): compile(block,f'<cycle-012-media-census-v4-{index}>','exec')
          PY
          chmod 700 "$LOADER/carrier.sh"
          "$LOADER/carrier.sh"

          find "$FAILURE_ROOT/payload" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$FAILURE_ROOT/payload/$rel" | sed "s#  $FAILURE_ROOT/payload/#  #"; done > "$FAILURE_ROOT/payload/SHA256SUMS.pre"
          sha256sum "$FAILURE_ROOT/payload/SHA256SUMS.pre" | sed "s#  $FAILURE_ROOT/payload/#  #" > "$FAILURE_ROOT/payload/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v4-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v4/payload
            /tmp/doctor-who-cycle-012-media-census-v3-failure/payload
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-012-media-census-v4-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-012-media-census-v4
            /tmp/doctor-who-cycle-012-media-census-v4-loader
            /tmp/doctor-who-cycle-012-media-census-v3-failure
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
