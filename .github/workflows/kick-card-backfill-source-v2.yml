name: kick-card-backfill-source-v2

on:
  push:
    branches:
      - agent/card-backfill-next-041
    paths:
      - '.github/workflows/kick-card-backfill-source-v2.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-policy-v2 without a chat continuation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/card-backfill-source-v2-autonomous.yml/dispatches" \
            -f ref="agent/card-backfill-next-041" \
            -f "inputs[cohort_limit]=40" \
            -f "inputs[model]=openai/gpt-4.1-mini"
          echo 'PASS — source-policy-v2 loop dispatched'
