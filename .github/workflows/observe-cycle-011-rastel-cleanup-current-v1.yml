name: observe-cycle-011-rastel-cleanup-current-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/observe-cycle-011-rastel-cleanup-current-v1.yml"

permissions: {}

concurrency:
  group: observe-cycle-011-rastel-cleanup-current-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/observe-cycle-011-rastel-cleanup-current-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      INSTALLATION_MAIN: ee4bfa70f66d1d4ea5b53765497a185b5c072108
      CANONICAL_MAIN: 276e3a737318bd2487c0c641f038a71e0543cf55
      CANONICAL_TREE: dc82d03d761fd39291d792b170488fc242a0d322
      VERIFIER_RUN: "31357281200"
      AUTH_ARTIFACT: "9051083591"
      AUTH_DIGEST: sha256:f93b35b7dcfd43e63b87f9f88d631145ddf0672a13b5be032a4cb5c2620ddd2d
      PREFIX: agent/doctor-who-cycle-011-rastel-
      BRANCH: agent/observe-cycle-011-rastel-cleanup-current-v1
      SELF: .github/workflows/observe-cycle-011-rastel-cleanup-current-v1.yml
      OUT: /tmp/observe-cycle-011-rastel-cleanup-current-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind read-only observer and immutable cleanup authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,authorization,jobs,artifacts,logs,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$INSTALLATION_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$INSTALLATION_MAIN"
          test "$(git rev-list --count "$INSTALLATION_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$INSTALLATION_MAIN"..HEAD)"
          test "$(git diff --name-status "$INSTALLATION_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$INSTALLATION_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIER_RUN" > "$OUT/api/verifier-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ARTIFACT" > "$OUT/api/authorization-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ARTIFACT/zip" > "$OUT/authorization.zip"
          test "$(sha256sum "$OUT/authorization.zip" | awk '{print $1}')" = "${AUTH_DIGEST#sha256:}"
          OBSERVER_HEAD="$head" OBSERVER_BASE="$base" OBSERVER_PR="$pr" python3 - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); target=root/'authorization'; sha=lambda data:hashlib.sha256(data).hexdigest()
          own=json.loads((root/'api/observer-pr.json').read_text())
          verifier=json.loads((root/'api/verifier-run.json').read_text())
          artifact=json.loads((root/'api/authorization-artifact.json').read_text())
          assert own['number']==int(os.environ['OBSERVER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['OBSERVER_HEAD'] and own['base']['sha']==os.environ['OBSERVER_BASE']
          assert own['commits']==1 and own['changed_files']==1
          assert verifier['id']==int(os.environ['VERIFIER_RUN']) and verifier['status']=='completed' and verifier['conclusion']=='success'
          assert artifact['id']==int(os.environ['AUTH_ARTIFACT']) and artifact['expired'] is False and artifact['digest']==os.environ['AUTH_DIGEST']
          with zipfile.ZipFile(root/'authorization.zip') as archive:
              infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  p=PurePosixPath(info.filename); assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  mode=(info.external_attr>>16)&0xffff; assert not stat.S_ISLNK(mode)
                  if info.is_dir(): continue
                  out=target/p; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          pre=target/'SHA256SUMS.pre'; sealed=target/'SHA256SUMS'
          assert pre.is_file() and sealed.is_file() and sha(pre.read_bytes())==sealed.read_text().split()[0]
          for raw in pre.read_text().splitlines():
              if not raw.strip(): continue
              digest,name=raw.split(None,1); path=target/name.lstrip('*')
              assert path.is_file() and sha(path.read_bytes())==digest
          authorization=json.loads((target/'authorization.json').read_text()); identity=authorization.pop('identity')
          assert sha(json.dumps(authorization,sort_keys=True,separators=(',',':')).encode())==identity
          authorization['identity']=identity
          assert authorization['status']=='cycle-011-rastel-exact-prefix-cleanup-authorized-v3'
          assert authorization['source']['run']==int(os.environ['VERIFIER_RUN'])
          assert authorization['canonical_main']==os.environ['CANONICAL_MAIN'] and authorization['prefix']==os.environ['PREFIX']
          assert authorization['installation']['main']==os.environ['INSTALLATION_MAIN']
          (root/'receipt/authorization.json').write_text(json.dumps(authorization,indent=2,sort_keys=True)+'\n')
          PY

      - name: Retain exact writer runs, jobs, artifacts, and surviving prefix state
        shell: bash
        run: |
          set -euo pipefail
          for version in v1 v2; do
            workflow="doctor-who-cycle-011-rastel-cleanup-writer-$version.yml"
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_run&per_page=100" > "$OUT/api/$version-runs.json"
            jq -r --argjson floor "$VERIFIER_RUN" '.workflow_runs[] | select(.id > $floor) | .id' "$OUT/api/$version-runs.json" | while read -r run; do
              [ -n "$run" ] || continue
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" > "$OUT/jobs/$run.json"
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > "$OUT/artifacts/$run.json"
            done
          done
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$PREFIX" > "$OUT/api/prefix-refs.json"
          : > "$OUT/api/all-pulls.jsonl"
          for page in $(seq 1 50); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f sort=created -f direction=desc -f per_page=100 -f page="$page" > "$OUT/api/pulls-$page.json"
            count="$(jq 'length' "$OUT/api/pulls-$page.json")"
            [ "$count" = 0 ] && break
            jq -c '.[]' "$OUT/api/pulls-$page.json" >> "$OUT/api/all-pulls.jsonl"
            [ "$count" -lt 100 ] && break
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          auth=json.loads((root/'receipt/authorization.json').read_text())
          runs=[]
          for version in ('v1','v2'):
              source=json.loads((root/f'api/{version}-runs.json').read_text())['workflow_runs']
              for row in source:
                  if row['id']<=int(os.environ['VERIFIER_RUN']): continue
                  jobs_path=root/f'jobs/{row["id"]}.json'; artifacts_path=root/f'artifacts/{row["id"]}.json'
                  jobs=json.loads(jobs_path.read_text()).get('jobs',[]) if jobs_path.is_file() else []
                  artifacts=json.loads(artifacts_path.read_text()).get('artifacts',[]) if artifacts_path.is_file() else []
                  runs.append({
                      'version':version,'id':row['id'],'name':row['name'],'status':row['status'],'conclusion':row.get('conclusion'),
                      'event':row['event'],'run_number':row['run_number'],'run_attempt':row['run_attempt'],'created_at':row['created_at'],
                      'updated_at':row['updated_at'],'head_branch':row['head_branch'],'head_sha':row['head_sha'],
                      'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'number':s['number'],'name':s['name'],'status':s['status'],'conclusion':s.get('conclusion')} for s in j.get('steps',[])]} for j in jobs],
                      'artifacts':[{'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts],
                  })
          runs.sort(key=lambda row:(row['created_at'],row['id']))
          live_main=json.loads((root/'api/main.json').read_text())['object']['sha']
          live_refs=[]
          for row in json.loads((root/'api/prefix-refs.json').read_text()):
              branch=row['ref'].removeprefix('refs/heads/')
              live_refs.append({'branch':branch,'head':row['object']['sha']})
          live_refs.sort(key=lambda row:row['branch'])
          frozen_refs={row['branch']:row['head'] for row in auth['refs']}
          current_refs={row['branch']:row['head'] for row in live_refs}
          surviving=[]; missing=[]
          for branch,head in sorted(frozen_refs.items()):
              if branch in current_refs:
                  assert current_refs[branch]==head
                  surviving.append({'branch':branch,'head':head})
              else:
                  missing.append({'branch':branch,'head':head})
          unexpected=[row for row in live_refs if row['branch'] not in frozen_refs]
          pulls_by_number={}
          for raw in (root/'api/all-pulls.jsonl').read_text().splitlines():
              row=json.loads(raw); pulls_by_number[row['number']]=row
          frozen_prs=[]
          for expected in auth['pull_requests']:
              row=pulls_by_number[expected['pr']]
              assert row['head']['ref']==expected['branch'] and row['head']['sha']==expected['head']
              frozen_prs.append({'pr':expected['pr'],'branch':expected['branch'],'head':expected['head'],'frozen_action':expected['action'],'state':row['state'],'merged':row.get('merged_at') is not None})
          latest={}
          for row in runs: latest[row['version']]=row
          receipt={
              'status':'cycle-011-rastel-cleanup-current-state-observed-v1','version':1,
              'observer':{'pr':int(os.environ['OBSERVER_PR']),'head':os.environ['OBSERVER_HEAD'],'branch':os.environ['BRANCH']},
              'authorization':{'artifact':int(os.environ['AUTH_ARTIFACT']),'digest':os.environ['AUTH_DIGEST'],'identity':auth['identity'],'frozen_prs':len(auth['pull_requests']),'frozen_refs':len(auth['refs'])},
              'live_main':live_main,'canonical_main':os.environ['CANONICAL_MAIN'],'installation_main':os.environ['INSTALLATION_MAIN'],
              'writer_runs':runs,'latest_by_version':latest,
              'prefix':{'surviving_refs':surviving,'missing_refs':missing,'unexpected_refs':unexpected,'frozen_pull_requests':frozen_prs},
              'boundary':{'repository_write':False,'main_mutation':False,'cycle_012_lease_issued':False,'cycle_012_product_authority':False},
          }
          receipt['identity']=sha(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/observer.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-current-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/observe-cycle-011-rastel-cleanup-current-v1
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observe-cycle-011-rastel-cleanup-current-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/observe-cycle-011-rastel-cleanup-current-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
