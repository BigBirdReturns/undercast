name: cycle012-cleanup-writer-v8-observer-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/cycle012-cleanup-writer-v8-observer-v1.yml"

permissions: {}

concurrency:
  group: cycle012-cleanup-writer-v8-observer-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'observer/cycle012-cleanup-writer-v8-observer-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: /tmp/cycle012-cleanup-writer-v8-observer-v1
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: observer/cycle012-cleanup-writer-v8-observer-v1
      EVIDENCE_RUN: "31455511413"
      EVIDENCE_HEAD: f68b4286d1fcde8b7c7893544efa5b4388311acc
      EVIDENCE_ARTIFACT: "9087974374"
      EVIDENCE_DIGEST: 92e36f72a277fd308994a06b9b8e6b88450afc4b1f402f757d81e5d01cdc57c2
      WRITER_NAME: doctor-who-cycle-012-selection-cleanup-writer-v8
      WRITER_PATH: .github/workflows/doctor-who-cycle-012-selection-cleanup-writer-v8.yml
      INSTALLED_MAIN: 31bbd0231ff52dfe5a1c6b3b50f2f77c16c3099e
      BASE_TREE: 92c9ffd80d0c7a2f92bdbae3e6d1844b0531f3c1
      EVIDENCE_PR: "917"
      AGENT_PREFIX: agent/doctor-who-cycle-012-
      OBSERVER_PREFIX: observer/doctor-who-cycle-012-
      TERMINAL_PREFIX: observer/doctor-who-cycle-011-rastel-cleanup-terminal-

    steps:
      - name: Observe exact V8 writer transaction to terminal state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{api,payload}
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > "$OUT/api/evidence-run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$EVIDENCE_ARTIFACT" > "$OUT/api/evidence-artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/${WRITER_PATH##*/}" > "$OUT/api/writer-workflow.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          evidence=json.loads((root/'evidence-run.json').read_text())
          assert evidence['id']==int(os.environ['EVIDENCE_RUN'])
          assert evidence['name']=='doctor-who-cycle-012-selection-cleanup-residual-evidence-v8'
          assert evidence['event']=='pull_request' and evidence['status']=='completed' and evidence['conclusion']=='success'
          assert evidence['head_sha']==os.environ['EVIDENCE_HEAD']
          artifact=json.loads((root/'evidence-artifact.json').read_text())
          assert artifact['id']==int(os.environ['EVIDENCE_ARTIFACT']) and artifact['expired'] is False
          assert artifact['digest']=='sha256:'+os.environ['EVIDENCE_DIGEST']
          workflow=json.loads((root/'writer-workflow.json').read_text())
          assert workflow['path']==os.environ['WRITER_PATH'] and workflow['name']==os.environ['WRITER_NAME']
          (root/'writer-workflow-id.txt').write_text(str(workflow['id'])+'\n')
          PY
          writer_id="$(cat "$OUT/api/writer-workflow-id.txt")"
          found=""
          for _ in $(seq 1 180); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/$writer_id/runs?event=workflow_run&per_page=100" > "$OUT/api/writer-runs.json"
            found="$(EVIDENCE="$OUT/api/evidence-run.json" RUNS="$OUT/api/writer-runs.json" python3 - <<'PY'
          import json,os
          from datetime import datetime
          from pathlib import Path
          evidence=json.loads(Path(os.environ['EVIDENCE']).read_text())
          rows=json.loads(Path(os.environ['RUNS']).read_text())['workflow_runs']
          cutoff=datetime.fromisoformat(evidence['created_at'].replace('Z','+00:00'))
          matched=[]
          for row in rows:
              created=datetime.fromisoformat(row['created_at'].replace('Z','+00:00'))
              if row['event']=='workflow_run' and created>=cutoff and row['head_sha']==os.environ['INSTALLED_MAIN']:
                  matched.append(row)
          matched.sort(key=lambda row:(row['created_at'],row['id']))
          print(matched[0]['id'] if matched else '')
          PY
          )"
            if test -n "$found"; then break; fi
            sleep 5
          done
          test -n "$found"
          printf '%s\n' "$found" > "$OUT/api/writer-run-id.txt"
          for _ in $(seq 1 360); do
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$found" > "$OUT/api/writer-run.json"
            status="$(jq -r '.status' "$OUT/api/writer-run.json")"
            if test "$status" = completed; then break; fi
            sleep 5
          done
          test "$(jq -r '.status' "$OUT/api/writer-run.json")" = completed
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$found/jobs?per_page=100" > "$OUT/api/writer-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$found/artifacts?per_page=100" > "$OUT/api/writer-artifacts.json"
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$OUT/api/main-ref.json"
          main="$(jq -r '.object.sha' "$OUT/api/main-ref.json")"
          gh api "/repos/$GITHUB_REPOSITORY/git/commits/$main" > "$OUT/api/main-commit.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" > "$OUT/api/evidence-pr.json"
          for spec in "agent:$AGENT_PREFIX" "observer:$OBSERVER_PREFIX" "terminal:$TERMINAL_PREFIX"; do
            label="${spec%%:*}"; prefix="${spec#*:}"
            gh api "/repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$prefix" > "$OUT/api/$label-refs.json" || printf '[]\n' > "$OUT/api/$label-refs.json"
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT'])/'api'
          load=lambda name:json.loads((root/name).read_text())
          writer=load('writer-run.json')
          jobs=load('writer-jobs.json')['jobs']
          artifacts=load('writer-artifacts.json')['artifacts']
          main_ref=load('main-ref.json')['object']['sha']
          main_commit=load('main-commit.json')
          pr=load('evidence-pr.json')
          counts={name:len(load(name+'-refs.json')) for name in ('agent','observer','terminal')}
          write=[j for j in jobs if j['name']=='write']
          write_conclusion=write[0]['conclusion'] if len(write)==1 else None
          terminal=(
              writer['conclusion']=='success' and write_conclusion=='success' and
              [p['sha'] for p in main_commit['parents']]==[os.environ['INSTALLED_MAIN']] and
              main_commit['tree']['sha']==os.environ['BASE_TREE'] and
              pr['state']=='closed' and pr['merged'] is False and
              all(v==0 for v in counts.values())
          )
          result={
              'status':'cycle-012-cleanup-writer-v8-observed-v1',
              'version':1,
              'evidence':{
                  'run':int(os.environ['EVIDENCE_RUN']),
                  'head':os.environ['EVIDENCE_HEAD'],
                  'artifact':int(os.environ['EVIDENCE_ARTIFACT']),
                  'artifact_sha256':os.environ['EVIDENCE_DIGEST'],
              },
              'writer':{
                  'run':writer['id'],'status':writer['status'],'conclusion':writer['conclusion'],
                  'head_sha':writer['head_sha'],'jobs':[
                      {'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j['conclusion']} for j in jobs
                  ],
                  'artifacts':[
                      {'id':a['id'],'name':a['name'],'size_in_bytes':a['size_in_bytes'],'digest':a.get('digest'),'expired':a['expired']} for a in artifacts
                  ],
              },
              'canonical':{
                  'main':main_ref,'parents':[p['sha'] for p in main_commit['parents']],
                  'tree':main_commit['tree']['sha'],
              },
              'transport':{
                  'evidence_pr':pr['number'],'evidence_pr_state':pr['state'],'evidence_pr_merged':pr['merged'],
                  'remaining_refs':counts,
              },
              'terminal_cleanup_proved':terminal,
              'boundary':{
                  'lease_issued':False,'queue_mutated':False,'media_adopted':False,
                  'cycle_receipt_written':False,'cycle_012_product_authority':False,
              },
          }
          result['identity']=hashlib.sha256(json.dumps(result,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          payload=Path(os.environ['OUT'])/'payload'
          (payload/'observer.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (payload/'OBSERVER_COMPLETE').write_text(result['identity']+'\n')
          for name in ['writer-run.json','writer-jobs.json','writer-artifacts.json','main-ref.json','main-commit.json','evidence-pr.json','agent-refs.json','observer-refs.json','terminal-refs.json']:
              (payload/name).write_bytes((root/name).read_bytes())
          PY
          (
            cd "$OUT/payload"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.pre -printf '%P\n' | LC_ALL=C sort | while read -r name; do sha256sum "$name"; done > SHA256SUMS.pre
            sha256sum SHA256SUMS.pre > SHA256SUMS
            sha256sum -c SHA256SUMS.pre
          )

      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v8-observer-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v8-observer-v1/payload
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-cleanup-writer-v8-observer-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/cycle012-cleanup-writer-v8-observer-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  retire_observer:
    needs: observe
    if: needs.observe.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT_PR: ${{ github.event.pull_request.number }}
      CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
      CURRENT_BRANCH: observer/cycle012-cleanup-writer-v8-observer-v1
    steps:
      - name: Close and delete exact outside-prefix observer transport
        shell: bash
        run: |
          set -euo pipefail
          run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$CURRENT_HEAD"
          pr="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR")"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.ref' <<<"$pr")" = "$CURRENT_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$CURRENT_HEAD"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$CURRENT_BRANCH" --jq '.object.sha')" = "$CURRENT_HEAD"
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/pulls/$CURRENT_PR" -f state=closed >/dev/null
          gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/$CURRENT_BRANCH"
