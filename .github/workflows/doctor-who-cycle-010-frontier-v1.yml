name: doctor-who-cycle-010-frontier-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-010-frontier-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-010-frontier-v1
  cancel-in-progress: true

jobs:
  census:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-010-frontier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/doctor-who-cycle-010-frontier-v1
      SELF: .github/workflows/doctor-who-cycle-010-frontier-v1.yml
      CANONICAL_MAIN: 2b077a7371e7214e8a2e93653f0e5f6df5fdbeb6
      CANONICAL_PARENT: 707f2c14c4dc183afceb732c2b56124ed3a37c93
      CANONICAL_TREE: 50b59f4a945c12b7a1718bc0046608b6335f6aab
      SETTLER_BRANCH: agent/doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1
      SETTLER_WORKFLOW: doctor-who-cycle-009-megnus-jaka-postmerge-settler-v1
      SETTLER_STATUS: cycle-009-megnus-jaka-postmerge-prs-settled-v1
      OUT: /tmp/doctor-who-cycle-010-frontier-v1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind exact current-main frontier carrier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"/{api,settler,frontier}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test '${{ github.event.pull_request.base.sha }}' = "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_MAIN"
          test "$(git rev-list --count "$CANONICAL_MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CANONICAL_MAIN"..HEAD)"
          test "$(git diff --name-only "$CANONICAL_MAIN"...HEAD)" = "$SELF"
          test "$(git diff --name-status "$CANONICAL_MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/carrier-pr.json"
          ROOT="$OUT" PR="$pr" HEAD="$head" python3 - <<'PY'
          import json, os
          from pathlib import Path
          pr=json.loads((Path(os.environ['ROOT'])/'api/carrier-pr.json').read_text())
          assert pr['number']==int(os.environ['PR'])
          assert pr['state']=='open' and pr['draft'] is True and pr['merged'] is False
          assert pr['base']['ref']=='main' and pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['BRANCH'] and pr['head']['sha']==os.environ['HEAD']
          assert pr['commits']==1 and pr['changed_files']==1
          PY
          printf 'CARRIER_PR=%s\nCARRIER_HEAD=%s\n' "$pr" "$head" >> "$GITHUB_ENV"

      - name: Wait for exact cycle-009 postmerge settlement
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          settled=false
          for _ in $(seq 1 100); do
            gh api "/repos/$GITHUB_REPOSITORY/pulls?state=all&head=$owner:$SETTLER_BRANCH&base=main&per_page=100" > "$OUT/api/settler-prs.json"
            if ROOT="$OUT" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          rows=json.loads((Path(os.environ['ROOT'])/'api/settler-prs.json').read_text())
          if len(rows)!=1:
              sys.exit(1)
          pr=rows[0]
          if pr['state']!='closed':
              sys.exit(1)
          assert pr['merged'] is False and pr['draft'] is True
          assert pr['base']['sha']==os.environ['CANONICAL_MAIN']
          assert pr['head']['ref']==os.environ['SETTLER_BRANCH']
          (Path(os.environ['ROOT'])/'api/settler-pr.json').write_text(json.dumps(pr,indent=2,sort_keys=True)+'\n')
          PY
            then settled=true; break; fi
            sleep 15
          done
          test "$settled" = true

          SETTLER_HEAD="$(jq -r '.head.sha' "$OUT/api/settler-pr.json")"
          SETTLER_PR="$(jq -r '.number' "$OUT/api/settler-pr.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SETTLER_HEAD&event=pull_request&per_page=100" > "$OUT/api/settler-runs.json"
          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          rows=json.loads((root/'api/settler-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['name']==os.environ['SETTLER_WORKFLOW']]
          assert rows
          run=sorted(rows,key=lambda row:row['id'])[-1]
          assert run['head_branch']==os.environ['SETTLER_BRANCH']
          assert run['head_sha']==json.loads((root/'api/settler-pr.json').read_text())['head']['sha']
          assert run['event']=='pull_request' and run['run_attempt']==1
          assert run['status']=='completed' and run['conclusion']=='success'
          (root/'api/settler-run.json').write_text(json.dumps(run,indent=2,sort_keys=True)+'\n')
          PY
          SETTLER_RUN="$(jq -r '.id' "$OUT/api/settler-run.json")"
          SETTLER_ATTEMPT="$(jq -r '.run_attempt' "$OUT/api/settler-run.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SETTLER_RUN/jobs?per_page=100" > "$OUT/api/settler-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SETTLER_RUN/artifacts?per_page=100" > "$OUT/api/settler-artifacts.json"
          ROOT="$OUT" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          jobs=json.loads((root/'api/settler-jobs.json').read_text())['jobs']
          by={row['name']:row for row in jobs}
          assert set(by)=={'verify','settle'}
          assert all(row['status']=='completed' and row['conclusion']=='success' for row in by.values())
          run=json.loads((root/'api/settler-run.json').read_text())
          expected=f"doctor-who-cycle-009-megnus-jaka-postmerge-outcome-{run['id']}-attempt-{run['run_attempt']}"
          artifacts=json.loads((root/'api/settler-artifacts.json').read_text())['artifacts']
          rows=[row for row in artifacts if row['name']==expected]
          assert len(rows)==1 and rows[0]['expired'] is False
          assert rows[0]['workflow_run']['id']==run['id']
          assert rows[0]['workflow_run']['head_sha']==run['head_sha']
          (root/'api/settler-artifact.json').write_text(json.dumps(rows[0],indent=2,sort_keys=True)+'\n')
          PY
          SETTLER_ARTIFACT="$(jq -r '.id' "$OUT/api/settler-artifact.json")"
          SETTLER_DIGEST="$(jq -r '.digest' "$OUT/api/settler-artifact.json")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SETTLER_ARTIFACT/zip" > "$OUT/settler.zip"
          test "$(sha256sum "$OUT/settler.zip" | cut -d' ' -f1)" = "${SETTLER_DIGEST#sha256:}"
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path, PurePosixPath
          root=Path(os.environ['ROOT'])
          target=root/'settler'
          with zipfile.ZipFile(root/'settler.zip') as archive:
              infos=archive.infolist()
              assert infos and len(infos)==len({row.filename for row in infos})
              for info in infos:
                  path=PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  if info.is_dir():
                      continue
                  out=target/path
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.read(info))
          ledger=target/'SHA256SUMS.pre'
          sealed=target/'SHA256SUMS'
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()==sealed.read_text().split()[0]
          for raw in ledger.read_text().splitlines():
              if not raw.strip():
                  continue
              digest,name=raw.split(None,1)
              path=target/name.lstrip('*')
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          outcome=json.loads((target/'outcome.json').read_text())
          identity=outcome.pop('identity')
          assert hashlib.sha256(json.dumps(outcome,sort_keys=True,separators=(',',':')).encode()).hexdigest()==identity
          outcome['identity']=identity
          assert outcome['status']==os.environ['SETTLER_STATUS']
          assert outcome['settle_run']==json.loads((root/'api/settler-run.json').read_text())['id']
          assert outcome['settle_attempt']==1
          assert outcome['canonical_main']==os.environ['CANONICAL_MAIN']
          assert outcome['observer_state']=='closed' and outcome['observer_merged'] is False
          assert outcome['settler_state']=='closed' and outcome['settler_merged'] is False
          assert outcome['cycle_010_selector_authorized'] is True
          assert outcome['cycle_010_lease_issued'] is False
          assert outcome['branch_deletion_performed'] is False
          assert outcome['canonical_mutation'] is False
          assert outcome['outside_human_dependency'] is False
          assert outcome['owner_physical_action_required'] is False
          (target/'outcome.bound.json').write_bytes((target/'outcome.json').read_bytes())
          PY
          printf 'SETTLER_PR=%s\nSETTLER_HEAD=%s\nSETTLER_RUN=%s\nSETTLER_ARTIFACT=%s\nSETTLER_DIGEST=%s\n' \
            "$SETTLER_PR" "$SETTLER_HEAD" "$SETTLER_RUN" "$SETTLER_ARTIFACT" "$SETTLER_DIGEST" >> "$GITHUB_ENV"

      - name: Revalidate canonical cycle-009 terminal readiness
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"
          git checkout --detach "$CANONICAL_MAIN"
          test "$(git show -s --format=%P HEAD)" = "$CANONICAL_PARENT"
          test "$(git show -s --format=%T HEAD)" = "$CANONICAL_TREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-008.mjs | tee "$OUT/frontier/cycle-008.log"
          node scripts/doctor-who-cycle-009.mjs | tee "$OUT/frontier/cycle-009.log"
          node scripts/autopilot.mjs validate | tee "$OUT/frontier/autopilot-validate.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/frontier/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==307 and .statuses.resolved==9 and .in_flight==0' "$OUT/frontier/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/frontier/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/frontier/media-gate.log"
          node scripts/waterline.mjs validate | tee "$OUT/frontier/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/frontier/waterline-status.json"
          node scripts/waterline.mjs gate --scope doctor-who --requested 1 | tee "$OUT/frontier/waterline-gate.log"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/frontier/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/frontier/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/frontier/complete-gate.log" >/dev/null
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - name: Freeze bounded cycle-010 queue frontier
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$OUT" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          state=json.load(open('data/AUTOPILOT.json'))
          jobs=state['jobs']
          doctor=[]
          for job in jobs:
              source=str(job.get('source') or '')
              franchise=str(job.get('franchise') or '')
              scope=str(job.get('scope') or '')
              if franchise=='Doctor Who' or scope=='doctor-who' or 'tardis.fandom.com/wiki/' in source:
                  doctor.append(job)
          assert len(doctor)==316
          queued=[job for job in doctor if job['status']=='queued']
          resolved=[job for job in doctor if job['status']=='resolved']
          active=[job for job in doctor if job['status'] in {'leased','drafted','merged'}]
          assert len(queued)==307 and len(resolved)==9 and active==[]

          def row(job):
              return {
                  'id':job['id'],
                  'performer':job.get('performer'),
                  'role':job.get('role'),
                  'performance_mode':job.get('performance_mode'),
                  'priority':job.get('priority'),
                  'first_seen_at':job.get('first_seen_at'),
                  'source':job.get('source'),
                  'source_fingerprint':job.get('source_fingerprint'),
                  'queueable':job.get('queueable'),
                  'required_capabilities':job.get('required_capabilities') or [],
                  'missing_capabilities':job.get('missing_capabilities') or [],
                  'attention':job.get('attention'),
                  'reasons':job.get('reasons') or [],
              }

          rows=[row(job) for job in queued]
          rows.sort(key=lambda item:(
              -(item['priority'] if isinstance(item['priority'],(int,float)) else -10**9),
              item['first_seen_at'] or '',
              item['performer'] or '',
              item['role'] or '',
              item['id'],
          ))
          assert len({item['id'] for item in rows})==307
          assert all(item['queueable'] is True for item in rows)
          assert all(item['missing_capabilities']==[] for item in rows)

          frontier={
              'status':'cycle-010-doctor-who-priority-frontier-frozen-v1',
              'canonical_main':os.environ['CANONICAL_MAIN'],
              'settler_pr':int(os.environ['SETTLER_PR']),
              'settler_head':os.environ['SETTLER_HEAD'],
              'settler_run':int(os.environ['SETTLER_RUN']),
              'settler_artifact':int(os.environ['SETTLER_ARTIFACT']),
              'settler_digest':os.environ['SETTLER_DIGEST'],
              'queue':{'total':316,'queued':307,'resolved':9,'in_flight':0},
              'ordering_contract':[
                  'priority descending',
                  'first_seen_at ascending',
                  'performer ascending',
                  'role ascending',
                  'task id ascending',
              ],
              'frontier_rows':rows,
              'top_ten':rows[:10],
              'selection_authority':False,
              'lease_authority':False,
              'cycle_010_lease_issued':False,
              'canonical_mutation':False,
              'outside_human_dependency':False,
              'owner_physical_action_required':False,
          }
          frontier['identity']=hashlib.sha256(json.dumps(frontier,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          (root/'frontier/frontier.json').write_text(json.dumps(frontier,indent=2,sort_keys=True)+'\n')
          summary={key:frontier[key] for key in (
              'status','canonical_main','queue','ordering_contract','top_ten',
              'selection_authority','lease_authority','cycle_010_lease_issued',
              'canonical_mutation','outside_human_dependency','owner_physical_action_required','identity'
          )}
          (root/'frontier/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          find "$OUT/frontier" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$OUT/frontier/$rel" | sed "s#  $OUT/frontier/#  #"
          done > "$OUT/frontier/SHA256SUMS.pre"
          sha256sum "$OUT/frontier/SHA256SUMS.pre" | sed "s#  $OUT/frontier/#  #" > "$OUT/frontier/SHA256SUMS"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$CANONICAL_MAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-frontier-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-frontier-v1/frontier
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-010-frontier-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-010-frontier-v1
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
