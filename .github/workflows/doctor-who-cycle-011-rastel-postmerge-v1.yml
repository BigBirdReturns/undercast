name: doctor-who-cycle-011-rastel-postmerge-v1

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-postmerge-v1.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-postmerge-v1
  cancel-in-progress: true

jobs:
  observe:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-postmerge-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CARRIER_BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: agent/doctor-who-cycle-011-rastel-postmerge-v1
      SELF: .github/workflows/doctor-who-cycle-011-rastel-postmerge-v1.yml
      OUT: /tmp/doctor-who-cycle-011-rastel-postmerge-v1
      SETTLEMENT_PACKET: /tmp/doctor-who-cycle-011-rastel-postmerge-v1-settlement
      MERGE_PACKET: /tmp/doctor-who-cycle-011-rastel-postmerge-v1-merge
      WORKTREE: /tmp/doctor-who-cycle-011-rastel-postmerge-v1-worktree
      GUARDIAN_BRANCH: agent/doctor-who-cycle-011-rastel-merge-guardian-current-main-v1
      GUARDIAN_WORKFLOW: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1
      SETTLEMENT_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-settlement-
      MERGE_ARTIFACT_PREFIX: doctor-who-cycle-011-rastel-merge-guardian-current-main-v1-merge-
      TARGET_BRANCH: agent/doctor-who-cycle-011-rastel-reviewed-product-current-main-v1
      TASK_ID: ap_25277c8fbe9e5369ed2e3d81
      WALL_ID: UC-1356
      EXPECTED_LEASE: lease_20eea426f818ecf4732fce39
      PORTRAIT_SHA256: 42412f0f18ebf8f3ba536e633ac9777a19fa4f81277aad1086d410ea03501f4a

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Bind observer carrier and exact successful guardian run
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" "$SETTLEMENT_PACKET" "$MERGE_PACKET" "$WORKTREE"
          mkdir -p "$OUT"/{api,receipt,logs} "$SETTLEMENT_PACKET" "$MERGE_PACKET"
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git show -s --format=%P HEAD)" = "$CARRIER_BASE"
          test "$(git rev-list --count "$CARRIER_BASE"..HEAD)" = 1
          test -z "$(git rev-list --merges "$CARRIER_BASE"..HEAD)"
          test "$(git diff --name-status "$CARRIER_BASE"...HEAD)" = $'A\t'"$SELF"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$OUT/api/observer-pr.json"
          gh api --method GET "/repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$GUARDIAN_BRANCH" -f per_page=100 > "$OUT/api/guardian-prs.json"
          OBSERVER_PR="$pr" OBSERVER_HEAD="$head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          api=Path(os.environ['OUT'])/'api'
          own=json.loads((api/'observer-pr.json').read_text())
          rows=json.loads((api/'guardian-prs.json').read_text())
          assert own['number']==int(os.environ['OBSERVER_PR']) and own['state']=='open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha']==os.environ['CARRIER_BASE'] and own['head']['ref']==os.environ['BRANCH'] and own['head']['sha']==os.environ['OBSERVER_HEAD']
          assert own['commits']==1 and own['changed_files']==1
          rows=[row for row in rows if row['head']['ref']==os.environ['GUARDIAN_BRANCH'] and row['merged'] is False]
          assert len(rows)==1,[(row['number'],row['state'],row['head']['sha']) for row in rows]
          source=rows[0]
          assert source['state']=='open' and source['draft'] is True
          (api/'guardian-pr.json').write_text(json.dumps(source,indent=2,sort_keys=True)+'\n')
          (api/'guardian-head.txt').write_text(source['head']['sha']+'\n')
          (api/'guardian-number.txt').write_text(str(source['number'])+'\n')
          PY
          guardian_head="$(cat "$OUT/api/guardian-head.txt")"
          guardian_pr="$(cat "$OUT/api/guardian-number.txt")"
          run_id=''
          for attempt in $(seq 1 180); do
            gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$GUARDIAN_BRANCH" -f event=pull_request -f per_page=100 > "$OUT/api/guardian-runs.json"
            run_id="$(GUARDIAN_HEAD="$guardian_head" python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/guardian-runs.json').read_text())['workflow_runs']
          rows=[row for row in rows if row['head_sha']==os.environ['GUARDIAN_HEAD'] and row['name']==os.environ['GUARDIAN_WORKFLOW']]
          rows.sort(key=lambda row:(row['run_attempt'],row['id']),reverse=True)
          print(rows[0]['id'] if rows else '')
          PY
          )"
            if [ -n "$run_id" ]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$OUT/api/guardian-run.json"
              if [ "$(jq -r '.status' "$OUT/api/guardian-run.json")" = completed ]; then break; fi
            fi
            sleep 10
          done
          test -n "$run_id"
          test "$(jq -r '.status' "$OUT/api/guardian-run.json")" = completed
          test "$(jq -r '.conclusion' "$OUT/api/guardian-run.json")" = success
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$OUT/api/guardian-jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$OUT/api/guardian-artifacts.json"
          verify_job="$(jq -r '.jobs[] | select(.name=="verify" and .conclusion=="success") | .id' "$OUT/api/guardian-jobs.json")"
          merge_job="$(jq -r '.jobs[] | select(.name=="fast_forward" and .conclusion=="success") | .id' "$OUT/api/guardian-jobs.json")"
          test -n "$verify_job"; test -n "$merge_job"
          GUARDIAN_RUN="$run_id" python3 - <<'PY' > "$OUT/api/artifact-env"
          import json,os
          from pathlib import Path
          rows=json.loads((Path(os.environ['OUT'])/'api/guardian-artifacts.json').read_text())['artifacts']
          run=os.environ['GUARDIAN_RUN']
          expected={'SETTLEMENT_ARTIFACT':os.environ['SETTLEMENT_ARTIFACT_PREFIX']+run+'-attempt-1','MERGE_ARTIFACT':os.environ['MERGE_ARTIFACT_PREFIX']+run+'-attempt-1'}
          for key,name in expected.items():
              matches=[row for row in rows if row['name']==name and not row['expired']]
              assert len(matches)==1,(key,name,[(row['id'],row['name']) for row in rows])
              print(f'{key}={matches[0]["id"]}')
          PY
          source "$OUT/api/artifact-env"
          for label in settlement merge; do
            upper="${label^^}_ARTIFACT"
            artifact="${!upper}"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > "$OUT/api/$label-artifact.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$OUT/$label.zip"
            digest="$(sha256sum "$OUT/$label.zip" | awk '{print $1}')"
            test "$(jq -r '.digest' "$OUT/api/$label-artifact.json")" = "sha256:$digest"
            printf '%s_ZIP_SHA256=%s\n' "${label^^}" "$digest" >> "$GITHUB_ENV"
          done
          printf 'OBSERVER_PR=%s\nOBSERVER_HEAD=%s\nGUARDIAN_PR=%s\nGUARDIAN_HEAD=%s\nGUARDIAN_RUN=%s\nVERIFY_JOB=%s\nMERGE_JOB=%s\nSETTLEMENT_ARTIFACT=%s\nMERGE_ARTIFACT=%s\n' "$pr" "$head" "$guardian_pr" "$guardian_head" "$run_id" "$verify_job" "$merge_job" "$SETTLEMENT_ARTIFACT" "$MERGE_ARTIFACT" >> "$GITHUB_ENV"

      - name: Authenticate settlement, merge, product PR, and canonical main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path,PurePosixPath
          root=Path(os.environ['OUT']); sha=lambda data:hashlib.sha256(data).hexdigest()
          def extract(name,target):
              target=Path(target)
              with zipfile.ZipFile(root/(name+'.zip')) as archive:
                  infos=archive.infolist(); assert infos and len(infos)==len({row.filename for row in infos})
                  for info in infos:
                      path=PurePosixPath(info.filename); assert not path.is_absolute() and '..' not in path.parts
                      if info.is_dir():continue
                      out=target/path; out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.read(info))
          extract('settlement',os.environ['SETTLEMENT_PACKET']); extract('merge',os.environ['MERGE_PACKET'])
          def verify(target):
              target=Path(target); ledgers=[]
              for sealed in target.rglob('SHA256SUMS'):
                  pre=sealed.with_name('SHA256SUMS.pre')
                  if not pre.is_file():continue
                  assert sha(pre.read_bytes())==sealed.read_text().split()[0]
                  base=sealed.parent; count=0
                  for raw in pre.read_text().splitlines():
                      if not raw.strip():continue
                      digest,name=raw.split(None,1); path=base/name.lstrip('*')
                      assert path.is_file() and sha(path.read_bytes())==digest; count+=1
                  ledgers.append({'root':base.relative_to(target).as_posix(),'rows':count,'sha256':sha(pre.read_bytes())})
              assert ledgers
              return ledgers
          settlement_ledgers=verify(os.environ['SETTLEMENT_PACKET']); merge_ledgers=verify(os.environ['MERGE_PACKET'])
          def one_status(target,status):
              rows=[]
              for path in Path(target).rglob('*.json'):
                  try:data=json.loads(path.read_text())
                  except Exception:continue
                  if data.get('status')==status:rows.append((path,data))
              assert len(rows)==1,(status,[p.as_posix() for p,_ in rows]); return rows[0]
          _,settlement=one_status(os.environ['SETTLEMENT_PACKET'],'cycle-011-rastel-canonical-fast-forward-authorized-v1')
          _,merge=one_status(os.environ['MERGE_PACKET'],'cycle-011-rastel-canonical-fast-forward-complete-v1')
          for data in (settlement,merge):
              identity=data.pop('identity'); assert sha(json.dumps(data,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())==identity; data['identity']=identity
          assert merge['settlement']['identity']==settlement['identity']
          product=merge['product']
          assert product['commit']==settlement['product']['commit'] and product['parent']==settlement['product']['parent'] and product['tree']==settlement['product']['tree'] and product['paths']==settlement['product']['paths']
          assert settlement['product']['task']==os.environ['TASK_ID'] and settlement['product']['lease']==os.environ['EXPECTED_LEASE'] and settlement['product']['wall']==os.environ['WALL_ID'] and settlement['product']['portrait_sha256']==os.environ['PORTRAIT_SHA256']
          assert merge['boundary']=={'nonforced_fast_forward':True,'merge_commit_created':False,'squash':False,'rebase':False,'force_update':False,'cycle_012_authorized':False}
          (root/'receipt/settlement.json').write_text(json.dumps(settlement,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          (root/'receipt/merge.json').write_text(json.dumps(merge,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          custody={'status':'cycle-011-rastel-guardian-artifacts-authenticated-v1','version':1,'guardian':{'pr':int(os.environ['GUARDIAN_PR']),'head':os.environ['GUARDIAN_HEAD'],'run':int(os.environ['GUARDIAN_RUN']),'verify_job':int(os.environ['VERIFY_JOB']),'merge_job':int(os.environ['MERGE_JOB']),'settlement_artifact':int(os.environ['SETTLEMENT_ARTIFACT']),'settlement_artifact_sha256':os.environ['SETTLEMENT_ZIP_SHA256'],'merge_artifact':int(os.environ['MERGE_ARTIFACT']),'merge_artifact_sha256':os.environ['MERGE_ZIP_SHA256']},'settlement_identity':settlement['identity'],'merge_identity':merge['identity'],'settlement_ledgers':settlement_ledgers,'merge_ledgers':merge_ledgers}
          custody['identity']=sha(json.dumps(custody,sort_keys=True,separators=(',',':')).encode())
          (root/'receipt/guardian-custody.json').write_text(json.dumps(custody,indent=2,sort_keys=True)+'\n')
          PY
          product="$(jq -r '.product.commit' "$OUT/receipt/merge.json")"
          parent="$(jq -r '.product.parent' "$OUT/receipt/merge.json")"
          tree="$(jq -r '.product.tree' "$OUT/receipt/merge.json")"
          paths="$(jq -r '.product.paths' "$OUT/receipt/merge.json")"
          product_pr="$(jq -r '.product.pr' "$OUT/receipt/merge.json")"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$product"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$product_pr" > "$OUT/api/product-pr.json"
          test "$(jq -r '.state' "$OUT/api/product-pr.json")" = closed
          test "$(jq -r '.merged' "$OUT/api/product-pr.json")" = true
          test "$(jq -r '.head.sha' "$OUT/api/product-pr.json")" = "$product"
          test "$(jq -r '.merge_commit_sha' "$OUT/api/product-pr.json")" = "$product"
          test "$(git show -s --format=%P "$product")" = "$parent"
          test "$(git show -s --format=%T "$product")" = "$tree"
          test "$(git rev-list --count "$parent".."$product")" = 1
          test -z "$(git rev-list --merges "$parent".."$product")"
          test "$(git diff --name-only "$parent" "$product" | wc -l | tr -d ' ')" = "$paths"
          printf 'PRODUCT=%s\nPRODUCT_PARENT=%s\nPRODUCT_TREE=%s\nPRODUCT_PATHS=%s\nPRODUCT_PR=%s\n' "$product" "$parent" "$tree" "$paths" "$product_pr" >> "$GITHUB_ENV"

      - name: Rerun complete canonical product gate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$WORKTREE" "$PRODUCT"
          cd "$WORKTREE"
          npm ci
          npx playwright install --with-deps chromium
          node scripts/doctor-who-cycle-010.mjs | tee "$OUT/logs/cycle-010.log"
          node scripts/doctor-who-cycle-011.mjs | tee "$OUT/logs/cycle-011.log"
          node scripts/autopilot.mjs validate | tee "$OUT/logs/autopilot.log"
          node scripts/autopilot.mjs status --scope doctor-who --json > "$OUT/receipt/autopilot-status.json"
          jq -e '.total==316 and .statuses.queued==305 and .statuses.resolved==11 and .in_flight==0' "$OUT/receipt/autopilot-status.json" >/dev/null
          node scripts/media-audit.mjs validate | tee "$OUT/logs/media-validate.log"
          node scripts/media-audit.mjs gate --scope doctor-who | tee "$OUT/logs/media-gate.log"
          grep -F '22/22 complete' "$OUT/logs/media-gate.log" >/dev/null
          node scripts/waterline.mjs validate | tee "$OUT/logs/waterline-validate.log"
          node scripts/waterline.mjs status --scope doctor-who --requested 1 --json > "$OUT/receipt/waterline-status.json"
          jq -e '.claim_allowed==true and .claim_reasons==[] and .jobs.in_flight==0 and .media.debt==0 and .cycles.unreceipted==[]' "$OUT/receipt/waterline-status.json" >/dev/null
          npm run gate 2>&1 | tee "$OUT/logs/complete-gate.log"
          grep -F 'gate: PASS' "$OUT/logs/complete-gate.log" >/dev/null
          test -f images/uc-1356-portrait.jpg
          test "$(sha256sum images/uc-1356-portrait.jpg | awk '{print $1}')" = "$PORTRAIT_SHA256"
          test -z "$(git status --porcelain)"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$PRODUCT"

      - name: Seal terminal canonical proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT']); custody=json.loads((root/'receipt/guardian-custody.json').read_text()); merge=json.loads((root/'receipt/merge.json').read_text()); autopilot=json.loads((root/'receipt/autopilot-status.json').read_text()); waterline=json.loads((root/'receipt/waterline-status.json').read_text()); sha=lambda data:hashlib.sha256(data).hexdigest()
          proof={'status':'cycle-011-rastel-terminal-canonical-proof-v1','version':1,'observer':{'pr':int(os.environ['OBSERVER_PR']),'head':os.environ['OBSERVER_HEAD'],'carrier_base':os.environ['CARRIER_BASE']},'guardian_custody_identity':custody['identity'],'merge_identity':merge['identity'],'canonical':{'parent':os.environ['PRODUCT_PARENT'],'main':os.environ['PRODUCT'],'tree':os.environ['PRODUCT_TREE'],'paths':int(os.environ['PRODUCT_PATHS']),'product_pr':int(os.environ['PRODUCT_PR'])},'task':{'id':os.environ['TASK_ID'],'lease':os.environ['EXPECTED_LEASE'],'wall':os.environ['WALL_ID'],'performer':'Dan Starkey','role':'Rastel','mode':'voice','portrait_sha256':os.environ['PORTRAIT_SHA256'],'character_still':'absent'},'queue':{'total':autopilot['total'],'queued':autopilot['statuses']['queued'],'resolved':autopilot['statuses']['resolved'],'in_flight':autopilot['in_flight']},'waterline':waterline,'gates':{'guardian_artifacts':True,'product_pr_merged_exact':True,'canonical_commit':True,'one_parent':True,'tree':True,'path_denominator':True,'cycle_010':True,'cycle_011':True,'autopilot':True,'media_22_of_22':True,'waterline_zero_debt':True,'complete_rendered_gate':True,'clean_canonical_worktree':True},'authority':{'cleanup_authorized':True,'cycle_012_selector_authorized':True,'cycle_012_lease_issued':False,'repository_mutation':False,'canonical_mutation':False,'outside_human_dependency':False,'owner_physical_action_required':False}}
          proof['identity']=sha(json.dumps(proof,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode())
          (root/'receipt/terminal-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY
          find "$OUT" -type f ! -name SHA256SUMS.pre ! -name SHA256SUMS -printf '%P\0' | LC_ALL=C sort -z | while IFS= read -r -d '' rel; do sha256sum "$OUT/$rel" | sed "s#  $OUT/#  #"; done > "$OUT/SHA256SUMS.pre"
          sha256sum "$OUT/SHA256SUMS.pre" | sed "s#  $OUT/#  #" > "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-postmerge-v1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-postmerge-v1
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-postmerge-v1-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-postmerge-v1
            /tmp/doctor-who-cycle-011-rastel-postmerge-v1-settlement
            /tmp/doctor-who-cycle-011-rastel-postmerge-v1-merge
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
