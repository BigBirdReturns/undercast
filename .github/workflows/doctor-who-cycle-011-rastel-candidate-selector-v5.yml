name: doctor-who-cycle-011-rastel-candidate-selector-v5

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v5.yml"

permissions: {}

concurrency:
  group: doctor-who-cycle-011-rastel-candidate-selector-v5
  cancel-in-progress: true

jobs:
  select:
    if: >-
      github.repository == 'BigBirdReturns/undercast' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/doctor-who-cycle-011-rastel-candidate-selector-v5'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN: 9a463beea20f89874a817f31460576595fb0ee63
      TREE: cd1f495acf79d8d8d24861cdfde84dd137fec386
      BRANCH: agent/doctor-who-cycle-011-rastel-candidate-selector-v5
      SELF: .github/workflows/doctor-who-cycle-011-rastel-candidate-selector-v5.yml
      SOURCE: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-source
      OUT: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5
      CARRIER: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-carrier
      BOOTSTRAP: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-bootstrap
      V4_PR: "802"
      V4_HEAD: 64d89f29a896d80c9705f92a4f07c618461d5e23
      V4_BRANCH: agent/doctor-who-cycle-011-rastel-candidate-selector-v4
      V4_RUN: "31343730105"
      V4_JOB: "93321670865"
      V4_ARTIFACT: "9046602930"
      V4_ARTIFACT_FILES: "10"
      V4_ARTIFACT_SIZE: "248159"
      V4_ARTIFACT_SHA256: cbfeb985078864a36197a9fe564d9e2022d02248c01229148969e948103aa36b
      V4_ARTIFACT_NAME: doctor-who-cycle-011-rastel-candidate-selector-v4-diagnostics-31343730105-attempt-1
      V4_WORKFLOW_BLOB: c2b19a92305d7e203930f8870bac7b79a2dd91e7
      V4_WORKFLOW_BYTES: "13620"
      V4_WORKFLOW_SHA256: 5fd5de377ab0bba72eabbb2a28ab7598827ecbbabba5d3dd03a8a0a64666c5de
      BAD_PATCH_SHA256: abf66b8b9919b9c6f5706292ddd0dfc04ba5f5be4a19572e3d9d842b4703a7
      PATCH_BYTES: "5812"
      PATCH_SHA256: abf66b8b9919b9c6f5706292ddd0dfc04ba5f5f2be4a19572e3d9d842b4703a7
      RUNNER_BYTES: "51257"
      RUNNER_SHA256: 825f752ae2a75d446b8381d5cb860952aa90c236209a3f9f05253e9a197191c3
      SOURCE_RUNNER_GZIP_BYTES: "12179"
      SOURCE_RUNNER_GZIP_SHA256: 8cfa5b3ab67502f79b80f23a58054d30294e39534e7169a69da538a7f7f2020f

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Bind exact V4 digest failure and recover unchanged selector runner
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$BOOTSTRAP" "$CARRIER"
          mkdir -p "$BOOTSTRAP" "$CARRIER"/{api,v4,receipt}
          head='${{ github.event.pull_request.head.sha }}'
          pr='${{ github.event.pull_request.number }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$base" = "$MAIN"
          test "$(git show -s --format=%P HEAD)" = "$MAIN"
          test "$(git rev-list --count "$MAIN"..HEAD)" = 1
          test -z "$(git rev-list --merges "$MAIN"..HEAD)"
          test "$(git diff --name-status "$MAIN"...HEAD)" = $'A\t'"$SELF"
          test "$(git show -s --format=%T "$MAIN")" = "$TREE"
          test "$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$MAIN"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" > "$CARRIER/api/own-pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/pulls/$V4_PR" > "$CARRIER/v4/pr.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V4_RUN" > "$CARRIER/v4/run.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$V4_RUN/jobs?per_page=100" > "$CARRIER/v4/jobs.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_ARTIFACT" > "$CARRIER/v4/artifact.json"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$V4_ARTIFACT/zip" > "$CARRIER/v4/diagnostics.zip"
          test "$(sha256sum "$CARRIER/v4/diagnostics.zip" | awk '{print $1}')" = "$V4_ARTIFACT_SHA256"
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/$V4_WORKFLOW_BLOB" --jq '.content' | tr -d '\n' | base64 -d > "$CARRIER/v4/workflow.yml"
          test "$(wc -c < "$CARRIER/v4/workflow.yml" | tr -d ' ')" = "$V4_WORKFLOW_BYTES"
          test "$(sha256sum "$CARRIER/v4/workflow.yml" | awk '{print $1}')" = "$V4_WORKFLOW_SHA256"
          HEAD="$head" PR="$pr" BASE="$base" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          carrier = Path(os.environ['CARRIER'])
          v4 = carrier / 'v4'
          load = lambda path: json.loads(Path(path).read_text())
          own = load(carrier / 'api/own-pr.json')
          pr4 = load(v4 / 'pr.json')
          run4 = load(v4 / 'run.json')
          jobs4 = load(v4 / 'jobs.json')['jobs']
          artifact4 = load(v4 / 'artifact.json')

          assert own['number'] == int(os.environ['PR'])
          assert own['state'] == 'open' and own['draft'] is True and own['merged'] is False
          assert own['base']['sha'] == os.environ['MAIN'] and own['head']['sha'] == os.environ['HEAD']
          assert own['head']['ref'] == os.environ['BRANCH'] and own['commits'] == 1 and own['changed_files'] == 1

          assert pr4['number'] == int(os.environ['V4_PR'])
          assert pr4['state'] == 'open' and pr4['draft'] is True and pr4['merged'] is False
          assert pr4['base']['sha'] == os.environ['MAIN']
          assert pr4['head']['sha'] == os.environ['V4_HEAD'] and pr4['head']['ref'] == os.environ['V4_BRANCH']
          assert pr4['commits'] == 1 and pr4['changed_files'] == 1
          assert run4['id'] == int(os.environ['V4_RUN']) and run4['head_sha'] == os.environ['V4_HEAD']
          assert run4['head_branch'] == os.environ['V4_BRANCH'] and run4['status'] == 'completed' and run4['conclusion'] == 'failure'
          matching = [job for job in jobs4 if job['id'] == int(os.environ['V4_JOB'])]
          assert len(matching) == 1
          job = matching[0]
          assert job['name'] == 'select' and job['status'] == 'completed' and job['conclusion'] == 'failure'
          step = [x for x in job['steps'] if x['name'] == 'Authenticate exact V3 topology failure and execute clean three-candidate selector']
          assert len(step) == 1 and step[0]['status'] == 'completed' and step[0]['conclusion'] == 'failure'
          assert artifact4['id'] == int(os.environ['V4_ARTIFACT'])
          assert artifact4['name'] == os.environ['V4_ARTIFACT_NAME']
          assert artifact4['size_in_bytes'] == int(os.environ['V4_ARTIFACT_SIZE']) and artifact4['expired'] is False
          assert artifact4['digest'] == 'sha256:' + os.environ['V4_ARTIFACT_SHA256']
          assert artifact4['workflow_run']['id'] == int(os.environ['V4_RUN'])
          assert artifact4['workflow_run']['head_sha'] == os.environ['V4_HEAD']

          workflow = (v4 / 'workflow.yml').read_text()
          bad = os.environ['BAD_PATCH_SHA256']
          good = os.environ['PATCH_SHA256']
          assert len(bad) == 62 and len(good) == 64
          assert workflow.count(bad) == 1 and workflow.count(good) == 0
          assert "'runner.patch': (5812, '" + bad + "')" in workflow

          extracted = v4 / 'extracted'
          extracted.mkdir()
          with zipfile.ZipFile(v4 / 'diagnostics.zip') as archive:
              infos = archive.infolist()
              assert len(infos) == int(os.environ['V4_ARTIFACT_FILES'])
              assert len({info.filename for info in infos}) == len(infos)
              for info in infos:
                  name = info.filename
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and '\\' not in name and '\x00' not in name
                  mode = (info.external_attr >> 16) & 0xffff
                  assert not stat.S_ISLNK(mode) and not info.is_dir()
                  target = extracted.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info))

          files = [path for path in extracted.rglob('*') if path.is_file()]
          assert len(files) == int(os.environ['V4_ARTIFACT_FILES'])
          by_digest = {}
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              by_digest.setdefault(digest, []).append(path)
          expected = {
              os.environ['RUNNER_SHA256']: int(os.environ['RUNNER_BYTES']),
              os.environ['PATCH_SHA256']: int(os.environ['PATCH_BYTES']),
              os.environ['SOURCE_RUNNER_GZIP_SHA256']: int(os.environ['SOURCE_RUNNER_GZIP_BYTES']),
          }
          for digest, size in expected.items():
              assert digest in by_digest
              assert all(path.stat().st_size == size for path in by_digest[digest])

          runner = by_digest[os.environ['RUNNER_SHA256']][0]
          bootstrap = Path(os.environ['BOOTSTRAP'])
          (bootstrap / 'runner.sh').write_bytes(runner.read_bytes())
          source_gzip = by_digest[os.environ['SOURCE_RUNNER_GZIP_SHA256']][0]
          (bootstrap / 'runner.source.sh.gz').write_bytes(source_gzip.read_bytes())
          patch = by_digest[os.environ['PATCH_SHA256']][0]
          (bootstrap / 'runner.patch').write_bytes(patch.read_bytes())

          text = runner.read_text()
          blocks = re.findall(r"python3 - <<'PY'\n(.*?)\nPY", text, re.S)
          assert len(blocks) == 3
          for index, block in enumerate(blocks, 1):
              compile(block, f'<selector-v5-retained-{index}>', 'exec')

          receipt = {
              'version': 1,
              'status': 'cycle-011-rastel-selector-v4-truncated-patch-digest-failure-bound-v1',
              'source': {
                  'pr': int(os.environ['V4_PR']), 'head': os.environ['V4_HEAD'],
                  'run': int(os.environ['V4_RUN']), 'job': int(os.environ['V4_JOB']),
                  'artifact': int(os.environ['V4_ARTIFACT']), 'artifact_sha256': os.environ['V4_ARTIFACT_SHA256'],
                  'workflow_blob': os.environ['V4_WORKFLOW_BLOB'], 'workflow_sha256': os.environ['V4_WORKFLOW_SHA256'],
              },
              'failure': {
                  'expected_patch_sha256': bad, 'expected_length': len(bad),
                  'actual_patch_sha256': good, 'actual_length': len(good),
                  'selector_runner_executed': False,
              },
              'repair': {'correct_exact_digest': True, 'selector_runner_changed': False},
              'repository_write': False, 'candidate_authority_created': False,
              'cycle_receipt_written': False, 'cycle_012_authorization': False,
          }
          receipt['identity'] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          (carrier / 'receipt/v4-failure.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')

          # Recover the exact candidate-custody environment from V4 and defer it to the next step.
          lines = workflow.splitlines()
          start = next(index for index, line in enumerate(lines) if line == '    env:')
          end = next(index for index in range(start + 1, len(lines)) if lines[index] == '    steps:')
          rows = []
          for line in lines[start + 1:end]:
              match = re.fullmatch(r'      ([A-Z][A-Z0-9_]*):\s*(.*)', line)
              if not match:
                  continue
              key, raw = match.groups()
              if key == 'GH_TOKEN':
                  continue
              value = raw.strip()
              if value.startswith('"') and value.endswith('"'):
                  value = json.loads(value)
              assert '\n' not in value and '\r' not in value
              rows.append((key, value))
          required = {'V1_PR','V2_PR','V3A1_PR','V10_PR','V8_PR','V9_PR','RUNNER_SHA256'}
          assert required.issubset({key for key, _ in rows})
          env_path = bootstrap / 'source.env'
          env_path.write_text(''.join(f'{key}={value}\n' for key, value in rows))
          PY
          bash -n "$BOOTSTRAP/runner.sh"
          cat "$BOOTSTRAP/source.env" >> "$GITHUB_ENV"
          {
            printf 'BRANCH=%s\n' "$BRANCH"
            printf 'SELF=%s\n' "$SELF"
            printf 'SOURCE=%s\n' "$SOURCE"
            printf 'OUT=%s\n' "$OUT"
            printf 'CARRIER=%s\n' "$CARRIER"
            printf 'BOOTSTRAP=%s\n' "$BOOTSTRAP"
          } >> "$GITHUB_ENV"
          printf 'CURRENT_HEAD=%s\nCURRENT_PR=%s\nCURRENT_BASE=%s\n' "$head" "$pr" "$base" >> "$GITHUB_ENV"

      - name: Execute unchanged complete three-candidate selector
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < "$BOOTSTRAP/runner.sh" | tr -d ' ')" = "$RUNNER_BYTES"
          test "$(sha256sum "$BOOTSTRAP/runner.sh" | awk '{print $1}')" = "$RUNNER_SHA256"
          chmod 700 "$BOOTSTRAP/runner.sh"
          exec "$BOOTSTRAP/runner.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v5-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-who-cycle-011-rastel-candidate-selector-v5-diagnostics-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-source/api
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-source/v1
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-source/v2
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-carrier
            /tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-bootstrap
            !/tmp/doctor-who-cycle-011-rastel-candidate-selector-v5-source/*.zip
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
